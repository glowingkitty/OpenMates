# .github/workflows/dependency-security.yml
#
# Scans resolved npm and Python dependency graphs plus container configuration.
# This deterministic scheduled gate complements immediate Dependabot security
# PRs and fails visibly when a known high or critical vulnerability is present.

name: Dependency Security

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  pull_request:
    branches: [dev]
    paths:
      - "**/package.json"
      - "**/requirements*.txt"
      - "**/Dockerfile*"
      - "**/docker-compose*.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen npm graph
        run: pnpm install --frozen-lockfile
      - name: Audit resolved npm graph
        run: pnpm audit --audit-level high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit every Python requirements graph
        run: |
          git ls-files -z '*requirements*.txt' | while IFS= read -r -d '' requirements; do
            echo "Auditing ${requirements}"
            python -m pip_audit --progress-spinner=off --requirement "${requirements}"
          done

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
