# .github/workflows/vitest.yml
#
# Runs Vitest unit tests for frontend packages.
# Covers store logic, utilities, encryption, message parsing, and status page tests.
#
# Triggers:
# - Push to dev branch (path-filtered)
# - Pull requests targeting dev (path-filtered)
# - workflow_dispatch (called by scripts/run_tests.py orchestrator)
#
# Architecture: docs/architecture/github-actions-ci.md

name: "Vitest: Unit Tests"

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "!frontend/apps/web_app/tests/**"
  pull_request:
    branches: [dev]
    paths:
      - "frontend/**"
      - "!frontend/apps/web_app/tests/**"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Exact commit selected by the engineering test orchestrator"
        required: false
        default: "dev"
      test_files_json:
        description: "Optional JSON array of exact Vitest files for campaign verification"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.head_ref || github.ref_name || 'dev' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run UI package tests
        id: ui_tests
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_FILES_JSON: ${{ inputs.test_files_json || '' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-results
          cd frontend/packages/ui
          mapfile -t TEST_FILES < <(python3 -c 'import json, os; values=json.loads(os.environ.get("TEST_FILES_JSON") or "[]"); marker="frontend/packages/ui/"; print("\n".join(v.split(marker,1)[1] for v in values if marker in v), end="")')
          if [ -n "$TEST_FILES_JSON" ] && [ ${#TEST_FILES[@]} -eq 0 ]; then echo '{"success":true,"testResults":[],"numTotalTests":0,"numFailedTests":0,"numFailedTestSuites":0}' > $GITHUB_WORKSPACE/test-results/vitest-ui.json; exit 0; fi
          set +e
          npx vitest run --reporter=json \
            --testTimeout 30000 \
            --exclude 'src/services/encryption/**' \
            "${TEST_FILES[@]}" \
            2>&1 | tee $GITHUB_WORKSPACE/test-results/vitest-ui.json
          VITEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ ! -s $GITHUB_WORKSPACE/test-results/vitest-ui.json ]; then
            echo '{"success":true,"testResults":[],"numTotalTests":0,"numFailedTests":0,"numFailedTestSuites":0}' > $GITHUB_WORKSPACE/test-results/vitest-ui.json
          fi
          if [ $VITEST_EXIT -ne 0 ]; then exit $VITEST_EXIT; fi
      - name: Run web app unit tests
        id: webapp_tests
        continue-on-error: true
        timeout-minutes: 5
        env:
          TEST_FILES_JSON: ${{ inputs.test_files_json || '' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-results
          cd frontend/apps/web_app
          mapfile -t TEST_FILES < <(python3 -c 'import json, os; values=json.loads(os.environ.get("TEST_FILES_JSON") or "[]"); marker="frontend/apps/web_app/"; print("\n".join(v.split(marker,1)[1] for v in values if marker in v), end="")')
          if [ -n "$TEST_FILES_JSON" ] && [ ${#TEST_FILES[@]} -eq 0 ]; then echo '{"success":true,"testResults":[],"numTotalTests":0,"numFailedTests":0,"numFailedTestSuites":0}' > $GITHUB_WORKSPACE/test-results/vitest-webapp.json; exit 0; fi
          pnpm exec svelte-kit sync
          set +e
          npx vitest run --reporter=json \
            "${TEST_FILES[@]}" \
            2>&1 | tee $GITHUB_WORKSPACE/test-results/vitest-webapp.json
          VITEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ ! -s $GITHUB_WORKSPACE/test-results/vitest-webapp.json ]; then
            echo '{"success":true,"testResults":[],"numTotalTests":0,"numFailedTests":0,"numFailedTestSuites":0}' > $GITHUB_WORKSPACE/test-results/vitest-webapp.json
          fi
          if [ $VITEST_EXIT -ne 0 ]; then exit $VITEST_EXIT; fi
      - name: Run CLI account import SDK tests
        if: ${{ inputs.test_files_json == '' }}
        id: cli_account_import_tests
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/test-results
          cd frontend/packages/openmates-cli
          node --test --experimental-strip-types --loader ./tests/loader.mjs tests/account-import.test.ts tests/account-import-sdk.test.ts \
            2>&1 | tee $GITHUB_WORKSPACE/test-results/cli-account-import-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: always()
        env:
          TEST_FILES_JSON: ${{ inputs.test_files_json || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          result_dir = pathlib.Path("test-results")
          failures: list[str] = []

          def load_vitest_result(path: pathlib.Path) -> dict:
            if not path.exists():
              failures.append(f"missing {path}")
              return {}
            for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
              if line.startswith("{"):
                try:
                  return json.loads(line)
                except json.JSONDecodeError as exc:
                  failures.append(f"invalid JSON in {path}: {exc}")
                  return {}
            failures.append(f"missing JSON payload in {path}")
            return {}

          def check_vitest_file(path: pathlib.Path, label: str) -> None:
            payload = load_vitest_result(path)
            if not payload:
              return
            failed_tests = int(payload.get("numFailedTests") or 0)
            failed_suites = int(payload.get("numFailedTestSuites") or 0)
            if payload.get("success") is not True or failed_tests or failed_suites:
              failures.append(
                f"{label} failed: success={payload.get('success')} "
                f"failed_tests={failed_tests} failed_suites={failed_suites}",
              )

          check_vitest_file(result_dir / "vitest-ui.json", "UI package tests")
          check_vitest_file(result_dir / "vitest-webapp.json", "web app unit tests")

          if not os.environ.get("TEST_FILES_JSON"):
            cli_output = result_dir / "cli-account-import-tests.txt"
            if not cli_output.exists():
              failures.append(f"missing {cli_output}")
            else:
              text = cli_output.read_text(encoding="utf-8", errors="replace")
              if not re.search(r"(?:^|\n).*\bfail 0(?:\n|$)", text):
                failures.append("CLI account import tests did not report 'fail 0'")

          if failures:
            print("Vitest result validation failed:")
            for failure in failures:
              print(f"- {failure}")
            sys.exit(1)

          print("All Vitest result artifacts passed.")
          PY
