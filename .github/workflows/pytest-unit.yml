# .github/workflows/pytest-unit.yml
#
# Runs pytest unit tests for the backend (excluding integration, slow, vault, benchmark).
# Covers status aggregation, URL normalization, text sanitization, and other pure-logic tests.
#
# Triggers:
# - Push to dev branch (path-filtered)
# - Pull requests targeting dev (path-filtered)
# - workflow_dispatch (called by scripts/run_tests.py orchestrator)
#
# Architecture: docs/architecture/github-actions-ci.md

name: "Pytest: Unit Tests"

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "packages/openmates-python/**"
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - "packages/openmates-python/**"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Exact commit selected by the engineering test orchestrator"
        required: false
        default: "dev"
      test_targets_json:
        description: "Optional JSON array of exact pytest node IDs for campaign verification"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.head_ref || github.ref_name || 'dev' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/core/api/requirements.txt
            packages/openmates-python/pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/core/api/requirements.txt 2>/dev/null || true
          pip install -e packages/openmates-python
      - name: Run unit tests
        id: pytest_run
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_TARGETS_JSON: ${{ inputs.test_targets_json || '' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-results
          cd backend
          mapfile -t PYTEST_TARGETS < <(python3 -c 'import json, os; values=json.loads(os.environ.get("TEST_TARGETS_JSON") or "[]"); print("\n".join(v.removeprefix("backend/") for v in values), end="")')
          if [ ${#PYTEST_TARGETS[@]} -eq 0 ]; then PYTEST_TARGETS=(tests/); fi
          set +e
          pytest "${PYTEST_TARGETS[@]}" \
            -m "not integration and not slow and not vault and not benchmark and not provider_contract" \
            -v --tb=short --color=no \
            --ignore=tests/fixtures \
            --ignore=tests/provider_contracts \
            --ignore=tests/test_encryption_service.py \
            --ignore=tests/test_integration_encryption.py \
            --ignore=tests/test_status_service_v2.py \
            --continue-on-collection-errors \
            --json-report --json-report-file=$GITHUB_WORKSPACE/test-results/pytest-results.json \
            2>&1 | tee $GITHUB_WORKSPACE/test-results/pytest-output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $PYTEST_EXIT -ne 0 ]; then exit $PYTEST_EXIT; fi
      - name: Run Python SDK account import tests
        if: ${{ inputs.test_targets_json == '' }}
        id: python_sdk_account_import_tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/test-results
          python3 -m pytest packages/openmates-python/tests/test_account_import.py packages/openmates-python/tests/test_account_export.py \
            -v --tb=short --color=no \
            --json-report --json-report-file=$GITHUB_WORKSPACE/test-results/pytest-python-sdk-account-import-results.json \
            2>&1 | tee $GITHUB_WORKSPACE/test-results/pytest-python-sdk-account-import-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: steps.pytest_run.outcome == 'failure' || steps.python_sdk_account_import_tests.outcome == 'failure'
        run: exit 1
