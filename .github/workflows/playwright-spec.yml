# .github/workflows/playwright-spec.yml
#
# Runs a single Playwright E2E spec file.
# Designed to be triggered in parallel — one workflow run per spec.
#
# Triggers:
# - workflow_dispatch with spec name and account number
# - Called by scripts/ci/trigger_parallel_specs.sh
#
# Architecture: docs/architecture/github-actions-ci.md

name: "Playwright: Single Spec"
run-name: "Playwright: ${{ inputs.spec }} ${{ inputs.requires_account && format('account {0}', inputs.account) || 'account-free' }} ${{ inputs.dispatch_token }}"

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file name (e.g. chat-flow.spec.ts)"
        required: true
        type: string
      account:
        description: "Test account number (1-27)"
        required: true
        type: string
        default: "1"
      requires_account:
        description: "Whether this spec may receive configured test-account credentials."
        type: boolean
        default: true
      record_fixtures:
        description: "Record LLM fixtures instead of replaying mocks"
        type: boolean
        default: false
      use_mocks:
        description: "Use mock LLM responses (requires recorded fixtures)"
        type: boolean
        default: true
      record_live_fixtures:
        description: "Record live provider fixtures instead of replaying cached provider mocks"
        type: boolean
        default: false
      use_live_mocks:
        description: "Use cached live provider mocks for specs that call withLiveMockMarker()"
        type: boolean
        default: true
      create_account_slot:
        description: "Account slot for account-creation utilities. Reserved auth provisioning uses 14-20."
        type: string
        default: ""
      dispatch_token:
        description: "Unique token from scripts/run_tests.py used to identify this dispatch."
        type: string
        default: ""
      daily_ai_run_id:
        description: "Content-free shared budget identity for the two daily AI canaries."
        type: string
        default: ""
      seeded_gift_card_code:
        description: "Disposable dev-only gift-card code seeded by scripts/run_tests.py for real redemption specs."
        type: string
        default: ""
      checkout_ref:
        description: "Commit SHA selected by scripts/run_tests.py."
        required: true
        type: string
        default: "dev"
      allow_credential_updates:
        description: "Allow credential-mutating utility specs to update repository secrets."
        type: boolean
        default: true
      proof_video_profile:
        description: "Optional exact proof-video capture profile; supports web-laptop and web-phone."
        type: string
        default: ""
      migrate_account_secrets_to_expanded_bundle:
        description: "Move the selected expanded account credentials into the consolidated encrypted secret."
        type: boolean
        default: false
  workflow_call:
    inputs:
      spec:
        required: true
        type: string
      account:
        required: true
        type: string
      requires_account:
        required: false
        type: boolean
        default: true
      record_fixtures:
        required: false
        type: boolean
        default: false
      use_mocks:
        required: false
        type: boolean
        default: true
      record_live_fixtures:
        required: false
        type: boolean
        default: false
      use_live_mocks:
        required: false
        type: boolean
        default: true
      create_account_slot:
        required: false
        type: string
        default: ""
      dispatch_token:
        required: false
        type: string
        default: ""
      seeded_gift_card_code:
        required: false
        type: string
        default: ""
      checkout_ref:
        required: true
        type: string
      allow_credential_updates:
        required: false
        type: boolean
        default: false
      proof_video_profile:
        required: false
        type: string
        default: ""
      migrate_account_secrets_to_expanded_bundle:
        required: false
        type: boolean
        default: false
    secrets:
      E2E_DEV_API_URL: {required: true}
      E2E_DEV_TEST_BASE_URL: {required: true}
      OPENMATES_TEST_ACCOUNT_API_KEY: {required: false}
      OPENMATES_TEST_ACCOUNTS_EXPANDED_JSON: {required: false}
      TEST_ACCOUNT_EMAIL: {required: false}
      TEST_ACCOUNT_PASSWORD: {required: false}
      TEST_ACCOUNT_OTP_KEY: {required: false}
      SIGNUP_TEST_EMAIL_DOMAINS: {required: false}
      E2E_SIGNUP_INVITE_CODE: {required: false}
      GMAIL_CLIENT_ID: {required: false}
      GMAIL_CLIENT_SECRET: {required: false}
      GMAIL_REFRESH_TOKEN: {required: false}
      GMAIL_TEST_ADDRESS: {required: false}
      GOOGLE_CALENDAR_TEST_EMAIL: {required: false}
      GOOGLE_CALENDAR_TEST_PASSWORD: {required: false}
      GOOGLE_CALENDAR_TEST_TOTP_KEY: {required: false}
      GOOGLE_TEST_EMAIL: {required: false}
      GOOGLE_TEST_PASSWORD: {required: false}
      GOOGLE_TEST_TOTP_KEY: {required: false}
      PROTON_BRIDGE_TEST_EMAIL: {required: false}
      PROTON_BRIDGE_TEST_PASSWORD: {required: false}
      PROTON_BRIDGE_TEST_TOTP_KEY: {required: false}
      GH_SECRETS_TOKEN: {required: false}

concurrency:
  group: ${{ !inputs.requires_account && format('playwright-account-free-{0}', inputs.spec) || (inputs.migrate_account_secrets_to_expanded_bundle || inputs.create_account_slot != '') && 'playwright-account-secret-writes' || format('playwright-account-{0}', inputs.account) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject retired shared-dev test execution
        run: |
          echo '::error::Shared-dev Playwright execution is retired. Submit through scripts/tests.py run --spec <spec> and the isolated GitHub CI coordinator. No shared-dev or self-hosted-runner fallback is permitted.'
          exit 1
