name: Daily live dev signup email smoke

# Explicit live-service health layer; ordinary product checks stay isolated.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/signup-email-live-smoke.yml'
      - 'scripts/signup_email_live_smoke.py'
      - 'scripts/tests/test_signup_email_live_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-live-dev-signup-email
  cancel-in-progress: false

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused tooling checks
        run: python3 -m unittest discover -s scripts/tests -p test_signup_email_live_smoke.py
  live-email:
    needs: tooling
    if: github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: UTC daily send identity
        id: day
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: reservation
        with:
          path: .live-email-reservation
          key: live-signup-email-v1-${{ steps.day.outputs.value }}
      - name: Prevent retries from sending again
        if: steps.reservation.outputs.cache-hit == 'true'
        run: |
          echo '::error::A live signup-email attempt was already reserved today. Inspect its report; do not send again.'
          exit 1
      - name: Reserve before any live request
        run: |
          mkdir .live-email-reservation
          echo reserved > .live-email-reservation/reserved
      - uses: actions/cache/save@v4
        with:
          path: .live-email-reservation
          key: live-signup-email-v1-${{ steps.day.outputs.value }}
      - name: Verify live dev queue, provider and inbox
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_TEST_ADDRESS: ${{ secrets.GMAIL_TEST_ADDRESS }}
          E2E_SIGNUP_INVITE_CODE: ${{ secrets.E2E_SIGNUP_INVITE_CODE }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMOKE_DAY: ${{ steps.day.outputs.value }}
        run: >-
          python3 scripts/signup_email_live_smoke.py
          --run-id "$SMOKE_DAY"
          --receipt "$RUNNER_TEMP/signup-email-send.receipt"
          --report logs/nightly-reports/signup-email-live-smoke.json
      - name: Publish redacted stage report
        if: always()
        run: |
          if test -f logs/nightly-reports/signup-email-live-smoke.json; then
            cat logs/nightly-reports/signup-email-live-smoke.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Live probe did not run; inspect the failed prerequisite. No passing evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signup-email-live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/nightly-reports/signup-email-live-smoke.json
          retention-days: 7
          if-no-files-found: warn
