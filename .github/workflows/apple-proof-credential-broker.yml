name: Apple Proof Credential Broker
run-name: Apple proof credential broker ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact current dev commit containing the approved recipient certificate
        required: true
        type: string
      slot:
        description: Reserved Apple proof account slot
        required: true
        type: choice
        options: ['14', '15', '16', '17', '18', '19', '20']
      request_id:
        description: Opaque request identifier used only for run and artifact correlation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-proof-credential-broker-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted request
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{16}$ ]]
          [[ "$SLOT" =~ ^(14|15|16|17|18|19|20)$ ]]
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
          test "$(git rev-parse origin/dev)" = "$CHECKOUT_REF"
          openssl x509 -in deployment/apple-proof-broker-recipient.pem -noout -checkend 86400

      - name: Encrypt reserved credentials to the registered Mac
        env:
          ACCOUNT_EMAIL: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_EMAIL', inputs.slot)] }}
          ACCOUNT_PASSWORD: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_PASSWORD', inputs.slot)] }}
          ACCOUNT_OTP_KEY: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_OTP_KEY', inputs.slot)] }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p broker-output
          python3 - <<'PY' | openssl cms -encrypt -binary -aes256 \
            -in /dev/stdin \
            -outform DER \
            -out broker-output/credentials.cms \
            deployment/apple-proof-broker-recipient.pem
          import os
          import sys

          slot = os.environ["SLOT"]
          values = {
              f"OPENMATES_TEST_ACCOUNT_{slot}_EMAIL": os.environ.get("ACCOUNT_EMAIL", ""),
              f"OPENMATES_TEST_ACCOUNT_{slot}_PASSWORD": os.environ.get("ACCOUNT_PASSWORD", ""),
              f"OPENMATES_TEST_ACCOUNT_{slot}_OTP_KEY": os.environ.get("ACCOUNT_OTP_KEY", ""),
          }
          if any(not value or "\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("Reserved Apple proof account is incomplete")
          payload = "".join(f"{key}={value}\n" for key, value in values.items())
          sys.stdout.buffer.write(payload.encode("utf-8"))
          PY
          test -s broker-output/credentials.cms

      - name: Upload encrypted credential envelope
        uses: actions/upload-artifact@v4
        with:
          name: apple-proof-credentials-${{ inputs.request_id }}
          path: broker-output/credentials.cms
          if-no-files-found: error
          retention-days: 1
