name: Publish GitHub Release

on:
  workflow_run:
    workflows:
      - Publish CLI
      - Publish Python SDK
      - Publish Self-Host Images
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit whose artifacts should be verified and released
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: publish-github-release-${{ github.event.workflow_run.head_sha || inputs.commit }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify artifacts and publish release
        run: >-
          python3 scripts/publish_stable_github_release.py
          --repo "${GITHUB_REPOSITORY}"
          --commit "${TARGET_SHA}"
          --apply
