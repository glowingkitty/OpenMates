name: Production web app startup

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Production app root or immutable web app deployment URL
        required: true
        default: https://app.openmates.org
        type: string
      expected_version:
        description: Exact reviewed build version
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-startup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       (startsWith(github.event.deployment_status.environment_url, 'https://open-mates-webapp-') ||
        github.event.deployment_status.environment_url == 'https://app.openmates.org'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable build identities without Git metadata
        run: node --test frontend/apps/web_app/scripts/build-version.test.mjs
      - name: Install browser check dependencies
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Open the exact production deployment in a real browser
        env:
          CHECK_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
          CHECK_VERSION: ${{ inputs.expected_version || github.event.deployment.sha }}
        run: |
          python scripts/verify_production_webapp.py \
            --url "$CHECK_URL" --expected-version "$CHECK_VERSION" \
            --out test-results/production-webapp-startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-webapp-startup-${{ github.run_id }}
          path: test-results/production-webapp-startup/
          if-no-files-found: error
          retention-days: 7
