        run: |
          if [ "$CI_TEST_MODE:$CI_SPECS_JSON" = 'e2e:["web-essential-startup-performance.spec.ts"]' ]; then
            /usr/bin/python3 -I - "${{ inputs.harness_commit || github.sha }}" <<'PAIRED_TOOLING'
          import hashlib,os,re,stat,subprocess,sys
          from pathlib import Path
          
          def require(value, code="paired_profile_refused"):
              if not value:
                  raise ValueError(code)
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          def read_regular(path, limit):
              if path.resolve() != path:
                  raise ValueError("unsafe_path")
              with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), "rb") as stream:
                  before = os.fstat(stream.fileno())
                  if (not stat.S_ISREG(before.st_mode) or before.st_size > limit
                          or before.st_mode & 0o002 or before.st_uid not in (0, os.getuid())):
                      raise ValueError("unsafe_file")
                  data = stream.read(limit + 1)
                  after = os.fstat(stream.fileno())
                  # Deliberately exclude atime, which our own reads may change.
                  def identity(s):
                      return (s.st_dev, s.st_ino, s.st_mode, s.st_size,
                              s.st_uid, s.st_gid, s.st_nlink, s.st_mtime_ns, s.st_ctime_ns)
                  if len(data) > limit or identity(before) != identity(after) or identity(after) != identity(path.lstat()):
                      raise ValueError("changed_file")
                  return data
          
          def tooling_snapshot(harness):
              """Closed helper bytes must be the actual independently published harness.
          
              The workflow also checks them before this module's first import with a fresh
              Python bytecode cache. This is a held-file check, not a same-UID sandbox.
              """
              require(re.fullmatch(r"[a-f0-9]{40}", harness), "paired_harness_identity")
              tooling = Path("../tooling").resolve()
              clean = {
                  "PATH": os.defpath,
                  "LANG": "C.UTF-8",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
              }
              actual = (
                  subprocess.check_output(
                      ["/usr/bin/git", "--no-replace-objects", "rev-parse", "HEAD"],
                      cwd=tooling,
                      env=clean,
                      timeout=30,
                  )
                  .decode()
                  .strip()
              )
              require(actual == harness, "paired_harness_identity")
              tree = subprocess.check_output(
                  [
                      "/usr/bin/git",
                      "--no-replace-objects",
                      "ls-tree",
                      "-r",
                      "-z",
                      harness,
                      "scripts",
                  ],
                  cwd=tooling,
                  env=clean,
                  timeout=30,
              )
              require(len(tree) <= 4 * 1024**2, "paired_tooling_tree_limit")
              expected = {}
              for row in tree.split(b"\0"):
                  if not row:
                      continue
                  header, raw_name = row.split(b"\t", 1)
                  mode, kind, oid = header.decode().split(" ")
                  name = raw_name.decode("utf-8")
                  if name.endswith(".py"):
                      require(
                          mode in {"100644", "100755"}
                          and kind == "blob"
                          and re.fullmatch(r"[a-f0-9]{40}", oid)
                          and re.fullmatch(r"scripts/[A-Za-z0-9_./-]+\.py", name)
                          and ".." not in Path(name).parts
                      )
                      expected[name] = oid
              require(1 <= len(expected) <= 4096, "paired_tooling_tree_limit")
              found = set()
              for directory, dirs, files in os.walk(tooling / "scripts", followlinks=False):
                  require(
                      all(not (Path(directory) / name).is_symlink() for name in dirs),
                      "paired_tooling_shadow",
                  )
                  dirs[:] = [
                      name for name in dirs if name != "__pycache__"
                  ]  # fresh isolated cache is used by workflow
                  for name in files:
                      file = Path(directory) / name
                      require(
                          not file.name.endswith((".pyc", ".pyo", ".so", ".pyd")),
                          "paired_tooling_shadow",
                      )
                      if name.endswith(".py"):
                          found.add(file.relative_to(tooling).as_posix())
              require(found == set(expected), "paired_tooling_shadow")
              rows, total = {}, 0
              for name, oid in sorted(expected.items()):
                  raw = read_regular(tooling / name, 4 * 1024**2)
                  total += len(raw)
                  require(
                      total <= 64 * 1024**2
                      and hashlib.sha1(
                          b"blob " + str(len(raw)).encode() + b"\0" + raw
                      ).hexdigest()
                      == oid,
                      "paired_tooling_changed",
                  )
                  rows[name] = digest(raw)
              return rows
          
          tooling_snapshot(sys.argv[1])
          PAIRED_TOOLING
            env -u PYTHONHOME -u PYTHONSTARTUP -u PYTHONINSPECT PYTHONPATH="$PWD/../tooling/scripts" PYTHONPYCACHEPREFIX="$(mktemp -d)" /usr/bin/python3 ../tooling/scripts/ci_run_tests.py
          else
            python3 ../tooling/scripts/ci_run_tests.py
          fi
      - name: Explain failed Rust lane in the job log
        if: >-
          failure() &&
          (inputs.mode == 'sdk-conformance' || inputs.mode == 'sdk-lockfiles' ||
           inputs.mode == 'rust-wasm' || inputs.mode == 'rust-native-dev' ||
           env.CI_LANE_RUST_BROWSER == 'true' || env.CI_NATIVE_PREPARED == 'true')
        run: python3 ../tooling/scripts/ci_rust_checks.py explain --root .
      - name: Stop runner-private Codex daemon
        if: always() && (inputs.mode == 'codex' || (inputs.mode == 'e2e' && (contains(inputs.specs_json, 'tasks-flow.spec.ts') || contains(inputs.specs_json, 'project-task-sync.spec.ts'))))
        run: node ../tooling/scripts/ci_codex_fixture.mjs stop
      - name: Collect bounded stack diagnostics
        if: always() && (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke' || inputs.mode == 'backend-probe')
        run: python3 ../tooling/scripts/ci_environment.py logs
      - name: Remove disposable containers and databases
        if: always() && (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke' || inputs.mode == 'backend-probe')
        run: python3 ../tooling/scripts/ci_environment.py stop
      - name: Remove attested runner Node only when identities still match
        if: always() && env.OPENMATES_CI_NODE_STATE != ''
        run: env -u NODE_OPTIONS -u NODE_PATH "$OPENMATES_CI_NODE" ../tooling/scripts/ci_stage_node_runtime.mjs cleanup
      - name: Project finite native preparation diagnostic
        id: native-preparation-diagnostic
        if: always() && inputs.mode == 'prepare' && env.CI_NATIVE_PREPARED == 'true'
        run: >-
          python3 ../tooling/scripts/ci_artifacts.py native-diagnostic
          --source "$BUILD_COMMIT_SHA"
          --candidate-tree "$CI_CANDIDATE_TREE"
          --harness-commit "$CI_HARNESS_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-test-results
          retention-days: 7
          path: |
            subject/test-results/ci-environment.json
            subject/test-results/ci-startup-phases.json
            subject/test-results/ci-artifacts.json
            ${{ steps.native-preparation-diagnostic.outputs.path }}
            subject/test-results/ci-web-production-inventory.json
            subject/test-results/ci-web-performance-binding.json
            subject/test-results/ci-runtime-images.json
            subject/test-results/ci-results.json
            subject/test-results/ci-node-runtime.json
            tooling/node-runtime-diagnostics/*.json
            subject/test-results/ci-storage-archive-probe.json
            subject/test-results/ci-capacity-startup.json
            subject/test-results/ci-stack.log
            subject/test-results/ci-stack-spec-*.log
            subject/test-results/ci-codex.json
            subject/test-results/ci-cleanup.json
            subject/test-results/ci-selfhost-steps.json
            subject/test-results/cargo-install-smoke.json
            subject/test-results/ci-selfhost-scope.json
            subject/test-results/ci-selfhost-update-progress.json
            subject/test-results/selfhost-chat-readiness-source-volume-absent.json
            subject/test-results/selfhost-chat-readiness-image-volume-absent.json
            subject/test-results/selfhost-chat-readiness-source-fresh.json
            subject/test-results/selfhost-chat-readiness-source-restart.json
            subject/test-results/selfhost-chat-readiness-image-fresh.json
            subject/test-results/selfhost-chat-readiness-image-restart.json
            subject/test-results/selfhost-chat-readiness-preserve-0-before.json
            subject/test-results/selfhost-chat-readiness-preserve-0-restart.json
            subject/test-results/selfhost-chat-readiness-preserve-0-update.json
            subject/test-results/selfhost-chat-readiness-preserve-1-before.json
            subject/test-results/selfhost-chat-readiness-preserve-1-restart.json
            subject/test-results/selfhost-chat-readiness-preserve-1-update.json
            subject/test-results/selfhost-chat-readiness-restored-ready.json
            subject/test-results/ci-sdk-conformance.json
            subject/test-results/ci-sdk-lockfiles.json
            subject/test-results/ci-rust-wasm.json
            subject/test-results/ci-native-dev.json
            subject/test-results/rust-check/
            subject/test-results/rust-wasm/openmates_browser_bindings.wasm
            subject/test-results/rust-wasm/package-manifest.json
            subject/test-results/rust-wasm/package/openmates_browser.js
            subject/test-results/rust-wasm/package/openmates_browser_bg.wasm
            subject/test-results/rust-wasm/package/openmates_browser.d.ts
            subject/test-results/rust-wasm/package/openmates_browser_bg.wasm.d.ts
            subject/test-results/rust-wasm/package/snippets/openmates-browser-bindings-????????????????/inline0.js
            subject/test-results/rust-wasm/package/snippets/openmates-sdk-????????????????/inline0.js
            subject/test-results/rust-wasm/package/snippets/openmates-sdk-????????????????/src/platform/browser_metadata_native.js
            subject/test-results/sdk-lockfiles/Cargo.lock
            subject/test-results/ci-spec-*.json
            subject/test-results/ci-pytest.json
            subject/test-results/ci-unit-*
            subject/test-results/ci-visual-smoke/
            subject/test-results/ci-web.log
            subject/frontend/apps/web_app/test-results/
          if-no-files-found: error
      - name: Retain bounded failed Rust WASM stage privately
        if: always() && (inputs.mode == 'rust-wasm' || (env.CI_LANE_RUST_BROWSER == 'true'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-rust-wasm-private-diagnostics
          retention-days: 7
          path: |
            subject/test-results/ci-rust-wasm-private/cargo-tail.log
            subject/test-results/ci-rust-wasm-private/identity.json
          if-no-files-found: ignore
      - name: Retain backend diagnostic raw process output privately
        if: always() && inputs.mode == 'backend-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-backend-probe-private-diagnostics
          retention-days: 7
          path: subject/test-results/ci-backend-probe-private/
          if-no-files-found: ignore
      - name: Retain exact private storage diagnostics after credential cleanup
        if: always() && (contains(inputs.specs_json, 'storage-capacity-') || contains(inputs.specs_json, 'storage-accountability-integration.spec.ts'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-storage-private-diagnostics
          retention-days: 7
          path: |
            subject/test-results/ci-capacity-private/capacity-failure-rows.jsonl
            subject/test-results/ci-capacity-calibration-private/receipt.json
            subject/test-results/ci-storage-capacity.json
            subject/test-results/ci-environment.json
            subject/test-results/ci-accountability-private/receipt.retained.json
            subject/test-results/ci-accountability-private/prove.stderr.retained.log
            subject/test-results/ci-accountability-private/cleanup.stderr.retained.log
          if-no-files-found: ignore
      - name: Retain original documentation screenshot output
        if: always() && contains(inputs.specs_json, 'docs-screenshot-generator.spec.ts')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-screenshots
          retention-days: 7
          path: subject/docs/images/user-guide/apps/**/*.jpg
  apple:
    # Apple lanes run on GitHub-hosted arm64 macOS with the Xcode the release Mac uses (26.6);
    # the older 26.2 rejects code that Xcode compiles there (stricter `sending` checks).
    # They use no secrets, accounts or runtime seeds; macOS minutes are free for this public repo.
    # apple-unit and apple-ui share the Xcode steps (every `inputs.mode != 'apple-core'` step).
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'apple-')
    runs-on: macos-26
    timeout-minutes: ${{ inputs.mode != 'apple-core' && 120 || 60 }}
    defaults:
      run:
        working-directory: subject
    env:
      CI_TEST_MODE: ${{ inputs.mode }}
      CI: 'true'
      OPENMATES_CI_ISOLATED: '1'
      OPENMATES_CI_SOURCE_ROOT: ${{ github.workspace }}/subject
      CI_HARNESS_COMMIT: ${{ inputs.harness_commit || github.sha }}
      CI_SPECS_JSON: ${{ inputs.specs_json }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 15
        with:
          ref: ${{ inputs.checkout_ref }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 15
        with:
          ref: ${{ inputs.harness_commit || github.sha }}
          path: tooling
          sparse-checkout: |
            scripts
            .github/workflows
          persist-credentials: false
      - name: Reconstruct and verify exact detached source
        timeout-minutes: 15
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          EXPECTED_TREE: ${{ inputs.candidate_tree }}
          CANDIDATE_OWNER: ${{ inputs.candidate_owner }}
          CANDIDATE_PATCH_SHA256: ${{ inputs.candidate_patch_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.parse, urllib.request

          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected), 'Full source SHA required'
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          patch_url = event.get('inputs', {}).get('candidate_patch_url', '')
          if patch_url:
              print(f'::add-mask::{patch_url}')
          values = [
              os.environ['EXPECTED_TREE'], os.environ['CANDIDATE_OWNER'],
              os.environ['CANDIDATE_PATCH_SHA256'], patch_url,
          ]
          if any(values):
              assert all(values), 'Candidate artifact identity must be complete'
              tree, owner, digest, url = values
              assert re.fullmatch('[0-9a-f]{40}', tree), 'Full candidate tree SHA required'
              assert re.fullmatch('[A-Za-z0-9_-]{1,64}', owner), 'Valid candidate owner required'
              assert re.fullmatch('[0-9a-f]{64}', digest), 'Valid patch SHA-256 required'
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == 'https' and parsed.hostname
              assert parsed.hostname.endswith('.your-objectstorage.com')
              assert not parsed.username and not parsed.password and parsed.query and not parsed.fragment
              patch = urllib.request.urlopen(url, timeout=120).read(100 * 1024**2 + 1)
              assert len(patch) <= 100 * 1024**2, 'Candidate patch exceeds 100 MiB'
              assert hashlib.sha256(patch).hexdigest() == digest, 'Candidate patch digest mismatch'
              open('../candidate.patch', 'wb').write(patch)
              subprocess.run(['git', 'apply', '--binary', '--index', '--check', '../candidate.patch'], check=True)
              subprocess.run(['git', 'apply', '--binary', '--index', '../candidate.patch'], check=True)
              actual_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
              assert actual_tree == tree, 'Candidate tree mismatch'
              parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              timestamp = subprocess.check_output(['git', 'show', '-s', '--format=%cI', parent], text=True).strip()
              commit_env = {
                  **os.environ,
                  'GIT_AUTHOR_NAME': 'OpenMates CI', 'GIT_AUTHOR_EMAIL': 'ci@example.com',
                  'GIT_COMMITTER_NAME': 'OpenMates CI', 'GIT_COMMITTER_EMAIL': 'ci@example.com',
                  'GIT_AUTHOR_DATE': timestamp, 'GIT_COMMITTER_DATE': timestamp,
              }
              rebuilt = subprocess.check_output(
                  ['git', 'commit-tree', tree, '-p', parent],
                  input=f'CI candidate for session {owner}\n', text=True, env=commit_env,
              ).strip()
              assert rebuilt == expected, 'Candidate commit identity mismatch'
              subprocess.run(['git', 'reset', '--hard', expected], check=True)
          else:
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == expected, 'Checked-out source mismatch'
          assert subprocess.run(['git', 'symbolic-ref', '-q', 'HEAD']).returncode == 1, 'Source must remain detached'
          actual_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'CI_CANDIDATE_TREE={actual_tree}\n')
          PY
          echo "BUILD_COMMIT_SHA=$EXPECTED_SOURCE" >> "$GITHUB_ENV"
      - name: Select Xcode and report toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 26.6 missing at $DEVELOPER_DIR"; ls /Applications | grep -i xcode; exit 1; }
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 17" | head -3 || true
      - name: Install Rust toolchain
        if: inputs.mode == 'apple-core'
        timeout-minutes: 15
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios-sim --target aarch64-apple-darwin
          rustc +1.98.1 -vV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.mode == 'apple-core'
        with:
          node-version: '24'
      - name: Install helpers for the SDK interop tests
        if: inputs.mode == 'apple-core'
        timeout-minutes: 10
        run: |
          version="$(node -p "require('./frontend/apps/web_app/package.json').devDependencies.typescript")"
          npm install --prefix "$RUNNER_TEMP/web-decoder-ts" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund "typescript@$version"
          mkdir -p frontend/apps/web_app/node_modules
          ln -sfn "$RUNNER_TEMP/web-decoder-ts/node_modules/typescript" \
            frontend/apps/web_app/node_modules/typescript
          python3 -m pip install --break-system-packages "cryptography>=41" || python3 -m pip install "cryptography>=41"
      - name: Restore Rust dependency cache
        if: inputs.mode == 'apple-core'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            subject/target
            subject/apple/PairOpaqueBridge/target
            subject/.tmp/apple-pair-cargo
          key: apple-core-${{ runner.os }}-${{ hashFiles('subject/Cargo.lock', 'subject/apple/PairOpaqueBridge/Cargo.lock') }}
          restore-keys: apple-core-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.mode != 'apple-core'
        with:
          node-version: '24'
      - name: Install token generator dependencies
        if: inputs.mode != 'apple-core'
        timeout-minutes: 10
        run: |
          # build-tokens.js needs only these packages; the full web workspace install is not required.
          specs="$(node -e "const p=require('./frontend/packages/ui/package.json');const d={...p.dependencies,...p.devDependencies};console.log(['yaml','@lucide/svelte','@meteocons/svg'].map(n=>n+'@'+d[n]).join(' '))")"
          npm install --prefix "$RUNNER_TEMP/token-deps" --no-save --no-package-lock --legacy-peer-deps \
            --ignore-scripts --no-audit --no-fund $specs
          mkdir -p frontend/packages/ui/node_modules/@lucide
          ln -sfn "$RUNNER_TEMP/token-deps/node_modules/yaml" frontend/packages/ui/node_modules/yaml
          ln -sfn "$RUNNER_TEMP/token-deps/node_modules/@lucide/svelte" frontend/packages/ui/node_modules/@lucide/svelte
          ln -sfn "$RUNNER_TEMP/token-deps/node_modules/@meteocons" frontend/packages/ui/node_modules/@meteocons
      - name: Restore pinned Whistle assets
        if: inputs.mode != 'apple-core'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            subject/.runtime/whistle-assets
            subject/.runtime/whistle-inputs
          key: apple-whistle-${{ hashFiles('subject/apple/WhistleBridge/whistle-assets.lock.json') }}
      - name: Restore PairOpaqueBridge Rust state
        if: inputs.mode != 'apple-core'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The Xcode "Build PairOpaqueBridge" phase keeps its own cargo and rustup homes here.
          path: |
            subject/.tmp/apple-pair-cargo
            subject/.tmp/apple-pair-rustup
            subject/apple/PairOpaqueBridge/target
          key: apple-pair-xcode-${{ hashFiles('subject/apple/PairOpaqueBridge/Cargo.lock', 'subject/apple/PairOpaqueBridge/build-apple.sh') }}
      - name: Restore Swift packages
        if: inputs.mode != 'apple-core'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: subject/test-results/${{ inputs.mode }}/SourcePackages
          key: apple-spm-${{ inputs.mode }}-${{ hashFiles('subject/apple/OpenMates.xcodeproj/project.pbxproj', 'subject/apple/LocalModelBridge/catalog.json') }}
          restore-keys: apple-spm-${{ inputs.mode }}-
      - name: Run Apple lane
        timeout-minutes: ${{ inputs.mode != 'apple-core' && 110 || 50 }}
        run: python3 ../tooling/scripts/ci_apple.py
        env:
          PYTHONPATH: ${{ github.workspace }}/tooling/scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-test-results
          retention-days: 7
          path: |
            subject/test-results/ci-results.json
            subject/test-results/apple-core/rows/
            subject/test-results/apple-unit/rows/
            subject/test-results/apple-ui/rows/
            subject/test-results/apple-unit/OpenMatesTests.xcresult
          if-no-files-found: error
      - name: Export UI test screenshots and recordings
        if: always() && inputs.mode == 'apple-ui'
        timeout-minutes: 10
        run: |
          bundle=test-results/apple-ui/OpenMatesUITests.xcresult
          test -d "$bundle" || { echo "::notice::No UI result bundle to export"; exit 0; }
          # Evidence only: an export problem must not change the test verdict.
          xcrun xcresulttool export attachments --path "$bundle" --output-path test-results/apple-ui/attachments \
            || echo "::warning::UI attachment export failed"
          xcrun xcresulttool get test-results summary --path "$bundle" > test-results/apple-ui/summary.json \
            || echo "::warning::UI result summary export failed"
          ls test-results/apple-ui/attachments 2>/dev/null | head -50
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.mode == 'apple-ui'
        with:
          # Separate from isolated-test-results: recordings are large and are evidence, not the verdict.
          name: apple-ui-evidence
          retention-days: 7
          path: |
            subject/test-results/apple-ui/attachments/
            subject/test-results/apple-ui/summary.json
            subject/test-results/apple-ui/OpenMatesUITests.xcresult
          if-no-files-found: warn
