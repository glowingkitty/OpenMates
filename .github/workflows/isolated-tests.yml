                      ).hexdigest()
                      == oid,
                      "paired_tooling_changed",
                  )
                  rows[name] = digest(raw)
              return rows
          
          tooling_snapshot(sys.argv[1])
          PAIRED_TOOLING
              env -u PYTHONHOME -u PYTHONSTARTUP -u PYTHONINSPECT PYTHONPATH="$PWD/../tooling/scripts" PYTHONPYCACHEPREFIX="$(mktemp -d)" /usr/bin/python3 ../tooling/scripts/ci_web_paired_profile.py build ;;
