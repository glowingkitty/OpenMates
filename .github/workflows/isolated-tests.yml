# Disposable application tests, independent of the shared dev server.
# Dispatches come from scripts/ci_coordinator.py and bind an exact source SHA.
# The same runner contract serves candidate and nightly test batches.
name: Isolated application tests
run-name: "Isolated tests ${{ inputs.mode }} ${{ inputs.dispatch_token }}"
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/isolated-tests.yml']
  workflow_dispatch:
    inputs:
      checkout_ref:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      candidate_tree:
        type: string
        default: ''
      candidate_owner:
        type: string
        default: ''
      candidate_patch_sha256:
        type: string
        default: ''
      candidate_patch_url:
        type: string
        default: ''
      specs_json:
        required: true
        type: string
        default: '[]'
      mode:
        type: choice
        options: [prepare, component, e2e, artifact, codex, pytest, vitest, selfhost, visual-smoke]
        default: e2e
      preparation_key:
        description: Exact immutable preparation identity supplied by the coordinator
        type: string
        default: ''
      harness_commit:
        description: Exact CI harness shared by a preparation producer and its consumers
        type: string
        default: ''
      prepared_run_id:
        description: Exact successful producer run; consumers never search by artifact name
        type: string
        default: ''
      preparation_transport:
        description: Private presigned preparation transfer ticket
        type: string
        default: ''
      prepare_cli:
        description: Whether this preparation/consumer requires CLI output
        type: string
        default: 'true'
      prepare_upload:
        description: Whether this preparation/consumer requires the upload runtime
        type: string
        default: 'false'
      dispatch_token:
        required: true
        type: string
      proof_video_profile:
        type: string
        default: ''
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'selfhost' && 90 || 60 }}
    defaults:
      run:
        working-directory: subject
    env:
      CI_TEST_MODE: ${{ inputs.mode }}
      CI: 'true'
      OPENMATES_CI_ISOLATED: '1'
      OPENMATES_CI_SOURCE_ROOT: ${{ github.workspace }}/subject
      CI_HARNESS_COMMIT: ${{ inputs.harness_commit || github.sha }}
      CI_PREPARATION_KEY: ${{ inputs.preparation_key }}
      CI_SPECS_JSON: ${{ inputs.specs_json }}
      PLAYWRIGHT_PROOF_VIDEO_PROFILE: ${{ inputs.proof_video_profile }}
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
      OPENMATES_E2E_API_URL: http://localhost:8000
      OPENMATES_API_URL: http://localhost:8000
      VITE_API_URL: http://localhost:8000
      VITE_UPLOAD_URL: http://localhost:5173
      VITE_ENV: self_hosted
      E2E_USE_MOCKS: '1'
      E2E_USE_LIVE_MOCKS: '1'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.harness_commit || github.sha }}
          path: tooling
          sparse-checkout: scripts
          persist-credentials: false
      - name: Require private preparation transport ticket
        if: >-
          inputs.mode == 'prepare' ||
          ((inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') &&
           inputs.preparation_key != '')
        run: python3 ../tooling/scripts/ci_preparation_transport.py validate
      - name: Reconstruct and verify exact detached source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          EXPECTED_TREE: ${{ inputs.candidate_tree }}
          CANDIDATE_OWNER: ${{ inputs.candidate_owner }}
          CANDIDATE_PATCH_SHA256: ${{ inputs.candidate_patch_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.parse, urllib.request

          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected), 'Full source SHA required'
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          patch_url = event.get('inputs', {}).get('candidate_patch_url', '')
          if patch_url:
              print(f'::add-mask::{patch_url}')
          values = [
              os.environ['EXPECTED_TREE'], os.environ['CANDIDATE_OWNER'],
              os.environ['CANDIDATE_PATCH_SHA256'], patch_url,
          ]
          if any(values):
              assert all(values), 'Candidate artifact identity must be complete'
              tree, owner, digest, url = values
              assert re.fullmatch('[0-9a-f]{40}', tree), 'Full candidate tree SHA required'
              assert re.fullmatch('[A-Za-z0-9_-]{1,64}', owner), 'Valid candidate owner required'
              assert re.fullmatch('[0-9a-f]{64}', digest), 'Valid patch SHA-256 required'
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == 'https' and parsed.hostname
              assert parsed.hostname.endswith('.your-objectstorage.com')
              assert not parsed.username and not parsed.password and parsed.query and not parsed.fragment
              patch = urllib.request.urlopen(url, timeout=120).read(100 * 1024**2 + 1)
              assert len(patch) <= 100 * 1024**2, 'Candidate patch exceeds 100 MiB'
              assert hashlib.sha256(patch).hexdigest() == digest, 'Candidate patch digest mismatch'
              open('../candidate.patch', 'wb').write(patch)
              subprocess.run(['git', 'apply', '--binary', '--index', '--check', '../candidate.patch'], check=True)
              subprocess.run(['git', 'apply', '--binary', '--index', '../candidate.patch'], check=True)
              actual_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
              assert actual_tree == tree, 'Candidate tree mismatch'
              parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              timestamp = subprocess.check_output(['git', 'show', '-s', '--format=%cI', parent], text=True).strip()
              commit_env = {
                  **os.environ,
                  'GIT_AUTHOR_NAME': 'OpenMates CI', 'GIT_AUTHOR_EMAIL': 'ci@example.com',
                  'GIT_COMMITTER_NAME': 'OpenMates CI', 'GIT_COMMITTER_EMAIL': 'ci@example.com',
                  'GIT_AUTHOR_DATE': timestamp, 'GIT_COMMITTER_DATE': timestamp,
              }
              rebuilt = subprocess.check_output(
                  ['git', 'commit-tree', tree, '-p', parent],
                  input=f'CI candidate for session {owner}\n', text=True, env=commit_env,
              ).strip()
              assert rebuilt == expected, 'Candidate commit identity mismatch'
              subprocess.run(['git', 'reset', '--hard', expected], check=True)
          else:
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == expected, 'Checked-out source mismatch'
          assert subprocess.run(['git', 'symbolic-ref', '-q', 'HEAD']).returncode == 1, 'Source must remain detached'
          actual_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'CI_CANDIDATE_TREE={actual_tree}\n')
          PY
          echo "BUILD_COMMIT_SHA=$EXPECTED_SOURCE" >> "$GITHUB_ENV"
          echo '127.0.0.2 api.dev.openmates.org app.dev.openmates.org' | sudo tee -a /etc/hosts
          echo '127.0.0.1 storage.ci.test' | sudo tee -a /etc/hosts
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: subject/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: subject/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: ${{ inputs.mode == 'pytest' && 'pip' || '' }}
          cache-dependency-path: |
            subject/backend/requirements-dev.txt
            subject/backend/core/api/requirements.txt
            subject/packages/openmates-python/pyproject.toml
      - name: Install workspace dependencies
        if: inputs.mode != 'pytest'
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated stack
        id: profile
        if: inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        run: |
          python3 ../tooling/scripts/ci_environment.py prepare
      - name: Verify declared upload capability
        if: >-
          (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') &&
          inputs.preparation_key != ''
        run: test "${{ steps.profile.outputs.uploads }}" = "${{ inputs.prepare_upload }}"
      - name: Log in to GHCR for compatible runtime images
        if: inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact private prepared build
        id: preparation-download
        if: >-
          (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') &&
          inputs.prepared_run_id != '' && inputs.preparation_key != ''
        continue-on-error: true
        run: >-
          python3 ../tooling/scripts/ci_preparation_transport.py download
          --directory test-results/ci-preparation-download
      - name: Verify and restore prepared web and CLI bytes
        id: artifacts
        if: inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        run: |
          python3 ../tooling/scripts/ci_artifacts.py restore \
            --source "$BUILD_COMMIT_SHA" \
            --candidate-tree "$CI_CANDIDATE_TREE" \
            --include-cli "${{ inputs.prepare_cli }}" \
            --include-upload "${{ inputs.prepare_upload }}" \
            --expected-key "${{ inputs.preparation_key }}" \
            --harness-commit "$CI_HARNESS_COMMIT" \
            --input-dir test-results/ci-preparation-download
      - name: Reuse compatible published runtime images
        id: images
        if: inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        run: |
          upload_args=()
          needs_upload="${{ inputs.prepare_upload }}"
          if [ -z "${{ inputs.preparation_key }}" ]; then
            needs_upload="${{ steps.profile.outputs.uploads }}"
          fi
          if [ "$needs_upload" = 'true' ]; then
            upload_args+=(--include-upload)
          fi
          if [ "${{ steps.artifacts.outputs.prepared }}" = 'true' ]; then
            if ! python3 ../tooling/scripts/ci_runtime_images.py restore \
              "${upload_args[@]}" \
              --manifest "${{ steps.artifacts.outputs.manifest }}"; then
              python3 ../tooling/scripts/ci_artifacts.py runtime-fallback \
                --reason runtime_manifest_rejected
              python3 ../tooling/scripts/ci_runtime_images.py restore "${upload_args[@]}"
            fi
          else
            python3 ../tooling/scripts/ci_runtime_images.py restore "${upload_args[@]}"
          fi
      - name: Calculate runtime compatibility keys
        id: runtime_keys
        if: inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        run: |
          for kind in api cms setup schema upload; do
            echo "$kind=$(python3 ../tooling/scripts/ci_runtime_images.py key --kind "$kind")" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@v3
        if: >-
          (inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') &&
          (steps.images.outputs.api != 'true' ||
           steps.images.outputs.cms != 'true' ||
           steps.images.outputs.setup != 'true' ||
           (inputs.mode == 'prepare' && steps.images.outputs.schema != 'true') ||
           (((inputs.preparation_key != '' && inputs.prepare_upload == 'true') ||
             (inputs.preparation_key == '' && steps.profile.outputs.uploads == 'true')) &&
            steps.images.outputs.upload != 'true'))
      - name: Generate UI build inputs once
        if: >-
          inputs.mode == 'prepare' ||
          ((inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') &&
           (steps.artifacts.outputs.web != 'true' || steps.images.outputs.api != 'true'))
        run: pnpm --filter @repo/ui build
      - name: Build cached API dependencies and current source
        if: (inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') && steps.images.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./subject
          file: ./subject/backend/core/api/Dockerfile.selfhost
          load: true
          tags: openmates-ci-api:local
          cache-from: type=gha,scope=ci-api
          cache-to: ${{ inputs.candidate_patch_sha256 == '' && 'type=gha,scope=ci-api,mode=max' || '' }}
          labels: org.openmates.ci.runtime-key=${{ steps.runtime_keys.outputs.api }}
      - name: Build cached upload dependencies and current source
        if: >-
          (inputs.mode == 'prepare' || inputs.mode == 'e2e') &&
          ((inputs.preparation_key != '' && inputs.prepare_upload == 'true') ||
           (inputs.preparation_key == '' && steps.profile.outputs.uploads == 'true')) &&
          steps.images.outputs.upload != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./subject
          file: ./subject/backend/upload/Dockerfile
          load: true
          tags: openmates-ci-upload:local
          cache-from: type=gha,scope=ci-upload
          cache-to: ${{ inputs.candidate_patch_sha256 == '' && 'type=gha,scope=ci-upload,mode=max' || '' }}
          labels: org.openmates.ci.runtime-key=${{ steps.runtime_keys.outputs.upload }}
      - name: Build current Directus extensions
        if: (inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') && steps.images.outputs.cms != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./subject/backend/core/directus
          load: true
          tags: openmates-ci-cms:local
          cache-from: type=gha,scope=ci-cms
          cache-to: ${{ inputs.candidate_patch_sha256 == '' && 'type=gha,scope=ci-cms,mode=max' || '' }}
          labels: org.openmates.ci.runtime-key=${{ steps.runtime_keys.outputs.cms }}
      - name: Build current schema initializer
        if: (inputs.mode == 'prepare' || inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') && steps.images.outputs.setup != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./subject/backend/core/directus
          file: ./subject/backend/core/directus/Dockerfile.setup.selfhost
          load: true
          tags: openmates-ci-setup:local
          cache-from: type=gha,scope=ci-setup
          cache-to: ${{ inputs.candidate_patch_sha256 == '' && 'type=gha,scope=ci-setup,mode=max' || '' }}
          labels: org.openmates.ci.runtime-key=${{ steps.runtime_keys.outputs.setup }}
      - name: Prepare missing sanitized schema bundle
        if: inputs.mode == 'prepare' && steps.images.outputs.schema != 'true'
        run: python3 ../tooling/scripts/ci_schema_bundle.py
      - name: Build missing prepared schema carrier
        if: inputs.mode == 'prepare' && steps.images.outputs.schema != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./subject/test-results/ci-private
          file: ./subject/scripts/ci_schema_image.Dockerfile
          load: true
          tags: openmates-ci-database:local
          cache-from: type=gha,scope=ci-schema-carrier
          cache-to: ${{ inputs.candidate_patch_sha256 == '' && 'type=gha,scope=ci-schema-carrier,mode=max' || '' }}
          labels: |
            org.openmates.ci.runtime-key=${{ steps.runtime_keys.outputs.schema }}
            org.openmates.ci.schema-bundle-format=openmates-postgres-plain-gzip-v2
            org.openmates.ci.schema-restore-semantics=fresh-volume-directus-credential-rotation-v2
      - name: Verify cold prepared schema in two fresh consumers
        id: schema-verify
        if: inputs.mode == 'prepare' && steps.images.outputs.schema != 'true'
        run: python3 ../tooling/scripts/ci_schema_bundle.py verify-image openmates-ci-database:local
      - name: Retain bounded schema failure report privately
        if: failure() && inputs.mode == 'prepare' && steps.schema-verify.outcome == 'failure'
        timeout-minutes: 3
        run: |
          if [ -f test-results/ci-private/schema-restore-diagnostic.json ]; then
            python3 ../tooling/scripts/ci_preparation_transport.py upload-schema-diagnostic \
              --path test-results/ci-private/schema-restore-diagnostic.json
          fi
      - name: Build local web app
        if: >-
          inputs.mode == 'prepare' ||
          ((inputs.mode == 'e2e' || inputs.mode == 'visual-smoke') && steps.artifacts.outputs.web != 'true')
        env:
          OPENMATES_CI_PRECOMPRESS: '0'
        run: |
          cp frontend/apps/web_app/svelte.config.docker.js frontend/apps/web_app/svelte.config.js
          node frontend/apps/web_app/scripts/process-docs.js
          pnpm --dir frontend/apps/web_app exec vite build
          pnpm --dir frontend/apps/web_app exec node scripts/audit-example-seo.js
      - name: Build local CLI only when consumed
        if: >-
          inputs.prepare_cli == 'true' &&
          (inputs.mode == 'prepare' ||
           (inputs.mode == 'e2e' && steps.artifacts.outputs.cli != 'true'))
        run: pnpm --filter openmates build
      - name: Export cold runtime images into private preparation bundle
        if: inputs.mode == 'prepare'
        run: |
          python3 ../tooling/scripts/ci_artifacts.py export-images \
            --receipt test-results/ci-runtime-images.json \
            --output-dir test-results/ci-preparation
      - name: Create atomic preparation manifest and receipt
        if: inputs.mode == 'prepare'
        run: |
          actual_key="$(python3 ../tooling/scripts/ci_artifacts.py key \
            --source "$BUILD_COMMIT_SHA" \
            --include-cli "${{ inputs.prepare_cli }}" \
            --include-upload "${{ inputs.prepare_upload }}")"
          test "$actual_key" = "${{ inputs.preparation_key }}"
          python3 ../tooling/scripts/ci_artifacts.py create \
            --source "$BUILD_COMMIT_SHA" \
            --candidate-tree "$CI_CANDIDATE_TREE" \
            --harness-commit "$CI_HARNESS_COMMIT" \
            --include-cli "${{ inputs.prepare_cli }}" \
            --include-upload "${{ inputs.prepare_upload }}" \
            --runtime-receipt test-results/ci-runtime-images.json \
            --output-dir test-results/ci-preparation
      - name: Upload immutable private preparation bundle
        if: inputs.mode == 'prepare'
        run: >-
          python3 ../tooling/scripts/ci_preparation_transport.py upload
          --directory test-results/ci-preparation
      - name: Start isolated backend
        if: inputs.mode == 'e2e' || inputs.mode == 'visual-smoke'
        run: |
          python3 ../tooling/scripts/ci_environment.py start
          python3 ../tooling/scripts/ci_environment.py verify
      - name: Install browser
        if: inputs.mode == 'component' || inputs.mode == 'e2e' || inputs.mode == 'artifact' || inputs.mode == 'visual-smoke'
        working-directory: subject/frontend/apps/web_app
        run: |
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Provision empty runner-local Codex thread
        if: inputs.mode == 'codex' || (inputs.mode == 'e2e' && contains(inputs.specs_json, 'tasks-flow.spec.ts'))
        run: node ../tooling/scripts/ci_codex_fixture.mjs start
      - name: Install installer workflow parser
        if: inputs.mode == 'selfhost'
        run: python3 -m pip install pyyaml==6.0.2
      - name: Run selected checks
        if: inputs.mode != 'prepare'
        env:
          CI_TEST_MODE: ${{ inputs.mode }}
          CI_SPECS_JSON: ${{ inputs.specs_json }}
        run: python3 ../tooling/scripts/ci_run_tests.py
      - name: Stop runner-private Codex daemon
        if: always() && (inputs.mode == 'codex' || (inputs.mode == 'e2e' && contains(inputs.specs_json, 'tasks-flow.spec.ts')))
        run: node ../tooling/scripts/ci_codex_fixture.mjs stop
      - name: Collect bounded stack diagnostics
        if: always() && (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke')
        run: python3 ../tooling/scripts/ci_environment.py logs
      - name: Remove disposable containers and databases
        if: always() && (inputs.mode == 'e2e' || inputs.mode == 'visual-smoke')
        run: python3 ../tooling/scripts/ci_environment.py stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-results
          retention-days: 7
          path: |
            subject/test-results/ci-environment.json
            subject/test-results/ci-artifacts.json
            subject/test-results/ci-runtime-images.json
            subject/test-results/ci-results.json
            subject/test-results/ci-stack.log
            subject/test-results/ci-stack-spec-*.log
            subject/test-results/ci-codex.json
            subject/test-results/ci-cleanup.json
            subject/test-results/ci-selfhost-steps.json
            subject/test-results/ci-spec-*.json
            subject/test-results/ci-pytest.json
            subject/test-results/ci-unit-*
            subject/test-results/ci-visual-smoke/
            subject/test-results/ci-web.log
            subject/frontend/apps/web_app/test-results/
          if-no-files-found: error
      - name: Retain original documentation screenshot output
        if: always() && contains(inputs.specs_json, 'docs-screenshot-generator.spec.ts')
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          retention-days: 7
          path: subject/docs/images/user-guide/apps/**/*.jpg
