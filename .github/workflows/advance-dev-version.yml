name: Advance dev version after main merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: advance-dev-version
  cancel-in-progress: false

jobs:
  advance:
    name: Advance dev to next alpha line
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Resolve next dev minor
        id: version
        working-directory: main
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          config = json.loads(Path("shared/config/product_version.json").read_text(encoding="utf-8"))
          stable_base = config["cli"]["stableBase"]
          major, minor, patch = (int(part) for part in stable_base.split("."))
          if major != 0 or patch != 0:
              raise SystemExit(f"Expected stableBase 0.MINOR.0, got {stable_base}")
          print(f"minor={minor + 1}")
          PY

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance dev version line
        working-directory: dev
        run: python3 scripts/bump_alpha_version_line.py --minor "${{ steps.version.outputs.minor }}"

      - name: Create dev version bump pull request
        working-directory: dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "dev is already on v0.${{ steps.version.outputs.minor }}; no commit needed."
            exit 0
          fi
          title="chore: advance dev to v0.${{ steps.version.outputs.minor }}"
          existing_pr=$(gh pr list --base dev --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | sed -n '1p')
          if [ -n "$existing_pr" ]; then
            echo "Version bump PR #$existing_pr already exists."
            exit 0
          fi
          branch="automation/advance-dev-v0.${{ steps.version.outputs.minor }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "$title"
          git push origin HEAD:"$branch"
          gh pr create \
            --base dev \
            --head "$branch" \
            --title "$title" \
            --body "Automated product-line bump after a merged PR to main.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
