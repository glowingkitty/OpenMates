# .github/workflows/npm-audit.yml
#
# Scheduled npm advisory check for the pnpm workspace. This catches advisories
# that appear after a dependency has already entered the lockfile.
#
# Recorded exceptions (package.json pnpm.auditConfig.ignoreGhsas), reviewed
# 2026-11-16 (TASK-4304). Each has no patched release inside the version range
# its consumers declare, and is reachable only from build/lint tooling with
# repository-controlled patterns, never from user input at runtime. Remove an
# entry as soon as its consumers accept the patched major.
# - GHSA-3g3m-2fjr-6pw4 (glob AbortSignal bypass, fixed in 14.0.2): only
#   @vercel/nft (adapter-vercel build tracing) uses glob, and it requires ^13.
# - GHSA-g3hv-75wg-m249 (minimatch pattern DoS, fixed in 11.0.1): used by
#   eslint, typescript-eslint and glob 13, which require ^3 or ^10.
# - GHSA-3r8g-jcqq-3p5j (SvelteKit experimental remote functions, fixed in
#   3.1.1): this workspace has no remote-function configuration or modules.
#   Remove this exception and its guard when upgrading to a patched SvelteKit.
#
# Architecture: docs/architecture/github-actions-ci.md

name: "NPM Audit"

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Verify SvelteKit advisory scope
        run: ./scripts/check_sveltekit_audit_scope.sh

      - name: Audit pnpm workspace
        run: pnpm audit --audit-level moderate
