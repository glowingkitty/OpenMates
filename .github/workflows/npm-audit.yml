# .github/workflows/npm-audit.yml
#
# Scheduled npm advisory check for the pnpm workspace. This catches advisories
# that appear after a dependency has already entered the lockfile.
#
# Architecture: docs/architecture/github-actions-ci.md

name: "NPM Audit"

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Audit pnpm workspace
        run: pnpm audit --audit-level moderate
