# Real-dev encrypted Task Activity contract smoke.
#
# This daily and manually dispatched job verifies REST, CLI, npm SDK, and pip SDK
# behavior against the deployed dev API with one configured test account.
# Every verifier creates isolated ciphertext fixtures and cleans them up.
name: Task Activity Smoke

on:
  workflow_dispatch:
    inputs:
      account:
        description: Test account slot to use
        required: false
        default: "18"
        type: string
  schedule:
    - cron: "7 6 * * *"

concurrency:
  group: task-activity-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENMATES_API_URL: https://api.dev.openmates.org
      OPENMATES_TEST_ACCOUNT_EMAIL: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_EMAIL', inputs.account || '18')] }}
      OPENMATES_TEST_ACCOUNT_PASSWORD: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_PASSWORD', inputs.account || '18')] }}
      OPENMATES_TEST_ACCOUNT_OTP_KEY: ${{ secrets[format('OPENMATES_TEST_ACCOUNT_{0}_OTP_KEY', inputs.account || '18')] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e packages/openmates-python

      - name: Build CLI and SDK
        run: pnpm --filter openmates build

      - name: Audit CLI and SDK parity
        run: python3 scripts/audit_sdk_cli_parity.py

      - name: Verify encrypted Task Activity contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python3 scripts/verify_task_activity_api_live.py \
            --api-url "$OPENMATES_API_URL" \
            | tee test-results/task-activity-api.json
          python3 scripts/verify_tasks_cli_smoke.py \
            --api-url "$OPENMATES_API_URL" \
            --skip-build \
            | tee test-results/task-activity-cli.json
          node --experimental-strip-types \
            --loader ./frontend/packages/openmates-cli/tests/loader.mjs \
            scripts/verify_sdk_tasks_live_smoke.mjs \
            | tee test-results/task-activity-sdk.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-activity-smoke-${{ github.run_id }}
          path: test-results/task-activity-*.json
          if-no-files-found: ignore
          retention-days: 14
