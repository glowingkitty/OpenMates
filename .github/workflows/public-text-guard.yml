# Pull request titles and descriptions are public: they must never carry a link to an AI chat or
# coding session (Claude, ChatGPT, Gemini, OpenMates chat/share links) or a session id (owner, 23 Nov).
# Also check branch names and changed file paths and contents for the reserved name.
name: Public text guard

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  no-chat-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check pull request text and branch names
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/public_link_guard.py pr
          python3 scripts/public_link_guard.py branch "$PR_HEAD_REF" "$PR_BASE_REF"
      - name: Check introduced commits and files
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/public_link_guard.py branch "$REF_NAME"
          fi
          python3 scripts/public_link_guard.py range "$BEFORE" "$AFTER"
