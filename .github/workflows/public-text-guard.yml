# Pull request titles and descriptions are public: they must never carry a link to an AI chat or
# coding session (Claude, ChatGPT, Gemini, OpenMates chat/share links) or a session id (owner, 23 Nov).
# Also check branch names and changed file paths and contents for the reserved name.
name: Public text guard

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  no-chat-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Check public text, branch names and changed files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/public_link_guard.py pr
          python3 scripts/public_link_guard.py branch "$PR_HEAD_REF" "$PR_BASE_REF"
          python3 scripts/public_link_guard.py tree HEAD^1
