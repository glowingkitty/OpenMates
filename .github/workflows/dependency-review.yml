# .github/workflows/dependency-review.yml
#
# Reviews dependency graph changes in pull requests so lockfile and manifest
# changes get an automated security gate before they reach dev.
#
# Architecture: docs/architecture/github-actions-ci.md

name: "Dependency Review"

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - "**/Dockerfile*"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - "**/docker-compose*.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
