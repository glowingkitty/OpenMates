[package]
name = "openmates-session-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Direct Node-API and Python bindings for the OpenMates Rust session SDK"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
python-bindings = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[dependencies]
openmates-sdk = { path = "../openmates-rust", features = ["workflow-yaml"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"], optional = true }
napi-derive = { version = "3", optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = "0.28"

# RUSTSEC-2026-0387: Ristretto255-only voprf/opaque-ke without elliptic-curve/crypto-bigint 0.5.
# See packages/third_party/README.md. Remove once upstream drops elliptic-curve 0.13.
[patch.crates-io]
opaque-ke = { path = "../third_party/opaque-ke" }
voprf = { path = "../third_party/voprf" }
