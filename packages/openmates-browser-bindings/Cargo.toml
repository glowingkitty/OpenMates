[package]
name = "openmates-browser-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Worker-only browser exports for the shared OpenMates Rust core"
publish = false

[features]
browser-metadata-prototype = ["openmates-sdk/browser-metadata-prototype"]

[lib]
crate-type = ["cdylib", "rlib"]

# Dependency ranges mirror the existing SDK; no separate lock is generated here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmates-sdk = { path = "../openmates-rust" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "Crypto", "CryptoKey", "SubtleCrypto"] }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
base64 = "0.22"
sha2 = "0.10"
futures-channel = "0.3"
futures-util = "0.3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
