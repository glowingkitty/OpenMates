# XcodeGen project spec — generates OpenMates.xcodeproj from this YAML.
# Run: xcodegen generate (requires: brew install xcodegen)
# This keeps the Xcode project config version-controlled and mergeable.

name: OpenMates
options:
  bundleIdPrefix: org.openmates
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.27.0"
    CURRENT_PROJECT_VERSION: 12
    DEVELOPMENT_TEAM: Z9B2YFKN2X
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

configs:
  Debug: debug
  Release: release

packages:
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift.git
    from: 1.8.0
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.9.1
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    revision: 1e2a163736dfa5a198e637ae44c114e1c6d5cc2d
  Tokenizers:
    url: https://github.com/DePasqualeOrg/swift-tokenizers.git
    exactVersion: 0.5.0

  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    revision: 12ce7374c86944e1f68f3a866d10105d8357f074

targets:
  OpenMates:
    type: application
    platform: [iOS, macOS]
    preBuildScripts:
      - name: Build PairOpaqueBridge
        script: '"${PROJECT_DIR}/PairOpaqueBridge/build-apple.sh"'
        basedOnDependencyAnalysis: false
      - name: Prepare LocalModelBridge
        script: 'python3 "${PROJECT_DIR}/LocalModelBridge/prepare.py"'
        basedOnDependencyAnalysis: false
        # The linker validates generated archive inputs before this script runs.
        outputFiles:
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/executorch.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libexecutorch_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/backend_xnnpack.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libbackend_xnnpack_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/kernels_optimized.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libkernels_optimized_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/kernels_quantized.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libkernels_quantized_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/kernels_torchao.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libkernels_torchao_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
          - "$(DERIVED_FILE_DIR)/LocalModelBridge/$(PLATFORM_NAME)/threadpool.xcframework/$(LOCAL_MODEL_BRIDGE_SLICE)/libthreadpool_$(LOCAL_MODEL_BRIDGE_SUFFIX).a"
      - name: Isolate macOS ONNX Runtime
        script: 'python3 "${PROJECT_DIR}/LocalModelBridge/normalize_onnx_macos.py"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/onnxruntime.framework/onnxruntime"
          - "$(PROJECT_DIR)/LocalModelBridge/normalize_onnx_macos.py"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/onnx-macos-normalization/receipt.json"
    postBuildScripts:
      - name: Embed macOS ONNX Runtime
        script: 'python3 "${PROJECT_DIR}/LocalModelBridge/embed_onnx_macos.py"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/onnxruntime.framework/onnxruntime"
          - "$(PROJECT_DIR)/LocalModelBridge/embed_onnx_macos.py"
        # This phase also exists on the generated iOS target, where its script
        # is a no-op and SwiftPM owns framework embedding. Declaring that same
        # binary as an output gives Xcode two producers before the script runs.
        # The phase already runs unconditionally and verifies the macOS copy.
    sources:
      - path: OpenMates/Sources
        excludes:
          - "**/*.generated.swift"
      - path: OpenMatesShared
      - path: OpenMatesWatch/Sources/WatchHubDataService.swift
      - path: OpenMatesWatch/Sources/WatchWorkflowDetailService.swift
      # Import generated design tokens from the frontend token pipeline
      - path: ../frontend/packages/ui/src/tokens/generated/swift
        name: DesignTokens
        type: group
        excludes:
          - Assets.xcassets
          - Icons.xcassets
      - path: ../frontend/packages/ui/static/images/mates
        buildPhase: resources
        name: Mates
        type: folder
      - path: ../frontend/packages/ui/src/i18n/locales
        buildPhase: resources
        name: i18n
        type: folder
      - path: ../frontend/packages/ui/src/demo_chats/data/example_chats
        buildPhase: resources
        name: example_chats
        type: folder
      - path: OpenMates/Resources/Videos
        buildPhase: resources
        name: Videos
        type: folder
      - path: OpenMates/Resources/Fonts
        buildPhase: resources
        name: Fonts
        type: folder
      - path: OpenMates/Resources/MermaidRuntime
        buildPhase: resources
        name: MermaidRuntime
        type: folder
      # Xcode asset catalogs with theme-aware colors and custom icons
      - path: OpenMates/Resources/BrandAssets.xcassets
        buildPhase: resources
      - path: OpenMates/Resources/SpeechIcons.xcassets
        buildPhase: resources
      - path: ../frontend/apps/web_app/static/audio/assistant-speech-pending.wav
        buildPhase: resources
      - path: OpenMates/Resources/LocalModels/catalog.json
        buildPhase: resources
      - path: OpenMates/Resources/LocalModels/Supertonic3-NOTICE.txt
        buildPhase: resources
      - path: OpenMates/Resources/LocalModels/ONNXRuntime-NOTICE.txt
        buildPhase: resources
      - path: LocalModelBridge/LICENSE-ExecuTorch.txt
        buildPhase: resources
      - path: OpenMates/Resources/modelsMetadata.json
        buildPhase: resources
      - path: OpenMatesWatch/Resources/watch-whisper-tiny.json
        buildPhase: resources
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Assets.xcassets
        buildPhase: resources
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Icons.xcassets
        buildPhase: resources
    settings:
      base:
        LIBRARY_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)/PairOpaque"
        OTHER_LDFLAGS: "$(inherited) -lopenmates_pair_opaque -lc++"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        # Private arm64 platform directories avoid SwiftPM module-map collisions.
        "LOCAL_MODEL_BRIDGE_SLICE[sdk=iphoneos*]": ios-arm64
        "LOCAL_MODEL_BRIDGE_SUFFIX[sdk=iphoneos*]": ios
        "LOCAL_MODEL_BRIDGE_SLICE[sdk=iphonesimulator*]": ios-arm64-simulator
        "LOCAL_MODEL_BRIDGE_SUFFIX[sdk=iphonesimulator*]": simulator
        "LOCAL_MODEL_BRIDGE_SLICE[sdk=macosx*]": macos-arm64
        "LOCAL_MODEL_BRIDGE_SUFFIX[sdk=macosx*]": macos
        "HEADER_SEARCH_PATHS[sdk=iphoneos*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/executorch.xcframework/ios-arm64/Headers"'
        "SWIFT_INCLUDE_PATHS[sdk=iphoneos*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/Modules" "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/executorch.xcframework/ios-arm64/Headers"'
        "OTHER_LDFLAGS[sdk=iphoneos*][arch=arm64]": '$(inherited) -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/executorch.xcframework/ios-arm64/libexecutorch_ios.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/backend_xnnpack.xcframework/ios-arm64/libbackend_xnnpack_ios.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/kernels_optimized.xcframework/ios-arm64/libkernels_optimized_ios.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/kernels_quantized.xcframework/ios-arm64/libkernels_quantized_ios.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/kernels_torchao.xcframework/ios-arm64/libkernels_torchao_ios.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphoneos/threadpool.xcframework/ios-arm64/libthreadpool_ios.a" -framework Accelerate -framework CoreGraphics -framework CoreImage -framework CoreVideo -framework Foundation -lc++'
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/executorch.xcframework/ios-arm64-simulator/Headers"'
        "SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/Modules" "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/executorch.xcframework/ios-arm64-simulator/Headers"'
        "OTHER_LDFLAGS[sdk=iphonesimulator*][arch=arm64]": '$(inherited) -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/executorch.xcframework/ios-arm64-simulator/libexecutorch_simulator.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/backend_xnnpack.xcframework/ios-arm64-simulator/libbackend_xnnpack_simulator.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/kernels_optimized.xcframework/ios-arm64-simulator/libkernels_optimized_simulator.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/kernels_quantized.xcframework/ios-arm64-simulator/libkernels_quantized_simulator.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/kernels_torchao.xcframework/ios-arm64-simulator/libkernels_torchao_simulator.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/iphonesimulator/threadpool.xcframework/ios-arm64-simulator/libthreadpool_simulator.a" -framework Accelerate -framework CoreGraphics -framework CoreImage -framework CoreVideo -framework Foundation -lc++'
        "HEADER_SEARCH_PATHS[sdk=macosx*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/executorch.xcframework/macos-arm64/Headers"'
        "SWIFT_INCLUDE_PATHS[sdk=macosx*][arch=arm64]": '$(inherited) "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/Modules" "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/executorch.xcframework/macos-arm64/Headers"'
        # Rust and C++ personalities can exceed compact unwind
        # encoding. Retain DWARF exception frames for the Mac app instead.
        "OTHER_LDFLAGS[sdk=macosx*][arch=arm64]": '$(inherited) -Xlinker -no_compact_unwind -Xlinker -keep_dwarf_unwind -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/executorch.xcframework/macos-arm64/libexecutorch_macos.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/backend_xnnpack.xcframework/macos-arm64/libbackend_xnnpack_macos.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/kernels_optimized.xcframework/macos-arm64/libkernels_optimized_macos.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/kernels_quantized.xcframework/macos-arm64/libkernels_quantized_macos.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/kernels_torchao.xcframework/macos-arm64/libkernels_torchao_macos.a" -Xlinker -force_load -Xlinker "$(DERIVED_FILE_DIR)/LocalModelBridge/macosx/threadpool.xcframework/macos-arm64/libthreadpool_macos.a" -framework Accelerate -framework CoreGraphics -framework CoreImage -framework CoreVideo -framework Foundation -lc++'
        "OTHER_LDFLAGS[sdk=macosx*][arch=x86_64]": '$(inherited) -Xlinker -no_compact_unwind -Xlinker -keep_dwarf_unwind'
        INFOPLIST_FILE: OpenMates/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app
        CODE_SIGN_ENTITLEMENTS: OpenMates/Resources/OpenMatesPasskey.entitlements
        # macOS uses a different APNs entitlement key than iOS.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": OpenMates/Resources/OpenMatesMacOS.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENVIRONMENT: development
          OPENMATES_DEV_WEBCREDENTIALS: webcredentials:app.dev.openmates.org
          # StoreKit testing configuration for sandbox purchases
          STOREKIT_CONFIGURATION: OpenMates/Resources/OpenMates.storekit
        Release:
          APS_ENVIRONMENT: production
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule
          OPENMATES_DEV_WEBCREDENTIALS: webcredentials:app.dev.openmates.org
    entitlements:
      path: OpenMates/Resources/OpenMatesPasskey.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)org.openmates.app
        com.apple.security.application-groups:
          - group.org.openmates.app.shared
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - webcredentials:openmates.org
          - $(OPENMATES_DEV_WEBCREDENTIALS)
          - webcredentials:app.openmates.org
          - applinks:app.openmates.org
          - applinks:openmates.org
          - applinks:app.dev.openmates.org
    info:
      path: OpenMates/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenMates
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: OpenMates
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.openmates.chat-organization
            UTTypeConformsTo:
              - public.data
        OpenMatesKeychainAccessGroup: $(AppIdentifierPrefix)org.openmates.app
        NSUserActivityTypes:
          - org.openmates.app.viewChat
          - org.openmates.app.composeChat
          - org.openmates.app.browseChats
        NSMicrophoneUsageDescription: OpenMates uses the microphone to record voice messages you choose to send in chat.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fonts/LexendDeca-Light.ttf
          - Fonts/LexendDeca-Regular.ttf
          - Fonts/LexendDeca-Medium.ttf
          - Fonts/LexendDeca-SemiBold.ttf
          - Fonts/LexendDeca-Bold.ttf
          - Fonts/LexendDeca-ExtraBold.ttf
    dependencies:
      - package: LucideIcons
      - package: Sodium
      - package: Yams
      - package: ZIPFoundation
      - package: WhisperKit
        product: WhisperKit
      - package: OnnxRuntime
        product: onnxruntime
      - package: Tokenizers
        product: Tokenizers
      - target: OpenMatesShareExtension
        platforms: [iOS]
      - target: OpenMatesShareExtension_macOS
        platforms: [macOS]
      - target: OpenMatesWidget
        platforms: [iOS]
      - target: OpenMatesWidget_macOS
        platforms: [macOS]
        embed: true
      - target: OpenMatesWatch
        platforms: [iOS]
        embed: true
      - target: OpenMatesNotificationService
        platforms: [iOS]
        embed: true

  OpenMatesNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenMatesNotificationService
      - path: OpenMates/Sources/Core/Crypto/KeychainHelper.swift
      - path: OpenMates/Sources/Core/Networking/NotificationPreviewCrypto.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: OpenMatesNotificationService/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.notification-service
        CODE_SIGN_ENTITLEMENTS: OpenMatesNotificationService/OpenMatesNotificationService.entitlements
        SWIFT_VERSION: "6.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: OpenMatesNotificationService/OpenMatesNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)org.openmates.app
        com.apple.security.application-groups:
          - group.org.openmates.app.shared

  # Independent watchOS app — starts with standalone target plumbing; auth/chat UI lands in later spec tasks.
  OpenMatesWatch:
    type: application
    platform: watchOS
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    preBuildScripts:
      - name: Build PairOpaqueBridge
        script: '"${PROJECT_DIR}/PairOpaqueBridge/build-apple.sh"'
        basedOnDependencyAnalysis: false
    deploymentTarget: "10.0"
    sources:
      - path: OpenMatesWatch/Sources
      - path: OpenMates/Sources/Core/Models/AuthError.swift
      - path: OpenMates/Sources/Core/Models/AuthModels.swift
      - path: OpenMates/Sources/Core/Crypto/CryptoManager.swift
      - path: OpenMates/Sources/Core/Crypto/KeychainHelper.swift
      - path: OpenMates/Sources/Core/Crypto/ShareLinkCrypto.swift
      - path: OpenMates/Sources/Core/Models/EmbedModels.swift
      - path: OpenMates/Sources/Core/Networking/APIClient.swift
      - path: OpenMates/Sources/Core/Networking/ServerConfiguration.swift
      - path: OpenMates/Sources/Core/Watch/WatchChatRuntime.swift
      - path: OpenMates/Sources/Core/Watch/WatchChatShareService.swift
      - path: OpenMates/Sources/Core/Watch/WatchWhisperLabAssets.swift
      - path: OpenMates/Sources/Core/Watch/WatchWhisperLabController.swift
      - path: OpenMates/Sources/Core/Watch/WatchWhisperTinyRuntime.swift
      - path: OpenMates/Sources/Core/Watch/WatchPushLifecycle.swift
      - path: OpenMates/Sources/Core/Watch/WatchCanonicalStorage.swift
      - path: OpenMates/Sources/Core/Diagnostics/NativeDiagnostics.swift
      - path: OpenMates/Sources/Core/Watch/WatchItemOpenModel.swift
      - path: OpenMates/Sources/Core/Watch/WatchPhoneOpenPayload.swift
      - path: OpenMates/Sources/Core/Watch/WatchEmbedPreviewModel.swift
      - path: OpenMates/Sources/Shared/Components/Icon.swift
      - path: OpenMates/Sources/Shared/Components/EmbedProcessingMotion.swift
      - path: OpenMates/Sources/Features/Auth/ViewModels/PairLoginRuntime.swift
      - path: OpenMates/Sources/Features/Auth/ViewModels/PairOpaque.swift
      - path: OpenMates/Sources/Features/Auth/ViewModels/PairV2Runtime.swift
      - path: OpenMates/Sources/Shared/Extensions/FontRegistration.swift
      - path: OpenMates/Sources/Shared/Extensions/AnyCodable.swift
      - path: OpenMates/Sources/Shared/Extensions/DataExtensions.swift
      - path: OpenMatesShared/OpenMatesSharedEnvironment.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/ColorTokens.generated.swift
        name: ColorTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/GradientTokens.generated.swift
        name: GradientTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/SpacingTokens.generated.swift
        name: SpacingTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/TypographyTokens.generated.swift
        name: TypographyTokens.generated.swift
      - path: OpenMatesWatch/Assets.xcassets
        buildPhase: resources
      - path: OpenMatesWatch/Resources/watch-whisper-tiny.json
        buildPhase: resources
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Icons.xcassets
        buildPhase: resources
      - path: OpenMates/Resources/modelsMetadata.json
        buildPhase: resources
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Assets.xcassets
        buildPhase: resources
      - path: OpenMates/Resources/Fonts
        buildPhase: resources
        name: Fonts
        type: folder
      - path: ../frontend/packages/ui/src/i18n/locales
        buildPhase: resources
        name: i18n
        type: folder
    settings:
      base:
        LIBRARY_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)/PairOpaque"
        OTHER_LDFLAGS: "$(inherited) -lopenmates_pair_opaque"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        CODE_SIGN_ENTITLEMENTS: OpenMatesWatch/OpenMatesWatch.entitlements
        GENERATE_PKGINFO_FILE: YES
        INFOPLIST_FILE: OpenMatesWatch/Info.plist
        PRIVATE_HEADERS_FOLDER_PATH: $(CONTENTS_FOLDER_PATH)/PrivateHeaders
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.watch
        PRODUCT_NAME: OpenMatesWatch
        SDKROOT: watchos
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        WRAPPER_EXTENSION: app
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule
    entitlements:
      path: OpenMatesWatch/OpenMatesWatch.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: OpenMatesWatch/Info.plist
      properties:
        CFBundleIconFiles:
          - WatchAppIcon
        CFBundleDisplayName: OpenMates
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: OpenMates
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: org.openmates.app
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: OpenMates uses the microphone to record voice messages you choose to send in chat.
        UIAppFonts:
          - Fonts/LexendDeca-Light.ttf
          - Fonts/LexendDeca-Regular.ttf
          - Fonts/LexendDeca-Medium.ttf
          - Fonts/LexendDeca-SemiBold.ttf
          - Fonts/LexendDeca-Bold.ttf
          - Fonts/LexendDeca-ExtraBold.ttf

  # Share extension — share URLs, text, and images from other apps into OpenMates chats
  OpenMatesShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenMatesShareExtension
      - path: OpenMatesShared
      - path: OpenMates/Sources/Core/Crypto/CryptoManager.swift
      - path: OpenMates/Sources/Core/Crypto/KeychainHelper.swift
      - path: OpenMates/Sources/Core/Networking/ServerConfiguration.swift
      - path: OpenMates/Sources/Shared/Extensions/AnyCodable.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerDocument.swift
      - path: OpenMates/Sources/Shared/Composer/AppleComposerRendererRegistry.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerEmbedLifecycle.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerTextAttachment.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerController.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerSession.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerTextView.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: OpenMatesShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.share
        CODE_SIGN_ENTITLEMENTS: OpenMatesShareExtension/OpenMatesShareExtension.entitlements
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) OPENMATES_SHARE_EXTENSION
    entitlements:
      path: OpenMatesShareExtension/OpenMatesShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)org.openmates.app
        com.apple.security.application-groups:
          - group.org.openmates.app.shared

  # macOS share extension — share URLs and text from Mac apps into OpenMates chats
  OpenMatesShareExtension_macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: OpenMatesShareExtensionMacOS
      - path: OpenMatesShared
      - path: OpenMates/Sources/Core/Crypto/CryptoManager.swift
      - path: OpenMates/Sources/Core/Crypto/KeychainHelper.swift
      - path: OpenMates/Sources/Core/Networking/ServerConfiguration.swift
      - path: OpenMates/Sources/Shared/Extensions/AnyCodable.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerDocument.swift
      - path: OpenMates/Sources/Shared/Composer/AppleComposerRendererRegistry.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerEmbedLifecycle.swift
      - path: OpenMates/Sources/Shared/Composer/ComposerTextAttachment.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerController.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerSession.swift
      - path: OpenMates/Sources/Shared/Composer/NativeComposerTextView.swift
    settings:
