        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENMATES_WIDGET_EXTENSION"
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.widget
        CODE_SIGN_ENTITLEMENTS: OpenMatesWidget/OpenMatesWidget.entitlements
        SWIFT_VERSION: "6.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: OpenMatesWidget/OpenMatesWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)org.openmates.app
        com.apple.security.application-groups:
          - group.org.openmates.app.shared

  OpenMatesWidget_macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: OpenMatesWidget
        excludes: [Info.plist]
      - path: OpenMates/Sources/Shared/Extensions/WidgetTasksData.swift
      - path: OpenMates/Sources/Shared/Extensions/WidgetWorkflowsData.swift
      - path: OpenMates/Sources/Shared/Extensions/WidgetWorkflowEntity.swift
      - path: OpenMates/Sources/Shared/Extensions/ControlProjectsData.swift
      - path: OpenMates/Sources/Shared/Extensions/OpenMatesControlIntents.swift
      - path: OpenMates/Sources/Shared/Extensions/WidgetWorkflowsView.swift
      - path: OpenMates/Sources/Shared/Extensions/WidgetActiveChatsData.swift
      - path: OpenMates/Sources/Shared/Extensions/WidgetActiveChatsView.swift
      - path: OpenMates/Sources/Shared/Extensions/DataExtensions.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/GradientTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/ColorTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/SpacingTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/TypographyTokens.generated.swift
      - path: ../frontend/packages/ui/src/tokens/generated/swift/Assets.xcassets
        buildPhase: resources
      - path: ../frontend/packages/ui/src/i18n/locales
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: OpenMatesWidget/MacInfo.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENMATES_WIDGET_EXTENSION"
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.widgetmacos
        CODE_SIGN_ENTITLEMENTS: OpenMatesWidget/MacWidget.entitlements
        SWIFT_VERSION: "6.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: OpenMatesWidget/MacWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
          - $(AppIdentifierPrefix)org.openmates.app
        com.apple.security.application-groups:
          - group.org.openmates.app.shared
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  OpenMatesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenMatesUITests
    dependencies:
      - target: OpenMates_iOS
    settings:
      base:
        INFOPLIST_FILE: OpenMatesUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.uitests
        PRODUCT_NAME: OpenMatesUITests
        TEST_TARGET_NAME: OpenMates_iOS
        SWIFT_VERSION: "6.0"

  OpenMatesMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: OpenMatesMacUITests
      - path: OpenMatesUITests/ChatHistoryMacParityUITests.swift
      - path: OpenMatesUITests/MacMenuBarQuickCaptureUITests.swift
      - path: OpenMatesUITests/TooltipHelpParityUITests.swift
    dependencies:
      - target: OpenMates_macOS
    settings:
      base:
        INFOPLIST_FILE: OpenMatesUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.macuitests
        PRODUCT_NAME: OpenMatesMacUITests
        TEST_TARGET_NAME: OpenMates_macOS
        SWIFT_VERSION: "6.0"

  OpenMatesWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: OpenMatesWatchUITests
    dependencies:
      - target: OpenMatesWatch
    settings:
      base:
        INFOPLIST_FILE: OpenMatesUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.watchuitests
        PRODUCT_NAME: OpenMatesWatchUITests
        TEST_TARGET_NAME: OpenMatesWatch
        SWIFT_VERSION: "6.0"

  OpenMatesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenMatesTests
    dependencies:
      - target: OpenMates_iOS
    settings:
      base:
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        INFOPLIST_FILE: OpenMatesTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.openmates.app.tests
        PRODUCT_NAME: OpenMatesTests
        # Hosted tests deserialize OpenMates' transitive ExecuTorch module. The
        # explicit app dependency prepares these private directories before tests.
        # Reuse the app's overlay/headers without copying a shared module map or
        # registering/linking the six static archives a second time.
        "HEADER_SEARCH_PATHS[sdk=iphoneos*][arch=arm64]": '$(inherited) "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphoneos/executorch.xcframework/ios-arm64/Headers"'
        "SWIFT_INCLUDE_PATHS[sdk=iphoneos*][arch=arm64]": '$(inherited) "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphoneos/Modules" "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphoneos/executorch.xcframework/ios-arm64/Headers"'
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]": '$(inherited) "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphonesimulator/executorch.xcframework/ios-arm64-simulator/Headers"'
        "SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*][arch=arm64]": '$(inherited) "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphonesimulator/Modules" "$(CONFIGURATION_TEMP_DIR)/OpenMates_iOS.build/DerivedSources/LocalModelBridge/iphonesimulator/executorch.xcframework/ios-arm64-simulator/Headers"'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenMates.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenMates
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "6.0"

schemes:
  OpenMates_iOS:
    build:
      targets:
        OpenMates_iOS: all
    test:
      environmentVariables:
        OPENMATES_TEST_ACCOUNT_EMAIL: $(OPENMATES_TEST_ACCOUNT_EMAIL)
        OPENMATES_TEST_ACCOUNT_PASSWORD: $(OPENMATES_TEST_ACCOUNT_PASSWORD)
        OPENMATES_TEST_ACCOUNT_OTP_KEY: $(OPENMATES_TEST_ACCOUNT_OTP_KEY)
      targets:
        - OpenMatesTests
        - OpenMatesUITests
  OpenMates_iOS_UI_Tests:
    build:
      targets:
        OpenMates_iOS: all
    test:
      environmentVariables:
        OPENMATES_TEST_ACCOUNT_EMAIL: $(OPENMATES_TEST_ACCOUNT_EMAIL)
        OPENMATES_TEST_ACCOUNT_PASSWORD: $(OPENMATES_TEST_ACCOUNT_PASSWORD)
        OPENMATES_TEST_ACCOUNT_OTP_KEY: $(OPENMATES_TEST_ACCOUNT_OTP_KEY)
      targets:
        - OpenMatesUITests
  OpenMates_iOS_Unit_Tests:
    build:
      targets:
        OpenMates_iOS: all
    test:
      environmentVariables:
        DEV_PREVIEW: embed-share
        OPENMATES_TEST_ACCOUNT_EMAIL: $(OPENMATES_TEST_ACCOUNT_EMAIL)
        OPENMATES_TEST_ACCOUNT_PASSWORD: $(OPENMATES_TEST_ACCOUNT_PASSWORD)
        OPENMATES_TEST_ACCOUNT_OTP_KEY: $(OPENMATES_TEST_ACCOUNT_OTP_KEY)
      targets:
        - OpenMatesTests
  OpenMates_macOS:
    build:
      targets:
        OpenMates_macOS: all
    test:
      targets:
        - OpenMatesMacUITests
  OpenMatesWatch:
    build:
      targets:
        OpenMatesWatch: all
  OpenMatesWatchUITests:
    build:
      targets:
        OpenMatesWatch: all
        OpenMatesWatchUITests: [test]
    test:
      targets:
        - OpenMatesWatchUITests
