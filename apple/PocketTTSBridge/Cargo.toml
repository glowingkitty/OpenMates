[package]
name = "openmates-pocket-tts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pocket-tts-ios = { path = "../../.runtime/pocket-tts/runtime", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
