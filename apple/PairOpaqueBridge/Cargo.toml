[package]
name = "openmates-pair-opaque"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
generic-array = "=0.14.7"
hkdf = "=0.12.4"
opaque-ke = { version = "=4.0.0", features = ["argon2"] }
rand = "=0.8.6"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
