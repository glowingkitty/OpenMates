    release_status: released_main
  - text: Specifications for the upcoming Workflow MVP were finalized and saved.
    evidence:
      commits:
      - 9c8100b74
    release_status: released_main
  - text: Development continued on Apple platform features, including fixes for chat scroll hangs, notification replies, and
      core login flows for iOS and macOS.
    evidence:
      commits:
      - 9fbba00f7
      - f5cc5d74f
      - fd2c48f85
      - 7c983250a
      - c702b9236
    release_status: released_main
  internal_progress:
  - text: Completed a major migration to isolated GitHub test environments, including durable dispatch pilots and immutable
      candidate publishing.
    evidence:
