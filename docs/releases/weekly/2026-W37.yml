    rationale: The week's highlights focus on professionalizing the CLI experience, overhauling the workspace UI with new
      Specification views, and hardening core AI reliability. Features related to disabled modules like Tasks and Apple platforms
      are excluded.
  social_video_recommendations:
  - idea: A short demo showing how to use the CLI to download files generated by an AI skill directly to a local directory.
    priority: medium
    reason: Demonstrates a concrete bridge between AI-generated content and a developer's local file system.
    evidence:
      commits:
      - e6676605e
  - idea: A walkthrough of the new Specification fullscreen design and the streamlined header action menu.
    priority: high
    reason: The Specification fullscreen view is a significant visual enhancement that is ready for public demo.
