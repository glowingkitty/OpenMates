llm_summary:
  overview: OpenMates focused on expanding the Finance app with Revolut Business integration, enhancing the Audio app with
    waveform visualizations, and implementing architectural improvements for long-form chat scalability. Significant work
    was also completed on a refreshed landing page experience and AI model support for Claude 5 and Kimi K3. All updates are
    currently in development.
  released_changes: []
  bug_fixes:
  - text: Draft and sync reliability was improved, specifically addressing IdeaBucket draft resurrection and PDF draft persistence
      during stale echoes.
    evidence:
      commits:
      - c4b87d47e
      - 6a03b4462
      - 9792d6eb5
      - 8bd192e11
    release_status: dev_only
  - text: The chat sidebar now correctly derives titles from message content and maintains visibility when creating new chats
      or re-logging.
    evidence:
      commits:
      - 1f493fe13
      - e7b436847
      - ed26154b9
      - 1ff2fc4f3
    release_status: dev_only
  - text: Mobile UI issues were resolved, including chat header overlaps, text color visibility, and light mode contrast refinements.
    evidence:
      commits:
      - e2ad3c607
      - c56690b4a
      - 9a7c50e2c
      - 50dd85487
    release_status: dev_only
  - text: Ordering logic for interactive questions was corrected for both owner and shared chat views.
    evidence:
      commits:
      - e2b3ff655
      - c942992b9
    release_status: dev_only
  - text: Security and payment logic was updated to prevent duplicate bank transfer credits and ensure password-first authentication
      after late capability loads.
    evidence:
      commits:
      - 3393a6604
      - 4edd4504e
    release_status: dev_only
  - text: Background chat synchronization was hardened to handle recovery of assistant batches and ensure monotonic message
      versioning.
    evidence:
      commits:
      - a58923726
      - 2a94bd712
      - 1175576cb
      - 41b050aa6
    release_status: dev_only
  - text: The guest experience was stabilized with fixes for example chat visibility, landing carousel signup paths, and intro
      layout consistency.
    evidence:
      commits:
      - 3bc4a92c2
      - 31568ca3c
      - e22a52280
      - ff50851e3
    release_status: dev_only
  - text: UI stability fixes addressed chat header action visibility and dark mode contrast for interactive questions.
    evidence:
      commits:
      - 1111fd6c1
      - 7188a515c
      - ecb248817
      - 5ca82806c
    release_status: dev_only
  unreleased_progress:
  - text: The Finance app now supports Revolut Business OAuth connections, sheet embed inputs, and a new skill for checking
      account balances with dedicated UI embeds.
    evidence:
      commits:
      - 0a22b55b3
      - f9d191ce8
      - d9e2ffc15
      - c054faf5a
      - 52f131ec4
    release_status: dev_only
  - text: Audio recording now features waveform visualizations, animated progress previews, and generated transcript titles.
    evidence:
      commits:
      - 5d3b82f7d
      - c8ea7d0ef
      - 23d0bdf28
      - 6f1242343
    release_status: dev_only
  - text: OpenMates added bounded message windows and history compression to support scalable long-form chats across the web
      app and CLI.
    evidence:
      commits:
      - c79041d73
      - 98540c641
      - '164776556'
      - 2506eeb1e
      - 63b66e60f
    release_status: dev_only
  - text: A refreshed landing page intro was implemented with expanded animations and optimized layouts for mobile and iPad
      landscape orientations.
    evidence:
      commits:
      - 5d55e594b
      - ad5b60b91
      - b33846293
      - d51aeb67a
      - 35eb37aa4
    release_status: dev_only
  - text: AI capabilities were expanded with support for Claude 5 and Kimi K3 models, alongside refined Gemini model routing.
    evidence:
      commits:
      - 3ac124ad0
      - 9786a5f52
      - d8cf2defc
    release_status: dev_only
  - text: A new Code skill enables generating HTML directly from images, with improved preview rendering and fullscreen routing.
    evidence:
      commits:
      - 577b0bec3
      - 6edac50aa
      - 07fb53f57
    release_status: dev_only
  - text: A new chat settings page was added, featuring tab synchronization with routes and read-only views for shared chat
      guests.
    evidence:
      commits:
      - a05c760b4
      - 502629ed4
      - 89cabe170
      - e1a4bb0d5
    release_status: dev_only
  - text: OpenMates added a feature to remember forgotten message drafts, ensuring user input is preserved across sessions.
    evidence:
      commits:
      - 40033c66c
      - 0fa5b82b2
    release_status: dev_only
  - text: Development continued on the task queue system, adding auto-continuation, event persistence, and improved determinism
      for task creation (currently unreleased).
    evidence:
      commits:
      - dfe30cbc0
      - dcc2a4bdc
