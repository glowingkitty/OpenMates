llm_summary:
  overview: OpenMates introduced a sophisticated four-tier AI routing system and integrated Gemini voice calling with real-time
    visualization. The project also expanded its business utility with trademark and brand naming tools, while a major performance
    suite significantly reduced chat latency across all interfaces. Quality work focused on deep research reliability, historical
    data recovery, and mobile UX refinements for the Jobs and Wikipedia learning modes.
  released_changes:
  - text: OpenMates added a complexity-based routing system that classifies AI requests into four levels to optimize model
      selection.
    evidence:
      commits:
      - cdfd1c233
    release_status: released_main
  - text: Integrated Gemini voice calling was introduced, featuring real-time waveform visualization and dedicated privacy
      controls.
    evidence:
      commits:
      - c1199371a
      - 4a088fd84
    release_status: released_main
  - text: A suite of business tools for keyless trademark searching and brand naming was published alongside a verified evidence
      policy.
    evidence:
      commits:
      - 5df803768
      - 955bf1e0e
    release_status: released_main
  - text: The Jobs app was expanded to support country-scoped searches and new impact boards for result visualization.
    evidence:
      commits:
      - c5ef75c5a
    release_status: released_main
  - text: Diagram Design now supports interactive HTML embeds that allow for direct editing.
    evidence:
      commits:
      - b5d620756
    release_status: released_main
  - text: A comprehensive performance suite reduced chat admission and first-text latency by overlapping context preparation
      and streamlining model dispatch.
    evidence:
      commits:
      - b57dadf12
      - eb0af3a86
      - 149dc6000
      - 58a36dee0
      - 3d64cfe15
      - 94d03b1aa
    release_status: released_main
  - text: Support for Gemini 4 Argon was added, including temporary provider pricing visibility within AI settings.
    evidence:
      commits:
      - d4b17f43a
    release_status: released_main
  - text: The public landing page was refined with updated device media, improved section replays, and enlarged mobile hero
      elements.
    evidence:
      commits:
      - e3b567b7c
      - 25b605ad5
      - 70762ff19
    release_status: released_main
  bug_fixes:
  - text: Deep research reliability was improved by enforcing source verification before final synthesis and correcting the
      orchestration of turn-based research phases.
    evidence:
      commits:
      - afdbb2469
      - 18df57f17
      - aa19551b7
    release_status: released_main
  - text: Historical image previews and guest artifacts are now more reliably recovered across sessions and discovery pages.
    evidence:
      commits:
      - 6b5e7a617
      - '702216613'
      - d72195d38
      - 428df4265
    release_status: released_main
  - text: Wikipedia learning mode received several UI corrections, including safer fullscreen image error handling, improved
      source attribution placement, and better alignment of related article cards.
    evidence:
      commits:
      - 223851ed8
      - d8f2ad251
      - e3f725a2a
      - 0ff1de620
    release_status: released_main
  - text: Account retirement processes now use complete scoped reads to ensure thorough data cleanup during deletion.
    evidence:
      commits:
      - bf206cae6
    release_status: released_main
  - text: Newsletter delivery infrastructure was hardened to prevent test email bounces and ensure reliable asset publication
      using verified S3 images.
    evidence:
      commits:
      - c10e365b0
      - 40a081c02
      - 143abde73
    release_status: released_main
  - text: The chat composer now automatically receives focus before immediate typing to prevent lost keystrokes.
    evidence:
      commits:
      - df30b9160
    release_status: released_main
  - text: Jobs search results now maintain readability on mobile devices and provide accurate city filters and ranking warnings.
    evidence:
      commits:
      - 579a1660b
      - 79b3cfd17
    release_status: released_main
  - text: Sub-chat metadata persistence was improved by implementing edit guards and concise recovery tasks.
    evidence:
      commits:
      - 2314a23cf
    release_status: released_main
  unreleased_progress:
  - text: Development of the Workflows platform continued with progress on recurring scheduling, guest workspace restoration,
      and service hardening.
    evidence:
      commits:
      - 61351a30b
      - ed24a2fe2
      - f7efbf5d4
      - 98ba8d2d0
      - d8bef5a14
      - cb1a4e054
      - 5e92c48b1
      - d35cef0f3
    release_status: released_main
  - text: Project-related work focused on batched routing discovery, overlapping setup phases, and preserving read access
      when edits are prohibited.
    evidence:
      commits:
      - fa6b90c54
      - ab78d61bb
      - 0d7822dd0
      - a9e3e575a
      - 6eec78025
      - 52ecee1c6
    release_status: released_main
  - text: Native parity for Apple platforms was improved with updates to offline storage and guest entry flows for iOS and
      macOS.
    evidence:
      commits:
      - df80a02f4
    release_status: released_main
  - text: Landing page refinements and app wheel interactions involving Life Coaching remain in development.
    evidence:
      commits:
      - 486e46d00
      - 310a9071a
    release_status: released_main
  - text: Text skill completion within the same assistant turn was improved, including updates for 3D model generation.
    evidence:
      commits:
      - 80e523cee
    release_status: released_main
  - text: Voice chat refinements include polished behavior for production logins, canonical history preservation, and shared
      notice reuse.
    evidence:
      commits:
      - 17ad6f601
      - 1e8701814
      - 8b650fb51
      - 68d0d5d86
      - 83ecbca3e
    release_status: dev_only
  - text: Chat recovery work continues, focusing on encrypted output recovery, Unicode preservation in anonymous streams,
      and identity preservation across generated media.
    evidence:
      commits:
      - 9f28425d5
      - '572917329'
      - ec6b92911
      - 58850e959
    release_status: dev_only
  internal_progress:
  - text: CI performance was optimized by reusing verified backend runtimes for isolated test probes and narrow E2E checks.
    evidence:
      commits:
      - 7fa2f4dad
      - 2f401bc6e
    release_status: released_main
  - text: Integration dependency management was refined to reuse exact prepared dependencies and scope them to affected workspaces.
    evidence:
      commits:
      - cbbda747b
      - 7e02c294a
    release_status: released_main
  - text: The main branch was synchronized into the development branch to preserve production recovery fixes.
    evidence:
      commits:
      - ad50be914
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: OpenMates now routes AI requests through four distinct complexity levels to ensure the most appropriate model
        is used for every task.
      evidence:
        commits:
        - cdfd1c233
      reason: Significant user-facing AI capability update that optimizes response quality.
    - text: Integrated Gemini voice calling is now available directly within the chat interface, featuring real-time waveform
        visualization and privacy controls.
      evidence:
        commits:
        - c1199371a
        - 4a088fd84
      reason: Major new multimodal capability allowing seamless transition from text to voice.
    - text: A new suite of business tools was added, including keyless trademark searching and concise brand naming focus
        modes.
      evidence:
        commits:
        - 5df803768
        - 955bf1e0e
      reason: Introduces significant new utility for business users and entrepreneurs.
    - text: Chat latency was significantly reduced through a suite of optimizations that overlap context preparation with
        admission and streamline model dispatch.
      evidence:
        commits:
        - b57dadf12
        - eb0af3a86
        - 149dc6000
        - 58a36dee0
        - 3d64cfe15
        - 94d03b1aa
      reason: Comprehensive performance overhaul that directly improves the user experience.
    - text: The Jobs app now supports country-scoped searches and includes impact boards for better result visualization.
      evidence:
        commits:
        - c5ef75c5a
      reason: Significant expansion of the Jobs app functionality.
    - text: Diagram Design now supports interactive HTML embeds that allow for direct editing within the interface.
      evidence:
        commits:
        - b5d620756
      reason: Provides a new interactive way to view and edit diagrams.
    exclude:
    - text: Workflow scheduling, guest workspace restoration, and service hardening.
      evidence:
        commits:
        - 61351a30b
        - ed24a2fe2
        - f7efbf5d4
        - 98ba8d2d0
        - d8bef5a14
        - cb1a4e054
        - 5e92c48b1
        - d35cef0f3
      reason: Workflows is currently a disabled feature.
    - text: Project routing discovery and read/edit access logic.
      evidence:
        commits:
        - fa6b90c54
        - ab78d61bb
        - 0d7822dd0
        - a9e3e575a
        - 6eec78025
        - 52ecee1c6
      reason: Projects is currently a disabled feature.
    - text: Apple native parity and offline storage improvements.
      evidence:
        commits:
