llm_summary:
  overview: OpenMates expanded its core AI and hosting capabilities this week, introducing support for the GPT-6.1 Sol model
    and ElevenLabs v4 speech models. The chat composer was enhanced with the ability to search saved and recent embeds, while
    the Hosting app added Gandi domain search integration. Significant effort was also directed toward security hardening
    for signups and account management, alongside extensive infrastructure work to support upcoming agentic storage and workflow
    features.
  released_changes:
  - text: Support for the GPT-6.1 Sol model was added across the backend and web application.
    evidence:
      commits:
      - 3ce91c097
    release_status: released_main
  - text: The chat composer now supports searching through saved and recent embeds for faster context retrieval.
    evidence:
      commits:
      - b0c9e12ae
    release_status: released_main
  - text: Support for ElevenLabs v4 speech models has been added to the audio service.
    evidence:
      commits:
      - bc0615e12
    release_status: released_main
  - text: Gandi domain search was integrated into the Hosting APIs, allowing users to check domain availability directly.
    evidence:
      commits:
      - 76b0f34b3
    release_status: released_main
  - text: Guest users can now view their daily usage allowance percentage for better visibility into free limits.
    evidence:
      commits:
      - 1ad45d47d
    release_status: released_main
  - text: Independent Apple Watch push targets can now be registered to improve notification reliability on wearables.
    evidence:
      commits:
      - 0b8108f0d
    release_status: released_main
  - text: The CLI now supports searching project filenames and connecting explicit project sources without a full repository
      scan.
    evidence:
      commits:
      - 0e018935a
      - 97724fa62
    release_status: released_main
  - text: Inline ratio formulas are now correctly rendered within chat messages.
    evidence:
      commits:
      - a1307f66e
    release_status: released_main
  bug_fixes:
  - text: Chat reliability was significantly improved by implementing recovery for failed assistant replies and automated
      alerts for failed chat turns.
    evidence:
      commits:
      - 5090e8bf6
    release_status: released_main
  - text: Security for passkey signups and account deletions was hardened by requiring email proof and password verification.
    evidence:
      commits:
      - e01bcb25b
      - df462e81b
      - e2c6e21ff
    release_status: released_main
  - text: AI model responses are now better grounded in the current catalogue and include core capabilities in recent model
      contexts to ensure accuracy.
    evidence:
      commits:
      - 9d4b5d952
      - a1b291ddd
      - beaab0d62
      - 64c5311b1
    release_status: released_main
  - text: Synchronization of draft messages across different web clients was repaired, and stale draft shells were removed.
    evidence:
      commits:
      - df03ac082
      - cd70270b6
    release_status: released_main
  - text: A regression was fixed where mobile header controls were hidden for signed-out users.
    evidence:
      commits:
      - dacd8ad51
    release_status: released_main
  - text: Automatic assistant speech playback functionality was restored for a smoother voice experience.
    evidence:
      commits:
      - cf7c426b3
    release_status: released_main
  - text: Security vulnerabilities in core JavaScript, Rust, and Python dependencies were patched to ensure platform safety.
    evidence:
      commits:
      - b4b3ac9ae
      - 33030e4fe
    release_status: released_main
  - text: The login process now accepts formatted authenticator codes, improving compatibility with various TOTP applications.
    evidence:
      commits:
      - e6ca3b324
    release_status: released_main
  - text: Location search terms are now correctly preserved when transitioning from the search view to the map view.
    evidence:
      commits:
      - 51945cc96
    release_status: released_main
  unreleased_progress:
  - text: The Workflows platform advanced with AI-driven authoring, YAML import/export, and website change monitoring capabilities.
    evidence:
      commits:
      - 752a8b0d9
      - e915c0960
      - ad0b9a300
      - dcd4511ae
    release_status: released_main
  - text: Projects and Tasks modules received updates for file paging, cross-project search, and persistent drag-and-drop
      support.
    evidence:
      commits:
      - 77777e887
      - d1fe714c1
      - 61bde4b89
    release_status: released_main
  - text: Development of native Apple apps continued with session recovery, Watch workspace editing, and an optional local
      model lab.
    evidence:
      commits:
      - 98692d909
      - 5a82de326
      - 281d1f38c
      - e97f14609
    release_status: released_main
  - text: Optional offline personal data anonymization was added to the CLI to enhance local-first privacy.
    evidence:
      commits:
      - 2cba8048c
      - 79df9340f
    release_status: dev_only
  - text: The terminal interface (CLI) was updated with centered carousels and sidebar navigation to achieve parity with the
      web app.
    evidence:
      commits:
      - b0083825e
      - 449ea5f81
    release_status: dev_only
  - text: Phased focus modes were introduced, featuring encrypted progress tracking across productivity stages.
    evidence:
      commits:
      - a314f9054
      - 3d43c3d53
    release_status: dev_only
  - text: Infrastructure for bounded agentic storage and durable recovery was implemented to improve reliability for long-running
      AI tasks.
    evidence:
      commits:
      - 1e7b84c33
      - 8addcd723
    release_status: dev_only
  internal_progress:
  - text: CI infrastructure was stabilized by persisting the coordinator across reboots and increasing capacity for isolated
      test jobs to ten concurrent instances.
    evidence:
      commits:
      - b33c1e6da
      - c5f04a4e8
      - 9a24676ab
    release_status: released_main
  - text: The CI environment was updated to support isolated signup testing with local email inboxes and disposable invite
      codes.
    evidence:
      commits:
      - 7fd2f96b7
      - 1559fc113
      - e86b80a32
    release_status: released_main
  - text: Automated archiving and cleanup for inactive development worktrees were implemented to maintain infrastructure health.
    evidence:
      commits:
      - fd8fbe1f8
      - ac12dcd41
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: Support for the GPT-6.1 Sol model.
      evidence:
        commits:
        - 3ce91c097
      reason: Adds support for a major new AI model.
    - text: Search saved and recent embeds directly from the composer.
      evidence:
        commits:
        - b0c9e12ae
      reason: Introduces a significant new search capability in the chat composer.
    - text: Support for ElevenLabs v4 speech models.
      evidence:
        commits:
        - bc0615e12
      reason: New high-quality speech models are available for immediate use.
    - text: Domain name searching via Gandi integration in the Hosting app.
      evidence:
        commits:
        - 76b0f34b3
      reason: Introduces a concrete new capability for the released Hosting app.
    - text: Guest daily usage allowance percentage indicator.
      evidence:
        commits:
        - 1ad45d47d
      reason: Provides transparency for guest users regarding their usage limits.
    - text: Independent Apple Watch push target registration.
      evidence:
        commits:
        - 0b8108f0d
      reason: Enables improved notification reliability for wearable devices.
    exclude:
    - text: AI workflow authoring, YAML import/export, and website monitoring.
      evidence:
        commits:
        - 752a8b0d9
        - e915c0960
        - ad0b9a300
        - dcd4511ae
      reason: The Workflows platform is currently disabled in feature availability.
    - text: Project file paging, cross-project search, and task drag-and-drop improvements.
      evidence:
        commits:
        - 77777e887
        - d1fe714c1
        - 61bde4b89
      reason: Projects and Tasks are currently disabled in feature availability.
    - text: Native Apple app session recovery, local model lab, and offline speech stability.
      evidence:
        commits:
        - 98692d909
        - 5a82de326
        - 281d1f38c
        - e97f14609
      reason: Native Apple platforms (iOS, macOS, Watch) are currently disabled in feature availability.
    rationale: The newsletter highlights major user-facing features like GPT-6.1 Sol support, composer search enhancements,
      and new speech models, while strictly excluding work on features currently disabled in the production environment such
      as Workflows, Projects, and native Apple apps.
  social_video_recommendations:
  - idea: A walkthrough of the new GPT-6.1 Sol model capabilities combined with the new composer search for saved embeds.
    priority: high
    reason: Combines a major model release with a significant UI improvement.
    evidence:
      commits:
      - 3ce91c097
      - b0c9e12ae
  - idea: Demonstrate the new ElevenLabs v4 speech models in action.
    priority: high
    reason: New high-quality voice models provide a clear, audible product improvement that is easy to showcase.
    evidence:
      commits:
      - bc0615e12
  - idea: Demonstrate finding a new project domain using the Gandi search skill.
    priority: medium
    reason: Concrete new utility that is easy to visualize in a short clip.
    evidence:
      commits:
      - 76b0f34b3
  quality_notes:
  - Extensive testing infrastructure was added to verify signup and authentication flows in isolated environments.
  - A high volume of work on Apple platform parity and offline capabilities indicates a push toward mobile readiness, though
    these remain unreleased.
  - Privacy remains a priority with updates specifically targeting the protection of PII during project file execution in
    development environments.
  validation_warnings: []
