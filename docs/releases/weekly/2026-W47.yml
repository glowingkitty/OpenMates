llm_summary:
  overview: OpenMates introduced significant enhancements to Travel and Shopping capabilities while completing a major architectural
    migration of core web and voice logic to a Rust-based core. The update also refined AI routing with Gemini Decision 1,
    improved the reliability of collaborative web form filling, and introduced a more compact composer draft view.
  released_changes:
  - text: The shopping experience now includes a price comparison engine that aggregates total costs (including shipping)
      across providers, with results presented as clickable offer links.
    evidence:
      commits:
      - e56212be24
      - 12e49db929
      - '3345264306'
    release_status: released_main
  - text: OpenMates added support for mixed travel routes, allowing the system to compose trips using owned passes and ticket
      segments to find better fares.
    evidence:
      commits:
      - 5c86344ff5
      - ae4f552e5c
    release_status: released_main
  - text: The web application and voice turn construction now utilize a Rust-based core for managing socket chat frames, paging
      history, draft saves, and cryptography.
    evidence:
      commits:
      - b8805f01cc
      - 48cc55dd80
