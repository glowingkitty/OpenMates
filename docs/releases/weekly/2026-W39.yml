      reason: Support for these models is currently gated behind unreleased platform updates.
    rationale: The launch of the public newsroom, the production enablement of Workflows, and the significant expansion of
      search relevance via Jev represent the most impactful updates for users this week. Technical updates for disabled platforms
      (Apple, Projects) are excluded to maintain focus on available features.
