llm_summary:
  overview: OpenMates reached several major milestones this week, most notably the production enablement of Workflows and
    the launch of a public newsroom and social archive. The project also introduced 'Jev' decision processing and expanded
    search relevance ranking across multiple domains, while upgrading its AI core to use Gemini 3.8 Flash for more efficient
    routing. Additional focus was placed on audio efficiency with on-demand speech generation and significant UI refinements
    to the workflow builder and publication experience.
  released_changes:
  - text: OpenMates launched a public newsroom and social archives, featuring a design-aligned interface for project announcements.
    evidence:
      commits:
      - c6c58de28
      - fda913a70
    release_status: released_main
  - text: Workflows are now enabled in the production configuration, allowing users to build and execute automated AI steps.
    evidence:
      commits:
      - 3933ffcbf
    release_status: released_main
  - text: The AI engine now utilizes Gemini 3.8 Flash for automatic model routing, improving processing speed and selection
      logic.
    evidence:
      commits:
      - d88d76bf6
    release_status: released_main
  - text: Jev decision processing and model-aware routing were introduced to improve AI handling of long-form conversations.
    evidence:
      commits:
      - cfdbda23a
      - b8dc581d0
    release_status: released_main
  - text: Search relevance ranking (Jev) was expanded across events, fitness, maps, shopping, travel, and video domains.
    evidence:
      commits:
      - 72bdd153a
      - e28e7f4bf
      - 8f38587d2
    release_status: released_main
  - text: Assistant speech generation transitioned to a demand-driven model, producing audio only when playback is initiated.
    evidence:
      commits:
      - a8c379909
    release_status: released_main
  - text: Relevance-based ranking is now active for repository and 3D model searches, replacing chronological or unranked
      results.
    evidence:
      commits:
      - 24c49f1b6
    release_status: released_main
  - text: The AI system now preserves artifacts across chat compression, ensuring context remains available in extended sessions.
    evidence:
      commits:
      - 94ea315d5
    release_status: released_main
  - text: A new illustrated blog series on agentic coding was launched alongside refinements to the public reading experience.
    evidence:
      commits:
      - b8d87173f
      - 0af9760d0
    release_status: released_main
  bug_fixes:
  - text: The message composer now adopts saved drafts instantly without requiring a page reload.
    evidence:
      commits:
      - 980044f9a
    release_status: released_main
  - text: Issue reporting was hardened to ensure reports are durable and provide actionable diagnostics.
    evidence:
      commits:
      - f2fbe5fbb
    release_status: released_main
  - text: AI context management was improved by capping main inference at 200k tokens to maintain performance.
    evidence:
      commits:
      - 680b6f39c
    release_status: released_main
  - text: The settings dashboard now displays every billed usage entry to provide full transparency into account activity.
    evidence:
      commits:
      - 4355eb51a
    release_status: released_main
  - text: AI news research was refined to correctly count clipped requests and execute searches up to the research limit.
    evidence:
      commits:
      - f7499b9fe
      - 83e022a41
    release_status: released_main
  - text: Chat reliability was enhanced with better handling for Gemini tool limits and protocol-guard recovery for zero-text
      turns.
    evidence:
      commits:
      - 3e55f4aad
      - cbf3b7180
    release_status: released_main
  - text: The workflow builder received extensive UI refinements, including improved field alignment, table columns, and editor
      group layouts.
    evidence:
      commits:
      - acd69a69a
      - 69dd07812
      - 1d7fa4ce3
      - 92d2c63fe
      - b5d454d04
    release_status: released_main
  - text: Chat failure recovery was improved, specifically preserving provider affinity for Gemini models during session restoration.
    evidence:
      commits:
      - 124d8c18f
    release_status: released_main
  - text: Publication navigation and loading were optimized, including the addition of a fallback UI for optimized images.
    evidence:
      commits:
      - 0c78b960c
      - 91853cfcf
    release_status: released_main
  unreleased_progress:
  - text: Extensive parity work continued for unreleased Apple platforms (iOS, macOS, and Apple Watch), including audio recording,
      chat synchronization, and UI alignment.
    evidence:
      commits:
      - 3463965d6
      - c7613b4bd
      - 23d638b51
