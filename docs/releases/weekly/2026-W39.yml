      reason: Workflows have been enabled in the production configuration and are ready for public use.
    - text: Introduction of Jev decision processing and expanded search relevance ranking.
      evidence:
        commits:
        - cfdbda23a
        - b8dc581d0
        - 72bdd153a
        - e28e7f4bf
        - 8f38587d2
      reason: Significant architectural update to AI decision making and search quality across all domains.
    - text: Integration of Gemini 3.8 Flash for faster, automatic model routing.
      evidence:
        commits:
        - d88d76bf6
      reason: Significant performance and intelligence upgrade for AI interactions.
    - text: On-demand assistant speech generation during playback.
      evidence:
        commits:
        - a8c379909
      reason: Improves efficiency and provides a more demand-driven audio experience.
    exclude:
    - text: Apple platform parity updates.
      evidence:
