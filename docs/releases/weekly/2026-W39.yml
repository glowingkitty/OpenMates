      - 7160debf6
      - 0bb337ef3
      - 72943fb3c
      - 24b07c442
      - eca1d63a0
      - 4143ddc6e
      - b7d52a746
    release_status: released_main
  - text: Development of agentic coding features for Projects and Tasks advanced, focusing on file operations, remote commands,
      and design alignment.
    evidence:
      commits:
      - 66a757619
      - 5fe487f43
      - cb91352c6
      - 201f98cbd
    release_status: released_main
  - text: Internal support was added for GPT-6 Sol, Luna, and Claude Opus 5.5 models.
    evidence:
      commits:
      - 9f3b6921f
    release_status: released_main
  - text: AI-powered checks and 'Ask AI' steps were integrated into the workflows platform.
    evidence:
      commits:
      - 05fc991f3
    release_status: released_main
  - text: Implementation of anonymous usage budget enforcement and skill limit policies is underway.
    evidence:
      commits:
      - 3c2800021
    release_status: released_main
  - text: Planning for a transition to online community meetups and a scheduled community hour for October 27, 2026.
    evidence:
      commits:
      - f4882d4ab
    release_status: dev_only
  - text: The Suki and Welcome mates are being retired across clients as part of onboarding updates.
    evidence:
      commits:
      - 95bb565b1
    release_status: released_main
  internal_progress:
  - text: Internal infrastructure updates focused on CI build efficiency, isolated test environments, and PDF generation for
      specification approvals.
    evidence:
      commits:
      - 99c6ab220
      - 4192ea708
