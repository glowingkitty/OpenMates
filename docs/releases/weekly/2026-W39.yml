    release_status: released_main
  - text: Telemetry processing was hardened to prevent blank container logs from rejecting batches.
    evidence:
      commits:
      - dcfa1a495
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: Launch of the public newsroom and social archives.
      evidence:
        commits:
        - c6c58de28
        - fda913a70
      reason: Major new user-facing feature for community engagement and project updates.
    - text: Official production release of Workflows.
      evidence:
        commits:
