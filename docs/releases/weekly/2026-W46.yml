llm_summary:
  overview: OpenMates delivered a transformative update this week, headlined by the migration of six major web subsystems
    to a shared Rust core, significantly boosting performance and cross-platform consistency. The project introduced advanced
    creative tools, including a new SVG generation engine and an embroidery skill for machine-ready design. Productivity was
    enhanced through a manual slides editor, Web Browsing V2 with live tracking, and the addition of the Gemini 4 Carbon model.
    Furthermore, the Memory system received a critical privacy update, utilizing client-side placeholders to mask sensitive
    details before AI transmission.
  released_changes:
  - text: OpenMates added a script engine and reviewed LLM vector author to support direct SVG generation and modification
      with progressive rendering.
    evidence:
      commits:
      - 9cd90bd077
      - c27b7248ce
      - 9deb5631c2
    release_status: released_main
  - text: A new embroidery skill converts vector graphics to machine files, featuring sewing estimates, satin band textures,
      and light thread previews.
    evidence:
      commits:
      - 2b64dbec67
      - 751a56d90e
      - aa1f0308b3
      - 3fab01e191
    release_status: released_main
  - text: A manual slides editor is now available on the web, featuring server-side versioning, a presenter view, and diff-based
      editing.
    evidence:
      commits:
      - 44a462aa65
      - 02af2dfda5
      - 520080dcf4
    release_status: released_main
  - text: Video generation now supports full audio composition (voice-over, music, effects) and displays AI-generated badges
      for transparency.
    evidence:
      commits:
      - c67f2375aa
      - 3aa65457d8
      - 4fa1afa530
    release_status: released_main
  - text: Web Browsing V2 launched with a new planning engine, batched steps, and a live progress view for increased transparency.
    evidence:
      commits:
      - 343757a432
    release_status: released_main
  - text: Gemini 4 Carbon was added as a selectable model with introductory pricing and implicit caching.
    evidence:
      commits:
      - 2980c7bc0f
    release_status: released_main
  - text: The Memory system now masks sensitive details with client-side placeholders and supports 'Ask first' controls for
      project-bound data.
    evidence:
      commits:
      - c8a17d4380
      - e6a416b33f
    release_status: released_main
  - text: Six major web subsystems, including search, WebSocket management, and IndexedDB caching, were migrated to the shared
      Rust core.
    evidence:
      commits:
      - aabaaf74c9
      - c17164fa5b
      - b6af4d0c38
      - 5dff8a2680
      - e2fde9611d
      - 80d5d8e6c7
    release_status: released_main
  - text: Agentic coding results now include integrated video playback for test runs and improved dependency management.
    evidence:
      commits:
      - 912a4b2f67
      - 437aa3714b
    release_status: released_main
  - text: Business tools were expanded with investor search, company ownership registers, and specialized fundraising focus
      modes.
    evidence:
      commits:
      - 0a0cafff32
      - 7367cdf368
    release_status: released_main
  bug_fixes:
  - text: The web application now utilizes progressive rendering for SVG and HTML embeds, ensuring visuals draw line-by-line
      during generation without flicker.
    evidence:
      commits:
      - 47e91ae77d
      - f4a317825e
    release_status: released_main
  - text: The image Enhance feature was corrected to display updated versions immediately and properly position AI-generated
      badges in fullscreen mode.
    evidence:
      commits:
      - b030125399
      - 105ef9b1f0
    release_status: released_main
  - text: Job search focus modes were refined to treat privacy placeholders as real values and apply correct relevance ranking
      across multiple sources.
    evidence:
      commits:
      - fb934cdabe
      - 2b793ea558
    release_status: released_main
  - text: Embroidery design logic was hardened to ensure uploaded SVGs are sewn at requested widths without unnecessary model
      adjustments.
    evidence:
      commits:
      - e13486f130
      - 1cf3262c1c
      - edca0a3641
    release_status: released_main
  - text: Performance improvements were made to long chat timelines and oversized message handling when the Rust client core
      is active.
    evidence:
      commits:
      - b8b83bbba0
      - 58ebd0d138
    release_status: released_main
  - text: Voice call reliability was improved by ensuring turns continue after memory approvals and utilizing neutral system
      voices for new chat starts.
    evidence:
      commits:
      - 264bb294db
      - 21372775f6
    release_status: released_main
  - text: Deleting a chat now correctly frees its AI context slot, preventing subsequent chat requests from being refused.
    evidence:
      commits:
      - 564926cf30
    release_status: released_main
  - text: AI billing logic was updated to round token prices for readability and provide safer fallbacks for expired cache
      tariffs.
    evidence:
      commits:
      - 28caef682d
      - 005a2524d6
    release_status: released_main
  unreleased_progress:
  - text: Extensive development on Apple platform parity, including Swift bindings, encrypted caching, camera video, and iOS
      screen sharing.
    evidence:
      commits:
      - 3d1c5cf4e1
      - 5ec99227f1
      - 4b22f44efe
      - d8df401b19
      - 1edd845356
      - c437a29014
      - 4edb4e4e40
    release_status: released_main
  - text: A new specification-driven workflow for the Plans app allows ideas to be turned into approved specifications before
      execution begins.
    evidence:
      commits:
      - d95e2b13b3
      - 7cd5137f94
      - 1dc21f1e46
      - bcc675dd5e
      - 6ab021e497
      - 557cf56fd6
    release_status: released_main
  - text: Project management expansion includes a Timeline tab for commit restoration and support for assistant file jobs
      on remote machine folders.
    evidence:
      commits:
      - a1174eb203
      - 12e0af807a
      - 4d3ef58b29
      - d3e6e0a27e
      - 583c4994e1
      - b86778d65d
      - e492935f83
    release_status: released_main
  - text: Work on Chat Recommendations to replace quick tips with memory and workflow-aware suggestions remains unreleased.
    evidence:
      commits:
      - 3e051ecb01
      - 5ef4cbd24e
      - c912cb6747
    release_status: released_main
  - text: Support for Figma connected accounts and Google Calendar skill hardening is in development for design-to-code hand-off.
    evidence:
      commits:
      - 0f1cea2b70
    release_status: released_main
  - text: Event search is being updated to support usage-based billing and indexing of public web pages.
    evidence:
      commits:
      - d114c85b2b
      - 722732024d
    release_status: released_main
  - text: New orchestration features are in development to allow chats to coordinate other main chats and maintain continuity
      across voice and text.
    evidence:
      commits:
      - e835939a16
      - c88dd5f969
      - dd50cc1235
    release_status: released_main
  internal_progress:
  - text: Infrastructure now supports automatic overflow of end-to-end test jobs to E2B runners to manage host memory pressure.
    evidence:
      commits:
      - aaedbc166b
      - 8b27e67835
      - 934dbb9106
    release_status: dev_only
  - text: OpenMates established an external uptime monitor and public status page infrastructure using UpCloud and automated
      Vault setup.
    evidence:
      commits:
      - 75e7864c4a
      - 2b791c3bb1
      - be41eb4aef
    release_status: dev_only
  - text: The image safety pipeline was upgraded to prioritize Jev classification for prompts and images with Sightengine
      as a secondary safeguard.
    evidence:
      commits:
      - 125aef061f
      - 72572a6d8e
      - 2e5832eaf1
    release_status: dev_only
  - text: Latency optimizations introduced explicit Gemini context caching for AI Studio requests and pipelined safety checks
      for voice interactions.
    evidence:
      commits:
      - fea9afef0c
      - 4e214b9f90
      - f7483a0b18
    release_status: dev_only
  newsletter_recommendation:
    include:
    - text: Advanced SVG generation engine and vector authoring tools.
      evidence:
        commits:
        - 9cd90bd077
        - c27b7248ce
        - 9deb5631c2
      reason: Significant new user-facing capability for generating and modifying vector graphics with progressive rendering.
    - text: New embroidery skill for converting vector graphics to machine-ready files.
      evidence:
        commits:
        - 2b64dbec67
        - 751a56d90e
        - aa1f0308b3
      reason: Major new creative capability allowing users to interface with real-world embroidery hardware.
    - text: Manual slides editor on the web featuring a dedicated presenter view.
      evidence:
        commits:
        - 44a462aa65
        - 02af2dfda5
        - 520080dcf4
      reason: Major productivity enhancement for the web platform with server-side versioning.
    - text: Composed video generation with voice-over, sound effects, and music.
      evidence:
        commits:
        - c67f2375aa
        - 3aa65457d8
      reason: Major functional upgrade to the video generation suite adding full audio composition.
    - text: Web Browsing V2 with batched steps and a live progress view.
      evidence:
        commits:
        - 343757a432
      reason: Significant performance and transparency overhaul for the web browsing tool.
    - text: Gemini 4 Carbon model availability with introductory pricing.
      evidence:
        commits:
        - 2980c7bc0f
      reason: New high-performance model availability for explicit user selection.
    - text: Privacy-centric Memory updates using client-side placeholders.
      evidence:
        commits:
        - c8a17d4380
      reason: Core privacy improvement for the Memory feature ensuring sensitive data is masked.
    - text: Migration of six major web subsystems to the high-performance Rust core.
      evidence:
        commits:
        - aabaaf74c9
        - c17164fa5b
        - b6af4d0c38
        - 5dff8a2680
        - e2fde9611d
        - 80d5d8e6c7
      reason: Major architectural milestone improving web application performance and reliability.
    exclude:
    - text: Apple platform parity and native client core migration.
      evidence:
        commits:
        - 3d1c5cf4e1
        - 5ec99227f1
        - 4b22f44efe
        - d8df401b19
      reason: Apple platform support (iOS, macOS, Apple Watch) is currently disabled in feature availability.
    - text: Specification-driven planning workflows and Plans app updates.
      evidence:
        commits:
        - d95e2b13b3
        - 7cd5137f94
        - 1dc21f1e46
      reason: The Plans app and specification-driven workflows are currently disabled features.
    - text: Project Timeline and commit restoration features.
      evidence:
        commits:
        - a1174eb203
        - 12e0af807a
        - 4d3ef58b29
      reason: The Projects app and Timeline functionality are explicitly disabled in the current production configuration.
    - text: Chat Recommendations replacing quick tips.
      evidence:
        commits:
        - 3e051ecb01
      reason: This feature relies on disabled workflow and mobile platforms.
    rationale: The release highlights focus on expanding creative design (SVG, Embroidery), professional productivity (Slides,
      Video Audio), and architectural performance (Rust core migration). Features tied to disabled platforms or apps (Apple,
      Plans, Projects) are excluded.
  social_video_recommendations:
  - idea: A screen recording showing a user asking for a complex SVG icon and watching it draw line-by-line in real-time without
      flicker.
    priority: high
    reason: The progressive rendering of vector graphics is a highly visual update that demonstrates technical sophistication.
    evidence:
      commits:
      - 9cd90bd077
      - 9deb5631c2
      - f4a317825e
  - idea: Show the journey from a simple vector graphic in chat to a physical embroidery design with sewing estimates.
    priority: high
    reason: The embroidery skill is a unique feature demonstrating the assistant's ability to interface with real-world hardware.
    evidence:
      commits:
      - 2b64dbec67
      - 751a56d90e
  - idea: Showcase a composed video being generated from a prompt, highlighting the addition of music and voice-over.
    priority: high
    reason: Full audio composition in video generation is a major product milestone with high auditory appeal.
    evidence:
      commits:
      - c67f2375aa
      - 3aa65457d8
  - idea: Demonstrate an agentic coding turn where the assistant runs a test and the user plays back the resulting video directly
      in the chat.
    priority: medium
    reason: Provides a clear visual demonstration of the agentic coding workflow and integrated media capabilities.
    evidence:
      commits:
      - 912a4b2f67
  quality_notes:
  - The migration of web subsystems to Rust (aabaaf74c9) removes redundant TypeScript logic and ensures behavior parity with
    the CLI.
  - Memory privacy (c8a17d4380) ensures raw sensitive data is never transmitted during AI turns via client-side mapping.
  - Progressive rendering (9deb5631c2) and flicker fixes (47e91ae77d) significantly improve the perceived performance of AI
    code generation.
  - Safety filters were refined to reduce false positives in product searches (8f6ea0de6e) and image generation (208e951e9c).
  validation_warnings: []
