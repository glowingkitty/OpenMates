llm_summary:
  overview: OpenMates achieved a major architectural milestone this week by landing a shared Rust core that now powers the
    npm and Python SDKs, while simultaneously migrating core web services into a high-performance shared worker. User-facing
    updates were headlined by the introduction of live voice dictation, assistant-authored result embeds, and interactive
    HTML visuals. The project also introduced granular AI server region preferences and specialized focus modes for professional
    workflows, alongside significant refinements to mobile event discovery and data table interactivity.
  released_changes:
  - text: The npm and Python SDKs now utilize a shared Rust core via native bindings and WASM, ensuring consistent behavior
      and improved performance.
    evidence:
      commits:
      - c56f31d76e
      - 4ecf9bf7a7
      - 657506743e
    release_status: released_main
  - text: OpenMates added support for streaming voice dictation directly into the message composer editor.
    evidence:
      commits:
      - c5f7cae5d7
    release_status: released_main
  - text: Assistant-authored result embeds were introduced, allowing the AI to generate structured visual components for financial
      data, calendar events, and media titles.
    evidence:
      commits:
      - fd90c824d9
    release_status: released_main
  - text: Code embeds now support live sandboxed interactive HTML visuals for real-time rendering of assistant-generated web
      content.
    evidence:
      commits:
      - b2e821a1d9
    release_status: released_main
  - text: AI model selection now includes server region flags, supporting an EU-first hosting policy and fastest-available
      routing.
    evidence:
      commits:
      - 2d89714338
      - 445a598812
    release_status: released_main
  - text: New focus modes for 'Plan Conference Talk' and 'Price Products' were added to provide specialized assistance for
      these workflows.
    evidence:
      commits:
      - e536c40901
    release_status: released_main
  - text: Event cards were upgraded with server-side geocoding, richer grounded descriptions, and a functional carousel for
      mobile devices.
    evidence:
      commits:
      - 257681f667
      - 4733976b8d
    release_status: released_main
  - text: A new high-performance chat sync feed over WebSocket was introduced, supporting incremental updates and faster cold-starts.
    evidence:
      commits:
      - cb8beb2bae
      - 8c16210575
      - 4c8d41e274
    release_status: released_main
  - text: The web interface now features a compact ranked chat context menu with full parity to the primary action menu.
    evidence:
      commits:
      - 2c4a3bddff
    release_status: released_main
  - text: The SDK root client was restricted to API-key only access to ensure strict isolation from CLI logins.
    evidence:
      commits:
      - 39f78b1dee
    release_status: released_main
  bug_fixes:
  - text: OpenMates refined PII detection to reduce false positives for common interjections and ensured message drafts remain
      open during privacy highlight interactions.
    evidence:
      commits:
      - 3a3d69a2b2
      - 5dec50a9c5
      - 3dc3a8812b
    release_status: released_main
  - text: The message composer now reliably preserves drafts even if AI generation is manually stopped immediately after starting.
    evidence:
      commits:
      - 0109e71b0b
    release_status: released_main
  - text: Sheet embed behavior was corrected to ensure fullscreen views scroll as a single surface and maintain proper header
      row alignment.
    evidence:
      commits:
      - 667adc822c
      - 652a9efb8b
    release_status: released_main
  - text: Voice call reliability was improved through faster speech start times, word-by-word text highlighting, and more
      robust live transcript delivery.
    evidence:
      commits:
      - 29ee7065e3
      - 163e051198
      - 373003d3e9
      - ebd2be8a6e
    release_status: released_main
  - text: Inline math parsing was adjusted to prevent incorrect currency interpretation when numbers are preceded by spaces.
    evidence:
      commits:
      - cc53ef26be
      - 856982889f
    release_status: released_main
  - text: WebSocket session authority now correctly follows refresh-token rotation to prevent refused messages following a
      page reload.
    evidence:
      commits:
      - 376a506462
    release_status: dev_only
  - text: PDF document context, including file indices and Vault keys, is now correctly preserved when specific page lists
      are requested.
    evidence:
      commits:
      - 6fc9fe34b9
    release_status: released_main
  - text: Event search logic was updated to prioritize the next edition of major recurring events before falling back to prose
      descriptions.
    evidence:
      commits:
      - 47ddd574d9
    release_status: released_main
  - text: IndexedDB connections are now closed on version changes to prevent multi-tab logout processes from hanging.
    evidence:
      commits:
      - 2435d69409
    release_status: released_main
  unreleased_progress:
  - text: The Memories system is being overhauled to use a unified format that supports inline embeds and workflow snapshots.
    evidence:
      commits:
      - 1eb03c4acf
      - 67b0f31aa0
      - 77c0b15368
      - 6a2f455b23
      - 6f1f0b3e4c
    release_status: dev_only
  - text: Development progressed on the PDF processing v2 pipeline, featuring per-page triage, chunked OCR, and parallel artifact
      storage.
    evidence:
      commits:
      - c0b488e2ff
      - 0b2c3143ef
      - ebe6b5913c
      - 06dbe1d6ea
      - f21dd2c3ff
    release_status: dev_only
  - text: Learning Mode was updated with an age rubric for content tailoring and a collaborative building toggle.
    evidence:
      commits:
      - 98653a207f
    release_status: dev_only
  - text: Work continued on Workflow decisions, natural language generation, and integrated activity notifications.
    evidence:
      commits:
      - 893028fc40
      - 84ad012ff6
      - 1b32821bf0
    release_status: released_main
  - text: The Rust CLI and shared core added support for project file management and focus settings, pending enablement of
      the Projects platform.
    evidence:
      commits:
      - 849d15fed5
      - de00c342cd
      - 66978be1f3
      - 9d439dc408
    release_status: released_main
  - text: Integration between OpenMates Tasks and Claude Code sessions is in development, awaiting the release of the Tasks
      platform.
    evidence:
      commits:
      - aef49a7d8d
      - 3de6434413
      - 06d7b980ca
    release_status: released_main
  - text: Native Rust CLI commands for team management, billing, and storage were added, awaiting the release of the Teams
      platform.
    evidence:
      commits:
      - a733de0e93
      - 29f542b8f9
      - 14f437bf00
    release_status: released_main
  - text: Core web services including search indexing, chat sync, embed writes, and authentication are being migrated to a
      shared Rust worker.
    evidence:
      commits:
      - 91d85cf9a5
      - 30472ca70c
      - c577ddd944
      - b33404bac9
      - 13c5be3d3f
      - 71f15bd439
      - 1a8270bd35
      - d57ad3867e
    release_status: dev_only
  internal_progress:
  - text: The CI pipeline was consolidated into a single cached Rust pipeline with isolated lanes for building Python and
      WASM SDK artifacts.
    evidence:
      commits:
      - f0c5897604
      - 748a36a31e
      - a3fab1ec34
    release_status: released_main
  - text: Automated security monitoring was implemented, featuring read-only triage and guarded developer auto-fix capabilities.
    evidence:
      commits:
      - 386015de1d
      - 14a6192800
      - b121d0a121
    release_status: released_main
  - text: Internal daily meeting orchestration was expanded to include PDF delivery, Claude usage tracking, and integration
      with Apple Reminders.
    evidence:
      commits:
      - 7a425d5306
      - 3d9007af85
      - 5ac4754fa6
      - f3ed148b34
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: Live voice dictation streaming directly into the message composer.
      evidence:
        commits:
        - c5f7cae5d7
      reason: High-impact user-facing feature for the web composer.
    - text: Assistant-authored result embeds for structured data presentation.
      evidence:
        commits:
        - fd90c824d9
      reason: New capability allowing the assistant to generate structured, visual results for data like finance and events.
    - text: Live sandboxed interactive HTML visuals within code embeds.
      evidence:
        commits:
        - b2e821a1d9
      reason: Enables real-time rendering of assistant-generated web content in a secure environment.
    - text: New AI server region preferences allowing users to choose between EU-default, Fastest, or Global hosting.
      evidence:
        commits:
        - 2d89714338
        - 445a598812
      reason: Significant update to AI model selection and data residency controls.
    - text: Introduced new focus modes for conference planning and product pricing.
      evidence:
        commits:
        - e536c40901
      reason: New user-facing focus modes for specialized professional tasks.
    - text: Enhanced event cards with server-side geocoding, map views, and mobile-friendly carousels.
      evidence:
        commits:
        - 257681f667
        - 4733976b8d
      reason: Major improvement to the event discovery experience, particularly for mobile users.
    exclude:
    - text: Unified Memories and Project Overhaul.
      evidence:
        commits:
        - 1eb03c4acf
        - 67b0f31aa0
        - 77c0b15368
      reason: The unified Memories system and related Project features are currently disabled or marked for development only.
    - text: PDF Processing v2.
      evidence:
        commits:
        - c0b488e2ff
        - 0b2c3143ef
      reason: PDF processing v2 is in active development and restricted to dev_only status.
    - text: Learning Mode updates.
      evidence:
        commits:
        - 98653a207f
      reason: Learning Mode features are currently dev_only and not yet released to the main branch.
    - text: Workflow generation and decision logic.
      evidence:
        commits:
        - 893028fc40
        - 84ad012ff6
      reason: Workflows are currently a disabled feature.
    - text: Native Rust CLI commands for team management.
      evidence:
        commits:
        - a733de0e93
        - 29f542b8f9
        - 14f437bf00
      reason: The Teams platform is currently disabled in feature availability.
    rationale: The week's highlights focus on significant UI enhancements like voice dictation and structured embeds, alongside
      improved user control over AI data residency. Several major initiatives (Memories, PDF v2, Workflows) are excluded as
      they remain disabled or in development.
  social_video_recommendations:
  - idea: A short clip showing a user speaking and seeing the text stream instantly into the OpenMates composer.
    priority: high
    reason: Voice dictation is a highly visible, 'magical' feature that demonstrates product polish.
    evidence:
      commits:
      - c5f7cae5d7
  - idea: Showcase the assistant generating structured result embeds and interactive HTML visuals directly in the chat.
    priority: high
    reason: Visually demonstrates the new structured output and interactive capabilities.
    evidence:
      commits:
      - fd90c824d9
      - b2e821a1d9
  - idea: Demonstrate the new mobile event carousel and geocoded map cards in action.
    priority: medium
    reason: This is a highly visual update that directly impacts event discovery.
    evidence:
      commits:
      - 257681f667
      - 4733976b8d
  quality_notes:
  - The transition to a shared Rust core for SDKs includes extensive conformance testing to ensure parity across platforms
    (c56f31d76e).
  - Security was hardened through session owner consistency enforcement and the adoption of a new release-age policy (f24763eac6,
    2faaa7b30b).
  - Performance budgets were adopted for web Rust changes to ensure architectural migrations do not negatively impact user
    experience (ead619a54b).
  validation_warnings: []
