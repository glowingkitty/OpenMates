llm_summary:
  overview: OpenMates focused on refining the underlying execution model for Plans and Tasks while addressing several UI regressions
    in the message composer and settings navigation. Significant work was also dedicated to expanding automated test coverage
    for session management and composer interactions.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: OpenMates simplified the Plan execution model and introduced encrypted work control for both plans and tasks.
    evidence:
      commits:
      - 4292a23cb
      - fe061cf1e
    release_status: dev_only
  - text: Refinements were made to work list scoping, metadata hydration, and database index migrations for Plans and Projects.
    evidence:
      commits:
      - f451e6749
      - 33fcb9a77
      - ce4d92303
      - df0ab9db5
    release_status: dev_only
  - text: The message composer received multiple stability fixes, including improved focus handling during popup actions,
      model selection wiring, and Wikipedia mention highlighting.
    evidence:
      commits:
      - 84187a1e4
      - 3a23d00a0
      - 8cdb02ad7
      - 3c09693ca
      - 1dba91fd6
      - 16eab68ae
    release_status: dev_only
  - text: Navigation within AI provider settings was stabilized to prevent route leaks and ensure correct page rendering.
    evidence:
      commits:
      - 7f32b8699
      - 4b5ffc273
      - 9de8920b2
      - e5e2cf379
    release_status: dev_only
  - text: Session management was improved to ensure the landing interface correctly covers the composer after logout or session
      revocation.
    evidence:
      commits:
      - ef997ad9a
      - 1a9879a86
      - 941a2c2d8
    release_status: dev_only
  - text: Extensive test coverage was added for Plans workflows, composer model routing, and session revocation flows.
    evidence:
      commits:
      - 62799024d
      - 2ab9a2a49
      - 77c7d129d
      - 872b19714
