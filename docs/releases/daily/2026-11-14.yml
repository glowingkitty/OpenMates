llm_summary:
  overview: 'Development on November 14 focused on three primary areas: achieving feature parity for Apple platforms, introducing
    a new specification-driven workflow for planning, and hardening the guest user experience on the web. Significant work
    was also completed on infrastructure, specifically around remote test execution and host resource management.'
  released_changes: []
  bug_fixes:
  - text: The signed-out chat experience was refined to ensure the loading state clears correctly and the composer clearly
      displays 'Sign up' or 'Log in' reasons without hanging on failed guest sends.
    evidence:
      commits:
      - 072c465589
      - 0ed51b201c
      - 666a7f9955
    release_status: dev_only
  - text: Image safety systems now load real-time policies more reliably and provide users with localized explanations when
      a request is refused, including suggestions for allowed alternatives.
    evidence:
      commits:
      - 208e951e9c
      - ab2245f313
    release_status: dev_only
  - text: AI processing for code runs was improved to better retain project file results during same-turn resumes and correctly
      log unavailable private files.
    evidence:
      commits:
      - 92a0362e36
      - c17cc3d46a
    release_status: dev_only
  - text: Code test result embeds were updated to ensure text steps grow to fit error content and carousel navigation remains
      clear of overlapping text.
    evidence:
      commits:
      - 417b55dfc5
      - 15c009a972
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates made significant progress on Apple platform parity, adding support for camera video, iOS screen sharing,
      Live Activities for calls, and a new header call pill that matches the web layout.
    evidence:
      commits:
      - 4b22f44efe
      - d8df401b19
      - 1edd845356
      - c437a29014
      - 4edb4e4e40
    release_status: dev_only
  - text: A new specification-driven workflow was introduced for the Plans app, allowing users to turn ideas into approved
      specifications before a plan begins. This includes new embeds for checks and specifications, and improved AI routing
      for these tasks.
    evidence:
      commits:
      - d95e2b13b3
      - 7cd5137f94
      - 1dc21f1e46
      - bcc675dd5e
      - 6ab021e497
      - 557cf56fd6
    release_status: dev_only
  - text: Support for Figma connected accounts was added to enable design-to-code hand-off, alongside hardening and testing
      for Google Calendar skills.
    evidence:
      commits:
      - 0f1cea2b70
    release_status: dev_only
  - text: The project added 'Create' menus to all project folders and introduced a unified 'Edit' button for all editable
      embeds, such as code, diagrams, and documents.
    evidence:
      commits:
      - de051a78ec
    release_status: dev_only
  internal_progress:
  - text: The project integrated E2B overflow runners for remote-eligible browser proofs to reduce host memory pressure, supported
      by new credit and budget monitoring scripts.
    evidence:
      commits:
      - a75406cb26
      - ae3c6d2e49
    release_status: dev_only
  - text: Host resource management was hardened with new memory-pressure guards that hold prompts instead of refusing them
      and improved idle-chat cleanup logic.
    evidence:
      commits:
      - 1661195cd2
      - f4a3dff673
    release_status: dev_only
  - text: CI and worker reliability were addressed by increasing Celery pool startup timeouts and ensuring SDK publish checks
      trigger on capability changes.
    evidence:
      commits:
      - ce970853cf
      - 80b10d1f4e
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Apple platform parity updates including voice calls and screen sharing.
      evidence:
        commits:
        - 4b22f44efe
        - d8df401b19
        - 1edd845356
        - c437a29014
        - 4edb4e4e40
      reason: Apple platform support (iOS/macOS) is currently disabled via feature flags and all related commits are marked
        dev_only.
    - text: New specification-driven planning workflow and Gemini schema fixes.
      evidence:
        commits:
        - d95e2b13b3
        - 7cd5137f94
        - 1dc21f1e46
        - bcc675dd5e
        - 6ab021e497
        - 557cf56fd6
      reason: The Plans app and related spec-driven workflows are disabled via feature flags and marked dev_only.
    - text: Figma and Google Calendar account connections.
      evidence:
        commits:
        - 0f1cea2b70
      reason: Figma and Calendar integrations are part of gated app features and marked dev_only.
    rationale: All user-facing changes from this period are currently marked as dev_only or are associated with features that
      are disabled in the project configuration (Apple platforms, Plans, and Projects). No items meet the criteria for public
      communication at this time.
  social_video_recommendations:
  - idea: Demonstrate the new native call UI on iOS, featuring the header pill and screen sharing capabilities.
    priority: medium
    reason: The visual updates to the Apple call interface provide a strong product story for cross-platform consistency.
    evidence:
      commits:
      - 4b22f44efe
      - c437a29014
  - idea: 'Showcase the ''Spec-to-Plan'' workflow: turning a rough idea into a formal specification before generating an actionable
      plan.'
    priority: low
    reason: This highlights the project's advanced agentic capabilities, though the feature is currently unreleased.
    evidence:
      commits:
      - d95e2b13b3
      - 7cd5137f94
  quality_notes:
  - Extensive work on Apple platform parity suggests a push toward mobile/desktop readiness, though these remain gated.
  - The introduction of 'Specifications' as a prerequisite for 'Plans' indicates a shift toward more structured AI task orchestration.
  - Image safety refinements show a focus on reducing false positives and improving user feedback loops.
  validation_warnings: []
