llm_summary:
  overview: OpenMates introduced several major features to the development environment, including a client-side encrypted
    Design editor, rich spreadsheet formatting, and live collaboration for shared documents. The update also included extensive
    refinements to Events search and voice call stability.
  released_changes: []
  bug_fixes:
  - text: OpenMates refined the Events search experience with fixes for FOSDEM venue pinning, city repetition in addresses,
      and the consolidation of search results into a single group with sourced details.
    evidence:
      commits:
      - e9bbaa329b
      - 7b5a13d7fe
      - 1fac7b9916
      - 775ef512dd
      - 3afde3cdd0
      - a48af0537a
      - 017073fb62
    release_status: dev_only
  - text: The workspace shell now features animated picker transitions, shared account entry for guest links, and improved
      selection toolbar behavior on embed cards.
    evidence:
      commits:
      - 9d5c8f096b
      - 498b3b1e0c
      - 484a778ff7
      - 80ab79f604
    release_status: dev_only
  - text: Voice call stability was improved by maintaining turn authorization across session rotations and preventing startup
      speech from being incorrectly registered as a user turn.
    evidence:
      commits:
      - 33ae16ed07
      - 336f592e8f
      - 1d99518abc
      - 0c063cfd4f
    release_status: dev_only
  - text: Additional fixes addressed offline draft sync acknowledgements, PDF processing output cleanup, and the restoration
      of the image upload stop button.
    evidence:
      commits:
      - 5887a2600b
      - 62d431c538
      - 08c78e5a64
      - 44d181159e
    release_status: dev_only
  unreleased_progress:
  - text: The new Design editor now supports client-side encrypted viewer sessions and revision saving.
    evidence:
      commits:
      - 514c1a53f6
      - 1405696a19
      - 87e133dc02
    release_status: dev_only
  - text: Rich formatting support was added for spreadsheets, allowing for more complex data presentation.
    evidence:
      commits:
      - 06d9b662e7
    release_status: dev_only
  - text: Encrypted live collaboration is in development for code, documents, and spreadsheets.
    evidence:
      commits:
      - 37d2fb09fa
    release_status: dev_only
  - text: Work continues on inline task authoring and linking sub-chats to plan assumptions, though these features remain
      disabled.
    evidence:
      commits:
      - 857545f1ca
      - f357760fce
      - bc41b88794
    release_status: dev_only
  - text: Apple platform parity was advanced with fixes for dictation editing, connectivity recovery, and gated transcript
      correction.
    evidence:
      commits:
      - ce08cb23ec
      - 4c59bd450f
      - 2cee0afb3e
      - 567befff59
    release_status: dev_only
  internal_progress:
  - text: The project expanded its recovery infrastructure with new watchdogs for stalled or parked work chats and idempotent
      recovery wakes.
    evidence:
      commits:
      - e20b9fb5a9
      - 82c532dc17
      - c06f182bf6
      - 3ea53f2607
      - e045cd5800
      - a09d594189
      - a6e9bef01f
    release_status: dev_only
  - text: Operational monitoring was enhanced with production outage tracking and automated Discord alerts for open development
      questions.
    evidence:
      commits:
      - 62ab652be1
      - aaade165de
      - 18e0bc7795
      - aed0032987
    release_status: dev_only
  - text: CI infrastructure now includes benchmarks for cached-account startup and neutral repository fixtures for testing.
    evidence:
      commits:
      - 3f2e4400bf
      - 6a03747222
      - aa20c72eb2
      - a7bd1d2b1e
    release_status: dev_only
