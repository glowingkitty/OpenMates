llm_summary:
  overview: OpenMates focused on significant safety infrastructure, AI routing optimizations, and expanding cloud-based project
    execution capabilities. Work continued on migrating voice and project logic to the Rust core, alongside new automated
    wellbeing support systems and refined host resource management.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: OpenMates is developing a wellbeing support system featuring helpline cards, harmful-purpose strikes, and a formal
      account suspension/appeal interface.
    evidence:
      commits:
      - c2236dc810
      - 355ed3882e
    release_status: dev_only
  - text: AI routing was optimized to use Gemini Decision 1 for relevance judging with Jev as a fallback, while sub-chat logic
      was refined to ensure parent turns answer after their sub-chats.
    evidence:
      commits:
      - cc436131d6
      - 575cce0203
      - c2daf0db15
      - 41c77b0b62
    release_status: dev_only
  - text: Cloud Project commands now run in dedicated E2B workspaces with automated file diff syncing, supported by new layered
      focus modes for project-specific tasks.
    evidence:
      commits:
      - 3b2bfc8aa5
      - 8d1cbfa8b4
      - e3861fc795
      - 04d19f9fc7
      - 53e9829d12
    release_status: dev_only
  - text: The web browsing skill received multiple reliability updates, including better session cap management for forms
      and improved handling of slow page responses.
    evidence:
      commits:
      - 9df937401a
      - c4f7cdfe1a
      - e3e85a6b24
      - 2ae081c7bf
      - 13fa08ce8b
      - c001e8492b
      - 953076aa61
    release_status: dev_only
  - text: Voice turn construction is being moved into the Rust core to align reply versions and timing with the server, alongside
      UI refinements for the Apple platform composers.
    evidence:
      commits:
      - 01ac4eee8e
      - bbf1482f15
    release_status: dev_only
  - text: Updates to shopping and life coaching include more resilient price comparison providers and refined interest tracking
      in the Life Compass.
    evidence:
      commits:
      - 3e034fc62c
      - 715d8cbee9
      - 7d56c30e76
    release_status: dev_only
  internal_progress:
  - text: The daily meeting automation now includes triage for every briefing item (NOW/LATER/DROP), a marketing and business
      development block with idea tracking, and enforced daily limits on chats and reminders.
    evidence:
      commits:
      - a7f8dc1ef4
      - d802990d24
      - 0114108512
      - f55a6f83b0
      - 17c7cb9035
    release_status: dev_only
  - text: Host infrastructure added hourly disk budgets per category, automated cleanup of orphaned Docker layers, and disk
      usage alerts at 75% and 85% thresholds.
    evidence:
      commits:
      - d58b444d32
      - ccdd3204a8
      - 44b839e34c
      - 04a18dac67
    release_status: dev_only
  - text: Development scripts were updated to top up test accounts before inference runs and preserve specific placeholders
      during Discord pushes.
    evidence:
      commits:
      - c7117a6054
      - 463f5e40c7
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: New wellbeing support and account suspension systems.
      evidence:
        commits:
        - c2236dc810
        - 355ed3882e
      reason: Major safety and wellbeing features are currently in development and not yet released to the main branch.
    - text: Cloud Project workspaces and layered focus modes.
      evidence:
        commits:
        - 3b2bfc8aa5
        - 53e9829d12
      reason: Project-related features are currently disabled in the platform configuration.
    - text: Native Apple platform updates and Rust-core voice turns.
      evidence:
        commits:
        - 01ac4eee8e
        - bbf1482f15
      reason: iOS and macOS platforms are currently disabled in the platform configuration.
    rationale: All changes from this period are currently in the development branch (dev_only) and have not been merged to
      main. Additionally, several major features involve platforms or apps that are explicitly disabled in the current configuration.
  social_video_recommendations:
  - idea: Demonstrate the new wellbeing support flow, showing how the assistant provides helpline cards and how the account
      appeal process looks.
    priority: medium
    reason: This provides a concrete visual story about user safety and platform responsibility.
    evidence:
      commits:
      - c2236dc810
  quality_notes:
  - Extensive real-world integration testing was added for safety suspensions, wellbeing helplines, and cloud project commands.
  - Reliability improvements were implemented for web browsing to handle transient 502/503 errors and rate limits.
  validation_warnings: []
