llm_summary:
  overview: OpenMates introduced major updates to its AI execution engine, Jev, focusing on safety, model-aware routing, and
    artifact persistence. The project also launched a new illustrated blog series and refined the public publication interface.
  released_changes:
  - text: OpenMates added Jev decision processing, which introduces automated safety checks and content sanitization for AI
      interactions.
    evidence:
      commits:
      - cfdbda23a
    release_status: released_main
  - text: The AI engine now utilizes model-aware routing to better manage context in long conversations.
    evidence:
      commits:
      - b8dc581d0
    release_status: released_main
  - text: Artifacts are now preserved across chat compression cycles, ensuring they remain available as the conversation grows.
    evidence:
      commits:
      - 94ea315d5
    release_status: released_main
  - text: The project published a new illustrated article on agentic coding and refined the UI for all public blog posts.
    evidence:
