llm_summary:
  overview: OpenMates focused on optimizing AI model routing and chat latency while refining the Wikipedia learning UI and
    hardening newsletter delivery infrastructure. Significant work also progressed on native parity for Apple platforms and
    guest workflow restoration.
  released_changes: []
  bug_fixes:
  - text: The AI research orchestration now verifies sources before final synthesis and correctly consumes child tasks under
      their source batches.
    evidence:
      commits:
      - afdbb2469
      - 18df57f17
      - aa19551b7
    release_status: dev_only
  - text: New-chat suggestions and composer color styling were restored to ensure consistent visibility in the active chat
      interface.
    evidence:
      commits:
      - 6a287adc8
      - 0a8a11573
    release_status: dev_only
  - text: The Wikipedia learning experience received several refinements, including corrected source attribution placement,
      aligned fullscreen suggestions, and safer handling of image errors.
    evidence:
      commits:
      - d8f2ad251
      - e3f725a2a
      - 0ff1de620
      - 223851ed8
    release_status: dev_only
  - text: Mobile website headers and landing hero elements were adjusted for better visual balance and restored navigation
      links.
    evidence:
      commits:
      - 25b605ad5
      - 70762ff19
      - 2e5936216
    release_status: dev_only
  - text: Newsletter delivery was hardened with improved S3 asset publication and feedback loops to prevent test email bounces.
    evidence:
      commits:
      - c10e365b0
      - 40a081c02
      - 347a47351
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added logic to route Jev requests by four complexity levels and introduced support for Gemini 4 Argon
      with temporary provider pricing.
    evidence:
      commits:
      - cdfd1c233
      - d4b17f43a
    release_status: dev_only
  - text: Native parity work for iOS, macOS, and Apple Watch continued with improvements to offline storage and guest entry
      flows.
    evidence:
      commits:
      - df80a02f4
    release_status: dev_only
  - text: The guest workflow workspace and template catalog were restored to support unauthenticated exploration of automation
      features.
    evidence:
      commits:
