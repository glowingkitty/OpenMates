llm_summary:
  overview: OpenMates enabled Workflows in production and implemented significant stability improvements for AI chat processing,
    including better handling of tool limits and anonymous skill execution.
  released_changes:
  - text: Workflows have been enabled in the production configuration.
    evidence:
      commits:
      - 3933ffcbf
    release_status: released_main
  - text: The Workflow builder received several UI refinements, including better alignment for input/output fields and improved
      table column grouping.
    evidence:
      commits:
      - acd69a69a
      - 69dd07812
      - 1d7fa4ce3
      - 92d2c63fe
      - b5d454d04
    release_status: released_main
  - text: Draft previews now display embed type labels for better clarity during message composition.
    evidence:
      commits:
      - a2f31ca19
    release_status: released_main
  bug_fixes:
  - text: AI chat processing now more reliably handles complex turns, including news research budget enforcement, tool limit
      recovery for Gemini, and silent answer-only model turns.
    evidence:
      commits:
      - f7499b9fe
      - 83e022a41
      - 48c95c68e
      - 3e55f4aad
      - cbf3b7180
    release_status: released_main
  - text: Anonymous skill execution has been updated to keep requests inline when under provider rate limits.
    evidence:
      commits:
      - c7621fe0a
    release_status: released_main
  unreleased_progress:
  - text: Work continues on aligning Projects and Tasks with Figma designs and integrating user Plans.
    evidence:
      commits:
      - 201f98cbd
    release_status: released_main
  - text: Anonymous usage budget enforcement is in development to manage inline skill limits.
    evidence:
      commits:
      - 3c2800021
    release_status: released_main
  - text: Apple Watch support is being refined with fixes for chat socket connectivity and account list loading.
    evidence:
      commits:
      - eca1d63a0
      - 4143ddc6e
      - b7d52a746
    release_status: released_main
  - text: Internal updates to the workflow builder are aligning navigation and skill input adapters.
    evidence:
      commits:
