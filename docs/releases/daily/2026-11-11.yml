llm_summary:
  overview: OpenMates focused heavily on the cross-platform migration to a shared Rust client core, alongside significant
    advancements in AI image generation safeguards and embroidery design geometry. Work also progressed on integrating Projects
    and Workflows more deeply into the chat experience.
  released_changes: []
  bug_fixes:
  - text: Image fullscreen views now utilize the full available screen dimensions, and tapping an image correctly opens the
      source file in a new tab.
    evidence:
      commits:
      - 788e8aa2cb
    release_status: dev_only
  - text: Resolved issues where assistant names failed to resolve in chat; authored result groups now use standard views and
      event cards include venue maps.
    evidence:
      commits:
      - 3f3c8db298
    release_status: dev_only
  - text: Embroidery design logic was corrected to prevent separate shapes from being joined by unintended stitches and to
      ensure sewing widths match user requests.
    evidence:
      commits:
      - 433c8492d9
      - edca0a3641
    release_status: dev_only
  - text: The web interface no longer flashes raw message source before rendering, and several console errors related to memory
      migration and draft deletion were resolved.
    evidence:
      commits:
      - 9387c8f073
      - 35afed7a0e
    release_status: dev_only
  - text: Privacy protections were strengthened to ensure personal data redaction does not inadvertently rewrite embed references
