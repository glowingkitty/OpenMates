  quality_notes:
  - Admins now receive comprehensive diagnostics from Apple devices, including frame stalls and MetricKit scalars, to monitor
    stability (82ea70c243).
  - Model selection logic was updated to prioritize Gemini or Mercury over Mistral for automatic routing (899ff0a382).
  - Voice call reliability was improved by recognizing and dropping echoes from prerecorded assistant clips (7e35e82849).
