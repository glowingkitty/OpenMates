      evidence:
        commits:
        - 26e771f689
      reason: Privacy gate is currently in development and not available on the main release branch.
    - text: Unified start screen layouts across all workspaces.
      evidence:
        commits:
        - 13a060b771
        - eda802f789
      reason: UI updates are currently in development and not available on the main release branch.
    rationale: All changes from this period are marked as development-only and are not yet present on the main release branch
      or approved for public communication.
  social_video_recommendations:
  - idea: Demonstrate screen sharing during a desktop web voice call.
    priority: high
    reason: This is a high-utility feature with clear visual impact for collaborative workflows.
    evidence:
      commits:
      - 215c24f000
  - idea: Showcase the unified start screen experience across the five different workspaces.
    priority: medium
    reason: Highlights the project's progress toward platform parity and a consistent user experience.
    evidence:
      commits:
