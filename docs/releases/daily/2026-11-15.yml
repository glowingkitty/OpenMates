      reason: The Slides application and its associated focus modes are currently in development and not yet released to the
        main branch.
    - text: Project Timeline and Commit Restore
      evidence:
        commits:
        - a1174eb203
      reason: The Projects feature and Timeline functionality are explicitly disabled in the current production configuration.
    - text: Apple Platform Native Parity
      evidence:
        commits:
        - 1ae0a8cb2e
        - 9a4130c9df
      reason: The iOS and macOS platforms are currently disabled in feature availability settings.
    rationale: All user-facing features and improvements from this period are currently in development (dev_only) and have
      not yet been merged into the main release branch. Major initiatives like the Slides app, Project Timeline, and Apple
      platform parity remain gated by feature flags.
  social_video_recommendations:
  - idea: A demonstration of the new Project Timeline, showing how users can browse commit history and restore previous versions
      of a project directly from the web or CLI.
    priority: High
    reason: This is a concrete, visual product story that highlights the 'no more lost work' theme and the power of the integrated
      version control.
    evidence:
      commits:
      - a1174eb203
  - idea: A walkthrough of the Slides Template Designer focus mode, showing an AI assistant helping to refine a presentation's
      visual style in real-time.
    priority: Medium
    reason: The Slides app is a major new functional area with high visual appeal for social platforms.
    evidence:
      commits:
      - 43ae33ea1f
  quality_notes:
  - Extensive automated test coverage was added for the new Slides focus modes and Project Timeline restore logic.
  - Real-inference 'smoke tests' were implemented to verify travel results and AI focus transitions in the web environment.
  - Infrastructure changes include new watchdog timers and staleness alerts for production backups.
