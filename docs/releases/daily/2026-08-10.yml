llm_summary:
  overview: OpenMates focused on platform parity for Apple devices, chat draft reliability, and refining AI skill execution.
    Significant work was also done on self-hosting infrastructure and internal development workflows.
  released_changes: []
  bug_fixes:
  - text: The Apple platform experience received several refinements, including fixes for draft previews in the chat header,
      shell navigation logic, and safeguards for anonymous session restoration during authentication.
    evidence:
      commits:
      - 97bbe8743
      - a641ac901
      - bd8d355fa
      - f57e0db45
      - 4bb223ace
      - fb99c3559
    release_status: dev_only
  - text: Chat interface stability was improved by ensuring sub-chat previews appear correctly above notifications and maintaining
      draft header state during context switches or cleanup refreshes.
    evidence:
      commits:
      - 044f7e5a7
      - 266b05450
      - 14dc05fe1
      - 789f6c4cf
      - d3650b3e2
      - a3111d168
    release_status: dev_only
  - text: AI skill processing was hardened with better protocol quote cleanup, support for nonce-prefixed image uploads, and
      aligned pricing metadata for ElevenLabs speech generation.
    evidence:
      commits:
      - d719cae6c
      - 73b0043e1
      - e3727480e
      - 78f29f1fe
      - 4141d4ca7
    release_status: dev_only
  - text: Self-hosting and infrastructure reliability were addressed by isolating reminder worker queues and providing more
      room for runtime scheduler probes and CMS setup tasks to complete.
    evidence:
      commits:
      - 1e0b56b74
      - b04422353
      - 5c475aded
      - 7f80ac31b
    release_status: dev_only
  unreleased_progress:
  - text: Onboarding parity for Apple platforms is in development to align the iOS and macOS experiences with the web landing
      page.
    evidence:
      commits:
      - d530314d3
    release_status: dev_only
  - text: The CLI is gaining new capabilities for AI-based image detection.
    evidence:
      commits:
      - ada06054c
    release_status: dev_only
  - text: New API endpoints are being established to provide detailed user plan information within the plans platform.
    evidence:
      commits:
      - 81a07512e
    release_status: dev_only
  internal_progress:
  - text: OpenCode development tools now include a progress notifier and manual workflow reviews to improve research and improvement
      cycles.
    evidence:
      commits:
      - d86ea7101
      - 2a28122dd
      - 164647b02
    release_status: dev_only
  - text: Internal session management and billing retry logic were updated to handle forced logouts and invoice row failures
      more gracefully.
    evidence:
      commits:
      - 1d620b549
      - 088198b76
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Apple landing onboarding parity
      evidence:
        commits:
        - d530314d3
      reason: Platform parity for iOS and macOS is currently disabled and not yet released to main.
    - text: User plan detail endpoint
      evidence:
        commits:
        - 81a07512e
      reason: The Plans platform is a disabled feature and the commit is not in the main branch.
    rationale: No user-facing changes were merged into the main branch or marked ready for public communication during this
      period.
  social_video_recommendations:
  - idea: A side-by-side comparison of the onboarding experience between web and Apple platforms.
    priority: medium
    reason: Visual parity across platforms is a strong product story for users moving between devices.
    evidence:
      commits:
      - d530314d3
  quality_notes:
  - Extensive UI testing was added for Apple platform navigation to ensure parity with web experiences.
  - Dependency pins were patched to address potential vulnerabilities across the backend and frontend.
  validation_warnings: []
