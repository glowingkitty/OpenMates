llm_summary:
  overview: OpenMates introduced a new time-based filter for CLI server logs and resolved several critical blockers for AI
    task processing and billing. Significant progress was also made on automating product demonstration videos for the CLI
    and deep research features, alongside a version bump to v0.17.
  released_changes:
  - text: The OpenMates CLI now includes a '--since' filter for server logs, enabling more targeted debugging of recent events.
    evidence:
      commits:
      - e83f63442
    release_status: released_main
  - text: Billing credit balances are now updated automatically in the settings view following a successful transaction.
    evidence:
      commits:
      - 1b05b19f9
    release_status: released_main
  - text: AI task processing was enhanced with improved standalone embed reference normalization and resolved encoding issues
      during code execution.
    evidence:
      commits:
