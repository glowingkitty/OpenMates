  - idea: Demonstrate the new apartment search experience, highlighting the integrated map markers and improved gallery layouts.
    priority: medium
    reason: The visual updates to housing search provide a clear product story for users looking for apartments.
    evidence:
      commits:
      - b5a27aac7
  - idea: Preview the natural-language request flow in the redesigned Apps workspace.
    priority: low
    reason: While unreleased, the shift to natural-language interaction for workspace tools is a significant product direction.
