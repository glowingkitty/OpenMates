llm_summary:
  overview: OpenMates focused on a significant expansion of Assistant Speech capabilities, including historical playback and
    a redesigned player UI. The update also introduced granular security controls for API keys and refined the landing page
    positioning and SEO metadata.
  released_changes: []
  bug_fixes:
  - text: OpenMates improved Assistant Speech billing by aggregating usage data across streaming and worker tasks.
    evidence:
      commits:
      - 98f3daa5a
    release_status: dev_only
  - text: The Assistant Speech player received several refinements, including fixed mobile chapter controls, improved dark
      mode support, and smoother playback transitions.
    evidence:
      commits:
      - 4dcb0c26d
      - f95eb58b2
      - b9b44bbf1
    release_status: dev_only
  - text: Voice-first chat interactions were stabilized by ensuring durable keys for voice-only drafts and preserving chat
      keys during the initial message sync.
    evidence:
      commits:
      - 940dbd1f2
      - bdccc7e8a
      - 0c689bae5
    release_status: dev_only
  - text: Session security was hardened by isolating security states between different device sessions.
    evidence:
      commits:
      - a700420fe
    release_status: dev_only
  - text: The CLI pairing process and task lifecycle management were updated to maintain active sessions more reliably.
    evidence:
      commits:
      - a46d00f01
      - fa8729447
    release_status: dev_only
  - text: Component previews in the developer environment now correctly support scrolling for tall UI elements.
    evidence:
      commits:
      - 4d3b37f89
    release_status: dev_only
  - text: Continue carousel cards are now gated by item time to ensure relevant content is displayed.
    evidence:
      commits:
      - 0ce9cc4ab
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added historical playback for Assistant Speech and introduced a redesigned playback UI featuring a waveform
      carousel and improved controls.
    evidence:
      commits:
      - b257eb243
      - 6b4d3e0f1
      - e88438aff
      - 115467c1f
    release_status: dev_only
  - text: Granular API key scopes were implemented to allow more precise control over developer access, supported by new UI
      in the developer settings.
    evidence:
      commits:
      - c52957353
      - 447e0ef58
      - 0ce027304
    release_status: dev_only
  - text: The landing page and onboarding experience were refreshed, including the retirement of legacy intro chats and alignment
      of the project's slogan.
    evidence:
      commits:
      - c10679f69
      - 7966ed8b8
      - 10fb65626
      - 4ef0ccb58
    release_status: dev_only
  - text: Support for encrypted external task context was added to the task system, though the tasks platform remains disabled.
    evidence:
      commits:
      - 1c461ed10
    release_status: dev_only
  - text: The Gemini 3.8 Flash model was added to the available provider configurations.
    evidence:
      commits:
      - 3cd4ae11a
    release_status: dev_only
  internal_progress:
  - text: The OpenCode development environment was updated with improved skill discovery, mirrored specification skills, and
      more reliable test dispatching.
    evidence:
      commits:
      - 6ebe0ce6e
      - 5ac1d1870
      - '810560515'
      - b982b7530
    release_status: dev_only
  - text: The project expanded its use of automated 'proof' workflows, which generate video evidence and checkpoints to verify
      UI changes and feature implementations.
    evidence:
      commits:
      - b351ced61
      - a6023ef9a
      - abdd3fa39
      - e442ceca2
      - 9fd413c2d
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Assistant Speech historical playback and player redesign.
      evidence:
        commits:
        - b257eb243
        - e88438aff
        - 115467c1f
      reason: Assistant Speech playback features and the player redesign are currently in development and not yet released
        to the main branch.
    - text: Granular API key scopes for developers.
      evidence:
        commits:
        - c52957353
      reason: Granular API key scopes are currently in development.
    - text: Landing page positioning and onboarding refresh.
      evidence:
        commits:
        - c10679f69
        - 7966ed8b8
        - 10fb65626
      reason: Landing page and onboarding updates are currently in development.
    rationale: All user-facing features and improvements from this period are currently in development (dev_only) and have
      not yet reached the main branch for public release.
