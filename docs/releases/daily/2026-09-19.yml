  - idea: A demonstration of real-time voice message transcription streaming as the user speaks.
    priority: medium
    reason: Streaming transcripts provide immediate visual feedback and represent a significant UX improvement for audio interactions.
    evidence:
      commits:
      - 22f4391c5
