llm_summary:
  overview: OpenMates focused on AI model routing enhancements, new focus modes for conference planning and business pricing,
    and significant automation of security monitoring infrastructure. Improvements were also made to event visualization and
    sheet embed interactivity.
  released_changes: []
  bug_fixes:
  - text: Event search now prioritizes upcoming editions of major recurring events before falling back to prose descriptions.
    evidence:
      commits:
      - 47ddd574d9
    release_status: dev_only
  - text: Focus mode activation and continuation were improved to correctly display parent app icons and resolve targets for
      attached embed cards.
    evidence:
      commits:
      - a7a9a0748a
      - 7dc9020adc
    release_status: dev_only
  - text: Sheet embeds received UI refinements including pinned header rows, a rounded edit action, and distinct styling for
      formula cells.
    evidence:
      commits:
      - 652a9efb8b
    release_status: dev_only
  - text: The web app resolved an issue where follow-up messages sent immediately after a page reload could be dropped.
    evidence:
      commits:
      - 74162d4ebb
    release_status: dev_only
  - text: The voice call composer was updated to show a transcript-only active state without redundant navigation options.
    evidence:
      commits:
      - 8bd9ef3657
    release_status: dev_only
  unreleased_progress:
  - text: AI model selection now supports server region preferences, defaulting to EU hosting or the fastest available global
      provider.
    evidence:
      commits:
      - 2d89714338
      - 445a598812
      - 2d4f9b6d36
    release_status: dev_only
  - text: New focus modes for conference talk planning and product pricing were introduced, alongside support for live editable
      formulas in sheet embeds.
    evidence:
      commits:
      - e536c40901
      - 0b1b540ab7
    release_status: dev_only
  - text: Event cards now feature server-side geocoding and improved map views with grounded descriptions.
    evidence:
      commits:
      - 257681f667
      - fc7634b845
    release_status: dev_only
  - text: A simplified issue reporting form was added, featuring automated dispatching for administrative review.
    evidence:
      commits:
      - af17bcec16
    release_status: dev_only
  - text: Security monitoring was automated with new release-age policies, SHA-pinned actions, and host-reporting capabilities.
    evidence:
      commits:
      - 2faaa7b30b
      - 386015de1d
      - 14a6192800
      - b121d0a121
    release_status: dev_only
  - text: Internal daily meeting automation was expanded to include backlog cleanup and issue tracking for GitHub and Linear.
    evidence:
      commits:
      - b0305a9d09
      - ae77ea8732
      - eb2967ddb6
      - 570772ab1c
    release_status: dev_only
  - text: Workflow generation and runner logic received reliability fixes while the feature remains disabled.
    evidence:
      commits:
      - 1b32821bf0
    release_status: dev_only
  internal_progress:
  - text: AI usage guards were refined to manage emergency reserves and ensure orderly task handovers during usage resets.
    evidence:
      commits:
      - 6668aae37b
      - 0b25d5058f
      - d470c19593
      - 6ba3126aa4
    release_status: dev_only
  - text: A new deployment gate validates translation keys to prevent missing strings in focus mode interfaces.
    evidence:
      commits:
      - a7a9a0748a
    release_status: dev_only
  - text: Internal project tracking files were removed from the public repository in favor of local gitignore rules.
    evidence:
      commits:
      - cff3feee26
    release_status: dev_only
