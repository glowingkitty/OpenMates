llm_summary:
  overview: OpenMates focused on the integration of ElevenLabs audio capabilities and a significant stabilization of the chat
    draft lifecycle. The update also included a massive overhaul of the UI test infrastructure to improve development reliability.
  released_changes: []
  bug_fixes:
  - text: The chat draft lifecycle was stabilized with fixes for preserving restored draft-only chats during cleanup, maintaining
      draft visibility in the sidebar, and handling draft receipt reconnections.
    evidence:
      commits:
      - 1d53aa180
      - ad223d5b3
      - 0bb4f7b83
      - 32859de12
      - daf751271
    release_status: dev_only
  - text: Message parsing and embed rendering were improved to correctly handle shared interactive question payloads, suffix-only
      embed references, and preprocessed code fence payloads.
    evidence:
      commits:
      - 8501800a1
      - b482d11a8
      - ecc98e97d
      - a4a32b406
      - 43f97a298
      - a6b8901e6
      - 7465ddd23
      - 6e8763e13
    release_status: dev_only
  - text: UI refinements include invalidating stale chat loads when starting new chats, ensuring daily inspirations remain
      visible for authenticated users, and adding retries for stale pair authorizations.
    evidence:
      commits:
      - ce7f1accb
      - 64424fea0
      - c82b647b5
      - 743c2dd43
      - 55edd9a39
    release_status: dev_only
  - text: AI and audio processing safety was enhanced by skipping declared binary fields during output scanning and adding
      retries for safeguard parse failures.
    evidence:
      commits:
      - bb2569bc5
      - b59f1d229
      - 6fce08a30
      - 5dd8890f5
    release_status: dev_only
  unreleased_progress:
  - text: Integration of ElevenLabs audio skills is underway, including support for premium speech models and automated generation
      of audio sample artifacts for documentation.
