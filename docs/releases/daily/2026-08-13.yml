      - ff938ab6c
      - d2215a7b3
      - 80d88c0fc
      - 741b36dc7
      - df64d9937
    release_status: dev_only
  - text: OpenCode progress notifications were transitioned to a more deterministic event-based system with Discord integration
      refinements.
