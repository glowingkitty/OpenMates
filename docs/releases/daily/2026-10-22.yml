llm_summary:
  overview: OpenMates completed a major transition of its voice and audio pipeline to Voxtral 3, replacing legacy providers
    with a shared-pipeline voice mode. Simultaneously, a large-scale unification of result embeds was implemented to standardize
    the design and behavior of shopping, health, home, and travel results. AI reasoning was also refined through the application
    of the Jev reasoning policy across multiple models.
  released_changes: []
  bug_fixes:
  - text: Chat UI stability was improved by ensuring chats remain scrollable during composer focus, revealing assistant responses
      immediately when streaming begins, and preventing errors when clearing unsent drafts.
    evidence:
      commits:
      - 4ffa9b4c9
      - 6c53e719e
      - 6130ccff7
    release_status: dev_only
  - text: AI reliability was enhanced by restoring baseline search tools, improving Gemini-to-Mercury answer recovery, and
      ensuring web search is retained for explicit research requests.
    evidence:
      commits:
      - b749d1a7f
      - 17954904e
      - '308732219'
      - b3189f6c2
      - 1dfb57acd
    release_status: dev_only
  - text: Data integrity fixes restored credit charges for generated media, corrected reminder email setup prompts, and preserved
      formatting in event descriptions.
    evidence:
      commits:
      - b7409edf0
      - 4f26ac34a
      - 649d028e4
    release_status: dev_only
  - text: Result embed design was stabilized by fixing date formatting, preview media visibility, and deduplicating overlapping
      map event previews.
    evidence:
      commits:
      - 3b0dc1efc
      - 5783a7b50
      - 9d97b9a3f
      - d0f90ccf9
      - a698e7858
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates migrated the voice and audio pipeline to Voxtral 3, improving message input, playback, and realtime transcription
