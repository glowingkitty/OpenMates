llm_summary:
  overview: OpenMates focused on cross-platform parity for Apple devices, refined search relevance across multiple domains,
    and introduced a more efficient demand-driven model for assistant speech generation.
  released_changes: []
  bug_fixes:
  - text: Stabilized the Apple ecosystem experience by fixing macOS background state reporting, chat window management, and
      push notification handoff.
    evidence:
      commits:
      - bc9f8c5c6
      - 275829e39
      - bfd5dbb56
      - 7160debf6
    release_status: dev_only
  - text: Refined search reliability for repositories and events by rejecting invented ranking defaults and improving proxy
      exit handling.
    evidence:
      commits:
      - e06e3dae5
      - 94d61ff57
      - d7e6bdfb0
      - 6c0ff2438
    release_status: dev_only
  - text: Aligned the workflow builder UI and Apple composer components with Figma design specifications.
    evidence:
      commits:
      - 2b4237b4a
      - 48768e09d
      - fdecda30e
      - 24b07c442
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added new Apple Watch flows to match Figma designs, including pairing runtimes and chat layout logic.
    evidence:
      commits:
      - 904e9540a
    release_status: dev_only
  - text: Development began on demand-driven assistant speech, which generates audio only when playback is requested to optimize
      resource usage.
    evidence:
      commits:
      - a8c379909
      - f45e32932
    release_status: dev_only
  - text: Workflows now support AI-powered checks and 'Ask AI' steps for automated decision-making.
    evidence:
      commits:
      - 05fc991f3
    release_status: dev_only
  - text: Search relevance ranking was implemented for repository and 3D model searches, alongside optimized event provider
      routing.
    evidence:
      commits:
      - 24c49f1b6
      - 0ea92a1ab
      - 2a598990c
    release_status: dev_only
  - text: The project retired the Suki and Welcome focus modes and deprecated the Google Events search provider in favor of
      more relevant sources.
    evidence:
      commits:
      - 95bb565b1
      - 13857ffef
    release_status: dev_only
  internal_progress:
  - text: Updated Apple TestFlight release scripts to automate signing keychain preparation.
    evidence:
      commits:
