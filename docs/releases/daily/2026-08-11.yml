llm_summary:
  overview: OpenMates focused on refining audio generation skills, enhancing chat file management, and stabilizing the core
    interface. Significant work was done on audio asset storage, billing by duration, and surfacing chat-related files in
    settings.
  released_changes: []
  bug_fixes:
  - text: Resolved issues where welcome messages would appear while the message composer was active.
    evidence:
      commits:
      - 6dbfae61d
      - b6302ad63
    release_status: dev_only
  - text: Fixed audio preview playback scoping and made example audio files playable in the store.
    evidence:
      commits:
      - d7f949f88
      - 71c91229c
    release_status: dev_only
  - text: Corrected bank transfer settlement alerts and added idempotency to PDF upload billing.
    evidence:
      commits:
      - 70e48a55f
      - 94e498576
    release_status: dev_only
  - text: Stabilized authentication and sync flows, including recovery key transitions, login cache fallbacks, and chat sync
      recovery.
    evidence:
      commits:
      - 30d05e744
      - 4f08b38a4
      - cc19be438
    release_status: dev_only
  unreleased_progress:
  - text: Audio skills now store outputs as generated assets, calculate costs based on duration, and expose example files
      for testing.
    evidence:
      commits:
      - c4ab9796a
      - bef48db31
      - 7872aa931
    release_status: dev_only
  - text: Chat files are now surfaced in settings and the CLI, with deep links connecting example chat costs to usage data.
    evidence:
      commits:
      - 903ebad36
      - ccdfcbe99
      - 8e30afb59
    release_status: dev_only
  - text: The message input now handles pasted embeds as sendable content and includes improved paste recovery.
    evidence:
      commits:
      - 5ef2772f1
      - a1a8298a6
      - 62c7b43fc
    release_status: dev_only
  - text: Initial work on task contracts and Apple platform parity for voice recording views was added.
    evidence:
      commits:
      - 4efb9c08a
      - af10e174d
    release_status: dev_only
  internal_progress:
  - text: OpenCode sessions now support strict proof videos, progress delta notifications, and the OpenMatesCloud session
      workflow.
    evidence:
      commits:
      - e7ae53cf9
      - db703f4ba
      - daea9ddd4
    release_status: dev_only
  - text: Infrastructure updates include parallelized startup metadata sync and the use of GPT-5.5 for execution workers.
    evidence:
      commits:
      - 4a8ecb303
      - c3b72dfa3
    release_status: dev_only
  - text: Testing frameworks were hardened for parallel debug workers and campaign token minting.
    evidence:
      commits:
      - 18e5b2cba
      - 95a43d88e
      - 3a55325b0
    release_status: dev_only
