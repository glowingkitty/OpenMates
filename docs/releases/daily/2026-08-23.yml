llm_summary:
  overview: OpenMates focused on refining the chat interface and map embed functionality. Key updates include improved stability
    for deep research tasks, better handling of map data sources, and UI layout adjustments for mobile and loading states.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: The chat interface received several layout refinements, including better placement of loading statuses, improved
      stability for continue cards during reconnection, and restored transcript widths for mobile devices.
    evidence:
      commits:
      - acc417226
      - e591d652d
      - 3ce9f118e
      - 70e4aa6b4
    release_status: dev_only
  - text: Map embeds were updated to better resolve data sources, normalize references, and hide internal markers in assistant
      prose.
    evidence:
      commits:
      - 213daecbc
      - dfafba1a6
      - db9b7be9d
      - 73e36d86b
      - fdc4c61d1
    release_status: dev_only
