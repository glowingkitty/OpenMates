llm_summary:
  overview: OpenMates focused on deep architectural migrations and expanding specialized assistant capabilities. The Apple
    client began a major transition to the shared Rust core for chat actions, voice calls, and session management. Video generation
    was significantly upgraded with support for composed videos featuring AI-generated audio and music. Agentic coding features
    advanced with remote Project creation and Git integration, while the Business app gained several fundraising-focused modes
    and official register lookups.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: OpenMates moved core logic for Apple login, chat windows, memories, and voice calls to the shared client core. Subsequent
      updates transitioned signed-in send actions, message editing, and Siri integration to the core, while deleting legacy
      Swift implementations.
    evidence:
      commits:
      - 03a7aedaa3
      - 5643f07daa
      - 912a86bce5
      - 53236020a3
      - 1e13a9ae8d
    release_status: dev_only
  - text: The video generation pipeline now supports 'composed videos' that integrate voice-overs, sound effects, and music,
      led by Gemini 3.8 Flash. The update includes a thumbnail card with progress indicators, a fullscreen edit mode, and
      specific badges for AI-generated clips.
    evidence:
      commits:
      - c67f2375aa
      - 4410db5ae4
      - 3aa65457d8
      - 4fa1afa530
      - 86388cb2b5
      - 737705a921
      - 53ee2099c5
      - c2da1f1988
      - f6f38bbd5a
      - ae1212673b
      - 3e10dd708f
      - a66e628e2f
      - ea60c3d2e2
      - 83c4cc0eec
    release_status: dev_only
  - text: The project added support for creating Project folders on user machines via remote access and performing Git operations
      directly from chat. Assistant-led testing now includes recorded browser runs for hosted apps and more efficient Project
      snapshot fetching.
    evidence:
      commits:
      - 20f633bf28
      - 5941e5d218
      - 43c5c75b34
      - cdcbbcf8fa
      - 81cf204bf1
      - 499dae2713
      - 170da82264
      - 719d43887d
      - fbdd42b8ff
      - 0e5b0dd8ea
    release_status: dev_only
  - text: Five new fundraising focus modes were added, including investor research and pitch preparation. The assistant can
      now look up company ownership in official registers, save memories to active Projects, and use a new 'Write press release'
      mode with PDF download support.
    evidence:
      commits:
      - 0a0cafff32
      - 7367cdf368
      - a89fbec327
      - e0bf24bcd8
      - 4a49984f04
      - 1be5fdd657
      - 9ea0596275
      - a06bc89790
      - c02694c62b
    release_status: dev_only
  - text: The browsing tool was updated with a new planner that uses batched steps and evidence notes to provide partial results
      and a live step view. It also now records specific JSON Schema failures for rejected answers.
    evidence:
      commits:
      - 343757a432
      - 3f05217643
      - 6c3a3da50c
      - 3d4f989775
      - f4e59ea469
      - 16499ca6b5
      - 5f0f5e1a90
    release_status: dev_only
  - text: OpenMates implemented cost-plus pricing for customers with configurable margins and credit rounding. Gemini 4 Carbon
      was added as an explicitly selectable model with introductory pricing.
    evidence:
      commits:
      - c65d527119
      - 28caef682d
      - 2980c7bc0f
      - 1afc6dc607
    release_status: dev_only
  - text: Event sounds were added to the web interface with quiet window settings and a silent mode toggle. Search embeds
      now show live source progress, and the project added support for restoring and enhancing media embeds.
    evidence:
      commits:
      - 3b73b62397
      - 08c99b3041
      - c33f8b0828
      - a0e1ad4d45
      - aa3cde2537
      - b030125399
      - 44341e635a
    release_status: dev_only
  internal_progress:
  - text: Apple unit and UI test jobs were optimized to compile once per run, with a new compile-only check gating the test
      lanes.
    evidence:
      commits:
      - 50075ec9cb
      - c4ce212aa4
    release_status: dev_only
  - text: Real-inference tests now fall back to throwaway developer accounts when personal accounts are busy, ensuring more
      reliable CI runs.
    evidence:
      commits:
      - 234ae9c757
      - 6da5a2dbd3
    release_status: dev_only
  - text: Agent infrastructure was strengthened with new hooks to enforce model selection and tool budgets for sub-agents,
      alongside improved worktree reconciliation.
    evidence:
      commits:
      - 04fcc85f06
      - 966c9ce0ce
      - dc727e7726
      - 5f8933aeca
      - c0a2e1e566
      - '3929670208'
      - fe0022dd99
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Composed video generation with music and voice-over.
      evidence:
        commits:
        - c67f2375aa
      reason: This feature is currently in the dev release and not available to the general public.
    - text: Migration of Apple client logic to the shared Rust core.
      evidence:
        commits:
        - 03a7aedaa3
      reason: The Apple client core migration is dev-only and the associated platforms are currently disabled.
    - text: Remote Project creation and Git integration.
      evidence:
        commits:
        - 20f633bf28
      reason: Project features are currently disabled and the work is in the dev release.
    - text: Fundraising focus modes and company ownership lookups.
      evidence:
        commits:
        - 0a0cafff32
      reason: These focus modes are currently in the dev release.
    - text: Web Browse v2 with live step planning.
      evidence:
        commits:
        - 343757a432
      reason: The browsing tool overhaul is dev-only and the feature is currently disabled.
    rationale: All significant updates from this period are currently restricted to the developer release or involve features
      that are explicitly disabled in the current configuration.
