llm_summary:
  overview: OpenMates launched a public newsroom and social archive, enabling users to browse announcements and event history
    directly. The update also significantly improved the reliability of AI search skills, message drafting, and issue reporting.
  released_changes:
  - text: The project launched a public newsroom and social archive, featuring event galleries and announcement blogs.
    evidence:
      commits:
      - c6c58de28
    release_status: released_main
  - text: The newsroom interface was updated to align with design specifications, including improved sidebar navigation and
      social post linking.
    evidence:
      commits:
      - fda913a70
      - da96f56a4
    release_status: released_main
  - text: The message composer now adopts saved drafts without requiring a page reload.
    evidence:
      commits:
      - 980044f9a
    release_status: released_main
  - text: Map embeds now recover from loading errors without requiring a full application refresh.
    evidence:
      commits:
      - 185a03088
    release_status: released_main
  - text: The chat sidebar now correctly displays the latest news and project events.
    evidence:
      commits:
      - bf8d9e272
    release_status: released_main
  bug_fixes:
  - text: AI search skills were refined to require explicit calls and suppress fabricated results, ensuring more reliable
      follow-up responses.
    evidence:
      commits:
      - 136c6b50f
      - 63af30199
      - e596775e9
      - 4304ca60e
    release_status: released_main
  - text: Assistant speech replay was localized and stabilized to prevent playback failures.
    evidence:
      commits:
      - 592da074d
    release_status: released_main
  - text: Issue reporting was made more durable with improved diagnostic collection and authenticated submission flows.
    evidence:
      commits:
      - f2fbe5fbb
      - 75227036b
    release_status: released_main
  - text: The newsroom UI received several polish fixes, including corrected spacing, icon masking, article-specific link
      previews, and Vercel routing support.
    evidence:
      commits:
      - 55b6375c9
      - d847d459d
      - 8908b6f2a
      - b298e4654
