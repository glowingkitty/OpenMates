llm_summary:
  overview: OpenMates launched a public newsroom and social archive while upgrading its AI infrastructure with Gemini 3.8
    Flash for automatic model routing. The update also focused heavily on application reliability, specifically regarding
    issue reporting and AI skill execution.
  released_changes:
  - text: OpenMates published a new public news blog and social archives, including a dedicated publication route and manifest
      system.
    evidence:
      commits:
      - c6c58de28
    release_status: released_main
  - text: Gemini 3.8 Flash is now utilized for automatic AI model routing to improve processing efficiency.
    evidence:
      commits:
      - d88d76bf6
    release_status: released_main
  - text: Newsroom previews were updated to align with the Figma shell design, including layout and header adjustments.
    evidence:
      commits:
      - fda913a70
    release_status: released_main
  bug_fixes:
  - text: AI skill reliability was improved by requiring explicit news search calls, preserving follow-up identities, and
      suppressing fabricated tool results.
    evidence:
      commits:
      - 63af30199
      - e596775e9
      - 4304ca60e
      - 136c6b50f
    release_status: released_main
  - text: Issue reporting was made more durable with improved diagnostics for iPad audio sends and authenticated report storage.
    evidence:
      commits:
      - f2fbe5fbb
      - 75227036b
    release_status: released_main
  - text: The newsroom interface received extensive polish, including article-specific link previews, corrected sidebar icon
      masks, and Vercel routing fixes.
    evidence:
      commits:
      - 8908b6f2a
      - d847d459d
      - a92cd14cd
      - b298e4654
      - cea68f51a
      - b84ca457c
      - da96f56a4
      - 55b6375c9
      - c474e9920
    release_status: released_main
  - text: User experience fixes restored latest news to the chat sidebar, enabled draft adoption without composer reloads,
      and recovered map loading and assistant speech replay.
    evidence:
      commits:
      - bf8d9e272
      - 980044f9a
      - 185a03088
      - 592da074d
    release_status: released_main
  - text: A blocking issue for the Python SDK release was resolved.
    evidence:
      commits:
      - c313a92d2
    release_status: released_main
  unreleased_progress:
  - text: Work is underway to make stable releases authoritative within the CLI and deployment workflows.
    evidence:
      commits:
      - 27f8e88c7
    release_status: dev_only
  internal_progress:
  - text: CI performance was optimized by enabling verified prepared builds by default and pinning the test harness across
      consumers.
    evidence:
      commits:
      - b3c8c3880
      - cf102512f
      - b4e6745b9
      - 900be1a35
      - f769a9c29
    release_status: released_main
  - text: Infrastructure updates included canonicalizing schema predicates and verifying Directus system collections.
    evidence:
      commits:
      - 734f4d17c
      - 34fe7cfed
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: The launch of the public news blog and social archives.
      evidence:
        commits:
        - c6c58de28
      reason: Major user-facing feature launch for public communication.
    - text: Integration of Gemini 3.8 Flash for automatic AI model routing.
      evidence:
        commits:
        - d88d76bf6
      reason: Significant AI capability upgrade ready for public announcement.
    - text: Enhanced durability and actionability for user issue reports.
      evidence:
        commits:
        - f2fbe5fbb
      reason: Improves core application reliability and user support flow.
    - text: Release of the unblocked Python SDK.
      evidence:
        commits:
        - c313a92d2
      reason: Relevant for developers using the OpenMates ecosystem.
    exclude:
    - text: Authoritative stable release logic for the CLI.
      evidence:
        commits:
        - 27f8e88c7
      reason: This item is marked as dev_only and is not reachable from the main branch.
    rationale: The primary focus for public communication should be the new newsroom and the AI routing upgrades, as these
      provide the most visible value to users and developers.
  social_video_recommendations:
  - idea: A walkthrough of the new OpenMates Newsroom and social archives.
    priority: High
    reason: The newsroom is a visually distinct new feature that serves as a hub for project updates.
    evidence:
      commits:
      - c6c58de28
      - fda913a70
  - idea: A technical demonstration of how Gemini 3.8 Flash handles automatic routing for different AI tasks.
    priority: Medium
    reason: Demonstrates the project's commitment to using state-of-the-art models for performance.
    evidence:
      commits:
      - d88d76bf6
  quality_notes:
  - The release shows a strong emphasis on UI/UX consistency between the newsroom and design specifications.
  - Significant effort was directed toward AI routing reliability and preventing tool result fabrication.
  - CI infrastructure is being actively optimized for faster, more reliable builds.
