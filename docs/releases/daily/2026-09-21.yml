      - d88d76bf6
    release_status: dev_only
  - text: The Python SDK is being prepared for release with updated test coverage.
    evidence:
      commits:
      - c313a92d2
    release_status: dev_only
  - text: Infrastructure updates include new PDF testing dependencies and media bucket compatibility adjustments.
    evidence:
      commits:
      - e203b95cb
      - 99c6ab220
    release_status: dev_only
  internal_progress:
  - text: CI build efficiency was improved by enabling verified prepared builds by default.
    evidence:
      commits:
