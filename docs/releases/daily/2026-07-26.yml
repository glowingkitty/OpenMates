llm_summary:
  overview: OpenMates focused heavily on refining the message composer and audio recording experience, alongside significant
    hardening of internal deployment workflows and SDK parity.
  released_changes:
  - text: The message composer received several updates, including keeping the audio recording expanded during use, preventing
      control overlaps, and honoring transcript correction toggles.
    evidence:
      commits:
      - c6825ec5e
      - 60383887c
      - de6d7bdcf
      - 0b190770e
    release_status: dev_only
  - text: Composer UI refinements include matching icon placeholder colors, collapsing inactive drafts, and correcting input
      placeholders.
    evidence:
      commits:
      - 72952599e
      - 7889123c0
      - cc7775497
    release_status: dev_only
  - text: Chat settings and embeds were improved with fullscreen video previews, deep link hydration, and better alignment
      of file download and usage details.
    evidence:
      commits:
      - 76bab54b0
      - 4feab3495
      - 0a2846bf4
      - ed532fc8d
      - 49c8f3f65
    release_status: dev_only
  - text: The developer experience was enhanced by aligning SDK parity surfaces, enforcing cleartext boundaries, and adding
      plan attachment capabilities to goal chats.
    evidence:
      commits:
      - 7f6cd43f7
      - 96eff5145
      - 0de657e2e
      - 5d6af5b18
    release_status: dev_only
  bug_fixes:
  - text: OpenMates now purges local data upon a forced logout to ensure account security.
    evidence:
      commits:
      - 2a52ae116
    release_status: dev_only
  - text: Issue reporting was improved by normalizing contact text, chat error reports, and restoring timeline log ingestion.
    evidence:
      commits:
      - b5cf5cf90
      - 6f8ed1830
      - a6c7c8cee
    release_status: dev_only
  - text: The landing page and guest onboarding experience were stabilized with layout fixes and reset logic for new chats.
    evidence:
      commits:
      - 863acf3c7
      - 8e85f17b4
      - 713341d3b
      - 3cfa039c1
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added the ability to unlink items from projects, though the projects platform remains disabled.
    evidence:
      commits:
      - 337717f85
    release_status: dev_only
  - text: Work continued on automated Revolut bank transfer crediting for the currently disabled plans platform.
    evidence:
      commits:
      - 600ba1dda
    release_status: dev_only
  - text: Updates were made to align recording controls and compliance specs for the unreleased iOS and macOS platforms.
    evidence:
      commits:
      - 38969fb3c
      - 480faffb6
      - d6dceb45a
    release_status: dev_only
  - text: Internal refactoring removed stale documentation skills from the unreleased workflows platform.
    evidence:
      commits:
      - 9884c310b
    release_status: dev_only
  internal_progress:
  - text: The agent worktree and OpenCode deployment workflows were hardened with new guards against index races and unauthorized
      edits.
    evidence:
      commits:
      - 75103a3f6
      - c17f24fee
      - 5ac449a81
      - deed35e73
    release_status: dev_only
  - text: CI stability was improved by adding validation for staged deploy files and resetting stale lock states.
    evidence:
      commits:
      - 94d188ac0
      - c91cb052f
      - 79c567e24
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Project item unlinking features.
      evidence:
        commits:
        - 337717f85
      reason: The projects platform is currently disabled.
    - text: Automated Revolut bank transfer crediting.
      evidence:
        commits:
        - 600ba1dda
      reason: The plans platform is currently disabled.
    - text: Apple-specific recording controls and compliance updates.
      evidence:
        commits:
        - 38969fb3c
        - 480faffb6
        - d6dceb45a
      reason: iOS and macOS platforms are currently disabled.
    - text: Workflow capability refactoring.
      evidence:
        commits:
        - 9884c310b
      reason: The workflows platform is currently disabled.
    rationale: All changes from this period are currently in dev_only status and not yet reachable from the main branch.
  social_video_recommendations:
  - idea: A demonstration of the refined audio recording experience in the composer, highlighting the new shortcut focus and
      transcript controls.
    priority: medium
    reason: The composer updates represent a tangible improvement to the primary user interaction loop.
    evidence:
      commits:
      - c6825ec5e
      - 60383887c
      - de6d7bdcf
      - 0b190770e
  quality_notes:
  - Extensive focus on UI edge cases in the message composer, particularly around audio recording and draft management.
  - Significant effort to maintain parity between the Python SDK and the CLI tool.
  validation_warnings: []
