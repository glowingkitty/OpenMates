      Team-based embed reads.
    evidence:
      commits:
      - 5e32e6cba
      - 8e13e9346
      - 4442c89a0
    release_status: unreleased_feature
  - text: The CLI experience was stabilized with fixes for login flow completion, keyring-related recovery failures, and canonical
      history ID preservation.
