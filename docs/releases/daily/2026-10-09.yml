llm_summary:
  overview: OpenMates focused on AI infrastructure refinements, including native history caching and project routing, alongside
    security hardening for Team collaboration and CLI authentication.
  released_changes: []
  bug_fixes:
  - text: AI stability was improved by fixing native cache history retention after skill formatting and repairing anonymous
      chat recovery.
    evidence:
      commits:
      - 1a7e212ea
      - bfb525f05
    release_status: unreleased_feature
