llm_summary:
  overview: OpenMates introduced integrated Gemini voice calls and expanded the Jobs app with country-scoped searching and
    impact boards. A major performance suite was also released, significantly reducing chat latency by overlapping context
    preparation and streamlining routing. Quality updates focused on landing page stability, mobile readability for job results,
    and improved memory display in chats.
  released_changes:
  - text: OpenMates added chat-bound Gemini voice calls, allowing users to initiate voice sessions directly from the chat
      interface.
    evidence:
      commits:
      - 4a088fd84
    release_status: released_main
  - text: The Jobs app now supports country-scoped searches and includes impact boards for better result visualization.
    evidence:
      commits:
      - c5ef75c5a
    release_status: released_main
  - text: A suite of performance improvements was implemented to reduce chat admission and first-text latency, including overlapping
      context preparation with admission and streamlining model dispatch.
    evidence:
      commits:
      - b57dadf12
      - eb0af3a86
      - 149dc6000
      - 58a36dee0
      - 3d64cfe15
      - 94d03b1aa
    release_status: released_main
  bug_fixes:
  - text: Fast routing for ordinary chat requests has been restored to improve response times.
    evidence:
      commits:
      - 62549591a
    release_status: released_main
  - text: Backend skill completion and recovery mechanisms were repaired to ensure assistant reliability.
    evidence:
      commits:
      - 3d3432e49
    release_status: released_main
  - text: The marketing landing page received several stability updates, including improved responsiveness, wheel momentum,
      and corrected reveal animations.
