      commits:
      - 7b9e541e1
    release_status: released_main
  - text: Optional answer recovery and device email discovery processes were fixed.
    evidence:
      commits:
      - dc62fdd06
    release_status: released_main
  - text: Jobs search results now maintain readability on mobile devices and provide accurate city filters and ranking warnings.
    evidence:
      commits:
      - 579a1660b
      - 79b3cfd17
    release_status: released_main
  - text: Team selection is now correctly preserved within the quick access settings.
    evidence:
      commits:
      - f486d07f5
    release_status: released_main
  - text: Memory display was improved to show loaded memories on pending replies and use more compact activity summaries.
    evidence:
      commits:
      - b8469508c
      - 5979a80c0
    release_status: released_main
  - text: Chat admission through the service dispatcher is now atomic to prevent session conflicts.
    evidence:
      commits:
      - 1c7d8e294
    release_status: released_main
