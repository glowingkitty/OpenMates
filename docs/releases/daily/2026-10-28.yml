  overview: OpenMates focused on privacy-enhancing features, including local PII detection and redaction, alongside significant
    reliability improvements for AI-driven tasks like code execution and diagram generation. Infrastructure work centered
    on disk coordination and SDK conformance.
  released_changes: []
  bug_fixes:
  - text: Improved AI reliability by recovering native diagrams from text sketches and loading memories on demand during diagram
      generation.
    evidence:
      commits:
      - '338395380'
      - 7d260a053
    release_status: dev_only
  - text: Hardened assistant code execution by ensuring atomic file bundles, resolving Python dependency conflicts, and improving
      result resumption.
    evidence:
      commits:
      - 454a24a30
      - 43cf88b8b
      - ac1145c66
      - 4ed830279
    release_status: dev_only
  - text: Refined the messaging experience with budget-protected guest audio transcription, recovery of interrupted follow-up
      messages, and draft corruption prevention.
