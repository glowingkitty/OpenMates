llm_summary:
  overview: OpenMates focused on major unreleased features including a new embroidery design skill, a manual slides editor
    for web, and assistant-driven memory writes. Significant progress was also made on job-search focus modes and image generation
    versioning within the development branch.
  released_changes: []
  bug_fixes:
  - text: OpenMates updated the embroidery skill to decrypt downloads in the browser and read generated SVGs through owner-bound
      media indices.
    evidence:
      commits:
      - 27d9d16e47
      - 3cc5d6fc59
    release_status: dev_only
  - text: Image generation cards now re-resolve correctly when waiting for versions, and previews show the full picture instead
      of a cropped view.
    evidence:
      commits:
      - e6782b1e25
      - 5c1ab3c086
      - c1a9d701f7
      - 7769c13746
    release_status: dev_only
  - text: Job-search focus modes now correctly handle relevance ranking and treat privacy placeholders as real values.
    evidence:
      commits:
      - 2b793ea558
      - fb934cdabe
    release_status: dev_only
  - text: The web app fixed issues where the first send after login could hang and draft chats would fail to stay closed when
      using the Rust client core.
    evidence:
      commits:
      - 401faa71fe
      - 6b19c99b70
      - 5ca9592e6d
    release_status: dev_only
  - text: App skill embeds are now prevented from rendering directly in assistant answer bodies, ensuring only results are
      shown.
    evidence:
      commits:
      - 0a57ce9665
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added an embroidery skill that converts vector graphics to machine files using Ink/Stitch in a sandbox,
      providing sewing time and thread length estimates.
    evidence:
      commits:
      - 2b64dbec67
      - 751a56d90e
      - 6680c49584
      - aa1f0308b3
      - ac378c95bc
    release_status: dev_only
  - text: A manual slides editor and presenter view were introduced for the web app, powered by a new Rust core deck model.
    evidence:
      commits:
      - 1c94e56d88
      - 44a462aa65
      - 02af2dfda5
      - fa6c5f1e1c
      - 520080dcf4
    release_status: dev_only
  - text: The project added support for assistant-driven memory writes that are applied by the client with undo capabilities.
    evidence:
      commits:
      - c75d22343b
      - c8bcf3c321
    release_status: dev_only
  - text: Integration of Claude Fable 5.2 was completed, including support for cache-tariff billing.
    evidence:
      commits:
      - 2f2260eaa7
      - b42916bfea
    release_status: dev_only
  - text: Self-hosting operators can now install app packages into an isolated runner environment.
    evidence:
      commits:
      - 88946b588d
    release_status: dev_only
  - text: Development began on assistant-created Projects and native commits, though these features remain disabled.
    evidence:
      commits:
      - bf579b3c4e
    release_status: dev_only
  internal_progress:
  - text: Apple testing lanes were upgraded to macos-26 and Xcode 26.6, with improved handling for hung tests.
    evidence:
      commits:
      - 137d080a48
      - 0b5b800cf1
      - 1d3dab702c
      - 69af6aee7d
      - f6778dd645
    release_status: dev_only
  - text: Internal scripts for daily briefings were updated to include waiting chat summaries and carry over missed weekly
      goals.
    evidence:
      commits:
      - 15e5de91ee
      - 876d7dac93
      - 5a78c1f55b
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Embroidery design skill and Ink/Stitch sandbox.
      evidence:
        commits:
        - 2b64dbec67
        - 751a56d90e
        - 6680c49584
        - aa1f0308b3
      reason: Feature is currently unreleased and in the development branch.
    - text: Manual slides editor and presenter view for web.
      evidence:
        commits:
        - 1c94e56d88
        - 44a462aa65
        - 02af2dfda5
        - 520080dcf4
      reason: Feature is currently unreleased and in the development branch.
    - text: Assistant-driven memory writes with client-side application.
      evidence:
        commits:
        - c75d22343b
        - c8bcf3c321
      reason: Feature is currently unreleased and in the development branch.
    - text: Assistant-created Projects and native commits.
      evidence:
        commits:
        - bf579b3c4e
      reason: Feature is disabled in feature availability and unreleased.
    rationale: All changes from this period are currently in the development branch (dev_only) and have not been released
      to the main production environment. No items meet the criteria for public communication.
  social_video_recommendations:
  - idea: Demonstrate the new Embroidery sandbox converting vector graphics into stitch patterns with sewing estimates.
    priority: Medium
    reason: This is a highly visual and unique AI application that tells a strong product story.
    evidence:
      commits:
      - 2b64dbec67
      - 751a56d90e
  quality_notes:
  - Extensive integration testing was performed for the Rust client core on web via dev deployments (8b6ac20ac5, c15de25d29).
  - New recovery logic was implemented to ensure Slides and Embroidery embeds can be restored after connection loss (bc14cf0c56,
    d9b1f95ca7).
