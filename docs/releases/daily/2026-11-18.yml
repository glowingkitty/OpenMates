llm_summary:
  overview: OpenMates refined the web application's handling of message drafts and voice call history while advancing unreleased
    features for CV tailoring and automated chat resumption.
  released_changes:
  - text: Inactive composer drafts with embeds are now minimized to a summary line to save space in the UI.
    evidence:
      commits:
      - f84b247977
    release_status: released_main
  - text: Improved the visibility of drafted Specification cards when they appear within assistant activity groups.
    evidence:
      commits:
      - cabf98a987
    release_status: released_main
  - text: Voice call chats now correctly trigger the 'last opened' status, ensuring they appear in the 'Continue where you
      left off' list.
    evidence:
      commits:
      - f7750f2211
    release_status: released_main
  bug_fixes: []
  unreleased_progress:
  - text: Development continues on a CV creation focus mode that manages a master CV and tailors it using style notes.
    evidence:
      commits:
      - 500950c3a7
    release_status: dev_only
  - text: Issue reporting is being updated to preserve full text for long reports and enforce a two-minute cap on dictated
      audio.
    evidence:
      commits:
      - af9daf3288
    release_status: dev_only
  - text: A new chat lifecycle waiter is in development to wake chats at specific times or following weekly usage resets.
    evidence:
      commits:
      - 23a923eb31
      - a70d43b924
    release_status: dev_only
  - text: Improvements to the Plans application, including card visibility in answers, remain unreleased while the feature
      is disabled.
    evidence:
      commits:
      - c5a3aeb41a
    release_status: released_main
  internal_progress:
  - text: The project updated deployment scripts to promote the web app based on deployment IDs and backend health checks.
    evidence:
      commits:
      - 7f4c1e7a72
      - dd4da047d8
      - 6f3d9bae32
    release_status: dev_only
  - text: CI workflows now require per-project Vercel status checks before proceeding with a release.
    evidence:
      commits:
      - 8dd52001fe
    release_status: dev_only
  - text: New feature gates were added to the release configuration for orchestration and Figma integrations.
    evidence:
      commits:
      - 9db620d1ab
    release_status: released_main
  - text: Documentation was updated regarding PR naming conventions and release override procedures for daily meetings.
    evidence:
      commits:
      - 8e7fb4fa55
      - ecca8ced15
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: The web interface now minimizes inactive composer drafts containing embeds into a single summary line, such as
        '[Image]' or '[Sheet]'.
      evidence:
        commits:
        - f84b247977
      reason: This is a user-facing UI improvement released to the main branch.
    - text: Drafted Specification cards now remain visible when grouped with other assistant skill calls.
      evidence:
        commits:
        - cabf98a987
      reason: This is a user-facing bug fix released to the main branch that improves assistant interaction visibility.
    - text: Voice call interactions now correctly update the 'last opened' chat state, allowing users to resume these conversations
        via the 'Continue where you left off' section.
      evidence:
        commits:
        - f7750f2211
      reason: This is a user-facing fix released to the main branch that improves the 'Continue where you left off' experience.
    exclude:
    - text: Visibility improvements for drafted Specification and Plan cards in assistant answers.
      evidence:
        commits:
        - c5a3aeb41a
      reason: The related feature 'app:plans' is currently disabled in the feature availability configuration.
    - text: New CV tailoring focus mode for the Jobs application.
      evidence:
        commits:
        - 500950c3a7
      reason: This feature is currently in dev_only status and not reachable from the main branch.
    - text: Dictation quota and long report handling for issue reporting.
      evidence:
        commits:
        - af9daf3288
      reason: This bug fix is currently in dev_only status and not reachable from the main branch.
    rationale: The selected items are user-facing improvements and fixes that have been released to the main branch and are
      ready for public communication. Items related to disabled features like Plans or dev-only work are excluded.
  social_video_recommendations:
  - idea: Demonstrate voice call continuity by showing a call ending and then immediately appearing at the top of the 'Continue
      where you left off' section.
    priority: medium
    reason: Provides a concrete product story about seamless conversation resumption.
    evidence:
      commits:
      - f7750f2211
  - idea: Show a 'before and after' of the composer with multiple drafts, highlighting how the new summary lines clean up
      the interface.
    priority: low
    reason: Visual UI refinement that is easy to demonstrate.
    evidence:
      commits:
      - f84b247977
  quality_notes:
  - Several user-facing fixes for the web app were successfully merged to main, while larger feature work for Jobs and Chat
    Lifecycle remains in development branches.
  validation_warnings: []
