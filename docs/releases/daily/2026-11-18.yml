llm_summary:
  overview: OpenMates focused on web interface refinements and voice call continuity today. Key updates include a more compact
    draft view in the composer and improved tracking for voice sessions. Significant unreleased work progressed on job application
    tools and internal deployment infrastructure.
  released_changes:
  - text: OpenMates added a minimized summary view for inactive composer drafts that include embeds like images or sheets.
    evidence:
      commits:
      - f84b247977
    release_status: released_main
  - text: The project improved the display of assistant activity groups to ensure drafted specifications are not hidden when
      grouped with other skill calls.
    evidence:
      commits:
      - cabf98a987
    release_status: released_main
  bug_fixes:
  - text: Resolved an issue where voice call chats would not appear in the 'Continue where you left off' section after a turn.
    evidence:
      commits:
      - f7750f2211
    release_status: released_main
  - text: Fixed the visibility of drafted Specification cards when they are grouped with other skill calls in the web interface.
    evidence:
      commits:
      - cabf98a987
    release_status: released_main
  - text: Corrected the behavior of inactive composer drafts containing embeds, which now minimize to a summary line (e.g.,
      [Image] or [Sheet]) instead of remaining expanded.
    evidence:
      commits:
      - f84b247977
    release_status: released_main
  unreleased_progress:
  - text: Development continued on the Jobs focus mode, including a structured master CV system that allows for tailored resumes
      and style note reuse.
    evidence:
      commits:
      - 500950c3a7
    release_status: dev_only
  - text: Work is underway to improve issue reporting, specifically ensuring dictated text is preserved at the 2-minute cap
      and long reports are not truncated.
    evidence:
      commits:
      - af9daf3288
    release_status: dev_only
  - text: New chat lifecycle waiters are being tested to wake chats based on specific times or weekly usage resets.
    evidence:
      commits:
      - 23a923eb31
      - a70d43b924
    release_status: dev_only
  - text: While the Plans feature remains disabled, updates were made to keep Specification and Plan cards visible within
      assistant answers.
    evidence:
      commits:
      - c5a3aeb41a
    release_status: released_main
  internal_progress:
  - text: Refined the production web app promotion scripts to use deployment IDs for aliasing and improved error reporting
      for failed candidates.
    evidence:
      commits:
      - 7f4c1e7a72
      - dd4da047d8
      - 6f3d9bae32
    release_status: dev_only
  - text: Updated CI release gates to require per-project Vercel deployment statuses.
    evidence:
      commits:
      - 8dd52001fe
    release_status: dev_only
  - text: Updated release configurations to gate orchestration, slides templates, and Figma-related features.
    evidence:
      commits:
      - 9db620d1ab
    release_status: released_main
  - text: Updated internal documentation regarding pull request naming conventions and daily meeting briefing procedures.
    evidence:
      commits:
      - 8e7fb4fa55
      - ecca8ced15
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: The web composer now automatically minimizes inactive drafts containing images or sheets into a clean summary
        line.
      evidence:
        commits:
        - f84b247977
      reason: This is a polished UI improvement for the web app that affects all users with active drafts.
    - text: Voice calls now correctly update the 'last opened' status, ensuring you can pick up exactly where you left off
        from the home screen.
      evidence:
        commits:
        - f7750f2211
      reason: Improves the reliability of the voice call experience and cross-session continuity.
    - text: Assistant activity grouping has been refined to ensure drafted specifications remain visible when multiple skills
        are active.
      evidence:
        commits:
        - cabf98a987
      reason: Ensures critical assistant activity information remains visible during complex interactions.
    exclude:
    - text: Visibility improvements for drafted Specification and Plan cards.
      evidence:
        commits:
        - c5a3aeb41a
      reason: The Plans feature is currently disabled in the production environment.
    - text: New master CV tailoring and style note reuse in Jobs focus mode.
      evidence:
        commits:
        - 500950c3a7
      reason: The Jobs focus mode updates are currently in development and not yet released to main.
    - text: Dictation quota and text retention fixes for issue reporting.
      evidence:
        commits:
        - af9daf3288
      reason: Issue reporting improvements are currently dev-only.
    rationale: The newsletter focuses on released refinements to the web composer and voice call continuity, while excluding
      features gated by disabled flags or still in the development branch.
  social_video_recommendations:
  - idea: A short clip showing a user switching between multiple chats and seeing the composer drafts neatly minimize into
      '[Image]' or '[Sheet]' tags.
    priority: medium
    reason: Visual UI polish that demonstrates the app's ability to handle complex user states cleanly.
    evidence:
      commits:
      - f84b247977
  - idea: Demonstrate starting a voice call, ending it, and then immediately seeing that chat at the top of the 'Continue
      where you left off' list.
    priority: low
    reason: Shows functional reliability and continuity in the mobile-friendly voice experience.
    evidence:
      commits:
      - f7750f2211
  quality_notes:
  - The web app UI is becoming more resilient to complex states, such as multiple active skill calls and large drafts.
  - Internal deployment scripts were hardened to ensure backend health before promoting frontend changes.
  validation_warnings: []
