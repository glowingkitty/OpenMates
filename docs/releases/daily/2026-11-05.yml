      evidence:
        commits:
        - 257681f667
      reason: This feature is currently in development and has not been merged to the main branch.
    - text: Simplified issue reporting flow.
      evidence:
        commits:
        - af17bcec16
      reason: This feature is currently in development and has not been merged to the main branch.
    rationale: No user-facing changes were released to the main branch during this period. All updates are currently in the
      development branch.
