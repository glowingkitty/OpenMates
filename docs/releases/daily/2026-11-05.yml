llm_summary:
  overview: OpenMates focused on AI infrastructure and search refinements, introducing server region preferences and server-side
    geocoding for event cards. The update also includes significant UI improvements for spreadsheet embeds and the issue reporting
    experience.
  released_changes: []
  bug_fixes:
  - text: PII detection was refined to prevent standalone interjections like "Awesome" from being incorrectly flagged as personal
      names.
    evidence:
      commits:
      - 3a3d69a2b2
    release_status: dev_only
  - text: The PDF processing logic now preserves file indices and Vault keys when handling specific page lists.
    evidence:
      commits:
      - 6fc9fe34b9
    release_status: dev_only
  - text: Event embeds were updated to display sources at the bottom, improve mobile carousel visibility, and ensure maps
      use geocoded coordinates rather than model-generated guesses.
    evidence:
      commits:
      - 4733976b8d
      - fc7634b845
    release_status: dev_only
  - text: Fullscreen spreadsheet views now scroll as a single surface with pinned headers and improved formula cell styling.
    evidence:
      commits:
      - 667adc822c
      - 652a9efb8b
    release_status: dev_only
  - text: Chat drafts are now preserved if the user stops AI generation after output has already started.
    evidence:
      commits:
      - 0109e71b0b
    release_status: dev_only
  - text: The voice call composer was adjusted to show a transcript-only active state without conflicting navigation options.
    evidence:
      commits:
      - 8bd9ef3657
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates added server region preferences (EU or Fastest) and updated the @fast mention to utilize Mercury 3.
    evidence:
      commits:
      - 2d89714338
    release_status: dev_only
  - text: Event search now utilizes server-side geocoding and improved logic for recurring events like FOSDEM.
    evidence:
      commits:
      - 257681f667
      - 47ddd574d9
    release_status: dev_only
  - text: A simplified Report Issue form was introduced, featuring automatic dispatch for administrative reports.
    evidence:
      commits:
      - af17bcec16
    release_status: dev_only
  - text: A new delete action was added to the reminders integration for explicit task management.
    evidence:
      commits:
      - a17c6510f6
    release_status: dev_only
  internal_progress:
  - text: The daily briefing now includes automated alerts for reported issues and repeating errors.
    evidence:
      commits:
      - 8f5fea1355
      - f19d76746f
    release_status: dev_only
  - text: Fixed a path resolution issue for Claude-based issue dispatching in cron environments.
    evidence:
      commits:
      - edc86013e8
    release_status: dev_only
  - text: Implemented a deployment gate to validate translation keys for new focus modes.
    evidence:
      commits:
      - a7a9a0748a
    release_status: dev_only
