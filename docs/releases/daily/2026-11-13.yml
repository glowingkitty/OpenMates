llm_summary:
  overview: OpenMates introduced significant privacy enhancements for Memories, refined the voice call experience, and improved
    the visibility of agentic coding results. A major internal milestone was reached with the migration of core web application
    logic to the Rust core. Work also progressed on unreleased orchestration features and Apple platform parity.
  released_changes:
  - text: OpenMates now protects sensitive data by keeping real details in stored Memories and using placeholders when data
      is sent to the AI.
    evidence:
      commits:
      - c8a17d4380
    release_status: released_main
  - text: Project Memories now support 'Ask first' and 'Mention only' permissions. The CLI and terminal UI now support binding
      new chats to specific Projects.
    evidence:
      commits:
      - e6a416b33f
      - ee0b6d6e9f
    release_status: released_main
  - text: Gemini 4 Carbon is now available for @mentions across the CLI, TUI, and Rust core.
    evidence:
      commits:
      - d63fcca1cb
    release_status: released_main
  - text: Unfenced application script files are now automatically treated as Project files.
    evidence:
      commits:
      - 6e93e37f66
    release_status: released_main
  bug_fixes:
  - text: The first call turn in a new chat now plays a neutral system voice and chime instead of a guessed Mate voice.
    evidence:
      commits:
      - 21372775f6
    release_status: released_main
  - text: Voice calls now use the selected Mate's voice from the first word and accurately highlight spoken words.
    evidence:
      commits:
      - f681e015e6
    release_status: released_main
  - text: Recorded test videos and preview frames can now be played directly within the web test result cards.
    evidence:
      commits:
      - 912a4b2f67
    release_status: released_main
  - text: Test run evidence is now stored correctly under test result embeds to ensure video links resolve properly.
    evidence:
      commits:
      - 92419d9563
    release_status: released_main
  - text: Assistant replies now consistently include test results for coding turns, including those requiring dependency installation.
    evidence:
      commits:
      - 5dbcdbf621
      - 437aa3714b
    release_status: released_main
  - text: Deleting a chat now correctly frees its AI context slot, preventing new chat refusals.
    evidence:
      commits:
      - 564926cf30
    release_status: released_main
  - text: The web source now respects site terms that forbid automated data collection.
    evidence:
      commits:
      - aec57d7b3c
    release_status: released_main
  - text: Concurrent artifact storage by different clients of the same account no longer causes turn refusals.
    evidence:
      commits:
      - 2cdf27c60b
    release_status: released_main
  - text: Rejected project operations no longer block subsequent writes or turn completion.
    evidence:
      commits:
      - 8c770a3ddf
    release_status: released_main
  unreleased_progress:
  - text: Development continued on Apple platform parity, including macOS core linking, project file entries, and test-result
      previews for iOS.
    evidence:
      commits:
      - 7127adf367
      - 07addd1b93
      - bcc20ba144
    release_status: dev_only
  - text: New orchestration features are in progress, allowing chats to coordinate other main chats and handle automatic interpreting
      turns during active calls.
    evidence:
      commits:
      - e835939a16
      - c88dd5f969
      - dd50cc1235
    release_status: dev_only
  - text: The project is preparing file editing capabilities for docs, sheets, and code within Project folders, along with
      new focus mode suggestions.
    evidence:
      commits:
      - 7512c73eb1
      - 4ef635ec3d
    release_status: dev_only
  - text: Event search capabilities are being expanded to include public web pages and official schedules with usage-based
      billing.
    evidence:
      commits:
      - d114c85b2b
      - 722732024d
    release_status: dev_only
  internal_progress:
  - text: OpenMates completed a major migration of web application logic to the Rust core, including cache decisions, WebSocket
      lifecycles, workspace requests, and search.
    evidence:
      commits:
      - aabaaf74c9
      - c17164fa5b
      - b6af4d0c38
      - 5dff8a2680
      - e2fde9611d
      - 80d5d8e6c7
    release_status: released_main
  - text: A new read-only aggregate admin endpoint now provides production growth metrics for briefings.
    evidence:
      commits:
      - c83de9c2be
    release_status: released_main
  - text: CI infrastructure was upgraded with E2B overflow runners, isolated GitHub runners, and improved failure reporting.
    evidence:
      commits:
      - 6f6c0dc7b5
      - aaedbc166b
      - 8b27e67835
      - 934dbb9106
      - 479a13eab0
    release_status: dev_only
  newsletter_recommendation:
    include:
    - text: 'Enhanced Memory privacy: Real details now stay in stored Memories while the client uses placeholders when communicating
        with the AI.'
      evidence:
        commits:
        - c8a17d4380
      reason: Significant privacy improvement for how user data is handled during AI interactions.
    - text: 'Project Memory controls: ''Ask first'' and ''Mention only'' settings are now available for Project Memories,
        with new CLI support for project-bound chats.'
      evidence:
        commits:
        - e6a416b33f
        - ee0b6d6e9f
      reason: Improves user control over how the AI accesses specific project contexts.
    - text: 'Integrated video playback for test results: Users can now view recorded test runs and preview frames directly
        in the web interface.'
      evidence:
        commits:
        - 912a4b2f67
      reason: Visual improvement to the agentic coding experience.
    - text: 'Polished voice call experience: Calls now feature neutral system introductions and improved word-level highlighting.'
      evidence:
        commits:
        - 21372775f6
        - f681e015e6
      reason: Refines the voice interaction experience to be more professional and responsive.
    exclude:
    - text: Apple platform parity and native core linking.
      evidence:
        commits:
        - 7127adf367
        - 07addd1b93
        - bcc20ba144
      reason: Apple platforms (iOS, macOS, Apple Watch) are currently disabled features.
    - text: Usage-based event search and production enablement.
      evidence:
        commits:
        - d114c85b2b
        - 722732024d
      reason: The event search skill is currently disabled.
    - text: Cross-chat messaging and automatic interpreting turns.
      evidence:
        commits:
        - e835939a16
        - c88dd5f969
        - dd50cc1235
      reason: Advanced chat orchestration features are currently dev-only.
    - text: Project folder file editing and focus suggestions.
      evidence:
        commits:
        - 7512c73eb1
        - 4ef635ec3d
      reason: The Projects app and platform are currently disabled.
    rationale: The newsletter highlights focus on released privacy enhancements, improved project context controls, and visual
      updates to the coding and voice experiences. Unreleased orchestration and disabled platform features are excluded.
  social_video_recommendations:
  - idea: Showcase the new test result video playback.
    priority: Medium
    reason: Demonstrates the 'agentic coding' story by showing how the AI provides visual proof of its work.
    evidence:
      commits:
      - 912a4b2f67
  quality_notes:
  - The project successfully migrated six major web subsystems to the Rust core, improving cross-platform consistency.
  - Privacy was prioritized with the introduction of client-side placeholders for Memories sent to the AI.
  - Agentic coding workflows are now more transparent with integrated video evidence in test results.
  validation_warnings: []
