llm_summary:
  overview: OpenMates focused on internal infrastructure, the development of the Task Activity system, and chat stability.
    Significant work was done on WebSocket reliability and the integration of new AI model providers.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: OpenMates added an encrypted Task Activity API and corresponding client SDKs for Python and the CLI, though the
      feature remains disabled in production.
    evidence:
      commits:
      - 32d6f87f9
      - 75cd79c18
      - 070c8f69b
    release_status: dev_only
  - text: Support for the Cerebras Qwen 3.8 27B model was added to the backend and CLI for evaluation as a fast model alias.
    evidence:
      commits:
      - ca7647db3
      - ac415dc8e
    release_status: dev_only
  - text: The project improved OpenCode session integrity, including better worktree recovery, storage compatibility gating,
      and local development synchronization after managed deploys.
    evidence:
      commits:
      - 68a63f563
      - 35ea39d74
      - fe9a972c9
      - b757479ee
      - b5f480efc
    release_status: dev_only
  - text: WebSocket communication was hardened with bounded metadata broadcasts, improved preflight handling for chat turns,
      and non-blocking chat recovery reads.
    evidence:
      commits:
      - cb8811d45
      - 5dc662ece
      - b28ad2587
      - a0c29da3c
      - 1c2df761c
      - 031bb6aca
    release_status: dev_only
  - text: The mobile landing page heading was adjusted to improve layout on smaller screens.
    evidence:
      commits:
      - 6deaa1a77
    release_status: dev_only
  internal_progress:
  - text: CI workflows were updated to ensure daily Playwright coverage remains active and to improve account provisioning
      dispatch logic.
    evidence:
      commits:
      - 25b54cb22
      - b31d85a5d
      - 4ebd06810
    release_status: dev_only
  - text: Extensive test framing was implemented for API key scopes, specifically targeting task permissions and full access
      warnings.
    evidence:
      commits:
      - 7862bdb31
      - 79b8446ae
      - 6b0fcfce8
      - 851ea1d15
      - da4021cd7
      - 124a593f4
      - 7e5bc37a4
    release_status: dev_only
  - text: Internal tracing and error handling for speech preflight boundaries and deferred voice finalization were added to
      the chat system.
    evidence:
      commits:
      - bce144d09
      - 3b3cd5d75
      - a45dd8a45
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Task Activity API and SDKs
      evidence:
        commits:
        - 32d6f87f9
        - 75cd79c18
      reason: The Task Activity feature is currently disabled via platform:tasks and is not yet released to main.
    - text: Cerebras Qwen 3.8 27B Support
      evidence:
        commits:
        - ca7647db3
        - ac415dc8e
      reason: Support for the Cerebras Qwen model is currently internal and not ready for public communication.
    rationale: No user-facing features reached the main branch or were marked ready for public communication during this period.
      Work focused on internal infrastructure and unreleased feature development.
  social_video_recommendations:
  - idea: A technical preview of the upcoming Task Activity API and Python SDK.
    priority: low
    reason: The feature is in active development and provides a concrete story about platform extensibility.
    evidence:
      commits:
      - 32d6f87f9
      - 75cd79c18
  quality_notes:
  - All user-facing changes are currently restricted to development branches.
  - Task-related features are gated by the platform:tasks feature flag.
  validation_warnings: []
