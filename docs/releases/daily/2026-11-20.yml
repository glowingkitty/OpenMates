llm_summary:
  overview: OpenMates focused on building a robust AI test user framework for automated quality assurance, migrating Project
    management capabilities to the Rust core, and refining AI routing for specialized skills. Significant work was also done
    on voice call pause detection and start-screen layout improvements.
  released_changes: []
  bug_fixes:
  - text: Voice call reliability was improved by ensuring the first call after signup connects and retrying rejected spoken
      turns.
    evidence:
      commits:
      - 288c3228c3
    release_status: dev_only
  - text: AI routing and skill selection were refined to ensure specialized skills (like event search) are prioritized before
      web search fallbacks, and conference-related queries now search all available event sources.
    evidence:
      commits:
      - e048f1bf29
      - 5ed886069b
      - add576312d
      - eab1a9f351
      - d4788e1038
      - 3001cbffd7
      - 57771836ac
    release_status: dev_only
  - text: Focus mode logic was updated to prevent automatic activation from expiring during long AI turns and to improve the
      transition between layered focus views.
    evidence:
      commits:
      - 60ee4d0450
      - 2d000adf7b
      - b4891237b3
      - 6c6fe8dc66
      - f55445c430
    release_status: dev_only
  - text: Chat synchronization was improved by ensuring unread counters clear correctly across mobile and tablet devices once
      a reply is seen.
    evidence:
      commits:
      - 01a87e47cd
      - a570dadb84
    release_status: dev_only
  - text: Safety features were strengthened by ensuring account suspensions sign out the user across all active sessions and
      improving the rendering of helpline cards.
    evidence:
      commits:
      - 9451baa998
    release_status: dev_only
  - text: The standalone landing page now correctly displays the actionable event embed animation.
    evidence:
      commits:
      - 326202e513
    release_status: dev_only
  - text: Job search hints were corrected to remove outdated geographic availability restrictions.
    evidence:
      commits:
      - ddec657a10
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates is developing an AI test user framework that simulates real web signups, records session videos, and generates
      multi-screenshot issue reports to Discord.
    evidence:
      commits:
      - 0bbe50d656
      - 011e2dbe6e
      - 3640b2b502
      - dd5e8e345b
      - 1583ed7799
      - 160d6fbad4
      - 3e72dfa32a
      - 60a87dded4
    release_status: dev_only
  - text: The project is integrating Project creation and hosted file jobs into the Rust core, including WebCrypto-based key
      management for assistant-inferred projects.
    evidence:
      commits:
      - 36d9376faf
      - 7740d60a9e
      - a87828e8a2
      - e8f9f6fc33
    release_status: dev_only
  - text: A new start screen layout is in development, featuring large-card rows for daily inspirations and localized content
      suggestions.
    evidence:
      commits:
      - cd63b6de83
    release_status: dev_only
  - text: Voice call pause detection is being refined with new 'pause verdicts' to more accurately determine when a spoken
      turn has concluded.
    evidence:
      commits:
      - 0e4e862ef0
    release_status: dev_only
  - text: The Life Compass focus mode is being updated to provide country-specific crisis line information only when relevant
      to the user's context.
    evidence:
      commits:
      - d82122ad1b
    release_status: dev_only
  internal_progress:
  - text: CI infrastructure was updated with new fixtures for gifted signup flows, safety check bypasses for testing, and
      improved Playwright retry logic.
    evidence:
      commits:
      - 07a8268edf
      - f301843c2e
      - 674853ba22
      - 32933c1dd2
      - 97824e9a25
      - 090f01cf10
