      - 2bba3194d3
      - eb359d19db
      - b40a31394e
    release_status: dev_only
  - text: Internal tooling now supports deployment locks during active tests, Discord notifications for developer chat status,
      and improved management of idle chat sessions.
    evidence:
      commits:
      - 12a46ae5d9
      - f1fc1d891c
