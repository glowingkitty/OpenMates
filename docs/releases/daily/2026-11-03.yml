llm_summary:
  overview: OpenMates introduced assistant-authored result embeds and live interactive HTML visuals, while significantly improving
    voice call reliability and privacy controls. The update also includes a major architectural shift for the SDK to enforce
    API-key isolation and continues the expansion of the Rust-based core.
  released_changes:
  - text: OpenMates added assistant-authored result embeds, allowing the AI to generate structured visual components for various
      data types including financial results, calendar events, and TV titles.
    evidence:
      commits:
      - fd90c824d9
    release_status: released_main
  - text: Code embeds now support live sandboxed interactive HTML visuals, enabling real-time rendering of assistant-generated
      web content.
    evidence:
      commits:
      - b2e821a1d9
    release_status: released_main
  - text: AI processing was updated to produce more concise mixed-media answers with proactive enrichment from images and
      videos.
    evidence:
      commits:
      - 41db226783
      - 2d8d9f07d1
      - 5f4f23ca2e
    release_status: released_main
  - text: Voice call reliability was improved with faster speech start times, word-by-word spoken text highlighting, and live
      transcripts that handle thinking pauses more effectively.
    evidence:
      commits:
      - 29ee7065e3
      - 163e051198
      - 3752da59ea
      - ebd2be8a6e
      - 373003d3e9
    release_status: released_main
  - text: A new session owner consistency layer was enforced for browser writes, and a Rust-based web auth lane was introduced
      behind a feature flag.
    evidence:
      commits:
      - f24763eac6
      - cd767f7058
    release_status: released_main
  - text: The SDK root client was restricted to API-key only access to ensure isolation from CLI logins, and app-skill bindings
      were regenerated for better cross-SDK conformance.
    evidence:
      commits:
      - 39f78b1dee
      - 8dd9f013b9
      - d41fd28e4d
    release_status: released_main
  - text: The chat 'More' menu now pages actions five at a time for better navigation on smaller screens.
    evidence:
      commits:
      - ebcd865d31
    release_status: released_main
  - text: The Rust CLI now supports a wider range of chat management commands, including file handling, forking, and recovery
      parity.
    evidence:
      commits:
      - 893b910a56
    release_status: released_main
  bug_fixes:
  - text: The PII detection banner was made more compact, and the message draft now remains open when interacting with PII
      highlight or undo actions.
    evidence:
      commits:
      - 5dec50a9c5
      - 3dc3a8812b
    release_status: released_main
  - text: Automatic cross-chat summaries are now gated behind live Project focus consent.
    evidence:
      commits:
      - 2bd04c4bef
    release_status: released_main
  - text: Empty voice-call chats are now automatically deleted after interrupted calls, including when CLI or native clients
      are connected.
    evidence:
      commits:
      - 51967fb973
    release_status: released_main
  - text: Phased-sync now includes typed retryable errors with silent client backoff to improve connection stability.
    evidence:
      commits:
      - a752e1b4af
    release_status: released_main
  - text: Inline math parsing was corrected to close before spaced numbers, preventing incorrect currency interpretation.
    evidence:
      commits:
      - cc53ef26be
      - 856982889f
    release_status: released_main
  - text: IndexedDB connections are now closed on version changes to prevent multi-tab logout processes from hanging.
    evidence:
      commits:
      - 2435d69409
    release_status: released_main
  unreleased_progress:
  - text: Work on daily Workflow activity emails and integrated notifications is in progress but remains unreleased as the
      Workflow platform is disabled.
    evidence:
      commits:
      - 893028fc40
    release_status: released_main
  - text: Unified workspace composer controls and call transcripts are being developed behind the Workflows feature gate.
    evidence:
      commits:
      - '4233006907'
    release_status: released_main
  internal_progress:
  - text: Internal daily meeting briefing tools were expanded to include PDF delivery, Claude usage tracking, and integration
      with Apple Reminders for developer workflows.
    evidence:
      commits:
      - a86842b9bb
      - 3d9007af85
      - 5ac4754fa6
      - f3ed148b34
      - e50f16c263
      - f5db8813ab
    release_status: released_main
  - text: CI infrastructure was updated with a new rust-check mode, improved SDK conformance gates, and automated disk cleanup
      for build artifacts.
    evidence:
      commits:
      - 2d2cf50a90
      - ee07eaead0
      - 8f2e7ff15a
      - d75248ca2a
    release_status: released_main
  - text: The Rust-based core and TUI continued to gain parity with the web client, including shared state machines for WebSockets,
      chat management, and workspace composers.
    evidence:
      commits:
      - 90bb38b8da
      - fe8cebfa7d
      - 7ac096bfdb
      - a3c8257bec
      - 63f8dc7767
      - 6fe9d423c8
      - 42a9d600f4
      - 74752cc701
      - ff004ca04e
      - 2ccfb11b02
    release_status: released_main
  newsletter_recommendation:
    include:
    - text: Assistant-authored result embeds for structured data presentation.
      evidence:
        commits:
        - fd90c824d9
      reason: High-impact feature allowing the assistant to generate structured, visual results.
    - text: Live sandboxed interactive HTML visuals within code embeds.
      evidence:
        commits:
        - b2e821a1d9
      reason: New interactive capability for code-related tasks.
    - text: Concise mixed-media answers enriched with bounded image and video content.
      evidence:
        commits:
        - 41db226783
      reason: Improves the quality and conciseness of AI responses.
    - text: SDK root client isolation ensuring API-key only access.
      evidence:
        commits:
        - 39f78b1dee
      reason: Important security and architectural change for SDK users.
    - text: Improved personal data protection settings with clearer toggle controls.
      evidence:
        commits:
        - 891a19f467
      reason: Enhances user control over personal data.
    exclude:
    - text: Daily Workflow activity emails and integrated notifications.
      evidence:
        commits:
        - 893028fc40
      reason: Relates to Workflows, iOS, and macOS, which are currently listed as disabled features.
    - text: Unified workspace composer controls and live transcripts for calls.
      evidence:
        commits:
        - '4233006907'
      reason: Relates to Workflows, which is a disabled feature.
    - text: Daily meeting briefing scripts and usage guards.
      evidence:
        commits:
        - a86842b9bb
        - 7a425d5306
      reason: Internal developer tooling for project management.
    rationale: The update introduces significant enhancements to AI response quality and visual presentation, alongside critical
      security updates for the SDK and improved privacy controls for users.
  social_video_recommendations:
  - idea: Showcase the assistant generating a variety of structured result embeds, such as financial charts or TV series info,
      directly in the chat.
    priority: high
    reason: Visually demonstrates the new structured output capabilities.
    evidence:
      commits:
      - fd90c824d9
  - idea: Demonstrate the AI writing and immediately rendering an interactive HTML visual, like a small game or data dashboard,
      within a code block.
    priority: high
    reason: Highly engaging interactive feature that highlights the sandboxed execution environment.
    evidence:
      commits:
      - b2e821a1d9
  - idea: A split-screen showing a voice call with the live transcript appearing word-for-word as the assistant speaks.
    priority: medium
    reason: Highlights the improved latency and real-time feedback of the voice interface.
    evidence:
      commits:
      - 163e051198
      - 373003d3e9
  quality_notes:
  - The update includes extensive E2E and unit testing for new voice and sync protocols.
  - Security hardening was applied to session owner consistency and SDK authentication.
  - Several fixes address edge-case crashes in voice progress rendering and math parsing.
  validation_warnings: []
