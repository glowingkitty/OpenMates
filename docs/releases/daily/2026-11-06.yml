llm_summary:
  overview: OpenMates focused heavily on technical consolidation, migrating several core web services—including search, synchronization,
    and authentication—into a shared Rust-based worker. Significant progress was also made on local privacy features, specifically
    PII detection for documents, and enhancing the native Rust CLI to achieve parity with the npm version.
  released_changes: []
  bug_fixes:
  - text: Websocket session authority now follows refresh-token rotation to prevent refused sends after page reloads.
    evidence:
      commits:
      - 376a506462
    release_status: dev_only
  - text: The shared Rust worker no longer drops in-flight crypto calls or pending unit requests during idle retirement.
    evidence:
      commits:
      - e33563e82f
      - c745a07fc0
    release_status: dev_only
  - text: Image embed previews were updated to show full images, generate thumbnails, and support viewing as app-skill embeds.
    evidence:
      commits:
      - 070c9bc4b3
    release_status: dev_only
  - text: PDF skills now correctly wait for OCR completion and skip duplicate OCR dispatch.
    evidence:
      commits:
      - d70d07f6ed
      - e946874353
    release_status: dev_only
  - text: Chat project actions are now hidden when the projects feature is inactive.
    evidence:
      commits:
      - 346b7d16c3
    release_status: dev_only
  unreleased_progress:
  - text: OpenMates migrated chat search, sync, imports, auth, and crypto services to a shared Rust worker to improve web
      performance and consistency.
    evidence:
      commits:
      - 91d85cf9a5
      - '6615330318'
      - c577ddd944
      - b33404bac9
      - 1a8270bd35
      - d57ad3867e
      - 13c5be3d3f
      - 71f15bd439
      - 30472ca70c
      - 83fadc3fb9
    release_status: dev_only
  - text: Chat unread status logic was updated to persist until the last line of a reply is viewed in both the web and TUI
      clients.
    evidence:
      commits:
      - 9861e327eb
    release_status: dev_only
  - text: Local PII detection now supports scanning pasted documents and attached files using overlapping word windows for
      improved accuracy.
    evidence:
      commits:
      - f05cb8ee40
      - 6005f4bde0
    release_status: dev_only
  - text: XLSX and DOCX imports now preserve document structure and formulas, with PPTX support in development.
    evidence:
      commits:
      - a063bedda1
    release_status: dev_only
  - text: The native Rust CLI added support for API-key chat operations, finance CSV checks, and initial read protocols for
      Team Plans.
    evidence:
      commits:
      - 7b297d8a2e
      - c934446588
      - f6b670470d
      - ff80a6587e
      - 9423d37444
      - 365185ca52
    release_status: dev_only
  - text: The Python and npm SDKs were updated with new bindings for key management, model vectors, and shared API-key wire
      operations.
    evidence:
      commits:
      - dcb20e2978
      - eccd3addce
      - 21043b8be6
    release_status: dev_only
  - text: PDF processing was improved with concurrent safety scans to reduce readiness time for large files.
    evidence:
      commits:
      - fb78e9f194
    release_status: dev_only
  - text: The message input field now displays visible error messages when a send operation fails.
    evidence:
      commits:
      - cca7eab6d4
    release_status: dev_only
  internal_progress:
  - text: CI infrastructure for SDK conformance was enhanced to project fatal Python error reasons, tracebacks, and stdlib
      frame coordinates.
    evidence:
      commits:
      - 232567468b
      - 74a400600e
      - 330c04b523
      - b8e4f82dd7
      - 5a3b279adb
    release_status: dev_only
  - text: Conformance adapters now run in a bounded pool with independent state directories and launch timing records.
    evidence:
      commits:
      - a27748f73b
      - 47bacc123f
      - f4e6504829
      - e2982f4e36
    release_status: dev_only
  - text: The disk coordinator now releases reservations held by dead owners.
    evidence:
      commits:
      - 0361c16f3e
      - b2d6247d57
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Migration of core web services (search, sync, auth, crypto) to a shared Rust worker.
      evidence:
        commits:
        - 91d85cf9a5
        - '6615330318'
        - c577ddd944
        - b33404bac9
        - 1a8270bd35
