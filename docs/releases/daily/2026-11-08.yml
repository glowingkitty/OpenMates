      reason: The Rust migration work is internal infrastructure progress and not yet ready for public communication.
    rationale: All changes from this period are currently in development (dev_only) and have not been merged into the main
      release branch for public communication.
  social_video_recommendations:
  - idea: A technical deep-dive into PDF Processing v2, showcasing chunked OCR and per-page triage.
    priority: medium
    reason: Significant architectural upgrade with clear user benefits in speed and accuracy.
    evidence:
      commits:
      - c0b488e2ff
  - idea: Demonstration of the new Learning Mode collaborative building and age-appropriate rubrics.
    priority: low
    reason: New user-facing feature set with a strong educational story.
    evidence:
      commits:
      - 98653a207f
