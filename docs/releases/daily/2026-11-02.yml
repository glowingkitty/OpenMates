llm_summary:
  overview: OpenMates focused heavily on the transition to a shared Rust core across all platforms, landing the core logic,
    native CLI/TUI implementations, and native bindings for the npm and Python SDKs. Significant progress was made on a new
    chat sync feed architecture and internal agent workflows were migrated to Claude Code. The web frontend received enhancements
    for voice dictation and context menu navigation.
  released_changes: []
  bug_fixes: []
  unreleased_progress:
  - text: OpenMates landed the shared Rust core and native CLI/TUI, including support for native signup, teams management,
      and project file handling.
    evidence:
      commits:
      - 88ba203911
      - b042adf90c
      - 29f542b8f9
      - 849d15fed5
    release_status: dev_only
  - text: The npm and Python SDKs were updated to call the shared Rust core through native bindings, with a portable WASM
      build now available for the npm SDK.
    evidence:
      commits:
      - c56f31d76e
      - 4ecf9bf7a7
    release_status: dev_only
  - text: A new capability-gated chat sync feed was implemented over WebSockets, supported by a durable change log and cold-start
      feed cursors.
    evidence:
      commits:
      - cb8beb2bae
      - 6f6ea7c926
      - 8c16210575
    release_status: dev_only
  - text: The web frontend now supports streaming voice dictation into the composer and features a more compact, ranked chat
      context menu.
    evidence:
      commits:
      - c5f7cae5d7
      - 2c4a3bddff
    release_status: dev_only
  - text: Internal agent workflows were migrated to Claude Code, including new capabilities to link OpenMates Tasks directly
      to Claude sessions.
    evidence:
      commits:
      - 9b6de93671
      - 3de6434413
      - aef49a7d8d
    release_status: dev_only
  - text: The Rust TUI experience was enhanced with a daily inspiration banner, a home screen carousel, and improved boot
      sync performance.
    evidence:
      commits:
      - 3dca378276
      - 87844f8882
      - ddf0a4c446
      - c919dcdb97
    release_status: dev_only
  internal_progress:
  - text: OpenMates consolidated the Rust build pipeline into a single cached workflow and removed self-built authority gates.
    evidence:
      commits:
      - f0c5897604
    release_status: dev_only
  - text: The project addressed security advisory RUSTSEC-2026-0387 by updating dependencies within the OPAQUE pairing chain.
    evidence:
      commits:
      - 30c4b8a143
    release_status: dev_only
  - text: New automated maintenance scripts were added for proactive disk cleanup and daily meeting brief generation.
    evidence:
      commits:
      - b93b9e5603
      - d753e89877
      - 3c0c1310c5
    release_status: dev_only
  - text: Documentation was updated to include the new chat sync feed architecture and an expanded SDK capability matrix.
    evidence:
      commits:
      - 357f970a9e
      - d805fe16dd
    release_status: dev_only
  newsletter_recommendation:
    include: []
    exclude:
    - text: Streaming voice dictation in the composer editor.
      evidence:
        commits:
        - c5f7cae5d7
      reason: This feature is currently in development (dev_only).
    - text: Native Rust bindings and WASM core for npm and Python SDKs.
      evidence:
        commits:
        - c56f31d76e
        - 4ecf9bf7a7
      reason: These architectural changes are currently in development (dev_only).
    - text: Native CLI/TUI signup and teams management.
      evidence:
        commits:
        - b042adf90c
