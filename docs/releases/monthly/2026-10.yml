risks:
  communication:
  - Use monthly themes for release/newsletter/social planning; verify current feature availability before public communication.
sources:
  weekly_files:
  - docs/releases/weekly/2026-W40.yml
  - docs/releases/weekly/2026-W41.yml
  - docs/releases/weekly/2026-W42.yml
llm_summary:
  overview: October saw OpenMates evolve from basic model support to a sophisticated, multi-tiered intelligence platform.
    The project introduced a four-tier AI routing system to optimize model selection by task complexity and integrated real-time
    Gemini voice calling. Business utility was expanded with trademark and brand naming tools, while a comprehensive performance
    overhaul significantly reduced chat latency. Development also focused on hardening security protocols and refining the
    mobile experience for the Jobs and Wikipedia learning modules.
  released_changes:
  - text: A complexity-based routing system was added to classify AI requests into four levels, ensuring the most appropriate
      model is used for every task.
    evidence:
      commits:
      - cdfd1c233
    release_status: released_main
  - text: Integrated Gemini voice calling was introduced, featuring real-time waveform visualization and dedicated privacy
      controls.
    evidence:
      commits:
      - c1199371a
      - 4a088fd84
    release_status: released_main
  - text: Support for the GPT-6.1 Sol and Gemini 4 Argon models was added across the platform.
    evidence:
      commits:
      - 3ce91c097
      - d4b17f43a
    release_status: released_main
  - text: A suite of business tools for keyless trademark searching and brand naming was published.
    evidence:
      commits:
      - 5df803768
      - 955bf1e0e
    release_status: released_main
  - text: A comprehensive performance suite reduced chat admission and first-text latency by overlapping context preparation
      and streamlining model dispatch.
    evidence:
      commits:
      - b57dadf12
      - eb0af3a86
      - 149dc6000
      - 58a36dee0
      - 3d64cfe15
      - 94d03b1aa
    release_status: released_main
  - text: The chat composer now supports searching through saved and recent embeds for faster context retrieval.
    evidence:
      commits:
      - b0c9e12ae
    release_status: released_main
  - text: Support for ElevenLabs v4 speech models was added to the audio service.
    evidence:
      commits:
      - bc0615e12
    release_status: released_main
  - text: The Jobs app was expanded to support country-scoped searches and new impact boards for result visualization.
    evidence:
      commits:
      - c5ef75c5a
    release_status: released_main
  - text: Diagram Design now supports interactive HTML embeds that allow for direct editing.
    evidence:
      commits:
      - b5d620756
    release_status: released_main
  - text: Guest users can now view their daily usage allowance percentage for better visibility into free limits.
    evidence:
      commits:
      - 1ad45d47d
    release_status: released_main
  - text: Independent Apple Watch push targets can now be registered to improve notification reliability.
    evidence:
      commits:
      - 0b8108f0d
    release_status: released_main
  - text: The public landing page was refined with updated device media, improved section replays, and enlarged mobile hero
      elements.
    evidence:
      commits:
      - e3b567b7c
      - 25b605ad5
      - 70762ff19
    release_status: released_main
  bug_fixes:
  - text: Chat reliability was improved by implementing recovery for failed assistant replies and repairing message draft
      synchronization across web clients.
    evidence:
      commits:
      - 5090e8bf6
      - df03ac082
      - cd70270b6
    release_status: released_main
  - text: Security for passkey signups and account deletions was hardened by requiring email proof and ensuring complete data
      cleanup during account retirement.
    evidence:
      commits:
      - e01bcb25b
      - df462e81b
      - e2c6e21ff
      - bf206cae6
    release_status: released_main
  - text: AI model accuracy was enhanced through better grounding in the current catalogue and enforced source verification
      during deep research phases.
    evidence:
