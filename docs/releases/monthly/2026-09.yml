risks:
  communication:
  - Use monthly themes for release/newsletter/social planning; verify current feature availability before public communication.
sources:
  weekly_files:
  - docs/releases/weekly/2026-W36.yml
  - docs/releases/weekly/2026-W37.yml
  - docs/releases/weekly/2026-W38.yml
