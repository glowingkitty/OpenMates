  affected_files:
    - apple/OpenMates/Sources/Tasks/TaskBoardView.swift
    - apple/OpenMates/Sources/Tasks/TaskDetailView.swift
    - apple/OpenMates/Sources/Chat/ChatView.swift
    - apple/OpenMates/Sources/Settings/ChatSettingsView.swift
    - apple/OpenMates/Sources/Core/Networking/OpenMatesAPIClient.swift
  parity_expectations:
    - Apple should eventually expose the same task board statuses, chat-linked task list, current-task preview, and task detail actions using the approved /v1/user-tasks contract.
    - Apple may use native controls instead of drag/drop as long as status movement, accessibility, and task detail actions are semantically equivalent.
    - This web spec does not implement Apple; after web user confirmation, Apple work should be scheduled or explicitly waived in a follow-up.
  verification:
    - Web implementation should record whether Apple parity is deferred, waived, or scheduled.
    - If shared API clients or native task UI are touched during implementation, run or attempt python3 scripts/apple_remote.py status plus build-ios or test-ios.
  intentional_native_differences:
    - Native task movement may use segmented controls, context menus, or accessible move actions instead of browser-style Kanban drag/drop.

