scenarios:
  - id: S-1
    title: CLI-created task appears on the web board
    given:
      - Alice is logged into an approved dev test account.
      - The OpenMates CLI creates a plaintext task through the real /v1/user-tasks API.
    when:
      - Alice opens /tasks in the web app after the CLI smoke has created or verified the task contract.
    then:
      - The task decrypts locally in the browser and appears in the correct Kanban column.
      - The web card shows the same title, description, status, assignee, due date, labels, and short/open affordances exposed by the CLI contract.
      - No durable plaintext task content is visible in API payloads, logs, or exported web fixtures.

  - id: S-2
    title: Account-wide Kanban manages tasks across chats
    given:
      - Alice has tasks linked to at least two different chats and one standalone task.
      - The tasks cover backlog, todo, in_progress, blocked, and done statuses.
    when:
      - Alice opens /tasks and uses the board on desktop.
    then:
      - The board shows all account tasks by default, grouped into the fixed CLI statuses.
      - Alice can move a task between statuses with drag/drop or explicit accessible controls.
      - Alice can open details, edit core fields, block, unblock, skip, mark done, delete, reorder, and start a task with AI where those actions are supported by the CLI contract.

  - id: S-3
    title: Tasks home reuses the daily inspiration header
    given:
      - Alice is logged into the web app and has platform:tasks enabled.
      - No personalized task inspirations exist yet.
    when:
      - Alice opens /tasks on desktop or mobile.
    then:
      - The page renders the same DailyInspirationBanner component pattern used by Chats and Workflows with surface="tasks".
      - The banner shows general tips for making tasks useful, such as next actions, status hygiene, and linking tasks back to chats.
      - Clicking a task inspiration starts an appropriate task-oriented flow without opening an unrelated chat welcome experience.

  - id: S-4
    title: Chat settings Tasks shows real chat-linked tasks
    given:
      - Alice has an active chat with four primary tasks linked to that chat.
      - Two tasks are done and two remain actionable.
    when:
      - Alice opens chat settings and selects the Tasks tab.
    then:
      - The Tasks tab lists the same four decrypted tasks from /v1/user-tasks?chat_id=<CHAT_ID>.
      - The progress indicator reports 50% complete.
      - Changing task status from chat settings refreshes the active chat preview and /tasks board without duplicating task rows.

  - id: S-5
    title: Assistant-created chat tasks become visible in web task surfaces
    given:
      - Alice asks the assistant to create a short checklist in an active chat.
      - The CLI/backend task app-skill or task-tool contract creates durable encrypted tasks linked to the chat.
    when:
      - Alice views the active chat preview, chat settings Tasks tab, and /tasks board in the browser.
    then:
      - The created tasks appear in all three surfaces after the task change event, reconnect, or reload path.
      - The active preview shows Task N/total with progress and opens the chat settings Tasks tab.
      - The central board can open the originating chat or task detail when the task has a primary chat link.

  - id: S-6
    title: Tasks remain usable on mobile and touch devices
    given:
      - Alice opens /tasks on a narrow viewport.
      - The board contains at least one task in each status.
    when:
      - Alice scrolls the board, opens task actions, and changes a task status with touch-friendly controls.
    then:
      - The layout follows the mobile Figma frame by stacking or horizontally scrolling columns without clipping the daily inspiration header or action buttons.
      - Every task action remains reachable without relying on hover-only controls.
      - The same state persists after reload.

  - id: S-7
    title: Disabled or unauthorized task surfaces fail safely
    given:
      - platform:tasks is disabled or Alice is not authenticated.
    when:
      - Alice opens /tasks, chat settings Tasks, or an active chat task preview.
    then:
      - The UI shows a clear disabled or login-required state and does not attempt to decrypt task content.
      - Tests can assert these states with data-testid hooks, not CSS class selectors.

