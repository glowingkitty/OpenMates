implementation_notes:
  plan_path: docs/plans/tasks-web-app-parity/plan.yml
  existing_patterns:
    - Reuse WorkspaceHomeShell or the same DailyInspirationBanner surface pattern from Workflows for the /tasks header.
    - Reuse TasksPage, TaskBoard, TaskCard, TaskDetailPage, ActiveChatTaskPreview, and userTaskService rather than creating parallel task components.
    - Reuse ChatSettingsPage settings tabs and settings/elements components for chat task details.
    - Reuse the CLI and SDK live smoke scripts as pre-web parity gates.
    - Reuse Playwright test helper patterns from tasks-flow.spec.ts, chat-settings-flow.spec.ts, and daily-inspiration-chat-flow.spec.ts.
  architecture: >
    Treat the web app as a trusted first-party client for the existing encrypted
    user task contract. The browser loads encrypted task records, decrypts them
    through userTaskService, renders shared task board/detail components, and
    writes only encrypted durable fields plus approved server-visible metadata.
    The /tasks route gets the shared daily inspiration surface at the top, while
    chat settings and active chat preview read the same chat-filtered task data.
  data_flow:
    - User, assistant, CLI, or SDK creates an encrypted user task through the approved /v1/user-tasks contract.
    - Browser loads all task board items for /tasks or chat-filtered tasks for chat settings.
    - userTaskService decrypts task content locally with the task key and returns UserTaskViewModel instances.
    - TaskBoard and TaskCard render the view models and call update/start/reorder/delete actions through userTaskService.
    - Task mutations dispatch openmates-user-tasks-changed so ActiveChatTaskPreview, ChatSettingsPage, and /tasks can refresh.
    - "DailyInspirationBanner loads task-surface hardcoded tips through loadDefaultInspirations({ surface: 'tasks' }) until a later personalized task inspiration spec exists."
  affected_files:
    - path: frontend/apps/web_app/src/routes/tasks/+page.svelte
      reason: Route shell may need to host the daily inspiration home/header and board/detail state.
    - path: frontend/packages/ui/src/components/tasks/TasksPage.svelte
      reason: Central task workspace layout, board loading, create/edit/action controls, and daily inspiration integration.
    - path: frontend/packages/ui/src/components/tasks/TaskBoard.svelte
      reason: Account-wide Kanban columns, counts, accessible movement, mobile behavior, and Figma-aligned board layout.
    - path: frontend/packages/ui/src/components/tasks/TaskCard.svelte
      reason: Task action parity, chat/workflow links, labels, assignee, due date, and read-only workflow projection handling.
    - path: frontend/packages/ui/src/components/tasks/TaskDetailPage.svelte
      reason: Task open/edit/detail parity with task cards and app-skill child fullscreens.
    - path: frontend/packages/ui/src/components/tasks/ActiveChatTaskPreview.svelte
      reason: Current chat task queue preview, progress, done toggle, and settings Tasks deep link.
    - path: frontend/packages/ui/src/components/chats/ChatSettingsPage.svelte
      reason: Real chat task list, progress, owner/shared action behavior, and settings tab integration.
    - path: frontend/packages/ui/src/components/workspace/WorkspaceHomeShell.svelte
      reason: Shared workspace daily inspiration/header pattern used by Workflows and potentially Tasks.
    - path: frontend/packages/ui/src/components/DailyInspirationBanner.svelte
      reason: Existing banner must support task surface usage without task-specific forks.
    - path: frontend/packages/ui/src/demo_chats/hardcodedInspirations.ts
      reason: Add or refine generic task-use tips for the tasks surface.
    - path: frontend/packages/ui/src/services/userTaskService.ts
      reason: Ensure browser API coverage exposes the same safe actions as CLI/SDK without plaintext durable leaks.
    - path: frontend/packages/ui/src/i18n/sources/apps.yml
      reason: User-visible task action/tip copy should be localized where existing i18n patterns require it.
    - path: frontend/apps/web_app/tests/tasks-web-app-parity.spec.ts
      reason: Extensive /tasks board, daily inspiration, action parity, and responsive Playwright coverage.
    - path: frontend/apps/web_app/tests/tasks-chat-settings-parity.spec.ts
      reason: Chat settings tasks, active preview, and chat-linked task parity Playwright coverage.
    - path: frontend/apps/web_app/tests/task-workflow-app-skill-embeds.spec.ts
      reason: Supplemental task app-skill embed parity where assistant-created tasks are represented as child embeds.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/tasks-web-app-parity/plan.yml
    - python3 scripts/verify_tasks_cli_smoke.py --api-url https://api.dev.openmates.org
    - OPENMATES_API_URL=https://api.dev.openmates.org node --experimental-strip-types --loader ./frontend/packages/openmates-cli/tests/loader.mjs scripts/verify_sdk_tasks_live_smoke.mjs
    - python3 scripts/audit_playwright_determinism.py frontend/apps/web_app/tests/tasks-web-app-parity.spec.ts frontend/apps/web_app/tests/tasks-chat-settings-parity.spec.ts
    - Deploy to dev before Playwright green evidence.
    - python3 scripts/tests.py run --spec tasks-web-app-parity.spec.ts
    - python3 scripts/tests.py run --spec tasks-chat-settings-parity.spec.ts
    - python3 scripts/tests.py run --spec task-workflow-app-skill-embeds.spec.ts when embed parity is touched or relied on.
    - User confirms deployed dev visual quality against Figma task and chat_task frames.
  verification_order:
    - Confirm no new backend endpoint is required; if a backend/API change becomes necessary, classify it and add REST API proof first.
    - Run real CLI task smoke against https://api.dev.openmates.org.
    - Run npm and pip SDK live task smoke against https://api.dev.openmates.org.
    - Write or extend Playwright specs before web implementation and run red against deployed dev.
    - Implement web changes.
    - Deploy to dev and run Playwright green specs through scripts/tests.py.
    - Get user confirmation for deployed /tasks and chat settings visual quality.
    - Record Apple parity deferral, waiver, or follow-up; run apple_remote only if shared native/API code is touched.

