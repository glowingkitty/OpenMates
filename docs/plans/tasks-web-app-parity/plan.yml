schema_version: 2
id: tasks-web-app-parity
title: Tasks Web App Parity
status: implementing

goal: >
  Complete the Tasks V1 web app surface so it matches the approved CLI/API/SDK
  task contract while following the Figma task-board and chat-task designs. The
  web app must reuse the shared DailyInspirationBanner pattern used by Chats and
  Workflows, show general task-use tips for now, render an account-wide Kanban
  board for tasks across chats, and connect the chat settings Tasks tab to the
  real encrypted tasks linked to that chat.

scope:
  in:
    - A focused web implementation follow-up to docs/plans/tasks-v1/plan.yml, not a new task data model.
    - Reuse the existing /v1/user-tasks contract, userTaskService encryption helpers, CLI smoke contract, and npm/pip SDK smoke contract as the source of truth.
    - The /tasks route shows the shared daily inspiration header with surface="tasks" and task-use tips before or beside the board content, matching the Chats and Workflows header behavior.
    - Task daily inspirations remain generic task-productivity tips in this slice, with no new personalized task-recommendation backend.
    - The /tasks board lists all user tasks across chats by default, grouped by backlog, todo, in_progress, blocked, and done.
    - "Task cards expose web action parity with the CLI where practical: open detail, edit core fields, move status, mark done, block, unblock, skip, reorder, delete, and start with AI."
    - Workflow run task projections remain read-only cards with open-run and cancel-run actions where supported by the existing workflow contract.
    - Chat settings Tasks tab loads actual tasks whose primary_chat_id matches the current chat, shows progress, and supports the same task-view/action semantics that are safe inside chat settings.
    - Active chat task preview reflects the currently relevant chat task queue and opens the chat settings Tasks tab.
    - Assistant-created and CLI-created chat-linked tasks become visible in the web chat task preview, chat settings Tasks tab, and central /tasks board after sync/reload.
    - Desktop and mobile layouts follow the Figma task and chat_task frames, with horizontal or stacked Kanban behavior that remains usable on touch devices.
    - Extensive Playwright spec.ts coverage is added or extended for /tasks, chat settings tasks, active chat preview, daily inspiration reuse, responsive behavior, and CLI/web parity.
  out:
    - New /v1/user-tasks backend routes, new task statuses, or a replacement for the approved Tasks V1 data model.
    - Recurring tasks, custom Kanban columns, multi-assignee tasks, team task boards, public task sharing, or public developer task-management API changes.
    - Server-side plaintext search over encrypted task titles, descriptions, tags, or latest instructions.
    - A bespoke daily inspiration backend for tasks; personalized task tips are intentionally deferred.
    - A separate skipped or cancelled Kanban column; skipped tasks keep the approved backlog plus queue metadata behavior.
    - Reimplementing task/workflow app-skill embed rendering already tracked in docs/plans/tasks-workflows-app-skill-embeds/plan.yml.
    - Native Apple implementation in this web slice, although Apple impact and deferred parity are recorded.

