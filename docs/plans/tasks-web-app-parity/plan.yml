      required: true
      expected: pass
      evidence:
        status: passed
        command: "python3 scripts/verify_tasks_cli_smoke.py --api-url https://api.dev.openmates.org"
        run_id: "local-cli-live-20260729T1338Z"
        subject_commit: "69d85944f4f8fee32dbf80636818d388bf049de3"
        timestamp: "2026-07-29T13:38:00Z"

