contracts:
  api:
    - route: GET /v1/user-tasks
      access_model: first-party authenticated web session; existing CLI/SDK authenticated contracts also exercise task APIs through approved client surfaces.
      request: Optional status, chat_id, project_id, label/tag, priority, team/personal, and limit filters according to the existing contract.
      response: Encrypted task records plus read-only workflow run projections for the task board.
      errors:
        - 401 when unauthenticated.
        - 403 when the authenticated client lacks task access or feature availability.
        - Visible UI error state when the browser cannot load or decrypt records.
      rate_limits: Existing authenticated app/API rate limits; no new public rate limit is introduced by this web slice.
      credit_budget: Listing and CRUD do not spend credits; start-ai and assistant/app-skill task creation spend the normal AI/chat budget where applicable.
      encryption_boundary: Durable private task content remains client-side encrypted and is decrypted only on trusted clients.
    - route: POST /v1/user-tasks, PATCH /v1/user-tasks/{task_id}, DELETE /v1/user-tasks/{task_id}, POST /v1/user-tasks/reorder, POST /v1/user-tasks/{task_id}/start-ai, POST /v1/user-tasks/{task_id}/block, POST /v1/user-tasks/{task_id}/unblock, POST /v1/user-tasks/{task_id}/skip, POST /v1/user-tasks/{task_id}/complete
      access_model: Existing authenticated first-party/CLI/SDK task-management contract; no new public developer surface in this spec.
      request: Encrypted task create/update payloads plus server-visible status, queue, position, due_at, priority, and safe link metadata.
      response: Updated encrypted task records that the client decrypts locally.
      errors:
        - 409 or equivalent version conflict when a stale web edit races a CLI or assistant edit.
        - 403 when the task key wrapper or ownership does not allow the requested action.
      rate_limits: Existing authenticated mutation limits; implementation must surface 429/budget errors instead of swallowing them.
      credit_budget: start-ai may spend credits through normal AI execution; non-AI mutations do not.
      encryption_boundary: The browser encrypts durable private fields before persistence; start-ai may send plaintext working context only through the approved short-lived AI execution path.
  data:
    - Task statuses are fixed to backlog, todo, in_progress, blocked, and done for V1.
    - primaryChatId links a task to exactly one chat for chat settings and active preview; linkedProjectIds can associate tasks with projects without changing primary chat ownership.
    - Workflow run projections are task-board items but are read-only and must not be mutated through user-task edit controls.
    - Done column visibility follows Tasks V1 default behavior for recent completed items; hiding older done items must not delete records.
  ui_states:
    - /tasks authenticated loading, disabled, empty, load error, all-tasks board, filtered/search result, mobile board, and task detail states.
    - Daily inspiration present with task tips when surface task inspirations exist; page still works if no inspirations are available.
    - Chat settings Tasks loading, empty, real task list, progress, failed load, shared-readonly, and task action states.
    - Active chat preview hidden when no actionable tasks exist, task preview when tasks exist, plan fallback when only plans exist, and refresh after task change events.
  privacy_security:
    - No server-side full-text search over private task fields.
    - No decrypted task content in analytics, OpenObserve client logs, network request assertions, screenshots intentionally used outside test artifacts, or clipboard actions unless user explicitly copies task content.
    - The spec.ts fixtures must use synthetic task titles and clean them up where possible.

