    covers:
      - AC-1
      - AC-4
    assertions:
      - Real CLI list/create/show/status/board/edit/block/unblock/reorder/skip/done/delete commands pass against the dev API.
      - Chat-scoped CLI tasks list and board commands pass against the dev API.
      - CLI output decrypts task plaintext locally and does not leak encrypted_ fields.
