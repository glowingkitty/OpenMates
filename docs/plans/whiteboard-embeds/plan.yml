schema_version: 2
id: whiteboard-embeds
title: Streamed Whiteboard Embeds
status: approved

goal: >
  Add a first-class Whiteboards app whose supervised Create skill builds an
  encrypted mixed-media board visibly in real time from validated semantic
  operations. Expect malformed model output, apply only deterministic repairs
  that do not invent meaning, return structured lint diagnostics to the model
  for bounded correction, preserve valid partial work, and provide a scene-based
  explanation users can play, explore, share, download, and re-upload.

scope:
  in:
    - Add app `whiteboards`, skill `create`, backend embed `whiteboard`, and frontend embed `whiteboards-whiteboard`.
    - Define provider-neutral canonical JSON and the `.omwhiteboard` file format.
    - Define incrementally parseable NDJSON operations with idempotency, checkpoints, reconnect, and commit.
    - Supervise generation so accepted operations render immediately and rejected operations receive bounded model correction turns.
    - Support typed text, sticky, shape, connector, frame, group, drawing, image, video, and OpenMates embed elements.
    - Reference media through encrypted child embeds with attribution and alt text.
    - Support ordered scenes with reveal, hide, highlight, caption, timing, and camera focus.
    - Support live Follow build, manual pan/zoom interruption, playback, diagnostics, retry, outline, sharing, and file round-trip.
    - Apply deterministic structural and visual-safety repair and preserve usable partial boards after retry exhaustion.
    - Verify real dev WebSocket, CLI, npm SDK, pip SDK, deployed web, user confirmation, and Apple read-only/playback parity in that order.
  out:
    - Direct graphical editing, undo/redo, or drawing tools in V1.
    - Simultaneous editing, live cursors, offline merge, or CRDT collaboration in V1.
    - Miro, Excalidraw, Freeform, Mural, Canva, or FigJam provider integration in V1.
    - Vendor scene/store formats as OpenMates canonical storage.
    - Narration, screen recording, webcam recording, voice-over, or video export in V1.
    - Arbitrary HTML, script, CSS, SVG markup, base64 media, executable embeds, or remote iframes.
    - Replacing Mind Maps or automatically converting `.ommindmap` files.

