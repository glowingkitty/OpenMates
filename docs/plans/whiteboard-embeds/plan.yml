clarification:
  rounds:
    - question: How should invalid operations recover?
      answer: Repair safely, report structured diagnostics to the model, continue valid rendering, and fail only affected content after bounded retries.
    - question: Should repair include visual layout?
      answer: Repair structural and clearly unusable geometry; warn rather than broadly redesign subjective layout.
    - question: What happens after retry exhaustion?
      answer: Keep a visibly partial board, omit rejected content, expose diagnostics, and offer scoped retry.
    - question: How visible is correction activity?
      answer: Show compact status plus expandable repaired, rejected, and final diagnostics.
    - question: How much editing is in V1?
      answer: Generated plus playback only; graphical editing and collaboration are later work.
  vision_summary: >
    Whiteboards V1 is a supervised generated visual explanation, not a full
    editor. Valid elements and scenes stream immediately, deterministic repair
    never invents semantics, rejected operations receive bounded correction, and
    unresolved content leaves a useful partial board with diagnostics and retry.
  approved_by_user: true

