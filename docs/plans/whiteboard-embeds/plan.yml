scenarios:
  - id: S-1
    title: Valid board builds scene by scene
    given: [Alice asks for a playable whiteboard explanation, Whiteboards Create is enabled.]
    when: [The generator emits valid scene and element operations.]
    then: [A processing embed appears early, accepted operations render once in order, scene commits become playback steps, final commit persists one encrypted canonical snapshot.]
  - id: S-2
    title: Safe defects repair without semantic invention
    given: [Output contains repairable punctuation, style, duplicate, size, rotation, or declared-working-bounds defects.]
    when: [The parser and linter process each complete operation.]
    then: [One bounded syntax repair may run, safe defaults and geometry normalize deterministically, exact redelivery is a no-op, effectively identical visual placement may be safely repositioned, conflicting or reused semantic IDs are rejected, repairs are recorded, no text relationship citation asset or scene meaning is invented.]
  - id: S-3
    title: Invalid operations receive model-visible correction diagnostics
    given: [Output contains unsupported types, unsafe content, invalid geometry, or unresolved references.]
    when: [A scene reaches validation.]
    then: [Valid operations stay visible, rejected operations stay outside canonical state, diagnostics name operation code path and expected constraint, replacement operations do not duplicate accepted content.]
  - id: S-4
    title: Exhausted correction leaves a partial board
    given: [At least one scene is valid but selected operations remain invalid after the retry budget.]
    when: [Generation commits or exhausts correction.]
    then: [The board finishes partial, rejected items and dependent connectors stay absent, compact warning and expandable diagnostics appear, Retry failed items targets unresolved diagnostics.]
  - id: S-5
    title: Hard invariant failure remains an error
    given: [Protocol or schema is unsupported, operation IDs conflict, hard limits fail, or no valid scene exists.]
    when: [Validation reaches the hard failure.]
    then: [Generation stops in actionable error, transient recovery content is not shareable as finished, logs contain codes counts hashes and timing but no private bodies.]
  - id: S-6
    title: User follows or explores live generation
    given: [A board is receiving scenes.]
    when: [Scene focus changes and the user manually pans or zooms.]
    then: [Focus derives from target element bounds, user input cancels following, Follow build resumes, reduced motion jumps immediately, rapid changes do not thrash the camera.]
  - id: S-7
    title: User plays the finished explanation
    given: [A finished or partial board has ordered scenes.]
    when: [The user plays pauses seeks or explores.]
    then: [Reveal hide highlight caption and focus apply deterministically, free exploration does not mutate content, Return to scene restores focus, outline mirrors scene and reading order.]
  - id: S-8
    title: Media uses encrypted child embeds
    given: [Relevant image video or website embeds exist.]
    when: [Operations attach them to typed elements.]
    then: [References preserve attribution and alt text, website children render static proxied preview metadata only, unresolved children use stable placeholders, offscreen media loads lazily, executable or arbitrary remote content is rejected.]
  - id: S-9
    title: Duplicate delivery and reconnect converge
    given: [A client disconnects and receives duplicate or delayed batches after reconnect.]
    when: [It resumes from a verified checkpoint and cursor.]
    then: [Stream sequence operation ID revision and rolling hash detect duplicates gaps and conflicts, replay converges across Python TypeScript and Swift.]
  - id: S-10
    title: Native file round-trip preserves canonical content
    given: [A finished or partial board exists.]
    when: [The user downloads and re-uploads `.omwhiteboard`.]
    then: [Stable elements assets scenes and diagnostics round-trip, transient model transport auth and key state is absent, unsupported required features fail visibly.]
  - id: S-11
    title: Real CLI and SDK contracts precede web
    given: [The dev backend contract exists.]
    when: [CLI npm SDK and pip SDK use real authenticated dev paths.]
    then: [Each observes processing correction partial error finished retry outline and download behavior, mocked calls do not satisfy gates.]
  - id: S-12
    title: Sharing preserves parent and child boundaries
    given: [A board references private child embeds.]
    when: [The owner shares it.]
    then: [Only board and referenced child keys are granted, keys remain in existing fragment or wrapped-key paths, missing children show placeholders without content leakage.]
  - id: S-13
    title: Apple read-only parity ships last
    given: [API CLI SDK web visual review and user confirmation are complete.]
    when: [Apple parity is implemented.]
    then: [Swift passes shared reducer fixtures and supports build diagnostics scenes camera outline share and download without editing UI.]

