implementation_notes:
  plan_path: docs/plans/whiteboard-embeds/plan.yml
  existing_patterns:
    - Mind Map normalization, streaming, encrypted embed, file, preview/fullscreen, CLI, and Apple patterns.
    - Async app-skill task, WebSocket update, client encryption, and child-key sharing patterns.
  architecture: >
    Initial placeholder pending create-plan: add shared Python schema, linter,
    canonicalizer, reducer, and correction supervisor; stream Vault-encrypted
    checkpoints and idempotent batches; finalize through existing client-encrypted
    embed persistence; implement matching TypeScript and Swift reducers. This
    spec-only session does not approve production implementation.
  data_flow:
    - Preflight auth ownership feature availability and maximum budget; create processing embed and stream.
    - Generate complete NDJSON operations grouped into scenes.
    - Repair safe defects, reject invalid operations, reduce accepted state, and stream accepted batches.
    - Feed scene diagnostics into bounded replacement-only correction turns.
    - Checkpoint for reconnect and commit one canonical encrypted snapshot.
    - Play scenes independently from transport and revision history.
  affected_files:
    - {path: backend/apps/whiteboards/, reason: App metadata skill and supervised generation task.}
    - {path: backend/shared/python_schemas/whiteboard.py, reason: Canonical schemas and limits.}
    - {path: backend/shared/python_utils/whiteboard_reducer.py, reason: Lint repair reduce canonicalize and checkpoint.}
    - {path: backend/core/api/app/services/embed_service.py, reason: Processing batch partial and final embed lifecycle.}
    - {path: frontend/packages/ui/src/components/embeds/whiteboards/, reason: Renderer preview fullscreen scenes diagnostics and accessibility.}
    - {path: frontend/packages/openmates-cli/src/embedRenderers.ts, reason: CLI status diagnostics outline and source.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: Pip SDK parity.}
    - {path: apple/OpenMates/Sources/Features/Embeds/Renderers/WhiteboardEmbedRenderer.swift, reason: Apple parity after approval.}
    - {path: scripts/audit_whiteboard_contract.py, reason: Deterministic schema security metadata and logging guard.}
  verification_strategy:
    - Write malformed repaired rejected partial reconnect scene camera and canonical fixtures before production code.
    - Record red evidence before each implementation slice.
    - Require real authenticated dev API CLI and SDK evidence; mocks are supplemental.
    - Deploy before Playwright green, review laptop/mobile screenshots, then request user confirmation.
    - Run Apple only after user confirmation and finish with spec_verify.
  verification_order:
    - Real first-party REST/WebSocket dev contract with auth ownership limits correction reconnect and encryption boundaries.
    - Real CLI against dev.
    - Local npm SDK and pip SDK against dev.
    - CI reproduction after local programmatic gates.
    - Deployed web Playwright.
    - Reviewed laptop/mobile visual smoke.
    - Explicit user confirmation.
    - Apple tests and build last.

