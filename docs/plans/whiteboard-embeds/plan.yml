contracts:
  access_model:
    classification: first-party client surface only
    auth: Authenticated web, CLI, SDK, or approved device session; no unauthenticated or developer API-key V1 access.
    rate_limits: Inherit AI task limits plus bounded operation, retry, resume, and download limits.
    credit_budget: Preflight one maximum task budget covering initial generation and correction.
    encryption: Runtime plaintext is bounded and Vault-encrypted in cache; durable board, diagnostics, and children are client-encrypted.
  api:
    - {route: POST /v1/apps/whiteboards/skills/create, request: "{prompt, source_embed_refs?, playback?, max_scenes?}", response: "{task_id, embed_id, stream_id, status, estimated_credits}", access: first-party authenticated owner}
    - {route: "POST /v1/whiteboards/{embed_id}/retry", request: "{diagnostic_ids, base_revision}", response: "{task_id, stream_id, status, estimated_credits}", access: first-party owner only; each post-partial retry is a new preflighted capped task and returns 402 before starting when headroom is insufficient}
    - {route: authenticated WebSocket resume event, request: "{embed_id, stream_id, after_seq, rolling_hash}", response: "{checkpoint, checkpoint_seq, batches}", access: owner or authorized read-only recipient; rolling_hash is required whenever after_seq is greater than the returned/requested checkpoint sequence, while a client with no local state requests a fresh checkpoint}
    - {route: authorized native download path selected during planning, request: "{embed_id, revision?}", response: "application/json `.omwhiteboard` attachment", access: owner or authorized share recipient}
  document:
    marker: "openmatesType: whiteboard"
    schema_version: 1
    extension: .omwhiteboard
    fields: [documentId, title, canvas, elementsById, zOrder, readingOrder, assets, scenes, validation]
    element_types: [text, sticky, shape, connector, image, video, embed, drawing, frame, group]
    rules:
      - Stable IDs, finite bounded board geometry, stable ordering, normalized precision, and canonical JSON key ordering.
      - Assets contain typed child embed references, alt text, attribution, crop, and poster metadata only.
      - Export excludes stream cursors, model messages, retries, auth, keys, decrypted media, and client camera state.
  operations:
    framing: One UTF-8 JSON object per complete line.
    header: "{protocolVersion, streamId, embedId, baseRevision}"
    envelope: "{seq, opId, op, sceneId?, payload}"
    kinds: [scene.begin, element.put, element.patch, element.delete, connector.put, asset.attach, zorder.set, scene.commit, document.commit]
    idempotency:
      - Monotonic seq and unique opId; identical transport redelivery is a no-op, reused IDs with different payloads are fatal, and duplicate semantic element IDs are rejected rather than merged.
      - Gaps request replay; batches carry from_seq, to_seq, base_revision, and rolling_hash.
      - Runtime stores Vault-encrypted checkpoints; commit stores one client-encrypted canonical snapshot.
  validation:
    stages: [complete-line parsing, one bounded syntax repair, envelope/schema, element, references, geometry, resource/security, scene commit, document commit]
    safe_repairs:
      - Remove BOM/fence whitespace and narrowly documented punctuation defects.
      - Trim strings, normalize allowed tokens, fill optional style defaults, normalize finite precision/rotation, enforce minimum size, and move wholly out-of-working-bounds content inside.
      - Treat exact duplicate delivery as no-op and resolve bounded connector forward references at scene commit.
      - Move a new element to the next deterministic safe slot only for effectively identical unintended visual bounds with an unrelated visible element; this never repairs duplicate IDs or merges element content.
    never_repair:
      - Missing or altered text, relationships, captions, citations, attribution, assets, or scene meaning.
      - Unsafe URL schemes, HTML, SVG, CSS, script, base64 media, credentials, or tokens.
      - Conflicting IDs, unsupported versions, non-finite geometry, or hard limits.
    warnings_only: [subjective spacing, aesthetics, density, color harmony, non-fatal crossings, intentional overlap]
    diagnostic: "{id, opId, sceneId?, severity, code, path, retryable, sanitized_message, expected_constraint?, repair_code?, attempt}"
  correction_loop:
    - Accepted operations remain visible and immutable within the current generation revision.
    - Scene-boundary rejected operations return structured diagnostics and rejected IDs to the generator; diagnostics contain allowlisted codes, paths, constraints, and hashes only and never echo raw board text, captions, URLs, attribution, rejected payloads, or secrets.
    - Correction emits replacements or explicit omission only, not a regenerated full board.
    - Proposed default is at most two correction turns per failed scene batch, pending A-2; these turns share the original create-task cap.
    - A user-triggered Retry failed items action after partial completion creates a new separately estimated and preflighted capped task and never silently spends beyond the completed create-task cap.
    - Exhaustion permits partial commit only with at least one valid scene and no hard invariant failure.
  scenes:
    fields: [id, title, reveal, hide, highlight, camera, caption, durationMs, transition]
    camera: Prefer targetElementIds plus padding/maxZoom with optional fallback bounds.
    playback: Deltas apply cumulatively from deterministic initial visibility; transport retries and rejected operations never replay.
  privacy_security:
    - Never log or include in model feedback/durable diagnostics raw board text, operation bodies, media URLs, captions, attribution text, keys, rejected payloads, or private diagnostic values; feedback uses sanitized codes, paths, constraints, and hashes.
    - Website child embeds render only existing static/proxied title, description, favicon, screenshot, and source-link metadata in V1; no website script, iframe, or live remote document loads inside the board.
    - Enforce limits for bytes, operations, batches, scenes, elements, connectors, drawing points, text, depth, coordinates, assets, retries, and duration.
    - Board JSON triggers no arbitrary network request; clients resolve only approved child embeds and proxied media.
  accessibility:
    - readingOrder drives semantic DOM/native accessibility independently of zOrder.
    - Meaningful media requires alt text; keyboard controls cover scenes playback zoom diagnostics and return-to-focus.
    - Screen readers announce correction partial focus and scene state; reduced motion removes animated movement without changing content.

