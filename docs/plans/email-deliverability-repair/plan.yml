schema_version: 2
profile: concise
id: email-deliverability-repair
title: Prevent test email bounces and harden newsletter delivery
status: implementing
goal: >-
  Implement those steps as suggested (but lets do the brevo support escalation
  last since i assume this needs my contacting support).
scope:
  - Retire confirmed obsolete Mailosaur development accounts after suppressing email and stopping their schedules.
  - Replace embedded newsletter images with compressed first-party hosted assets and reject oversized rendered HTML.
  - Repair token-only one-click newsletter unsubscribe without affecting security or billing email.
  - Apply reason-aware durable recipient suppression and periodic read-only Brevo delivery monitoring.
  - Prevent external delivery from isolated tests and require explicit approval of live test destinations.
  - Tag live mail by environment, email type, and audience; prepare the Brevo support handoff last.
decisions:
  - User approval covers these repairs and development deployment; no production deployment or support message is authorized.
  - User explicitly approved deleting the obsolete test accounts and their connected test Teams.
  - Reuse the existing newsletter token lifecycle and category/privacy contracts.
  - Shared-IP rejection alerts operators and does not suppress the recipient.
  - Poll Brevo delivery events instead of introducing a public webhook endpoint.
  - Preserve ordinary development users and administrator operational notifications.
verification:
  required:
    - Focused local unit and lint checks for modified services, routing, assets, and recipient policy.
    - Isolated GitHub CI newsletter lifecycle coverage including credentialless one-click POST and replay.
    - Isolated GitHub CI coverage for live transport isolation and bounce feedback ordering and suppression.
    - Development cleanup receipts confirm targeted accounts and schedules no longer operate.
    - Development deployment and readiness checks through the session helper.
  limitations:
    - Received-message DKIM signing coverage and the unknown customer's exact spam classification need provider or recipient evidence.
    - Brevo shared-IP remediation is handled through the user's support escalation after implementation.
