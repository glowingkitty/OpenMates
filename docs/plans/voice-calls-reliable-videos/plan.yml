schema_version: 2
id: voice-calls-reliable-videos
title: Web voice calls reliable and pleasant enough for product videos
status: implementing
goal: 'Web voice calls never go silent when they need the user, wait sensibly while the user thinks, accept typed, pasted
  and uploaded input, sound calm and stay fairly priced. Order: (1) spoken tap requests and spoken answers after focus decisions,
  shipped alone; (3+2) waiting state and pause detection; (4) typing, pasting and uploading in a call plus a per-chat special-terms
  list; (5) sounds; (6) billing measured along the way. Approval stays a manual tap and client-side encryption is never weakened.

  '
specifications:
- feature.video-call@18
scope:
  in:
  - 'Part 1: needs-you chime, ready-made spoken request, reminder, confirmation and Memory self-cancel in calls; focus auto-confirm
    and rejection continuations keep voice delivery; "Continue without memories" in text chats.'
  - 'Part 3: waiting state from hard signals (input active, file picker, upload) and from the decision model; ready-made lines
    ("okay, I''m waiting", "okay, go on", "sure, here it is again"); one combined turn; replay and resume of the stored last
    answer without inference.'
  - 'Part 2: pause detection with four verdicts (finished, still thinking, unsure, wait) built on Jev behind a swappable interface,
    provider turn detection tuned first, a hold button in the call bar.'
  - 'Part 4: composer sends, pastes and uploads during a call follow the ordinary path; a per-chat special-terms list for
    speech recognition.'
  - 'Part 5: soft skill-running loop, focus-activation chime, needs-you chime, all under the voice.'
  - 'Part 6: billing measurement; decision checks never charged separately.'
  out:
  - Apple native speech and Apple parity of these behaviors (postponed by the owner).
  - Voice commands for embeds or chat navigation (dropped by the owner).
  - Approval by voice or automatic approval.
  - Production deploy.
decisions:
- id: D-1
  status: active
  decision: Every ready-made call line (tap request, reminder, thanks, timeout, waiting, go on, repeat) is a pre-recorded
    static clip per Mate voice and locale, generated once with the existing acknowledgement generator and served from /audio/assistant-acknowledgements/.
    The server only names the clip URLs in a transient WebSocket event.
  reason: No inference, no TTS characters and no credits per use; the event carries no request content.
  decided_at: '2026-11-20T11:00:00Z'
- id: D-2
  status: active
  decision: The call device owns the Memory countdown. After about 30 s without a tap it plays the timeout line, answers the
    request through the ordinary reject path (continue without memories) and stores a presentation-only encrypted system event
    that is never sent to the AI. Approval kinds other than Memory only remind; text chats never cancel.
  reason: The only automatic outcome is the safe one, and the timeout is visible in the chat history like other call events
    without a new server write path.
  decided_at: '2026-11-20T11:00:00Z'
- id: D-3
  status: active
  decision: The per-chat special-terms list is stored client-encrypted with the chat like other chat content. The call device
    decrypts it and sends it in the call-start frame of the authenticated call WebSocket; the server holds it in memory for
    that call only, passes it to speech recognition when the provider supports context biasing and never persists or logs
    it.
  reason: Same exposure as the call audio itself (transient, first-party), so encryption at rest is unchanged.
  decided_at: '2026-11-20T11:00:00Z'
- id: D-4
  status: active
  decision: Pause detection starts from the provider's own turn detection (eager end and end events, tuned thresholds), then
    asks a fast decision model behind a swappable interface for one of four verdicts judged by meaning in any language (no
    keyword lists). Waits by verdict about 0.5 s finished, 2 s unsure, up to 6 s still thinking; user speech stops the assistant
    at once. The model follows TASK-4784 (Gemini Decision 1 vs Jev).
  reason: Silence is only a trigger; a strict 250 ms end-to-submit is not reachable on the final turn-end path, so the check
    runs speculatively on eager end.
  decided_at: '2026-11-20T11:00:00Z'
- id: D-5
  status: active
  decision: Decision checks during a call are never a separate charge; their cost per call minute is measured and absorbed
    or folded into the per-minute call price. Ready-made lines and replays cost no credits.
  reason: Owner brief, part 6.
  decided_at: '2026-11-20T11:00:00Z'
