scenarios:
- id: S-1
  title: Spoken memory request in a call
  given:
  - Maya is in a voice call and asks what to cook given her diet.
  when:
  - The turn needs her saved Memory and she taps Allow.
  then:
  - She hears the chime and the request, then the thanks, then the spoken answer.
- id: S-2
  title: Memory request times out in a call
  given:
  - A memory request with its countdown is shown during Maya's call.
  when:
  - She does not tap for 30 seconds.
  then:
  - A reminder plays at 15 s; at 30 s the call says it answers without memories, the chat shows the timed-out event and the
    spoken answer follows.
- id: S-3
  title: Text chat continues without memories
  given:
  - A memory request is shown in a text chat.
  when:
  - Maya leaves it, later taps "Continue without memories".
  then:
  - It stays open until her tap; the answer comes without memories.
