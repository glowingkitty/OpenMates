  - T-VITEST
  - T-E2E
  scenario: S-1
  status: pending
  coverage_status: covered
  verification_scope: playwright
- id: AC-2
  text: In a call the memory request shows a countdown, is reminded aloud at about 15 s and at about 30 s continues without
    memories with a spoken line and an encrypted "memory request timed out" chat event.
  required: true
  verification_ids:
  - T-VITEST
  - T-COMPONENT
  - T-E2E
  scenario: S-2
  status: pending
  coverage_status: covered
  verification_scope: playwright
- id: AC-3
  text: Text chats never cancel a memory request on their own and show a clear "Continue without memories" action.
  required: true
  verification_ids:
