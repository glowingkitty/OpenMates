    verification_ids: [T-BACKEND-FOCUSED]
  - id: AC-2
    scenario: S-2
    text: Bounded preprocessing context includes the latest two user turns, intervening assistant response, authorized summary and at most eight terminal plus three pending content-free skill rows, with wider same-call fallback when state is unavailable.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-FOCUSED, T-FRONTEND-TRANSPORT]
  - id: AC-3
    scenario: S-3
    text: Default preprocessing recovery cannot repeat the old serial fifteen-second attempts, the three-provider chain is bounded to twelve seconds, nested provider retries are disabled, and logical failure terminal classes remain visible.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-FOCUSED]
  - id: AC-4
    scenario: S-4
    text: Raw first-item and first-text timing occurs before paragraph aggregation without changing the downstream paragraph stream contract.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-FOCUSED]
  - id: AC-5
    scenario: S-5
    text: The proposed dev and production latency, reliability and cost targets are measured on eligible turns before they are claimed as verified.
    required: true
    status: blocked
    coverage_status: covered
    verification_scope: manual
    verification_ids: [T-DEV-CANARY]

tests:
  - id: T-BACKEND-FOCUSED
    type: pytest
    file: backend/tests/test_preprocessing_prompt_budget.py
    command: /home/superdev/projects/OpenMates/.venv/bin/python -m pytest -q backend/tests/test_routing_ledger.py backend/tests/test_preprocessing_prompt_budget.py backend/tests/test_ai_request_observability.py backend/tests/test_stream_paragraph_contract.py backend/tests/test_llm_utils_preprocessing_retries.py backend/apps/ai/tests/test_timeout_utils.py backend/tests/test_postprocessor.py backend/tests/test_ai_skill_request_schema.py backend/tests/test_teams_chat_ai.py
    assertions: [Bounded routing context excludes skill content, the healthy path has one provider call, retries and deadlines are bounded, metadata is postprocessed, and raw timing preserves paragraph streaming.]
    covers: [AC-1, AC-2, AC-3, AC-4]
    red_phase:
      required: false
      expected: Existing production logs and the reported incident already established the slow and failing baseline; no redundant live failure replay was requested.
      evidence: {status: waived_by_existing_evidence}
    green_phase:
      required: true
      expected: pass_after_implementation
