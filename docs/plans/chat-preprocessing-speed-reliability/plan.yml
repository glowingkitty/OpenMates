followup_evaluation:
  schema_version: 2
  goal: >-
    Keep Gemini as the primary utility model and properly evaluate whether it delays
    responses. Investigate and fix tool-use and billing failures with multiple real
    CLI chats; investigate Directus preflight rejection and CLI delay and propose a
    concrete repair plan.
  scope:
    - Compare identical synthetic routing and metadata requests through the actual
      utility client for Gemini and Mistral; alternate model order, retain failures,
      distinguish first calls, and report sample limits and Google credit economics.
    - Verify independent non-Google recovery for preprocessing and postprocessing,
      including Mistral, while preserving one healthy-path request and bounded retries.
    - Repair tool-call/result preservation during provider fallback and correct usage
      identity after fallback without duplicating skills or changing billing rates.
    - Trace saved-chat preflight rejection and CLI command overhead to specific
      protocol/runtime steps; produce evidence-backed fixes and verification plans.
  constraints:
    - Gemini remains the primary model per the user's explicit clarification.
    - Main-model history, encryption boundaries and paragraph streaming are preserved.
    - No production mutation or deliberate shared-service outage.
    - Existing failures are sufficient red evidence; do not repeat them just for red tests.
  verification:
    - Focused provider-history, billing identity and utility-recovery unit regressions.
    - Relevant existing product-path regression coverage through isolated CI.
    - Bounded matched live provider probe plus several real authenticated OpenMates CLI
      conversations covering simple answers, weather, search and follow-up skill use.
    - Report answer publication, full CLI duration, token usage, actual executing model,
      skill completion and errors separately; do not infer client latency attribution
      merely by subtracting worker duration.
  observations:
    - Before this follow-up, both active utility chains used AI Studio then Vertex
      then DeepSeek. Neither chain contained Mistral; Google primary is retained.
    - The prior small unmatched timeout/success sample does not prove Gemini speed or
      quality superiority. Historical Mistral benchmark used a different prompt shape.
    - A final matched evaluation used 18 primary-only calls with both tokenizers
      prewarmed, alternating model order, and the current 41-app/68-skill/18-focus
      catalogue. Gemini and repaired Mistral each passed 6 routing and 3 metadata
      cases, with correct expected skill selection and language. This bounded
      corpus is not a broad quality, p95/p99 or availability claim.
    - Gemini routing averaged 959.0ms (median 968.5, range 865.6-1043.7); Mistral
      averaged 1223.8ms (median 1214.2, range 1151.0-1349.1). Gemini used 47198 input
      and 986 output tokens; Mistral used 47813 input and 973 output tokens across
      the same six routing inputs.
    - Gemini metadata averaged 1601.9ms (range 1454.1-1839.2); Mistral averaged
      2539.3ms (range 2226.4-3032.5). Input/output totals were 21084/1053 and
      21190/967 respectively across the three metadata inputs.
    - Before named-tool repair, Mistral returned an unoffered skill name on four
      routing inputs and timed out at 12 seconds on two. Single-tool required
      selection now pins the actual routing function by name, preserving multi-tool
      behavior; repaired Mistral passed all six cases. The compact prompt alone is
      not proven to have caused the earlier failure.
    - Initial provider probes exposed 3323.7ms of shared local tokenizer cold start;
      final prewarmed estimation was 7.2-11.5ms per request. Worker startup now loads
      o200k_base and cl100k_base before accepting AI work.
    - Tool continuation dropped assistant tool_calls while constructing Anthropic
      tool_result blocks; billing combined the final provider type with the initial
      model name and priced mixed-model token totals as one model. Both defects
      existed on main/dev before this session's preprocessing changes.
    - Weather tool schemas contained frontend-only x-ui annotations, rejected locally
      by the Google SDK before network dispatch. Provider schema sanitization now
      removes schema extension annotations while preserving actual argument names
      and leaving the original frontend schema unchanged.
    - Repeated opening prompts generated identical automatic slug hashes, violating
      chats_personal_slug_hash_uq. The fix uses a bounded chat-ID suffix for automatic
      slugs; explicit slug behavior and encrypted persistence stay intact.
    - Duplicate final-stream and fallback completion frames each scheduled a 12-second
      postprocessing timer. The second handle overwrote the first; metadata cleared
      only the second. Live timer tracing measured a 9.48-second process-exit penalty.
  preflight_and_cli_plan:
    immediate_repairs:
      - Make response completion scheduling idempotent and test duplicate terminal
        frames followed by metadata, plus the required metadata-timeout path.
      - Make automatic saved-chat slugs owner-unique with a length-safe chat-ID suffix;
        preserve explicit slugs and test repeated first messages.
    next_optimization:
      - Share one authorized memory snapshot per CLI command across redaction,
        mention resolution and sendMessage; preserve PII protection and consent.
        Current callers each read the heavy account-export endpoint, which is
        limited to five requests per minute by remote IP. Three sequential chats
        can therefore trigger the CLI's hard-coded 61-second settings retry.
      - Add an authenticated owner-filtered personal-memory read endpoint analogous
        to team memories; do not raise the GDPR export limit to mask duplicate
        reads. Keep encrypted content and personal/team boundaries unchanged.
      - Separate optional memory enrichment from explicit export retries. Reuse an
        authorized command snapshot on enrichment throttling, never silently skip
        required privacy/redaction data, fail closed for automatic consent, and
        honor bounded Retry-After for explicit operations.
        Cover command-level read count, invalidation, 429, owner isolation and
        three sequential saved-chat sends in tests before rollout.
      - Instrument authentication, memory load, history sync, preflight, answer,
        metadata and process exit with monotonic phase timings before changing sync.
      - Reuse the already loaded memory snapshot and coalesce duplicate session/socket
        setup; evaluate eliminating the measured 2.324-second second-socket forced sync
        while retaining authorized up-to-date history and encrypted persistence.
      - Translate only the named personal/team slug uniqueness constraints to a safe
        409 conflict, with atomic rollback and no sensitive database detail exposure.
    measured_boundary: Preflight itself was 78ms total and 49.7ms durable; no evidence supports attributing the former 15-second excess to Directus preflight latency.
  openmates_tasks:
    utility_evaluation: da41fc58-274a-48f8-b7ee-552794aba77e
    tool_billing_repair: 4eae41f3-813e-4ae5-94f3-90179f05911c
    preflight_plan_delivery: f2d25e77aa97b22e0c889ac94da8cfe190c774986db661f45972a698f7af7d86
    preflight_plan_status: pending_delivery_not_acknowledged
  focused_verification:
    backend: Independent review ran 66 focused tests successfully across tool history, schema sanitization, model usage, billing and utility recovery.
    cli: All 18 WebSocket tests and focused automatic-slug/encrypted-preflight regressions passed; no changed-file diagnostics in the existing broadly failing CLI typecheck.
  live_validation:
    deployed_source: 354ae80761ed2b9dbe5abe3b0febcf9b509ee0a6
    installed_cli: Built successfully and installed globally; executable bundle SHA-256 matches the isolated source build.
    runtime: Coordinated dev restart docker-09713f4c completed with all selected/coherence-dependent services healthy; AI parent tokenizer preload took 6.306s before serving work, inherited child lookup took 0.000s.
    successful_cases:
      - Repeated identical opening prompts saved as separate chats with no Directus slug collision; both invoked search skills, so they are not no-tool latency samples.
      - Gemini weather for Berlin and follow-up Paris both returned forecasts and a final answer, persisted successfully and charged the correct Gemini model bucket.
      - Explicit tool-free arithmetic returned only "4"; full CLI duration was 9.74s, with 13848 main input tokens and one output token, charged 12 credits.
    findings_from_first_run:
      - A weather command took 76.662s because the second memory/export read received HTTP 429 and slept 61s before AI dispatch. CLI-to-worker was 63.852s, worker-to-first-text 5.358s, CLI-to-first-text 69.210s. This was not model-provider throttling.
      - An explicit Anthropic weather test exposed discarded input_json_delta fragments and error-wrapped skill results incorrectly cached as completed. These pre-existing defects need repair and a fresh successful real tool turn before tool validation is complete.
      - Search returned its link but quote finalization removed the requested explanation after misparsing a punctuation-suffixed quoted embed link. Preserve strict source verification while fixing the extraction regression, then recheck a real search answer.
      - The existing proactive main-model tool policy caused both sky-explanation prompts to search despite the requested one-sentence answer. This is not evidence that the new utility model caused the policy; policy tuning is a separate proposal.
    limitations:
      - Small dev sample only; no production rollout, broad quality or latency-percentile claim.
      - Raw backend mention syntax was rejected by one CLI invocation before dispatch; use display-name mentions such as Claude-Sonnet-5 for actual CLI validation.
      - OpenObserve trace DNS was unavailable; timing evidence uses full ISO Docker timestamps, retaining minute rollovers and all client delay.
  followup_repairs:
    implementation:
      - Accumulate Anthropic tool argument JSON fragments by content-block index and emit each complete object once; malformed or non-object arguments fail visibly.
      - Do not deduplicate explicit-error tool results as successful; preserve caching for valid zero-hit results without an error.
      - Correct canonical and noncanonical quote-link punctuation extraction while preserving strict source verification and removing rejected quotes without orphan punctuation.
    verification:
      - Anthropic streaming and tool-result dedup focused suite passed 27 tests.
      - Independent review found one punctuated bare-citation edge case, now repaired with focused regression coverage; final review has no remaining must-fix.
      - The earlier isolated CLI search and post-tool completion cases passed; two browser cases failed waiting for embeds. Those artifacts are under bounded read-only investigation, not assumed unrelated and not rerun.
    next_action: Deploy the scoped follow-up repairs and verify a real Anthropic weather answer and search explanation; keep the settings-memory API optimization as a separately scoped proposed follow-up.
