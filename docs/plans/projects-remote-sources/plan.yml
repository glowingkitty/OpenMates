apple_impact:
  affected_files:
    - apple/OpenMates/Sources/**/Chat*
    - apple/OpenMates/Sources/**/Embeds*
    - apple/OpenMates/Sources/**/Projects*
  parity_expectations:
    - Apple chat should eventually render project, folder, and file mentions consistently with web chat once the API and encrypted payload contracts exist.
    - Apple embed surfaces should eventually render remote file/folder virtual previews consistently with existing embed preview/fullscreen behavior.
    - Initial V1 implementation may be web plus CLI first, but contracts must remain platform-neutral and avoid web-only assumptions.
  verification:
    - Apple affected for chat mention and preview rendering parity. On Linux, use `python3 scripts/apple_remote.py status` and then `build-ios` or `test-ios` after implementation unless Apple work is explicitly deferred.
  intentional_native_differences:
    - Native app may not host the CLI bridge itself in V1; it can consume synced encrypted Project metadata and remote-preview records once available.

clarification:
  rounds:
    - question: Should V1 upload individual files, folders, both, or only attach sources without uploads?
      answer: V1 Upload to OpenMates should support individual files and multi-select files. Folder upload and sync can be designed for later, but should not be implemented in V1.
    - question: Where should remote preview metadata and snippets be cached by default?
      answer: Keep preview files and metadata on the remote machine by default for scalability. Use `~/.openmates/remote-cache/<source-id>/`; repo-local `.openmates/preview-cache/` is opt-in only.
    - question: How much project context should be sent to the assistant for project or folder mentions?
      answer: "Use a tiered model: project/folder maps with file and folder counts, line counts, depth-limited tree, git/recency signals, ranked symbols/signatures, omitted summaries, and strict caps. Do not send full contents unless specific file reads or bounded snippets are approved."
    - question: How long should mention-based access last?
      answer: A specific file mention grants access for the current message. A project or folder mention grants structure/map access for the current chat. Broader reads/search are allowed by project mention unless privacy settings say Always ask.
    - question: Should V1 include assistant write/patch/command execution?
      answer: No. V1 should be read/preview/import-only. Writes, patches, commands, and remote mutations are later-phase but the architecture should reserve a permission model for them.
    - question: For existing remote files, should the assistant still generate diffs even if V1 cannot write to the remote source?
      answer: Yes. Existing remote files should be edited as unified diff proposals rendered through embed-like preview/fullscreen UI. A remote diff proposal is a message-local virtual artifact stored inside the encrypted assistant message, not a real embed or separate Project row unless the user explicitly saves/uploads it. It must not mutate the remote filesystem in V1.
    - question: Where should remote Project write and action settings live?
      answer: Global defaults belong under Settings > Privacy & Security > Assistant actions. Project-specific permissions belong under Settings > Projects > project name, with a gear icon on Project pages as quick access. Code-specific automated checks belong under Settings > Apps > Code, with Project-level overrides in the Project settings page.
    - question: Which write permission modes should V1 expose for Projects?
      answer: Keep the mental model simple with only Always ask before writes and Auto approve safe writes. Do not implement Auto decide in V1; reserve it for later after deterministic policies, audit logs, undo, and user feedback are solid.
    - question: How should mentions express read versus write intent?
      answer: Show a visible Read / Read & Write switch on Project, folder, and file mention/access chips. If Project mode is Auto approve safe writes, mentions default to Read & Write except protected files. If Project mode is Always ask before writes, mentions default to Read. The switch should be keyboard accessible, including Tab navigation.
    - question: Should OpenMates prompt for automated code checks after assistant code changes?
      answer: Yes. On first assistant code creation or update in a Project, ask whether to enable automated checks. Choices are Not now, isolated E2B sandbox with no remote-machine performance impact but code disclosure to the sandbox, or remote-machine checks with better privacy but local CPU/disk impact. This setting is separate from write permission.
    - question: How should Project rules, deterministic enforcement, and workflows fit together?
      answer: >
        Use one user-facing Project Rules area with three internal rule kinds: AI
        Instructions, prebuilt deterministic Checks with editable parameters, and
        Workflows for anything custom or multi-step. AGENTS.md, CLAUDE.md, and
        similar files should appear as Rules embeds and be auto-loaded for Project
        context. OpenMates can use an LLM to extract candidate checks/workflows
        from those instruction files, but only mapped prebuilt Check templates can
        become hard enforcement, and the user must review the conversion before
        activation. Existing built-in OpenMates safety checks should also be
        visible in this same Rules UI so users have one mental model.
    - question: What should be the canonical remote-access command and process lifetime?
      answer: >
        Use `openmates remote-access` as the canonical command. It should run in
        the foreground, expose only the current working directory by default, and
        stop when the shell or SSH session exits. Startup copy should recommend
        zellij, tmux, or screen for users who want SSH persistence. Do not keep
        `openmates remote-access start` as a compatibility alias in the target CLI.
    - question: How should remote access roots and outside-root paths be bounded?
      answer: >
        Default access is the current working directory. Users may add multiple
        explicit `--path` roots. Every operation must compare canonical realpaths,
        including symlink resolution, against approved roots. Outside-root access
        requires a separate exact local-user approval that the server or assistant
        cannot broaden. Broad roots such as `$HOME`, `/`, and `/Users/<name>` need
        strong warnings before continuing.
    - question: How should Project descriptions sync with Git-backed folders?
      answer: >
        For Git-linked Projects, root README.md is the Project description source
        of truth. Editing the Project description proposes a README.md diff and
        requires explicit approval before writing. Creating a description for a
        Project that lacks README.md proposes creating README.md.
    - question: How should remote file edits, deletes, undo, and PII checks work?
      answer: >
        Git is strongly recommended but not required. OpenMates may support
        agentic read/write/create/delete/rename/undo for approved Project files in
        a later implementation slice, but must keep its own undo/version journal on
        the remote machine outside the source root at
        `~/.openmates/remote-cache/<source-id>/change-journal/`. The journal needs
        pre/post hashes, forward and inverse patches, deleted/binary snapshots,
        PII scan results, approval receipts, timestamps, source/project IDs, path,
        size/line counts, and optional Git metadata.
    - question: How should OpenMates-stored Project files be versioned?
      answer: >
        Files uploaded or created inside OpenMates should use the existing
        encrypted embed diff/version model for text/code/markdown. Large snapshots,
        deleted binaries, or patch-ineligible blobs can be stored as encrypted S3
        objects referenced from version records.
    - question: How should OpenMates handle missing, long, linked, or contradictory agent instructions when connecting a repository?
      answer: >
        On remote-access startup for a repo, OpenMates should automatically detect
        repo-local agent instruction files, including nested AGENTS.md-style files,
        and prompt to run the recommended billable instruction audit. If no agent
        instruction exists, suggest creating root AGENTS.md. If instructions exist,
        detect explicitly linked repo-local instruction documents, mark those files
        as AI Instructions too, then run two separate LLM checks: one for
        contradictory instructions and one for excessive length/cost. OpenMates
        should suggest rewrites or improvements, and if the user declines, warn
        that result quality may suffer and context costs may increase.
    - question: How should nested agent instruction files be selected for billable audit?
      answer: >
        Scan all nested repo-local AGENTS.md/CLAUDE.md-style files locally and show
        a grouped scope summary before billable analysis. Select root and relevant
        nested scopes by default up to a clear size/cost cap. If many files are
        found, select the highest-priority scopes by default and make the rest
        expandable/selectable before the audit runs.
    - question: How should remote-access handle different folder structures and Project recommendations?
      answer: >
        When `openmates remote-access` starts, inspect the approved root locally and
        use OpenMates metadata under `.openmates` or the remote cache to detect
        whether that folder structure was already processed. If not processed,
        preserve the approved folder as one browsable source tree and recommend
        Project candidates as an overlay on that tree. Require user confirmation
        before creating or attaching anything. If the user starts inside one repo,
        recommend one Project for that repo. If the user starts in a parent folder
        containing many repos, recommend creating or using a parent `projects`
        folder workflow and show editable Project candidates for detected repos or
        groups without silently creating them.
    - question: How should OpenMates protect users from accidentally creating many Projects?
      answer: >
        Bulk Project creation must always go through an explicit review screen in
        CLI flow. The detected source tree remains visible, and Project
        candidates are shown as a selected-by-default list that the user can modify
        with keyboard navigation. Users can move up/down, select/unselect
        candidates, rename candidates, group folders into one Project, choose
        browse-only/local-only, or cancel before any Project is created.
    - question: Where should local `.openmates` metadata be created when users approve repo/workspace-local metadata?
      answer: >
        Create local `.openmates` metadata only after explicit approval. Prefer one
        `.openmates` folder in a dedicated parent `projects` folder when managing
        multiple repos, or one `.openmates` folder at a single Project root when
        the user starts from one repo. Avoid duplicating metadata in every child
        repo when parent metadata already tracks them. If local metadata is not
        approved, use `~/.openmates/remote-cache/<source-id>/metadata.json`.
  vision_summary: >
    Projects should become the privacy-preserving workspace boundary for code and
    document context. Attaching a folder or repository should not upload it by
    default; OpenMates stores encrypted Project/source metadata, while the local
    or remote CLI bridge performs search, map, and read operations after user
    consent. The UI should feel like existing embeds for previews and fullscreen
    reading, but remote files remain virtual until the user explicitly uploads
    selected files to OpenMates. Mentioning a Project is a meaningful consent
    signal for that chat unless the user chooses Always ask. Future write support
    should keep a simple two-mode Project policy: Always ask before writes or Auto
    approve safe writes. High-risk files still require explicit approval by
    default, and automated code checks are a separate Code app / Project setting
    rather than an implicit part of read or write access. Project Rules unify AI
    instruction files, deterministic checks, and workflow suggestions in one UI so
    users do not need to understand internal policy versus workflow boundaries.
    Remote access is deliberately foreground and root-bounded; future file
    mutations use explicit approval, PII scans, and OpenMates-owned encrypted or
    remote-local version journals rather than relying only on Git. Repository
    connection also audits agent instructions and linked instruction documents so
    users can shorten, deduplicate, and resolve conflicting guidance before it
    silently harms quality or cost.
  approved_by_user: true

v1_product_model:
  project_source:
    description: >
      A Project can have zero or more attached sources. A source points to a local
      or remote folder/repository reachable by a user-controlled CLI bridge. The
      server stores only encrypted display metadata and opaque source IDs; it does
      not store file paths or raw trees in plaintext.
    source_types:
      - local_folder
      - local_git_repository
      - remote_folder
      - remote_git_repository
    source_state:
      - connected
      - offline
      - permission_required
      - revoked
  remote_access_session:
    canonical_command: openmates remote-access
    default_root: current_working_directory
    lifetime: >
      Foreground process lifetime only. The bridge is connected while the command
      is running and becomes offline when the process, shell, SSH session, or
      terminal multiplexer session exits. V1 must not install a hidden daemon,
      background service, launch agent, or systemd unit.
    startup_guidance:
      - Recommend running inside zellij, tmux, or screen when the user wants the bridge to survive an SSH client disconnect.
      - Print the approved roots, redacted when appropriate, plus the cache/journal base path.
      - Warn that OpenMates can access files only while the foreground bridge is online.
      - If started inside a single repo, recommend creating or attaching one Project for that repo unless OpenMates metadata shows it was already processed.
      - If started inside a parent folder that contains multiple repos, recommend running from a dedicated `projects` folder and present a grouped Project recommendation before any creation.
    roots:
      default_behavior: Only the process current working directory is approved by default.
      multi_root_behavior: Additional roots require explicit repeated `--path <path>` arguments.
      path_boundary: >
        All read, search, preview, upload, write, delete, rename, and undo
        operations resolve the requested path and approved roots through realpath
        before comparison, so symlinks cannot escape the approved boundary.
      outside_root_exception: >
        Access to an exact path outside approved roots requires a separate local
        user consent prompt on the machine running the CLI bridge. The server,
        assistant, remote chat message, or Project setting cannot broaden an
        outside-root exception into parent-directory or sibling access.
      broad_root_warning:
        triggers:
          - /
          - $HOME
          - /Users/<name>
          - /home/<name>
          - Windows user profile roots
        behavior: >
          The CLI blocks for an explicit confirmation and explains that a narrower
          project folder is strongly recommended before starting with broad roots.
    processed_root_metadata:
      storage: >
        OpenMates processing state for a local folder/repo is stored in OpenMates
        metadata. By default, store it under
        `~/.openmates/remote-cache/<source-id>/metadata.json`. If the user
        explicitly approves repo/workspace-local metadata, prefer exactly one
        `.openmates/metadata.json` at the dedicated parent `projects` folder for
        multi-repo workspaces, or at the single Project root for one-repo work. Do
        not create duplicate `.openmates` metadata folders in every child repo when
        parent metadata already tracks them. The metadata records source id,
        Project id links, processed root realpath hash, detected repo fingerprints,
        instruction-audit state, export settings, and last processed timestamp. It
        must not store secrets or plaintext private paths in backend metadata.
      behavior: >
        If processed-root metadata indicates the folder was already attached or
        intentionally skipped, startup should not repeatedly recommend creating the
        same Project. It can show the existing Project/source association and ask
        whether to refresh, reconnect, or re-run audits.
    folder_structure_recommendations:
      source_tree_rule: >
        Starting `openmates remote-access` in a folder creates one approved root
        source tree for browsing. All folders and subfolders under that root appear
        under the root in OpenMates, preserving the user's folder structure. Git
        repositories, nested instruction scopes, and recommended Project candidates
        are overlays/badges on the tree, not replacements for the tree.
      examples:
        - structure: single_git_repo
          example: /work/openmates
          recommendation: Create or attach one Project named from the repo folder or README, then audit root and nested instructions.
        - structure: parent_projects_folder
          example: /work/projects/openmates + /work/projects/marketing-site + /work/projects/docs
          recommendation: Recommend starting from `/work/projects`; detect child repos; suggest one Project per child repo by default.
        - structure: monorepo_with_apps
          example: /work/company/apps/web + /work/company/packages/ui under one Git root
          recommendation: Prefer one Project for the Git root with nested folder scopes unless the user selects subfolders as separate Projects.
        - structure: mixed_repo_and_notes
          example: /work/client-a/repo + /work/client-a/notes + /work/client-a/assets
          recommendation: Suggest one parent Project with repo, notes, and assets as sources if they clearly belong together.
        - structure: broad_home_folder
          example: /home/alice
          recommendation: Warn strongly and recommend creating/using a narrower `/home/alice/projects` folder instead of exposing home.
      creation_rule: >
        Project creation is recommended automatically from folder structure only
        when OpenMates metadata does not show prior processing. Creation is never
        silent: the user reviews a selectable candidate list before any Project is
        created. The user can Create selected Projects, Attach selected folders to
        existing Projects, Browse only / run local-only, or Cancel.
      cli_selection_behavior: >
        The CLI review step supports keyboard navigation. Up/down moves through
        candidates, Space toggles selected/unselected, Enter continues, and a rename
        or group action lets the user edit the proposed Project list before
        confirmation. The final confirmation prints the exact number and names of
        Projects that will be created.
  project_description_sync:
    git_backed_source_of_truth: README.md at the attached Git source root.
    read_behavior: >
      When a Git-backed source has a root README.md, the Project description UI can
      show it as the synced Project description after client-side decryption or
      bridge read approval. The backend never receives plaintext README content
      except as already-approved assistant context or encrypted Project metadata.
    edit_behavior: >
      Editing the Project description for a Git-backed Project creates a proposed
      README.md diff against the current base hash. The user must approve the diff
      before any file write occurs. If README.md does not exist, creating a Project
      description proposes creating README.md with that content.
    non_git_behavior: >
      Non-Git Project descriptions remain encrypted Project metadata unless the
      user explicitly chooses a source file to sync. Git is recommended before
      write/delete operations but is not required.
  virtual_remote_preview:
    description: >
      A virtual preview is embed-compatible UI data for a file or folder that has
      not been uploaded as an OpenMates embed. It can render through existing
      UnifiedEmbed preview/fullscreen primitives with a remote-source badge and
      source status. It includes bounded metadata and snippets only.
    metadata:
      - source_id
      - remote_item_id
      - encrypted_display_path
      - encrypted_display_name
      - kind
      - language
      - size_bytes
      - line_count
      - mtime
      - content_hash
      - git_status
      - preview_policy
      - safety_flags
  project_map:
    description: >
      The bounded assistant-visible structure for a Project or folder mention.
      It is computed by the CLI bridge from allowed sources and sent as explicit
      client-decrypted context for the current turn or chat according to the
      permission mode.
    includes:
      - file_count
      - folder_count
      - total_line_count_estimate
      - depth_limited_tree
      - git_branch_and_status_summary
      - recent_files
      - dirty_files
      - ranked_symbols_and_signatures
      - omitted_paths_summary
      - search_capabilities
    excludes:
      - raw recursive tree without caps
      - full file contents by default
      - ignored files unless explicitly included by user approval
      - secrets, env files, and binary blobs unless explicitly uploaded or approved
  project_linked_objects:
    tasks: >
      Every user task can link to zero or more Projects. Inside a Project, linked
      tasks appear in the reusable Kanban board with backlog, todo, in_progress,
      blocked, and done columns. Tasks are not organized inside Project folders by
      default because status and assignee are the primary task navigation model.
    plans: >
      Every user plan can link to zero or more Projects. Inside a Project, plans
      can be organized in Project folders/subfolders as durable project artifacts.
      Tasks generated from a Project-linked plan inherit the Project link unless
      the user removes it.
    chats: >
      Chats can be added to Projects and optionally placed in Project folders.
      Adding a chat to a remote-access Project can ask whether to create a remote
      machine copy, but OpenMates-only encrypted storage remains the default.
    workflows: >
      Workflows can be added to Projects and optionally placed in Project folders.
      Remote-machine workflow copies default to YAML only when the user explicitly
      chooses a remote copy for repo/team reuse.
    project_view: >
      Project detail surfaces should show folder-organized files, chats, workflows,
      and plans, plus a separate Project task Kanban board for all linked tasks.
  privacy_modes:
    always_ask:
      behavior: >
        Project/folder/file mention creates a pending permission request before
        the assistant receives project maps, search results, or file previews.
    ask_for_broad_access:
      behavior: >
        Specific file mentions can be read for the current message. Project or
        folder mentions grant map access for the current chat, but broad searches
        or multiple file reads can prompt when risk thresholds are exceeded.
    allow_for_mentions:
      behavior: >
        Mentioning a Project/folder/file is enough consent for bounded maps,
        searches, and reads within that Project for the current chat, subject to
        hard caps and secret filters.
  settings_surfaces:
    global_assistant_actions:
      path: Settings > Privacy & Security > Assistant actions
      behavior: >
        Stores global defaults for assistant autonomy across OpenMates, including
        default Project write mode for new Projects and global protected path
        patterns. This is not Code-app-specific because the same model will later
        apply to other high-risk assistant actions.
    project_settings:
      path: Settings > Projects > <project name>
      behavior: >
        Stores Project-specific remote source permissions, read/write mode,
        protected path patterns, connected source settings, automated check
        overrides, audit history, revocation controls, and source status. Project
        pages expose a gear icon that deep-links here instead of duplicating a
        separate settings UI inside the Project page.
    code_app_checks:
      path: Settings > Apps > Code > Automated checks
      behavior: >
        Stores global Code app defaults for lint/test/check behavior after
        assistant-created or assistant-updated code. Project settings can override
        these defaults per Project/source.
    project_rules:
      path: Project page > Rules section and Settings > Projects > <project name> > Rules
      behavior: >
        Shows imported and user-created Project Rules as embed-like cards and a
        fullscreen Rules view. The same surface separates AI Instructions, Checks,
        and linked Workflows without requiring users to know the internal runtime
        implementation. Project pages show Rules cards next to folders, files,
        plans, tasks, and other embeds; Project settings expose activation,
        review, source, and enforcement controls.
  project_rules:
    description: >
      Project Rules are the user-facing reliability layer for Project context.
      They combine persistent AI instruction documents, deterministic prebuilt
      checks, and workflow links under one Project-scoped UI. Rules are loaded
      whenever the user references the Project, folder, or source in chat so the
      assistant does not lose important instructions during long conversations or
      compression.
    user_facing_kinds:
      - kind: ai_instruction
        label: AI Instruction
        behavior: >
          Text that the assistant should keep in context. Imported AGENTS.md,
          CLAUDE.md, .cursor/rules, .github/copilot-instructions.md, and
          user-created Project rule text start here. AI Instructions can be
          subjective or contextual and do not block actions by themselves.
      - kind: check
        label: Check
        behavior: >
          A prebuilt deterministic rule with editable parameters. Checks answer
          whether a proposed action is allowed, blocked, warning-only, or requires
          approval. Checks never depend on an LLM judgment at enforcement time.
      - kind: workflow
        label: Workflow
        behavior: >
          A linked workflow handles multi-step, scheduled, event-triggered, or
          custom automation such as running commands, creating reports, notifying
          users, or escalating failed checks.
    imported_sources:
      auto_detect:
        - AGENTS.md at repo root and nested folders
        - CLAUDE.md at repo root and nested folders
        - .cursor/rules/**
        - .github/copilot-instructions.md
        - .openmates/rules.md
      behavior: >
        Detected files appear as Rules cards in the Project browser and open in
        the fullscreen Rules view. Repo-backed Projects may offer to create or
        sync user-created rules to AGENTS.md or .openmates/rules.md, but writing
        those files follows the Project write policy and remains a later-phase
        remote mutation until patch apply is implemented.
    connection_audit:
      startup_trigger: >
        `openmates remote-access` automatically scans approved repo roots for
        supported instruction files during startup. The local scan is not a
        separate user command. If candidate files or missing-instruction state are
        found, the CLI shows the recommended audit prompt immediately as part of
        startup. Billable LLM analysis still requires explicit user permission.
      billable_behavior: >
        Repo connection should recommend a billable instruction audit before it
        runs, because resolving conflicting or oversized instructions can improve
        output quality and reduce later context/model costs. CLI and later UI
        surfaces must ask permission first, show that the audit uses credits or
        metered model calls, and label the audit as recommended. The audit should
        not be hidden behind a generic indexing label.
      audit_state_storage: >
        Audit status such as skipped, pending, completed, declined suggestions,
        and last audit summary is stored in OpenMates metadata, not in the source
        repository. For remote bridge state, use `~/.openmates/remote-cache/<source-id>/`
        metadata or encrypted Project/source metadata; do not write status markers
        into the connected repo unless the user explicitly approves a repo file
        change.
      missing_instruction_behavior: >
        If no supported instruction file is found, OpenMates suggests creating a
        root AGENTS.md file as the default Project AI Instruction. It can draft
        starter content after user approval and should show concrete bullet-point
        improvement suggestions, selected by default, before creating the file.
        `.openmates/rules.md` is not the default; reserve it for users who
        explicitly want OpenMates-specific repo rules.
      linked_instruction_discovery: >
        Imported instruction files may explicitly reference local documentation or
        rule files. By default, V1 follows only explicit links to files that are
        part of the connected repository and inside approved roots. The bridge
        resolves repo-local relative links by realpath, applies file size/type
        caps, and marks accepted linked files as linked AI Instructions. Remote
        URLs, inferred-but-unlinked documents, outside-root links, binaries, and
        oversized files require separate user review before inclusion.
      nested_scope_behavior: >
        Nested AGENTS.md/CLAUDE.md-style files are treated as scoped AI
        Instructions for their containing folder subtree. The audit can process all
        detected scopes in one run, but findings and rewrite suggestions must name
        the relevant folder scope so users understand which parts of the repo are
        affected.
      nested_scope_selection: >
        The startup scan lists all detected instruction scopes in a grouped summary
        before metered model calls. Root-level instructions and relevant nested
        scopes are selected by default up to an explicit size/cost cap. If the repo
        has more instruction scopes than the cap, OpenMates selects the
        highest-priority scopes by default, shows how many were omitted from the
        default selection, and lets the user expand/select additional scopes before
        approving the billable audit.
      status_copy:
        title: Checking agent instructions...
        detail: >
          Local AGENTS.md, CLAUDE.md, and similar files are checked together with
          linked repository documents to detect conflicts and evaluate length.
      checks:
        - id: contradiction_check
          prompt_boundary: >
            Run as a separate LLM prompt over the instruction set and accepted
            linked instruction documents. It identifies conflicting directives,
            names the source files/spans, explains the impact, and suggests a
            resolution without editing files automatically.
        - id: length_and_cost_check
          prompt_boundary: >
            Run as a separate LLM prompt that estimates context length/cost risk,
            identifies duplicate or low-value sections, and suggests a shorter
            equivalent instruction set.
      improvement_suggestions: >
        OpenMates can propose rewrites, merges, or new instruction files as
        concrete machine-readable suggestion records. Each suggestion includes a
        selected-by-default flag, short bullet summary, expandable description,
        affected paths, base hashes, and an actual diff or create-file patch. CLI
        and later first-party clients can apply approved suggestions directly from this JSON
        without making another LLM request. Applying suggestions follows normal
        Project write policy, README/rules file base-hash checks, PII/secret scans,
        and approval cards. Suggestions should edit existing repo instruction files
        first; when no instruction file exists, the default create-file suggestion
        targets root AGENTS.md.
      suggestion_json_contract:
        fields:
          - id
          - selected_by_default
          - summary
          - description
          - rationale
          - affected_paths
          - source_spans
          - base_hashes
          - risk_flags
          - estimated_token_savings
          - estimated_quality_impact
          - diff
          - creates_new_file
          - requires_explicit_approval
      decline_warning: >
        If the user declines suggested rewrites after contradictions or excessive
        length are found, OpenMates should warn that the unresolved instructions
        may reduce answer quality, cause inconsistent agent behavior, and increase
        context/model costs.
    extraction_pipeline:
      - step: import_instruction
        behavior: The original instruction file is stored/rendered as an AI Instruction Rules embed.
      - step: discover_linked_instruction_docs
        behavior: Explicitly linked repo-local instruction documents are resolved inside approved roots, capped, and imported as linked AI Instructions after user-visible audit handling; inferred references and external URLs are excluded by default.
      - step: run_contradiction_check
        behavior: A dedicated prompt checks imported and linked AI Instructions for contradictions and produces source-linked findings and rewrite suggestions.
      - step: run_length_and_cost_check
        behavior: A dedicated prompt checks imported and linked AI Instructions for excessive length, duplicated guidance, and context-cost risk.
      - step: propose_structured_items
        behavior: An LLM may identify candidate Checks or Workflow suggestions and link each candidate back to the source text span.
      - step: template_match
        behavior: Only candidates that map to the prebuilt Check registry can become deterministic Checks.
      - step: user_review
        behavior: User sees proposed Checks and Workflow suggestions before activation, with safe built-in checks shown as already active system defaults.
      - step: activate
        behavior: Activated Checks enforce according to their effect; Workflow suggestions become draft workflows or links only after explicit user confirmation.
    check_registry_v1:
      - id: protected_paths
        parameters: paths, effect
        example: "Never edit .env files -> paths: [.env, .env.*], effect: require_approval"
      - id: max_file_lines
        parameters: paths, max_lines, effect
        example: "Keep files under 500 lines -> max_lines: 500"
      - id: forbidden_commands
        parameters: commands, preferred_commands, effect
        example: "Never run local Playwright -> commands: [npx playwright], preferred_commands: [python3 scripts/tests.py run --spec]"
      - id: required_checks
        parameters: changed_paths, commands, runner, consent_mode
        example: "After backend edits, run pytest -> changed_paths: [backend/**/*.py], commands: [python -m pytest ...]"
      - id: generated_file_guard
        parameters: generated_paths, source_paths, effect
        example: "Do not edit generated files unless source files changed"
      - id: secret_scan_required
        parameters: paths, scanner, effect
        example: "Scan proposed diffs for secret-like strings before approval"
      - id: approval_required_paths
        parameters: paths, reason, effect
        example: "Ask before changing auth, billing, privacy, or security paths"
    unsupported_or_ai_only_examples:
      - "Prefer simple solutions"
      - "Make the UI feel premium"
      - "Preserve architectural intent"
      - "Ask a clarifying question when the user's intent is ambiguous"
    visibility:
      - Imported Rules cards show source file, last processed time, active extracted item count, and whether review is needed.
      - Fullscreen Rules view shows the original text, extracted AI Instructions, active Checks, draft Workflow suggestions, and unsupported AI-only instructions.
      - Each Check shows source line/span, template id, parameters, effect, status, and a human-readable explanation of how it is enforced.
      - Advanced users can edit Check parameters, but V1 does not expose arbitrary Python/JavaScript enforcement code editing.
  write_permission_modes:
    always_ask:
      label: Always ask before writes
      default_for_new_projects: true
      behavior: >
        Project, folder, and file mentions default to Read. User can toggle a
        visible Read / Read & Write switch to grant write permission for the
        requested scope and duration. Applying remote diffs remains a later-phase
        action and must show an approval card before any write.
    auto_approve_safe_writes:
      label: Auto approve safe writes
      behavior: >
        Project, folder, and file mentions default to Read & Write except
        protected files. Deterministic checks, source-root bounds, base-hash
        checks, patch size limits, and high-risk file rules still apply. This mode
        does not grant shell command execution, package install, test execution,
        git mutation, or high-risk file writes by itself.
    auto_decide:
      status: reserved_later
      behavior: >
        Not implemented in V1. A future version may add Auto decide only after
        deterministic rules, audit receipts, undo/rollback, and user feedback are
        mature. LLM risk scoring must not be the sole authority for remote writes.
  high_risk_files:
    built_in_always_ask:
      - .env
      - .env.*
      - "*.pem"
      - "*.key"
      - id_rsa
      - id_ed25519
      - .npmrc
      - .pypirc
      - .netrc
      - .ssh/**
      - .gitignore
      - .gitattributes
      - .gitmodules
      - .github/workflows/**
      - Caddyfile
      - nginx.conf
      - Dockerfile
      - docker-compose*.yml
      - k8s/**
      - helm/**
      - terraform/**
      - "*.tf"
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - bun.lockb
      - pnpm-workspace.yaml
      - pyproject.toml
      - Cargo.toml
      - go.mod
      - migrations/**
      - schema.sql
      - backend/core/directus/schemas/**
      - paths containing auth, encryption, billing, privacy, permission, compliance, or security
      - files matched by .gitignore
      - binary files
      - symlink targets
      - deletes, renames, executable-bit changes, chmod changes, and binary edits
    behavior: >
      Built-in high-risk files require explicit user approval before write by
      default, even when the Project uses Auto approve safe writes. The default
      list must stay intentionally narrow and focused on secrets, deployment,
      dependency execution, auth/security/privacy/compliance, schema/migration,
      CI, and filesystem-boundary risk so the warning remains meaningful.
    user_defined:
      behavior: >
        Users can add global or Project-specific protected path patterns. These
        patterns only add restrictions. They can require permission for folders,
        file types, or individual paths that matter to the user.
  repo_policy_config:
    path: .openmates/permissions.yml
    behavior: >
      Optional repo-local config may declare protected paths, safe editable paths,
      project warnings, and suggested check commands. It may add restrictions and
      suggestions but must not silently enable auto-approve, disable global or
      Project high-risk rules, grant command execution, or weaken user settings.
      Importing broader permissions from repo config requires explicit user
      approval.
  project_file_mutations:
    status: reserved_later_slice
    allowed_operations:
      - read
      - create_text_file
      - update_text_file
      - delete_file
      - rename_or_move_file
      - undo_approved_change
    excluded_operations:
      - shell_command_execution
      - package_install
      - test_command_execution
      - git_commit
      - git_push
      - chmod_or_executable_bit_change_without_explicit_high_risk_approval
    approval_flow: >
      Every mutation plan shows the source, root, canonical path, operation,
      before/after summary, PII/secret findings, high-risk flags, base hash, patch
      size, undo availability, and whether Git metadata is present. Always ask
      Projects require explicit approval for every mutation. Auto approve safe
      writes can apply only low-risk text updates inside approved roots after all
      deterministic checks pass.
    pii_detection: >
      Proposed file contents and diffs are scanned for PII-like and secret-like
      data before approval or auto-apply. Findings are surfaced in the approval
      card and stored in the relevant encrypted or remote-local version record.
      PII/secret findings prevent auto-approval unless the user explicitly
      confirms the exact action.
    git_policy: >
      Git is strongly recommended before writes, deletes, and renames because it
      provides an additional recovery path and user-visible review. Git is not a
      hard requirement; OpenMates still must create its own undo/version record
      before applying an approved mutation.
  versioning:
    openmates_stored_files: >
      Uploaded or OpenMates-created text/code/markdown Project files use the
      existing encrypted embed diff/version model for edits and restore. Large
      snapshots, deleted binaries, and patch-ineligible blobs may be stored as
      encrypted S3 objects referenced by encrypted version metadata.
    remote_machine_journal:
      path: ~/.openmates/remote-cache/<source-id>/change-journal/
      storage_boundary: >
        The journal is stored on the machine running the bridge and outside the
        source root by default, so OpenMates does not mutate the repository with
        hidden state. Repo-local journals remain out of scope unless separately
        approved.
      required_fields:
        - journal_entry_id
        - project_id
        - source_id
        - approved_root_realpath_hash
        - canonical_path_realpath_hash
        - display_path
        - operation
        - timestamp
        - approval_receipt
        - pre_hash
        - post_hash
        - forward_patch_or_snapshot_ref
        - inverse_patch_or_snapshot_ref
        - deleted_file_snapshot_ref
        - binary_snapshot_ref
        - pii_scan_result
        - secret_scan_result
        - size_bytes_before
        - size_bytes_after
        - line_count_before
        - line_count_after
        - optional_git_branch
        - optional_git_commit_before
        - optional_git_status_before
      undo_behavior: >
        Undo verifies the current file hash against the journal's expected post
        hash before applying the inverse patch or restoring a snapshot. Hash
        mismatch, missing snapshot, outside-root path, or high-risk reversal
        requires explicit user review and cannot silently overwrite local changes.
  project_item_add_to_project:
    status: implemented_cli_sdk_first_slice
    canonical_storage: >
      Adding a chat, workflow, task, plan, or other OpenMates object to a Project
      stores the Project link in encrypted OpenMates records by default. A linked
      Git source does not automatically receive a file copy and no repo file is
      written unless the user chooses remote-machine storage during the add flow.
      Users should not need a generic export command; they add the object from its
      own namespace, such as chats, workflows, tasks, or plans.
    add_commands:
      - openmates chats <chat-id> add-to-project <project-id> [--folder <folder-id>] [--openmates-only|--repo-copy|--remote-cache-copy|--remote-copy]
      - openmates workflows <workflow-id> add-to-project <project-id> [--folder <folder-id>] [--openmates-only|--repo-copy|--remote-cache-copy|--remote-copy]
      - openmates plans <plan-id|short-id> add-to-project <project-id>
      - openmates tasks <task-id|short-id> add-to-project <project-id>
    remote_storage_prompt: >
      When adding an object to a Project that has a remote source and the object is
      meaningful as a repo/remote-machine file, CLI can ask whether to also
      store a copy on the remote machine. For chats, the prompt is required when
      the target is a remote-access Project because chats may contain private
      conversation content, tool results, file paths, secrets, or PII. The prompt
      must clearly recommend OpenMates-only storage unless the user explicitly
      wants a remote copy.
    git_inclusion_choice:
      choices:
        - save_only_in_openmates
        - store_on_remote_machine_and_include_in_git
        - store_local_only_on_remote_machine
      recommended_defaults:
        chat: save_only_in_openmates
        workflow: store_on_remote_machine_and_include_in_git_when_user_intends_team_or_repo_reuse
        plan: save_only_in_openmates
        task: save_only_in_openmates
      behavior: >
        If the user stores a copy in the repo, ask whether the file should be
        intended for Git tracking. For Git-tracked copies, create normal proposal
        diffs for the target file and avoid touching `.gitignore`. For local-only
        remote-machine copies, prefer storing outside the repo under
        `~/.openmates/remote-cache/<source-id>/exports/` so the repository is not
        mutated. If the user explicitly wants a local-only file inside the repo,
        propose a `.gitignore` diff for the chosen path and require separate
        high-risk approval before changing `.gitignore`. The prompt must remind
        users that Git-tracked chats in public/open-source repos can be visible to
        everyone with repo access and should usually be gitignored or kept in
        OpenMates only.
    default_paths:
      workflows_tracked: .openmates/workflows/<workflow-slug>.yml
      chats_tracked: docs/openmates/chats/<chat-slug>.md
      local_only_remote_cache: ~/.openmates/remote-cache/<source-id>/exports/<kind>/<slug>
    default_formats:
      workflow: yml
      chat: markdown_summary_or_redacted_markdown
    add_record_fields:
      - project_id
      - source_id
      - object_type
      - object_id
      - target_mode
      - target_path
      - git_tracking_intent
      - selected_by_user
      - pii_scan_result
      - secret_scan_result
      - base_hash
      - diff_or_create_file_patch
      - gitignore_diff_if_needed
      - approval_receipt
    privacy_behavior: >
      Remote-machine file proposals for chats, workflows, plans, and tasks run
      PII/secret scans before writing. Findings block auto-approval and must be
      shown in CLI output. Chat remote copies should default to a summarized or
      redacted Markdown transcript unless the user explicitly asks for the full
      conversation copy.
    implementation_notes:
      - CLI creates encrypted OpenMates Project item links for chats and workflows before returning optional non-mutating create-file proposal payloads.
      - npm SDK and pip SDK create encrypted OpenMates-only Project links for chats and workflows and do not expose remote-copy proposal payloads or source attachment APIs.
      - CLI currently supports chat Markdown and workflow YAML remote-copy proposals with writes_files=false; tasks and plans remain encrypted Project links only.
      - Proposal apply/write execution remains out of scope for V1.
  remote_diff_virtual_artifact:
    description: >
      A non-mutating diff artifact for an existing remote file. It is serialized
      inside the encrypted assistant message and rendered like an embed
      preview/fullscreen diff, but it does not create a normal OpenMates embed,
      Project database row, or write to the remote filesystem. If the user later
      uploads the file to OpenMates, future edits use normal embed diff history
      for that uploaded embed.
    fields:
      - project_ref
      - source_ref
      - remote_item_ref
      - display_path label
      - unified_diff
      - base_hash, mtime, and line_count metadata
      - local UI status such as proposed, stale, applied, rejected, or failed
  automated_code_checks:
    first_use_prompt:
      trigger: First assistant-created or assistant-updated code in a Project.
      choices:
        - Not now
        - Use isolated cloud sandbox
        - Use my remote machine
      behavior: >
        The prompt explains that isolated E2B checks avoid remote-machine
        performance impact but send relevant code/config to an OpenMates-managed
        sandbox, while remote-machine checks keep code on the user's machine but
        consume local CPU/disk. The chosen default is stored in Code app settings
        with a Project override.
    phases:
      - phase: non_executing_checks
        behavior: >
          Always allowed for proposed diffs: patch applies, base hash matches,
          high-risk file detection, path policy, and secret-like pattern scan.
      - phase: e2b_checks
        behavior: >
          Requires first-use or Project-level consent for private code because
          relevant code/config leaves the user's machine for an isolated sandbox.
      - phase: remote_machine_checks
        behavior: >
          Requires first-use or Project-level consent and runs only configured
          allowed check commands, not arbitrary assistant-generated shell.
  project_share_payload:
    description: >
      A read-only exported Project bundle that lets recipients decrypt selected
      encrypted Project metadata and Project-linked records without giving the
      backend the Project key. The decrypt authority comes from the share URL
      fragment key and optional password, following the existing chat/embed
      share-link contract. Existing Project/task/plan/embed keys are wrapped for
      this bundle by the share fragment key; sharing does not create new durable
      record keys or server-readable share wrappers. Runtime remote-source access
      is never included.
    includes:
      - project_id
      - encrypted_project_metadata
      - existing_project_key_wrapped_by_share_key
      - selected encrypted project item records
      - optional existing task, plan, and uploaded-embed keys wrapped by the share key for selected records
      - generated_at and duration_seconds
      - password_protected flag
    excludes:
      - URL fragment key or optional password sent to the backend
      - raw Project, task, plan, chat, or embed keys
      - decrypted Project metadata or file paths
      - CLI bridge credentials, connected-device identifiers, SSH/remotes, repo URLs, local paths, tokens, or source runtime grants
      - background sync, search/read permission, write permission, or command/test execution authority

contracts:
  cli:
    - command: openmates remote-access
      behavior: >
        Starts an authenticated foreground local bridge for the current working
        directory by default. The user may pass repeated `--path <path>` values to
        expose additional roots. The bridge can attach each approved source to an
        existing or new Project and choose session-only or persistent local bridge
        metadata. It prints redacted source status, root-scope warnings, cache and
        journal locations, terminal-multiplexer guidance, live connection state,
        and automatically detected instruction-audit recommendation, but never
        prints sensitive file content. The foreground process itself is the status;
        there is no target public `status`, `search`, `start`, or `stop` subcommand.
    - command: openmates remote-access --path <path> --path <path>
      behavior: >
        Starts the foreground bridge with multiple explicit approved roots. Each
        root is realpath-resolved and broad roots require explicit confirmation
        before the bridge accepts them.
    - command: openmates remote-access --skip-instruction-audit
      behavior: >
        Optional startup flag for users who explicitly want to skip the automatic
        recommended instruction-audit prompt for this session. Skipped state is
        stored in OpenMates metadata, not in the repo. Users should not need a
        separate command to analyze instructions; startup detects candidates and
        prompts automatically.
    - command: openmates chats <chat-id> add-to-project <project-id> [--folder <folder-id>] [--openmates-only|--repo-copy|--remote-cache-copy|--remote-copy]
      status: implemented_cli_sdk_first_slice
      behavior: >
        Adds a chat to a Project and optional Project folder in encrypted
        OpenMates storage. If the Project has a remote source, asks whether to also
        store a summarized/redacted or full chat copy on the remote machine and
        whether that file should be included in Git. It warns that Git-tracked
        chats in public/open-source repos may be visible to everyone.
    - command: openmates workflows <workflow-id> add-to-project <project-id> [--folder <folder-id>] [--openmates-only|--repo-copy|--remote-cache-copy|--remote-copy]
      status: implemented_cli_sdk_first_slice
      behavior: >
        Adds a workflow to a Project and optional folder in encrypted OpenMates
        storage. If the Project has a remote source, can ask whether to also store
        a YAML workflow file on the remote machine, with Git-tracking choice and
        concrete diff/create-file proposal.
    - command: openmates plans <plan-id|short-id> add-to-project <project-id>
      status: implemented_cli_sdk_first_slice
      behavior: >
        Links an existing plan to a Project. Plan data remains encrypted OpenMates
        storage by default; remote-machine file storage is out of scope for plans
        in the current slice.
    - command: openmates tasks <task-id|short-id> add-to-project <project-id>
      status: implemented_cli_sdk_first_slice
      behavior: >
        Links an existing task to a Project so it appears in the Project Kanban
        board. Tasks are operational board items and are not folder-organized by
        default.
  sdk:
    cleartext_contract: >
      Public npm and pip SDK Project-linking methods must not expose `encrypted_*`
      fields to users. SDK callers can list Projects and link OpenMates-owned
      chats, workflows, plans, and tasks to encrypted Projects, with encryption,
      decryption, key wrapping, and encrypted REST payload construction handled
      automatically inside the SDK/client layer. Remote bridge/source attachment,
      remote-copy proposal generation, and instruction-audit control remain CLI or
      later first-party client responsibilities, not SDK methods in this slice.
    methods:
      - method: projects.list(options)
        behavior: Returns Project records available to the authenticated user without creating or attaching sources.
      - method: chats.addToProject(chatId, projectId, options) / chats.add_to_project(chat_id, project_id, **options)
        status: implemented_cli_sdk_first_slice
        behavior: Adds a chat to a Project/folder as an encrypted OpenMates-only Project item and does not expose remote-copy options or proposal payloads.
      - method: workflows.addToProject(workflowId, projectId, options) / workflows.add_to_project(workflow_id, project_id, **options)
        status: implemented_cli_sdk_first_slice
        behavior: Adds a workflow to a Project/folder as an encrypted OpenMates-only Project item and does not expose remote-copy options or proposal payloads.
      - method: plans.addToProject(planId, projectId) / plans.add_to_project(plan_id, project_id)
        status: implemented_cli_sdk_first_slice
        behavior: Links a plan to a Project with encrypted storage handled internally.
      - method: tasks.addToProject(taskId, projectId, options) / tasks.add_to_project(task_id, project_id, **filters)
        status: implemented_cli_sdk_first_slice
        behavior: Links a task to a Project so it appears in Project task boards, with filters used only to resolve the task.
  api:
    - route: POST /v1/projects/{project_id}/sources
      request: "encrypted source metadata, source type, opaque source id, capabilities"
      response: "source id, status, created_at"
      errors:
        - 401 when unauthenticated.
        - 403 when the user cannot edit the Project.
        - 400 for unsupported source type or malformed encrypted metadata.
    - route: POST /v1/projects/context-grants
      request: "project id, source ids, mention type, requested access, encrypted grant metadata"
      response: "grant id, mode, expires_at, required user action"
      errors:
        - 401 when unauthenticated.
        - 403 when Project access is unavailable.
        - 409 when source is offline and no cached preview can satisfy the request.
    - route: POST /v1/projects/remote-previews
      request: "encrypted preview metadata and bounded encrypted snippet for a virtual remote item"
      response: "preview id, status"
      errors:
        - 401 when unauthenticated.
        - 403 when Project access is unavailable.
        - 413 when snippet or metadata exceeds preview caps.
    - route: PATCH /v1/projects/{project_id}/settings
      request: "encrypted Project permission settings, protected path patterns, automated check override"
      response: "project id, updated_at"
      errors:
        - 401 when unauthenticated.
        - 403 when the user cannot edit the Project.
        - 400 for unsupported write mode or unsafe permission weakening request.
    - route: POST /v1/projects/{project_id}/share-bundles
      request: "encrypted share payload metadata, selected project record ids, password_protected?, expires_at?"
      response: "share bundle id or short-link token; client appends URL fragment key locally"
      errors:
        - 401 when unauthenticated.
        - 403 when the user cannot view/share the Project.
        - 400 when selected records include remote-source runtime grants, plaintext paths, connected-device credentials, or unsupported execution permissions.
      notes:
        - The backend stores or serves only encrypted payloads and server-visible expiration metadata.
        - The URL fragment key, optional password, raw Project key, and decrypted Project fields are never sent to the backend.
    - route: POST /v1/projects/{project_id}/file-actions/proposals
      status: reserved_later_slice
      access_model: first-party client surface only
      request: "encrypted mutation proposal metadata or message-local virtual artifact reference; no plaintext paths or contents"
      response: "proposal id, required approval state, encrypted audit metadata"
      errors:
        - 401 when unauthenticated.
        - 403 when the user cannot edit the Project.
        - 400 when the proposal requests command execution, git mutation, unsupported chmod, or weakened root-boundary checks.
      notes:
        - File proposals are encrypted coordination records only; actual remote filesystem mutation is performed by the foreground CLI bridge after local root and approval validation.
        - The route must not accept raw decrypted file content, local private paths, CLI credentials, remote journal data, or command execution grants.
    - route: POST /v1/projects/{project_id}/description-sync/proposals
      status: reserved_later_slice
      access_model: first-party client surface only
      request: "encrypted README.md diff proposal metadata with base hash and source reference"
      response: "proposal id, approval state"
      errors:
        - 401 when unauthenticated.
        - 403 when the user cannot edit the Project.
        - 409 when README.md base hash is stale.
      notes:
        - Git-backed description writes are mediated as README.md diffs or README.md creation proposals and require explicit user approval before CLI bridge mutation.
  frontend:
    - surface: Projects page
      behavior: >
        Shows local Project items and attached remote sources in one Project
        browser. Remote files/folders render as virtual previews and show offline,
        stale, or permission-required states. Upload to OpenMates is available for
        selected files only in V1.
    - surface: chat composer mentions
      behavior: >
        Adds Project, folder, and file mention types without breaking existing
        model, mate, skill, focus, memory, settings, and embed mentions. Mentions
        serialize into backend-parseable tokens and a client-decrypted context
        payload similar to settings/memory mention payloads.
    - surface: Settings > Privacy & Security > Assistant actions
      behavior: >
        Shows global defaults for assistant action autonomy, including default
        Project write mode for new Projects and global protected path patterns.
    - surface: Settings > Projects > <project name>
      behavior: >
        Shows Project-specific permission mode, protected paths, connected remote
        sources, automated Code check override, audit history, revocation, and
        source status. Project page gear links here.
    - surface: Settings > Apps > Code > Automated checks
      behavior: >
        Shows global automated-check defaults and first-use prompt behavior for
        assistant code creation or updates.
    - surface: Project page > Rules
      behavior: >
        Shows AGENTS.md, CLAUDE.md, .cursor/rules, and user-created instruction
        files as Rules cards in the Project browser. Opening a card shows the
        original AI Instruction text plus extracted Checks and Workflow
        suggestions, with review/activation controls for anything not already a
        built-in OpenMates safety default.
    - surface: Repository connection instruction audit
      status: later_web_expansion_memory
      behavior: >
        During repo connection or from the Project Rules section, checks for
        missing instruction files, shows billable audit cost/credit disclosure,
        imports accepted explicit repo-local linked instruction documents, displays
        separate contradiction and length/cost findings, and offers concrete
        rewrite suggestions as selected checkbox bullet points. Each bullet can
        expand to show the full suggestion and diff. Clicking Apply applies the
        already-generated diffs from the audit JSON/tool output rather than making
        another LLM request. If the user declines, show a clear quality/cost
        warning. The loading state title should be "Checking agent instructions..."
        with smaller explanatory text such as "Local AGENTS.md, CLAUDE.md, and
        similar files are checked together with linked repository documents to
        detect conflicts and evaluate length." This UI detail is recorded for later
        web expansion; current implementation focus is CLI and SDK.
    - surface: Project description editor
      behavior: >
        For Git-backed Projects, shows README.md as the synced description source
        and turns edits into an explicit README.md diff or creation proposal. The
        user can review the diff, PII/secret findings, base hash, and undo status
        before approving the bridge write.
    - surface: Project file action approval cards
      behavior: >
        Shows create/update/delete/rename/undo proposals with path, operation,
        root, PII/secret scan, high-risk classification, base hash, patch size,
        Git recommendation/status, and undo availability before applying or
        rejecting the action.
    - surface: Add resource to Project with optional remote copy
      status: later_web_expansion_memory
      behavior: >
        When a chat, workflow, plan, or task is added to a Project, later web UI can
        offer folder placement for chats/workflows/plans and show Project task-board
        placement for tasks. For remote-access Projects, it can ask whether to also
        store a remote-machine copy and whether that copy should be intended for Git
        tracking. The default remains encrypted OpenMates-only storage, especially
        for chats. This UI detail is recorded for later web expansion; current
        implementation focus is CLI and SDK.
  assistant_context:
    - name: project_map
      behavior: Bounded structure and ranking context for a Project or folder mention.
    - name: remote_search_results
      behavior: "rg search matches with file path labels, line numbers, surrounding snippets, and omitted-result counts."
    - name: remote_file_preview
      behavior: Bounded preview snippets matching existing embed preview line/count behavior rather than a hardcoded line count.
    - name: uploaded_remote_embed
      behavior: Normal encrypted OpenMates embed created only after explicit Upload to OpenMates for selected files.
    - name: remote_diff_virtual_artifact
      behavior: Non-mutating unified diff proposal for an existing remote file, stored inside the encrypted assistant message, rendered like an embed preview/fullscreen diff, and never applied to the remote filesystem in V1.
    - name: project_rules_context
      behavior: Active AI Instructions and summaries of active Checks/Workflow links for the referenced Project/folder/source, bounded and loaded into assistant context whenever that Project context is granted.
    - name: project_instruction_audit_context
      behavior: Source-linked contradiction and length/cost findings for imported and linked AI Instructions; suggestions are advisory until the user approves a rewrite or Check activation.
    - name: readme_description_sync_context
      behavior: Git-backed Project description context references README.md base hash and approved snippets only; description edits are represented as README.md diff proposals.
    - name: project_file_action_proposal
      behavior: Reserved later-slice encrypted proposal for approved file create/update/delete/rename/undo, including deterministic safety results and never including shell command execution authority.
  privacy_security:
    - Backend stores remote-source metadata, preview metadata, and Project item metadata only as encrypted blobs or opaque hashes.
    - Raw private paths, file contents, git remotes, environment variable values, and ignored file contents are not logged or sent to the LLM by default.
    - Secret-like files and ignored files require explicit user selection or approval before preview, upload, or assistant read.
    - Repo-local cache and `.gitignore` edits require explicit approval and must be reversible.
    - Project grants are scoped by Project/source/item, access kind, chat or turn duration, caps, and privacy mode.
    - Repo-local permission config may add restrictions and suggestions but cannot silently grant write permission, command execution, or weaken user/global settings.
    - Automated E2B checks for private Project code require explicit first-use or Project-level consent because relevant code/config leaves the user's machine.
    - LLM-extracted Checks and Workflow suggestions from instruction files require user review before activation and cannot weaken built-in OpenMates safety checks.
    - Prebuilt Checks may add restrictions, warnings, approvals, or required verification, but arbitrary user-authored scripts are not executed as Checks in V1.
    - Instruction audit linked-document discovery resolves only approved-root local files by realpath; outside-root links, remote URLs, binaries, and oversized files require separate user review before inclusion.
    - Billable instruction audits must disclose credit or metered model-call impact before running and should not be presented as free background indexing.
    - Remote bridge file operations must use realpath-resolved approved roots; symlink escapes and path traversal outside roots are denied unless the local user approves an exact outside-root path exception.
    - Remote mutation journals stay on the bridge machine under `~/.openmates/remote-cache/<source-id>/change-journal/` and are not uploaded to OpenMates unless the user explicitly exports or shares encrypted evidence.
    - PII/secret scan results are shown before approval and stored only in encrypted OpenMates metadata for uploaded files or local remote-machine journals for remote files.
    - Adding chats/workflows/plans/tasks to OpenMates Projects is encrypted OpenMates storage by default; remote-machine file copies for linked repos require explicit user choice, PII/secret scan results, and a separate Git-tracking intent.
    - Local-only remote copies should prefer the remote cache outside the repo. If the user chooses a local-only file inside the repo, `.gitignore` changes require a separate high-risk approval.

scenarios:
  - id: S-1
    title: User attaches a remote repository to a Project
    given:
      - Alice is logged into OpenMates CLI.
      - Alice has a local or remote repository reachable from the machine running CLI.
    when:
      - Alice runs `openmates remote-access` and chooses the repository.
      - Alice attaches it to an existing Project or creates a new Project.
    then:
      - OpenMates stores encrypted source metadata linked to the Project.
      - The CLI initializes default cache storage under `~/.openmates/remote-cache/<source-id>/`.
      - No repository files are uploaded to OpenMates automatically.
      - The Projects UI shows the source as connected and browseable when the bridge is online.

  - id: S-2
    title: User previews remote files and uploads selected files only
    given:
      - Alice has a Project with a connected remote source.
    when:
      - Alice browses the source in Projects and opens a file preview.
      - Alice selects two files and chooses Upload to OpenMates.
    then:
      - The file preview renders through the existing embed preview/fullscreen system as a virtual remote preview.
      - The preview snippet follows the current embed preview line/count policy and includes line count, language, size, hash, and mtime metadata.
      - Only the two selected files are uploaded and converted into encrypted OpenMates embeds.
      - Other remote files remain virtual and are not copied to OpenMates storage.

  - id: S-3
    title: User mentions a Project and assistant receives bounded context
    given:
      - Alice has a Project with an attached repository source.
      - Alice's project-data privacy mode is Allow for mentions.
    when:
      - Alice asks a chat question that mentions the Project.
    then:
      - The client treats the Project mention as consent for bounded project map access for the current chat.
      - The CLI bridge computes a capped Project map using file counts, folder counts, line counts, depth-limited tree, git status, recent and dirty files, ranked symbols, and omitted summaries.
      - The assistant receives the Project map, not a raw recursive tree or full file contents.
      - Broader reads and searches stay within configured caps and Project boundaries.

  - id: S-4
    title: Always ask blocks project reads until approval
    given:
      - Alice has set project-data access to Always ask.
      - Alice mentions a Project in chat.
    when:
      - The assistant needs a Project map, search, or file preview.
    then:
      - OpenMates creates a permission prompt before sending Project data to the assistant.
      - The prompt explains the source, access kind, duration, and approximate data volume.
      - If Alice rejects the request, no Project map, search result, or file preview is sent to the assistant.
      - If Alice approves, the grant is scoped to the approved Project/source/access kind and duration.

  - id: S-5
    title: User mentions a specific remote file for current message access
    given:
      - Alice has a connected remote source in a Project.
      - Alice mentions one specific remote file in a chat message.
    when:
      - The assistant needs to answer using that file.
    then:
      - OpenMates grants access to the specific file for the current message only, unless privacy settings require approval.
      - The assistant receives a bounded remote file preview or a capped read result, not unlimited file content.
      - Follow-up turns require another file mention or an existing broader Project/folder grant.

  - id: S-6
    title: Assistant searches a mentioned Project through the CLI bridge
    given:
      - Alice has mentioned a Project and the bridge is online.
      - The Project grant allows bounded search.
    when:
      - The assistant needs to find references to a symbol or phrase.
    then:
      - The bridge runs `rg` within approved source roots and returns capped matches with file labels, line numbers, snippets, and omitted-result counts.
      - Ignored files, secret-like files, binary files, and paths outside the approved source are excluded unless explicitly approved.
      - The backend never performs plaintext filesystem search and never sees decrypted Project metadata beyond client-provided approved context.

  - id: S-7
    title: Offline source degrades without leaking data
    given:
      - Alice has a Project with a previously connected remote source.
      - The CLI bridge is offline.
    when:
      - Alice opens the Project or mentions it in chat.
    then:
      - The UI shows the source as offline and can show only locally available encrypted/stale preview metadata allowed by policy.
      - Assistant search/read operations fail with an actionable source-offline message instead of silently falling back to stale broad context.
      - No backend job attempts to read the remote source directly.

  - id: S-8
    title: Assistant creates message-local remote diff proposals
    given:
      - Alice has attached a repository source to a Project.
    when:
      - Alice asks the assistant to edit an existing remote file in that source.
    then:
      - The assistant outputs a unified diff targeting the remote file reference.
      - OpenMates serializes the remote diff proposal inside the encrypted assistant message and renders it through embed-like preview/fullscreen diff UI.
      - The proposal is not stored as a normal OpenMates embed or a separate Project database row unless Alice explicitly saves or uploads it.
      - No remote file is modified and no shell command is executed.
      - If Alice asks to apply the patch, V1 explains that applying remote diffs is a later-phase capability.

  - id: S-9
    title: First write intent asks for Project write mode
    given:
      - Alice has a new remote Project with no write-mode setting.
      - Alice mentions a folder in chat and asks the assistant to update files in that folder.
    when:
      - The assistant proposes the first remote file edit for that Project.
    then:
      - OpenMates asks whether the Project should use Always ask before writes or Auto approve safe writes.
      - Always ask before writes is the recommended default.
      - The choice is stored under Settings > Projects > project name and can inherit from Settings > Privacy & Security > Assistant actions for future Projects.
      - The Project page gear links to the same settings page.

  - id: S-10
    title: Mention chip exposes Read and Read & Write access
    given:
      - Alice has a remote Project in Auto approve safe writes mode.
    when:
      - Alice mentions a Project, folder, or file in the chat composer.
    then:
      - The mention/access chip defaults to Read & Write except protected files.
      - Alice can toggle the chip to Read, or back to Read & Write, using visible controls and keyboard navigation.
      - Built-in high-risk files and user-protected paths still require explicit write approval before later-phase apply.
      - If the Project mode is Always ask before writes, the same chip defaults to Read.

  - id: S-11
    title: High-risk files require explicit approval by default
    given:
      - Alice's Project is in Auto approve safe writes mode.
      - The assistant proposes edits to src/App.svelte, Caddyfile, .env.example, .gitignore, and package.json.
    when:
      - OpenMates classifies the proposed remote diff bundle.
    then:
      - src/App.svelte can be considered safe if it passes path, hash, patch-size, and secret-scan checks.
      - Caddyfile, .env.example, .gitignore, and package.json are marked high-risk and require explicit approval before any later-phase apply.
      - Files matched by .gitignore, binary edits, deletes, renames, symlink target edits, chmod changes, and paths outside the approved source root cannot be auto-applied.
      - User-defined global and Project-specific protected patterns add more always-ask paths.

  - id: S-12
    title: User chooses automated checks after assistant code changes
    given:
      - Alice has a remote Project and the assistant has created or updated code for the first time in that Project.
    when:
      - OpenMates asks whether to run automated checks after assistant code changes.
    then:
      - Alice can choose Not now, Use isolated cloud sandbox, or Use my remote machine.
      - The prompt explains the privacy and performance tradeoff for E2B versus remote-machine checks.
      - The selection is stored in Settings > Apps > Code with a Project-specific override under Settings > Projects > project name.
      - Non-executing diff checks can run without extra consent, while E2B checks and remote-machine check commands follow the selected consent mode.

  - id: S-13
    title: User shares a read-only Project bundle without remote-source runtime access
    given:
      - Alice owns an encrypted Project with uploaded embeds, linked tasks, linked plans, and an attached remote source.
      - Alice chooses to share Project metadata and selected Project records with optional password protection.
    when:
      - OpenMates creates the Project share link.
      - Bob opens the link.
    then:
      - Bob can decrypt only the selected encrypted Project metadata and selected records using existing Project/task/plan/embed keys wrapped by key material from the URL fragment and optional password.
      - Bob receives read-only Project context, not owner/edit access.
      - The backend never receives the URL fragment key, optional password, raw existing Project key, raw linked record keys, or decrypted Project fields.
      - Remote-source runtime access is excluded: Bob cannot use Alice's CLI bridge, local paths, repository remotes, source grants, search/read permissions, write permissions, check commands, tokens, or connected-device credentials.
      - Existing chat and embed share links continue to work without format changes.

  - id: S-14
    title: Project rules import instructions and activate reviewed checks
    given:
      - Alice attaches a repository source that contains AGENTS.md and CLAUDE.md.
      - AGENTS.md says "Never edit .env files", "Keep files under 500 lines", "Run backend tests after backend changes", and "Prefer simple solutions".
    when:
      - OpenMates scans the source metadata and opens the Project Rules section.
      - OpenMates processes the imported instruction files.
    then:
      - AGENTS.md and CLAUDE.md appear as Rules cards in the Project browser and open in the fullscreen Rules view.
      - The full original instruction text remains available as AI Instructions and is loaded when Alice references the Project, folder, or source in chat.
      - OpenMates suggests a protected_paths Check for .env files and a max_file_lines Check with limit 500, each linked back to the original text.
      - OpenMates suggests a Workflow or required_checks draft for running backend tests after backend changes, depending on whether the action can be represented by the prebuilt Checks registry.
      - The instruction "Prefer simple solutions" remains AI-only because it cannot be enforced deterministically.
      - Alice must review and activate suggested Checks or Workflow drafts before they enforce or run.
      - Built-in OpenMates safety checks, such as high-risk file protection and secret-like file handling, are visible in the same Rules UI as active system checks.

  - id: S-15
    title: User starts foreground remote access with narrow roots
    given:
      - Alice is SSHed into a development machine in `/srv/app`.
      - Alice wants OpenMates to browse only that repository while she keeps the SSH session open.
    when:
      - Alice runs `openmates remote-access` from `/srv/app`.
    then:
      - The CLI starts a foreground bridge scoped to the realpath of `/srv/app`.
      - The CLI explains that access stops when the command, shell, SSH session, or terminal multiplexer exits.
      - The CLI recommends zellij, tmux, or screen if Alice wants the foreground process to persist across SSH reconnects.
      - The CLI does not expose `$HOME`, `/srv`, or `/` unless Alice explicitly passes and confirms those roots.

  - id: S-16
    title: Broad and outside-root access requires local confirmation
    given:
      - Alice starts the bridge with `openmates remote-access --path $HOME`.
      - A symlink inside `$HOME/project` points to `/etc`.
    when:
      - The assistant requests `/etc/hosts` through the symlink or asks to broaden access to `/etc`.
    then:
      - The CLI shows a strong broad-root warning before accepting `$HOME`.
      - Every requested path is compared by realpath against approved roots.
      - Symlink traversal outside the approved root is blocked by default.
      - Access to `/etc/hosts` requires an exact local prompt on the bridge machine and cannot be broadened remotely by the assistant or backend.

  - id: S-17
    title: Git-backed Project description syncs through README proposal
    given:
      - Alice has a Git-backed Project whose root contains README.md.
      - Alice edits the Project description in OpenMates.
    when:
      - OpenMates prepares the description update.
    then:
      - The UI shows a README.md diff proposal with base hash, PII/secret scan results, and undo availability.
      - Alice must approve the diff before the bridge writes README.md.
      - If README.md is missing, OpenMates proposes creating README.md instead of silently storing the text only as a Git-backed description.
      - If README.md changed since preview, the write is blocked as stale and Alice must review a refreshed diff.

  - id: S-18
    title: Approved remote file mutation creates local undo journal
    given:
      - Alice has a connected remote Project source with no Git repository.
      - Alice approves an assistant proposal to update `docs/api.md`.
    when:
      - The foreground CLI bridge applies the text patch.
    then:
      - The bridge verifies the file is inside an approved realpath root and that the base hash matches.
      - The bridge scans the proposed patch for PII and secret-like data before applying.
      - The bridge writes a journal record under `~/.openmates/remote-cache/<source-id>/change-journal/` before or atomically with the mutation.
      - The journal includes approval receipt, pre/post hashes, forward and inverse patches, PII/secret scan result, path metadata, size/line counts, and optional Git metadata when available.
      - Undo verifies the current post hash before applying the inverse patch and refuses to silently overwrite unrelated local edits.

  - id: S-19
    title: OpenMates-stored Project file edits use encrypted embed versions
    given:
      - Alice uploaded `notes.md` from a Project source into OpenMates as an encrypted embed.
      - Alice later asks the assistant to update that uploaded file inside OpenMates.
    when:
      - OpenMates stores the approved edit.
    then:
      - The edit uses the existing encrypted embed diff/version path for text/code/markdown files.
      - Deleted binaries, large snapshots, or patch-ineligible blobs are stored as encrypted S3-backed snapshot references when needed.
      - Restore/undo uses encrypted version metadata and does not require the original remote source to be online.

  - id: S-20
    title: Repository connection audits missing, linked, long, and contradictory instructions
    given:
      - Alice connects a repository to a Project.
      - The repository contains AGENTS.md that links to `docs/assistant-rules.md` and `.cursor/rules/style.md`.
      - The repository also contains `frontend/AGENTS.md`, `backend/AGENTS.md`, and many package-level instruction files.
    when:
      - OpenMates recommends the repository instruction audit and asks Alice for permission after showing the billable credit/model-call disclosure.
      - Alice approves the audit.
    then:
      - The UI shows "Checking agent instructions..." with smaller explanatory text that local AGENTS.md, CLAUDE.md, and similar files are checked together with linked repository documents to detect conflicts and evaluate length.
      - If Alice skips the audit, the skipped/not-run state is stored in OpenMates metadata under the remote cache or encrypted Project/source metadata, not as a marker file inside the repository.
      - If no supported instruction file exists, OpenMates suggests creating an agent instruction file instead of silently proceeding with no Project Rules.
      - Existing AGENTS.md is imported as an AI Instruction Rules card.
      - Nested instruction files are grouped by folder scope, with root and relevant nested scopes selected by default up to a visible size/cost cap.
      - If the repo has more scopes than the cap, OpenMates shows how many were omitted from the default selection and lets Alice expand/select more before approving billable analysis.
      - The explicitly linked repo-local instruction files are resolved inside approved roots, capped, and marked as linked AI Instructions.
      - Inferred references, external URLs, and files outside the connected repository are excluded by default unless the user separately reviews and approves them.
      - OpenMates runs one contradiction-check prompt and one separate length/cost-check prompt.
      - The findings name source files/spans, explain expected quality or cost impact, and suggest rewrites or merges.
      - Each improvement suggestion includes a selected-by-default flag, short bullet summary, expandable description, affected paths, base hashes, and concrete diff/create-file patch.
      - Applying selected suggestions uses the stored diffs from the audit result without making another LLM request.
      - Applying a rewrite follows Project write policy; declining a rewrite leaves the original instructions active but warns that quality may be worse and model/context costs may be higher.

  - id: S-21
    title: Chats, workflows, plans, and tasks are added to Projects from their own commands
    given:
      - Alice has a Project linked to a Git repository source.
      - Alice has an existing workflow, chat, plan, and task in OpenMates.
    when:
      - Alice runs resource-specific add commands such as `openmates workflows <workflow-id> add-to-project <project-id> --folder Automation` and `openmates chats <chat-id> add-to-project <project-id> --folder Research`.
    then:
      - Each object is linked to the Project in encrypted OpenMates storage without requiring a generic Project export command.
      - Workflows, plans, and chats can be placed in Project folders or subfolders; tasks link to the Project task board and are not folder-organized by default.
      - If the Project has remote access, adding a chat asks whether to also store a summarized/redacted or full chat copy on the remote machine.
      - If Alice chooses remote-machine chat storage, OpenMates asks whether the file should be included in Git and warns that Git-tracked chats in public/open-source repos may be visible to everyone.
      - OpenMates recommends keeping chats OpenMates-only or using a gitignored/local-only remote copy unless Alice explicitly wants repo-visible chat content.
      - Workflow remote-machine storage, when chosen, defaults to YAML and can propose `.openmates/workflows/<workflow-slug>.yml` when Alice wants repo/team reuse.
      - Local-only remote copies default to `~/.openmates/remote-cache/<source-id>/exports/` outside the repo.
      - If Alice explicitly chooses a local-only file inside the repo, OpenMates proposes a separate `.gitignore` diff for that path and treats the `.gitignore` change as high-risk.
      - Remote-machine storage proposals include PII/secret scan results, target path, Git tracking intent, base hash, and concrete create-file/diff content before any bridge write.

  - id: S-22
    title: Remote access recommends Projects from folder structure only once
    given:
      - Alice runs `openmates remote-access` inside `/work/projects`.
      - "`/work/projects` contains child Git repos `client-app`, `marketing-site`, and `docs-site`."
      - No OpenMates processed-root metadata exists for this parent folder or child repos.
    when:
      - The CLI scans the approved root before starting billable audits or Project creation.
    then:
      - The CLI recommends using `/work/projects` as a dedicated Projects parent folder.
      - The approved root appears as one preserved browsable source tree with `client-app`, `marketing-site`, and `docs-site` shown under it.
      - Git repo boundaries and Project recommendations appear as badges/overlays on the source tree rather than replacing the tree.
      - The CLI suggests one Project per child repo by default and offers grouping related repos into one Project.
      - Before creation, Alice sees a keyboard-navigable candidate list where she can use up/down to move, Space to select/unselect, rename candidates, group folders, or cancel.
      - Alice can choose Create selected Projects, Attach selected folders to existing Projects, Browse only / Run local-only, or Cancel.
      - The final confirmation prints the exact count and names of Projects to create.
      - No Project is created silently.
      - After Alice chooses, OpenMates stores processed-root metadata in the remote cache by default, or in one approved `.openmates/metadata.json` at `/work/projects` if Alice explicitly approves workspace-local metadata.
      - OpenMates does not also create duplicate `.openmates` metadata folders in every child repo when the parent metadata tracks them.
      - If Alice later runs `openmates remote-access` inside a single child repo with existing metadata, the CLI shows the existing Project/source association and offers refresh, reconnect, or re-run audits instead of recommending duplicate Project creation.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: CLI `openmates remote-access` can attach a folder or repository source to an encrypted Project without uploading repository files by default, with no `start` compatibility alias in the target CLI.
  - id: AC-2
    scenario: S-2
    text: Projects UI can browse and preview remote files as virtual embed-compatible previews, and Upload to OpenMates creates encrypted embeds only for selected files.
  - id: AC-3
    scenario: S-3
    text: Project mentions provide bounded assistant context maps with counts, git/recency signals, ranked symbols, and omitted summaries instead of raw trees or full contents.
  - id: AC-4
    scenario: S-4
    text: The project-data Always ask privacy mode prevents any assistant project map, search result, or file preview from being sent before explicit approval.
  - id: AC-5
    scenario: S-5
    text: Specific remote file mentions grant current-message-only capped file access unless the user's privacy setting requires approval.
  - id: AC-6
    scenario: S-6
    text: Assistant search uses a bounded CLI bridge `rg` workflow inside approved source roots and excludes ignored, secret-like, binary, and out-of-scope paths by default.
  - id: AC-7
    scenario: S-7
    text: Offline remote sources show explicit offline/stale states and do not trigger backend plaintext source access or silent stale broad-context fallback.
  - id: AC-8
    scenario: S-8
    text: V1 can create non-mutating remote diff proposals for existing remote files as message-local virtual artifacts, rendered through embed-like diff UI, without modifying remote sources or creating real embeds or Project rows by default.
  - id: AC-9
    scenario: S-9
    text: First remote write intent for a Project asks the user to choose Always ask before writes or Auto approve safe writes, storing the choice in Project settings with global defaults under Privacy & Security.
  - id: AC-10
    scenario: S-10
    text: Project, folder, and file mention chips expose a keyboard-accessible Read / Read & Write switch whose default follows the Project write mode while preserving protected-file restrictions.
  - id: AC-11
    scenario: S-11
    text: Built-in and user-defined high-risk files, gitignored files, binary edits, deletes, renames, chmod changes, symlink target edits, and out-of-root paths cannot be auto-applied by default.
  - id: AC-12
    scenario: S-12
    text: Automated code checks are governed by Code app settings with Project overrides and a first-use prompt that distinguishes E2B sandbox checks from remote-machine checks.
  - id: AC-13
    scenario: S-13
    text: Project sharing wraps existing Project/task/plan/embed keys with URL-fragment key material for read-only selected encrypted Project data and never shares remote-source runtime access, new durable record keys, durable share wrappers, or server-readable raw keys.
  - id: AC-14
    scenario: S-14
    text: Project Rules import AGENTS.md, CLAUDE.md, and similar files as AI Instructions, propose only prebuilt parameterized Checks or Workflow drafts from enforceable text, require user review before activation, and show built-in OpenMates safety checks in the same Rules UI.
  - id: AC-15
    scenario: S-15
    text: "`openmates remote-access` is the only target foreground bridge command, defaults to the current working directory, shows live status while running, gives terminal-multiplexer guidance, automatically prompts for recommended instruction audit when relevant, and does not install or start a hidden daemon."
  - id: AC-16
    scenario: S-16
    text: Remote access roots are realpath-resolved, multi-root access requires explicit `--path` values, broad roots show strong warnings, and symlink/outside-root access requires exact local approval that cannot be broadened remotely.
  - id: AC-17
    scenario: S-17
    text: Git-backed Project descriptions use root README.md as the source of truth, with description edits represented as approved README.md diff or creation proposals guarded by base-hash and PII/secret checks.
  - id: AC-18
    scenario: S-18
    text: Approved remote file create/update/delete/rename/undo operations are reserved for a later slice but must use approved-root enforcement, PII/secret checks, approval receipts, and a remote-machine undo journal independent of Git.
  - id: AC-19
    scenario: S-19
    text: Uploaded or OpenMates-created Project files use existing encrypted embed diff/versioning for text/code/markdown edits, with encrypted S3 snapshot references for large, binary, deleted, or patch-ineligible data.
  - id: AC-20
    scenario: S-20
    text: Repository connection instruction audit is recommended but permission-gated before billable work, stores skipped/not-run state in OpenMates metadata outside the repo, detects missing and nested instruction files, shows grouped scope selection with a visible size/cost cap, shows clear "Checking agent instructions..." copy, imports only explicit repo-local linked instruction documents by default, runs separate contradiction and length/cost prompts, returns selected-by-default rewrite suggestions with summaries, descriptions, and concrete diffs, applies accepted diffs without another LLM request, and warns when declined rewrites may reduce quality or increase cost.
  - id: AC-21
    scenario: S-21
    text: Chats, workflows, plans, and tasks are added to Projects through their own resource-specific add-to-project commands or SDK methods, store encrypted OpenMates Project links by default, support Project folder placement for CLI and SDK chat/workflow links while tasks appear in Project Kanban boards, keep SDK links OpenMates-only without remote-copy proposal APIs, ask about optional remote-machine storage only in the CLI remote-access flow, require a separate Git-tracking decision and public-repo visibility warning for CLI chat copies, use YAML by default for CLI workflow remote copies, include PII/secret scan results and concrete diffs/create-file patches before remote writes, default local-only remote copies to remote cache, and require separate high-risk approval for any `.gitignore` mutation.
  - id: AC-22
    scenario: S-22
    text: Remote-access startup preserves the approved root as one browsable source tree, inspects common folder structures, recommends Project creation only when processed-root metadata does not show prior handling, shows Project candidates as editable overlays on the tree, supports keyboard selection/unselection, renaming, grouping, browse-only/local-only, and cancel before creation, prints a final exact confirmation, never creates Projects silently, stores metadata in remote cache by default, creates local `.openmates/metadata.json` only after explicit approval at the parent Projects folder or single Project root, and avoids duplicate child-repo metadata when parent metadata tracks them.

