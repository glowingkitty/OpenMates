schema_version: 2
profile: concise
id: vscode-extension
title: VS Code extension (the open folder as the Project's connected machine)
status: draft

# Draft awaiting owner approval (TASK-3700, 2026-11-14). Nothing here is to be
# implemented until the owner approves it. Research, options and costs:
# docs/plans/vscode-extension/research.md.

goal: >
  Bring OpenMates into VS Code and its forks without a second code path. Phase 1
  makes the open folder a Project's connected machine (agentic coding Flow 2):
  the extension starts the native OpenMates binary as the source host, signs in
  by pairing, and shows each chat's worktree changes in the native diff editor
  with Land and Discard. Phase 2 adds a chat panel with the current Project's
  chats from the bundled web app.

decisions:
  - Option C (workspace as connected machine) first; a slim webview chat panel (reduced option A) second; no separate native chat UI (option B).
  - The extension spawns the native openmates binary; it does not link the core through napi or wasm and does not reuse the TypeScript CLI.
  - Credentials live in the binary's passphrase vault in extension storage; only the passphrase is in SecretStorage.
  - Old extension code (removed in 1051560ef4) is copied selectively (test harness, CSP builder, bridge checks), not reverted.
  - Public release only after Projects is enabled in production; dev publishes pre-release VSIX files.

dependencies:
  - id: D-1
    owner: Rust migration chat (client-core plan TASK-4)
    need: Public native openmates binary builds for linux-x64, linux-arm64, darwin-x64, darwin-arm64 and win32-x64.
  - id: D-2
    owner: Agentic coding chat (native-agentic-coding-readiness R-packages)
    need: --enable-commands supported in the Rust remote-access host. Phase 1 may ship without it.
  - id: D-3
    owner: This plan (Rust CLI change, agreed with the agentic coding chat)
    need: A JSON-lines status stream for remote-access (connected, offline, revoked, per-request events, chat worktree list) and refusal of a second live host for the same source.
  - id: D-4
    owner: Agentic coding chat
    need: Flow 2 acceptance run A2 green on dev.

phases:
  - id: P0
    title: Contracts
    tasks:
      - Add the remote-access JSON status stream and second-host refusal to the Rust CLI (D-3), with Rust tests.
      - Add a vscode surface to the Specification schema and specifications/features.yml.
  - id: P1
    title: MVP, connected machine
    tasks:
      - Extension skeleton under frontend/apps/vscode_extension (extensionKind workspace), CI workflow from the old one, platform VSIX build bundling the binary.
      - Pair login, vault passphrase in SecretStorage, sign out and revocation handling.
      - Connect and disconnect folders, status bar, Output channel, Open chat in browser.
      - Chat changes tree with native diff against the target branch.
      - E2B UI test template (openmates-ci-runner plus pinned VS Code, wdio-vscode-service, ffmpeg x11grab recording).
  - id: P2
    title: v1, review and reach
    tasks:
      - Land and Discard through the existing git land operation; multi-root workspaces; SSH, WSL and container windows.
      - Commands when D-2 is ready, with the macOS sandbox gate.
      - Publishing to the Microsoft Marketplace and Open VSX (pre-release from dev, stable from main after Projects is on in production).
  - id: P3
    title: Chat panel
    tasks:
      - Webview panel with the bundled Project chat, pair-only, file actions routed through the connected-machine host.
      - Resolve the webview Origin with the backend auth owners before building (security review).
      - Screenshot comparison of panel components against /dev/preview pages.

checks:
  required:
    - Rust unit tests for the status stream and second-host refusal (P0).
    - Extension unit tests (node test) for status parsing, vault passphrase handling and diff mapping.
    - "Real-stack E2E on E2B: web approves pairing, extension connects a test Project folder, a web chat edits a file, the change shows in the Chat changes view and diff, Land puts it on the branch; screenshots and a recorded video uploaded with ci_evidence.py."
    - Installed-VSIX smoke in VS Code and VSCodium builds.
    - "P3 only: panel component screenshots compared with /dev/preview pages at fixed width and theme."

effort:
  mvp: About 8 to 10 agent-days (P0 and P1), after D-1.
  v1: About 10 to 12 more agent-days (P2 and P3); the chat panel is about half.
  test_cost: About 0.06 USD per 10-minute E2B run on 4 vCPU and 8 GiB.

open_questions:
  - Start with VS Code as the connected machine and add the chat panel later?
  - Chat panel later shows only the Project's chats, not the whole app?
  - Sign in only by pairing?
  - VS Code as its own revocable device, separate from the terminal CLI?
  - Landing on the branch always needs a click?
  - Ship the first version without running commands if the Rust host is not ready?
  - Publish to both stores at v1, pre-release files from dev until then?

approval_provenance:
  source: Draft from the owner's research request via the authenticated dev connector, 2026-11-14 (TASK-3700).
  note: Not approved. Implementation starts only after explicit owner approval.
