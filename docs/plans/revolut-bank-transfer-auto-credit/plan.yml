scenarios:
  - id: S-1
    title: Exact payment credits personal pack
    given:
      - Alice starts a 54,000 credit personal bank-transfer order for EUR 50.00.
      - Revolut sends a completed EUR 50.00 TransactionCreated webhook with Alice's OM reference.
    when:
      - OpenMates processes the webhook.
    then:
      - Alice receives exactly 54,000 credits.
      - The order status becomes completed.
      - The invoice email task is queued as today.
  - id: S-2
    title: Overpayment credits selected pack and emails support instruction
    given:
      - Alice starts a 54,000 credit personal bank-transfer order for EUR 50.00.
      - Revolut sends a completed EUR 70.00 webhook with Alice's OM reference.
    when:
      - OpenMates processes the webhook.
    then:
      - Alice receives exactly 54,000 credits, not a larger pack.
      - The order status becomes completed.
      - The order stores received EUR 70.00 and overpaid EUR 20.00.
      - Alice receives an email asking her to contact support@openmates.org about the surplus.
  - id: S-3
    title: Underpayment waits for remaining transfer
    given:
      - Alice starts a 54,000 credit personal bank-transfer order for EUR 50.00.
      - Revolut sends a completed EUR 45.00 webhook with Alice's OM reference.
    when:
      - OpenMates processes the webhook.
    then:
      - Alice receives no credits yet.
      - The order remains pending.
      - The order stores the partial transaction and total received EUR 45.00.
      - The expiry is extended by 7 days from the partial receipt time.
      - Alice receives an email asking her to send the remaining EUR 5.00 with the same OM reference.
  - id: S-4
    title: Second partial completes the order
    given:
      - Alice's EUR 50.00 order has already received EUR 45.00 under OM-ACCT-bt123456.
      - Revolut sends a later completed EUR 5.00 webhook with the same OM reference.
    when:
      - OpenMates processes the second webhook.
    then:
      - Alice receives exactly 54,000 credits.
      - The order status becomes completed.
      - The order records both Revolut transaction IDs and total received EUR 50.00.
      - Alice receives the normal purchase confirmation email.
  - id: S-5
    title: Duplicate Revolut transaction is ignored
    given:
      - Alice's pending order has already recorded Revolut transaction txn-1 as a partial payment.
    when:
      - Revolut retries the same TransactionCreated webhook with transaction ID txn-1.
    then:
      - OpenMates does not add the amount again.
      - No duplicate credits, gift cards, team events, or underpayment emails are created.
  - id: S-6
    title: Team and gift-card purchases use the same amount rules
    given:
      - A team credit order or gift-card order is pending with an OM reference.
    when:
      - Revolut sends exact, overpaid, underpaid, or completing partial webhooks.
    then:
      - Settlement uses the same cumulative amount rules as personal credit purchases.
      - Team credits or gift-card code creation happens only after cumulative received money reaches the selected pack price.
  - id: S-7
    title: Webhook transaction must be confirmed through Revolut API
    given:
      - Revolut sends a signed TransactionCreated or TransactionStateChanged webhook containing a transaction ID.
    when:
      - OpenMates processes the webhook.
    then:
      - OpenMates fetches that transaction ID from the Revolut Business API before matching the OM reference or granting credits.
      - Settlement uses the API-confirmed transaction state, amount, currency, receiving account/direction, and reference.
      - If API confirmation fails, no credits, gift cards, or team credits are granted.
      - Missing Vault API credentials do not send admin email because auto-settlement is not configured.
      - When Vault API credentials are configured but confirmation fails for another reason, an admin alert is queued with the Revolut transaction ID and OM reference hint.
  - id: S-8
    title: Distinct transfer reuses completed OM reference
    given:
      - Alice's EUR 10.00 credit order under OM-ACCT-bt123456 is already completed.
      - Revolut sends a new completed EUR 10.00 transaction with a different transaction ID but the same OM reference.
    when:
      - OpenMates processes the webhook.
    then:
      - Alice receives no duplicate credits, gift card, team credit, purchase confirmation, or stats increment automatically.
      - The completed order records that extra EUR 10.00 is unresolved under the same reference when schema fields are available.
      - Alice receives a duplicate-reference email explaining the reference is single-use and asking her to choose a credits gift card or refund by replying with IBAN details.
      - Admins are alerted with the OM reference and Revolut transaction ID for operational follow-up.
      - The email is idempotent per Revolut transaction ID.

