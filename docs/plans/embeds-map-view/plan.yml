decisions:
  - id: D-1
    status: active
    decision: Implement `embeds_map_view` as a message-level fenced block, not a persisted embed type.
    reason: >
      The view is a presentation over existing encrypted embeds and should not create
      another durable content entity or copy child embed data into messages.
    decided_at: "2026-07-29T11:32:34Z"
  - id: D-2
    status: active
    decision: Support only `title`, `embeds`, `sources`, and `highlight` fields in assistant-authored blocks.
    reason: >
      This keeps prompts cheap, minimizes malformed output, and lets the frontend
      derive facets from authoritative embed content.
    decided_at: "2026-07-29T11:32:34Z"
  - id: D-3
    status: active
    decision: Do not suppress standalone embed previews that are also referenced by a map view.
    reason: >
      Users may need the original card plus the grouped spatial overview; duplicate
      suppression can be considered later after real usage data.
    decided_at: "2026-07-29T11:32:34Z"
  - id: D-4
    status: active
    decision: The map view must never trigger automatic paid provider or app-skill enrichment.
    reason: >
      Referencing existing embeds should be a rendering choice, not a hidden billing
      event. Exact flight tracks and richer booking details are allowed only when
      already present in the referenced embed content.
    decided_at: "2026-07-29T11:32:34Z"
  - id: D-5
    status: active
    decision: Map-capable app-skill outputs should get map-view instructions and repair by default.
    reason: >
      Spatial results such as routes, places, appointments, events, and stays are
      easier to compare on a map. The default should recommend a map view while
      preserving explicit user opt-outs and the no-enrichment cost/privacy boundary.
    decided_at: "2026-07-30T00:00:00Z"
  - id: D-6
    status: active
    decision: Replace category-only filtering with frontend-derived dynamic facets.
    reason: >
      A single `route/event/place` selector is not enough for comparing real search
      results. The renderer should derive useful filters from already-resolved
      embed content, such as date, time, price, provider, RSVP count, transport
      mode, train type, stops, duration, rating, and amenities, while keeping the
      assistant-authored block limited to refs.
    decided_at: "2026-07-31T15:00:00Z"
  - id: D-7
    status: active
    decision: Map-view performance fixes must reduce cold-load work before adding heavier filter UI.
    reason: >
      Issue YVBZW showed mobile Safari unresponsiveness on a small route-map
      example. Richer filters must reuse one normalized entry/facet model and must
      not add repeated TOON decoding, source resolution, or Leaflet layer rebuilds
      during initial chat load or slider changes.
    decided_at: "2026-07-31T15:00:00Z"
  - id: D-8
    status: active
    decision: Maps Search parent fullscreens reuse the map-view list/map layout inside UnifiedEmbedFullscreen.
    reason: >
      Maps Search is itself a place-results map surface. Reusing the existing
      `EmbedsMapView` layout removes nested child fullscreens while preserving
      the standard fullscreen embed header, top bar, share behavior, and no
      provider-enrichment boundary.
    decided_at: "2026-08-12T11:10:00Z"
  - id: D-9
    status: active
    decision: Reuse the embed preview registry and existing UnifiedEmbedPreview-based child components in a horizontal carousel above the map or calendar.
    reason: >
      Figma node 5819:61921 composes the existing 300 by 200 embed cards rather
      than introducing a second result-card design. Registry reuse keeps child
      content, fullscreen behavior, app identity, and accessibility consistent.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-10
    status: active
    decision: Keep filters local to the mounted results view for this redesign and do not silently persist them to an unrelated encrypted data model.
    reason: >
      The Figma canvas contains conflicting temporary and permanent filter notes.
      Repository discovery found no existing per-view encrypted sync state that is
      also available to the assistant. Cross-device and assistant-aware persistence
      therefore needs a separate privacy/API contract rather than misuse of drafts,
      highlights, chat metadata, or embed history.
    decided_at: "2026-08-27T00:00:00Z"

