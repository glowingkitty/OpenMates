assumptions:
  - id: A-1
    text: Existing readable `embed_ref` slugs can be resolved to full `embed_id` values after decrypted content/index metadata is available.
    category: embed-resolution
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/embed_service.py
        summary: Existing service generates readable embed refs.
      - source: frontend/packages/ui/src/services/embedStore.ts
        summary: Existing frontend store maintains embed ref/index resolution behavior.
  - id: A-2
    text: Parent app-skill embeds expose enough child embed IDs for source-backed map views to resolve child refs without provider calls.
    category: embed-graph
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/messaging/embeds.md
        summary: The embeds collection has `embed_ids` for composite `app_skill_use` embeds and child embeds remain independently encrypted.
  - id: A-3
    text: Shared Leaflet rendering can be extended to support multiple markers, selected state, callbacks, and multiple route polylines using existing content.
    category: frontend-rendering
    required_before: task_execution
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/components/embeds/EmbedLeafletMap.svelte
        summary: Shared map component now accepts multiple route polylines while preserving the existing single `path` prop for older embed fullscreens.
      - source: frontend/packages/ui/src/components/embeds/EmbedsMapView.svelte
        summary: Map-view renderer derives marker and route selected/highlighted styles from resolved refs; new performance work must keep Leaflet geometry stable when selection or filters change.

contracts:
  syntax:
    - name: Curated child embeds
      example: |
        ```embeds_map_view
        title: Berlin AI events
        embeds: ai-founders-meetup-7f3a91, llm-hack-night-22b8c0
        ```
    - name: Source with highlighted children
      example: |
        ```embeds_map_view
        title: Berlin AI events
        sources: events-search-12ab34
        highlight: ai-founders-meetup-7f3a91, llm-hack-night-22b8c0
        ```
    - Only `title`, `embeds`, `sources`, and `highlight` are supported in assistant output.
    - '`embeds`, `sources`, and `highlight` are comma-separated readable refs or full embed IDs.'
  api:
    - route: Existing authenticated chat WebSocket and message sync surfaces only
      access_model: first-party client surface only
      auth: Existing session or approved device auth; no new public or developer API route is introduced.
      rate_limits: Existing chat/WebSocket/message sync limits apply; map rendering adds no new server endpoint.
      credit_budget: Model token costs may apply to assistant generation; map rendering itself must not spend app-skill/provider credits.
      encryption_boundary: Client-side encrypted embed content stays encrypted at rest and decrypted only client-side for rendering.
      errors:
        - Invalid map-view syntax renders a safe fallback or ignored block without crashing chat rendering.
        - Unresolved refs render recoverable loading or unavailable states.
  data:
    - Messages store only the lightweight `embeds_map_view` fenced text and refs.
    - Referenced embeds remain existing encrypted embed records; no copied child content is persisted in message text.
    - Source-backed views resolve child refs from existing parent app-skill embed relationships.
    - Normalized map-view entries and filter facets are derived once per embed/content identity and reused for list, map, count, and filter interactions.
    - Example chats must strip private fields such as vault keys, user IDs, account IDs, and share key fragments before commit.
  ui_states:
    - Empty or unresolved refs.
    - Partial resolution where some entries load and others are unavailable.
    - Desktop list-left/map-right grouped view.
    - Mobile horizontal card list with full-width map.
    - Highlighted entries from `highlight`.
    - Derived filters present only when resolved content supports them.
    - Time range filters with histogram bars for departure, arrival, event start, appointment start, opening, or other time-like fields.
    - Date range filters for start/end dates, event dates, check-in/check-out dates, or travel dates.
    - Numeric range filters for price, duration, stops/transfers, RSVP count, rating, distance, or delay when present.
    - Categorical multi-select filters for provider, transport mode, train type, carrier, line, amenity, specialty, category, fare coverage, or availability state.
    - Active-filter chips and clear-all behavior.
    - No-map fallback when no referenced item has coordinates or route geometry.
  privacy_security:
    - No decrypted embed plaintext is sent to a new endpoint for map rendering.
    - Share-chat recipients keep URL fragment keys client-side.
    - Rendering may request OpenStreetMap tiles but must not call app providers or enrichment endpoints automatically.
    - Cost metadata for known skills remains explicit: events search 30 credits, travel connections 25 credits, health appointments 20 credits, travel stays 25 credits, and travel flight details 7 credits.

