schema_version: 2
id: embeds-map-view
title: Embeds Map View
status: implementing

goal: >
  Let the assistant render a compact in-chat map/list view that groups existing
  location-capable or route-capable embeds without creating a new persisted embed
  type, duplicating embed content, or triggering extra paid provider calls. When
  a map-capable app skill returns geo data, map view generation is recommended by
  default unless the user request explicitly makes a map inappropriate.

scope:
  in:
    - A message-level `embeds_map_view` fenced block emitted by the assistant.
    - Compact curated syntax using `title` and `embeds` for explicit child embed refs.
    - Source syntax using `sources` for app-skill parent embeds and `highlight` for selected child refs.
    - Resolution of short `embed_ref` slugs with full `embed_id` fallback when a ref index is unavailable.
    - Frontend-derived filters based on resolved embed content, not assistant-authored filter fields.
    - Desktop and mobile in-chat rendering with list/map coordination and partial loading states.
    - Reuse of existing events, health appointments, maps places, travel stays, travel connections, and other embeds that already contain coordinates or routes.
    - Default-recommended map-view instructions and deterministic repair for map-capable app-skill outputs such as travel connections, health appointments, maps search, events search, and travel stays.
    - Rendering multiple travel connection child routes on one grouped map by deriving route polylines from existing connection segment coordinates.
    - Figma-aligned preview carousel, map viewport selection, pin/route selection, filter panel, and weekly calendar behavior from Website node `5819:61921`.
    - Reuse of registered `UnifiedEmbedPreview`-based child preview components instead of a second map-view-specific result card implementation.
    - Real OpenMates CLI inference tests that prove the assistant generates valid blocks from natural prompts.
    - Real CLI-generated example chats for inspection and future regression coverage.
    - Deterministic cost and privacy safeguards that forbid automatic paid provider enrichment.
  out:
    - Creating a new persisted embed type or Directus collection for map views.
    - Copying child embed content into assistant message text.
    - Suppressing normal standalone embed previews that are also referenced by the map view.
    - Assistant-authored filter schemas, categories, or facets beyond `title`, `embeds`, `sources`, and `highlight`.
    - Automatic calls to `travel.flight_details`, booking details, Flightradar24, FlightAware, or any other paid provider/enrichment endpoint.
    - Drawing exact flight tracks unless those tracks already exist in the referenced embed content.
    - Replacing fullscreen search-result pages for events, health, or travel.
    - Apple implementation before REST/API, CLI, SDK, web, and user-confirmation gates are complete.
    - Cross-device persistence or assistant-context injection of active filters; this requires a separate approved encrypted sync and AI-context contract because no compatible state channel exists today.

