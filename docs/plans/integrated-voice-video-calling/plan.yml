schema_version: 2
id: integrated-voice-video-calling
title: Integrated voice and video calling in three phases
goal: 'Add support for video call in our existing voice call implementation, and testing. No record call option for now.'
authorization: The user explicitly requested the three-phase Specification and immediate phase-1 implementation/testing
  on 2026-10-13, without further clarification. This overrides an additional Specification approval question; no
  permission is inferred from attached PDFs or historical Task content.
current_authorization: On 2026-10-14 the user explicitly requested updating the voice Specification and implementing
  the discussed Gemini architecture, including shared ethics/compressed context, direct Jev-selected memories/focus,
  Flash-backed skills and OpenMates assistant fallback. The user also specified the audiocall handset, red downward
  rotation and press-again hangup, with Call directly left of Close in one horizontal row. These requests authorize
  this increment without another clarification round. The subsequent request adds investigation of Gemini's
  billable audio and matching user charges, with pricing visibility tied to processing activity.
  On 2026-10-15 the user explicitly approved the described background-loaded local speech detector,
  five-second automatic input idle, immediate calling with bounded startup audio, continuous-streaming
  fallback, and working/speaking/resume status copy, and requested updating the Specification and implementation.
  The subsequent UI correction replaces visible status/credit text with real audio bars and an active-duration
  counter that pauses/fades during confirmed idle. It requires inline-to-fixed chat controls, the corrected
  brand-slot background-call pill, Coming soon video action and encrypted start/end history events.
  The user additionally requested a round microphone control over the waveform, matching Close, with a
  visibly active muted state that blocks background-noise interruptions while retaining the call connection,
  plus brief distinct local confirmations for connected, manually muted/unmuted and ended transitions.
  The subsequent first-call privacy request requires a Google processing disclosure with an attributed paid-API
  no-training statement, explicit acceptance persisted in the account profile, and no microphone/provider
  connection before successful acknowledgment; the user also requested hiding generic status footers on
  voice-created transcripts while retaining Sending for pending typed submissions.
