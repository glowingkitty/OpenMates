phases:
- phase: 1
  outcome: Voice-only chat foundation with encrypted transcripts and submitted text
  task_id: b49870a1-693a-4b26-8229-630cba7c6948
  scope:
  - Gemini adapter and first-party call admission, owner/session-bound messages and usage.
  - Existing/new personal chat launch, text context, normal transcript bubbles and ciphertext-only durable synchronization.
  - Typed/pasted text reaches the same live conversation; no duplicate inference.
  - Persistent controls, fixed chat binding, mute/hangup/interruption cleanup; composer mic and separate speech
    disabled.
- phase: 2
  outcome: Jev-routed memories, focus modes, app skills and encrypted embeds
  task_id: e3257206-797c-4dfb-96c7-d3e83693efed
  depends_on_phase: 1
  scope:
  - Stable request gateway with a concise public app catalogue; two-stage shared Jev app/Project and capability selection.
  - Direct authorized memory loading and focus activation with existing UI/history and voice continuations.
  - Gemini 3.8 Flash only for selected skill schemas, shared execution/billing/cancellation and structured encrypted embeds.
  - Shared canonical ethics, latest compression checkpoint and uncovered recent messages at voice startup/refresh.
  - Background shared compression of completed call transcripts with durable client-encrypted checkpoints and safe live-context refresh.
  - OpenMates/favicon fallback for uncategorized assistant messages, preserving known identities.
  - Adjacent Call/Close controls with the audiocall handset, red downward active state and press-again hangup.
  - Provider-token charges with no connected-time fee; accessible usage-based billing information and an
    active-duration counter that pauses/fades only when input and processing are confirmed idle.
  - Background-loaded local speech detection never blocks calling; five-second silence pauses input on the
    existing connection, with bounded prespeech/startup audio and continuous-streaming fallback.
  - Real microphone/playback waveform with a dedicated Close-style microphone overlay and red muted icon,
    accessible activity and authoritative manual mute that preserves the connection; no visible credit
    count or resume/status text in the call strip.
  - Brief distinct local connected, manual mute/unmute and ended sounds; silent automatic idle/resume and
    deterministic cue cleanup without blocking call controls.
  - One-time accessible Google voice-processing notice before capture/admission; explicit confirmed profile
    acknowledgment follows the account across browsers/devices, with Cancel and failed saves leaving calls unopened.
  - Voice-created transcripts omit generic sending/processing footers; typed input shows Sending until accepted.
  - Screenshot-matched inline/fixed strip and corrected detached Header brand-slot pill, existing More actions,
    Close chat beside Hang up in fixed mode, Coming soon video action and encrypted start/end system events.
  deferred_followup:
  - Submitted file processing remains a later phase-2 increment; video remains phase 3.
- phase: 3
  outcome: Visual input and generated-video calls
  task_id: 18b14a5f-8096-435a-bc12-aefaff29e083
  depends_on_phase: 2
  scope:
  - Explicit web camera sharing, rear/front switching and independent microphone/camera controls.
  - Two-second expanded preview becomes smaller while remaining visible; screen sharing and Apple follow later.
  - Exact selected source frames persist as encrypted user image attachments and skill input thumbnails after reload.
  - Normal early skill progress cards retain the same identity through completion and minimized horizontal display.
  - Generated images/videos expand the plain-media stage with AI badge, bottom-right upward collapse arrow and output navigation.
  - Camera sharing continues while AI media is shown; videos play muted once with normal controls.
  - H3 Max Turbo defaults for call videos through ordinary skill/storage/billing; ordinary video defaults stay unchanged.
  - Neither call recording nor a Record call option is included.
phase_1_excludes:
- Skills, file interpretation, camera/screen sharing, generated video, permanent audio recording, non-web and team
  calling.
decisions:
- Keep feature.video-call as the owning contract; preserve the standalone experiment contract.
- Reuse Gemini audio/admission/billing/rollover mechanisms through a provider boundary.
- Live transcript storage is independent of inference submission and uses client encryption.
- Raw speech goes to the disclosed provider before text PII masking; no plaintext durable server storage.
- No additional user approval round because the current request explicitly authorizes Specification creation and
  implementation.
- Seal voice worker request/result transport with the existing user encryption boundary; do not retain plaintext in Celery/Redis.
- Context and tool output feed the live conversation, never an independent ordinary text answer.
- Preserve existing memory-sharing and focus authorization/activation policies; Jev decisions do not grant access.
- Gemini 3.8 Live permanently enables proactive audio. Streaming microphone silence is billable input;
  muted input uses the provider's audio-stream pause signal. Already generated playback is separate from processing.
required_checks:
- Isolated component and call checks prove first-use notice, Cancel, profile read/write failures, explicit
  acceptance before capture/provider access and once-per-account persistence across reload.
- Specification/examples and Plan validation with generated registry refresh.
- Focused backend unit tests for auth/ownership/admission, turn identities, late transcripts, typed input, rollover,
  usage and ciphertext persistence.
- Focused frontend unit/lint/component checks for transcript persistence, call lifecycle and typed-call routing.
- Isolated GitHub CI bare component preview on phone and laptop before authenticated voice-call flow.
- Isolated GitHub CI flow verifies existing/new chat, encrypted transcript reload, typed input without duplicate
  inference and microphone/hangup cleanup.
- Retrieve and deliver selected successful E2E recordings with the receipt evidence command.
- Scoped dev deployment after candidate checks, plus reviewed laptop/mobile visual smoke.
- Focused broker/protocol tests prove direct memory/focus paths skip Flash, selected skill execution uses Flash,
  sealed transport, cancellation and authorized continuations.
- Focused client tests prove compression checkpoint/source-boundary loading, existing UI events and encrypted
  embed/transcript coalescing; isolated call E2E covers these paths using deterministic provider fixtures.
- Focused usage/protocol tests prove idle connection time adds no charge and reported usage settles once per
  turn. Bare component and isolated voice checks prove active-duration progression during quiet streaming and
  muted model processing, paused/faded duration during confirmed idle playback, and omitted credit/resume text.
- Focused audio-gate and controller tests prove cold-loading/failure fallback, five seconds of verified silence,
  buffered first-syllable resume and startup ordering, manual mute, bounded memory, and stale-callback cleanup.
- Isolated browser proof exercises the real self-hosted speech model/worker, background initialization and
  activity states on phone/laptop before the full encrypted call flow. Provider fixtures do not establish
  real Gemini idle billing; an inference-dependent meter check uses default automatic routing on dev when leased.
- Focused lifecycle persistence checks and isolated browser reload prove one encrypted started/ended event
  per connected call, including close-chat and repeated end callbacks, with no events for refused calls.
- Account-free scroll/Header integration proof precedes full call flow and verifies inline-to-fixed controls,
  More/video/close behavior, detached pill/return and responsive layout against the supplied reference PNGs.
