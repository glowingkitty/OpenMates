# OpenMates Task afd0c127-44fe-4a6f-b187-97757ff0515f owns progress.
scope:
  - Rust core - sandbox key exchange (sealed box with binding), device-side answer to the key request on web, CLI and Apple through the shared core.
  - New Rust binary crate packages/openmates-sandbox-host - holds the key in memory, decrypts the ciphertext bundle into a file tree, runs file operations, builds encrypted revisions, merges conflicts.
  - Backend - sandbox lifecycle (create, key relay, sync-in, idle and hard maximum, kill), inline execution of Project file tools and commands through the sandbox, server-side commit of sandbox-built ciphertext revisions.
  - E2B consent wording v2 (processed in the US).
  - Per-second billing for code runs and sandbox jobs.
contracts:
  - projects.keys.client-wrapped
  - code-run.e2b.upload-consent
  - code-run.cloud.workspace
decisions:
  - Server relays only a sealed blob (crypto_box sealed box to the sandbox's fresh X25519 key); binding fields live inside the sealed plaintext and are checked by the sandbox.
  - The sandbox holds no OpenMates credential. The server moves ciphertext in (sync-in, merge heads) and out (revision commits). A compromised sandbox cannot fetch more Project data.
  - Phase 1 keeps the model loop in the existing AI task and executes Project tools inline through E2B's authenticated command channel (no task end per operation). Moving the loop into the sandbox can follow; the key and storage design is the same.
  - Users who declined E2B keep the existing device executor, frozen.
  - Never pause a sandbox; E2B on-timeout action is kill.
verification:
  required:
    - Rust unit tests for key sealing, binding, expiry and wrong-key refusal; a test that relayed frames never contain the raw key.
    - Backend tests that the key relay stores and logs nothing and that sandbox records hold ids only.
    - Write-back tests with two devices editing the same file at once (clean merge, real conflict, no edit lost).
    - Per-second billing tests for code runs and sandbox jobs.
    - A real sandbox job on dev (web), with screenshots or a video, and the non-coding video flows still green.
  evidence:
    - "Feature commit 9ddd70e: rust-check all and rust-wasm green (sealed key grant, binding, expiry, wrong-key refusal, relayed frames without the raw key); pytest sandbox, billing, consent and adoption suites green (key relay stores and logs nothing, sandbox records hold ids only, ordered write-back with merge on stale base, per-second billing at 0.05 credits/s, min 1); isolated CI sources 52dcef8e and 20d2d0c7."
