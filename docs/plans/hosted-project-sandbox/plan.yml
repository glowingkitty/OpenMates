schema_version: 2
profile: concise
id: hosted-project-sandbox
title: Hosted Project agent jobs in an E2B sandbox with a sealed Project key
status: verified
goal: >-
  Every agentic job on a hosted (cloud) Project runs in an E2B sandbox that holds
  the decrypted Project as a normal file tree, so file operations, tests and
  builds are fast at any repository size. The user's device hands the Project
  key, sealed, only to that sandbox; the main server relays an opaque blob and
  never stores or sees the key. Changes are written back encrypted after every
  change, conflicts with other devices are merged without losing edits, and the
  sandbox is killed after 15 idle minutes or 4 hours (opt-in up to 24 hours),
  never paused. The consent says plainly that Projects are processed by E2B in
  the US. Code execution is billed per second. On dev the path is on directly
  (no feature flag); production has agentic coding off.
