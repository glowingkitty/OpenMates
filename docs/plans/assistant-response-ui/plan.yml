  accepted_differences:
  - Screenshot typography and colors map to existing web tokens; unseen Figma layers are not inferred.
  - Thinking durations appear only when measured data exists; unavailable model regions are not guessed.
  - Native Apple presentation is deferred; canonical encrypted response content remains compatible.
  - 'The existing thinking stream is response-wide: disclose it once with response-wide wording instead of attributing
    it to a tool cycle.'
scope:
  in:
  - One transient current-turn Thinking container after server acceptance, with actual Mate and model/region as
    available.
  - Bottom-inside rainbow glow with reduced-motion support and removal of external rainbow and typing indicator.
  - Connected left bubble and container, visible AI status icon, deterministic centered Researching/Working labels for active skills, left-to-right glow and left-aligned completed attribution.
  - Stable adjacent skill runs in canonical source order interleaved with authored prose.
  - Completed groups collapse to app/thinking summaries with keyboard-accessible disclosure.
  - Shared preview information bars precede details across status, width and historical embeds.
  out:
  - New inference events, hidden model reasoning, invented durations and unrelated Figma surfaces.
required_checks:
- Focused parser/grouping unit tests and changed-source lint.
- Isolated bare component proof of processing, completed disclosure, header order and phone/laptop layout.
- Isolated processing lifecycle, live/final/reopen document and historical embed product checks.
- Compare approved aspects against reference and rendered CI evidence; retain recordings for all attempts.
- Owning Specifications and Plan validation, generated metadata and scoped diff check.
