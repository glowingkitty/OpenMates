schema_version: 2
profile: concise
id: spec-driven-flow
title: Spec-driven development flow - mixed-source Checks, Specification/Plan/Check embeds, active Plan in chat settings, Check-aware continuation
status: implementing
goal: >-
  Make the in-product spec-driven development flow usable for real agentic coding work:
  reusable Checks that group e2e, unit, integration, AI evaluation and human confirmation
  sources; Specifications, Plans and Checks as chat embeds with fullscreen views that are
  visible in Projects; the chat's active Plan in chat settings; and an assistant that keeps
  working while Tasks are open or required Checks are not green.

