specification_refs:
  - {id: feature.checks, assertions: [checks.sources.grouped-multi-surface, checks.sources.mixed-types, checks.aggregation.required-sources-gate, checks.sources.deterministic-for-sensitive-claims, checks.human.waiting-for-confirmation, checks.runs.revision-bound, checks.project.encrypted-embed]}
  - {id: feature.specifications}
  - {id: feature.plans}
