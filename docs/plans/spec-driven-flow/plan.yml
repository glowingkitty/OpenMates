  authority: OpenMates Tasks
  parent_delivery_task: 429aa868-fa09-4bb7-b9f4-e43ecd851faa
  session: "7ff6"
  policy: Lanes below are deliverables of one overnight build; status lives in the OpenMates Task.

related_plans:
  checks_origin: docs/plans/cloud-project-development (P4 reusable Checks; this plan delivers its first version)
  agentic_tests: docs/plans/agentic-tests-and-git-sync (owned by session 5349; test_result embeds are reused as Check source results, never changed here)
  plans_v1: docs/plans/plans-v1 (Plan storage, assumptions, verifications)
