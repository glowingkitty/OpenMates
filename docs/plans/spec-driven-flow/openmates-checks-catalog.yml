# Example: OpenMates' own tests grouped into about 50 Checks (feature.checks, mixed sources).
# Draft for discussion with the owner, 2026-11-13. Not loaded by any code yet.
# Counts at time of writing: 833 Playwright specs, about 1,200 backend pytest files,
# about 850 TypeScript unit test files, 689 Rust test files, 323 Apple test files.
# Rules: e2e = Playwright (web) or XCUITest (Apple); unit = pytest/vitest/cargo/XCTest suites;
# integration = API/WebSocket tests against the real stack; ai = AI evaluation question;
# human = human confirmation. role: required (gates) or supporting (visible only).
# requires_deterministic is true for security, privacy, encryption, permissions,
# migrations and exact API behaviour.

checks:
  # Account and authentication
  - {id: signup-passkey, title: Signup works with a passkey, requires_deterministic: true, sources: [{e2e: signup-flow-passkey.spec.ts}, {e2e: "apple: DevSignupRuntimeUITests"}, {unit: "backend/tests/test_*signup*.py, test_*passkey*.py"}, {human: "Create a passkey on a real iPhone and a real Mac", role: supporting}]}
  - {id: signup-card-payment, title: Signup works with card payment, requires_deterministic: true, sources: [{e2e: signup-flow-stripe-eu.spec.ts}, {e2e: signup-flow-stripe-managed.spec.ts}, {unit: "backend/tests/test_*payment*.py"}]}
  - {id: signup-bank-transfer, title: Signup works with bank transfer, requires_deterministic: true, sources: [{e2e: signup-flow-bank-transfer.spec.ts}, {unit: "backend/tests/test_*invoice*.py", role: supporting}]}
  - {id: signup-gift-card, title: Signup and gift card redemption work, requires_deterministic: true, sources: [{e2e: settings-gift-card-redemption.spec.ts}, {e2e: settings-gift-card-bank-transfer.spec.ts}, {unit: "backend/tests/test_*gift*.py"}]}
  - {id: signup-2fa-choices, title: Signup with or without 2FA works, requires_deterministic: true, sources: [{e2e: signup-skip-2fa-flow.spec.ts}, {e2e: signup-2fa-reconnect-preview.spec.ts}, {unit: "backend/tests/test_*2fa*.py"}]}
  - {id: signup-free-credits, title: Free testing credits are granted once, requires_deterministic: true, sources: [{e2e: signup-free-testing-credits.spec.ts}]}
  - {id: login-works, title: Login works (passkey and alternatives), requires_deterministic: true, sources: [{e2e: passkey-login-alternatives.spec.ts}, {e2e: web-rust-core-auth.spec.ts}, {e2e: "apple: AuthSecurityParityUITests"}, {unit: "backend/tests/test_*auth*.py"}]}
  - {id: login-backup-and-recovery, title: Backup codes and recovery key let a user back in, requires_deterministic: true, sources: [{e2e: backup-code-login-flow.spec.ts}, {e2e: recovery-key-login-flow.spec.ts}, {e2e: account-recovery-flow.spec.ts}, {unit: "backend/tests/test_*recovery*.py"}]}
  - {id: sessions-and-logout, title: Sessions rotate, revoke and log out cleanly, requires_deterministic: true, sources: [{e2e: auth-session-rotation.spec.ts}, {e2e: session-revoke-flow.spec.ts}, {e2e: logout-multi-tab-versionchange.spec.ts}, {e2e: logout-blocked-userdb-relogin.spec.ts}]}
  - {id: account-settings-security, title: Email change, backup codes and recovery key settings work, requires_deterministic: true, sources: [{e2e: settings-change-email.spec.ts}, {e2e: backup-codes-settings.spec.ts}, {e2e: recovery-key-settings.spec.ts}]}
  - {id: account-import, title: Account and chat import work, requires_deterministic: true, sources: [{e2e: import-account-v1.spec.ts}, {e2e: import-account-dedupe.spec.ts}, {e2e: import-account-limits.spec.ts}, {e2e: import-chats.spec.ts}, {unit: "backend/tests/test_*import*.py"}]}

  # Visitors and onboarding
  - {id: guest-free-chat, title: Visitors can chat for free within the limit, requires_deterministic: true, sources: [{e2e: anonymous-free-chat.spec.ts}, {e2e: anonymous-usage-limit.spec.ts}, {e2e: anonymous-free-usage-status.spec.ts}]}
  - {id: unauthenticated-app-loads, title: The app loads and navigates without an account, requires_deterministic: false, sources: [{e2e: unauthenticated-app-load.spec.ts}, {e2e: unauthenticated-chat-navigation.spec.ts}, {e2e: guest-workspace-navigation.spec.ts}, {e2e: app-load-no-error-logs.spec.ts}]}
  - {id: landing-page, title: The landing page explains OpenMates and converts, requires_deterministic: false, sources: [{e2e: "landing-*.spec.ts (41 specs)"}, {ai: "Does the landing page say in the first screen what OpenMates does and for whom?", role: supporting}, {human: "Owner approves the hero copy and video", role: supporting}]}
  - {id: example-chats, title: Example chats load, clone and stay isolated, requires_deterministic: false, sources: [{e2e: example-chats-load.spec.ts}, {e2e: example-chat-clone.spec.ts}, {e2e: example-chat-embed-uuid-isolation.spec.ts}, {e2e: example-chat-logout-preserve.spec.ts}]}

