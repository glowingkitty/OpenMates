  - {id: chat-management, title: Rename, delete, search and navigate chats, requires_deterministic: false, sources: [{e2e: chat-management-flow.spec.ts}, {e2e: chat-search-flow.spec.ts}, {e2e: chat-header-navigation-order.spec.ts}, {e2e: "apple: ChatNavigationParityUITests"}]}
  - {id: chat-settings, title: Chat settings work, requires_deterministic: false, sources: [{e2e: chat-settings-flow.spec.ts}, {e2e: tasks-chat-settings-parity.spec.ts}, {e2e: "apple: ChatSettingsParityUITests"}]}
  - {id: drafts, title: Drafts are kept and cleaned up, requires_deterministic: false, sources: [{e2e: web-rust-core-drafts.spec.ts}, {e2e: draft-clear-cleanup.spec.ts}, {e2e: draft-only-chat-delete.spec.ts}]}
