decisions:
  - id: D-1
    status: active
    decision: Bootstrap all lifecycle commands through the clean verified control plane before worktree binding.
    reason: The former post-binding-only call allowed stale canonical code to create the initial worktree.
    decided_at: "2026-09-03T15:30:00Z"
  - id: D-2
    status: active
    decision: Preserve overwritten runtime-mirror bytes outside the canonical checkout by content hash.
    reason: Atomic replacement alone prevented torn writes but did not make displaced local work recoverable.
    decided_at: "2026-09-03T15:40:00Z"
  - id: D-3
    status: active
    decision: Bound retries in the pinned OpenCode runtime and persist terminal assistant error state.
    reason: A universal retryable 404 classification and unbounded schedule produced seven retries and an empty-looking assistant turn after cancellation.
    decided_at: "2026-09-03T15:50:00Z"
  - id: D-4
    status: active
    decision: Treat production database-path compatibility as an executable release invariant.
    reason: A preview-channel build was healthy but opened opencode-.db, making all historical chats appear missing until rollback.
    decided_at: "2026-09-03T16:25:00Z"
  - id: D-5
    status: active
    decision: OpenCode-bound repository sessions never own the zellij session inherited from their server process.
    reason: Ending disposable session cf31 killed the shared code zellij and stopped the otherwise healthy server.
    decided_at: "2026-09-03T16:32:00Z"

