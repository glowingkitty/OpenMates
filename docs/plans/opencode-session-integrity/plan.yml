schema_version: 2
id: opencode-session-integrity
title: OpenCode Session Bootstrap, Runtime, and Provider-Failure Integrity
status: implementing

goal: >
  Make every new OpenCode coding chat start from current fetched origin/dev in a
  clean managed worktree, load the current Specification-to-Plan workflow,
  preserve displaced local bytes, and surface provider failures without losing
  the user's message or retrying forever.

scope:
  in:
    - Route lifecycle commands through the verified control-plane runtime before a worktree exists.
    - Preserve every runtime-mirror file displaced from the canonical checkout.
    - Bound provider retries and persist terminal assistant errors.
    - Preserve and separately reconcile dirty canonical and incident worktrees.
    - Stage one controlled runtime activation after build and disposable-session verification.
  out:
    - Automatically merging obsolete contract changes from affected chats.
    - Resetting, cleaning, stashing, or deleting the dirty canonical checkout.
    - Restarting the live OpenCode server without capturing the active-chat set.
    - Renaming legitimate API contracts or stable assertion identifiers.

source_of_truth:
  user_direction:
    - Specifications are definitive product truth.
    - Plans are the path from current state to the Specification goal.
    - A dirty canonical checkout must never become the execution base for a new coding chat.
    - Investigation and repair must not abandon recoverable work.
  related_plan: docs/plans/opencode-recovery/plan.yml

scenarios:
  - id: S-1
    title: A new chat starts from current development state
    given:
      - The canonical checkout is old and dirty but the clean runtime can fetch origin/dev.
    when:
      - An unbound chat invokes sessions.py start.
    then:
      - The hook routes the command through the verified runtime before a worktree exists.
      - The managed worktree is based on the fetched origin/dev commit.
      - The chat discovers define-specification and create-plan rather than deprecated workflows.
  - id: S-2
    title: Runtime mirroring preserves displaced work
    given:
      - A mirrored or deprecated path contains different local bytes.
    when:
      - Startup synchronizes the verified runtime files into the canonical checkout.
    then:
      - Existing bytes are content-addressed outside the checkout before replacement or deletion.
      - A no-op second synchronization creates no additional recovery record.
  - id: S-3
    title: Provider failure terminates visibly
    given:
      - A durable user turn receives a retryable OpenAI 404 or another repeated retryable provider error.
    when:
      - The pinned OpenCode retry policy evaluates the failure.
    then:
      - An OpenAI 404 receives at most one retry and other retryable failures are capped.
      - The user message remains stored and the terminal assistant row is marked as an error.
  - id: S-4
    title: Runtime activation does not fan out into historical chats
    given:
      - A tested runtime release is ready while live or historical chats exist.
    when:
      - An operator performs the controlled activation.
    then:
      - The busy-chat set is captured once and only selected chats are resumed.
      - Disposable bootstrap and provider-error probes pass before historical recovery.
  - id: S-5
    title: A release cannot silently select a different database
    given:
      - A compiled OpenCode binary contains a non-production installation channel.
    when:
      - The immutable release validator probes its database path in an isolated data directory.
    then:
      - The release is rejected unless it reports the production opencode.db path.
      - No live database is opened or migrated by the compatibility probe.
  - id: S-6
    title: Ending one OpenCode repository session preserves the shared host
    given:
      - An OpenCode process inherits the shared host zellij name and starts a repository session.
    when:
      - That repository session ends.
    then:
      - The record does not claim ownership of the shared zellij session.
      - Legacy OpenCode-bound records cannot cause session cleanup to kill the shared host.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: An actual unbound tool.execute.before call rewrites standalone sessions.py start to the verified runtime and preserves chat identity.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-BOOTSTRAP]
  - id: AC-2
    scenario: S-2
    text: Changed mirrored bytes and removed deprecated-skill bytes are recoverable by their recorded content-addressed paths.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-MIRROR-RECOVERY]
  - id: AC-3
    scenario: S-3
    text: The pinned runtime patch limits 404 and general retries and records terminal assistant failure state.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-PROVIDER-RETRY]
  - id: AC-4
    scenario: S-4
    text: Live activation remains gated on a captured-chat restart and disposable bootstrap and provider-failure verification.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [V-RUNTIME-ACTIVATION]
  - id: AC-5
    scenario: S-5
    text: Runtime packaging rejects binaries that resolve any channel-specific database instead of opencode.db.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-STORAGE-COMPAT]
  - id: AC-6
    scenario: S-6
    text: New and legacy OpenCode-bound repository sessions cannot kill their inherited shared zellij host during cleanup.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-ZELLIJ-OWNERSHIP]

tests:
  - id: T-BOOTSTRAP
    type: unit
    file: scripts/tests/test_opencode_hooks_contract.mjs
    command: node --test scripts/tests/test_opencode_hooks_contract.mjs scripts/tests/test_opencode_native_worktree_binding.mjs
    assertions:
      - The actual hook routes unbound session startup through the clean runtime.
      - Bound and merged session routing remains isolated to its managed worktree.
    covers: [AC-1]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: failed_as_expected}}
    green_phase: {required: true, expected: pass, evidence: {status: passed}}
  - id: T-MIRROR-RECOVERY
    type: pytest
    file: scripts/tests/test_sync_opencode_runtime_hook.py
    command: python3 -m pytest scripts/tests/test_sync_opencode_runtime_hook.py scripts/tests/test_opencode_control_plane_guard.py
    assertions:
      - Displaced hook, configuration, and deprecated-skill bytes are archived before mutation.
      - The new provider patch is protected as control-plane source.
    covers: [AC-2]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: failed_as_expected}}
    green_phase: {required: true, expected: pass, evidence: {status: passed}}
  - id: T-PROVIDER-RETRY
    type: unit
    file: scripts/patches/opencode-v1.17.20-bounded-provider-retries.patch
    command: bun test test/session/retry.test.ts test/session/processor-effect.test.ts --timeout 30000
    assertions:
      - A repeated OpenAI 404 stops after one retry.
      - Other retryable failures stop after five retries.
      - Terminal API failure sets the assistant finish state to error.
    covers: [AC-3]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: failed_as_expected}}
    green_phase: {required: true, expected: pass, evidence: {status: passed}}
  - id: T-STORAGE-COMPAT
    type: pytest
    file: scripts/tests/test_opencode_runtime_release.py
    command: python3 -m pytest scripts/tests/test_opencode_runtime_release.py
    assertions:
      - A production-storage binary is accepted in an isolated XDG data directory.
      - A binary reporting opencode-.db is rejected before the current release pointer changes.
    covers: [AC-5]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: failed_as_expected}}
    green_phase: {required: true, expected: pass, evidence: {status: passed}}
  - id: T-ZELLIJ-OWNERSHIP
    type: pytest
    file: scripts/tests/test_sessions_worktree_lifecycle.py
    command: python3 -m pytest scripts/tests/test_sessions_worktree_lifecycle.py
    assertions:
      - New OpenCode-bound records do not capture the host zellij name.
      - Cleanup ignores a shared zellij name on legacy OpenCode-bound records.
    covers: [AC-6]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: failed_as_expected}}
    green_phase: {required: true, expected: pass, evidence: {status: passed}}

verifications:
  - id: V-RUNTIME-ACTIVATION
    kind: deterministic_check
    phase: final
    status: blocked
    required_for_done: true
    covers: [AC-4]
    evidence: {status: blocked}

