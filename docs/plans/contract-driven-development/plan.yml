      reason: Audit concise workflow instructions and skill phase ordering.
    - path: scripts/tests/test_agent_tooling_parity_audit.py
      reason: Audit canonical hook/skill/agent parity across runtimes.
  migration_rollout:
    - Pilot the complete workflow with one Web Search feature contract before broad enforcement.
    - New features use approved contracts and Schema V3 immediately after tooling lands.
    - New or changed behavioral tests require valid mappings immediately; untouched legacy tests remain reported debt.
    - Materially resumed V1/V2 specs migrate to V3 while retaining their full ledgers.
    - Backfill by feature/spec cluster rather than mechanically creating one permanent contract per historical spec.
    - Prioritize auth/recovery, encryption, billing, chat/sync, ownership/sharing, export/deletion, app skills, workflows, embeds/files, then lower-risk settings/UI.
    - Ratchet enforcement from changed files to complete domains and finally remove legacy_unmapped only when repository coverage supports it.
  observability:
    - contracts.py reports deterministic JSON and concise human output without source bodies or private data.
    - Coverage separately reports discovered features, approved contracts, mapped tests, proven assertions, and surface parity.
    - Hook warnings identify the changed test and one exact next command.
    - Deploy failures identify unresolved test cases, assertion IDs, missing surfaces, stale fingerprints, or docs impact.
    - Contract history is searchable from registry, archived specs, commit trailers, and release summaries.
  privacy_security:
    - No contract artifact, index, evidence record, hook message, commit trailer, or release summary stores secrets, private prompts, user identifiers, raw logs, or production data.
    - Examples use public or placeholder values only.
    - External provider content remains data, not trusted agent instruction, in any future feature contract.
  required_assumption_checks:
    - A-1 is tested by one-file CLI fixture coverage and a maintainability review before completion.
    - A-2 is tested with representative current TypeScript, Python, Swift, and script test fixtures before hooks are enabled.
    - A-3 is exercised by hook bridge and deploy fixtures.
    - A-4 is checked against release_catalog.py before release integration is implemented.
  acceptance_criteria_mapping:
    - AC-1 through AC-5 establish contract approval, compact bundles, immutable meaning, replacement implementations, and surfaces.
    - AC-6 through AC-9 establish test metadata, incremental backfill, reverse indexing, and evidence freshness.
    - AC-10 through AC-16 establish Schema V3, docs, history, archive, migration coverage, context efficiency, and worktree-native exact-hash approval.
  verification_strategy:
    - Write focused fixture tests red before each contracts.py, Schema V3, hook, deploy, docs, release, archive, or workflow slice.
    - Verify cross-language metadata statically before enabling the changed-test hook.
    - Verify warning behavior independently from blocking deploy behavior.
    - Run current Schema V1/V2 fixture suites throughout migration.
    - Run sync_agent_parity.py and workflow/tooling audits after canonical skill, agent, or hook changes.
    - Run spec_validate.py on this spec after every material spec edit and contracts.py verify before completion.
  verification_order:
    - Contract bundle schema, registry, and coverage fixtures.
    - Schema V3 validation and V1/V2 compatibility fixtures.
    - Cross-language test metadata and evidence fingerprint fixtures.
    - Post-edit warning and deploy-blocking fixtures.
    - Docs, commit/release, and archive fixtures.
    - Canonical skill/agent/hook parity and final self-verification.
  open_questions:
    - Final cross-framework test metadata syntax must be selected from fixture-backed current framework patterns during TASK-3 without weakening per-test traceability.

