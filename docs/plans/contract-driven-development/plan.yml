implementation_notes:
  plan_path: docs/plans/contract-driven-development/plan.yml
  existing_patterns:
    - Extend Schema V2 validation, verification, approval, evidence, handoff, and migration patterns rather than replacing them.
    - Reuse the canonical Claude hook source plus Codex/OpenCode bridges.
    - Reuse non-blocking post-edit impact reminders and sessions.py deploy-time blocking checks.
    - Reuse agent parity synchronization and workflow audits for skills and instructions.
    - Reuse existing architecture claim/docs impact mechanisms where contract-generated docs intersect them.
  architecture: >
    Add a contracts directory containing compact approved bundles and generated
    indexes. One scripts/specifications.py CLI owns deterministic contract operations.
    Schema V3 extends the V2 full-spec ledger with permanent contract references
    and impact traceability. Tests carry stable assertion metadata; post-edit
    hooks warn on changed unmapped tests, while sessions.py blocks unresolved
    deploys. Skills orchestrate approval and backfill, and commits/releases carry
    searchable contract metadata without coupling product source files.
  approval_boundary:
    - This complete specification requires product-contract approval before plan/task expansion or implementation.
    - Every future new feature contract or semantic amendment requires its own full contract presentation and approval.
    - Implementation-only work against an approved contract needs no semantic reapproval but must refresh affected evidence.
  data_flow:
    - Agent discovers registry entries, shared contracts, semantic context, active specs, code, and tests.
    - define-specification creates contract.yml and examples.yml drafts and presents the full compact contract plus examples summary.
    - Human approval records the bundle version and deterministic fingerprint.
    - Contract edits remain isolated in the session worktree; the hook marks the exact bundle hash pending and injects the required confirmation instruction.
    - Explicit user confirmation creates a session-local exact-hash receipt; any later bundle edit invalidates it and deploy checks the receipt before integration.
    - specify creates or migrates a complete Schema V3 spec with specification_refs and affected assertion IDs.
    - Tests derive from models, constraints, examples, assertions, forbidden behavior, and required surfaces.
    - Test metadata points to stable assertion IDs; contracts.py generates reverse indexes and fingerprints.
    - Implementation proceeds through applicable REST API, CLI, SDKs, and GUI gates and loops until evidence is current.
    - Post-edit hook warns when a changed test lacks mapping; deploy gate blocks unresolved changed tests.
    - Generated docs rebuild from approved contracts; curated docs impact is resolved in the spec.
    - Deploy writes contract-aware commit metadata; releases aggregate it; completed cooled specs move to archive.
  affected_files:
    - path: contracts/
      reason: Add schemas, shared model/architecture/feature bundles, and generated registries/indexes.
    - path: scripts/specifications.py
      reason: Provide the single deterministic validation, indexing, coverage, evidence, docs, archive, and trace CLI.
    - path: scripts/plan_validate.py
      reason: Add additive Schema V3 contract reference and impact validation while preserving V1/V2.
    - path: scripts/plan_verify.py
      reason: Verify current assertion fingerprints, documentation impact, and contract-aware completion evidence.
    - path: scripts/sessions.py
      reason: Add changed-test contract checks and commit metadata enforcement to scoped deploy.
    - path: scripts/release_catalog.py
      reason: Include deterministic contract implementation and assertion summaries in release metadata.
    - path: .claude/hooks/contract-test-impact.sh
      reason: Warn after changed unmapped tests, inject contract approval instructions, and delegate deterministic decisions to scripts/specifications.py.
    - path: .claude/settings.json
      reason: Register the canonical post-edit contract-test impact hook.
    - path: .codex/hooks/claude-hook-bridge.sh
      reason: Bridge canonical contract-test impact warnings for Codex.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Bridge canonical contract-test impact warnings for OpenCode without duplicating policy.
    - path: AGENTS.md
      reason: Add concise source-of-truth, approval, spec linkage, test metadata, parity, and commit rules.
    - path: docs/contributing/guides/agent-workflow-core.md
      reason: Explain progressive contract discovery and evidence workflow concisely.
    - path: docs/contributing/guides/spec-driven-development.md
      reason: Define contract-before-spec, Schema V3, implementation-only changes, and archive lifecycle.
    - path: docs/contributing/guides/testing.md
      reason: Define per-test assertion metadata, proof classes, surface metadata, and changed-test ratchet.
    - path: docs/plans/README.md
      reason: Clarify active versus archived specs and permanent contract references.
    - path: docs/architecture/semantic/
      reason: Add concise Markdown semantic indexes/pages with structured frontmatter and optional ASCII diagrams.
    - path: .claude/skills/define-specification/SKILL.md
      reason: Add optimized discovery, drafting, full presentation, approval, and validation workflow.
    - path: .claude/skills/backfill-specification/SKILL.md
      reason: Extract proposed contracts from existing spec/test clusters after searching approved contracts.
    - path: .claude/skills/create-plan/SKILL.md
      reason: Require approved contracts before Schema V3 full specs.
    - path: .claude/skills/create-plan/SKILL.md
      reason: Map implementation slices to permanent assertions and surfaces.
    - path: .claude/skills/tasks-from-plan/SKILL.md
