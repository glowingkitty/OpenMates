      reason: Test fingerprints, stale evidence, proof classes, and parity.
    - path: scripts/tests/test_contract_backfill_hook.py
      reason: Test warn-only edit behavior and cross-runtime hook parity.
    - path: scripts/tests/test_sessions_contract_gate.py
      reason: Test deploy blocking, legacy scope, and commit metadata.
    - path: scripts/tests/test_contract_docs.py
