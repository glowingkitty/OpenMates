decisions:
  - id: D-1
    status: active
    decision: Keep approved contracts separate from full implementation specs.
    reason: Contracts define permanent truth while specs retain changing implementation plans, proof locations, attempts, and evidence.
    decided_at: "2026-08-07"
  - id: D-2
    status: active
    decision: Use compact contract.yml files with separately loaded examples.yml files.
    reason: Contracts must remain precise without overwhelming human or agent context; examples remain approval-bound but are loaded when needed.
    decided_at: "2026-08-07"
  - id: D-3
    status: active
    decision: Implement all contract tooling in one scripts/specifications.py command surface.
    reason: One script with subcommands is easier to discover and maintain than multiple narrowly named contract scripts.
    decided_at: "2026-08-07"
  - id: D-4
    status: active
    decision: Do not add contract references to production source headers.
    reason: Source annotations would over-couple permanent truth to disposable implementation structure and add maintenance noise.
    decided_at: "2026-08-07"
  - id: D-5
    status: active
    decision: Extend the current full-spec ledger through Schema V3 rather than replace it.
    reason: Existing Schema V2 discovery, approvals, decisions, attempts, tasks, handoff, and evidence remain valuable; V3 adds permanent contract references and impact fields.
    decided_at: "2026-08-07"
  - id: D-6
    status: active
    decision: Use specification_refs for permanent bundle references in Schema V3.
    reason: Many existing specs already use contracts as embedded prose, so reusing that key would create ambiguous migration and validation behavior.
    decided_at: "2026-08-07"
  - id: D-7
    status: active
    decision: Require changed behavioral tests to link stable assertion IDs and classify non-behavioral tests explicitly.
    reason: Assertion links create reverse proof discovery without forcing meaningless product assertions onto test infrastructure.
    decided_at: "2026-08-07"
  - id: D-8
    status: active
    decision: Warn after editing an unmapped test and block deploy only if the changed test remains unresolved.
    reason: Immediate edit blocking would interfere with intermediate edits, while deploy blocking provides a durable no-regression guarantee.
    decided_at: "2026-08-07"
  - id: D-9
    status: active
    decision: Search approved contracts before creating a backfill contract.
    reason: Existing assertions should be reused and shared rules should not be duplicated merely because a legacy test is touched.
    decided_at: "2026-08-07"
  - id: D-10
    status: active
    decision: Archive completed cooled specs and never automatically delete them.
    reason: Archived specs preserve implementation history, rejected approaches, proof locations, and contract change rationale without polluting default context.
    decided_at: "2026-08-07"
  - id: D-11
    status: active
    decision: Use each session worktree as the contract proposal boundary and require an exact-hash approval receipt before deploy.
    reason: Worktrees already isolate proposed edits, so a separate proposals directory would duplicate lifecycle state and add unnecessary complexity.
    decided_at: "2026-08-07"

attempts:
