contracts:
  source_of_truth:
    - Approved permanent contracts outrank specs, tests, docs, and implementation code when meanings conflict.
    - Code and tests must not silently redefine approved product behavior.
  compact_bundle:
    - contract.yml contains concise models, constraints, assertions, surfaces, exceptions, and example references.
    - examples.yml contains valid, invalid, output, error, and boundary examples and is included in the approved bundle fingerprint.
    - Shared rules are referenced from model and architecture contracts rather than copied into every feature contract.
  approval:
    - New features and semantic amendments require full contract presentation and explicit human approval before specification and implementation.
    - Implementation-only changes may reference an existing approved contract without renewed semantic approval.
    - The session worktree is the proposal boundary; no separate proposals directory is used.
    - New contracts require the complete contract.yml to be quoted in chat; modifications require every explicit contract and examples change to be quoted.
    - Approval receipts are session-local, exact-bundle-hash-bound, invalidated by later edits, and required before deploy.
  tests:
    - Every new or changed behavioral test case names valid assertion IDs, proof strength, and surface.
    - Infrastructure and tooling tests use explicit classifications instead of fabricated product assertions.
    - Assertion links do not count as proof without successful current evidence.
  backfill:
    - Touched unmapped tests warn after edit and block deploy while unresolved.
    - Existing contracts are searched before a new draft contract is created.
    - Untouched legacy tests remain measurable debt during staged migration.
  history:
    - Specs retain concrete implementation/test locations, attempts, and evidence.
    - Commits and releases reference contract versions and assertions.
    - Completed specs are archived and never automatically deleted.
  privacy_security:
    - Generated indexes, evidence, commits, and release metadata contain repository identifiers only and no secrets, private prompts, user data, or raw logs.

