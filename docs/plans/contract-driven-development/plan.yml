schema_version: 2
id: contract-driven-development
title: Contract-Driven Development And Incremental Coverage
status: verified

goal: >
  Make compact, human-approved contracts the durable source of truth for
  OpenMates features, data models, architecture boundaries, and platform parity,
  while retaining full executable specs as implementation ledgers and using
  assertion-linked tests, deterministic hooks, commits, and releases to prove
  that disposable implementations satisfy the approved behavior.

scope:
  in:
    - Compact versioned contract bundles with contract.yml plus separately loaded examples.yml.
    - Shared model, architecture, and feature contract namespaces with globally stable IDs.
    - Explicit field types, constraints, relationships, required and forbidden behavior, errors, and assertion IDs.
    - Canonical surfaces REST API, CLI, SDKs, and GUI, with mandatory npm/pip and web/Apple subsurface parity where applicable.
    - Full contract presentation and explicit human approval before a new feature or semantic contract amendment proceeds to implementation specification.
    - Worktree-native contract approval receipts bound to the exact current contract bundle hash.
    - Post-edit contract hooks that inject an explicit confirmation instruction and deploy gates that reject missing or stale approval receipts.
    - Schema V3 as an additive extension of the existing Schema V2 full-spec ledger, preserving existing discovery, scenarios, acceptance criteria, decisions, attempts, tasks, handoff, and evidence.
    - One scripts/specifications.py command surface for validation, registry generation, test inspection, coverage, evidence verification, docs generation, spec archiving, and commit/release summaries.
    - Per-test contract assertion metadata for Playwright, Vitest, pytest, CLI, SDK, Apple, deterministic audit, and other behavioral tests.
    - A generated assertion-to-test evidence index with assertion fingerprints and surface-specific direct/supporting proof.
    - A post-edit warning for touched unmapped tests and a blocking deploy gate when changed tests remain unresolved.
    - Incremental backfill from existing specs and tests, searching existing contracts before invoking a contract-definition skill.
    - Contract references in implementation specs, git commit trailers, and release metadata without contract comments in product source headers.
    - Generated contract reference docs plus explicit impact handling for curated semantic architecture and user documentation.
    - Archival, never deletion, of completed cooled implementation specs.
    - Claude Code canonical skill/hook authoring with synchronized OpenCode and Codex coverage.
  out:
    - Immediate manual migration of every existing spec or test.
    - Contract references in production code headers, functions, classes, or modules.
    - Automatic semantic changes to approved contracts based on implementation code.
    - Treating current code or existing tests as approved product truth without human review.
    - Replacing Schema V1 or V2 specs, deleting historical specs, or flattening full specs into short temporary records.
    - Product REST API, database, encryption, billing, app-skill, GUI, CLI, or SDK behavior changes.
    - A product-facing contract editor or contract-management API.
    - Loading every contract, examples file, semantic page, archived spec, or commit into every agent context.
    - Mermaid diagrams in the semantic layer; readable ASCII diagrams are allowed.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401 during discovery; no tracker issue is linked to this specification.
    - gh issue search for contract assertions and spec-driven development returned no matching issue.
  docs:
    - AGENTS.md
    - docs/contributing/guides/agent-workflow-core.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/testing.md
    - docs/plans/README.md
    - docs/plans/sdd-v2/plan.yml
    - docs/plans/deterministic-workflow-guardrails/plan.yml
    - docs/plans/agent-workflow-quality-parity/plan.yml
    - docs/architecture/README.md
    - docs/architecture/platforms/cli-feature-parity.md
    - docs/architecture/apple/parity-matrix.md
  code_patterns:
    - scripts/plan_validate.py validates Schema V1 and V2 full specs and their test/evidence references.
    - scripts/plan_verify.py checks recorded evidence provenance and stale subject commits.
    - scripts/sessions.py discovers related tests and owns deploy-time test gates.
    - .claude/hooks/docs-claims-impact.sh demonstrates a non-blocking post-edit impact reminder.
    - .claude/hooks/tdd-session-context.sh injects concise test-first context for feature and bug sessions.
    - .codex/hooks/claude-hook-bridge.sh and .opencode/plugins/openmates-hooks.js bridge canonical Claude hooks across runtimes.
    - scripts/sync_agent_parity.py synchronizes canonical Claude skills and agents into OpenCode/Codex mirrors.
    - Existing full specs commonly use top-level contracts as embedded prose, so permanent contract references need a distinct Schema V3 field.
  tests:
    - scripts/tests/test_spec_workflow_validation.py
    - scripts/tests/test_opencode_spec_workflow_audit.py
    - scripts/tests/test_agent_tooling_parity_audit.py
    - scripts/tests/test_opencode_hooks_contract.mjs
    - scripts/tests/test_sessions_worktree_deploy.py
    - scripts/tests/test_docs_claims_hook.py
  current_findings:
    - Existing Schema V2 already provides durable tasks, approvals, attempts, handoff, and evidence invalidation and should be extended rather than replaced.
    - Existing spec test records use free-text assertions but do not resolve stable permanent contract assertion IDs.
    - Existing tests do not have one uniform machine-readable assertion annotation across TypeScript, Python, and Swift.
    - The post-edit hook bridge is intentionally non-blocking, while durable checks belong at verification and deploy time.

apple_impact:
  affected_files:
    - apple test files when incrementally annotated during later backfill
  parity_expectations:
    - The workflow treats GUI as one surface with web and Apple implementations that require semantic parity unless an approved contract exception exists.
    - This implementation changes repository tooling only and does not alter Apple product behavior.
  verification:
    - Apple product build or runtime verification is not required for this repository-tooling implementation.
    - Contract parser fixtures must cover the selected Swift/XCTest annotation form before Apple test backfill begins.
  intentional_native_differences:
    - XCTest metadata syntax may differ from TypeScript and Python syntax while resolving to the same assertion record model.

clarification:
  rounds:
    - question: What should remain fixed when implementations can be replaced or compared?
      answer: >
        Approved feature contracts, architecture contracts, data models, examples,
        and assertions are the fixed point; implementation code and specs are
        expected to evolve and may be replaced when a new implementation proves
        the same contract more effectively.
    - question: How should contracts connect to changing implementation code?
      answer: >
        Link contracts through full specs, test proof metadata, git commits, and
        releases. Do not require contract references in product source headers.
    - question: How should completed implementation specs be retained?
      answer: Archive completed specs after a cooling period and never auto-delete them.
    - question: How should platform surfaces be represented?
      answer: >
        Use REST API, CLI, SDKs, and GUI as canonical surfaces. SDKs contains npm
        and pip implementations; GUI contains web and Apple implementations.
        Parity is required by default, with explicit approved subsurface exceptions.
    - question: How should touched unmapped tests drive incremental backfill?
      answer: >
        Warn immediately after edit and block deploy if unresolved. The agent must
        search for relevant contracts first and invoke the optimized contract
        creation skill only when no approved contract covers the intended behavior.
  vision_summary: >
    OpenMates should begin feature development from concise, approved, testable
    truth rather than from implementation code. Full specs remain the detailed
    implementation/evidence ledger, while stable contract assertions and examples
    allow agents to derive black-box tests, loop until every applicable surface is
    verified, and replace implementations with limited consequence.
  approved_by_user: true

