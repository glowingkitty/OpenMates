scenarios:
  - id: S-1
    title: Human approves a compact contract before a new feature spec
    given:
      - An agent is asked to add a new app skill with no approved feature contract.
      - Relevant shared model and architecture contracts have been discovered.
    when:
      - The agent runs the contract-definition workflow.
    then:
      - The agent drafts compact contract.yml and separate examples.yml files.
      - The complete contract.yml and concise examples summary are shown in chat.
      - Implementation specification and product code changes wait for explicit human approval.
      - Approval binds both files through a deterministic bundle fingerprint.

  - id: S-2
    title: Semantic behavior change cannot silently rewrite approved truth
    given:
      - An approved contract limits a field to 20 results.
      - An implementation request would increase the limit to 50.
    when:
      - The agent classifies contract impact before implementation.
    then:
      - The change is classified as a semantic contract amendment.
      - The complete revised contract is shown for approval before its spec proceeds.
      - The agent may not edit the contract automatically merely because code or tests accept 50.
      - A new approved contract version invalidates affected assertion evidence.

  - id: S-3
    title: Replacement implementation preserves a fixed contract
    given:
      - A feature has an approved contract and current cross-surface assertion suite.
      - An agent replaces its provider or internal implementation.
    when:
      - The implementation-only spec identifies affected assertions.
    then:
      - The approved contract remains unchanged.
      - The replacement is accepted only when current direct evidence proves all affected assertions and required surfaces.
      - Alternative implementations can be compared using the same observable contract suite.

  - id: S-4
    title: Contract bundles remain concise and progressively loaded
    given:
      - A feature contract has models, constraints, assertions, surfaces, and many examples.
    when:
      - An agent starts ordinary feature discovery.
    then:
      - contract.yml is loaded before examples.yml.
      - examples.yml is loaded for test derivation, ambiguity resolution, amendment review, or verification.
      - Shared model and architecture rules are referenced instead of copied.
      - Mermaid is absent from semantic pages; optional diagrams use readable ASCII.

  - id: S-5
    title: Platform parity is explicit and default-on
    given:
      - A feature applies to programmatic and graphical clients.
    when:
      - Its surfaces are declared and verified.
    then:
      - REST API and CLI applicability is explicit.
      - SDKs is one surface with npm and pip implementations that preserve strict capability and model parity.
      - GUI is one surface with web and Apple implementations that preserve semantic capability and outcome parity.
      - A missing implementation is a parity gap unless an approved exception records the platform-owned reason and equivalent outcome.

  - id: S-6
    title: Every touched behavioral test identifies the assertions it proves
    given:
      - A contributor edits a Playwright, Vitest, pytest, CLI, SDK, Swift, or deterministic behavioral test.
    when:
      - Contract test metadata is inspected.
    then:
      - Every changed behavioral test case names one or more valid stable assertion IDs.
      - Each link classifies direct or supporting proof and the exercised surface.
      - Non-behavioral tests use an explicit infrastructure or tooling classification rather than a fabricated product assertion.
      - New or changed tests cannot use the legacy_unmapped classification.

  - id: S-7
    title: Touched legacy test triggers incremental contract backfill
    given:
      - A legacy test is edited and has no valid assertion metadata.
    when:
      - The post-edit contract hook runs.
    then:
      - The edit is allowed and an actionable warning identifies the unmapped test.
      - The warning directs the agent to run scripts/specifications.py check-test for the changed path.
      - The agent searches the generated contract registry and relevant semantic layer first.
      - If no approved contract applies, the agent invokes the contract-definition skill and waits for approval.
      - Deployment remains blocked until every changed test is mapped or explicitly classified as non-behavioral.

  - id: S-8
    title: Generated assertion index provides reverse proof discovery
    given:
      - Tests across multiple frameworks reference stable assertion IDs.
    when:
      - The contracts index command runs.
    then:
      - Each assertion maps to its contract, fingerprint, direct tests, supporting tests, surfaces, evidence runs, and current status.
      - Unknown assertion IDs, duplicate global IDs, malformed metadata, and missing required surfaces fail validation.
      - Generated indexes are deterministic and are not manually edited.

  - id: S-9
    title: Contract changes invalidate stale evidence precisely
    given:
      - An assertion has passing evidence for its current models, examples, and surface requirements.
    when:
      - A relevant assertion, model constraint, example, error, surface, or exception changes.
    then:
      - The assertion fingerprint changes.
      - Prior evidence remains historical but no longer proves the current assertion.
      - Unaffected assertions retain valid evidence when their fingerprints remain unchanged.

  - id: S-10
    title: Existing full specs become contract-aware without losing detail
    given:
      - A current Schema V2 spec contains discovery, scenarios, acceptance criteria, tasks, attempts, handoff, tests, and evidence.
    when:
      - It is materially resumed after the contract workflow is released.
    then:
      - It migrates to Schema V3 without losing existing ledger content.
      - specification_refs identifies approved bundles and versions.
      - Contract impact, affected assertion IDs, docs impact, and assertion-linked acceptance criteria are added.
      - Concrete implementation and test filenames remain in the spec rather than permanent contracts.

  - id: S-11
    title: Documentation stays aligned without automatic semantic rewriting
    given:
      - A contract-governed implementation changes.
    when:
      - The spec classifies documentation impact.
    then:
      - Generated model, constraint, error, example, and platform reference docs rebuild from contracts when affected.
      - Curated user and semantic docs are updated only when their meaning changes.
      - Unchanged curated docs record a concise reason.
      - Deployment fails when required documentation impact remains unresolved.

  - id: S-12
    title: Commits and releases tell the contract implementation history
    given:
      - Contract-governed work is ready to commit or release.
    when:
      - The scoped deploy and release workflows run.
    then:
      - Commit metadata records contract IDs/versions, affected assertions, spec ID, and contract-impact classification.
      - Release metadata aggregates implemented contract versions, verified assertions, and approved exceptions from included commits.
      - No contract source-header annotations are required.

  - id: S-13
    title: Completed implementation specs are archived but never deleted
    given:
      - A full spec is complete, deployed or released, contract-linked, and past its cooling period.
    when:
      - The archive command runs.
    then:
      - The spec moves to a year-based archive with references preserved.
      - Archived specs are excluded from default agent loading but remain searchable.
      - No automated path deletes an archived spec.

  - id: S-14
    title: Contract coverage grows without blocking untouched legacy work
    given:
      - The repository contains many legacy specs and tests with no approved permanent contract.
    when:
      - Coverage reporting and staged enforcement are enabled.
    then:
      - New features and changed behavioral tests follow the strict workflow immediately.
      - Untouched legacy tests remain visible debt rather than blocking unrelated deploys.
      - Materially touched features must adopt or reference contracts.
      - Contract inventory, test mapping, assertion proof, and surface parity coverage never regress silently.

  - id: S-15
    title: Agents load only relevant contract context
    given:
      - The repository contains many contracts, example suites, semantic pages, and archived specs.
    when:
      - A new feature or bug session starts.
    then:
      - Agent instructions mention the registry and workflow without embedding all contract content.
      - The agent loads relevant compact contracts and active specs first.
      - Examples, related contracts, semantic pages, evidence, and history are loaded only when needed.

  - id: S-16
    title: Worktree contract edits require exact user approval before deploy
    given:
      - An agent creates or changes contract.yml or examples.yml in its isolated session worktree.
    when:
      - The post-edit contract approval hook and later deploy gate run.
    then:
      - The worktree edit is allowed but the session is marked contract_approval_pending for the exact bundle hash.
      - For a new contract, the injected system instruction requires the agent to quote the complete contract.yml in chat and request explicit user confirmation.
      - For an existing contract, the instruction requires the agent to quote every explicit contract and examples change and request explicit user confirmation.
      - After explicit confirmation, contracts.py records a session-local approval receipt for the exact current bundle hash.
      - Any later contract.yml or examples.yml change invalidates that receipt and retriggers confirmation.
      - Deploy cannot integrate missing, stale, mismatched, or unconfirmed contract changes into dev.
      - No separate contract proposals directory is created.

