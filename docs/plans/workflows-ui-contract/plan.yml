  plan_path: docs/plans/workflows-ui-contract/plan.yml
  specification_refs:
    - feature.workflows-ui@1
    - feature.workflows@2
    - feature.tasks@2
    - feature.workspace-shell@2
  affected_assertions:
    - workflows-ui.visual-language.coherent
    - workflows-ui.identity.automatic-category-icon
    - workflows-ui.workspace.recommendation-led-composition
    - workflows-ui.workspace.title-first-draft
    - workflows-ui.detail.stable-visual-header
    - workflows-ui.detail.shared-template-runs-tabs
    - workflows-ui.template.centered-in-place-editor
    - workflows-ui.template.explicit-guarded-save
    - workflows-ui.versions.timeline-readonly-restore-new
    - workflows-ui.runs.timeline-execution-detail
    - workflows-ui.responsive-accessible-reachable
  contract_change: semantic_change
  exact_surface_proof:
    - Real REST, CLI, npm SDK, and pip SDK calls against https://api.dev.openmates.org prove encrypted category/icon parity.
    - Deployed Playwright proves the authenticated /workflows creation, Template, versions, Runs, cancellation, and dirty-navigation behavior.
    - Reviewed 1440x900 laptop and 390x844 phone captures prove light/dark responsive visual quality.
    - Separate approved laptop and phone videos with toggleable device-scoped WebVTT captions prove the complete visual flow.
    - Real REST, existing CLI, and npm/pip SDK calls prove blank-draft and readiness behavior before deployed web proof.
    - Deployed 1440x900 and 390x844 proof covers blank creation, valid enable/manual run, exact live Tasks projection detail, and definition history.
  documentation_impact:
    - Regenerate contract and SDK references after metadata model changes.
    - Update docs/user-guide/workflows.md for creation, editing, versions, and Runs.
    - Update docs/architecture/platforms/tasks-v1.md for read-only Workflow-run projections and Tasks-owned responsive detail.
  architecture: >
    Extend the existing Workflow vertical slice. A small async WorkflowIdentityService
    resolves deterministic graph/app mappings first and calls only
    call_preprocessing_llm for ambiguous graphs. WorkflowService remains the sole
    encryption and persistence boundary. Existing REST routes, CLI/SDK clients,
    workspace store, and reusable Svelte components carry the additive metadata.
    One shared WorkflowGraphRenderer renders editable Template graphs, read-only
    historical graphs, and read-only run execution graphs. A pure readiness
    traversal in workflow_models/service validates the persisted graph through
    existing routes. WorkflowRunHistory uses store force-refresh methods and
    bounded exact-run polling. TasksPage owns responsive projection selection,
    keeping TaskBoard mounted while a reusable workspace detail shell applies
    the ActiveChat split/overlay principle without its global embed event/controller.
  existing_patterns:
    - Reuse WorkflowService encrypted blob storage, immutable versions, owner/team scoping, and run-retention behavior.
    - Reuse call_preprocessing_llm as a low-level structured-output seam, not handle_preprocessing or chat routing.
    - Reuse CATEGORY_GRADIENTS, CATEGORY_FALLBACK_ICONS, Lucide validation, SettingsTabs, WorkspaceHomeShell, and WorkspacePromptComposer.
    - Reuse hash-based Workflow selection and warm detail/run caches without remounting the selected Workflow.
  data_flow:
    - A create request for Daily weather check carries a title and manual or weather graph to POST /v1/workflows.
    - WorkflowIdentityService maps a weather app node directly to a supported category/icon; an ambiguous manual graph sends only title, description, node types, and app/skill IDs to the bounded classifier.
    - Invalid output or inference failure resolves general_knowledge/help-circle without failing creation or spending Workflow run credits.
    - WorkflowService encrypts category and icon as owner/team Vault blobs and persists only encrypted refs in Directus record_json and nullable encrypted metadata columns.
    - Authorized list/detail responses decrypt category/icon into WorkflowSummary and WorkflowDetail; CLI, SDKs, web, and existing additive Apple decoding receive the same response without ciphertext.
    - The web store caches selected run detail separately, while graph/version/run rendering receives one normalized graph plus read-only/editable execution state.
    - Create persists an empty disabled graph; readiness traversal gates enable and existing manual run before the runner creates a run or effect.
    - Each displayed run resolves one Task projection by workflow_run_id; selecting it force-refreshes only that exact run until terminal status.
  api_data_privacy:
    - Existing Workflow routes retain their first-party plus approved developer API-key access, owner/team checks, and 60/minute reads and 30/minute creates.
    - Graph-first assignment has no provider cost; ambiguous inference has bounded fallback-model attempts but no credit debit or Workflow budget charge.
    - Classifier input forbids credentials, node inputs, outputs, run content, and decrypted secret fields.
    - Development preprocessing logs redact category and icon arguments; production retains completion-only logging.
    - Existing records require no destructive backfill and hydrate with general_knowledge/help-circle until a later write persists encrypted identity.
  ui_boundaries:
    - Keep route orchestration and dirty-navigation decisions in +page.svelte.
    - Keep graph geometry and node expansion in WorkflowGraphRenderer.svelte.
    - Keep header and shared Template/Runs pill in WorkflowDetailPage.svelte using category gradient values passed by the route.
    - Keep version and run data loading in their focused components/store methods and render their graphs through WorkflowGraphRenderer.
    - Keep trigger authoring in WorkflowGraphRenderer and readiness rules in workflow_models/service, not in the route or renderer.
    - Keep selected Task projection state in TasksPage; TaskBoard and TaskCard expose callbacks, and direct /tasks/<id> remains compatible.
    - Use color-grey design tokens for reusable surfaces and horizontal overflow only for timelines on mobile.
  affected_files:
    - path: backend/shared/config/workflow_identity.json
      reason: Canonical supported category gradients, category fallback icons, and bounded Workflow icon choices shared by backend and web.
    - path: backend/apps/ai/utils/llm_utils.py
      reason: Redact category/icon structured arguments in development preprocessing logs.
    - path: backend/core/api/app/services/workflow_identity_service.py
      reason: Deterministic graph-first and bounded ambiguous identity resolution.
    - path: backend/core/api/app/services/workflow_models.py
      reason: Add category/icon response metadata.
    - path: backend/core/api/app/services/workflow_service.py
      reason: Encrypt, persist, hydrate, update, and clean up category/icon refs.
    - path: backend/core/api/app/routes/workflows.py
      reason: Validate optional identity inputs and invoke assignment for missing metadata.
    - path: backend/core/directus/schemas/workflows.yml
      reason: Add nullable encrypted category/icon metadata columns.
    - path: backend/tests/test_workflow_ui_identity.py
      reason: Red/green identity, encryption, fallback, logging, and existing-record coverage.
    - path: scripts/workflow_identity_real_test.py
      reason: Direct real-dev REST proof for auth and identity round trips before CLI and SDK gates.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Add npm SDK Workflow category/icon fields.
    - path: frontend/packages/openmates-cli/src/cli.ts
      reason: Render stable category/icon in Workflow list/detail output without ciphertext.
    - path: frontend/packages/openmates-cli/tests/workflows.test.ts
      reason: CLI contract coverage.
    - path: frontend/packages/openmates-cli/tests/workflows-real-sdk-dev.test.ts
      reason: Real npm SDK dev-server round-trip coverage.
    - path: packages/openmates-python/openmates/sdk.py
      reason: Preserve category/icon through the pip SDK Workflow facade.
    - path: packages/openmates-python/tests/test_workflows.py
      reason: Pip SDK unit contract coverage.
    - path: packages/openmates-python/tests/test_workflows_real_dev.py
      reason: Real pip SDK dev-server round-trip coverage.
    - path: frontend/packages/ui/src/utils/categoryUtils.ts
      reason: Consume the shared identity catalog while retaining existing exports.
    - path: frontend/packages/ui/src/stores/workflowWorkspaceStore.ts
      reason: Add identity fields and selected run-detail caching/actions.
    - path: frontend/packages/ui/src/components/workflows/WorkflowGraphRenderer.svelte
      reason: Shared editable/read-only/execution graph geometry.
    - path: frontend/packages/ui/src/components/workflows/WorkflowDetailPage.svelte
      reason: Category header and shared Template/Runs tabs.
    - path: frontend/packages/ui/src/components/workflows/WorkflowVersionHistory.svelte
