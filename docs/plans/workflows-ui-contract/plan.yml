apple_impact:
  affected_files:
    - none
  parity_expectations:
    - An existing Apple-native Workflow workspace consumes the shared additive API, but the approved workflows-ui contract explicitly defers Apple UI parity for this web-first implementation.
    - This amendment is web-only: Workflow activation readiness and Tasks responsive detail use existing backend contracts and do not require Apple UI parity.
  verification:
    - No Apple verification is required because no Apple surface or shared client contract changes in this slice.
  intentional_native_differences:
    - Existing Apple Workflow UI remains unchanged and visually behind the approved web contract until a separately approved native parity implementation.

clarification:
  rounds:
    - question: How strictly should implementation follow the source design when it conflicts with current components?
      answer: Preserve structural fidelity while implementing it through current OpenMates design-system primitives.
    - question: When should a new Workflow become persisted?
      answer: Persist a disabled title draft immediately; later graph edits require explicit Save or Undo.
    - question: What may users do with historical Workflow versions?
      answer: Inspect them read-only and restore one as a new current version after confirmation.
    - question: Which run states and controls are required?
      answer: Show the full run lifecycle including next, active, historical detail, unavailable content, and contextual cancellation.
    - question: How should Workflow category and icon be assigned automatically?
      answer: Resolve graph/app metadata first, use a bounded chat-style metadata fallback only for ambiguous graphs, and use general_knowledge/help-circle if assignment cannot produce valid metadata.
    - question: What is the initial persisted Workflow definition and activation threshold?
      answer: A disabled draft starts blank with zero triggers and zero steps; activation requires exactly one time/schedule trigger with a reachable qualifying side effect.
    - question: How should Workflow run items appear in Tasks?
      answer: Each run has one read-only projection keyed by workflow_run_id; selecting it keeps the board mounted and opens exact live run detail in the responsive Tasks surface.
  vision_summary: >
    The Workflows UI must stand on its own as a durable visual product contract.
    Workflow identity comes from encrypted category/icon metadata and existing
    category gradients; the editor and run views share one stable header, tabs,
    and graph language, with explicit persistence and detailed history. A blank
    draft never invents a trigger; only a time-triggered, effectful graph can
    enable and manually run. Runs are observable as read-only Tasks projections
    whose detail live-updates without losing the board context.
  approved_by_user: true

