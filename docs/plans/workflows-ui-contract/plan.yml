assumptions:
  - id: A-1
    text: Existing categoryUtils metadata can be moved or mirrored into a shared generated category catalog without introducing a second gradient source.
    category: design_system
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/utils/categoryUtils.ts
        summary: CATEGORY_GRADIENTS and CATEGORY_FALLBACK_ICONS already define software_development, general_knowledge, and other supported categories.
  - id: A-2
    text: Existing Workflow version and run APIs already supply immutable graph history, pinned run version IDs, per-node details, unavailable-content state, and cancellation.
    category: backend
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/routes/workflows.py
        summary: Existing version list/detail/restore and run list/detail/cancel routes are owner scoped.
      - source: backend/core/api/app/services/workflow_models.py
        summary: WorkflowRunDetail contains version_id, node statuses, input/output summaries, errors, and content availability.
  - id: A-3
    text: The low-level preprocessing LLM call can be reused through a bounded Workflow adapter after category/icon log redaction, without invoking chat preprocessing or sending credentials or node input values.
    category: privacy
    required_before: implementation
    status: corrected
    evidence:
      - source: backend/apps/ai/utils/llm_utils.py
        summary: call_preprocessing_llm returns structured arguments or an error, performs no credit debit, and requires category/icon development-log redaction before reuse.
      - source: backend/apps/ai/processing/preprocessor.py
        summary: Full chat preprocessing has routing and UI side effects and must not be called by Workflow identity assignment.
  - id: A-4
    text: SettingsTabs can serve as the existing shared icon-tab implementation outside Settings without changing its visual contract.
    category: frontend
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/components/settings/elements/SettingsTabs.svelte
        summary: Component is a generic icon-only tab bar with animated gradient selection, keyboard roles, and configurable test IDs.

contracts:
  api:
    - routes: ['POST /v1/workflows', 'PATCH /v1/workflows/{workflow_id}', 'GET /v1/workflows', 'GET /v1/workflows/{workflow_id}']
      access_model: first-party client surface plus existing approved developer API-key Workflow access
      auth: authenticated owner/team session or API key with existing workflow read/write scopes
      owner_team_scoping: existing hashed owner/team context checks remain mandatory
      rate_limits: existing Workflow read/write route limits
      credit_budget_limits: graph-first identity costs no credits; bounded metadata fallback consumes no Workflow run credits and failure uses deterministic fallback
      encryption_boundary: category and icon are encrypted with the Workflow owner Vault path at rest and returned decrypted only to authorized existing Workflow clients; classifier input excludes credentials, secrets, and node input values
      request_changes: create/update may accept validated category/icon only from approved first-party/SDK producers; missing values invoke server assignment
      response_changes: WorkflowSummary and WorkflowDetail include category and icon
    - routes: ['GET /v1/workflows/{workflow_id}/versions', 'GET /v1/workflows/{workflow_id}/versions/{version_id}', 'POST /v1/workflows/{workflow_id}/versions/{version_id}/restore']
      access_model: unchanged existing Workflow access
      auth: unchanged authenticated owner/team/API-key scope
      rate_limits: unchanged
      credit_budget_limits: none
      encryption_boundary: historical graph remains Automation Vault encrypted; identity is stable Workflow-level metadata
    - routes: ['GET /v1/workflows/{workflow_id}/runs', 'GET /v1/workflows/{workflow_id}/runs/{run_id}', 'POST /v1/workflows/{workflow_id}/runs/{run_id}/cancel']
      access_model: unchanged existing Workflow access
      auth: unchanged authenticated owner/team/API-key scope
      rate_limits: unchanged
      credit_budget_limits: cancellation/read do not spend credits
      encryption_boundary: retained run content remains encrypted and owner scoped; unavailable content is never fabricated
    - routes: ['POST /v1/workflows', 'PATCH /v1/workflows/{workflow_id}', 'POST /v1/workflows/{workflow_id}/run', 'GET /v1/workflows/{workflow_id}/runs/{run_id}', 'GET /v1/tasks/{task_id}']
      access_model: existing first-party client surface plus approved developer API-key Workflow access; Tasks projection detail remains authorized owner/team access
      auth: existing authenticated owner/team session or approved API key scope; no new public route
      rate_limits: existing Workflow and Tasks route limits; polling is client-bounded and stops at terminal run status
      credit_budget_limits: readiness validation and projection reads spend no credits; enabled manual runs retain existing budget behavior
      encryption_boundary: run detail is returned only through existing authorized decrypted Workflow/Tasks boundaries; no plaintext node data is added to Tasks summary cards
      request_changes: create persists an empty disabled graph; update/enable validates readiness; manual run uses the existing enabled Workflow route
      response_changes: no new endpoint; existing run and Task projection payloads expose lifecycle status needed by the responsive detail
  data:
    - Add encrypted_category and encrypted_icon nullable text fields to workflows; existing records remain valid and resolve general_knowledge/help-circle until backfilled on write or bounded migration.
    - Store only encrypted metadata and encrypted refs in Directus and record_json; never add plaintext category/icon indexes.
    - Keep category/icon stable at Workflow level across immutable graph versions and runs.
    - Normal deletion remains the existing restorable soft-delete and retains encrypted metadata under Workflow history retention; temporary-expiry cleanup removes category/icon blobs with the other Workflow blobs.
    - A new persisted disabled Workflow stores an empty graph with zero triggers and zero steps; no server default trigger is created.
    - Readiness derives from graph traversal and is not persisted as an independent mutable flag; exactly one time/schedule trigger must reach a qualifying effect node.
    - One Tasks projection is keyed by workflow_run_id for each displayed Workflow run; node rows are run-detail data and never Tasks items.
  ui_states:
    - Workspace loading, empty, recent cards, show all, and creation error.
    - New disabled draft, current Template, dirty Template, expanded node, historical read-only version, restore confirmation.
    - Runs empty, next-only, selected completed, selected failed, selected active, expired content, cancellation confirmation.
    - Desktop/mobile, light/dark, reduced motion, API error, and metadata fallback identity.
    - Blank draft, invalid readiness, enabled/manual-running, Task projection selected, polling active, terminal run, responsive split detail, and mobile full-screen overlay.
  privacy_security:
    - Category/icon can reveal Workflow purpose and therefore use the same encrypted owner/team Vault boundary as title and description.
    - Metadata fallback receives only title, description, node types, and app/skill identifiers; node input values, credentials, run content, and outputs are forbidden.
    - Logs and notifications contain no decrypted title, category, icon, graph, input, output, or error payload.
    - Polling requests use existing owner/team-scoped exact run detail and stop on terminal lifecycle status or component disposal.

