  migration_rollout:
    - Apply additive nullable Directus encrypted metadata fields before API verification.
    - Do not bulk-decrypt or backfill existing Workflow records; use read fallback and persist identity on a later write.
    - Restart the local Docker-backed API through sessions.py before real dev-server REST, CLI, and SDK probes.
  observability:
    - Log only assignment path, success/fallback/error class, attempt count, and hashed Workflow/task identifiers.
    - Never log decrypted title, category, icon, graph, classifier payload, node input/output, or provider raw arguments.
  assumptions_before_implementation:
    - A-1, A-2, and A-4 are confirmed from existing source.
    - A-3 is corrected and confirmed by using only call_preprocessing_llm after category/icon redaction.
  acceptance_coverage:
    - AC-1 and AC-8 use backend identity tests plus real REST, CLI, npm SDK, and pip SDK evidence.
    - AC-2 through AC-6 use the UI build and deployed Workflows Playwright spec.
    - AC-9 uses red/green readiness tests, real dev REST, CLI, and npm/pip SDK checks.
    - AC-10 and AC-11 use deployed proof flows, reviewed visual smoke, separate laptop/phone videos, and user confirmation where applicable.
    - AC-7 uses Playwright checkpoints, reviewed laptop/mobile visual smoke, separate proof videos, and user confirmation.
  risks:
    - Provider fallback attempts can add latency to ambiguous creation; deterministic mappings and a hard timeout keep creation bounded.
    - Shared graph extraction can regress existing editing; component-level build checks and deployed edit/version/run flows gate rollout.
    - Existing Apple Workflow UI is intentionally behind the new web contract; additive decoding compatibility is preserved and visual parity remains deferred by the approved permanent contract.
    - Bounded polling must stop for terminal status and teardown to avoid background reads after Tasks detail closes.
  open_questions:
    - none
  separate_technical_approval: not_required
  verification_strategy:
    - Run python3 -m pytest backend/tests/test_workflow_ui_identity.py backend/tests/test_workflow_core_ui_contract.py backend/tests/test_workflow_runner.py -q for backend red/green evidence.
    - Restart the API and run a real authenticated REST create/list/detail/update probe including unauthorized behavior against https://api.dev.openmates.org.
    - Run real OpenMates CLI Workflow create/show/list/update commands against the dev API before SDK gates.
    - Run readiness create/update/enable/manual-run checks through REST, existing CLI, and npm/pip SDKs against https://api.dev.openmates.org before web implementation.
    - Run npm and pip SDK real-dev Workflow tests and python3 scripts/audit_sdk_cli_parity.py before web work.
    - Write and deploy workflows-ui-contract.spec.ts red before UI implementation, then deploy and rerun it green with an expected commit.
    - Write/deploy red then green workflows-ready-run-tasks.spec.ts and workflows-definition-history.spec.ts against the exact deployed commit.
    - Build the UI package and review laptop/mobile deployed visual-smoke screenshots before proof capture.
    - Run python3 scripts/plan_verify.py docs/plans/workflows-ui-contract/plan.yml --phase complete --json before completion.
  verification_order:
    - REST API
    - OpenMates CLI
    - npm SDK and pip SDK
    - GitHub Actions parity reproduction
    - Web build and deployed Playwright
    - Laptop and mobile visual smoke
    - Separate laptop and phone proof videos
    - User confirmation
    - Apple UI skipped under approved contract; static additive decoding audit only
  demonstration_plan:
    capture_source: Passing deployed workflows-ui-contract.spec.ts recordings at 1440x900 and 390x844.
    captions: Write exact device-scoped hash-bound WebVTT only after normal green gates; captions default on, remain toggleable, and never reduce or obscure clean frames.
    audio: Optional; retain provenance if narration audio is added.
    frame_review: Review bounded frames every three seconds plus action/state/caption boundaries; never put the full video in model context.
    privacy: Do not run proof-specific PII or sensitive-data detection or replacement; use only intentionally shareable test-account evidence.
    repair_routing: Objective defects return to test, implementation, deploy, source rerun, and replacement recording.
    retention: Publish approved media and captions through scripts/opencode_response_media.py with 48-hour response-media expiry.
    response_embedding: Paste both returned laptop and phone video HTML snippets verbatim in the task-closing response.

