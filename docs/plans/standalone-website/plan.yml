schema_version: 2
id: standalone-website
title: Standalone public website and landing refinements
status: implementing
goal: 'Guide me through setting up the separate Vercel landingpage that loads only the landingpage
  so it stays slim and fast loading, including news, blog and legal pages, and fix the reported landing
  UI issues, newsletter signup, events links and signed-out workflow template visibility.

  '
scope:
  in:
  - Separate website SvelteKit build with minimal shared public UI and canonical public content.
  - Single seamless app rail, icon-only navigation, language control, theme startup and user bubbles.
  - Large real screenshots in SVG devices with restrained motion and reduced-motion support.
  - Selected newsletter categories through confirmed double opt-in and post-confirmation Signal link.
  - All upcoming events with actual app detail links, social footer and human SEO event forwarding.
  - Guest template browsing and completed-auth signup-link handling, preserving owned workflow boundaries.
  - Scoped dev publication and exact Vercel setup instructions.
  out:
  - Production domain transfer or DNS/auth migration.
  - Anonymous execution of scheduled or chat-delivery workflows.
  - Native Apple screenshots or native category controls.
authorization:
  source: User approved all three review PDFs on 2026-10-08 in Codex chat 01a116b9-306b-7940-beae-99d10025f62a.
  specifications:
  - feature.marketing-landing@2
  - feature.newsletter@2
  - feature.workflows-ui@9
  mobile_images: User approved mobile web screenshots until native captures are supplied.
verification:
  required:
  - Focused local build, unit and lint checks for changed modules.
  - Standalone website build module boundary and compressed client-size report.
  - Isolated GitHub component proof before broader route proof.
  - Relevant isolated newsletter, guest-workflow, auth-link and public-page browser/API coverage.
  - Scoped dev deployment with reviewed landing laptop/mobile visual smoke.
  - All retained browser recordings linked in final response.
decisions:
- id: D-1
  status: active
  decision: Use frontend/apps/website and frontend/packages/public-site; avoid importing the web app
    runtime or heavy UI package into the website client.
  reason: Separate entry points enforce the requested public-site dependency boundary.
  decided_at: '2026-10-08'
- id: D-2
  status: active
  decision: Use landing.dev.openmates.org for dev, openmates.org for the eventual production website,
    and app.openmates.org for the production app.
  reason: Preserve app.dev.openmates.org and rehearse website isolation before production domain transfer.
  decided_at: '2026-10-08'
scenarios:
- id: S-1
  title: Explore the standalone website
  given:
  - A signed-out visitor opens the website.
  when:
  - They browse features and public content at their own pace.
  then:
  - The site stays readable, independently built and responsive, and app links reach their intended
    workspaces.
- id: S-2
  title: Confirm signup and inspect workflows
  given:
  - A visitor selects newsletter categories or opens workflow templates.
  when:
  - They confirm the emailed token or inspect a template while signed out.
  then:
  - Only confirmed categories activate; templates remain read-only until authentication.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: The website client excludes app runtime modules, renders full public/legal content and the
    approved responsive landing UI.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: playwright
  verification_ids: [T-COMPONENT, T-WEBSITE-PUBLIC, T-BUILD]
- id: AC-2
  scenario: S-2
  text: Selected categories activate only after confirmation, Signal follows success, and guest templates
    expose no owned actions or API requests.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: playwright
  verification_ids: [T-NEWSLETTER, T-NEWSLETTER-FLOW, T-WORKFLOW-COMP]
- id: AC-3
  scenario: S-1
  text: App destinations, event forwarding and saved theme startup behave correctly, with dev publication
    and exact Vercel guidance.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: playwright
  verification_ids: [T-ROUTE, T-EVENTS, T-AUTH]
