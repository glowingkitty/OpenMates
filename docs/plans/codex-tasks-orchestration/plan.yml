scenarios:
- id: S-1
  title: Use the existing Project at remote-access startup
  given:
  - The OpenMates Project exists but this folder has no saved association.
  when:
  - Start remote-access in Zellij and select that existing Project and a cache directory.
  then:
  - The process hosts remote files and syncs Tasks without creating a duplicate Project; stopping and restarting
    catches up.
- id: S-2
  title: Create and claim without duplicate ownership
  given:
  - A Codex conversation knows its own ID and an authenticated runtime identifies that caller.
  when:
  - Create a Task with its external-chat link, then attempt a competing claim through CLI and direct API.
  then:
  - Create-and-link is one mutation; same-owner retry is idempotent; competing claims are rejected with quoted owner
    title and ID. Ordinary CLI creation stays unlinked; native skill creation defaults to its native chat.
- id: S-3
  title: Push a web edit into local context
  given:
  - Remote access has a consistent Project snapshot and an active subscription.
  when:
  - Edit a Task, activity or dependency from another supported client.
  then:
  - The authorized device receives the committed change and updates complete atomic files without agent polling,
    including removal and restoration events.
- id: S-4
  title: Recover a gap without stale resurrection
  given:
  - A device disconnects while Tasks are changed, deleted or moved between Projects.
  when:
  - Reconnect using its saved cursor, including a case where replay history has expired.
  then:
  - Replay or a fresh snapshot recovers exact current membership and latest activity; duplicate events and old versions
    cannot resurrect deleted data.
- id: S-5
  title: Every conversation sees all linked Tasks
  given:
  - A worker has twelve linked Tasks and its orchestrator manages two workers.
  when:
  - Start, resume, compact, and continue their turns while Tasks change.
  then:
  - All Tasks and full titles remain represented; descriptions and only the latest activity are shortened; unchanged
    tool calls inject nothing and perform no network read.
- id: S-6
  title: Resume the dependent worker directly
  given:
  - A worker is idle waiting for Task dependencies; another worker is active and one is deliberately paused.
  when:
  - Complete the last dependency, then replay that event and race delivery with turn completion.
  then:
  - Only eligible owners resume; active workers receive a delta; paused workers and unrelated approval blockers
    remain untouched. Routine delivery does not wake the orchestrator.
- id: S-7
  title: Tolerate restart and uncertain acknowledgments
  given:
  - Owned work is approved and local delivery intents are persisted.
  when:
  - Stop the isolated API, lose a successful response, restart the local process, and restore connectivity.
  then:
  - Owned work continues; writes remain visibly pending and recover without duplicate Tasks/activity. New claims
    wait for acknowledgment. Repeated delayed failures produce one persistent-sync notice rather than Stop-hook
    loops.
- id: S-8
  title: Route GitHub results to their owner
  given:
  - Two workers submitted different immutable candidates through the existing CI coordinator.
  when:
  - Their runs finish with one pass and one failure while both workers are idle.
  then:
  - Each owner receives its own cached result and subject/harness evidence once; no worker polls GitHub independently
    and a pass does not automatically mark its Task done.
- id: S-9
  title: Delete a conversation without deleting work
  given:
  - A native or Codex conversation owns in-progress, blocked and completed Tasks and has Plan links.
  when:
  - Confirm actual deletion, including cleanup after an integration outage.
  then:
  - Remove links and cancel stale wakeups; in-progress becomes todo, done remains done, independent blockers remain.
    Preserve records and decryption access; archiving/offline status does not trigger deletion cleanup.
- id: S-10
  title: Cut over one campaign safely
  given:
  - One coordinator and two visible workers use the released global CLI and isolated worktrees.
  when:
  - Enable the new adapter for their exact identities and exercise edits, outage, dependency and CI paths.
  then:
  - Only one delivery owner and context writer operate per worker. Old lifecycle/table hooks do not loop. Evidence
    is reviewable, context is readable, and rollback retains Tasks and pending writes.
