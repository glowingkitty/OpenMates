schema_version: 2
profile: strict
id: codex-tasks-orchestration
title: Task-driven Codex orchestration with remote-access sync
status: draft
goal: Resume reliable OpenMates engineering work using native Task ownership, continuously synced local context,
  durable delayed delivery and the existing isolated GitHub CI coordinator, without routine orchestration model
  polling.
scope:
  in:
  - 'Existing Task model: exclusive conversation ownership, create-with-link, explicit release and confirmed deletion
    cleanup.'
  - Project-scoped encrypted push sync hosted by foreground remote-access in Zellij.
  - Local atomic text views, durable outbox, Codex injection and direct dependency/CI result routing.
  - Small real pilot, matched installed CLI release and safe migration of old orchestration hooks.
  out:
  - Native Plans/Specifications/Checks product adoption beyond necessary existing-link deletion cleanup.
  - Automatic OS-service startup, a new CI scheduler, per-worktree dev containers, or shared-dev E2E.
  - Large-scale benchmarking, a hosting-provider migration or rewriting unrelated remote-access code.
  - Production deployment, mass worker creation or bulk audio generation during planning.
  - New Task fields or a second manually maintained work-state database.
authorization:
  planning: Requested in this Mac conversation after ten answered clarification rounds.
  behavior: Agreed decisions recorded in architecture-refinements.md.
  implementation: Authorized in Mac conversation 01a08237-d30e-76b3-af1d-7355e9e3ede6; implement over SSH from projectless
    chat in isolated dev-server worktree; target dev. Do not load the old project Codex runtime to bootstrap its
    replacement.
  remote_tests: Focused units local to worktree; product integration/browser tests on isolated GitHub CI.
