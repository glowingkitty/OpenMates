scope:
  - Updated Teams creation, avatar, overview, security, member and billing settings.
  - MRU Team quick selector and Team identity in chats, projects, tasks and workflows.
  - Transient backend block-policy name validation with expiring approval tokens, without uniqueness or JEV.
  - Domain and strong-auth joining policy, invite states, role/removal notification emails.
  - Personal and Team optional buyer addresses, CLI purchase support, Team invoices, cards and auto-top-up.
  - Context-safe encrypted best-effort caching, configurable 100 MiB target, protected pending data and quota recovery.
  - Logout plaintext staging purge and decrypted image/audio context-switch cleanup.
  - Team-scoped loading and persisted creation of chats, projects, tasks and workflows, with obsolete async completions fenced.
  - Human Team collaboration without AI processing, explicit OpenMates/configured Mate invocation, and full-history speaker attribution.
