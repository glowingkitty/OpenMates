schema_version: 2
id: learning-mode-collaborative-guest
title: Learning Mode - age rubric, collaborative building, guest use and voice
status: approved
goal: >
  Improve Learning Mode with an age-tiered teaching rubric and first-use term
  definitions with encyclopedia links; add an "Allow collaborative building" toggle
  (on by default from age 10-12, passcode-gated to enable later, existing accounts
  migrate to off) that relaxes code caps and artifacts while keeping the answer-key
  guards; let guests without an account use the same mode stored on the device with a
  local passcode lock; and make Learning Mode and all focus modes work in voice calls.
scope:
  in:
    - Age rubric and term-definition prompt sections, per-mate collaborative prompts for build-capable mates.
    - users.learning_mode_collaborative_build, POST /v1/learning-mode/collaborative, collaborative_build in the request context.
    - Server resolution of the effective flag; code cap 40 vs 300, application artifacts and artifact chips only when collaborative.
    - Voice instruction base_voice_learning_focus_instruction.md added only for voice with Learning Mode or a focus.
    - Guest storage in localStorage with a PBKDF2-SHA256 passcode hash that never leaves the device.
    - Web setup page toggle, CLI and npm/pip/Rust SDK surfaces.
  out:
    - Apple implementation (follow-up after web).
    - Enforcing Projects/tasks agentic-coding tools; only the context flag is exposed.
    - Making the guest lock tamper-proof; clearing browser data bypasses it by design and the UI says so.
scenarios:
  - id: S-1
    title: Parent sets up collaborative building
    given:
      - Learning Mode is being set up for a 13-15 learner.
    when:
      - The parent keeps the collaborative toggle on, later turns it off, then tries to turn it on without the passcode.
    then:
      - It is on by default, off needs no passcode, and on again needs the passcode with the shared lockout.
  - id: S-2
    title: Guest uses Learning Mode
    given:
      - A visitor without an account opens Learning Mode settings.
    when:
      - They set an age group and passcode and reload the app.
    then:
      - Learning Mode persists on the device and requests carry only the four non-secret fields.
  - id: S-3
    title: Learner builds together by voice
    given:
      - A voice call has Learning Mode or a focus mode active.
    when:
      - The assistant teaches or builds.
    then:
      - Spoken-delivery rules apply and the voice delivery block stays last.
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: The server resolves the effective collaborative flag; under 10 is always off; legacy accounts stay off; enabling needs the passcode.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-PYTEST]
  - id: AC-2
    scenario: S-1
    text: Collaborative on raises the code cap to 300 lines and allows application artifacts; off keeps 40 lines; answer-key guards stay in both.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-PYTEST]
  - id: AC-3
    scenario: S-2
    text: Guest passcode is hashed locally, stored in localStorage, never sent, and five wrong attempts block for 24 hours.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-VITEST, T-E2E-WEB]
  - id: AC-4
    scenario: S-3
    text: The voice learning/focus instruction appears only for voice with Learning Mode or a focus and precedes the voice main block.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-PYTEST]
  - id: AC-5
    scenario: S-1
    text: CLI and the npm, pip and Rust SDKs expose enable with the collaborative option and the collaborative on/off action.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: npm_sdk
    verification_ids: [T-RUST, T-SDK]
