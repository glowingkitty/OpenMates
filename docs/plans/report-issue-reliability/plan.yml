  - id: AC-2
    scenario: S-1
    text: A non-admin report with notifications enabled reaches the admin email and reporter confirmation paths without requiring unrelated billing secrets.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND, T-E2E, T-DEPLOYED]
  - id: AC-3
    scenario: S-1
    text: The encrypted YAML contains the bounded report-time console-log snapshot and the issue record reports it as persisted.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND, T-E2E, T-DEPLOYED]
  - id: AC-4
    scenario: S-1
    text: A report submitted while a private chat is active includes a `/share/chat/<id>#key=<blob>` URL that opens and decrypts the intended chat in a fresh logged-out browser context.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-SHARE, T-DEPLOYED]
  - id: AC-5
    scenario: S-1
    text: The changed behavior passes focused local checks and isolated GitHub coverage before one real report is verified on the deployed dev web app.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-COMPONENT, T-BACKEND, T-E2E, T-SHARE, T-DEPLOYED]
  - id: AC-6
    scenario: S-2
    text: Disabling email notification does not skip encrypted diagnostic persistence, and processed becomes true only after the artifact is retained.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND, T-E2E, T-DEPLOYED]
  - id: AC-7
    scenario: S-2
    text: Disabling current-chat sharing sends neither a chat/embed URL nor last-message HTML; when enabled, logs redact visible message text and share-link key material.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-E2E, T-DEPLOYED]

