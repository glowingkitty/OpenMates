schema_version: 2
id: report-issue-reliability
title: Report Issue Reliability And Submitted Summary
status: implementing

goal: >
  Make the Report Issue confirmation useful by showing the submitted report
  summary, repair broken report notifications, and prove that retained debug
  logs plus shared-chat links (including the client-side encryption key) remain
  usable through a real report submitted on the deployed web app.

scope:
  in:
    - A localized confirmation summary for the sanitized title, user flow, expected behaviour, and actual behaviour.
    - Reliable issue-report worker initialization that does not depend on unrelated billing services.
    - Durable encrypted YAML retention for report-time diagnostics and privacy-filtered console logs, regardless of whether email notification is enabled.
    - Current-chat sharing enabled by default with a clear opt-out that removes both the shared URL and rendered last-message HTML.
    - Preservation of the complete encrypted shared-chat URL, including its fragment key, through report submission and encrypted storage.
    - A fresh-browser check that the shared link captured by a report decrypts and opens the intended chat.
    - Isolated CI followed by a deployed dev-web report submission and worker/data verification.
  out:
    - Production deployment or production data access.
    - Redesigning the general notification, billing, or chat-sharing systems.
    - Automatic creation of an OpenMates Task after report submission.
    - Exposing report contents, chat keys, or decrypted diagnostics through a new public API.

decisions:
  - id: D-1
    status: active
    decision: Keep issue submission responsive and asynchronous; the confirmation page does not wait for email or YAML persistence.
    reason: Notification and encrypted-artifact work should not turn a successful report into a slow or fragile synchronous request.
    decided_at: '2026-09-21'
  - id: D-2
    status: active
    decision: Initialize only the core, storage, and email services used by the issue-report worker.
    reason: The failing CI worker aborted on an unavailable Invoice Ninja secret before it could persist diagnostics or send either email.
    decided_at: '2026-09-21'
  - id: D-3
    status: active
    decision: Retain a share-link fragment only in the existing encrypted issue field and encrypted YAML, never in logs or a new ordinary-client response.
    reason: The fragment contains the client-side key needed to decrypt a deliberately shared chat and remains sensitive even after consent.
    decided_at: '2026-09-21'
  - id: D-4
    status: active
    decision: Validate the captured shared link by opening it in a fresh logged-out browser context.
    reason: Checking only URL shape or database presence would not prove that the encryption blob can actually decrypt the intended chat.
    decided_at: '2026-09-21'
  - id: D-5
    status: active
    decision: Always run diagnostic persistence; treat email delivery as an independent optional notification step.
    reason: Administrator reports previously discarded every diagnostic field when their default email toggle was off.
    decided_at: '2026-09-21'
  - id: D-6
    status: active
    decision: Include the active chat by default as explicit report-form consent, while making the toggle easy to disable and redacting visible chat text plus share keys from console logs.
    reason: Reports need enough context to debug effectively without duplicating plaintext chat content or credentials into general-purpose logs.
    decided_at: '2026-09-21'

scenarios:
  - id: S-1
    title: Submitted report remains useful and actionable
    given:
      - A user has an active encrypted chat and opens Report Issue.
    when:
      - The user submits populated report fields with chat sharing and notifications enabled.
    then:
      - The confirmation summarizes the sanitized report and compact issue ID.
      - The report worker retains encrypted diagnostics and delivers admin and reporter notification emails.
      - The captured shared URL opens and decrypts the chat in a fresh logged-out browser context.
  - id: S-2
    title: Diagnostics persist without notification or chat consent
    given:
      - An administrator submits a report with email notifications disabled.
    when:
      - The active-chat sharing toggle remains enabled or is explicitly turned off.
    then:
      - The encrypted diagnostic YAML is retained even though no email is sent.
      - Turning chat sharing off removes both the share URL and last-message HTML from the submitted payload.
      - Privacy-filtered console logs contain neither visible message text nor share-link encryption keys.

