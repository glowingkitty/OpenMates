    type: playwright
    file: frontend/apps/web_app/tests/components/report-issue-confirmation.spec.ts
    target: runner-local Vite component preview
    execution_environment: isolated_github_ci
    command: python3 scripts/ci_coordinator.py submit --session 73d9 --source SOURCE --mode e2e --spec frontend/apps/web_app/tests/components/report-issue-confirmation.spec.ts
    covers: [AC-1, AC-5]
    assertions:
      - The confirmation summary is readable at phone and wider settings widths and copy feedback works.
    red_phase: {required: false, expected: fail, evidence: {status: not_required, reason: Existing screenshot established the minimal confirmation state.}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, run_id: '35597433891'}}
  - id: T-BACKEND
    type: pytest
    file: backend/tests/test_issue_report_email_task.py
    command: python3 -m pytest backend/tests/test_issue_report_email_task.py
    covers: [AC-2, AC-3, AC-5, AC-6]
    assertions:
      - Issue-report task initialization loads only core, storage, and email dependencies, persists diagnostics when email is disabled, and marks a retried report processed only after upload succeeds.
    red_phase: {required: false, expected: fail, evidence: {status: observed_in_ci, run_id: '35597750871'}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-E2E
    type: playwright
    file: frontend/apps/web_app/tests/report-issue-flow.spec.ts
    target: isolated GitHub web and backend stack
    execution_environment: isolated_github_ci
    command: python3 scripts/ci_coordinator.py submit --session 73d9 --source SOURCE --mode e2e --spec frontend/apps/web_app/tests/report-issue-flow.spec.ts
    covers: [AC-1, AC-2, AC-3, AC-5, AC-6, AC-7]
    assertions:
      - A real disposable account submits a report to the genuine API, retains screenshot and YAML diagnostics, verifies privacy-filtered log payloads, and renders the submitted summary.
    red_phase: {required: false, expected: fail, evidence: {status: failed, run_id: '35597750871', result: Invoice Ninja initialization aborted the report email task before YAML persistence.}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-SHARE
    type: playwright
    file: frontend/apps/web_app/tests/share-chat-flow.spec.ts
    target: isolated GitHub API and AI-fixture worker stack
    execution_environment: isolated_github_ci
    command: python3 scripts/ci_coordinator.py submit --session 73d9 --source SOURCE --mode e2e --spec share-chat-flow.spec.ts
    covers: [AC-4, AC-5]
    assertions:
      - The exact key-bearing link generated by the Report Issue form decrypts the consented message and search embed in a fresh logged-out browser context; turning sharing off omits both the URL and rendered message HTML.
    red_phase: {required: false, expected: fail, evidence: {status: observed_in_issue, result: Issue 9DZ7V could decrypt the share blob but not any messages or embeds.}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-DEPLOYED
    type: manual
    file: frontend/apps/web_app/tests/report-issue-flow.spec.ts
    target: https://dev.openmates.org
    command: Scoped dev-web report submission and bounded worker/data checks after sessions.py deploy.
    covers: [AC-2, AC-3, AC-4, AC-5, AC-6, AC-7]
    assertions:
      - The deployed dev app produces successful notification-worker evidence, retained encrypted diagnostics, and a fresh-context decryptable shared chat.
    red_phase: {required: false, expected: fail, evidence: {status: not_required, reason: Isolated CI already captured the worker failure.}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}

verification:
  required:
    - python3 scripts/plan_validate.py docs/plans/report-issue-reliability/plan.yml
    - Focused backend unit tests for issue-report service initialization and artifact/email sequencing.
    - Isolated GitHub CI for report-issue-flow.spec.ts with a real disposable account and backend.
    - Isolated component CI for report-issue-confirmation.spec.ts.
    - A deployed dev-web report using a test account, followed by bounded verification of notification completion, encrypted YAML/log retention, and fresh-context shared-chat access.
  privacy_security:
    - Evidence must redact account email, full shared URL fragment, encryption keys, cookies, and decrypted report content.
    - No new route may return a stored shared-chat URL or diagnostics to an ordinary client.
    - Chat content is attached only through the default-on report consent toggle; disabling it omits both the encrypted shared link and rendered last-message HTML.
    - General console-log retention must remove visible chat text and share-link key material even when chat context is consented for the report artifact.

specification_impact:
  existing_assertions:
