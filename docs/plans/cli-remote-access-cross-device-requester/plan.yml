decisions:
  - id: D-1
    status: active
    decision: Put requester operations under `openmates projects files`; keep `openmates remote-access` as the only source-host lifecycle command.
    reason: Requesting is Project navigation while hosting grants foreground machine authority.
    decided_at: "2026-08-03"
  - id: D-2
    status: active
    decision: Confirm context before interactive hosting and require explicit context flags for non-interactive hosting.
    reason: Discovery must not attach private sources to the wrong workspace.
    decided_at: "2026-08-03"
  - id: D-3
    status: active
    decision: Keep live remote filesystem operations first-party CLI-only while exposing encrypted Project data CRUD through npm and pip SDKs.
    reason: SDK parity is useful for stored data, but developer clients must not gain local filesystem authority.
    decided_at: "2026-08-03"
  - id: D-4
    status: active
    decision: Unwrap a Team Project key with Team key epoch 1, then authenticate the ephemeral source-session exchange with the Project key.
    reason: This reuses unified wrappers and binds file access to the exact Project.
    decided_at: "2026-08-03"
  - id: D-5
    status: active
    decision: Store Team sources under Team ownership with attaching-member identity and retain them offline after host permission loss.
    reason: The Team keeps an auditable removable record without allowing the removed host to serve data.
    decided_at: "2026-08-03"
  - id: D-6
    status: active
    decision: Require interactive confirmation for Project deletion/source removal and an explicit confirmation value in JSON or non-interactive mode.
    reason: Ambiguous scripting input must not cause irreversible deletion.
    decided_at: "2026-08-03"
  - id: D-7
    status: active
    decision: Non-interactive and JSON live file requests require `--personal` or `--team`; stored Project CRUD may use persisted context.
    reason: Remote plaintext retrieval has a higher wrong-context impact than encrypted stored-data navigation.
    decided_at: "2026-08-03"
  - id: D-8
    status: active
    decision: Enable platform:teams only through the local Docker development override while keeping production and self-hosted defaults disabled until Teams V1 is verified.
    reason: The user approved real dev verification without exposing unfinished Teams behavior outside the development stack.
    decided_at: "2026-08-03T13:23:38Z"
  - id: D-9
    status: active
    decision: Reject Team Project history list/restore with `TEAM_PROJECT_HISTORY_UNSUPPORTED` rather than routing Team snapshots through personal history ownership.
    reason: Workspace history persistence is user-owned today; exposing Team restore would mutate Personal context and leak an incomplete contract. Full Team history is deferred to a context-owned history migration.
    decided_at: "2026-08-03T15:25:02Z"

