scenarios:
  - id: S-1
    title: Alice deterministically manages Personal Projects
    given:
      - Alice is logged into the CLI in Personal context.
      - Alice has active and archived Projects with overlapping display-name prefixes.
    when:
      - Alice lists, shows, opens, creates, updates, archives, and unarchives Projects.
      - Alice deletes one exact Project after confirmation.
    then:
      - Commands resolve a UUID, unique short ID, or unique exact decrypted name and reject ambiguity.
      - Human and JSON output is cleartext and excludes keys/ciphertext fields.
      - "`show` is read-only; `open` records last-opened state."
      - Archive/unarchive are reversible; delete is confirmation-gated.
      - Personal commands never return or mutate Team Projects.
  - id: S-2
    title: Alice navigates Project items and sources
    given:
      - Alice has a Project containing folder/item links and two sources.
    when:
      - Alice lists items/sources and removes one authorized link or source.
    then:
      - The CLI decrypts names locally and shows safe type, placement, state, capability, and ownership labels.
      - Another device's plaintext absolute root is never printed.
      - Source removal terminates its session and invalidates pending work.
      - Destructive source removal requires exact confirmation.
  - id: S-3
    title: Alice requests a Personal Project file across her devices
    given:
      - Alice's laptop and desktop are active CLI sessions for Alice's account.
      - Alice's desktop runs `openmates remote-access --personal --path /work/api` and approves its Project binding.
      - Alice's laptop has the same Personal Project key through an approved first-party key path.
    when:
      - Alice's laptop lists the source, searches for `billing`, and reads `src/billing.ts`.
    then:
      - Alice's laptop establishes a Project-key-authenticated encrypted session with Alice's desktop source CLI.
      - The backend sees opaque routing fields and ciphertext, not path, query, snippet, or content.
      - Alice's laptop receives bounded safe cleartext after local decryption.
      - Different-account, API-key-only, wrong-Project, stale, and replayed requests fail closed.
  - id: S-4
    title: Interactive source hosting confirms context
    given:
      - Alice's persisted context is Team Acme.
      - Alice starts source hosting without a context flag.
    when:
      - Alice runs `openmates remote-access` interactively.
    then:
      - The CLI displays Team Acme and confirms or changes context before discovery.
      - Cancel performs no discovery, source creation, or connection.
      - "`--personal` or `--team acme` skips the prompt only for that invocation."
      - Non-interactive or JSON mode without a flag fails with `context_confirmation_required` before discovery.
  - id: S-5
    title: Team members read an online Team Project source
    given:
      - Alice is a Team Acme member hosting a source for Team Project `API`.
      - Bob is an active Team Acme viewer on another CLI.
      - Both clients can unwrap the Team Project key through Team key epoch 1.
    when:
      - Bob lists, searches, and reads the source with `--team acme`.
    then:
      - Bob may perform bounded read-only operations.
      - The encrypted session binds Team, Project, source, session, host, and requester identities.
      - Personal or another Team context cannot reach the source.
      - Membership is revalidated at request creation, delivery, and completion.
  - id: S-6
    title: Team roles constrain mutation
    given:
      - Team Acme has owner Alice, admin Ada, member Max, and viewer Vera.
      - Max and Ada each attached a source and item link.
    when:
      - Each role attempts Project mutation, settings, link removal, and source removal.
    then:
      - Vera may read but cannot mutate.
      - Max may create/update/archive and manage only links/sources Max attached.
      - Alice and Ada may change settings and remove any link/source.
      - Only owner/admin may permanently delete a Team Project.
      - Denials return `TEAM_PERMISSION_DENIED` without partial mutation.
  - id: S-7
    title: Losing Team access revokes a hosted source
    given:
      - Max hosts a Team source and Bob has an in-flight read.
    when:
      - Alice removes Max from Team Acme.
    then:
      - Max's session and queued/in-flight requests are invalidated immediately.
      - Heartbeats, reconnects, requests, and completions from Max are rejected.
      - The source remains offline without leaking private host identity.
      - Owner/admin can remove the offline record.
      - Previously returned plaintext cannot be recalled; key rotation is outside scope.
  - id: S-8
    title: SDKs match deterministic Project data behavior
    given:
      - Approved npm and pip clients can decrypt Personal and Team Project metadata.
    when:
      - Each lists, shows, creates, updates, archives, unarchives, and deletes test Projects.
    then:
      - Results and permission errors match CLI/backend behavior.
      - Destructive methods require explicit confirmation.
      - SDKs do not host or request live filesystem content.
      - API-key clients without approved key context cannot obtain Project keys or remote payloads.
  - id: S-9
    title: Offline and ambiguous file requests fail clearly
    given:
      - A Project has multiple sources, one offline, and duplicate basenames.
    when:
      - Bob omits source selection, guesses a basename, requests excluded content, or exceeds limits.
    then:
      - Multiple eligible sources require explicit or interactive selection.
      - Read requires an exact source-relative path returned by list/search.
      - Stable errors cover offline, protected, binary, invalid UTF-8, symlink, ignored, oversized, timeout, and rate limits.
      - No stale-cache, other-source, other-context, or broader-scope fallback occurs.
  - id: S-10
    title: Public documentation matches the deterministic CLI
    given:
      - A user reads CLI help, package README, user guide, or CLI architecture documentation.
    when:
      - The user follows Project CRUD or remote file requester instructions.
    then:
      - Every documented command and context rule matches the production CLI grammar.
      - Documentation distinguishes stored Project SDK methods from CLI-only live filesystem operations.
      - Documentation explains foreground source lifetime, explicit non-interactive live-file context, role permissions, offline state, and read-only bounds.
      - No documentation claims public remote-file API access or hidden daemon behavior.

