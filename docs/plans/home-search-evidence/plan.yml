id: home-search-evidence
title: Useful apartment search with complete galleries and location evidence
status: implementing
goal: >
  Drastically improve the amount of relevant data we get and process to allow
  users to search and filter apartments and show them clearly on the map.
  Show all images for an apartment, verify temporary image handling in shopping
  and home, and implement the other discussed improvements without a cached
  spatial index, using the existing platforms.
task: TASK-2285
specification: feature.app-skill.home-search@1
approved_by_user: true
scope:
  in:
    - Rich provider details and complete supplied galleries with truthful retrieval status.
    - Structured and natural-language criteria, bounded Jev visual evidence, and requested location enrichment before final selection.
    - Full web galleries, detailed cards, filters, accurate map markers and approximate-location disclosure.
    - Apartment filters use the existing filter-button and calendar/map overlay pattern, hidden until opened.
    - Shared memory-only image preparation/download primitives preserving shopping behavior.
  out:
    - New listing providers, a spatial index, bulk geodata ingestion, applications or production deployment.
verification:
  - Focused provider, filtering, visual, geolocation and shopping regression unit checks.
  - Isolated GitHub component proof on phone and laptop, then housing API/client integration coverage.
  - Scoped dev deployment after relevant checks; live-inference checks use normal OpenMates automatic routing.
