  investigation_task: TASK-69
  session: d238
clarified_intent:
  user_direction: >-
    Jeff should include the instructions whenever a process flow or an
    architecture or anything mind map or diagram related is being discussed in
    a chat, so that the main processor can decide whether or not to use them.
  loading_rule: >-
    Discussing these subjects in the conversation is sufficient to load the
    relevant public guidance. Neither an explicit request for a visual nor a
    prior decision to generate one is required. Include preceding conversation
    context when interpreting short follow-ups.
  main_processor_discretion: >-
    Loaded guidance offers available methods and native formats. The main
    processor may use prose alone, a native mind map, or a native diagram as
    appropriate. Loading guidance must not instruct it to create a visual in
    every relevant response. Mermaid source still requires an explicit user request.
investigation:
  inspected_on: '2026-10-25'
  source_revision: b08826725
  conclusion: >-
    The offending turn omitted native visualization instructions and loaded no
    private app settings/memories. The model produced Mermaid anyway, and the
    stream consumer accepted it as ordinary code. This establishes instruction
    selection and output-enforcement failures. It does not establish that a
    particular saved personal Memory failed decryption or was lost.
  confirmed:
    - >-
      The saved 27-line Mermaid code embed matches the screenshot. No user
      message in the preceding conversation requested Mermaid, a mind map, or
      a diagram explicitly; the assistant added the visualization itself.
      The preceding assistant response used an ASCII architecture sketch.
    - >-
      At 2026-10-24 15:16:33 UTC, preprocessing returned an empty
      load_app_settings_and_memories list, web-search as its relevant skill,
      and website as its preview type. Stage one reported one selected app.
      The exact selected_app_ids list is not established by these log entries.
    - >-
      The corresponding APP_INSTRUCTIONS record names only images and web;
      neither mindmaps nor diagrams appears. APP_SETTINGS_MEMORIES explicitly
      reports an empty dictionary. The available-apps list nevertheless
      includes both mindmaps and diagrams: registration alone was insufficient.
    - >-
      The same request then created a processing code placeholder with language
      mermaid. This was generation and generic-code persistence behavior,
      rather than a native mind-map renderer failing to display valid content.
    - >-
      Current app instruction injection skips apps omitted by selected_app_ids.
      Mind Maps has no executable skill to bring its instructions back through
      baseline-skill exceptions. Its explicit-request guard only removes
      conflicting image-generation skills; it does not guarantee native guidance.
    - >-
      The public capability catalogue has a detailed diagrams description but
      no corresponding mindmaps description; the latter falls back to its name.
      The preview-type catalogue has neither mindmap nor diagram. App filtering
      also narrows private-memory candidates before relevance selection.
    - >-
      Diagram Design uses published app Memories, separately from private user
      settings. Its full guides require both the diagrams app and selected type
      IDs; an empty type selection returns no guidance. The incident's empty
      private-memory list alone therefore does not explain the whole omission.
    - >-
      A second relevance gate asks whether the latest user request asks to
      create, redraw or revise an actual diagram. Selected Diagram Design type
      IDs are returned only when that answer passes its threshold. Broadening
      the app shortlist instruction alone would still leave this explicit-request
      gate preventing the guidance from reaching a general architecture discussion.
    - >-
      The software-development mate already says to use Mermaid only when
      explicitly requested. A separate old Mermaid instruction file is dormant
      and describes an obsolete disabled-diagram/ASCII fallback. Existing static
      tests check those strings; they do not enforce actual generated behavior.
      Mermaid-specific embed detection is disabled, so its source intentionally
      falls through to the generic Code path without an explicit-request check.
  unresolved:
    - >-
      Whether a particular relevant private preference existed and was eligible
      at the incident revision remains unverified. The original global CLI profile
      rejected Memory listing with Personal memory owner changed during preparation.
      A fresh isolated Personal login later passed owner validation. Preserve
      that owner check; neither result establishes the historical preference set.
    - >-
      The records prove omitted guidance and unchecked output. They do not prove
      whether any single catalogue description, classifier score, or model
      compliance failure was solely responsible for choosing Mermaid.
  evidence_handling: >-
    The original chat, embeds and bounded request logs were inspected privately.
    Raw prompts, account identifiers, saved Memory bodies and log exports remain
    outside the repository. Any regression fixture must use synthetic content.
  validation_performed:
    - The concise Plan passes scripts/plan_validate.py.
    - >-
      Both existing Mermaid/selected-diagram instruction contract tests pass
      (2 passed, 8 deselected). These are static source checks, not proof that
      generated responses obey the instructions; the incident demonstrates that gap.
