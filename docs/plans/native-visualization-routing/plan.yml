schema_version: 2
profile: concise
id: native-visualization-routing
title: Reliable native visualization instructions and explicit-only Mermaid source
status: verified
goal: >-
  we do not want to see any Mermaid code whatsoever unless explicitly mentioned
  by the user asking for Mermaid code. But otherwise the default must be to use
  the existing instructions. So investigate and then make a plan on how we should
  improve and fix this reliably.
