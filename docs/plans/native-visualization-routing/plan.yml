scope:
  in:
    - Broader public Mind Maps and Diagram Design guidance loading for relevant conversation subjects.
    - Main-processor discretion over whether a visual helps and which native format to use.
    - First-turn and follow-up selection, complete prompt inclusion and truthful existing Memory receipts.
    - Regression checks for prose-only answers, native visuals and explicit-only Mermaid source.
  out:
    - Rewriting the reported chat or bulk-converting existing Mermaid/code embeds.
    - Re-enabling the retired Mermaid renderer or building a Mermaid-to-mind-map converter.
    - Automatically loading every private Memory or bypassing owner, consent or Project-access checks.
    - Changing inference model/provider defaults or using model overrides to make tests pass.
    - Repairing unrelated CLI account/session tooling as part of this implementation.
    - Changing private-memory selection policy or weakening its existing consent and owner checks.
    - New streaming buffers, artifact authorization protocols or regeneration loops in the initial repair.
proposed_implementation:
  - outcome: Select public visual guidance when its subject is discussed.
    changes:
      - >-
        Update Jev's stage-one app relevance instruction and capability descriptions
        to include Mind Maps and Diagram Design guidance whenever processes,
        workflows, architectures, relationships, concept maps or related visual
        subjects are discussed. Evaluate the conversation context, not only whether
        the latest message explicitly requests a diagram or calls an app skill.
      - >-
        Give Mind Maps a meaningful public capability description alongside
        Diagram Design. Include their compact format instructions in relevant
        turns even though neither app has an executable skill. Preserve existing
        explicit visual requests as sufficient positive selection cases.
      - >-
        Ensure the needs_detailed_context decision and cached/continued routing
        paths retain access to relevant guidance for discussion-only requests.
        A public app shortlist makes guidance available; it does not execute an
        app, authorize private access or require the assistant to create anything.
  - outcome: Load useful complete guides without requiring a creation request.
    changes:
      - >-
        Broaden the stage-two diagram_creation decision into guidance relevance:
        could the available process, architecture or diagram guides help the
        main processor explain the conversation? Remove the explicit-artifact-request
        prerequisite for selecting guide types. Keep any actual creation-intent
        distinction separate if another caller still needs it.
      - >-
        Select the most relevant existing Diagram Design types from the current
        discussion and load their complete common resources and type guides,
        retaining the existing bounded type limit. Loading public guidance does
        not mean loading all 44 guides or decrypting private Memories.
      - >-
        State in the active app instructions that the main processor decides
        whether to use a visual when guidance was loaded because of discussion
        relevance. When it chooses one, follow the existing openmates_mindmap
        or openmates_diagram contract. Preserve explicit user requests and format
        preferences rather than producing every available visual type.
      - >-
        Preserve and clearly state the explicit-only Mermaid rule in active
        guidance. Do not reactivate the dormant Mermaid instruction file with
        its obsolete disabled-diagram/ASCII fallback.
      - >-
        Reuse actual applied-memory receipts for selected public type guides.
        Assert prompt inclusion, rather than treating a shortlist entry as proof
        that the main processor received a complete guide. Preserve private-memory
        consent, ownership, revision checks and content-free operational logging.
  - outcome: Verify guidance availability separately from visual generation.
    changes:
      - >-
        Add behavioral selection and prompt-assembly cases for architecture,
        everyday process flows, concept/relationship discussions and short
        follow-ups without asking for a visual. Verify relevant complete guides
        reach the main prompt even when no executable skill is selected.
      - >-
        Cover unrelated discussion as a negative control. Also cover an explicit
        request for prose only: guidance may be present, but no visual is forced.
        Preserve explicit native-map/diagram and explicit Mermaid source controls.
      - >-
        Verify actual selection with a bounded real-inference dev evaluation
        using ordinary default routing. Mocked decision responses prove downstream
        loading behavior, not that Jev follows its broader selection instruction.
separate_hardening_proposal: >-
  A shared generated-output guard could provide stronger enforcement if models
  still emit unsolicited Mermaid after receiving the right guidance. The earlier
  buffer/regeneration design is not part of this clarified first repair. Record
  remaining violations honestly and reassess that separate work from evidence;
  a classifier/prompt change alone is not a deterministic output guarantee.
required_verification_for_implementation:
  local:
    - >-
      Behavioral unit tests for discussion-based app/type selection and assembled
      prompt contents, including Mind Maps without executable skills, architecture
      and process discussions without visual requests, and short follow-up edits.
      Extend test_preprocessor_jev.py and extracted prompt-assembly helpers;
      static instruction-string tests remain supporting evidence only.
    - >-
      Extend test_diagram_guidance.py to prove complete selected guides reach
      the prompt for discussion-only requests and preserve the existing type
      limit. Check active instructions retain the main processor's discretion,
      explicit-only Mermaid and the existing native formats.
    - >-
      Preserve test_memory_context.py source/consent/revision checks and prove
      denied/unavailable private Memories do not prevent public guide loading.
  isolated_ci:
    - >-
      Update contract-tagged product coverage for loaded-guide receipts and
      optional prose/native visual outcomes using synthetic signed inference
      replay. Submit with sessions.py ci-source and the existing CI coordinator;
      no live provider inference in CI.
    - >-
      Add a browser regression for generated native mind-map preview/fullscreen,
      reload and reopened history, and an ordinary source-code result for an
      explicit Mermaid request. Existing mindmap-embed.spec.ts tests import,
      not generation-time instruction selection, so it is insufficient alone.
  real_inference_dev:
    - >-
      In an isolated test Project/profile, run a small fixed set using ordinary
      automatic routing: architecture discussion, everyday process discussion,
      a short follow-up, an explicit prose-only answer, an explicit native visual,
      and explicit Mermaid source. Inspect guide loading independently from
      actual embed types. Do not require visuals for discussion-only cases,
      mutate the reported conversation or force a model/provider. Any unsolicited
      Mermaid remains a failed outcome to report, not a waived result.
completion_conditions:
  - Relevant architecture, process-flow and diagram-related discussions load the public instructions without requiring an explicit visual request.
  - The main processor retains discretion to answer with prose alone or use a suitable native visual; loading never mandates generation.
  - When a visual is generated in the required regression cases it follows the existing native format, unless Mermaid source was explicitly requested.
  - Private Memory access and encrypted history remain source-scoped, consented and intact; receipts describe what was actually applied.
  - Required focused checks pass, with isolated CI evidence and the bounded default-routing dev evaluation recorded separately.
