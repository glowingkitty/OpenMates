- id: CI-4
  status: in_progress
  scope: Real GitHub pilot, concurrent/retry tests, scoped deploy, docs and completion audit.
verification:
  tooling: Focused local Python and Node unit tests for queue, transport, profile and routing.
  live: GitHub runner stack startup, real account/client initialization and representative E2E.
  daily: GitHub unit suites and representative daily batch with exact source identity.
  completion: Required live execution and migration checks must pass before claiming completion.
risks:
- Existing self-host smoke currently fails image-mode startup; portable startup needs real repair/evidence.
- Hardcoded dev URLs, live-provider credentials and shared fixture assumptions require explicit migration.
- Fresh environments add startup time; measure cold/warm startup and total feedback latency.
- Other tasks are active; hunk integration must preserve their changes and shared runtime leases.
