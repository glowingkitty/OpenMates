schema_version: 2
id: isolated-github-tests
title: Independent GitHub test environments and coordinated dispatch
status: implementing
goal: All E2E web app tests and daily tests run on GitHub CI independently of the dev server. Unit
  tests for code changes still run locally. Remove redundant local per-worktree Docker environments
  and coordinate GitHub requests within rate limits.
authorization:
  source: User explicitly approved planning and implementation on 2026-09-07.
  specification_required: false
  additional_plan_approval_required: false
scope:
  in:
  - One shared CI implementation for focused candidate runs and daily suites.
  - Exact source identity, isolated web/API/worker/CMS/database/cache and fresh accounts.
  - Durable deduplicated dispatch, bounded concurrency, shared polling and rate backoff.
  - Preserve reports, traces and proof artifacts tied to source and run identity.
  - Remove superseded local runtime broker and capacity code; preserve Codex identity.
  out:
  - Hetzner resizing, production changes, resuming other tasks or changing their code.
architecture:
  execution: GitHub-hosted Linux runner is the isolation boundary; no nested Docker daemon.
  source: Immutable Git commit; uncommitted candidates require a reviewed source snapshot transport.
  dependencies: Reuse cached dependency layers; invalidate on build/dependency changes.
  accounts: Disposable accounts initialized through real client crypto/auth flows in a fresh database.
  network: Explicit local endpoints and a fail-closed shared-domain guard; no dev fallback.
  coordinator: Single durable local queue, four admitted CI jobs, batched status refresh and budget
    reserve.
  daily: Same execution workflow with pinned revision and broader test selection; unit suites on
    GitHub.
  local: Small unit checks remain local; shared dev is not a test execution dependency.
  historical_migration: Retain applied SQL migration history; remove callers, not live database data.
acceptance:
- Focused candidate E2E executes current frontend/backend on GitHub without Vercel or Hetzner API.
- Daily path includes unit and E2E suites using the same isolated environment contract.
- Concurrent requests cannot double-dispatch; uncertain dispatch is reconciled rather than retried
  blindly.
- Status requests read coordinator cache; rate exhaustion queues work and respects reset/backoff.
- Runtime identities and artifacts identify exact source; failures never become successful empty
  reports.
- Fresh accounts cannot collide across jobs; auth/encryption flows remain real.
- No test traffic reaches shared dev; failures save diagnostics before cleanup.
- Superseded local runtime code removed, existing worktree binding preserved.
