# Keep actual immutable sources for each focused suite and later regression fix.
schema_version: 1
id: composable-workflows
title: Multiple-choice checks, bounded iteration and chat-owned workflow runs
status: verified
goal: >
  Implement the agreed multiple-choice AI Checks, bounded For each and chat-triggered
  one-time or existing Workflow runs across backend, CLI, SDKs and web. Store one-time
  definitions in encrypted chat embeds, allow saving a regular reusable copy, and
  return selected results to the initiating chat. Defer Jev relevance preprocessing,
  Start AI chat and Apple implementation until their separately agreed follow-up.
approved_by_user: true
scope:
  in:
    - Exactly-one/all-that-apply AI Checks, stable option branches and reliable Unsure behavior.
    - Sequential typed-list iteration with scoped item/index, bounds, cancellation and retry reuse.
    - Chat-owned encrypted definitions, caller invocation/routing, bounded output returns and saved copies.
    - REST, CLI, npm/Python SDK and web semantic parity with focused coverage and scoped dev deployment.
  out:
    - Jev workflow relevance selection/preprocessing (separate chat).
    - Start AI chat; revisit only after testing and the user's confirmation of this implementation.
    - Apple implementation; hand off to a Mac chat after web acceptance.
    - Nested/unbounded loops, general code, human-input pauses and unrelated legacy repairs.
scenarios:
  - id: S-1
    title: Reliable option selections execute the intended actions
    given: [A Check has stable options and selected earlier input values.]
    when: [It runs in exactly-one or all-that-apply mode.]
    then: [Selected branches execute in authored order followed by shared continuation once; uncertain required judgments execute only Unsure.]
  - id: S-2
    title: A bounded list body resumes safely
    given: [A typed list feeds a sequential For each body.]
    when: [It completes, fails, is cancelled or resumes after partial work.]
    then: [Scope and limits hold; completed effects and charges are reused and empty input continues once.]
  - id: S-3
    title: A chat-owned workflow remains inspectable and can become reusable
    given: [A chat creates a one-time workflow or invokes an existing one.]
    when: [The owner inspects results, overrides Send destinations, saves a copy or deletes the source chat.]
    then: [Only explicit bounded results return, saved graphs remain unchanged, copies are independent, and chat-owned runs are fenced on deletion.]
acceptance_criteria:
