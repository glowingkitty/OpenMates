    verification_ids: [T-BACKEND, T-CLIENTS, T-UI]
  - id: AC-2
    scenario: S-2
    text: Typed scope, empty/oversized lists, limits, cancellation and retry-safe iteration are covered.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND, T-CLIENTS, T-UI, T-E2E]
  - id: AC-3
    scenario: S-3
    text: Chat ownership, encryption, one-time runs, idempotent conversion, caller returns and deletion cleanup are covered across clients.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: plan
    verification_ids: [T-BACKEND, T-CLIENTS, T-UI, T-E2E]
