  plan: {status: approved, approved_at: '2026-09-23', source: User explicitly requested full Apple audio parity in this task.}
decisions:
  - {id: D-1, status: active, decision: Use a dedicated first-party audio socket and existing native session credentials., reason: The chat WebSocket has a different endpoint and event lifecycle., decided_at: '2026-09-23'}
  - {id: D-2, status: active, decision: Preserve encrypted upload and call batch transcription only if realtime fails., reason: Recording remains usable without double provider spend., decided_at: '2026-09-23'}
  - {id: D-3, status: active, decision: Require signed-device evidence for real microphone capture and playback., reason: The headless Simulator CoreAudio capture path hung and cannot prove physical input., decided_at: '2026-09-23'}
