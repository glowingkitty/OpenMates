id: apple-daily-use-recovery
title: Restore the Apple daily-use chat flow
status: implementing
goal: >-
  Ensure passkey login and email/password login to the personal dev test account
  work, load the chats visible in the web app efficiently, and support reliable
  conversations with the same core UI flow, using iPhone simulator workflows as
  the primary debugging loop and TestFlight for real-device verification.
authorization:
  product_scope: User approved the five-step recovery proposal on 2026-09-11.
  local_tools: User explicitly authorized local debugging tools and updating the ios skill.
  real_device_delivery: User requested TestFlight for testing builds beyond the simulator.
scope:
  - Installed-build identity, signing and passkey relying-party configuration.
  - Password and passkey session establishment and encrypted account unlock.
  - Complete progressive history, opening chats, streaming and persistence.
  - Relaunch and reconnect; targeted iPhone and iPad verification.
non_goals:
  - Full web parity, unrelated settings, new embeds or Watch recovery.
  - Backend authentication changes or weakening encryption/signing requirements.
specification_refs:
  - specifications/features/auth/specification.yml
  - specifications/architecture/sync/specification.yml
  - specifications/features/chats/specification.yml
affected_assertions:
  - auth.login.method-convergence
  - auth.passkey.origin-prf-bound
  - auth.session.lifecycle
  - sync.startup.bounded-phases
  - sync.surface.semantic-parity
  - chats.persistence.client-encrypted
  - chats.message.identity-idempotent
acceptance:
  - Both real login methods unlock existing encrypted chats.
  - Chat identities match the web account, including beyond the first recent window.
  - Recent history becomes usable before all historical message content is loaded.
  - New chats and follow-ups stream, persist after relaunch and appear on the web.
  - Reconnection does not lose messages, duplicate sends or leave loading stuck.
  - Physical iPhone authentication/lifecycle and iPad layout are checked explicitly.
evidence:
  - Installed v0.17 build 64 rejects dev passkey RP because signed dev associated domain is absent.
  - Personal dev email/password login succeeds in installed build and displays decrypted recent titles.
  - Installed auth controls render but disappear from the macOS accessibility tree.
  - Current source contains the dev associated domain; native runtime verification remains pending.
  - Isolated SwiftData tests reproduce account and server cache leakage; same-scope persistence passes.
  - Metadata decoder regression reproduces dropped explicit server tombstones.
  - Native REST pagination sends offset to an endpoint that always reads offset zero.
  - Startup phased_sync_request omitted the mandatory personal context_epoch field.
  - Unsigned simulator builds compile but fail Keychain writes with missing entitlement status -34018.
  - Ad-hoc signed simulator completes password unlock and receives a complete streamed assistant response.
  - Initial streaming UI assertion queried the wrong accessibility element type; selector corrected.
  - Twenty focused native sync/isolation regressions pass with session race guards.
  - Signed XCUITest password plus OTP login and complete assistant response passes in 80 seconds.
  - Initial live pagination reproduced zero of 425 chats; after dev fix 32ebe840ca48770bc96764f2089fd4f5ee2211fc it returns all 426 unique chats and matches the authoritative count in 13.2 seconds including login.
  - Server pagination indexes a sparse cache containing a draft-only ID, returning an empty page despite existing database history.
  - Relaunch history test exposes a post-send draft-save race producing a stray draft-only row.
  - Eleven native draft encryption tests pass, including deterministic cancellation of a save suspended before clearDraft.
  - Backend pagination regression plus two existing scope tests pass; coordinated dev restart completed.
  - iPhone relaunch reopens the exact new conversation with both user and assistant messages intact.
  - Live follow-up reproduced existing_chat_metadata_forbidden when title version was zero; native preflight now uses message existence to distinguish new chats, with passing regression.
  - Local draft save and receipt notifications no longer trigger composer reloads; origin and stale-read regressions pass.
  - Live typing still reproduces identical text corruption after draft guards; UIKit adapter rejects keyboard edits while manually changing storage and selection.
  - Eight native text adapter tests pass after allowing UIKit to commit edits; v11 live exact prompt and relaunch persistence pass.
  - v11 follow-up reproduces missing original-request history after durable preflight; obsolete native history resend is rejected while the web includes history in the committed original request.
  - Signed iPhone simulator chat-core-v14 on 2026-09-11 passes recovery regressions and full password/OTP, exact typing, streamed response, relaunch, exact-chat reopen, and follow-up recalling Osaka from persisted history (146.6 seconds total test session).
  - Web reference session currently stalls before sending phased sync; exact cross-client history proof remains pending.
handoff:
  current: iPhone core workflow passes; verify iPad, integrate the scoped candidate, then archive for TestFlight passkey verification.
  verification: Use focused native regressions and live XCUITest; verify passkeys with a TestFlight build.
