  history_and_progressive_rendering:
    status: verifying
    evidence: 120-message bounded-window traversal and exact Astral three-traversal workflow pass on iPhone. Incremental grammar, mounted-prefix identity and live-citation workflows pass, including iPad resize across the 500-point breakpoint with retained paragraph identity. Actual 160-message fixture traversal, resize, citation and long-press Copy pass in speech-header-milestone-v4. The isolated carousel check does not establish live account membership parity.
  auth_and_password_signup:
    status: verifying
    evidence: Real password/OTP login and 46 focused combined units plus 12 iPhone UI workflows pass. auth-sync-milestone-v1 passes 102 focused units and ten actual simulator workflows, including nine signup form/coordinator paths with four passkey registration/cancellation/PRF fallback/uncertain-login paths. No account or credential was created; platform registration remains unverified.
  composer_and_model_preference:
    status: implementing
    evidence: 76 focused model, session, streaming and preview configuration tests pass. The actual provider/model switch routes a draft and Auto clears its prefix in iPad UI testing. All 26 speech tests and ten platform editor adapter tests pass in milestone69-final-v3, including transfer of draft preferences before a controller mounts, account changes and concurrent writes. The real welcome composer sends successfully after correcting its initially empty speech host and removing the mounted-controller dependency. Single and batched upserts persist the accepted merge. Real provider playback remains unverified.
  multi_client_streaming:
    status: implementing
    evidence: Independent same-chat subscribers, compact current-turn replay, and synchronous account-generation fences pass 13 regression tests. Source review confirms backend streaming fans out to every foreground connection with the matching active chat independently of saver ownership; web and native reannounce that chat on reconnect. Live simultaneous web/CLI/macOS/iOS streaming and mid-response rejoin remain unverified.
  embed_headers_and_overlay_actions:
    status: implementing
    evidence: Rendered web gradient stops, physical 135-degree geometry, decorative motion, and 41-point white-on-20-percent-white controls are implemented. Four actual UI checks pass in speech-header-milestone-v4 for child embed opening, regular 300-by-200 cards, 730/731 header sizing, scroll-dependent overlay controls and real More/Copy/Close. Rendered native comparison remains required.
    preview_reference: User explicitly rejected the obsolete tall mobile preview variant. Keep the regular wide 300-by-200 embed card on phones and desktops, matching the actual web chat. Only fit narrower available containers when necessary.
  continuation_and_sidebar:
    status: implementing
    evidence: Last-opened profile updates, draft-content presence and metadata ordering pass focused tests. workspace-milestone-v4 passes 130 units, including 18 actual in-memory SwiftData draft encryption/deletion-fence tests, six image-loader and five sidebar policy tests. Actual sidebar date groups, eleven-row initial limit, twenty-row expansion, selected old-chat retention, search and selection/collapse pass UI tests. Nine source-bound backend pagination tests pass; full backend runtime, installed-cache migration, reminder priority and uncached resume metadata remain unverified. Fixture results do not establish live account membership parity.
  responsive_workspace_panes:
    status: implementing
    evidence: Stable mounted production chat/embed, sidebar and settings panes now use measured web rules at 1280, 730 and 390. Split uses 400-point chat plus ten-point gap only when available content is at least 1024; sidebar uses a 600-point window breakpoint and settings an independent 1100-point breakpoint. Six layout/visibility/isolation units pass. milestone69-final-v5 passes the complete actual workspace UI test in 52.534 seconds with split geometry, child opening, chat hide/restore, Learning setting retained across 730/390/available-width reflow, phone sidebar closing settings, disabled offscreen settings actions, restoration and mutation of the same setting, and retained embed route and transcript anchor. The test follows actual controls rather than interpreting retained native accessibility nodes as visibility. Hidden panes suspend decorative animation and reject stale scroll-anchor writes while preserving streaming and sync.
  workspace_and_chat_release:
    status: uploaded
    release: 0.18.0 build 69
    evidence: The final 107 focused tests and actual workspace workflow pass. milestone69-live-v6 passes fresh password login, exact native typing, initial response, immediate relaunch, exact sidebar chat, contextual follow-up and server-acknowledged encrypted persistence in 202.306 seconds. macOS and iOS/iPadOS archive, export and verified upload all succeeded. Both distribution packages passed signature, version and entitlement checks; all 480 frozen source hashes remained unchanged. Processing/publication was not polled. Work stopped at the user's request after both uploads succeeded.
  all_embed_families:
    status: inventory
    user_direction: After build 69 TestFlight delivery, ensure every existing app preview and fullscreen view matches the rendered web counterpart, including events, health, travel and code.
    verification: Inventory each family, inspect its actual web fixture and parent container, exercise native production controls at phone/tablet/desktop widths, then run focused regressions and release verified milestones. Existing mapping coverage alone is not visual or interaction acceptance.
  landing_and_remaining_auth_visuals:
    status: implementing
    evidence: Rendered guest landing, interest selection and Show all chats measured at phone, desktop and tall-window sizes. Shared production presentation and a generated index with lazily loaded actual web example transcripts are being prepared privately for the next milestone. Full phone/tablet/desktop parity and live passkey signup are not claimed.
