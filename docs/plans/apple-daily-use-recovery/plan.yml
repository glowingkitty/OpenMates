id: apple-daily-use-recovery
title: Restore the Apple daily-use chat flow
status: implementing
goal: >-
  Restore and complete the Apple everyday chat experience across iOS, iPadOS and
  macOS: reliable authentication, account history, performant chat rendering,
  push delivery and correct-chat notification replies. Provide isolated native
  component previews and match the confirmed web composer, embed preview,
  fullscreen and chat-history flows responsively from wide windows to phones,
  followed by landing, login and signup parity.
authorization:
  product_scope: User approved the five-step recovery proposal on 2026-09-11 and explicitly resumed and expanded the work on 2026-09-12 to notification completion, isolated previews, performance and the named responsive UI and authentication surfaces.
  local_tools: User explicitly authorized local debugging tools and updating the ios skill.
  real_device_delivery: User requested TestFlight for testing builds beyond the simulator.
scope:
  - Installed-build identity, signing and passkey relying-party configuration.
  - Password and passkey session establishment and encrypted account unlock.
  - Complete progressive history, opening chats, streaming and persistence.
  - Relaunch and reconnect; targeted iPhone and iPad verification.
  - After chat loading/rendering/scrolling is verified, validate push delivery and notification replies reaching the correct chat through the normal send flow.
  - After recovery and TestFlight delivery, extend development-only Apple component previews and fixtures using existing infrastructure, with confirmed web previews as visual references, and update Apple/iOS development guidance.
  - Complete push delivery and inline notification replies across foreground, background, terminated launch and reconnect.
  - Add isolated Apple component fixtures and interactions using existing development infrastructure and update Apple/iOS development guidance.
  - Match the confirmed rendered web composer, embed preview, fullscreen and chat-history UI across wide desktop, tablet and phone layouts.
  - After core chat surfaces, match landing, login and signup UI and interaction flows.
  - After the current TestFlight milestone, verify and correct every existing app embed preview and fullscreen family, including events, health, travel and code, against rendered web references and deterministic native interaction tests.
non_goals:
  - Unrequested web surfaces, unrelated settings, new embed types or Watch recovery.
  - Backend authentication changes or weakening encryption/signing requirements.
specification_refs:
  - specifications/features/auth/specification.yml
  - specifications/architecture/sync/specification.yml
  - specifications/features/chats/specification.yml
affected_assertions:
  - auth.login.method-convergence
  - auth.passkey.origin-prf-bound
  - auth.session.lifecycle
  - sync.startup.bounded-phases
  - sync.surface.semantic-parity
  - chats.persistence.client-encrypted
  - chats.message.identity-idempotent
acceptance:
  - Both real login methods unlock existing encrypted chats.
  - Chat identities match the web account, including beyond the first recent window.
  - Recent history becomes usable before all historical message content is loaded.
  - New chats and follow-ups stream, persist after relaunch and appear on the web.
  - Reconnection does not lose messages, duplicate sends or leave loading stuck.
  - Physical iPhone authentication/lifecycle and iPad layout are checked explicitly.
  - Push delivery and notification replies are verified across foreground/background, reconnect and relaunch; replies reach the intended chat and follow the normal web-equivalent message processing path.
  - Development-only fixtures can load the relevant native component in isolation, exercise its interactions, and pair it with the confirmed rendered web reference.
  - Composer, embed preview, fullscreen and chat history match confirmed web layout and interaction behavior at wide desktop, tablet and phone widths.
  - Landing, login and signup match the corresponding confirmed web flows after core chat UI verification.
  - Performance verification includes repeated full-depth long-chat traversal and representative composer/embed interactions, not only startup or a few scroll gestures.
