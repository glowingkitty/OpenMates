schema_version: 2
profile: concise
id: chat-latency-improvements
title: Immediate submission and faster general chat processing
status: implementing
goal: >-
  Implement and test the difference - both for OpenMates cli requests and web app
  requests once deployed - to compare before and after processing times.
  Target must be 2-3 seconds max for such a simple request that doesn't use any
  app skills until the response starts streaming.
approved_by_user: true
approval_basis: >-
  The user explicitly specified immediate optimistic submission, collapsed icon-only
  Send, removal of the focused gray backdrop, two-stage routing with immediate model
  resolution and selected-Mate feedback, metadata-only focus warm-up, and then
  directed implementation and deployed CLI/web before-and-after testing.
review: report.md
baseline: baseline-summary.json
scope:
  in:
    - Immediate web submitted-snapshot handoff to sending history and empty composer, preserving new drafts and existing offline recovery.
    - Focused labeled Send and minimized blurred-draft round orange up-arrow Send; remove focused gray translucent backdrop.
    - Stage one selects complexity, Mate, apps and Projects, followed immediately by model resolution and existing selected-Mate typing event.
    - Stage two selects skills, Focus modes, Project Focus modes and authorized Workflows; preserve consent, safety, billing and execution gates.
    - Authenticated first-party focus warm-up of bounded authorized Workflow metadata, without draft text, inference or Workflow execution.
    - Warm preparation on web composer focus and authenticated TUI startup, including later login, Team changes and reconnects; actual requests renew encrypted discovery retention for two hours.
    - Reduce ordinary no-Project/no-Workflow Send preparation and redundant routing requests while preserving required safety decisions and fresh access checks.
    - Focused component and shared backend/CLI contract checks, scoped dev deployment and matched real-AI CLI/web timing comparison.
  out:
    - Typing-time inference or draft prediction; this proposal was explicitly rejected.
    - Production deployment, Apple UI redesign, unrelated rendering optimization or full provider benchmarks.
decisions:
  - Reuse existing durable pending-message/reconnect path; avoid duplicate history rows and executions.
  - Warm-up is optional preparation with a correct cold-cache fallback and must not delay Send.
  - Reauthorize selected Workflow details and Project access; cached metadata never grants execution access.
  - Shared early typing events preserve current client protocol and terminal cleanup.
  - Existing explicit user instructions authorize implementation; recording these contracts does not reopen approval.
  - The first-pass capital question is 7.96 seconds in CLI and 11.238 seconds in web; neither meets the user's 2–3-second authored-stream target.
  - Required public decisions are evaluated in stage one and reused in stage two. Only a confirmed empty candidate catalogue with complete valid decisions can avoid another Jev call; uncertainty retains the full detailed pass.
  - Reuse one in-flight initial Project focus read per send, retain later fresh authorization checks, and collect independent Project routing metadata concurrently.
  - Dragonfly retains encrypted Workflow discovery for two hours with non-expiring invalidation generations; browser Project/Task projections use existing bounded caches. Project access and accepted Plan approval remain fresh rather than receiving a two-hour permission cache.
  - The a623 ordinary retest still misses the target (capital medians 8.805 seconds CLI and 8.882 seconds web); retain regressions and exact per-request critical-path evidence.
  - Overlap only a same-scope empty connected-account lookup; preserve fresh Focus and approved-Plan reads because locally new draft IDs may already exist on the server.
  - Use the API's existing encrypted transient-summary index instead of a redundant worker chat-ID scan; keep active-turn and source ownership, Team, expiry and revision checks before use.
  - Omit unavailable tool-only prompt guidance and unused late typing-key preparation; preserve independent question protocols, safety and default model/thinking behavior.
  - Reuse a personal authentication receipt only for the exact memory snapshot returned by that preparation, once within five seconds and after session/cookie/account/Team/master-key rechecks; arbitrary snapshots, other sockets and Team sends retain fresh validation.
  - The d59 ordinary retest still misses the target (capital medians 7.208 seconds CLI and 8.344 seconds web); Berlin CLI regressed to 31.009 seconds. Keep first authored text separate from optimistic UI, reasoning, tool execution and command completion.
  - Defer only same-scope uncertain queue history reconciliation while an ordinary send prepares its outbound frame. A successful awaited user-frame dispatch permits an ordered queue refresh; failure and changed authentication, Team or connection scope retain normal reconciliation.
  - Match optional app-skill and sub-chat prompt guidance to the final forwarded capabilities. A built-in Task tool alone does not justify app-skill or sub-chat guidance; retain independent questions and safety rules.
  - The 9bd ordinary retest regressed in all four prompt/client medians (capital 17.836 seconds CLI and 15.201 seconds web; Berlin 41.392 seconds CLI and 33.452 seconds web). Keep the latency outcome open and preserve actual provider timeouts/retries and first-chunk delays separately from local preparation and completion.
  - AF4 did not exercise same-chat uncertain queue deferral on an active send. The worker has two prefork children and independent chats overlapped; neither global serialization nor provider quota exhaustion is established by the task-start gap.
  - Keep web presentation, queued-edit/steer and editable microphone-transcript outcomes distinct from the unmet authored-streaming target. The remaining parent focus backdrop and premature completed-response presentation were found in retained evidence; their focused fixes and verification remain required. Native Apple presentation is not separately verified.
  - Further latency work must account for pre-provider preparation as well as provider tail delays. Do not omit required no-tool output, safety, privacy or question instructions, silently change the approved Gemini 3.8 LOW default, or attribute small timing cohorts to a branch they did not exercise.
  - The selected-Mate feedback target is at most 1500 ms from Send, ideally below 1000 ms; do not show generic Assistant Thinking before stage-one Mate selection.
  - The October 12 critical-path report distinguishes measured blocking client/context work, provider first-chunk timeouts, worker admission gaps and completion tails. Its proposed compact admission/routing budgets are not deployed performance claims.
specifications:
  - feature.message-input
  - feature.chat-processing-feedback
  - feature.ai-model-routing
  - feature.workflows
acceptance_criteria:
  - Clicking an eligible Send transfers the exact submitted content into one sending row and clears the composer before asynchronous preparation, IDB or server acceptance; newer typing survives completion/failure.
  - A blurred text draft has a reachable circular orange icon-only Send; focusing restores the labeled Send; focused composer has no translucent gray backdrop.
  - Stage-one resolved model and Mate are published before detailed stage-two processing; overrides, consent, safety and terminal-state behavior remain correct.
  - Repeated focus does not trigger inference or duplicate hydration; warm metadata is shared with inference workers and scoped to the authorized owner/Team.
  - Before/after deployed CLI and web samples use the same prompts, account state and model settings, with source identity, sample counts, timings and recording links retained.
  - Ordinary factual no-tool requests start authored response streaming within the user's 2–3-second target, measured separately from Thinking, reasoning, finalization and command completion; report any samples that miss it.
required_checks:
  - Focused composer unit tests and runner-local bare component Playwright proof at compact and regular widths.
  - Focused backend tests for two-stage routing, early events, failure/gate cleanup, metadata cache miss/hit, authorization and selected Workflow revalidation.
  - Relevant isolated product CI for authenticated web and CLI send/processing contracts.
  - Scoped dev deployment health and matched real-AI deployed CLI/web benchmark; inference checks run on dev under the repository exception.
  - Specification validation/generated metadata, Plan validation and git diff --check.
evidence:
  - critical-path-2026-10-12.md contains the retained per-phase ordinary-request timeline, current flow, recommended warm-up/cache/parallel/conditional architecture and proposed timing budgets.
  - baseline-summary.json contains retained observational timing, not a matched before/after control.
  - Controlled benchmark results and recordings are recorded separately from the retained diagnosis.
  - AF4's twelve actual inference turns passed on deployed 9bd2039 and pinned CLI alpha.61; all seven valid recordings uploaded. The first browser launch failed before requests or capture, and the delayed retry limits comparison of local load.
  - Focused AF4 checks passed 52 frontend and 64 backend cases; the two browser cases passed on tested source f78f64b3, whose thirteen selected product paths equal the published source. Generated-index regeneration does not imply a CI run on the derivative SHA.
