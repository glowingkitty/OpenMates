decisions:
  - id: D-1
    status: active
    decision: Existing encrypted records and objects are never rewritten by this spec.
    reason: Avoiding decryption loss takes precedence over historical remediation.
    decided_at: "2026-08-02"
  - id: D-2
    status: active
    decision: Legacy decrypt readers remain and are protected by immutable fixtures.
    reason: Existing chats, media, links, invoices, and sessions must remain readable.
    decided_at: "2026-08-02"
  - id: D-3
    status: active
    decision: New media uses one v2 encrypted representation after reader readiness.
    reason: Reader-first rollout avoids duplicate media storage.
    decided_at: "2026-08-02"
  - id: D-7
    status: active
    decision: Media v2 uses a versioned nonce-prefixed object, with bytes `nonce[12] || ciphertext || tag[16]` and an explicit per-variant `encryption` marker.
    reason: The object is self-describing, existing web and Apple helpers already contain this primitive, and readers can select it without trial decryption.
    decided_at: "2026-08-02"
  - id: D-8
    status: active
    decision: Existing CLI session files are never auto-migrated; stronger storage applies only on a new explicit save after successful legacy load.
    reason: Read-time migration could turn a working local session into an unreadable one.
    decided_at: "2026-08-02"
  - id: D-9
    status: active
    decision: Invoice regeneration creates a new immutable ciphertext-version row and object; it never updates the original invoice ciphertext row.
    reason: Append-only version selection preserves the original decryption contract and avoids pointer mutation on existing encrypted metadata.
    decided_at: "2026-08-02"
  - id: D-10
    status: active
    decision: V2 writer activation is controlled by a checked-in rollout manifest and a deploy audit, not by an unverified runtime guess.
    reason: Activation must be impossible until immutable R1 reader evidence names the minimum reader commit and all non-waivable gates pass.
    decided_at: "2026-08-02"
  - id: D-11
    status: active
    decision: Replace all three zero-key unsupported-runtime returns with standards-compatible WebCrypto PBKDF2, SHA-256, and HKDF when available and typed fail-closed errors otherwise.
    reason: Password/API/recovery wrappers, passkey wrappers, and encrypted-email records must never silently use a universal key; Node and worker runtimes with WebCrypto can derive the same bytes safely.
    decided_at: "2026-08-03"
  - id: D-12
    status: active
    decision: Detect possible historical zero-key AES-GCM wrappers and NaCl encrypted-email records with a read-only audit, but never rewrite or recover them automatically.
    reason: Authentication verification under the zero key identifies either format with negligible false-positive probability, while recovery requires a separate approved contract.
    decided_at: "2026-08-03"
  - id: D-14
    status: active
    decision: Run the zero-key detector on production through the approved SSH 3FA workflow before removing any of the three fallbacks.
    reason: Static reachability analysis lowers expected exposure but cannot prove that historical production records are unaffected.
    decided_at: "2026-08-03"
  - id: D-15
    status: active
    decision: Treat password PBKDF2, email SHA-256 derivation, passkey HKDF, Apple PBKDF2, and Apple secure RNG as fail-closed cryptographic operations.
    reason: No production cryptographic API may return zero-initialized output after missing runtime capability or native failure.
    decided_at: "2026-08-03"
  - id: D-16
    status: active
    decision: Future human-transcribed variable code characters exclude digit `0` and uppercase `O`, while legacy validation remains unchanged.
    reason: The small entropy reduction is acceptable and can be offset by length where necessary; preventing transcription errors improves practical security.
    decided_at: "2026-08-03"
  - id: D-17
    status: active
    decision: New media v2 records store only Vault-wrapped server-side AES keys, not raw aes_key values in Directus.
    reason: Existing raw-key persistence contradicts the claimed key boundary and unnecessarily increases database-compromise impact.
    decided_at: "2026-08-03"
  - id: D-18
    status: active
    decision: Missing chat-key state aborts embed persistence instead of generating an unrelated random embed key.
    reason: A securely random but untracked fallback key can still make persisted embed ciphertext undecryptable.
    decided_at: "2026-08-03"
  - id: D-19
    status: active
    decision: Fixed labeled prefixes such as `OM-` remain unchanged and are exempt from the 0/O prohibition; only variable human-entered characters exclude `0` and `O`.
    reason: The fixed prefix is recognizable and unambiguous by position, while preserving bank-reference and identifier compatibility.
    decided_at: "2026-08-03"
  - id: D-13
    status: active
    decision: Keep the existing encrypted domain-policy behavior authoritative and defer signed-policy activation to a separate follow-up; retain the optional compatibility loader without publishing signed production assets.
    reason: The user confirmed that this hardening spec must leave blocked-domain policy encryption and activation behavior unchanged.
    decided_at: "2026-08-04"
  - id: D-4
    status: active
    decision: Historical ciphertext migration requires a separate spec and approval.
    reason: Migration has materially different data-loss and rollback risks.
    decided_at: "2026-08-02"
  - id: D-5
    status: active
    decision: Apple can cut directly to v2 because no distributed Apple cohort exists.
    reason: Confirmed by the user.
    decided_at: "2026-08-02"
  - id: D-6
    status: active
    decision: Short-link hardening changes generated secret length and sampling, not KDF or ciphertext format.
    reason: Existing six-character links then remain decryptable without a second KDF.
    decided_at: "2026-08-02"

