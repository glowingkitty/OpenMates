  verification_strategy:
    - Freeze and run red compatibility fixtures before production code.
    - Verify direct dev API media and invoice contracts first.
    - Verify CLI/SDK applicability and parity before deployed web checks.
    - Deploy web, run media/share Playwright, and inspect laptop/mobile media rendering.
    - Obtain user confirmation before Apple targeted tests and build for the reader-only R1 release.
    - Activate v2 writers only after R1 evidence is immutable, then prove R1 can decrypt R2 output.
    - Run spec_verify before completion.
  migration_backfill:
    - No historical chat, media, invoice, share, recovery, or local-session backfill is authorized.
    - Existing invoice rows become implicit immutable v1 records; only future regeneration appends a new version.
    - Existing CLI files remain in place even after a verified v2 slot is selected.
    - Historical zero-key matches produce findings only and require a separate recovery spec.
  observability:
    - Record format version, operation category, success/failure class, and duration only.
    - Record rollout manifest version and minimum R1 commit in startup health output.
    - Record zero-key audit counts and hashed identifiers only; never emit decrypted bytes or raw crypto material.
    - Alert on unknown media encryption markers, v2 decrypt failures, signed-policy verification failures, and attempted rollback below R1.
    - Production zero-key evidence records only eligible/scanned/matched counts by record category plus sanitized run identity; raw logs remain on the controlled host and contain no sensitive material.
  assumption_checks:
    - A-3 is confirmed by source tracing; CLI/npm/pip media checks are applicability/parity gates, not local S3 decryption implementations.
    - A-4 requires a conclusive negative production detector result across PBKDF wrappers, passkey-HKDF wrappers, and NaCl email records specifically before the P-2 zero-return removal task; it does not block detector implementation or unrelated slices.
    - A-5 is confirmed; domain-policy work has no frontend decryption task.
    - A-6 is confirmed; exact entropy and rate/attempt controls are frozen in security-code tests before generator changes.
    - A-7 must be proven through a real dev Vault unwrap and media download specifically before P-5 R2 activation or raw aes_key omission; it does not block earlier fixture/reader work.
    - Signed domain-policy activation is deferred to F-4; this spec preserves existing encrypted policy behavior and does not provision or publish production signing material.
  acceptance_coverage:
    - "AC-1/AC-2/AC-12: shared fixtures, runtime write spies, and security review."
    - "AC-3/AC-4: backend writer tests, rollout audit, R1 manifest, and actual R2 REST/web/Apple read-back."
    - "AC-5: append-only invoice tests and real dev API download proof."
    - "AC-6/AC-7: frontend crypto unit tests plus deployed legacy/new short-link proof."
    - "AC-8/AC-9: recovery vectors and real CLI/npm/pip applicability checks."
    - "AC-10/AC-14: API, worker, and self-host signed-policy image tests."
    - "AC-11: deterministic RNG audit and format-preservation tests."
    - "AC-13: synthetic/dev detector proof plus mandatory prod-ssh 3FA read-only audit with complete eligible/scanned counts."
    - "AC-15: injected Apple CommonCrypto/SecRandom failure tests and remote Apple verification."
    - "AC-16: v2 media persistence tests, Vault unwrap proof, legacy raw-key read fixture, and missing-chat-key web failure test."
  verification_order:
    - Build, review, and pass the synthetic/dev zero-key detector before any production access.
    - Run the non-waivable production zero-key audit through prod-ssh; stop the zero-fallback slice on any match or incomplete scan.
    - R1 direct REST API legacy/v2 reader contract against api.dev.openmates.org while legacy writers remain active.
    - Real CLI then local npm/pip checks where applicable; otherwise record scoped not-applicable evidence.
    - GitHub Actions reproduction only after local API/CLI/SDK gates.
    - R1 deployed web Playwright.
    - Reviewed laptop/mobile visual smoke.
    - User confirmation.
    - Apple remote targeted reader tests and build last for R1.
    - Security-approved phase exception: atomically activate R2 v2 writers without further client implementation.
    - Prove actual R2 output through REST and the pinned R1 rollback reader.
    - Prove the same actual R2 output through deployed web.
    - Prove the same actual R2 output through Apple last.
  plan_approval_required: true
  plan_approval_reason: >
    The plan resolves material security and rollout decisions not explicit in
    the initial product contract: nonce-prefixed media v2, an R1/R2 activation
    manifest, append-only invoice versions, separate-slot CLI storage, a
    read-only zero-key audit, and Ed25519-signed backend policy bundles.

