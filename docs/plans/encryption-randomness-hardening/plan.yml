assumptions:
  - id: A-1
    text: Affected nonce reuse is confined to identified server-encrypted media and invoice paths, not normal chat encryption.
    category: encryption_scope
    required_before: implementation
    status: confirmed
    evidence:
      - {source: frontend/packages/ui/src/services/encryption/MessageEncryptor.ts, summary: "Normal chat fields generate a fresh IV per encryption."}
      - {source: backend/upload/routes/upload_route.py, summary: "Uploaded variants explicitly reuse one key and nonce."}
  - id: A-2
    text: No distributed Apple cohort requires old media writer compatibility.
    category: rollout
    required_before: implementation
    status: confirmed
    evidence:
      - {source: "user clarification 2026-08-02", summary: "Apple is not deployed to App Store or testers."}
  - id: A-3
    text: npm and pip SDKs do not locally decrypt the affected S3 media variants in public flows.
    category: sdk_scope
    required_before: task_execution
    status: confirmed
    evidence:
      - {source: frontend/packages/openmates-cli/src/client.ts, summary: "Current media flows preserve metadata or use backend downloads."}
      - {source: packages/openmates-python/openmates/sdk.py, summary: "Current embed decryption targets embed records rather than S3 media blobs."}
  - id: A-4
    text: Current production call sites do not reach the password, email-key, or passkey-HKDF zero branches during ordinary browser use, but historical password/API/recovery wrappers, passkey wrappers, and encrypted-email records have not yet been audited.
    category: data_safety
    required_before: completion
    status: confirmed
    evidence:
      - {source: frontend/packages/ui/src/components/signup/steps/password/PasswordBottomContent.svelte, summary: "Signup wrapping runs in a browser submit handler."}
      - {source: frontend/packages/ui/src/services/hiddenChatService.ts, summary: "Hidden-chat derivation is browser-guarded before calling the shared KDF."}
      - {source: "git blame 3b92f7acd7 and 4f287fcbca", summary: "The zero return originated as an SSR/import-safety fallback, not a documented ciphertext format."}
      - {source: "production read-only audit 2026-08-03", summary: "A complete stable 3FA SSH scan covered 3555 eligible records across all six present categories with zero matches and zero errors; the optional post-production collection was confirmed absent."}
    blocker_contract: Removal of any of the three zero returns requires a conclusive negative production audit across PBKDF-derived wrappers, passkey-HKDF wrappers, and NaCl encrypted-email records; any positive or unavailable audit blocks all three removals and requires a separate approved recovery spec.
  - id: A-5
    text: Frontend, CLI, pip, and Apple do not decrypt or require plaintext domain-policy files.
    category: domain_policy_boundary
    required_before: implementation
    status: confirmed
    evidence:
      - {source: frontend/packages/ui/src/stores/serverStatusStore.ts, summary: "Web consumes only server edition, payment, self-host, and safe status fields."}
      - {source: backend/core/api/app/routes/auth_routes/auth_email.py, summary: "Signup returns a generic domain-not-supported decision."}
      - {source: backend/core/api/app/services/domain_security.py, summary: "Policy files are loaded and enforced locally by the backend."}
  - id: A-6
    text: Removing `0` and `O` from newly issued human codes leaves sufficient entropy under existing attempt/rate controls.
    category: credential_entropy
    required_before: implementation
    status: confirmed
    evidence:
      - {source: backend/core/api/app/routes/auth_routes/auth_pair.py, summary: "Six-character pair codes already use an unambiguous 26-character alphabet with five attempts per token."}
      - {source: backend/core/api/app/routes/auth_routes/auth_2fa_utils.py, summary: "Twelve-character backup codes retain over 56 nominal bits with a 26-character alphabet."}
      - {source: backend/core/api/app/routes/auth_routes/auth_recovery.py, summary: "Six-character email recovery codes are protected by five verification attempts per hour; digits 1-9 retain about 19 nominal bits."}
  - id: A-7
    text: Authorized backend media readers can obtain new v2 AES keys from Vault-wrapped material without requiring raw aes_key persistence.
    category: media_key_boundary
    required_before: completion
    status: confirmed
    evidence:
      - {source: backend/upload/routes/upload_route.py, summary: "Upload records already persist vault_wrapped_aes_key and vault_key_id context for server-side use."}
      - {source: backend/core/api/app/routes/generated_assets_api.py, summary: "Generated-asset reads already have an authorized backend decryption boundary that can be adapted to unwrap v2 keys."}
      - {source: "docker exec api python /app/backend/scripts/verify_media_vault_roundtrip.py", summary: "Real dev Vault wrap, wrapped-key-only Directus persistence, S3 download through api.dev.openmates.org, exact plaintext recovery, and cleanup all passed at de5c5f2c7."}
  - id: A-8
    text: Signed domain-policy activation is intentionally deferred while existing encrypted domain-policy behavior remains unchanged.
    category: scope
    required_before: completion
    status: confirmed
    evidence:
      - {source: "user clarification 2026-08-04", summary: "Defer signing domain policy activation and keep encrypted behavior unchanged."}

contracts:
  api:
    - route: Existing upload and generated-media routes
      access_model: first-party client surface only
      auth: Existing authenticated owner scoping remains unchanged.
      rate_limits: Existing upload and generation limits remain unchanged.
      credit_budget: Existing generation credit controls remain unchanged.
      encryption_boundary: Encrypted media metadata only; no plaintext, raw keys, nonces, or fragments in logs.
      request: Existing request formats remain accepted.
      response: Legacy records retain top-level aes_nonce; new records expose explicit media v2 metadata.
      errors: [unsupported_client_crypto, encryption_metadata_invalid]
    - route: Existing generated-asset download routes
      access_model: first-party client surface only
      auth: Existing signed-token or session owner scoping remains unchanged.
      rate_limits: Existing limits remain unchanged.
      credit_budget: No new charge.
      encryption_boundary: Authorized backend decryption only; no plaintext or key logging.
      request: Existing asset and variant identifiers.
      response: Existing plaintext media response after legacy or v2 decryption.
      errors: [Unsupported encryption version fails closed.]
    - route: POST and GET /v1/share/short-url
      access_model: Authenticated first-party create; unauthenticated token-scoped resolve.
      auth: Existing owner checks for create/revoke and token possession for opaque resolve.
      rate_limits: Existing limits remain unchanged.
      credit_budget: No charge.
      encryption_boundary: Server receives only token and opaque ciphertext; fragment never reaches HTTP.
      request: Existing schema unchanged.
      response: Existing encrypted_url response unchanged.
      errors: [Existing missing, expired, and revoked behavior remains unchanged.]
    - route: Existing invoice download route
      access_model: first-party client surface only
      auth: Existing authenticated owner scoping remains unchanged.
      rate_limits: Existing limits remain unchanged.
      credit_budget: No charge.
      encryption_boundary: Authorized backend decrypts invoice; no plaintext or key logging.
      request: Existing invoice identifier.
      response: Existing PDF response.
      errors: [Replacement metadata is not published before read-back verification.]
  data:
    - Existing ciphertext and metadata are immutable under this spec.
    - Legacy media records continue to use record-level aes_nonce.
    - New media v2 objects are `nonce[12] || ciphertext || tag[16]` and each variant carries `encryption: aes-gcm-nonce-prefixed-v1`.
    - Legacy records without that marker use the record-level aes_nonce; unknown markers fail closed and readers never trial-decrypt formats.
    - Chat formats A-D and recovery envelope v1 remain unchanged.
    - New CLI local storage is versioned while legacy session files remain readable and are not rewritten on load.
    - Regenerated invoices append immutable ciphertext-version rows and objects; existing invoice ciphertext rows are never updated.
    - CLI v2 storage uses a separate file or slot, verifies reopen before selection, and retains the legacy file indefinitely.
    - A checked-in media rollout manifest records `write_version`, minimum R1 reader commit, required evidence IDs, and activation timestamp.
    - The deploy audit rejects `write_version: 2` unless every listed R1 evidence record is passed for the minimum reader commit; missing, stale, or malformed evidence leaves legacy writing active.
    - R2 activation is one atomic manifest/config change. Disabling v2 stops new v2 writes but all deployed R1/R2 readers continue reading already-created v2 objects.
    - Zero-key audit covers AES-GCM wrapped master/chat keys and NaCl encrypted-email records; output contains only sanitized identifiers, record category, timestamps, and boolean match.
    - Domain policy v2 is canonical JSON with schema and policy versions plus a detached Ed25519 signature verified by an embedded public key.
    - The signing private key exists only in the approved release-signing environment and is never shipped in API, worker, web, CLI, pip, or Apple artifacts.
    - The proposed signing owner is the release-maintainer role; the private key is provisioned as a protected GitHub Actions environment secret with an independently controlled backup and documented rotation procedure.
    - A manually dispatched signing workflow canonicalizes the reviewed policy, signs it, and produces the detached signature for review; API/self-host image builds verify the signature before publication.
    - New OpenMates email/action/recovery OTPs use six characters from `123456789`; validators continue accepting legacy six-digit values containing `0` through and after TTL overlap.
    - New backup codes keep `XXXX-XXXX-XXXX` but use the existing unambiguous pair alphabet; existing Argon2 hashes remain exact-valid.
    - New pair tokens/PINs retain their current unambiguous alphabet and six-character shape, with rejection sampling.
    - New signup invites retain `XXXX-XXXX-XXXX` and use digits `1-9`; exact lookup continues accepting old codes.
    - New gift cards retain their current 32-character unambiguous alphabet and `XXXX-XXXX-XXXX` shape; legacy manual/deep-link redemption continues accepting old `A-Z0-9` codes.
    - New referral codes retain their current length but use the unambiguous pair alphabet; existing persisted codes remain accepted.
    - New recovery keys retain the web/CLI 24-character shape and exclude `0`/`O`; Apple and web readers continue accepting existing 24- and 43-character keys.
    - New API-key random suffixes retain 32 characters but exclude `0`/`O`; prefix-plus-hash validation keeps old keys valid.
    - RFC TOTP values/seeds and opaque URL-fragment tokens are exempt because OpenMates does not control authenticator output or users normally scan/copy them.
    - Fixed labeled prefixes such as `OM-` are not random code characters; their variable portions continue excluding `0`/`O`.
  ui_states:
    - Legacy and v2 media render normally.
    - Unsupported clients receive update guidance, never a generic decryption failure.
    - RNG or metadata failure is visible and prevents persistence.
    - No visual redesign is required.
  privacy_security:
    - Never log plaintext, raw keys, nonces, share fragments, local secrets, invoice bodies, or S3 bodies.
    - AES-GCM nonce uniqueness is mandatory per key and encryption operation.
    - Security randomness uses OS-backed CSPRNG APIs and unbiased sampling.
    - Approved sources are WebCrypto getRandomValues/generateKey, Node crypto randomBytes/randomInt, Python secrets/os.urandom, and checked Apple CryptoKit/SecRandom APIs.
    - Mapping random bytes to non-power-of-two alphabets uses rejection sampling; RNG failure or a forced duplicate nonce aborts before persistence.
    - Compatibility never guesses formats or substitutes fixed keys.
    - Existing ciphertext migration is prohibited.
    - Domain policy remains backend-authoritative; no policy-download endpoint or client-side enforcement is introduced.
    - New media v2 rows do not persist raw AES keys in Directus; legacy raw-key rows are an explicit read-only trust boundary.
    - AC-1, AC-2, AC-4, AC-5, AC-7, AC-12, AC-13, AC-15, and AC-16 are non-waivable completion gates.

