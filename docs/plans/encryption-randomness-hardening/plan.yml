scenarios:
  - id: S-1
    title: Existing encrypted chats remain readable
    given: [Alice has legacy Format A and B messages and wrapped chat keys.]
    when: [Hardened web, CLI, pip, and Apple readers load the chats.]
    then:
      - Existing ciphertext decrypts without rewriting rows or key material.
      - Browser key caching cannot return a CryptoKey imported from a different raw key.
  - id: S-2
    title: Existing global-nonce media remains readable
    given: [Alice has uploaded and generated media with one legacy top-level aes_nonce.]
    when: [Backend, web, and Apple open every variant after rollout.]
    then:
      - Readers use the unchanged top-level nonce fallback.
      - No object bytes or metadata are changed.
  - id: S-3
    title: New multi-variant media uses unique nonces
    given: [All required backend, web, and Apple v2 readers are verified.]
    when: [Alice uploads or generates image, vector, or Remotion media.]
    then:
      - Every AES-GCM encryption uses a fresh 12-byte nonce under its key.
      - One v2 representation is stored per required variant.
      - Metadata unambiguously identifies each variant nonce.
  - id: S-4
    title: Reader readiness blocks premature v2 writes
    given: [A required reader or legacy fixture gate has not passed.]
    when: [A deployment attempts to enable v2 writers.]
    then:
      - Enablement fails before v2 media is persisted.
      - Existing readers and legacy writers remain operational in the reader-only release.
      - After v2 activation, rollback is permitted only to the verified reader-only release, never to a pre-v2-reader build.
  - id: S-5
    title: Invoice regeneration remains rollback-safe
    given: [Alice has an existing encrypted invoice that must be regenerated.]
    when: [The backend creates the replacement PDF.]
    then:
      - A fresh key, nonce, and object key are used.
      - Read-back decryption passes before the new immutable version row becomes selectable.
      - The original row, ciphertext, object, and metadata remain unchanged and retained indefinitely.
      - Latest-version selection is computed from append-only versions and does not update an existing encrypted row.
      - Untouched invoices remain byte-for-byte unchanged.
  - id: S-6
    title: Existing and new short links resolve
    given: [Alice owns an existing short link with a six-character fragment secret.]
    when: [She opens it and later creates a new short link.]
    then:
      - The old link decrypts using the unchanged KDF and format.
      - The new fragment contains at least 128 bits of unbiased random secret material.
      - The fragment never reaches server HTTP requests or plaintext storage.
  - id: S-7
    title: Unsupported password derivation fails before persistence
    given: [Password derivation runs outside window or without supported WebCrypto behavior.]
    when: [A caller attempts to derive wrapping material.]
    then:
      - A runtime with standards-compatible WebCrypto derives the same PBKDF2, email SHA-256, and passkey HKDF bytes as the browser.
      - A runtime without WebCrypto receives a typed visible error and persists no ciphertext.
      - A fixed all-zero key is never substituted.
  - id: S-8
    title: Recovery sealing always generates fresh randomness
    given: [A production client seals two payloads for one recipient and context.]
    when: [Production sealing runs.]
    then:
      - Each envelope has a fresh ephemeral X25519 key and 12-byte nonce.
      - Existing recovery v1 fixtures still open unchanged.
  - id: S-9
    title: CLI sessions remain readable across storage hardening
    given: [A user has a plaintext, keychain, or machine-encrypted CLI session.]
    when: [A CLI with stronger versioned local storage loads it.]
    then:
      - The old session decrypts without changing its file.
      - Failure leaves the original readable and does not log the user out.
      - A later explicit save writes a separate versioned file/slot only after successful legacy load and verified reopen.
      - The original legacy file remains byte-identical and retained indefinitely under this spec.
  - id: S-10
    title: Domain policy rotation cannot brick mixed-version deployment
    given: [Old and new immutable policy bundles are packaged.]
    when: [Compatibility readers start or roll back.]
    then:
      - Complete validation precedes policy publication.
      - Legacy files remain readable through rollback.
      - A corrupt new bundle cannot replace the last valid bundle.
  - id: S-11
    title: Security codes preserve formats while using CSPRNG
    given: [Existing consumers expect current OTP, backup-code, gift-card, invite, referral, recovery-key, API-key, account-ID, and pair-PIN formats.]
    when: [New values are generated.]
    then:
      - Values use CSPRNG and unbiased sampling.
      - Newly issued human-transcribed variable characters contain neither digit `0` nor uppercase `O`.
      - Existing stored or in-flight values remain valid.
      - Issuance shapes remain stable; validators may broaden for legacy compatibility but never narrow against existing values.
  - id: S-12
    title: Historical zero-key exposure is detected without changing data
    given: [Stored wrapped-key and encrypted-email records may predate removal of the zero-key branches.]
    when: [The authorized read-only audit examines eligible wrappers.]
    then:
      - It verifies AES-GCM and NaCl authentication with a zero key entirely in memory.
      - It records only sanitized record category, identifier hash, timestamp, and boolean match.
      - It never logs or persists decrypted key bytes, plaintext, passwords, salts, IVs, or ciphertext.
      - Any positive result creates a blocking security finding and separate recovery spec; this implementation performs no rewrite.
      - Production execution uses prod-ssh, confirms all eligible collections were scanned, and reports incomplete rather than clean if any collection cannot be read.
  - id: S-13
    title: Backend loads an authentic domain policy without frontend decryption
    given: [A canonical policy bundle and detached Ed25519 signature are packaged with the API image.]
    when: [API or worker startup needs domain policy before or during lifespan.]
    then:
      - The backend verifies the signature before parsing and publishes policy state only after full validation.
      - An invalid signed bundle fails closed and never falls back to legacy files.
      - A transition image may use the legacy Fernet loader only when the signed bundle is absent.
      - Web, CLI, pip, and Apple continue receiving only existing generic policy decisions and server-status fields.
  - id: S-14
    title: Native cryptographic failure cannot return zero material
    given: [Apple CommonCrypto PBKDF2 or SecRandomCopyBytes reports failure.]
    when: [Apple attempts password, share, API-key, recovery-key, or pair-login cryptography.]
    then:
      - The operation throws or returns an explicit failure before encryption or persistence.
      - No zero-initialized key or deterministic PIN is returned.
      - Existing Apple-compatible ciphertext vectors remain readable.
  - id: S-15
    title: New media and embeds preserve their key provenance
    given: [A new media v2 record or encrypted embed is being persisted.]
    when: [The backend stores media metadata or the web client resolves the embed key.]
    then:
      - Directus stores the Vault-wrapped media key but no new raw aes_key value.
      - Authorized backend reads unwrap through the existing Vault boundary.
      - Client-bound encrypted embed content retains the client decryption material through its existing encrypted contract.
      - A missing chat key aborts embed persistence rather than generating a random fallback key.
      - Legacy records containing raw aes_key remain readable and unchanged.

