risks:
  - {id: R-1, severity: critical, risk: "V2 writers enabled before readers can strand new media.", mitigation: "Gate writers on backend, deployed web, and Apple reader evidence."}
  - {id: R-2, severity: critical, risk: "Future work may mistake this spec for migration authorization.", mitigation: "Scope, AC-12, deterministic guard, and review prohibit historical rewrites."}
  - {id: R-3, severity: high, risk: "An invalid invoice version may become selectable.", mitigation: "Read-back precedes append-only version publication and the original row/object never changes."}
  - {id: R-4, severity: high, risk: "Domain-policy changes can crash-loop mixed-version API processes.", mitigation: "Immutable bundles and compatibility reader deploy first."}
  - {id: R-5, severity: medium, risk: "Longer short-link secrets can break parsers.", mitigation: "Expand readers before generation and freeze legacy fixtures."}
  - {id: R-6, severity: medium, risk: "A new CLI storage slot may be selected before successful verification.", mitigation: "Read old first, verify the separate new slot, and preserve the original indefinitely."}

related_follow_ups:
  - id: F-1
    severity: high
    status: separate_spec_required
    finding: Team email invites persist one_time_token_hash and expires_at, but the current acceptance route does not validate either value.
    reason_not_blocking: This is an existing team-authorization defect independent of encryption randomness and requires its own auth contract and compatibility review.
    sources:
      - backend/core/api/app/services/team_invite_email_service.py
      - backend/core/api/app/routes/teams.py
  - id: F-2
    severity: high
    status: separate_spec_required
    finding: Signup invite records expose valid_from and expire_date fields, but current validation performs only exact code lookup.
    reason_not_blocking: Generator hardening remains forward-compatible, while lifecycle enforcement changes signup authorization semantics and needs a separate auth spec.
    sources:
      - backend/core/api/app/utils/invite_code.py
      - backend/core/directus/schemas/invite_codes.yml
  - id: F-3
    severity: high
    status: separate_spec_required
    finding: Several TOTP verification endpoints rely on broad or inherited route limits and lack a per-challenge failed-attempt counter.
    reason_not_blocking: TOTP values are generated by external authenticators and are outside OpenMates code-alphabet control; attempt-policy changes require a separate auth review.
    sources:
      - backend/core/api/app/routes/auth_routes/auth_2fa_setup.py
      - backend/core/api/app/routes/auth_routes/auth_2fa_verify.py
  - id: F-4
    severity: medium
    status: deferred
    finding: Activate canonical Ed25519-signed backend domain-policy bundles in a separately approved release-signing task.
    reason_not_blocking: The user explicitly chose to keep existing encrypted domain-policy behavior unchanged in this hardening spec; optional signed compatibility remains inactive.
    sources:
      - .github/workflows/sign-domain-security-policy.yml
