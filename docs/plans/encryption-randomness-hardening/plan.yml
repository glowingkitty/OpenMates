schema_version: 2
id: encryption-randomness-hardening
title: Encryption Randomness Hardening Without Legacy Data Rewrites
status: verified

goal: >
  Eliminate unsafe encryption randomness and nonce handling while guaranteeing
  that existing chats, media, links, invoices, recovery envelopes, and local
  sessions remain decryptable. New formats are reader-first, legacy readers
  remain available, and this spec never bulk rewrites existing ciphertext.

scope:
  in:
    - Immutable compatibility fixtures for every affected persisted encryption format.
    - Permanent legacy readers for chat, media, links, invoices, recovery envelopes, and CLI sessions.
    - Fresh AES-GCM nonces for every new upload/generated image variant, vectorized image variant, Remotion output, and append-only regenerated invoice version.
    - One storage-efficient media encryption v2 representation for new writes after all relevant readers pass.
    - Collision-safe browser CryptoKey caching without changing ciphertext headers.
    - Stronger new short-link fragment secrets while preserving the current KDF and legacy six-character links.
    - Fail-closed password, email-key, and passkey-HKDF derivation instead of all three web zero-return fallbacks.
    - Fail-closed Apple PBKDF2 and secure-random generation instead of returning zero-initialized material after failure.
    - A read-only zero-key exposure audit covering AES-GCM wrapped keys and NaCl encrypted-email records without logging decrypted bytes.
    - A production SSH execution of the validated detector using the repository 3FA workflow before any of the three zero-return branches is removed.
    - Random-only production recovery sealing without changing recovery envelope v1.
    - Versioned CLI local key storage for newly saved sessions while existing session files remain read-only and legacy-readable.
    - CSPRNG and unbiased sampling for security-sensitive generators without changing external formats.
    - New variable characters in human-transcribed OpenMates codes never contain digit `0` or uppercase `O`; legacy validators remain broad enough to accept old values.
    - Missing chat keys fail closed instead of committing embed ciphertext under an unrelated random fallback key.
    - New media v2 records retain only Vault-wrapped server-side keys; legacy raw media-key records remain readable but are not migrated.
    - Additive, rollback-safe canonical Ed25519-signed backend domain-policy bundles with no frontend policy delivery.
    - Deterministic randomness, nonce-uniqueness, and no-migration guards.
  out:
    - Bulk re-encryption, migration, deletion, overwrite, or metadata mutation of any existing user ciphertext, including existing invoice rows and objects; invoice regeneration may only append new immutable version rows and objects.
    - Removal of any legacy ciphertext reader.
    - Production migration tooling or batches for historical nonce-reused ciphertext; these require a separate approved spec.
    - Dual storage of legacy and v2 media objects for new writes.
    - Compatibility with previously distributed Apple builds; no App Store or tester cohort exists.
    - Changes to chat ciphertext formats A-D, their KDFs, or embedded diagnostic fingerprint.
    - Changes to recovery envelope v1 fields, AAD, KDF, or version.
    - A pair-login protocol redesign; only format-preserving RNG hardening is included.
    - Automatic migration or rewrite of existing CLI session files.
    - Automatic recovery, silent zero-key fallback, or rewriting of any wrapper detected by the zero-key exposure audit.
    - Frontend, CLI, pip, or Apple download/decryption of domain-policy plaintext.
    - Changing RFC-standard authenticator-generated TOTP digits or Base32 seeds; OpenMates cannot control those alphabets.

context_discovery:
  github_issues:
    - "No matching issue found via gh issue list; GitHub MCP authentication returned 401."
  docs:
    - docs/architecture/core/encryption-architecture.md
    - docs/architecture/core/encryption-formats.md
    - docs/architecture/core/encryption-code-inventory.md
    - docs/plans/share-short-links-og-images/plan.yml
    - docs/plans/cross-device-chat-completion-recovery/plan.yml
    - docs/plans/sdk-cleartext-encryption-boundary/plan.yml
    - docs/plans/encrypted-metadata-key-acceptance-race/plan.yml
  code_patterns:
    - backend/upload/services/file_encryption.py documents and performs unsafe same-key/same-nonce variant encryption.
    - backend/upload/routes/upload_route.py encrypts original, full, and preview images with one key and nonce.
    - backend/apps/images/tasks/generate_task.py and vectorize_task.py reuse one nonce across image variants.
    - backend/apps/videos/tasks/render_remotion_task.py reuses one nonce for video and thumbnail.
    - backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py overwrites regenerated invoice ciphertext using the original key and nonce.
    - backend/core/api/app/routes/generated_assets_api.py already prefers variant-level aes_nonce before the legacy record-level nonce.
    - frontend/packages/ui/src/components/embeds/images/imageEmbedCrypto.ts and apple/OpenMates/Sources/Core/Networking/S3MediaClient.swift already support nonce-prefixed ciphertext when explicitly selected.
    - frontend/packages/ui/src/services/encryption/MessageEncryptor.ts caches imported keys by a 32-bit FNV fingerprint.
    - frontend/packages/ui/src/services/shortUrlEncryption.ts generates six-character fragment secrets and accepts at most twelve characters.
    - frontend/packages/ui/src/services/cryptoService.ts returns zero bytes from deriveKeyFromPassword, deriveEmailEncryptionKey, and passkey hkdf when window is absent, although current callers are browser event handlers or browser-guarded services.
    - apple/OpenMates/Sources/Core/Crypto/CryptoManager.swift can return a zero-initialized PBKDF2 key after CommonCrypto failure because assertionFailure is not a production error boundary.
    - frontend/packages/ui/src/services/sendersChatMessages.ts generates a random embed key when the required chat key is missing, risking future decryption mismatch.
    - upload_files records currently persist raw media AES keys as well as Vault-wrapped keys; media v2 must stop adding new raw server-side keys.
    - frontend/packages/openmates-cli/src/storage.ts reads legacy plaintext, keychain, and machine-encrypted sessions.
    - backend/core/api/app/services/domain_security.py treats three legacy Fernet policy files as mandatory startup assets.
    - Domain-policy consumers are backend-only; clients receive generic enforcement decisions and server-status flags, not policy files or plaintext.
  tests:
