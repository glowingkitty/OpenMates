implementation_notes:
  plan_path: docs/plans/encryption-randomness-hardening/plan.yml
  existing_patterns:
    - backend/core/api/app/routes/generated_assets_api.py variant nonce fallback
    - frontend/packages/ui/src/components/embeds/images/imageEmbedCrypto.ts nonce-prefixed fallback
    - apple/OpenMates/Sources/Core/Networking/S3MediaClient.swift nonce-prefixed fallback
    - frontend/packages/ui/src/services/encryption/__tests__/regression-fixtures.test.ts immutable fixtures
  architecture: >
    Implement five isolated safety slices before media writer cutover. First,
    freeze shared legacy vectors and add read-only exposure audits. Second,
    apply format-preserving fixes: collision-safe key caching, capability-based
    PBKDF2, random-only recovery sealing, unbiased generators, and separate-slot
    CLI storage. Third, deploy signed domain-policy compatibility loading and
    append-only invoice versions. Fourth, release R1 with legacy media writers
    unchanged and readers for `aes-gcm-nonce-prefixed-v1` across backend, web,
    and Apple. Fifth, after the checked-in R1 evidence manifest passes, release
    R2 by atomically activating v2 writers. R1 is then the minimum rollback
    target. Existing ciphertext, objects, rows, and legacy readers are immutable.
  data_flow:
    - "Legacy media example: a record without a variant encryption marker uses its existing top-level aes_nonce and unchanged ciphertext bytes."
    - "V2 media example: preview metadata contains encryption=aes-gcm-nonce-prefixed-v1; object bytes are nonce[12] || ciphertext || tag[16]."
    - Reader selects the explicit marker; unknown markers fail closed and no trial decryption occurs.
    - New writer requests fresh OS randomness for every operation, rejects RNG failure/forced duplicate, and publishes metadata only after object upload succeeds.
    - "Zero-key audit example: AES-GCM or NaCl authentication succeeds under 32 zero bytes for a synthetic affected record; output is only match=true plus a hashed identifier."
    - "Derivation example: browser and Node WebCrypto derive identical PBKDF2 and email SHA-256 bytes; absent WebCrypto throws before persistence."
    - "Invoice example: invoice logical id inv-1 retains immutable version v1; regeneration appends verified v2 and latest selection queries the highest valid version."
    - "Domain policy example: canonical JSON plus detached signature is verified before regex/domain parsing; clients still receive only DOMAIN_NOT_SUPPORTED or server-status fields."
    - "CLI example: session.json remains untouched; explicit save creates session.v2.json, reopens it, then selects it without deleting session.json."
  phase_slices:
    - id: P-1
      name: Legacy evidence and exposure checks
      covers: [AC-1, AC-2, AC-12, AC-13]
      work:
        - Add a hash-manifested shared fixture corpus for chat formats A-D, affected media, invoices, links, recovery v1, CLI sessions, and domain policy.
        - Add runtime write-spy tests proving all legacy fixtures remain byte-identical.
        - Add the read-only zero-key audit for password/API/passkey AES-GCM wrappers and NaCl encrypted-email records, then run synthetic/dev checks.
        - Use the prod-ssh 3FA workflow and require a conclusive negative production read-only audit before removing any of the three zero-return branches; any match, inaccessible collection, or incomplete count creates a blocker and separate recovery spec.
    - id: P-2
      name: Format-preserving cryptographic hardening
      covers: [AC-1, AC-6, AC-7, AC-8, AC-9, AC-11, AC-15, AC-16]
      work:
        - Replace 32-bit key-cache identity without changing ciphertext fingerprints.
        - After the negative audit gate, use global WebCrypto PBKDF2/SHA-256/HKDF when available and throw typed errors otherwise.
        - Make Apple PBKDF2 and SecRandom failures throw before returning key or credential material.
        - Remove deterministic recovery inputs from production APIs while preserving test-vector helpers.
        - Increase new short-link secrets to an unbiased base62 length encoding at least 128 bits while retaining legacy parsing/KDF.
        - Replace insecure/biased generators and enforce the no-0/no-O human-code issuance policy while keeping legacy validators broad.
        - Remove the random embed-key fallback and fail before persistence when chat-key provenance is missing.
        - Write CLI v2 storage only to a separate verified slot on explicit save.
    - id: P-3
      name: Backend append-only and signed-policy hardening
      covers: [AC-5, AC-10, AC-14]
      work:
        - Add append-only invoice ciphertext versions and latest-valid-version reads without updating existing rows.
        - Add canonical policy JSON, detached Ed25519 verification, and signed-first/legacy-if-absent loading.
        - Build official API, worker, and self-host images and prove identical client response contracts.
    - id: P-4
      name: R1 media readers
      covers: [AC-2, AC-4]
      work:
        - Add exact v2 readers to backend generated-assets/download paths, all shared web media helpers and export callers, and Apple while all production writers remain legacy.
        - Verify frozen v2 fixtures through REST, deployed web, visual smoke, user confirmation, and Apple.
        - Record the R1 commit and passed evidence IDs in the rollout manifest with write_version still set to 1.
    - id: P-5
      name: R2 media writers and rollback proof
      covers: [AC-3, AC-4, AC-16]
      work:
        - Activate write_version 2 only through the audited manifest change.
        - Replace upload-image, generated-image, vectorize, and Remotion writers with one fresh nonce-prefixed object per variant.
        - Stop storing raw aes_key in new media v2 Directus rows; unwrap the Vault-wrapped key for authorized backend reads.
        - Keep already-safe docs, weather, models3d, single-object audio/video/music/code writers unchanged but covered by classification tests.
        - Prove actual R2 output through REST, the pinned R1 reader, deployed web, and Apple.
        - Disable v2 writes in a rollback drill while retaining reads of all already-created v2 objects.
