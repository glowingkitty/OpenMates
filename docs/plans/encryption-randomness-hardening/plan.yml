clarification:
  rounds:
    - question: One umbrella spec or only critical nonce reuse?
      answer: One staged umbrella spec.
    - question: Store both legacy and v2 media during transition?
      answer: Avoid duplicate storage; upgrade readers and require updates where necessary.
    - question: Include migration of existing vulnerable ciphertext?
      answer: No; existing-data mutation is too risky for this spec.
    - question: Is Apple a deployed compatibility cohort?
      answer: No; Apple is not deployed to App Store or testers.
    - question: Confirm reader-first single-v2 writes, permanent legacy reads, and no existing-data rewrite.
      answer: Approved.
  vision_summary: >
    Harden every identified randomness path without risking user data. Existing
    ciphertext stays byte-for-byte untouched; new media uses one secure v2
    representation only after every relevant reader is ready. Any migration or
    legacy-reader retirement requires a separate approved spec.
  approved_by_user: true

