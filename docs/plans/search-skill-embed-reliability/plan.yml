scenarios:
  - id: S-1
    title: Current-development question can use dedicated news search
    given:
      - Preprocessing selects web-search for a recent legislative-development question.
    when:
      - Main-model tools are generated.
    then:
      - web-search, news-search, and images-search are available.
      - The main model may call the most appropriate offered skill or skills.
  - id: S-2
    title: String request items produce correlated terminal embeds
    given:
      - A model emits web-search arguments with two strings in requests instead of query objects.
    when:
      - The call streams placeholders and executes.
    then:
      - Both strings are normalized to query objects before placeholder creation.
      - Placeholder IDs correlate with execution result groups.
      - No orphan processing parent remains.
  - id: S-3
    title: Search cards remain complete after reload
    given:
      - A web or news search finishes in chat.
    when:
      - The user views and reloads the chat.
    then:
      - Every visible search card shows its query and terminal status.
      - The assistant message exposes no raw app_skill_use JSON or literal embed protocol reference.

