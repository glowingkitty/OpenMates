    - Backend terminal embed state remains compatible with Apple clients.
  verification:
    - Apple implementation is not changed; shared backend regression risk is covered by backend and CLI tests.
  intentional_native_differences: [none]

clarification:
  rounds:
    - question: Should news-search replace web-search or be available alongside it?
      answer: Always include news-search as an available companion whenever preprocessing selects web-search, like images-search; the main model chooses what to call.
    - question: What verification order is required?
      answer: Real OpenMates CLI first, then both deployed web-search and news-search spec.ts tests.
  vision_summary: >
    One user request may run one or more genuinely selected search skills, but one
    tool call must never create an abandoned queryless card. Current-information
    routing must not prevent the main model from choosing the dedicated news skill.
  approved_by_user: true

