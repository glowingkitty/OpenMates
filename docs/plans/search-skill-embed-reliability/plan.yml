schema_version: 3
id: search-skill-embed-reliability
title: Search Skill Embed Reliability
status: approved

specification_refs:
  - id: feature.app-skill.web-search
    version: 1
    role: primary
    fingerprint: 6e7afd0e24023b41490a00f29fa7e3d235b705d6b6dd9cfe407dbd8e01798657

specification_impact:
  classification: implementation_only
  specification_update_required: false
  affected_assertions:
    - web-search.request.validated
    - web-search.request.ids-correlated
    - web-search.surface-parity
  reason: >
    The approved contract already requires validated object-shaped request items,
    correlated request groups, specialized search when applicable, and cross-surface
    parity. This work repairs violations without changing those semantics.

documentation_impact:
  generated_reference: {status: unchanged, reason: No public API shape changes.}
  user_docs: {status: unchanged, reason: Bug fix restores existing search behavior.}
  semantic_layer:
    status: unchanged
    reason: Existing web-search contract and semantic page already govern the behavior.

goal: >
  Ensure web/news search routing and embed completion are reliable when the model
  emits malformed-but-recoverable request arrays: news search remains available,
  each streamed placeholder has one terminal outcome, queries survive completion
  and reload, and raw app-skill protocol references never become visible.

scope:
  in:
    - Add news-search as a companion whenever preprocessing selects web-search.
    - Normalize string-valued request-array items to schema-shaped query objects before placeholder creation.
    - Reuse one normalized argument object for placeholder creation and execution.
    - Prevent duplicate/orphan processing parents and preserve query metadata.
    - Extend web and news CLI/web regression assertions.
  out:
    - Changing provider APIs, pricing, auth, rate limits, SDK APIs, or endpoint exposure.
    - Forcing news-search to execute; it is offered and the main model chooses.
    - General redesign of app-skill embeds or Apple UI.

