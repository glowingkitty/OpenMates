decisions:
  - id: D-1
    status: active
    decision: Slugs are persistent encrypted object fields, not recomputed ephemeral aliases.
    reason: Users need reliable stable handles that do not shift when duplicate titles change.
    decided_at: "2026-08-12T13:45:00Z"
  - id: D-2
    status: active
    decision: The server stores slug_lookup_hash and encrypted_slug but never plaintext private slugs.
    reason: Duplicate prevention needs a server-checkable value, while privacy requires the slug itself to remain client-side encrypted.
    decided_at: "2026-08-12T13:45:00Z"
  - id: D-3
    status: active
    decision: CLI commands resolve slugs locally and send canonical object IDs to REST/WebSocket operations.
    reason: Existing object endpoints are ID-addressed and should not receive private title-derived handles.
    decided_at: "2026-08-12T13:45:00Z"
  - id: D-4
    status: active
    decision: Full UUID and existing short-ID inputs remain supported.
    reason: Backward compatibility is needed for scripts, JSON users, existing docs, and debug workflows.
    decided_at: "2026-08-12T13:45:00Z"

scenarios:
  - id: S-1
    title: Workflow runs by stable slug
    given:
      - Alice creates a Workflow titled Daily Weather Reminder from the CLI.
      - The client stores encrypted_slug for daily-weather-reminder and slug_lookup_hash for Alice's personal context.
    when:
      - Alice runs `openmates workflows runs daily-weather-reminder`.
    then:
      - The CLI resolves daily-weather-reminder locally to the workflow_id.
      - The REST request uses the workflow_id path and does not contain the plaintext slug.
      - Human output starts with the Workflow title and slug, then shows runs with useful state and next commands.

  - id: S-2
    title: Duplicate slug fails safely
    given:
      - Alice already owns a Task with slug renew-passport.
    when:
      - Alice or an SDK tries to create another Task in the same owner/team context with slug renew-passport.
    then:
      - The backend rejects the mutation using slug_lookup_hash uniqueness.
      - No partial object row is created.
      - The error message tells Alice to choose another slug without revealing another user's slug.

  - id: S-3
    title: Projects, Plans, and Tasks list with slug handles
    given:
      - Alice has Projects, Plans, and Tasks with encrypted slugs and encrypted names/titles.
    when:
      - Alice runs list and show commands for each surface.
    then:
      - Human output shows slug plus name/title as the primary handle.
      - Detail output still exposes canonical IDs for debug/copy-paste.
      - Suggested next commands use slugs, not raw UUIDs.

  - id: S-4
    title: Saved chat command uses encrypted chat slug
    given:
      - Alice has a saved Chat titled Berlin Trip Planning with encrypted slug berlin-trip-planning.
    when:
      - Alice runs `openmates chats send --chat berlin-trip-planning "add packing list"`.
    then:
      - The CLI resolves the chat slug locally to chat_id.
      - The WebSocket send payload contains chat_id and not the plaintext slug.
      - Human history/list output shows the slug as the stable handle.

  - id: S-5
    title: SDK-created object preserves slug privacy
    given:
      - Developer code uses npm or pip SDK to create a Project, Plan, Task, or Workflow with cleartext title/name and optional slug.
    when:
      - The SDK sends the create mutation.
    then:
      - The SDK derives or validates the slug locally, encrypts encrypted_slug, computes slug_lookup_hash, and sends no plaintext slug.
      - The SDK returns cleartext slug in memory for the caller.
      - Later CLI list/show resolves the same encrypted slug.

