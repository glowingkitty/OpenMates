clarification:
  rounds:
    - question: Should CLI object handles be recomputed local aliases or persistent encrypted slugs?
      answer: Persistent encrypted slug fields, decrypted and shown to the user, with server receiving IDs instead of cleartext slug.
    - question: Should slug lookup hashes be included?
      answer: Yes, include slug_lookup_hash.
    - question: Should slugs remain stable after creation unless explicitly changed?
      answer: Yes, stable slugs are required so users can reliably request more info using the same slug.
  vision_summary: >
    The CLI should feel like users are addressing meaningful object names such as
    daily-weather-reminder instead of opaque UUIDs. The backend can enforce slug
    uniqueness with safe lookup hashes, but neither ordinary CLI commands nor
    durable server storage may expose plaintext private slugs.
  approved_by_user: true

