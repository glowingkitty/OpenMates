goal: >
  Make OpenMates CLI object commands readable and reliable by giving Workflows,
  Projects, Plans, Tasks, and saved Chats persistent encrypted slugs plus
  owner/context-scoped slug lookup hashes. The CLI and SDKs decrypt slugs locally,
  display them as the preferred human handle, accept them as command inputs, and
  send only canonical object IDs to the server for ordinary object operations.

scope:
  in:
    - Add encrypted_slug and slug_lookup_hash storage/transport for Workflows, Projects, Plans, Tasks, and saved Chats.
    - Generate a slug when a supported object is created unless the user supplies an explicit slug.
    - Keep generated slugs stable across title/name changes unless an explicit slug mutation is performed later.
    - Enforce duplicate slug_lookup_hash rejection in the same owner/team context where backend mutation routes are touched.
    - Let CLI commands accept object slugs for show/list-runs/run/edit/delete/link/send operations where full or short IDs are currently accepted.
    - Resolve slugs locally to canonical IDs before REST/WebSocket requests; ordinary server requests must not contain plaintext slugs.
    - Improve human CLI output so lists and run/detail views lead with title/name plus slug, relevant state, and next commands using slugs.
    - Preserve --json output compatibility while adding slug fields and keeping canonical IDs available for machines/debugging.
    - Preserve existing full UUID and short-ID input compatibility.
    - Include npm and pip SDK parity for creating/updating/preserving encrypted slugs where SDK namespaces expose object creation or mutation.
  out:
    - Public example chat slug changes; public examples already intentionally use cleartext public slugs.
    - Server-side plaintext slug search or plaintext slug storage.
    - Provider records, external provider URLs, generated artifacts, or app-skill provider IDs.
    - Apple native slug UI in this slice, unless shared metadata changes require a basic native regression check.
    - Long-term slug rename UI beyond backend/client-safe primitives needed to avoid blocking stable slug creation.

