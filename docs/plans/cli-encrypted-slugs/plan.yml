implementation_notes:
  plan_path: docs/plans/cli-encrypted-slugs/plan.yml
  architecture: >
    Add shared encrypted slug primitives to CLI/SDK client code and object API
    payloads. Backend stores encrypted_slug and slug_lookup_hash as safe metadata;
    clients decrypt slug locally and resolve user command inputs to canonical IDs
    before network calls.
  existing_patterns:
    - Client-side encrypted titles/names already mirror web crypto semantics in CLI task, plan, project, and chat helpers.
    - Existing label_hashes and linked_project_hashes provide safe metadata precedent for server-filterable hashes without plaintext private strings.
    - Existing chat title resolution in the CLI already performs local decrypt-before-match for title queries.
  data_flow:
    - User enters title/name and optional slug in CLI/SDK/web.
    - Client slugifies/validates the slug, encrypts it with the object key or appropriate owner key, computes slug_lookup_hash with scoped client-side hash material, and sends ciphertext/hash to backend.
    - Backend persists encrypted_slug and slug_lookup_hash and rejects same-context duplicates.
    - CLI list/show decrypts encrypted_slug locally and prints it as primary handle.
    - CLI command input resolves slug locally by listing/decrypting accessible objects, then sends only canonical ID to server operation.
  affected_files:
    - {path: specifications/surfaces/cli/specification.yml, reason: Approved CLI slug surface contract.}
    - {path: specifications/surfaces/cli/examples.yml, reason: Contract examples for encrypted slugs, local resolution, and human output.}
    - {path: docs/plans/cli-encrypted-slugs/plan.yml, reason: Executable implementation and verification ledger.}
    - {path: backend/core/directus/schemas/workflows.yml, reason: Add encrypted slug and lookup hash fields.}
    - {path: backend/core/directus/schemas/projects.yml, reason: Add encrypted slug and lookup hash fields.}
    - {path: backend/core/directus/schemas/user_plans.yml, reason: Add encrypted slug and lookup hash fields.}
    - {path: backend/core/directus/schemas/user_tasks.yml, reason: Add encrypted slug and lookup hash fields.}
    - {path: backend/core/directus/schemas/chats.yml, reason: Add encrypted slug and lookup hash fields for saved chats if not already present.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Slug-capable command resolution and human output.}
    - {path: frontend/packages/openmates-cli/src/client.ts, reason: Chat/workflow/project API models, slug helpers, and local resolution.}
    - {path: frontend/packages/openmates-cli/src/tasksCli.ts, reason: Task slug encryption/decryption/resolution/rendering.}
    - {path: frontend/packages/openmates-cli/src/plansCli.ts, reason: Plan slug encryption/decryption/resolution/rendering.}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: npm SDK slug parity for object creation/mutation.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: pip SDK slug parity for object creation/mutation.}
    - {path: scripts/audit_sdk_cli_parity.py, reason: Add slug parity guard if current audit lacks coverage.}
  verification_strategy:
    - Write red unit/contract tests for encrypted slug storage and CLI resolver behavior before product changes.
    - Add backend tests for slug_lookup_hash uniqueness and plaintext-forbidden payload/state assertions.
    - Run CLI unit tests after TypeScript build.
    - Run real installed CLI commands against https://api.dev.openmates.org after backend/API changes are deployed to the local dev stack.
    - Run SDK parity audit and npm/pip slug tests where SDK surfaces are touched.
  verification_order:
    - T-BACKEND-SLUGS red then green.
    - T-CLI-WORKFLOW-SLUGS, T-CLI-WORKSPACE-SLUGS, T-CLI-CHAT-SLUGS red then green.
    - T-SDK-SLUGS and V-SDK-PARITY after CLI green.
    - V-LIVE-CLI-SLUGS against https://api.dev.openmates.org.
    - Proof video after normal green gates.
    - V-SPEC-VERIFY final.

