assumptions:
  - id: A-1
    text: The slug lookup hash can be derived with an existing owner/team-scoped key or a new deterministic client-side index key without exposing plaintext slug to the server.
    status: confirmed
    required_before: implementation
    evidence:
      - TS and Python helpers derive slug_lookup_hash locally with HKDF/HMAC-SHA256 info openmates-object-slug-index-v1 from the personal master key or local team key.
      - Static audit verified object selectors resolve locally to canonical IDs; private plaintext slugs are not sent to object API paths.
  - id: A-2
    text: Existing Directus schema migration patterns can add nullable encrypted_slug and slug_lookup_hash fields plus owner/team scoped uniqueness without destructive data loss.
    status: confirmed
    required_before: implementation
    evidence:
      - backend/core/directus/setup/migrate_encrypted_slug_indexes.sql adds nullable encrypted_slug and slug_lookup_hash columns plus owner/team partial unique indexes.
      - backend/core/directus/setup/setup_schemas.py registers encrypted slug index migration names with existing migration runner pattern.
  - id: A-3
    text: Existing CLI/SDK tests can be extended without requiring browser Playwright for the first implementation slice.
    status: confirmed
    required_before: task_execution
    evidence:
      - Existing Node test suites now cover CLI/npm workflow, project, plan, task, and saved-chat slug behavior without adding browser Playwright coverage.
      - Existing pip SDK tests now cover local slug resolution and encrypted metadata payloads across project, plan, task, workflow, and saved-chat surfaces.

