decisions:
  - id: D-1
    status: active
    decision: V1 supports Claude official export, ChatGPT official export, OpenMates Export V1, OpenCode transcripts, and documented generic role/content JSON parser formats; selected presentation source is independent.
    reason: Reliable samples exist for dedicated Claude, ChatGPT, OpenMates, and OpenCode parsers. Gemini Takeout remains unsupported, while generic JSON enables explicitly labeled Gemini/Other imports without claiming Takeout compatibility.
    decided_at: "2026-07-18"
  - id: D-2
    status: active
    decision: V1 imports chats plus referenced embeds/uploads only.
    reason: These domains map cleanly to external AI account migration; other domains need separate conflict, ownership, and restore rules.
    decided_at: "2026-07-18"
  - id: D-3
    status: active
    decision: V1 always creates new chats and never merges or overwrites existing chats.
    reason: Merge/overwrite is destructive and needs a later conflict-resolution contract.
    decided_at: "2026-07-18"
  - id: D-4
    status: active
    decision: V1 does not recommend third-party export extensions.
    reason: Store builds and provider scraping behavior are hard for users to verify; recommending one creates implicit trust and support liability.
    decided_at: "2026-07-18"
  - id: D-5
    status: active
    decision: Free import allowance is 3 imported chats per rolling 30 days regardless of source.
    reason: The system should not depend on perfectly classifying external versus OpenMates source for abuse control.
    decided_at: "2026-07-18"
  - id: D-6
    status: active
    decision: Do not allow negative credits/debt for imports.
    reason: Import scan processing is abuse-prone and should require either free allowance or enough credits before work starts.
    decided_at: "2026-07-18"
  - id: D-7
    status: active
    decision: Store import usage, source fingerprints, allowance windows, and finalized billing/audit state in Directus records, not Redis-only state.
    reason: Dedupe warnings, rolling 30-day allowances, auditability, and later support/debugging need durable user-scoped records; Redis may still be used only for transient rate limits or in-flight locks.
    decided_at: "2026-07-18"
  - id: D-8
    status: superseded
    decision: Unsafe imported messages are omitted from encrypted chat persistence and reported in the import result instead of inserted as placeholder chat messages in V1.
    reason: Omitting blocked content is the smallest safe behavior and avoids writing provider-controlled text or confusing synthetic assistant/user messages into imported history.
    decided_at: "2026-07-18"
  - id: D-9
    status: active
    decision: Every non-empty imported message role and every source, including OpenMates, must pass ASCII-smuggling and prompt-injection scanning before compression or persistence.
    reason: User-supplied exports are untrusted regardless of claimed source and can contain instructions targeting later AI context.
    decided_at: "2026-08-04"
  - id: D-10
    status: active
    decision: Exact detected injection spans are replaced in place; high-risk messages without safely removable spans become a whole-message placeholder; scanner infrastructure failure aborts the import retryably.
    reason: Preserve safe content where possible without allowing scanner outages or ambiguous results to pass plaintext through.
    decided_at: "2026-08-04"
  - id: D-11
    status: active
    decision: Compression runs only after all included message content has been sanitized and produces checkpoint summaries that clients encrypt before durable persistence.
    reason: The compression model must never receive raw adversarial imports, and Directus must retain the existing zero-knowledge checkpoint boundary.
    decided_at: "2026-08-04"
  - id: D-12
    status: active
    decision: Paid imports reserve estimated token-based scan/compression credits, charge measured model usage, release unused credits, and have no transcript-length ceiling; free imports remain three chats per 30 days with a 100,000-token cap per chat.
    reason: Costs should track actual provider work without debt or unbounded free usage.
    decided_at: "2026-08-04"
  - id: D-13
    status: active
    decision: Users explicitly select OpenMates, ChatGPT, Claude, Gemini, OpenCode, or Other; that selection controls encrypted imported assistant category/sender identity and provider/generic avatar rendering.
    reason: Imported provider responses must not be misattributed to OpenMates mates, while file-schema detection remains an independent validation concern.
    decided_at: "2026-08-04"

