    - AC-11: T-SCAN-ALL-ROLES, T-SCAN-FAIL-CLOSED-REDACTION, T-ENCRYPTION-GUARDS.
    - AC-12: T-IMPORT-RESUME, T-IMPORT-COMPRESSION, T-IMPORT-BILLING, T-ENCRYPTION-GUARDS.
    - AC-13: T-BACKEND-FREE-TOKEN-CAP, T-CLI-LIMITS-DEV, T-WEB-LIMITS.
    - AC-14: T-PROVIDER-IDENTITY, T-WEB-PROVIDER-IDENTITY, V-USER-CONFIRMATION, V-APPLE-IMPACT.
    - AC-15: T-PARSER-GENERIC, T-NPM-SDK-IMPORT, T-PIP-SDK-IMPORT, T-WEB-SERVICE-IMPORT.
  rollout:
    - Keep legacy import endpoint fail-closed while backend/CLI/SDK/web V1 work rolls out.
    - Ship CLI and SDK import capability against dev first; do not expose web UI until those gates pass.
    - Web UI remains behind the implementation sequence until deployed Playwright green evidence is recorded.
  observability:
    - Log import_id, user_id hash or internal ID, source type, counts, status, failure codes, duplicate counts, credits reserved/charged/released, and duration.
    - Do not log raw messages, chat titles, file names from imports, source IDs, source fingerprints in full, credentials, object keys, or share fragments.
  plan_approval:
    required: true
    reason: The material resumption adds metadata-only resumability, strict reservation/settlement, compression batching, a generic transcript adapter, and cross-client identity changes.

