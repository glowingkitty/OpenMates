    - Wire deterministic import coverage into daily tests after dev CLI success and local npm/pip SDK parity.
    - Deploy to dev before Playwright green tests.
    - User confirmation on deployed import UI and imported-chat usability before Apple parity.
    - python3 scripts/plan_verify.py docs/plans/account-import-v1/plan.yml before marking verified.
  verification_order:
    - Backend all-role scan/fail-closed/resume/compression/billing/free-cap red tests
    - Backend implementation and plaintext guard green tests
    - Real REST and CLI commands against the restarted dev API
