risks:
  - A general model may still over-index on sensitive words; paired near-neighbor cases and exact evidence validation constrain this failure mode.
  - Allow-biased confirmation can miss ambiguous harmful intent; normal answer-model safety remains active and the corpus uses only clearly actionable block cases.
  - A second call adds latency only for preliminary candidates; measure and report it without weakening the allow/block contract.
