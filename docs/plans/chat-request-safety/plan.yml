id: chat-request-safety
title: Allow-Biased Chat Request Safety
status: verified

implementation_state:
  subject_commit: 5b424a702f9781154a930ed7a64e0fd131c1ba0c

approvals:
  specification:
    status: approved
    approved_at: "2026-09-19"
  plan:
    status: approved
    approved_at: "2026-09-19"

goal: >
  Test out the improved safety processing flow, including the previously falsely
  blocked request and at least ten additional scenarios, so clearly harmful and
  clearly illegal requests are blocked without over-blocking; when in doubt,
  allow the request to continue to the answer model.

specification_refs:
  - id: feature.chat-request-safety
    version: 1
    role: primary
    fingerprint: 16174ee67eb618053d9c7876ab7c0ad26506a16d3343869d1b26bc826fd94145

scope:
  in:
    - Clarify preliminary preprocessing guidance so it scores requested assistance rather than sensitive topic words.
    - Route preliminary harmful or misuse candidates through a deterministic structured confirmation before blocking.
    - Treat uncertain, malformed, unsupported, or unavailable confirmation as allow and continue to normal answer-model safety.
    - Validate block category and exact user-request evidence without logging quoted private content.
    - Cover the production first-message and follow-up decisions with the Cyberleak regression and a paired corpus of at least ten additional cases.
    - Run focused local and isolated GitHub unit tests plus a real-model corpus in the Vault-backed API container.
  out:
    - Changing image, audio, upload, URL, or app-skill output safety.
    - Disabling provider-owned safety behavior in answer models.
    - Adding a public endpoint, a user safety opt-out, or changing authentication, billing, or encryption boundaries.
    - Production deployment.

implementation_notes:
  plan_path: docs/plans/chat-request-safety/plan.yml
  existing_patterns:
    - backend/shared/python_utils/structured_content_sanitization.py
    - backend/apps/ai/processing/content_sanitization.py
    - backend/apps/ai/utils/llm_utils.py
  architecture: >
    Keep the existing preprocessing scores as inexpensive candidate signals. A
    candidate invokes a separate minimal-context classifier at temperature zero.
    Its structured result can block only with a supported policy category and
    exact evidence found in the current or immediately preceding user request.
    Every other result proceeds to the selected answer model.
  data_flow:
    - Existing preprocessing produces routing metadata and preliminary harmful and misuse scores.
    - Only a threshold candidate sends the latest and immediately preceding user text to deterministic structured confirmation.
    - Strict validation converts only a supported block with exact evidence into the existing rejection path; every other confirmation result continues.
  verification_strategy:
    - Add focused unit coverage for strict validation, allow-biased failures, candidate orchestration, and deterministic provider arguments.
    - Evaluate the committed paired corpus against the configured real safety model in the Vault-backed API container because isolated GitHub CI intentionally has no paid-provider credentials.
  verification_order:
    - Record the current regression expectations in unit tests and the corpus.
    - Implement the confirmation boundary and preliminary prompt clarification.
    - Run focused local checks and isolated GitHub unit coverage, then the Vault-backed real-model evaluation.
  affected_files:
    - {path: backend/apps/ai/base_instructions.yml, reason: Intent-over-topic preliminary scoring guidance.}
    - {path: backend/apps/ai/processing/chat_request_safety.py, reason: Structured confirmation prompt, context minimization, validation, and allow-biased failure behavior.}
    - {path: backend/apps/ai/processing/preprocessor.py, reason: Candidate-to-confirmation orchestration before existing rejection responses.}
    - {path: backend/apps/ai/utils/llm_utils.py, reason: Explicit deterministic temperature for safety calls.}
    - {path: backend/apps/ai/skills/ask_skill.py, reason: Typed request-safety model configuration.}
    - {path: backend/apps/ai/app.yml, reason: Request-safety model selection.}
    - {path: backend/tests/test_chat_request_safety.py, reason: Unit and corpus regression coverage.}
    - {path: backend/scripts/test_chat_request_safety.py, reason: Real-provider fixed-corpus evaluator for isolated CI.}
  privacy_security:
    - Safety confirmation receives only the latest and immediately preceding user text, never keys, credentials, provider diagnostics, or unrelated history.
    - Logs contain decision metadata and evidence counts, not evidence text or user content.
    - The existing first-party processing boundary, access controls, credits, and encrypted durable storage remain unchanged.
  rollout:
    - Validate locally with mocked provider decisions and the committed corpus.
    - Run the real provider corpus in the Vault-backed API container without restarting or replacing the shared service.
    - Do not deploy to dev or production in this evaluation task unless separately requested.

decisions:
  - id: D-1
    status: active
    decision: Use preliminary scores only as candidate signals and require a separate structured confirmation for a block.
    reason: This preserves inexpensive normal routing while eliminating one-shot keyword-driven refusals.
    decided_at: "2026-09-19"
  - id: D-2
    status: active
    decision: Allow uncertain, invalid, or unavailable confirmation to continue to the answer model.
    reason: The user explicitly prefers under-blocking ambiguous requests and answer models retain their own safety controls.
    decided_at: "2026-09-19"

scenarios:
  - id: S-1
    title: Benign sensitive-topic request proceeds
    given: [A user asks for news, history, harm reduction, or defensive information about a sensitive subject.]
    when: [Preprocessing evaluates the requested assistance rather than topic words.]
    then: [The request continues to the answer model.]
  - id: S-2
    title: Clearly actionable wrongdoing is blocked
    given: [A user explicitly requests material help to execute or conceal harmful or illegal activity.]
    when: [Structured confirmation returns a supported category and exact evidence.]
    then: [The existing harmful or misuse refusal path blocks the request.]
  - id: S-3
    title: Unconfirmed candidate is allowed
    given: [A preliminary score crosses a threshold but confirmation is uncertain, invalid, or unavailable.]
    when: [The final safety outcome is resolved.]
    then: [The candidate does not become a hard block and normal answer-model safety remains active.]
  - id: S-4
    title: Both production paths satisfy the paired corpus
    given: [The Cyberleak regression and at least ten additional allow and block cases are committed.]
    when: [First-message and follow-up safety decisions are evaluated locally and with the real configured model.]
    then: [Every benign case is allowed and every clearly actionable harmful or illegal case is blocked.]

