clarification:
  rounds:
    - question: What should be the canonical event source for the first release?
      answer: A versioned OpenMates repository YAML or JSON registry.
    - question: What should count as a correction or stop signal during review?
      answer: The administrator instructs OpenCode to correct or cancel the scheduled newsletter through a skill-backed deterministic command.
    - question: How should new newsletter categories be introduced?
      answer: Add openmates_events and software_updates while keeping old keys as compatibility aliases.
    - question: Which parts of the Figma email should be exported images?
      answer: The red header and event cards; descriptive details and links remain HTML.
    - question: What happens to the review deadline after a correction?
      answer: Replacement previews start a fresh 24-hour review window.
  vision_summary: >
    Use a versioned event registry and supplied exported visuals to create an
    accessible EN/DE events campaign every two weeks. Preview it to the admin,
    wait 24 hours, reset that window after corrections, and then idempotently
    deliver only to confirmed Events subscribers, with Luma as the unpublished-page fallback.
  approved_by_user: true

