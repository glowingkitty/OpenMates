goal: >
  Announce upcoming OpenMates events to confirmed subscribers every two weeks
  through an accessible English/German email that uses approved Figma-matched
  visuals, gives the administrator 24 hours to correct or cancel each campaign,
  falls back to Luma until an OpenMates event page is live, and sends once only
  to subscribers who keep OpenMates Events enabled.

scope:
  in:
    - Add one versioned YAML event registry as the canonical newsletter automation source.
    - Seed the registry with the eight supplied events from August 25 through September 15, 2026.
    - Store English and German newsletter title, summary, description, event type, time, timezone, venue, links, publication state, and exported asset references.
    - Accept pre-rendered localized header and event-card PNG assets for the first release.
    - Create an events-newsletter campaign every 14 days containing published events starting within the next four weeks.
    - Send English and German previews to the configured admin recipient and schedule delivery 24 hours after the latest successful previews.
    - Let OpenCode use deterministic commands to inspect, correct, regenerate, cancel, or explicitly send-now a pending campaign.
    - Restart the full 24-hour review window after any material event, copy, link, or image correction.
    - Add canonical openmates_events and software_updates subscriber preferences, default on for subscribers without an explicit legacy updates opt-out.
    - Preserve explicit legacy and canonical opt-outs and retain old category keys as compatibility aliases during migration.
    - Show OpenMates Events and Software Updates controls in REST-backed web, CLI, and Apple settings.
    - Use a live production OpenMates event URL when available and otherwise use the event's Luma URL.
    - Keep event details and links as HTML text even when the header and cards are images.
    - Prove dev previews, scheduling, correction reset, category filtering, and resumable idempotent delivery before production enablement.
  out:
    - Automated Figma, event-image, social-image, social-post, or video-clip rendering.
    - Buffer, Instagram, Mastodon, Bluesky, LinkedIn, YouTube, TikTok, WhatsApp, or other social scheduling.
    - Slides, webinar preparation, production feature-readiness work, call recording, or post-event clips.
    - A public or developer newsletter-campaign API, public SDK campaign management, or a new admin web UI.
    - Parsing admin email replies for corrections.
    - Campaign analytics beyond privacy-safe delivery and failure records.
    - Production enablement or any production broadcast without fresh explicit consent for the exact campaign payload after dev evidence.

