contracts:
  api:
    newsletter_categories:
      endpoints: [GET /v1/newsletter/categories, PATCH /v1/newsletter/categories]
      access_model: first-party client surface only
      auth: Authenticated user session required.
      rate_limits: PATCH remains limited to 20 requests per minute; GET uses existing authenticated route controls.
      credit_budget: No credits or paid provider calls.
      encryption_boundary: Uses user and subscriber email hashes for matching; does not expose or decrypt client-side encrypted chat, memory, file, key, sync, or share content.
    campaign_admin:
      endpoints: [/v1/admin/newsletter-campaigns and scoped preview, schedule, cancel, correct, simulate, and send-now actions]
      access_model: internal-only
      auth: Existing admin API-key identity; never public session or developer API-key access.
      rate_limits: Preserve or tighten existing limits of 10/minute mutation, 5/minute preview, and 3/minute send-now; cron generation is one idempotent cadence check.
      credit_budget: No OpenMates credits; bounded email-provider sends only after validation.
      encryption_boundary: Campaign copy and public event metadata are plaintext operational content; subscriber addresses remain encrypted at rest and are decrypted only inside the existing sender for delivery.
      logging: Log campaign slug, payload hash prefix, status, counts, and sanitized failure class only; never plaintext recipient addresses, admin credentials, or subscriber lists.
  data:
    registry_path: shared/events/openmates_events.yml
    registry_fields: [schema_version, id, slug, status, event_type, starts_at, ends_at, timezone, localized_content, venue, online_url, luma_url, openmates_url, assets]
    canonical_categories: [openmates_events, software_updates]
    compatibility_aliases: [updates_and_announcements, tips_and_tricks, daily_inspirations]
    campaign_category: openmates_events
    campaign_window: Events with starts_at >= generation time and starts_at < generation time plus four weeks.
    cadence: First manual generation after asset handoff, then every 14 days at 09:00 Europe/Berlin from persisted anchor.
    review_window: 24 hours from the later successful EN/DE preview; material change resets it.
  email:
    template: Existing reusable MJML newsletter template extended with an events layout rather than per-campaign MJML.
    required_languages: [en, de]
    header_source: Local exported PNG, localized when visible text differs.
    event_card_source: Local exported PNG per event, localized when visible text differs.
    image_transport: Privacy-preserving embedded or first-party-hosted delivery supported by tested email clients; no third-party tracking URL.
    html_event_fields: [title, summary, date, time, timezone, venue_or_online_location, destination]
    fallback_language: English for subscribers whose preferred language is neither English nor German.
  skill:
    canonical_source: .claude/skills/create-newsletter/SKILL.md
    generated_mirror: .agents/skills/create-newsletter/SKILL.md
    commands: [inspect pending events campaign, generate, preview, correct, cancel, send-now, status]
    constraints: Real broadcast and production enablement remain explicit consequential actions; corrections never edit Directus directly outside the campaign service.
