decisions:
  - id: D-1
    status: active
    decision: Use shared/events/openmates_events.yml as the versioned canonical event registry and generate or adapt web data from it rather than maintaining a second manual event list.
    reason: A shared YAML source is readable by backend automation and build-time frontend tooling.
    decided_at: "2026-08-20T15:08:33Z"
  - id: D-2
    status: active
    decision: Run the first campaign manually after asset handoff, then anchor future campaigns every 14 days at 09:00 Europe/Berlin based on the first successful campaign creation.
    reason: A persisted cadence anchor avoids unreliable calendar-week modulo cron expressions and permits a controlled first launch.
    decided_at: "2026-08-20T15:08:33Z"
  - id: D-3
    status: active
    decision: Existing explicit updates opt-outs map both openmates_events and software_updates off; absent legacy preferences default both on; explicit canonical values always win.
    reason: This honors the requested defaults without erasing a subscriber's prior opt-out signal.
    decided_at: "2026-08-20T15:08:33Z"
  - id: D-4
    status: active
    decision: Event campaigns auto-send 24 hours after successful EN/DE previews, while product-update newsletters retain explicit approval requirements.
    reason: The user approved auto-send specifically for deterministic events campaigns, not every campaign class.
    decided_at: "2026-08-20T15:08:33Z"
  - id: D-5
    status: active
    decision: Material corrections atomically invalidate the old schedule and payload approval before replacement previews can establish a new schedule.
    reason: This prevents an old due job from racing corrected content.
    decided_at: "2026-08-20T15:08:33Z"
  - id: D-6
    status: active
    decision: No implementation, verification, deploy, preview, or simulation step may send to real subscribers; a real broadcast requires fresh explicit user consent naming the exact campaign and payload hash.
    reason: The user explicitly prohibited any real-user send without being asked immediately beforehand as part of these tasks.
    decided_at: "2026-08-20T15:08:33Z"

scenarios:
  - id: S-1
    title: Registry stores only newsletter-relevant event data
    given:
      - The supplied launch brief contains eight events plus social-post and preparation notes.
    when:
      - The initial event registry is created.
    then:
      - It includes the eight event records from August 25 through September 15, 2026.
      - Each record has stable slug, publication state, type, Europe/Berlin times, EN/DE title, summary and description, venue, Luma URL, optional OpenMates URL, and localized asset metadata.
      - Social post copy, personal tasks, recording notes, and platform scheduling notes are excluded.

  - id: S-2
    title: Biweekly generator selects the next four weeks deterministically
    given:
      - The cadence check runs at 2026-08-20T09:00:00+02:00.
      - All eight supplied events are marked published in the registry.
    when:
      - The events campaign generator evaluates the four-week start-time window.
    then:
      - It includes all eight events from August 25 through September 15.
      - It excludes past, draft, cancelled, and events starting after September 17 at 09:00.
      - Re-running unchanged inputs for the same cadence anchor reuses the same campaign rather than creating a duplicate.

  - id: S-3
    title: Figma-matched visuals remain accessible in email
    given:
      - Localized red-header and event-card PNGs exist for every selected event.
    when:
      - English and German email HTML is rendered.
    then:
      - The matching localized header and cards appear in Figma order without remote tracking pixels.
      - Every image has meaningful localized alt text.
      - Event title, summary, date, time, timezone, venue or online location, and destination remain real HTML text and links.
      - Missing or oversized required assets fail preview visibly.

  - id: S-4
    title: Successful previews start the 24-hour review window
    given:
      - The generated campaign passes content, asset, destination, and category validation.
    when:
      - Both English and German admin previews are accepted by the dev email provider.
    then:
      - The campaign records the exact payload hash and latest preview timestamp.
      - It schedules automatic delivery exactly 24 hours after the later successful preview.
      - No broadcast can start before that timestamp.

  - id: S-5
    title: OpenCode correction safely replaces a scheduled campaign
    given:
      - An events campaign is scheduled but not yet sending.
    when:
      - The administrator asks OpenCode to change copy, an event, a link, or an image.
    then:
      - The skill uses deterministic inspect, correct, regenerate, preview, cancel, and send-now commands.
      - A material update atomically invalidates the old schedule and payload hash.
      - Replacement EN/DE previews start a fresh 24-hour window.
      - Cancellation prevents sending even when the former deadline passes.

  - id: S-6
    title: Existing subscribers receive safe canonical category defaults
    given:
      - A confirmed subscriber has null, legacy, or canonical category preferences.
    when:
      - Categories are read, migrated, changed, or evaluated for delivery.
    then:
      - Null or missing legacy values produce openmates_events=true and software_updates=true.
      - updates_and_announcements=false maps both canonical categories false unless a canonical value already exists.
      - Explicit canonical values are never overwritten.
      - REST, CLI, web, and Apple display and update the same canonical values.
      - Unknown categories are ineligible for delivery.

  - id: S-7
    title: Event destination falls back safely to Luma
    given:
      - An event has a Luma URL and may have an OpenMates production event URL.
    when:
      - The campaign is generated or revalidated before sending.
    then:
      - A confirmed live exact OpenMates event page is used when available.
      - Otherwise the Luma URL is used.
      - No usable destination blocks preview and delivery.

  - id: S-8
    title: Broadcast sends once only to eligible subscribers
    given:
      - The review window elapsed and production automation is enabled.
    when:
      - The due campaign processor broadcasts or resumes after a partial failure.
    then:
      - Only confirmed, non-ignored subscribers with openmates_events enabled are eligible.
      - Delivery reservation prevents duplicate sends for the same campaign and subscriber.
      - A partial retry skips already reserved or successful recipients.
      - Audit output contains no plaintext subscriber list or secret values.

  - id: S-9
    title: Production enablement remains separately controlled
    given:
      - Focused tests, real dev REST and CLI checks, web/Apple parity, dev previews, artifact review, and delivery simulation pass.
    when:
      - The first production events campaign is ready.
    then:
      - OpenCode requests explicit production enablement approval.
      - The request identifies the exact campaign slug, payload hash, scheduled send time, category, and eligible recipient count without revealing subscriber identities.
      - Only fresh explicit approval of that exact payload enables its production review-and-send cycle.
      - Missing approval leaves production sending disabled.

