privacy_security:
  - Newsletter subscription and category processing remains consent-based and preserves explicit opt-outs.
  - No test, simulation, preview, deploy, cron enablement, or implementation command may address real subscribers; production broadcast requires fresh explicit consent for the exact immutable payload hash.
  - Campaign administration and subscriber enumeration remain internal-only under admin authentication.
  - Subscriber addresses remain encrypted at rest and plaintext is used only inside the bounded email-send operation.
  - Event registry and campaign content contain public event information only.
  - Logs, receipts, specs, proof media, and artifacts exclude recipient addresses, subscriber lists, tokens, API keys, and provider credentials.
  - Unknown category IDs, missing destinations, missing assets, stale payload approval, and conflicting send locks fail closed.
  - Delivery reservation occurs before provider send to preserve at-most-once behavior across retries.

