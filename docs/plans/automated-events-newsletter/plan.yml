implementation_notes:
  plan_path: docs/plans/automated-events-newsletter/plan.yml
  architecture: >
    Extend the existing Directus campaign service and MJML sender rather than
    adding a second delivery stack. A shared versioned event registry feeds a
    deterministic generator; the existing hidden admin API owns previews,
    corrections, cancellation, scheduling, and send locks; current REST category
    routes remain canonical for web, CLI, and Apple preferences.
  existing_patterns:
    - NewsletterCampaignService already stores payload hashes and resets approval metadata after content changes.
    - send_newsletter.py already filters categories and reserves recipient delivery records before provider send.
    - SettingsNewsletter.svelte, OpenMates CLI, and NewsletterSettingsView.swift already consume the same REST category map.
    - create-newsletter is canonically authored under .claude/skills and mirrored through sync_agent_parity.py.
  data_flow:
    - The cadence task loads and validates shared/events/openmates_events.yml.
    - The generator selects the next four weeks, resolves production-or-Luma links, and builds localized immutable campaign input.
    - The campaign service validates local assets, stores the payload hash, and sends EN/DE admin previews.
    - The latest successful preview establishes the review deadline; correction replaces the payload and restarts review.
    - The due processor can address real subscribers only after exact-payload production consent is recorded.
    - The sender filters canonical preferences and uses email_deliveries for resumable at-most-once delivery.
  affected_files:
    - {path: shared/events/openmates_events.yml, reason: Canonical versioned event registry and initial eight events.}
    - {path: backend/core/api/app/services/newsletter_campaign_service.py, reason: Event generation, correction reset, cancellation, consent gate, and schedule state.}
    - {path: backend/core/api/app/routes/admin_newsletter_campaigns.py, reason: Internal-only correction, cancellation, simulation, and status actions.}
    - {path: backend/core/api/app/tasks/email_tasks/newsletter_campaign_task.py, reason: Idempotent cadence generation and due-send processing.}
    - {path: backend/core/api/app/tasks/celery_config.py, reason: Persisted 14-day cadence check.}
    - {path: backend/core/api/app/utils/newsletter_utils.py, reason: Canonical category defaults, aliases, and opt-out-preserving migration.}
    - {path: backend/core/api/templates/email/newsletter.mjml, reason: Accessible events layout using exported header and card assets.}
    - {path: backend/scripts/send_newsletter.py, reason: Multi-event asset rendering and exact category delivery.}
    - {path: backend/scripts/backfill_newsletter_user_status.py, reason: Reuse or extend deterministic subscriber-category backfill instead of introducing an untracked migration.}
    - {path: frontend/packages/ui/src/components/settings/SettingsNewsletter.svelte, reason: Canonical Events and Software Updates controls.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Canonical category flags and help.}
    - {path: apple/OpenMates/Sources/Features/Settings/Views/NewsletterSettingsView.swift, reason: Ordered canonical category parity.}
    - {path: .claude/skills/create-newsletter/SKILL.md, reason: Skill-backed inspect, generate, correct, preview, cancel, status, and consent-safe send flow.}
    - {path: docs/architecture/infrastructure/cronjobs.md, reason: Document cadence, review, consent, and failure behavior.}
  verification_strategy:
    - Write and record red contract tests before implementation.
    - Verify category REST behavior against the real dev server before CLI and web.
    - Verify internal campaign lifecycle and real EN/DE dev previews before production consideration.
    - Deploy web changes before Playwright, visual smoke, proof video, and user confirmation.
    - Verify Apple last, then request separate production enablement approval.
  verification_order:
    - T-EVENT-REGISTRY, T-EVENT-GENERATOR, T-EMAIL-RENDER, T-CAMPAIGN-LIFECYCLE, T-CATEGORY-MIGRATION, and T-DELIVERY-SAFETY red phase.
    - Backend implementation and focused green tests.
    - V-REST-CATEGORIES against the real dev API.
    - V-CLI-CATEGORIES against the real dev API; SDK exclusion audit remains unchanged.
    - Deploy and run T-WEB-CATEGORIES, V-UI-VISUAL-SMOKE, V-PROOF-VIDEO, and V-USER-CONFIRMATION.
    - V-APPLE-CATEGORIES last.
    - V-DEV-CAMPAIGN-API, V-DEV-DELIVERY-SIMULATION, and V-DEV-PREVIEW-REVIEW without real subscribers.
    - Request V-PRODUCTION-ENABLEMENT for the exact final payload; never infer consent and never send to real subscribers from any earlier task.
    - V-SPEC-VERIFY final.

