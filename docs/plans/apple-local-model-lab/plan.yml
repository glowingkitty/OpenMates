local_first_playback_followup:
  status: pending
  user_approved: true
  model: Supertonic 3
  preparation: Warm an already downloaded model after chat opening settles, outside navigation's critical path; reuse one resident runtime across chats.
  eviction: Release on account/server changes, memory pressure and bounded inactivity.
  latency: Measure time to first audio independently from model loading and full synthesis; investigate cancellable chunk playback.
  provider_fallback: Offer a download when local assets are absent; preserve an explicit ElevenLabs fallback through the existing authenticated speech request path.
