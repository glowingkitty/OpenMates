id: apple-local-model-lab
title: Apple optional local model laboratory
status: implementing
goal: Evaluate optional Whisper and Pocket TTS speech downloads in Developers; provide Privacy-owned OpenAI Privacy
  Filter diagnostics and measurements.
scope:
  in:
  - Independent verified downloads, progress, cancellation, retry, removal and offline restoration.
  - WhisperKit compressed large-v3 turbo and pinned Pocket TTS English CPU inference; Privacy-owned OpenAI Privacy
    Filter diagnostics.
  - Native settings laboratory with audio import/record, text inputs and visible results.
  - Visible hardware and OS availability before downloads and tests; unsupported controls disabled.
  - Local use switch confined to the laboratory, ephemeral inputs and sanitized errors.
  - Duration, real-time factor, per-run sampled memory and device/thermal information.
  - Focused download, decoder, controller lifecycle and native UI coverage.
  - Explicit Watch developer experiment with the multilingual tiny model, verified local tokenizer, short microphone
    recordings, local transcription, cancellation, and phase/memory measurements.
  out:
  - Changes to chat/composer transcription, assistant playback, production PII or billing.
  - Backend changes or silent server fallback.
  - Bundled weights or automatic weight downloads.
  - Unsupported adapter/platform inference and production Watch transcription routing.
acceptance:
  LML-001: Downloaded assets use immutable revision URLs and streaming SHA-256 verification; incomplete assets never
    become ready.
  LML-002: Separate local tests expose real transcription, synthesized audio and contextual PII spans without API
    calls or credits.
  LML-003: Existing production UI and processing remain unchanged; the local switch affects only this laboratory.
  LML-004: Downloads and tests can be cancelled; tests run one at a time and unload before another can start.
  LML-005: Results and recordings are ephemeral; logs contain no input/output text; measured timing/device state
    is visible.
checks:
- Swift syntax and pinned catalog/path/schema validation without weights.
- Native LocalModelStoreTests, LocalPrivacyFilterRuntimeTests and LocalModelLabControllerTests.
- LocalModelLabUITests and existing settings route coverage.
- WatchWhisperLabTests and WatchWhisperLabUITests for the approved tiny-model experiment.
- iOS and macOS dependency resolution/build when the authorized Mac guard allows it.
physical_evaluation:
  devices:
  - iPhone 13 Pro
  - current entry-level iPad
  - physical Apple Watch supporting the pinned WhisperKit runtime
  gate: Measure actual device reliability, memory, thermal behavior and English/German transcription. Pocket English
    listening quality requires blind comparison; multilingual compatibility is not established. Enhanced production
    PII is explicitly authorized separately and retains regex fallback and latest-text send verification.
approval:
  source: Direct user instruction in the current chat
  decision: Optional downloads and the separate testing subpage are approved.
  updated: Direct user instruction rejects Apple voices and authorizes Pocket TTS developer testing. Enhanced PII
    production use/download relocation is authorized in feature.pii-protection.
