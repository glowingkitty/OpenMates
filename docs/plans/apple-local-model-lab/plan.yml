id: apple-local-model-lab
title: Apple optional local model laboratory
status: implementing
goal: Evaluate optional Whisper transcription, Supertonic3 speech downloads in Developers; provide Privacy-owned OpenAI Privacy
  Filter diagnostics and measurements.
scope:
  in:
  - Independent verified downloads, progress, cancellation, retry, removal and offline restoration.
  - Optional pack consent appears once with Later/Download; Download dismisses the notification.
    Progress uses Settings > AI > Offline models and the regular Live Activity. The subtle opacity-animated
    header download icon opens that page and stays static with reduced motion. No persistent progress
    banner appears. Ordinary labels use Speech to text, Text to speech and Enhanced anonymization;
    technical model identities remain in the advanced Developers lab.
  - Selected Supertonic3 CPU ONNX synthesis; removed KittenTTS Mini0.8 has no runtime, catalog, build or settings support.
  - WhisperKit compressed large-v3 turbo inference; Privacy-owned OpenAI Privacy
    Filter diagnostics.
  - Native settings laboratory with audio import/record, text inputs and visible results.
  - Visible hardware and OS availability before downloads and tests; unsupported controls disabled.
  - Local use switch confined to the laboratory, ephemeral inputs and sanitized errors.
  - Duration, real-time factor, per-run sampled memory and device/thermal information.
  - Focused download, decoder, controller lifecycle and native UI coverage.
  - Explicit Watch developer experiment with the multilingual tiny model, verified local tokenizer, short microphone
    recordings, local transcription, cancellation, and phase/memory measurements.
  out:
  - Changes to chat/composer transcription, assistant playback, production PII or billing.
  - Backend changes or silent server fallback.
  - Bundled weights or automatic weight downloads.
  - Unsupported adapter/platform inference and production Watch transcription routing.
acceptance:
  LML-001: Downloaded assets use immutable revision URLs and streaming SHA-256 verification; incomplete assets never
    become ready.
  LML-002: Separate local tests expose real transcription and contextual PII spans without API
    calls or credits.
  LML-003: Existing production UI and processing remain unchanged; the local switch affects only this laboratory.
  LML-004: Downloads and tests can be cancelled; tests run one at a time and unload before another can start.
  LML-005: Results and recordings are ephemeral; logs contain no input/output text; measured timing/device state
    is visible.
checks:
- Swift syntax and pinned catalog/path/schema validation without weights.
- Native LocalModelStoreTests, LocalPrivacyFilterRuntimeTests and LocalModelLabControllerTests.
- LocalModelLabUITests and existing settings route coverage.
- WatchWhisperLabTests and WatchWhisperLabUITests for the approved tiny-model experiment.
- iOS and macOS dependency resolution/build when the authorized Mac guard allows it.
physical_evaluation:
  devices:
  - iPhone 13 Pro
  - current entry-level iPad
  - physical Apple Watch supporting the pinned WhisperKit runtime
  gate: Measure actual device reliability, memory, thermal behavior and English/German transcription. Supertonic3 is selected only for developer testing; listened-quality and physical-device proof remain incomplete. Blind listening/device comparison remains required before any production routing. Enhanced production
    PII is explicitly authorized separately and retains regex fallback and latest-text send verification.
approval:
  neural_speech_testing: The user explicitly selected Supertonic3 and exact KittenTTS Mini0.8 for optional developer testing on2026-10-04. Kitten uses the official pure Swift BuiltinPhonemizer with explicit limited-vocabulary/pronunciation labeling; CE/eSpeak code and GPL data are excluded. Production chat routing is unchanged; no quality/device reliability claim or automatic download/fallback is approved.
  kitten_removal: Direct user instruction on 2026-10-05 removes KittenTTS Mini0.8 completely and retains Supertonic3; this supersedes the previous Kitten testing selection. Speech generation and WAV preparation stages must have accurate timing labels.
  pending_production_speech: Future separate scope records normal web-style playback with installed local Supertonic3, an explicit download offer when absent, and ElevenLabs only on user choice or failed-local fallback. It is not implemented by this laboratory removal.
  source: Direct user instruction in the current chat
  decision: Optional downloads and the separate testing subpage are approved.
  updated: Direct user instruction on 2026-10-04 rejects Pocket quality and authorizes complete removal with no
    Apple voice fallback. Earlier Pocket testing approval is superseded. Enhanced PII production use/download
    relocation remains authorized in feature.pii-protection.
