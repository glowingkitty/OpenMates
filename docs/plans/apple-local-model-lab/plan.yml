id: apple-local-model-lab
title: Apple optional local model laboratory
status: implementing
goal: 'Implement the three researched models as optional downloads to keep the app size small, with a
  separate testing subpage accessible from settings. Evaluate local transcription, English speech synthesis,
  and PII detection before adapting the rest of the Apple app or backend.

  '
scope:
  in:
  - Independent verified downloads, progress, cancellation, retry, removal and offline restoration.
  - WhisperKit compressed large-v3 turbo, English Kokoro and OpenAI Privacy Filter CPU inference.
  - Native settings laboratory with audio import/record, text inputs and visible results.
  - Visible hardware and OS availability before downloads and tests; unsupported controls disabled.
  - Local use switch confined to the laboratory, ephemeral inputs and sanitized errors.
  - Duration, real-time factor, process peak memory and device/thermal information.
  - Focused download, decoder, controller lifecycle and native UI coverage.
  out:
  - Changes to chat/composer transcription, assistant playback, production PII or billing.
  - Backend changes or silent server fallback.
  - Bundled weights or automatic weight downloads.
  - German Kokoro, Apple Watch or Intel inference in this slice.
acceptance:
  LML-001: Downloaded assets use immutable revision URLs and streaming SHA-256 verification; incomplete
    assets never become ready.
  LML-002: Separate local tests expose real transcription, synthesized audio and contextual PII spans
    without API calls or credits.
  LML-003: Existing production UI and processing remain unchanged; the local switch affects only this
    laboratory.
  LML-004: Downloads and tests can be cancelled; tests run one at a time and unload before another can
    start.
  LML-005: Results and recordings are ephemeral; logs contain no input/output text; measured timing/device
    state is visible.
checks:
- Swift syntax and pinned catalog/path/schema validation without weights.
- Native LocalModelStoreTests, LocalPrivacyFilterRuntimeTests and LocalModelLabControllerTests.
- LocalModelLabUITests and existing settings route coverage.
- iOS and macOS dependency resolution/build when the authorized Mac guard allows it.
physical_evaluation:
  devices:
  - iPhone 13 Pro
  - current entry-level iPad
  gate: 'No production routing until real devices prove reliability, memory and thermal behavior, English/German
    transcription accuracy against the existing web pipeline, English Kokoro listening quality and PII
    recall on labelled fixtures.

    '
approval:
  source: Direct user instruction in the current chat
  decision: Optional downloads and the separate testing subpage are approved.
