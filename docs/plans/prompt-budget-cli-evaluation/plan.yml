  existing_patterns:
    - frontend/packages/openmates-cli/src/benchmark.ts real product-path benchmark runner and judge workflow.
    - backend/apps/ai/processing/main_processor.py existing debug metadata and conditional prompt gating patterns.
    - backend/apps/ai/processing/preprocessor.py dynamic context expansion for app skills, focus modes, and topic areas.
    - backend/apps/ai/utils/llm_utils.py recursive dynamic context substitution into preprocessing tool schema descriptions.
    - backend/scripts/debug_requests.py debug metadata extraction for system prompt and tool counts.
  architecture: >
    Extend the existing CLI benchmark architecture with a prompt-budget suite and
    comparison mode. Surface token and prompt-budget metrics already emitted by
    the WebSocket final frame. Targeted backend prompt-gating and de-duplication
    changes were attempted after the baseline artifact, but the adjusted
    same-corpus comparison failed the quality gate, so those runtime changes were
    reverted.
  data_flow:
    - CLI loads the committed prompt-budget corpus and computes stable prompt hashes.
    - CLI sends each turn through OpenMatesClient.sendMessage with benchmark metadata and incognito history for follow-ups.
    - Backend/CLI surfaces sanitized processing metrics and debug budget counts into the run artifact where available.
    - Judge turns score every response and multi-turn continuity using the existing benchmark judge path.
    - The post-change run repeats the exact corpus and writes a second artifact.
    - Compare mode validates matching prompt hashes and reports deltas plus keep/needs-fix/revert recommendation.
    - Runtime prompt-budget changes are kept only when the comparison passes; failed attempts are reverted before completion.
  affected_files:
    - path: docs/plans/prompt-budget-cli-evaluation/plan.yml
      reason: Executable product contract and evidence ledger.
    - path: frontend/packages/openmates-cli/src/benchmark.ts
      reason: Add prompt-budget corpus, run command, artifacts, judge rubric, and compare mode.
    - path: frontend/packages/openmates-cli/src/__tests__/benchmark.test.ts
      reason: Verify corpus shape, command behavior, and artifact compatibility.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Surface additional sanitized chat processing metrics if WebSocket frames already provide them.
    - path: frontend/packages/openmates-cli/src/ws.ts
      reason: Capture token usage and prompt-budget metrics from final WebSocket frames when present.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/prompt-budget-cli-evaluation/plan.yml
    - cd frontend/packages/openmates-cli && npm run build && npm run test:unit:cli
    - Baseline live prompt-budget CLI run before implementation.
    - Post-change live prompt-budget CLI run with the same corpus.
    - Prompt-budget comparison report and final quality gate review.
  verification_order:
    - Validate spec and approve product contract.
    - Write corpus/unit checks first and record red evidence where applicable.
    - Add measurement support only, build CLI, and run the baseline live CLI evaluation against https://api.dev.openmates.org.
    - Attempt targeted backend prompt-budget changes only after baseline evidence.
    - Run CLI unit checks.
    - Run post-change live CLI evaluation against https://api.dev.openmates.org with identical prompt hashes.
    - Generate comparison artifact and apply the quality gate.
    - Revert runtime changes when the quality gate fails.
    - Skip web and Apple verification unless implementation unexpectedly changes those surfaces.

