    summary: backend/apps/ai/processing/main_processor.py and backend/apps/ai/utils/llm_utils.py returned to baseline behavior; no runtime prompt-budget optimization remains accepted.

handoff:
  current_task_id: TASK-5
  next_action: Decide whether to spend another live benchmark cycle on a different runtime optimization or stop with the measurement harness only.
  command: Ask the user for the next product decision.
  expected_outcome: User chooses another optimization attempt with real-credit post-change verification, or accepts that no runtime prompt-saving change passed this gate.
  blocker:
    requires_user_input: true
    reason: The adjusted same-corpus comparison failed the quality gate, and further attempts require a product/cost decision before spending more credits.
    question: Should we try another narrower OpenMates runtime prompt-budget optimization, or keep only the CLI measurement harness and stop the runtime changes here?
    next_action: Wait for user direction before new runtime optimization work.
  last_verified_commit: ad53e0bf6+working-tree

scenarios:
  - id: S-1
    title: Fixed corpus covers common, tool, and follow-up behavior
    given:
      - The prompt-budget evaluation corpus is committed in the repository.
    when:
      - The evaluation runner lists or executes the corpus.
    then:
      - It contains exactly 10 top-level prompt definitions.
      - Exactly 3 prompt definitions are multi-turn conversations with 6 total user messages each.
      - The remaining 7 prompt definitions are single-turn chats.
      - The corpus includes simple factual help, writing, coding, current-information/tool use, structured artifact behavior, safety/privacy review, and OpenMates platform/tool-selection behavior.

  - id: S-2
    title: Baseline run captures real processing metrics before changes
    given:
      - The CLI test account is logged in against https://api.dev.openmates.org.
      - No prompt-budget implementation changes have been applied beyond measurement support needed for the baseline.
    when:
      - The baseline evaluation command runs the fixed corpus.
    then:
      - Each turn is sent through the real OpenMates CLI chat path with benchmark metadata.
      - The output records per-turn processing duration, selected model when available, mate/category when available, selected skill/tool information when available, token/usage metrics where available, and prompt/debug budget metrics where available.
      - The output records response text and any deterministic pass/fail checks for the case.
      - The output stores a baseline artifact with a run ID and subject commit.

  - id: S-3
    title: Quality evaluation judges every baseline response
    given:
      - A baseline response artifact exists for the fixed corpus.
    when:
      - The evaluator judges response quality.
    then:
      - Every single-turn response receives a quality score and rationale.
      - Every turn in each 6-message follow-up conversation receives a quality score and rationale.
      - Multi-turn conversations also receive a continuity score and rationale.
      - The judge prompt checks helpfulness, instruction following, factuality, safety, routing/tool appropriateness, and concision.

  - id: S-4
    title: Prompt-budget changes reduce repeated prompt payloads safely
    given:
      - Baseline metrics identify concrete prompt budget drivers.
    when:
      - Prompt-budget implementation changes are applied.
    then:
      - The implementation removes or gates repeated prompt payloads without removing required capability instructions from turns that need them.
      - The implementation preserves fallback behavior for ambiguous routing or tool-selection cases.
      - The implementation is small, reviewable, and does not change user-facing model selection as the primary optimization.

  - id: S-5
    title: Post-change run reuses the same exact corpus
    given:
      - Prompt-budget implementation changes are deployed or live in the local dev API path required for CLI testing.
    when:
      - The post-change evaluation command runs.
    then:
      - It uses the same exact 10 prompt definitions and the same 3 six-message follow-up sequences as the baseline.
      - The output records the same metric categories as baseline.
      - The output stores a post-change artifact with a run ID and subject commit.

  - id: S-6
    title: Comparison decides keep, adjust, or revert
    given:
      - Baseline and post-change artifacts exist for the same corpus.
    when:
      - The comparison report is generated.
    then:
      - The report shows aggregate and per-case differences for prompt/debug budget, processing duration, token/usage metrics where available, selected model/routing, and quality scores.
      - The report highlights any response quality, safety, routing, tool-use, or continuity regression.
      - The changes are accepted only if quality does not regress materially and prompt budget or latency improves meaningfully.
      - If quality regresses materially, the spec records a needs-fix or revert decision before deployment is considered complete.

