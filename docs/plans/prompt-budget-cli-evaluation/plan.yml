schema_version: 2
id: prompt-budget-cli-evaluation
title: Prompt Budget CLI Evaluation
status: implementing

goal: >
  Reduce OpenMates AI prompt token usage only when real product-path CLI chat
  evidence proves that latency and token budgets improve without degrading
  response quality, routing, follow-up continuity, safety, or app-skill behavior.

scope:
  in:
    - A fixed committed corpus of 10 exact CLI chat prompts.
    - Exactly 3 multi-turn conversations in the corpus, each with 6 total user messages.
    - Baseline live runs through the real OpenMates CLI chat path before prompt-budget implementation.
    - Per-turn collection of processing time, model/routing metadata, token/usage metrics where available, prompt/debug budget metrics, and judged response quality.
    - Prompt-budget architecture changes that are directly supported by the baseline evidence.
    - Post-change live runs using the same exact 10 prompt definitions and the same follow-up sequences.
    - A comparison report that decides whether the changes are kept, need adjustment, or should be reverted.
  out:
    - Provider-only benchmarks that bypass OpenMates preprocessing, main processing, postprocessing, WebSocket, or CLI encryption paths.
    - Browser UI, Apple app, or SDK feature changes for the first slice.
    - OpenCode, Codex, Claude, or agent-instruction loading changes. Those recommendations are saved only as deferred follow-up reminders.
    - Changing model quality by switching target models as the primary optimization.
    - Accepting token savings that reduce judged quality, break routing/tool selection, or weaken safety behavior.
    - Using synthetic mocked model responses as proof for the before/after comparison.

context_discovery:
  github_issues:
    - "No tracker issue was provided. Existing repo discovery found benchmark-related specs and CLI docs instead of creating a new issue."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/testing.md
    - docs/plans/cli-model-benchmarks/plan.yml
    - docs/plans/app-skill-processing-quality/plan.yml
    - docs/user-guide/cli/benchmarks.md
    - docs/architecture/apps/function-calling.md
  code_patterns:
    - backend/apps/ai/base_instructions.yml contains preprocessing and postprocessing tool schemas with runtime-expanded placeholders.
    - backend/apps/ai/processing/preprocessor.py expands topic areas, app-skill hints, and focus hints for preprocessing calls.
    - backend/apps/ai/processing/main_processor.py assembles the main system prompt and already gates some embed/diff instructions.
    - backend/apps/ai/processing/tool_generator.py gates main LLM tool schemas by preselected skills.
    - backend/apps/ai/processing/postprocessor.py builds suggestion and summary prompts with all available skill hints.
    - backend/apps/ai/utils/llm_utils.py substitutes dynamic context into preprocessing tool descriptions and schema property descriptions.
    - frontend/packages/openmates-cli/src/benchmark.ts already runs real product-path benchmark cases through OpenMatesClient.sendMessage().
    - frontend/packages/openmates-cli/src/client.ts sends real CLI WebSocket chat turns and preserves benchmark metadata.
    - backend/apps/ai/tasks/ask_skill_task.py and backend/scripts/debug_requests.py expose main system prompt char counts and debug metadata paths.
  tests:
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/packages/openmates-cli/tests/client.test.ts
    - backend/tests/test_ai_skill_request_schema.py
    - backend/tests/test_usage_entries.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This first slice changes backend AI prompt assembly and CLI benchmark/evaluation tooling. Apple has no benchmark command counterpart and no direct UI change is planned.
  verification:
    - Apple not affected for this first slice.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should the 10-message evaluation corpus be fully committed as exact prompts or selected from benchmark suites at runtime?
      answer: Commit the same 10 input prompts so before/after runs use identical requests.
  vision_summary: >
    The evaluation must first establish a real baseline, then make prompt-budget
    changes, then re-run the same exact CLI chat requests so the result can be
    trusted. Token and latency savings are only successful if response quality,
    routing, and follow-up behavior stay at least as good as baseline.
  approved_by_user: true

implementation_state:
  subject_commit: ad53e0bf6+working-tree

approvals:
  specification:
    status: approved
    approved_at: "2026-07-29"
    reason: User approved the product contract and instructed OpenCode to proceed.
  plan:
    status: approved
    approved_at: "2026-07-29"
    reason: User approval covered proceeding with the included baseline-first implementation plan.

decisions:
  - id: D-1
    status: active
    decision: Use a committed fixed corpus of 10 exact prompt definitions.
    reason: The user explicitly requested the same 10 input prompts for before/after comparison.
    decided_at: "2026-07-29"
  - id: D-2
    status: active
    decision: Use the real OpenMates CLI chat path for baseline and post-change runs.
    reason: The user asked for real chat requests via OpenMates CLI; mocked or provider-only runs would not measure product prompt assembly.
    decided_at: "2026-07-29"
  - id: D-3
    status: active
    decision: Optimize prompt architecture only after baseline evidence is captured.
    reason: The user wants evidence-driven changes and a clear basis for undoing changes if quality degrades.
    decided_at: "2026-07-29"
  - id: D-4
    status: active
    decision: Prefer reversible prompt-budget changes guarded by quality comparison and feature flags or narrow predicates where practical.
    reason: Prompt reductions can silently hurt routing or output quality; rollback must remain cheap.
    decided_at: "2026-07-29"
  - id: D-5
    status: active
    decision: Defer OpenCode instruction-token recommendations until after the OpenMates runtime prompt-budget experiment is complete.
    reason: The user clarified that this benchmark and implementation scope is only OpenMates via the OpenMates CLI, not OpenCode prompt loading.
    decided_at: "2026-07-29"
  - id: D-6
    status: active
    decision: Revert the attempted runtime prompt-budget optimizations because the adjusted post-change comparison did not pass the quality gate.
    reason: The accepted rule is to keep prompt-budget changes only when the same-corpus comparison passes without material quality regressions.
    decided_at: "2026-07-29T11:51:45Z"

