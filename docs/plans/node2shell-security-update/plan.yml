id: node2shell-security-update
title: Patch Brotli decoders and verify production exposure
status: implementing
goal: >-
  Implement the security update, summarize the actual risk for our server and
  production server, and advise whether to update the production backend today.
scope:
  - Patch Python preview Brotli, Directus Node 22, and worker/frontend/build Node 24 runtimes.
  - Update active dev-host Node and Bun commands using verified upstream downloads.
  - Inspect production runtimes and exposure through the user-opened SSH connection.
constraints:
  - Preserve Directus application version and Node 22 native-module ABI.
  - Preserve user data, encryption, inference routing, and provider settings.
  - Production mutations require the user's production rollout decision.
required_checks:
  - Native preview decoder accepts valid responses and rejects the upstream invalid-block-switch regression.
  - Isolated self-host smoke verifies the built CMS decoder and existing signup behavior.
  - Worker image builds with patched Node and its existing glTF CLI.
  - Managed dev deployment and scoped runtime restart with a coordinator lease.
