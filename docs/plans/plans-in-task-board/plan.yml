schema_version: 2
id: plans-in-task-board
title: Plans in Tasks boards
status: verified
goal: >
  Remove the standalone Plans workspace and show encrypted Plans as cards in the
  five-column Tasks board, both globally and within their linked Projects. New
  Plans start from a Project and require a Project link across web, CLI, SDK,
  and API creation; older unlinked Plans remain readable.
scope:
  in:
    - Remove the Plans header tab and forward the old /plans index to Tasks.
    - Keep Plan detail editing and existing Plan links working.
    - Project-scoped New plan creates a draft with its Project key wrapper.
    - Render Plan cards in the same status columns and live counts as Tasks and
      Workflow runs, using Plan lifecycle transitions and blockers for moves.
    - Require a valid Project link on every new Plan in web, CLI, npm and pip
      SDKs, and REST; preserve readable legacy unlinked Plans.
    - Focused browser, API, CLI and SDK coverage of the new behavior.
  out:
    - Replacing Plan records with Task records or changing Plan encryption.
    - Removing /plans/:plan_id detail links before root hash routes are ready.
    - Migrating or deleting old unlinked Plans.
decisions:
  - id: D-1
    status: active
    decision: Show Plans as their own card projection in TaskBoard rather than a
      separate linked-plans strip or fake Task rows.
    reason: The user wants one status board while Plan lifecycle and encrypted
      content remain distinct from Task execution.
    decided_at: '2026-09-25'
  - id: D-2
    status: active
    decision: New Plans originate within a Project and require a Project link on
      every client; legacy unlinked Plans stay readable.
    reason: The user explicitly chose this behavior across web, CLI, SDK and API.
    decided_at: '2026-09-25'
scenarios:
  - id: S-1
    title: Global and Project Tasks include Plans
    given:
      - A user has Project-linked Plans, Tasks and Workflow runs.
    when:
      - The user opens global Tasks or a Project's Tasks tab.
    then:
      - Plans appear as cards in their status columns with contextual counts.
      - The Project board shows only Plans linked to that Project.
      - Opening a Plan preserves the editable Plan detail.
  - id: S-2
    title: Project-scoped Plan creation and compatibility
    given:
      - A user opens a Project, and older unlinked Plans may exist.
    when:
      - The user creates a Plan or visits the old Plans URL.
    then:
      - New Plan creation carries the Project link and authorized key wrapper.
      - All client creation surfaces reject a missing Project.
      - Older unlinked Plans remain readable in global Tasks.
      - The old Plans index forwards to Tasks; its header tab is absent.
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Global and Project Tasks boards render Plans as cards within the five
      Task status columns, with counts, search, opening and guarded drag moves.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-BOARD]
  - id: AC-2
    scenario: S-2
    text: Project New plan creates a Project-linked draft and opens Plan detail;
      the Plans header tab and standalone index are gone, while legacy links and
      old unlinked Plan reads continue to work.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-PROJECT]
  - id: AC-3
    scenario: S-2
    text: REST, web, CLI, npm SDK and pip SDK creation require a Project and
      preserve encrypted Project links and authorized wrappers.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-CREATE]
