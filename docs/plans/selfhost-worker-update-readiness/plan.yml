risks:
  - id: R-1
    risk: Expanding service-scoped updates may surprise operators who expected only one container to restart.
    mitigation: Dry-run and non-json output must report the expansion before applying; restart remains available for one-container process restarts.
  - id: R-2
    risk: Worker readiness checks that make live provider calls could add cost or false positives.
    mitigation: The first slice verifies Vault/provider-secret readiness without requiring live third-party provider calls in generic self-host smoke.
  - id: R-3
    risk: Selfhost-smoke could become flaky if it requires all low-resource worker containers to stay running.
    mitigation: Only assert containers that the generated core template starts by default and keep the check deterministic with Docker inspect and Vault token validation.

