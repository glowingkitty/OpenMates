      worker readiness, and selfhost-smoke guards.
    decided_at: "2026-08-02T11:14:11Z"
  - id: D-2
    status: active
    decision: Keep the no-key self-host install smoke free of real third-party provider calls.
    reason: >
      Self-hosting must still start without provider API keys; the smoke should
      verify worker image/env/Vault readiness and separate provider-key absence
      from broken worker readiness.
    decided_at: "2026-08-02T11:14:11Z"
  - id: D-3
    status: active
    decision: Treat openmates-api runtime containers as an atomic update consistency group.
    reason: >
      The production incident left app-ai-worker stale while api and task-worker
      were current; any service-scoped update of one shared-image sibling can
      recreate that failure class unless the group expands or is flagged.
    decided_at: "2026-08-02T11:14:11Z"

