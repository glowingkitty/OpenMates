schema_version: 2
id: selfhost-worker-update-readiness
title: Self-Host Worker Update Readiness
status: draft

goal: >
  Prevent self-hosted and production OpenMates core deployments from serving chat
  traffic with stale, partially updated, or Vault/provider-unready worker
  containers by making shared-image updates atomic, surfacing worker readiness in
  CLI/server health, and extending self-host smoke coverage to the app worker
  containers that process user requests.

scope:
  in:
    - Treat all core containers that reuse the openmates-api image as one update
      consistency group for image-mode updates and source-mode builds.
    - Add deterministic CLI planning/status guards that detect missing core
      workers, stale shared-image siblings, wrong/missing env, and invalid Vault
      api.token handoff for worker containers.
    - Add app-ai-worker readiness checks that verify the worker process can access
      the Vault/provider material needed for preprocessing before chat failures
      reach users.
    - Extend the selfhost-smoke workflow so it fails when app workers are absent,
      stopped, running the wrong image tag, or missing critical runtime env/Vault
      readiness.
    - Update self-host operator guidance for service-scoped updates, backend-only
      updates, and recovery from worker readiness failures.
    - Record the production issue 228f4e44-cc3e-4257-a026-666515223d2d as the
      motivating incident without storing private chat contents or share keys.
  out:
    - Changing the public chat API, WebSocket protocol, SDK contracts, or user
      chat encryption model.
    - Adding a new public REST endpoint for deployment readiness.
    - Replacing the existing provider-requirements manifest or self-host env
      command work.
    - Implementing automatic production rollback after a failed update.
    - Requiring real third-party provider API keys for the generic no-key
      self-host installation smoke test.
    - Apple app changes; this is host-level server, CLI, CI, and backend worker
      readiness work only.

