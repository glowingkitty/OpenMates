      - AC-2
      - AC-3
    assertions:
      - planServerRuntime core default services include workflow-worker and all openmates-api worker siblings.
      - image-mode update planning expands a partial openmates-api service selection to the full shared-image group.
      - dry-run JSON exposes expandedSharedImageServices and stale shared-image parity diagnostics without secret values.
    red_phase:
      required: true
      expected: fail
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}
  - id: T-BACKEND-HEALTH-UNIT
    type: pytest
    file: backend/tests/test_worker_readiness_health.py
    command: python -m pytest backend/tests/test_worker_readiness_health.py
    covers:
      - AC-4
      - AC-5
    assertions:
      - app_ai worker readiness reports no_worker separately from invalid Vault token.
      - imported preprocessing provider secrets missing from Vault produce sanitized readiness failure codes.
      - readiness output omits token values, API key values, chat text, and share-key fragments.
    red_phase:
      required: true
      expected: fail
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}
  - id: T-SELFHOST-SMOKE
    type: build
    file: .github/workflows/selfhost-smoke.yml
    command: gh workflow run selfhost-smoke.yml --ref dev
    covers:
      - AC-3
      - AC-6
      - AC-7
    assertions:
      - post-update smoke checks api, task-worker, workflow-worker, task-scheduler, and app workers that reuse openmates-api.
      - each shared-image container reports ghcr.io/glowingkitty/openmates-api:${IMAGE_TAG} after image-mode update.
      - app-ai-worker exposes CELERY_QUEUES=app_ai and validates /vault-data/api.token without requiring real provider keys.
    red_phase:
      required: true
      expected: fail
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}
  - id: T-DOCS-CLAIMS
    type: unit
    file: frontend/packages/openmates-cli/tests/server.test.ts
    command: cd frontend/packages/openmates-cli && npm run test:unit:server
    covers:
      - AC-8
    assertions:
      - docs mention that api and app workers share openmates-api and must update together.
      - any raw compose fallback documented for worker recovery includes --env-file and a role-specific compose file.
      - CLI guidance prefers openmates server update/status/preflight for normal recovery.
    red_phase:
      required: true
      expected: fail
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}

implementation_notes:
  plan_path: docs/plans/selfhost-worker-update-readiness/plan.yml
  architecture: >
    Add a shared-image service-group planner in the CLI, surface parity/readiness
    diagnostics through existing CLI/server health surfaces, and extend CI smoke
    to assert the disposable self-host stack is actually running all request
    processing workers on the expected images before the smoke is considered green.
  existing_patterns:
    - serverPlanning.ts already centralizes role services, update plans, and compose args.
    - server.test.ts already has doc-backed assertions for self-host server behavior.
    - vault_token_check.py already validates Vault api.token handoff without live secrets.
    - health_check_tasks.py already writes sanitized app/provider health data to cache.
    - selfhost-smoke.yml already builds local image tags and inspects running containers.
  data_flow:
    - CLI reads runtime role/config/env and compose service metadata, derives shared-image groups, and expands image-changing update services before Docker is called.
    - CLI status/preflight reads Docker inspect metadata and reports stale group members without secret values.
    - Backend health/readiness probes the app_ai worker and Vault/provider-secret presence, then stores sanitized status in the existing health cache.
    - GitHub selfhost-smoke builds images, performs image-mode update, and inspects worker containers plus Vault token handoff before web Playwright smoke.
  affected_files:
    - path: frontend/packages/openmates-cli/src/serverPlanning.ts
      reason: Define and test core openmates-api shared-image service groups, including workflow-worker.
    - path: frontend/packages/openmates-cli/src/server.ts
      reason: Apply shared-image expansion and expose status/preflight diagnostics.
    - path: frontend/packages/openmates-cli/tests/server.test.ts
      reason: Add red/green unit and doc-claim coverage for service groups and operator guidance.
    - path: backend/core/api/app/tasks/health_check_tasks.py
      reason: Distinguish worker queue presence from worker readiness and provider/Vault readiness.
    - path: backend/tests/test_worker_readiness_health.py
      reason: Add focused pytest coverage for sanitized AI worker readiness states.
    - path: .github/workflows/selfhost-smoke.yml
      reason: Check shared-image worker containers after image-mode update.
    - path: docs/self-hosting/setup.md
      reason: Document shared-image update safety and recovery guidance.
    - path: docs/user-guide/cli/server-management.md
      reason: Update service-scoped update examples and explain shared-image expansion.
  verification_strategy:
    - Add failing unit tests for shared-image expansion before changing CLI behavior.
    - Add backend readiness unit tests before adding worker readiness logic.
    - Add selfhost-smoke worker assertions and verify syntax/unit coverage locally; full green requires GitHub Actions run.
    - Use existing provider and Vault token tests as supporting coverage, not replacements for new readiness checks.
  verification_order:
    - T-CLI-SERVER-UNIT red, then CLI planner/status implementation, then T-CLI-SERVER-UNIT green.
    - T-BACKEND-HEALTH-UNIT red, then readiness implementation, then T-BACKEND-HEALTH-UNIT green.
    - T-DOCS-CLAIMS red/green with docs updates.
    - T-SELFHOST-SMOKE red/green through GitHub Actions after deploy to dev.

