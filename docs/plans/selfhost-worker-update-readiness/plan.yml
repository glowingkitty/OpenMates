contracts:
  cli:
    - openmates server update --dry-run --json includes sharedImageGroups and expandedSharedImageServices for core image-mode updates.
    - openmates server status --json includes sharedImageParity for OpenMates-built image groups when Docker inspect data is available.
    - openmates server preflight --json includes workerReadiness and sharedImageParity without secret values.
    - Service filters remain accepted, but image-changing updates cannot silently update only one running sibling of a shared-image group.
  backend_internal:
    - AI worker readiness is internal-only and may be implemented as a Celery diagnostic task, health-check helper, or CLI docker-exec probe.
    - Any backend readiness cache is internal/first-party admin surface only; no new unauthenticated public endpoint is introduced in this spec.
    - Readiness data may include container/service names, queue names, provider ids, Vault paths, and sanitized failure codes.
    - Readiness data must not include API key values, Vault token values, decrypted chat content, encrypted chat keys, share URL fragments, or user prompts.
  access_model:
    changed_endpoints: none
    endpoint_classification: internal-only if a future implementation adds a readiness route.
    auth: Existing CLI/local Docker access or existing admin/authenticated server-status surfaces only.
    rate_limits: No new public rate limit; any live provider probe remains bounded by existing provider health-check intervals.
    credit_budget: No chat credits are charged for readiness checks.
    encrypted_data: Client-side encrypted chat, memory, file, key, sync, and share material is not accepted or returned.
  selfhost_smoke:
    - The no-key smoke asserts container readiness and Vault token handoff, not live third-party provider success.
    - A separate provider-backed smoke may be added later when Vault test secrets are intentionally available.

tests:
