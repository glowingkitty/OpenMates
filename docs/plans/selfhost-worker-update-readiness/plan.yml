clarification:
  rounds:
    - question: Should the first spec include both deployment guards and AI/provider readiness checks?
      answer: >
        Yes. The user asked to improve stability, add guards, and improve the
        self-hosting test so this production class does not repeat.
  vision_summary: >
    The approved direction is guard-first: stale workers and missing worker
    readiness must become deterministic failures in planning, status, health, or
    CI before a user chat can hit the same outage path. The initial implementation
    should keep public APIs unchanged and use the smallest reliable CLI/backend
    checks plus selfhost-smoke coverage.
  approved_by_user: false

