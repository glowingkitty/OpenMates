scenarios:
  - id: S-1
    title: Service-scoped update cannot leave shared-image core workers stale
    given:
      - A core image-mode install is running api, task-worker, workflow-worker,
        task-scheduler, app-ai-worker, and other app workers.
      - Those containers all use ghcr.io/glowingkitty/openmates-api with the
        current OPENMATES_IMAGE_TAG.
    when:
      - The operator runs openmates server update --services api,task-worker.
    then:
      - The dry-run and applied plan expand or explicitly fail to prevent stale
        openmates-api siblings.
      - The plan reports the expanded shared-image service group.
      - The applied update recreates every running configured openmates-api
        service in the group or fails before changing containers.

  - id: S-2
    title: Status and preflight expose shared-image drift
    given:
      - app-ai-worker is running an older openmates-api image digest than api.
    when:
      - The operator runs openmates server status --json.
      - The operator runs openmates server preflight --json.
    then:
      - The output includes a machine-readable sharedImageParity status.
      - The stale container names and expected image/tag/digest are listed.
      - Non-json output gives an actionable command to reconcile the group.

  - id: S-3
    title: AI worker readiness catches Vault/provider breakage before chat traffic
    given:
      - app-ai-worker is listening on the app_ai Celery queue.
      - Its /vault-data/api.token is missing, invalid, or lacks required policy.
      - Or the preprocessing chain depends on Mistral/OpenRouter secrets that are
        marked imported but absent from Vault.
    when:
      - Scheduled app/provider health checks run.
      - Or the operator runs the CLI readiness/preflight check.
    then:
      - AI app health becomes degraded or blocked with a sanitized reason such as
        worker_vault_token_invalid or preprocessing_provider_secret_missing.
      - The health/readiness output does not print secret values or private chat data.
      - Chat-facing code can use the readiness state to avoid accepting new turns
        into a known-broken app_ai worker path in a later implementation slice.

  - id: S-4
    title: Self-host smoke fails when app workers are missing or stale
    given:
      - The selfhost-smoke workflow builds local image-mode images with IMAGE_TAG.
      - The workflow installs, starts, and updates a disposable image-mode core server.
    when:
      - The post-update smoke checks runtime containers.
    then:
      - api, task-worker, workflow-worker, task-scheduler, app-ai-worker,
        app-images-worker, app-music-worker, app-videos-worker, app-pdf-worker,
        app-code-worker, and app-social-media-worker must be running.
      - Each shared-image container must report ghcr.io/glowingkitty/openmates-api:IMAGE_TAG.
      - app-ai-worker must expose the app_ai queue env and be able to read a valid
        Vault token handoff without needing real provider API keys.

  - id: S-5
    title: Operator guidance avoids raw compose/env mistakes
    given:
      - An operator is recovering a stale worker on a self-host or production host.
    when:
      - They read self-host update docs or CLI error output.
    then:
      - The guidance prefers openmates server update/status/preflight over raw docker compose.
      - Any documented raw compose fallback includes --env-file <install>/.env and
        the correct project directory/file order.
      - The docs explain that several worker containers reuse openmates-api and
        must be updated together.

