schema_version: 2
profile: concise
id: dictation-correction-gate
title: Gate correction for composer dictation
status: implementing
goal: Make dictation transcription faster and cheaper by gating the correction step.
approved_by_user: true
approval_basis: Marco requested the Jev gate, removal of titles for text-only dictation, measurement and dev deployment in TASK-2416.
specifications: [feature.message-input]
scope:
  in:
    - Check each text-only web composer dictation batch with the configured Jev model before calling correction.
    - Preserve raw and corrected text semantics and first-party guest admission, and omit dictation titles.
    - Retain titles for saved audio and compatibility for existing realtime clients.
  out:
    - Changes to recording storage, client-side encryption or production deployment.
required_checks:
  - Gate decision, provider failure, guest spend admission and transcript result tests.
  - Web composer E2E, Apple realtime and CLI audio compatibility checks.
  - Multilingual real-provider latency, supplier cost, skip rate and quality comparison.
