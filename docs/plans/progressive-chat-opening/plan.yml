contracts:
  api:
    changed: false
    access_model: first-party client surface only
    auth: Existing authenticated owner session for GET /v1/chats/{chat_id}/messages/window.
    rate_limits: Existing bounded message-window route limits apply.
    credit_budget: No OpenMates credits or AI budget consumption.
    encryption_boundary: Existing route returns client-encrypted message material only; decryption remains client-side.
  ui:
    selected_chat_shell: Visible immediately after selection, with welcome and prior-chat content removed.
    local_ready: Decrypted cached header and bounded local messages render without waiting for remote repair.
    repairing: Existing local content remains interactive while repair is pending.
    error: Target-specific retry or error state; no ciphertext or stale plaintext.
  privacy_security:
    - Do not add durable plaintext caches.
    - Do not log decrypted titles, message content, keys, or ciphertext payloads.
    - Keep generation guards around every asynchronous UI commit.

