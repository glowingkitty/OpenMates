decisions:
  - id: D-1
    status: active
    decision: Preserve remote completeness repair but remove it from the first-paint critical path when a valid local window exists.
    reason: The repair closes a real cross-device stale-window race, while awaiting it causes the reported broken transition.
    decided_at: "2026-08-16T15:13:47Z"
  - id: D-2
    status: active
    decision: Commit a target-specific shell immediately and never retain welcome or previous-chat plaintext after selection.
    reason: A coherent shell is safe and useful even while keys or messages are still loading.
    decided_at: "2026-08-16T15:13:47Z"
  - id: D-3
    status: active
    decision: Keep decrypted messages bounded to active UI memory and persist only ciphertext in IndexedDB.
    reason: Faster opening must not weaken the existing client-side encryption boundary.
    decided_at: "2026-08-16T15:13:47Z"

scenarios:
  - id: S-1
    title: Warm recent chat opens before delayed repair
    given:
      - Alice is authenticated on the web app with the sidebar closed.
      - A saved chat has decrypted recent metadata, a usable local key, and a short encrypted IndexedDB window.
      - The bounded server window response is delayed.
    when:
      - Alice opens that chat from the workspace welcome surface.
    then:
      - The selected-chat shell replaces welcome immediately.
      - Cached header metadata and locally decrypted messages render before the delayed response.
      - Background repair may merge newer messages without duplicates or ordering changes.
  - id: S-2
    title: Cold local history keeps a coherent target shell
    given:
      - Alice selects a saved chat whose metadata is known but whose local message window is empty or not yet decrypted.
    when:
      - OpenMates requests bounded content hydration.
    then:
      - The selected chat header and transcript loading state remain visible.
      - Welcome content, previous-chat messages, and ciphertext remain hidden.
      - A failed repair produces a visible target-specific retry or error state.
  - id: S-3
    title: Rapid navigation rejects stale completion
    given:
      - Alice opens chat A and its local or remote hydration remains pending.
    when:
      - Alice selects chat B before chat A finishes.
    then:
      - Chat B remains the only visible chat surface.
      - Stale chat A header, messages, repair, and welcome reconciliation cannot commit into chat B.

