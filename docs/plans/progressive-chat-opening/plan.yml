implementation_notes:
  spec: docs/plans/progressive-chat-opening/plan.yml
  plan_path: docs/plans/progressive-chat-opening/plan.yml
  contract_classification: semantic_change
  permanent_assertions: [chat-navigation.open.local-first-coherent, sync.startup.bounded-phases, chats.persistence.client-encrypted, chats.message.identity-idempotent]
  existing_patterns:
    - ActiveChat.loadChatGeneration already rejects stale asynchronous chat loads.
    - ChatKeyManager and chatDB already unwrap keys and decrypt bounded IndexedDB windows client-side.
    - fetchAuthenticatedMessageWindow already persists and rereads encrypted bounded server repair results.
    - phasedSyncState and chatListCache already expose locally known recent chat shells before full sync completes.
  phase_order:
    - Browser-only Svelte state transition; REST, CLI, and SDK implementation gates are not applicable because no endpoint or shared programmable behavior changes.
    - Add and deploy the Playwright regression, then record the expected red result against current dev.
    - Implement the web local-first state transition and asynchronous repair.
    - Deploy and run Playwright green evidence, adjacent message sync, and reviewed laptop/mobile visual smoke.
    - Request user confirmation, then complete Apple impact review last.
  architecture: >
    Keep the existing encrypted IndexedDB and bounded server-window architecture,
    but split selected-chat shell commitment, local decryption, and optional
    remote repair into ordered UI stages guarded by the existing load generation.
  architecture_steps:
    - At load generation start, commit the target chat identity and hide welcome before awaited work.
    - Clear previous-chat messages on a real chat switch; keep same-chat in-flight preservation unchanged.
    - Publish the local bounded window as soon as decryption completes.
    - Run short-window completeness repair asynchronously after local publication and guard every merge with generation plus chat id.
    - For metadata-known deep links, use local cache/IndexedDB after crypto readiness instead of full phased-sync completion; retain the sync waiter when no local shell exists.
  data_flow:
    - Alice selects chat-b while welcome is visible.
    - ActiveChat commits chat-b shell and showWelcome=false.
    - The client unwraps chat-b key locally and decrypts its bounded IndexedDB window.
    - Four local messages render while GET /v1/chats/chat-b/messages/window remains delayed.
    - Repair persists ciphertext, rereads the bounded window, and merges only if chat-b is still the current generation.
  affected_files:
    - path: frontend/apps/web_app/tests/startup-sync-contract.spec.ts
      reason: Add the failing delayed-repair and coherent-shell contract assertions.
    - path: frontend/packages/ui/src/components/ActiveChat.svelte
      reason: Commit target shell/local window before optional asynchronous repair.
    - path: frontend/apps/web_app/src/routes/+page.svelte
      reason: Avoid full-sync gating for a locally known authenticated deep link if required by the red test.
    - path: specifications/features/chat-navigation/specification.yml
      reason: Durable approved behavior assertion.
    - path: specifications/features/chat-navigation/examples.yml
      reason: Concrete warm, cold, stale, and failure examples.
  migrations: none
  observability:
    - Add stage timing without decrypted metadata or message content only if the regression cannot diagnose local-ready versus repair-ready transitions.
    - Remove existing decrypted-title debug logging encountered in the touched load path.
  verification:
    - python3 scripts/tests.py run --spec startup-sync-contract.spec.ts
    - python3 scripts/tests.py run --spec message-sync.spec.ts
    - python3 scripts/playwright_visual_smoke.py --url https://app.dev.openmates.org/ --session ae23
    - python3 scripts/apple_remote.py status
  verification_strategy:
    - Record a deployed Playwright red failure while the real bounded-window request is deliberately delayed.
    - Deploy the source fix and require the same startup-sync spec to pass for the exact commit.
    - Run adjacent message-sync coverage, then inspect laptop and mobile visual-smoke screenshots.
    - Obtain user confirmation before the final Apple impact review.
  verification_order: [T-WEB-PROGRESSIVE-OPEN, T-WEB-MESSAGE-SYNC, V-UI-VISUAL-SMOKE, V-USER-CONFIRMATION, V-APPLE-IMPACT]
  documentation: Generated contract indexes only; no user-doc change.
  risks:
    - Publishing a stale local window without repair could hide cross-device messages; repair remains mandatory when current predicates detect uncertainty.
    - Clearing state too broadly could break same-chat streaming preservation; distinguish real chat switches from same-chat reloads.
    - A stale asynchronous repair could cross chat boundaries; generation and chat-id checks are mandatory.
  open_questions: []
  separate_technical_approval_required: false
  first_slice: Add the deployed delayed-window red regression before product code.

