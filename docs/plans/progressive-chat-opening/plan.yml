goal: >
  Make opening a saved chat feel immediate and coherent: commit the selected
  chat shell, cached header, and bounded locally encrypted message window before
  optional remote completeness repair, without ever mixing the workspace welcome
  surface or previous-chat plaintext with the selected chat.

scope:
  in:
    - Authenticated web navigation to a locally known saved chat from welcome, another chat, or a chat-id deep link.
    - Immediate target-chat shell selection and welcome-surface removal.
    - Local IndexedDB message-window decryption before optional bounded server repair.
    - Background repair with existing generation, ordering, and deduplication guards.
    - Target-specific loading and error behavior when local content or keys are unavailable.
    - Deployed Playwright coverage with the sidebar closed and delayed real window requests.
  out:
    - Backend message-window API changes.
    - New plaintext caches or durable decrypted chat content.
    - Full chat-sync or IndexedDB schema redesign.
    - Changes to anonymous, incognito, public example, or shared-recipient chat loading unless regression fixes are required.
    - Apple product-code changes unless native verification finds a contract mismatch.

context_discovery:
  issue:
    - Dev issue R5L8Q reports a slow chat open with selected-chat and workspace-welcome surfaces visible together.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/long-chat-compression-history/plan.yml
    - docs/plans/apple-live-chat-accessibility-fixes/plan.yml
    - docs/architecture/data/sync.md
  contracts:
    - feature.chat-navigation@2 approved in session ae23 with fingerprint dff658bb7a42d4abb73795b3bc492cb653c12a1c871beb562166bcde304fc4f0.
    - architecture.sync@1 preserves bounded Phase 1 metadata and encrypted content sync.
    - feature.chats@1 preserves client ciphertext, stable identities, and deduplication.
  code_patterns:
    - frontend/packages/ui/src/components/ActiveChat.svelte assigns currentChat before awaited decryption and remote repair, then reconciles showWelcome at load completion.
    - frontend/apps/web_app/src/routes/+page.svelte waits for full phased sync for authenticated deep links even when local metadata exists.
    - frontend/packages/ui/src/services/chatSyncServiceHandlersCoreSync.ts keeps recent decrypted header metadata in Phase 1 state and persists recent encrypted messages to IndexedDB.
    - frontend/packages/ui/src/services/db/messageOperations.ts decrypts bounded IndexedDB windows into returned UI copies.
  tests:
    - frontend/apps/web_app/tests/startup-sync-contract.spec.ts
    - frontend/apps/web_app/tests/message-sync.spec.ts
    - frontend/packages/ui/src/services/db/__tests__/messageWindowOperations.test.ts

apple_impact:
  affected_files:
    - none expected
  parity_expectations:
    - Apple chat navigation must continue showing a selected-chat loading or ready surface rather than stale prior content when a local window is unavailable.
    - This web-only state race must not introduce a backend or encryption contract change for Apple.
  verification:
    - python3 scripts/apple_remote.py status
    - Review existing Apple chat-loading contract coverage; run a targeted build or test only if shared behavior changed.
  intentional_native_differences:
    - Apple uses native ChatView loading states and does not share ActiveChat.svelte or the web welcome surface.

clarification:
  rounds:
    - question: Should recent chats block on server completeness repair before rendering?
      answer: No. Render cached header and local history first, then repair asynchronously.
    - question: What should appear when local history is not ready?
      answer: Show the selected chat header and a target-specific loading transcript, never the workspace landing page.
  vision_summary: >
    Recent chats should open from local encrypted state without a network-gated
    transition. Missing or stale local history may repair in the background, but
    all intermediate states must belong exclusively to the selected chat.
  approved_by_user: true

