scenarios:
  - id: S-1
    title: Connect and authorize without leaking credentials
    given: [An authenticated first-party owner and an explicitly selected connection.]
    when: [The owner reads or approves an exact mutation and required scope upgrades.]
    then: [Only authorized scopes execute and transient token artifacts are cleaned on every outcome.]
  - id: S-2
    title: Create and discover an isolated calendar
    given: [Explicit live-test opt-in and secondary-calendar creation authorization.]
    when: [Create-calendar returns an identity and later runs reuse it.]
    then: [The exact calendar is discoverable and duplicate or primary-calendar writes are prevented.]
  - id: S-3
    title: Read search and inspect availability
    given: [Synthetic events in an authorized calendar.]
    when: [List exact read search and freebusy skills execute with bounds and pagination.]
    then: [Results preserve time and identity and partial failures are not reported as free time.]
  - id: S-4
    title: Mutate safely and clean up
    given: [Synthetic timed all-day and recurring events with operation provenance.]
    when: [Create partial update delete retry conflict and undo cases execute.]
    then: [No duplicate creation lost updates unrelated deletions or silent attendee effects occur.]
  - id: S-5
    title: Equivalent first-party clients
    given: [The same authenticated resource and action inputs.]
    when: [API CLI npm pip and web execute supported Calendar behavior.]
    then: [Permissions results and failures are equivalent and clean synthetic proof is delivered.]
  - id: S-6
    title: SDK uses an existing connection without connecting accounts
    given: [A connection provisioned through CLI or web and valid runtime authorization.]
    when: [npm or pip executes a Calendar skill or encounters a missing scope.]
    then: [Execution works or directs reconnection to CLI or web; no SDK OAuth or raw-token shortcut exists.]
  - id: S-7
    title: Workflow executes while authorizing clients are offline
    given: [An enabled workflow with an exact bounded read/write grant and isolated synthetic calendar.]
    when: [All authorizing clients disconnect and the real scheduler dispatches the due run.]
    then: [The worker performs the exact provider operations once and encrypted results and cleanup are verified after observer reconnection.]
  - id: S-8
    title: Workflow access is understandable and revocable
    given: [A connected account selected in a workflow draft.]
    when: [The user reviews enables pauses resumes expands revokes or deletes workflow access.]
    then: [The inline disclosure and single access review match actual server permissions and lifecycle enforcement.]
