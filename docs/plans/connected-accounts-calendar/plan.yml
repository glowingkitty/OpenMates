schema_version: 2
id: connected-accounts-calendar
title: Connected Accounts And Google Calendar Including Unattended Workflows
status: implementing
goal: >
  Implement and fix the full Calendar capabilities and app skills, from reading
  and searching calendars to creating calendars and events and updating existing
  events, for Google Calendar first under a unified connected-accounts specification,
  including unattended workflow compatibility and real offline execution testing.
specification_refs:
  - id: feature.app-skills.calendar
    version: 3
    role: primary
    fingerprint: c8bdba5d383489ec4a1473023ba11d72c7638bbe64f78da72961639c9d8ec9c0
  - id: architecture.connected-accounts
    version: 2
    role: inherited
    fingerprint: 28a286d72aaf0f946c32b48cf316fd9a92c94d64715cc10cbfad80a288b90186
scope:
  in:
    - Shared interactive account ownership, normalization, permissions, scope upgrades, token lifecycle, and safe errors.
    - Nine Calendar skills through Google provider, authenticated API, CLI, npm/pip SDKs, and affected web surfaces.
    - Calendar creation/discovery, bounded search and availability, event CRUD, time and recurrence handling, safe retry and conflict handling.
    - Real opt-in integration tests with runtime-selected account and isolated calendar, synthetic data and exact cleanup.
    - Explicit workflow grant activation, server-usable encrypted credential brokerage, scheduled offline execution, lifecycle controls, and proof.
    - CLI and web connection/reconnection; npm and pip execute existing authorized connections only.
  out:
    - SDK account-connection or OAuth setup methods and trusted-device workflow execution.
    - Other providers, new team sharing, native implementation, calendar deletion/clearing/renaming, ACL changes, and recurrence splitting.
    - Operator-specific accounts, environments, business processes, credentials, calendar IDs, and private instructions in tracked files.
