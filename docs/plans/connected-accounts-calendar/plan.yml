    - backend/tests/test_google_calendar_oauth_adapter.py
    - backend/tests/test_connected_account_execution.py
    - backend/tests/live/test_google_calendar_permissions_live.py
    - frontend/apps/web_app/tests/calendar-permission-flow.spec.ts
    - frontend/apps/web_app/tests/connected-account-calendar-settings.spec.ts
    - backend/tests/test_workflow_key_boundary.py
    - backend/tests/test_workflow_app_skill_adapter.py
    - backend/tests/test_workflow_scheduler_contract.py
    - frontend/apps/web_app/tests/cli-workflows-schedule-real.spec.ts
    - frontend/apps/web_app/tests/workflows-editor.spec.ts
  findings:
    - Calendar metadata declares four skills but typed CLI Calendar commands and calendar discovery are absent.
    - Write/delete Google consent omits calendar-list authorization; calendar creation needs separate incremental scope.
    - Existing live provider test bypasses OpenMates and defaults to primary; replace as acceptance evidence and remove unsafe fallback.
    - Reuse existing broker and SDK session execution instead of exposing connected skills through developer-key REST.
    - Legacy Calendar Plan and tests reference absent Specification paths; map touched tests to approved stable assertions.
    - VaultWorkflowPayloadCipher already encrypts workflow execution blobs with user Vault keys; reuse that boundary without reclassifying interactive credentials.
    - WorkflowAppSkillAdapter exposes opaque binding revalidation but fails when a resolver is absent; wire real grants rather than pretending this hook supplies offline authorization.
