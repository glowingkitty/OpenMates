contracts:
  api:
    - route: /v1/workflows/* activation access-review and grant lifecycle extensions
      access: First-party authenticated owner only; SDK acceptance binds a reviewed access revision but cannot connect an account.
      limits: Enforce existing workflow activation limits rate and credit budgets plus grant operation frequency retry and resource limits.
      privacy: Encrypted workflow grant content and server credentials; opaque references only in operational metadata.
    - route: Internal scheduler runner and workflow provider-binding resolver
      access: Internal-only worker execution with persisted owner workflow grant revision and resource checks before each provider call.
      limits: Bounded retries leases and execution budget; approval waits persist state without holding workers.
      privacy: Decrypt server authorization only in the broker for authorized execution; no per-run client credential dependency.
    - route: /v1/connected-accounts and /v1/provider-oauth/google/calendar/*
      access: first-party session or approved device authentication; owner-scoped, not developer API key alone
      limits: Preserve route rate limits; add bounded validation and explicit rate-limit tests to changed endpoints.
      privacy: Client-encrypted persisted identity and credential envelopes; transient exchange only.
    - route: /v1/sdk/connected-account-skills/calendar/{skill_id}
      access: first-party client surface only with scoped account authorization
      limits: Enforce shared skill billing budgets request limits and request-level rate limits before provider mutation.
      privacy: Decrypted provider data only transiently; sanitized response; encrypted receipts and operation journal.
    - route: /v1/token-broker/* and /v1/connected-accounts/actions/*
      access: first-party owner-scoped turn/action authorization; internal exchange execution
      limits: Short-lived scoped refs; cleanup even when validation or later ref creation fails.
      privacy: No tokens or raw account content in logs CLI arguments fixtures or proof.
  data:
    - Normalize shipped google/google_calendar account identifiers without broadening old capabilities.
    - Creation capability is distinct from event-write capability; resource scope binds creation input until a calendar exists.
    - Operation journal binds account calendar event and operation identities; reconcile ambiguous Google outcomes before retry.
    - Runtime test target and provenance are stored outside tracked files; no direct refresh-token test input.
  ui_states: [disconnected, reconnect_required, selection_required, approval_pending, cancelled, conflict, uncertain, success, provider_failure]
  privacy_security:
    - No generic developer REST exposure; unattended access requires an explicit activation grant, never copied interactive refs.
    - Tests use no attendees or broadcast notifications; side-effect cases use controlled provider mocks.
    - Missing setup is a blocked live acceptance gate, not a successful skipped test.
