implementation_notes:
  plan_path: docs/plans/connected-accounts-calendar/plan.yml
  architecture: Extend the existing broker registry provider and skill layers without a second authorization implementation.
  existing_patterns: [backend/shared/python_utils/connected_account_registry.py, backend/core/api/app/routes/sdk.py, frontend/packages/openmates-cli/src/client.ts]
  data_flow:
    - First-party client resolves a runtime-selected encrypted account and reviews effective capability and resource scope.
    - Backend validates session ownership request and limits before broker refs; authorized Google adapter executes only the exact action.
    - Sanitized structured result and encrypted operation receipt return; temporary authorization is cleaned and uncertain writes remain uncertain.
    - Workflow draft selection has no credential upload; explicit activation commits the reviewed grant and encrypted server authorization together or leaves neither usable.
    - Scheduler leases a due run; runner revalidates owner workflow grant and exact action immediately before broker exchange and provider dispatch.
    - Pause fences new runs; revoke and expiry fence queued calls and retries; last retained grant removal deletes server authorization while interactive encrypted connection stays separate.
  affected_files:
    - {path: backend/core/api/app/routes/workflows.py, reason: Owner-bound grant review and activation lifecycle.}
    - {path: backend/core/api/app/services/workflow_service.py, reason: Reuse Vault encryption and atomic activation persistence.}
    - {path: backend/core/api/app/services/workflow_app_skill_adapter.py, reason: Exact grant resolution and authorized Calendar dispatch.}
    - {path: backend/core/api/app/services/workflow_runner.py, reason: Pending approvals grant fencing and uncertainty handling.}
    - {path: backend/core/api/app/services/workflow_scheduler_service.py, reason: Due-run pause revocation and bounded retry behavior.}
    - {path: frontend/packages/ui/src/components/workflows/WorkflowDetailPage.svelte, reason: Offline disclosure activation review and access controls.}
    - {path: backend/core/api/app/routes/provider_oauth_google_calendar.py, reason: Incremental scope and reconnect behavior.}
    - {path: backend/core/api/app/routes/sdk.py, reason: First-party auth request validation permission and cleanup boundary.}
    - {path: backend/shared/python_utils/connected_account_registry.py, reason: Capability provider normalization and exact scope registry.}
    - {path: backend/shared/providers/google_calendar, reason: Discovery creation query time mutation preconditions and normalization.}
    - {path: backend/apps/calendar, reason: Nine registered skill contracts and schemas.}
    - {path: frontend/packages/openmates-cli/src, reason: Typed commands account handling and SDK facade.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: Python authenticated skill parity.}
    - {path: frontend/packages/ui/src/components/embeds/calendar, reason: Event and action result presentation.}
  verification_strategy:
    - Record failing assertion-specific tests before every implementation slice and rerun the same tests plus adjacent broker regressions.
    - Unit commands describe test payloads; shared Docker and test operations use the current sessions.py coordinator and queue rather than bypass locks.
    - Deploy scoped changes through sessions.py deploy; record exact subject commit and use commit-gated deployed tests.
    - Use prepare-deploy and verify-prepared for dependency-light CLI typechecking; verify installed executable identity before real CLI proof.
    - Create focused component preview specs for each modified component with chrome=0 before broader web flow proof.
    - Run plan_verify.py --phase complete --json and require complete true plus every proof snippet before completion.
  verification_order: [real REST API first, real CLI second, real npm and pip third, CI daily wiring fourth, deployed web fifth, reviewed visual smoke sixth, user confirmation seventh, native deferred by approved scope]
  rollout:
    - Preserve old encrypted accounts and explicitly request newly required consent without disconnecting unrelated apps.
    - No schema migration is presumed; if journal changes require one add a reviewed reversible migration before deploying that slice.
    - Deploy grant schema and broker first, runner dispatch next, then CLI and web exposure; advertise offline support only after real scheduled execution passes.
    - No retroactive grants for existing workflows; they remain without connected-account offline access until explicit activation review.
    - Rollback disables new dispatch and preserves encrypted receipts for reconciliation; no plaintext fallback or automatic grant recreation.
  documentation:
    - Regenerate skill CLI SDK references and map touched tests to the approved assertion IDs.
    - Add generic live-test setup and cleanup instructions with placeholders only.
    - Document SDK execution-only boundaries and offline grant storage pause versus revoke and provider-versus-OpenMates enforcement honestly.
