delivery:
  tracking: OpenMates Tasks owns execution status and dependencies; this Plan does not duplicate that ledger.
  planning_task: TASK-4587
  tasks:
    - task: TASK-2197
      outcome: Shared authoring for the full eligible inventory, API/native CLI/SDK content semantics, relevant-only instructions, and stable encrypted records.
      assertion_groups: [creation, eligibility, facts, content, media, lifecycle, groups, surfaces]
    - task: TASK-7380
      outcome: All eligible records render, group, map, open, share, and support their applicable explicit web actions.
      assertion_groups: [content, media, lifecycle, groups, maps, actions, surfaces]
    - task: TASK-9309
      outcome: The landing request, acknowledgement, event preview, pointer click and details animation reflects the verified capability.
      assertion_groups: [demonstrations]
    - task: TASK-5964
      outcome: A real sourced FOSDEM research chat with a working event card is admitted, sanitized, published and verified as an example.
      assertion_groups: [demonstrations]
  implementation_order:
    - Establish an event vertical slice internally, then complete every eligible type before the first release; the release scope is not limited to the four originally named types.
    - Prove API/native CLI/SDK semantics, then integrate and verify web presentation and actions.
    - Start the landing-animation and public-example outcomes only after the real authored event flow is verified.

required_checks:
  - id: authoring-contracts
    method: Focused local backend/schema/prompt unit checks plus immutable protocol fixtures.
    proves: Every eligible registration has a validated adapter; relevant prompts receive the required guidance, unrelated prompts receive none, and unsupported internal/asset claims fail safely.
  - id: client-integration
    method: Existing isolated GitHub API/WebSocket, native CLI and cross-SDK conformance infrastructure; update affected capability/protocol coverage.
    proves: Real transport, identity, typed content, sources, unknown states, cancellation and persistence are consistent across required clients.
  - id: web-components-and-flows
    method: Bare component previews followed by focused application Playwright specs in isolated GitHub CI, with assertion metadata.
    proves: Full eligible-type fixture matrix, phone/laptop and light/dark states, mixed same-response groups, map selection/precision, validation failures, reload and history reuse.
    existing_coverage: [embed-showcase.spec.ts, embeds-map-view.spec.ts, embed-canonical-replay.spec.ts, calendar-event-embed.spec.ts]
  - id: sharing-and-explicit-actions
    method: Extend existing isolated share-embed-flow/shared-chat-embed-assets coverage and event export coverage.
    proves: An intended recipient can open the explicitly shared authored record and authorized assets; draft/source context survives; valid event .ics export works without an implicit calendar write or booking.
  - id: real-assistant-authoring
    method: After scoped candidate deployment, run isolated real-inference OpenMates chats on dev for research, uploads, explicit drafts and mixed groups; verify the actual resulting embeds.
    proves: Natural requests create useful rich content through relevant-only instructions without relying on unavailable discovery skills or invented facts/references.
    routing: Use default automatic routing throughout, with no model/provider mentions, selection flags, account-default changes or per-chat overrides, as explicitly required by the user.
  - id: demonstrations
    method: Existing landing component/application CI and public-example admission/deployed rendering workflow after real event authoring passes.
    proves: The animation matches working behavior and the example retains its actual researched edition, sources and working preview/fullscreen/actions.

verification_notes:
  - Product REST/WebSocket, CLI/SDK and browser integration run in isolated GitHub CI; only checks strictly requiring real AI run on isolated dev state.
  - Reuse the repository CI coordinator, immutable candidate artifacts and runtime leases. Deliver selected recordings under the existing testing rules; no additional edited proof video is required by this Plan.
  - Update relevant E2E coverage with the implementation. Keep current instruction/context inclusion checks and all eligible-type rendering fixtures meaningful rather than mirroring implementation details.
  - Planning validation and approved Specification receipt are not product-test passes. Record actual source-bound verification during each delivery Task.
