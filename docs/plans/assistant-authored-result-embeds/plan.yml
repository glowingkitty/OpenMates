schema_version: 2
profile: concise
id: assistant-authored-result-embeds
title: Assistant-authored rich embeds from flexible information sources
status: approved
goal: >
  Allow the assistant to create all suitable existing embed types from existing
  app results, permitted web research, user-provided information, and uploads;
  show them individually, in groups, and on maps. Give the assistant only the
  relevant embed instructions when relevant, keeping context small. Preserve
  shareability and each type's existing explicit actions, including adding an
  event to a calendar. After verified creation, restore the event landing
  animation and introduce a real sourced FOSDEM example chat.

specification: feature.assistant-authored-result-embeds@1
approved_fingerprint: 357f1fc43c04948d41da770abed8dd9d67ecb7a4048d726ab4b9f11954115fc8
approval_source: Explicit user approval in the linked Codex chat on 2026-10-26.
scope:
  in:
    - Every informational and real-asset result registration in the approved Specification's eligibility inventory, in the first release.
    - Explicitly requested fictional/proposed records labelled as drafts in both previews and details.
    - Shared authoring, encrypted lifecycle, same-response groups, existing rich UI, sources, images, maps, sharing, and applicable explicit actions.
    - API, native Rust CLI/TUI and Rust/npm/Python SDK semantics, followed by verified web behavior.
    - Verified landing animation and admitted public example after the real event flow works.
  out:
    - Restoring removed providers, collecting through unauthorized endpoints, or widening provider discovery contracts.
    - Implying bookings, purchases, publication, calendar writes, successful tool execution, uploads, or generated assets from authored content alone.
    - Automatic paid enrichment, silent geocoding, a new map engine, historical-data migration, or unrelated editing features.
    - Apple implementation before verified web behavior and the separately reviewed Apple stage.

design:
  registry_and_instructions:
    - Extend existing app embed metadata with explicit authoring eligibility and type schemas; use app-qualified identities to avoid event/calendar and other name collisions.
    - Reuse the current for_embed_types instruction mechanism and relevant_embedded_previews routing; expose only compact discovery hints before selection.
    - Inject detailed format/schema guidance only for selected relevant kinds. Deduplicate shared schemas/instructions such as web/news; do not inject the complete catalog into every main-model prompt.
    - Authoring eligibility is independent of whether the corresponding search skill/provider is enabled. Keep skill dispatch and authored content separate.
    - Keep existing code, calendar, document, sheet, email and other authoring formats working; do not create a second competing syntax for them.
  creation_and_identity:
    - Extend the explicit structured-content fence path with one versioned authoring envelope for a single item or batch; keep type-specific adapters behind this common dispatch.
    - Scope temporary item labels to the authored block. Resolve them to backend-assigned embed identities before emitting stored references or shared results views.
    - Preserve message position and stable identities across streaming, finalization, reload and sync. Bound record count/size, isolate independent item failures, and expose honest cancellation/validation states.
    - Persist ordinary typed records and existing presentation references; never fabricate an app_skill_use parent or a discovery provider result.
    - Carry sources, draft state, observation context and missing values explicitly. Media-resource cards require actual accessible resources and existing safe/encrypted delivery paths.
  presentation_and_actions:
    - Register direct authored records with existing preview/fullscreen resolvers. Adapt their inputs where they currently assume a search parent or provider response.
    - Reuse normal card grouping and the shared results view for compatible mixed types; use real resolved item IDs for selection, opening and follow-up reuse.
    - Derive maps from known coordinates/geometry and preserve approximate listing areas. Keep unmappable items in the list and label endpoint-only route connectors as schematic.
    - Pass each record's actual embed ID and asset dependencies through existing sharing controls; use existing permissions and encrypted share transport, with no automatic publication.
    - Reuse valid event calendar export and each type's existing explicit actions. Do not show working actions when their required facts or resources are missing.
  client_integration:
    - Keep reusable headless operations in the shared Rust core, with thin web/platform adapters and synchronized Rust/npm/Python SDK protocol fixtures.
    - Coordinate with the active native-client migration rather than borrowing its workspace or building a second client core. This baseline contains the Rust prototype but not the completed native core; resolve the current owning crate before client implementation.
    - The server-side authoring and contract fixtures can progress while that coordination is resolved; no client parity is claimed from generic JSON passthrough or mocks alone.

