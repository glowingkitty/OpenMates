schema_version: 2
profile: concise
id: cloud-project-commands
title: Terminal commands for cloud Projects in a per-Project E2B workspace
status: implementing
goal: >-
  Make the whole agentic coding workflow work end to end on cloud Projects
  (hosted Projects with no connected machine, code runs in E2B): a Project
  created by the assistant, Specification, Checks, Plan, code and file edits,
  terminal command execution (installs, builds, tests, dev server), the
  preview, the test recording and the commit. Proven in the dev web app with a
  Playwright video on the personal dev test account.

