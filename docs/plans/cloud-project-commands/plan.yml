    - id: V-2
      required: true
      proof: Rust crate tests for apply_changes (ordered writes, stale base, size refusals) in rust-check.
    - id: V-3
      required: true
      proof: Real-inference cloud flow through the Rust CLI on dev, then the web E2E with a Playwright video on the personal dev test account (laptop size).
