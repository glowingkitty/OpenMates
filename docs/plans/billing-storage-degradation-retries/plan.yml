decisions:
  - id: D-1
    status: active
    decision: Classify failures from the configured Hetzner endpoint by response category rather than querying an external status page.
    reason: The worker must remain deterministic, and an observed timeout, connection error, throttling response, or 5xx response is sufficient to classify the upload dependency as degraded for this operation.
    decided_at: "2026-08-25"
  - id: D-2
    status: active
    decision: Retry the existing invoice task rather than payment processing.
    reason: Payment settlement already completes before invoice-task dispatch, so invoice retries cannot grant credits again.
    decided_at: "2026-08-25"

scenarios:
  - id: S-1
    title: Hetzner transiently rejects an invoice upload
    given:
      - A paid order is settled and its credits are granted.
      - Hetzner Object Storage times out, cannot be reached, throttles the request, or returns a 5xx response.
    when:
      - The invoice worker exhausts its immediate upload attempts.
    then:
      - The billing alert identifies Hetzner Object Storage as the degraded external dependency.
      - The alert reports the current retry state without exposing private billing data or secrets.
      - The invoice task retries after 10 minutes without repeating payment settlement.
  - id: S-2
    title: Hetzner recovers within the retry window
    given:
      - A transient upload failure has scheduled an invoice retry.
    when:
      - A later attempt uploads the encrypted invoice successfully within 24 hours.
    then:
      - The invoice row and purchase-confirmation email complete through the existing path.
      - No additional credits or payment settlement are created.
  - id: S-3
    title: Hetzner remains degraded for 24 hours
    given:
      - Every retryable invoice upload attempt fails throughout the retry window.
    when:
      - The final retry is exhausted.
    then:
      - No further automatic retries are scheduled.
      - A final sanitized admin alert identifies Hetzner Object Storage and states that retries are exhausted and intervention is required.
      - The paid order and granted credits remain completed.
  - id: S-4
    title: Storage credentials or configuration are invalid
    given:
      - An invoice upload fails because of authentication, permission, bucket configuration, or a malformed request.
    when:
      - The invoice worker classifies the failure.
    then:
      - The alert identifies an internal storage configuration failure rather than provider degradation.
      - The 24-hour degradation retry loop is not scheduled.
      - The paid order and granted credits remain completed.

