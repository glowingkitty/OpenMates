clarification:
  rounds:
    - question: How long should transient Hetzner invoice-upload retries continue?
      answer: Retry every 10 minutes for 24 hours, then send a final actionable alert.
    - question: Should only transient Hetzner failures be labeled as provider degradation?
      answer: Yes; credentials, permissions, bucket configuration, and malformed requests remain internal configuration failures.
    - question: Should these details attach to the existing billing contract?
      answer: Yes; extend the existing approved billing contract instead of creating a new bundle.
  vision_summary: Completed payments and granted credits remain final while transient Hetzner invoice uploads retry on a bounded schedule with explicit external-provider alerts; internal storage configuration failures remain separate and non-retryable.
  approved_by_user: true

