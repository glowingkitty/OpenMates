assumptions:
  - id: A-1
    text: Invoice-task retries cannot repeat purchase settlement or credit granting.
    category: billing
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/routes/payments.py
        summary: The webhook completes purchase settlement and grants credits before queueing process_invoice_and_send_email; the invoice task has no settlement or credit mutation call.
  - id: A-2
    text: Celery retry count can enforce a 24-hour fixed-delay retry window without adding a new scheduler or persistence model.
    category: reliability
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
        summary: The bound Celery task already uses self.retry with explicit countdown and max_retries for invoice-row failures.

contracts:
  api:
    access_model: internal-only
    auth: Existing payment-provider webhook and internal Celery queue boundaries remain unchanged; no route is added or changed.
    rate_limits: No endpoint change; worker retries are bounded to one attempt every 10 minutes for at most 24 hours per affected invoice task.
    credit_budget: No OpenMates credits or AI/provider budget is consumed by retries, and purchase credits are never granted again.
    encryption_boundary: Only the existing locally encrypted invoice payload is uploaded; alerts exclude PDF bytes, encryption keys, Vault values, user email, and unsanitized provider responses.
  failure_classification:
    external_provider_degraded: [connection_failure, timeout, throttling, http_5xx]
    internal_storage_configuration: [authentication, permission, bucket_configuration, malformed_request]
  retry_policy:
    delay_seconds: 600
    window_hours: 24
    maximum_retries: 144
    target: invoice_processing_task_only
  privacy_security:
    - Preserve the existing hashed user identifier in admin alerts.
    - Do not include object-storage credentials, signed URLs, object keys, PDF bytes, decrypted email, or raw provider response bodies in alerts.

