implementation_notes:
  plan_path: docs/plans/billing-storage-degradation-retries/plan.yml
  architecture: Preserve typed S3 upload failure metadata at the service boundary, classify only transient Hetzner failures as retryable, and let the existing bound invoice Celery task own the fixed-delay retry and retry-aware admin notification lifecycle.
  existing_patterns:
    - S3UploadService already centralizes Hetzner upload error handling and immediate retries.
    - process_invoice_and_send_email already uses bound Celery self.retry for a narrow invoice persistence failure.
    - _notify_billing_processing_error already sanitizes operational context and keeps alert failures from masking billing errors.
  data_flow:
    - Payment webhook completes purchase settlement and queues invoice processing.
    - S3UploadService classifies any terminal upload failure while preserving a sanitized provider failure category.
    - The invoice worker sends a retry-aware alert and schedules only transient degradation failures after 600 seconds.
    - A successful retry proceeds through Directus invoice persistence and email delivery; an exhausted retry emits one final actionable alert.
  affected_files:
    - {path: backend/core/api/app/services/s3/service.py, reason: Preserve typed Hetzner upload failure classification.}
    - {path: backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py, reason: Add bounded retry policy and retry-aware alerts.}
    - {path: backend/tests/test_billing_admin_notifications.py, reason: Cover classification, retry scheduling, exhaustion, sanitization, and non-retryable failures.}
    - {path: backend/tests/test_billing_storage_degradation.py, reason: Prove typed Hetzner classification without requiring the Celery dependency.}
  verification_strategy:
    - Add focused failing tests before product code.
    - Implement the smallest typed exception and Celery retry changes.
    - Run the focused backend tests and existing billing settlement audit.
    - Run contract generation/validation and final spec verification.
  verification_order:
    - T-BILLING-STORAGE-RETRY red phase.
    - Typed storage classification and invoice retry implementation.
    - T-BILLING-STORAGE-RETRY and T-PAYMENT-ORDERING green phase.
    - Contract validation/generation and V-SPEC-VERIFY.

