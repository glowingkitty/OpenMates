goal: Ensure transient Hetzner Object Storage failures are explicitly diagnosed and retried without changing completed payment or credit settlement.

scope:
  in:
    - Preserve the original Hetzner failure category through the shared S3 upload service.
    - Distinguish transient provider degradation from internal storage configuration failures.
    - Retry invoice processing every 10 minutes for up to 24 hours only for transient provider degradation.
    - Include provider, failure classification, retry schedule, attempt state, and exhaustion state in sanitized billing admin alerts.
    - Resume invoice persistence and purchase-confirmation delivery after storage recovers.
  out:
    - Retrying payment settlement or granting credits again.
    - New public, first-party, CLI, SDK, web, or Apple billing surfaces.
    - A live dependency on a Hetzner status-page API.
    - Retrying credential, permission, bucket-configuration, or malformed-request failures as provider degradation.

context_discovery:
  github_issues:
