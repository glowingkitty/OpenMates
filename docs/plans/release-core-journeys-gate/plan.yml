    note: Commit 68a58479d passed settings-buy-credits-stripe-managed.spec.ts in GitHub run 31200277877 and signup-flow-stripe-managed.spec.ts in run 31201187564. Live overlay attestation reported payment_enabled=true with dedicated task-worker email and core-worker persistence queue ownership.

handoff:
  current_task_id: TASK-4
  next_action: Prepare the latest clean dev SHA, rerun the core journeys bootstrap, and record green evidence before enabling a main-only required check.
  command: python3 scripts/prepare_release_candidate.py --session <SESSION_ID> --expected-commit <FULL_DEV_SHA> && python3 scripts/tests.py run --core-journeys --gate-deploy --expected-commit <FULL_DEV_SHA> --max-concurrent 4 --no-fail-fast
  expected_outcome: Exact Vercel, hosted billing, backend services, core availability, and every signup and billing journey pass for one SHA.
  blocker:
    task_id: TASK-4
    requires_user_input: true
    reason: The shared dev host currently has uncommitted backend runtime files from active Team/Project work, and release preparation correctly fails closed.
    question: Before tomorrow's promotion, can the operator ensure backend runtime paths are clean and run the documented preparation plus bootstrap commands for the then-current dev SHA?
    next_action: Rerun the handoff command during a clean release window.
  last_verified_commit: 03276b929f0d0fa32e17a52f234be7a91ae02d86

scenarios:
  - id: S-1
    title: Attested release candidate passes every core journey
    given:
      - A dev-to-main PR or manual bootstrap identifies an exact dev commit.
      - Vercel is Ready and backend preparation succeeded for that commit.
    when:
      - GitHub runs the canonical core suite.
    then:
      - Every spec checks out the exact commit.
      - All specs run even if one fails.
      - The aggregate gate succeeds only when every prerequisite succeeds.
  - id: S-2
    title: Core failure blocks promotion
    given:
      - Deployment provenance is valid.
    when:
      - Reachability, chat, any signup spec, or any billing spec fails.
    then:
      - Diagnostic artifacts are preserved.
      - The remaining core specs complete.
      - The aggregate gate fails.
  - id: S-3
    title: Missing backend preparation fails closed
    given:
      - The exact commit lacks a successful backend release-candidate status.
    when:
      - Deployment readiness runs.
    then:
      - Browser journeys do not start.
      - The aggregate gate fails with preparation instructions.
  - id: S-4
    title: Superseded runs do not collide on shared accounts
    given:
      - A release workflow is active.
    when:
      - A newer dev commit starts another run.
    then:
      - The old release run is cancelled.
      - Every single-spec workflow invocation serializes by account slot.
  - id: S-5
    title: Initial workflow reaches main safely
    given:
      - Main does not contain the release workflow yet.
    when:
      - The first promotion is prepared.
    then:
      - An operator runs the canonical suite through scripts/tests.py for the exact commit.
      - Automation does not create or merge the PR.
      - Required-check enforcement remains deferred until advisory proof exists.

