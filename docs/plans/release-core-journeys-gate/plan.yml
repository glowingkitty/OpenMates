implementation_notes:
  plan_path: docs/plans/release-core-journeys-gate/plan.yml
  existing_patterns:
    - scripts/run_tests.py owns the short hourly suite and one-workflow-per-spec dispatch.
    - playwright-spec.yml already supports checkout refs and failure artifacts.
    - sessions.py already provides the Docker lock.
  architecture: >
    Emit a matrix from one Python suite definition, call an exact-SHA reusable
    Playwright workflow, and aggregate results in a main-targeting workflow. A
    dev-host command prepares Docker services and publishes a named GitHub status;
    GitHub reads but cannot create that attestation.
  data_flow:
    - Dev host prepares services and publishes backend status on the exact SHA.
    - Release CI validates source, Vercel, endpoint reachability, and backend status.
    - CI runs one reusable Playwright job per canonical spec and account.
    - An always-run aggregate job emits the stable gate conclusion.
  affected_files:
    - {path: scripts/run_tests.py, reason: Canonical suite and matrix output.}
    - {path: scripts/tests.py, reason: Commit-pinned bootstrap suite classification.}
    - {path: .github/workflows/playwright-spec.yml, reason: Reusable exact-SHA runner and account serialization.}
    - {path: .github/workflows/release-core-journeys.yml, reason: Release orchestration and aggregate gate.}
    - {path: scripts/prepare_release_candidate.py, reason: Docker preparation and commit status.}
    - {path: scripts/tests/test_release_core_journeys_gate.py, reason: Deterministic contract tests.}
    - {path: frontend/apps/web_app/tests/dev-smoke/README.md, reason: Correct suite and operations docs.}
    - {path: docs/architecture/test-orchestration.md, reason: CI evidence architecture.}
    - {path: docs/contributing/guides/git-and-deployment.md, reason: Bootstrap and rollout instructions.}
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/release-core-journeys-gate/plan.yml
    - python3 -m pytest scripts/tests/test_release_core_journeys_gate.py -q
    - Run the focused lint command in T-LINT-CORE-GATE.
    - Prepare and attest the committed dev SHA.
    - Manually dispatch the advisory workflow from dev and inspect all results.
    - Confirm no dev-to-main PR exists and rules remain unchanged.
  verification_order:
    - Unit and workflow contract tests.
    - Focused lint and spec validation.
    - Dev-host backend attestation.
    - Manual advisory GitHub workflow.
    - Repository state check.

