decisions:
- id: D-1
  status: active
  decision: Require proof videos for new feature implementations, new hardcoded example chats, and failed-to-green E2E debug
    sessions, with explicit non-visual not-applicable records where appropriate.
  reason: This preserves useful evidence for substantial visible work without imposing video cost on every user-visible bug fix
    or mechanical task.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-2
  status: active
  decision: Store narration intent as bullets before implementation and generate exact timestamped captions only from the
    final green behavior.
  reason: Early bullets protect product intent while late exact wording avoids stale narration that describes an implementation
    which changed during development.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-3
  status: superseded
  decision: Require both burned-in captions and ElevenLabs eleven_flash_v2_5 narration audio for every proof video.
  reason: Captions provide deterministic, accessible, machine-reviewable text, while the audio track makes the proof video
    self-contained for human review and Discord delivery.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-4
  status: active
  decision: Use real Playwright and terminal recordings as evidence sources; label any exact terminal reconstruction and never
    let it replace raw verification evidence.
  reason: Demonstrations must remain truthful while allowing readable terminal composition when direct capture is impractical.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-5
  status: active
  decision: Permit at most three classified automatic review-repair attempts before requiring user input.
  reason: Bounded retries preserve autonomy without creating an unbounded render and multimodal-review loop.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-6
  status: active
  decision: Let reviewed proof-video evidence and confirmed Discord delivery gate completion whenever the Discord destination is configured.
  reason: The user explicitly made Discord delivery part of the completion contract for configured proof-video destinations.
  decided_at: '2026-08-06T00:00:00Z'
- id: D-7
  status: active
  decision: Keep the full video out of agent context and review a default three-second frame interval plus event-driven frames,
    with bounded on-demand extraction at specific timestamps.
  reason: Frame bundles provide sufficient visual evidence at substantially lower context cost while preserving a targeted
    path to inspect uncertain moments.
  decided_at: '2026-08-06T01:12:50Z'
- id: D-8
  status: superseded
  decision: Use local FFmpeg and ffprobe for caption composition and frame extraction, plus a stdlib pseudo-terminal recorder
    for exact CLI events; use local Tesseract OCR for complete-frame text privacy scanning.
  reason: FFmpeg and ffprobe are already installed, pseudo-terminal capture needs no new runtime service, and local OCR keeps
    full video frames out of remote model context.
  decided_at: '2026-08-06T01:12:50Z'
- id: D-9
  status: active
  decision: Use the active OpenCode agent as the reviewer through local frame attachments and structured review evidence rather
    than adding a separate multimodal review API.
  reason: The user explicitly requested frame-based agent review, and avoiding a second provider keeps the first slice smaller
    and prevents full-video upload.
  decided_at: '2026-08-06T01:12:50Z'
- id: D-10
  status: active
  decision: Retain transcripts, captions, manifests, hashes, and review results; delete generated video after confirmed
    Discord delivery or after 24 hours if delivery remains unsuccessful.
  reason: The user wants the transcript retained but does not want video files accumulating on disk.
  decided_at: '2026-08-06T01:12:50Z'
- id: D-11
  status: superseded
  decision: Expose CLI proof production, frame review, and dev-smoke publication through sessions.py; preserve exact CLI input and output unless the canonical scanner replaces detected sensitive values with conspicuous typed placeholders.
  reason: Superseded by D-18; proof videos no longer run proof-specific PII/sensitive-data detection or replacement.
  decided_at: '2026-08-06T04:20:00Z'
- id: D-12
  status: superseded
  decision: Remove OCR and decoded-frame privacy scanning; scan command arguments, transcripts, captions, metadata, filenames, and publication text with the canonical scanner instead.
  reason: Superseded by D-18; proof videos no longer run proof-specific PII/sensitive-data detection or replacement.
  decided_at: '2026-08-06T09:20:00Z'
- id: D-13
  status: active
  decision: CLI demonstrations use a readable 1280x720 terminal tutorial composition with large text, visible command typing, captured output timing, only command/output in the terminal, and narration that explains the feature and visible evidence.
  reason: User review found the static 1920x1080 snapshot too small, too brief, and insufficiently instructional to validate obvious visual mismatches.
  decided_at: '2026-08-06T10:00:00Z'
- id: D-14
  status: active
  decision: Provide a reusable create-demo-video skill and a sessions.py produce-playwright action that accepts only passing deployed Playwright case recordings.
  reason: The user wants repeatable narrated examples for both CLI interactions and product feature specs without re-deriving the evidence, review, and Discord workflow.
  decided_at: '2026-08-06T10:30:00Z'
- id: D-15
  status: active
  decision: Proof videos use declared device profiles with exact output dimensions, no black bars, realistic visible-state narration, optional retiming or end-state holds, and quiet product-audio mixing when playback is part of the claim.
  reason: Mobile and iPad proofs must not be hidden inside landscape wrappers, and reviewers need concrete narration plus readable timing to catch mismatches instead of accepting generic success videos.
  decided_at: '2026-08-12T00:00:00Z'
- id: D-16
  status: active
  decision: Keep proof-video pixels free of tutorial captions and any caption-reserved scaling; publish canonical WebVTT as a hash-bound player track that defaults on and can be disabled.
  reason: Burned-in captions obscured product evidence and caused the renderer to reduce usable video area. A sidecar preserves accessibility while allowing clean full-frame inspection and viewer control.
  decided_at: '2026-08-15T00:00:00Z'
- id: D-17
  status: active
  decision: Every proof assertion and caption cue declares the exact device profiles where it applies, and each device review receives only its applicable claims and text.
  reason: Applying every assertion to every device incorrectly required laptop recordings to prove phone-only behavior and vice versa.
  decided_at: '2026-08-15T00:00:00Z'
- id: D-18
  status: active
  decision: Do not run proof-video-specific PII or sensitive-data detection, anonymization, replacement, or publication scans; review captured proof media and approved captions as-is.
  reason: The user confirmed this workflow added latency, token cost, and agent cycles without enough proof-review value.
  decided_at: '2026-08-15T13:05:00Z'
