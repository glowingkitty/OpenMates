    reason: Provide the focused capture, caption, render, review-bundle, proof-privacy state, retry, and publication orchestration entry
      point.
  - path: scripts/discord_webhook.py
    reason: Extract the existing multipart webhook request logic into a small reusable helper with wait-for-confirmation support
      and structured results.
  - path: scripts/audit_opencode_spec_workflow.py
    reason: Deterministically audit demonstration workflow wiring and mirrored skills.
  - path: scripts/tests/test_spec_demonstration_workflow.py
    reason: Test eligibility, schema, verifier completion, retries, audio, and configured Discord delivery.
  - path: scripts/tests/test_spec_demonstration_pipeline.py
    reason: Test exact Playwright and pseudo-terminal provenance, captions, reconstruction labels, hashes, and proof-privacy state.
  - path: scripts/tests/test_spec_demonstration_review.py
    reason: Test frame selection, claim verdicts, mismatch classification, and evidence invalidation routing.
  - path: scripts/tests/test_spec_demonstration_discord.py
    reason: Test attachment/link publication, delivered gating, and retryable failures.
  - path: scripts/tests/test_opencode_spec_workflow_audit.py
    reason: Test workflow instructions, Plan Mode prompt, completion gates, and skill parity.
  verification_strategy:
  - Run python3 scripts/plan_validate.py docs/plans/narrated-spec-demonstration-videos/plan.yml after every spec edit.
  - Write and run the listed pytest red phases before workflow implementation.
  - Run python3 scripts/sync_agent_parity.py after canonical skill edits and verify with --check.
  - Run python3 scripts/audit_opencode_spec_workflow.py and the focused demonstration workflow tests.
  - Produce and review one real deployed Playwright demonstration and one real pseudo-terminal demonstration using synthetic
    data.
  - Run a fixture confirming proof-video privacy status is not_applicable without proof-specific detection or replacement.
  - Exercise one Discord delivery when configured; keep completion blocked with publication_pending until delivered.
  - Verify delivered cleanup removes only generated video and frames while retaining transcripts and manifests;
    verify failed delivery deletes video at the 24-hour boundary.
  - Run python3 scripts/plan_verify.py docs/plans/narrated-spec-demonstration-videos/plan.yml only after all required evidence
    is recorded.
  verification_order:
  - Validate the approved spec and implementation plan.
  - Add red schema, verifier, pipeline, review, Discord, and workflow-audit tests.
  - Implement manifest validation and completion enforcement.
  - Implement real Playwright and pseudo-terminal capture plus caption rendering.
  - Implement review bundles, classification, bounded retries, and not_applicable proof privacy state.
  - Implement Discord publication and retry state independently of completion.
  - Synchronize agent skill mirrors and run deterministic audits.
  - Run real Playwright and CLI demonstration artifact reviews and optional configured Discord
    delivery.
  - No product REST/API, SDK, web UI, user-confirmation, or Apple phase is required for this repo-local first slice.
  required_assumption_checks:
  - A-1 is proven by the existing Playwright config and recording publisher and rechecked by a manifest fixture with run and
    commit provenance.
  - A-2 is proven by existing multipart Discord code and rechecked after extraction into scripts/discord_webhook.py.
  - A-3 runs `python3 scripts/spec_demo.py doctor` before any non-synthetic video review.
  - A-4 is enforced by review-request fixtures that reject video bytes, encoded video, and full-video attachments while permitting
    bounded local frame paths.
  - A-5 keeps product/API/SDK/Apple files outside task ownership and verification scope.
  - A-6 is enforced by cleanup clock fixtures for delivered and 24-hour undelivered videos.
  acceptance_criteria_mapping:
  - AC-1 and AC-2 map to T-DEMO-SCHEMA and T-DEMO-VERIFY.
  - AC-3 maps to T-DEMO-PIPELINE and V-PLAYWRIGHT-DEMO.
  - AC-4 maps to T-DEMO-PIPELINE and V-CLI-DEMO.
  - AC-5 and AC-6 map to T-DEMO-PIPELINE plus both real artifact reviews.
  - AC-7, AC-8, and AC-9 map to T-DEMO-REVIEW, T-DEMO-VERIFY, V-PLAYWRIGHT-DEMO, and V-CLI-DEMO.
  - AC-10 maps to T-DEMO-PIPELINE and V-PRIVACY-REVIEW as a not_applicable proof-privacy state check.
  - AC-11 and AC-12 map to T-DEMO-DISCORD, T-DEMO-VERIFY, and required live V-DISCORD-DELIVERY evidence when configured.
  - AC-13 maps to T-OPENCODE-WORKFLOW and agent parity sync evidence.
  approval_boundary:
  - Product-contract approval is already recorded.
  - The user explicitly approved frame-only review, ElevenLabs audio, retained transcripts, deletion after confirmed Discord
    delivery, and deletion after 24 hours of failed delivery.
  - FFmpeg, stdlib PTY capture, and reuse of existing Discord patterns are minimal implementation
    choices and introduce no additional material approval gate.
  open_questions:
  - After this workflow is implemented and tested, discuss user-facing OpenMates Plans persistence, playback, and status integration.
  - If ElevenLabs cost, latency, or policy changes materially, evaluate a pinned self-hosted official Kokoro-82M runtime;
    never use kokorottsai.com for proof-video narration.
