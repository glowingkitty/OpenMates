implementation_notes:
  plan_path: docs/plans/narrated-spec-demonstration-videos/plan.yml
  first_slice: 'Add failing contract and renderer tests that prove each device receives only applicable claims and cues, clean video retains exact profile dimensions and full frame area, and publication emits a hash-bound WebVTT track.

    '
  existing_patterns:
  - scripts/plan_validate.py and scripts/plan_verify.py enforce Schema V2 structure and completion evidence.
  - scripts/run_tests.py downloads Playwright videos, screenshots, step logs, and metadata and already supports Discord multipart
    attachments.
  - frontend/apps/web_app/playwright.config.ts records every deployed Playwright run by default.
  - scripts/audit_opencode_spec_workflow.py audits OpenCode Plan Mode, canonical skills, generated mirrors, and workflow instructions.
  - frontend/packages/secret-scanner remains product tooling and is not part of proof-video capture, render, review, or publication.
  - test-results is gitignored and existing Playwright recording bundles already use run IDs, commit SHAs, videos, screenshots,
    and manifest metadata.
  - The external create-video skill separates polished marketing production from product verification recordings.
  architecture: 'Keep scripts/spec_demo.py as the repository-local orchestration CLI around a versioned JSON manifest in test-results/spec-demos/<spec>/<run-id>/.
    Use ffmpeg/ffprobe subprocesses for media metadata, full-frame retiming, terminal rendering, compression, and clean frame extraction;
    generate canonical WebVTT as a separate hash-bound artifact; filter approved assertions and cues by exact device profile;
    use a Python stdlib PTY recorder for exact argv/output/timing/exit events; record proof-video privacy as not_applicable without
    scanning or replacing captured proof text before creating the bounded frame bundle read by the active OpenCode agent. The agent records structured claim verdicts through the CLI. Discord publication reuses
    a small shared webhook helper extracted from run_tests.py. Raw test artifacts remain immutable, generated videos are deleted
    after confirmed delivery or 24 hours, and text evidence remains.

    '
  boundaries:
  - No product backend, REST API, SDK, web UI, Apple app, Directus collection, or encrypted user-data contract changes.
  - No generated video bytes or full-video path is passed to the agent or a multimodal API.
  - No external marketing Remotion workspace or E2B Remotion renderer is used for engineering evidence.
  - No shell interpolation is used for CLI capture; the PTY recorder launches an explicit argv list and records combined terminal
    events.
  - No implementation video is committed to git; only the YAML ledger stores hashes, run IDs, statuses, and references.
  data_flow:
  - A spec records `NARR-1` with purpose `Show persisted completion`, expected proof `checked item after reload`, and link
    `AC-5`; exact caption text remains empty during implementation.
  - Existing tests pass for subject commit `abc1234`; the browser adapter resolves run `30999`, target `app.dev.openmates.org`,
    deployment `abc1234`, and the matching WebM hash without copying or modifying the source bundle.
  - For CLI evidence, the PTY adapter runs argv such as `[openmates, plans, show, demo-plan, --json]`, records timestamped
    input/output events and exit code 0, strips ANSI control sequences for the transcript, and hashes both event
    and transcript artifacts.
  - The post-green caption step writes an exact WebVTT cue such as `After reload, the first item remains complete.` from 12.4
    to 17.1 seconds and links it to `NARR-1`, `AC-5`, the matching evidence interval, and applicable device profiles.
  - FFmpeg retimes the browser video without scale, crop, overlay, border, or padding filters; terminal state events remain content on a fixed DejaVu Sans Mono canvas. ffprobe records duration, dimensions, codecs, and final SHA-256.
  - The proof-video privacy state is recorded as not_applicable without scanning or replacing captured proof text.
  - The review-bundle builder extracts default three-second frames plus scene, action, caption-boundary, and before-after
    frames. The active agent reads only those images and may request a bounded exact timestamp such as 14.8 seconds.
  - The agent records supported, contradicted, not_visible, ambiguous, or wrong_time for each claim and one defect class for
    each failure. One initial review plus three classified repair retries are allowed.
  - spec_verify accepts completion only after the current-commit privacy state and review records are finalized, or after a valid pre-implementation
    non-visual not-applicable classification.
  - Discord publication uses `wait=true`, records the returned message and attachment identifiers without the webhook URL,
    then deletes generated MP4/WebM files after confirmed delivery. Failed delivery retries for 24 hours, then deletes video
    while retaining transcripts, captions, manifest, hashes, review result, and publication failure.
  artifact_contract:
  - Root: test-results/spec-demos/<spec-or-plan-slug>/<run-id>/ with owner-only directory and file permissions.
  - manifest.json is versioned and stores eligibility, subject commit, source evidence, narration outline, caption segments,
    artifact hashes, privacy state, frame index, review attempts, publication state, and deletion timestamps.
  - transcript.txt, captions.vtt, review.json, and publication.json are retained text artifacts;
    raw PTY event logs stay private and are deleted after the transcript is written.
  - demo.mp4 or demo.webm and extracted frame files are disposable; frames are deleted after review and video is deleted after
    confirmed Discord delivery or the 24-hour undelivered limit.
  - Browser source recordings remain governed by the existing Playwright artifact and test-recording retention rather than
    being duplicated into the spec-demo directory.
  privacy_security_impact:
  - Proof-video-specific PII and sensitive-data scanning is disabled; manifests record privacy status as not_applicable.
  - The canonical secret-scanner patterns remain product tooling and are not called by proof-video capture, review, or publication.
  - Environment values, webhook URLs, raw Discord response bodies, login/setup flows, and unrelated terminal events never
    enter retained manifests or agent context.
  - The active OpenCode session sees approved captions and selected image frames only; it never receives the complete video.
  - Cleanup is idempotent and hash-aware so it cannot delete the original Playwright artifact or files outside the manifest-owned
    run directory.
  migration_rollout:
  - Add proof-video fields as optional for parsing while already-completed historical specs remain loadable.
  - Require passed audio, review, and configured Discord delivery in spec/session completion gates for newly eligible work.
  - Apply the feature, example-chat, and failed-to-green E2E gates through planning/session instructions rather than backfilling
    historical inline plans.
  - Roll out in fixture mode first, then one synthetic CLI proof, then one real deployed Playwright proof, and only then enable
    completion enforcement by default.
  observability:
  - Every spec_demo command prints one structured JSON result with manifest path, stage, status, run ID, subject commit, and
    next action.
  - Manifest attempts record stage duration, source and output hashes, frame counts, retry count, defect class,
    and deletion timestamps without text bodies or private values.
  - Publication records `not_configured`, `pending`, `delivered`, `publication_pending`, or `expired_deleted`; only delivered
    includes Discord message and attachment IDs.
  - The doctor command reports missing ffmpeg, ffprobe, font, and webhook configuration
    without printing paths containing credentials or secret values.
  affected_files:
  - path: docs/contributing/guides/spec-driven-development.md
    reason: Define demonstration eligibility, narration-outline timing, post-green rendering, review, retry, and completion
      ordering.
  - path: docs/contributing/guides/planning.md
    reason: Require eligible feature, example-chat, and failed-to-green E2E work to declare narration bullets and expected proof.
  - path: docs/contributing/guides/agent-workflow-core.md
    reason: Add concise final demonstration and Discord evidence guidance to the active OpenCode workflow.
  - path: .claude/rules/testing.md
    reason: Define Playwright and CLI recording provenance and keep demonstration editing separate from verification evidence.
  - path: .claude/rules/session-lifecycle.md
