schema_version: 2
id: narrated-spec-demonstration-videos
title: Strict Narrated Proof Videos For OpenCode Work
status: implementing
goal: 'Make completed OpenCode implementation work visibly understandable by requiring planned narration points, real execution
  recordings, optional narration audio, canonical player-toggleable captions, and an AI-reviewed proof video before eligible specs
  or plans are considered complete, then publish the reviewed result to Discord when a destination is configured.

  '
scope:
  in:
  - Require every new feature implementation to produce a reviewed proof video when it changes product-observable behavior.
  - Require every new hardcoded example chat to produce reviewed phone and laptop proof videos.
  - Require every nightly, daily, or CI failed Playwright E2E that is actively debugged in a chat and turns green to produce
    a reviewed proof video.
  - Define narration bullets during specification or planning, but write exact narration and captions only after the implementation's
    normal tests are green.
  - Reuse real deployed Playwright recordings for browser flows and real pseudo-terminal command/output capture for CLI flows.
  - Permit a Remotion terminal reconstruction only when direct recording is impractical, the displayed input/output exactly
    matches a real transcript, and the video labels the segment as reconstructed.
  - Generate ElevenLabs narration audio with the fast, low-cost eleven_flash_v2_5 model and render that audio track into
    every final video.
  - Generate canonical timestamped WebVTT captions as a hash-bound sidecar without shrinking or obscuring the video frame.
  - Scope every assertion and caption cue to the device profiles where it applies.
  - Reuse the same narration transcript and ElevenLabs audio across viewport recordings unless the narration must change.
  - Keep web/spec/example-chat proof as separate phone and laptop videos, Apple proof as separate iPhone portrait and iPad
    landscape videos, and CLI proof as one terminal video.
  - 'Render each proof-video surface at its exact device-profile dimensions: phone web 390x844, laptop web 1440x900,
    iPhone portrait 393x852, iPad landscape 1366x1024, and CLI terminal 1280x720.'
  - Reject black bars, letterboxing, pillarboxing, and generic 16:9 or 16:10 wrapper canvases around phone, iPad, or web
    recordings.
  - Require exact narration to describe specific visible UI, terminal output, controls, playback state, messages, or reversible
    actions; generic success narration is not accepted.
  - Support source retiming, final-frame holds, and quiet product-audio mixing when a real recording moves too quickly or audio
    playback is itself part of the claim.
  - Review the finished video indirectly using the full device-applicable narration transcript, synchronized captions, clean sampled frames at the
    default three-second cadence plus exact requested timestamps, recording metadata, and linked acceptance criteria without
    placing the full video in model context.
  - Classify review failures as implementation, test coverage, recording, narration, composition, or environment defects and
    return to the responsible stage.
  - Retry failed demonstration review automatically at most three times before recording a structured user-input blocker.
  - Prevent eligible session/spec completion until required proof-video review passes and caption plus optional-audio provenance is recorded;
    only the approved non-visual not-applicable classification may bypass video production.
  - Post the reviewed video and implementation summary to Discord when a webhook is configured, and treat confirmed
    Discord delivery as a hard completion gate for configured destinations.
  - Add deterministic workflow audits, fixtures, and proof-privacy state checks for the demonstration contract and completion gate.
  out:
  - User-facing OpenMates Plans product persistence, API, playback UI, or status expansion.
  - Marketing videos, release trailers, polished promotional editing, or changes to the external openmates-marketing Remotion
    workflow.
  - Self-hosted Kokoro-82M text-to-speech; ElevenLabs is the required proof-video narration provider for this workflow.
  - Requiring videos for Tier 0 work, non-visual work, broad bug fixes without a failed-to-green E2E proof requirement, or
    legacy completed specs that are not materially resumed.
  - Treating reconstructed UI or terminal output as automated verification evidence.
  - Publishing raw test logs, credentials, user data, private URLs, reasoning traces, or unrelated terminal history to Discord.
