assumptions:
- id: A-1
  text: Passing Playwright runs already retain usable browser recordings and step artifacts for demonstration composition.
  category: evidence_source
  required_before: implementation
  status: confirmed
  evidence:
  - source: frontend/apps/web_app/playwright.config.ts
    summary: Playwright video mode defaults to on for every deployed spec run.
  - source: scripts/run_tests.py
    summary: The test artifact pipeline copies MP4 or WebM recordings, screenshots, step logs, and Playwright metadata into
      test-results/test-recordings.
- id: A-2
  text: Existing Discord multipart attachment and webhook configuration patterns can be reused without introducing a new external
    provider or embedding webhook secrets in evidence.
  category: publication
  required_before: implementation
  status: confirmed
  evidence:
  - source: scripts/run_tests.py
    summary: Existing stdlib multipart support posts attachments through environment-configured Discord webhooks.
- id: A-3
  text: A local deterministic media toolchain can render captions, extract review frames, and inspect media metadata without
    sending implementation recordings to a third-party rendering provider.
  category: media_tooling
  required_before: implementation
  status: confirmed
  evidence:
  - source: local tool discovery on 2026-08-06
    summary: FFmpeg and ffprobe 6.1.1 are installed with libass, fontconfig, and common MP4/WebM codecs; DejaVu Sans Mono
      is available for terminal rendering.
- id: A-4
  text: An explicitly approved multimodal reviewer can inspect only the bounded frame-and-caption bundle under documented
    authorization, retention, and no-training requirements without receiving raw private logs or the full recording.
  category: ai_review
  required_before: task_execution
  status: confirmed
  evidence:
  - source: user instruction on 2026-08-06
    summary: The active agent should receive periodic and targeted frames rather than the full video.
  - source: approved technical plan
    summary: Review is performed by the already-active OpenCode session through local image attachments; no separate review
      API or full-video upload is introduced.
- id: A-5
  text: No product REST API, CLI public API, npm SDK, pip SDK, web UI, or Apple product phase gate is required because this
    first slice changes repository-local developer tooling only.
  category: verification_scope
  required_before: implementation
  status: confirmed
  evidence:
  - source: user clarification
    summary: The user explicitly deferred the OpenMates Plans product expansion until after this workflow is implemented and
      tested.
- id: A-6
  text: Raw capture and reviewed-video storage locations have approved access controls, deletion behavior, and retention periods
    before any non-synthetic recording is processed.
  category: retention
  required_before: task_execution
  status: confirmed
  evidence:
  - source: user decisions on 2026-08-06
    summary: Keep transcripts, delete video after confirmed Discord delivery, and delete an undelivered video after
      24 hours.
  - source: .gitignore
    summary: test-results is excluded from git and is the established local evidence-artifact root.
contracts:
  eligibility:
  - New feature implementations require a proof-video contract when they change product-observable behavior.
  - New hardcoded example chats require separate phone and laptop proof videos.
  - Nightly, daily, or CI failed E2E tests actively debugged in a chat require proof video after they turn green.
  - Tier 0, non-visual work, and ordinary bug fixes without the failed-to-green E2E trigger are outside the mandatory gate.
  - Existing completed specs are not retroactively processed unless materially resumed.
  demonstration_manifest:
  - The manifest identifies spec or plan ID, subject commit, eligibility decision, narration bullets, source runs, segments,
    captions, ElevenLabs audio provenance, claim-to-acceptance-criterion mappings, raw and derived artifacts, review attempts,
    proof privacy state, and publication status.
  - Each narration bullet has a stable ID, purpose, expected proof, and linked scenario or acceptance criterion.
  - Each final caption segment has start and end timestamps, exact text, target device profiles, visible claims, linked acceptance criteria, and evidence interval references.
  - Each assertion has a non-empty target-device list that is a subset of the proof contract devices.
  - Artifact records include path or approved URL, media hash, source run ID, subject commit, creation timestamp, and whether
    the artifact is raw, edited, or reconstructed.
  - A Playwright source record includes test command or spec, deployed target, deployment reference, run ID, subject commit,
    artifact hash, and synthetic or approved test-account provenance.
  - A CLI source record includes exact command, target environment, run ID, subject commit when repository-backed, exit status,
    transcript hash, artifact hash, and synthetic or approved test-account provenance.
  capture:
  - Browser capture uses the passing deployed Playwright recording for the required subject commit.
  - CLI capture uses a real pseudo-terminal and records input, output, timing, and exit status before rendering.
  - Raw sensitive capture is short-lived and must not be committed, uploaded, or included in model review bundles.
  - A reconstructed terminal segment must match the transcript hash and carry a persistent visible reconstruction
    label.
  - Reconstructed output is demonstration material only and cannot satisfy a test or verification gate.
  captions:
  - Exact narration and captions are written only after existing required implementation gates are green.
  - Captions are the canonical text source and are published as WebVTT; ElevenLabs eleven_flash_v2_5 speech audio is optional.
  - Captions default to showing in the response-media player and remain viewer-toggleable.
  - Tutorial captions are never burned into video pixels and never reserve frame area through scaling, borders, or padding.
  - Each caption cue declares the device profiles where it applies and remains synchronized to the evidence it describes.
  - Claims cannot exceed what the linked acceptance criteria and visible evidence prove.
  review:
  - The review bundle contains final video metadata, captions, narration bullets, expected proof, acceptance-criterion links,
    raw run references, and bounded frames, but never the full video file or bytes.
  - Frame selection includes scene boundaries, action boundaries, caption boundaries, before and after state changes, and
    a default three-second periodic interval that may be configured to a shorter interval.
  - The reviewer may request bounded additional individual frames by exact timestamp; the local extractor returns only those
    frames and records each request in review evidence.
  - Each device review contains only device-applicable claims and complete device-applicable caption cues.
  - Claim verdicts are supported, contradicted, not_visible, ambiguous, or wrong_time.
  - Defect classes are implementation, test_coverage, recording, narration, composition, or environment.
  - Only implementation defects and material test-contract defects invalidate linked implementation evidence; all other defects
    return to their own stage.
  - One initial review plus at most three classified repair-and-review retries are allowed; a fourth unresolved result requires
    a structured user-input blocker.
  - Every failed result and retry records one approved defect class, the responsible return stage, and the affected claim
    IDs.
  - The reviewer receives only the bounded review bundle and must use an implementation-approved provider or local
    model with documented authorization, retention, and training-use policy.
  completion:
  - spec_verify rejects completion when a required demonstration is missing, stale for the subject commit,
    missing hash-bound captions, has invalid requested audio, is not review-passed, or is not delivered when publication is required.
  - A valid not-applicable classification satisfies the demonstration gate only for eligible non-visual work.
  - Visual browser, native, and CLI demonstrations have no general waiver path; only a valid pre-implementation non-visual
    not-applicable classification can satisfy the gate without video review.
  - Discord publication status cannot turn passed implementation or review evidence back to failed, but delivered status is
    required for configured proof-video completion.
  discord:
  - Use a dedicated configured webhook when available and fall back to the existing development notification webhook only
    when explicitly configured by repository policy.
  - Prefer direct video attachment within configured limits; otherwise use an approved access-controlled artifact URL rather
    than a public temporary marketing URL.
  - Message content includes spec or plan ID, subject commit, covered scenarios, review result, duration, and canonical
    evidence reference.
  - Webhook URLs and response bodies containing identifiers are never stored in spec evidence.
  - Confirm delivery through a wait-for-response webhook request before deleting generated video or ending configured proof-video
    work; a request write without a confirmed Discord message is not delivery evidence.
  - Retry failed delivery for at most 24 hours, then delete the undelivered video and record expired_deleted while retaining
    text evidence and hashes.
  privacy_security:
  - Do not intentionally capture or publish login, signup, verification codes, passkeys, credentials, account emails, unrelated
    chats, share URL keys, API keys, webhook URLs, private infrastructure identifiers, or agent reasoning.
  - Do not run proof-video-specific PII or sensitive-data detection, anonymization, replacement, or publication scans.
  - Use synthetic or approved test-account data and placeholders in demonstrations.
  - Keep raw recordings and transcripts out of git; specs store only metadata, hashes, run IDs, and artifact references.
  - Never send a raw or final full video to a multimodal provider or place it in agent context; only a bounded frame-and-caption
    review bundle may leave the local evidence store after the reviewer authorization and retention assumptions are confirmed.
  - Raw and derived artifacts use owner-only gitignored storage. Retain transcripts and manifests; delete generated
    video after confirmed Discord delivery or after 24 hours of unsuccessful delivery.
  - Proof-video privacy status is recorded as not_applicable because this workflow intentionally keeps captured proof evidence as-is.
  no_product_api_change:
  - No REST API or WebSocket endpoint is added or changed.
  - Endpoint access model, auth, rate limits, credit budgets, and encrypted-data boundaries are not applicable to this repo-local
    first slice.
