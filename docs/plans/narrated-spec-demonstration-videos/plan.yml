clarification:
  rounds:
  - question: Which completed work should require a narrated proof video?
    answer: Require it for new feature implementations, new hardcoded example chats, and actively debugged failed-to-green
      nightly, daily, or CI E2E work; allow explicit not-applicable evidence for non-visual work.
  - question: Should successful Discord delivery be required before work is considered complete?
    answer: Discord delivery is a hard completion gate when a destination is configured; a passed frame review alone is insufficient
      for configured destinations.
  - question: Should proof videos require captions, audio, or both?
    answer: Every proof video requires player-toggleable WebVTT captions; narration audio is optional.
  - question: How autonomous should the post-render mismatch loop be?
    answer: Classify the mismatch, repair the responsible stage, and retry up to three times before asking the user.
  - question: Should the user-facing OpenMates Plans product be included?
    answer: Focus on the OpenCode spec-driven development flow; discuss the Plans product expansion only after this workflow
      is implemented and tested.
  - question: Which work categories require proof videos now?
    answer: Require proof videos for every new feature implementation, every new hardcoded example chat, and every nightly,
      daily, or CI failed E2E that is actively debugged in a chat and turns green; do not require them for every user-visible
      bug fix by default.
  vision_summary: 'Eligible OpenCode work declares concise narration bullets before implementation, completes its normal test
    ladder, and then turns real execution evidence into a captioned demonstration video. A multimodal reviewer compares timestamped
    captions and expected proof with the rendered result, routes mismatches to the correct stage, and blocks completion until
    the review passes; Discord is the delivery destination, not the canonical evidence store.

    '
  approved_by_user: true
