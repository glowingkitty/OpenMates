risks:
- Video rendering and multimodal review can add material completion latency and compute cost; bounded retries and eligibility
  rules limit the impact.
- Recordings can expose credentials or private account content that text-only test evidence does not; proof-video-specific detection is disabled, so use controlled dev accounts and avoid sensitive screens during capture.
- Visual-only sensitive content in browser recordings is not scanned because decoded-frame OCR and proof-video text scanning were removed by explicit user decision to reduce calculation and latency.
- Fixed-interval frames can miss brief errors or state changes; action, scene, and caption-boundary sampling plus bounded
  exact-timestamp follow-up requests are required in addition to periodic frames.
- An AI reviewer may misclassify a video-production defect as an implementation defect; structured categories and evidence-invalidation
  rules must prevent unrelated code churn.
- Discord attachment limits and outages can disrupt delivery; publication state remains independent and retryable, and public
  temporary links are disallowed by default.
  - Caption wording can overclaim security, privacy, performance, or completeness; every factual claim must trace to acceptance
  criteria and visible evidence.
- Reusing the marketing video workflow would mix promotional conventions with engineering evidence and may create public artifacts;
  the engineering pipeline must remain separate.
