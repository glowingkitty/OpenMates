proposed_feature:
  identity:
    app_id: hosting
    skill_id: search_domains
    class_name: SearchDomainsSkill
    provider: Gandi
    no_gandi_api_key: true
    existing_state: Hosting has server icon and gradient tokens, but no registered app/skill directory
      or product Specification.
  input:
    requests:
      min_items: 1
      max_items: 5
      item_fields:
        id: Optional caller request ID.
        query: Required domain, short name or keyword; not an entire project brief.
        tlds: Optional suffix list, maximum five; enforce each requested suffix using exact lookups or
          single-TLD upstream searches.
        country: Optional ISO tax country; use a documented application/default context and return it
          explicitly.
        currency: Optional supported ISO currency; default EUR and never silently convert or ignore it.
        max_results: Optional integer; default 10, maximum 20.
        availability: prefer_available default; available_only explicit; all includes available and in-use.
        relevance_criteria: Optional natural-language requirements, trimmed and limited to 1000 characters.
  example_prompts:
  - Check whether cedarcomet.net is available and tell me its first-year and renewal prices.
  - Find .com and .net domains for the name cedarcomet, priced in EUR for Germany.
  - Find domain ideas around cedarcomet and show me which ones are premium.
  processing:
  - Canonicalize/validate IDNA domain labels and preserve a readable Unicode display value.
  - Explicit FQDN uses lookup; short name plus explicit TLDs prioritizes exact name+suffix lookups.
  - Name/keyword without explicit TLDs uses bounded suggestion SSE, joining status/pricing by canonical
    FQDN.
  - Preserve requested exact unavailable domains; do not treat missing price or provider error as no results.
  - Fetch at most 40 candidates, apply hard constraints, and optionally rank once with hosting_domains
    Jev; discard applied scores below 1 and preserve safe fallback ordering on evaluator failure.
  - Select at most max_results from confirmed available/in-use candidates; retain matching checked_results
    for local encrypted child filtering and report unknown checks as diagnostics.
  normalized_output:
    wrapper: Grouped results keyed by caller request ID, following existing BaseSkill/search patterns.
    group_fields:
    - id
    - query
    - provider
    - country
    - currency
    - checked_at
    - partial
    - warnings
    - results
    - error
    - checked_results
    - availability
    - max_results
    domain_fields:
    - domain_ascii and domain_unicode
    - availability enum and original provider status
    - premium, reserved, corporate, restriction and registration phase when supplied
    - registration and renewal price tier arrays, each with unit, duration range, tax-exclusive/inclusive
      amounts, discount and normal prices
    - tax context, checked_at and fixed-origin Gandi search link
    errors:
    - invalid_request for local input failure
    - provider_unavailable for total transport/provider failure
    - partial results with unknown availability or price-unavailable for affected children
    - success with empty results only when a completed valid search has no matching candidates
  transport:
    direct_first: true
    fallback: Existing Webshare rotating residential proxy, lazy Vault-first secret loading.
    max_attempts: Two transport routes per failed operation; never rotate in a loop.
    triggers:
    - network_timeout
    - http_403
    - http_5xx
    - malformed_response
    - incomplete_stream
    rate_limit: Honor 429 and Retry-After within the deadline; no immediate repeated proxy rotation.
    partial_handling: Preserve complete children; exact-retry only affected transient failures within
      the same budget.
    exclusions: Do not proxy-retry invalid input, valid unavailable answers, unsupported suffixes or missing
      price alone.
    proposed_limits: Two in-flight operations, two suggestion pages or 20 exact candidates per group,
      40-second group deadline.
    cache: Request-scoped deduplication only initially; no plaintext cross-request query/result cache.
  embeds:
    parent: hosting/search_domains app-skill-use with has_children and domain child mapping.
    child: hosting-domain with standalone preview/fullscreen and shared encrypted child references.
    components:
    - HostingSearchEmbedPreview.svelte using UnifiedEmbedPreview
    - HostingSearchEmbedFullscreen.svelte using SearchResultsTemplate
    - HostingDomainEmbedPreview.svelte using UnifiedEmbedPreview
    - HostingDomainEmbedFullscreen.svelte using UnifiedEmbedFullscreen
    layout: docs/plans/hosting-search-domains/design.md
    required_states:
    - processing
    - cancelled
    - error
    - empty
    - partial
    - available
    - unavailable
    - unknown
    - premium
    - price_unavailable
    - minimum_term
  integration_paths:
  - backend/shared/providers/gandi/client.py and models.py
  - backend/shared/python_utils shared proxy credential/transport helper, with no imports from apps
  - backend/apps/hosting/app.yml and skills/search_domains.py
  - backend/core/api/app/services/embed_service.py child-type mapping
  - backend/shared/python_utils/app_skill_output_safety.py external-data skill registration
  - frontend/packages/ui/src/components/embeds/hosting/ parent/child components, preview fixtures, examples
    and text renderer
  - App/skill/embed i18n, generated registry, AppSkillUseRenderer and EmbedGroupRenderer as required by
    current routing patterns
  - Gandi/provider docs and relevant Gandi/Webshare privacy disclosures
  delivery_phases:
  - REST/CLI/SDK provider and grouped skill implementation with focused unit and isolated CI contract
    checks; real AI requirements checks on dev.
  - Read-only Workflow capability and normalized output adapter with focused execution coverage.
  - Web parent and child embed previews/fullscreens, encrypted checked-result pool, local availability
    filtering, examples and responsive verification.
  implementation_acceptance:
  - Exact domains retain truthful status and separate registration/renewal quotes, taxes, discounts and
    minimum terms.
  - A failed direct operation can succeed through one proxy attempt without duplicate children; both failures
    produce a safe error/partial result.
  - Incomplete/malformed/out-of-order SSE and per-child failures are covered without interpreting HTTP
    200 as success.
  - CLI and both SDKs preserve grouped results, errors and embed references; browser parent and child
    open/navigate/render independently.
  - Parent/child previews, fullscreens, mobile, dark mode, keyboard, empty/error/partial and premium/minimum-term
    states have focused E2E coverage.
  - No Gandi credentials, proxy secrets, user IDs or decrypted chat context are sent/logged unnecessarily.
  pending_review: []
