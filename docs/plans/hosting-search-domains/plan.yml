schema_version: 2
id: hosting-search-domains
title: Implement Hosting domain search through programmatic, workflow and web surfaces
status: approved
goal: Implement Gandi-backed Hosting / Search domains, verify REST/CLI/SDK behavior first, then Workflows,
  then parent and child web embeds.
user_scope_addition: keep in mind that this also means implementing a new embed type for the search and
  its children elements - check existing embed preview and fullscreen layouts and give me an asci based
  wireframe for preview and fullscreen designs so we can clarify what infos to show and in what layout
  that is coherent
scope:
  in:
  - Bounded live Gandi lookup and SSE probes from dev-server direct egress and the existing Webshare proxy.
  - Document accepted requests, latency, negative cases, partial errors, pricing tiers and provider limitations.
  - Draft a Hosting app skill and provider design with server-first bounded proxy fallback.
  - Inspect existing parent/child search embeds and propose four ASCII preview/fullscreen layouts.
  - Implement pure Gandi provider and Hosting skill with bounded direct-first/proxy-fallback transport.
  - Default to available-first results and fill remaining requested slots with matching in-use domains
    unless available_only is explicit.
  - Support all availability and optional bounded natural-language requirements ranking like Events.
  - Verify REST/CLI and SDKs before implementing and testing Workflows; verify Workflows before web embed
    implementation.
  - Verify a real CLI chat recommends names for a social hub using actual domain checks, and prove grouped
    requests execute simultaneously within the shared provider concurrency limit.
  - Publish the user-requested synthetic social-app naming example from a real CLI conversation and verify its public page.
  out:
  - Domain purchase, registration, transfer, renewal, DNS management or account authentication.
  - Load testing, unbounded retries, production service changes or publishing unrelated user domain searches.
