  title: Compare actual server and proxy requests
  given:
  - Public synthetic domain inputs and existing server-side Webshare credentials are available.
  when:
  - The bounded probe sends paired direct/proxy lookups and suggestions from the dev api container.
  then:
  - Evidence distinguishes HTTP acceptance, completed response schema, domain status and partial provider
    errors.
- id: S-2
  title: Review proposed behavior and coherent embed layouts
  given:
  - The Hosting app is not registered; existing search embeds and Hosting design tokens are available.
  when:
  - The draft describes the skill/provider contract and parent/child previews and fullscreens.
  then:
  - The user can review fields, layout and fallback behavior without any feature being enabled.
- id: S-3
  title: Programmatic Hosting search
  given:
  - Approved Hosting Specification and the previous delivery phase is verified.
  when:
  - The scoped implementation executes on the appropriate surface.
  then:
  - Availability, requirements, quotes, errors and privacy preserve the accepted contract.
- id: S-4
