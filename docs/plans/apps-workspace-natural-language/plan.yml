  - Restore canonical Settings > Apps > selected app, including pricing, providers and Daily searches.
  - Fit each app landing page without vertical scrolling; use daily-inspiration-sized headers.
  - Render News articles as News previews and open the selected child rather than its search parent.
  - Show a persistent fullscreen filter button and centered query/save/workflow actions; saved searches show an active pink heart.
