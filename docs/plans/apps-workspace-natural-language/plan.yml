goal: >-
  Replace the Apps workspace forms with natural-language app use, implement the
  supplied Figma workspace and shared fullscreen result design, and update the
  TUI including meaningful child embed previews.
authorization: >-
  User requested implementation after five sequential clarifying questions and
  approved the final scrolling recommendation on 2026-10-20. The intervening
  answers approve the dedicated JEV/Mercury flow, paid default-on daily searches,
  encrypted expiring disk storage, and web/TUI scope. No additional approval
  round is needed to transcribe these decisions.
decisions:
  - Natural-language input replaces forms on web and TUI. A separate app-specific
    JEV route chooses direct skill execution, chat, or Workflow authoring; bounded
    argument choices and Mercury 3 free-value extraction follow skill selection.
  - Only the most recently saved search per app reruns daily, charging the user.
    First save explains this with OK and Turn off; app settings retain a Daily
    searches switch. Runs require user activity within seven days.
  - Public app recommendations contain no personalized inputs and cost OpenMates.
  - Private recommendation payloads use per-user Vault encryption on temporary
    disk. Saved queries, scheduled parameters and preferences use encrypted
    durable database storage. A successful batch replaces its predecessor;
    recommendation expiry is twenty-four hours regardless of activity. Temporary
    payloads are excluded from backups.
  - Default app views use clipped horizontal preview carousels. Fullscreen
    results use a vertical responsive grid with pinned filters and follow-up
    input while the map/header scrolls away. TUI omits the map.
  - Sidebar order is saved entries, recent entries, then actual example chat links.
  - Keep one settings gear for pricing/provider configuration. Tentative Finance
    and OpenMates removal notes do not authorize deleting app functionality.
  - Reuse configured client PII protection for model-bound request, prior-result
    and ranking text. Keep replacement maps local and restore native arguments
    before validation; preserve exact opaque identifiers and upload capabilities.
  - Preserve supplied result context as literal chat data. Incidental URLs in
    that context must not create new website embeds; explicit links in the
    user's request retain ordinary behavior and all context retains PII protection.
