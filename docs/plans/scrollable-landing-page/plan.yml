schema_version: 2
id: scrollable-landing-page
title: Scrollable Figma landing page
status: verified
goal: >
  Implement the updated UI for the landingpage, accessible via a new /landing for
  now, based on the existing visitor-facing web app UI, with a full viewport height
  header, moving app icons and switching examples, scrollable feature sections,
  and a message input fixed at the bottom of the active-chat viewport.
scope:
  in:
    - A server-rendered /landing page and its self-contained guest app-style shell.
    - Figma feature copy/order, distinct category icons, and real dev-account screenshot assets.
    - Existing hero app-rail motion and example switching without header collapse or story takeover.
    - Fixed composer deep link, account link, app workspace links, and blog links.
    - Real published event, news, and blog records; empty states when no upcoming free events exist.
    - Focused local checks, isolated component and route browser proof, dev deployment and visual review.
    - A documented recommendation for the later website/app domain split.
  out:
    - Changing the current app root onboarding carousel.
    - Production DNS or auth migration, new blog posts, or native Apple screenshots.
authorization:
  request: User implementation request and subsequent visual clarifications in Codex chat 01a116b9-306b-7940-beae-99d10025f62a.
  contract: feature.marketing-landing@1
  fingerprint: b6e03c207968c6267408b49c100858b754d505cc727c95eb2fa70326431908c9
  mobile_images: User approved responsive mobile web screenshots; native captures may replace them later.
design_brief:
  file_key: PzgE78TVxG0eWuEeO6o8ve
  node: '6049:87898'
  frame: {width: 1512, height: 5050, version: '2407624242280847601'}
  reference: test-results/figma/scrollable-landing/reference.png
  visitor_baseline: test-results/figma/scrollable-landing/guest-baseline-desktop.png
  target: Feature layout and copy follow Figma; the hero, header, rounded viewport, and composer follow the existing guest app UI as clarified by the user.
  responsive: Desktop copy/media columns stack on narrow screens; the viewport and fixed composer retain the app geometry.
  reuse: Existing theme, typography, icon masks, app metadata, category gradients, and public publication/event records.
  accepted_differences:
    - Wireframe sidebar draft data is omitted from the signed-out default view, as in the current app.
    - Responsive web screenshots stand in for native phone screenshots for this version.
    - Screenshot examples are historical product demonstrations, separate from current public events.
    - The static guest navigation surface uses functional app links without initializing private app sync on /landing.
verification:
  required:
    - Focused local unit checks and changed-file lint/Svelte compilation.
    - Isolated GitHub component proof for laptop/phone layout, hero motion, fixed composer, icons, images, and destinations.
    - Isolated GitHub route proof for server-rendered content and cold-start composer/account deep links.
    - Reviewed dev laptop/mobile visual smoke and retained CI recordings delivered in chat.
  deployed_review:
    commit: dbab85b377120afa9c43894f1221edf581fd20c0
    deployment: dpl_Ug6t8X6JsYfCDffBjq8BTrD59ibf
    readiness: Exact commit confirmed READY through the Vercel API after two GitHub-status timeouts.
    url: https://app.dev.openmates.org/landing
    run_id: test-results/visual-smoke/2026-10-07T16-14-04-607Z/summary.json
    result: passed
    viewports: [laptop, mobile]
    summary: Laptop and mobile screenshots reviewed; no clipping, overlap, broken media, console or network defects. Approved mobile web screenshot substitution retained.
    recording_delivery: All 25 existing CI recordings uploaded, including failed attempts, retries, recorded profiles and workspace popups; final chat links are the delivery record.

scenarios:
  - id: S-1
    title: Visitor explores the landing page
    given: [A visitor opens /landing without signing in.]
    when: [The visitor scrolls from the hero through the public content rows.]
    then:
      - The page renders independently of private app synchronization and remains readable on laptop and phone widths.
      - Feature sections follow the approved Figma hierarchy with distinct icons and real product screenshots.
      - Public events, news, and blog destinations use published records or an honest empty state.
  - id: S-2
    title: Visitor enters the app
    given: [A visitor is viewing /landing.]
    when: [The visitor uses a workspace, account, example, or hero composer link.]
    then:
      - The destination opens the correct web-app or public page.
      - The hero composer request focuses the real app composer after cold start without sending or replacing a draft.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: /landing exposes the approved responsive feature order, distinct category icons, real screenshots, and published event/news/blog content without private app startup.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-LANDING-COMPONENT, T-LANDING-ROUTE]
  - id: AC-2
    scenario: S-2
    text: Landing links reach their intended app or public destination, and the hero composer request focuses the real composer after a cold start without mutating its draft.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-LANDING-ROUTE]

