risks:
  - id: R-1
    risk: Split-brain state during migration or rollback.
    mitigation: One configured adapter, bounded shadow reads, brief final ingestion pause, zero-mismatch gate, and no indefinite dual writes.
  - id: R-2
    risk: A new private API broadens the attack surface or leaks engineering metadata.
    mitigation: Private network, scoped identities, rate limits, field allowlists, audit events, and no public product routing.
  - id: R-3
    risk: Product lifecycle scripts accidentally manage the control-plane services or volume.
    mitigation: Separate compose project and deterministic distribution/lifecycle audits.
  - id: R-4
    risk: Historical state is lost when Directus collections are removed.
    mitigation: Hash/count manifests, normalized parity checks, independent backup/restore proof, and read-only observation before deletion.
  - id: R-5
    risk: Status consumers become stale or expose internal test details.
    mitigation: Strict projection allowlist, asynchronous delivery, freshness metadata, and last-known-state behavior.
  - id: R-6
    risk: Narrow fixture endpoints become a generic test backdoor into product data.
    mitigation: Development-only deployment, fixture allowlist, run ownership, expiry, audit, idempotent cleanup, and no generic CRUD.
  - id: R-7
    risk: A direct server command or legacy runner bypasses the shared lease and operation queue.
    mitigation: Put lease admission in the common lifecycle library, inventory every entry point, fail closed when the control plane is unavailable, and enforce the invariant with a deterministic boundary audit.
  - id: R-8
    risk: Dispatch deduplication reuses an obsolete result after the product runtime changes.
    mitigation: Include the monotonic runtime epoch and normalized service requirements in the fingerprint and increment the epoch after every admitted runtime mutation.

