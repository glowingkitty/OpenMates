decisions:
  - id: D-1
    status: active
    decision: Use a dedicated FastAPI service and dedicated PostgreSQL service, database, volume, credentials, and lifecycle.
    reason: A separate schema or database inside product Postgres would retain shared outage, backup, restore, credential, and lifecycle coupling.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep the engineering control plane private and exclude it from normal self-hosted distributions.
    reason: It coordinates OpenMates development rather than serving product users or operators.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-3
    status: active
    decision: Publish sanitized status asynchronously and forbid synchronous product dependencies.
    reason: Control-plane failure must not degrade product or public status availability.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-4
    status: active
    decision: Product lifecycle operations must not control or restart engineering services.
    reason: OpenCode agent work must continue while product servers restart, rebuild, migrate, or restore.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-5
    status: active
    decision: Do not create a permanent product contract bundle for this work.
    reason: The control plane is private engineering infrastructure; this executable spec is the durable source of truth.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-6
    status: active
    decision: Publish status through an idempotent signed mTLS request from a control-plane outbox to a private independent-status ingestion endpoint.
    reason: This preserves asynchronous delivery, retries, provenance, and product runtime independence without sharing a database.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-7
    status: active
    decision: Require a 24-hour green observation window including at least one scheduled import before deleting read-only Directus collections.
    reason: A full daily boundary gives cron, polling, ingestion, campaign, and status publication paths time to execute while keeping migration bounded.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-8
    status: active
    decision: Centralize resource leases, runtime operations, dispatch idempotency, and typed session events in the independent control plane, with no supported direct lifecycle bypass.
    reason: Storage independence alone does not prevent chats from restarting shared services during tests, duplicating expensive dispatches, or wasting time on manual polling.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-9
    status: active
    decision: Keep generated-contract ownership and proof-review batching as separate follow-up work.
    reason: They improve throughput but do not belong in the control-plane failure domain and should not enlarge the migration or cutover blast radius.
    decided_at: "2026-08-26T00:00:00Z"

implementation_notes:
  plan_path: docs/plans/independent-engineering-control-plane/plan.yml
  existing_patterns:
    - scripts/tests.py provides an in-memory store contract and one canonical command surface.
    - scripts/run_tests.py separates test execution from normalized control-state ingestion.
    - backend/status demonstrates an independently deployed internal FastAPI service with separate storage.
    - Existing natural keys support idempotent migration without product foreign keys.
  architecture: >
    Introduce `backend/engineering_control_plane` as a private FastAPI and
    PostgreSQL service deployed through its own engineering-only compose project.
    Keep `scripts/tests.py` as the operator interface but replace its Directus
    adapter with a typed internal API client. Use transactional PostgreSQL
    repositories, append-oriented run/result ingestion, a reconstructable
    current-state projection, and an outbox for sanitized status publication.
  data_flow:
    - Test runners and importers send sanitized idempotent run/result records to the private API.
    - Sessions, test runners, and product lifecycle commands acquire resources and enqueue mutations through one transactional coordination surface.
    - Equivalent test requests reuse a durable dispatch record and waiting chats consume typed events from cursors instead of fixed polling loops.
    - The API commits events and current-state projection changes in one transaction.
    - OpenCode campaign and claim commands use scoped coordination endpoints and transactional leases.
    - A publisher sends only allowlisted aggregate status from the outbox to the independent status system.
    - Product fixture setup calls separate development-only product operations and records only references in the control plane.
  affected_files:
    - path: backend/engineering_control_plane/
      reason: Independent API, models, migrations, repositories, retention, health, backup helpers, and tests.
    - path: deployment/engineering_control_plane/
      reason: Engineering-only service definitions, network, volume, configuration template, and lifecycle commands.
    - path: scripts/tests.py
      reason: Replace Directus REST, token minting, and direct Postgres paths with the internal API client.
    - path: scripts/run_tests.py
      reason: Route ingestion and product fixture setup through separated APIs.
    - path: scripts/sync-test-results.sh
      reason: Import artifacts through the independent service.
    - path: backend/core/api/app/services/test_results_service.py
      reason: Remove synchronous Directus test-state reads and consume only the sanitized projection.
    - path: backend/core/api/app/routes/status_routes.py
      reason: Remove embedded engineering test details while preserving product-health behavior and making no external status request.
    - path: backend/status/
      reason: Receive or retain the asynchronous sanitized projection without product dependency.
    - path: frontend/packages/ui/src/components/settings/
      reason: Route detailed administrative test-result UI through a private control-plane surface or remove it according to the caller inventory.
    - path: backend/core/directus/schemas/test_*.yml
      reason: Remove legacy engineering schemas after cutover observation.
    - path: backend/core/directus/setup/setup_schemas.py
      reason: Ensure product schema setup no longer includes engineering collections.
    - path: frontend/packages/openmates-cli/src/server.ts
      reason: Keep product backup, restore, and lifecycle manifests free of engineering services and data.
    - path: docs/architecture/test-orchestration.md
      reason: Document the independent canonical store, API, lifecycle, status, and recovery boundaries.
    - path: .claude/rules/testing.md
      reason: Replace Directus source-of-truth guidance with the independent control plane.
    - path: scripts/audit_engineering_control_plane_boundary.py
      reason: Prevent regression to Directus, product SQL, local JSON fallback, or public routing.
    - path: scripts/audit_engineering_control_plane_distribution.py
      reason: Prevent engineering components from entering self-hosted product artifacts.
    - path: docs/architecture/control-plane-callers.yml
      reason: Versioned inventory and disposition for every current producer, consumer, credential path, JSON reader, status route, admin UI, cron, and runner.
  verification_strategy:
    - Write store, coordination, concurrency, API, migration, status, fixture, retention, and deterministic boundary tests before implementation.
    - Prove the private API and database without product services running.
    - Backfill and compare normalized state before cutover.
    - Exercise product stop/rebuild/migrate/start while renewing and completing a real control-plane claim.
    - Restore the control-plane database independently before deleting Directus schemas.
    - Run final boundary and distribution audits after legacy removal.
  verification_order:
    - Validate and approve this infrastructure spec.
    - Add focused red tests and deterministic audits.
    - Implement the independent database, API, auth, migrations, health, and retention.
    - Switch tests.py and ingestion clients, then prove store and API behavior green.
    - Implement and prove sanitized asynchronous status publication.
    - Replace broad product fixture access with narrow development operations.
    - Backfill, shadow-read, compare, cut over, and run lifecycle plus restore checks.
    - Complete the observation window, remove Directus schemas/data, and run final audits.

