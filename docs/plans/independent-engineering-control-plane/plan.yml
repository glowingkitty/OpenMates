assumptions:
  - id: A-1
    text: The seven existing Directus `test_*` collections have no required product foreign keys and can be represented in a separate database using stable string identities.
    category: data_model
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/directus/schemas/test_*.yml
        summary: Cross-record identities use stable keys and JSON metadata rather than product collection relationships.
  - id: A-2
    text: GitHub-hosted test jobs can continue publishing artifacts for ingestion without direct network access to the private control plane.
    category: network
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/test-orchestration.md
        summary: The dev host already dispatches, polls, downloads, and imports GitHub Actions artifacts.
  - id: A-3
    text: The independent status service can retain or accept a sanitized asynchronous projection without requiring a synchronous product API dependency.
    category: status
    required_before: task_execution
    status: unchecked
    blocker_or_waiver: TASK-5 must select and prove the projection transport before status cutover.
  - id: A-4
    text: Product fixture operations can be narrowed to development-only endpoints or authenticated internal operations without broad Directus access.
    category: security
    required_before: task_execution
    status: unchecked
    blocker_or_waiver: TASK-6 must inventory every generic product-data operation before changing runner credentials.

contracts:
  api:
    access_model: internal-only
    deployment: Private engineering infrastructure; not routed through the public product API allowlist.
    transport: TLS for every network request and mutual TLS for host, Apple-ingestion, and administrative clients; loopback-only health may remain unauthenticated and disclose no state.
    auth: Short-lived signed service tokens bound to dedicated least-privilege identities and mTLS principals, bootstrapped from an engineering-only host secret store; no product session, API key, Directus token, or product database credential.
    authorization: Separate read, ingest, coordinate, and administrative scopes; claim mutation records actor identity and audit metadata.
    credential_lifecycle: Rotation supports a bounded overlap of at most fifteen minutes; revocation is effective within five minutes; revoked or superseded identities fail closed without fallback.
    network_policy: Product containers and product networks have no route or trusted client identity to the control-plane API or database.
    rate_limits: Bounded per-identity request and bulk-ingestion limits sized for scheduled test imports; overload returns explicit retryable errors.
    credit_budget: No OpenMates product credits or provider spend.
    encryption_boundary: Accepts only sanitized engineering metadata and artifact references; no client-side encrypted data, decrypted product plaintext, keys, cookies, or user identifiers.
    availability: Product services are never an upstream dependency; health reports database connectivity, migration revision, projection freshness, and backup freshness.
    operations:
      - Read catalog, current state, history, runs, results, campaigns, groups, and claims.
      - Idempotently ingest run and result events and update current-state projections.
      - Atomically create, renew, release, expire, and complete claims.
      - Create and update campaigns, groups, attempts, blockers, and evidence.
      - Export sanitized migration snapshots and publish sanitized status projections.
      - Acquire, renew, release, and inspect resource leases shared by every supported test and product-runtime mutation path.
      - Idempotently request test dispatches and runtime operations, wait for prerequisite service canaries, and classify environmental interruption against a monotonic runtime epoch.
      - Publish, read by cursor, and acknowledge typed session events targeted to a session, task, dispatch, lease, or runtime operation.
    artifact_ingestion:
      - Require an allowlisted producer identity, expected repository/workflow, immutable external run ID, subject commit, artifact SHA-256, and GitHub API provenance before accepting downloaded artifacts.
      - Reject tampered artifacts and make replay idempotent by stable run/result keys.
  data:
    database: Dedicated PostgreSQL process, database, user, volume, migration history, and backup target.
    tables:
      - test_catalog
      - test_runs
      - test_results
      - test_current_state
      - test_claims
      - test_debug_campaigns
      - test_debug_groups
      - control_plane_audit_events
      - status_projection_outbox
      - control_plane_resource_leases
      - control_plane_runtime_operations
      - control_plane_dispatch_requests
      - control_plane_session_events
    identities:
      - test_key
      - run_key
      - result_key
      - claim_key
      - campaign_key
      - group_key
      - lease_key
      - operation_key
      - dispatch_key
      - event_key
    transaction_rules:
      - Natural-key upserts are idempotent.
      - Claim acquisition uses one database transaction and a uniqueness/locking constraint for one active owner per group.
      - Current state is reconstructable from durable run/result events.
      - A rerun never erases the latest completed stable state while active.
      - Overlapping exclusive resource leases cannot both be active, and runtime mutations remain queued while a conflicting lease is active.
      - Dispatch fingerprints are canonical over repository, subject commit, normalized test selection, profile, account, mocks, required services, and runtime epoch; an active or successful match is returned rather than dispatched again.
      - Event cursors are monotonic and acknowledgements are idempotent; event payloads are schema-versioned and reject credentials, product content, and arbitrary untyped blobs.
    retention_defaults:
      - Detailed results retain 14 days by default plus the latest result for every canonical test; the window is configurable and older legacy detail remains available in the fenced migration archive through observation.
      - Security audit events retain at least 365 days; compact failure signatures and run summaries retain at least 90 and 365 days respectively.
      - Released and expired claims retain at least 30 days, configurable by environment.
      - Completed campaigns and summarized runs retain at least 365 days or are archived before deletion.
      - Active campaigns, active runs, and non-expired claims are never removed by age-based retention.
      - Raw artifacts remain in bounded artifact/object storage and are referenced, not stored as database blobs.
      - Acknowledged session events remain readable for at least seven days and until every targeted recipient has acknowledged them.
    backup_recovery:
      - Use transaction-consistent base backups plus encrypted WAL archiving with signed manifests and integrity hashes.
      - Backup storage uses engineering-only credentials, buckets, encryption keys, retention, and lifecycle; it shares no product S3 credential, bucket, endpoint dependency, or product backup job.
      - Target RPO is at most five minutes and target RTO is at most thirty minutes.
      - Restore always targets a new fenced instance; the restoring and superseded instances reject writes until explicit validated promotion.
      - Promotion verifies migration revision, manifest hashes, row counts, stable identities, current-state reconstruction, and lease-time semantics.
  migration:
    source: Product Directus `test_*` collections.
    sequence:
      - Create independent service, schema, migrations, credentials, backup, and health checks.
      - Inventory every producer and consumer, assign a migration epoch, and record a high-water mark for scripts/tests.py, cron, external-run polling, GitHub artifact import, Apple import, and campaign workers.
      - Export bounded sanitized Directus records with stable source counts, hashes, and one authoritative lease/cutover timestamp.
      - Import idempotently and compare normalized records and relationships while legacy Directus remains canonical.
      - Enter maintenance admission mode, reject new legacy mutations, drain in-flight writers, and queue newly discovered external artifacts without acknowledging legacy writes.
      - Import the final delta, replay queued events in deterministic producer/run order, require zero mismatches, and prove no writer acknowledged a post-fence Directus mutation.
      - Atomically switch one configured adapter and record the first acknowledged new-store write as the irreversible canonical-write boundary.
      - Keep Directus collections read-only through a rollback observation window.
      - Verify independent restore and product lifecycle isolation before removing Directus schemas and data.
    rollback: Before the first acknowledged new-store write, abort cutover and reopen the unchanged legacy store; after that boundary, never switch writes back to stale Directus and repair or replay forward from durable control-plane events.
    observation_window: At least 24 hours with no parity, ingestion, claim, or lifecycle errors and at least one scheduled external-result import before Directus deletion.
  status_projection:
    allowed_fields: [aggregate_status, suite_counts, failed_count, running_count, generated_at, source_revision, freshness]
    forbidden_fields: [session_id, worker_id, error_summary, artifact_url, command, credentials, user_id, email, product_record_id]
    failure_behavior: Retain last known projection, mark stale after its freshness threshold, and never block product or public status responses.
    freshness_threshold: Mark stale when no successful projection is published for fifteen minutes.
    transport: The control-plane outbox publisher sends an idempotent signed projection over mTLS only to a private ingestion endpoint on the independent status service; product API and product networks do not receive or relay it.
    consumer_inventory:
      - Product status routes remove embedded engineering test details, retain product-health behavior, and make no control-plane or independent-status request.
      - Independent status service stores and serves the aggregate last-known projection.
      - Administrative detailed-run routes and settings UI use a private authenticated control-plane read endpoint or are explicitly removed.
      - Local JSON files remain downloadable run artifacts only and are never a canonical status source.
  fixture_boundary:
    access_model: Internal development-only product operation, separate from the engineering control-plane API.
    requirements:
      - Explicit fixture type allowlist.
      - Test-run ownership and bounded expiry.
      - Idempotent cleanup and visible cleanup failure.
      - No generic collection CRUD or raw SQL.

privacy_security:
  - Keep the API and database on a private engineering network and outside public Caddy routes.
  - Use dedicated scoped identities and independently rotated secrets; do not inherit product `.env` credentials.
  - Redact imported failures before persistence and reject forbidden fields at the API boundary.
  - Store artifact references and integrity hashes only, never artifact bodies.
  - Log control-plane actor, operation, stable target key, outcome, and timestamp without secrets or private payloads.
  - Retain security audit events for at least 365 days with read access limited to engineering administrators and integrity-protected exports before expiry.
  - Reject product-network clients, product credentials, revoked identities, tampered artifacts, and provenance mismatches with stable sanitized failure classes.
  - Encrypt backups at rest, restrict restore authority, and exercise restore separately from product recovery.
  - Fail visibly when unavailable; never silently read stale local JSON or reconnect to Directus.

