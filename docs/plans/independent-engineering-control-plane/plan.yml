schema_version: 2
id: independent-engineering-control-plane
title: Independent Engineering Control Plane
status: implementing

goal: >
  Move all Directus-backed engineering test coordination into a private control
  plane with its own FastAPI service, PostgreSQL service, credentials, volume,
  migrations, lifecycle, retention, backup, and restore path so product server,
  Directus, and product database restarts have no effect on OpenCode agent work.

scope:
  in:
    - Replace all seven Directus `test_*` collections with dedicated control-plane tables.
    - Preserve test catalog, runs, results, current state, campaigns, groups, claims, leases, and artifact references.
    - Run the control-plane API and PostgreSQL database independently from every product Docker Compose project and server lifecycle command.
    - Replace Directus REST, Directus token minting, and direct `cms-database` SQL in engineering tooling with a private internal API client.
    - Preserve atomic claims, idempotent ingestion, stable-versus-active status, durable campaigns, GitHub Actions ingestion, and Apple test records.
    - Migrate existing Directus records through a bounded export, import, normalized comparison, cutover, observation, and removal process.
    - Publish only a sanitized asynchronous test-status projection for operational status consumers.
    - Give the control plane independent health checks, observability, retention, backup, restore, and disaster-recovery verification.
    - Remove control-plane schemas, credentials, data, backup payloads, and runtime dependencies from product and self-hosted distributions.
    - Replace test fixture access that currently uses generic Directus credentials with narrowly scoped development product API operations.
    - Inventory and classify every current Directus, JSON-artifact, status, admin, UI, cron, and runner consumer before cutover.
    - Make test dispatches, runtime mutations, resource leases, and cross-session coordination durable and atomic so no supported command can bypass an active lease.
    - Deduplicate equivalent test dispatches and expose typed, cursor-based session events so chats wait on state changes instead of polling and sleeping.
    - Model test resources with shared reader leases and exclusive writer leases, and allocate persistent test accounts atomically so independent GitHub jobs can run concurrently.
    - Keep the resource-constrained Apple host on one deterministic native-test lane while parallelizing Linux and GitHub-hosted work around it.
  out:
    - Moving product users, authentication, chats, messages, tasks, workflows, billing, safety, or compliance data.
    - Replacing GitHub Actions, Playwright, pytest, Vitest, CLI, or Apple test execution engines.
    - Shipping the engineering control plane with normal self-hosted OpenMates installations.
    - Adding a product web or Apple interface for engineering coordination.
    - Storing raw screenshots, traces, private logs, credentials, user data, ciphertext, or encryption keys in the control-plane database.
    - Making the product API synchronously depend on the control-plane API or database.
    - Eliminating legitimate E2E interactions with development product data when the product behavior itself is under test.

context_discovery:
  github_issues:
    - No matching GitHub issue was found for "Directus test control plane database".
  prior_specs:
    - docs/plans/directus-test-control-plane/plan.yml
    - docs/plans/nightly-test-zero-failures/plan.yml
  docs:
    - docs/architecture/test-orchestration.md
    - docs/architecture/infrastructure/status-page.md
    - docs/user-guide/cli/server-management.md
  code_patterns:
    - scripts/tests.py owns the current Directus adapter, campaigns, groups, claims, status, and imports.
    - scripts/run_tests.py owns execution, GitHub Actions dispatch, polling, artifacts, and some product fixture setup.
    - backend/core/directus/schemas/test_*.yml define seven engineering collections in the product CMS database.
    - backend/core/api/app/services/test_results_service.py reads test state for product status aggregation.
    - backend/core/api/app/routes/status_routes.py and admin/settings test-result surfaces expose current or detailed test state.
    - backend/status/main.py reads test-result artifacts independently from the product status aggregator.
    - frontend settings test-result UI consumes detailed administrative test status and errors.
    - backend/status already demonstrates an independently deployed internal service with its own storage lifecycle.
    - backend/core/docker-compose.yml couples Directus schema setup and product Postgres lifecycle.
  tests:
    - scripts/tests/test_tests_control.py
    - scripts/tests/test_tests_control_campaigns.py
    - scripts/tests/test_tests_control_github_sync.py
    - scripts/tests/test_tests_control_apple.py
    - scripts/tests/test_tests_control_directus_auth.py
    - scripts/tests/test_tests_control_directus_schema.py
    - backend/tests/test_test_results_service.py
  opencode_chat_evidence:
    - "`ses_fd1cc8879ffeDKZ8Uz15dZKRin`: bypassed wrapper and help invocation produced stale or false Directus state."
    - "`ses_fd6e5da95ffe2Ii5XuCNssOjou`: interrupted daily execution exposed final-only persistence and host Directus-token coupling."
    - "`ses_fd6e5da4fffeSSB5y79fN8n52X`: product auth-record and encrypted cleanup constraints reduced test-account capacity."
    - "`4514`: campaign state, deployed commit selection, wrapper lifetime, and GitHub run state diverged."

clarification:
  rounds:
    - question: Should isolation use a dedicated service and database rather than a schema or database inside product Postgres?
      answer: Yes; use a dedicated FastAPI service and dedicated PostgreSQL service with complete independence from product CMS and database.
    - question: Is the control plane private developer infrastructure or part of normal self-hosted installations?
      answer: Private developer infrastructure only; self-hosted installations must not include it.
    - question: May product status synchronously query the engineering control plane?
      answer: No; publish a sanitized asynchronous projection so control-plane failure cannot degrade product API availability.
    - question: Must product server restarts leave OpenCode coordination unaffected?
      answer: Yes; product restarts, rebuilds, migrations, backup, restore, and outages must not affect the control plane or agentic work.
  vision_summary: >
    Engineering coordination is a separate trust, persistence, deployment, and
    failure domain. Product infrastructure can be restarted or restored while
    OpenCode sessions continue reading, claiming, renewing, importing, and
    completing work against the private control plane.
  approved_by_user: true

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple product behavior is unchanged.
    - Apple test executions remain first-class control-plane run and result records.
  verification:
    - Focused ingestion tests cover Apple run normalization; no Xcode build is required.
  intentional_native_differences:
    - The engineering control plane is not an Apple product surface.

scenarios:
  - id: S-1
    title: Product restart does not interrupt OpenCode coordination
    given:
      - An active campaign and renewable claim exist in the engineering control plane.
      - The product API, workers, Directus, and product database are running.
    when:
      - The product stack is stopped, rebuilt, migrated, and restarted through its normal lifecycle.
    then:
      - The campaign remains readable throughout the product lifecycle operation.
      - The claim can be renewed and completed without reconnecting to product services.
      - No acknowledged control-plane write is lost or rewound.
      - In-flight product tests interrupted by the restart are classified as retryable `environment_interrupted`, retain their prior stable state, and do not automatically complete or release their claim.
      - Active runs that receive no terminal import transition to explicit timed-out infrastructure state through reconciliation rather than remaining silently active.
  - id: S-2
    title: Test commands require no product CMS or database access
    given:
      - Product Directus and the product database are unavailable.
      - A valid least-privilege engineering control-plane identity is configured.
    when:
      - An operator runs status, history, triage, campaign, claim, and import commands through `scripts/tests.py`.
    then:
      - Commands read and write the independent control plane successfully.
      - No Directus token is minted and no product database command is attempted.
      - Invalid control-plane credentials fail visibly without a Directus or local-JSON fallback.
  - id: S-3
    title: Existing coordination state migrates without semantic loss
    given:
      - Directus contains completed and active runs, current state, campaigns, groups, active non-expired claims, and artifact references.
    when:
      - A migration epoch is opened, every producer reaches its recorded high-water mark, legacy write admission is fenced, active writers drain, and the exporter, importer, queued-event replay, and normalized comparison run.
    then:
      - Stable identity keys and every active coordination relationship are preserved.
      - Repeated imports are idempotent.
      - Cutover is blocked while normalized comparisons contain mismatches.
      - No producer can acknowledge a Directus write after the final migration fence.
      - Lease expiry and renewal are evaluated against one authoritative cutover timestamp.
  - id: S-4
    title: Concurrent workers receive atomic claims
    given:
      - A failed group has no active non-expired claim.
    when:
      - Two workers request the same group concurrently.
    then:
      - Exactly one transaction creates the active claim.
      - The other request receives a deterministic conflict response.
      - Expiry, renewal, release, and completion remain durable across process restarts.
  - id: S-5
    title: Run ingestion preserves stable and active state
    given:
      - A test has stable status `failed` from `run-100`.
    when:
      - "`run-101` starts, completes, and its result artifact is imported twice."
    then:
      - The active run is visible without erasing the stable failure.
      - Completion updates stable state exactly once and clears active state.
      - Duplicate ingestion creates no duplicate run, result, or history event.
  - id: S-6
    title: Public status survives control-plane failure
    given:
      - A sanitized test-status projection has been published asynchronously.
    when:
      - The control-plane API or database becomes unavailable.
    then:
      - Product status remains available with embedded engineering test details removed and makes no control-plane call.
      - The independent public status service serves the last asynchronously published aggregate projection.
      - The last known projection remains visible and is explicitly marked stale.
      - Internal session IDs, errors, artifact URLs, and credentials are never published.
      - Administrative detailed-result consumers use an explicitly private control-plane read surface or are retired; they never receive details through the public aggregate projection.
  - id: S-7
    title: Control-plane backup and restore are independent
    given:
      - Product services are unavailable and a valid control-plane backup exists.
    when:
      - A manifest-verified backup is restored into a fenced replacement instance, validated, and promoted while retention jobs run.
    then:
      - Product backups and credentials are not required.
      - Durable campaigns and valid state return consistently.
      - Expired claims and old result detail follow explicit bounded retention policies.
      - The restoring and superseded database instances reject writes.
      - Recovery meets an RPO of at most five minutes and RTO of at most thirty minutes.
  - id: S-8
    title: Self-hosted installation contains no engineering plane
    given:
      - A normal self-hosted OpenMates package is installed, backed up, restored, and updated.
    when:
      - Its services, schemas, volumes, and configuration are inspected.
    then:
      - No control-plane service, database, tables, migrations, credentials, backup payload, or health dependency exists.
  - id: S-9
    title: Product fixtures use narrow development operations
    given:
      - An E2E spec needs a disposable product record such as a gift card.
    when:
      - The runner prepares and cleans up the fixture.
    then:
      - It uses an authenticated, development-only, narrowly scoped fixture operation.
      - The control plane receives only fixture references and sanitized outcomes.
      - Generic Directus and product database credentials are unavailable to the runner.
  - id: S-10
    title: Directus control-plane data is retired safely
    given:
      - New-store writes, normalized shadow reads, backup restore, and lifecycle independence checks are green.
    when:
      - The rollback observation window completes.
    then:
      - Directus `test_*` collections become read-only before deletion.
      - All callers and docs stop treating Directus or local JSON as canonical.
      - Product schema setup, backups, and restores contain no engineering control-plane data.
      - Once the new store acknowledges its first post-cutover write, recovery is forward-only and never switches canonical writes back to stale Directus state.
  - id: S-11
    title: Parallel chats coordinate tests and runtime changes without duplicate work
    given:
      - One chat owns a product-runtime test lease or has already dispatched an equivalent test request.
      - Another chat requests a conflicting runtime mutation or the same test request.
    when:
      - The requests enter through any supported sessions, tests, runner, or server command path.
    then:
      - A conflicting runtime mutation is queued behind the lease and cannot bypass it through a direct server command.
      - An equivalent active or successful dispatch is reused instead of creating duplicate work.
      - A changed runtime epoch permits a new dispatch after an environmental interruption.
      - Typed targeted events let waiting chats resume from a durable cursor without fixed sleeps or loss across process restarts.
      - A chat that observes temporary contention enters a renewable waiting state, follows lock-owner transitions, receives an explicit ready signal, and continues in the same response instead of returning a terminal blocker.
  - id: S-12
    title: Independent tests use available capacity without overloading shared hosts
    given:
      - Multiple chats request browser, unit, product-runtime, and Apple verification for exact commits.
      - Normal Playwright account slots are available and the Apple host has limited memory and disk.
    when:
      - The orchestrator admits and schedules the work.
    then:
      - Browser readers share the stable dev runtime while each claims one exclusive persistent account.
      - A Docker mutation waits for all overlapping runtime readers and blocks new readers until it completes.
      - Playwright work advances through a dynamic account queue without batch-wide barriers.
      - Independent GitHub unit suites run in parallel with browser work and check out the exact requested commit.
      - Apple sync, build, test, and startup verification share one host-wide lane with no parallel simulators, duplicate worktrees, or per-chat DerivedData trees.

