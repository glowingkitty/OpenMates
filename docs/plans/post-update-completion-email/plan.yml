contracts:
  api:
    access_model: internal-only
    auth: Host-local CLI execution only; no endpoint is added or changed.
    rate_limits: One completion event per update with the existing three bounded delivery attempts.
    credit_budget: Zero OpenMates credits and no paid AI or search provider request.
    encryption_boundary: No chat, memory, file, key, sync, share, billing, or user content is read, decrypted, or transmitted.
  cli:
    commands: [openmates server update]
    update_modes: [image, source]
    roles: [core, upload, preview]
    final_gate: Accepted completion email is required for status success.
  status:
    fields: [status, step, installed_version, update_mode, source_link, completion_email_delivery, opaque_completion_email_delivery_id]
    forbidden: [admin_email, api_key, raw_provider_response, user_data, private_repository_url]

privacy_security:
  - Send only operational update metadata and one public repository source link.
  - Persist delivery channel, state, attempts, and sanitized reason, never destination or credentials.
  - Use Brevo's documented idempotencyKey payload header and accept only its exact duplicate_parameter response as prior acceptance.
  - Ignore private or malformed OCI source links rather than including them in email or status.
  - Preserve the current no-rollback contract for all email failures.

