scenarios:
  - id: S-1
    title: Released image update emails the admin
    given:
      - An image-mode update targets v0.17.0 and required checks pass.
      - Monitoring setup succeeds and no quick test is requested.
      - Admin email and Brevo credentials are configured.
    when:
      - Brevo accepts the completion email.
    then:
      - The email subject is Server update complete.
      - The body includes v0.17.0, the server role, completion time, and the v0.17.0 release URL.
      - Update status is success and the command exits zero.
  - id: S-2
    title: Development image or source update uses available provenance
    given:
      - The update target has no released version URL.
    when:
      - Image provenance identifies a pull request or revision, or source mode resolves the checked-out revision.
    then:
      - The email selects release, pull request, commit, then source in that order.
      - The installed tag or revision and selected link are persisted without private repository data.
  - id: S-3
    title: Missing email configuration degrades the completed update
    given:
      - Required runtime checks and monitoring setup passed.
      - No complete admin-email delivery configuration is available.
    when:
      - The final completion-email gate runs.
    then:
      - No false delivery success is recorded.
      - Updated containers remain running.
      - Update status is degraded and the command exits non-zero.
  - id: S-4
    title: Provider rejection after retries degrades without leaking details
    given:
      - Completion email is configured.
      - Brevo rejects or times out for all bounded attempts.
    when:
      - Delivery retries are exhausted.
    then:
      - The persisted result records email delivery as exhausted with a sanitized reason.
      - Recipient, API key, and raw provider response are absent from output and status.
      - Updated containers remain running and no rollback runs.

