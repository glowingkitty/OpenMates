implementation_notes:
  plan_path: docs/plans/post-update-completion-email/plan.yml
  status: approved
  existing_patterns:
    - frontend/packages/openmates-cli/src/server.ts update sequencing and status persistence
    - frontend/packages/openmates-cli/src/serverHealth.ts Brevo delivery, retries, and redacted receipts
    - OCI source, revision, and version labels from .github/workflows/publish-selfhost-images.yml
  architecture: >
    Add a typed update-completion payload to the existing host notification
    module, resolve public provenance locally, and call one final email-only gate
    from the shared completion section of both update modes after quick-test
    success or skip. Persist the redacted receipt before recording final status.
  first_slice: Add direct CLI contract tests for payload content, provenance order, sequencing, missing configuration, exhausted retries, and redaction.
  data_flow:
    - Update mode completes readiness, runtime verification, and monitoring setup.
    - The optional quick test runs or records a non-failing skip outcome.
    - CLI resolves installed version and public provenance from the target tag, OCI labels, or source revision.
    - CLI persists a pending opaque delivery ID before existing Brevo delivery performs three bounded attempts to the configured admin.
    - Ambiguous retries reuse the same Brevo idempotency key, while unchanged continuous polls reuse the prior accepted result without sending again.
    - Accepted delivery records success; unavailable or exhausted delivery records degraded and exits non-zero while containers remain running.
  boundaries: [No endpoint, database, Directus, SDK, web, Apple, issue-report email, or rollback changes.]
  affected_files:
    - {path: frontend/packages/openmates-cli/src/serverHealth.ts, reason: Typed completion payload, email rendering, retries, and redacted receipt.}
    - {path: frontend/packages/openmates-cli/src/server.ts, reason: Provenance resolution, final update gate, status persistence, JSON and human output.}
    - {path: frontend/packages/openmates-cli/src/serverUpdateState.ts, reason: Atomic status persistence and installation-scoped process locking.}
    - {path: frontend/packages/openmates-cli/tests/server.test.ts, reason: Direct contract tests for success, degraded state, ordering, provenance, and redaction.}
    - {path: scripts/audit_runtime_health_contract.py, reason: Deterministic guard for completion-email privacy and required status semantics.}
    - {path: docs/user-guide/cli/server-management.md, reason: Operator completion and troubleshooting behavior.}
    - {path: docs/architecture/core/servers.md, reason: Host-owned update completion gate.}
