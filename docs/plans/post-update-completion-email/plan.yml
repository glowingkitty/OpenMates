risks:
  - {id: R-1, risk: A transient email outage turns an otherwise healthy update into degraded state., mitigation: Keep containers running, retry three times, persist a sanitized reason, and make rerun recovery explicit.}
  - {id: R-2, risk: Mutable image tags report misleading provenance., mitigation: Read installed OCI version and revision labels after update and prefer immutable release, PR, or commit links.}
  - {id: R-3, risk: Recipient or provider details leak through status output., mitigation: Persist only channel, state, attempts, and sanitized failure class and test forbidden fields.}

