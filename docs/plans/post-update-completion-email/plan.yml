goal: >
  Make every completed CLI-managed server update prove that operational email
  delivery works by sending the configured admin one privacy-safe completion
  message with the installed version and best available source link, degrading
  the update visibly when delivery is unavailable or exhausted.

scope:
  in:
    - Apply to image-mode and source-mode openmates server update commands for core, upload, and preview roles.
    - Send exactly one Server update complete email after required runtime checks, monitoring setup, and any accepted quick test pass.
    - Include update mode, installed version or revision, role, completion timestamp, and best available release, pull-request, commit, or source link.
    - Reuse the host-owned Brevo adapter, configured admin recipient, bounded retries, and redacted delivery receipt.
    - Persist one opaque delivery identity before sending and reuse it across ambiguous retries or process recovery.
    - Suppress repeat completion email for unchanged continuous-update polls that already recorded accepted delivery.
    - Record success only after Brevo accepts the completion email.
    - Keep updated containers running, record degraded status, and exit non-zero when email configuration is missing or delivery retries are exhausted.
    - Preserve machine-readable JSON output and update-status persistence without storing the destination or credentials.
  out:
    - Inbox-placement guarantees beyond provider acceptance.
    - Automatic rollback or backup restoration.
    - Completion notifications through Discord or generic webhooks.
    - New REST, WebSocket, npm SDK, pip SDK, web, or Apple behavior.
    - Changes to issue-report email generation or its recipient selection.

