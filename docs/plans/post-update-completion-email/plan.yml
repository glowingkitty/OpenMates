clarification:
  rounds:
    - question: Should missing or failed completion-email delivery affect update status?
      answer: Yes. The updated containers remain running, but status is degraded and the command exits non-zero.
    - question: What exact completion contract should apply?
      answer: Every image or source update sends one admin email after all accepted checks, with version, role, time, and the best release, pull-request, commit, or source link.
  vision_summary: >
    Email delivery is a mandatory final post-update check rather than a best-effort
    notification. Provider acceptance completes the update; missing configuration
    or exhausted delivery is a visible degraded state without rollback.
  approved_by_user: true

