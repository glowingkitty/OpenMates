  - id: D-2
    status: active
    decision: Failed bucket creation degrades and retries storage reconciliation without blocking API startup.
    reason: Core chat and signup must remain available during object-storage provider failures.
    decided_at: "2026-09-04T00:00:00Z"
  - id: D-3
    status: active
