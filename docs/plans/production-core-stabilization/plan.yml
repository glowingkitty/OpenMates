rollout:
  production_approval: approved_for_bucket_creation_only
  application_deploy_approval: required_after_dev_evidence
  rollback: forbidden_without_new_explicit_user_approval
  order:
    - Prove the exact missing managed replica bucket set without mutation.
    - Run focused unit tests and verify idempotent creation behavior.
    - Execute approved production bucket creation and verify all configured replicas and policies.
    - Complete and deploy the scoped chat/runtime hotfix to dev.
    - Run deployed cold-chat and voice-chat evidence against the exact dev revision.
    - Present evidence and exact application image revisions for production deployment approval.

