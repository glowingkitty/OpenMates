    reason: The user selected forward hotfixes as the primary stabilization path.
    decided_at: "2026-09-04T00:00:00Z"

technical_boundaries:
  endpoints_changed: []
  access_model: internal-only startup reconciliation and existing first-party encrypted chat synchronization
  auth: Existing server-side storage credentials and authenticated first-party chat session rules remain unchanged.
  limits: Bucket creation is limited to configured regions and managed replicated bucket definitions.
  billing: No credit or provider-billing behavior changes.
  encryption: Bucket names and policies contain no chat plaintext or keys; chat metadata remains encrypted with the existing chat key.

scenarios:
  - id: S-1
    title: Missing regional bucket self-provisions
    given: [A managed replicated bucket is missing in a configured replica region.]
    when: [Background storage reconciliation runs.]
    then:
      - The bucket is created once through that region's client.
      - Existing ACL, lifecycle, and CORS policy is applied.
      - A later reconciliation observes the bucket and does not recreate it.
  - id: S-2
    title: Excluded buckets remain untouched
    given: [A bucket is unmanaged or excluded from regional replication.]
    when: [Regional reconciliation runs.]
    then: [The bucket is not inspected, created, or policy-mutated as a regional replica.]
  - id: S-3
    title: Regional creation failure is retryable
    given: [A configured provider region rejects or times out during bucket creation.]
    when: [Regional reconciliation runs.]
    then:
      - API startup and core chat remain available.
      - Storage is visibly degraded.
      - The existing bounded background retry attempts reconciliation again.
  - id: S-4
    title: Speech preference does not discard generated summary
    given: [A first voice-authored chat persists its encrypted auto-speak preference while AI post-processing is in flight.]
    when: [Post-processing returns a summary from the turn's original metadata version.]
    then:
      - The summary is encrypted and persisted unless the summary field itself was changed by a newer user edit.
      - The encrypted speech preference remains persisted.
  - id: S-5
    title: Late encrypted metadata repairs active header
    given: [Cold boot activates a chat before its authoritative encrypted metadata is available.]
    when: [Phase-one metadata and the chat key become available.]
    then:
      - The active title, icon, and category update without reopening the chat.
      - The update does not enter a repeated resume loop.

