goal: >
  Stabilize production without rollback by fixing the confirmed encrypted chat
  summary, late-metadata header, image-processing, and account-deletion
  regressions through verified forward hotfixes. Regional bucket provisioning is
  complete; historical S3 backfill and failover-readiness work is explicitly
  deferred.

scope:
  in:
    - Create missing managed replicated buckets in every configured region during background reconciliation.
    - Preserve unmanaged and explicitly non-replicated bucket exclusions.
    - Apply the existing ACL, lifecycle, and CORS policy after creation.
    - Surface failed creation as degraded storage and retry without blocking API startup.
    - Prevent assistant speech preference persistence from discarding generated chat summaries.
    - Repair the active chat title/icon/category when authoritative encrypted metadata arrives after cold boot.
    - Investigate and fix any shared cause of missing chat keys or ciphertext fingerprint mismatches required for safe production rollout.
    - Include the already implemented runtime locale and Alertmanager packaging repair.
    - Restore account deletion inventory against the deployed usage-summary and task-archive schemas.
    - Verify the exact production mutation set before creating buckets or deploying code.
  out:
    - Historical S3 object backfill, source-of-truth selection, or failover-readiness claims; these require a separate non-mutating inventory and migration Plan later.
    - Production core-journey and branch-protection redesign.
    - Signup and live-card billing changes except post-stabilization verification.
    - New storage regions, renamed buckets, product-media replication, or temporary-media replication.
    - Rollback without a new explicit user approval.
    - Unrelated product redesign while stabilizing production.

context_discovery:
  production_findings:
    - Production web, API, workers, Directus, and setup use revision 8aa9fd4e834ce460014f4f144e287ffadc4942a0.
    - Directus schema setup completed and the new chat metadata columns exist.
    - Active-region startup creates missing managed buckets, while replica-region reconciliation logs and skips missing buckets.
    - Configured-region parsing defaults official cloud to nbg1, fsn1, and hel1; production lacks the fsn1 and hel1 replicas.
    - Two production chats discarded summaries when speech preference advanced metadata_v from 1 to 2.
    - Cold reload resumed the reported chat as Untitled chat and did not repair its active header after phase-one metadata arrived.
    - Production logs also contain missing-key and ciphertext-fingerprint mismatch evidence that must be bounded before rollout.
    - Hotfix PR 513 is deployed at main revision 152babc3e4cc63af2386d319821aaeb9c8062e29; core runtime verification, the exact reported share, a fresh free chat, and the EMH2K regression test pass.
    - The production signup journey completes account creation, then the dormant smoke blocks on a stale gift-card code; its cleanup exposed account deletion querying usage summary collections with the wrong owner field.
  source_patterns:
    - backend/core/api/app/services/s3/service.py owns active and regional bucket reconciliation.
    - backend/core/api/main.py runs reconciliation in a retrying background task so provider failure does not block startup.
    - frontend/packages/ui/src/services/assistantSpeechPreference.ts advances encrypted metadata versions.
    - frontend/packages/ui/src/services/chatSyncServiceHandlersAI.ts protects user-authored metadata from stale post-processing.
    - frontend/packages/ui/src/components/ActiveChat.svelte and chat sync events own active header recovery.

clarification:
  rounds:
    - question: Should missing configured regional buckets be created automatically while preserving exclusions?
      answer: Yes; implement and run automatic creation in production, preserving exclusions.
    - question: Should failed regional creation block core startup?
      answer: No; preserve non-blocking startup, expose degradation, and retry.
    - question: Is rollback authorized as part of this Plan?
      answer: No; rollback remains a last resort requiring separate explicit approval.
  vision_summary: >
    Use a narrow forward hotfix to restore production. Prove idempotent regional
    provisioning and core chat repairs first, inspect the exact production
    mutation set, then execute only the approved bucket provisioning and scoped
    release. Discuss broader production test gates only after stabilization.
  approved_by_user: true

