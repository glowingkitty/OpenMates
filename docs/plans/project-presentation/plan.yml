schema_version: 2
id: project-presentation
title: Project descriptions, icons and categories
status: implementing
goal: 'Project tiles in the Projects workspace show a short one-line description, a fitting icon and the gradient
  of the Project''s category, the same category gradients chats use. The assistant writes all three when it creates
  a Project, in the same turn and without an extra model call, and refreshes them once when the user approves a
  Specification. Everything stays encrypted with the Project key like chat titles and summaries. A field the user
  edits by hand is never overwritten by the assistant again. Existing Projects are backfilled once by the client
  the next time it opens the Projects workspace. No image generation (TASK-1261 stays parked). Apple follows through
  the Apple chat.

  '
scope:
  in:
  - Two additive, nullable, Project-key encrypted Directus fields on projects, encrypted_category and encrypted_presentation_state,
    next to the existing encrypted_description and encrypted_icon.
  - The assistant-inferred creation naming call returns name, description, icon and category in one tool call; the
    projects.create skill takes description, icon and category as tool arguments; the create request carries them
    as optional plaintext fields that only the client encrypts.
  - A first-party route POST /v1/projects/presentation/suggest that turns transient plaintext context into a description,
    icon and category with one small model call and stores nothing.
  - Shared Rust core policy for normalising a proposal, the per-field manual-edit lock, the once-only Specification
    refresh, backfill eligibility and the dominant-category rule; web uses it through the existing Project decision
    unit.
  - Web Project tiles (recent row and Show all grid) with description, icon and category gradient; manual edit of
    description, icon and category in the Project header; refresh after Specification approval; one-time backfill.
  - CLI project show/list output and projects update flags for icon and category.
  out:
  - Image generation or uploaded icons (TASK-1261).
  - Apple implementation (handed to the Apple chat with the final behaviour).
  - Re-describing a Project on every change; only creation, the first Specification approval and the one-time backfill
    write automatically.
decisions:
- id: D-1
  status: active
  decision: Category and the presentation state live in their own encrypted fields so the list call returns everything
    a tile needs. The state is JSON {"v":1,"sources":{"description":"assistant|backfill|user","icon":...,"category":...},
    "specification_refreshed":bool,"backfilled":bool}. The server sees only ciphertext.
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-2
  status: active
  decision: Creation reuses the existing short naming call (Mistral Small) and asks it for the description, icon
    and category in the same tool call, so creation costs no extra model call. The projects.create skill gets them
    from the main model's tool call.
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-3
  status: active
  decision: After the user approves a Specification the client sends its title and summary to the suggest route
    (the same transient-plaintext pattern as chat processing) and writes the result once; later approvals do not
    rewrite.
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-4
  status: active
  decision: 'A Project without presentation state is backfilled once by the client that can decrypt it, the next
    time it opens the Projects workspace: up to five Projects per visit, one after the other, from the name, item
    names and chat titles. A thin Project gets an icon and category but no invented description.'
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-5
  status: active
  decision: 'Mixed Projects: the strongest evidence wins. At creation the user''s request decides. On Specification
    approval the Specification decides. On backfill the category most of the Project''s chats share wins, ties go
    to the most recently updated of those chats, and without categorised chats the model decides from the name and
    contents.'
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-6
  status: active
  decision: Every manual edit of description, icon or category marks that field as user sourced; automatic writes
    skip user-sourced fields. Clearing the description by hand is also a user choice and stays empty.
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
- id: D-7
  status: active
  decision: The suggest route is first-party only (session auth, no API keys), rate limited to 20 per minute per
    user, and charges no credits, like /v1/projects/ask/plan. One call is about 600 input and 60 output tokens on
    Mistral Small, roughly USD 0.0001.
  reason: Owner request TASK-1807 (Marco, 2026-11-21); chosen as the simplest rule that keeps client-side encryption.
  decided_at: '2026-11-21'
scenarios:
- id: S-1
  title: Assistant creates a Project
  given:
  - A user asks the assistant to build a multi-file app in a chat.
  when:
  - The assistant creates the Project in that turn.
  then:
  - The Project tile shows the description
  - icon and category gradient chosen in the naming call.
- id: S-2
  title: Specification approval refreshes once
  given:
  - A Project whose description the user has not edited.
  when:
  - The user approves a Specification
  - then approves another later.
  then:
  - The first approval rewrites description
  - icon and category; the second changes nothing.
- id: S-3
  title: Manual edits are kept
  given:
  - The user changed the icon and category by hand.
  when:
  - A Specification is approved.
  then:
  - Icon and category stay as the user chose; only non-user fields change.
- id: S-4
  title: Existing Projects are backfilled once
  given:
  - A Project created before this feature
  - without presentation state.
  when:
  - The user opens the Projects workspace.
  then:
  - The client fills description
  - icon and category once and the tile shows them.
