schema_version: 2
id: jev-context-routing
title: Jev Routing Context And Model-Aware Long-Chat Continuity
status: implementing

goal: >
  Use Jev for bounded, reliable routing without constraining the main model to
  Jev's context window, while preserving trustworthy conversation summaries,
  model-specific context capacity, and references to older chat artifacts across
  compression with existing generative and provider fallbacks intact.

scope:
  in:
    - Pass the validated current chat summary to Jev as bounded conversation data, never as instructions.
    - Compute main-model history and compression budgets from configured model context, prompt/tool overhead, expected output, and a safety reserve.
    - Preserve a content-free artifact reference ledger across compression and merge it into later inference requests.
    - Keep Jev's message projection independently bounded rather than compressing the whole chat at 32k.
    - Preserve existing generative, compression, and provider fallbacks.
    - Add focused backend tests and relevant long-chat product coverage.
  out:
    - Sending image bytes or document contents to Jev.
    - Making Jev a text-generation model or charging users for preprocessing.
    - Changing client-visible credit pricing.
    - Removing the existing Groq or generative safety fallback.

scenarios:
  - id: S-1
    title: Bounded Jev routing retains older conversation signal
    given: [A long chat has a fresh trusted chat summary and recent messages.]
    when: [Jev preprocessing evaluates the latest request.]
    then:
      - Jev receives recent messages and a separately typed bounded summary.
      - Summary text is labeled conversation data and never becomes an instruction.
      - Jev failure still invokes the existing generative fallback.
  - id: S-2
    title: Main-model capacity governs long-chat context
    given: [The selected main model has configured context and output limits.]
    when: [OpenMates prepares or compresses its history.]
    then:
      - The history budget subtracts actual system and tool overhead, expected output, and a safety reserve.
      - Jev's smaller input bound does not force whole-chat compression.
  - id: S-3
    title: Older artifact references survive compression
    given: [A chat contains uploaded artifacts whose source messages become compressed.]
    when: [The user later refers to one of those artifacts.]
    then:
      - A content-free encrypted ledger restores the artifact reference mapping.
      - Artifact bytes and extracted contents are not stored in the ledger or sent to Jev.
      - Ledger failure is non-fatal.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Jev receives at most a bounded summary field explicitly labeled as conversation data, with existing fallback preserved.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND]
  - id: AC-2
    scenario: S-2
    text: Main history truncation and compression derive their budgets from the selected model context with explicit overhead and reserves.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND]
  - id: AC-3
    scenario: S-3
    text: Old artifact references remain resolvable after compression without storing artifact contents in the ledger.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND, T-LONG-CHAT]

tests:
  - id: T-BACKEND
    type: pytest
    file: backend/tests
    command: python3 -m pytest backend/tests/test_preprocessor_jev.py backend/tests/test_model_context_budget.py backend/tests/test_artifact_ledger.py
    assertions:
      - Jev summary projection is typed and bounded.
      - Context budgets follow selected model configuration.
      - Artifact mappings survive compression without content persistence.
    covers: [AC-1, AC-2, AC-3]
    red_phase:
      required: true
      expected: fail_before_implementation
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}
  - id: T-LONG-CHAT
    type: playwright
    file: frontend/apps/web_app/tests/long-chat-history.spec.ts
    command: python3 scripts/ci_coordinator.py submit --spec frontend/apps/web_app/tests/long-chat-history.spec.ts
    target: app.dev.openmates.org
    execution_environment: isolated_github_ci
    assertions: [Long-chat compression remains transparent to the active chat.]
    covers: [AC-3]
    red_phase:
      required: false
      expected: existing_coverage
      evidence: {}
    green_phase:
      required: true
      expected: pass
      evidence: {}

tasks:
  - id: TASK-1
    title: Implement and verify Jev context, model budgets, and artifact continuity
    status: in_progress
    phase: working_tasks
    covers:
      scenarios: [S-1, S-2, S-3]
      acceptance_criteria: [AC-1, AC-2, AC-3]
    expected_files:
      - backend/apps/ai/processing/jev_preprocessing.py
      - backend/apps/ai/processing/chat_compressor.py
      - backend/apps/ai/processing/main_processor.py
      - backend/apps/ai/tasks/ask_skill_task.py
      - backend/tests
    verification_ids: [T-BACKEND, T-LONG-CHAT]
    dependencies: []
    blockers: []
    follow_up_tasks: []
    ownership:
      files: [backend/apps/ai, backend/tests]
      shared_files: []

implementation_state:
  subject_commit: pending

approvals:
  specification:
    status: not_required
    reason: These changes implement existing approved privacy, fallback, and long-chat behavior without changing the user-facing contract.
  plan:
    status: approved
    approved_at: "2026-09-22T00:00:00Z"

decisions:
  - id: D-1
    status: active
    decision: Treat the chat summary as typed conversation data in Jev state, separate from questions and policy.
    reason: This adds older-chat routing signal without allowing summary text to become model instructions.
    decided_at: "2026-09-22T00:00:00Z"
  - id: D-2
    status: active
    decision: Derive the main history budget from selected-model configuration and actual prompt/tool estimates.
    reason: A global history cap wastes larger contexts and can overflow smaller ones after non-history overhead.
    decided_at: "2026-09-22T00:00:00Z"
  - id: D-3
    status: active
    decision: Persist only encrypted artifact reference metadata across compression.
    reason: Stable references are needed after raw turns are compacted, while filenames and identifiers still require privacy protection.
    decided_at: "2026-09-22T00:00:00Z"
  - id: D-4
    status: active
    decision: Keep Jev input bounded locally and leave whole-chat compression governed by the selected main model.
    reason: Jev's routing context must not become the limiting context window for answer generation.
    decided_at: "2026-09-22T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Map the four approved recommendations to existing preprocessing, compression, and embed-resolution paths.
    outcome: succeeded
    recorded_at: "2026-09-22T00:00:00Z"

handoff:
  current_task_id: TASK-1
  next_action: Implement the approved changes and run focused backend and isolated product checks.
  command: python3 -m pytest backend/tests/test_preprocessor_jev.py backend/tests/test_model_context_budget.py backend/tests/test_artifact_ledger.py
  expected_outcome: Focused backend tests and isolated long-chat coverage pass.
  last_verified_commit: pending
  blocker: null
