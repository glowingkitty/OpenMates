      nested_finalization_ms: 8707
      final_task_billing_ms: 5048
      final_task_billing_outcome: error
      final_task_billing_error: httpx.ReadTimeout
    approved_design:
      - Compact app and Project routing chooses relevant apps and eligible Project Focus before main setup, while explicit @Project or @focus bypasses inferred discovery.
      - Each Project supports delayed default, immediate, or approval activation; legacy auto_selection:false remains disabled. Consent guards every full Focus instruction and Memory load.
      - Optional custom Focus selection sees eligible names and short descriptions before consent, runs only for a nonempty custom catalog, and reuses the app shortlist after activation for skills and other context.
      - A single bounded Search files request may return small text with path, source and hash for inference; result cards persist original references only and reopen the current authorized original with a changed-hash notice.
      - Diagnose and repair final billing timeout with durable idempotent settlement and accurate token/credit receipts before treating the request as successful.
    acceptance_target:
      main_model_calls_after_focus: 2
      measured_latest_main_model_calls_after_focus: 3
      comparison_rule: Compare only completed passing runs against the same baseline scope; report post-focus time, main and Jev tokens, and whole accepted-turn reported input without double-counting nested phases.
    note: >-
      Stage setup, model windows and finalization are nested in the nonoverlapping
      task timeline and must not be added to end-to-end time. The user rejects
      the remaining latency as unsuitable for everyday use; this Plan and Task
      remain in progress for the approved optimization. The timed-out billing
      request already uses an idempotency key, but the final token/credit receipt
      can be absent after a timeout while server settlement may still finish.
      Shortening the timeout or treating this as harmless asynchronous billing
      would not preserve correct settlement semantics.
