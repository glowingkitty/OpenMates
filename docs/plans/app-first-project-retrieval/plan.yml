    note: >-
      One full passing real-inference replay. Token comparison includes pre-focus
      primary, preprocessing and main calls, including cached input; auxiliary
      title/processing and postprocessing calls are excluded consistently with
      baseline. These are reported usage counts, not provider invoice totals.
      Earlier optimized replays completed processing in 29.574 and 26.579 seconds
      but failed cleanup and reference-card visibility respectively; their
      recordings remain retained and delivered. The latest passing run still
      takes too long for a simple README request.
  remaining_speed_work:
    status: recommendations-for-discussion
    measured_latest_run:
      first_task_to_search_request_ms: 5924.594
      search_request_to_result_ms: 2035
      search_result_to_next_task_ms: 111.524
      second_task_to_read_request_ms: 5663.476
      read_request_to_result_ms: 4561
