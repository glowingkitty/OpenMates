    checks:
      - Rejection preserves unavailable Project tools and clean chat deletion.
      - Cancellable countdown activates the intended Project before retrieval.
      - Filename search and original README read succeed with translated reference previews.
      - Saved encrypted embeds contain references without file bytes.
