      nested_finalization_ms: 8707
      final_task_billing_ms: 5048
      final_task_billing_outcome: error
      final_task_billing_error: httpx.ReadTimeout
    recommendations:
      - Execute a bounded named-file retrieval plan after authorization, avoiding model-mediated search then read decisions.
      - Reuse revision-checked agentic context while preserving current access checks.
      - Diagnose the read and reference-publication stages independently.
      - Instrument billing API admission, durable settlement and response; repair the internal HTTP timeout before assessing durable pending settlement acknowledgements.
    note: >-
      Stage setup, model windows and finalization are nested in the nonoverlapping
      task timeline and must not be added to end-to-end time. The user rejects
      the remaining latency as unsuitable for everyday use; this Plan and Task
      remain in progress for the next agreed optimization. The timed-out billing
      request already uses an idempotency key, but the final token/credit receipt
      can be absent after a timeout while server settlement may still finish.
      Shortening the timeout or treating this as harmless asynchronous billing
      would not preserve correct settlement semantics.
