schema_version: 2
profile: concise
id: app-first-project-retrieval
title: App-first preprocessing and fast Project retrieval
status: verified
goal: >-
  Implement and test the agreed processing changes, ensure processing speed is
  drastically improved and token usage reduced, and give a numerical before/after
  comparison and video proof of the original Project README request.
authorization:
  source: Five sequential questions answered on 2026-10-08, followed by explicit architecture approval on 2026-10-09 in the same Codex chat.
  decisions:
    - Apply app-first preprocessing across all apps; stage 1 can select multiple relevant apps and stage 2 selects their skills plus other required preprocessing outputs.
    - Repeat affected selection when focus activation introduces new authorized context; Project-specific context remains hidden before consent.
    - Remove all separate AI injection-scanning requests for Project file results, preserving local privacy masking and deterministic access controls.
    - Expose separate Search files and Search text tools backed by the existing bounded client search executor; remove unfinished legacy Projects search execution.
    - Show UI progress during file jobs and resume the model on results without waiting-only model calls.
    - Move inferred Project Focus before main-model setup. Keep explicit @Project/@focus selection authoritative, three per-Project activation policies, and legacy disabled compatibility.
    - Route using optional custom Focus names and descriptions before consent; expose full instructions and memories only after activation. Skip custom Focus selection when its catalog is empty.
    - Include bounded small text in one Search files result and keep saved cards as references to current originals, with content-change notices.
    - Preserve accurate, idempotent durable billing while optimizing the simple README path.
  task: 6c2b7b9e-e472-421c-9f1f-0c76bfa51723
  session: 6aa3
scope:
  in:
    - Two bounded routing phases with explicit overrides and required global decisions preserved.
    - Trusted reuse within the same user turn and targeted refresh after newly authorized focus context.
    - Focus-scoped typed file operations and reference-only result previews.
    - Exact README scenario, rejection and offline checks, latency/token measurements and retained recordings.
    - User-approved second optimization pass: pre-main Focus routing, optional custom Focus choice, single-search small-text retrieval, reference freshness, and reliable billing settlement.
  out:
    - Terminal risk-review or explanation redesign.
    - New providers, changing answer models, production deployment, and broad unrelated privacy/UI repairs.
references:
  contracts:
    - projects.files.search-scoped
    - projects.files.search-consistent
    - projects.files.executor-wait
    - projects.files.chat-focus-required
    - projects.focus.inferred-consent
    - projects.files.no-server-decryption-authority
    - projects.files.search-result-lifecycle
    - projects.focus.auto-selection-setting
    - projects.focus.custom-catalog-privacy
    - ai-model-routing.precedence.chat-over-tier-over-auto
  contract_note: >-
    Projects owns the user-visible search, consent, Focus setting, and saved-result
    semantics. The 2026-10-09 approval adds those outcomes to the owning draft
    bundle; this Plan records the implementation and measured performance target.
    The earlier single-stage optimization Plan remains historical.
checks:
  required:
    - Focused backend tests for app routing, trusted continuation, scope freshness, target mapping and absence of output scanning.
    - Focused frontend unit checks and isolated browser coverage for actual progress and reference rendering.
    - Scoped dev deployment followed by the exact real-inference README request using disposable fixtures and leased runtime/account.
    - Compare post-focus latency, main-model iterations and reported Jev/main token usage with the retained baseline; do not sum overlapping phases.
    - Deliver all retained browser recordings, including failures and retries, with a concise numerical comparison.
    - Add focused routing, policy, custom Focus, search-content, card-freshness and billing tests; preserve the exact real-AI prompt "suggestions how to improve the readme of my OpenMates project?" as a user-observable regression.
processing_flow:
  - Structured @Project or @Focus starts the explicitly chosen Focus without inferred routing.
  - For inferred requests, compact Jev routing selects relevant apps and an eligible Project before main-model setup.
  - Only a selected Project with a nonempty custom Focus catalog needs optional Jev selection from names and descriptions. Full instructions and memories remain hidden before consent.
  - Current Project policy controls delayed, immediate, or approval activation. After activation, scoped preprocessing selects skills and other authorized context using the existing app shortlist.
  - The main model dispatches one bounded Search files request that can include small full text, path, source and hash. WebSocket progress continues while the executor runs and the model pauses.
  - Client privacy masking and deterministic access controls precede model access; there is no separate AI content scan.
  - Same-turn continuations reuse server-owned routing decisions after fresh scope and credit checks. Private file text crosses the worker boundary through transient encrypted memory and is available only to answer inference.
  - Saved result embeds contain original references only. Cloud references open the existing embed; remote references fetch the current authorized original while its source is online. Changed hashes show a notice.
  - Durable idempotent billing remains required; asynchronous dependency admission removes blocking thread queues without treating a failed settlement as success.
