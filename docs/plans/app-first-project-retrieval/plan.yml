    limits_and_next_improvements:
      - These are individual successful observations, not a p95 latency guarantee or provider-invoice reconciliation. Routing/main token totals include cached input and exclude auxiliary metadata calls consistently with the baseline.
      - The 37.6-second larger improvement request remains too slow for everyday use; the architecture reduces serial calls but does not establish an acceptable general latency SLO.
      - Keep accurate durable billing, but move recoverable postcommit projections/notifications behind a durable outbox; observed waits still vary from 1.1 to 4.2 seconds.
      - Reuse authorized same-turn context with fresh identity/scope fences and parallelize independent metadata reads; both main calls still assemble context.
      - Bound response verbosity and preserve streaming; the larger answer produced 1154 tokens and its provider window was 12.3 seconds. Changing answer models remains outside the approved scope.
      - Instrument executor, transport and local privacy stages separately; the measured 3.0-6.3-second file-job window includes all three and is not a file-I/O-only or privacy-only measurement.
