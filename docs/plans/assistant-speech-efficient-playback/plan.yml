schema_version: 2
id: assistant-speech-efficient-playback
title: Faster, demand-driven assistant response speech
status: draft
goal: >
  Make assistant speech feel faster, generate only paragraphs a listener is likely
  to hear, keep playback continuous when generation is timely, give gentle audible
  feedback while a selected paragraph is pending, and charge exactly for generated
  speech without duplicate or missing credits.

scope:
  in:
    - Assistant response speech after voice messages, chat Auto speak response, and the web Speak response action.
    - Versioned mate voice profiles, browser playback, paragraph dispatch, cancellation, and speech billing.
    - Existing encrypted segment files, owner authorization, replay, and chat usage attribution.
  out:
    - The separately invoked audio.speak app skill and its pricing.
    - Changing CLI batch-generation semantics without a separate CLI decision.
    - Relaying partial provider audio or plaintext to the browser.

current_state:
  - Assistant response speech sends ElevenLabs voice_settings.speed 1.1 for the eleven_v3_conversational profile; browser playback has no playbackRate setting.
  - Automatic speech dispatches each immutable segment as the AI emits it. The manual web request sends all projected segments and dispatches every missing one immediately.
  - Close dismisses local playback but leaves already queued generation running; Stop cancels only unclaimed queued work.
  - The existing billing worker sums ready character counts once a sealed manifest has no queued, generating, or retryable-error segments. A manifest marked committed is not revisited for a later successful retry.
  - One historical-message real-provider smoke recorded one 3-credit usage entry for one 29-character segment and no extra charge on replay. It does not prove multi-segment stop/retry billing.

decisions:
  - id: pace
    status: active
    decision: >
      Verify the live model's response to the current 1.1 speed request with a
      short paired sample, because ElevenLabs documentation conflicts about
      v3 speed support. Prefer a provider speed of up to 1.2 if it measurably
      works and remains intelligible. Otherwise use a modest pitch-preserving
      playback rate on assistant speech only, consistently for generated and
      cached clips. Do not transcode and store duplicate faster assets.
    reason: The live model's support is unclear and the current browser queue has no rate adjustment.
    decided_at: '2026-09-24'
  - id: demand
    status: active
    decision: >
      Register immutable paragraph identities and chapter order as they appear,
      but dispatch only the first playable paragraph. Keep later speakable text
      transient in the authorized client or existing AI stream until requested;
      durable metadata contains no plaintext. Reuse matching ready assets.
      Starting the next response, Close, or Stop cancels unclaimed work and
      prevents further prefetch. An in-flight provider call may finish and be
      charged if its asset becomes ready.
    reason: Waiting to dispatch unplayed text is the direct provider-cost reduction.
    decided_at: '2026-09-24'
  - id: prefetch
    status: active
    decision: >
      Prefetch at most one next paragraph while actually playing. Trigger when
      remaining playback time is at most the measured p95 of request, safety,
      synthesis, encryption, publication, and client decryption latency plus a
      small margin. Use an initial 6-second lead until measurements are available;
      request immediately at playback start when the current paragraph is shorter
      than that lead. Recalculate on seek, rate change, pause, resume, and skip.
      Do not claim a zero-gap guarantee when provider latency exceeds the lead.
    reason: Playback time and measured end-to-end readiness latency bound the best useful lead.
    decided_at: '2026-09-24'
  - id: pending_sound
    status: active
    decision: >
      Selecting an unready paragraph dispatches it immediately, makes it current,
      and repeats a calm prerecorded, locally bundled confirmation cue at a
      restrained interval while waiting. Stop the cue immediately on ready,
      pause, Close, failure, or a different selection. No provider request or
      credit charge is created for the cue. Respect browser autoplay policy and
      keep the existing visible Loading/retry controls.
    reason: A static cue gives feedback during an unavoidable selected-chapter wait without provider cost.
    decided_at: '2026-09-24'
  - id: billing
    status: active
    decision: >
      Settle each newly ready provider-generated segment promptly and idempotently.
      Maintain a monotone, message-scoped count of settled characters and charge
      only the increase in ceil(total/14), so paragraph boundaries do not change
      the user's total price. Use a durable segment-specific settlement identity
      and atomic manifest claim to survive concurrent workers and retries. A
      zero-credit increment is still recorded as settled. Group segment charges
      into one message total in usage UI. This changes the existing one-row
      contract and needs a reviewed Specification update before implementation.
    reason: Waiting for every paragraph to finish cannot promptly settle a response whose later paragraphs may never be requested.
    decided_at: '2026-09-24'

