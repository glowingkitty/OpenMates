  plan: {status: pending}

scenarios:
  - id: S-1
    title: A user starts and stops a spoken response
    given:
      - A response has several paragraphs and only the first has a ready file.
    when:
      - The listener stops during the first paragraph.
    then:
      - Later paragraphs have no provider request or charge, and the first ready file can be replayed.
  - id: S-2
    title: A listener continues or skips ahead
    given:
      - The next chapter is unready and provider readiness latency has been measured.
    when:
      - Playback nears the current chapter end or the listener selects a later chapter.
    then:
      - Only the needed chapter is requested; speech continues when ready and a calm cue repeats during a selected wait.
  - id: S-3
    title: A generated chapter is charged once
    given:
      - The provider generated a paragraph and its encrypted asset became ready.
    when:
      - Billing retries, the user stops, or another paragraph later becomes ready.
    then:
      - Exactly the cumulative rounded increase is charged once and the usage total remains attributable to the assistant message.
  - id: S-4
    title: The assistant speaks at a more useful pace
    given:
      - A supported mate voice speaks generated and cached chapters.
    when:
      - The listener plays the response at its default pace.
    then:
      - Speech is audibly faster yet intelligible, with accurate chapter timing and no duplicate audio asset.

implementation:
  - Amend feature.assistant-response-speech examples and assertions for Close/Stop cancellation, demand-driven generation, pending cue, pace, and incremental billing; get the exact Specification approval required by the existing product workflow.
  - Measure short/long paragraph provider and asset-ready latency, and paired audible pace for a few mate voices and languages without logging text. Pick a supported speed strategy and a lead time from that evidence.
  - Add an owner-scoped, idempotent dispatch action for one registered segment. For streamed auto-speak, retain only bounded transient plaintext until playback asks for it; a reload may reproject from the owner's decrypted message through the existing request path. Reject stale source hashes, voice versions, or superseded messages.
  - Drive dispatch from queue playback time and explicit chapter selection; use ready-asset reuse, one-ahead prefetch, backpressure, and cancellation of unclaimed work. Preserve the existing first-segment and autoplay behavior.
  - Add the pending cue with a single lifecycle owner, then tune it in component preview for mobile and desktop and in browser playback tests.
  - Add a durable incremental billing ledger and idempotent internal charge identities. Reconcile provider-success/asset-ready, retries, stop, crash-after-charge, and delayed billing failures. Keep failed, cached, and prerecorded clips free; flag unsettled ready segments for repair.
  - Report segment dispatch count, cancelled-before-dispatch count, latency to ready, paragraph transition gap, and billed-vs-ready character totals without plaintext or default user identifiers. Compare provider calls and billed credits before and after on short-listening scenarios.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Voice-message, Auto speak, and manual web paths request the first needed paragraph; stopping prevents later provider calls and charges while preserving ready-file replay.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-WEB]
  - id: AC-2
    scenario: S-2
    text: Continuous listening prefetches only one next chapter near its end; skipping requests the selected chapter once and plays a static cue only while waiting.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-QUEUE, T-WEB]
  - id: AC-3
    scenario: S-3
    text: Each ready provider-generated chapter settles once; total credits equal message-level rounded characters after stop, retry, races, and later chapters.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BILLING]
  - id: AC-4
    scenario: S-4
    text: Paired real-provider samples or pitch-preserving playback verify faster intelligible narration for generated and replayed chapters.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: manual
    verification_ids: [T-PACE]

