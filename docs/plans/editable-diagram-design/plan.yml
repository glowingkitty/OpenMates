schema_version: 2
profile: concise
id: editable-diagram-design
title: Editable Diagram Design embeds
status: implementing
goal: >
  Fully implement and test Diagram Design in OpenMates with the same visual
  quality, copied and audited prompts instead of a package dependency, concise
  JEV app/type selection, scaled diagram embed previews and HTML fullscreen
  viewing, plus text editing and moving components saved through encrypted
  diff-based embed revisions. Show screenshots of the web app rendering.
authorization:
  source: codex:01a12a18-811c-78b3-930b-e27057bfa7dd
  task: 769a5d8f-eb46-4af2-905a-7bdc9095a25c
  scope: User explicitly approved the reviewed architecture and requested full implementation, testing and editing.
scope:
  in:
    - Copy and audit the upstream MIT prompts, with provenance and all 44 type guides.
    - One concise stage-1 capability summary and stage-2 type Memory metadata; full selected guidance only enters main generation.
    - Original complete HTML and inline SVG as the canonical editable artifact, with a dedicated streaming fence and direct embed.
    - Uniformly scaled preview, matching fullscreen composition and background, zoom/pan, source export and version-compatible source extraction.
    - Top-right pen Edit action immediately left of Close with matching styling, inline text changes, component dragging, cancel/undo/save and conflict feedback.
    - Client-encrypted head and existing diff history committed together with owner/chat authorization, expected-revision checks and retry-safe receipts.
    - Focused backend/CLI/web checks, isolated browser CI, multiple real natural-language dev requests, screenshots of their actual diagram artifacts and recording delivery.
  out:
    - Native Apple and TUI graphical editors; preserve the source/metadata contract for later implementations.
    - New third-party runtime/package dependency or provider calls.
    - Replacing upstream composition with a generic graph renderer.
decisions:
  - Original SVG geometry, whitespace, hierarchy and semantic decoration remain authoritative; palette/font adaptation is narrowly scoped.
  - Static diagrams run in an opaque sandbox; only the trusted OpenMates editor runtime can execute, with source/token-checked messaging.
  - Stage-2 type selection uses short app-owned Memory metadata without loading every guide body or loosening generic Memory limits.
  - Ordinary chat diagram edits receive an atomic revision path; Project-file approval gates remain authoritative and cannot be bypassed.
acceptance:
  - All 44 guides are discoverable and audited; selected full instructions retain upstream design guidance and MIT attribution.
  - Generated artifacts stream as diagram embeds, preserve canonical source and render safely after reload.
  - Preview/fullscreen preserve the complete upstream composition on laptop and phone viewports, with surround matching the diagram background.
  - The pen Edit button is immediately left of Close with matching dimensions and alignment.
  - Text edits and component moves can be saved, reloaded and inspected through encrypted version history; cancel discards changes.
  - Concurrent stale saves, unauthorized writes and Project-file bypasses are rejected without partial head/history writes.
  - Unsafe HTML, executable attributes, external resources and forged iframe messages do not gain execution or edit authority.
  - No Diagram Design package dependency is added.
  - Multiple ordinary natural-language requests generate real diagrams through JEV/main; screenshots show their exact resulting HTML in the web renderer.
required_checks:
  - Prompt provenance/security audit and deterministic selection/loading tests.
  - Focused backend fence/HTML/revision and CLI source/export tests, plus web editor/runtime tests.
  - Bare component Playwright proof before authenticated full-flow Playwright proof in isolated GitHub CI.
  - Three real natural-language requests on the deployed candidate with disposable test-account state, inspected guidance/artifact output and web screenshots of those exact artifacts.
  - Review rendering/editing screenshots and deliver all retained browser/CLI E2E recordings, including retries/failures.
