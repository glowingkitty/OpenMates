    assertions:
      - In-memory and API-facing coordination semantics cover shared leases, exclusive conflict, runtime queueing, and dead-owner-safe release behavior.
    covers:
      - AC-1
      - AC-2
      - AC-7
      - AC-16
    red_phase:
      required: true
      expected: fail_before_fix
      evidence:
        status: failed_as_expected
        timestamp: "2026-08-27T01:06:45Z"
        command: python3 -m pytest backend/engineering_control_plane/tests/test_coordination.py::test_runtime_operations_queue_fifo_for_the_same_resource -q
