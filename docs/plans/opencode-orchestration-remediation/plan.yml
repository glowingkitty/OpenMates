decisions:
  - id: D-1
    status: active
    decision: Pause stopped chats until orchestration readiness is verified.
    reason: Running the chats during the broken flow was wasting tokens and producing suspect test/deploy evidence.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-2
    status: active
    decision: Preserve self-host CLI independence from the private engineering control plane.
    reason: The control plane is for OpenMates engineering coordination only and must not be required by self-hosted users.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-3
    status: active
    decision: Implement narrow deterministic guardrails rather than a full orchestration rewrite.
    reason: The current source already contains a separated control plane, shared leases, and managed worktrees; the failures are specific missing semantics.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-4
    status: active
    decision: Treat every queue poll as an idempotent admission reconciliation point and never manually resurrect terminal operations.
    reason: Release notifications can be interrupted; correctness must converge from durable state without operator mutation.
    decided_at: "2026-08-27T11:00:00Z"
  - id: D-5
    status: active
    decision: Run proof reviewers through the existing OpenCode server and preserve a pure standalone opt-out only when explicitly configured.
    reason: Reviewer permissions are already bounded, while duplicate OpenCode and MCP startup wastes memory and time.
    decided_at: "2026-08-27T11:00:00Z"
  - id: D-6
    status: active
    decision: Shared product Docker services mount one clean integrated runtime checkout, never individual chat worktrees.
    reason: One Compose project with per-chat bind mounts creates silent API/worker split-brain even when lease coordination is correct.
    decided_at: "2026-08-27T11:10:00Z"
  - id: D-7
    status: active
    decision: Harden the existing deploy, lifecycle, verification, resource, and media primitives instead of adding a second coordinator.
    reason: Live chat evidence shows incomplete adoption and unsafe fallbacks in existing paths, while the private control plane already provides leases, operations, dispatches, and cursor events.
    decided_at: "2026-08-27T13:20:00Z"
  - id: D-8
    status: active
    decision: Generic idle auto-continuation remains forbidden; only a durable allowlisted operation may trigger one idempotent continuation.
    reason: This recovers interrupted deterministic work without recreating runaway spec prompts or overriding explicit stop and user-input states.
    decided_at: "2026-08-27T13:20:00Z"

