risks:
  - Runtime queue changes can accidentally serialize too much work if shared and exclusive resources are not differentiated.
  - Queue reconciliation must lock FIFO rows in one order to avoid deadlocks between unrelated waiters.
  - Attached proof review depends on the internal OpenCode server; standalone pure mode remains available by clearing OPENMATES_OPENCODE_SERVER_URL.
  - Broad filename-substring test discovery can turn a focused deploy into an unrelated dependency gate; exact sibling tests and explicit test-file directives take precedence.
  - Advancing shared runtime source can leave long-running Python processes on old imports; recorded commit/container generations force a bounded coherence restart when needed.
  - Reclaiming dead-owner leases must be limited to same-host PIDs so remote live work is not released incorrectly.
  - Hook dedupe must not hide new or changed failures.
  - Resuming chats before readiness checks pass can recreate the same blocking pattern.

