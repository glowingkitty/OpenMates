schema_version: 2
id: opencode-orchestration-remediation
title: OpenCode Orchestration Remediation
status: implementing

goal: >
  Remove the remaining orchestration bottlenecks that keep OpenCode chats from
  completing independently: dead test leases must be reclaimed immediately,
  Docker/runtime operations must queue deterministically, deploy/test evidence
  must stay commit-scoped, deploy file selection must be exact, session state
  and continuation must be durable, prepared verification must work from
  dependency-light worktrees, and restored or child sessions must keep using
  the intended worktree.

scope:
  in:
    - Reclaim same-host dead-owner test leases before they can block Docker or test work until TTL expiry.
    - Make runtime operations idempotent for the same chat and FIFO-queued for different chats that need the same resource.
    - Preserve shared test concurrency while blocking only the operations that truly conflict with exclusive runtime mutation.
    - Keep deploy and lint gates bound to the candidate checkout or integration checkout, never the dirty shared root.
    - Keep browser proof/test runs tied to an immutable expected commit and reject evidence when the tested deployment changes.
    - Ensure restore and child/reviewer flows keep using the parent session worktree or fail with a deterministic recovery action.
    - Deduplicate repeated OpenCode hook routing warnings for the same session, head, and reason.
    - Provide focused regression tests and operational checks before any stopped chats are resumed.
    - Make queued-operation polling reconcile expired leases and missed admission signals transactionally.
    - Report the exact lease or earlier runtime operation that blocks admission.
    - Reuse the running OpenCode server for proof review and emit bounded progress and timeout cleanup.
    - Keep deploy test discovery module-local when an exact sibling test or explicit test-file contract exists.
    - Mount every shared product-code container from one clean integrated runtime checkout and repair mixed generations together.
    - Resolve one immutable deploy manifest and never expand an explicit staged or path selection with historical session files.
    - Route every managed OpenMates worktree deploy through a disposable integration checkout without writing the shared root.
    - Treat a pushed commit as deployed even when the local control-plane checkout cannot fast-forward through unrelated dirty work.
    - Reconcile presence with authoritative OpenCode generation state instead of renewing stale busy records indefinitely.
    - Resume only allowlisted durable operations exactly once after a resource, deployment, dispatch, or compaction interruption becomes ready.
    - Provide lockfile-compatible prepared verification for dependency-light worktrees without per-chat package installation.
    - Persist pending response-media delivery so compaction cannot lose required video or Figma embeds.
    - Prevent idle-event re-entrancy from submitting the same automatic continuation or media-delivery prompt more than once.
    - Include the requested proof device profile in dispatch identity so laptop and phone evidence cannot deduplicate each other.
    - Reject assistant-side sleep polling when the underlying process, GitHub run, or coordinated resource exposes a deterministic completion signal.
  out:
    - Rewriting the full engineering control-plane architecture.
    - Changing product-facing OpenMates behavior, self-hosting CLI behavior, or user-visible UI.
    - Running Apple native jobs on the Mac as part of this remediation.
    - Forcing completion of the stopped feature chats before the orchestration fixes are deployed.
    - Adding control-plane services to normal self-hosted Docker images.

context_discovery:
  prior_specs:
    - docs/plans/independent-engineering-control-plane/plan.yml
  docs:
    - docs/architecture/test-orchestration.md
    - docs/contributing/guides/spec-driven-development.md
    - AGENTS.md
  code_patterns:
    - backend/engineering_control_plane/coordination.py defines the in-memory lease, runtime-operation, dispatch, and event contract.
    - backend/engineering_control_plane/coordination_repository.py persists the same contract in PostgreSQL.
    - scripts/sessions.py owns OpenCode sessions, managed worktrees, deploy gates, Docker locks, runtime operations, restore, and local fallback coordination.
    - scripts/tests.py and scripts/run_tests.py own commit-scoped Playwright/proof execution and shared test resource leases.
    - .opencode/plugins/openmates-hooks.js routes OpenCode tool calls and surfaces routing failures.
  observed_failures:
    - A dead same-host test lease blocked Docker restart admission until the 30 minute TTL.
    - Runtime restart requests reported conflicts instead of behaving like a durable FIFO queue.
    - A same-session Docker wait could look like the session was waiting on itself.
    - A root checkout with unrelated dirty changes blocked restore/deploy workflows that should have used managed worktrees.
    - A child/reviewer session ran relative commands from the root checkout instead of the parent worktree.
    - Hook routing warnings repeated for the same session/head/reason and obscured useful progress.
    - A proof run could become suspect when dev alias deployment moved while the proof was still running.
    - A queued Docker operation remained queued after all visible blockers disappeared because polling did not rerun admission.
    - Standalone proof reviewers each booted a full OpenCode and unrelated MCP stack, consumed roughly 600 MB, and stayed silent for up to ten minutes.
    - The deploy gate mapped engineering_control_plane/api.py to unrelated product API-key tests and failed on dependencies outside the changed component.
    - API and worker containers mounted different chat worktrees and resolved the same HEL1 storage configuration differently while sharing one Compose project.
    - AI Settings staged one file for a correction but deploy commit 9241fd81 also carried five older session-tracked files.
    - The phone proof chat requested a coverage-only follow-up but deploy commit a454fe9b also carried two shared test files.
    - OpenCode reported no active generations while sessions.py continued to report five chats as busy/streaming because the presence timer renewed stale state.
    - AI Settings and Map stopped at deterministic post-validation or post-deploy waits and needed manual continuation messages.
    - The S3 chat could not execute its TypeScript regression because the managed worktree lacked jszip and tsc, then had to diagnose the installed CLI path manually.
    - Successful pushes were described as blocked because unrelated dirty files prevented only the local control-plane checkout from fast-forwarding.
    - A completed S3 chat emitted repeated final responses every 8-10 seconds because the hook used the synchronous prompt SDK call and acknowledged its durable claim only after a re-entrant session.idle event.
    - The Map chat's phone proof request reused the successful laptop dispatch because the control-plane fingerprint included suite and account but omitted proof_video_profile.
    - The daily-test chat launched three detached test controllers, then spent repeated turns alternating `sleep 30` with duplicate log reads instead of blocking once on controller completion.
  user_direction:
    - Create and execute a spec that resolves the remaining agentic coding flow issues.
    - Stop wasting tokens in the currently running chats until the orchestration flow is fixed.
    - Keep self-hosted users independent from the private engineering control plane.

clarification:
  rounds:
    - question: Should currently running chats keep working while orchestration is repaired?
      answer: No. The user manually stopped the chats to avoid wasting tokens.
  vision_summary: >
    The feature chats should resume only after the orchestration layer can
    distinguish real conflicts from safe parallel work, can reclaim abandoned
    resources deterministically, and can preserve exact worktree and commit
    identity across tests, deploys, children, and restores.
  approved_by_user: true

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple product behavior is unchanged.
    - Apple remote execution remains single-lane and is not started by this remediation.
  verification:
    - Tooling tests are sufficient; no Xcode or Mac run is required.
  intentional_native_differences:
    - The private orchestration control plane is developer infrastructure only.

scenarios:
  - id: S-1
    title: Dead test owner does not block runtime mutation
    given:
      - A test lease exists for dev-stack with owner_key dev-server:<dead-pid>.
      - A Docker restart operation requests dev-stack.
    when:
      - The restart checks blocking leases.
    then:
      - The same-host dead-owner lease is released before timeout.
      - The runtime operation continues without waiting for the lease TTL.
      - Live foreign-host or live same-host leases remain active.

  - id: S-2
    title: Runtime operations queue instead of conflicting
    given:
      - Chat A owns or is running a Docker restart for dev-stack.
      - Chat B requests another restart for dev-stack.
    when:
      - Chat B uses the canonical sessions.py Docker restart command.
    then:
      - Chat B receives or reuses a durable runtime operation record.
      - The operation waits FIFO until earlier conflicting runtime work completes.
      - Repeating the same request from Chat B reattaches to the same active operation.

  - id: S-3
    title: Tests run in parallel unless a real exclusive mutation conflicts
    given:
      - Multiple Playwright or CLI proof runs target the same deployed dev stack without mutating the runtime.
    when:
      - The runs acquire shared dev-stack read leases.
    then:
      - Shared read leases coexist.
      - An exclusive Docker restart waits for those live leases.
      - New shared test runs wait only when an admitted or active exclusive runtime operation owns the same resource.

  - id: S-4
    title: Proof and deploy evidence remains commit-scoped
    given:
      - A browser proof starts for expected commit A.
      - origin/dev or the dev alias advances to commit B before the proof completes.
    when:
      - The proof runner records final evidence.
    then:
      - The evidence is rejected or marked stale unless it can prove it used an immutable deployment for commit A.
      - The chat receives a deterministic next action to rerun against the current expected commit or immutable preview.

  - id: S-5
    title: Worktree routing survives restore and child sessions
    given:
      - A stopped top-level OpenCode chat has a managed worktree.
      - A child/reviewer session is spawned or the parent chat is restored.
    when:
      - The session executes relative git, pytest, lint, or source-inspection commands.
    then:
      - Commands run in the parent managed worktree.
      - If routing cannot be guaranteed, the hook blocks once with a deterministic recovery command.
      - The shared root checkout is not used as a fallback for source work.

  - id: S-6
    title: Queue polling heals missed admission signals and names blockers
    given:
      - A runtime operation is queued behind a lease or earlier operation.
    when:
      - The blocker expires or completes and the waiting client polls again.
    then:
      - Expiry and FIFO admission are reconciled in the same transaction.
      - The waiter is admitted without manual database mutation.
      - While still queued, status names the blocking lease or operation owner and phase.
      - A terminal operation cannot be moved back into an active phase.

  - id: S-7
    title: Proof review reuses OpenCode and remains observable
    given:
      - Multiple chats need bounded frame review while the OpenCode server is running.
    when:
      - The proof workflow launches a reviewer.
    then:
      - The reviewer attaches to the existing server instead of starting another plugin and MCP stack.
      - The launcher passes canonical proof paths directly under a generated narrow read policy and creates no temporary repository symlinks.
      - Progress is printed at least every 30 seconds.
      - Timeout terminates the reviewer and preserves partial output for diagnosis.

  - id: S-8
    title: Shared product containers use one source generation
    given:
      - Multiple chats restart different services in the shared development Compose project.
    when:
      - A canonical Docker operation is admitted.
    then:
      - The operation refreshes one clean product-runtime checkout only after dependent tests drain.
      - Every recreated code-mounted service uses that checkout and records its exact commit and container ID.
      - Existing services with another mount, commit, or unrecorded container generation are included in the coherence restart.
      - Incoherent containers are force-recreated; a health-only restart cannot preserve an old bind mount and still complete.
      - Code-service recreation does not traverse or recreate infrastructure dependencies outside the admitted service set.
      - A previously managed service that is missing or stopped is restored by the next coordinated runtime operation.
      - Interrupted commands record a terminal failed operation before propagating the interruption.
      - Runtime lifecycle commands are executed by the current clean control-plane runtime even when the requesting chat's source worktree is old or merged.
      - Exact mount and source-tree provenance is recorded before the runtime operation becomes completed.
      - Already coherent services are not restarted unnecessarily.

  - id: S-9
    title: Parallel deploys do not invalidate unrelated proof runs
    given:
      - A deployed feature commit is followed by another chat's unrelated commit on dev.
    when:
      - The deploy handoff runs a gated spec with the original expected commit.
    then:
      - The gate may use the newer deployed dev subject only when the original commit is its ancestor and no known input of the requested spec changed.
      - Relevant changes still reject the run as a moving target.
      - Strict exact-HEAD mode remains available when explicitly requested.

  - id: S-10
    title: Explicit deploy selection is exact and root-independent
    given:
      - A long-running session has many historically tracked or dirty files.
      - The chat stages or explicitly selects a smaller correction.
      - The shared control-plane checkout contains unrelated dirty work.
    when:
      - The chat previews and deploys the correction.
    then:
      - One immutable manifest records the source base, patch identity, selected files, generated files, gates, and target branch.
      - Staged or explicit path selection is authoritative and cannot be expanded with other session-tracked files.
      - Every managed-worktree deploy validates and commits in a disposable integration checkout.
      - The shared root HEAD, index, and working tree are unchanged by deployment.
      - A successful push remains successful when only local control-plane fast-forward synchronization fails.

  - id: S-11
    title: Presence is authoritative and durable operations resume exactly once
    given:
      - A hook missed an idle event, OpenCode restarted, a response compacted, or a deterministic operation is waiting for a typed event.
    when:
      - The lifecycle reconciler compares stored presence, OpenCode generation state, and durable continuation state.
    then:
      - A timer cannot renew stale busy state without authoritative activity.
      - Idle, stopped, failed, user-input, and active-generation states are distinguished correctly.
      - Only an allowlisted nonterminal operation with a stored next action can resume a chat.
      - Event delivery and continuation prompts are idempotent by session, operation, cursor, and generation.
      - Automatic prompt delivery uses the asynchronous acceptance endpoint and remains single-flight across re-entrant idle events.
      - Manual stop, pending user input, terminal failure, and completion always suppress automatic continuation.

  - id: S-12
    title: Dependency-light worktrees use a prepared verification environment
    given:
      - A session worktree has source changes but does not contain a complete node_modules tree or installed CLI package.
    when:
      - The chat requests an allowlisted local validation profile or installed-CLI source verification.
    then:
      - The runner applies the immutable session patch to an isolated prepared checkout.
      - Dependency reuse requires an exact lockfile fingerprint and does not install dependencies separately in each chat worktree.
      - Verification records the base commit, patch identity, command profile, lockfile identity, and runtime epoch when applicable.
      - Installed CLI verification reports the executable path, package source identity, and whether the executable contains the candidate source without mutating or reinstalling it.
      - Concurrent validation cannot mix source patches and cleanup respects disk and process capacity limits.

  - id: S-13
    title: Every execution path claims only its real resources
    given:
      - Hourly, nightly, interactive, proof, GitHub, Docker, Vercel, CLI, and Apple work may overlap.
    when:
      - Initial or retry work is admitted.
    then:
      - Isolated tests do not claim the dev stack.
      - Runtime readers share an epoch lease and runtime writers use an exclusive operation.
      - Initial and retry GitHub dispatches use the same atomic capacity reservation and equivalent work is deduplicated.
      - Test accounts and the Apple Mac remain exclusive resources while disjoint work proceeds concurrently.
      - Existing API-health ownership is persisted and followers receive typed readiness events without duplicating shared recovery mutations.

  - id: S-14
    title: Required visual artifacts survive interruption and are delivered
    given:
      - A Playwright, CLI, proof, visual review, or Figma export produces response media.
    when:
      - The next assistant response completes or the chat compacts before embedding the media.
    then:
      - A durable artifact reference records its session, subject commit, run identity, snippet, and pending delivery state.
      - The exact required video or image snippet appears in the next progress response, including failed or visibly broken runs.
      - An interrupted delivery creates at most one bounded delivery continuation.
      - Duplicate responses do not repeatedly embed an already delivered artifact.
      - Raw media, credentials, and private logs are not stored in the engineering control-plane database.

  - id: S-15
    title: Long-lived chats cannot execute stale coordination clients
    given:
      - An OpenCode chat owns a source worktree created before the latest orchestration repair.
      - A lease owner exits before releasing its resource.
    when:
      - The chat invokes sessions.py or tests.py directly, with environment assignments, or in a chained shell command.
    then:
      - The command executes from the clean deployed control-plane runtime rather than the source worktree.
      - An interrupted active chat with overlapping pending source edits resumes in its existing worktree instead of losing work or being blocked by restore preflight.
      - An unrenewed lease expires within 30 minutes even when an older client requests a longer lifetime.
      - Live work renews its lease by heartbeat and is not limited to 30 minutes of total execution.
      - A blocked client reports the exact admission blocker at least once per minute.

