  - id: P-6
    name: Canary copy, verified reads, then payload pruning
    changes:
      - Backfill a small cohort by copying, checksumming, replicating, and reading through the new path while PostgreSQL remains authoritative.
      - Enable verified S3 reads for the initial small cohort after targeted zero-inference safety, recovery, failure, and client-read tests; retain PostgreSQL source copies for 24 hours after cutover as a rollback buffer.
      - Compare graph/page manifests and client results, pause automatically on mismatch, and throttle by database and object-store load.
