      - frontend/apps/web_app/tests/startup-sync-contract.spec.ts
      - frontend/apps/web_app/tests/chat-sync-empty-indexeddb-recovery.spec.ts
    exit_evidence:
      - Required implementation checks pass in isolated CI or the explicitly appropriate environment, with measured rollback and load evidence recorded.
      - Zero real inference calls, a proven fail-before-dispatch case, full-path synthetic processing evidence, and paced versus accelerated load reports for the agreed target.

