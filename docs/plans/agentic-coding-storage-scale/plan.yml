  - id: P-3
    name: Indexed page writer, reader, and safety fences
    changes:
      - Replace whole-graph repeated gzip payloads with an indexed logical segment containing small independently compressed immutable pages and separately referenced large payloads.
      - Read large payloads with explicit transfer and cache byte budgets using authenticated chunk/range streaming or bounded-size admission; preserve full content without truncation. Keep legacy payloads in PostgreSQL until a compatible bounded reader is verified.
      - Add durable archive work/outbox state, generation and graph fences, checksum/part manifests, and replication verification.
      - Keep chat share authority and key references in PostgreSQL; create or change shares with fenced metadata updates and bounded archive reads, without requiring whole-transcript promotion.
      - Copy and verify first; do not delete or prune PostgreSQL payloads in this phase.
    source_paths:
