      - Replace identifier-list materialization used for counts with bounded aggregate queries and remove unbounded message/embed recovery fetches.
      - Return metadata separately from payloads and add supporting owner/chat/time/version indexes.
      - Preserve duplicate suppression and deterministic ordering across hot/cold boundaries.
    source_paths:
      - backend/core/api/app/routes/sync_api.py
      - backend/core/api/app/routes/handlers/websocket_handlers/phased_sync_handler.py
      - backend/core/api/app/routes/handlers/websocket_handlers/sync_message_hydration.py
      - backend/core/api/app/routes/embeds_api.py
      - backend/core/api/app/services/directus/chat_methods.py
