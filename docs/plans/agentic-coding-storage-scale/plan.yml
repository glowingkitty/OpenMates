scope:
  in:
    - Bound the live Redis/Dragonfly working set, PostgreSQL message payloads, cold chat pages, and embed version payloads.
    - Reuse PostgreSQL, Directus, existing regional S3 support, and private upload paths during the low-risk migration.
    - Keep encrypted metadata sufficient to list and route every chat while moving eligible ciphertext payloads to S3.
    - Make recovery, startup sync, scrollback, subchat context, compression, version history, deletion, and export use bounded readers.
    - Selectively disable generic Directus revision/activity tracking where it has no audit purpose while preserving product version history such as embed_diffs.
    - Measure migration safety and target workloads of hundreds of messages, embeds, and diffs per user per day.
    - Meter customer S3 archives and versions, charge excess storage weekly in credits, and align public pricing and retention disclosures with the implemented billing policy.
  out:
    - Removing PostgreSQL or Directus in this project.
    - Removing the Directus API layer; that is a later, separate project because product UI does not depend on it.
    - Destructive cleanup of existing Directus revision/activity history without a separately approved exact scope.
    - Changing the inherited replication, deletion, authorization, export, reference, or encryption contracts.

baseline:
  measured_on: "2026-09-25"
  environment: development
  rollout_context: The user reports few current users. Acceptance tests still target the agreed future scale; passive observation of current traffic is insufficient migration evidence.
  observations:
    - PostgreSQL is 6.54 GiB; directus_revisions is 4.53 GiB (69%) and directus_activity is 469 MiB (7%). These totals include more than agentic coding data.
    - No cold manifests exist in development despite a whole-graph cold archive implementation.
    - The current archive collects a complete graph, creates repeated gzip parts, deletes individual hot rows, omits embed_diffs and commits, and promotes the whole graph for mutation.
    - Current embed version listing includes encrypted payloads without explicit pagination, so provider defaults can truncate long histories; reconstruction starts from a single original snapshot.
    - Recovery and sync paths still request full history, child contexts compete for three recent-chat LRU slots, and offline pending writes lack a complete durability fence.
    - Existing regional S3, private object upload, replication, checksum, tombstone, authorization, and reference tracking are reusable foundations.
    - Existing signed TEST_LIVE_MOCK runs full orchestration through cached LLM/HTTP boundaries and fails on cache misses; raw HTTP guards and per-task real-provider counters already exist. The faster mock_replay event path skips preprocessing/compression/main processing and cannot alone prove processing capacity.
    - Follow-up source audit on 2026-10-01 found client-public-key sealed recovery for final assistant text with a seven-day recovery lifetime; child dispatch lacks that recovery context, and the schema-1 sealed terminal payload does not cover child transcripts, separate embeds/diffs, or compression checkpoints.
    - "2026-10-04: five reviewed tracking settings are active on dev after metadata-only coordinated setup and independent SQL readback. Fresh read-only database size is 7,505,277,487 bytes; revisions plus activity relations are approximately 77%, including indexes/TOAST. Historical rows are retained."
    - "2026-10-04: directus_users update snapshots dominate that collection's historical audit payload. Preserve its current policy, security/admin paths and registration activity while reviewing a narrowly authorized routine-state writer; field-level byte contribution has not been measured."

decisions:
  - id: D-1
    decision: Keep PostgreSQL and Directus for the initial implementation; consider removing the Directus API layer only as a separate later project.
  - id: D-2
    decision: Selectively reduce generic Directus revision/activity tracking after an inventory proves that a collection has no audit purpose; preserve embed_diffs and other intentional product history.
  - id: D-3
    decision: Keep three recent main chats plus bounded active child contexts in Redis/Dragonfly, and protect durable pending writes from eviction. Redis AI context is Vault-encrypted cache data and remains distinct from durable client-key ciphertext.
  - id: D-4
    decision: Keep up to ten recent eligible main chats in PostgreSQL, with up to 100 messages or 2 MiB of encrypted message bytes per chat, whichever is reached first. Archive after 30 days of inactivity or sooner when a compression checkpoint covers the prefix. These are agreed initial configurable defaults; changes require measured justification and a recorded decision.
  - id: D-5
    decision: Keep encrypted titles, summaries, and routing indexes for all chats in PostgreSQL. Never archive active work or new writes until the durability and archive fences prove it is safe.
  - id: D-6
    decision: Archive a finished subchat promptly after its final result is delivered and every client-encrypted persistence acknowledgement has arrived.
  - id: D-7
    decision: Each compression checkpoint archives only newly covered message IDs into one logical segment made of small, independently compressed pages. Start benchmarking at 10-20 messages and 128-256 KiB of serialized ciphertext per page before container compression; final page size and physical object packing are provisional.
  - id: D-8
    decision: Scrollback reads indexed pages and never downloads a 300-message gzip graph. Store large payloads separately from message pages.
  - id: D-9
    decision: PostgreSQL keeps the current artifact head and a bounded recent version window. Older encrypted versions and diffs move to S3 while paginated PostgreSQL metadata preserves timestamps and the version graph for complete discovery.
  - id: D-10
    decision: Reconstruct an old artifact from the nearest encrypted periodic snapshot plus bounded patches, all decrypted by the client. Snapshot cadence and the recent PostgreSQL window remain provisional because the server cannot decrypt content to create snapshots.
  - id: D-11
    decision: Current shared files follow their references independently of chat age.
  - id: D-12
    decided_at: "2026-10-01"
    decision: Pinned and public/shared chats follow the same bounded history policy as ordinary chats. Pinning preserves placement, and sharing preserves authorized visibility. Enable shared-chat pruning only after archive-aware reads, permissions, revocation, and client compatibility are verified; until then defer pruning without a permanent exemption.
  - id: D-13
    decided_at: "2026-10-01"
    decision: Already authorized agent work may continue after all clients close, within its admitted budget, only while every required output is durably sealed to a client public key outside Redis for later recovery. Required outputs include child transcript messages, embeds and diffs, summaries, and compression checkpoints as well as final assistant text. Pause further work if any required output cannot be saved safely. On return, an authorized client validates and decrypts the sealed output, persists normal client-encrypted records, acknowledges them, and then normal archival applies. Sealed client-only ciphertext does not enable server inference restart after AI working-cache loss; no Vault-readable durable history substitute is authorized.
  - id: D-14
    decided_at: "2026-10-01"
    decision: First architecture acceptance target is 1000 heavy daily active users and 500 simultaneous main/subchat executions, with a representative heavy user-day of 500 agent rounds, 200 new embeds, and 1000 file versions/diffs. These are test workloads, not quotas or demonstrated production capacity.
  - id: D-15
    decided_at: "2026-10-01"
    user_constraint: under no circumstances can we do that many real inference requests just for testing the architecture - we need a way without real inference requests to test the processing.
    decision: Architecture processing and capacity verification makes zero real inference requests. Use generated deterministic provider responses or existing approved replay fixtures, block provider network access, remove live inference credentials, and fail on missing simulation coverage. No paid fixture creation, recording, real canary, embeddings, routing, or compression inference is allowed in this verification scope.
  - id: D-16
    decided_at: "2026-10-01"
    decision: Initial archived-message-page target is at most one second at the 95th percentile for first-time uncached opens under the accepted load and documented reference network/device. Measure authorization through transfer, decryption, and requested-page readiness; report warmed reads, oversized payloads, and failures separately. Use bounded adjacent-page prefetch and local caching for subsequent scrolling.
  - id: D-17
    decided_at: "2026-10-01"
    decision: For the initial small cohort, enable verified S3 reads after targeted zero-inference safety and client tests, then retain PostgreSQL source copies for a 24-hour rollback buffer after cutover. Prune only after the buffer and all per-unit durability, replication, authorized-read, acknowledgement, compatibility, generation/write-fence, and rollback checks pass. A failure pauses pruning and triggers the tested rollback path. Explicit deletion remains immediate. This buffer does not delay steady-state compression, subchat archival, or prompt processing; the separate seven-day rule applies only to superseded archive generations.

  - id: D-18
    decided_at: '2026-10-04'
    decision: The user confirms that Apple apps have no testers besides them and backward compatibility is unnecessary for this development rollout. Release the matching web/CLI backend after its focused recovery proof; incompatible Apple embed writers fail closed until their matching update. This does not waive encryption, authorization, saved-copy durability, supported-reader proof before pruning, or the full P-7 first-real-prune gate. Production rollout is outside this development authorization.

architecture:
  tiers:
    redis_dragonfly:
      purpose: Short-lived server-readable AI context and coordination cache.
      bounds: Three recent main chats plus bounded active child contexts; embed byte budgets remain to be measured.
      safety: Durable pending writes and active work cannot be evicted as if they were disposable cache entries.
    postgresql_directus:
      purpose: Authoritative metadata, current heads, bounded hot ciphertext, archive/version indexes, fences, and outbox state.
      bounds: Agreed initial defaults for eligible main chats are ten recent chats and, per chat, 100 messages or 2 MiB encrypted bytes, whichever comes first.
      safety: All-chat encrypted titles, summaries, routing indexes, authorization, graph metadata, and current shared-file references remain queryable.
    regional_s3:
      purpose: Immutable encrypted message pages, large payloads, old artifact versions/diffs, encrypted snapshots, and verified replicated generations.
      bounds: Indexed and paginated reads fetch only requested pages or a bounded reconstruction chain.
      safety: Existing multi-region verification, deletion tombstones, generation rollback, authorization, export, and reference semantics apply.
  encryption_boundary: >-
    The AI working cache and client-encrypted durable storage are separate data
    classes. PostgreSQL or S3 ciphertext alone cannot refill a server-readable AI
    context; a capable authorized client or separately approved delegation is
    required. Client-public-key sealed unattended-output recovery is durable but
    likewise cannot restart AI inference after working-cache loss without client-supplied
    context. Startup sync
    caches remain governed by architecture.sync.

