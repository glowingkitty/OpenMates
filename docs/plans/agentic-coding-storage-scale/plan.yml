required_implementation_checks:
  synthetic_capacity:
    - The architecture workload represents 1000 heavy daily users, 500 simultaneous main/subchat executions, and the agreed per-user-day output volumes; report actual measured throughput and headroom rather than assuming the target was met.
    - Scripted/replayed providers cover routing, model streams, compression, embeddings where invoked, and external skill outcomes. A missing response fails before dispatch, with no live recording, real canary, or external inference fallback.
    - Provider network access is blocked and live inference credentials are absent. Positive runs record zero real requests; a deliberate uncovered request verifies that the guard stops it without reaching any provider.
    - Real application processing, test-client cryptography, database/cache/object-storage I/O, cold-page reads, version reconstruction, and disconnected-client recovery are exercised in the isolated CI stack using disposable identities and storage prefixes.
    - Seeded scale data and accelerated time/volume tests are labeled separately from sustained traffic. Verify ciphertext readability, expected version content, stable identities, and reference completeness against an independent generated outcome ledger.
  pagination_and_reads:
    - Duplicate, reordered, retried, and boundary-crossing hot/cold pages produce stable ordering without omission or duplication.
    - Missing parts, wrong checksums, truncated pages, unavailable regions, and oversized individual messages fail visibly and recoverably.
    - Large payload reads obey measured transfer/cache byte budgets, authenticate streamed chunks or enforce bounded-size admission, and return complete content; legacy formats defer PostgreSQL pruning until a compatible bounded reader exists.
    - UI scrollback incrementally fetches and client-decrypts bounded pages without downloading a whole long chat.
    - At the agreed workload, first-time uncached ordinary archive pages meet p95 at most one second including authorization, transfer, decryption, and display readiness on the documented reference setup. Fast headers or warmed payloads cannot stand in for this measurement; timeouts and failures remain explicit.
  write_and_archive_safety:
    - Concurrent new write, compression checkpoint, archive, promotion, and deletion races never prune unacknowledged or uncovered data.
    - A new cold-chat message uses a fenced bounded hot tail without whole-graph promotion; retries preserve order and exactly one durable message.
    - Database failure, S3 failure, replication lag, process restart, and manifest failure preserve an authoritative readable copy.
    - Offline client pending writes persist across restart and are fenced from eviction until acknowledged durably.
    - Every required unattended output, including child transcript messages, embeds/diffs, summaries, and compression checkpoints, is durably sealed outside Redis before dependent work continues; a failed or unavailable save pauses further work without claiming a Redis-only copy is durable.
    - Pending recovery metadata stays small, indexed, and fenced in PostgreSQL while large sealed payloads use existing regional S3; normal archive eligibility waits for client finalization and acknowledgement.
    - A recovery job lease or working-cache expiry never deletes the only durable sealed output; retain payload and locator until canonical client-encrypted persistence acknowledgement or authorized deletion, including while clients remain offline.
    - Recovery survives process restart with versioned, idempotent records; an authorized client validates, decrypts, persists normal client-encrypted records, and acknowledges before archival or pruning. Client-only saved ciphertext does not restart AI inference after working-cache loss.
    - Child recovery identity, public-key provisioning, per-output versions, and execution budgets are resolved in P-4; the current seven-day final-response expiry is not adopted as user-data retention by default.
    - Archiving a completed child's transcript preserves its parent's bounded synthesis input until consumption is acknowledged.
  authorization_and_lifecycle:
    - Personal, multi-user Team, shared-link/reference, role revocation, and archive promotion paths recheck current authorization.
    - Explicit chat/account deletion purges active and superseded generations from all enabled regions; shared files remain until their final reference is deleted.
    - Exports remain authorized, complete, bounded, and encrypted under existing contracts.
    - Pinned 5000-message chats retain their placement with bounded PostgreSQL tails; shared histories remain readable and subsequent archive requests fail after share or membership revocation.
    - Creating or changing a chat share does not require whole-transcript promotion; unsupported shared readers defer pruning until compatibility is proven.
  version_history:
    - Version 101+ paginates correctly and a thousand-edit history reconstructs from a bounded nearest snapshot plus patches.
    - Current heads remain independent of chat age and server code never needs plaintext to create or apply a snapshot.
    - Snapshot publication rechecks write permission and expected version; read-only principals cannot publish, and legacy histories wait for safe reconstruction before pruning.
  rollout_and_compatibility:
    - Every supported reader understands the indexed format before archive eviction or PostgreSQL payload pruning is enabled.
    - Canary copy/verify/read precedes pruning; load throttles, pause conditions, rollback, and observability are exercised.
    - Initial-cohort PostgreSQL source copies remain for 24 hours after verified S3-read cutover. P-7 zero-inference checks and all per-unit safety gates precede first real-data pruning; failures pause pruning and invoke tested rollback. Explicit deletion remains immediate, while superseded generations retain their separate seven-day limit.
    - Staged-load latency, database/S3 load, compression/page-size distribution, and restore time are measured at hundreds of messages/embeds/diffs per user per day.

open_questions:
  - id: Q-1
    topic: Pinned and shared eligibility
    status: answered
    answered_at: "2026-10-01"
    answer: A — same bounded history policy for pinned and shared chats, with verified archive-aware authorization before shared payload pruning.
    question: Should pinned chats receive the same paging and payload caps, and when may shared chats become archive eligible?
    recommendation: Apply the same limits; pinning preserves placement and sharing preserves authorized access.
  - id: Q-2
    topic: Authorized agent work without a capable client
    status: answered
    answered_at: "2026-10-01"
    answer: A — already authorized agent work continues after all clients close within budget only while every required output is durably sealed outside Redis for client recovery; otherwise pause further work.
    question: Should admitted agent work continue after all capable clients disconnect, with every required output durably sealed for later client recovery, or pause until a client reconnects?
    recommendation: Extend the existing client-public-key sealed recovery protocol to every required output before allowing that unattended work; pause safely when durable coverage or required capabilities are unavailable. Keep working Vault ciphertext separate from sealed recovery, and do not claim automatic inference restart from client-only ciphertext.
    unresolved_details: Recovery retention, child key/identity provisioning, per-output schema, snapshot publication, budget/admission limits, and safe resume after working-cache loss require explicit design; the current seven-day recovery expiry is not an approved archival retention choice.
  - id: Q-3
    topic: First implementation load-test scale
    status: answered
    answered_at: "2026-10-01"
    answer: A, with the explicit requirement that architecture processing be tested without real inference requests.
    question: What scale should the first implementation be load-tested against?
    recommendation: Use the accepted 1000-user/500-execution target, generated encrypted workloads, deterministic provider simulation, representative bursts, continued archival, and history reads; prove zero real inference calls.
  - id: Q-4
    topic: Archived-page responsiveness
    status: answered
    answered_at: "2026-10-01"
    answer: A — one second for 95% of first-time uncached archive page opens is sufficient for the initial implementation.
    question: Should first-time uncached archive pages target at most one second at the 95th percentile, or a stricter 300 milliseconds, under the agreed load and documented reference network/device conditions?
    recommendation: One second for the first uncached page, with bounded adjacent-page prefetch and local caching to make ordinary scrolling immediate when data is ready. The stricter target may require more prewarming, cache memory, or regional infrastructure and must be measured rather than assumed.
  - id: Q-5
    topic: Rollout checkpoint window
    status: answered
    answered_at: "2026-10-01"
    answer: A — retain verified PostgreSQL source copies for 24 hours after initial-cohort S3-read cutover, then prune only after every safety gate passes.
    question: Given few current users, should the initial rollout keep verified PostgreSQL rollback copies for 24 hours after enabling S3 reads, or permit pruning as soon as all required verification gates pass?
    recommendation: Enable the new reader after targeted correctness, authorization, replication, client-read, and rollback checks; retain PostgreSQL rollback copies for 24 hours before verified pruning. Sparse traffic makes a fixed seven-day wait weak evidence. The buffer affects redundant source-copy removal only.
    invariants: Every migrated unit still requires verified durable ciphertext, compatible authorized/decrypting readers, canonical persistence acknowledgements, current generation/write fences, and a tested rollback before pruning; elapsed time alone never suffices. Explicit deletion bypasses migration retention. This rollout-only window neither slows steady-state archival nor changes superseded-generation or pending-recovery retention.

  - id: Q-6
    topic: Team storage payer
    status: answered
    asked_at: "2026-10-05"
    answered_at: "2026-10-06"
    user_confirmation: "Regarding team: yes every team has their own separate free 1gb allowance."
    decision: Each Team has its own 1 GiB allowance and uses the recommended separate Team wallet with the existing weekly rate.
    question: Should weekly Team storage charges use a separate Team credit wallet or the owner's personal balance?
    recommendation: A separate Team wallet with its own 1 GiB free allowance and the existing 3 credits per started excess GiB per week, keeping Team costs and unpaid invoices distinct.
    activation: Team policy is approved; settlement and expiry remain off until the corresponding implementation and focused exact-source verification pass.
  - id: Q-7
    topic: Team unpaid-storage notices and expiry
    status: answered
    answered_at: "2026-10-06"
    user_confirmation: "Notify owner/admins; expire enough safe warned data (Recommended)"
    question: Who receives Team warnings and may specifically warned Team units expire after four delivered weekly warnings?
    decision: Notify the owner and admins; after four complete delivered weekly rounds, expire only enough specifically warned safe Team units to restore its own allowance, with the same timing and protections as personal storage. Hold when delivery, membership, payment, usage or safe selection is unresolved. Personal expiry continues to protect Team data.
  - id: Q-8
    topic: Optional inactive current-head byte refinement
    status: pending
    question: Should inactive current artifact heads move to S3 under a bounded warm-byte policy while PostgreSQL retains metadata and references?
    current_approved_behavior: D-9 keeps current artifact heads in PostgreSQL. This optional refinement is not a completion gate for the approved implementation and requires an explicit decision before head eviction.

