      - Gate ordinary uncached archive-page reads on p95 at most 1000 milliseconds through client decryption and page readiness, using declared hardware/network and disabled initial client/application payload caches. Measure prefetched/warm reads and failure cases separately.
      - Verify global deletion, Team revocation, shared references, complete exports, and seven-day superseded-generation cleanup through inherited contracts.
      - Verify web, CLI, SDK, and Apple scroll/decrypt behavior before broad rollout.
      - Resolve benchmark knobs from measured results: page size begins at 10-20 messages and 128-256 KiB before compression; snapshot cadence, recent artifact payload window, and Redis global byte budgets are engineering choices in their owning phases, not new user-approval gates.
