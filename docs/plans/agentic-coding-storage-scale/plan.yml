  - id: P-7
    name: Scale, lifecycle, and user-path verification
    dependency: Complete zero-inference safety and capacity gates before P-6 first real-data pruning; initial S3 reader canary may run before this phase.
    changes:
      - Reuse signed TEST_LIVE_MOCK in replay-only mode, caching_llm_wrapper, caching_http_transport, raw HTTP guards, and the credential-free isolated CI stack; add generated multi-turn fixtures and a mass-concurrency driver. Aggregate per-task receipts into run-wide zero-provider-call evidence and enforce a network boundary independently of Python wrappers.
      - Build a deterministic provider simulator for scripted streaming responses, child dispatch, tool outcomes, summaries, and compression; intercept only external dependencies while actual processing, scheduling, encryption, persistence, and archive code runs.
      - Use real isolated PostgreSQL/Directus, Dragonfly, and S3-compatible storage with dedicated synthetic users and keys. Seed aged histories for index/cardinality checks, then exercise ongoing writes and reads through the actual application paths; row seeding alone does not establish processing capacity.
      - Block all real inference at both dispatch and network boundaries, omit live inference credentials, and report attempted/blocked/real provider calls. Missing fixtures abort the run and are authored synthetically; no recording or paid fallback is permitted.
      - Represent 1000 heavy user-days and ramp to 500 simultaneous main/subchat executions with realistic payload distributions, stream chunking, thinking content, slow producers, long histories, version chains, concurrent readers, and background archival. Preserve actual encryption so artificial plaintext compression cannot inflate capacity claims.
      - Separate paced steady-load and burst tests from accelerated volume/backfill runs; report rate, duration, payload distribution, hardware, network assumptions, latency, queue lag, memory, database/WAL growth, and object operations for each. Simulated inference measures infrastructure behavior and not reasoning quality or real model latency.
