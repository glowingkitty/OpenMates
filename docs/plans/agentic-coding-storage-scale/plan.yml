    exit_evidence:
      - Duplicate and reordered pages converge once, and every supported client can read the new format before archive eviction is enabled.

  - id: P-3
    name: Indexed page writer, reader, and safety fences
    changes:
      - Replace whole-graph repeated gzip payloads with an indexed logical segment containing small independently compressed immutable pages and separately referenced large payloads.
      - Read large payloads with explicit transfer and cache byte budgets using authenticated chunk/range streaming or bounded-size admission; preserve full content without truncation. Keep legacy payloads in PostgreSQL until a compatible bounded reader is verified.
      - Add durable archive work/outbox state, generation and graph fences, checksum/part manifests, and replication verification.
      - Keep chat share authority and key references in PostgreSQL; create or change shares with fenced metadata updates and bounded archive reads, without requiring whole-transcript promotion.
      - Copy and verify first; do not delete or prune PostgreSQL payloads in this phase.
    source_paths:
      - backend/core/api/app/services/cold_archive_service.py
      - backend/core/api/app/services/storage_reference_service.py
      - backend/core/directus/schemas/cold_archive_manifests.yml
      - backend/core/directus/schemas/cold_archive_parts.yml
      - backend/core/api/app/services/s3
    exit_evidence:
      - Readers detect missing/corrupt/reordered parts, writers resume idempotently, and a failed S3 or database write leaves the hot graph authoritative.

  - id: P-4
    name: Compression, child context, and recent-chat policies
    changes:
      - Archive only newly checkpoint-covered message IDs and prevent overlap or gaps between logical segments.
      - On a new message in a cold chat, append through a fenced bounded hot tail and current metadata rather than restoring the whole archived graph.
      - Give active child contexts a separate bounded budget so they do not displace the three recent main chats.
      - Enforce PostgreSQL count/byte/age bounds while protecting active chats, new writes, durable pending writes, and client persistence acknowledgements.
      - Apply the same history limits to pinned and shared chats, preserving pin placement and gating shared-chat pruning on verified archive-aware authorization and revocation.
      - Archive finished subchats only after final delivery and all required client-encrypted persistence acknowledgements.
      - Extend the existing X25519/AES-GCM client-public-key sealed final-response recovery path with versioned records for every required unattended output, including child transcript messages, embeds/diffs, summaries, and compression checkpoints; propagate recovery identity and public keys into child dispatch.
      - Keep small indexed and fenced pending-recovery metadata in PostgreSQL, put large sealed payloads in existing regional S3, and use Redis only for working context; keep pending client finalization distinct from ordinary archive eligibility.
      - Save each required sealed output durably outside Redis before admitting dependent work; pause further work if safe persistence fails, while keeping execution inside its admitted budget and preserving idempotent recovery across retries.
      - Retain each sealed payload and durable recovery locator until its canonical client-encrypted persistence acknowledgement or authorized deletion; recovery job-lease or working-cache expiry cannot remove the only durable output. Large payloads may move to S3 while clients are offline without granting server decryption authority.
      - On client return, validate and decrypt recovered outputs, persist normal client-encrypted records, acknowledge each durable result, and only then apply ordinary archive eligibility and pruning fences.
      - Resolve per-output schema, child key/identity provisioning, recovery budgets, and safe cache-loss behavior within this phase; never assume automatic server inference restart from sealed output alone.
    source_paths:
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_compression_checkpoint_handler.py
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_recovery_job_handlers.py
      - backend/core/api/app/services/chat_recovery_service.py
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_turn_preflight_handler.py
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_recovery_job_handlers.py
      - backend/core/api/app/routes/handlers/websocket_handlers/message_received_handler.py
      - backend/apps/ai/sub_chat_orchestration.py
      - backend/apps/ai/processing/main_processor.py
      - backend/core/api/app/services/cache_chat_mixin.py
      - frontend/packages/ui/src/services/chatSyncServiceHandlersRecovery.ts
      - frontend/packages/ui/src/utils/chatCompletionRecovery.ts
      - frontend/packages/ui/src/services/db/messageOperations.ts
    exit_evidence:
      - Already authorized unattended work stays within budget and saves every required output as durable client-key-sealed recovery outside Redis, or pauses safely. Restart recovers saved output for client finalization; client-only ciphertext is never used to claim server inference restart. Concurrent checkpoint/write/archive races preserve every message once, and main/child contexts obey separate measured budgets.

  - id: P-5
    name: Artifact version archive and client snapshots
    changes:
      - Paginate the complete version graph as PostgreSQL metadata while retaining only the current head and a measured recent payload window there.
      - Store older encrypted snapshots/diffs in regional S3 and reconstruct from the nearest client-created encrypted snapshot plus bounded patches.
      - Negotiate client capabilities so unsupported clients remain on the old read path and cannot trigger eviction.
    source_paths:
      - backend/core/api/app/routes/embeds_api.py
      - backend/core/api/app/routes/handlers/websocket_handlers/store_embed_diff_handler.py
      - backend/core/api/app/services/embed_diff_service.py
      - backend/core/directus/schemas/embed_diffs.yml
      - backend/core/directus/extensions/embed-version-transaction
      - frontend/packages/ui/src/services/embedDiffStore.ts
      - frontend/packages/openmates-cli/src/client.ts
    exit_evidence:
      - Version 101 and a thousand-edit artifact are discoverable and reconstruct with a bounded payload chain and no server plaintext.

  - id: P-6
    name: Canary copy, verified reads, then payload pruning
    changes:
      - Backfill a small cohort by copying, checksumming, replicating, and reading through the new path while PostgreSQL remains authoritative.
      - Enable verified S3 reads for the initial small cohort after targeted zero-inference safety, recovery, failure, and client-read tests; retain PostgreSQL source copies for 24 hours after cutover as a rollback buffer.
      - Compare graph/page manifests and client results, pause automatically on mismatch, and throttle by database and object-store load.
      - Complete automatic migration for official-cloud production and self-hosted updates through the standard server CLI: schema setup, resumable bounded copy and verification, release evidence and enforced reader compatibility, verified read activation, the initial 24-hour source buffer, then per-unit fenced pruning.
      - Ship migration eligibility evidence with the trusted release and verify it against deployed code; missing capacity, client, integrity or recovery evidence pauses automatic advancement rather than requiring operators to invent receipts or bypass gates.
      - Surface migration progress, retry and pause reasons in server update/status; interrupted updates resume idempotently, and no automatic database restore may overwrite newer user writes or claim a database/runtime backup is a complete Vault/S3 recovery package.
      - Before the first real-data prune, require P-7 zero-inference load, lifecycle, and client-path checks as well as every supported reader's compatibility, per-unit durable-copy and canonical-persistence acknowledgements, generation/write fences, and tested rollback. Pause pruning and use the rollback path on failure; explicit deletion purges immediately. Keep the separate seven-day superseded-generation rule.
    source_paths:
      - backend/core/api/app/tasks/user_cache_tasks.py
      - backend/core/api/app/tasks/persistence_tasks.py
      - backend/core/api/app/services/cold_archive_service.py
      - backend/core/api/app/services/storage_management.py
    exit_evidence:
      - Copy, verify, read, restore, and rollback drills meet the agreed thresholds; the 24-hour buffer and P-7 gates precede the first real-data prune.

  - id: P-7
    name: Scale, lifecycle, and user-path verification
    dependency: Complete zero-inference safety and capacity gates before P-6 first real-data pruning; initial S3 reader canary may run before this phase.
    changes:
      - Reuse signed TEST_LIVE_MOCK in replay-only mode, caching_llm_wrapper, caching_http_transport, raw HTTP guards, and the credential-free isolated CI stack; add generated multi-turn fixtures and a mass-concurrency driver. Aggregate per-task receipts into run-wide zero-provider-call evidence and enforce a network boundary independently of Python wrappers.
      - Build a deterministic provider simulator for scripted streaming responses, child dispatch, tool outcomes, summaries, and compression; intercept only external dependencies while actual processing, scheduling, encryption, persistence, and archive code runs.
      - Use real isolated PostgreSQL/Directus, Dragonfly, and S3-compatible storage with dedicated synthetic users and keys. Seed aged histories for index/cardinality checks, then exercise ongoing writes and reads through the actual application paths; row seeding alone does not establish processing capacity.
      - Block all real inference at both dispatch and network boundaries, omit live inference credentials, and report attempted/blocked/real provider calls. Missing fixtures abort the run and are authored synthetically; no recording or paid fallback is permitted.
      - Represent 1000 heavy user-days and ramp to 500 simultaneous main/subchat executions with realistic payload distributions, stream chunking, thinking content, slow producers, long histories, version chains, concurrent readers, and background archival. Preserve actual encryption so artificial plaintext compression cannot inflate capacity claims.
      - Separate paced steady-load and burst tests from accelerated volume/backfill runs; report rate, duration, payload distribution, hardware, network assumptions, latency, queue lag, memory, database/WAL growth, and object operations for each. Simulated inference measures infrastructure behavior and not reasoning quality or real model latency.
      - Benchmark staged loading, compression ratios, page sizing, reconstruction, and migration at the target daily workload.
      - Admit and measure the requested concurrency explicitly; an infrastructure cap must be reported as insufficient admission rather than silently reducing 500 active executions to a smaller passing workload. Preserve separate accelerated volume and paced traffic evidence.
      - Gate ordinary uncached archive-page reads on p95 at most 1000 milliseconds through client decryption and page readiness, using declared hardware/network and disabled initial client/application payload caches. Measure prefetched/warm reads and failure cases separately.
      - Verify global deletion, Team revocation, shared references, complete exports, and seven-day superseded-generation cleanup through inherited contracts.
      - Verify web, CLI, SDK, and Apple scroll/decrypt behavior before broad rollout.
      - Resolve benchmark knobs from measured results: page size begins at 10-20 messages and 128-256 KiB before compression; snapshot cadence, recent artifact payload window, and Redis global byte budgets are engineering choices in their owning phases, not new user-approval gates.
    source_paths:
      - backend/shared/testing/mock_context.py
      - backend/apps/ai/testing/caching_llm_wrapper.py
      - backend/shared/testing/caching_http_transport.py
      - backend/apps/ai/testing/mock_replay.py
