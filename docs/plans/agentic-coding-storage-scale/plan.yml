    exit_evidence:
      - Readers detect missing/corrupt/reordered parts, writers resume idempotently, and a failed S3 or database write leaves the hot graph authoritative.

  - id: P-4
    name: Compression, child context, and recent-chat policies
    changes:
      - Archive only newly checkpoint-covered message IDs and prevent overlap or gaps between logical segments.
      - On a new message in a cold chat, append through a fenced bounded hot tail and current metadata rather than restoring the whole archived graph.
      - Give active child contexts a separate bounded budget so they do not displace the three recent main chats.
      - Enforce PostgreSQL count/byte/age bounds while protecting active chats, new writes, durable pending writes, and client persistence acknowledgements.
      - Apply the same history limits to pinned and shared chats, preserving pin placement and gating shared-chat pruning on verified archive-aware authorization and revocation.
      - Archive finished subchats only after final delivery and all required client-encrypted persistence acknowledgements.
      - Extend the existing X25519/AES-GCM client-public-key sealed final-response recovery path with versioned records for every required unattended output, including child transcript messages, embeds/diffs, summaries, and compression checkpoints; propagate recovery identity and public keys into child dispatch.
      - Carry that durable recovery identity across detached async app tasks, restore and clear their task-local context, and fence finished-output publication on successful sealing; absence of context cannot silently bypass recovery.
      - Gate typed recovery consumption by explicit reader capability while preserving existing protocol-1 SDK admission and final-text recovery; a valid preflight recovery key remains sufficient to seal outputs for a later capable same-owner device.
      - Protect durable uncommitted draft turns from reconciliation based only on absence from the server chat list, while preserving explicit deletion and generation fences.
      - Keep small indexed and fenced pending-recovery metadata in PostgreSQL, put large sealed payloads in existing regional S3, and use Redis only for working context; keep pending client finalization distinct from ordinary archive eligibility.
      - Save each required sealed output durably outside Redis before admitting dependent work; pause further work if safe persistence fails, while keeping execution inside its admitted budget and preserving idempotent recovery across retries.
      - Retain each sealed payload and durable recovery locator until its canonical client-encrypted persistence acknowledgement or authorized deletion; recovery job-lease or working-cache expiry cannot remove the only durable output. Large payloads may move to S3 while clients are offline without granting server decryption authority.
      - On client return, validate and decrypt recovered outputs, persist normal client-encrypted records, acknowledge each durable result, and only then apply ordinary archive eligibility and pruning fences.
      - Resolve per-output schema, child key/identity provisioning, recovery budgets, and safe cache-loss behavior within this phase; never assume automatic server inference restart from sealed output alone.
    source_paths:
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_compression_checkpoint_handler.py
      - backend/core/api/app/routes/handlers/websocket_handlers/chat_recovery_job_handlers.py
