  verification_strategy:
    - Write and run failing digest, Prometheus-rule, CLI, self-host, and privacy tests before implementation.
    - Rebuild/restart only affected dev monitoring, API, scheduler, and host-monitor components under repository locks.
    - Run focused green tests and deterministic audits.
    - Run direct dev payment-readiness CLI/API probes before browser verification.
    - Send the real current dev 24-hour email and Discord test and inspect both received artifacts.
    - Deploy to dev and require fresh passing EU and Managed Stripe settings purchase specs.
    - Run controlled dev alert and stale-report drills with guaranteed restoration and recovery checks.
    - Observe seven consecutive fresh daily dev reports before requesting production access.
    - Update the live Stripe event destination and production operations Discord configuration only after dev gates, then rerun the read-only audit and delivery test.
  verification_order:
    - T-DIGEST-UNIT, T-ALERT-RULES, T-CLI-MONITORING, T-SELFHOST-CONTRACT, and T-PRIVACY-AUDIT red phase.
    - T-PAYMENT-READINESS, T-PROVIDER-STATUS, T-DISCORD-RESOLVER, and T-OPERATIONAL-AUDIT red phase.
    - Resource collection and alert-rule green phase.
    - Snapshot, renderer, scheduling, self-host, and delivery green phase.
    - V-DEV-REAL-DELIVERY and V-DEV-ARTIFACT-REVIEW with current dev data.
    - Scoped dev deploy followed by T-E2E-STRIPE-EU and T-E2E-STRIPE-MANAGED.
    - V-DEV-FAILURE-DRILL and seven-day V-DEV-ROLLOUT-GATE.
    - V-PROD-PAYMENT-CONFIG, V-PROD-DISCORD, and V-PROD-ROLLOUT after explicit production approval.
    - V-SPEC-VERIFY final.

