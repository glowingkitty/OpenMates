clarification:
  rounds:
    - question: Should implementation include real delivery validation rather than only rendering and unit tests?
      answer: Yes. Send a test email and Discord notification with real data from the current dev server's last 24 hours.
    - question: How should self-hosting activate the daily report?
      answer: Automatically when an admin email is defined and a working email sending service is available.
    - question: How should self-host reports represent billing?
      answer: They must not mention billing at all; billing details exist only for official-cloud dev and production.
    - question: Is proof-video evidence required?
      answer: No. Validate through deterministic checks, real delivery receipts, and inspected email/Discord artifacts instead.
    - question: Which Discord destination should become canonical for production operations?
      answer: Use one dedicated production operations destination for daily status, urgent transitions, payment readiness, and degraded-service reports; retain production smoke only as fallback.
  vision_summary: >
    Operators should receive one concise daily operational snapshot and prompt,
    low-noise urgent alerts whose delivery does not depend on the failing service.
    The setup is not accepted until real dev data reaches both email and Discord;
    self-host email activates automatically when configured and omits billing entirely.
    Official cloud additionally reports fresh provider status and independent
    non-mutating EU/Managed payment readiness through one canonical operations
    Discord destination, while deployed dev Stripe E2Es prove complete sandbox flows.
  approved_by_user: true

