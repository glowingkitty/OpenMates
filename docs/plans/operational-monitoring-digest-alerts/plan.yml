goal: >
  Give operators a trustworthy, compact daily view of the preceding 24 hours and
  independently notify them about urgent failures. Prove the complete email and
  Discord flow with real dev-server data before any production rollout, and
  automatically enable self-host email digests when the required recipient and
  email service are available without exposing any billing concept on self-host.

scope:
  in:
    - Collect host CPU, memory, disk-used, disk-free, filesystem, and monitoring-freshness time series.
    - Keep container resource, API, worker, queue, latency, availability, and error metrics.
    - Correct invalid memory utilization alerts that currently produce infinite values for containers without limits.
    - Aggregate privacy-safe chats, messages, embeds, usage entries, explicitly labeled AI response recovery jobs, exact rolling-24-hour credit purchases/credits sold, usage charging outcomes, and current open purchase issues.
    - Render one compact 24-hour PNG plus a short scan-first email and Discord summary.
    - Rank at most three operator issues by severity, active state, frequency, and recency.
    - Send immediate, deduplicated critical alerts and recovery events through an API-independent path.
    - Record report generation, channel acceptance/failure, and freshness so silence becomes an incident.
    - Add an explicit dev command that sends one real-data test email and Discord notification.
    - Automatically schedule self-host email delivery when an admin email and working email service exist.
    - Remove billing fields, sections, check IDs, status text, and incidents from all self-host operational monitoring output.
    - Require a dev burn-in and controlled failure drills before separately approved production rollout.
    - Report fresh configured-provider availability as healthy counts plus unavailable, skipped, and stale names.
    - Evaluate EU Stripe and Managed Payments independently with non-mutating live-account, active-price, webhook-destination, required-event, route, worker, and settlement checks.
    - Resolve one canonical production operations Discord destination for daily status, urgent transitions, payment readiness, degraded-service reports, and recovery, with the production-smoke destination as fallback only.
    - Require both deployed dev Stripe purchase specs to pass after the monitoring changes are deployed.
  out:
    - Grafana deployment or a new browser dashboard.
    - Public or developer monitoring APIs.
    - npm or pip SDK monitoring surfaces.
    - Apple or end-user notification behavior.
    - Raw user content, ciphertext, identities, payment identifiers, secrets, destinations, or unsanitized stack traces.
    - Automated server remediation, restart, rollback, or payment mutation.
    - Production SSH changes or deployment without explicit production approval.
    - Recurring synthetic live PaymentIntent or Checkout Session creation.
    - Proof-video generation; the user explicitly waived video for this non-visual operational workflow.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401, so no tracker result could be verified in this session.
  docs:
    - docs/architecture/infrastructure/health-checks.md
    - docs/architecture/infrastructure/cronjobs.md
    - docs/architecture/core/servers.md
    - docs/plans/post-update-runtime-health-alerting/plan.yml
    - docs/contributing/guides/spec-driven-development.md
  contracts:
    - specifications/architecture/operational-monitoring/specification.yml approved for the durable settlement-ledger revision in session 8771 with fingerprint 57154ff095eff8151a10a7d5caadd1fcbad76ec97d87f70a9719af6a4ea88197.
  code_patterns:
    - backend/core/monitoring/prometheus/prometheus.yml scrapes API, cAdvisor, selected Celery workers, and remote-writes to OpenObserve.
    - backend/core/monitoring/prometheus/alert_rules.yml covers API errors, latency, availability, Celery failures, restarts, memory, and target health.
    - backend/core/monitoring/alertmanager/alertmanager.yml routes every alert back through the API email webhook.
    - backend/core/api/app/tasks/email_tasks/daily_issue_digest_task.py sends a weekday-only error/test email without resource graphs or delivery receipts.
    - backend/core/api/app/tasks/health_check_tasks.py sends a separate weekday-only degraded-services Discord digest.
    - backend/core/directus/schemas/server_stats_global_daily.yml stores aggregate activity, usage, token, purchase, and subscription counters.
    - frontend/packages/openmates-cli/src/serverHealth.ts already owns host-local incident state, retrying email/Discord/webhook delivery, recovery, and heartbeat behavior.
    - backend/core/api/requirements.txt already includes Pillow and CairoSVG for deterministic image rendering.
  tests:
    - backend/tests/test_degraded_services_discord_report.py
    - backend/tests/test_runtime_health_verifier.py
    - frontend/packages/openmates-cli/tests/server.test.ts
    - scripts/audit_runtime_health_contract.py
  live_findings:
    - The current dev Prometheus targets were all up during discovery.
    - The current HighMemoryUsage rule fired many +Inf percent alerts because zero or missing container limits are used as denominators.
    - The current APIDown alert uses the API itself as its only receiver path.
    - No openmates systemd monitoring timers were installed on the dev host during discovery.
    - The public production health endpoint returned populated sanitized service maps, while dev returned healthy with empty maps; neither public payload proves freshness.
    - A user-initiated production EU payment attempt created one live PaymentIntent and stopped in requires_payment_method without a charge.
    - The live Stripe account exposes one enabled classic/v2 snapshot event destination that omits checkout.session.completed and other backend-handled Managed Payments, subscription, refund, and dispute events.
    - The production weekday degraded-services report currently skips because no supported production Discord destination is configured in that runtime.
    - The existing Stripe health probe only calls stripe.Account.retrieve and therefore cannot detect product, price, or webhook-subscription drift.

