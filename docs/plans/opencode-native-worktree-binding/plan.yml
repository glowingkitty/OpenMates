risks:
  - id: R-1
    severity: high
    risk: Hook path mutation could route a local tool outside the intended session worktree.
    mitigation: Canonicalize relative targets, reject traversal and symlink escapes, force Bash workdir, and verify parent and child routing live.
  - id: R-2
    severity: high
    risk: Bootstrap could mutate root dependencies or make startup too slow.
    mitigation: Use caches only, keep writable state local, impose a budget, and hash root prerequisites in tests.
  - id: R-3
    severity: high
    risk: Validation against an old dev base could push stale work.
    mitigation: Refresh under final lock, rebuild, rerun invalidated gates, and never force-push.
  - id: R-4
    severity: high
    risk: Cleanup could delete unique source work or leave orphaned integration state.
    mitigation: Distinguish source/integration identities and retain existing reconciliation safeguards.
  - id: R-5
    severity: medium
    risk: Routed and grandfathered modes could normalize the same logical file differently.
    mitigation: Canonical repository-relative keys and mixed-mode regression tests.
  - id: R-6
    severity: medium
    risk: Missing or stale routing metadata could block the commands needed to diagnose and repair the session.
    mitigation: Always allow reads, searches, status, start, ensure, and repair while returning Reason and Next for blocked mutation.

