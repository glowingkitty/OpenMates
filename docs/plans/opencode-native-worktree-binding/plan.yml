decisions:
  - id: D-1
    status: active
    decision: Keep Git worktrees as the source-edit isolation primitive.
    reason: Shared root reintroduces file, untracked-content, and index contamination.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: superseded
    decision: Bind new mutating sessions to their actual worktree directory.
    reason: File tools, Bash, generators, tests, and children need one workspace.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: superseded
    decision: Keep rewriting only for pilot fallback and grandfathered sessions, then require native binding.
    reason: Transition safely without retaining split-directory execution permanently.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-4
    status: active
    decision: Bootstrap worktree-local prerequisites using shared immutable caches, not writable root dependencies.
    reason: Local commands must work without cross-session dependency mutation.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-5
    status: active
    decision: Validate selected patches in disposable integration worktrees.
    reason: Failed gates and retries must not partially modify root.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-6
    status: active
    decision: Allow parallel preparation and serialize only final refresh, commit, and non-force push.
    reason: Long gates should not hold a global deploy lock.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-7
    status: active
    decision: Keep presence and shared runtime identity outside this spec.
    reason: They have separate state and failure boundaries.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-8
    status: superseded
    decision: Move the same OpenCode Web session, then require one worktree-addressed continuation before repository tools resume.
    reason: OpenCode cannot change the runtime instance processing the current root request, but a worktree URL for the same session preserves history and creates the correct instance without replacing the chat or modifying OpenCode.
    decided_at: "2026-08-04T21:15:00Z"
  - id: D-9
    status: active
    decision: Keep OpenCode Web sessions rooted and route every local tool through the sessions.py worktree using hook-mutated arguments.
    reason: Root URLs survive restart and cancellation, while OpenCode invokes tool.execute.before before execution and its shell honors a hook-mutated workdir.
    decided_at: "2026-08-04T22:30:00Z"
  - id: D-10
    status: active
    decision: Never block reads or lifecycle recovery because routing metadata is missing, pending, stale, or inconsistent.
    reason: Native binding guards blocked Shell and Task operations needed to repair sessions 1c57 and fb93 after restart.
    decided_at: "2026-08-04T22:30:00Z"
  - id: D-11
    status: active
    decision: Align always-loaded agent instructions with hook policy and require every hook rejection to label Reason and Next.
    reason: Preventing predictable rejected calls saves model turns, while actionable alternatives stop repeated retries and self-created dead ends.
    decided_at: "2026-08-04T22:45:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-3
    approach: Keep OpenCode in root and rewrite selected tool paths permanently.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: Bash, generators, tests, and children retain a different workspace context.
  - id: ATTEMPT-2
    task_id: TASK-6
    approach: Continue copying session files into root before gates.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: Partial integration caused reapplication failures and blocked retries.
  - id: ATTEMPT-3
    task_id: TASK-6
    approach: Hold one global lock through every lint and test gate.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: It serializes long independent preparation and reduces throughput.
  - id: ATTEMPT-4
    task_id: TASK-4
    approach: Treat a successful moveSession metadata update as if it changed the runtime instance handling the current prompt.
    outcome: rejected
    recorded_at: "2026-08-04T21:10:00Z"
    reason: Live pilot parent and child pwd remained in root for the current prompt even though stored session.directory pointed at the worktree.
  - id: ATTEMPT-5
    task_id: TASK-4
    approach: Create a replacement OpenCode chat after the root chat initializes its worktree.
    outcome: rejected
    recorded_at: "2026-08-04T21:15:00Z"
    reason: It duplicates chats and splits conversation history; root-hosted routing avoids replacing or moving the chat.
  - id: ATTEMPT-6
    task_id: TASK-4
    approach: Move the same Web session and require continuation through a worktree-addressed URL.
    outcome: rejected
    recorded_at: "2026-08-04T22:25:00Z"
    reason: The legacy plugin SDK did not expose moveSession, prior native records disagreed with OpenCode storage, and restart guards prevented existing canceled chats from continuing or repairing themselves.
  - id: ATTEMPT-7
    task_id: TASK-4
    approach: Replace output.args with a new routed object inside tool.execute.before.
    outcome: rejected
    recorded_at: "2026-08-04T23:38:00Z"
    reason: The live restart pilot reconstructed environment identity, but OpenCode executed the original args object, so parent and child Bash remained in root; routing must mutate that object in place.
  - id: ATTEMPT-8
    task_id: TASK-6
    approach: Reapply an amended retained-worktree patch from its original creation base after an earlier successful deploy.
    outcome: rejected
    recorded_at: "2026-08-04T23:45:00Z"
    reason: The disposable integration correctly blocked conflicts because the historical patch was already present on dev; repeat deploys must diff selected amendments from the recorded merged_commit.
  - id: ATTEMPT-9
    task_id: TASK-6
    approach: Classify files as untracked using only the retained source worktree's original index during a repeat deploy.
    outcome: rejected
    recorded_at: "2026-08-04T23:50:00Z"
    reason: Files first added by the prior deploy already exist in merged_commit; later edits must be treated as tracked amendments relative to that effective integration base.
  - id: ATTEMPT-10
    task_id: TASK-6
    approach: Push a successful disposable integration commit without advancing the local control-plane checkout.
    outcome: rejected
    recorded_at: "2026-08-04T23:58:00Z"
    reason: Restarted OpenCode loaded the previous local plugin despite origin/dev containing the fix; successful pushes must fast-forward local dev under the same short lock while preserving unrelated dirty files.
  - id: ATTEMPT-11
    task_id: TASK-6
    approach: Select repeat-deploy files against stale legacy root_applied_files after a newer merged_commit exists.
    outcome: rejected
    recorded_at: "2026-08-05T00:04:00Z"
    reason: The preview included files already present in the last deployed commit; merged_commit must be authoritative for every retained-worktree state comparison.
  - id: ATTEMPT-12
    task_id: TASK-7
    approach: Treat green happy-path regressions as sufficient without a final adversarial review.
    outcome: rejected
    recorded_at: "2026-08-04T23:54:00Z"
    reason: Review found missed repeat-deploy reverts/deletions, cross-worktree absolute-path access, and a post-push local-sync metadata dead end; focused guards and tests were required.
  - id: ATTEMPT-13
    task_id: TASK-7
    approach: Finalize a retained worktree by comparing historical full patch IDs after incremental deployments.
    outcome: rejected
    recorded_at: "2026-08-05T00:18:00Z"
    reason: Completion evidence deployed, but cleanup preserved the worktree because historical and incremental patch IDs differ; finalization must compare current file states to merged_commit, and changes_pending must remain routable for recovery.
  - id: ATTEMPT-14
    task_id: TASK-7
    approach: Reconcile source-index untracked classification only when merged_commit differs from base_commit.
    outcome: rejected
    recorded_at: "2026-08-05T00:23:00Z"
    reason: Recovery reset base metadata without rewriting the retained index, so a tracked spec amendment looked untracked; classification must always query the effective source tree.
  - id: ATTEMPT-15
    task_id: TASK-7
    approach: Treat all differences between a stale detached checkout and current dev as unintegrated working-tree residuals.
    outcome: rejected
    recorded_at: "2026-08-05T00:27:00Z"
    reason: Finalization listed unrelated committed branch drift; candidate residuals must come from actual HEAD-relative dirtiness and tracked session paths before state comparison with merged_commit.

