implementation_notes:
  plan_path: docs/plans/opencode-native-worktree-binding/plan.yml
  existing_patterns:
    - sessions.py detached worktrees, patch identity, finalization, and reconciliation
    - openmates-hooks.js identity mapping, guards, leases, stale reads, and path rewriting
    - OpenCode v1.17.19 tool hook ordering, ShellTool workdir, and child parentID
  architecture: >
    Retain sessions.py as lifecycle authority and keep OpenCode Web root-addressed.
    Resolve each top-level or child identity to durable worktree metadata before
    every local tool, rewrite local paths, force Bash workdir, and preserve a
    non-blocking repair lane. Validate patches in disposable integration
    worktrees and serialize only final refresh, commit, and non-force push.
  data_flow:
    - Bind the OpenCode ID to one repository session, create and bootstrap its worktree, and mark durable worktree_routed state.
    - Resolve child parentID to the top-level mapping on each local tool without requiring plugin-local cache.
    - Rewrite file/search arguments, force Bash workdir, and pass the worktree cwd to shared hooks.
    - Keep reads and lifecycle recovery available when route resolution fails; block only unresolved mutation with Reason and Next.
    - Deploy captures selected patch and validates it in an exact-base integration worktree.
    - Finalization locks, refreshes dev, rebuilds and revalidates if needed, pushes, records evidence, and cleans integration state.
  affected_files:
    - {path: .opencode/plugins/openmates-hooks.js, reason: Resolve parent routes, rewrite local tools, force Bash workdir, and provide actionable recovery.}
    - {path: scripts/sessions.py, reason: Record restart-safe routing, reuse session identity, bootstrap, and implement root-free integration.}
    - {path: scripts/verify_opencode_native_worktree.py, reason: Prove installed-runtime behavior.}
    - {path: scripts/tests/test_opencode_native_worktree_binding.mjs, reason: Verify plugin rollout contract.}
    - {path: scripts/tests/test_sessions_native_worktree_lifecycle.py, reason: Verify modes and grandfathering.}
    - {path: scripts/tests/test_sessions_worktree_bootstrap.py, reason: Verify prerequisites.}
    - {path: scripts/tests/test_sessions_integration_worktree.py, reason: Verify failure containment.}
    - {path: scripts/tests/test_sessions_integration_concurrency.py, reason: Verify finalization ordering.}
    - {path: scripts/tests/test_sessions_native_worktree_reconciliation.py, reason: Verify cleanup.}
    - {path: scripts/audit_native_worktree_scope.py, reason: Prevent this spec from absorbing presence implementation or dropping prior safety outcomes.}
    - {path: docs/contributing/guides/agent-workflow-core.md, reason: Prevent agents from issuing predictably rejected root tool calls.}
    - {path: .claude/rules/session-lifecycle.md, reason: Explain routed Web sessions and recovery behavior.}
    - {path: docs/contributing/guides/concurrent-sessions.md, reason: Document routed tools, restart recovery, and integration.}
    - {path: docs/architecture/agent-tooling-parity.md, reason: Document the OpenCode routing boundary.}
    - {path: docs/plans/agent-presence-coordination/plan.yml, reason: Update dependency after implementation.}
  verification_strategy:
    - Confirm installed-runtime assumptions before production hook changes.
    - Write red tests before routing, bootstrap, or integration code.
    - Review pilot structural diagnostics before routed rollout.
    - Keep grandfathered sessions deployable until natural finalization.
    - Run existing worktree suites and tooling audits after each slice.
    - Run spec_verify.py and obtain user confirmation before completion.
  verification_order:
    - installed OpenCode tool-hook, Bash workdir, and child parentID proof
    - routing lifecycle, recovery messaging, and bootstrap tests
    - root-addressed parent, child, and restart pilot
    - disposable integration and concurrency tests
    - routed tool and existing-worktree regressions
    - user confirmation

