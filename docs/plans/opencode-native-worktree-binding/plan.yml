schema_version: 2
id: opencode-native-worktree-binding
title: Root-Hosted OpenCode Worktree Routing and Isolated Integration
status: draft

goal: >
  Keep normal OpenCode Web chats stable in the root project while hooks route
  file tools, Bash, generators, tests, and child sessions deterministically into
  one sessions.py worktree, including after server restarts, then deploy through
  disposable integration worktrees so failures never leave patches in root.

scope:
  in:
    - Keep each OpenCode Web chat at its normal root URL and map it to the detached worktree created by sessions.py.
    - Route local filesystem tools and Bash into the canonical repository-session worktree before the first source edit.
    - Bootstrap ignored dependencies and generated prerequisites deterministically inside new worktrees without mutating root dependencies.
    - Prove relative reads, searches, edits, Bash commands, generators, and new child sessions use the routed worktree.
    - Recover routing from durable session and child-parent metadata after OpenCode restarts without rebinding.
    - Keep reads and exact lifecycle recovery commands available when routing is missing so safeguards cannot deadlock recovery.
    - Grandfather already-running legacy chats without moving or discarding their dirty state.
    - Replace root patch application during deploy with disposable integration worktrees based on exact origin/dev commits.
    - Allow parallel integration preparation and validation, with a short lock for final refresh, commit, and push.
    - Rebuild and revalidate prepared work when origin/dev advances; never overwrite or force-push newer dev work.
    - Preserve edit leases, stale-read checks, deploy selection, blocked-deploy visibility, finalization, reconciliation, manifests, and release readiness.
    - Add deterministic tests and an isolated real OpenCode verifier before routed rollout.
  out:
    - Upgrading or modifying OpenCode, or enforcing a hardcoded OpenCode version.
    - Implementing docs/plans/agent-presence-coordination/plan.yml.
    - Changing the verified stale-worktree deletion policy.
    - Replacing edit leases, stale-read checks, Docker locks, test-account leases, or commit-scoped deployed verification.
    - Isolating Docker, the dev API, databases, caches, test accounts, providers, or Vercel aliases.
    - Adding a background integration worker or automatic merge queue.
    - Migrating active legacy chats or force-moving root changes.
    - Adding an OpenMates product API or user-facing web/Apple UI.

