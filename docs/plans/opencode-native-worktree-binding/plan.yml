  verification: [Apple verification is not required unless Apple source is unexpectedly changed.]
  intentional_native_differences: [none]

clarification:
  rounds:
    - question: Should the first spec cover only native binding or also root-free deploy integration?
      answer: Cover both native binding and disposable integration worktrees.
    - question: What should happen when routing cannot resolve during rollout?
      answer: Keep reads and lifecycle recovery available, and block only unresolved mutation with an exact next action.
    - question: How should existing chats be handled?
      answer: Grandfather them under the legacy model without moving dirty state.
    - question: May integrations prepare concurrently?
      answer: Yes; serialize only final refresh, commit, and push.
    - question: How should worktrees receive ignored prerequisites?
      answer: Run deterministic worktree-local bootstrap backed by shared package caches.
  vision_summary: >
    Normal OpenCode Web chats remain root-addressed while hooks route local tools
    and child sessions into one detached sessions.py worktree. Routing survives
    restart, keeps reads and repair available on failure, and gives every block an
    exact alternative; deployments validate in disposable integration worktrees
    and converge on dev only through a short refresh, commit, and push lock.
  approved_by_user: true

