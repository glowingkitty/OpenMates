schema_version: 2
id: connected-accounts-central-page
title: Central connected-accounts page, Gmail read and drafts, popup sign-in
status: implementing
goal: >
  One central Settings > Account > Connected accounts page lists every connected
  account across providers and apps with its email and last use; each account has
  a sub-page with per-app permissions, Reconnect and Disconnect. App settings pages
  only show which accounts the app may use. One Google account serves Calendar and
  Gmail (search, read threads, create drafts; no sending). Provider sign-in opens in
  a popup so OpenMates stays open.
scope:
  in:
    - Central page, account sub-page, app page summary on web.
    - Multi-app permission envelope in the encrypted app permissions (Rust core + web).
    - Client-encrypted encrypted_last_used_at and plaintext connector_status reconnect_required on connected_accounts.
    - Gmail search, read thread and create draft skills on Google's official API.
    - Popup or new-tab OAuth with same-tab fallback that returns to the originating settings page.
    - Clear classification of disabled Google APIs (accessNotConfigured).
  out:
    - Any Gmail send path (deferred by owner decision, 22 Nov).
    - Proton Mail changes.
    - Apple UI (handed to the Apple chat as a note).
scenarios:
  - id: S-1
    title: See and manage all connected accounts in one place
    given:
      - A user has one Google account (Calendar and Gmail) and one legacy expired Google row.
    when:
      - The user opens Settings > Account > Connected accounts and an account's sub-page.
    then:
      - Each entry shows provider icon, email (or "Email not saved" with connect date) and last use; the sub-page shows per-app permissions, Reconnect and Disconnect.
  - id: S-2
    title: App page shows only usable accounts
    given:
      - The Calendar app has one usable Google account.
    when:
      - The user opens Settings > Apps > Calendar.
    then:
      - The page lists that account and links to the central page, with no connect or manage buttons.
  - id: S-3
    title: Gmail read and drafts through the shared Google account
    given:
      - The Google account granted Gmail read and compose scopes.
    when:
      - The assistant searches mail, reads a thread or creates a draft.
    then:
      - Results come from Gmail; drafts are never sent; placeholders are refused before any Google call.
  - id: S-4
    title: Sign-in keeps OpenMates open
    given:
      - The user starts adding or reconnecting an account.
    when:
      - The provider sign-in completes in a popup, or in the same tab when popups are blocked.
    then:
      - The opener updates by itself; the same-tab path returns to the originating settings page with a success or error message.
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Central page lists every account with email or legacy hint and last use; sub-page shows per-app permissions, Reconnect and Disconnect with confirm.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-CENTRAL]
  - id: AC-2
    scenario: S-2
    text: App pages show only the accounts the app may use plus a link; no duplicate connect or manage buttons.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-APP-PAGE]
  - id: AC-3
    scenario: S-3
    text: Gmail search, read thread and create draft pass with a fake Gmail server; no send path exists.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-GMAIL]
  - id: AC-4
    scenario: S-4
    text: Popup sign-in updates the opener; blocked popup falls back to same-tab return with a message.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-APP-PAGE]
  - id: AC-5
    scenario: S-1
    text: the client writes encrypted_last_used_at (throttled) after a turn token ref is minted, the server refuses plaintext last_used_at, and invalid_grant marks reconnect_required.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-USAGE]
