- id: AC-11
  scenario: S-11
  text: Rules support coherent multi-practice built-in and personal/Project Markdown guides with title/description/when_to_use
    headers; Jev selects guide IDs, preserves authority/Project privacy and provides quiet inspectable loaded-guide
    information with Web/Apple/TUI semantic parity.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
