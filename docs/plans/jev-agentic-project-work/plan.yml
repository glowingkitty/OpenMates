    evidence quality, command safety and uncertainty.
  required: false
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  verification_ids:
  - T-DESIGN
- id: AC-2
  scenario: S-2
  text: Exactly one Project-owned focus is routed through preprocessor shortlisting, main-processor selection and
    the standard countdown, with detailed Project context loaded only after authoritative activation.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - projects.focus.inferred-consent
  verification_ids:
  - T-PROJECT-UNIT
  - T-PROJECT-UI
- id: AC-3
  scenario: S-3
  text: Rejection, stale requests and revoked access prevent activation/context loading; default-on auto-selection
    can be disabled in both web and CLI while explicit Project mentions continue to work.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - projects.focus.auto-selection-setting
  - projects.focus.inferred-consent
  verification_ids:
  - T-PROJECT-UNIT
  - T-PROJECT-UI
- id: AC-4
  scenario: S-4
