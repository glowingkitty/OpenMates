- id: AC-10
  scenario: S-10
  text: Jev evaluates mechanically assembled original-goal/Plan/Task/recent-work context without custom checks;
    material drift triggers LLM correction review, and an accepted correction delivery produces the exact agreed
    expandable sent notice with generated provenance and no forced cancellation.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - chats.direction.context-assessment
  - chats.direction.reviewed-correction
  verification_ids:
