schema_version: 2
id: jev-agentic-project-work
title: Broader Jev decision support for agentic project work
status: verified
goal: 'Make better use of Jev to drastically improve the agentic working and coding capabilities of OpenMates. Investigate
  the code base, then discuss ten rounds of questions, one question per round, updating the implementation and testing
  plan after each answer. After ten questions summarize the implementation plan and needed spec changes, then implement
  after user approval.

  '
tracking:
  authority: OpenMates Tasks
  task: TASK-8443
  task_id: 2aff5eb1-896a-4396-83e3-c8f2b044dc20
  external_chat: codex:01a0fd2e-67b3-7342-b062-c00ab5fc4d1a
  session: 0f58
  workspace: /home/superdev/projects/OpenMates/.openmates-agent-worktrees/agent-0f58
scope:
  in:
  - Relevant project and related-task summaries for each chat.
  - Vault-encrypted in-memory active/recent chat summaries, preserving client-encrypted long-term storage and server
    inability to decrypt old chats independently.
  - Separate focus instructions and phases from executable workflows and decisions.
  - Project-scoped Specification/rule selection, focus modes, workflows and folder context; new Project memories
    are deferred.
  - Workflow selection and execution with current-chat or subchat delivery.
  - Saving a remote-access Project Workflow also writes its portable YAML definition into the selected remote folder.
  - Dynamic chat-direction evaluation against the user goal, linked Plan and Tasks, allowing relevant discoveries.
  - LLM-reviewed drift correction instructions with an expandable, truthful chat notice after delivery.
  - Built-in app, personal and Project Rules as reusable best practices, selected through Jev with quiet inspectable
    cross-client loading events.
  - User-authorized subagent research and brainstorming of current best practices for Code, Design and other applicable
    existing apps, producing app-specific Rule catalogs after final approval.
  - Terminal command risk evaluation alongside deterministic authorization and confinement.
  - User-triggered background Focus authoring jobs, completion notifications linking to Focus embeds, and fresh
    saved Focus revisions on later follow-ups.
  - Focused testing, real-provider evaluation, and approved specification updates.
  - Project-only two-stage Focus improvement recommendations and catalog-based creation recommendations; only a
    button click triggers background LLM authoring.
  - Project Workflow updates use the same metadata shortlist, authorized full-definition second Jev assessment and
    click-triggered background authoring/notification flow as Focus updates.
  out:
  - Product implementation before ten answered questions and final user approval.
  - Treating Jev as a generator of summaries, instructions, fixes or arbitrary structured text.
  - Custom natural-language chat-direction Check authoring in this expansion; use mechanically assembled existing
    context instead.
  - A new Project-memory storage or ownership model; retain existing personal/team memories.
  - Public/app Focus improvement proposals and personal/global Focus authoring suggestions outside user Projects.
  - Project creation suggestions, anonymous app-skill contributions and admin messaging in this expansion.
  - Wholesale implementation of the separate Specification/Plan/Check product lifecycle, custom quality Check authoring
    or automatic test-repair loops.
discovery:
  jev:
  - Existing typed decisions serve preprocessing, safety, ranking, workflow authoring and postprocessing.
  - Client limits calls to 160 questions, 80000 serialized state characters and 120000 total request characters.
  - Generative models still write summaries, instructions and proposed changes.
  project_context:
  - Chat routing supplies at most forty authorized project IDs/names, without descriptions or summaries.
  - Standard focus modes use a four-second cancellable countdown with authoritative server activation; Projects
    currently special-case activation with explicit Grant access rather than that countdown.
  - Project activation injects one full focus instruction; client-side decryption is required for Project-owned
    private context.
  - Task context supplies chat-attached or mentioned lifecycle metadata without project task titles/descriptions.
  - Encrypted app memories have personal/team scope; new Project memories are deferred.
  - Current checkout now implements focus phases, Jev requirement/completion/rewind decisions and permission-scoped
    app/workflow tool reselection on phase transitions; broader context and saved-Workflow discovery must build
    on this existing path.
  - AppInstructionDefinition already supports instruction text with category/embed gating and skill-dependent prompt
    loading; no first-class selectable Rule catalog or user-visible Rules-loaded event was found.
  - Existing Focus Markdown uses name/description/preprocessor-hint frontmatter; the agreed Rule format uses title/description/when_to_use,
    so reuse parsing primitives without treating Rules as Focus definitions.
  current_decision_areas:
  - Preprocessing routes model reasoning/task area, topic/language/temperature and previews, detects topic shifts/user
    dissatisfaction/safety concerns, and shortlists skills/focuses/memory categories.
  - Request safety confirms allow/block/uncertain, harm category and requested action, with evidence selected from
    actual user-text spans.
  - External text and structured skill outputs use Jev prompt-injection gates; ambiguous or flagged structured output
    goes to the existing exact-span generative sanitizer.
  - Optional public search relevance ranks bounded candidates against user criteria; skill-owned hard filters and
    result limits remain authoritative.
  - Event search uses semantic specialist-provider selection for ambiguous requests alongside deterministic routing.
  - Workflow authoring shortlists registry capabilities/inputs and saved targets, checks authored AI questions/instructions,
    and recommends earlier-value references; configured runtime AI Checks use typed branch outcomes.
  - Focus phases use bounded completion/rewind decisions and app/workflow tool reselection at phase changes.
  - Postprocessing rates response safety and ranks useful apps; generative models still produce summaries, titles
    and suggestions.
  workflows_and_terminal:
  - Workflow AI Checks already use bounded explicit earlier values and return true, false or Unsure.
  - Workflow execution follows a validated saved graph; node types, configured inputs, graph edges and branch outcomes
    govern execution.
  - AI Checks judge explicit earlier values and select configured branches; workflow shortlisting cannot invent
    or rewrite runtime steps.
  - Assistant-facing workflows.run already supports trusted source_chat_id, per-run message_destination_overrides
    and selected return_outputs; saved-graph mutation is not required for these invocation options.
  - Automatic selection and same-chat/subchat continuation still need integration semantics; reuse existing owned
    invocation/delivery rather than assuming a new chat is required.
  - Workflow capabilities currently exclude async/sandbox and approval-required skills.
  - Terminal safety uses exact approval and OS confinement; the model explanation has no approval authority.
  - Product Checks have a draft revision-bound specification; implementation was not found in this investigation.
  - Web Workflow-to-Project saves currently create an encrypted Project item; CLI remote-copy flags emit a writes_files=false
    proposal rather than writing the remote YAML.
  - Portable Workflow import/export already defines a versioned openmates-workflow document and .workflow.yml filename;
    reuse this format for Project files.
  - The chat activity endpoint reports running AI tasks; general chat timestamps also change for user messages,
    imports or edits and cannot alone prove a recent completed assistant response.
  - Tasks expose status, linked Project hashes, version and updated_at, with encrypted titles and activity summaries;
    context selection must preserve client-owned decryption.
  - Existing AI message cache is Vault-encrypted with a three-chat LRU and seventy-two-hour TTL, separate from client-encrypted
    sync/durable storage; do not expand full-message retention to implement summary routing.
  - Postprocessing already produces the latest summary before client encryption/persistence; this is a candidate
    point to populate a separate short-lived summary cache.
  - Shared Dragonfly cache configuration mounts cache-data; a mount alone does not establish memory-only retention,
    so new summary entries need verified exclusion from disk persistence and backups.
  - Unified notifications already provide user-scoped Redis/SSE events with safe translation keys and routing metadata;
    current assistant/mention routing is chat-oriented, so Focus-result routing needs an extension.
