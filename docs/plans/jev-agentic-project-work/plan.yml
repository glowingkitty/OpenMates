  - https://docs.typesafe.ai/api
  - https://docs.typesafe.ai/models
  - https://openrouter.ai/typesafe/jev-1.13
  instruction_loading:
  - Mindmaps app instructions currently have no skill/category/embed gating and are loaded whenever the app is eligible;
    Jev does not select mind-map instructions.
  - Interactive-question protocol is always included in the main prompt; the main processor decides when/how to
    ask. Focus instructions and the subchat ask_user_input tool can also guide clarification.
  - Other app instruction definitions support relevant skill, conversation-category and for_embed_types gating.
    Selecting these two protocols is not added to the approved expansion by the informational follow-up.
proposed_workstreams:
- Authorized Project/task/Specification/rule/folder context selection; new Project memories deferred.
- Focus-mode lifecycle, project scope, active phases and instruction precedence.
- Workflow discovery, triggering, chat/subchat routing and execution lifecycle.
- Dynamic chat-direction feedback anchored to user intent and linked work.
- Built-in app, personal and Project Rule Markdown definitions, bounded selection, ownership and quiet cross-client
  transparency.
- Terminal semantic risk classification integrated with deterministic permissions.
- Shared budgets, confidence handling, observability and real-provider evaluation.
specification_candidates:
  existing:
  - feature.projects
  - feature.focus-modes
  - feature.chats
  - feature.workflows
  - feature.notifications
  additional_paths:
  - specifications/features/app-skills/code-run
  note: Seven owning Specification bundles were approved by exact fingerprint and implemented. They do not authorize
    separate full Plan/Spec/Check lifecycles or new Project memories.
  identified_changes:
  - Replace projects.focus.inferred-consent's explicit-confirmation/no-timer behavior with the standard cancellable
    focus activation countdown.
  - Extend projects.focus.default-owned and focus-modes.countdown with one Work on (project name) focus per Project
    and the Project data-loading boundary.
  - Define Project auto-selection settings with default on, matching web/CLI behavior, and manual mention access
    when disabled.
  - Preserve cancellation, stale-turn, chat-scope and access-revocation protections; test them against countdown
    activation.
  - Extend focus lifecycle and prompt composition to keep the Project base active while one specialized focus is
    active, instead of clearing the Project binding.
  - Define one visible specialized focus title combining Project name and focus name, with responsive shortening
    that preserves the underlying full identity.
  - Integrate Jev context selection with the planned Specification/Plan/Check chain rather than storing design requirements
    as separate Project memories.
  - Extend regular and Project-specific focus activation with a focus-aware Jev reselection of eligible app skills,
    existing executable workflows and other permitted context.
  - Extend phased focus lifecycle with the same reselection after an authoritative active-phase change; refresh
    against the new active instructions.
  - 'Adapt focus-modes.full-instruction to the planned phase model: full active-phase instructions with other phases
    represented by titles, while preserving the Project base.'
  - Preserve the owning deterministic Workflow graph/Check contract; focus instructions and Specification requirements
    are separate objects.
  - Extend Tasks/Projects context contracts with bounded related chat/Task discovery and Jev relevance selection,
    including active/recent cross-Project candidates without activating those Projects.
  - Define a reliable assistant-response completion timestamp and meaningful Task-change freshness for candidate
    filtering; navigation or list reordering must not manufacture relevant activity.
  - Extend Workflow portability and Project file-save behavior so saving a Workflow in a selected remote Project
    folder writes its portable YAML through the existing authorized file path and reports partial failure honestly.
  - Extend chats.persistence.client-encrypted with an explicit memory-only Vault-encrypted active/recent summary
    cache boundary, expiry and access revocation; expired cache entries cannot be reconstructed by server decryption
    of durable chat records.
  - 'Define chat-direction evaluation separately from revision-bound product acceptance Checks: linked work is context,
    relevant discoveries remain permissible, and dynamic relevance cannot grant scope expansion or rewrite the user
    goal.'
  - Define Jev drift assessment followed by an LLM correction/no-correction decision, internal instruction delivery
    and an expandable notice bound to the actual delivered instruction.
  - Add a Rules Specification for built-in app, personal and Project guidance with Markdown title/description/when_to_use
    frontmatter, authorized selection, precedence and quiet Web/Apple/TUI loaded-rule transparency.
  - Extend Focus authoring with button-triggered background create/update jobs, no authoring LLM call before the
    click, independent chat continuation and saved-result availability in the Project workspace.
  - Extend notification target references/actions with authorized Focus embed routing and privacy-safe completion/failure
    state; reuse existing delivery preferences/history instead of creating a separate notification system.
  - Resolve authoritative saved Focus revisions on follow-up requests and invalidate stale instruction/phase/selection
    caches while preserving each already-running response's input snapshot.
  - Project-only catalog assessment includes inactive Focus titles/summaries; authorized selected full definitions
    undergo a second Jev improvement assessment before Update is offered. First-pass Create is permitted.
  - Terminal elevated/uncertain risk requires review before otherwise preapproved execution; no risk decision replaces
    deterministic permission/confinement.
  - Extend Project Workflow updates with the same catalog/full-definition Jev stages, button-gated background editing
    and ready notification; preserve deterministic graphs, existing authoring validation/enabled-state/partial-result
    semantics and immutable active-run versions.
  new:
  - feature.rules
  unchanged_dependencies:
  - feature.tasks
  - feature.specifications
  - feature.plans
  - feature.checks
  - feature.app-memories
  - feature.ai-model-routing
agreed_behavior:
  project_activation:
    catalog: Each Project has one associated Work on (project name) focus mode.
    routing: The preprocessor shortlists potentially relevant focus modes including eligible Project focuses; the
      main processor decides whether to activate one.
    presentation: Use the existing standard focus-mode countdown, click/ESC interruption and authoritative activation
      lifecycle.
    accepted: Only after the countdown completes without rejection, activate the Project focus and begin loading
      its instructions and other Project-specific processing/data.
    rejected: Do not load that focus or perform its Project-specific context selection/loading; continue without
      the proposed Project.
    preference: Project auto-selection defaults to on; expose a toggle in web settings and CLI Project settings.
    disabled: Automatic selection/activation is unavailable; the user must manually mention the Project.
    manual: Reuse the existing explicit Project-mention path rather than introducing a second confirmation flow.
    routing_boundary: Minimal Project discovery metadata remains necessary before activation; detailed Project context
      and project-specific decisions wait until activation.
    implementation_note: Reuse the standard lifecycle while retaining client-owned decryption; define how the connected
      client responds to authoritative countdown completion.
  specialized_focus:
    composition: Keep the Project base and its instructions active; one specialized focus adds its instructions
      and current-phase guidance.
    switching: Switching the specialized focus retains the active Project base and authorized Project association.
    visible_indicator: Once a specialized focus is active, show only that specialized active focus indicator; do
      not show a second active Work on Project indicator.
    title_format: Project name | Specialized focus name
    title_examples:
    - SocialHub | Debugging
    - OpenMates | Add new app skill
    narrow_layout: Render the combined title shortened when space is insufficient, retaining the full Project/focus
      identity in state.
    off_and_switch: Switching specialists retains the Project base. Disabling the Project clears its specialist
      and future Project instruction/context authority; shared off behavior remains authoritative.
  specification_ownership:
    design_guidelines: Design guidelines belong to their governing Specifications rather than a second Project memory
      representation.
    context_selection: Prefer selecting applicable Specification references/requirements alongside relevant Plans,
      Tasks, workflows and source context.
    approval_boundary: Relevance selection cannot approve a draft requirement, change the approved revision or discard
      deterministically required inherited obligations.
    project_memories: Deferred by the user in round ten. Preserve existing personal/team memory selection and authorized
      encrypted Project fact documents without duplicating Specs.
  concept_boundaries:
    focus: LLM instructions for reaching a specific goal in a chat, optionally organized into phases.
    specification: A detailed requirements document describing approved product behavior and design obligations.
    workflow: A predefined validated executable graph with deterministic steps and control flow; configured bounded
      AI Checks may select branches.
    selection: Jev may rank/shortlist existing workflow definitions; only an authorized invocation runs their configured
      graph. A focus's natural-language process is not itself a Workflow.
  post_focus_reselection:
    trigger: Every authoritative focus activation, including regular/global, Project-base and Project-specific specialized
      focuses.
    state: Bounded user goal/chat context, the effective activated focus instructions/purpose/current phase, and
      permission-scoped candidate catalogs.
    decisions: Reselect relevant app skills, existing workflows and other permitted context using the now-active
      focus as decision context.
    main_processor: Receives the updated candidates and decides which tools/workflows to use; relevance scores do
      not execute workflows or grant authority.
    rejected: A rejected or stale activation does not start this activation-dependent selection pass or load rejected
      Project context.
    current_reuse: Regular focus auto-confirm already starts a new ask_skill continuation; add effective focus context
      to its decision processing instead of scheduling a redundant unrestricted agent process.
    phase_transition: Run the same focus-aware reselection when an already active focus changes instruction phase,
      using the new phase as decision context.
    ordinary_progress: Phase-triggered reselection is not an additional trigger for every ordinary tool result inside
      an unchanged phase; normal message preprocessing remains.
    implementation_details: Exact data projection, selection budgets, candidate-cache reuse and spec-driven-development
      integration remain to be settled.
  related_work:
    direction: Jev chooses relevant bounded chat/Task summaries from deterministic eligible candidates, rather than
      injecting every same-Project summary or excluding all cross-Project work.
    same_project: Prefer same-Project work in the candidate pool; selected summaries still require relevance to
      the current goal and active focus/phase.
    cross_project_chats: Include active chats and chats whose latest completed assistant response is within the
      proposed thirty-minute discovery window, within the authorized current personal/team context.
    cross_project_tasks: Include active Tasks and recently changed blocked/done Tasks; thirty minutes is the user's
      proposed starting window.
    proposed_details:
    - Define active Tasks as in_progress, and active chats as work currently processing or explicitly awaiting continuation
      rather than any open browser tab.
    - Keep explicitly mentioned/linked dependencies eligible outside the discovery window, including older same-Project
      blockers.
    - Use authoritative completion/change metadata rather than generic navigation timestamps; preserve status, source
      references and freshness with summaries.
    - Bound and prioritize the candidate pool before Jev; use the agreed Vault-encrypted memory-only active/recent
      summary cache, not full other-chat transcripts or background client decryption of old chats.
    authority: Selecting a cross-Project summary does not activate that Project, load its files/focus instructions,
      claim a Task or create a second work owner.
    implementation_details: Use in_progress Tasks, currently processing or explicitly awaiting-continuation chats,
      authoritative assistant-completion and meaningful Task-change clocks, thirty-minute discovery freshness and
      explicit older links. Bound/paginate candidates under provider limits; missing private summaries remain absent.
  related_chat_summary_cache:
    requirement: Extend the existing server cache with Vault-encrypted summaries of eligible active chats and chats
      with a completed assistant response in the last thirty minutes.
    location: Memory only; never write this server-decryptable summary copy to disk, Directus, snapshots, backups,
      task receipts or content-bearing logs.
    durable_storage: Long-term summaries and chat content remain encrypted by the client with client-owned chat
      keys; do not escrow chat/master keys or add a server decryption path.
    population: Populate from authorized transient processing context and newly generated summaries; evaluate the
      existing postprocessing summary path for cache updates.
    lifetime: Bind eligibility and eviction to active work and the last completed assistant response, with bounded
      retention and access/deletion revocation; Jev reads must not perpetually extend eligibility.
    inference: Decrypt only eligible bounded summaries transiently for the permitted Jev request; do not retain
      the assembled plaintext request in logs or durable jobs.
    missing_or_expired: Treat an unavailable summary as unavailable; no server-side reconstruction by decrypting
      old Directus chats. Explicit user/client reopening of an old chat retains its existing separate authorization
      path.
    isolation: Preserve owner/team/chat access boundaries, source revision/freshness and revocation checks.
    proposed_details: Final cache key/index design, active-work expiry, restart behavior and how the shared cache
      excludes these entries from disk persistence remain implementation design work.
  remote_project_workflows:
    required: Saving a Workflow in a remote-access Project must also save its YAML definition in the selected remote
      folder.
    format: Reuse the portable openmates-workflow format and .workflow.yml filename convention.
    write_path: Resolve the selected source/folder and use existing Project file-write authorization, write policy,
      protected-path and version/conflict guards.
    completion: An encrypted Project item or remote-copy proposal alone is not proof that the YAML file was written;
      distinguish linked, pending and file-saved states and retain recoverable failure details.
    implementation_details: Write canonical portable YAML to the selected folder and refresh bound files on later
      saves under existing guards. External edits require explicit import/reconciliation; no bidirectional watcher
      is added.
  chat_direction:
    user_intent: Regularly evaluate whether a chat with linked Tasks/Plan still serves its goal or drifts into disconnected
      or irrelevant work, while allowing useful related discoveries and fixes.
    agreed_default: A reusable Jev direction evaluator over deterministically assembled context; do not define custom
      checks yet.
    anchor: Preserve the user's actual goal, current user clarifications and accepted Plan scope independently of
      the evolving Task list; drifted Tasks cannot redefine success merely by existing.
    state: Mechanically project bounded fields from existing goal/Plan summaries, open Tasks, actual user clarifications,
      active focus/phase and recent assistant actions/tool outcomes; retain source/version references and distinguish
      unavailable fields. No new generative check-definition/context-authoring pass is required.
    decisions: Classify on_track, justified_related_discovery, material_drift or insufficient_context; optionally
      select supporting evidence IDs from supplied candidates.
    custom_checks: Deferred; no mandatory or optional custom chat-direction Check definitions/authoring/storage
      in the current expansion.
    related_discoveries: A newly found causal issue, necessary dependency or regression risk can remain relevant
      when supported by evidence; a different main objective requires an actual user scope change.
    recommended_timing: Evaluate at completed-response boundaries when relevant progress/Tasks/Plan state changes,
      plus bounded checkpoints during long-running work; avoid blind inference polling of idle chats.
    drift_review: When Jev identifies material drift, an LLM reviews the original direction, current context and
      assessment to decide whether a correction instruction should be sent and, if so, writes the instruction.
    correction_delivery: Deliver the generated correction into the current chat's agent context using an internal
      continuation/event path; preserve its generated provenance rather than fabricating a user instruction or approval.
    visible_notice: Chat is drifting too far away from the goals. Correction instruction was sent.
    expansion: The notice has a dropdown/disclosure icon exposing the full LLM-generated correction instruction
      actually sent.
    delivery_truthfulness: Show the sent notice only after accepted delivery; no notice claiming correction delivery
      when the LLM declines, generation fails or delivery remains pending/failed.
    authority: A correction instruction adds guidance under existing user/scope/permission authority; it does not
      cancel work, delete Tasks, approve scope changes or prove acceptance criteria by itself.
    implementation_details: Exact cadence, reviewer model, internal delivery/wake behavior, deduplication and private
      event retention remain implementation decisions.
  rules:
    status: Rule concept, ownership, Markdown shape and quiet transparency agreed in round seven; runtime/editing
      details remain draft.
    concept: Reusable general best practices for how to work, such as JavaScript/Svelte/Python guidance, without
      a step-by-step goal process.
    boundaries:
      focus: Goal-directed instructions and optional phases.
      specification: Required target behavior/architecture/design obligations.
      memory: Facts, preferences and remembered context.
      rule: Reusable practice guidance; a required product/design outcome belongs to its Specification instead of
        a duplicate Rule.
    selection: Jev shortlists relevant app-specific Rules in preprocessing; select eligible metadata, load definitions,
      and refresh with focus/phase context. Private Project Rules wait for authoritative Project activation and
      authorized decryption.
    ownership: Built-in app Rules plus user-authored personal and Project Rules use the same concept; users must
      be able to create custom Rules inside Projects.
    document_format: Markdown body with YAML header fields title, description and when_to_use; titles/descriptions/applicability
      support discovery, while the body supplies loaded practice guidance.
    granularity: Each selectable Rule is a coherent topic/domain guide containing several best practices, such as
      Mobile first design, Svelte coding rules, Python coding rules or Accessibility best practices; do not create
      one independently selected Rule per tiny practice.
    counting: Loaded N rules counts applied Markdown guides, not individual bullets within them; Jev selects guide
      IDs using their title/description/when_to_use metadata.
    private_storage: Preserve client encryption for durable user/Project Rule documents; use existing authorized
      Project file/document storage and guarded remote file writes where applicable, with stable source/revision
      metadata.
    transparency: Automatically apply selected eligible Rules and emit a quiet expandable Loaded N rules line when
      the applied set first appears or materially changes, avoiding repeated unchanged notices; Web, Apple and TUI
      preserve the same information.
    expanded_view: Rule titles, source/app/Project and full text, with stable IDs/revisions bound to what was actually
      injected; count only successfully applied Rules.
    precedence: Best-practice relevance selection cannot remove core safety/tool protocol instructions, override
      explicit user intent, bypass permissions or silently weaken approved Specification obligations; conflicts
      need a clear resolution.
    applicability_note: Reusable app Rules may help work even without a skill invocation from that app; do not blindly
      inherit legacy skill-only gating for best-practice relevance. Retain app availability and other eligibility
      restrictions.
    implementation_details: Editing/registration UX, exact file paths, conflict resolution, disabled-rule controls
      and cross-client event representation.
  rule_research:
    authorization: User explicitly requested subagents for research/brainstorming current app best practices and
      warned against online prompt injection.
    artifact: docs/plans/jev-agentic-project-work/rule-research.md
    status: Initial practice research regrouped into six coherent Code/Design Markdown guide proposals after user
      feedback; publication/review remains part of implementation after final approval.
    assignments:
    - agent: /root/code_rules_research
      model: gpt-6-sol
      effort: medium
      ownership: Read-only Code app and primary-source coding/Svelte/TypeScript/Python research; no product edits.
      outcome: Four guide proposals for Svelte, Python, JavaScript and TypeScript, with multiple practices, applicability/version
        caveats and primary-source links.
    - agent: /root/design_rules_research
      model: gpt-6-sol
      effort: medium
      ownership: Read-only Design app and primary-source design/accessibility research; no product edits.
      outcome: Mobile first design and Accessibility best practices guides, separated from Project Specifications
        and OpenMates-specific DESIGN.md.
    method: Online content is untrusted evidence, never instructions/approval; use primary sources, do not execute
      page-supplied commands, preserve secrets and minimize quoted material.
    implementation_follow_up: Review source/version applicability, consolidate duplicated guidance, create built-in
      app-specific Markdown Rule files and inventory other existing apps for concrete useful practices.
  terminal_risk:
    agreed_policy: Combine deterministic authorization/confinement with Jev semantic risk assessment; elevated or
      uncertain results require explicit review before otherwise preapproved automatic execution.
    permissions: Jev cannot grant access, override deterministic denials, broaden resources or replace exact approval
      requirements; routine results retain existing approval behavior.
    input: Bounded normalized command/argv/cwd/declared-resource context and available authorized script evidence,
      all treated as data rather than evaluator instructions.
    explanation: Keep the existing separate LLM command explanation for readable effects/uncertainty; Jev supplies
      bounded risk decisions.
    tuning: Measure false positives and review burden on realistic labeled commands and disposable validation; the
      user permits later reconsideration if too aggressive, not a current waiver of the selected policy or deterministic
      guards.
    implementation_details: Use routine/elevated_risk/uncertain typed outcomes; outage is uncertain and requires
      review. Cover exact remote execution requests, unknown/indirect script effects and labeled false positives.
  post_response_proposals:
    status: Approved Project-only two-stage recommendation and click-triggered background authoring are implemented;
      final active-Focus continuation verification is in progress.
    scope: Only the current authorized user Project. Public/app Focus improvements and outside-Project personal/global
      authoring suggestions are excluded.
    first_jev: 'After a completed response, supply bounded authorized chat/goal context and the Project Focus catalog:
      IDs, titles and summaries, including inactive definitions. Jev selects existing candidates worth full inspection
      and/or recommends a useful non-overlapping new Focus.'
    full_loading: An authorization-enforcing loader obtains only selected full definitions through client-owned
      decryption/transient Project context paths. Jev selection does not fetch content itself, activate a Focus
      or grant access.
    second_jev: Assess the full selected Focus instructions against the chat. Only a confirmed useful improvement
      exposes Update. No-change, unavailable, failed or uncertain evaluation produces no Update button.
    create_button: The first catalog decision can expose Create focus mode directly when no existing definition
      adequately covers the reusable goal/process.
    generative_trigger: Only pressing Create/Update starts the validated scoped authoring LLM job. Neither Jev assessment
      nor full-definition loading triggers generative authoring.
    authoring_input: Snapshot authorized chat history at click plus dedicated Focus create/update instructions,
      Project target, and full expected base revision for updates. A late click needing expired history requires
      explicit authorized client supply; never server decryption of old chats.
    background_execution: Run independently of normal chat responses without creating a separate regular chat. The
      originating chat remains usable.
    persistence: Validate the document, ownership, permissions and base revision; persist via existing client-encrypted
      Project/content and applicable file-write paths. Concurrent edits cannot be silently overwritten.
    completion: Only a saved reachable result is ready. Notify with an authorized Focus embed link and expose the
      result in the regular Project workspace.
    privacy: Durable notification/job metadata contain safe state/routing references, not plaintext private instructions
      or chat history. Preserve encrypted content/recovery boundaries.
    revision_freshness: Next follow-up using the updated Focus resolves its saved revision and refreshes effective
      instructions, compatible phase state and selected context. Already-running responses retain their prior snapshot.
    activation: Creation does not implicitly activate a Focus; updating an active Focus takes effect on its next
      follow-up.
    reliability: Bind recommendations/jobs to Project, chat and revisions; deduplicate unchanged recommendations
      and clicks/retries. Revoked/deleted targets and failed/conflicting saves produce no success notification.
    example: SocialHub release planning can shortlist the inactive Release preparation Focus for full assessment.
      A missing reusable release process can justify Create directly from catalog assessment.
  project_memory_scope:
    status: Deferred by the user in round ten.
    decision: No new Project-memory store or authoring/settings lifecycle in this expansion.
    existing_context: Reselect existing personal/team memories under current permissions; authorized encrypted Project
      fact documents remain available after activation.
  post_response_workflow_updates:
    status: Explicit follow-up user direction after round ten; no additional question round.
    catalog: First Jev reviews authorized current-Project Workflow IDs, titles and summaries, including inactive/disabled
      definitions; pick candidates worth full inspection, not only Workflows already used in the chat.
    full_assessment: Load selected saved definitions under Workflow/Project access. A second Jev compares the full
      graph, inputs, steps, configured Checks and delivery settings with authorized chat context. Show Update only
      for a confirmed useful improvement; assessment does not execute a graph, node or Check.
    click: Only Update click starts an idempotent background invocation of that existing authoring pipeline, using
      permitted chat history, full target/base revision and dedicated Workflow editing instructions. No regular
      new chat; chat continues independently. Recommendation Jev stages precede the click; existing authoring Jev
      and LLM stages run only after it.
    validation: Reuse existing Workflow capability/input/reference/graph validation, expected-revision guards, atomic
      update and visible partial/failed-result semantics. Preserve existing enabled state only on a successful valid
      update; do not mint execution/resource grants.
    storage: Preserve the existing encrypted Workflow ownership/content lifecycle and guarded Project file binding;
      a bound remote Workflow save also updates its selected-folder YAML. Do not durably retain plaintext input
      chat history.
    completion: Saved reachable completion notifies with its Workflow embed/Project workspace link; pending remote
      writes and failed/conflicting/partial updates do not claim complete success.
    versions: Future invocations resolve the new saved definition under normal admission rules; an already-running
      Workflow retains its immutable pinned version.
    scope: Update recommendations are Project-specific. Existing user-requested Workflow creation is unchanged;
      this addition does not introduce automatic new-Workflow recommendations.
    authoring_pipeline: Update click invokes the existing AI-powered Workflow creation/editing Jev + LLM pipeline
      through WorkflowInputService and its registered planner/preselection/compiler/transaction path. Reuse its
      validation, billing, idempotency and partial-result handling; no parallel Workflow authoring engine.
    clarification: Existing authoring needs-clarification or failure becomes a visible pending/needs-input/failed
      job state, without automatically creating another regular chat or claiming success.
discussion:
  completed_rounds: 10
  total_rounds: 10
  current_round: 10
  question_format: One question per round, always including concrete examples and a recommendation.
  current_question: null
  discussion_method: Each remaining round follows a concrete user flow, explicitly mapping processing order, Jev
    input/projections/questions/output, main-processor actions and failure/cancellation branches; recommendations
    are proposals until accepted.
  answers:
  - round: 1
    question: When the user has not mentioned @project, should a strong Project match activate automatically or
      require explicit confirmation?
    answer: 'Use the same UI logic as focus modes. The preprocessor selects potentially relevant focuses, including
      one Work on (project name) focus per Project. The main processor chooses a focus and the usual countdown appears.
      Interruption prevents loading the focus and Project-related processing/data. Without rejection, activate and
      work on the Project. Auto-selection defaults to on and can be disabled in web Project settings or CLI settings,
      requiring a manual Project mention.

      '
    recommendation_disposition: The user rejected the proposed opt-in default and specified the existing focus-mode
      countdown with an opt-out setting.
  - round: 2
    question: After Project activation, how should a specialized focus such as UI implementation combine with Work
      on Storefront?
    answer: 'Keep the Project base plus one specialized focus as recommended. The user sees only the specialized
      focus active, whose title includes the Project name, for example SocialHub | Debugging or OpenMates | Add
      new app skill. Render it shortened if the UI has insufficient space. Clarify step four further with concrete
      examples and questions about processing/Jev requests.

      '
    recommendation_disposition: Accepted layered Project base plus one specialized focus, with a single Project-qualified
      visible specialized indicator.
  - round: 3
    question: Should context selection follow the main processor's actual focus activation or be bundled into the
      initial focus shortlist?
    answer: 'Workflows are deterministic workflows with bounded AI decisions for checks, focuses are chat LLM instructions
      for a specific goal, and Specifications are detailed requirements documents. Run Jev again to reselect relevant
      app skills, workflows and other context once a focus activates, for regular focuses as well as Project-specific
      focuses.

      '
    recommendation_disposition: Accepted activation-dependent reselection and expanded it to app skills and all
      focus types; corrected the workflow examples and concept boundaries.
  - round: 4
    question: For a focus with phases, should Jev reselection also run whenever the active phase changes?
    answer: Yes reselection with phases.
    recommendation_disposition: Accepted phase-transition reselection in addition to focus activation, preserving
      normal message preprocessing.
  - round: 5
    question: Should related-work selection consider only Tasks/chats in the active Project, or relevant work in
      other accessible Projects within the current personal/team context too?
    answer: 'Workflows saved in a remote-access Project must also save their YAML in the selected folder. For related
      work, consider letting Jev choose from all active chats and chats whose last response was in the last thirty
      minutes across Projects, and active Tasks plus blocked/done Tasks changed in the last half hour, rather than
      limiting all context to the same Project.

      '
    recommendation_disposition: Records the active/recent cross-Project relevance direction; exact cutoff and active-state
      details remain proposed because the user framed them as examples. The remote YAML file-save requirement is
      explicit.
  - round: 6
    question: Should chat-direction evaluation use existing goal/Plan/Task context by default instead of requiring
      custom checks?
    answer: 'Do not define custom checks yet. Deterministically assemble context for Jev to assess whether the chat
      is drifting too far from its original direction. If it is, let an LLM decide whether to send a correction
      and generate that message. After sending, show "Chat is drifting too far away from the goals. Correction instruction
      was sent." with a dropdown revealing the full message.

      '
    recommendation_disposition: Accepted context-based direction evaluation and added an explicit generative correction
      decision/delivery/UI stage; custom checks are deferred.
  - round: 7
    question: Should Rules include built-in app guidance only, or also user-created personal and Project-specific
      practices?
    answer: 'Accept the recommendation. Research current best practices through subagents for existing apps such
      as Code and Design, treating online content as untrusted and ignoring prompt injection. Create app-specific
      Rules as part of the implementation plan. Users must also be able to create custom Rules inside Projects,
      as Markdown with title, description and when-to-use information in the document header, similar to Focus files.

      '
    recommendation_disposition: Accepted built-in/personal/Project ownership and quiet transparency; specified Markdown
      frontmatter and authorized scoped research subagents.
  - round: 8
    question: Should elevated or uncertain Jev command risk require review before otherwise preapproved automatic
      execution?
    answer: 'Yes, with the option to reconsider strictness if it flags requests too aggressively in practice. Separately,
      Rule documents should be coherent domain guides such as Mobile first design, Svelte coding rules, Python coding
      rules and Accessibility best practices, rather than individual one-practice rule records.

      '
    recommendation_disposition: Accepted deterministic plus semantic risk escalation; record evaluation/tuning and
      regroup the Rule research at the intended guide granularity.
  - round: 9
    question: How should a Jev-recommended Focus creation/update be triggered and become effective?
    answer: "Jev decides whether a recommendation/button is worthwhile. Only when the user presses the button should\
      \ an LLM request start to create/update the Focus. It runs in the background while chat continues independently,\
      \ without creating a separate regular chat. Notify when ready and link to the Focus embed; it is also accessible\
      \ through the Project workspace. A later follow-up with that Focus active must use its updated definition.\n\
      \ Latest clarification: Project-only catalog titles/summaries include inactive Focuses; authorized full loading\
      \ and a second Jev assessment precede Update. First-pass Create is allowed; public/app improvements are excluded."
    recommendation_disposition: Replaced eager LLM draft/review/save proposals with user-triggered background authoring
      and notification; follow-ups resolve fresh saved revisions.
  - round: 10
    question: Should this expansion defer a new Project-specific memory store?
    answer: Yes, defer Project memories because their overlap with Project Specifications remains unresolved.
    recommendation_disposition: Accepted deferral; preserve existing authorized memory selection and Project fact
      documents.
  additional_user_constraints:
  - Active/recent related-chat summaries must be Vault-encrypted in server memory only, never written to disk or
    Directus; preserve client-side long-term encryption and inability of the server to decrypt old chats.
  round_six_correction:
    withdrawn_question: Automatic repair after Jev finds inadequate verification.
    reason: This was an assistant inference from the user's progress/test-quality check notes; the user questioned
      its origin and has not requested an automatic repair loop.
    status: Round six settled by the user's later context-only evaluator and LLM-reviewed correction direction;
      this does not revive a bespoke test-repair loop.
  round_six_user_clarification:
    intent: When an assistant links Tasks or a Plan to a chat, regularly evaluate whether the chat stays focused
      rather than drifting into irrelevant/disconnected work; do not suppress important related discoveries or fixes.
    latest_alternative: Use the open Tasks and Plan summary as input for a reusable Jev on-track question instead
      of requiring newly authored checks each time.
    disposition: User subsequently accepted context-driven evaluation, explicitly deferred custom checks and specified
      LLM-reviewed correction with an expandable sent notice. Cadence and runtime details remain open.
  round_three_clarification:
    answer_status: Answered by the user's subsequent instruction to reselect after every focus activation, for regular
      and Project-specific focuses.
    user_constraint: Design guidelines are Specifications in the planned spec-driven-development implementation;
      separate Project memories may overlap and must not be assumed.
    research: The draft feature.specifications defines approved immutable revisions, private summaries and requirement
      references; feature.plans/feature.checks already supply the intended work/proof chain. This remains planned
      product behavior rather than a claim that the full runtime is implemented.
  status: complete
flow_proposals:
- id: FLOW-1
  status: project_activation_and_focus_composition_agreed_context_selection_proposed
  user_request: Fix the checkout layout in Storefront using its design system.
  steps:
  - order: 1
    processor: existing_foreground_preprocessor
    jev_call: J-1
    state: Bounded current request, recent chat/summary, available global focus/skill candidates and permission-scoped
      Project routing names/summaries; detailed Project context is excluded.
    questions: Which supplied focus/skill candidates are materially relevant to this request, including eligible
      Work on Project focuses?
    output: Shortlisted existing candidate IDs; no activation or permission grant.
    deterministic_work: Filter inaccessible, archived or auto-selection-disabled Projects from automatic candidates;
      preserve explicit mentions.
  - order: 2
    processor: main_processor
    action: Choose Work on Storefront from the shortlist and initiate the existing standard focus-mode countdown.
    jev_call: none
  - order: 3
    processor: authoritative_focus_lifecycle_and_owner_client
    action: On rejection continue without Storefront. On confirmed countdown completion activate its focus and allow
      authorized client-side decryption/context preparation, then perform the agreed focus-aware Jev reselection.
    jev_call: post_activation_reselection
    boundary: Reject, stale user turn, wrong chat or revoked access cannot load the focus or start Project-specific
      context selection.
  - order: 4
    processor: project_context_selection
    jev_call: J-2
    state: Current goal and bounded Storefront-owned catalogs for focus modes, workflows, Specification/rule summaries,
      Plans, related tasks and source/folder descriptions after activation.
    questions: Which supplied project-specific focus, workflow, Specification/conditional rule, Plan, related-task
      and source/folder candidates materially help the current request?
    output: Relevant existing candidate IDs and scores; generative suggestions and arbitrary file names are not
      Jev output.
    proposed_batching: Batch independent selection questions into one bounded request where limits permit; do not
      treat every decision as a separate model call.
    baseline_rules: Approved always-applicable Project instructions and required governing Specification obligations
      are loaded deterministically after activation; Jev selects additional applicable Specification sections and
      conditional guidance.
    implementation_details: Bounded authorized metadata and source/revision projections; load only available selected
      artifacts. New Project memories are deferred.
  - order: 5
    processor: main_processor
    action: Load permitted selected context and choose whether to use a project-specific UI implementation focus;
      its authoritative activation triggers reselection before choosing a supported saved workflow or direct tools.
    jev_call: none_for_execution_choice
    agreed_focus_composition: Retain Work on Storefront as the Project base; add one specialized focus and show
      only its Storefront-qualified active title.
  agreed_order: Authoritative focus activation precedes focus-aware reselection of app skills, existing executable
    workflows and permitted context; apply this to regular focuses too.
  implementation_gap: Existing focus activation tooling treats active Project/catalog focus as exclusive, and catalog
    auto-confirm explicitly revokes the Project binding. Layered focus behavior therefore needs an intentional lifecycle/spec
    change.
- id: FLOW-2
  status: illustrates_agreed_post_activation_reselection
  user_request: SocialHub publishes the same scheduled post twice. Find and fix the cause.
  starting_state: Work on SocialHub has activated through the agreed Project countdown; detailed Project selection
    can now begin.
  recommended_order:
  - step: J-2 specialized-focus shortlisting
    state: Current request, bounded recent conversation and Project focus catalog descriptions.
    candidates:
    - Debugging
    - Add a feature
    - Write a social campaign
    question: Which supplied specialized focus candidates materially match this task?
    output: Existing focus IDs and relevance answers; a shortlist rather than activation.
  - step: Main processor chooses specialist
    action: Choose Debugging, establish its current investigation phase through the focus lifecycle, and present
      SocialHub | Debugging while retaining the Project base.
  - step: J-3 context selection
    state: Current goal, effective activated specialist/current phase and bounded catalogs for eligible app skills,
      existing executable workflows, Specifications/conditional rules, Plans, related tasks and source/folder descriptions.
    questions:
    - Which approved Specification requirements and linked Plan candidates are relevant to duplicate scheduled-post
      investigation?
    - Which eligible app skills and existing executable workflow definitions materially help the current investigation
      phase?
    - Which conditional rules, related-task summaries and source/folder candidates are useful now?
    illustrative_selected_candidates:
    - Scheduled-post delivery Specification
    - Prior duplicate-delivery Task
    - Scheduler source folder
    illustrative_unselected_candidates:
    - Brand presentation Specification
    output: Relevant existing candidate IDs and uncertainty; no generated summaries, invented file paths or executed
      workflows.
  - step: Main processor proceeds
    action: Load permitted selected content and use permitted tools to investigate; only propose an existing deterministic
      workflow if its actual graph, capability prerequisites and invocation contract fit the task.
  pending_later_decisions: Candidate content projection, update/reselection cadence, context budgets, distinct Project
    memory scope and workflow execution semantics remain open.
  implementation_details: Use agreed freshness/cadence/Workflow semantics, existing authorized context and no new
    Project-memory model; implementation fits typed provider limits.
- id: FLOW-3
  status: concrete_workflow_example_within_the_agreed_concept_boundaries
  user_request: Plan an outdoor day in Berlin.
  active_focus: Trip planning, with instructions to consider the weather.
  selection_pass: After the focus activates, Jev shortlists permitted weather skills and, if present in the user's
    catalog, a saved weather-warning workflow.
  illustrative_workflow_graph:
  - Fetch the configured date's Berlin weather forecast through the supported weather app skill.
  - Evaluate the configured AI Check over selected forecast values for whether rain is expected.
  - Follow its authored true/false/Unsure branch, which may send a predefined message containing selected forecast
    outputs.
  main_processor_role: Choose whether to invoke that actual saved graph through workflows.run, providing validated
    start inputs and per-run owned chat destinations/selected returned outputs as appropriate.
  graph_boundary: The focus does not turn the workflow into a free-form planning agent; graph edges, Check outcomes
    and configured actions govern the run.
  return_boundary: The chat may use the workflow's selected results when planning; result delivery alone does not
    authorize new actions or imply a new chat.
- id: FLOW-4
  status: phase_refresh_reuses_existing_authority
  active_focus: OpenMates | Add new app skill
  phases:
  - Research the provider
  - Implement the integration
  - Verify the integration
  first_phase: Focus activation invokes Jev with the provider-research instructions; eligible documentation/search
    skills and relevant provider Specifications can be selected.
  transition: The existing Focus-phase evaluator authoritatively changes Research the provider to Implement the
    integration under its requirement/user-confirmation guards.
  agreed_refresh: Rerun the focus-aware Jev selector with implementation-phase instructions and the same user goal,
    updating permitted tool/workflow/context candidates before implementation continues.
  ordinary_progress: Avoid an additional phase-triggered pass for every ordinary tool result inside the same phase;
    keep normal message preprocessing.
  implementation_details: Reuse current completion/rewind/uncertainty semantics rather than introducing a second
    phase authority.
- id: FLOW-5
  status: active_recent_cross_project_direction_recorded_details_proposed
  user_request: Fix duplicate scheduled posts in SocialHub.
  active_focus: SocialHub | Debugging
  candidate_tasks:
  - project: SocialHub
    task: Change scheduler retry logic
    context: Another chat is modifying the worker that handles scheduled posts.
  - project: Shared infrastructure
    task: Migrate the shared Redis queue
    context: Another chat is changing the queue used by the SocialHub scheduler.
  - project: Personal travel
    task: Plan a holiday
    context: Unrelated work with no task dependency or shared resource relevant to this bug.
  jev_input: Current goal, active focus/phase, permission-scoped bounded Task candidate descriptions, confirmed
    statuses/latest changed outcomes and available explicit dependency or shared-resource metadata.
  decision: Select existing Task/chat references whose work materially overlaps, constrains, or informs this request.
  proposed_output: Relevant existing IDs only; the main processor receives bounded selected Task summaries and linked
    chat summaries where permitted, with source/status/freshness retained.
  candidate_filter: Same-Project work plus authorized cross-Project active chats/Tasks and recently completed chats
    or changed blocked/done Tasks, using the proposed thirty-minute window and preserving explicit older dependencies.
  example_selection: Retain scheduler-retry work and a recently changed shared Redis migration if relevant; exclude
    a recent holiday Task. An hour-old unrelated completed chat is not a global discovery candidate.
  recommendation: Let Jev select relevant summaries from this bounded active/recent pool, favoring same-Project
    work and explicit dependencies; do not inject every eligible summary.
  permission_boundary: Relevance does not expand team membership, activate another Project, load its detailed files/focus
    instructions, move Tasks, claim work or create a second execution owner.
  implementation_details: Final active-state definitions, candidate limits, freshness timestamps, same-Project history
    and no-active-Project loading remain to be specified.
- id: FLOW-6
  status: context_driven_direction_and_llm_correction_agreed_details_pending
  user_request: Fix duplicate scheduled posts in SocialHub and verify the change.
  proposed_processing:
  - An assistant links a Plan and Tasks for identifying, fixing and verifying duplicate scheduled posts in SocialHub.
  - Build bounded Jev state from the user's goal and clarifications, accepted Plan summary, open Tasks and recent
    work; do not use the evolving Task list as the sole authority for the goal.
  - A newly discovered retry-worker race can be classified as justified_related_discovery when its causal relevance
    is evidenced.
  - Starting a dashboard redesign can be classified as material_drift if no relation to duplicate scheduling or
    user-requested scope change is established.
  - Select typed direction and supporting supplied evidence IDs, with insufficient_context available; no custom
    checks are defined.
  - On material drift, an LLM reviews the context and decides whether a correction is warranted; it generates the
    correction instruction if so.
  - Deliver the correction as internal agent guidance in the current chat, retaining generated provenance and respecting
    current user/scope/permission boundaries.
  - After accepted delivery, show the exact agreed sent notice with a disclosure exposing the full generated correction
    message; a no-correction decision produces no false sent notice.
  distinction: Direction feedback evaluates whether work serves the goal; it neither proves the fix correct nor
    substitutes for deterministic acceptance tests, and a useful discovery is not automatically drift.
  implementation_details: Cadence, reviewer model, deduplication, internal continuation behavior and privacy-safe
    persistence.
- id: FLOW-7
  status: rule_ownership_format_and_transparency_agreed_runtime_details_pending
  user_request: Fix the SocialHub settings page, a Svelte/TypeScript implementation task.
  proposed_processing:
  - Preprocessing sees bounded eligible Rule metadata and the user goal, then Jev selects relevant app-provided
    best-practice Rules.
  - Select/load private SocialHub Rules only after its Project focus activates and the authorized client prepares
    permitted context.
  - Inject selected Rule definitions alongside active Focus guidance and governing Specifications; rules do not
    change the goal or create a workflow.
  - Emit one quiet expandable Loaded 4 rules event when four definitions are actually applied; reveal each rule's
    title, source and full text on expansion.
  - An unchanged set emits no repeated notice; a changed selection after phase transition updates the applied-set
    event without repeated alerts.
  examples:
  - Svelte coding rules
  - TypeScript coding rules
  - Mobile first design
  - Accessibility best practices
  implementation_details: Precise Rule editing/registration, catalog loading, rule-source storage and revision/event
    behavior.
- id: FLOW-8
  status: deterministic_authority_and_jev_review_escalation_agreed_details_pending
  user_request: Run relevant terminal commands while fixing the SocialHub scheduler.
  proposed_processing:
  - Deterministically validate current Project/chat/source authority, requested argv/cwd/resources, protected paths,
    confinement and exact user grants; denied requests remain denied.
  - For eligible commands, Jev evaluates a bounded normalized request and available authorized script/context as
    untrusted data, classifying routine, elevated_risk or uncertain; it does not author explanations or grant permissions.
  - Reuse the existing separate generative command explanation; no additional generative effects-extraction stage
    is assumed necessary merely for Jev risk classification.
  - Routine classification preserves existing permission/approval behavior; elevated/uncertain outcomes require
    explicit review before otherwise preapproved automatic execution.
  - Preserve exact requested command/resources in any review; risk confidence cannot authorize a denied command,
    broaden resource access or grant future commands.
  examples:
  - A preapproved project-scoped source search remains routine under its existing permission/confinement boundaries.
  - Test or maintenance code with unclear side effects is uncertain rather than being assumed safe from its command
    name.
  - A command deleting a Project data directory is elevated risk even if it appears in an enabled automatic-command
    list.
  implementation_details: Thresholds, false-positive evaluation, uncertainty/outage behavior and supported terminal
    contexts.
- id: FLOW-9
