scenarios:
- id: S-1
  title: Agreed Jev-assisted project work
  given:
  - A user has multiple encrypted Projects
  - related Tasks and available workflows.
  when:
  - OpenMates routes a turn
  - prepares context
  - evaluates work or proposes a next action.
  then:
  - It follows the activation
  - evidence
  - scope
  - permission and failure policies agreed during the ten discussion rounds.
- id: S-2
  title: Automatic Project focus uses the existing cancellable countdown
  given:
  - Storefront has auto-selection enabled and its Work on Storefront focus is shortlisted for a checkout request.
  when:
  - The main processor chooses that focus and the usual countdown completes without interruption.
  then:
  - Activate Work on Storefront and only then load detailed Project context or run Project-specific selection.
- id: S-3
  title: Rejection and manual-only selection are honored
  given:
  - A Project activation is pending
  - or Storefront has auto-selection disabled.
  when:
  - The user interrupts the pending countdown
  - or submits a new checkout request without mentioning the disabled Project.
  then:
  - No automatic Project focus or Project-specific context processing occurs; a manual structured Project mention
    still activates its own default focus.
- id: S-4
  title: Project base and specialist compose with one visible title
  given:
  - Work on SocialHub is active and the main processor activates its Debugging specialist.
  when:
  - An assistant turn uses the specialist
  - or the focus title is rendered in a narrow UI.
  then:
  - The Project base and specialized instructions both apply
  - and the single active indicator reads SocialHub | Debugging
  - shortened visually as needed without changing identity.
- id: S-5
  title: Any activated focus refreshes useful capabilities and context
  given:
  - A regular Trip planning focus or Project-specific Debugging focus is authoritatively activated.
  when:
  - The assistant prepares its continuation under the activated instructions.
  then:
  - Jev reselects relevant eligible app skills
  - existing executable workflows and permitted context before the main processor resumes; rejected activation does
    not run this pass.
- id: S-6
  title: A focus phase change refreshes useful capabilities and context
  given:
  - OpenMates | Add new app skill is active in its provider-research phase.
  when:
  - The active instruction phase authoritatively changes to implementation.
  then:
  - Jev reselects relevant permitted skills/workflows/context using the new phase before main processing continues;
    unchanged-phase tool results do not independently trigger this phase-change pass.
- id: S-7
  title: Related-work relevance includes active and recent cross-Project context
  given:
  - SocialHub debugging overlaps an active scheduler Task and a recently changed shared-queue Task
  - alongside unrelated active work.
  when:
  - Authorized bounded candidates are filtered and evaluated by Jev against the current request.
  then:
  - Select useful scheduler and shared-queue summaries with status/freshness
  - exclude unrelated work
  - and preserve access and Project activation boundaries.
- id: S-8
  title: Saving a Workflow to a remote Project folder writes a real YAML file
  given:
  - A user saves a Workflow into a selected authorized remote Project source/folder.
  when:
  - The portable definition is saved through the existing Project write path.
  then:
  - The selected folder contains the portable Workflow YAML
  - or the UI/CLI reports pending/failed file persistence without claiming a successful remote save.
- id: S-9
  title: Recent chat summaries expire without weakening durable encryption
  given:
  - A completed response produces an authorized summary used for related-work discovery.
  when:
  - It is cached
  - selected for Jev
  - then expires or access is revoked.
  then:
  - The cache stores Vault ciphertext in memory only
  - eligible summaries are decrypted transiently
  - and eviction prevents further routing use without server decryption of old client-encrypted chats.
- id: S-10
  title: Chat-direction feedback preserves relevant discoveries and detects disconnected work
  given:
  - A chat links a Plan and Tasks for fixing duplicate scheduled posts.
  when:
  - Recent work discovers a causal retry race or instead starts unrelated dashboard redesign.
  then:
  - The direction evaluator distinguishes useful discoveries from drift using deterministic context; an LLM decides
    whether to send a correction
  - and accepted delivery shows the exact notice with expandable generated instruction without automatic cancellation.
- id: S-11
  title: Relevant best-practice Rules load with inspectable quiet context
  given:
  - Eligible app Rules and authorized personal/Project Markdown Rules exist for a Svelte/TypeScript task.
  when:
  - Jev selects applicable Rules and the definitions are applied to main processing.
  then:
  - One compact loaded-count event expands to actual Rule titles/sources/text
  - unchanged selections avoid repeated notices
  - and private Project Rule access respects authoritative Project activation.
- id: S-12
  title: Terminal semantic risk supplements deterministic authority
  given:
  - An eligible command matches an enabled exact automatic-command grant
  - or is deterministically denied.
  when:
  - Jev classifies its declared effects as routine
  - elevated risk or uncertain.
  then:
  - Preserve deterministic denials and ordinary grants while requiring explicit review for elevated/uncertain automatic
    execution; a risk label never grants new access and false positives inform later policy tuning.
- id: S-13
  title: A recommended Focus update starts only on click and is fresh on later follow-ups
  given:
  - An authorized Project has active Debugging and inactive Release preparation Focuses; a release conversation
    may improve the latter.
  when:
  - Catalog Jev selects Release preparation, its full definition is loaded with authorization, and the second Jev
    confirms a useful update; the user clicks Update.
  then:
  - Only click starts background LLM authoring. Saved completion links to the Focus/Project item and later follow-ups
    use the new revision. First-pass Create is allowed; public/app improvements never enter this flow.
- id: S-14
  title: Project Workflow update recommendation uses full inspection and click-gated authoring
  given:
  - A Project contains an inactive Release checklist Workflow whose title/summary matches reusable guidance in the
    chat.
  when:
  - The catalog Jev selects it, authorized full graph inspection confirms an improvement, and the user clicks Update.
  then:
  - One background LLM edit uses existing graph validation and revision guards; saved completion links to the Workflow.
    Future runs use the new version and active runs retain their pinned version; no click means no authoring.
acceptance_criteria:
- id: AC-1
  scenario: S-1
