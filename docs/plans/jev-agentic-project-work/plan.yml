  - rules.ownership.encrypted-custom
  - rules.selection.focus-aware
  - rules.precedence.obligations
  - rules.transparency.applied-set
  verification_ids:
  - T-RULES
- id: AC-12
  scenario: S-12
  text: Terminal risk evaluation uses bounded untrusted command context alongside exact authorization/confinement;
    elevated/uncertain results escalate preapproved automatic commands to explicit review without granting access,
    and labeled false-positive evaluation supports later tuning.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - code-run.remote.semantic-risk-review
  - code-run.remote.explicit-approval
  verification_ids:
  - T-TERMINAL-RISK
- id: AC-13
  scenario: S-13
  text: Project-only catalog assessment includes inactive metadata; authorized full loading and a second Jev assessment
    precede Update, while first-pass Create is allowed. Only a click starts independent LLM authoring; saved completion
    links to the Focus, and later follow-ups use the new revision.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - focus-modes.project-recommendation-catalog
  - focus-modes.project-recommendation-full-assessment
  - focus-modes.project-authoring-click
  - focus-modes.project-authoring-persistence
  - focus-modes.updated-followup-revision
  - notifications.project-authoring.result-route
  verification_ids:
  - T-FOCUS-PROPOSAL
- id: AC-14
  scenario: S-14
  text: Project Workflow updates require metadata selection and a full-graph second Jev assessment before Update;
    only click starts background editing, preserving validation/authority/conflict/partial-result behavior, remote
    YAML binding, ready routing and active-run version pinning.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - workflows.project.update-recommendation
  - workflows.project.update-authoring
  - notifications.project-authoring.result-route
  verification_ids:
  - T-WORKFLOW-PROPOSAL
