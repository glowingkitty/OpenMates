- id: AC-8
  scenario: S-8
  text: Saving a Workflow in a selected remote Project folder writes the existing portable YAML format using guarded
    file persistence and reports denied, disconnected or conflicting writes without false success or loss of the
    saved Workflow.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - workflows.portability.remote-project-save
  verification_ids:
  - T-REMOTE-WORKFLOW-FILE
- id: AC-9
  scenario: S-9
  text: Related-chat summaries are Vault-encrypted in memory only with bounded active/recent eligibility; no server-decryptable
    disk/Directus copy, content logging or old-chat decryption fallback is introduced, and durable client encryption
    remains intact.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  specification_assertions:
  - chats.context.memory-only-summary
  - chats.persistence.client-encrypted
  verification_ids:
