specifications:
  - id: architecture.app-skill-execution
    fingerprint: d58df4944a3eb925eeb4d4ce344697624a58866b9271e51bc46d86ec262d4f19
    assertions:
      - app-skills.search-relevance.optional-and-inferred
      - app-skills.search-relevance.bounded-and-conditional
      - app-skills.search-relevance.safe-finalization
      - app-skills.surface.semantic-parity

decisions:
  - id: D-1
    status: active
    decision: Both skills request up to forty raw candidates in their existing single provider request only when relevance_criteria is nonblank.
    reason: Live probes showed forty consumes one GitHub search quota unit or one Printables GraphQL request and improves relevant-candidate recall.
    decided_at: "2026-09-23T22:31:00Z"
  - id: D-2
    status: active
    decision: GitHub license and normalization filtering may produce fewer than forty rankable candidates; the skill ranks the valid shortfall without overfetching.
    reason: An exact forty-result GitHub probe yielded thirty-nine valid licensed repositories and still produced a strong ranked top ten.
    decided_at: "2026-09-23T22:31:00Z"
  - id: D-3
    status: active
    decision: Any criteria, schema, provider-decision, or timeout failure preserves provider order and returns no more than the requested public count.
    reason: Internal candidate pools must never leak into embeds or later AI context.
    decided_at: "2026-09-23T22:31:00Z"

scenarios:
  - id: S-1
    title: Purpose-aware repository or 3D-model search
    given: [A supported search includes nonblank relevance criteria.]
    when: [The provider returns valid public candidates.]
    then:
      - The skill retrieves up to forty raw candidates in one provider request.
      - One domain-specific Jev decision ranks the valid pool.
      - Only the requested count is returned, defaulting to ten.
  - id: S-2
    title: Plain search and failure remain bounded
    given: [Criteria are absent or the relevance-ranking decision fails.]
    when: [The skill finalizes provider results.]
    then:
      - Plain search preserves the prior retrieval path and makes no Jev call.
      - Failure preserves provider order and returns only the requested count.
  - id: S-3
    title: Public surface parity and faithful assistant inference
    given: [A caller uses assistant, REST, typed CLI, JSON CLI, npm SDK, or pip SDK.]
    when: [The caller supplies or clearly states a material ranking purpose.]
    then:
      - Every surface accepts the same optional relevance_criteria value.
      - Assistant inference is concise and faithful while plain searches gain no invented preferences.

