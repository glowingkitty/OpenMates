schema_version: 2
id: jev-repository-models3d-relevance
title: Add Optional Jev Ranking To Repository And 3D Model Search
status: implementing

goal: >
  Extend the approved optional relevance_criteria behavior to public GitHub
  repository and Printables 3D-model search. When criteria are present, retrieve
  up to forty candidates in one provider request, rank the valid pool with a
  domain-specific Jev rubric, and return only the requested count, defaulting to
  ten. Preserve the existing provider path when criteria are absent and preserve
  provider order, clipped to the requested count, on every ranking failure.

scope:
  in:
    - Optional relevance_criteria fields for code.search_repos and models3d.search.
    - One-request candidate pools of up to forty GitHub or Printables results.
    - Repository default count increase from six to ten while retaining its maximum of ten.
    - Existing 3D-model default of ten and maximum of twenty.
    - Minimized repository- and model-specific Jev projections and evidence rubrics.
    - REST, typed CLI, JSON CLI, npm SDK, and pip SDK schema parity.
    - Focused unit, isolated E2E, and real provider/Jev verification.
  out:
    - Additional provider pages or retries solely for relevance ranking.
    - Private repository data, downloaded 3D-model files, or visual geometry analysis.
    - Jev ranking when relevance_criteria is absent or blank.
    - Health appointment or clinical relevance ranking.

