clarification:
  rounds:
    - question: What should count as a durable Code Run output artifact in the first version?
      answer: Explicit output collection only. Capture `outputs/` and optional `openmates_outputs.json` entries with allowlists/caps/denylists; do not blanket-create embeds for all new or changed sandbox files.
    - question: For repeated runs that write the same output path, should the UI keep one artifact with version history or create a new chat embed every time?
      answer: Keep one visible artifact per normalized output path for chat-bound runs, update it to the latest version, and retain prior versions in artifact history. Direct runs return run-scoped artifact metadata/download URLs only.
    - question: Should the assistant auto-run Code Run for code it creates, then use terminal/artifact results to debug and rerun without asking each time?
      answer: Yes for code created or edited in the current assistant turn, with existing credits/rate limits and visible status. Ask before unmodified user-supplied code, unexpected network/security risk, or repeated failures.
    - question: Should the durable contract be artifact-specific or the full Code Run skill contract?
      answer: Full Code Run skill contract, with artifacts as one governed section.
  vision_summary: >
    Code Run should feel like a real assistant-capable coding skill, not a manual
    terminal side panel. It should preserve the strict E2B sandbox boundary,
    collect only intentional outputs, safely persist chat-bound artifacts with
    path-based history, and let the assistant run/debug/rerun its own code while
    surfacing visible terminal and artifact evidence.
  approved_by_user: true

