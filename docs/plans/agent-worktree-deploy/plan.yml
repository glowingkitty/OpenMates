decisions:
- id: D-1
  status: active
  decision: Use local ephemeral worktrees as the default isolation boundary for agent edit sessions.
  reason: The shared root checkout caused repeated foreign-staged aborts, stale locks, and manual unlocks.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-2
  status: active
  decision: Keep `dev` as the only integration and deployment branch.
  reason: The repository workflow treats `dev` as the permanent current branch and deploy target.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-3
  status: active
  decision: Use hybrid verification with fast deploys by default and exact-SHA proof when behavior requires it.
  reason: Exact proof is valuable for release-critical checks, but forcing it for every tiny non-runtime change would slow
    iteration.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-4
  status: superseded
  decision: Archive stale dirty worktrees visibly after 12 hours instead of auto-committing, pushing, or deleting their changes.
  reason: Unreviewed changes may contain useful work or user data and must not be silently lost or merged.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-5
  status: active
  decision: Roll out root guards in a transitional warn-only mode before strict enforcement.
  reason: Existing agents and hooks need a safe migration path without blocking urgent deploys during the transition.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-6
  status: superseded
  decision: Automatically delete worktrees idle for at least 48 hours when deterministic comparison proves integration,
    duplication, or supersession.
  reason: The user prefers bounded loss of stale local work over indefinite accumulation of forgotten worktrees.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-7
  status: active
  decision: Retain compact deletion manifests for 30 days without retaining source patches or copied files.
  reason: This preserves operational accountability without recreating a code archive backlog.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-8
  status: active
  decision: Batch-review unique stale work and automatically delete only high-confidence obsolete results.
  reason: Hundreds of per-worktree chats would be wasteful, while deterministic checks alone cannot classify every semantic
    supersession safely.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-9
  status: active
  decision: Permit explicitly excluded recent active work during pull-request preparation.
  reason: A dev-to-main release should not require unfinished isolated work to be merged, but unresolved stale work must not
    remain invisible.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-10
  status: active
  decision: Keep worktrees as the parallel-agent isolation mechanism and repair finalization and reconciliation.
  reason: Worktrees isolate indexes and file content more safely than returning parallel agents to the shared root checkout.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-11
  status: active
  decision: Integrate the reviewed `04e6` admin-authenticated shared-embed key-hash lookup and delete the remaining reviewed
    stale worktrees.
  reason: Batched review found this was the only meaningful stale behavior absent from dev; all other stale unique patches were
    duplicate or superseded.
  decided_at: '2026-08-04T00:00:00Z'
- id: D-12
  status: active
  decision: Durably checkpoint every current mutating top-level worktree when its OpenCode chat becomes idle or closes.
  reason: A forgotten or crashed chat must not leave its only valuable copy as an uncommitted filesystem diff.
  decided_at: '2026-08-06T17:24:00Z'
- id: D-13
  status: active
  decision: Automatically integrate current checkpointed changes into dev after a grace period when normal deploy gates pass.
  reason: The user considers forgotten important changes a greater risk than bounded automatic commits to the integration branch.
  decided_at: '2026-08-06T17:24:00Z'
- id: D-14
  status: active
  decision: Keep automatic checkpointing separate from automatic integration eligibility.
  reason: Partial, conflicting, sensitive, explicitly held, or stale checkpoints must remain recoverable without being pushed.
  decided_at: '2026-08-06T17:24:00Z'
- id: D-15
  status: active
  decision: Treat inherited task children as read-only by default and permit deterministic observational commands without a child worktree.
  reason: Transcript evidence showed the command allowlist blocked ordinary investigation and made agents fight the lifecycle system.
  decided_at: '2026-08-06T17:24:00Z'
- id: D-16
  status: active
  decision: Unconditionally delete every managed worktree after 72 hours based on its managed directory timestamp.
  reason: The conditional classifier retained hundreds of merged and unique-stale worktrees until the root filesystem reached
    100%; the user explicitly chose a hard storage bound over preservation beyond 72 hours.
  decided_at: '2026-08-14T08:06:00Z'
attempts:
- id: ATTEMPT-1
  task_id: TASK-1
  approach: Continue improving the shared-root deploy push lock and staging checks.
