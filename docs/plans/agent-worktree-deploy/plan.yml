implementation_notes:
  plan_path: docs/plans/agent-worktree-deploy/plan.yml
  architecture: 'Keep `scripts/sessions.py` as the single lifecycle controller and extend it with report-only reconciliation,
    safe-apply cleanup, transactional finalization, deletion manifests, and release readiness. Reconciliation compares the
    sessions registry, linked Git worktree admin records, physical worktree paths, and an exact `origin/dev` target without
    checking out or modifying dev. Deploy and end delegate to one finalizer so metadata cannot disappear before the physical
    worktree is removed or residual changes are recorded. OpenCode idle and close events create local checkpoint refs only;
    the periodic controller separately integrates current eligible checkpoints through the existing gated deploy transaction.

    '
  existing_patterns:
  - '`scripts/sessions.py` already centralizes session identity, deployment, locks, and state stored in `.claude/sessions.json`.'
  - '`.codex/hooks/bash-guard.sh` and `.opencode/plugins/openmates-hooks.js` already enforce command and edit guardrails.'
  - '`scripts/tests.py` and `scripts/run_tests.py` already coordinate Vercel deploy readiness and Playwright dispatch.'
  - '`scripts/ci_impact.py` and `scripts/vercel_ignore_build.py` already classify change impact for build decisions.'
  data_flow:
  - Session start or first edit resolves the agent identity and worktree path, then records base commit and activity metadata.
  - Agent edits happen in the session worktree.
  - Top-level mutating chat idle or close records an exact local checkpoint and durable workspace state without changing dev.
  - Periodic reconciliation waits for the grace period, rechecks patch identity and blockers, then invokes the normal gated
    deploy path for eligible checkpoints; failures remain durable recovery items.
  - Deploy reads the worktree diff, guards root integration with the dev deploy verification lock or writes a blocked-deploy
    record, applies only the intended diff to `dev`, commits, and pushes.
  - Verification records whether it used fast latest-ready mode or exact-SHA mode for the resulting commit.
  - Reconciliation inventories all three state sources and emits classifications without mutation by default.
  - Scheduled hard expiry deletes every managed worktree at least 72 hours old regardless of classification, clears matching
    queue/session/lease/checkpoint state, and writes a source-free manifest with a 30-day expiry.
  - Reconciliation still classifies younger unique or uncertain work for integration and review before the hard deadline.
  - Deploy and end call a shared finalizer that removes fully integrated worktrees before metadata or preserves residual work.
  - Pull-request readiness reruns reconciliation against the exact release SHA and blocks unresolved state.
  affected_files:
  - path: scripts/sessions.py
    reason: Add checkpoints, auto-integration eligibility, workspace state, reconciliation, safe deletion, and finalization.
  - path: scripts/worktree-reconciliation-setup.sh
    reason: Provision the documented periodic reconciliation job deterministically.
  - path: scripts/tests.py
    reason: Replace old global deploy lock release proof with commit-scoped verification state.
  - path: scripts/run_tests.py
    reason: Support exact-SHA deploy wait mode alongside fast latest-ready dev verification.
  - path: scripts/vercel_ignore_build.py
    reason: Keep non-runtime deploy/build skipping compatible with worktree-sourced commits.
  - path: scripts/ci_impact.py
    reason: Reuse or extend impact classification for fast versus exact verification decisions.
  - path: .opencode/plugins/openmates-hooks.js
    reason: Checkpoint top-level idle chats and permit bounded observational parent/child commands without weakening mutation guards.
  - path: scripts/tests/test_sessions_worktree_checkpoints.py
    reason: Prove durable checkpoints and workspace-state separation.
  - path: scripts/tests/test_sessions_auto_integration.py
    reason: Prove only current, eligible, gated checkpoints reach dev.
  - path: scripts/tests/test_opencode_presence_collisions.mjs
    reason: Cover transcript-derived read-only commands and hostile near-matches.
  - path: .codex/hooks/bash-guard.sh
    reason: Keep Codex command guardrails aligned with root control-plane policy.
  - path: .agents/skills/deploy/SKILL.md
    reason: Update deploy instructions for automatic worktrees and commit-scoped proof.
  - path: .agents/skills/verify-ui-change/SKILL.md
    reason: Update UI verification instructions for fast latest-ready and exact-SHA modes.
  - path: .claude/skills/create-pr/SKILL.md
    reason: Make exact-SHA worktree readiness the first dev-to-main PR gate.
  - path: docs/architecture/agent-tooling-parity.md
    reason: Document OpenCode, Claude, and Codex compatibility expectations.
  - path: docs/architecture/infrastructure/cronjobs.md
    reason: Document the cleanup worker or timer that archives stale dirty worktrees.
  - path: scripts/tests/test_sessions_worktree_lifecycle.py
    reason: New deterministic lifecycle coverage.
  - path: scripts/tests/test_sessions_worktree_deploy.py
    reason: New deterministic deploy integration coverage.
  - path: scripts/tests/test_sessions_worktree_deploy_queue.py
    reason: New deterministic blocked-deploy fallback coverage.
  - path: scripts/tests/test_commit_scoped_deploy_verification.py
    reason: New deterministic verification proof coverage.
  - path: scripts/tests/test_sessions_worktree_cleanup.py
    reason: Update cleanup coverage for the 48-hour deletion and 30-day manifest policy.
  - path: scripts/tests/test_sessions_worktree_finalization.py
    reason: Prove deploy and end cannot orphan worktrees or hide residual changes.
  - path: scripts/tests/test_sessions_worktree_reconciliation.py
    reason: Prove inventory, classification, safe apply, orphan handling, and manifest retention.
  - path: scripts/tests/test_sessions_worktree_pr_readiness.py
    reason: Prove release readiness blocking and explicit active exclusions.
  - path: backend/core/api/app/services/directus/embed_methods.py
    reason: Reapply the sole meaningful stale shared-embed lookup fix on current dev.
  - path: backend/tests/test_embed_methods.py
    reason: Prove shared embed key-hash fallback uses the required admin-authenticated Directus read.
  - path: scripts/tests/test_sessions_root_guard.py
    reason: New deterministic root guard coverage.
  - path: scripts/tests/test_opencode_worktree_guards.mjs
    reason: New hook-level OpenCode guard coverage.
  - path: scripts/audit_worktree_deploy_contract.py
    reason: New low-noise documentation and instruction audit for the workflow contract.
  verification_strategy:
  - Add transcript-derived red tests for read-only command routing, durable checkpoints, and bounded automatic integration.
  - Add and run focused red tests for finalization, reconciliation, cleanup, and PR readiness before implementation.
  - Implement report-only inventory and classification before any deleting behavior.
  - Implement transactional finalization before using safe apply on the existing backlog.
  - Run report-only reconciliation and manually inspect its summary before the one-time safe cleanup.
  - Run safe cleanup only after focused green tests pass, then rerun report-only readiness against the same `origin/dev` SHA.
  - Run the documentation and agent parity audits after instructions are updated.
  - Run `spec_validate.py` after each spec edit and `spec_verify.py` before declaring the spec complete.
  verification_order:
