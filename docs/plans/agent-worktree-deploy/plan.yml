- id: ATTEMPT-4
  task_id: TASK-14
  approach: Run report-only reconciliation, delete 117 deterministically integrated or duplicated stale worktrees, batch-review
    135 unique or uncertain stale worktrees, delete 132 reviewed-obsolete cases, integrate the sole meaningful `04e6` behavior,
    and remove four known obsolete blocked sessions plus the three remediation worktrees through targeted reconciliation.
  outcome: succeeded
  recorded_at: '2026-08-04T11:40:00Z'
  reason: Final reconciliation against edc427391 inspected 226 worktrees and classified all 226 as recent-active, with no stale,
    malformed, uncertain, or unique unresolved worktrees. The state retained 257 source-free deletion manifests and two new
    concurrent blocked deploys that were intentionally not modified.
- id: ATTEMPT-5
  task_id: TASK-20
  approach: Delete the prevalidated worktree backlog older than 72 hours deepest-first, then remove permission-resistant exact
    targets through root-owned Docker bind mounts and prune Git metadata.
  outcome: succeeded
  recorded_at: '2026-08-14T08:18:00Z'
  reason: Removed 446 old top-level worktrees plus old nested registrations, reduced disk use from 100% to 66%, increased free
    space from about 700 MiB to 99.9 GiB, and left zero top-level managed worktrees older than 72 hours.
