assumptions:
- id: A-1
  text: Existing `sessions.py` metadata can be extended without replacing `.claude/sessions.json` as the shared state file.
  status: confirmed
  required_before: implementation
  evidence:
  - scripts/sessions.py extends sessions.json with deploy_queue, worktree_archive, and per-session worktree metadata.
- id: A-2
  text: Worktree paths can live under a deterministic ignored directory without conflicting with existing hooks, scripts,
    or deployment ignore rules.
  status: confirmed
  required_before: implementation
  evidence:
  - AGENT_WORKTREES_DIR points outside the repository root at the project parent worktree directory.
