scenarios:
- id: S-1
  title: Agent starts in an isolated worktree
  given:
  - The root checkout is on `dev` and acts as the control-plane checkout.
  - An agent session begins work that may edit files.
  when:
  - The session lifecycle initializes the workspace.
  then:
  - The session receives a deterministic local worktree path tied to the session identity.
  - The worktree starts from the current `dev` commit.
  - Ordinary edits, staging, and local checks happen inside that worktree rather than the root checkout.
- id: S-2
  title: Deploy integrates only one session change set
  given:
  - A session worktree contains intended changes.
  - The root checkout or another worktree may contain unrelated dirty or staged files.
  when:
  - The session runs the approved deploy command.
  then:
  - Deploy computes the session-owned change set from the worktree.
  - Integration to `dev` happens in a bounded critical section.
  - The resulting commit contains only the intended session changes.
  - Unrelated root or foreign worktree changes are not reverted, committed, or staged.
- id: S-3
  title: Busy deploy path records a visible blocked item
  given:
  - Another deploy integration or platform-critical deploy wait is already active.
  - A session requests deployment.
  when:
  - Direct integration cannot safely acquire the deploy path.
  then:
  - The request is recorded in a visible blocked-deploy record with owner, patch identity, title, reason, and next action.
  - The session sees a concise status explaining the conflict and instructing the operator to resolve it and rerun deploy.
  - No automatic worker is implied unless a future task implements one explicitly.
- id: S-4
  title: Verification follows the relevant commit
  given:
  - A deploy commit exists on `dev`.
  - Vercel, GitHub Actions, or Playwright verification is required.
  when:
  - Verification starts or waits for an environment.
  then:
  - Fast checks may use the latest ready dev deployment when exact proof is unnecessary.
  - Exact checks wait for and assert the deployment or run associated with the requested commit SHA.
  - No check releases or trusts a stale global deploy lock as proof for a different commit.
- id: S-5
  title: Deploy and end finalize worktrees transactionally
  given:
  - A session worktree has deployed all or part of its current patch, or the session is ending.
  when:
  - Deploy succeeds, `deploy --end` runs, or plain `sessions.py end` runs.
  then:
  - The lifecycle compares the complete current worktree patch with the deployed patch and verifies the deployment commit is
    reachable from `origin/dev`.
  - A fully integrated worktree is removed before its session metadata is deleted.
  - Residual or excluded changes keep a visible pending lifecycle record and prevent normal session end.
  - Force-end classifies or deletes under the approved stale policy instead of silently losing lifecycle metadata.
- id: S-6
  title: Root guard prevents shared-checkout regression
  given:
  - The migration is in transitional mode or strict mode.
  - An agent attempts to edit, stage, commit, or deploy from the root checkout.
  when:
  - The relevant hook or script observes the root operation.
  then:
  - Transitional mode emits actionable warnings and remediation commands.
  - Strict mode blocks unsafe root edits or deploys except explicitly allowed control-plane commands.
  - The guard is deterministic and testable without relying on model behavior.
- id: S-7
  title: Reconciliation classifies registered and orphaned worktrees
  given:
  - Git may contain linked worktrees with or without session metadata.
  - "`origin/dev` may contain the same patch, an exact resulting file snapshot, or newer superseding changes."
  when:
  - The operator runs worktree reconciliation in report-only mode.
  then:
  - Every linked, physical, and registered worktree is classified as recent-active, integrated, duplicated, superseded,
    unique-stale, uncertain, missing, or malformed.
  - Report-only mode does not change worktrees, Git metadata, session state, or source files.
  - The report is machine-readable and includes reason codes, changed-file counts, last activity, and the target dev commit.
- id: S-8
  title: Hard expiry removes old worktrees without recreating an archive backlog
  given:
  - A managed worktree directory is at least 72 hours old.
  when:
  - The scheduled hard-expiry cleanup runs.
  then:
  - The physical worktree, Git worktree metadata, stale session metadata, and matching blocked deploy records are removed.
  - Active, dirty, unique, uncertain, held, orphaned, and nested worktrees do not bypass the deadline.
  - No patch is applied to `dev`, and no current root or `origin/dev` content is overwritten.
  - A compact manifest records identity, timestamps, reason, changed-file count, relevant commits, and deletion time for 30 days.
  - The manifest does not contain source code, a patch bundle, untracked file contents, secrets, or private data.
- id: S-9
  title: Pull-request readiness exposes unresolved worktree state
  given:
  - A dev-to-main pull request is being prepared.
  when:
  - The pull-request skill runs worktree release readiness against the exact `origin/dev` commit.
  then:
  - Explicitly excluded recent active work is listed and does not block readiness.
  - Stale, blocked, orphaned, unique unresolved, malformed, or unclassified worktrees block readiness.
  - The report provides concrete reconciliation commands and must pass again after cleanup before PR preparation continues.
- id: S-10
  title: Meaningful stale work is integrated without overwriting newer dev changes
  given:
  - Batched review finds a stale worktree with meaningful behavior absent from current dev.
  when:
  - The behavior is selected for integration.
  then:
  - A focused red test is added against current dev behavior.
  - The smallest compatible change is reapplied on the current dev base rather than merging the stale snapshot wholesale.
  - Focused green tests pass before the stale source worktree is removed.
- id: S-11
  title: Forgotten mutating chat is checkpointed
  given:
  - A top-level mutating OpenCode chat has current worktree changes.
  when:
  - The chat becomes idle or closes.
  then:
  - The exact selected patch is committed to a local session checkpoint ref without changing the source worktree or dev.
  - Durable workspace metadata records the checkpoint identity, files, patch hash, state, and integration eligibility time.
- id: S-12
  title: Current checkpoint automatically integrates to dev
  given:
  - A checkpoint remains current after its grace period.
  - No explicit hold, conflict, sensitive path, or live edit lease exists.
  when:
  - Periodic reconciliation processes eligible checkpoints.
  then:
  - The existing exact-base integration path reruns normal deploy gates and pushes only the checkpointed patch to dev.
  - A failed gate or conflict remains visible and recoverable without modifying dev.
- id: S-13
  title: Research children inspect without hook friction
  given:
  - A read-only or not-yet-classified child inherits its parent worktree route.
  when:
  - It runs bounded Git history/diff, issue inspection, test-status, GitHub-run, or Docker-log diagnostics.
  then:
  - The command runs in the inherited worktree.
  - File edits, service mutations, test execution, deploys, shell expansion, and output redirection remain blocked.
- id: S-14
  title: Execution and workspace state remain distinct
  given:
  - A chat may be idle while its patch is pending, or active after its latest patch was integrated.
  when:
  - Status and reconciliation inspect the session.
  then:
  - Ephemeral chat execution state comes from presence.
  - Durable workspace state independently reports clean, changes_pending, checkpointed, integrating, integrated, held, or recovery_needed.
- id: S-15
  title: Worktree creation stops before disk exhaustion
  given:
  - Worktree count, free bytes, or filesystem utilization crosses a configured safety threshold.
  when:
  - A new session requests a managed worktree.
  then:
  - Expired worktrees are cleaned first.
  - Creation proceeds only when count and disk headroom are within bounds.
  - A refusal reports the exact breached threshold and remediation command without creating a partial worktree.
