schema_version: 2
id: agent-worktree-deploy
title: Agent Worktree Deploy Isolation and Reconciliation
status: implementing
goal: 'Replace the shared-checkout deployment workflow with automatic ephemeral session worktrees that isolate agent edits,
  integrate through the existing dev branch only for the shortest practical window, verify deploys against the relevant commit,
  and reconcile workspaces without overwriting newer dev commits or allowing forgotten worktrees to accumulate.

  '
scope:
  in:
  - Create disposable local worktrees automatically for agent edit sessions while keeping `dev` as the only integration and
    deploy branch.
  - Make the repository root a control-plane checkout that runs orchestration, diagnostics, and guarded deploy integration
    rather than ordinary edits.
  - Update `sessions.py deploy` so each session integrates only its intended changes to `dev`, commits there, pushes through
    the existing guarded path, and returns to isolation.
  - Replace the global Vercel deploy lock as a proof primitive with commit-scoped deploy/test verification while retaining
    bounded deploy serialization for root integration, commit, and push.
  - Reconcile registered and orphaned worktrees against `origin/dev`, including the one-time cleanup of the existing backlog.
  - Checkpoint mutating top-level sessions when they become idle or close, then automatically integrate current validated checkpoints
    into `dev` without requiring the user to return to the chat.
  - Unconditionally delete managed worktrees 72 hours after directory creation, regardless of lifecycle classification,
    while retaining a compact source-free deletion manifest for 30 days.
  - Batch-review stale worktrees containing unique changes and require operator review only for meaningful work that cannot
    be classified obsolete with high confidence.
  - Finalize deployed and ended sessions transactionally so physical worktrees, Git metadata, session metadata, deploy queue
    records, and residual changes cannot drift apart.
  - Add pull-request readiness reporting that permits explicitly excluded recent work but blocks stale, blocked, orphaned,
    or unclassified worktrees.
  - Add transitional then strict root guards so agents do not accidentally edit, stage, commit, or deploy from the shared
    root checkout.
  - Update deploy, verification, OpenCode, Codex, and Claude-compatible instructions to describe the new contract.
  - Add deterministic tests and audits for worktree lifecycle, root guard behavior, deploy integration, cleanup, and commit-scoped
    verification.
  out:
  - Creating long-lived feature branches that users must manage manually.
  - Replacing `dev` as the integration branch or changing the repository default branch.
  - Automatically integrating legacy, ambiguous, conflicting, explicitly held, or uncheckpointed worktree changes into `dev`.
  - Preserving patch bundles or copied source files after a high-confidence automatic stale deletion.
  - Blocking a pull request solely because recent active work is explicitly excluded from that release.
  - Rewriting unrelated session, CI, or product deployment behavior outside the worktree deploy path.
  - Changing production deploy policy.
context_discovery:
  github_issues:
  - GitHub MCP authentication returned 401 Bad credentials, so duplicate issue discovery could not complete through MCP.
  docs:
  - AGENTS.md
  - docs/contributing/guides/spec-driven-development.md
  - docs/architecture/agent-tooling-parity.md
  - docs/architecture/infrastructure/cronjobs.md
  code_patterns:
  - scripts/sessions.py
  - scripts/tests.py
  - scripts/run_tests.py
  - scripts/vercel_ignore_build.py
  - scripts/ci_impact.py
  - .codex/hooks/bash-guard.sh
  - .opencode/plugins/openmates-hooks.js
  tests:
  - scripts/tests/test_sessions_vercel_build_machine_gate.py
  - scripts/tests/test_opencode_hooks_contract.mjs
  local_evidence:
  - OpenCode log inspection found 24 foreign-staged aborts, 17 lock timeouts, 10 deploy command timeouts, 11 stale-lock detections,
    and 32 manual unlock references in the sampled 24 hour window.
  - The 2026-08-04 reconciliation investigation found about 463 linked worktrees, 127 registered worktrees, 102 records marked
    merged, 25 records marked active, 11 dirty active worktrees, and 4 blocked deploy records while agents continued working.
  - All sampled merged worktrees remained dirty against their detached base because deploy copied their patch to root without
    advancing or removing the source worktree.
  - "`deploy --end` and plain `sessions.py end` can remove session metadata before physical worktree reconciliation, producing
    hundreds of unregistered worktrees that the existing cleanup command cannot discover."
  - GitHub issue discovery was attempted through the GitHub MCP server on 2026-08-04 and failed with 401 Bad credentials.
  external_research:
  - Claude Code official guidance recommends separate Git worktrees for parallel coding sessions.
  - Google Jules uses managed branches and pull requests for isolation, but this repository needs direct `dev` integration.
  - Git supports local worktree removal and pruning through `git worktree remove` and `git worktree prune`.
  - GitHub Actions supports queued concurrency, which informs commit-scoped verification queues.
  - Vercel supports ignored-build decisions, which can help avoid non-runtime preview builds.
apple_impact:
  affected_files:
  - none
  parity_expectations:
  - This is developer tooling for repository sessions and deploy verification with no Apple product UI counterpart.
  verification:
  - Apple verification is not required unless a future implementation task touches Apple source files.
  intentional_native_differences:
  - none
clarification:
  rounds:
  - question: Should agents work in separate local worktrees or keep sharing the root checkout with stronger locks?
    answer: Use automatic ephemeral worktrees for agent edits; keep root as control plane.
  - question: Should integration use per-task branches, pull requests, or the existing `dev` branch?
    answer: Keep `dev` as the only integration and deploy branch; worktrees are disposable local workspaces.
  - question: How strict must verification be for each deploy?
    answer: 'Use hybrid verification: fast deploys by default, exact SHA deploy/test proof when needed.'
  - question: What happens to dirty idle worktrees?
    answer: After 12 hours they become visible archived inbox items; do not silently move them into root or push them.
  - question: How should root guard and contended deploy handling roll out?
    answer: Root guard starts transitional and warn-only before becoming strict; deploy tries direct integration first and
      records a visible blocked-deploy item when integration is unsafe and needs manual conflict resolution.
  - question: Should stale cleanup favor retention or bounded automatic deletion?
    answer: Favor a clean system; automatically delete after 48 hours without activity when changes are integrated, duplicated,
      or superseded with high confidence.
  - question: What recovery evidence should remain after automatic deletion?
    answer: Keep a compact deletion manifest for 30 days, but do not retain patches or copied worktree files.
  - question: May recent active work remain outside a pull request?
    answer: Yes, when explicitly listed as excluded; stale, blocked, orphaned, or unclassified worktrees block readiness.
  - question: How should unique stale work be decided?
    answer: Use deterministic checks plus batched read-only review. Automatically delete high-confidence obsolete work and ask
      the user only about meaningful unique work that remains uncertain.
  - question: What should happen when the user forgets to return to a mutating chat with valuable changes?
    answer: Durably checkpoint the current patch and automatically integrate it into `dev` after a grace period when the exact
      checkpoint still matches, normal deploy gates pass, and no conflict, explicit hold, or sensitive-path blocker exists.
  - question: Should the disk-safety deadline preserve unresolved or active worktrees after the host reached 100% disk usage?
    answer: No. Unconditionally delete every managed worktree once its directory is 72 hours old, including active, dirty,
      unique, uncertain, orphaned, and nested worktrees; preserve only a compact source-free deletion manifest.
  vision_summary: 'Agents receive isolated worktrees automatically and do their edits outside the shared root checkout. Deploy
    integration still lands on dev, but the critical window is bounded and guarded so unrelated staged changes cannot contaminate
    a commit. Verification follows the commit that matters rather than a stale global deploy lock, and stale dirty worktrees
    are classified for early integration and review, but every managed worktree has an unconditional 72-hour physical lifetime.
    Classification never extends that hard deadline, and every deletion leaves a temporary source-free audit manifest rather
    than a retained patch.

    '
  approved_by_user: true
