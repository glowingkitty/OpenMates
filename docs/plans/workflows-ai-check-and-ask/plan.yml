  plan: {status: approved, approved_at: '2026-09-24', source: User instructed implementation after approving the specifications and cost controls.}
decisions:
  - id: D-1
    status: active
    decision: Use Check mode ai inside the existing check node; represent Ask AI with the ai.ask app-skill capability but a distinct top-level UI.
    reason: Preserve existing graph, typed-reference and skill-dispatch architecture without confusing authors.
    decided_at: '2026-09-24'
  - id: D-2
    status: active
    decision: Keep authoring validation free; rate limit and cache it, call Gemini only when save-time Jev cannot verify, and always disable runtime app tools.
    reason: Protect provider spend and user trust without making a soft validation dependency a paid or blocking operation.
    decided_at: '2026-09-24'
