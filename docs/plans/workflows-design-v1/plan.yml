  design_clarification:
    date: "2026-09-14"
    source: Explicit user design correction in the same Codex task during Safari review, in addition to the original approved implementation plan.
    requirements:
      - No raw JSON, object dumps or debug schemas in any user-facing workflow screen; Test, Preview and history use structured labeled values and shared cards.
      - "Editor and history app-skill cards show '{app name} | {skill name}' and the actual app icon."
      - Run history follows the supplied runs.pdf compact ruler timeline and shared node/status-badge layout, with no debug dashboard.
      - Use 16px default body text and a 14px minimum everywhere, including compact cards, badges, fields and placeholders.
      - "Keep the centered start placeholder exactly 'Enter a name for a new workflow'."
      - "Continuations and empty branches use 'Do nothing.\nOr click here to add a step.' to open one 'What should happen next?' selector with valid choices; remove duplicate separate Add action/Add check buttons."
      - Use the existing canonical app/workflow/projectmanagement/chat/calendar icons and the exact supplied-design split-arrow for Add check, not unrelated replacements.
      - Reuse the actual ChatHeader toolbar and Show more behavior; keep workflow on/off centered, with no standalone header history/play/delete icons or corner Ready badge.
      - Workflow sharing management is outside web v1. The header Share action only shows a notification that sharing will be possible soon; future management belongs in the regular settings Share menu.
      - Remove the bottom version-history-and-sharing area entirely. When saved edits exist, show the version selector below the tabs and above the first node; it toggles edit history in the same tab.
      - For every valid executable saved Workflow, center Run now at the header bottom above the tabs and always execute the saved definition, ignoring unsaved node edits.
      - Workflow open/close uses the fullscreen-embed bottom-up/reversed motion and fade with 320ms cubic-bezier(0.32, 0, 0.2, 1), honoring reduced motion; graph nodes are slightly larger with a visible bottom chevron.
    semantics: Presentation correction only; existing workflow execution, privacy, encryption, runtime/CLI sharing APIs, and immutable definition history stay unchanged.
