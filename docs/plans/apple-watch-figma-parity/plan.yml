schema_version: 2
id: apple-watch-figma-parity
title: Apple Watch Figma parity for login, lists, chats, and audio
status: implementing
specification_refs:
- id: feature.apple-watch
  role: primary
  fingerprint: 6c3ba61cd6f4cd4865e50c36382f204f43cf4d95ee3bd79f763d7de6b0e2b08d
goal: 'Make the Apple Watch app look and work like the Figma Watch concept: login through the iPhone-first pairing flow with
  a short-URL fallback; browse Tasks and Workflows; browse, search, start, open, and reply in Chats; and send audio recordings
  through the normal encrypted server processing so they appear as audio embeds on every client.

  '
scope:
  in:
  - Match the Figma Watch layout, color, navigation, and recording controls on a small Watch display.
  - Offer iPhone pair approval first, then reveal the short URL automatically when approval has not started within a few seconds;
    keep self-hosting and prominent manual pair-code entry without a QR button.
  - Show read-only Task categories and Workflow lists; tapping an item sends an ID-only iPhone notification that opens its
    exact web page.
  - Show the Chats list, functional search and new chat, existing thread opening, text replies, and a single-action audio
    Send flow.
  - Use the same encrypted chat message, inference, audio upload/transcription, and audio embed contracts as iPhone/web; do
    not transcribe audio on Watch.
  - Add focused native and UI coverage, then test and debug from login through lists and chats after implementation is complete.
  out:
  - Creating or editing Tasks and Workflows on Watch.
  - Native iPhone Task and Workflow detail UI changes.
  - Adding text or other attachments to a Watch audio recording before Send.
  - On-device audio transcription.
context_discovery:
  docs:
  - docs/plans/apple-watch-login-v2/plan.yml
  - docs/plans/apple-watch-support/plan.yml
  - apple/AGENTS.md
  code_patterns:
  - WatchPairLoginView currently shows the short URL immediately; the approved Figma flow now delays it unless iPhone approval
    does not start.
  - WatchChatRuntime currently selects the first chat automatically and sends text through a limited REST path; audio uploads
    remain pending without a send.
  - Watch Tasks and Workflows have no list surface or typed iPhone web handoff.
  tests:
  - apple/OpenMatesTests/WatchPairLoginRuntimeTests.swift
  - apple/OpenMatesTests/WatchChatRuntimeTests.swift
  - apple/OpenMatesWatchUITests/WatchChatLayoutUITests.swift
  - apple/OpenMatesWatchUITests/WatchFlowUITests.swift
decisions:
- id: figma-login-fallback
  status: active
  decision: Start with iPhone approval and reveal the short URL after a few seconds unless approval has started; an explicit
    fallback remains available.
  reason: User accepted the Figma note and flow in this conversation.
  decided_at: '2026-09-24T20:00:00Z'
- id: watch-audio-send
  status: active
  decision: One Watch Send action sends the recording with the normal audio embed through server transcription and inference.
  reason: User said a separate text/attachment review step is unrealistic on Watch.
  decided_at: '2026-09-24T20:00:00Z'
- id: watch-list-handoff
  status: active
  decision: Tasks and Workflows are read-only on Watch; item taps notify iPhone to open the exact web URL.
  reason: User chose this temporary handoff while native detail UI remains out of scope.
  decided_at: '2026-09-24T20:00:00Z'
- id: watch-chat-scope
  status: active
  decision: New chat, search, existing chat opening, text replies, and audio messages all work on Watch.
  reason: User explicitly required each capability.
  decided_at: '2026-09-24T20:00:00Z'
verification:
- Validate this Plan and build the Watch target with repository-local DerivedData.
- Run focused native tests for pairing, encrypted sends, list decryption, handoff URLs, and Watch UI interactions.
- Inspect a Watch simulator screenshot against the exported Figma board.
- Run relevant isolated product CI checks if the changed API contracts require them.
scenarios:
- id: S-1
  title: Watch pair login follows the Figma flow
  given:
  - An unauthenticated Watch starts a pair attempt.
  when:
  - A matching iPhone receives the request or approval is not started in four seconds.
  then:
  - The Watch offers iPhone approval first and reveals the short URL fallback after the timeout, denial, or failure.
  - Pairing still supports manual code entry, retry, and self-hosting without a QR button.
- id: S-2
  title: Task and Workflow lists open exact items on iPhone
  given:
  - The Watch is authenticated and has encrypted Tasks and Workflows.
  when:
  - The user browses a list and taps an item.
  then:
  - The Watch shows readable read-only entries in Figma styling.
  - An ID-only notification opens the exact web Task or Workflow on iPhone.
- id: S-3
  title: Chats can be found, started, opened, and answered
  given:
  - The Watch is authenticated with existing chats.
  when:
  - The user searches or starts a chat and sends a text reply.
  then:
  - The chat list remains visible until a chat is selected.
  - The encrypted reply uses the durable inference contract and appears on other clients.
- id: S-4
  title: Watch audio sends as a regular audio embed
  given:
  - The user has microphone permission and an open or new chat.
  when:
  - The user records and taps Send once.
  then:
  - The recording uploads and uses server transcription and inference.
  - An encrypted audio recording embed appears across Watch, iPhone, and web.
