implementation_notes:
  plan_path: docs/plans/billing-processing-reliability/plan.yml
  existing_patterns:
    - RedisImportLock for renewable token-safe Dragonfly serialization.
    - Chat inference outbox for idempotent Directus state transitions.
    - Existing commit_personal_charge transaction for encrypted CAS and exactly-once raw usage.
  architecture: >
    Extend the server-only cached user projection with its matching encrypted
    balance snapshot, add a reusable per-subject settlement lock, and add a
    privacy-safe durable settlement outbox. Normal charges use cache plus one
    durable transaction. Retryable post-work failures create pending work and
    return successful response completion; a worker retries with the original
    charge identity until committed or manual review.
  data_flow:
    - Load valid Dragonfly billing projection or recover it with one Directus read and Vault decrypt.
    - Acquire hashed-subject Dragonfly lock with token-safe renewal and release.
    - Re-check cached projection, calculate and encrypt the next balance, then commit once through Directus.
    - On success, update Dragonfly projection and asynchronously update summaries, stats, top-up checks, and broadcasts.
    - On retryable conflict after paid work, atomically create/reuse pending settlement and finalize the response successfully.
    - Retry worker commits with the original charge identity or transitions exhausted work to manual review.
  affected_files:
    - {path: specifications/features/billing/specification.yml, reason: Approved reliability assertions.}
    - {path: specifications/features/billing/examples.yml, reason: Concurrency and recovery examples.}
    - {path: backend/core/api/app/services/billing_service.py, reason: Cache-first locked settlement and bounded retry.}
    - {path: backend/core/api/app/services/billing_settlement_service.py, reason: Shared lock, outbox, and retry lifecycle if extraction is required.}
    - {path: backend/core/api/app/tasks/billing_settlement_tasks.py, reason: Asynchronous idempotent retry worker.}
    - {path: backend/core/directus/schemas/billing_settlement_outbox.yml, reason: Durable privacy-safe pending settlement state.}
    - {path: backend/core/directus/schemas/billing_refund_identities.yml, reason: Durable exactly-once refund identities.}
    - {path: backend/core/directus/extensions/sub-chat-orchestration-transaction/src/operations.js, reason: Atomic pending/commit transitions.}
    - {path: backend/apps/ai/tasks/stream_consumer.py, reason: Completion-safe retry scheduling.}
    - {path: backend/tests/test_billing_settlement_reliability.py, reason: Red/green concurrency and recovery proof.}
    - {path: backend/tests/test_stream_consumer_recovery.py, reason: Response lifecycle proof.}
    - {path: backend/scripts/test_billing_settlement_contract.py, reason: Real dev internal API concurrency and replay contract.}
    - {path: frontend/apps/web_app/tests/billing-settlement-recovery.spec.ts, reason: Deployed response completion and reload proof.}
  verification_strategy:
    - Run focused red pytest and Node transaction tests before source changes.
    - Verify green unit/integration tests and IO counts locally.
    - Restart the dev API and workers through OpenMates CLI and test the real internal API.
    - Run a real dev CLI multi-tool chat, SDK/CLI parity audit, then deploy and run Playwright.
    - Review laptop/mobile visual smoke and required phone/laptop proof videos.
  verification_order:
    - Backend transaction and service tests red, then green.
    - Real internal REST contract against api.dev.openmates.org.
    - Real OpenMates CLI chat against api.dev.openmates.org.
    - SDK/CLI parity audit; no SDK API shape changes expected.
    - Deployed web Playwright against app.dev.openmates.org.
    - Reviewed laptop/mobile visual smoke.
    - Required proof-video review and publication.
    - Apple not changed; shared backend semantics covered by prior gates.

