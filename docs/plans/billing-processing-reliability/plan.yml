clarification:
  rounds:
    - question: Should the encrypted Directus balance be replaced with a numeric database balance?
      answer: No; retain Vault-encrypted balance storage for this fix.
    - question: What role should Dragonfly have?
      answer: Primary operational read, lock, and projection target, with one minimal durable Directus transaction per normal settlement.
    - question: Should settlement failure after response persistence fail the response?
      answer: No; create a durable retry and preserve successful response completion.
    - question: Should the current overdraft policy change?
      answer: No; preserve the bounded -500 personal credit floor.
  vision_summary: >
    Fix failed processing with the smallest durable billing change. Use Dragonfly
    to avoid repeated database reads and serialize normal charges, retain encrypted
    Directus CAS for correctness, and move retryable post-work settlement failures
    into a durable asynchronous recovery path that cannot fail the delivered answer.
  approved_by_user: true

