assumptions:
  - id: A-1
    text: Dragonfly cannot be the sole durable financial authority under its current deployment configuration.
    category: reliability
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/docker-compose.yml
        summary: Cache mounts a volume but configures no explicit dir, dbfilename, or snapshot schedule.
      - source: Dragonfly persistence documentation
        summary: Durable recovery requires configured snapshots and remains separate from transactional Directus state.
  - id: A-2
    text: The user cache projection can safely retain the encrypted balance snapshot alongside plaintext credits without exposing it to clients.
    category: privacy
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/cache.py
        summary: Server user profiles already hold decrypted billing state and are not client authority.
  - id: A-3
    text: Existing token-safe renewable Dragonfly lock and Directus outbox patterns can be reused rather than introducing another coordination system.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/account_import_service.py
        summary: RedisImportLock provides SET-NX, token-safe renewal, and token-safe release.
      - source: backend/core/directus/extensions/chat-recovery-transaction/src/operations.js
        summary: Existing outbox uses atomic idempotent state transitions and bounded error categories.

contracts:
  api:
    - surface: POST /internal/billing/charge
      access_model: internal-only
      auth: Internal service token.
      owner_team_scope: Payload binds one user ID and hashed billing subject; cross-subject retries are rejected.
      rate_limits: Existing internal controls plus per-subject Dragonfly serialization and bounded lock wait.
      credit_budget: Preserve the -500 personal floor and existing reservations/overdraft behavior.
      encryption: Plaintext balance exists only in server memory and Dragonfly; Directus stores Vault ciphertext and privacy-safe identifiers.
      response: Existing committed charge result; retryable conflicts are internal settlement states, not client errors after paid work.
  data:
    - A valid Dragonfly projection stores plaintext credits, matching encrypted snapshot, and projection version under the server-only user profile key.
    - One durable settlement transaction atomically commits encrypted balance, charge identity, raw usage, and any reservation transition.
    - A new durable settlement outbox stores identifiers, encrypted-safe usage payload, state, attempts, timestamps, and sanitized error code; no chat plaintext or keys.
    - Outbox states are pending, committed, retry_scheduled, and manual_review with idempotent transitions.
  privacy_security:
    - Never log plaintext balance, user content, raw user ID in lock keys, keys, credentials, or provider output.
    - Lock keys use hashed billing subjects and token-safe renewal/release.
    - Dragonfly loss must recover from Directus without treating missing data as zero.
  performance:
    - Normal valid-cache settlement performs no pre-commit Directus balance read and one durable transaction.
    - Lock contention uses bounded wait and jitter; no immediate recursive retry loop.
    - Finalized responses do not wait for asynchronous retry settlement.

