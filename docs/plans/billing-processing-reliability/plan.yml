scenarios:
  - id: S-1
    title: Concurrent cached charges serialize and commit once
    given:
      - A valid Dragonfly projection contains plaintext credits and the matching encrypted Directus snapshot.
      - One chat completes parallel web-search, image-search, and model operations.
    when:
      - Distinct charges settle concurrently for the same personal billing subject.
    then:
      - One token-safe subject lock serializes their read-calculate-encrypt-commit sections.
      - Each charge performs one durable transaction and no pre-commit Directus balance read.
      - Every charge deducts and creates raw usage exactly once without a user-visible conflict.
  - id: S-2
    title: Cache loss recovers from durable encrypted authority
    given:
      - Dragonfly has no valid billing projection for the user.
    when:
      - A charge begins.
    then:
      - The service reads and decrypts the Directus balance once, rebuilds the cache projection, and commits once.
      - Missing cache state never becomes a zero balance or lost charge.
  - id: S-3
    title: Retryable settlement cannot fail a completed response
    given:
      - Paid work and assistant persistence have completed.
      - Directus returns a retryable stale-balance conflict after bounded synchronous recovery.
    when:
      - The stream consumer finalizes the response.
    then:
      - One durable settlement retry record reuses the original charge identity and encrypted-safe payload.
      - The final marker remains successful and the task is not marked failed.
      - An asynchronous worker retries settlement exactly once per attempt.
  - id: S-4
    title: Crash and replay preserve exactly-once charging
    given:
      - A durable charge commits but the caller or retry worker crashes before acknowledging it.
    when:
      - The original pending settlement is replayed.
    then:
      - The committed identity returns its original result.
      - No duplicate deduction, usage row, or balance broadcast is created.
  - id: S-5
    title: Lock loss and retry exhaustion fail safely
    given:
      - The Dragonfly lock expires, is lost, or cannot be renewed.
    when:
      - Concurrent settlement reaches the durable transaction.
    then:
      - Directus CAS and charge identity prevent duplicate or stale balance writes.
      - Retryable work becomes pending; exhausted retry budget becomes observable manual review.
      - A completed response remains successful.
  - id: S-6
    title: Normal settlement minimizes durable IO
    given:
      - The Dragonfly billing projection and lock service are healthy.
    when:
      - A normal personal charge settles.
    then:
      - It performs zero pre-commit balance reads and one durable transaction.
      - Post-commit cache, summary, stats, and WebSocket projection failures do not reverse the charge.
      - Timing metrics separate lock wait, Vault work, durable commit, retry persistence, and finalization.
  - id: S-7
    title: Reloaded encrypted embed refs recover when the chat key becomes ready
    given:
      - A completed assistant response references encrypted event embeds.
      - Reload starts ref repair before the matching chat key is available.
    when:
      - The matching chat key becomes ready.
    then:
      - Missing-key decryption is classified as pending rather than permanent failure.
      - Only refs waiting for that chat key are retried once and concurrent repair calls share one in-flight scan.
      - The referenced embeds view leaves its loading state without a reload loop or server re-request.

