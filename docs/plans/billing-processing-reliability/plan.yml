goal: >
  Prevent concurrent encrypted credit settlements from failing completed AI
  responses while minimizing Directus traffic: Dragonfly serves valid cached
  balances and serializes per-subject work, one Directus transaction durably
  commits each normal charge, and retryable conflicts become exactly-once
  pending settlements instead of user-visible response failures.

scope:
  in:
    - Keep Vault-encrypted personal balances as the durable authority.
    - Cache the plaintext balance and corresponding encrypted snapshot in Dragonfly.
    - Serialize personal settlement by hashed billing subject using a token-safe renewable Dragonfly lock.
    - Skip the pre-commit Directus balance read when the cached projection is valid.
    - Retain Directus ciphertext CAS and charge identity as final correctness guards.
    - Add a privacy-safe durable settlement outbox with bounded asynchronous retries and manual-review state.
    - Prevent post-persistence billing errors from changing a completed response to failed.
    - Cover concurrent distinct charges, duplicate retries, cache loss, lock loss, crash-after-commit, and exhausted retries.
    - Measure durable read/write counts and response-finalization latency.
    - Retry unresolved encrypted embed references once when their matching chat key becomes ready after reload.
  out:
    - Replacing the encrypted balance with a plaintext database counter.
    - Changing prices, purchase methods, invoices, usage UI, or the -500 personal credit floor.
    - Making Dragonfly the sole durable financial authority.
    - Refactoring every legacy purchase/refund writer in this incident fix.
    - General AI provider, prompt-size, search-provider, or post-processing performance work.

