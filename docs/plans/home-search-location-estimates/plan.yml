schema_version: 2
profile: concise
id: home-search-location-estimates
title: Honest location areas for home search
status: implementing
goal: >
  Plan out the improvement of the home search. Many places don't list a specific
  address or geo coordinates but describe the area. For each such entry use a
  fast and cheap model (Mercury 3) to extract an estimate from the description /
  details, combine it with OpenStreetMap / a geo API to obtain coordinates plus
  a circle radius, and show that area in the fullscreen listing embed instead of
  a wrong or misleading location. When in doubt we should show a circle around
  the city or district the place is in. What matters is that we don't show exact
  pins on a map if we don't have an exact address.
task: TASK-4501
delivery: User approved implementation on 2026-10-22; scoped implementation and dev deployment are authorized.

contract:
  specification: feature.app-skill.home-search@1
  assertions: [home-search.location.precision, home-search.web.map-and-filter, home-search.enrichment.bounded-and-reusable, home-search.output.safe-and-truthful]
  basis: >
    Reuse the existing owning Specification and home-search-evidence Plan, which
    records its approval. They already cover approximation, provenance, bounded
    enrichment and preventing false precision. This proposal changes no existing
    Specification text or approval record. The user's explicit follow-up makes
    an exact published address a prerequisite for an exact pin.

observations:
  - >
    location_enrichment.py currently returns immediately for provider coordinates.
    Otherwise it geocodes address plus city using Geoapify, then falls back to a
    city point. It does not extract location clues from listing descriptions.
  - >
    Provider approximation and location precision already survive the pipeline.
    HomeListingEmbedFullscreen labels approximation but still renders a pin;
    EmbedLeafletMap has markers/routes and no typed circle overlay.
  - >
    Geoapify already supplies OSM-backed geography, caching and shared credit
    limits. The existing direct Inception client supports Mercury 3 and JSON
    schema output. Reuse both integrations.

product_rules:
  - >
    Render an exact apartment pin only with an exact publicly advertised address
    and a matching precise geocode/location, without provider approximation.
    Coordinates alone, even many decimal places or a building-level result for
    a landmark, never meet this condition. Exclude advertiser office addresses.
  - >
    Otherwise render an area circle. Prefer a supported description-based area;
    if evidence is vague, ambiguous or contradictory, use the known district's
    extent, then the known city's extent. Preserve the original provider evidence.
  - >
    Derive fallback circles from administrative geometry or a returned bounding
    extent. A center plus radius must enclose that extent; do not draw an arbitrary
    small radius at the district/city center. Cache locality geometry and obtain
    the fallback before spending the remaining deadline on optional refinement.
  - >
    If even locality/extent is unavailable, retain the listing with location
    unavailable. Never manufacture a circle or substitute a precise center pin.
  - >
    Explain Approximate area, the rounded radius and its basis: listing wording,
    district, or city. An inferred circle represents a plausible search area,
    not guaranteed containment or a statistical confidence interval.

pipeline:
  - >
    Normalize listing text, advertised locality, exact-address evidence and
    existing location provenance. Establish a district/city circle fallback for
    entries that cannot qualify for an exact pin, including old approximate embeds.
  - >
    For eligible listings within the bounded pool, make one cached Mercury 3
    structured extraction: landmark/station/street/district, relation, stated
    distance or walking time/mode, locality and an exact source quote. No generated
    coordinates, radius or self-reported confidence probability.
  - >
    Validate schema, source quotes and normalized quantities against supplied text.
    Exclude negation, advertiser offices and distant destinations. Listing text
    is untrusted data; the extractor has no tools or arbitrary URL access.
  - >
    Resolve at most two anchors through Geoapify using name, category and advertised
    locality. Check competing results and city/district consistency. Merge entrances
    and platforms of one station before treating records as competing namesakes.
  - >
    Compute a conservative radius with deterministic versioned rules. Preserve
    the broader locality circle on ambiguity, failure, unsupported relationships
    or conflicting clues. Promote a refinement only when its geographic context
    and evidence support it; never average incompatible anchors into a fake center.
  - >
    Persist the selected location and provenance with the result. Opening a saved
    fullscreen embed renders the stored estimate and performs no new inference.

radius_policy:
  numeric_distance: >
    Use the advertised distance/upper bound plus explicit rounding/marketing
    tolerance and the anchor's footprint/location uncertainty. About 500 m from
    a station supports a disk larger than 500 m, not an exact apartment position.
  walking_time: >
    Evaluate a conservative conversion for explicit walking claims, including
    station footprint and advertising tolerance. A candidate upper walking speed
    is 100 m/min, subject to calibration. Do not call this a verified route.
  vague_near: >
    Calibrate broad presets for near/close on held-out known-location examples;
    1-2 km around a station are candidate policies, not established facts. Until
    validated, this wording falls back to the district/city circle. Do not let
    the model invent a precise distance for a qualitative phrase.
  unsupported: >
    Train/driving/unspecified travel time to a destination is not a walking radius.
    Multiple weak clues must not produce an artificially tiny intersection.
    Keep directional wording as evidence; a full disk is conservative for v1.
    Never shrink an oversized area to fit a maximum radius; use a broader locality.

data_and_rendering:
  schema: >
    Add a typed area record beneath location: center latitude/longitude, radius_m,
    basis (description/district/city), method/rule version, status/reason, source
    quote, resolved feature identity and timestamps. Keep extraction, geographic
    source and original provider location distinct. Never write an anchor into
    the listing's address. Expose exact-address eligibility explicitly.
  compatibility: >
    Retain legacy coordinates and approximation fields; an effective area center
    is always approximate and non-building. Check existing precision enum consumers
    before adding values. Carry fields through REST, CLI, npm/pip SDKs, encrypted
    embeds, saved reloads and JSON/flattened TOON hydration.
  maps: >
    Add typed meter-based circle overlays to EmbedLeafletMap and pass through
    EntryWithMapTemplate. Fit the entire circle with panel/mobile padding. Show
    no apartment pin at an area center; any reference station marker is labelled
    as a station. Provide the evidence in readable text outside the map.
  consistency: >
    Apply the same exact-address rule to fullscreen, search overview and shared
    EmbedsMapView. Update searchResultMapMarkers/SearchResultsTemplate as needed;
    do not let recursive coordinate discovery turn an anchor into an apartment.
    Keep filtering/selection tied to the correct listing; area viewport filtering
    uses overlap rather than an exact-center test. Old approximate saved listings
    use the available locality circle and never reappear as exact pins.
  distances: >
    Inferred/district/city centers cannot satisfy precise geographic hard filters
    or produce apartment walking times. Avoid directions actions that present the
    center as the apartment. Existing supported exact-address behavior remains.
  presentation: Translated copy, design tokens, light/dark themes, keyboard-readable explanation and phone/laptop layouts.

performance_and_safety:
  bounded: >
    Reuse the current 24 location candidates, 36 geographic wrapper calls,
    concurrency 3 and 8-second optional location deadline. Share these budgets
    with anchor resolution and existing neighborhood work. Prioritize fallback
    locality circles before optional model refinement; report incomplete refinement.
  proposed_model_limits: >
    At most one extraction per eligible listing in that pool; 6000 input characters,
    600 output tokens, 1.5-second timeout and no automatic retry/expensive fallback.
    Compare instant and low on held-out cases before choosing the helper setting.
    Maxima are ceilings, not a promise that every candidate fits the deadline.
  cache: >
    Key extraction by provider/listing, normalized public-text/locality hash and
    prompt/schema/model version; key areas additionally by feature freshness and
    radius-rule version. Deduplicate in-flight work. Propose 24-hour extraction
    retention and shorter no-clue caching, retaining existing geo cache policies.
    Provider outages remain unavailable, never permanent evidence of no match.
  privacy: >
    Send only necessary public listing facts, stripping contacts and excluding
    chat history, identities and keys. Store minimal evidence; log aggregate
    statuses/latency/usage rather than raw descriptions. No address deanonymization,
    image geolocation, new providers, bulk OSM ingestion or spatial index.
  accounting: >
    Record actual auxiliary tokens/cost through existing accounting and Geoapify
    credits separately; define no new user billing behavior. Ordinary OpenMates
    chat routing and account model settings remain automatic and unchanged.
  illustrative_cost: >
    At 1500 input and 250 output tokens, Mercury costs about $0.00024 per listing
    at current launch rates or $0.00048 at regular rates. Ten uncached extractions
    are about $0.0024/$0.0048, excluding geographic credits and additional billable
    tokens. Budget at regular rates; these are calculations, not measured bills.

implementation_sequence:
  - Define additive location/area types and exact-address eligibility; add source-labelled fixtures and deterministic circle arithmetic.
  - Establish district/city area fallbacks and shared circle rendering so the exact-address rule works without inference.
  - Add Mercury clue extraction, validation and Geoapify anchor resolution inside the existing enrichment stage, with cache and budget handling.
  - Carry refined areas through persisted embeds and every Home map surface; complete circle/evidence interaction and accessibility.
  - Evaluate radius policies and model effort, verify affected flows, then enable supported refinements behind an independent feature flag.

verification_for_implementation:
  local: >
    Extend test_home_location_enrichment.py, test_home_search_pipeline.py and
    geo provider tests for exact-address eligibility, fallback extent containment,
    extraction validation, namesake stations, conflicting clues, deterministic
    radii, cache invalidation, quota/time exhaustion and cancellation. Test circle
    bounds/selection and JSON/TOON normalization in focused frontend unit coverage.
  isolated_ci: >
    Extend home-search-details.spec.ts and relevant Home/map previews at 390px and
    1280px. Assert no exact pins without an exact address, district/city fallback
    circles, full-circle viewport fit, evidence text, exact-pin preservation, saved
    reload, synchronized filtering/selection and no nested anchor pins. Preserve
    contract/assertion metadata. Verify additive REST/CLI/SDK fields through the
    existing CI coordinator; no local product/browser E2E runs.
  model_evaluation: >
    Use about 100 sanitized public/synthetic examples, including at least 60
    adjudicated known-location cases and ambiguous/negative/adversarial cases.
    Keep calibration and final evaluation separate. Compare extraction/abstention,
    wrong-city matches, true point-in-circle containment, radius sizes, refinement
    coverage, fallback rate, p50/p95 latency and actual tokens/geo credits.
    Only direct real-inference helper evaluations run on dev with a scoped lease;
    ordinary OpenMates chat/CLI tests retain automatic routing.
  proposed_release_criteria: >
    Zero exact-pin violations and wrong-city selections on the adversarial bank;
    at least 95% observed containment for displayed refined areas on the held-out
    locatable bank, reported by clue class with sample sizes/uncertainty; preserve
    the 8-second deadline. Report circle sizes and all fallback/abstention cases
    so huge circles or selective rejection cannot hide poor utility. Failing clue
    classes retain district/city circles. These are evaluation targets, not guarantees.

rollout: >
  Release area fallback/rendering first, then optional Mercury refinement behind
  a separate switch. Disable refinement on quality/cost/latency regression while
  retaining the no-pin-without-exact-address rule and district/city circles.
  User subsequently approved implementation and scoped dev deployment.

