  plan:
    status: approved
    approved_at: '2026-11-10'
decisions:
- id: D-1
  status: active
  decision: The server never writes Memories; save_memory publishes a client-applied job gated by a client capability, as
    task updates and project files do.
  reason: Memories are client-encrypted; the Specification forbids durable backend plaintext.
  decided_at: '2026-11-10'
- id: D-2
  status: active
  decision: Updates require the target Memory to be loaded in the current turn.
  reason: The model must edit the real document, and unloaded personal Memory bodies are never visible to it.
  decided_at: '2026-11-10'
- id: D-3
  status: active
  decision: Memory document create, update and delete move into the Rust client core and web calls the core.
  reason: 'Client-core rule: sync and crypto logic lives only in Rust; the CLI needs the same write.'
  decided_at: '2026-11-10'
- id: D-4
  status: active
  decision: Main processor writes without a review step and with Undo; post-processor suggestions remain additional and exclude
    entries written in the turn.
  reason: Requested by the user on 2026-11-10.
  decided_at: '2026-11-10'
attempts:
- id: A-1
