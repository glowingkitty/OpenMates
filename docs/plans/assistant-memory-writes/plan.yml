schema_version: 2
id: assistant-memory-writes
title: Assistant saves and updates Memories directly, with undo
status: draft
goal: 'The main processor can fully create or update a personal Memory through a tool call, with no review step, and the user
  can easily undo that change. Workflows keep their existing direct create-or-modify skill. Post-processor memory and workflow
  suggestions stay as additional suggestions, but never suggest what the main response already created or updated in the same
  turn.

  '
scope:
  in:
  - Internal main-processor tool save_memory (create or update one personal Memory document).
  - Client-applied write job. The server validates and forwards cleartext only to the requesting client; the client encrypts
    and stores. No durable backend plaintext.
  - Memory document create, update and delete in the Rust client core, used by web and CLI/TUI.
  - Chat history notice "Memory created/updated" marked as written by the assistant, with Undo (delete the new Memory or restore
    the previous document).
  - Post-processor receives which memory and workflow writes the main turn made and omits matching recommendations.
  - Job-search focus modes use the tool after the user agrees; real chat proof that a saved career profile is reused without
    re-asking.
  out:
  - Apple UI for the notice and Undo (Apple has no recommendations card yet; it keeps reading Memory documents).
  - Team and Project Memories written by the assistant.
  - Changes to workflow authoring, which already writes directly and has guarded undo.
  - Version history for Memories beyond the single previous document kept for Undo.
scenarios:
- id: S-1
  title: Assistant saves a Memory after the user agrees
  given:
  - A signed-in user in a saved chat on a client that supports memory write jobs.
  when:
  - The user asks to remember something, or agrees to the assistant's offer to save a profile.
  then:
  - The Memory exists encrypted in the account, the chat shows a notice with Open and Undo, and no review step was required.
- id: S-2
  title: Undo
  given:
  - A notice for an assistant-written Memory.
  when:
  - The user chooses Undo.
  then:
  - A created Memory is deleted and an updated Memory is restored to its previous document.
- id: S-3
  title: No duplicate suggestions
  given:
  - A turn in which the assistant saved a Memory or created or modified a Workflow.
  when:
  - Post-processing runs.
  then:
  - No recommendation of the same kind repeats that entry.
- id: S-4
  title: Saved profile is reused
  given:
  - A career profile Memory saved by the assistant.
  when:
  - The user starts a new chat in a job-search focus mode.
  then:
  - The assistant uses the profile and does not ask again for facts it contains.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: save_memory create and update produce a canonical validated document; secrets, oversize and non-canonical documents
    are rejected; the tool is absent without the client capability.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-TOOL
- id: AC-2
  scenario: S-1
  text: The Rust core applies a memory write job by encrypting and storing the document and appending the assistant-sourced
    history notice; a real CLI chat on the isolated stack ends with the Memory present.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: cli
  verification_ids:
  - T-CLI
- id: AC-3
  scenario: S-2
  text: Undo in web deletes a created Memory and restores an updated one; the result survives reload.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-UNDO
- id: AC-4
  scenario: S-3
  text: With a memory or workflow write in the turn, the post-processor output contains no recommendation for that entry.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-POST
- id: AC-5
  scenario: S-4
  text: Real dev chats show a saved career profile being used in Create or update CV and Write application without re-asking.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: manual
  verification_ids:
  - T-REAL
