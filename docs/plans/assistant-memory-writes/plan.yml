approvals:
  specification:
    status: approved
    approved_at: '2026-11-13'
    reason: The user approved the feature.app-memories v5 amendment (assistant-written personal Memories with Undo, Memories
      anonymized on send, no same-turn repeat in recommendations); fingerprint b557cb8693c2bfb0. Dev had meanwhile published a
      draft v5 with the press-release work's Project Memory load-mode changes, so the amendment ships as v6 on top of it and
      the Specification stays draft until the combined v6 is approved.
  plan:
    status: approved
    approved_at: '2026-11-10'
decisions:
- id: D-1
  status: active
  decision: The server never writes Memories; save_memory publishes a client-applied job gated by a client capability, as
    task updates and project files do.
  reason: Memories are client-encrypted; the Specification forbids durable backend plaintext.
  decided_at: '2026-11-10'
- id: D-2
  status: active
  decision: Updates require the target Memory to be loaded in the current turn.
  reason: The model must edit the real document, and unloaded personal Memory bodies are never visible to it.
  decided_at: '2026-11-10'
- id: D-3
  status: active
  decision: Memory document create, update and delete move into the Rust client core and web calls the core.
  reason: 'Client-core rule: sync and crypto logic lives only in Rust; the CLI needs the same write.'
  decided_at: '2026-11-10'
- id: D-4
  status: active
  decision: Main processor writes without a review step and with Undo; post-processor suggestions remain additional and exclude
    entries written in the turn.
  reason: Requested by the user on 2026-11-10.
  decided_at: '2026-11-10'
- id: D-5
  status: active
  decision: Stored Memories hold real details, never privacy placeholders. A memory write job restores the turn's placeholders
    before the client encrypts and stores the document. Every Memory body the client releases to the server (approval, auto
    include, mention) is anonymized with the chat's placeholders first; mappings created for it are stored inside the chat-key-encrypted
    memory response message, and history readers merge them with the user-message mappings.
  reason: 'Owner decision 2026-11-13 (relayed from a voice call): placeholders in stored memories are pointless; real details
    must never reach the server. A real run showed a saved profile with placeholders breaking the next chat (admitted_turn_unreadable).'
  decided_at: '2026-11-13'
attempts:
- id: A-1
  task_id: TASK-1
  outcome: planned
