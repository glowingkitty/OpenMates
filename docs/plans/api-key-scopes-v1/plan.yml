scenarios:
  - id: S-1
    title: Restricted API key can only use selected backend scopes
    given:
      - Alice owns an approved API key with a limited scope set.
      - The key is used from an approved API-key device.
    when:
      - The key calls supported API-key routes across Chats, Tasks, Projects, Plans, Workflows, Memories, app skills, developer API keys, devices, or account export.
    then:
      - The backend authorizes only methods and paths mapped to explicit selected scopes.
      - Unsupported or unmapped route/method combinations fail closed.
      - Missing scopes return typed authorization failures without exposing user data.

  - id: S-2
    title: Create-only scopes create new resources without existing-resource access
    given:
      - Alice creates a limited API key with a create-only category for one or more resource types.
    when:
      - The key creates a new Chat, Task, Project, Plan, or Workflow through a supported collection endpoint.
      - The same key tries to read, update, delete, append to, share, or execute existing resources.
    then:
      - New resource creation is allowed for the selected categories.
      - Existing-resource read/modify/execute/share operations are denied.
      - Denied calls do not leak encrypted account material.

  - id: S-3
    title: Full-access compatibility and limited-key enforcement
    given:
      - Alice owns API keys with different combinations of full_access, explicit scopes, and device approval states.
    when:
      - A key calls encrypted product routes or account export routes.
    then:
      - Unapproved devices are denied before scope grants matter.
      - Approved full-access keys may call supported user-facing endpoints without individual scope entries.
      - Approved limited keys must have the exact scope mapped to the requested endpoint.
      - Admin, billing, account-security, and unsupported endpoints remain unavailable regardless of full_access.

  - id: S-4
    title: User selects API-key access levels in Settings
    given:
      - Alice opens Settings > Developers > API Keys and starts creating a key.
    when:
      - Alice leaves Full access enabled or disables it to configure Limited access.
    then:
      - Full access uses the existing Settings toggle and shows the full-access warning below it.
      - Disabling Full access reveals a long scrollable list grouped by Chats, Tasks, Projects, Plans, Workflows, Memories, Account, API keys, Devices, Apps, and Skills.
      - Every fixed scope in canonical_scope_registry has its own existing Settings toggle row and starts disabled.
      - Dynamic apps and skills use existing app/skill toggle rows.
      - The submitted payload matches backend-enforced scopes.

