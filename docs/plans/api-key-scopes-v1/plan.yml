security_decisions:
  - id: SD-1
    decision: X-OpenMates-SDK is caller-controlled metadata only and is never an auth boundary.
    reason: A client can forge request headers; authorization must depend on stored API-key/device records and scopes.
  - id: SD-2
    decision: full_access bypasses individual scope checks only for explicitly supported user-facing API-key endpoints.
    reason: This preserves existing full_access keys while the fail-closed route registry continues to block unsupported, admin, billing, and account-security surfaces.
  - id: SD-3
    decision: Create-only means POST collection creation only, not read, update, delete, append, share, or execute on existing resources.
    reason: Users need automation keys that can create new resources without becoming account read/write keys.
  - id: SD-4
    decision: Unsupported API-key route/method combinations fail closed.
    reason: Adding a route without explicit scope mapping should not accidentally expose data to restricted keys.

