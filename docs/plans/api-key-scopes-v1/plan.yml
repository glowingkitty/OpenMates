    - frontend/packages/ui/src/components/settings/developers/SettingsApiKeys.svelte owns the Settings API-key create/list/reveal flow.
    - frontend/apps/web_app/tests/api-keys-flow.spec.ts already covers API-key Settings interactions and intercepted create payloads.
  architecture: >
    Keep authorization server-side and centralized. The Settings UI only builds a
    user-readable scope payload; backend policy remains the source of truth for
    route-to-scope requirements, approved-device gating, create-only separation,
    full_access compatibility, and the fail-closed supported-route boundary.
  data_flow:
    - User leaves Full access enabled or disables it to reveal every limited scope toggle grouped by category.
    - Browser builds a scope payload from enabled scope/app/skill toggles and creates the key without exposing plaintext key material to the server beyond the existing one-way hash flow.
    - API-key requests are authenticated by bearer key hash lookup and device_hash approval state.
    - Central route policy first confirms the endpoint is explicitly supported for API-key access.
    - For a supported endpoint, full_access allows the request; otherwise the policy resolves method/path to an exact required scope and rejects a missing scope before product handlers expose data.
    - Product/account-export handlers return only encrypted client-side material after approved-device and full_access-or-exact-scope authorization.
  affected_files:
    - path: docs/plans/api-key-scopes-v1/plan.yml
      reason: Separate executable Plan requiring explicit user approval before continued work.
    - path: backend/core/api/app/routes/auth_routes/auth_dependencies.py
      reason: Central route-to-scope policy and sensitive-route gates.
    - path: backend/core/api/app/routes/apps_api.py
      reason: Enforce dynamic app-skill permission on the direct AI ask dispatch exception.
    - path: backend/core/api/app/routes/openai_compat.py
      reason: Enforce ai:ask permission before OpenAI-compatible requests directly dispatch the skill.
    - path: backend/core/api/app/routes/settings.py
      reason: Validate newly created limited-key payloads against the canonical allowlist.
    - path: backend/core/api/app/services/api_key_authorization.py
      reason: Canonical scope normalization and enforcement helpers.
    - path: backend/core/api/app/utils/api_key_auth.py
      reason: API-key auth/device metadata used by policy enforcement.
    - path: backend/tests/test_workflows_routes_security.py
      reason: Backend route-policy contract coverage for workflow create-only enforcement.
    - path: backend/tests/test_account_export_security.py
      reason: Account-export approved-device and account:export scope coverage.
    - path: backend/tests/test_account_import_security.py
      reason: Account-import approved-device and account:import scope coverage.
    - path: backend/tests/test_api_key_scopes.py
      reason: Broader API-key scope normalization and compatibility coverage.
    - path: frontend/packages/ui/src/components/settings/developers/SettingsApiKeys.svelte
      reason: Existing Full access toggle, categorized per-scope toggle list, dynamic app/skill toggles, and payload mapping.
    - path: frontend/packages/ui/src/components/settings/developers/SettingsApiKeys.preview.ts
      reason: Deterministic API-key create-screen fixture for focused component verification.
    - path: frontend/packages/ui/src/i18n/sources/settings/main.yml
      reason: Localized Settings API-key labels.
    - path: frontend/apps/web_app/tests/api-keys-flow.spec.ts
      reason: Settings flow UI and create-payload assertions.
    - path: frontend/apps/web_app/tests/api-key-scopes-settings.spec.ts
      reason: Focused bare-preview interaction and proof contract for per-scope toggles.
    - path: scripts/api_tests/test_rest_api_security_hardening.py
      reason: Live dev-server scope and approved-device authorization verification.
  verification_strategy:
    - Validate this Plan with python3 scripts/plan_validate.py docs/plans/api-key-scopes-v1/plan.yml.
    - After approval, run python3 scripts/sessions.py lint --session ede3.
    - After approval, run focused backend tests in the routed/coordinated environment required by the restored session instructions.
    - After approval and scoped deploy, run python3 scripts/tests.py run --spec api-keys-flow.spec.ts --gate-deploy --expected-commit <commit>.
    - After deployed Playwright, run reviewed laptop/mobile visual smoke for the long categorized Settings scope list.
    - Before completion, produce and embed required proof-video evidence for the changed Settings API-key product surface.
  verification_order:
    - Plan validation and explicit user approval.
    - Backend route policy and sensitive-route tests.
    - Translation build and locale validation.
    - Session lint.
    - Scoped dev deploy only after approval.
    - Deployed Playwright API-key Settings flow.
    - Visual smoke and proof-video review.
    - Plan verification and final completion summary.

