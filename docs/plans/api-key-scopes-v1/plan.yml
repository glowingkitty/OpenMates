id: api-key-scopes-v1
title: API Key Scopes V1
status: implementing
profile: strict
schema_version: 2

goal: >
  Add comprehensive, backend-enforced API-key scopes and a Settings API-key
  creation UI that lets users choose Full access or Limited access while
  preserving existing full_access keys and denying restricted keys outside their
  explicitly selected scopes.

scope:
  in:
    - Central API-key route policy for supported developer/API-key routes.
    - Fail-closed method/path to scope mapping for supported product surfaces.
    - Separate create-only scopes for new Chats, Tasks, Projects, Plans, and Workflows.
    - Approved-device enforcement for API-key-authenticated encrypted product/account-export routes.
    - Existing full_access keys bypass individual scope checks on supported user-facing API-key endpoints.
    - Settings > Developers > API Keys Full access toggle.
    - A long scrollable Limited access list grouped by category, using the existing Settings toggle UI for every fixed scope.
    - Dynamic app and app-skill access rendered as existing app/skill toggle rows.
    - Focused backend, translation, Playwright payload/UI, visual-smoke, and proof-video verification.
  out:
    - Editing protected Task-bridge route, service, schema, CLI, SDK, UI task-component, or task specification files.
    - Password, passkey, 2FA, recovery-key, active-session, billing checkout, team, organization, or admin privilege management through API keys.
    - Treating X-OpenMates-SDK or another caller-controlled SDK marker as an authorization boundary.
    - Persisting plaintext API keys, plaintext master keys, decrypted chats, decrypted memories, or decrypted account exports.
    - Deploying or marking this work approved before explicit user approval of this Plan.
    - Completing CLI, npm SDK, pip SDK, or Apple parity implementation unless later approved as separate scoped work.

