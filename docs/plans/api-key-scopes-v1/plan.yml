    - chat:read_existing
    - chat:append_existing
    - chat:delete
    - chat:share
    - chat:export
  tasks:
    - task:read
    - task:read_metadata
    - task:create
    - task:write
  projects:
    - project:read
    - project:create
    - project:write
  plans:
    - plan:read
    - plan:read_metadata
    - plan:create
    - plan:write
  workflows:
    - workflow:read
    - workflow:create
    - workflow:write
    - workflow:execute
  memories:
    - memory:read
    - memory:write
  account:
    - account:export
    - account:import
  api_keys:
    - developer:api_keys:read
    - developer:api_keys:create
    - developer:api_keys:revoke
  devices:
