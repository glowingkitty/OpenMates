risks:
  - Risk: A broad full_access shortcut could accidentally expose future privileged routes.
    Mitigation: Maintain an explicit allowlisted route registry; full_access bypasses scope checks only after the endpoint is classified as supported user-facing API-key access.
  - Risk: Create-only labels could imply more access than intended.
    Mitigation: Backend tests and Playwright payload assertions separate create scopes from read/write/execute scopes.
  - Risk: The per-scope list will be long on small screens.
    Mitigation: Use clear category headings and the established compact Settings toggle row within a scrollable settings page; verify laptop and mobile rendering after deploy.
  - Risk: UI-only scope filtering could drift from backend authorization.
    Mitigation: Treat backend scope allowlist as canonical and verify the UI payload against backend-recognized scopes.
  - Risk: Bare-worktree Python tests may miss dependencies such as redis.
    Mitigation: After approval, run required tests through the current routed/coordinated environment or containerized dependency path.

