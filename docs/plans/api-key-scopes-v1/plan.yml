api_access_model:
  route_classification: developer_api_key_rest_api
  auth_requirements:
    - API-key-authenticated requests must present a valid bearer API key.
    - API keys must not be revoked or expired.
    - API-key devices must have an approved device_hash before protected product/account-export access.
    - The backend must use stored API-key metadata and explicit scopes, not caller-controlled SDK labels, to authorize access.
  rate_limit_and_budget:
    - Existing API-key rate limits and credit/budget enforcement remain server-side requirements.
    - Scope denial must happen before any operation that can expose data or spend credits.
  encrypted_data_handling:
    - Routes may return client-side encrypted product/account-export material when the device is approved and the key has full_access or the exact required limited scope.
    - The server must not decrypt or persist plaintext user content as part of this change.

