implementation_notes:
  plan_path: docs/plans/travel-connection-transfer-quality/plan.yml
  existing_patterns:
    - backend/apps/travel/skills/search_connections.py uses Pydantic request normalization and provider fan-out for app-skill requests.
    - backend/apps/travel/providers/db_provider.py already maps Deutschland Ticket/pass-only and regional product filters.
    - backend/shared/providers/deutsche_bahn.py centralizes DB Navigator HTTP headers, TLS transport, and location/journey calls.
    - backend/shared/providers/geoapify/places.py provides bounded, Vault-backed, cached Geoapify request patterns.
    - frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts already proves CLI direct, CLI chat, and deployed web train flows.
  architecture: >
    Add one request field at the travel skill boundary, pass minimum transfer
    intent down to providers, enrich only bounded transfer stops, and build DB
    optimized regional alternatives as additional normal connection results behind
    capped cached train-run lookups. Keep shared behavior backend-first, then
    verify the exact deployed REST, CLI, SDK, web, Firecrawl, user, and Apple
    sequence.
  data_flow:
    - User or direct client submits travel search request with optional `min_transfer_minutes`.
    - Skill normalizes the minimum transfer buffer and provider filters once per request item.
    - DB receives `minUmstiegsdauer`; Flix/flight providers overfetch then post-filter known layovers.
    - For transfer stops with coordinates, the travel provider asks Geoapify for three bounded amenity groups and caches normalized summaries.
    - For regional/Deutschland Ticket searches, DB fetches a capped candidate pool and cached train-run stop lists, then emits additional normal connection results with fixed transfer stations and `Optimized by OpenMates` badges when feasible.
    - REST, CLI, SDK, web, and Apple renderers consume the same response shape.
  affected_files:
    - path: backend/apps/travel/skills/search_connections.py
      reason: Add request field, validation, normalization, response metadata, and result grouping for transfer quality.
    - path: backend/apps/travel/providers/base_provider.py
      reason: Extend provider interface/result models for minimum transfer filtering and transfer amenity metadata.
    - path: backend/apps/travel/providers/db_provider.py
      reason: Forward DB minimum change time, build optimized regional connection results, and call train-run wrapper.
    - path: backend/shared/providers/deutsche_bahn.py
      reason: Add `minUmstiegsdauer` support and `/mob/zuglauf/{zuglaufId}` wrapper with correct content type.
    - path: backend/apps/travel/providers/flix_provider.py
      reason: Overfetch and post-filter Flix/FlixTrain results by known minimum transfer duration.
    - path: backend/apps/travel/providers/serpapi_provider.py
      reason: Post-filter flight layovers by known minimum transfer duration.
    - path: backend/tests/test_travel_search_connections.py
      reason: Backend contract/red-green tests for transfer buffers, amenities, provider failures, and optimized connection results.
    - path: backend/tests/test_travel_skill_constraints.py
      reason: Input validation tests for `min_transfer_minutes` and interaction with existing filters.
    - path: frontend/packages/openmates-cli/src/cli.ts
      reason: Ensure direct CLI app-skill input accepts and passes the new field without special-case loss.
    - path: frontend/packages/openmates-cli/src/generated/appSkills.ts
      reason: Regenerated npm SDK app-skill wrapper after schema changes.
    - path: packages/openmates-python/openmates/generated/app_skills.py
      reason: Regenerated pip SDK app-skill wrapper after schema changes.
    - path: frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts
      reason: Deployed web/CLI natural-language train scenario assertions for transfer quality.
    - path: frontend/packages/ui/src/components/embeds/travel/TravelSearchEmbedFullscreen.svelte
      reason: Render transfer buffer, amenities/status, and the `Optimized by OpenMates` badge on normal travel connection cards.
    - path: frontend/packages/ui/src/components/embeds/travel/TravelConnectionEmbedFullscreen.svelte
      reason: Render per-connection transfer amenity and buffer details.
    - path: shared/docs/privacy_policy.yml
      reason: Add or confirm Geoapify travel transfer-amenity disclosure.
    - path: apple/OpenMates/Sources/Core/Models/EmbedModels.swift
      reason: Confirm native decoding/rendering tolerates new travel metadata.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/travel-connection-transfer-quality/plan.yml
    - python3 -m pytest backend/tests/test_travel_search_connections.py backend/tests/test_travel_skill_constraints.py
    - python3 scripts/smoke_travel_transfer_quality.py --api https://api.dev.openmates.org --scenario deutschland-ticket-regional --min-transfer-minutes 10
    - OPENMATES_API_URL=https://api.dev.openmates.org openmates apps travel search_connections --input '{...}' --json
    - OPENMATES_API_URL=https://api.dev.openmates.org openmates chats new "I have a Deutschland Ticket..." --json
    - node scripts/smoke_travel_transfer_quality_npm.mjs --api https://api.dev.openmates.org --min-transfer-minutes 15
    - python3 scripts/smoke_travel_transfer_quality_pip.py --api https://api.dev.openmates.org --min-transfer-minutes 15
    - python3 scripts/audit_sdk_cli_parity.py
    - python3 scripts/tests.py run --spec skill-travel-train-connections.spec.ts
    - python3 scripts/sessions.py visual-smoke --session <id> --url https://app.dev.openmates.org/dev/preview/embeds/travel --viewport laptop --viewport mobile --result passed --run-id <firecrawl-id> --summary "Checked travel preview/fullscreen rendering, implementation error text, loading states, and responsive layout."
    - python3 scripts/apple_remote.py status && python3 scripts/apple_remote.py build-ios
    - python3 scripts/plan_verify.py docs/plans/travel-connection-transfer-quality/plan.yml
  verification_order:
    - Direct REST API app-skill contract against `https://api.dev.openmates.org` first, with authenticated success, unauthenticated rejection, rate/budget/provider-spend notes, and encryption-boundary classification.
    - Real OpenMates CLI direct skill and CLI chat commands against the dev server second, with no mocked OpenMates API/WebSocket calls.
    - npm SDK and pip SDK parity locally against the dev server third, plus `python3 scripts/audit_sdk_cli_parity.py` when generated wrappers change.
    - GitHub Actions or daily-test reproduction only after local REST/API, CLI, and SDK evidence is green.
    - Deployed web Playwright fourth through `python3 scripts/tests.py run --spec skill-travel-train-connections.spec.ts` after deploy.
    - Firecrawl visual smoke fifth for the deployed travel preview/fullscreen route in laptop and mobile viewports.
    - User confirmation sixth for deployed dev web behavior and visible transfer-quality output.
    - Apple remote status plus build/test last.

