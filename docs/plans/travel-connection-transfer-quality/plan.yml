decisions:
  - id: D-1
    status: active
    decision: Use `min_transfer_minutes` as the canonical OpenMates request field and default it to 10 minutes.
    reason: Existing `max_layover_minutes` is a maximum-duration filter; a separate minimum field avoids opposite semantics on one input.
    decided_at: "2026-08-01T21:08:19Z"
  - id: D-2
    status: active
    decision: Forward DB minimum change time through DB's `minUmstiegsdauer` request field.
    reason: Prior live probes confirmed the upstream DB Navigator API supports the field, making provider-side filtering better than client-side guessing for DB journeys.
    decided_at: "2026-08-01T21:08:19Z"
  - id: D-3
    status: active
    decision: Apply minimum transfer filtering after overfetch for Flix, FlixTrain, and flights.
    reason: Those providers already expose layover durations but do not share DB's `minUmstiegsdauer` request contract.
    decided_at: "2026-08-01T21:08:19Z"
  - id: D-4
    status: active
    decision: Use Geoapify/OSM for transfer amenities with three small category groups and persistent cache.
    reason: Prior probes showed combined categories were capped unreliably; grouped requests give predictable food, shop, and toilet coverage without population data.
    decided_at: "2026-08-01T21:08:19Z"
  - id: D-5
    status: active
    decision: Fetch DB full train runs only for bounded regional-overlap candidate generation, with cache and low per-request caps.
    reason: "`/mob/zuglauf/{zuglaufId}` is required for full train stop lists, but unpaced broad probing can trigger DB `429` responses."
    decided_at: "2026-08-01T21:08:19Z"
  - id: D-6
    status: active
    decision: Emit overlap-derived improvements as additional normal connection results/embeds with an `Optimized by OpenMates` badge, not by overwriting provider-returned trips in place.
    reason: Provider trips carry official provenance, realtime, fare, and booking context; an overlap-derived route can be better, but it is an OpenMates synthesis and must preserve source transparency while still being recommendable and rankable.
    decided_at: "2026-08-01T21:08:19Z"

