schema_version: 2
id: travel-connection-transfer-quality
title: Travel Connection Transfer Quality
status: implementing

goal: >
  Improve `travel.search_connections` so users can ask for realistic transfer
  windows, useful transfer-stop amenities, and Deutschland Ticket-friendly DB
  regional alternatives without brittle provider fallbacks or unbounded third-party
  calls. The same behavior must be proven through the direct app-skill REST
  contract, OpenMates CLI, npm SDK, pip SDK, and natural-language chat paths.

scope:
  in:
    - Extend the existing `travel.search_connections` skill contract instead of adding a new app or route.
    - Add canonical request field `min_transfer_minutes` with default `10` for transfer/change filtering.
    - Forward minimum change time to DB through `minUmstiegsdauer` and post-filter providers that only expose layover durations.
    - Add transfer-stop amenities for train/bus transfer locations using Geoapify/OSM, source labels, bounded request groups, and persistent cache.
    - Use three Geoapify category groups for transfer amenities: catering, shops/supermarket/convenience/bakery/kiosk, and toilets.
    - Add separate normal connection results and `travel-connection` embeds for regional/Deutschland Ticket searches when bounded, cached full train stop lists from `/mob/zuglauf/{zuglaufId}` reveal a better feasible transfer station; the only visible difference is the fixed transfer and an `Optimized by OpenMates` badge/provenance marker.
    - Preserve existing flight, Flix, DB, CLI, SDK, web embed, saved-memory, and provider-attribution behavior while adding new metadata.
    - Update provider/privacy metadata and user-facing copy when Geoapify becomes a travel transfer-amenity source.
  out:
    - Adding a new public travel route or changing the booking-link route.
    - Building a global train graph, importing GTFS feeds, self-hosting OSM, or preloading station amenities.
    - Population-based station scoring or city population lookups.
    - Guaranteeing exhaustive regional routes when DB rate limits, missing train-run data, or provider outages prevent enrichment.
    - Indoor station routing, platform-to-platform walking times, accessibility routing, or live elevator/escalator status.
    - Replacing DB, Flix, Google Flights, or Transitous ranking with Geoapify data.
    - Storing user IDs, chat IDs, API keys, raw long provider payloads, or precise user-specific travel history in provider caches.

context_discovery:
  github_issues:
    - "`gh issue list --search \"travel search connections min change Geoapify Deutschlandticket\"` returned `[]` in prior discovery."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/maps-geoapify-osm-enrichment/plan.yml
    - docs/plans/sdk-cli-parity-v1/plan.yml
    - docs/plans/app-skill-output-safety/plan.yml
    - docs/architecture/apps/travel-train-api-research.md
  code_patterns:
    - backend/apps/travel/skills/search_connections.py currently accepts `max_layover_minutes`, `owned_passes`, `pass_only`, and `rail_products`, but not a minimum transfer field.
    - backend/apps/travel/providers/base_provider.py defines `LayoverResult.duration_minutes`; flight and Flix providers can be post-filtered by existing layover metadata.
    - backend/apps/travel/providers/db_provider.py uses DB `search_journeys()` and already maps Deutschland Ticket pass hints and regional rail products.
    - backend/shared/providers/deutsche_bahn.py sends DB Navigator journey requests to `/mob/angebote/fahrplan` and currently has no train-run wrapper.
    - backend/shared/providers/geoapify/places.py already provides Vault-backed, bounded, cached Geoapify Places and Place Details patterns for OSM-backed data.
    - frontend/packages/openmates-cli/src/cli.ts builds direct app-skill inputs for `openmates apps travel search_connections --input ... --json`.
    - frontend/packages/openmates-cli/src/generated/appSkills.ts and packages/openmates-python/openmates/generated/app_skills.py are generated SDK app-skill wrappers.
    - apple/OpenMates/Sources/Core/Models/EmbedModels.swift registers `app:travel:search_connections` and `travel-connection` embed types.
  tests:
    - backend/tests/test_travel_search_connections.py covers the travel skill contract.
    - backend/tests/test_travel_skill_constraints.py covers travel input/filter constraints.
    - frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts covers CLI direct train search, CLI chat train search, and web train embed rendering.
    - frontend/apps/web_app/tests/skill-travel-connections.spec.ts covers unified travel search preview, CLI direct skill, CLI chat, and web chat paths.
    - packages/openmates-python/tests/test_sdk_generator.py covers generated Python SDK app-skill wrappers.
  findings:
    - Prior live DB probes confirmed `minUmstiegsdauer` works upstream for minimum change duration.
    - "Prior live DB probes confirmed full train stop lists require `/mob/zuglauf/{zuglaufId}` with `Accept: application/x.db.vendo.mob.zuglauf.v2+json`; using the journey content type returned `405`."
    - A broad, unpaced DB train-run probe hit `429`, while a conservative prototype completed with `journey_calls=10`, `train_run_calls=46`, `train_run_cache_hits=10`, `unique_train_runs_cached=46`, and `train_run_429=0`.
    - Combined Geoapify category search was unreliable because of result caps; three small amenity groups are preferred.
    - Live Geoapify access works inside the `api` container through Vault-managed secrets; local shell access without Vault token failed as expected.
    - No app skill files were modified before this spec draft.

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Core/Models/EmbedModels.swift
    - apple/OpenMates/Sources/Core/Watch/WatchEmbedPreviewModel.swift
    - apple/OpenMatesTests/AppleComposerRendererRegistryTests.swift
    - apple/OpenMatesUITests/EmbedRenderingParityUITests.swift
  parity_expectations:
    - Apple must keep rendering travel search parent previews and travel-connection child previews when transfer-quality, amenity, and regional-overlap metadata is present.
    - If web exposes visible transfer-quality badges or amenity summaries, Apple either matches the essential label/summary or records an intentional native difference after deployed web user approval.
    - Apple verification starts only after REST/API, CLI, SDK, deployed web, Firecrawl when required, and user confirmation gates are complete.
  verification:
    - Run `python3 scripts/apple_remote.py status` and then `python3 scripts/apple_remote.py build-ios`, or a targeted iOS test if travel embed parity coverage is updated.
  intentional_native_differences:
    - Apple may initially render a simpler travel connection summary if all new transfer details remain available in generic app-skill metadata and the user accepts that native difference after web approval.

clarification:
  rounds:
    - question: Should this session continue with the next spec step or stop for clarification?
      answer: The user said to continue if there are next steps, or stop and ask for clarification only if unsure how to proceed.
    - question: What default should be used for minimum change duration?
      answer: Prior discovery established a default of 10 minutes.
    - question: Should transfer amenities use Geoapify/OSM and include population counts?
      answer: Prior discovery selected Geoapify/OSM with persistent cache and explicitly excluded population count.
    - question: Should DB regional alternatives use full train-run stop lists?
      answer: Prior discovery established that current journey responses include only boarded segment stops, so optimized regional connection results require bounded `/mob/zuglauf/{zuglaufId}` calls.
    - question: Should OpenMates overwrite provider connection output when a better transfer station is found?
      answer: The user challenged a metadata-only approach and proposed separate connection entries highlighted as `Optimized by OpenMates` when an existing route can be improved by changing the transfer station based on overlap and OSM amenity data.
    - question: Should optimized routes use a special result/embed type?
      answer: No. The user clarified that optimized routes should simply return additional connection results and embeds identical to other connections, except for the fixed transfer station and a badge showing the route is optimized by OpenMates.
  vision_summary: >
    Users should get travel results they can actually make: default ten-minute
    transfer buffers, clear filtering of too-short layovers, amenity context at
    transfer stops, and improved DB regional route candidates when a Deutschland
    Ticket or regional-only request has a better feasible transfer station than
    the provider's original connection. Optimized routes must be returned as
    additional normal connection results/embeds with the same shape as other
    connections, except for the changed transfer station and an `Optimized by
    OpenMates` badge/provenance marker; the implementation must be conservative
    with DB and Geoapify calls, cache provider data, and prove parity through
    REST, CLI, SDK, web chat, and Apple render-contract gates.
  approved_by_user: true

