contracts:
  api:
    - route: POST /v1/apps/travel/skills/search_connections
      access_model: first-party client surface plus approved developer API-key app-skill access; no unauthenticated public access
      auth: Authenticated user session or approved API key with app-skill access; unauthenticated requests return 401.
      request: >
        Existing search request plus `min_transfer_minutes?: integer` defaulting to 10.
        Existing `max_layover_minutes`, `owned_passes`, `pass_only`, and
        `rail_products` retain their current semantics.
      response: >
        Existing grouped travel results plus transfer-quality metadata, optional
        transfer amenity groups, bounded enrichment warnings/status, and optional
        additional normal connection results marked with `Optimized by OpenMates`
        provenance when OpenMates fixes the transfer station.
      rate_limits: Existing app-skill/API-key route limits apply; provider enrichment adds stricter per-request DB train-run and Geoapify caps.
      credit_budget: Uses existing app-skill credit accounting plus provider-spend caps for Geoapify and DB optional enrichment; no uncapped background crawl.
      encryption_boundary: The route handles plaintext travel search parameters and provider data, not client-side encrypted chat, memory, file, key, sync, or share material.
      errors:
        - 401 when unauthenticated.
        - 400 for invalid negative or non-integer `min_transfer_minutes`.
        - Bounded warning/status fields, not whole-request failure, for optional DB train-run or Geoapify enrichment failure when base results succeed.
  data:
    - "`min_transfer_minutes` is normalized per request item and recorded in result metadata as the effective minimum transfer buffer."
    - Transfer metadata includes known duration minutes, whether it meets the minimum, and optional amenity enrichment status.
    - "Provider-returned connections are not silently overwritten; overlap-derived improvements are emitted as additional normal connection records with the same result shape, the fixed transfer station, `source_provider: openmates_optimized`, original-provider references, confidence, and explanation metadata."
    - Geoapify transfer amenity cache keys use station/coordinate/provider context, not user IDs, chat IDs, or raw query text beyond necessary location/category normalization.
    - DB train-run cache keys use train-run identifiers, date/provider version, and sanitized route context only.
  ui_states:
    - Transfer buffer summary visible in travel connection details when transfers exist.
    - Transfer amenity groups visible or summarized when available; missing data shows a neutral status, not a negative claim.
    - Optimized routes render as the same travel connection card/fullscreen layout as other results, with a visible `Optimized by OpenMates` badge and transfer-station change explanation.
    - Existing no-results, loading, booking CTA, calendar, and save-to-memory states continue to render.
  privacy_security:
    - Do not log API keys, session tokens, user identifiers, chat IDs, raw long DB/Geoapify payloads, or precise user-specific travel history.
    - Provider/privacy disclosures must include Geoapify as a travel transfer-amenity data source if not already disclosed for the Travel app.
    - Optional provider failures must be visible in structured status/warnings; do not silently fabricate amenities or optimized connection results.

