scenarios:
  - id: S-1
    title: Minimum transfer time filters impossible connections
    given:
      - Alice searches Berlin to Munich by train for a future date without specifying a transfer buffer.
      - DB, FlixTrain, and flight providers may return connections with transfers or layovers.
    when:
      - "`travel.search_connections` runs with default request settings."
    then:
      - The effective minimum transfer time is 10 minutes.
      - DB receives the minimum change request through `minUmstiegsdauer`.
      - Providers that only expose layover duration are overfetched and post-filtered so returned transfer windows are at least 10 minutes unless the provider cannot expose transfer duration.

  - id: S-2
    title: Caller can request a longer transfer buffer
    given:
      - "Alice wants more time to change trains and submits `min_transfer_minutes: 20`."
    when:
      - "`travel.search_connections` searches train and flight providers."
    then:
      - Returned connection metadata shows the effective minimum transfer time is 20 minutes.
      - Connections with known transfer windows below 20 minutes are excluded or marked as filtered out in the request group's summary.
      - Existing `max_layover_minutes` behavior still filters overly long layovers independently.

  - id: S-3
    title: Transfer stops include useful amenities
    given:
      - Alice has a connection with a transfer at a station such as Hannover Hbf.
      - The transfer station has coordinates or an EVA/station record that can be resolved to coordinates.
    when:
      - Transfer amenities are included for the result.
    then:
      - The transfer metadata includes food/drink, shops, and toilets groups when Geoapify/OSM returns matches.
      - Each amenity group includes source/provider status, cache status where available, and a bounded result count or short item list.
      - Missing amenity data is represented as `unknown`, `not_configured`, `timed_out`, `rate_limited`, or `unavailable`, not as proof the station lacks amenities.

  - id: S-4
    title: Deutschland Ticket regional search can show optimized OpenMates candidates
    given:
      - "Alice asks for Berlin to Hamburg with Deutschland Ticket or uses `owned_passes: [\"deutschland_ticket\"]`, `pass_only: true`, and regional rail products."
      - DB's normal journey response does not provide enough combined regional options for the route.
    when:
      - The DB provider performs bounded regional optimization discovery.
    then:
      - The provider fetches cached full train runs from `/mob/zuglauf/{zuglaufId}` for a small candidate pool.
      - It detects feasible overlap stations and times between regional trains, respecting `min_transfer_minutes`.
      - If the overlap station improves the route based on transfer feasibility, pass coverage, duration, or requested amenities, the response adds a separate normal connection result with the fixed transfer station.
      - The original provider-returned connection remains present and unmodified except for optional explanatory metadata.
      - The optimized result uses the same result and `travel-connection` embed shape as other connections, with an `Optimized by OpenMates` badge/provenance marker.
      - The optimized result includes route provenance, confidence, fare/pass coverage, transfer explanation, and amenity counts or statuses.

  - id: S-5
    title: Provider limits degrade visibly without breaking base results
    given:
      - DB train-run lookup or Geoapify amenity lookup times out, is rate limited, or is not configured.
    when:
      - The base DB/Flix/flight search succeeds.
    then:
      - Base connection results still return.
      - The response includes a bounded warning or enrichment status explaining which optional enrichment failed.
      - Logs omit API keys, user identifiers, chat IDs, and raw long provider payloads.

  - id: S-6
    title: REST, CLI, and SDK callers receive the same contract
    given:
      - A developer calls the travel app skill directly through REST, OpenMates CLI, npm SDK, and pip SDK.
    when:
      - The request includes `min_transfer_minutes`, Deutschland Ticket/pass-only inputs, and train transport methods.
    then:
      - All programmatic clients send the same request shape and receive matching transfer-quality, amenity, warning, and optimized-connection fields.
      - Unauthenticated REST calls are rejected and approved API-key/session calls work against the real dev API.
      - SDK methods remain generated from app-skill metadata rather than hand-written divergent contracts.

  - id: S-7
    title: Natural-language chat can plan a regional Deutschland Ticket route
    given:
      - Alice tells OpenMates: "I have a Deutschland Ticket. Find regional trains from Berlin to Hamburg next week with enough time to change and tell me what is at the transfer station."
    when:
      - The assistant invokes `travel.search_connections` from CLI chat or web chat.
    then:
      - The assistant passes regional/pass intent and transfer buffer into the app-skill request.
      - The travel embed or assistant answer includes regional/pass coverage, minimum transfer information, transfer amenities or visible enrichment status, and no implementation error text.
      - The saved travel connection flow still works when the result is saved from fullscreen.

