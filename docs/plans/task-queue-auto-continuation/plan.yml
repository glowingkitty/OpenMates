decisions:
  - id: D-1
    status: active
    decision: Queue continuation is ordered by position and created_at within the chat, not by a generic open-task existence check.
    reason: The user explicitly chose ordered queue semantics so task two cannot be skipped by task three or by an unrelated open task.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-2
    status: active
    decision: Explicit task transitions drive continuation; prose alone does not complete, block, or unblock tasks.
    reason: Tasks V1 already requires explicit task tools/API actions, and this slice preserves that safety boundary.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-3
    status: active
    decision: Chat task queue evaluation runs before plan-step continuation.
    reason: The user wants tasks checked first when both product surfaces are attached to a chat.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-4
    status: active
    decision: Blocking human tasks pause the queue only when they are explicitly in the ordered queue as waiting_for_user or blocked.
    reason: Human-owned independent tasks should not starve unrelated eligible AI work, while real user gates must stop unsafe autonomous continuation.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-5
    status: active
    decision: Durable task content and task activity text remain client-encrypted; backend continuation uses only safe metadata and short-lived execution context.
    reason: This preserves the Tasks V1 encryption boundary and avoids durable server-side plaintext.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-6
    status: active
    decision: Real CLI smoke tests use natural chat prompts against https://api.dev.openmates.org and must avoid plan creation.
    reason: The regression is user-visible in normal chat task execution, so direct function tests alone are insufficient.
    decided_at: "2026-07-27T00:00:00Z"
  - id: D-7
    status: active
    decision: Task queue continuation notices remain product-visible system/activity messages, while the LLM sees those continuation notices as synthetic user turns.
    reason: Persisted chat activity must render as system UI, but provider message history should avoid adding mid-conversation system prompts beyond the compiled top prompt.
    decided_at: "2026-07-27T18:06:42Z"

