assumptions:
  - id: A-1
    text: Existing task queue metadata is sufficient to distinguish blocking human tasks from independent human tasks without adding a new durable plaintext field.
    category: data
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/user_task_queue_service.py
        summary: Queue evaluation treats status=blocked or queue_state=waiting_for_user as blockers while skipping independent user todo tasks.
      - source: backend/tests/test_user_task_runtime_tools.py
        summary: Tests cover blocking human tasks and independent human tasks without adding plaintext fields.
  - id: A-2
    text: The existing task update job protocol can be reused for continuation activity/system events without changing public API access models.
    category: api
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/apps/ai/processing/task_tool_executor.py
        summary: Task tool updates continue to use task update jobs for client-encrypted persistence and safe task events.
      - source: backend/tests/test_task_main_processor_tools.py
        summary: Tests cover task completion result propagation and in-turn context updates without changing public API access models.

contracts:
  api:
    - route: PATCH /v1/user-tasks/{task_id}/complete
      access_model: first-party client surface only
      auth: logged-in user session or approved first-party device auth
      request: "{ version: integer }"
      response: "Updated encrypted task metadata plus any safe next_task_id or blocker metadata"
      errors:
        - 401 when unauthenticated
        - 404 when the task is not owned by the current user
        - 409 when the task version changed before the action
      rate_limits: existing authenticated task API limits only
      credit_budget: no new credit or budget limit beyond AI continuation work already charged by chat processing
      encryption_boundary: accepts no plaintext task content and returns no durable decrypted task content
    - route: WebSocket chat send / task_update_jobs
      access_model: first-party client surface only
      auth: logged-in user session or approved first-party device auth
      request: task update job claim and persist messages for client-encrypted task updates
      response: task_update_jobs_available and task_event frames containing safe IDs plus client-encrypted payloads where applicable
      errors:
        - job claim rejected when lease is stale or not owned by the user/device
        - persist rejected when expected task version does not match
      rate_limits: existing authenticated WebSocket/chat limits only
      credit_budget: existing chat inference budget applies to AI continuation turns
      encryption_boundary: durable task content and activity text are client-encrypted before Directus persistence
  data:
    - user_tasks.status, assignee_type, primary_chat_id, position, created_at, version, queue_state, ai_execution_state, started_at, completed_at, and blocked_reason_code remain server-visible safe metadata for routing.
    - user_task_activity stores safe event_type and client-encrypted user-visible activity text.
    - user_task_execution_contexts, if added, stores only short-lived Vault-encrypted execution context and safe owner/task/chat hashes with expiry.
    - No durable server-side plaintext task title, description, latest instruction, labels, or activity text is added.
  ui_states:
    - CLI shows compact task event lines and JSON taskEvents for continuation, completion, blocker, and unblock events.
    - Web UI is not redesigned in this slice, but any web WebSocket capability change must preserve existing chat behavior.
  privacy_security:
    - Task queue continuation is first-party authenticated only.
    - User ownership and task version checks gate every transition.
    - Safe blocker reason codes are enum-like metadata and must not contain private user instructions.
    - Real smoke tests must use test-account placeholders and must not record private chat content or tokens in spec evidence.

