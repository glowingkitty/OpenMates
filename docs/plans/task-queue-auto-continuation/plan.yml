apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple must eventually support the same task update job and queue-continuation protocol before native AI task queues are enabled.
    - This first slice is backend/CLI focused and should not require Apple implementation to prove the approved contract.
  verification:
    - Apple verification is not required for this first slice.
    - Reassess with python3 scripts/apple_remote.py status plus build/test when native task queues are enabled.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should continuation use any open task, or the ordered queue?
      answer: >
        Use the ordered queue. Continuation must pick the next task by position
        and created_at, not just because any open task exists.
    - question: Should tasks or plans run first when both are active in the chat?
      answer: >
        Tasks must be checked before plans. A chat with open tasks should not
        advance to the next plan step until the task queue has no workable task
        or is paused by a blocker/human gate.
    - question: What should happen when the user marks a task complete?
      answer: >
        User-marked task completion should append a chat system/activity message
        and then trigger queue evaluation and continuation.
    - question: How should human tasks interact with AI task continuation?
      answer: >
        Human tasks may be independent or blocking. Blocking human tasks pause
        AI continuation until they are done, skipped, or unblocked; independent
        human tasks should not prevent the next eligible AI task from starting.
    - question: What should the real CLI smoke prove?
      answer: >
        Natural-language real CLI tests should create multiple tasks in a chat,
        execute and complete them sequentially, and exercise blocking/unblocking
        without accidentally creating a plan.
  vision_summary: >
    Task continuation is a deterministic queue contract, not a loose model
    behavior. The assistant must keep working through ordered chat tasks until no
    eligible task remains or a concrete blocker/human gate pauses work, and this
    must be proven with backend tests plus real CLI smoke coverage.
  approved_by_user: true

