risks:
  - name: Accidental durable plaintext
    mitigation: Add execution-context tests and restrict durable fields to encrypted payloads or safe metadata.
  - name: Infinite continuation loop
    mitigation: Use explicit queue states, version checks, and post-turn guard outcomes that must be next_ai_task, blocker, or no_work.
  - name: Plan/task race
    mitigation: Test task-before-plan ordering in the processor-level test before changing plan continuation code.
  - name: Real CLI smoke flakiness from adjacent auth or preflight issues
    mitigation: Keep deterministic backend tests as the primary red/green guard and record CLI failure class separately if unrelated infrastructure blocks smoke verification.

open_questions:
  - Confirm whether queue_state alone is sufficient to mark blocking human tasks or whether a new safe metadata field is needed.
  - Confirm whether web must advertise task_update_jobs in this slice or only after browser task-tool parity work begins.
