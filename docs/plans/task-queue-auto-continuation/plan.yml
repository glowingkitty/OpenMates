    - docs/architecture/platforms/tasks-v1.md
    - docs/architecture/messaging/message-processing.md
  code_patterns:
    - backend/core/api/app/services/user_task_queue_service.py currently marks the next AI task in_progress but does not dispatch continuation work.
    - backend/apps/ai/tasks/ask_skill_task.py directly marks user_task_id done after a response, bypassing queue continuation and activity/event handling.
    - backend/apps/ai/processing/main_processor.py injects task tool context but can finish a turn without enforcing remaining chat tasks.
    - backend/apps/ai/processing/task_tool_context.py resolves chat-attached task context for the main processor.
    - backend/apps/ai/processing/task_tool_executor.py routes explicit task tool mutations through UserTaskQueueService.
    - backend/core/directus/schemas/user_tasks.yml includes queue_state and user_task_activity but no user_task_execution_contexts collection.
    - backend/core/directus/schemas/user_plans.yml includes plan execution contexts that can inform the task execution context shape.
    - frontend/packages/openmates-cli/src/client.ts and ws.ts advertise client_capabilities=task_update_jobs.
    - frontend/packages/ui/src/config/api.ts does not yet advertise task_update_jobs for web WebSocket connections.
  tests:
