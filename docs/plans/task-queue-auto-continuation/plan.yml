schema_version: 2
id: task-queue-auto-continuation
title: Task Queue Auto-Continuation
status: verified

goal: >
  Make chat-attached AI task queues continue deterministically after each task
  transition. When an assistant or user completes, skips, unblocks, or resolves a
  blocking task, OpenMates must pick the next ordered workable task, append a
  visible task activity/system event, and continue until all workable tasks are
  done/skipped/backlogged or a real blocker/human gate pauses the queue.

scope:
  in:
    - Ordered chat task queue evaluation using explicit task status, queue_state, assignee_type, position, and created_at metadata.
    - Task continuation after assistant tool completion, direct user completion, skip, unblock, and user-gate resolution.
    - Blocking human task semantics that pause only when the queue reaches a human task or blocker that is explicitly waiting for user action.
    - Task-before-plan enforcement when both open chat tasks and active plan steps exist.
    - A main-processor post-turn guard that does not allow the assistant to stop on prose while eligible chat tasks remain.
    - Short-lived execution context support for the next AI task without durable server-side plaintext.
    - Client-encrypted task update job and system/activity event persistence for first-party clients that can decrypt task keys.
    - Backend unit tests and real OpenMates CLI smoke tests against https://api.dev.openmates.org before any web or Apple parity work.
  out:
    - Reworking the full Tasks V1 Kanban, task CRUD, key-wrapper, or label architecture.
    - Replacing the approved main-processor task tool protocol from docs/plans/tasks-main-processor-tools/plan.yml.
    - New public or developer task APIs; this slice remains first-party authenticated only.
    - Multi-user collaborative queues, team task queues, or multi-assignee tasks.
    - Inferring task completion, blockers, or unblock events from assistant prose.
    - Browser UI redesign, Playwright UI coverage, or Apple implementation in this first backend/CLI slice.
    - Complex dependency graphs or recurring task automation.

