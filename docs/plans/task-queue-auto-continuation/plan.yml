scenarios:
  - id: S-1
    title: Assistant completes one AI task and automatically starts the next ordered AI task
    given:
      - Alice has a saved chat with three AI-assigned tasks ordered by position 10, 20, and 30.
      - The first task is in_progress and the second and third tasks are todo.
    when:
      - The assistant completes the first task through an explicit task-complete tool.
    then:
      - The first task becomes done and receives a completed activity/system event.
      - The second task, not the third task, becomes the active queued task.
      - Continuation dispatch starts work on the second task without requiring Alice to send another chat message.

  - id: S-2
    title: Blocking human task pauses continuation until resolved
    given:
      - Alice has a saved chat with an AI task at position 10, a human task at position 20, and an AI task at position 30.
      - The human task is marked as a blocking user gate with queue_state waiting_for_user.
    when:
      - The assistant completes the AI task at position 10.
    then:
      - The human task is surfaced as the current blocker in task activity/system events.
      - The AI task at position 30 is not started while the human gate remains unresolved.
      - When Alice marks the human task done, skips it, or unblocks it, the AI task at position 30 becomes eligible for continuation.

  - id: S-3
    title: Independent human tasks do not starve eligible AI work
    given:
      - Alice has a saved chat with an AI task at position 10, a user-assigned independent task at position 20, and an AI task at position 30.
      - The user-assigned task is todo with queue_state none and is not marked waiting_for_user or blocked.
    when:
      - The assistant completes the AI task at position 10.
    then:
      - The independent user task remains todo for Alice.
      - The AI task at position 30 becomes the next active queued task.
      - The queue does not wait for independent user-owned work that was not designated as a blocker.

  - id: S-4
    title: Task queue runs before plan continuation
    given:
      - Alice has a chat with an active plan and two chat-attached tasks.
      - The first task is in_progress and the second task is todo.
    when:
      - The assistant completes the first task and the plan also has an eligible next step.
    then:
      - The task queue starts the second task before any plan step continuation is dispatched.
      - Plan continuation waits until the task queue is complete or blocked.

  - id: S-5
    title: Main processor does not stop on prose while eligible tasks remain
    given:
      - Alice asks the assistant to work through an ordered list of chat tasks.
      - The assistant response ends without tool calls after describing partial progress.
    when:
      - There is still an eligible todo AI task in the chat queue.
    then:
      - The post-turn guard records that continuation is required.
      - The next eligible AI task is queued or the current task is marked blocked with an explicit safe reason.
      - The assistant is not treated as finished just because the last response had no tool call.

  - id: S-6
    title: Real CLI chat proves natural-language task auto-continuation without plans
    given:
      - Alice is logged into the OpenMates CLI against https://api.dev.openmates.org.
      - Alice starts a new saved chat.
    when:
      - Alice asks OpenMates to create three ordered tasks and work through them sequentially.
      - Alice later provides the missing input for a blocking task in a separate chat turn.
    then:
      - The CLI observes task-created, task-started, task-completed, and task-blocked or task-unblocked events.
      - The final task states show ordered sequential completion or a deliberate blocker pause.
      - No plan is created for the smoke scenario.

