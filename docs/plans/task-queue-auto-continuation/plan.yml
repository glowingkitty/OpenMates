implementation_notes:
  plan_path: docs/plans/task-queue-auto-continuation/plan.yml
  existing_patterns:
    - backend/core/api/app/services/user_task_queue_service.py centralizes explicit queue transitions.
    - backend/apps/ai/processing/task_tool_executor.py already routes complete/block/unblock/skip task tools into UserTaskQueueService.
    - backend/apps/ai/processing/main_processor.py is the correct place for task-before-plan and no-tool post-turn enforcement.
    - backend/core/directus/schemas/user_plans.yml execution contexts provide a template for short-lived task execution context storage.
    - scripts/verify_tasks_main_processor_cli_smoke.py already proves real dev CLI task tool flows and can be extended with continuation scenarios.
  architecture: >
    Keep queue state transitions in UserTaskQueueService, add a deterministic
    ordered queue evaluator that returns either next AI task, blocking human gate,
    or no-work state, and call it from task completion/skip/unblock plus
    main-processor post-turn checks. Dispatch continuation through the existing
    first-party chat/task update job path so durable task content and activity
    text remain client-encrypted.
  data_flow:
    - Assistant or authenticated user completes, skips, unblocks, or resolves a task.
    - Queue service writes safe metadata and activity/system event intent with version checks.
    - Ordered evaluator loads chat tasks sorted by position and created_at.
    - If the next item is a blocking human gate, continuation pauses and records safe blocker metadata.
    - If the next item is an eligible AI task, a short-lived execution context and task update job are created and continuation is dispatched.
    - Main processor checks remaining task queue state before any plan continuation or final done state.
    - First-party clients persist encrypted task updates and encrypted activity/system events.
  affected_files:
    - path: docs/plans/task-queue-auto-continuation/plan.yml
      reason: Product contract, task ledger, and evidence ledger for this continuation slice.
    - path: backend/core/api/app/services/user_task_queue_service.py
      reason: Ordered queue evaluation and transition result contract.
    - path: backend/apps/ai/processing/main_processor.py
      reason: Task-before-plan and post-turn remaining-task guard.
    - path: backend/apps/ai/tasks/ask_skill_task.py
      reason: Route task completion through queue service instead of direct done update.
    - path: backend/core/directus/schemas/user_tasks.yml
      reason: Add user_task_execution_contexts if confirmed necessary for short-lived task continuation context.
    - path: backend/core/api/app/services/directus/user_task_methods.py
      reason: Ordered chat queue queries and execution-context persistence helpers.
    - path: backend/tests/test_user_task_runtime_tools.py
      reason: Unit coverage for ordered continuation and blocker semantics.
    - path: backend/tests/test_task_queue_auto_continuation.py
      reason: Focused main-processor continuation and task-before-plan tests.
    - path: backend/tests/test_user_task_execution_contexts.py
      reason: Short-lived context privacy and expiry tests.
    - path: scripts/verify_tasks_main_processor_cli_smoke.py
      reason: Real dev CLI natural-language continuation and blocking scenarios.
    - path: frontend/packages/ui/src/config/api.ts
      reason: Potential web WebSocket task_update_jobs capability parity if needed for first-party encrypted persistence.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/task-queue-auto-continuation/plan.yml
    - python3 -m pytest backend/tests/test_user_task_runtime_tools.py
    - python3 -m pytest backend/tests/test_task_queue_auto_continuation.py
    - python3 -m pytest backend/tests/test_user_task_execution_contexts.py
    - python3 scripts/verify_tasks_main_processor_cli_smoke.py --api-url https://api.dev.openmates.org --scenario auto-continuation --skip-build --keep-artifacts --chat-timeout 420
    - python3 scripts/verify_tasks_main_processor_cli_smoke.py --api-url https://api.dev.openmates.org --scenario blocking-continuation --skip-build --keep-artifacts --chat-timeout 420
    - python3 scripts/plan_verify.py docs/plans/task-queue-auto-continuation/plan.yml
  verification_order:
    - Validate the full spec before implementation.
    - Confirm assumptions A-1 and A-2 before implementation.
    - Add and run backend pytest red-phase coverage first.
    - Implement backend queue continuation and main-processor enforcement.
    - Restart affected local Docker services before dev-server CLI verification if backend/API code changes.
    - Run real OpenMates CLI smoke tests against https://api.dev.openmates.org with real auth/test-account state.
    - Defer GitHub Actions reproduction until local REST/API and CLI evidence is green.
    - Defer web Playwright because this slice has no browser UI redesign.
    - Defer Apple parity because native task queues are not implemented in this slice.

