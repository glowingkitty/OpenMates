decisions:
  - id: D-1
    status: active
    decision: Treat this as a web workspace transition on top of Tasks V1 and Plans V1, not a replacement for their data models.
    reason: Existing task and plan specs already own encrypted storage, status lifecycles, API, CLI, and SDK contracts.
    decided_at: "2026-07-31T00:00:00Z"
  - id: D-2
    status: active
    decision: /tasks and /plans should both use the shared workspace shell/composer pattern, with surface-specific content and copy.
    reason: Workflows and Projects already use the shared shell, and the Figma tasks/plans frames are sibling surfaces.
    decided_at: "2026-07-31T00:00:00Z"
  - id: D-3
    status: active
    decision: Completed plans map to the Done board column.
    reason: User explicitly required completed plans to go to Done.
    decided_at: "2026-07-31T00:00:00Z"
  - id: D-4
    status: active
    decision: Web should expose task/plan update and manage actions already supported by CLI/SDK where practical.
    reason: The user explicitly said web app should support update/manage existing plans/tasks if the CLI does.
    decided_at: "2026-07-31T00:00:00Z"
  - id: D-5
    status: active
    decision: Natural-language destructive or bulk management requests require preview, explicit confirmation, and undo.
    reason: Figma notes call out Undo for modifying/deleting plan requests, and encrypted private task/plan data must not be silently mutated.
    decided_at: "2026-07-31T00:00:00Z"
  - id: D-6
    status: active
    decision: The current Chat workspace is the source of truth for reusable home layout and action treatment.
    reason: The user explicitly requested minimal changes to Chat and reuse of its Daily Inspiration, card rail, top-button/report, composer, and text-link action patterns across workspaces.
    decided_at: "2026-08-01T00:00:00Z"

