implementation_notes:
  plan_path: docs/plans/tasks-plans-workspace/plan.yml
  existing_patterns:
    - Reuse WorkspaceHomeShell and WorkspacePromptComposer from frontend/packages/ui/src/components/workspace/.
    - Reuse DailyInspirationBanner surface behavior and existing hardcoded inspirations.
    - Reuse userTaskService and userPlanService encryption helpers and view models.
    - Reuse TaskBoard/TaskCard semantics where possible, but avoid forcing plan cards through task-only view models.
    - Reuse route shell behavior from /tasks and /plans for auth, settings, notifications, and feature availability.
    - Reuse CLI/SDK live smokes as pre-web cross-client gates.
  architecture: >
    Split the central workspace presentation from embedded project/chat task-plan
    surfaces. The central /tasks and /plans pages compose a shared workspace
    shell, surface-specific board adapters, and a shared prompt composer. Task
    adapters keep using the encrypted task service; plan adapters bucket existing
    plan statuses into board columns without changing stored statuses. Composer
    submissions either call existing encrypted create/update helpers or route to
    the existing task/plan ask behavior with confirmation/undo for destructive or
    ambiguous changes.
  data_flow:
    - Route initializes auth and feature availability before loading encrypted task or plan records.
    - Workspace service loads records, decrypts private fields locally, buckets them into board columns, and renders cards.
    - Composer text is parsed as create/update/manage intent for the current surface; ambiguous/destructive intents produce a preview and require confirmation.
    - Approved mutations call existing userTaskService or userPlanService helpers, preserving client-side encryption and version checks.
    - Mutations broadcast openmates-user-tasks-changed or openmates-user-plans-changed so central, project, chat, and detail surfaces refresh from the same records.
  affected_files:
    - path: frontend/apps/web_app/src/routes/tasks/+page.svelte
      reason: Ensure the task route hosts the shared workspace shell and preserves detail/auth/settings behavior.
    - path: frontend/apps/web_app/src/routes/plans/+page.svelte
      reason: Ensure the plans route hosts a plan-specific workspace rather than TasksPage focus mode.
    - path: frontend/packages/ui/src/components/tasks/TasksPage.svelte
      reason: Split or narrow central task workspace and embedded task/plan surfaces while preserving existing compact callers.
    - path: frontend/packages/ui/src/components/tasks/TaskBoard.svelte
      reason: Board overflow, accessibility, and possible shared board semantics.
    - path: frontend/packages/ui/src/components/tasks/TaskCard.svelte
      reason: Task card action parity and visible management states.
    - path: frontend/packages/ui/src/components/plans/PlanBoard.svelte
      reason: Expected new or extracted plan board for plan status buckets and plan cards.
    - path: frontend/packages/ui/src/components/plans/PlanCard.svelte
      reason: Expected new or extracted plan card actions and Done mapping.
    - path: frontend/packages/ui/src/components/workspace/WorkspaceHomeShell.svelte
      reason: Shared shell may need small slots/overflow refinements for boards.
    - path: frontend/packages/ui/src/components/workspace/WorkspacePromptComposer.svelte
      reason: Shared composer may need submit/voice affordance refinements for task/plan management.
    - path: frontend/packages/ui/src/services/userTaskService.ts
      reason: Expose any missing safe web update/manage helpers already supported by CLI/SDK.
    - path: frontend/packages/ui/src/services/userPlanService.ts
      reason: Expose any missing safe web update/manage helpers already supported by CLI/SDK.
    - path: frontend/packages/ui/src/demo_chats/hardcodedInspirations.ts
      reason: Ensure tasks and plans have surface-specific daily inspiration copy.
    - path: scripts/verify_plans_cli_smoke.py
      reason: Add missing real CLI/dev-API plans smoke if explicit real command evidence is not otherwise recorded.
    - path: frontend/apps/web_app/tests/tasks-plans-workspace.spec.ts
      reason: New deployed Playwright coverage for shared workspace transition.
    - path: frontend/apps/web_app/tests/plans-flow.spec.ts
      reason: Existing plan flow may need route-specific selector updates after /plans becomes plan-specific.
    - path: frontend/apps/web_app/tests/project-plans-flow.spec.ts
      reason: Existing project-linked plan flow must remain green.
    - path: frontend/apps/web_app/tests/tasks-web-app-parity.spec.ts
      reason: Existing task parity flow may need selector updates after shell extraction.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/tasks-plans-workspace/plan.yml
    - python3 scripts/verify_tasks_cli_smoke.py --api-url https://api.dev.openmates.org
    - python3 scripts/verify_plans_cli_smoke.py --api-url https://api.dev.openmates.org
    - OPENMATES_API_URL=https://api.dev.openmates.org node --experimental-strip-types --loader ./frontend/packages/openmates-cli/tests/loader.mjs scripts/verify_sdk_tasks_live_smoke.mjs
    - OPENMATES_API_URL=https://api.dev.openmates.org node --experimental-strip-types --loader ./frontend/packages/openmates-cli/tests/loader.mjs scripts/verify_sdk_plans_live_smoke.mjs
    - python3 scripts/audit_playwright_determinism.py frontend/apps/web_app/tests/tasks-plans-workspace.spec.ts frontend/apps/web_app/tests/tasks-web-app-parity.spec.ts frontend/apps/web_app/tests/tasks-chat-settings-parity.spec.ts frontend/apps/web_app/tests/plans-flow.spec.ts frontend/apps/web_app/tests/project-plans-flow.spec.ts
    - Deploy to dev before Playwright green evidence.
    - python3 scripts/tests.py run --spec tasks-plans-workspace.spec.ts
    - python3 scripts/tests.py run --spec plans-flow.spec.ts
    - python3 scripts/tests.py run --spec project-plans-flow.spec.ts
    - python3 scripts/tests.py run --spec tasks-web-app-parity.spec.ts
    - python3 scripts/tests.py run --spec tasks-chat-settings-parity.spec.ts
    - Firecrawl visual smoke for https://app.dev.openmates.org/tasks and https://app.dev.openmates.org/plans in laptop and mobile viewports.
    - User confirms deployed dev /tasks and /plans visual quality and behavior.
  verification_order:
    - Validate spec and approval gate.
    - Confirm no backend endpoint changes are needed; if an endpoint change becomes necessary, update this spec and run direct REST/API proof first.
    - Run real task CLI smoke against https://api.dev.openmates.org.
    - Add/run real plan CLI smoke against https://api.dev.openmates.org.
    - Run npm and pip SDK live task and plan smokes against https://api.dev.openmates.org.
    - Write/extend Playwright specs and capture red phase against deployed dev before implementation is deployed.
    - Implement web workspace changes.
    - Deploy to dev and run Playwright green specs through scripts/tests.py.
    - Run Firecrawl visual smoke in laptop and mobile viewports.
    - Get user confirmation.
    - Record Apple parity deferral, waiver, or follow-up.
  required_assumptions:
    - A-1
    - A-2
    - A-3
    - A-4
  open_questions:
    - none
  risks:
    - Splitting TasksPage may regress compact project/chat callers unless existing flow specs remain green.
    - A generic board abstraction could hide plan-specific status semantics; plan status mapping must stay explicit and tested.
    - Natural-language management can overreach; destructive/bulk changes require preview and confirmation.
    - Mobile horizontal plus vertical scrolling can trap focus or page scroll if not tested in deployed browsers.
    - The missing live CLI plans smoke could delay implementation; add it before relying on plan web parity.

