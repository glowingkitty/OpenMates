scenarios:
  - id: S-1
    title: Tasks route uses the shared workspace pattern
    given:
      - Alice is logged into the web app and platform:tasks is enabled.
      - Alice has tasks in backlog, todo, in_progress, blocked, and done.
    when:
      - Alice opens /tasks on desktop.
    then:
      - The route renders the shared workspace home shell with surface="tasks".
      - Daily inspiration appears above the workspace content and uses task-specific inspiration copy.
      - The central greeting says "What task is next?" with Alice's first display name when available.
      - Search/filter controls and a task prompt composer are visible.
      - The board shows backlog, todo, in_progress, blocked, and done task columns populated from decrypted task records.

  - id: S-2
    title: Plans route is plan-specific, not a task workspace clone
    given:
      - Alice is logged into the web app and platform:plans is enabled.
      - Alice has draft, active, executing, blocked, completed, and archived plans.
    when:
      - Alice opens /plans on desktop.
    then:
      - The route renders the shared workspace home shell with surface="plans".
      - The central greeting says "What is your next plan?".
      - The composer invites Alice to add or update plans.
      - The primary board shows plan cards, not task creation/transcript extraction as the main workspace content.
      - Completed plans appear in the Done column, blocked plans appear in Blocked, and archived plans are hidden from the default board.

  - id: S-3
    title: Web composer creates short and rich tasks or plans
    given:
      - Alice opens /tasks or /plans.
      - The relevant encrypted API contract and feature flag are available.
    when:
      - Alice enters a short phrase such as "Weather check" into the task or plan composer.
      - Alice enters a longer plan description such as "Plan a teams feature with goals, checks, and risks" into the plan composer.
    then:
      - The short task request creates a task with the phrase as title and encrypted durable fields.
      - The short plan request creates a draft plan with the phrase as title and encrypted durable fields.
      - The longer plan request creates or starts a richer plan draft using existing plan ask/planner behavior where available, without inventing server-side plaintext storage.
      - Success and failure states are visible and testable.

  - id: S-4
    title: Web composer manages existing tasks and plans with confirmation
    given:
      - Alice has an existing task named "Draft launch copy" and an existing plan named "Launch website".
    when:
      - Alice types "move Draft launch copy to blocked" in /tasks.
      - Alice types "mark Launch website complete" or "delete the duplicate launch plan" in /plans.
    then:
      - The web app resolves the target record using the same encrypted local view model semantics as CLI/SDK helpers.
      - Non-destructive single-record changes can be applied with a visible result and undo where practical.
      - Destructive, ambiguous, or bulk changes show a preview and require explicit confirmation before mutation.
      - Delete/archive/complete-many requests show an Undo affordance after completion when the operation can be reversed safely.
      - The network mutation keeps durable private fields encrypted and surfaces API errors instead of silently failing.

  - id: S-5
    title: Boards scroll horizontally and vertically on desktop and mobile
    given:
      - Alice has enough tasks or plans to overflow both axes.
      - Alice uses a 1440px desktop viewport and a narrow mobile viewport.
    when:
      - Alice scrolls the board horizontally across columns and vertically through cards.
      - Alice uses explicit move/status controls on touch.
    then:
      - Columns remain reachable without clipping primary controls, daily inspiration, or composer.
      - Mobile does not depend on hover-only controls or hidden off-screen actions.
      - Horizontal and vertical scroll positions do not trap the whole route or settings panel.
      - Status changes persist after reload.

  - id: S-6
    title: Detail routes and embedded surfaces keep working
    given:
      - Alice opens task and plan detail links from /tasks, /plans, a project page, and chat settings.
    when:
      - Alice edits a task or plan in the central workspace and then opens a detail route.
    then:
      - /tasks/{task_id} and /plans/{plan_id} remain stable and reload-safe.
      - Project-linked and chat-linked task/plan surfaces refresh from the same encrypted records.
      - Central workspace changes do not create duplicate task or plan rows.

  - id: S-7
    title: Disabled, unauthenticated, empty, and error states are explicit
    given:
      - Tasks or plans are disabled, Alice is not authenticated, or the API returns an error.
    when:
      - Alice opens /tasks or /plans.
    then:
      - The route shows a specific disabled, login-required, empty, loading, or error state.
      - The UI does not try to decrypt task or plan content without authentication and keys.
      - Errors are logged and surfaced through visible UI or notifications.

