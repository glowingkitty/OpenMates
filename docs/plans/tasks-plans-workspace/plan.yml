contracts:
  api:
    - route: GET /v1/user-tasks, POST /v1/user-tasks, PATCH /v1/user-tasks/{task_id}, DELETE /v1/user-tasks/{task_id}, POST /v1/user-tasks/reorder, POST /v1/user-tasks/{task_id}/block, POST /v1/user-tasks/{task_id}/unblock, POST /v1/user-tasks/{task_id}/skip, POST /v1/user-tasks/{task_id}/complete, POST /v1/user-tasks/{task_id}/start-ai
      changed_by_this_spec: false
      access_model: Existing authenticated first-party web plus approved CLI/SDK task client surfaces; no new public developer route.
      auth: Logged-in first-party web session or approved API-key SDK/CLI session, with owner/key-wrapper checks.
      request: Encrypted task create/update payloads plus server-visible safe metadata such as status, queue, position, due_at, priority, primary_chat_id, linked_project_ids, and action route metadata.
      response: Encrypted task records or task board projections that trusted clients decrypt locally.
      errors:
        - 401 when unauthenticated.
        - 403 when ownership, feature availability, or key-wrapper access fails.
        - 409 or equivalent when a stale edit races another client update.
        - 429 or budget/credit error for AI start paths if applicable.
      rate_limits: Existing authenticated app/API rate limits; this spec introduces no unauthenticated task surface.
      credit_budget: Non-AI mutations do not spend credits; start-ai and ask-based task generation spend the existing AI/chat budget.
      encryption_boundary: Durable private task title, description, tags, and instructions remain client-side encrypted and are decrypted only by trusted clients.
    - route: GET /v1/user-plans, POST /v1/user-plans, PATCH /v1/user-plans/{plan_id}, POST /v1/user-plans/{plan_id}/activate, POST /v1/user-plans/{plan_id}/complete, and existing criteria/verification/assumption/reference-pattern/learning subroutes
      changed_by_this_spec: false
      access_model: Existing authenticated first-party web plus approved CLI/SDK plan client surfaces; no new public developer route.
      auth: Logged-in first-party web session or approved API-key SDK/CLI session, with owner/key-wrapper checks.
      request: Encrypted plan create/update payloads plus server-visible safe metadata such as status, primary_chat_id, linked_project_ids, current ids, version, and action route metadata.
      response: Encrypted plan records and encrypted plan detail-state rows that trusted clients decrypt locally.
      errors:
        - 401 when unauthenticated.
        - 403 when ownership, feature availability, or key-wrapper access fails.
        - 409 or equivalent when a stale edit races another client update.
        - 429 or budget/credit error for ask/planner AI paths if applicable.
      rate_limits: Existing authenticated app/API rate limits; this spec introduces no unauthenticated plan surface.
      credit_budget: Non-AI mutations do not spend credits; ask/planner generation spends the existing AI/chat budget.
      encryption_boundary: Durable private plan title, summary, goal, scope, assumptions, questions, criteria, checks, evidence, risks, decisions, reference patterns, and learnings remain client-side encrypted and are decrypted only by trusted clients.
  data:
    - Task board statuses stay backlog, todo, in_progress, blocked, and done.
    - Plan board columns are presentation buckets over existing plan statuses; no new status values are introduced.
    - Plan status to board mapping is draft -> backlog, awaiting_confirmation -> todo, active -> todo, executing -> in_progress, blocked -> blocked, completed -> done, archived -> hidden by default.
    - Board cards use decrypted local view models but network payloads and persisted records keep encrypted private fields.
    - Undo for destructive or bulk changes may use reversible status/archive updates or explicit follow-up mutation; irreversible deletes require clear confirmation and must not claim undo if not safely supported.
  ui_states:
    - /tasks authenticated loading, disabled, unauthenticated, empty, load error, board, filtered board, composer pending, composer preview, composer mutation error, and detail route states.
    - /plans authenticated loading, disabled, unauthenticated, empty, load error, board, filtered board, composer pending, composer preview, confirmation required, undo available, and detail route states.
    - Desktop and mobile board overflow states with reachable columns and controls in both axes.
    - Existing project and chat embedded task/plan surfaces remain compact and do not inherit central workspace-only visual chrome.
  privacy_security:
    - No server-side full-text search over encrypted task or plan private fields.
    - No plaintext private task/plan content in OpenObserve logs, analytics, request logs, screenshots intentionally retained outside test artifacts, or API responses.
    - Natural-language management must not execute destructive/bulk mutations without explicit confirmation.
    - Prompt/composer text is transient until encrypted task/plan creation or approved AI/planner processing starts; errors must not preserve sensitive prompt text in logs.

