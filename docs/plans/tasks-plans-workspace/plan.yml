apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Tasks/TaskBoardView.swift
    - apple/OpenMates/Sources/Features/Tasks/TaskDetailView.swift
    - apple/OpenMates/Sources/Features/Plans/PlanDetailView.swift
    - apple/OpenMates/Sources/Features/Chat/ChatView.swift
    - apple/OpenMates/Sources/Core/Networking/OpenMatesAPIClient.swift
  parity_expectations:
    - Apple should eventually expose equivalent task and plan workspace board semantics, including completed plans as Done-column content or an accessible native equivalent.
    - This spec only implements web; Apple parity starts after deployed web Playwright, visual smoke, and user confirmation are complete or explicitly waived.
    - Native may use platform-appropriate lists/sections instead of browser-style horizontal board scrolling if statuses, actions, accessibility, and Done mapping remain equivalent.
  verification:
    - Record Apple as deferred after web user confirmation unless implementation touches shared Apple/API client code.
    - If native code is touched, run or attempt python3 scripts/apple_remote.py status plus build-ios or targeted tests.
  intentional_native_differences:
    - Native task/plan movement may use segmented pickers, context menus, or rotor/actions instead of drag/drop.

clarification:
  rounds:
    - question: Should completed plans be hidden from the active plans strip or visible on the board?
      answer: Completed plans must go to the done column.
    - question: Should web only create plans/tasks, or also update and manage existing records when the CLI supports it?
      answer: If CLI supports update/manage existing plans/tasks, web app should too.
    - question: How should the desktop/mobile board scroll behavior work?
      answer: Mobile and desktop board should support horizontal and vertical scrolling like Figma.
  vision_summary: >
    Tasks and Plans should become first-class sibling workspaces using the shared
    workspace home/composer language instead of a shared generic TasksPage. The
    existing encrypted CLI/API/SDK contracts remain the behavioral source of
    truth; web adds parity where practical, especially plan/task updates and
    management, while preserving Figma-directed board, composer, and scrolling
    behavior.
  approved_by_user: true

