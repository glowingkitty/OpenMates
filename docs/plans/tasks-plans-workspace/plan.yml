schema_version: 2
id: tasks-plans-workspace
title: Tasks And Plans Workspace Transition
status: verified

goal: >
  Move the central Tasks and Plans web routes onto the shared workspace home
  pattern while preserving the approved encrypted task and plan API, CLI, and
  SDK contracts. /tasks and /plans must feel like sibling workspaces: each has
  its own Figma-directed greeting, daily inspiration, prompt composer, Kanban
  board, search/filter affordances, and management actions, with Plans treating
  completed plans as Done-column items instead of hiding them from the board.

scope:
  in:
    - A focused web workspace transition for /tasks and /plans, not a new task or plan data model.
    - Reuse WorkspaceHomeShell, WorkspacePromptComposer, DailyInspirationBanner, shared route chrome, and existing encrypted task/plan services where practical.
    - Keep /tasks task-specific and /plans plan-specific; /plans must no longer look like a generic TasksPage focus mode with task creation and extraction as the primary content.
    - Render task and plan Kanban boards from encrypted client-decrypted records, with stable status columns, search/filter tags, and open chat/workflow/project/detail affordances.
    - Map completed plans into the Done column and keep blocked plans in the Blocked column; archived plans are hidden by default unless an explicit filter/history view is added.
    - Support desktop and mobile board interaction with both horizontal and vertical scrolling like the Figma frames, without clipping composer, daily inspiration, Report Issue, or primary action controls.
    - Bring web create/edit/manage parity up to the existing CLI where practical: tasks edit/update/status actions, tasks ask, plans edit/update/status actions, and plans ask.
    - Use the workspace composer for creating new tasks/plans and for natural-language update/manage requests against existing tasks/plans.
    - Require preview, confirmation, and undo for destructive or bulk natural-language changes such as delete, archive, complete-many, or replace plan/task content.
    - Preserve stable /tasks/{task_id} and /plans/{plan_id} detail routes and the existing project/chat embedded task-plan surfaces.
    - Add or extend Playwright spec.ts coverage for /tasks and /plans route distinction, shared workspace shell usage, board columns, plan Done mapping, composer create/update behavior, responsive scrolling, and visible error/empty states.
  out:
    - New task statuses, new plan statuses, or a replacement for docs/plans/tasks-v1/plan.yml or docs/plans/plans-v1/plan.yml.
    - New public developer REST API endpoints for tasks or plans.
    - Server-side plaintext search over encrypted task or plan titles, descriptions, goals, summaries, criteria, assumptions, checks, or learnings.
    - Team/shared collaborative tasks or plans beyond already approved read-only share behavior.
    - Rebuilding full plan execution, assumption checking, or check-run detail UX beyond what existing Plans V1 services already expose.
    - Replacing ChatHeader, Project details, Workflow details, or Apple UI in this web slice.
    - Exact one-to-one Figma token parity; implementation maps the approved hierarchy and flow to current OpenMates design tokens.

