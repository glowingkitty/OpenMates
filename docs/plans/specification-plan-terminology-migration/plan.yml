implementation_notes:
  plan_path: docs/plans/specification-plan-terminology-migration/plan.yml
  first_slice: Add red one-to-one path, goal-only Plan, and workflow-name fixtures.
  existing_patterns:
    - scripts/specifications.py
    - scripts/plan_validate.py
    - scripts/plan_verify.py
    - scripts/sync_agent_parity.py
    - scripts/tests/test_specifications_workflow.py
    - scripts/tests/test_plan_workflow_validation.py
  architecture: >
    Preserve the existing deterministic engines while renaming their public and
    internal workflow concepts coherently. Specifications retain stable assertion
    identity and exact-hash approval. Plans retain optional progressive records,
    Tasks, handoff, and evidence without a nested implementation-plan phase.
  data_flow:
    - An author creates or amends specifications/<namespace>/<slug>/specification.yml and examples.yml.
    - specifications.py validates and generates the registry, assertion index, and coverage.
    - An author creates docs/plans/<slug>/plan.yml with a goal and optional linked Specification references.
    - plan_validate.py validates only fields that are present plus explicit required gates.
    - tasks-from-plan optionally derives executable Tasks directly from the Plan.
    - plan_verify.py evaluates declared required Checks and evidence before completion.
  boundaries:
    - No REST API, authentication, rate-limit, credit, encryption, or persisted product-data behavior changes.
    - Stable assertion IDs and historical evidence remain immutable even if names contain contracts.*.
    - Generic software and legal uses of contract/spec remain outside the migration.
  affected_files:
    - path: specifications/
      reason: Renamed durable truth bundles, schemas, examples, and generated indexes.
    - path: docs/plans/
      reason: Renamed executable implementation Plans and retained artifacts/history.
    - path: scripts/specifications.py
      reason: Renamed Specification validation, approval, indexing, evidence, docs, archive, and release CLI.
    - path: scripts/plan_validate.py
      reason: Validate goal-first executable Plans and optional progressive sections.
    - path: scripts/plan_verify.py
      reason: Verify only declared required Plan gates and evidence.
    - path: scripts/sessions.py
      reason: Update deploy discovery, generated-file staging, approval checks, and commit metadata.
    - path: .claude/skills/
      reason: Rename and simplify canonical Specification and Plan workflows.
    - path: .claude/agents/specification-verifier.md
      reason: Rename independent durable-truth verifier.
    - path: AGENTS.md
      reason: Establish the new workflow vocabulary and paths.
  migration_rollout:
    - Add failing deterministic migration fixtures first.
    - Move Specification bundles and tooling in one atomic source change.
    - Move all executable Plans and update internal paths in one atomic source change.
    - Rename canonical skills/agents and regenerate mirrors.
    - Regenerate indexes and run focused tests plus tooling parity audits.
    - Retain compatibility only for persisted approval receipts, historical commit trailers, and immutable evidence that concretely require it.
  observability:
    - New CLIs keep concise human and deterministic JSON output.
    - Migration audit reports unresolved active old paths separately from allowlisted generic terminology.
  verification_strategy:
    - Run focused red fixtures before source moves.
    - Run Specification workflow, Plan validator/verifier, hook/deploy, release/archive, and parity suites after migration.
    - Run specifications.py validate and check-generated against the complete repository.
    - Run sync_agent_parity.py --check, audit_agent_tooling_parity.py, and audit_opencode_output_quality.py.
  verification_order:
    - Migration inventory and red tests.
    - Specification bundle/tooling rename.
    - Plan corpus/validator/verifier rename.
