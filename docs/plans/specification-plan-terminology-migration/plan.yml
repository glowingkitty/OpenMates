scenarios:
  - id: S-1
    title: Author defines durable truth as a Specification
    given:
      - A Project needs durable Requirements for a software or non-software capability.
    when:
      - The author invokes the Specification workflow.
    then:
      - The durable bundle uses specifications/<namespace>/<slug>/specification.yml plus examples.yml.
      - The author can use a universal core and optional domain template sections.
      - The author sees Applies to rather than software-only Surfaces language.

  - id: S-2
    title: Author creates a goal-only Plan
    given:
      - Alice wants to organize a birthday dinner.
    when:
      - Alice creates a Plan containing only the goal.
    then:
      - The Plan is valid.
      - Assumptions, Tasks, and Checks are suggested but not required.
      - Missing optional sections do not block completion unless explicitly required later.

  - id: S-3
    title: Governed implementation links Specification to Plan
    given:
      - An approved Specification defines a Settings navigation Requirement and flow.
    when:
      - An implementation Plan is created.
    then:
      - The Plan references the exact Specification revision, Requirement, flow, and applicable Checks.
      - It does not copy durable Specification text or contain a second nested planning stage.

  - id: S-4
    title: Substantial UI behavior uses a linked UI Specification
    given:
      - Settings has extensive navigation, responsive, accessibility, and motion behavior.
    when:
      - Authors separate UI truth from functional feature truth.
    then:
      - Settings Specification links Settings UI and shared Motion Specifications.
      - A separate Specification is not required merely because a feature has several screens.

  - id: S-5
    title: Existing repository history migrates without loss
    given:
      - Durable bundles, Plans, artifacts, approvals, evidence, and stable assertion IDs already exist.
    when:
      - Paths and workflow terminology are migrated.
    then:
      - Every old bundle and Plan maps one-to-one to its new path.
      - Generated output is current.
      - Historical evidence and stable assertion IDs remain traceable.

  - id: S-6
    title: Skills follow the new workflow model
    given:
      - Claude is the canonical skill and agent source.
    when:
      - Agent tooling is regenerated.
    then:
      - define-specification, create-plan, tasks-from-plan, verify-plan, backfill-specification, and specification-verifier exist across supported runtimes.
      - The former intermediate planning stage is removed, and tasks-from-plan is optional.

  - id: S-7
    title: Unrelated contract and spec terminology stays intact
    given:
      - The repository contains Playwright specs, API contracts, provider contracts, and legal contracts.
    when:
      - The terminology migration audit runs.
    then:
      - Those established generic meanings remain unchanged.
      - Only OpenMates Specification and Plan workflow terminology is renamed.

