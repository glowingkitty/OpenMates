goal: >
  Establish Specification, Plan, Task, Check, and Run as the consistent OpenMates
  work model; move durable truth from contracts/ to specifications/ and executable
  implementation ledgers from docs/specs/ to docs/plans/ without losing history,
  evidence, approvals, assertion identity, or agent workflow enforcement.

scope:
  in:
    - Rename the OpenMates Contracts feature and durable bundle vocabulary to Specifications.
    - Move contracts/ to specifications/ and contract.yml to specification.yml while preserving examples.yml.
    - Use docs/plans/<slug>/plan.yml as the canonical executable Plan path, including archived plans and artifacts.
    - Rename Specification and Plan scripts, schemas, hooks, tests, skills, agents, generated files, metadata, help text, and documentation.
    - Replace user-facing and workflow “surfaces” language with “Applies to” while preserving canonical test surface identifiers where machine compatibility requires them.
    - Broaden Specification categories, model concepts, applicability, templates, and examples for UX/UI, finance, marketing, research, operations, events, and other domains.
    - Define separate UI Specifications only when substantial, reusable, independently owned, independently approved, or independently versioned.
    - Make goal the only universally required user-authored Plan field; assumptions, Tasks, and Checks are recommended lightweight additions and all other sections are optional.
    - Remove implicit universal completion gates for optional Plan sections unless present and marked required or imposed by a governing Specification.
    - Rename canonical Claude skills and agents, then regenerate OpenCode and Codex mirrors.
    - Preserve stable assertion IDs even when their legacy contracts.* prefix remains part of immutable evidence identity.
  out:
    - Renaming Playwright *.spec.ts files or the established software-testing term “spec”.
    - Renaming generic API, SDK, provider, schema, protocol, legal, or type-level “contract” terminology unrelated to the OpenMates Specifications feature.
    - Changing product REST APIs, database schemas, persisted encrypted records, routes, or currently shipped UI in this repository-only migration.
    - Automatically splitting every existing Specification into separate UI Specifications.
    - Rewriting historical git commits, release notes, or immutable evidence records.

context_discovery:
  github_issues:
    - gh issue search returned no matching issue.
  docs:
    - docs/plans/contract-driven-development/plan.yml
    - docs/plans/sdd-v2/plan.yml
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/agent-workflow-core.md
    - AGENTS.md
  specifications:
    - specifications/features/specifications/specification.yml is the durable-truth model.
    - specifications/features/plans/specification.yml is the current draft Plan model.
  code_patterns:
    - scripts/specifications.py owns durable bundle validation, generation, approvals, evidence, documentation, and release tracing.
    - scripts/plan_validate.py and scripts/plan_verify.py own executable implementation-ledger validation and completion evidence.
    - scripts/sessions.py enforces changed-test mappings, generated files, approval receipts, and deploy metadata.
    - Canonical skills and agents live under .claude and are mirrored by scripts/sync_agent_parity.py.
    - Existing test annotations use contract-test metadata and canonical surface IDs that require deliberate migration or compatibility treatment.
  tests:
    - scripts/tests/test_specifications_workflow.py
    - scripts/tests/test_specification_test_metadata.py
    - scripts/tests/test_specification_evidence.py
    - scripts/tests/test_sessions_specification_gate.py
    - scripts/tests/test_plan_workflow_validation.py
    - scripts/tests/test_opencode_plan_workflow_audit.py
    - scripts/tests/test_agent_tooling_parity_audit.py
  current_findings:
    - The repository contains more than 40 durable bundles and more than 100 executable implementation ledgers.
    - The existing durable Contracts model is software-specific through fixed surfaces, Requirement categories, model kinds, and examples.
    - Existing full specs primarily behave as Plans because they own decisions, Tasks, attempts, handoff, and evidence.
    - The former intermediate planning stage duplicates planning inside an artifact that is itself becoming a Plan.

clarification:
  rounds:
    - question: How should Specifications adapt across domains?
      answer: Use a universal core with optional removable domain templates.
    - question: Should one consistent object name be used?
      answer: Use Specification, with Specs as a compact UI label.
    - question: When should UI behavior use a separate Specification?
      answer: Only when substantial, reusable, independently owned, independently approved, or independently versioned.
    - question: How should “Applies to” be represented?
      answer: Use Applies to instead of Surfaces and support channels, audiences, locations, systems, devices, markets, teams, and artifacts.
    - question: How should Plan creation expose optionality?
      answer: Use goal-first progressive creation; only goal is required and optional sections are suggested contextually.
  vision_summary: >
    Specifications define durable approved truth across software and non-software
    domains. Plans coordinate one outcome and may contain only a goal, while Tasks
    execute work and Checks/Runs prove only the requirements or criteria that
    actually apply.
  approved_by_user: true

