decisions:
  - id: D-1
    status: active
    decision: Use Specification as the one durable-truth object name.
    reason: It matches approved Requirements, flows, models, applicability, evidence, and revisions without legal-contract ambiguity.
    decided_at: "2026-08-31"
  - id: D-2
    status: active
    decision: Treat current full implementation specs as Plans.
    reason: They own goal, scope, decisions, Tasks, attempts, handoff, and evidence rather than reusable durable truth.
    decided_at: "2026-08-31"
  - id: D-3
    status: active
    decision: Goal is the only universally required user-authored Plan field.
    reason: Plans must support a minimal goal-only flow while progressively suggesting assumptions, Tasks, Checks, and other optional sections.
    decided_at: "2026-08-31"
  - id: D-4
    status: active
    decision: Remove the former intermediate planning stage.
    reason: A Plan must not contain a second nested implementation plan; Tasks are derived directly from the Plan when needed.
    decided_at: "2026-08-31"
  - id: D-5
    status: active
    decision: Preserve generic software spec and contract terminology outside the OpenMates workflow model.
    reason: Playwright filenames, API contracts, legal contracts, and protocol contracts have established independent meanings.
    decided_at: "2026-08-31"

