schema_version: 2
profile: concise
id: daily-inspiration-jev
title: Evaluate clearer Mercury writing against Gemini with unchanged Jev gates
status: verified
goal: Optimize the prompting and input given to Mercury 3 so the model has clearer instructions, evaluate
  whether this fixes the issues, and decide whether it can replace Gemini 3.8 Flash for daily inspirations.
scope_notes:
- Keep one Jev 1.14 decision model and one writing LLM. No additional runtime LLM reviewer, cross-model
  fallback, account model override or activity-gate change.
- Build a lean source-bound writer request with consistent tool descriptions and a single copy brief.
  Preserve approved source identities, source passages, requested language, policy thresholds and thumbnail
  gates.
- Benchmark current Gemini, original-prompt Mercury and clearer-prompt Mercury on the same frozen EN/DE
  evidence, keeping Mercury sampling and reasoning unchanged between its arms.
- Inspect all raw drafts against the exact evidence independently of admission, separating malformed/provider
  output, real copy errors and conservative Jev rejection.
- Switch the sole daily writer to Mercury only if its output is practically comparable to Gemini, source/format
  reliability and unchanged admission do not materially regress, and measured cost/latency favor replacement.
  Otherwise retain Gemini and report the specific remaining cause.
- Use scoped dev deployment for real-inference candidates; no production-server deployment or broad multilingual
  optimization.
- Latest user steering explicitly requests further optimization to use Mercury. Integrate the clear source-bound
  request and LOW/0.5 sole Mercury writer; verify before final dev rollout.
- Correct Jev language-question wording to name the target language and allow headings/fragments without
  wrongly banning English for English. Keep choices, uncertainty handling, finite-confidence threshold,
  grounding/relevance/policy and actual pixel checks unchanged; invalidate old proof/cache.
checks:
- Focused provider-free prompt/source-whitelist/schema/retry and benchmark-isolation tests, scoped lint,
  isolated GitHub CI.
- One fresh paired cohort of twelve planned EN/DE source slots across auroras, recycling and seed dispersal;
  one native writing attempt per arm/source. Record terminal source shortages rather than resample after
  outputs.
- Automated model/admission-blind source-only audit of every draft, plus current production Jev admission,
  source identity, actual thumbnails, supplier usage and latency.
- If replacement is supported, cover and verify actual runtime configuration and writer integration before
  scoped dev rollout.
- One separately identified native release smoke on four fixed public sources, freshly reviewed under
  current gates, including the previously cancelled Mercury source; gate-only recheck of the ten clear
  positives, five real grounding negatives and explicit wrong-language/off-topic controls. Preserve the
  original one-attempt comparison unchanged.
- 'After the observed v9 qualifier false admission, one v10 gate-only native recheck on the same fixed
  nineteen cases plus four actual release drafts and one independent English exclusivity mutation: fourteen
  positives and ten negatives. No further LLM writing calls; preserve failed v9 evidence.'
decision_notes:
- 'The previous three-source check did not establish Mercury incapability: all responses were structured
  correctly and all five withholds appeared to be Jev false holds in source-only automated review.'
- 'Current video instructions conflict: rich three-to-five-sentence schema vs exact-three grounded system
  brief; stale writer selection duties and unrelated examples remain. Clarify the request without relaxing
  admission criteria.'
- 'Follow Inception prompt guidance: short role/style, structured evidence, current task and critical
  checks last. Keep LOW reasoning and temperature 0.5 in both Mercury arms to isolate prompt changes.'
- Provider/prompt internals remain implementation details under existing feature.daily-inspiration@2 and
  feature.language-preferences@1. Source-only review is automated, not native-speaker gold.
