approvals:
  specification:
    status: approved
    approved_at: "2026-08-06T13:33:26Z"
  plan:
    status: not_required
    reason: The approved contract preserves the existing deferred activation architecture and requires only a bounded state-machine repair plus regression coverage.

decisions:
  - id: D-1
    status: active
    decision: Treat `relevant_focus_modes` only as candidates that may be exposed through `activate_focus_mode`.
    reason: Relevance is model preselection, not user-visible or persisted active state.
    decided_at: "2026-08-06T13:33:26Z"
  - id: D-2
    status: active
    decision: Preserve ordinary preselected skills while a focus mode is only relevant.
    reason: The main model must be able to satisfy a normal current-information request with web search without entering Deep research.
    decided_at: "2026-08-06T13:33:26Z"
  - id: D-3
    status: active
    decision: Force Deep research delegation only on a continuation whose `active_focus_id` was established by the normal activation contract.
    reason: Sub-chat-only routing is focus behavior and must not bypass activation or suppress valid tools prematurely.
    decided_at: "2026-08-06T13:33:26Z"
  - id: D-4
    status: active
    decision: Keep mention-dropdown and static example-chat failures outside this repair.
    reason: Their source paths and failure modes are independent from backend focus activation state.
    decided_at: "2026-08-06T13:33:26Z"
  - id: D-5
    status: active
    decision: Preserve the original durable inference identity across focus activation, rejection, mock replay, and nested sub-chat continuations.
    reason: Internal continuation Celery tasks use new task IDs, but the final sealed recovery job must complete the original CLI turn.
    decided_at: "2026-08-06T18:43:46Z"
  - id: D-6
    status: active
    decision: Report a sub-chat upstream only after its stream is known not to be awaiting nested children, and preserve its ancestry and budget on continuation.
    reason: Provisional batch status is not a child report; treating it as completion resumes ancestors before nested evidence exists.
    decided_at: "2026-08-07T10:31:00Z"
  - id: D-7
    status: active
    decision: Populate child category, icon, title, and open affordance before the spawned shell is first rendered; replace only the affordance with a sanitized summary after completion.
    reason: General-knowledge fallback visuals, empty cards, and raw protocol payloads misrepresent the child while real work is running.
    decided_at: "2026-08-08T02:35:00Z"
  - id: D-8
    status: active
    decision: Bind the rainbow processing treatment to the chat currently doing inference, not to an ancestor that is only waiting for descendants.
    reason: Processing state must remain truthful when users navigate between a waiting parent and active child.
    decided_at: "2026-08-08T02:35:00Z"

