schema_version: 2
id: focus-mode-processing-reliability
title: Focus Mode Processing Reliability
status: implementing

goal: >
  Restore the focus-mode state machine so preprocessing only recommends relevant
  modes, the main model explicitly decides whether to activate one, users always
  see and can reject AI-initiated activation, and active Deep research delegates
  through sub-chats without suppressing valid ordinary web searches before
  activation.

scope:
  in:
    - Separate relevant focus-mode candidates from active focus-mode state in AI preprocessing and main processing.
    - Preserve ordinary preselected skills while a relevant focus mode remains only a candidate.
    - Require AI-initiated focus activation to use the existing rejectable countdown, auto-confirm, client event, encrypted persistence, and continuation flow.
    - Apply Deep research sub-chat-only routing only after `web-research` is legitimately active.
    - Add deterministic backend regression coverage for issue `69YT9` without storing private report data.
    - Preserve nested sub-chat completion ordering and continuation ancestry for issue `8LQKD`.
    - Diagnose and repair source or test defects in the activation, rejection, and continuation Playwright specs that exercise this contract.
    - Verify explicit focus-mode activation and focused continuation through a real OpenMates CLI chat against the dev server.
    - Keep spawned sub-chat cards truthful from their first frame: full available title space, correct category visuals, translated open affordance, sanitized summaries, and processing glow on the chat doing work.
    - Verify child-to-parent navigation during real Deep research and publish reviewed web and CLI captioned videos for the same prompt and focus mode before user confirmation.
    - Update stale focus-mode architecture documentation to match the deferred activation implementation.
  out:
    - Focus-mode mention-dropdown search and rendering.
    - Static focus-mode example-chat rendering.
    - New focus modes, focus metadata formats, or focus-mode visual redesign.
    - Changing sub-chat count, depth, budget, or approval limits.
    - Changing developer REST endpoints or exposing encrypted focus state publicly.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401 and the gh CLI fallback returned no matching issue for focus-mode activation or web-research routing.
  reported_issues:
    - "Dev issue 69YT9: model emitted a valid web-search call, but a Deep research gate rejected it and forced a tool-free answer."
    - "Dev issue 8LQKD: nested sub-chats appeared done without summaries and the main chat did not reliably resume synthesis."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/apps/focus-modes-implementation.md
    - docs/architecture/apps/function-calling.md
    - docs/plans/focus-mode-example-chat-rendering/plan.yml
    - docs/plans/apple-sub-chat-focus-parity/plan.yml
  code_patterns:
    - backend/apps/ai/processing/preprocessor.py
    - backend/apps/ai/processing/main_processor.py
    - backend/apps/ai/tasks/focus_mode_auto_confirm_task.py
    - frontend/packages/ui/src/services/chatSyncService.ts
    - frontend/packages/ui/src/components/embeds/focus_mode/FocusModeActivationEmbed.svelte
  tests:
    - backend/tests/test_main_processor_invalid_tool_calls.py
    - frontend/apps/web_app/tests/focus-mode-rejection.spec.ts
    - frontend/apps/web_app/tests/focus-mode-ui-after-activation.spec.ts
    - frontend/apps/web_app/tests/focus-mode-video-real-request.spec.ts
  findings:
    - Preprocessing selected `web-research` as relevant while the request had no active focus mode.
    - Main processing initially exposed `activate_focus_mode`, then the Deep research gate assigned `active_focus_id` directly and replaced all tools with `start_sub_chats`.
    - Gemini requested the valid preselected `web-search` tool; strict validation rejected it because the gate had removed it, then hallucination recovery disabled all tools.
    - No countdown, auto-confirm, `focus_mode_activated` event, encrypted persistence, or sub-chat creation occurred for issue `69YT9`.
    - A nested child waiting for its own sub-chats was reported upstream as complete with provisional batch text, and its continuation lost ancestry and budget metadata.
    - Current failure records show recurring activation/rejection/continuation failures; mention-dropdown failure is a separate frontend root cause.

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Chat/Views/FocusModeView.swift
    - apple/OpenMates/Sources/Features/Chat/ViewModels/ChatViewModel.swift
    - apple/OpenMates/Sources/Core/Networking/WebSocketManager.swift
  parity_expectations:
    - Apple receives the same backend activation and continuation events as web and must never display a merely relevant mode as active.
    - No Apple source change is expected unless verification exposes a parity defect.
  verification:
    - Run the existing targeted Apple focus/chat tests when available, otherwise build iOS after web and user-confirmation gates.
  intentional_native_differences:
    - Apple renders the activation affordance natively rather than using the Svelte activation embed component.

clarification:
  rounds:
    - question: When `web-research` is only relevant, should the model retain both ordinary web search and explicit focus activation as choices, with forced sub-chat delegation beginning only after activation?
      answer: Yes exactly.
    - question: What must the replacement Deep research web and CLI evidence prove after video review?
      answer: Sub-chat titles use available space; active child chats glow while a waiting parent does not; spawn-time category gradient and icon are correct; raw tool JSON never appears; a translated click/tap-to-open affordance smoothly yields to the summary; the web recording opens an active child, uses the translated parent link to return, and finishes the parent synthesis; a matching real CLI chat is also recorded and sent to Discord.
  vision_summary: >
    Preprocessing recommends relevant modes but never activates them. The main
    model can use an ordinary skill without changing focus state or explicitly
    activate a focus mode through the visible, rejectable flow. Only a confirmed
    active Deep research mode may force sub-chat delegation. Spawned child cards
    and navigation must truthfully reflect the live child state from first render,
    and both deployed web and real CLI demonstrations must be reviewed before
    user confirmation.
  approved_by_user: true

