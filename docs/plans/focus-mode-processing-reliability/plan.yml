implementation_notes:
  plan_path: docs/plans/focus-mode-processing-reliability/plan.yml
  existing_patterns:
    - backend/apps/ai/processing/main_processor.py deferred focus activation tool handling
    - backend/apps/ai/tasks/focus_mode_auto_confirm_task.py activation continuation
    - backend/tests/test_main_processor_invalid_tool_calls.py isolated main-processor regression harness
  architecture: >
    Extract or reuse a small deterministic tool-routing decision that distinguishes
    relevant from active focus state. Keep the existing deferred activation and
    encryption architecture unchanged. Diagnose each E2E failure from its report,
    screenshots, and logs before changing source or assertions.
  data_flow:
    - Preprocessor validates relevant skills and focus candidates.
    - Main processor exposes ordinary skills plus activation when no focus is active.
    - Explicit activation creates countdown and stores pending continuation context.
    - Auto-confirm emits activation, the client encrypts focus metadata, and processing resumes active.
    - Only active Deep research narrows routing toward sub-chat delegation.
  affected_files:
    - path: backend/apps/ai/processing/main_processor.py
      reason: Correct relevant-versus-active tool routing.
    - path: backend/apps/ai/processing/preprocessor.py
      reason: Stop focus relevance from enabling sub-chats deterministically.
    - path: backend/apps/ai/processing/focus_mode_routing.py
      reason: Share the dependency-free active-focus routing invariant across both processing phases.
    - path: backend/apps/ai/tasks/ask_skill_task.py
      reason: Allow the reserved recovery task to resume an already-running preflight for sub-chat continuation.
    - path: backend/apps/ai/tasks/stream_consumer.py
      reason: Preserve recovery identity and mark the final sub-chat continuation stream.
    - path: frontend/packages/openmates-cli/src/ws.ts
      reason: Keep saved CLI chats connected through interim recovery and final synthesis persistence.
    - path: backend/tests/test_focus_mode_routing.py
      reason: Add deterministic state-machine regression coverage.
    - path: docs/architecture/apps/focus-modes-implementation.md
      reason: Align stale activation documentation with deferred activation.
    - path: frontend/apps/web_app/tests/focus-mode-rejection.spec.ts
      reason: Change only if investigation confirms a test defect rather than product defect.
    - path: frontend/apps/web_app/tests/focus-mode-ui-after-activation.spec.ts
      reason: Change only if investigation confirms a test defect rather than product defect.
    - path: frontend/apps/web_app/tests/focus-mode-video-real-request.spec.ts
      reason: Change only if investigation confirms a test defect rather than product defect.
    - path: frontend/packages/ui/src/components/sub_chats/SubChatBatchPreview.svelte
      reason: Render truthful title, category, translated affordance, summary transition, and navigation states.
    - path: frontend/packages/ui/src/services/chatSyncServiceHandlersAI.ts
      reason: Preserve spawn metadata, distinguish waiting parent from active child, and sanitize completion summaries.
    - path: frontend/packages/ui/src/components/ChatHistory.svelte
      reason: Use translated parent-chat navigation copy.
    - path: frontend/apps/web_app/tests/deep-research-real-inference.spec.ts
      reason: Prove child navigation and every video-reviewed state through deployed real inference.
  verification_strategy:
    - Record deterministic pytest red evidence before source edits and green evidence after the minimal fix.
    - Restart affected local Docker AI workers/API and run ordinary-search plus explicit `@Web-Research` CLI chats against dev.
    - Deploy the scoped backend/test changes before Playwright green runs.
    - Investigate each remaining E2E failure independently; do not weaken product assertions.
    - Review laptop and mobile screenshots, request user confirmation, then verify Apple last.
  verification_order:
    - Deterministic backend contract
    - Real first-party CLI/WebSocket behavior against dev
    - npm and pip SDK parity marked not applicable unless implementation changes their explicit focus contract
    - Deployed web Playwright specs
    - Reviewed laptop/mobile visual smoke
    - Frame-reviewed and delivered matching web and CLI demonstrations
    - User confirmation
    - Apple remote test or build

