demonstration:
  eligibility:
    status: required
    surface: visual
    reason: Focus activation countdown, active state, rejection, and continuation are user-visible chat behavior.
    classified_at: "2026-08-06T13:33:26Z"
  narration_outline:
    - id: NARR-1
      purpose: Show that an ordinary current-information request can search without silently activating Deep research.
      expected_proof: Search-backed response appears with no active focus pill or sub-chat delegation when ordinary search is chosen.
      scenario_ids: [S-1, S-2]
      acceptance_criteria: [AC-1, AC-2]
    - id: NARR-2
      purpose: Show explicit focus activation and rejection.
      expected_proof: Countdown appears, rejection removes it, and ordinary processing continues without active focus UI.
      scenario_ids: [S-3, S-5]
      acceptance_criteria: [AC-3, AC-6]
    - id: NARR-3
      purpose: Show confirmed Deep research activation.
      expected_proof: Countdown completes, initial child cards are truthful, an active child opens with processing glow, translated parent navigation returns to the waiting parent, summaries replace open affordances without raw JSON, and synthesis completes.
      scenario_ids: [S-4, S-6, S-8]
      acceptance_criteria: [AC-4, AC-5, AC-7, AC-9, AC-10, AC-11, AC-12, AC-13]
    - id: NARR-4
      purpose: Show the same explicit Deep research request in the real OpenMates CLI.
      expected_proof: CLI output identifies the active focus mode, reports three bounded child chats, and returns the six-section final synthesis.
      scenario_ids: [S-7, S-9]
      acceptance_criteria: [AC-8, AC-14]
  evidence:
    status: pending
    privacy_status: pending
    review_status: pending
    publication_status: pending
