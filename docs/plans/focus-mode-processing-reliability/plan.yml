assumptions:
  - id: A-1
    text: "`focus_mode_activated` remains the canonical event that authorizes clients to display and persist active focus state."
    category: sync
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/apps/ai/tasks/focus_mode_auto_confirm_task.py
        summary: Auto-confirm publishes the event only after the countdown completes.
      - source: frontend/packages/ui/src/services/chatSyncService.ts
        summary: Web updates active UI and encrypted persistence only after receiving this event.
  - id: A-2
    text: Existing activation and rejection WebSocket messages remain first-party-only and no route contract changes are required.
    category: api
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/apps/focus-modes-implementation.md
        summary: Focus activation and rejection are part of the authenticated chat WebSocket lifecycle.

contracts:
  api:
    - surface: Existing chat WebSocket focus activation, rejection, encrypted focus update, and continuation messages.
      access_model: first-party client surface only
      auth: Authenticated user and owned chat context are required.
      rate_limits: Existing chat and AI task limits are unchanged.
      credit_budget: Existing AI inference and skill/sub-chat budgets are unchanged.
      encryption: The server emits a plaintext focus identifier only to the authenticated first-party client; the client encrypts it with the chat key before persistence. No decrypted chat content or key material is added to the contract.
    - surface: Existing first-party spawn_sub_chats and sub-chat lifecycle WebSocket messages gain validated category and icon metadata needed before encrypted child-shell persistence.
      access_model: first-party client surface only
      auth: Authenticated user and owned parent chat context are required.
      rate_limits: Existing chat and AI task limits are unchanged.
      credit_budget: Existing bounded root orchestration budgets are unchanged.
      encryption: Spawn metadata is sent only to the authenticated first-party client and stored through the existing encrypted child metadata path; no chat key or decrypted transcript is exposed.
  state:
    - "`relevant_focus_modes` contains candidates only and must not be persisted or displayed as active."
    - "`active_focus_id` is input state from an explicit client selection or completed activation continuation, never a side effect of relevance."
    - Active Deep research may alter tool routing; relevant Deep research may not.
    - A waiting parent and actively processing child have distinct processing states; only the latter drives the active-chat rainbow treatment.
    - Protocol-only tool payloads are never valid user-visible sub-chat summaries.
  ui_states:
    - inactive candidate with no focus UI
    - countdown activation card with reject action
    - activated card and active focus pill
    - rejected card hidden with ordinary processing resumed
    - spawned child card with full available title, validated category visuals, and translated pointer/touch open affordance
    - opened active child with rainbow processing treatment and translated parent-chat navigation
    - waiting parent without rainbow treatment while child processing continues
    - completed child card with sanitized summary replacing the open affordance
  privacy_security:
    - Preserve client-side encryption of persisted active focus metadata.
    - Do not commit issue share keys, user identifiers, chat identifiers, raw private prompts, or trace payloads.

