assumptions:
  - id: A-1
    text: Existing product chats remain stopped until disposable-session verification passes.
    status: confirmed
    required_before: implementation
    evidence:
      - The user stopped all running chats and approved staged recovery.
  - id: A-2
    text: The OpenMates CLI Plans and Tasks feature remains the durable source of execution state, while OpenCode remains the coding runtime.
    status: confirmed
    required_before: task_execution
    evidence:
      - The user explicitly prioritized the OpenMates and OpenCode connection.
  - id: A-3
    text: Hooks are defense-in-depth and cannot replace deploy-time or operating-system access control.
    status: confirmed
    required_before: implementation
    evidence:
      - OpenCode and the control plane currently run under the same Unix identity.

implementation_notes:
  plan_path: docs/plans/opencode-recovery/plan.yml
  architecture: >
    Split product execution from the coding control plane. Ship a minimal hotfix
    first, then bind sessions to durable OpenMates task state through a local CLI
    adapter. Build immutable runtime bundles and activate them atomically. Keep
    product sessions stopped until deterministic and disposable-session gates pass.
  existing_patterns:
    - scripts/sessions.py atomic session-registry updates and OpenCode REST client.
    - OpenMates CLI task and plan contracts from task-queue-auto-continuation.
    - OpenCode Storage and Persist contexts for durable client state.
    - Existing native-worktree integration and recovery refs.
  data_flow:
    - A new or restored OpenCode session resolves its session-scoped model binding.
    - The session bridge resolves its OpenMates plan/task binding through the CLI adapter.
    - The scheduler leases one runnable task and sends an internal execution turn carrying task generation and model binding.
    - Tool progress and terminal task transitions are persisted idempotently.
    - Assistant turn completion schedules another turn only when the durable task remains runnable.
    - Structured proof records attach to the same task/run/commit and render directly.
  affected_files:
    - path: docs/plans/opencode-recovery/plan.yml
      reason: Recovery contract and evidence ledger.
    - path: opencode.json
      reason: Remove the fixed primary-agent step cap and enable recovery feature flags.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Disable media prompt delivery, protect control-plane paths, and integrate durable task scheduling.
    - path: scripts/sessions.py
      reason: Authoritative deploy protection, worktree invariant, task bridge, quarantine, and release support.
    - path: scripts/start-opencode-server.sh
      reason: Activate and verify one immutable runtime bundle.
    - path: scripts/tests/
      reason: Deterministic recovery regression coverage.
    - path: /home/superdev/opencode/packages/app/src/context/models.tsx
      reason: Persist model bindings by session rather than globally.
    - path: /home/superdev/opencode/packages/app/src/context/local.tsx
      reason: Resolve the current model from session-scoped state.
  verification_strategy:
    - Write focused red tests before each behavior change.
    - Run unit and tooling tests without restarting the live server.
    - Build and stage a release, verify hashes, then perform exactly one controlled restart.
    - Validate behavior with disposable sessions before historical recovery.
  verification_order:
    - T-OPENCODE-STEPS
    - T-MEDIA-HOTFIX
    - T-CONTROL-PLANE-GUARD
    - T-OPENCODE-MODELS
    - T-WORKTREE-INVARIANT
    - T-TASK-BRIDGE
    - T-RUNTIME-RELEASE
    - T-SECRET-CONFIG
    - V-MEDIA-QUARANTINE
    - V-RUNTIME-MANIFEST
    - V-DISPOSABLE-SESSIONS
    - V-HISTORICAL-RECOVERY
    - V-CREDENTIAL-ROTATION

