schema_version: 2
id: opencode-recovery
title: OpenCode Recovery and OpenMates Task-Orchestrated Execution
status: implementing

goal: >
  Restore OpenCode to a safe, reproducible, multi-chat coding environment where
  model selection is isolated per chat, useful work is never stopped by an
  arbitrary step count, compaction retains the same logical task, proof media
  cannot leak across chats, deployed worktrees have truthful clean state, and
  durable OpenMates Plans and Tasks decide whether stopped assistant turns
  should be scheduled again.

scope:
  in:
    - Preserve each chat's selected provider and model independently across reloads, compaction, continuation, and server restart.
    - Remove the configured eight-step primary-agent limit and replace fixed-step loop protection with progress-aware task scheduling.
    - Disable synthetic response-media user prompts and quarantine every previously undelivered media record.
    - Prevent ordinary product chats from editing or deploying OpenCode and OpenMates orchestration control-plane files.
    - Restore active-worktree preservation and make merged/deployed worktree metadata agree with Git HEAD and the remaining patch.
    - Package the OpenCode binary, configuration, hook, orchestration scripts, and hashes as one testable atomic runtime release.
    - Bind an OpenCode chat to durable OpenMates Plan and Task identifiers and schedule another turn only while runnable work remains.
    - Preserve stopped chats and recover them sequentially only after disposable-session verification passes.
    - Add deterministic tests and audits for every regression class in this recovery.
  out:
    - Changing, rebuilding, or locally serving the OpenCode web UI.
    - Restricting OpenCode to OpenAI or any other single provider.
    - Automatically resuming all historical chats after a server restart.
    - Deploying the stopped Plans/Tasks worktree or its sessions.py changes without selective review.
    - Replacing the complete OpenMates Tasks, Plans, or Workflows product contracts.
    - Treating hooks or prompt instructions as the sole security boundary for secrets or control-plane source.
    - Completing the product-feature work that belongs to the stopped chats.

context_discovery:
  prior_specs:
    - docs/plans/opencode-orchestration-remediation/plan.yml
    - docs/plans/opencode-session-coordination/plan.yml
    - docs/plans/opencode-native-worktree-binding/plan.yml
    - docs/plans/task-queue-auto-continuation/plan.yml
    - docs/plans/tasks-plans-workspace/plan.yml
  docs:
    - AGENTS.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/agent-workflow-core.md
  code_patterns:
    - /home/superdev/opencode/packages/opencode/src/session/prompt.ts accepts the web client's globally selected model on every prompt, overriding its own last-model fallback.
    - /home/superdev/opencode/packages/opencode/src/session/prompt.ts enforces configured agent steps.
    - opencode.json configures agent.build.steps to eight.
    - .opencode/plugins/openmates-hooks.js records and delivers media through synthetic user prompts.
    - scripts/sessions.py persists continuation/media queues and manages native worktree deployment.
    - scripts/sessions.py copies integrated files into an older source worktree before marking it merged.
    - frontend/packages/openmates-cli provides the intended durable OpenMates Plans and Tasks client surface.
  observed_failures:
    - One chat's model choice changed another chat's effective model after reload.
    - Primary agents stopped with a maximum-steps message before edits could begin.
    - Compaction continuation stopped on repeated provider overflow or surfaced as synthetic user input.
    - Old and malformed video records were delivered into unrelated chats.
    - A product chat modified scripts/sessions.py while implementing unrelated product work.
    - Worktrees reported merged/deployed while still detached on an older commit with copied deployed files shown as dirty.
    - Later product changes functionally removed earlier active-worktree preservation behavior.
    - Runtime source, configuration, hook, and manually patched installed binary could disagree.
    - Plaintext credentials were readable from OpenCode configuration and appeared in diagnostic output.
  user_direction:
    - Keep provider choice flexible but isolate model selection per chat.
    - Do not impose an eight-step or equivalent arbitrary useful-work limit.
    - Continue work while open runnable Plans or Tasks remain connected to the chat.
    - Apply an immediate media hotfix while structured OpenMates CLI proof integration is built.
    - Fix dirty deployed worktrees and prevent product chats from changing sessions.py.
    - Implement this recovery from a separate Codex-controlled zellij workflow before resuming product chats.

clarification:
  rounds:
    - question: Should OpenCode be restricted to OpenAI models?
      answer: No. Provider and model choice must remain flexible and isolated per chat.
    - question: Should a fixed maximum number of agent steps remain as loop protection?
      answer: No. A chat must keep working until its connected runnable work is complete or reaches a genuine waiting/blocked state.
    - question: Should the existing stopped product chats implement the orchestration repair?
      answer: No. Use a separate Codex-controlled workflow, then recover product chats after verification.
  vision_summary: >
    The assistant may finish an individual turn, but durable task state—not a
    global model preference, fixed tool count, idle hook, or fake user message—
    determines whether another turn is scheduled. Control-plane code and secrets
    must be outside ordinary product-agent authority.
  approved_by_user: true

security:
  classification: private_engineering_control_plane
  credential_actions:
    - Revoke and replace the exposed GitHub personal access token.
    - Revoke and replace the exposed Penpot access token.
    - Revoke and replace the exposed Firecrawl API key.
    - Revoke and replace the exposed Brave Search API key.
    - Revoke and replace the exposed Context7 API key.
    - Replace plaintext configuration values with environment references and scan repository history without printing secrets.
  boundaries:
    - Ordinary OpenCode product sessions cannot edit or deploy protected control-plane paths.
    - A hook blocks accidental access, while deploy validation provides the authoritative repository guard.
    - The durable target is a separate Unix identity or container with control-plane and credential paths absent or read-only.
    - New credentials are never written to chat transcripts or committed configuration.

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This recovery changes private coding infrastructure rather than OpenMates Apple product behavior.
  verification:
    - No Mac or Xcode run is required.
  intentional_native_differences:
    - OpenCode orchestration remains developer infrastructure.

scenarios:
  - id: S-1
    title: Concurrent chats keep independent models
    given:
      - Chat A selects an OpenAI model.
      - Chat B selects a Gemini model.
    when:
      - Both chats submit prompts, reload, compact, continue, and survive a server restart.
    then:
      - Each request uses its own bound provider and model.
      - Selecting a model in one chat does not mutate another chat's binding.
      - Global recent models influence only a brand-new unbound chat.

  - id: S-2
    title: Useful execution is not capped by tool count
    given:
      - A runnable task requires more than eight tool interactions.
    when:
      - The agent continues making observable progress.
    then:
      - Tools remain available.
      - No maximum-steps message ends the turn.
      - Repeated no-progress state is surfaced as a diagnostic rather than a useful-work count.

  - id: S-3
    title: Compaction continues the same logical task
    given:
      - A bound task remains runnable when provider context compaction occurs.
    when:
      - Context is compacted and the assistant turn ends.
    then:
      - The compacted context retains the session model, plan, task, task generation, and original objective.
      - No visible synthetic user message is inserted.
      - Another internal turn is scheduled only if the task remains runnable.
      - Repeated compaction must monotonically reduce provider input or stop with a structured orchestration diagnostic.

  - id: S-4
    title: Media cannot cross chat or task boundaries
    given:
      - Historical pending media includes stale, malformed, test-fixture, or unrelated records.
    when:
      - OpenCode starts or a chat becomes idle.
    then:
      - Historical undelivered records are quarantined and never injected.
      - Tool output is never parsed into a synthetic media user prompt.
      - Future proof artifacts use structured task/run/commit/hash metadata and are rendered directly.

  - id: S-5
    title: Product agents cannot change the traffic controller
    given:
      - An ordinary product session attempts to read, edit, shell-write, or deploy a protected control-plane path.
    when:
      - The hook or sessions.py deploy gate evaluates the operation.
    then:
      - Mutation and deployment are rejected with one deterministic recovery action.
      - Read access to secret-bearing configuration is rejected.
      - A separately launched explicit control-plane-admin Codex workflow remains capable of reviewed changes.

  - id: S-6
    title: Deployed worktree state is truthful
    given:
      - A managed worktree deploys through an integration commit.
    when:
      - Deployment succeeds with or without edits made after its checkpoint.
    then:
      - With no later edits the worktree is clean at the deployed commit.
      - With later edits only the post-checkpoint delta remains on top of the deployed commit.
      - A recovery ref or backup preserves prior state.
      - Registry status cannot become merged unless the HEAD and patch invariant passes.

  - id: S-7
    title: Durable OpenMates tasks control continuation
    given:
      - An OpenCode chat is bound to an OpenMates Plan with ordered Tasks.
    when:
      - An assistant turn ends or a task changes state.
    then:
      - Exactly one runnable task is leased to the chat and progress writes are idempotent.
      - The scheduler resumes the chat while runnable work remains.
      - waiting_user, waiting_resource, blocked, completed, cancelled, and explicit user stop do not auto-resume.
      - Restart reconstructs scheduling from durable task state rather than in-memory hook state.

  - id: S-8
    title: Runtime deployment is atomic and recovery is staged
    given:
      - A tested release contains a binary, configuration, hook, sessions.py, startup scripts, and a hash manifest.
    when:
      - The release is activated and the server restarts.
    then:
      - All runtime components report the same release identity.
      - Stopped historical chats remain stopped.
      - Disposable sessions pass the recovery matrix before historical chats are resumed one at a time.

acceptance_criteria:
