    scenario: S-1
    text: Model selection is keyed by session and survives reload, continuation, compaction, and restart without cross-chat mutation.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-OPENCODE-MODELS, V-DISPOSABLE-SESSIONS]
  - id: AC-2
    scenario: S-2
    text: The deployed configuration and runtime impose no fixed primary-agent tool-step limit.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-OPENCODE-STEPS, V-RUNTIME-MANIFEST]
  - id: AC-3
    scenario: S-3
    text: Compaction preserves logical task identity and can continue runnable work without visible fake user messages or infinite overflow retries.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-TASK-BRIDGE, V-DISPOSABLE-SESSIONS]
  - id: AC-4
    scenario: S-4
    text: Automatic response-media prompt injection is disabled and all pre-recovery undelivered records are quarantined.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-MEDIA-HOTFIX, V-MEDIA-QUARANTINE]
  - id: AC-5
