tests:
  - id: T-OPENCODE-MODELS
    type: unit
    file: /home/superdev/opencode/packages/app/src/context/models.test.tsx
    command: bun test packages/app/src/context/models.test.tsx packages/app/src/context/local.test.tsx
    assertions:
      - model binding is stored by session ID
      - an existing session restores its own binding
      - a new session alone may use global recent/default fallback
    covers: [AC-1]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-OPENCODE-STEPS
    type: unit
    file: scripts/tests/test_opencode_runtime_config.py
    command: python3 -m pytest scripts/tests/test_opencode_runtime_config.py
    assertions:
      - no configured primary agent has a fixed steps value
      - the packaged runtime configuration matches the source contract
    covers: [AC-2]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-MEDIA-HOTFIX
    type: unit
    file: scripts/tests/test_opencode_hooks_contract.mjs
    command: node --test scripts/tests/test_opencode_hooks_contract.mjs
    assertions:
      - tool output cannot enqueue response media
      - idle sessions cannot claim or inject response media
      - direct structured proof metadata remains available without a synthetic user prompt
    covers: [AC-4]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CONTROL-PLANE-GUARD
    type: pytest
    file: scripts/tests/test_opencode_control_plane_guard.py
    command: python3 -m pytest scripts/tests/test_opencode_control_plane_guard.py && node --test scripts/tests/test_opencode_native_worktree_binding.mjs
    assertions:
      - ordinary sessions cannot deploy protected paths
      - hook-routed edit and shell mutation are blocked
      - control-plane-admin capability is explicit and narrowly scoped
      - secret-bearing paths cannot be read by ordinary routed tools
    covers: [AC-5]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-WORKTREE-INVARIANT
    type: pytest
    file: scripts/tests/test_sessions_native_worktree_lifecycle.py
    command: python3 -m pytest scripts/tests/test_sessions_native_worktree_lifecycle.py scripts/tests/test_sessions_worktree_cleanup.py
    assertions:
      - merged status requires the deployed HEAD and patch invariant
      - post-checkpoint edits are reapplied without copying the entire integrated tree as dirty state
      - active conflicting worktrees are preserved
    covers: [AC-6]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-TASK-BRIDGE
    type: pytest
    file: scripts/tests/test_opencode_task_bridge.py
    command: python3 -m pytest scripts/tests/test_opencode_task_bridge.py && node --test scripts/tests/test_opencode_task_bridge_hook.mjs
    assertions:
      - one runnable task is leased idempotently to one chat
      - turn completion resumes runnable work only
      - waiting, blocked, completed, cancelled, and user-stopped work does not resume
      - compaction retains plan, task, generation, objective, and model identity
      - restart reconstructs state from the OpenMates CLI contract
    covers: [AC-3, AC-7]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-RUNTIME-RELEASE
    type: pytest
    file: scripts/tests/test_opencode_runtime_release.py
    command: python3 -m pytest scripts/tests/test_opencode_runtime_release.py
    assertions:
      - release manifests hash every activated component
      - activation is atomic and rollback retains the previous release
      - startup rejects mixed component identities
    covers: [AC-8]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-SECRET-CONFIG
    type: pytest
    file: scripts/tests/test_opencode_secret_config.py
    command: python3 -m pytest scripts/tests/test_opencode_secret_config.py
    assertions:
      - tracked and runtime OpenCode configuration contain no credential literals
      - secret configuration permissions are owner-only
      - history scan reports only fingerprints and paths, never secret values
    covers: [AC-9]
    red_phase: {required: true, expected: fail_before_fix, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}

