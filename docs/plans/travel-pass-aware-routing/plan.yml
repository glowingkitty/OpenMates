schema_version: 2
id: travel-pass-aware-routing
title: Travel Pass Aware Routing
status: implementing
goal: 'Make travel.search_connections trustworthy for European train and public transport planning by separating priced providers
  from timetable-only routing, representing pass-aware fare semantics explicitly, and rendering those states consistently
  across backend, CLI, SDKs, web, and Apple clients.

  '
scope:
  in:
  - Pass-aware fare representation for saved results that record an owned transport pass.
  - A structured fare contract that distinguishes full prices, partial prices, pass-only coverage, unknown prices, and timetable-only
    results.
  - Direct REST/API, CLI, npm SDK, pip SDK, web embed, and Apple travel embed parity checks for the changed app-skill contract.
  out:
  - Selling tickets, issuing tickets, handling refunds, or becoming merchant of record.
  - Omio, Trainline, All Aboard, or other new commercial booking integrations.
  - Exact visual redesign of the travel cards beyond displaying the new fare and timetable states clearly.
context_discovery:
  github_issues: []
  docs:
  - docs/contributing/guides/spec-driven-development.md
  - docs/architecture/apps/travel-train-api-research.md
  - docs/plans/app-skill-processing-quality/plan.yml
  - docs/plans/sdk-cli-parity-v1/plan.yml
  - docs/plans/app-skill-content-embed-apple-parity/plan.yml
  - docs/user-guide/apps/travel.md
  - docs/user-guide/cli/apps-and-skills.md
  - docs/architecture/platforms/cli-package.md
  - docs/architecture/platforms/cli-feature-parity.md
  - apple/AGENTS.md
  code_patterns:
  - backend/apps/travel/skills/search_connections.py currently fans out to providers, merges normalized results, sorts them,
    and builds travel-connection child payloads.
  - backend/apps/travel/providers/base_provider.py defines ConnectionResult, LegResult, and SegmentResult but does not yet
    expose a structured fare object or segment fare coverage contract.
  - backend/apps/travel/app.yml is the public app-skill schema source for CLI and SDK generation.
  - frontend/packages/openmates-cli/src/cli.ts has a typed travel.search_connections route helper that only accepts origin,
    destination, date, and transport today.
  - frontend/packages/openmates-cli/src/embedRenderers.ts renders travel connection prices but not partial, pass-only, or
    timetable-only fare states.
  - frontend/packages/ui/src/components/embeds/travel/TravelSearchEmbedFullscreen.svelte and TravelConnectionEmbedFullscreen.svelte
    are the web source of truth for travel result cards.
  - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelSearchEmbedRenderer.swift and TravelConnectionEmbedRenderer.swift
    are native counterparts for the changed embed contract.
  tests:
  - backend/tests/test_travel_search_connections.py
  - backend/tests/test_travel_skill_constraints.py
  - frontend/packages/openmates-cli/tests/cli.test.ts
  - frontend/packages/openmates-cli/tests/embedRenderers.test.ts
  - packages/openmates-python/tests/test_sdk_generator.py
  - frontend/apps/web_app/tests/skill-travel-connections.spec.ts
  - frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts
  - apple/OpenMatesTests/AppleComposerRendererRegistryTests.swift
  - apple/OpenMatesTests/WatchEmbedPreviewTests.swift
apple_impact:
  affected_files:
  - apple/OpenMates/Sources/Core/Models/EmbedModels.swift
  - apple/OpenMates/Sources/DevPreview/DevEmbedPreviewFixtures.swift
  - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelSearchEmbedRenderer.swift
  - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelConnectionEmbedRenderer.swift
  - apple/OpenMates/Sources/Features/Embeds/Grouping/EmbedFullscreenContainer.swift
  - apple/OpenMatesTests/WatchEmbedPreviewTests.swift
  parity_expectations:
  - Apple travel search and travel connection renderers display priced, partial-fare, pass-only, and timetable-only states
    without falling back to generic rendering.
  - Apple continues to accept legacy travel connection payloads that only contain total_price and currency for persisted existing
    embeds.
  verification:
  - python3 scripts/apple_remote.py status
  - python3 scripts/apple_remote.py build-ios --simulator "iPhone 17"
  - A targeted Apple unit/UI test is preferred if a travel embed parity test already exists or is added during implementation.
  intentional_native_differences:
  - Apple may use native layout density, but the displayed fare semantics and provider labels must match the web source of
    truth.
clarification:
  rounds:
  - question: Should this continue as a full executable spec instead of more implementation?
    answer: The user asked to continue if there were next steps; discovery shows this is a Tier 2 app-skill/provider contract
      and no additional implementation should happen before approval.
  approved_by_user: true
