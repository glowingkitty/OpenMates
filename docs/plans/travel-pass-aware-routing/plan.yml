implementation_notes:
  plan_path: docs/plans/travel-pass-aware-routing/plan.yml
  existing_patterns:
    - backend/apps/travel/skills/search_connections.py provider fanout and grouped child embed response structure.
    - backend/apps/travel/providers/db_provider.py mapping from DB Navigator payloads into ConnectionResult.
    - frontend/packages/openmates-cli/src/embedRenderers.ts direct travel-connection text rendering.
    - frontend/packages/ui/src/components/embeds/travel/TravelSearchEmbedFullscreen.svelte and TravelConnectionEmbedFullscreen.svelte web renderer patterns.
    - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelConnectionEmbedRenderer.swift native travel embed renderer.
  architecture: >
    Extend the existing provider-normalized travel connection contract rather than
    creating a new app skill. Providers continue to return ConnectionResult-like
    objects, but fare semantics become explicit and Transitous results are marked
    as timetable-only. The app-skill schema remains the source of truth for CLI
    and SDK generation, while web and Apple renderers remain client-specific views
    over the same payload.
  data_flow:
    - User or SDK passes travel.search_connections request with legs, transport_methods, providers, owned_passes, optional pass_only, and optional rail_products.
    - Skill selects eligible providers and forwards pass/product constraints only to providers that support them.
    - DB wrapper calls app.services-bahn.de Vendo Navigator with Deutschlandticket and product fields when requested.
    - Transitous provider geocodes stops, plans via /api/v6/plan, and maps routes to timetable-only segments without fare or booking fields.
    - Skill normalizes provider results into fare-aware travel-connection child embeds and sorts without comparing timetable-only results as prices.
    - CLI, SDKs, web, and Apple render the same fare contract with legacy total_price/currency fallback.
  affected_files:
    - path: docs/plans/travel-pass-aware-routing/plan.yml
      reason: Executable product contract and work ledger.
    - path: docs/architecture/apps/travel-train-api-research.md
      reason: Provider research and operational constraints.
    - path: backend/shared/providers/deutsche_bahn.py
      reason: DB Navigator host, Deutschlandticket, product filters, and recon/detail wrapper behavior.
    - path: backend/apps/travel/providers/base_provider.py
      reason: Shared fare and segment coverage models.
    - path: backend/apps/travel/providers/db_provider.py
      reason: DB fare mapping and pass/product filter support.
    - path: backend/apps/travel/providers/transitous_provider.py
      reason: Transitous timetable-only implementation.
    - path: backend/apps/travel/providers/flix_provider.py
      reason: Provider interface compatibility with optional fare fields.
    - path: backend/apps/travel/skills/search_connections.py
      reason: Public app-skill request/response normalization, sorting, provider separation, and empty states.
    - path: backend/apps/travel/app.yml
      reason: Public app-skill schema, providers, and LLM/SDK metadata.
    - path: backend/tests/test_travel_search_connections.py
      reason: Backend contract tests for fare and Transitous behavior.
    - path: backend/tests/test_travel_skill_constraints.py
      reason: Schema and constraint regression coverage.
    - path: frontend/packages/openmates-cli/src/cli.ts
      reason: Typed CLI flags for pass/product/provider inputs.
    - path: frontend/packages/openmates-cli/src/embedRenderers.ts
      reason: CLI text rendering for partial/pass/timetable-only states.
    - path: frontend/packages/openmates-cli/tests/cli.test.ts
      reason: CLI input builder coverage.
    - path: frontend/packages/openmates-cli/tests/embedRenderers.test.ts
      reason: CLI render coverage.
    - path: packages/openmates-python/tests/test_sdk_generator.py
      reason: Python SDK generated metadata/types coverage.
    - path: frontend/packages/ui/src/components/embeds/travel/TravelSearchEmbedFullscreen.svelte
      reason: Web parent search result renderer.
    - path: frontend/packages/ui/src/components/embeds/travel/TravelConnectionEmbedPreview.svelte
      reason: Web child preview renderer.
    - path: frontend/packages/ui/src/components/embeds/travel/TravelConnectionEmbedFullscreen.svelte
      reason: Web child fullscreen renderer.
    - path: frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts
      reason: Live dev web verification.
    - path: apple/OpenMates/Sources/Core/Models/EmbedModels.swift
      reason: Apple travel connection content contract.
    - path: apple/OpenMates/Sources/DevPreview/DevEmbedPreviewFixtures.swift
      reason: Apple travel fixture coverage.
    - path: apple/OpenMates/Sources/Features/Embeds/Renderers/TravelSearchEmbedRenderer.swift
      reason: Apple search renderer parity.
    - path: apple/OpenMates/Sources/Features/Embeds/Renderers/TravelConnectionEmbedRenderer.swift
      reason: Apple connection renderer parity.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/travel-pass-aware-routing/plan.yml
    - Red backend pytest coverage before implementation.
    - Direct dev API proof against https://api.dev.openmates.org after backend deploy/restart.
    - Real CLI proof against https://api.dev.openmates.org before SDK proof.
    - Real npm and pip SDK calls against https://api.dev.openmates.org before web proof.
    - python3 scripts/audit_sdk_cli_parity.py when CLI or SDK metadata changes.
    - Deploy before Playwright green verification, then run python3 scripts/tests.py run --spec skill-travel-train-connections.spec.ts.
    - User confirmation for deployed web fare/timetable labels.
    - Apple remote status and build-ios after user confirmation when Apple files are affected.
  verification_order:
    - Direct REST/API app-skill contract against the dev server first, with access model, auth, credit budget, and encryption-boundary classification.
    - Real OpenMates CLI command against the dev server second.
    - npm SDK and pip SDK parity locally against the dev server third.
    - SDK/CLI parity audit and CI/daily-test wiring only after local REST/API, CLI, and SDK success.
    - Web implementation and Playwright against app.dev.openmates.org fourth, after deploy.
    - User confirmation fifth for the deployed web result wording and visual clarity.
    - Apple remote build/test last because travel embeds have native counterparts.

