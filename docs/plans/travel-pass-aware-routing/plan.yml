    - apple/OpenMates/Sources/Features/Embeds/Grouping/EmbedFullscreenContainer.swift
    - apple/OpenMatesTests/WatchEmbedPreviewTests.swift
  parity_expectations:
    - Apple travel search and travel connection renderers display priced, partial-fare, pass-only, and timetable-only states without falling back to generic rendering.
    - Apple fixtures include at least one partial Deutschlandticket fare and one timetable-only Transitous result.
    - Apple continues to accept legacy travel connection payloads that only contain total_price and currency for persisted existing embeds.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios --simulator "iPhone 17"
    - A targeted Apple unit/UI test is preferred if a travel embed parity test already exists or is added during implementation.
  intentional_native_differences:
    - Apple may use native layout density, but the displayed fare semantics and provider labels must match the web source of truth.

clarification:
  rounds:
    - question: Should this continue as a full executable spec instead of more implementation?
      answer: The user asked to continue if there were next steps; discovery shows this is a Tier 2 app-skill/provider contract and no additional implementation should happen before approval.
  vision_summary: >
    The first approved slice should make train results honest: DB and Flix remain
    the priced/bookable sources, Deutsche Bahn can account for a Deutschlandticket,
    and Transitous is clearly timetable-only. Users should see whether a fare is
    a full price, a partial paid portion after pass coverage, a pass-only route,
    or unknown, and every client should render that distinction without claiming
    that timetable-only data is cheap or bookable.
  approved_by_user: true

