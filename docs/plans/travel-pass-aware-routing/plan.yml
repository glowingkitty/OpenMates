decisions:
  - id: D-1
    status: active
    decision: Use Deutsche Bahn and Flix as priced transport providers, and Transitous only as timetable routing data for this spec.
    reason: Live research found DB and Flix provide usable prices, while Transitous withFares returned no usable amount, currency, or booking data in sampled routes.
    decided_at: "2026-07-29"
  - id: D-2
    status: active
    decision: Add a structured fare object while preserving total_price and currency for existing renderers and persisted embeds.
    reason: Persisted travel embeds and current CLI, web, and Apple renderers already read total_price/currency, but the old fields cannot express partial or pass-only fares safely.
    decided_at: "2026-07-29"
  - id: D-3
    status: active
    decision: Do not compose DB, Flix, and Transitous segments into synthetic mixed-provider itineraries in this slice.
    reason: Mixed-provider composition changes booking, liability, sorting, and user trust boundaries and needs a separate approved planner contract.
    decided_at: "2026-07-29"
  - id: D-4
    status: active
    decision: Expose OpenMates rail product filters instead of raw DB Navigator enum names.
    reason: Sampled short DB product names returned HTTP 400; keeping internal DB enum names out of public schemas gives OpenMates a stable contract if DB changes again.
    decided_at: "2026-07-29"
  - id: D-5
    status: active
    decision: Keep Transitous opt-in through providers transitous for the first implementation slice.
    reason: Transitous has public usage-policy constraints and no usable sampled fare data, so default train searches should not create extra public API load until production usage is settled.
    decided_at: "2026-07-29"

scenarios:
  - id: S-1
    title: Deutschlandticket partial fare is explicit
    given:
      - Alice owns a Deutschlandticket.
      - Alice asks for a train from Potsdam Hbf to Munich Hbf on a specific date.
      - The DB route includes a pass-covered local leg and a paid long-distance leg.
    when:
      - travel.search_connections searches Deutsche Bahn with owned_passes containing deutschland_ticket.
    then:
      - The DB request sets the Deutschlandticket-present flag for DB Navigator.
      - The returned result keeps the DB quoted paid amount as total_price for compatibility.
      - The returned result includes fare.is_partial true, fare.covered_by_passes containing deutschland_ticket, and a user-visible fare summary that says the price is only the paid portion.
      - The result is still sortable among priced DB/Flix results because the paid amount is a confirmed DB quote.

  - id: S-2
    title: Deutschlandticket-only route is pass-only, not zero euros
    given:
      - Alice owns a Deutschlandticket.
      - Alice asks for a route that should be usable only with regional transport covered by the pass.
    when:
      - travel.search_connections is asked for pass-only routing.
    then:
      - The DB request uses the DB Navigator Deutschlandticket-only route flag.
      - A route with no DB price is represented as fare.is_pass_only true and fare.amount null.
      - total_price remains null rather than 0.00.
      - The renderer says the trip is covered by the pass or has no additional DB fare, without calling it free unless the provider explicitly says so.

  - id: S-3
    title: Transitous route is timetable-only
    given:
      - Alice asks for public transport from Berlin Hbf to Paris Gare de l'Est.
      - Transitous returns a multimodal timetable with no usable fare products.
    when:
      - travel.search_connections searches Transitous.
    then:
      - The provider uses api.transitous.org/api with an application-specific User-Agent, /api/v1/geocode, and /api/v6/plan.
      - The result includes segment mode, line, operator, source_provider, and timetable source metadata.
      - The result includes fare.confidence timetable_only and no total_price, booking_url, or booking_token.
      - Price sorting and cheapest claims ignore the Transitous timetable-only result.

  - id: S-4
    title: Ambiguous station resolution is handled before planning
    given:
      - Transitous geocoding returns multiple candidates for a station name, including candidates in different countries or with weak type matches.
    when:
      - The Transitous provider resolves origin, destination, or via stops.
    then:
      - The provider prioritizes STOP results matching the requested name, country/place context, and requested mode before lower-confidence matches.
      - A low-confidence or conflicting match does not silently produce a route from the wrong city.
      - The result group returns an actionable resolution error or suggestion when the station cannot be resolved confidently.

  - id: S-5
    title: DB rail product filters use stable OpenMates values
    given:
      - Alice asks for a high-speed-only train from Berlin to Munich.
    when:
      - travel.search_connections receives rail_products containing high_speed.
    then:
      - The app-skill schema accepts high_speed instead of raw DB enum strings.
      - The DB provider maps high_speed to the current DB Navigator product enum.
      - Invalid rail_products values fail validation or are ignored with a clear no-result/error explanation, not a DB HTTP 400 leak.

  - id: S-6
    title: Cross-client renderers preserve fare meaning
    given:
      - The backend returns a mix of full-price DB/Flix results, a partial Deutschlandticket DB result, a pass-only DB result, and a Transitous timetable-only result.
    when:
      - The results are rendered in CLI, npm SDK output types, pip SDK output types, web embeds, and Apple embeds.
    then:
      - Each client exposes or displays the fare object fields and legacy total_price/currency consistently.
      - Partial fares and pass-only fares are labeled in concise user language.
      - Timetable-only Transitous results are not shown as bookable or cheapest.
      - Existing persisted travel embeds without fare still render with the legacy price fields.

