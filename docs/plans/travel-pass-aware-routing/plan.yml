schema_version: 2
id: travel-pass-aware-routing
title: Travel Pass Aware Routing
status: implementing

goal: >
  Make travel.search_connections trustworthy for European train and public
  transport planning by separating priced providers from timetable-only routing,
  representing pass-aware fare semantics explicitly, and rendering those states
  consistently across backend, CLI, SDKs, web, and Apple clients.

scope:
  in:
    - Pass-aware Deutsche Bahn train pricing for users who own a Deutschlandticket.
    - A structured fare contract that distinguishes full prices, partial prices, pass-only coverage, unknown prices, and timetable-only results.
    - DB rail product filters using stable OpenMates names mapped to current DB Navigator enum values.
    - Transitous/MOTIS as a timetable-only provider using the current geocode and plan APIs, with no price sorting or booking claims.
    - Provider separation so DB/Flix priced results and Transitous timetable-only results remain distinct until a future split-provider composition layer exists.
    - Direct REST/API, CLI, npm SDK, pip SDK, web embed, and Apple travel embed parity checks for the changed app-skill contract.
  out:
    - Selling tickets, issuing tickets, handling refunds, or becoming merchant of record.
    - Omio, Trainline, All Aboard, or other new commercial booking integrations.
    - Split-provider itinerary composition such as combining DB paid rail legs with Transitous local feeder legs into one synthetic itinerary.
    - Treating Transitous fare fields as confirmed prices unless future evidence shows usable amount, currency, and booking data.
    - High-volume production Transitous usage before contact with Transitous maintainers or a self-hosting decision.
    - Exact visual redesign of the travel cards beyond displaying the new fare and timetable states clearly.

context_discovery:
  github_issues:
    - "GitHub MCP was unavailable with bad credentials. Fallback `gh issue list --repo glowingkitty/OpenMates --search \"travel train deutschlandticket Transitous DB\" --state all --limit 20 --json number,title,state,labels,url` returned no matching issues."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/apps/travel-train-api-research.md
    - docs/architecture/apps/travel-flix-api-research.md
    - docs/plans/app-skill-processing-quality/plan.yml
    - docs/plans/sdk-cli-parity-v1/plan.yml
    - docs/plans/app-skill-content-embed-apple-parity/plan.yml
    - docs/user-guide/apps/travel.md
    - docs/user-guide/cli/apps-and-skills.md
    - docs/architecture/platforms/cli-package.md
    - docs/architecture/platforms/cli-feature-parity.md
    - apple/AGENTS.md
  code_patterns:
    - backend/apps/travel/skills/search_connections.py currently fans out to providers, merges normalized results, sorts them, and builds travel-connection child payloads.
    - backend/apps/travel/providers/base_provider.py defines ConnectionResult, LegResult, and SegmentResult but does not yet expose a structured fare object or segment fare coverage contract.
    - backend/apps/travel/providers/db_provider.py maps DB Navigator results to travel-connection payloads and is the right place for DB pass-aware fare semantics.
    - backend/shared/providers/deutsche_bahn.py owns the Vendo Navigator API wrapper and should use app.services-bahn.de plus DB Navigator request fields.
    - backend/apps/travel/providers/transitous_provider.py is a stub and still references the stale /api/v3/plan endpoint.
    - backend/apps/travel/app.yml is the public app-skill schema source for CLI and SDK generation.
    - frontend/packages/openmates-cli/src/cli.ts has a typed travel.search_connections route helper that only accepts origin, destination, date, and transport today.
    - frontend/packages/openmates-cli/src/embedRenderers.ts renders travel connection prices but not partial, pass-only, or timetable-only fare states.
    - frontend/packages/ui/src/components/embeds/travel/TravelSearchEmbedFullscreen.svelte and TravelConnectionEmbedFullscreen.svelte are the web source of truth for travel result cards.
    - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelSearchEmbedRenderer.swift and TravelConnectionEmbedRenderer.swift are native counterparts for the changed embed contract.
  tests:
    - backend/tests/test_travel_search_connections.py
    - backend/tests/test_travel_skill_constraints.py
    - backend/tests/test_flix_provider.py
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/packages/openmates-cli/tests/embedRenderers.test.ts
    - packages/openmates-python/tests/test_sdk_generator.py
    - frontend/apps/web_app/tests/skill-travel-connections.spec.ts
    - frontend/apps/web_app/tests/skill-travel-train-connections.spec.ts
    - apple/OpenMatesTests/AppleComposerRendererRegistryTests.swift
    - apple/OpenMatesTests/WatchEmbedPreviewTests.swift

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Core/Models/EmbedModels.swift
    - apple/OpenMates/Sources/DevPreview/DevEmbedPreviewFixtures.swift
    - apple/OpenMates/Sources/Features/Embeds/Renderers/TravelSearchEmbedRenderer.swift
