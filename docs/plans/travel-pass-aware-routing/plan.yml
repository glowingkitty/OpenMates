assumptions:
- id: A-3
  text: The travel app skill does not accept or return client-side encrypted chat, memory, file, key, sync, or share material.
  category: privacy
  required_before: implementation
  status: confirmed
  evidence:
  - source: backend/apps/travel/app.yml
    summary: travel.search_connections takes plaintext route/date/provider parameters and returns provider-derived travel
      result metadata.
contracts:
  api:
  - surface: Existing app-skill execution through chat, first-party app clients, CLI, and SDK app-skill methods.
    access_model: First-party client surface for session-authenticated web/CLI/native clients; developer API-key surface for
      generated SDK methods where existing SDK app-skill access is approved.
    auth: Existing session auth or approved API-key auth depending on caller.
    rate_limits: Existing app-skill and API-key rate limits; no new public unauthenticated route.
    credit_budget: search_connections remains 25 credits per search unless a later billing spec changes it.
    encryption_boundary: Route search inputs and provider results are plaintext app-skill data, not client-side encrypted
      chat/key/sync/share material.
  request:
  - field: owned_passes
    type: string array
    values:
    - deutschland_ticket
    behavior: Enables provider-supported pass-aware pricing; aliases normalize to deutschland_ticket internally.
  - field: pass_only
    type: boolean
    default: false
    behavior: Records pass-only travel; stored results clearly distinguish any uncovered portions.
  - field: rail_products
    type: string array
    values:
    - high_speed
    - intercity
    - regional_express
    - regional
    - s_bahn
    - subway
    - tram
    - bus
    - ferry
  response:
  - field: fare
    shape:
      amount: number or null
      currency: ISO 4217 string or null
      is_partial: boolean
      is_pass_only: boolean
      covered_by_passes: string array
      pricing_provider: provider id or null
      confidence: confirmed | partial | pass_only | timetable_only | unknown
      summary: string
    compatibility: total_price and currency remain present for confirmed/partial priced results and null for pass-only/timetable-only
      results.
  - field: legs[].segments[]
    additions:
      mode: train | bus | tram | subway | ferry | walk | bike | airplane | unknown
      line: public line or train number when available
      operator: operator name when available
      source_provider: provider id
      fare_coverage: paid | pass_covered | timetable_only | unknown
  sorting:
  - price_asc and price_desc only compare confirmed or partial fare amounts.
  - Timetable-only, unknown-price, and pass-only results are grouped or ranked after priced results unless the user explicitly
    asks for pass-only routing or timetable coverage.
  - User-visible cheapest language must use only confirmed or partial priced providers.
  provider_boundaries: []
