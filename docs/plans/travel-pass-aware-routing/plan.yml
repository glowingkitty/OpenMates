decisions:
- id: D-2
  status: active
  decision: Add a structured fare object while preserving total_price and currency for existing renderers and persisted embeds.
  reason: Persisted travel embeds and current CLI, web, and Apple renderers already read total_price/currency, but the old
    fields cannot express partial or pass-only fares safely.
  decided_at: '2026-07-29'
- id: D-3
  status: active
  reason: Mixed-provider composition changes booking, liability, sorting, and user trust boundaries and needs a separate approved
    planner contract.
  decided_at: '2026-07-29'
  decision: Do not compose synthetic mixed-source itineraries within this slice.
- id: D-4
  status: active
  reason: Sampled short DB product names returned HTTP 400; keeping internal DB enum names out of public schemas gives OpenMates
    a stable contract if DB changes again.
  decided_at: '2026-07-29'
  decision: Expose stable OpenMates rail-product filters rather than upstream-specific enum names.
scenarios:
- id: S-1
  title: Deutschlandticket partial fare is explicit
  given:
  - Alice owns a Deutschlandticket.
  - Alice asks for a train from Potsdam Hbf to Munich Hbf on a specific date.
  - The DB route includes a pass-covered local leg and a paid long-distance leg.
  when:
  - The connection payload is normalized with owned_passes containing deutschland_ticket.
  then:
  - The returned result keeps the DB quoted paid amount as total_price for compatibility.
  - The returned result includes fare.is_partial true, fare.covered_by_passes containing deutschland_ticket, and a user-visible
    fare summary that says the price is only the paid portion.
- id: S-2
  title: Deutschlandticket-only route is pass-only, not zero euros
  given:
  - Alice owns a Deutschlandticket.
  - Alice asks for a route that should be usable only with regional transport covered by the pass.
  when:
  - travel.search_connections is asked for pass-only routing.
  then:
  - A route with no DB price is represented as fare.is_pass_only true and fare.amount null.
  - total_price remains null rather than 0.00.
  - The renderer says the trip is covered by the pass or has no additional DB fare, without calling it free unless the provider
    explicitly says so.
- id: S-5
  title: DB rail product filters use stable OpenMates values
  given:
  - Alice asks for a high-speed-only train from Berlin to Munich.
  when:
  - travel.search_connections receives rail_products containing high_speed.
  then:
  - The app-skill schema accepts high_speed instead of raw DB enum strings.
  - Invalid rail_products values fail validation or are ignored with a clear no-result/error explanation, not a DB HTTP 400
    leak.
- id: S-6
  title: Cross-client renderers preserve fare meaning
  when:
  - The results are rendered in CLI, npm SDK output types, pip SDK output types, web embeds, and Apple embeds.
  then:
  - Each client exposes or displays the fare object fields and legacy total_price/currency consistently.
  - Partial fares and pass-only fares are labeled in concise user language.
  - Existing persisted travel embeds without fare still render with the legacy price fields.
  given:
  - Saved connection payloads include full-price, partial-pass, pass-only, timetable-only, and legacy fare representations.
