schema_version: 2
id: web-composer-search-performance
title: Responsive web composer and live search
status: verified
goal: >-
  Keep message-input typing responsive and reliable while preserving live search
  across chats, messages, embeds, and uploaded files.

authorization:
  current_request: User explicitly requested implementation, testing, and dev deployment.
  task_creation: Linked Task creation was attempted before editing, but the global CLI is logged out; no Task was acknowledged.
  workspace: agent-b4e4

scope:
  in:
    - Cancel obsolete suggestion searches and prevent stale results from publishing.
    - Reuse bounded, privacy-preserving in-memory indexes instead of repeatedly decrypting unchanged uploaded files.
    - Keep full search coverage and refresh results as indexes warm or records change.
    - Remove redundant per-input document scans and schedule composer parsing from the actual transaction change.
    - Make write-mode table recognition linear and add typing/search performance regression coverage.
  out:
    - Search ranking or matching semantics changes.
    - Persisting decrypted search material.
    - Production deployment or Apple client changes.

scenarios:
  - id: S-1
    title: Rapid typing while live search remains enabled
    given: [The composer is focused and chat and file search data are available.]
    when: [The user types or edits faster than a prior search can finish.]
    then: [Typing remains responsive, obsolete work is cancelled, and only current-query results appear.]
  - id: S-2
    title: Long draft with structured content
    given: [The composer contains a long draft, including tables or a trailing delimiter.]
    when: [The user edits text at any cursor position.]
    then: [Only the changed transaction controls immediate parsing and table recognition is linear.]

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Rapid query changes abort obsolete chat and file search work, never publish stale results, and warm file searches reuse indexed metadata without rereading or decrypting unchanged entries.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-SEARCH, T-E2E-SEARCH]
  - id: AC-2
    scenario: S-2
    text: Editing before a trailing delimiter does not force synchronous parsing, draft preview calculation is not repeated by the normal input event, and table scanning remains linear.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-COMPOSER, T-E2E-COMPOSER]

