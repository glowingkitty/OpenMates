    covers: [AC-1]
    assertions: [Cancellation stops obsolete work and unchanged uploaded-file metadata is reused.]
    red_phase: {required: false, expected: fail, evidence: {status: skipped, reason: Source inspection and retained local probes already establish repeated work.}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, result: 4 focused search and uploaded-file index tests passed., command: node vitest.mjs run --config frontend/packages/ui/vitest.config.ts searchService.test.ts uploadedFileSearchPerformance.test.ts, run_id: local-vitest-search-20260920, subject_commit: ac0cbfe7826e802407fa1ba19fafbb530bd6de24, timestamp: '2026-09-20T10:38:14Z'}}
