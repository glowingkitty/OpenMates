    target: frontend/apps/web_app/tests/workflows-input.spec.ts
    execution_environment: isolated_github_ci
    covers: [AC-4, AC-9]
    assertions: [Dirty-state choice, change summary, node highlighting, enabled state, persistent undo, and a later-edit conflict work.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-VOICE
    type: playwright
    file: frontend/apps/web_app/tests/workflows-input.spec.ts
    command: isolated GitHub CI
    target: frontend/apps/web_app/tests/workflows-input.spec.ts
    execution_environment: isolated_github_ci
    covers: [AC-5]
    assertions: [Recording preview, correction auto-submit, and raw transcript review on correction failure work.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CHAT
    type: pytest
    file: backend/tests/test_workflow_chat_authoring.py
    command: pytest backend/tests/test_workflow_chat_authoring.py
    covers: [AC-6]
    assertions: [Clear chat requests load scoped authoring context and save through the validated batch service; clarification uses the focus mode and activation guidance.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-PLANNER
    type: pytest
    file: backend/tests/test_workflow_ai_authoring.py
    command: pytest backend/tests/test_workflow_ai_authoring.py
    covers: [AC-7, AC-8]
    assertions: [Jev and fallback decisions normalize to one contract, exact timezones and tomorrow dates compile correctly, and invalid or semantically wrong graphs are rejected.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}

