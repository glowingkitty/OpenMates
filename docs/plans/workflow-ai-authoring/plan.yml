    target: frontend/apps/web_app/tests/workflows-input.spec.ts
    execution_environment: isolated_github_ci
    covers: [AC-5]
    assertions: [Recording preview, correction auto-submit, and raw transcript review on correction failure work.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CHAT
    type: pytest
    file: backend/tests/test_workflow_chat_authoring_context.py
    related_files: [backend/tests/test_workflow_app_skill_embeds.py]
    command: pytest backend/tests/test_workflow_chat_authoring_context.py backend/tests/test_workflow_app_skill_embeds.py
    covers: [AC-6]
    assertions: [Clear chat requests load scoped authoring context and use the validated batch service; clarification uses the focus mode, activation guidance, and a partial-save notice when authoring stops.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-PLANNER
    type: pytest
    file: backend/tests/test_workflow_registry_planner.py
    related_files: [backend/tests/test_workflow_authoring_compiler.py, backend/tests/test_workflow_gemini_authoring.py, backend/tests/test_workflow_authoring_preselection.py]
    command: pytest backend/tests/test_workflow_registry_planner.py backend/tests/test_workflow_authoring_compiler.py backend/tests/test_workflow_gemini_authoring.py backend/tests/test_workflow_authoring_preselection.py
    covers: [AC-7, AC-8, AC-11]
    assertions: [App-first versus direct Jev skill selection is compared; the outage path feeds the same compact contract; each complete node is validated before streaming, invalid nodes get one correction, typed references and dates compile, and completed invalid graphs are rejected before acknowledgement.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}

