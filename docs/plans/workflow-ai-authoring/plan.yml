open_questions:
  - Final Jev versus LLM partition and benchmark acceptance thresholds.
  - Which workflow authoring facts chat loads automatically, and how the selected app capability schemas are retrieved.
  - Clarification-mode completion behavior and the point at which chat may create workflows.
  - The allowed assumptions for missing required details and the threshold for clarification.
  - Batch size, mixed create/update requests, undo scope, and highlight lifetime.
