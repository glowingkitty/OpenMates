remaining_engineering_decisions:
  - Set recipe coverage, Jev confidence gates, provider fallback order, batch-size cap, and latency/cost targets from the repeatable evaluation corpus.
  - Define the database transaction and encrypted-payload staging mechanism without exposing partial batches.
  - Keep change highlighting visible until the user dismisses the summary or another edit supersedes it; verify this behavior in UI tests.
