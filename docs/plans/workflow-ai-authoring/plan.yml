schema_version: 2
id: workflow-ai-authoring
title: AI workflow creation and editing from the web workspace
status: approved
approved_by_user: true
goal: >-
  Let users describe one or multiple workflows in the Workflows workspace, by
  typing or recording speech, and have AI create valid workflows or edit existing
  ones reliably. Clarify requests only when Jev finds the instruction unclear.
  Make AI edits visible and easy to undo.

scope:
  in:
    - Create one or multiple workflows from the workspace composer, or update an existing workflow from the workspace or its open editor.
    - Reuse live audio transcription and automatically submit final workflow transcripts directly to authoring; leave available text for review or show recovery when transcription fails.
    - Validate each generated node deterministically before showing it; fully completed requests commit atomically, while Stop or a twice-invalid node retains the valid prefix.
    - Show new workflows on the landing page and show changed or removed nodes for edits.
    - Route requests needing clarification into a new chat with the workflows.clarify_workflows focus mode.
    - Let ordinary chat requests load scoped workflow authoring context and create valid workflows directly; use the clarification focus only when discussion is needed.
    - Select registered app skills and create, update, and control modes with Jev; author a compact semantic plan with Gemini 3.8 Flash and compile it into V2 from registered contracts.
    - Stream validated complete nodes as Gemini builds them, with Stop and one correction attempt per invalid node; save a partial prefix disabled with no automatic execution when generation stops.
  out:
    - Executing or enabling a newly generated workflow without a separate user action.
    - Arbitrary code nodes or capabilities unavailable to the current user.
    - Production deployment as part of this planning pass.

current_state:
  frontend: >-
    Revision 15b507d is deployed to dev and Vercel. Workflow-only pending clarification survives root startup and SPA navigation and is consumed once. Raw workflow transcripts auto-submit without separate correction; failed transcription preserves available text or shows recording recovery. Five focused browser/REST/CLI cases passed (runs 36805982863, 36804241207 and 36804247471). Revision 607cd834 introduced the immediate streaming shell. A local empty fullscreen shell opens synchronously on Send before Jev, Gemini or the first header. Processing appears above the graph; validated metadata and nodes update the inert shell with the fixed shared composer. Known multi-workflow batches return to the workspace. Focused stream CI run 36789254173 passed the equivalent immutable candidate. The one real dev browser creation remains blocked before inference by two-factor rejection on configured test accounts, with matching clocks and credential hashes.
  backend: >-
    Registry-based Jev selection, Gemini 3.8 Flash flat records, deterministic V2 validation, correction, Stop/disabled partial saves, atomic completed batches and guarded Undo are deployed. Revision 607cd834 fixes false conditional selection for filters/comparisons and requires explicit authored clock fields. Six varied CLI cases plus two targeted reruns have recorded exact instructions and summaries; all disposable workflows were removed. Revision 15b507d also aligns manual V2 branch saves with authoring dependency validation and replaces empty in-memory chat search with owner-scoped persisted exact-ID lookup plus sanitized selected graph context. Its live clarification check resolved the original in one search, asked one question and ran no future action skill; original remained unchanged with no copy. Revision 127f161f adds catalog-priced idempotent authoring billing and EUR marketplace guidance. One real CLI proof passed correct Friday/EUR structure, 13-credit wallet debit and two Billing history entries; UUID replay returned the same workflow without more inference/charges. Billing settings CI run 36796094385 passed one case.
  capability_contract: >-
    Forty registered executable skill contracts were examined; the focused live corpus exercises web, shopping, nutrition, news, weather, events and AI transformation. Four initial requests matched intent. The corrected weather comparison matched intent after one invalid-JSON retry. The final shopping proof on 127f161f preserved Friday 18:00 UTC and EUR country de/max_price 150 in one Gemini attempt. Earlier direct/staged Jev comparison and failures remain historical evidence in the comparison document; this small corpus does not establish all-capability reliability.
  verification: >-
    The immediate fullscreen focused browser testcase passed in isolated CI at a94a685b (run 36789254173), with product source deployed as 607cd834. Authoring/provider, planner, shopping and billing checks passed; normal 127f161f deployment gates passed lint, translations, privacy audits and ten affected pytest files. Billing settings CI run 36796094385 and the live 13-credit debit/history/idempotent replay proof passed. No real browser AI timing exists because authentication failed before the authoring request. Revision 15b507d deployment gates passed six affected pytest files, lint, locale and registry validation. The three final focused CI jobs passed five cases with no skips or flakes. Live clarification passed exact target, focus, one question, no execution/copy and cleanup checks (21.688 seconds, 45 credits). Its harness spelling mismatch was corrected and existing evidence rechecked without more inference. Actual ASR recognition, live browser AI timing, live interrupted-model edits and chat completion after clarification remain unmeasured.
  reuse:
    - Chat audio already provides streamed transcription and correction.
    - Workflow definition versions and workflow-input mutations provide the basis for the implemented version-guarded batch undo; final integrated coverage verifies complete metadata restoration and protection of later manual edits.
    - Focus mentions already support explicit @focus:app:id activation.

confirmed_decisions:
  - A fully completed multi-workflow request commits atomically. Jev routes an unclear or confusing request to clarification before generation; Stop or a twice-invalid generated node instead retains the validated prefix as a disabled partial result.
  - A short complete instruction creates a ready disabled workflow through the natural-language authoring path. A short incomplete instruction creates a persisted disabled blank workflow with the exact request as its title and opens its editor. Only Jev-unclear or confusing requests go to clarification chat before generation; model errors in clear requests use partial-result recovery.
  - When a schedule omits its time, use 09:00 in the browser timezone or the explicitly requested timezone. When a weekly schedule omits its day, use Monday. Show these assumptions to the user.
  - Use Jev to select relevant registered app skills and create, update, and control modes, either directly or through app-first parallel per-app skill selection. Compare those routes for quality, latency, and cost without requiring app-first as the default. Gemini 3.8 Flash authors the compact semantic plan, including metadata, typed references, checks, branches, and information text. The backend compiler maps it to V2.
  - Only on a Jev outage, let the regular Gemini 3.8 Flash authoring call make the same preselection and produce the same compact contract. Apply identical backend validation without a speculative extra fallback chain.
  - Show a queued save state while the encrypted, durable plan is committed; use Dragonfly for a short-lived status cache and replay queued plans after worker loss. A workflow is shown as created only after the commit succeeds.
  - Stream only complete nodes after deterministic per-node validation, so the user can Stop before the full request finishes. Retry an invalid node once with correction feedback. If it remains invalid, stop generation, save the valid prefix disabled with no automatic execution, and show a concrete recovery notice. Full successful batches still require whole-graph validation and an encrypted durable queue write before confirmation.
  - A partial edit saves to the original Workflow ID, retains existing nodes not yet reached, disables the Workflow, and never creates a copy. Guarded Undo restores the whole prior state, including enabled state, unless a newer revision conflicts. A fully successful edit still preserves enabled state unless the user requests a change.
  - Save newly generated workflows disabled; save edits immediately while preserving their enabled state.
  - Prompt to save or discard unsaved manual edits before sending an AI edit.
  - After the raw-versus-clean instruction checks pass, bypass separate workflow transcript correction and auto-submit the final transcript. If transcription fails, preserve available text for review or show a recording retry message. Ordinary chat correction keeps its existing behavior.
  - On create submission, immediately open a local provisional full-screen workflow shell before Jev or Gemini replies, with a processing container above the first node. Update title and description, then show each backend-validated node as it arrives. If Jev identifies multiple workflows, switch to the workspace batch view; show New pills after commit. The provisional shell creates no saved empty workflow, copy, or fake workflow ID. A real workflow is confirmed only after durable commit.
  - Show workflow information text above nodes and keep one shared composer, including audio, fixed at the bottom of the landing page and open editor.
  - Clarification opens a new chat and auto-sends the exact request prefixed with an @ mention for workflows.clarify_workflows.
  - List removed nodes above the graph; highlight added and edited nodes in place.
  - Provide a simple guarded Undo AI changes button. Undo the whole AI batch only when every member is still at its AI-created version; preserve later manual edits and offer version history on conflict.
  - Generate title, description, and icon in the Gemini 3.8 Flash compact plan for every new workflow; choose the icon from the allowed catalog and supply the required valid category when saving.
  - Load workflow authoring knowledge for clear workflow-creation requests in chat, with selective capability context rather than an unbounded static prompt.
  - In ordinary chat, preload selected capability schemas and the graph contract for a clear workflow request; activate workflows.clarify_workflows only when discussion is needed. The workspace handoff activates that mode explicitly.
  - Default an unspecified schedule timezone to the user's browser IANA timezone; select an explicitly named timezone such as Berlin time, San Francisco time, or UTC from the instruction.
  - After a clarification chat has gathered enough detail, auto-save valid new workflows disabled and tell the user they must activate them; save valid edits immediately with their current enabled state and an Undo action.
  - Allow one request to mix new workflows and edits. Plan and validate independent targets concurrently and serialize operations that touch the same workflow. Commit a fully successful batch all or none; interruption may save only the validated partial prefix under the separate disabled-partial rule.
  - Use Jev first to select relevant apps and identify whether exact conditions or AI evaluation are required; evaluate parallel per-app skill selection against direct skill selection for quality, latency, and cost.
  - Do not restrict authoring to predefined workflow recipes. Derive node, field, reference and branch choices from registered executable contracts and the user instruction.
  - Keep the seven-request generic-constructor benchmark as historical evidence. Its Jev and LLM construction timings use different validation boundaries, so they do not compare end-to-end latency or select the production constructor.

architecture_draft:
  - Consolidate the workflow-input and workspace-ask planner contracts around one canonical V2 graph and per-user capability snapshot.
  - Build a shared registry-derived preselector and compact semantic plan contract. Compare app-first Jev selection followed by parallel per-app skill selection with direct skill selection; Gemini 3.8 Flash authors nodes, metadata, typed output references, values, and branches. The backend compiler emits canonical V2 and rejects invented capabilities. No predefined recipe list limits authoring.
  - Benchmark staged Jev country-to-city choices against direct extraction and the existing geocoder. Use a second Jev wave only when it improves ambiguous-location accuracy; send out-of-list choices through the fallback resolver rather than silently selecting a nearby city.
  - Pass the browser IANA timezone into the authoring request. Let Jev select an explicitly named timezone from bounded canonical IANA or UTC candidates, resolve aliases deterministically, and record the chosen zone in the generated schedule and visible summary.
  - Validate the implemented tomorrow runtime date values through the generic compiler; require semantic checks in addition to graph validity, so a today forecast cannot silently satisfy a tomorrow request.
  - Feed selected capabilities and output grammar to Gemini 3.8 Flash. Validate each complete node deterministically before streaming it to the client; allow Stop. Retry one invalid node with correction feedback, then retain the validated prefix disabled with no automatic execution and a concrete recovery notice if correction fails. Run final semantic, capability, typed-reference, and V2 readiness checks for a fully completed batch before acknowledgement.
  - On a Jev outage, let that same Gemini 3.8 Flash call select from the registry snapshot and author the same compact contract. Apply the same compiler and validation; strict JSON syntax alone does not establish semantic correctness.
  - Bound per-request Jev waves and concurrency; handle 429/Retry-After with a fallback. OpenRouter publishes provider-passthrough limits for paid keys but no fixed Jev requests-per-second value, so measure sustained throughput before setting production concurrency.
  - Use a seven-request test set spanning single and multiple creations, edits, mixed batches, controls, dates, typed references, free text, and ambiguity. Measure full validation and queue acknowledgement in consistent stage timing boundaries; compare quality, fallback frequency, and cost without treating the earlier asymmetric benchmark as end-to-end latency.
  - Produce a structured batch plan with create or update operations; Jev sends only unclear or confusing requests to clarification before generation. Validate all targets, ownership, capability bindings, graph readiness, and idempotency before confirming a fully completed request. Stage the encrypted plan durably before acknowledgement. Persist full batches atomically; for Stop or twice-invalid generation, persist only validated partial state disabled with no automatic execution, updating an edited Workflow in place without a copy and preserving unreached nodes.
  - Store complete before/after snapshots and stable node IDs for a durable undo; compare each current record version and graph identity to the AI commit before restoring every batch member, and return conflicts without overwriting newer manual work. Compute added, edited, and removed node sets for the UI.
  - Use the existing shared audio stream and recording UI, then pass final workflow transcripts directly through the text planner. Keep the correction provider path available as an operational rollback; do not spend a correction call by default.
  - Add workflows.clarify_workflows guidance and scoped capability retrieval to chat preprocessing and the main processor; align chat workflow creation with the disabled-by-default rule.

implementation_sequence:
  - phase: Authoring contract and evaluation
    work: Use the accepted product Specification and versioned registry capability snapshot. Compare direct Jev skill selection with app-first selection and parallel per-app skill decisions; finalize the Gemini 3.8 Flash compact semantic plan contract, including metadata, typed references, controls, and mixed operations. Preserve prior constructor comparisons as historical evidence and evaluate the selected route with seven requests and consistent validation-inclusive timing.
    dependency: None.
  - phase: Planner and graph compiler
    work: Implement registry-derived Jev selection, Gemini 3.8 Flash compact plan authoring, deterministic per-node validation before streaming, Stop, one correction attempt for an invalid node, disabled partial-prefix recovery, explicit timezone selection, generic V2 compilation, tomorrow runtime date support, and strict semantic and V2 validation. Use the same Gemini contract when Jev is unavailable.
    dependency: The authoring contract and evaluation corpus.
  - phase: Transactional batch and undo
    work: Plan independent create/edit targets concurrently, serialize same-target edits, validate a completed mixed batch, durably queue its encrypted plan, and commit it atomically in background Directus work with post-commit schedule sync and idempotency. Persist stopped or twice-invalid valid prefixes disabled with no automatic execution; edit the original Workflow in place, preserve unreached nodes, and create no copy. Persist complete AI before/after states and version-guarded batch undo including prior enabled state. Preserve the enabled state of fully successful edits and save new workflows disabled.
    dependency: Validated planner output.
  - phase: Chat integration
    work: Add workflows.clarify_workflows, exact-request workspace handoff, selective workflow context in ordinary chat, and a batch-aware chat creation/editing path that uses the same transaction and validation service. Auto-save clarified results and show activation guidance for new workflows.
    dependency: Transactional batch service.
  - phase: Workspace UI and audio
    work: Connect the shared fixed-bottom landing/editor composer and audio to the planner, immediately show a local full-screen empty shell with processing container on create submission, then stream validated metadata and nodes. Switch to workspace batch view when Jev identifies multiple workflows. Provide Stop and concrete partial-result recovery, resolve dirty edits before submission, show New pills for committed multiples and node diffs for edits, and expose guarded Undo AI changes.
    dependency: Shared backend authoring and undo APIs.
  - phase: Verification and rollout
    work: Add focused backend and browser contract coverage, exercise the selected architecture against seven real-inference requests with disposable synthetic state, and record validation-inclusive planning and durable-queue acknowledgement timings consistently. Expand to full backend and web verification before enabling broadly.
    dependency: A working vertical slice across backend, chat, and UI.

research_spike:
  exact_source_jev_comparison: >-
    On deployed revision 68cdee7984774de384ece75778fcf4eb4e0ddbec, one
    paired seven-case synthetic run per route found direct Jev skill selection
    6/7 graph-valid and 4/7 intent-matching (median Jev 350.8 ms, median full
    request 2374.6 ms) and app-first parallel per-app selection 7/7 and 6/7
    (649.5 ms, 2546.1 ms). Both recalled every required skill and selected ten
    extra skills. Direct estimated total cost $0.031747 is incomplete after a
    provider failure; staged $0.032562 is complete estimated usage. Including
    Jev, median first-header callbacks were 1877.8/1953.9 ms and first-action
    callbacks were 2063.3/2188.9 ms for direct/staged; direct had 3/7 actions
    before 2 seconds, staged 0/7. The callbacks do not measure UI delivery or
    prove pre-display validation. This single sample does not identify a causal winner; see the private
    /tmp/workflow-staged-flat-fixed-comparison-20260930.json report and the
    aggregate evidence document.
  jev_live_sample: >-
    Eight sequential synthetic Jev 1.13 calls on the dev API key succeeded without
    429. Five broad routing/recipe/parameter calls took 305-558 ms each; three
    scoped target/country/city calls took 286-381 ms. Jev correctly selected
    create-one and tomorrow weather, edit-one and the rain workflow target,
    create-multiple, and unsupported stock-purchase intent. A single recipe
    question for a two-workflow request returned unsupported with only 0.49
    confidence, confirming that batch requests must first be decomposed into
    individual intents. These few calls do not establish provider throughput.
  recipe_validation: >-
    A deterministic weekday 07:00 Berlin rain-chat V2 graph using today's date
    passed readiness and composition validation. Replacing today with tomorrow
    failed preflight because the runtime date value was unsupported at pilot
    time. This was a semantic gap, not a Jev classification error; tomorrow
    runtime values have since been added.
  jev_corpus_pilot: >-
    A first-pass 30-case synthetic Jev run had 28/30 expected operation choices,
    30/30 expected timezone choices, and no request errors; median latency was
    298 ms per call. The two operation misses conservatively routed unsupported
    automation intents to clarification. Irrelevant recipe questions on edits
    produced low-confidence answers, so recipe selection must be gated by route.
    In a separate scoped 18-case create-only set repeated twice, recipe choices
    matched 32/36 times at 290 ms median; the four misses were two repeated
    semantic errors (email mistaken for chat; unconditional rain question
    mistaken for a conditional alert), all with confidence at or below 0.45.
    This is a small synthetic pilot, not a production accuracy or RPS estimate.
  ask_ai_model_pilot: >-
    Four synthetic Ask AI instruction cases were run on both Gemini 3.5
    Flash-Lite and Gemini 3.8 Flash through the dev Google AI Studio key. Both
    preserved all supplied earlier-node reference placeholders and authored
    usable instructions. Lite took 0.7-0.9 seconds per call; 3.8 Flash took
    3.0-4.0 seconds and was slightly more precise about missing input evidence.
    The sample supports a Lite-first hypothesis, not a final quality threshold.
  bounded_fallback_pilot: >-
    Eight synthetic bounded-decision cases using strict JSON schema favored
    direct Cerebras Qwen 3.8 27B (8/8 expected, 398 ms median) over direct
    Groq GPT-OSS 120B (4/8, 237 ms) and Google AI Studio Gemini 3.5 Flash-Lite
    (6/8, 664 ms). Groq 20B had two schema errors with a 300-token cap and
    semantic misses after a larger cap; it is not a proven fallback. The tested
    prompt and sample are too small to establish production quality or capacity.

scenarios:
  - id: S-1
    title: One or several valid workflows
    given: [The user is on the Workflows landing page.]
    when: [The user describes one or several workflows.]
    then: [A create submission immediately opens a local empty full-screen workflow shell with processing above the first node; validated title, description and nodes arrive one at a time. If Jev identifies multiple workflows, switch to workspace batch view and show New pills after commit. Every saved valid workflow is disabled with a Gemini 3.8 Flash title, description, and allowed icon. A short incomplete request becomes a disabled blank workflow with the exact request as its title. Missing weekly day and time default to Monday at 09:00 and are shown as assumptions.]
  - id: S-2
    title: Jev identifies an unclear request
    given: [The user request is unclear or confusing to Jev before generation.]
    when: [The workspace planner checks the request.]
    then: [No generation begins and a new clarification chat receives the exact request with the Workflows focus mention. A later Gemini error on a clear request stays in the authoring flow.]
  - id: S-3
    title: AI edit and undo
    given: [An existing workflow is selected or open.]
    when: [The user describes a change and later selects Undo AI changes.]
    then: [A fully successful edit preserves enabled state and shows node changes. A stopped partial edit saves to the original ID, retains unreached nodes, disables it, and can be undone to restore the complete prior state when no later revision conflicts.]
  - id: S-4
    title: Recorded instruction
    given: [The user records an instruction in the workflow composer.]
    when: [Final transcription completes or transcription fails.]
    then: [The final transcript is submitted directly without a separate correction call. Failure preserves available text for review or shows recording retry guidance when no text exists. An editor instruction retains the selected workflow target.]
  - id: S-5
    title: Chat creation and clarification
    given: [The user asks in chat for a workflow or arrives from a workspace clarification handoff.]
    when: [Enough detail exists to build every requested workflow.]
    then: [The same validated batch path auto-saves new workflows disabled, preserves existing enabled states on edits, and reminds the user to activate new workflows.]
  - id: S-6
    title: Provider outage and unsupported date
    given: [Jev is unavailable or a request needs tomorrow's forecast.]
    when: [The authoring pipeline builds the workflow.]
    then: [The regular Gemini 3.8 Flash call selects from the same registry snapshot and authors the same compact contract; tomorrow resolves at run time in the schedule timezone; validation rejects an unrepresentable or semantically wrong graph.]
  - id: S-7
    title: Node streaming, interruption, and durable acknowledgement
    given: [The user submits a workflow request from the shared fixed-bottom composer.]
    when: [Gemini authors a plan and the backend prepares the batch.]
    then: [The local full-screen shell appears immediately on create submission without saving an empty workflow or inventing a workflow ID. Its processing container precedes the first node; metadata and each complete node appear only after deterministic validation. Stop or a twice-invalid node saves the valid prefix disabled with no automatic execution and a concrete recovery notice; full successful batches require final validation and an encrypted durable queue write before confirmation.]

acceptance_criteria:
  - {id: AC-1, scenario: S-1, text: 'A validated one or multi-workflow request commits atomically; every new workflow is disabled and has LLM-generated title, description, and icon.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-BATCH]}
  - {id: AC-2, scenario: S-1, text: 'Create submission immediately opens a local provisional full-screen workflow shell before Jev, Gemini, or a header; processing appears above the first node, then validated title, description and nodes appear one at a time. Jev-detected multiple workflows switch to workspace batch view; committed multiples show New pills in Continue. No empty placeholder or fake workflow ID is saved.', required: true, status: satisfied, coverage_status: covered, verification_scope: playwright, verification_ids: [T-WEB]}
  - {id: AC-3, scenario: S-2, text: 'Only a request Jev finds unclear or confusing opens clarification chat with the exact instruction before generation; Gemini errors on clear requests remain in authoring recovery.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-BATCH, T-WEB]}
  - {id: AC-4, scenario: S-3, text: 'An AI edit resolves dirty state and shows node changes. A full edit preserves enabled state; a stopped partial edit saves to the original ID, keeps unreached nodes, disables it, creates no copy, and guarded Undo restores the prior state including enabled state.', required: true, status: satisfied, coverage_status: covered, verification_scope: playwright, verification_ids: [T-EDIT]}
  - {id: AC-5, scenario: S-4, text: 'Voice input uses the shared recording UI, streams a transcript preview and submits the final workflow transcript directly without a separate correction call. Transcription failure preserves available text for review, or shows recovery for an empty recording result. An editor voice edit retains the original workflow target through clarification.', required: true, status: satisfied, coverage_status: covered, verification_scope: playwright, verification_ids: [T-VOICE]}
  - {id: AC-6, scenario: S-5, text: 'Ordinary chat loads selected capability context and the graph contract for a clear request; unclear requests use workflows.clarify_workflows, and clarified valid batches auto-save with new workflows disabled and activation guidance.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-CHAT]}
  - {id: AC-7, scenario: S-6, text: 'Jev selects registry apps, skills and modes; compare app-first parallel per-app skill selection against direct skill selection. On Jev outage Gemini authors the same compact contract. No completed graph is committed without executable V2, capability, typed-reference, and semantic validation.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-PLANNER]}
  - {id: AC-8, scenario: S-6, text: 'An explicit schedule timezone overrides the browser timezone; tomorrow weather resolves in that schedule timezone and never tests today’s forecast in its place.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-PLANNER]}
  - {id: AC-9, scenario: S-3, text: 'Undo restores the entire AI batch or partial edit including prior enabled state only while every affected workflow remains at its AI version; later manual edits cause a conflict and remain unchanged.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-BATCH, T-EDIT]}
  - {id: AC-10, scenario: S-1, text: 'One request may mix creates and edits; fully completed batches commit all or none, while Stop or twice-invalid generation may save only a validated disabled partial prefix.', required: true, status: pending, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-BATCH]}
  - {id: AC-11, scenario: S-7, text: 'The shared fixed-bottom composer supports text, audio and Stop; a local processing shell appears immediately on create submission, while each complete node streams only after deterministic validation. One invalid-node correction is allowed, then the valid prefix saves disabled with a recovery notice if still invalid. Full success requires whole-batch validation and an encrypted durable queue write.', required: true, status: pending, coverage_status: covered, verification_scope: playwright, verification_ids: [T-WEB, T-PLANNER, T-BATCH]}
  - {id: AC-12, scenario: S-1, text: 'AI workflow authoring charges measured Jev and Gemini usage using catalog token rates and stable session-step charge IDs; Billing settings retains readable model, token and credit entries; replay does not charge again. Historical unbilled requests are not charged retroactively.', required: true, status: satisfied, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-BILLING]}

tests:
  - id: T-BATCH
    type: pytest
    file: backend/tests/test_workflow_input_sessions.py
    related_files: [backend/tests/test_workflow_authoring_transaction.py]
    command: pytest backend/tests/test_workflow_input_sessions.py backend/tests/test_workflow_authoring_transaction.py
    covers: [AC-1, AC-3, AC-9, AC-10, AC-11]
    assertions: [Completed mixed valid batches commit atomically after durable encrypted queueing; Stop or twice-invalid generation saves only the validated disabled prefix; partial edits update the original ID and guarded Undo restores full prior state without overwriting later manual edits.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase:
      required: true
      expected: pass
      evidence:
        status: pending
        reason: Scoped transaction and input checks passed. Live d25b1938 cases proved two-create atomic commit and guarded Undo conflict. The earlier unsupported Slack case failed intent after chat substitution; its 557ebc1b rerun passed with exactly one disabled Monday chat prefix and no Friday or second workflow after explicit unsupported_operation failures. Durable acknowledgement timing, mixed create/edit batching, and partial-edit recovery remain unverified.
        scoped_passes:
          - {kind: isolated_github_ci, run_id: '36757002613', source_commit: 7d95d5e546e509b8c537dbe388669f76d7a506a1, harness_commit: 68cdee7984774de384ece75778fcf4eb4e0ddbec, profile: e2e, artifact: isolated-test-results, result: 'One browser transaction test passed: two targets commit once; stale and guarded undo batches roll back.'}
          - {kind: focused_unit, source: prior_transaction_proof, result: 'Eight Node transaction proof checks passed; prior transaction suite also passed.'}
          - {kind: focused_unit, source: current_worktree, result: '32 workflow-input helper checks passed.'}
          - {kind: live_cli, report: '/tmp/openmates-workflow-authoring-session3e12/workflow-rollout-ca9da8d1.json', source_commit: d25b19389d00084acd64a7b9b89ef52427fed9ce, result: 'Four supported structural cases passed; two-create atomic commit and guarded Undo conflict were confirmed. Unsupported Slack case passed disabled-state safety but failed intent after chat substitution.'}
          - {kind: live_cli, report: '/tmp/openmates-workflow-authoring-session3e12/workflow-rollout-6f0921dd.json', source_commit: 557ebc1b190c7cf39933aef04035714c7d6a2e80, result: 'Unsupported batch passed strict intent and safety assertions: exactly one disabled Monday chat prefix; no Friday or second workflow; cleanup zero.'}
  - id: T-BILLING
    type: pytest
    file: backend/tests/test_workflow_authoring_billing.py
    command: backend/.venv/bin/python -m pytest backend/tests/test_workflow_authoring_billing.py
    target: backend/tests/test_workflow_authoring_billing.py
    execution_environment: local
    covers: [AC-12]
    assertions: [Catalog pricing, every metered provider step, stable private charge identity, settlement outside Jev timeout, no unpaid saved draft, and token retention.]
    red_phase: {required: false, expected: fail, evidence: {status: pending}}
    green_phase:
      required: true
      expected: pass
      evidence:
        status: passed
        reason: "Thirty-one focused billing/planner checks passed. Billing settings CI run 36796094385 passed one case at source 98433d18108a862514729e72112655b3526b6525; live CLI proof on 127f161f reconciled 13 credits, two history entries, same-session replay with no new charge and cleanup. Report: docs/plans/workflow-ai-authoring/evidence/diverse-workflow-authoring-2026-09-30.md."
