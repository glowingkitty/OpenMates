    category: external_dependency
    required_before: implementation
    status: confirmed
    evidence:
      - source: test-results/daily-run-2026-08-27.json
        summary: Archived dispatch errors contain HTTP 403 rate-limit classification and reset timestamps.
  - id: A-2
    text: Existing release and hourly suite definitions provide reusable discovery patterns, while the complete daily critical scope requires explicit additional metadata.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/run_tests.py
        summary: CORE_JOURNEY_SPECS and RELEASE_GATE_SPECS already define bounded subsets but omit many core-chat and auth tests.
  - id: A-3
    text: Existing Directus campaign records can own and verify every remaining failure without a schema change.
    category: data_model
    required_before: implementation
