      - source: docs/plans/test-debug-campaigns/plan.yml
        summary: Durable groups already store exact members, expected behavior, attempts, blockers, priority metadata, and green evidence.
  - id: A-4
    text: Direct Brevo and Discord transports can provide provider-acceptance evidence independently of product test execution.
    category: external_dependency
    required_before: completion
    status: confirmed
    evidence:
      - source: openmates server notifications test --channel all --json
        summary: The labeled check recorded provider-delivered email and Discord independently after one attempt each.
    waiver_path: No waiver for the final milestone; run the labeled notification delivery check and full daily proof.

contracts:
  api:
    - surface: scripts/tests.py and scripts/run_tests.py
      access_model: internal-only
      auth: Existing GitHub CLI/token, Directus service credentials, and notification secrets; no new credential scope.
      rate_limits: GitHub request budget is observed and hard exhaustion opens a circuit without retries.
      credit_budget: Orchestration consumes no OpenMates product credits; selected live tests retain existing explicit budgets.
      encryption_boundary: Redacted test metadata only; no client-side encrypted or decrypted user content is accepted or returned.
  data:
    - Critical classifications are source-controlled, deterministic, unique, and auditable.
    - Run results retain phase, product-failure, infrastructure-parent, blocked-dependant, and notification-channel outcomes.
    - Existing Directus campaigns own remaining failed canonical test keys and evidence references.
  ui_states: [not_applicable]
  privacy_security:
    - Never persist or print GitHub tokens, notification destinations, webhook URLs, recipient addresses, cookies, credentials, or user content.
    - Sanitize rate-limit and provider errors to stable categories plus safe reset metadata.
    - Notification tests use labeled test payloads and never include raw failure logs.

