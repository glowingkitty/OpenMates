goal: >
  Restore trustworthy scheduled daily testing by running every explicitly
  classified billing, signup/auth, and core-chat test first, containing GitHub
  dispatch exhaustion as one infrastructure incident, recording independent
  email and Discord receipts without blocking tests, and reducing the complete
  daily run to at most fifty owned product failures with all critical tests green.

scope:
  in:
    - Replace the obsolete nightly-test-zero-failures ledger with this focused recovery spec.
    - Add a canonical critical-test registry for billing, signup/auth, and core chat.
    - Audit new or renamed likely-critical Playwright specs for explicit classification.
    - Execute the critical phase before the broad daily phase while continuing broad tests after critical product failures.
    - Inspect GitHub request budget, stop retrying hard rate-limit responses, and open one dispatch parent incident when exhausted.
    - Keep blocked or undispatched dependants visible without counting them as product failures or passes.
    - Persist independent email and Discord provider outcomes after tests finish.
    - Require scheduled daily email and Discord provider acceptance for notification health without making either channel an execution dependency.
    - Create or resume durable campaign groups for every remaining failure.
    - Prioritize shared auth bootstrap, workflow contract drift, map/embed unit regressions, assistant streaming, and critical-journey failures.
    - Verify one full commit-pinned daily run with zero unresolved infrastructure incidents, all critical tests green, and no more than fifty owned product failures.
  out:
    - Requiring zero failures in this recovery milestone.
    - Hiding failures through quarantine, omission, suppression, or false-success retries.
    - Changing disputed billing, auth, chat, Apple, or provider product behavior without its governing contract and required clarification.
    - Replacing the release-core-journeys promotion gate.
    - Changing public REST APIs, developer APIs, npm SDKs, pip SDKs, web UI, or Apple UI.
    - Making email or Discord success a prerequisite for starting or continuing tests.
    - Treating unresolved Apple host or live-provider failures as critical unless explicitly classified.

context_discovery:
  github_issues:
    - No matching GitHub issue found for daily test dispatch rate limits, critical ordering, or notification recovery.
  docs:
