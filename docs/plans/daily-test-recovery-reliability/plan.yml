implementation_notes:
  plan_path: docs/plans/daily-test-recovery-reliability/plan.yml
  specification_refs: [architecture.test-orchestration@1]
  affected_assertions:
    - test-orchestration.daily.critical-first-broad-continues
    - test-orchestration.critical.registry-audited
    - test-orchestration.dispatch.quota-aware-circuit-breaker
    - test-orchestration.results.infrastructure-is-not-product-failure
    - test-orchestration.notifications.non-blocking-receipts
    - test-orchestration.recovery.milestone
    - test-orchestration.evidence.privacy-boundary
  contract_change: new_specification
  canonical_surface: Internal operator CLI through scripts/tests.py.
  documentation_impact_ref: documentation_impact
  existing_patterns:
    - scripts/run_tests.py suite discovery, account policy, progress snapshots, aggregation, and notification service.
    - scripts/tests.py Directus-backed status, parent incidents, campaign groups, exact selection, and run dispatch.
    - RELEASE_GATE_SPECS dynamic signup and billing discovery with deterministic audits.
    - Existing focused notification outcome and daily archive tests.
  architecture: >
    Keep scripts/tests.py as the canonical control plane and scripts/run_tests.py
    as the execution engine. Add source-controlled critical metadata and a
    deterministic audit, execute critical and broad phases through the existing
    runner, introduce a bounded GitHub dispatch budget/circuit state shared by a
    run, aggregate infrastructure parents separately, persist notification
    receipts after test execution, and use existing Directus campaigns for the
    product-failure recovery loop.
  boundaries:
    - scripts/tests.py owns operator commands, Directus run/campaign state, and milestone evaluation.
    - scripts/run_tests.py owns execution phases, GitHub calls, result aggregation, artifacts, and channel attempts.
    - Critical metadata is source-controlled and cannot be inferred solely from the latest failure artifact.
    - Product fixes remain governed by their existing product contracts and tests; this spec owns prioritization and evidence only.
  data_flow:
    - Resolve the exact dev subject and validate backend/account prerequisites.
    - Audit and execute the complete critical registry.
    - Continue broad execution while the shared dispatch circuit remains healthy.
    - Aggregate executed product results, infrastructure parents, and blocked dependants separately.
    - Persist and archive final results before and after independent notification attempts without allowing notification exceptions to escape.
    - Import the exact run into Directus and create or resume groups for every remaining failure.
    - Verify high-fanout and critical groups, then run the critical gate and full daily milestone.
  affected_files:
    - {path: specifications/architecture/test-orchestration/specification.yml, reason: Stable daily orchestration assertions.}
    - {path: specifications/architecture/test-orchestration/examples.yml, reason: Boundary and failure examples.}
    - {path: scripts/run_tests.py, reason: Critical phases, dispatch circuit, aggregation, and notification receipts.}
    - {path: scripts/tests.py, reason: Critical-journey command and milestone/campaign status.}
    - {path: scripts/tests/test_daily_test_recovery.py, reason: Focused red/green orchestration contract coverage.}
    - {path: scripts/tests/test_run_tests_discord_summary.py, reason: Independent provider receipt coverage.}
    - {path: scripts/tests/test_run_tests_progress_snapshots.py, reason: Final archive and crash-path evidence.}
    - {path: docs/architecture/test-orchestration.md, reason: Document phases and health dimensions.}
    - {path: docs/plans/daily-test-recovery-reliability/plan.yml, reason: Durable implementation and evidence ledger.}
  impacts:
    api: Internal-only operator tooling; no public, developer, or first-party product endpoint changes.
    data: Add bounded phase, infrastructure-incident, blocked-dependant, critical-category, and channel-outcome metadata to existing run records.
    ui: No product UI changes.
    privacy_security: Persist sanitized categories and receipts only; credentials and destinations remain secret inputs.
  migration_rollout:
    - Do not backfill ambiguous notification outcomes into historical runs.
    - Preserve historical result files while new runs use the expanded metadata.
    - Roll out focused unit coverage first, then an exact-commit critical run, then one full scheduled-equivalent daily run.
    - Keep the existing release core-journeys workflow unchanged unless shared helper extraction is strictly required.
  observability:
    - Emit one stable infrastructure incident code and dependant count for an open dispatch circuit.
    - Record safe GitHub budget state and reset time when provided, never tokens or raw headers.
    - Record per-channel configured, status, and transport values in final and dated artifacts.
    - Report critical status, executed product failures, infrastructure incidents, blocked dependants, and milestone status separately.
  assumptions_before_implementation:
    - A-1, A-2, and A-3 are confirmed.
    - A-4 must be confirmed by V-NOTIFICATION-DELIVERY before completion but does not block unit implementation.
  acceptance_coverage:
    - AC-1 through AC-5 and AC-8 map to focused orchestration and notification pytest.
    - AC-6 maps to existing campaign pytest plus a real campaign ownership check.
    - AC-2 additionally requires an exact-commit critical run.
    - AC-7 requires the complete daily milestone run.
  risks:
    - A registry that is too broad can lengthen the critical phase; the audit must favor explicit review over automatic inclusion.
    - GitHub rate-limit metadata may be absent; unknown budget fails safely without fabricating reset timing.
    - A full rerun may expose failures hidden by the August 27 quota incident and temporarily increase executed failure count.
    - Product E2E fixes can require separate contract clarification and proof video, extending the recovery campaign.
  open_questions: []
  technical_approval:
    required: false
    reason: Critical ordering, explicit metadata, quota circuit behavior, notification semantics, and the fifty-failure milestone were approved in the permanent contract and clarification rounds.
  verification_strategy:
    - Validate and approve the permanent contract and executable spec.
    - Write focused failing orchestration tests before runner implementation.
    - Run focused local pytest for critical, dispatch, aggregation, notification, and campaign behavior.
    - Deploy the tooling before exact-commit GitHub critical and daily runs.
    - Fix campaign groups in priority order and retain proof-video evidence for product E2Es that turn green.
    - Require one final full run satisfying the explicit fifty-failure milestone.
  verification_order:
    - Contract and spec validation.
    - Focused orchestration red tests.
    - Critical registry and execution implementation plus green tests.
    - Dispatch circuit and infrastructure classification implementation plus green tests.
    - Notification receipt implementation plus green tests and real labeled delivery check.
    - Durable campaign recovery of critical and high-fanout groups.
    - Exact-commit critical gate.
    - Full daily milestone and spec verification.

