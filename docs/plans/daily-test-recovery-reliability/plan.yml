    - specifications/architecture/test-orchestration/examples.yml
  code_patterns:
    - scripts/tests.py owns canonical status, campaigns, claims, and run dispatch.
    - scripts/run_tests.py owns daily phases, GitHub dispatch, aggregation, reports, and notifications.
    - CORE_JOURNEY_SPECS and RELEASE_GATE_SPECS provide existing bounded critical-suite patterns but do not classify the complete daily critical scope.
    - BatchRunner currently retries failed per-spec dispatches and continues after hard GitHub rate limits.
    - NotificationService supports direct Brevo and Discord delivery plus internal queued email fallback.
  tests:
    - scripts/tests/test_run_tests_account_policy.py
    - scripts/tests/test_run_tests_discord_summary.py
    - scripts/tests/test_run_tests_progress_snapshots.py
    - scripts/tests/test_tests_control_campaigns.py
    - scripts/tests/test_release_core_journeys_gate.py
  baseline_evidence:
    - Run 2026-08-27T03:00:05Z at 9116f1361 recorded 5280 passed, 143 failed, 109 dispatch_error, 1 timeout, and 7 skipped.
    - 108 of 109 dispatch errors were GitHub Actions API HTTP 403 rate-limit responses; one accepted workflow lacked a visible run ID.
    - Only 149 of 258 Playwright specs reached terminal GitHub-run outcomes.
    - Billing had 2 executed failures and 13 dispatch errors; signup/auth had 5 failures and 14 dispatch errors; core chat had 17 failures, 16 dispatch errors, and 1 timeout.
    - The largest actionable failure groups were workflow/focus-mode contracts, map/embed unit expectations, auth bootstrap, and assistant streaming.

