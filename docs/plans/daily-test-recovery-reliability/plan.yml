clarification:
  rounds:
    - question: Should the obsolete nightly-test-zero-failures spec be extended or replaced?
      answer: Replace it; the older spec is no longer used and may be safely deleted.
    - question: What failure threshold completes the first recovery milestone?
      answer: Fifty or fewer failed tests because substantial follow-up work will remain.
    - question: Should broad tests continue after a critical product failure?
      answer: Yes; preserve full failure visibility whenever infrastructure can continue.
    - question: How should critical tests be classified?
      answer: Use explicit canonical metadata plus an audit for likely-critical unclassified tests.
    - question: Should scheduled daily notification failures block test execution?
      answer: No; tests always run, while both email and Discord must independently reach provider acceptance for notification health.
  vision_summary: >
    The daily workflow first proves every explicitly classified billing,
    signup/auth, and core-chat test, then continues broad coverage. Infrastructure
    exhaustion and notification delivery are independently visible and cannot
    masquerade as product failures or stop runnable tests. Recovery completes at
    a truthful full run with critical green, no unresolved infrastructure issue,
    provider-accepted email and Discord, at most fifty failures, and durable
    ownership for every remainder.
  approved_by_user: true

