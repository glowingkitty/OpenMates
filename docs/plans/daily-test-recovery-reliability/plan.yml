    status: active
    decision: Replace the obsolete nightly zero-failure spec with this bounded recovery milestone.
    reason: The old campaign is no longer active and required global zero rather than the approved staged threshold.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-2
    status: active
    decision: Critical product failures do not stop broad execution while infrastructure remains healthy.
    reason: Full failure visibility is required to measure recovery and avoid hidden regressions.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-3
    status: active
    decision: Critical membership is explicit metadata guarded by a deterministic likely-critical audit.
    reason: Filename-only matching is imprecise for chat and silently misses renamed tests.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-4
    status: active
    decision: Hard GitHub rate limits open one circuit and are never retried per spec.
    reason: The August 27 run amplified one quota incident into 108 dispatch errors and hundreds of requests.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-5
    status: active
    decision: Scheduled daily notification health requires provider-accepted email and Discord receipts, but notification outcomes cannot stop or rewrite tests.
