scenarios:
  - id: S-1
    title: Every critical test is explicitly classified
    given:
      - The repository contains billing, signup/auth, core-chat, and unrelated Playwright specs.
    when:
      - Critical classification is audited.
    then:
      - Every active critical spec has exactly one category and reason.
      - A likely-critical unclassified or missing registered spec fails the audit.
      - Unrelated broad specs are not pulled into the critical lane accidentally.
  - id: S-2
    title: Critical failures do not hide broad results
    given:
      - Critical preflight is healthy and two critical product tests fail.
      - Broad tests remain runnable.
    when:
      - The scheduled daily run advances phases.
    then:
      - The complete critical registry runs first and reports failed.
      - The broad phase still runs every runnable test.
      - Critical and broad outcomes remain independently visible.
  - id: S-3
    title: GitHub quota exhaustion opens one circuit
    given:
      - GitHub reports a hard rate-limit response while 108 specs remain pending.
    when:
      - Dispatch handles the response.
    then:
      - The rejected spec is not retried and no later dispatch request is issued.
      - One infrastructure parent incident records the rate-limit state and reset metadata when available.
      - All pending dependants remain visible as blocked_by_parent.
  - id: S-4
    title: Product and infrastructure health remain distinct
    given:
      - Seven executed product tests fail and one infrastructure incident blocks one hundred tests.
    when:
      - The run is aggregated and published.
    then:
      - Product failed count is seven.
      - Infrastructure reports one incident and one hundred blocked dependants.
      - No blocked test counts as passed or as an independent product failure.
  - id: S-5
    title: Notification failure never stops tests
    given:
      - Email fails before or during a scheduled daily run and Discord succeeds.
      - Runnable tests remain.
    when:
      - Test execution and terminal notification handling complete.
    then:
      - All runnable critical and broad tests execute.
      - Email records failed and Discord records provider_accepted.
      - Notification health is incomplete while test outcomes remain unchanged.
      - Queue-only email acceptance records queued_unconfirmed rather than delivered.
  - id: S-6
    title: Recovery campaign attacks shared causes first
    given:
      - Current failures include shared auth bootstrap, workflow contracts, map/embed units, assistant streaming, and independent failures.
    when:
      - The durable campaign is created or resumed.
    then:
      - Critical and high-fanout root causes receive highest priority.
      - Expected behavior is derived from existing approved assertions before edits.
      - Every remaining failure has one durable group and exact verification scope.
      - Disputed product behavior creates a blocker rather than an inferred fix.
  - id: S-7
    title: Full daily run proves the recovery milestone
    given:
      - Focused orchestration checks and selected campaign groups are green.
    when:
      - One full commit-pinned scheduled-equivalent daily run finishes.
    then:
      - No infrastructure incident remains unresolved.
      - Email and Discord are provider_accepted.
      - Every classified critical test passes.
      - Product failed count is at most fifty.
      - Every remaining failure belongs to a durable campaign group.

