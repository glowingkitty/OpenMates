    decided_at: "2026-08-27T00:00:00Z"
  - id: D-6
    status: active
    decision: The first recovery milestone permits at most fifty owned product failures.
    reason: This is a substantial immediate reduction while acknowledging remaining Apple, provider, and independent product work.
    decided_at: "2026-08-27T00:00:00Z"

