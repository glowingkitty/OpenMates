scenarios:
  - id: S-1
    title: Active-region write remains available during replica failure
    given:
      - nbg1, fsn1, and hel1 are configured and nbg1 is active.
      - fsn1 is temporarily unavailable.
    when:
      - Alice uploads an encrypted chat file.
    then:
      - The upload succeeds after nbg1 verifies the complete checksum.
      - hel1 receives the same generation.
      - fsn1 remains visibly pending and retries until verified.
  - id: S-2
    title: Sustained active-region failure switches and safely fails back
    given:
      - nbg1 is the active region and returns sustained retryable service failures.
      - fsn1 and hel1 are healthy.
    when:
      - Reads and writes continue during the incident and nbg1 later recovers.
    then:
      - Reads and writes use a healthy region without treating a 404 as outage evidence.
      - New generations and deletions are journaled for nbg1.
      - If fsn1 and hel1 are provisioned while nbg1 is offline, historical NBG1 backfill waits for nbg1 recovery rather than treating empty new buckets as authoritative.
      - Nbg1 historical objects backfill to fsn1 and hel1 after recovery, while incident-era writes and deletions reconcile back to nbg1.
      - All three regions reconcile generations, checksums, writes, and deletions before nbg1 can become preferred again.
  - id: S-3
    title: Explicit deletion remains final while one region is unavailable
    given:
      - A personal or Team resource has hot rows and multiple cold generations.
      - hel1 is unavailable.
    when:
      - An authorized user deletes the resource.
    then:
      - It immediately disappears from every list and read path.
      - Hot rows, all cold generations, and unshared files are purged in healthy regions.
      - Hel1 remains delete-pending and cannot resurrect the resource when it recovers.
  - id: S-4
    title: Complete inactive chat graph moves cold atomically
    given:
      - An unpinned, unshared personal or Team chat has been inactive for 28 days.
      - It has no processing Task and includes messages, embeds, keys, checkpoints, code outputs, and encrypted file references.
    when:
      - The archive worker processes the chat.
    then:
      - It uploads and verifies the complete immutable generation in every enabled region before hot content rows are removed.
      - A lightweight authorized list index remains hot.
      - Content rows are removed only after archive and manifest verification.
  - id: S-5
    title: User discovers and reads older cold resources
    given:
      - Alice has more recent hot items than the default list window and thousands of cold items.
    when:
      - She clicks Show more or requests the next cursor page, then opens one cold item.
    then:
      - A bounded authorized metadata page appears without loading every object.
      - The selected ciphertext streams from S3 without restoring all rows to Directus.
      - Pagination eventually proves a complete list and never infers deletion from a partial page.
  - id: S-6
    title: Cold shared or Team content preserves live authorization
    given:
      - A cold Team Project is visible to an active viewer.
      - A removed member also has its historical identifier.
    when:
      - Both request metadata or content.
    then:
      - The active viewer receives authorized read-only ciphertext.
      - The removed member receives no metadata or archive content.
      - Sharing a cold object first promotes its complete graph and creates current hot share state.
  - id: S-7
    title: Workspace objects use type-specific cold eligibility
    given:
      - Completed Tasks, completed Plans, terminal Workflow runs, disabled Workflow definitions, and inactive Projects exist in personal and Team scopes.
    when:
      - Lifecycle workers evaluate them.
    then:
      - Only objects satisfying their approved terminal/inactivity and dependency rules move cold.
      - Enabled, scheduled, active, or dependency-active objects remain hot.
      - Files and embeds shared with surviving resources remain referenced and readable.
  - id: S-8
    title: Large account export never buffers the complete account
    given:
      - Alice has 5,000 chats plus cold Projects, Tasks, Plans, Workflows, archives, invoices, and uploads.
    when:
      - She exports all personal data from web or CLI.
    then:
      - A persistent job resumes across disconnects and API restarts.
      - CLI decrypts and writes incrementally to disk.
      - A capable browser streams one archive; other browsers download independently readable bounded parts.
      - Missing required data produces partial or failed status instead of complete.
  - id: S-9
    title: Account deletion covers every storage generation and manifest
    given:
      - Alice owns hot and cold personal data, archive manifests, uploads, profile images, usage/task/workspace archives, and invoice convenience copies.
    when:
      - Account deletion completes its legally permitted data-removal phases.
    then:
      - Every non-regulated user object is tombstoned and purged across configured regions.
      - Statutory records follow their separately documented retention.
      - Failed regional deletion remains durable and retryable after the user row is gone.
  - id: S-10
    title: Initial backfill does not blindly replicate existing orphans
    given:
      - Nbg1 contains existing objects and Directus contains current references with known cleanup gaps.
    when:
      - The migration inventory and regional backfill run.
    then:
      - Referenced, unreferenced, missing, and ambiguous objects are reported separately.
      - No ambiguous object is deleted automatically.
      - If nbg1 is offline, fsn1 and hel1 provisioning may proceed but historical backfill remains pending until nbg1 is readable again.
      - After nbg1 recovers, verified in-scope NBG1 objects copy to fsn1 and hel1 with matching checksums and manifests.
      - Objects written to a healthy secondary during the outage reconcile to nbg1 without overwriting newer generations or authoritative tombstones.
  - id: S-11
    title: Media exceptions remain explicit
    given:
      - Product videos remain on their current NBG endpoint.
      - Temporary buffer/review media needs upload during an NBG outage.
    when:
      - The respective content is requested or uploaded.
    then:
      - Product-media temporary unavailability remains an accepted limitation without a new domain or availability claim.
      - Buffer/review upload selects a healthy region, stays private and time-bounded, and is not replicated.
  - id: S-12
    title: Compliance retention remains correct in every region
    given:
      - Financial and audit logs share a logical compliance surface but require different retention periods.
    when:
      - Buckets and lifecycle policies initialize or reconcile.
    then:
      - Prefix-specific rules preserve ten-year financial and two-year audit retention without whole-bucket rule replacement.
      - Every enabled region receives equivalent lifecycle and access policy.
  - id: S-13
    title: Authorized Team export remains bounded and revocation-aware
    given:
      - Alice is an authorized Team member and the Team owns hot and cold chats, Projects, Tasks, Plans, Workflows, runs, and files.
      - Bob was removed from the Team after starting an export.
    when:
      - Alice resumes a Team export and Bob attempts to resume his prior export job.
    then:
      - Alice receives bounded client-decryptable Team parts with the same completeness rules as a personal export.
      - Current Team authorization is rechecked for every resume and part request.
      - Bob receives no Team metadata or ciphertext, and his job cannot report complete.
  - id: S-14
    title: Real CLI image chat proves regional file replication
    given:
      - Nbg1, fsn1, and hel1 are provisioned, healthy, and configured for the dev environment.
      - A dedicated private test image and authenticated OpenMates CLI test account are available.
    when:
      - The real OpenMates CLI starts a chat, uploads the image, and asks a question whose answer requires inspecting the image.
    then:
      - The chat completes successfully and the answer demonstrates that the image was processed.
      - The uploaded encrypted file generation is present with the exact expected checksum in every configured physical regional bucket.
      - The test cleans up through the authoritative deletion path and emits no credentials, private object keys, or decrypted private content.

