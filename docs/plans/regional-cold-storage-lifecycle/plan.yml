goal: >
  Keep OpenMates encrypted product data available during a Hetzner regional
  Object Storage outage, reduce unbounded Directus hot-row growth by archiving
  complete inactive personal and Team resource graphs, preserve complete bounded
  discovery and authorized reads of cold content, make deletion final across all
  replicas, and make large personal or Team exports resumable without loading a
  complete account into API, browser, or CLI memory.

scope:
  in:
    - Default official-cloud storage regions nbg1, fsn1, and hel1, reduced only through a non-empty environment region list.
    - Region-specific physical bucket mappings behind stable logical bucket keys.
    - Active-region writes, checksums, durable asynchronous replication, regional read fallback, health-gated failover, reconciliation, and failback.
    - Replication of durable chatfiles, private profile images, invoices, compliance logs, usage/task/workspace/email archives, and approved issue-log data with bucket-specific privacy and retention.
    - An initial inventory that identifies missing references, missing objects, unreferenced objects, and pre-existing deletion gaps before copying NBG1 data.
    - Fixing the shared compliance bucket lifecycle conflict before regional backfill.
    - Idempotent deletion tombstones that immediately hide deleted content and retry physical purge in every enabled region.
    - Atomic cold archives for complete personal and Team chats with messages, embeds, wrappers, checkpoints, code outputs, and stable file references.
    - Type-specific cold lifecycle for Projects, Tasks, Plans, Workflow definitions, and Workflow runs.
    - Complete list discoverability through bounded hot/cold cursor pagination and a Show more interaction where applicable.
    - Archive-aware authorized reads and generation-fenced promotion before mutation or sharing.
    - Persistent resumable Account Export jobs, bounded chunks, CLI disk streaming, browser filesystem streaming, and multipart fallback.
    - Updating the storage-dependent portions of Account Export V1 rather than creating a competing export format.
    - Operational metrics, alerts, admin diagnostics, reconciliation, migration progress, and restore/failover drills.
    - Buffer/review media upload fallback to a healthy region without replication.
    - Regression coverage for account deletion, chat deletion, archive deletion, and shared-file reference safety.
  out:
    - A custom media.openmates.org domain, CDN origin failover, or product-media replication in this rollout.
    - Cross-provider backup or disaster recovery outside Hetzner.
    - Replicating temporary reverse-search images, OpenCode response media, or generic test recordings.
    - Moving file ciphertext from chatfiles into every cold archive; archives retain stable references instead.
    - Plaintext server-side chat, embed, Project, Task, Plan, or Team export generation.
    - Automatic deletion or retention changes for Directus revisions, activity, test results, or test-control records.
    - Archiving pinned, public/shared, processing, active, enabled, scheduled, or dependency-active resources.
    - Making an incomplete or partial archive/list page authoritative evidence of deletion.

