decisions:
  - id: D-1
    status: active
    decision: Enable nbg1, fsn1, and hel1 by default through one ordered environment region list.
    reason: Current usage is small enough for three copies and the NBG incident demonstrates location risk.
    decided_at: "2026-08-25"
  - id: D-2
    status: active
    decision: Acknowledge writes after active-region success and replicate asynchronously through a durable idempotent outbox.
    reason: Requiring all regions would turn a replica outage into an application write outage.
    decided_at: "2026-08-25"
  - id: D-3
    status: active
    decision: Archive complete owner-scoped resource graphs and read cold content directly until mutation requires promotion.
    reason: Independent message/embed eviction or read-time restoration creates broken graphs, duplicate rows, and hot/cold thrashing.
    decided_at: "2026-08-25"
  - id: D-4
    status: active
    decision: Keep complete bounded metadata discoverability for personal and Team resources.
    reason: Cold storage is an implementation detail and must not hide older user content.
    decided_at: "2026-08-25"
  - id: D-5
    status: active
    decision: Explicit deletion purges every hot row, cold generation, and unshared regional replica without a recovery grace period.
    reason: The user explicitly defined delete as final deletion.
    decided_at: "2026-08-25"
  - id: D-6
    status: active
    decision: Use streaming single archives where supported and bounded multipart exports elsewhere.
    reason: Client-side decryption is required, while full-account browser and CLI buffers do not scale.
    decided_at: "2026-08-25"
  - id: D-7
    status: active
    decision: Leave product media unchanged and make buffer/review media region-fallback-only.
    reason: Product-media temporary unavailability is accepted for this scope; temporary review objects do not justify replicated reconciliation.
    decided_at: "2026-08-25"
  - id: D-8
    status: active
    decision: Defer Apple parity, proof-video publication, visual-proof publication, and user-confirmation gates for this iteration; separate nonessential CI wiring as follow-up.
    reason: User explicitly approved these deferrals on 2026-08-26 while requiring functional, authorization, privacy, deletion, replication, concurrency, export, CLI, SDK, and web correctness to remain fully tested.
    decided_at: "2026-08-26"

