clarification:
  rounds:
    - question: Should writes require every region before acknowledgement?
      recommendation: Acknowledge after the active region succeeds and use a durable replication outbox.
      answer: Agreed with the recommendation.
    - question: Should cold reads restore complete content into Directus?
      recommendation: Read ciphertext directly from S3 and rehydrate only for mutation.
      answer: Agreed with the recommendation.
    - question: Should all object types use one 28-day threshold?
      recommendation: Use type-specific eligibility and keep active or dependency-active resources hot.
      answer: Agreed with the recommendation, including Team resources and complete older-item discoverability through Show more.
    - question: How should explicit deletion interact with replicas and archive generations?
      recommendation: Delete means immediate inaccessibility and hard purge from every region; seven-day rollback applies only to system archive replacement.
      answer: "Delete means delete."
    - question: May browsers use bounded multipart exports when one streaming ZIP is unsafe?
      recommendation: Stream one archive where supported, otherwise provide independently readable bounded parts; CLI always streams to disk.
      answer: Agreed with the recommendation.
  vision_summary: >
    OpenMates should use all three Hetzner regions by default while allowing an
    operator to configure fewer regions. Durable writes remain available when a
    replica is down, and every acknowledged object, update, and deletion
    eventually reconciles across enabled regions. Complete inactive personal and
    Team resource graphs move cold under type-specific rules but remain visible
    through bounded lists and authorized archive-aware reads; mutation promotes
    cold state safely, explicit deletion purges every generation, and large
    exports stream or download in bounded resumable parts without server plaintext.
  approved_by_user: true

