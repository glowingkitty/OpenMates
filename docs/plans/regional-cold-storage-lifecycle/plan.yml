assumptions:
  - id: A-1
    text: The current Hetzner project credentials authenticate against nbg1, fsn1, and hel1, but regional bucket provisioning must be completed before replica creation and backfill.
    category: provider
    required_before: task_execution
    status: corrected
    evidence:
      - source: https://docs.hetzner.com/storage/object-storage/overview
        summary: Hetzner documents nbg1, fsn1, and hel1 endpoints and project-scoped S3 credentials.
      - source: bounded live dev capability probes on 2026-08-26
        summary: The current credentials listed 30 NBG1 buckets and authenticated with zero buckets in FSN1/HEL1; temporary create returned NBG1 404 and FSN1/HEL1 403 without emitting credentials, names, or object keys.
    blocker_or_waiver: Provision the approved regional dev buckets or required regional service access before TASK-8 replica creation/backfill, then rerun the bounded create/head/delete probe.
  - id: A-2
    text: Hetzner has no native cross-region replication or object notification support suitable for this design.
    category: provider
    required_before: implementation
    status: confirmed
    evidence:
      - source: https://docs.hetzner.com/storage/object-storage/supported-actions
        summary: Replication and Notifications are listed as unsupported.
  - id: A-3
    text: Directus safe metadata and owner/Team indexes can retain complete list discoverability without storing private plaintext.
    category: privacy
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/directus/schemas/chats.yml
        summary: Chat ownership, timestamps, pinned/share state, and encrypted display metadata already separate routing fields from client ciphertext.
      - source: specifications/features/teams/specification.yml
        summary: Team membership and role state remain server-visible authorization metadata.
  - id: A-4
    text: Existing resource IDs, hashes, wrappers, and stable S3 keys are sufficient to build generation-fenced archive manifests without re-encrypting file bytes.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/directus/schemas/embeds.yml
        summary: Embeds retain stable IDs, hashed ownership links, key wrappers, and S3 file references.
      - source: backend/core/directus/schemas/upload_files.yml
        summary: Upload variants retain stable object keys and encryption metadata.
      - source: bounded live dev aggregate query on 2026-08-26
        summary: 113 embed rows with S3 references and all 783 upload rows had valid JSON shapes with zero missing bucket/key or s3_key values; no identifiers or private values were emitted.
    blocker_or_waiver: Contract tests must identify legacy rows missing required stable references and route them to migration repair instead of deleting hot rows.
  - id: A-5
    text: Browser streaming filesystem APIs are not uniformly available, so bounded multipart archives are required for universal web export.
    category: frontend
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/services/accountExportService.ts
        summary: Current implementation uses JSZip Blob assembly and already has a browser-size handoff guard.
  - id: A-6
    text: Apple has native list/detail surfaces for affected resource types and therefore requires semantic pagination/deletion parity review.
    category: apple
    required_before: completion
    status: checking
    evidence:
      - source: docs/architecture/apple/parity-matrix.md
        summary: Apple parity documentation maps chat and workspace resource surfaces.
    blocker_or_waiver: Record apple_remote status and inspect exact native mappings after web/user confirmation; defer unsupported export writing visibly rather than claiming parity.

contracts:
  api:
    access_model: first-party client surface only
    auth: Authenticated owner session or approved-device/API-key client with explicit personal or Team context; internal replication/reconciliation requires the internal shared token or admin authorization.
    rate_limits: Existing resource-list limits remain; new cold-index/list endpoints default to 30 requests/minute, promotion to 10 requests/minute, export start to 5 requests/hour, and internal worker routes are not publicly routable.
    credit_budget: Storage listing, cold reads, promotion, replication, deletion, and export orchestration consume no AI credits; existing provider egress/storage billing remains operational infrastructure cost.
    encryption_boundary: Routes return client ciphertext, approved Vault ciphertext, safe routing metadata, or presigned ciphertext URLs only. Decrypted private content remains client-local except existing transient inference boundaries.
    routes:
      - route: GET /v1/storage/archive-index/{resource_type}
        classification: first-party client surface only
        request: "owner_context, team_id?, cursor?, limit?"
        response: "bounded authorized encrypted metadata page, next_cursor, complete, source"
        errors: [401 unauthenticated, 403 unauthorized Team context, 400 invalid cursor, 503 cold storage unavailable]
      - route: GET /v1/storage/archive-items/{archive_id}/parts/{part_id}
        classification: first-party client surface only
        response: "bounded encrypted archive part streamed through the authenticated API proxy"
        errors: [401 unauthenticated, 403 revoked or wrong owner/Team, 404 tombstoned or missing, 409 generation mismatch, 503 all replicas unavailable]
      - route: POST /v1/storage/archive-items/{archive_id}/promote
        classification: first-party client surface only
        request: "expected_generation, mutation_intent"
        response: "promotion status, active generation, retry cursor"
        errors: [401 unauthenticated, 403 unauthorized mutation, 409 stale generation or concurrent promotion, 503 no writable region]
      - route: POST /internal/storage/replication/reconcile
        classification: internal-only
        request: "logical_bucket, prefix?, region?, dry_run"
        response: "counts, bytes, lag, checksum mismatch, missing and orphan classifications"
      - route: POST /internal/storage/replication-jobs
        classification: internal-only
        request: "logical_bucket, immutable object_key, monotonic generation, ciphertext checksum, active_region"
        response: "idempotent durable job identity and regional replication state"
      - route: GET /internal/storage/health
        classification: internal-only
        response: "configured regions, active region, regional health, replication lag, pending deletion"
      - route: POST /v1/account-exports
        classification: first-party client surface only
        request: "domains, filters, owner_context, output_mode"
        response: "persistent export job with bounded parts and resumable cursors"
  data:
    - storage_replication_jobs durably records logical bucket, object key, generation, checksum, desired regions, regional state, retry timing, and terminal status.
    - storage_deletion_tombstones remains durable independently of a deleted user/resource row until every configured region and archive generation confirms purge.
    - cold_archive_manifests stores owner/Team scope, resource type/hash, immutable generation, encrypted listing metadata, safe authorization/routing metadata, part manifest, checksums, and lifecycle state.
    - cold_archive_parts stores bounded part metadata and regional replica state without plaintext content.
    - account_export_jobs and account_export_parts persist owner/Team scope, selected domains, cursors, status, failures, expiry, and bounded output metadata without private plaintext.
    - Physical regional bucket names are resolved from logical keys; legacy unsuffixed NBG bucket names remain migration aliases until backfill and cutover complete.
  lifecycle:
    - A new generation becomes authoritative only after checksum and manifest verification.
    - Hot rows delete only after the cold generation and manifest verify in every enabled region and the list index is durable; a degraded replica leaves the verified hot graph intact until reconciliation completes.
    - System-replaced generations expire within seven days.
    - Explicit deletion bypasses rollback retention and retries purge indefinitely until complete.
    - Statutory financial/audit retention uses explicit prefix-specific policies and separate deletion classification.
  privacy_security:
    - Never persist S3 credentials, plaintext private content, raw content keys, Team keys, master keys, or share fragments in manifests, jobs, logs, metrics, or client responses.
    - Owner and Team authorization is checked from current hot authority before any cold metadata, archive part, promotion, or deletion operation.
    - User-deletable archive, export, upload, and chatfile reads are API-proxied rather than exposed through irrevocable S3 presigned URLs; authorization and tombstone state are rechecked before each bounded part and between streamed chunks.
    - Explicit deletion rejects every new read immediately and terminates an in-flight proxied stream at its next bounded chunk without disclosing a reusable regional URL.
    - A 404 is data state, not regional health evidence.
    - Reconciliation never deletes ambiguous or unreferenced data without an authoritative tombstone or approved retention policy.
  ui:
    - Recent list pages load normally and expose Show more or native-equivalent pagination when older cold metadata exists.
    - Cold detail views use existing selected-object loading states and visible retry/error behavior without ciphertext display.
    - Promotion-required mutations show bounded progress and retry rather than duplicating the object.
    - Account Export shows persistent progress, resume/cancel, per-domain failures, streaming capability, and multipart download parts.

tests:
  - id: T-S3-REGIONS
    type: pytest
    file: backend/tests/test_s3_multi_region_service.py
    command: python3 -m pytest backend/tests/test_s3_multi_region_service.py
    covers: [AC-1, AC-15]
    specification_assertions: [storage.regions.configurable-redundancy, storage.privacy.ciphertext-boundary]
    assertions:
      - Default and reduced region sets validate deterministically and reject empty/unknown sets.
      - Logical bucket resolution handles legacy NBG aliases and unique FSN/HEL physical names.
      - Generated URLs and presigned requests use the selected region rather than persisted s3_base_url authority.
    red_phase: {required: true, expected: fail, status: failed_as_expected, evidence: {status: failed_as_expected, command: "python3 -m pytest backend/tests/test_s3_multi_region_service.py backend/tests/test_storage_reference_reconciliation.py backend/tests/test_s3_compliance_lifecycle.py", run_id: local-task1-red-20260826, subject_commit: b0daef15ddfd712814906ea25568c5f1cee5e704, timestamp: "2026-08-26T00:00:00Z", summary: Multi-region policy module is missing as expected.}}
    green_phase: {required: true, expected: pass, status: passed, evidence: {status: passed, command: "sessions.py deploy integration pytest gate plus openmates server verify", run_id: deploy-cc9b292-runtime-20260826, subject_commit: cc9b29242b208efe9d3fc81c0ccda8f1c670b96b, timestamp: "2026-08-26T11:18:00Z", summary: Regional policy tests passed in the isolated integration checkout; the rebuilt API is healthy and core.object_storage passed.}}
  - id: T-S3-REPLICATION
