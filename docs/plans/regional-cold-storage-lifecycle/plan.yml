    command: python3 -m pytest backend/tests/test_s3_replica_reconciliation.py
    covers: [AC-2, AC-12]
    specification_assertions: [storage.failover.health-reconciled, storage.integrity.observable-reconcilable]
    assertions:
      - Reconciliation classifies missing, stale, mismatched, pending-delete, and ambiguous objects.
      - It repairs verified drift but never deletes ambiguity without authority.
    red_phase: {required: true, expected: fail, status: failed_as_expected, evidence: {status: failed_as_expected, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py -q", run_id: local-task3-red-20260826, subject_commit: cc9b29242b208efe9d3fc81c0ccda8f1c670b96b, timestamp: "2026-08-26T11:50:00Z", summary: Replica classification and repair planning module is absent as expected.}}
    green_phase: {required: true, expected: pass, status: passed, evidence: {status: passed, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py; openmates server logs --container cms-setup", run_id: deploy-d6583239-task3-20260826, subject_commit: d6583239ded0ca193fbdae880eefcbe1d06cf88a, timestamp: "2026-08-26T13:10:00Z", summary: Replica drift classification, checksum verification, bounded repair planning, and ambiguity-preserving behavior passed in the focused storage gate.}}
  - id: T-STORAGE-DELETION
    type: pytest
    file: backend/tests/test_storage_deletion_tombstones.py
    command: python3 -m pytest backend/tests/test_storage_deletion_tombstones.py
    covers: [AC-3, AC-8, AC-11]
    specification_assertions: [storage.deletion.global-authoritative, storage.files.reference-safe-single-copy, storage.retention.system-generation-only]
    assertions:
      - Tombstoned objects disappear immediately and retry unavailable regions.
      - Recovery reconciliation cannot copy a tombstoned generation back.
      - Shared surviving references prevent physical file deletion.
