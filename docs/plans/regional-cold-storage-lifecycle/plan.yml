    command: python3 -m pytest backend/tests/test_s3_replication_worker.py
    covers: [AC-1, AC-2]
    specification_assertions: [storage.replication.active-write-durable-outbox, storage.failover.health-reconciled]
    assertions:
      - Active success persists one idempotent desired generation and regional pending states.
      - Replica failure does not fail the acknowledged active write and retries with bounded backoff.
      - Duplicate delivery cannot create a competing generation.
    red_phase: {required: true, expected: fail, status: failed_as_expected, evidence: {status: failed_as_expected, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py -q", run_id: local-task3-red-20260826, subject_commit: cc9b29242b208efe9d3fc81c0ccda8f1c670b96b, timestamp: "2026-08-26T11:50:00Z", summary: Replication module is absent; deterministic job and bounded retry assertions fail as expected.}}
    green_phase: {required: true, expected: pass, status: passed, evidence: {status: passed, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py; openmates server logs --container cms-setup", run_id: deploy-d6583239-task3-20260826, subject_commit: d6583239ded0ca193fbdae880eefcbe1d06cf88a, timestamp: "2026-08-26T13:10:00Z", summary: Focused storage gate passed 63 tests; rebuilt API and persistence workers are healthy; cms-setup confirmed storage_replication_jobs, storage_deletion_tombstones, storage_region_health, all five storage indexes, and complete schema setup.}}
  - id: T-S3-FAILOVER
    type: pytest
    file: backend/tests/test_s3_region_failover.py
    command: python3 -m pytest backend/tests/test_s3_region_failover.py
    covers: [AC-2]
    specification_assertions: [storage.failover.health-reconciled]
    assertions:
      - Retryable transport and service failures open the regional circuit only after threshold.
      - Missing object never changes regional health.
      - Failback remains blocked through reconciliation and stabilization.
    red_phase: {required: true, expected: fail, status: failed_as_expected, evidence: {status: failed_as_expected, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py -q", run_id: local-task3-red-20260826, subject_commit: cc9b29242b208efe9d3fc81c0ccda8f1c670b96b, timestamp: "2026-08-26T11:50:00Z", summary: Regional circuit and failback state are absent as expected.}}
    green_phase: {required: true, expected: pass, status: passed, evidence: {status: passed, command: "python3 -m pytest backend/tests/test_s3_replication_worker.py backend/tests/test_s3_region_failover.py backend/tests/test_s3_replica_reconciliation.py backend/tests/test_storage_deletion_tombstones.py; openmates server logs --container cms-setup", run_id: deploy-d6583239-task3-20260826, subject_commit: d6583239ded0ca193fbdae880eefcbe1d06cf88a, timestamp: "2026-08-26T13:10:00Z", summary: Persisted regional health, missing-object neutrality, reconciliation fencing, stabilization, and failback tests passed; runtime persistence services are healthy.}}
