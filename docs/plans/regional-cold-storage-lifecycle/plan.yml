implementation_notes:
  state: ready
  spec: docs/plans/regional-cold-storage-lifecycle/plan.yml
  plan_path: docs/plans/regional-cold-storage-lifecycle/plan.yml
  contract_classification: implementation_only
  permanent_assertions:
    - storage.regions.configurable-redundancy
    - storage.replication.active-write-durable-outbox
    - storage.failover.health-reconciled
    - storage.cold.atomic-eligible-graphs
    - storage.cold.discoverable-bounded
    - storage.cold.shared-team-authorized
    - storage.cold.rehydrate-on-mutation
    - storage.files.reference-safe-single-copy
    - storage.deletion.global-authoritative
    - storage.export.persisted-bounded-complete
    - storage.privacy.ciphertext-boundary
    - storage.integrity.observable-reconcilable
    - storage.surface.semantic-parity
  surface_proof:
    rest_api: [V-DEV-STORAGE-API]
    cli: [T-CLI-COLD-LIST, T-CLI-EXPORT-DEV]
    npm_sdk: [T-NPM-SDK-COLD, T-NPM-SDK-EXPORT]
    pip_sdk: [T-PIP-SDK-COLD, T-PIP-SDK-EXPORT]
    web: [T-WEB-COLD-LIST, T-WEB-EXPORT, V-UI-VISUAL-SMOKE, V-USER-CONFIRMATION]
    apple: [V-APPLE-PARITY]
  documentation_impact_ref: documentation_impact
  existing_patterns:
    - UsageArchiveService archive-verify-mark-delete ordering.
    - UserTaskArchiveService owner-scoped encrypted gzip bundles and manifests.
    - WorkspaceChangeHistoryService bounded archive batches and checksums.
    - Existing S3UploadService logical bucket configuration, retry behavior, and private presigned URLs.
    - Existing phased sync bounded metadata windows and non-authoritative partial-page semantics.
    - Existing Account Export V1 domain and archive layout.
  architecture: >
    Introduce one shared region-policy and logical-bucket layer consumed by the
    core API and uploads service, while each process retains its local Vault
    boundary. Directus-backed replication jobs, tombstones, archive manifests,
    parts, and export jobs provide durable authority. No hot row is removed until
    every enabled archive replica verifies. User-deletable reads stream through
    authenticated API proxies so current authorization and tombstones remain
    enforceable. Resource adapters and clients are added only after the storage
    control plane and real dev API contract are proven.
  data_flow:
    - An encrypted `chatfiles/<owner-hash>/<content-hash>/original.bin` write commits in active `nbg1`, records SHA-256 plus generation 7, persists desired states for `fsn1` and `hel1`, then acknowledges.
    - Replication and reconciliation workers verify generation 7 in every enabled region while a generation 8 tombstone always wins over stale copy or repair work.
    - If nbg1 is unavailable while fsn1 and hel1 are provisioned, historical NBG1 inventory stays pending; after recovery it backfills to both new regions while newer incident generations reconcile back to nbg1 before preferred-region failback.
    - A real CLI image-question chat verifies inference success and then confirms the encrypted upload generation and checksum in nbg1, fsn1, and hel1 before authoritative cleanup.
    - A 28-day eligible chat commits its complete encrypted graph, manifest, and checksums in all enabled regions, keeps bounded list metadata hot, then removes hot content rows.
    - An authorized Team viewer pages 100 cold metadata items, streams one selected ciphertext part through the API proxy, and a later mutation performs one generation-fenced promotion.
    - A persistent export job merges bounded hot and cold chunks for CLI disk streaming or browser streaming/multipart download and rechecks Team authorization on every resume and part.
  boundaries:
    - Core API and uploads service share pure region/bucket policy utilities but never import each other's application services or bypass their separate Vault credentials.
    - First-party routes return ciphertext or safe routing metadata only; replication and reconciliation routes remain internal-only.
    - No migration deletes ambiguous objects, no reconciliation overrides tombstones, and no server path decrypts client-encrypted resource content.
  required_assumptions:
    - id: A-1
      gate: TASK-1
      check: Bounded dev probes confirm the current credentials can access nbg1, fsn1, and hel1 without printing credentials or private keys.
    - id: A-4
      gate: TASK-1
      check: Deterministic reference inventory classifies legacy rows missing stable keys and routes them to repair before hot deletion.
    - id: A-6
      gate: TASK-14
      check: Apple remote status and exact native surface mapping are confirmed before Apple implementation.
  phase_order:
    - Completed foundation: regional clients, durable jobs/tombstones, reference-safe deletion, and atomic cold chat APIs.
    - Milestone 1: complete dev regional API, recovery-aware NBG-to-FSN/HEL backfill, failover proof, and a real CLI image-question chat with exact object verification in all configured regions; record an external provisioning blocker if current authority remains insufficient.
    - Milestone 2: implement minimum workspace archive adapters and scalable personal/Team export API.
    - Milestone 3: implement and prove the real OpenMates CLI against dev.
    - Milestone 4: implement and prove npm and Python SDK parity against dev.
    - Milestone 5: implement and verify web cold pagination/export, then update minimum user and architecture documentation.
  affected_files:
    - path: backend/core/api/app/services/s3/
      reason: Shared region policy, clients, lifecycle, health, failover, and reconciliation.
    - path: backend/upload/services/s3_upload.py
      reason: Replace independent one-region assumptions with shared storage contract behavior.
    - path: backend/core/directus/schemas/
      reason: Durable replication, tombstone, archive, and export job records.
    - path: backend/core/api/app/services/
      reason: Cold archive services, authorization, promotion, reference reconciliation, and export streaming.
    - path: backend/core/api/app/tasks/
      reason: Replication, reconciliation, archive, promotion, deletion, and lifecycle workers.
    - path: frontend/packages/openmates-cli/
      reason: Cold pagination and disk-streamed export.
    - path: packages/openmates-python/
      reason: SDK cold pagination and multipart export parity.
    - path: frontend/packages/ui/
      reason: Show more, cold detail state, persistent export, streaming, and multipart fallback.
    - path: apple/OpenMates/
      reason: Final semantic pagination and deletion parity.
  migrations:
    - Add control-plane and archive manifest schemas before creating any cold generation.
    - Inventory legacy references and classify ambiguity before regional copy or orphan cleanup.
    - Keep current NBG physical bucket names as migration aliases and introduce globally unique FSN/HEL names.
    - Backfill replicas with checksums, then enable regional read fallback and only later enable cold-row deletion.
    - Archive eligible resources in bounded batches with stop/resume cursors and no automatic ambiguous-object deletion.
  observability:
    - Per-region health and circuit state without private object identifiers.
    - Replication jobs/bytes/lag/retries and checksum mismatches by logical bucket.
    - Tombstone regional completion and oldest pending deletion.
    - Archive candidates, committed generations, failed manifests, promotion duration, and hot/cold counts by resource type and owner context.
    - Export cursor/part progress, bounded memory metrics, partial/failure counts, and no private content.
  verification_strategy:
    - Write focused failing unit/contract tests before each backend slice.
    - Prove real dev API storage behavior with temporary encrypted test-prefix objects and cleanup.
    - Prove one real authenticated OpenMates CLI image-question chat and inspect all configured regional buckets for the exact encrypted generation and checksum before cleanup.
    - Prove actual OpenMates CLI and npm/pip SDK cold-list/export behavior against api.dev.openmates.org.
    - Deploy web changes before Playwright and inspect laptop/mobile screenshots before user confirmation.
    - Run Apple parity only after web confirmation.
  verification_order: [T-S3-REGIONS, T-S3-REPLICATION, T-S3-FAILOVER, T-S3-RECONCILE, T-STORAGE-DELETION, T-COLD-CHAT, T-COLD-PAGINATION, T-COLD-AUTH, T-COLD-PROMOTION, V-DEV-STORAGE-API, V-DEV-REGIONAL-BACKFILL, V-DEV-CLI-IMAGE-REPLICATION, T-COLD-WORKSPACE, T-EXPORT-STREAMING, T-STORAGE-REFERENCES, T-ACCOUNT-DELETION, T-CLI-COLD-LIST, T-CLI-EXPORT-DEV, T-NPM-SDK-COLD, T-PIP-SDK-COLD, T-NPM-SDK-EXPORT, T-PIP-SDK-EXPORT, T-WEB-COLD-LIST, T-WEB-EXPORT]
  documentation: Update user and architecture docs listed in documentation_impact after behavior is verified.
  risks:
    - Two-copy or three-copy divergence can resurrect deleted data unless tombstones fence every reconciliation path.
    - Legacy S3 references may be incomplete or orphaned; inventory must precede backfill and hot deletion.
    - Rehydrating a graph concurrently with mutation can duplicate or lose rows without generation fencing.
    - Team removal and share revocation must remain live authorization boundaries even when content is cold.
    - Browser streaming support differs; multipart output must remain independently readable and resumable.
    - Current NBG degradation can invalidate capability/backfill evidence until provider health recovers.
    - Cold-row deletion may not shrink PostgreSQL files without separate maintenance; do not claim filesystem savings from logical deletion alone.
  open_questions: []
  separate_technical_approval_required: false
  first_slice: Add deterministic inventory and failing tests for regional configuration, deletion tombstones, reference reconciliation, and compliance lifecycle before changing runtime writes.

