schema_version: 2
id: health-appointment-horizon-and-relevance
goal: Implement and test longer appointment searches and evaluate natural-language filtering for the adult ADHD
  example and other doctor appointment searches.
scope:
  in:
  - Seven-day default and explicitly requested thirty- and sixty-day windows.
  - Source-grounded visit eligibility and optional appointment ranking.
  - Private implementation and live verification of explicitly installed sources on dev.
  out:
  - Provider-specific names or implementation in the public repository.
  - Booking or treatment advice.
title: Extend appointment availability windows and evaluate optional ranking
status: implementing
scenarios:
- id: S-1
  title: Search appointments with booking evidence
  given:
  - An explicitly installed appointment source serves the requested specialty.
  when:
  - The user asks for appointments within 30 or 60 days or supplies visit requirements.
  then:
  - The search returns observed availability and separates unverified medical eligibility from confirmed appointment
    requirements.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Verify the long-window requests on dev and compare optional ranking on identical candidates for psychiatry
    and other specialties.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: manual
  verification_ids:
  - T-DEV
tests:
- id: T-DEV
  type: manual
  assertions:
  - Extended windows return provider-backed dates and the evidence survives direct and ordinary chat requests.
  - Ranking comparison records the provider candidate sets, request latency, and the impact on useful appointments.
  covers:
  - AC-1
  red_phase:
    required: false
    expected: not_applicable
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence: {}
