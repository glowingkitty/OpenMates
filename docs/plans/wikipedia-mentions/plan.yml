clarification:
  rounds:
    - question: Should every unresolved CLI mention search Wikipedia?
      answer: No. Use explicit `@wiki:<query>` with optional language.
    - question: Should OpenMates always accept the first Wikipedia result?
      answer: Use the first result unless it is a disambiguation page; then show alternatives and require a choice.
    - question: How many references may one message contain?
      answer: Three.
    - question: What happens when external-content safety is unavailable or blocks content?
      answer: Fail the entire message before inference; never pass unsanitized Wikipedia content or silently fall back.
    - question: When should web autocomplete contact Wikipedia?
      answer: Only after explicit @wiki activation, while the generic @ menu shows a static Wiki discovery option.
  vision_summary: >
    Users explicitly opt into Wikipedia lookup through @wiki, get deterministic
    locale-aware resolution and visible ambiguity handling, and can combine up to
    three safely processed summaries in one source-aware AI request. Backend and
    CLI proof, including five real AI chats, must be green before web work starts.
  approved_by_user: true

