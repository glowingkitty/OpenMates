scenarios:
  - id: S-1
    title: Explicit locale-default reference resolves the first article
    given:
      - Alice uses German in OpenMates.
    when:
      - Alice sends `@wiki:AlbertEinstein erzähle mir mehr`.
    then:
      - OpenMates searches German Wikipedia through the backend.
      - Albert Einstein is the first non-disambiguation result and becomes the canonical reference.
      - The sanitized German lead summary enters the AI context and the answer identifies Wikipedia as its source.
  - id: S-2
    title: Explicit language overrides the OpenMates locale
    given:
      - Alice uses German in OpenMates.
    when:
      - Alice sends `@wiki:en:AlbertEinstein summarize his main contributions`.
    then:
      - English Wikipedia is searched and resolved.
      - The user instruction remains authoritative over the untrusted reference text.
  - id: S-3
    title: Ambiguous shorthand requires a specific article
    given:
      - English Wikipedia returns the Mercury disambiguation page first.
    when:
      - Alice sends `@wiki:Mercury tell me more`.
    then:
      - No AI inference starts.
      - OpenMates visibly suggests non-disambiguation alternatives including Mercury planet, element, and Freddie Mercury.
      - "`@wiki:en:Mercury_(planet)` resolves the explicit article."
  - id: S-4
    title: Multiple references preserve user intent and order
    given:
      - Alice selects two or three valid Wikipedia articles.
    when:
      - Alice asks for a comparison or synthesis.
    then:
      - References remain in authored order.
      - Each bounded summary passes safety processing.
      - The model follows Alice's requested format and identifies Wikipedia as source context.
  - id: S-5
    title: Invalid fourth reference blocks the message
    given:
      - Alice has already selected three Wikipedia references.
    when:
      - Alice adds a fourth reference and sends.
    then:
      - The message fails before inference with a visible three-reference limit.
      - No reference is silently discarded.
  - id: S-6
    title: Groq safety is unavailable or blocks an article
    given:
      - A selected summary requires external-content safety processing.
    when:
      - Groq is unavailable, errors, or reports blocking prompt-injection risk.
    then:
      - The entire send fails visibly before AI inference.
      - No Wikipedia prose and no model-knowledge fallback enters the request.
  - id: S-7
    title: Web composer discovers and previews Wiki search
    given:
      - Alice opens the deployed web composer.
    when:
      - Alice types `@`, selects the static Wiki option, and enters `AlbertEin`.
    then:
      - No Wikimedia request occurs before Wiki activation.
      - Results show title, description, and proxied thumbnail without clipping on phone or laptop.
      - Selecting a result inserts a stable mention atom and sends the same canonical reference as CLI.
  - id: S-8
    title: Wikimedia throttling remains bounded and visible
    given:
      - Multiple users issue explicit @wiki searches through OpenMates.
    when:
      - Cache misses approach the configured shared budget or Wikimedia returns 429 or 503.
    then:
      - OpenMates stays at or below 150 upstream requests/minute and three concurrent requests.
      - Retry-After is honored and failures remain visible and retryable.
      - Generic mention queries are never forwarded.

