implementation_notes:
  plan_path: docs/plans/wikipedia-mentions/plan.yml
  specification_refs: [feature.wikipedia-mentions@1]
  specification_impact: new_specification
  affected_assertions:
    - wikipedia-mentions.syntax.explicit-trigger
    - wikipedia-mentions.discovery.web-menu
    - wikipedia-mentions.resolution.first-result
    - wikipedia-mentions.resolution.disambiguation-visible
    - wikipedia-mentions.references.maximum-three
    - wikipedia-mentions.context.summary-only
    - wikipedia-mentions.safety.fail-closed
    - wikipedia-mentions.ai.source-aware-intent
    - wikipedia-mentions.provider.bounded-access
    - wikipedia-mentions.privacy.explicit-third-party-query
    - wikipedia-mentions.surfaces.semantic-parity
  existing_patterns:
    - backend/shared/providers/wikipedia/wikipedia_api.py
    - backend/core/api/app/routes/wikipedia_proxy.py
    - backend/apps/ai/processing/content_sanitization.py
    - backend/core/api/app/utils/override_parser.py
    - frontend/packages/openmates-cli/src/mentions.ts
    - frontend/packages/ui/src/components/enter_message/services/mentionSearchService.ts
    - frontend/packages/ui/src/components/enter_message/MentionDropdown.svelte
  architecture: >
    Extend the pure Wikipedia provider with title search and disambiguation metadata,
    put shared cache/throttle control behind the existing proxy, serialize selected
    results as canonical directives, and resolve plus sanitize bounded summaries in
    the transient AI request path. Keep images UI-only, preserve encrypted message
    storage, and use one canonical contract across CLI, SDKs, and web.
  data_flow:
    - User types `@wiki:AlbertEinstein`; client derives locale and calls backend search.
    - Backend checks auth, cache, shared budget, and concurrency before querying Wikipedia with a compliant User-Agent.
    - Client selects first non-disambiguation result and serializes `@wikipedia:en:Albert_Einstein`.
    - Chat request parser extracts at most three canonical references and removes directives from ordinary prompt text.
    - Backend fetches revision-aware lead summaries, bounds them, runs ASCII cleanup plus Groq safety, and fails the whole message on any unsafe/unavailable result.
    - Prompt construction adds delimited untrusted source blocks and a reference-only default explanation instruction when no other user instruction remains.
    - Web displays title/description/proxied thumbnail but never sends image bytes or Wikidata fields to inference.
  api_data_ui_privacy:
    - Search route accepts public topic text under existing first-party/API-key authorization and one-credit developer cache-miss policy.
    - Chat storage remains client encrypted; public canonical directives are transiently parsed for inference.
    - Redis stores public normalized search metadata and revision-bound sanitized summaries with bounded TTLs.
    - Raw queries and extracts are excluded from logs; hashes and canonical page IDs support diagnostics.
    - Privacy/legal docs must disclose Wikimedia query and summary processing before completion.
  affected_files:
    - {path: backend/shared/providers/wikipedia/wikipedia_api.py, reason: Title search, corrected rate metadata, 429/503 Retry-After, and normalized result models.}
    - {path: backend/core/api/app/routes/wikipedia_proxy.py, reason: Search route, cache, shared budget, concurrency, auth, and image-safe response shaping.}
    - {path: backend/core/api/app/utils/override_parser.py, reason: Canonical Wikipedia reference directive parsing and three-reference validation.}
    - {path: backend/apps/ai/processing/main_processor.py, reason: Sanitized transient Wikipedia context and source-aware instruction.}
    - {path: backend/tests/test_wikipedia_mentions.py, reason: Backend contract red/green coverage.}
    - {path: scripts/api_tests/test_wikipedia_api.py, reason: Real dev API and Groq safety phase gate.}
    - {path: frontend/packages/openmates-cli/src/mentions.ts, reason: Shorthand parsing, search resolution, canonical serialization, and errors.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Async mention resolution and visible CLI output.}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: Typed npm SDK search/reference options.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: Typed pip SDK search/reference parity.}
    - {path: frontend/packages/ui/src/components/enter_message/services/mentionSearchService.ts, reason: Explicit Wiki source and result mapping.}
    - {path: frontend/packages/ui/src/components/enter_message/MentionDropdown.svelte, reason: Static discovery option and async Wiki results.}
    - {path: frontend/packages/ui/src/components/enter_message/MessageInput.svelte, reason: Wiki mention insertion and canonical serialization.}
    - {path: frontend/apps/web_app/tests/wikipedia-mentions.spec.ts, reason: Deployed browser behavior and proof contract.}
    - {path: docs/user-guide/cli/embeds-and-sharing.md, reason: User syntax and errors.}
    - {path: docs/architecture/messaging/message-input-field.md, reason: Composer Wiki source and privacy trigger.}
    - {path: docs/apis/wikipedia.md, reason: Current endpoints, 2026 limits, caching, auth, pricing, privacy, and scaling.}
  migration_backfill_rollout:
    - No persisted-data migration or backfill.
    - Unknown canonical directives remain readable text on older clients; release CLI/SDK before web.
    - Restart/rebuild api and AI worker services before direct dev and CLI gates.
    - Deploy web only after REST, CLI, SDK, and five real AI chat evidence is green.
  observability:
    - Log provider status, cache hit, language, page ID, retry class, and hashed query only.
    - Record local throttle and safety failure classes without raw query, extract, prompt, credentials, or user content.
    - Expose retry guidance to clients for 429/503 without revealing backend diagnostics.
  documentation_impact:
    - Update API, CLI, composer architecture, and legal/privacy sources; regenerate references where required.
  assumptions:
    - A-1 and A-2 are confirmed before tests.
    - Check A-3 during the first real dev API/CLI probe.
    - Correct A-4 through verified legal source updates before completion.
  risks:
    - Shared throttling can become a latency bottleneck if cache keys are ineffective.
    - Canonical directive parsing must not collide with existing mentions or leak raw protocol into model/user output.
    - Groq safety adds latency and must fail visibly without creating a user message that appears sent.
    - Wikipedia first ranking can be semantically surprising for valid non-disambiguation titles such as Apple; explicit titles remain the correction path.
    - Existing Wikipedia summary route currently exposes a separate Wikidata endpoint that must not be called by this feature.
  open_questions: []
  material_plan_approval_required: true
  verification_strategy:
    - Add and run backend red tests before provider/API/AI code.
    - Restart the real dev API/AI services and prove unauthorized, resolved, ambiguous, and safe-context behavior directly.
    - Add CLI red tests, implement CLI, and run five separate real AI chats plus reviewed terminal proof.
    - Add npm and pip SDK parity and real dev calls, then run the deterministic parity audit.
    - Wire green REST/CLI/SDK cases into daily CI before web starts.
    - Add web Playwright red against current deploy, implement and deploy web, then run green Playwright, laptop/mobile visual smoke, and phone/laptop proof.
    - Obtain user confirmation before closing; Apple remains an approved v1 exception.
  verification_order: [T-PY-WIKIPEDIA, T-REST-WIKIPEDIA-DEV, T-NODE-CLI-WIKIPEDIA, V-CLI-FIVE-REAL-AI, V-CLI-PROOF, T-NPM-SDK-WIKIPEDIA, T-PIP-SDK-WIKIPEDIA, V-SDK-CLI-PARITY, T-PW-WIKIPEDIA, V-UI-VISUAL-SMOKE, V-WEB-PROOF, V-PRIVACY-DOCS, V-USER-CONFIRMATION, V-SPEC-VERIFY]

