decisions:
  - id: D-1
    status: active
    decision: Use human syntax `@wiki:<query>` and `@wiki:<language>:<query>`, then serialize selected results as canonical `@wikipedia:<language>:<percent-encoded-title>` directives.
    reason: Human input remains concise while the backend receives unambiguous language and title metadata without adding private chat schema fields.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-2
    status: active
    decision: Cache search results by normalized language/query and sanitized summaries by language/title/revision, with no raw query logging.
    reason: This reduces Wikimedia and Groq traffic while preserving revision-aware safety results.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-3
    status: active
    decision: Use a Redis-backed shared 150-request/minute Wikimedia budget and distributed maximum concurrency of three, respecting Retry-After for 429 and 503.
    reason: Wikimedia's 2026 User-Agent-only allowance is 200 requests/minute and recommends no more than three concurrent requests.
    decided_at: "2026-08-27T00:00:00Z"
  - id: D-4
    status: active
    decision: Search preview metadata receives deterministic text cleanup; selected description and lead extract receive the full Groq safety scan before prompt construction.
    reason: Preview text never enters inference, while selected prose is untrusted model context and must fail closed.
    decided_at: "2026-08-27T00:00:00Z"

