goal: >
  Let users explicitly reference up to three Wikipedia articles with @wiki syntax,
  resolve predictable first results or visible disambiguation choices, and give the
  AI bounded sanitized lead summaries through CLI first and web second.

scope:
  in:
    - Extend the existing Wikipedia provider and proxy with title autocomplete and canonical resolution.
    - Parse `@wiki:<query>` and `@wiki:<language>:<query>` while preserving explicit canonical titles.
    - Use the current supported OpenMates language with English fallback.
    - Resolve the first search result unless it is a disambiguation page.
    - Support at most three references and fail visibly before inference for invalid, ambiguous, unsafe, or unavailable references.
    - Sanitize selected descriptions and bounded lead extracts through ASCII-smuggling removal and Groq prompt-injection detection.
    - Add CLI, npm SDK, pip SDK, and web behavior in mandatory phase order.
    - Run five separate real AI chats through the CLI before web implementation.
    - Produce reviewed CLI and phone/laptop web proof videos with toggleable WebVTT captions.
  out:
    - Direct Wikidata requests, QIDs, claims, or Wikidata context.
    - Full article bodies, HTML, image bytes, captions, citations, talk pages, or histories in model context.
    - Wikimedia requests for generic non-Wiki mentions.
    - LLM reranking of ambiguous search results.
    - Apple implementation in this version.

