contracts:
  api:
    - route: GET /v1/wikipedia/search
      access_model: developer API-key REST API plus approved first-party session or device auth
      auth: Trusted web Origin, valid first-party session/device credential, or Bearer developer API key
      request: "{ query: string, language?: supported locale, limit?: 1..10 }"
      response: "{ language, query, results: [{ page_id, key, title, description?, thumbnail_url?, disambiguation }] }"
      rate_limits: First-party per-user/IP limits plus shared 150/minute Wikimedia outbound budget and maximum three upstream requests.
      credit_budget_limits: First-party calls are free; successful developer API-key cache-miss calls use the existing one-credit Wikipedia proxy policy.
      encryption_boundary: Public topic text only; no encrypted chat, memory, file, key, sync, or share material is accepted or returned.
      errors: [400 invalid query or language, 401 unauthorized, 429 local or upstream throttle with retry guidance, 502 provider failure]
    - route: GET /v1/wikipedia/summary
      access_model: existing developer API-key REST API plus approved first-party session or device auth
      auth: Existing trusted Origin, session/device, or Bearer API-key policy
      change: Reuse for selected article resolution; do not call Wikidata or return model-ready unsanitized content.
      rate_limits: Same shared outbound budget and concurrency controls as search.
      credit_budget_limits: Existing one-credit developer API-key policy; first-party calls free.
      encryption_boundary: Public article metadata only.
    - route: First-party chat WebSocket and POST /v1/sdk/chats paths
      access_model: first-party client surface and existing developer API-key SDK chat surface
      auth: Existing chat auth and ownership rules remain unchanged.
      change: Parse at most three canonical Wikipedia reference directives and construct sanitized transient context before AI inference.
      rate_limits: Existing chat limits plus Wikipedia provider budget.
      credit_budget_limits: Existing AI inference billing remains unchanged; Wikipedia first-party reference resolution adds no user chat credit.
      encryption_boundary: Canonical public reference metadata is transient AI context; no new durable backend plaintext chat storage is introduced.
  data:
    - Human syntax resolves client-side to canonical `@wikipedia:<language>:<percent-encoded-title>` wire directives.
    - Canonical directives remain in client-encrypted message content but are stripped from ordinary prompt text after transient reference context is created.
    - Redis caches normalized public search metadata and revision-bound sanitized summaries; raw user query text is not logged.
  ui_states:
    - Generic @ menu Wiki option, inactive, loading, results, no results, disambiguation alternatives, selected chip, three-reference limit, rate-limited, provider unavailable, and safety blocked.
  privacy_security:
    - Only explicit @wiki query text and language leave OpenMates for Wikimedia.
    - Wikimedia receives the backend identity/IP, not the client IP.
    - Thumbnail bytes are UI-only and fetched through the approved OpenMates image proxy.
    - Preview metadata receives deterministic Unicode cleanup; selected prose receives full fail-closed external-content safety processing.
    - No direct Wikidata request is allowed in this flow.

