    type: vitest
    file: frontend/packages/ui/src/services/__tests__/embedSuggestionSearch.test.ts
    command: pnpm vitest run src/services/__tests__/embedSuggestionSearch.test.ts
    assertions: [Saved entries and recent child entries can match, Search remains bounded]
    covers: [AC-1, AC-2, AC-3]
    red_phase: {required: false, expected: not_run, evidence: {}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, result: 3 focused embed search tests passed, command: pnpm vitest run src/services/__tests__/embedSuggestionSearch.test.ts, run_id: local-vitest-composer-embed-20260929, subject_commit: 6507f24685b083655c3b35ae10e2b0e406759fe0, timestamp: '2026-09-29T21:37:00Z'}}
  - id: T-SEARCH-E2E
    type: playwright
