approvals:
  specification:
    status: not_required
    reason: Approved message-input.suggestions.contextual covers focused composer search; the user supplied the embed scope.
  plan:
    status: approved
    approved_at: '2026-09-29T00:00:00Z'
    reason: The user explicitly asked to plan and implement efficient search for saved memories and recent embeds.
decisions:
  - id: D-1
    status: active
    decision: Search saved memories from decrypted memory state and recent embeds from the existing RAM message index.
    reason: This covers saved entries across chat age without per-keystroke server requests or whole-embed scans.
    decided_at: '2026-09-29T00:00:00Z'
  - id: D-2
    status: active
    decision: Include all decrypted saved-memory embeds and recent fully cached chat embeds without fetching older metadata-only chats during typing.
    reason: Read-only personal-account measurement covered 101 chats, 113 embeds and 24 memories; first-result samples changed from 4002/1347/1338 ms before to 3046/831/831 ms after the first deployed search build, with heap samples 133 MB and 117 MB respectively. The comparison is observational; the bound avoids a plaintext server index or unbounded chat reads.
    decided_at: '2026-09-29T22:07:00Z'
