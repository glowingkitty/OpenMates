schema_version: 2
id: composer-embed-search
title: Bounded embed search from the message input
status: verified
goal: Let people find and open saved-memory and recent chat embeds from the message input with bounded client-side work.
scope:
  in: [All decrypted saved-memory embeds, Recent full-chat embeds and child results, Draft-safe opening from existing and new chats, Read-only personal dev performance measurement]
  out: [Fetching older metadata-only chats while typing, Server-side plaintext index]
scenarios:
  - id: S-1
    title: Find a saved or recent embed from another chat
    given: [The account has a saved event and a recent event search, The current chat has an unsent draft]
    when: [The user types a matching event name and opens a result]
    then: [Matching saved and recent embeds appear, The selected event opens and the draft remains]
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Every decrypted saved-memory entry with an embed ID can match its title and short metadata regardless of reminder timing; if its referenced embed cannot decrypt, the saved memory detail opens instead.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-SEARCH-UNIT, T-SEARCH-E2E]
  - id: AC-2
    scenario: S-1
    text: Recent indexed embeds and child results match their short metadata, use their app gradients, and open the exact result from an existing or new chat.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-SEARCH-UNIT, T-SEARCH-OPEN-COMPONENT, T-SEARCH-NEW-COMPONENT, T-SEARCH-E2E]
  - id: AC-3
    scenario: S-1
    text: Search retains debounce, cancellation, visibility and RAM bounds, with personal-account latency and memory measured read-only.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-SEARCH-UNIT, T-SEARCH-E2E]
tests:
