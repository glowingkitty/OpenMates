  - id: AC-4
    scenario: S-4
    text: Successful verification, expiry, logout, and targeted revocation mutate only the identified session; explicit logout-all remains unchanged.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-ISOLATION, T-REST-DEV]
  - id: AC-5
    scenario: S-5
    text: Legacy sessions initialize their own baseline without a false challenge or account-wide migration.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-ISOLATION, T-REST-DEV]
  - id: AC-6
    scenario: S-1
    text: Device identity is stable across location changes and location remains an independently evaluated risk signal.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND-ISOLATION]

contracts:
  endpoints:
    - route: POST /v1/auth/session
      access: first_party_client_only
      auth: secure HttpOnly refresh-token cookie
      rate_limits: existing auth-route limits unchanged
      credit_or_budget_limits: none
      encrypted_data: no chat or user-content plaintext; returns existing auth/session response
    - route: POST /v1/auth/device
      access: first_party_client_only
      auth: affected session plus OTP verification
      rate_limits: existing verification limits unchanged
      credit_or_budget_limits: none
      encrypted_data: none
    - route: POST /v1/auth/passkey/verify/device
      access: first_party_client_only
      auth: affected session plus origin-bound passkey assertion
      rate_limits: existing challenge and verification limits unchanged
      credit_or_budget_limits: none
      encrypted_data: no content plaintext
    - route: GET|DELETE /v1/auth/sessions
      access: first_party_client_only
      auth: secure HttpOnly refresh-token cookie
      rate_limits: existing auth-route limits unchanged
      credit_or_budget_limits: none
      encrypted_data: client-encrypted display metadata remains opaque to the server
  data:
    - Store a server-only country-level security baseline in per-token session metadata under user_tokens.
    - Preserve server-only security fields when client-encrypted display metadata replaces plaintext display fields.
    - Copy the complete metadata record during token rotation and remove the prior token hash.
    - Do not persist precise coordinates or expose the security baseline to clients.
    - Remove last_session_country as an authentication decision input from shared user profile cache state.

sequencing_gates:
  - gate: REST_API_FIRST
    required_before: cli_verification
    rule: Focused backend tests and the deployed /session behavior must pass before CLI proof.
    evidence: [T-BACKEND-ISOLATION, T-BACKEND-ROTATION, T-REST-DEV]
  - gate: CLI_SECOND
    required_before: completion
    rule: The existing opencode-personal CLI session must validate against the real dev API without a new pair login after the fix, if its refresh token remains valid.
    evidence: [T-CLI-DEV]

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple receives the same session-local challenge response and sibling sessions remain unaffected.
    - No response schema or native UI change is required.
  verification:
    - Existing Apple auth/session contract remains source-compatible; backend isolation tests are canonical for this server-side change.
  intentional_native_differences:
    - none

tests:
  - id: T-BACKEND-ISOLATION
    type: pytest
    file: backend/tests/test_auth_session_security_isolation.py
    command: python3 -m pytest backend/tests/test_auth_session_security_isolation.py -q
    covers: [AC-1, AC-2, AC-4, AC-5, AC-6]
    assertions:
      - Concurrent sessions compare only against their own security country baseline.
      - A location challenge changes no sibling token metadata or authentication state.
      - Legacy sessions initialize a baseline without consulting account-wide location state.
      - Stable device identity does not include country.
    red_phase:
      required: true
      expected: fail
      evidence: {status: failed_as_expected, command: "python3 -m pytest backend/tests/test_auth_session_security_isolation.py -q", run_id: "local:red-session-isolation-20260902", timestamp: "2026-09-02T23:40:00Z", summary: "Three expected failures proved missing per-session country helpers and country-dependent device identity; rotation metadata preservation already passed."}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "python3 -m pytest backend/tests/test_device_fingerprint.py backend/tests/test_auth_session_revocation.py backend/tests/test_auth_session_security_isolation.py -q", run_id: "local:green-session-isolation-20260902", timestamp: "2026-09-02T23:55:00Z", summary: "10 focused device, revocation, isolation, metadata-preservation, and rotation tests passed."}}
  - id: T-BACKEND-ROTATION
    type: pytest
    file: backend/tests/test_auth_session_security_isolation.py
    command: python3 -m pytest backend/tests/test_auth_session_security_isolation.py -q -k rotation
    covers: [AC-3]
    assertions:
      - Refresh rotation copies all per-session security metadata to the new token hash.
      - Cache-miss recovery preserves the same logical session and removes the old token entry.
    red_phase:
      required: true
      expected: fail
      evidence: {status: passed_existing_guard, command: "python3 -m pytest backend/tests/test_auth_session_security_isolation.py -q", run_id: "local:red-session-isolation-20260902", timestamp: "2026-09-02T23:40:00Z", summary: "Existing preserve_rotated_session_metadata already copies the full token metadata record."}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "python3 -m pytest backend/tests/test_auth_session_security_isolation.py -q -k rotation", run_id: "local:green-session-rotation-20260902", timestamp: "2026-09-02T23:55:00Z", summary: "Rotation retained the complete logical-session metadata record and removed the prior token hash."}}
  - id: T-REST-DEV
    type: unit
    file: scripts/verify_session_security_isolation.py
    command: python3 scripts/verify_session_security_isolation.py --env dev --scenario all
    target: https://api.dev.openmates.org
    covers: [AC-1, AC-2, AC-3, AC-4, AC-5]
    assertions:
      - The real dev API accepts the existing Finland CLI session while a Germany browser baseline exists.
      - Session-local challenge and migration behavior match the approved contract.
    red_phase: {required: false, expected: existing_incident_evidence, evidence: {status: observed, run_id: api-log-de-fi-20260902, timestamp: "2026-09-02T21:44:14Z"}}
    green_phase: {required: true, expected: pass_after_deploy, evidence: {status: not_run, run_id: "", timestamp: ""}}
  - id: T-CLI-DEV
    type: unit
    file: scripts/verify_session_security_isolation.py
    command: OPENMATES_PROFILE=opencode-personal OPENMATES_ACCOUNT_GUARD=required OPENMATES_API_URL=https://api.dev.openmates.org openmates whoami --json
    target: https://api.dev.openmates.org
    covers: [AC-1, AC-3]
    assertions:
      - The existing opencode-personal session succeeds without a replacement pair login when its refresh token remains valid.
      - The CLI receives an actionable session-local challenge if its own location actually changes.
    red_phase: {required: false, expected: existing_incident_evidence, evidence: {status: observed, run_id: cli-location-change-20260902, timestamp: "2026-09-02T22:04:41Z"}}
    green_phase: {required: true, expected: pass_after_deploy, evidence: {status: not_run, run_id: "", timestamp: ""}}

