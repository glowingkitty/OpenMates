schema_version: 2
id: session-security-isolation
title: Isolated Multi-Device Session Security
status: implementing

goal: >
  Make authentication, location-risk checks, token rotation, challenges, expiry,
  logout, and revocation operate on one logical session at a time so legitimate
  web, CLI, and Apple sessions in different countries cannot invalidate each
  other, while preserving step-up verification for a real location change
  within the affected session.

specifications:
  - id: feature.auth
    version: 1
    fingerprint: 6415aeaeeba3a1c8a991888e7395258c395879cb1cf01adbc7298f1bc14a94d4
    status: approved
    assertions:
      - auth.session.lifecycle
      - auth.session.isolation
      - auth.session.risk-reauth

scope:
  in:
    - Separate account-wide profile cache state from per-session security state.
    - Give each refresh-token chain its own server-only country baseline and pending challenge state.
    - Preserve logical-session metadata across Directus refresh-token rotation and cache-miss recovery.
    - Keep device identity independent from volatile country/location signals.
    - Update successful 2FA/passkey device verification only for the affected session.
    - Preserve targeted session revocation and explicit logout-all behavior.
    - Migrate legacy sessions safely by initializing a missing per-session baseline after a successful validation.
    - Verify the original Germany-browser plus Finland-CLI failure against the real dev API.
  out:
    - Changing passkey, password, recovery-key, or encryption cryptography.
    - Precise location tracking or storage below country granularity.
    - New login or Active Sessions UI.
    - Weakening new-device or same-session country-change verification.
    - Adding SDK consumer-login APIs.

clarification:
  rounds:
    - question: Should a country change challenge only the affected logical session while sibling sessions remain authenticated?
      recommendation: Yes; session risk state must not be shared through the account profile cache.
      answer: Yes.
    - question: Should the existing feature.auth bundle be strengthened instead of creating a competing session specification?
      recommendation: Yes; it already owns session lifecycle and risk re-authentication across first-party clients.
      answer: Yes.
  vision_summary: >
    Account, device, logical session, connection, and refresh-token generation
    are separate identities. A location change may temporarily challenge the
    one session in which it occurs, but cannot challenge, expire, or log out a
    sibling session. Explicit logout-all, account deletion, and separately
    specified severe compromise handling remain the only account-wide paths.
  approved_by_user: true

context_discovery:
  incident:
    - The dev API repeatedly logged a DE to FI country change for the same account when the server-hosted CLI validated alongside a browser session.
    - The CLI refresh token remained present; POST /session rejected it with passkey re-authentication reason location_change.
  root_cause:
    - backend/core/api/app/routes/auth_routes/auth_session.py reads and writes last_session_country on shared user_data.
    - Login, 2FA verification, and passkey verification also overwrite the same account-wide field.
    - Per-token metadata already exists under user_tokens and is copied by preserve_rotated_session_metadata.
    - Client-encrypted display metadata removes plaintext country_code, so the security baseline needs a distinct server-only field.
    - Device hashes currently include country, conflating stable device identity with a volatile risk signal.
  docs:
    - docs/architecture/data/device-sessions.md
    - docs/architecture/core/signup-and-auth.md
    - docs/architecture/core/passkeys.md
  code_patterns:
    - backend/core/api/app/routes/auth_routes/auth_session.py
    - backend/core/api/app/routes/auth_routes/auth_common.py
    - backend/core/api/app/routes/auth_routes/auth_login.py
    - backend/core/api/app/routes/auth_routes/auth_2fa_verify.py
    - backend/core/api/app/routes/auth_routes/auth_passkey.py
    - backend/core/api/app/routes/auth_routes/auth_sessions.py
    - backend/core/api/app/utils/device_fingerprint.py
    - frontend/packages/ui/src/stores/authSessionActions.ts
  tests:
    - backend/tests/test_auth_endpoints.py
    - backend/tests/test_auth_session_revocation.py
    - frontend/apps/web_app/tests/location-security-flow.spec.ts

decisions:
  - id: D-1
    status: active
    decision: Country baselines and pending re-authentication belong to a logical refresh-token session, never the shared user profile.
    reason: Concurrent legitimate sessions can originate in different countries.
    decided_at: "2026-09-02"
  - id: D-2
    status: active
    decision: Refresh-token rotation preserves logical-session security metadata atomically.
    reason: Rotation is a credential-generation change, not a new login or device.
    decided_at: "2026-09-02"
  - id: D-3
    status: active
    decision: Stable device identity excludes country; country remains a separate risk signal.
    reason: Travel and VPN changes do not turn the same physical client into a different device.
    decided_at: "2026-09-02"
  - id: D-4
    status: active
    decision: Legacy sessions with no per-session baseline initialize it after successful validation without consulting a sibling session's country.
    reason: A migration must not trigger a false account-wide challenge.
    decided_at: "2026-09-02"

scenarios:
  - id: S-1
    title: Concurrent sessions in different countries remain valid
    given:
      - A browser logical session has country baseline DE.
      - A CLI logical session has country baseline FI.
    when:
      - Both sessions validate normally.
    then:
      - Both remain authenticated with independent baselines and no challenge.
  - id: S-2
    title: A real country change challenges only the affected session
    given:
      - The browser remains in DE and the CLI has baseline FI.
    when:
      - The CLI session is observed in US.
    then:
      - Only the CLI receives location_change re-authentication.
      - The browser remains authenticated and unchanged.
  - id: S-3
    title: Token rotation keeps session identity and risk state
    given:
      - A valid logical session has baseline FI and stored session metadata.
    when:
      - Directus rotates its refresh token during normal refresh or cache-miss recovery.
    then:
      - The metadata moves atomically to the new token hash.
      - The old token entry is removed and no new-device or location challenge is created.
  - id: S-4
    title: Verification and revocation are targeted
    given:
      - An account has multiple active sessions.
    when:
      - One session completes 2FA/passkey verification, expires, logs out, or is revoked.
    then:
      - Only that session's baseline and authentication state change.
      - Logout-all remains explicit and account deletion remains account-wide.
  - id: S-5
    title: Legacy session migration is safe
    given:
      - A valid pre-migration session has no server-only country baseline.
    when:
      - It next validates successfully.
    then:
      - Its own country becomes its baseline without reading or changing a sibling baseline.

