schema_version: 2
id: workflow-ask-ai-redesign
title: Workflow Ask AI and If editor redesign
status: verified
goal: Implement the approved step-first variable picker, highlighted and filtered @ mentions, the supplied Figma Ask AI states,
  the chat model selector below the input at bottom left, a real streamed Test action response rendered as an OpenMates chat
  message, and the approved If editor and one-call AI validation and billing behavior.
scope:
  in:
  - Group Ask AI references by actual earlier nodes in one left-aligned horizontally scrolling row with single-line content-width
    pills, fixed Add, edge fades and Show all limited to the selected node.
  - Expand object fields, stop at arrays, and preserve existing saved list references.
  - Highlight and filter a partially typed @ query, replacing it fully with a left-aligned colored reference pill showing
    its canonical path and app icon.
  - Persist the chat Auto or eligible exact-model choice per Ask AI step and apply it to Test and saved runs.
  - Stream unsaved Ask AI Test output and render cumulative Markdown and embeds with OpenMates assistant identity.
  - Use local free hints while authoring; charge once for authoritative changed-question or changed-instruction Save validation.
  - Present If with the blue header, translated Next step backlink whose text hides in narrow containers, farther-left Delete,
    rich shared dropdowns, app-source exact rules and an AI confirms question option.
  - Use one Jev Test/run call to validate and evaluate AI If, with one credit when dispatched including Unsure, owner-scoped
    retry safety and pre-dispatch checks.
  out:
  - Chat creation from a Workflow step Test.
  - Redesign of unrelated Workflow nodes, chat model preferences, or the chat renderer.
  - Provider calls while typing or selecting values, list-entry projections, or a Gemini fallback for If decisions and Save
    validation.
design:
  file_key: PzgE78TVxG0eWuEeO6o8ve
  nodes:
  - 6154:66957
  - 6154:67575
  - 6154:67619
  - 6154:67666
  - 6155:67845
  frame_sizes:
  - 773x475
  - 773x475
  - 773x509
  target: Source chips above the input, a second row of source-scoped fields, blue Ask AI header and compact action row.
  accepted_differences:
  - The latest user correction places the model selector below the input at bottom left; this supersedes the earlier inside-bottom-right
    decision.
  - Shared product tokens and responsive reflow are used; these references contain one desktop breakpoint.
  - Existing delete, movement, validation and save controls remain accessible.
  references: test-results/figma/workflow-ask-ai/
scenarios:
- id: S-1
  title: Choose earlier values and type partial references
  given:
  - Weather and Events nodes precede Ask AI.
  when:
  - The author selects a source and types a partial @ query.
  then:
  - A single horizontally scrolling left-aligned app row keeps fixed Add and edge fades; only that source's left-aligned fields
    appear
  - object fields expand
  - arrays stay whole
  - and choosing a match replaces the highlighted query with an app-icon pill showing the canonical path.
- id: S-2
  title: Choose a model and watch the unsaved Test response
  given:
  - An Ask AI instruction and an eligible exact model are selected.
  when:
  - The author Tests and later saves and runs the step.
  then:
  - Processing appears below Test
  - cumulative response content renders as OpenMates
  - and the step's model choice governs Test and saved runs.
- id: S-3
  title: Author an If rule from compatible earlier values
  given:
  - Weather and AI confirmation steps precede If.
  when:
  - The author opens If and builds an Exact rule or authored AI judgment question.
  then:
  - The blue If header hides its backlink text in narrow space and places Delete farther left; shared rich dropdowns show
    compatible scalar choices after an app source is chosen
  - while AI confirms opens the colored inline question picker and invalid questions show errors.
- id: S-4
  title: Charge each authoritative AI operation once
  given:
  - A new or changed Ask AI instruction or AI judgment question requires Save validation.
  when:
  - The owner Saves
  - Tests
  - runs or retries the same logical operation.
  then:
  - Each dispatched Jev Save validation charges one credit including rejection or provider failure; AI If Test/run uses one
    dispatched Jev decision call for one credit including Unsure; Ask Test follows normal AI Ask Skill billing
  - with no charge before dispatch and owner-scoped retry safety.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: One left-aligned scrolling row holds single-line content-width upstream app pills, fixed Add and edge fades without
    stacking; scoped fields align left, nested objects expand, arrays and saved list references remain valid, and @partial
    fully becomes a left-aligned app-icon pill with canonical path such as @events.search.results.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-EDITOR
- id: AC-2
  scenario: S-2
  text: The chat Auto/exact-model selector sits below the instruction at bottom left, persists per Ask AI step and controls
    unsaved Test and saved execution.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-MODEL
- id: AC-3
  scenario: S-2
  text: Test shows Processing below its action and progressively renders cumulative Markdown and embeds in the shared assistant
    renderer with OpenMates identity, without creating a chat.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-STREAM
- id: AC-4
  scenario: S-3
  text: If uses the blue header and translated Next step backlink with narrow-container label hiding and farther-left Delete,
    rich shared dropdowns, app-source compatible scalar Exact rules without a second mode choice, and an AI confirms question
    option with local partial mentions and invalid Save/Test feedback.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-IF-UI
- id: AC-5
  scenario: S-4
  text: New or changed Ask AI and AI judgment Save validation charges once per dispatched Jev call including rejection or
    provider failure; unchanged text and owner-scoped retries do not add charges, while typing, selection, structural errors,
    missing credentials and preparation failure before dispatch remain free.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-AI-BILLING
- id: AC-6
  scenario: S-4
  text: AI judgment Test/run uses one dispatched Jev call to validate and evaluate for one credit including Unsure, while
    Ask AI Test follows normal Ask Skill billing, without provider fallback, duplicate owner-scoped retries or a 24-hour cached
    verdict for transient provider unavailability.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-AI-BILLING
