  user_approved: true
  scope: User approved proposal and separate own-worktree chats; coordinator until daily meeting handoff.
  audio_gate: ONE example with working speech must be confirmed by user before remaining audio generation.
coordination:
  session: 4aa6
  handoff_to: daily meeting and orchestration chat when user requests
  worker_rules:
  - Each worker starts its own sessions.py session/worktree before edits; never write canonical root or coordinator
    worktree. Verify distinct worktree and report it. You are not alone; do not revert others; acquire edit leases
    and shared runtime locks.
  - Start real conversations through OpenMates CLI against dev. Read each response then react naturally, never invent
    or rewrite transcript or force app/focus mentions. Explicit model mentions only for provider examples. Stop
    clear bugs/bad responses and investigate; ask user when ambiguous.
  - Inspect full deployed web conversation on phone and laptop, exercise links, previews/fullscreen, maps/artifacts,
    composer/follow-ups/focus. Correct mate/model/language, realistic useful outcome and slide relevance required.
    Follow repo deployed tests/proof workflow.
  - No example worker generates audio until speech pilot confirmed by user. Speech owner coordinates narration.
    No image/video/audio generation showcase in landing.
  - Shared defects go to assigned fix worker; do not duplicate shared renderer changes. Own only candidate data/translations/proof
    for your example. Catalog owner integrates registry/slide mapping. Coordinate test account memory mutation;
    no concurrent changes to same preferences.
  - Record meaningful milestones/bugs/decisions/evidence in assigned OpenMates task activities, and report to coordinator.
    Never mark complete based on transcript-only checks.
  - Product semantic changes need existing approved Specification or present exact review artifact for approval.
    Planning/design task approval is already given; do not repeat five clarification rounds.
  batching: Bounded workers; prioritize speech/shared blockers and first content candidate. Spawn remaining separate
    workers as capacity frees.
  specifications: Coordinator assigns work only; workers inspect governing Specifications before product edits.
  specification_decisions_2026_09_08:
    approved:
    - feature.ai-model-routing-75e40f6ee6d82dc2; preprocessing recovery; owner example-sonnet
    - feature.app-memories-278c09756fdcbea7; duplicate consent prevention; owner example-work-memory
    shared_focus_owner: fix-focus-state; career supplies instruction-loading evidence
    shared_focus_behavior: Every active-focus request includes full instructions in system prompt; off omits them;
      activation/deactivation history events remain without instruction content. Historical countdowns belong here.
    individual_research: feature.web.focus-mode.deep-research; link shared lifecycle
    app_skill_contracts: Appointment selection and generated-video preview belong to their full app-skill contracts.
    reuse_first: Preview and dollar rendering owners must check existing contracts before proposing new bundles.
    examples: Every new or changed requirement must include one or two concrete assertion-mapped examples.
    pending_question: Explain app-skill instruction sources and recommend observable guarantees in specs, prompt wording in implementation.
