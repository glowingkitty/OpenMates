scope:
  in:
    - Finish and verify client-to-client PAKE pairing and close its password-only compatibility gap without weakening server-side approval assurance.
    - Bind verified login methods and recent sensitive-action verification to server-confirmed credentials and the same logical session.
    - Enforce durable expiry and revocation for ordinary sessions, refresh, WebSocket connections, and API keys; replace legacy credentials atomically.
    - Separate SDK authentication from locally held decryption secrets and issue limited resource-key grants; migrate unsafe legacy keys and CLI sessions.
    - Version password protection while preserving local unlock of history, bind signup email proof to its transaction, and stage destructive email recovery for 24 cancellable hours.
    - Implement opportunistic OS keyring or owner-only file storage for CLI and truthful storage-mode reporting, plus auth secret cleanup and redaction.
    - Update focused coverage and run the existing signup and login browser end-to-end tests on isolated GitHub CI after implementation.
  out:
    - Sharing-password changes.
    - Automatic historical account-root rotation or destructive chat migration.
    - Production deployment without separate authorization.
decisions:
  - id: D-1
    decision: A fresh supported device must locally unwrap the existing account master key with the ordinary supported login method; no other device or second encryption password is required.
  - id: D-2
    decision: Email verification alone never recovers existing encrypted history.
  - id: D-3
    decision: The pairing PIN remains client-only; server grants and sensitive actions require server-verified same-session assurance, reusable for five minutes without refresh extending it.
  - id: D-4
    decision: Use a working OS keyring when available, otherwise an owner-only credential file; no mandatory secret-tool, setup step, or system-package installation.
  - id: D-5
    decision: Require affected CLI sessions to upgrade and log in again; separately revoke and reissue unsafe SDK API keys.
  - id: D-6
    decision: Destructive email-only recovery has a cancellable 24-hour delay; sharing-password redesign is deferred.
  - id: D-7
    decision: Ordinary signup and password login keep optional 2FA. For sensitive actions, an enrolled passkey or authenticator proof is preferred; password-only accounts re-enter their password and a one-use email code. Email is a fallback verification step, not a phishing-resistant second factor. Reuse verified same-session assurance for five minutes.
  - id: D-8
    decision: Existing untyped credential records may temporarily approve sensitive actions using an active authoritative session, a re-entered accepted legacy account secret, and a one-use email code. Record this as legacy verification rather than proven current-password verification; typed accounts must use their typed method. Ordinary login and history decryption remain available, including legacy password, passkey, and recovery paths.
  - id: D-9
    decision: Version-two password records derive independent login-proof and wrapping keys with Argon2id (64 MiB, three iterations, one lane) and HKDF. A one-use account/session/purpose-bound HMAC challenge authenticates login; the backend seals the login-proof key under the existing per-user Vault transit key and never stores or accepts a reusable fast password lookup for a version-two record. Legacy sign-in remains until a verified replacement is committed; ambiguous mixed legacy hashes are not guessed away.
acceptance_criteria:
  - id: AC-1
    text: Pairing v2 passes protocol, backend, web, CLI and available native checks; existing password-only accounts retain ordinary login and can approve pairing through the agreed password-plus-email fallback without mandatory factor enrollment.
    required: true
  - id: AC-2
    text: The server enforces verified method, same-session recent proof including password-plus-email fallback for password-only accounts, credential replacement, and authoritative expiry or revocation across REST, refresh, WebSocket, and API-key access; ordinary signup and login retain optional 2FA.
    required: true
  - id: AC-3
    text: SDK authentication material cannot itself decrypt the account root; limited grants cannot decrypt unrelated content; unsafe keys and sessions have an explicit cutover.
    required: true
  - id: AC-4
    text: Password, passkey, recovery-key, and signup changes preserve fresh-device access to existing chats; signup proof and destructive recovery satisfy the approved transaction and delay rules.
    required: true
  - id: AC-5
    text: CLI uses a working keyring or a secure owner-only local file, reports its mode, and never silently downgrades an existing keyring-backed session; secret lifecycle and log handling are verified.
    required: true
  - id: AC-6
    text: After implementation, isolated GitHub CI passes the existing signup and login end-to-end suites, including password, passkey, backup-code, recovery-key, fresh-device, and relevant pairing coverage.
    required: true
