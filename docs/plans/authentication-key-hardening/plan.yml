  blockers:
    - Legacy untyped lookup hashes do not identify the current password; preserve this provenance in proof metadata and prevent the temporary exception from extending to typed accounts.
    - Version-two enrollment and password change deliberately defer before writes for accounts with ambiguous untyped lookup arrays. Their old login and recovery continue to work, but legacy password retirement cannot be claimed until credentials are safely bound to methods.
    - Typed legacy-to-version-two password migration requires recent same-session sensitive-action assurance and otherwise defers without blocking login. This preserves the approved no-extra-login-secret ordinary flow, but means password-only accounts may keep a version-one verifier until a later eligible session. Review whether the approved Specification needs to state that rollout delay explicitly before publishing the full security patch.
    - Version-two Argon2id/HKDF authentication and staged typed-credential migration are in the worktree; isolated signup/login evidence and Apple Xcode validation remain before the cross-client requirement can be claimed complete.
    - Limited SDK project-key grants are implemented for selected existing personal Projects; encrypted Task/Plan, Team, and newly created Project grant support remains outside that implemented slice.
    - Apple source staging is not admitted by the current Mac helper; its configured SSH target was unreachable on 2026-09-28 and doctor returned UNSUPPORTED_REMOTE_OPERATION. Native Xcode link and runtime remain unverified.
