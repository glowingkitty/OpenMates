scenarios:
- id: S-1
  title: Irrelevant advisory is suppressed
  given:
  - Drupal is on the not-used list.
  when:
  - A critical Drupal advisory is observed.
  then:
  - No triage chat or notification; suppression is counted in the digest.
- id: S-2
  title: Relevant advisory is triaged once and fixed on dev
  given:
  - pnpm-lock.yaml contains an affected package version.
  when:
  - The hourly watcher runs repeatedly.
  then:
  - One triage chat, one urgent fix deployed to dev, one Discord and email message with a manual checklist, and
    no repeat chat in later hours.
- id: S-3
  title: Server reports and SSH intrusion signals
  given:
  - Prod pushes a signed encrypted report over the private network.
  when:
  - The report shows an unknown key login.
  then:
  - An immediate deterministic intrusion alert is sent.
