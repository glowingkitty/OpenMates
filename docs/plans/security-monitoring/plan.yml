schema_version: 2
id: security-monitoring
title: Automated Security Monitoring and Guarded Remediation
status: approved
goal: 'Automated IT security setup: a deterministic script checks sources for new security alerts relevant to our
  servers and stack (Hetzner, the OS versions of the prod, dev, upload and preview servers, Vercel, our packages,
  languages and app skill providers). When something could be relevant, an hourly check starts a Claude chat with
  a skill that researches related security news and evaluates how much, if at all, we are impacted, considering
  reachability, exploitability and blast radius. If an urgent fix is needed it auto-implements it and deploys to
  the dev server / dev branch, and sends Discord and email notifications that say when my action is needed (for
  example to update other servers). Issues that are not relevant for our system must not trigger. Updates respect
  a release-age wait, except prioritized security fixes. A report that was already triaged must not start a new
  chat every hour just because I have not acted on it yet.

  '
specifications:
- architecture.security-monitoring@1
- architecture.security-reporting@1
- architecture.server-management@1
task: Automated security monitoring and guarded remediation (security slice of TASK-8338)
scope:
  in:
  - scripts/security_monitoring/ package plus scripts/security_monitor.py entry point (inventory, sources, matcher,
    dispatch state, triage and fix launchers, notifications, health).
  - Host reporter for core, upload and preview servers, plus a dev-side private-network collector.
  - SSH vulnerability context and deterministic intrusion signals.
  - .claude/skills/security-triage and .claude/skills/security-fix instruction sources.
  - Release-age policy changes (pnpm, Dependabot, supply-chain guard for PyPI, crates and images).
  - Scheduler registration for the hourly watcher and daily inventory on the dev host.
  - P0 hardening, namely a lockfile check against the 2026 npm worm IOC lists and SHA-pinning of tag-referenced
    GitHub Actions.
  out:
  - Production deploys, server patching, reboots and secret rotation (manual by design).
  - Removing globally installed AI tools from the dev host (operator decision).
decisions:
- id: D-1
  decision: The new bundle architecture.security-monitoring reuses the security-reporting ledger, aliases and email
    delivery instead of changing that Specification.
  status: active
  reason: Agreed with the user in the design conversation and encoded in the approved Specification.
  decided_at: '2026-11-04T13:30:00Z'
- id: D-2
  decision: Host reports are pushed over HTTPS to a collector bound only to the dev server's Hetzner private network
    address. Reports are signed per host with `ssh-keygen -Y sign` and encrypted to the collector with `openssl
    cms`. Both tools are present on Ubuntu, so the reporter needs no extra packages.
  status: active
  reason: Agreed with the user in the design conversation and encoded in the approved Specification.
  decided_at: '2026-11-04T13:30:00Z'
- id: D-3
  decision: Triage and fix run as separate headless `claude -p` invocations with explicit `--allowedTools` and `--disallowedTools`
    lists and JSON-schema output, never `--dangerously-skip-permissions`. The fix receives only validated verdict
    fields.
  status: active
  reason: Agreed with the user in the design conversation and encoded in the approved Specification.
  decided_at: '2026-11-04T13:30:00Z'
- id: D-4
  decision: Dispatch state, including in-flight lock, per-observation dispatch fingerprint and material-change reasons,
    lives in a SQLite store under logs/security-monitoring/ outside git.
  status: active
  reason: Agreed with the user in the design conversation and encoded in the approved Specification.
  decided_at: '2026-11-04T13:30:00Z'
