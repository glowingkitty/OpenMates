- id: C-SPEC
  required: true
  description: python3 scripts/specifications.py validate and check-generated pass, and tests reference architecture.security-monitoring
    assertions.
- id: C-DRYRUN
  required: true
  description: A real dry run of the hourly watcher against live sources on the dev host completes, sends nothing
    and mutates no persistent state.
