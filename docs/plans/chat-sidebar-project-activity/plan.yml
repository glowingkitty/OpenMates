      next_action: Run registered Swift unit and UI tests once typed Mac build/source-transfer
        operations are admitted; do not claim native runtime parity.
      artifacts:
      - test-results/sidebar-native-parity-audit-final.log
      - test-results/sidebar-native-inventory-final.log
