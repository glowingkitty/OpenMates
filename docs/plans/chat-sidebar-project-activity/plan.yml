schema_version: 2
id: chat-sidebar-project-activity
title: Nested chat project navigation and running chat visibility
status: implementing
goal: Improve the chat sidebar and how we highlight currently running chats.
scope:
  in:
  - Nested project folders with flat rows and actual-name breadcrumbs
  - Globally running parent entries and descendant folder wheels
  - Landing active count opens the sidebar
  - AI-named drag grouping and add/move context actions
  - Relevant web, Apple and TUI support and tests
  out:
  - Production release
  - Automatic file-access permission
scenarios:
- id: S-1
  title: Running work remains visible
  given:
  - Multiple chats or subchats process concurrently
  when:
  - The user browses any folder or the landing page
  then:
  - Running parents appear globally first and each counts once
- id: S-2
  title: Navigate deeply nested folders
  given:
  - A project has multiple levels of folders
  when:
  - The user enters a deep folder
  then:
  - Full-width rows and the actual-name breadcrumb preserve readability
- id: S-3
  title: Organize chats
  given:
  - The user owns two chats
  when:
  - They drag together or use the project context actions
  then:
  - Encrypted project associations persist and new project titles come from AI
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Running descendants activate their parent and containing folders without duplicate
    counts
  required: true
  status: pending
  coverage_status: covered
  verification_scope: related_frontend
  verification_ids:
  - T-UNIT
  - T-COMPONENT
- id: AC-2
  scenario: S-2
  text: Breadcrumbs remain readable with reachable ancestors and flat rows at every
    depth
  required: true
  status: pending
  coverage_status: covered
  verification_scope: related_frontend
  verification_ids:
  - T-UNIT
  - T-COMPONENT
- id: AC-3
  scenario: S-3
  text: Chat grouping and add/move actions preserve encrypted membership and show
    failures
  required: true
  status: pending
  coverage_status: covered
  verification_scope: related_frontend
  verification_ids:
  - T-FLOW
tests:
- id: T-UNIT
  type: vitest
  file: frontend/packages/ui/src/utils/__tests__/chatActivity.test.ts
  command: pnpm --filter @repo/ui exec vitest run src/utils/__tests__/chatActivity.test.ts
    src/utils/__tests__/chatProjectNavigation.test.ts src/stores/__tests__/chatActivityStore.test.ts
  assertions:
  - Parent activity and descendant membership
  covers:
  - AC-1
  - AC-2
  red_phase:
    required: false
    expected: Existing source establishes the missing behavior
    evidence: {}
  green_phase:
    required: true
    expected: The focused checks pass
    evidence: {}
- id: T-COMPONENT
  type: playwright
  file: frontend/apps/web_app/tests/components/chat-project-navigation.spec.ts
  command: Isolated component CI
  assertions:
  - Flat readable breadcrumbs, picker and wheels at narrow widths
  covers:
  - AC-1
  - AC-2
  red_phase:
    required: false
    expected: Existing source establishes the missing behavior
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence: {}
  target: isolated runner preview
  execution_environment: isolated_github_ci
- id: T-FLOW
  type: playwright
  file: frontend/apps/web_app/tests/chat-sidebar-projects.spec.ts
  command: Isolated browser CI and disposable dev inference
  assertions:
  - Encrypted grouping and project membership
  covers:
  - AC-3
  red_phase:
    required: false
    expected: Existing source establishes the missing behavior
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence: {}
  target: isolated disposable browser account
  execution_environment: isolated_github_ci
