  - T-APPLE
  - V-APPLE-LANDING
  reason: Web/TUI evidence passed. Required native runtime verification is unavailable; no native
    pass or waiver is claimed.
- id: AC-2
  scenario: S-2
  text: Breadcrumbs remain readable with reachable ancestors and flat rows at every depth
  required: true
  status: blocked
  coverage_status: covered
  verification_scope: related_frontend
  verification_ids:
  - T-UNIT
  - T-COMPONENT
  - T-APPLE
  reason: Web/TUI evidence passed. Required native runtime verification is unavailable; no native
    pass or waiver is claimed.
- id: AC-3
  scenario: S-3
  text: Chat grouping and add/move actions preserve encrypted membership and show failures
  required: true
  status: blocked
  coverage_status: blocked
  verification_scope: related_frontend
  verification_ids:
  - T-FLOW
  - T-LIVE-TITLE
  - V-APPLE-ORGANIZE
  reason: Web/TUI evidence passed. Required native runtime verification is unavailable; no native
    pass or waiver is claimed.
