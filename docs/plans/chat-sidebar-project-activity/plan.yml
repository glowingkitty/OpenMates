schema_version: 2
id: chat-sidebar-project-activity
title: Nested chat project navigation and running chat visibility
status: implementing
goal: Improve the chat sidebar and how we highlight currently running chats.
scope:
  in:
  - Nested project folders with flat rows and actual-name breadcrumbs
  - Globally running parent entries and descendant folder wheels
  - Landing active count opens the sidebar
  - AI-named drag grouping and add/move context actions
  - Relevant web, Apple and TUI support and tests
  out:
  - Production release
  - Automatic file-access permission
scenarios:
- id: S-1
  title: Running work remains visible
  given:
  - Multiple chats or subchats process concurrently
  when:
  - The user browses any folder or the landing page
  then:
  - Running parents appear globally first and each counts once
- id: S-2
  title: Navigate deeply nested folders
  given:
  - A project has multiple levels of folders
  when:
  - The user enters a deep folder
  then:
  - Full-width rows and the actual-name breadcrumb preserve readability
- id: S-3
  title: Organize chats
  given:
  - The user owns two chats
  when:
  - They drag together or use the project context actions
  then:
  - Encrypted project associations persist and new project titles come from AI
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Running descendants activate their parent and containing folders without duplicate counts
  required: true
  status: blocked
  coverage_status: covered
  verification_scope: related_frontend
  verification_ids:
  - T-UNIT
