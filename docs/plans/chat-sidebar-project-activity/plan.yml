  covers:
  - AC-1
  - AC-2
  red_phase:
    required: false
    expected: Source establishes missing behavior
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence:
      status: blocked
      timestamp: '2026-10-02T21:27:50.678881+00:00'
      actor: Codex
      reason: Configured Mac helper rejects build-ios and patch-snapshot as UNSUPPORTED_REMOTE_OPERATION.
        No source transfer, native compile or UI run occurred. Static parity audit passes and
        Xcode targets contain the new files. Existing fixture covers grouping/navigation only;
