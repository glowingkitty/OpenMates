schema_version: 2
id: google-connected-content-screening
title: Screen Gmail and Google Calendar results before model inference
status: implementing
goal: >
  Verify that every piece of mail and Calendar text is screened before the main
  assistant sees it. Fix every gap found and verify with synthetic messages.
scope:
  in:
    - Gmail search, thread reads, draft receipts and Google Calendar results.
    - Saved results expanded from embeds for a later assistant turn.
    - Automated tests and a recorded model check using synthetic data.
  out:
    - Production deployment, sending email and access to an actual mailbox during the synthetic run.
    - The dedicated-account Gmail live check, which Marco will run on dev.
scenarios:
  - id: S-1
    title: Screen synthetic messages and invites
    given:
      - A Gmail result or Calendar invite contains instructions aimed at the assistant.
    when:
      - The result is returned to the assistant or expanded from a saved embed.
    then:
      - All returned text is screened and an inconclusive result is withheld.
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Inspect short fields, encoded passages and saved results before inference, and withhold incompletely screened results.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-SCREENING]
tests:
  - id: T-SCREENING
    type: pytest
    file: backend/tests/test_connected_account_output_safety.py
    command: python3 scripts/ci_coordinator.py submit --session b642 --source <ci-source> --mode pytest --no-prepared-builds --spec backend/tests/test_connected_account_output_safety.py
    execution_environment: isolated_github_ci
    target: isolated_github_ci
    assertions: [short fields, hidden and encoded text, saved results, scanner failure and disagreement]
    covers: [AC-1]
    red_phase: {required: false, expected: not_applicable, evidence: {}}
