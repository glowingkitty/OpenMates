implementation_notes:
  plan_path: docs/plans/teams-v1/plan.yml
  existing_patterns:
  - docs/plans/unified-key-wrappers/plan.yml for team-ready wrapper rows.
  - docs/plans/user-data-permission-audit/plan.yml for fail-closed route classification.
  - backend/core/directus/schemas/user_tasks.yml and user_plans.yml for encrypted workspace object schemas.
  - backend/core/directus/schemas/user_app_settings_and_memories.yml for existing personal memory row storage and client master-key
    encryption.
  - backend/core/directus/schemas/connected_accounts.yml and backend/core/api/app/routes/token_broker.py for existing personal
    connected-account storage and token-ref brokering.
  - frontend/packages/openmates-cli/src/client.ts for CLI API/WebSocket behavior.
  - frontend/packages/openmates-cli/src/sdk.ts and packages/openmates-python/openmates/sdk.py for SDK parity.
  architecture: 'Add team identity, membership, permission, billing, and context-scoping as a backend-first capability, then
    expose it through CLI and SDKs before web and Apple UI. Personal and team records share workspace primitives but are always
    filtered by explicit context. Team encryption grants use team_key_wrappers and unified object wrappers with team_key_epoch
    fixed to 1 in V1. Team memories and connected accounts are context-owned resources. Ordinary team chat is ciphertext-only;
    @openmates explicitly releases full current history to transient inference processing. Team context never falls back to
    Personal data, credentials, billing, or caches.

    '
  data_flow:
  - User creates team; backend creates owner membership, team credit account, and team key wrapper.
  - Owner/admin invites users; invite acceptance creates a Waiting for team access approval request, then owner/admin approval
    creates active membership and team key wrapper for the verified recipient.
  - Owner/admin email invites enqueue notification email with a one-time accept link; acceptance requires recipient auth/signup
    on the same OpenMates domain and never reveals account existence to the inviter.
  - CLI/SDK active context selects personal or team before workspace list/create/move commands.
  - Team memory create/list/update/delete uses hashed_team_id and team-key-path encryption; personal memory flows continue
    to use hashed_user_id and user master-key encryption.
  - Team connected-account create/list/use/token broker routes authorize selected-team encrypted rows and approved capabilities only.
  - Team chat stores and relays ordinary human messages as client ciphertext; client generates the encrypted first-message title.
  - "@openmates sends full current attributed history, replaces transient inference cache, and runs team-scoped pre/post-processing."
  - Ordinary follow-ups do not refresh inference cache; member mentions route plaintext-free in-app and default-on email notifications.
  - Team AI request checks team credits atomically, builds sender-attributed LLM history, includes only active-team memory
    context, deducts team credits, and records usage attribution.
  - Member removal revokes membership and team key wrapper, emits cleanup event, and prevents future team sync access.
  - Owner/admin team export collects only selected-team rows into an encrypted/redacted artifact; import writes only destination-team-owned
    rows after destination team-key wrapping.
  affected_files:
  - path: backend/core/directus/schemas/teams.yml
    reason: New team, membership, invite, key wrapper, billing, and usage schemas.
  - path: backend/core/directus/schemas/user_app_settings_and_memories.yml
    reason: Add owner_context, hashed_team_id, team_key_epoch, and encryption_context for team memories.
  - path: backend/core/directus/schemas/connected_accounts.yml
    reason: Support context-owned encrypted Team rows while preserving strict Personal isolation.
  - path: backend/core/api/app/routes/teams.py
    reason: Team lifecycle, membership, billing, and usage REST API.
  - path: backend/core/api/app/routes/settings.py
    reason: Context-scoped memory export/list behavior.
  - path: backend/core/api/app/routes/connected_accounts.py
    reason: Context-filtered Personal/Team lifecycle with owner/admin management and viewer-safe metadata.
  - path: backend/core/api/app/routes/token_broker.py
    reason: Broker selected-team approved capabilities without Personal fallback or raw credential exposure.
  - path: backend/core/api/app/services/directus/team_methods.py
    reason: Directus persistence and fail-closed team authorization helpers.
  - path: backend/core/api/app/services/team_billing_service.py
    reason: Team credit account, purchase, transfer, deduction, and usage attribution.
  - path: backend/core/api/app/services/team_invite_email_service.py
    reason: One-time team invite link notification delivery without leaking team secrets or private data.
  - path: backend/core/api/app/services/team_data_portability_service.py
    reason: Team-scoped export/import artifact construction, validation, and destination-team rewrap checks.
  - path: backend/core/api/app/routes/handlers/websocket_handlers
    reason: Ciphertext-only ordinary chat relay, explicit inference release, realtime member sync, notifications, context sync,
      team memory/account sync, and cleanup events.
  - path: backend/apps/ai/processing/main_processor.py
    reason: Team chat sender-attributed history and team billing context for AI processing.
  - path: frontend/packages/openmates-cli/src/client.ts
    reason: CLI API/WebSocket client support for team context and team commands.
  - path: frontend/packages/openmates-cli/src/cli.ts
    reason: User-facing Teams CLI commands and move/context overrides.
  - path: frontend/packages/openmates-cli/src/sdk.ts
    reason: npm SDK Teams parity.
  - path: packages/openmates-python/openmates/sdk.py
    reason: pip SDK Teams parity.
  - path: frontend/packages/ui/src/services
    reason: Web Settings Teams and profile-menu context switching use shared encrypted Teams API logic.
  - path: frontend/packages/ui/src/components/settings
    reason: Settings root Teams item and per-team sub-settings entries are the only web team management surface.
  - path: frontend/packages/ui/src/components/profile
    reason: User profile menu owns Personal/team context switching and team-avatar overlay states.
  - path: frontend/apps/web_app/src/routes/teams
    reason: Must be removed; Teams must not have a top-level workspace route.
  - path: frontend/apps/web_app/tests/teams-settings-context.spec.ts
    reason: Independent full-context, settings, team-only billing, connected-account, and cleanup proof.
  - path: frontend/apps/web_app/tests/teams-realtime-chat.spec.ts
    reason: Independent two-user ciphertext-only chat, realtime AI, sender layout, and member-notification proof.
  - path: frontend/apps/web_app/tests/helpers/team-test-cleanup.ts
    reason: finally cleanup registry and bounded stale E2E-team sweeper.
  - path: scripts/tests/test_teams_settings_only_guard.py
    reason: Deterministic guard prevents Teams workspace route/navigation from returning.
  - path: apple/OpenMates
    reason: Apple parity or explicit deferral.
  verification_strategy:
  - python3 scripts/plan_validate.py docs/plans/teams-v1/plan.yml
  - Backend pytest contract tests for lifecycle, membership, invite email links, data portability, permissions, billing, offboarding,
    team chat, and move behavior.
  - Backend pytest contract tests for team memory isolation, team-owned connected accounts, encrypted chat boundary, realtime sync, mentions, and cleanup.
  - Real CLI dev-server scripts against api.dev.openmates.org with real test-account auth.
  - Captioned CLI proof video using human-readable OpenMates commands, not --json output.
  - Wire real CLI proof into daily tests after dev pass.
  - npm and pip SDK tests plus python3 scripts/audit_sdk_cli_parity.py.
  - Deterministic no-workspace Teams guard.
  - Independent deployed teams-settings-context.spec.ts and teams-realtime-chat.spec.ts runs.
  - Reviewed laptop/mobile visual smoke and proof videos showing actual context replacement and two-user collaboration.
  - User confirmation of deployed full-context and realtime behavior.
  - Apple build/test or explicit deferral after web/user confirmation.
  verification_order:
  - Spec validation.
  - Backend red/green tests.
  - Real CLI dev lifecycle and membership.
  - Real CLI dev memory and team-owned connected-account isolation/use.
  - Real CLI dev invite email-link and team data export/import proof.
  - Real CLI dev team chat, billing, workspace context, move, and offboarding.
  - User-approved CLI proof-video contract, capture, bounded frame review, and Discord publication.
  - Daily-test wiring for the CLI dev coverage.
  - npm SDK parity.
  - pip SDK parity.
  - Deterministic no-workspace and stale E2E cleanup guards.
  - Deployed web context/settings/billing/accounts Playwright.
  - Deployed two-user encrypted/realtime chat Playwright.
  - Reviewed laptop/mobile visual smoke and proof video.
  - User confirmation.
  - Apple parity or deferral.
  risks:
  - Leaking team data through personal-only routes or sync caches.
  - Charging personal credits for team AI usage.
  - Treating viewer as read-only in UI but not enforcing it server-side.
  - Creating decryption failures by writing team wrappers before team_key_wrapper sync is available.
  - Missing local cleanup on member removal and leaving managed clients in stale team context.
  - Leaking personal memories into team AI prompts or team memory mention metadata.
  - Letting team token-broker requests use a member's personal connected account.
  - Encrypting team connected-account token material in a way that lets viewers decrypt provider secrets.
  - Sending ordinary team plaintext, sender display metadata, or notification content to the server before @openmates consent.
  - Updating inference cache from ordinary follow-ups or using stale history after a later @openmates invocation.
  - Cross-context realtime leakage or notification delivery to removed/non-members.
  - Cleanup deleting non-E2E teams or hiding the original test failure.
  - Sending invite emails that expose raw team keys, wrapped team keys, private emails in logs, or team/private content.
  - Export/import accidentally merging team rows into personal context or carrying rows from the wrong team.
  - Billing transfer races between personal and team credit balances.
  - Scope creep into private ACLs, per-member limits, SSO, or key rotation.
  open_questions:
  - What exact retention period applies after team deletion before permanent purge or export? V1 can archive/delete according
    to existing account data policies until legal review.
  - Should team invoices use a default personal account identifier when optional team billing profile is absent, or only a
    team account ID? V1 should use team account ID unless payment law requires more.
  - No Personal memory or connected-account copy/fallback flow is in scope; Team resources are created explicitly under Team context.
