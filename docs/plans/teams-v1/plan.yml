goal: 'Implement OpenMates Teams for small groups with shared team credits, team-wide workspace data, CLI/SDK-first context
  switching, and team chat collaboration while preserving personal/team data isolation and the existing encrypted object key
  architecture.

  '
scope:
  in:
  - CLI-first team lifecycle commands for create, list, get, update, delete, switch, and current context.
  - npm SDK and pip SDK parity for the same team lifecycle and active-context behavior.
  - Team membership roles owner, admin, member, and viewer.
  - Direct email/code invite, accept, decline, remove member, leave team, and role update flows.
  - Invite notification emails with one-time invite links that open the web accept flow and are also consumable from CLI/SDK.
  - Multi-team membership for one user.
  - Active context switching between personal and one selected team replaces chats, billing, usage, tasks, plans, projects,
    workflows, memories, connected accounts, and all new-resource creation.
  - Web Teams management lives only under Settings, with a Settings root Teams item and one sub-settings entry per joined
    team.
  - >-
    Web active team switching lives in the user profile menu: the selected team's small avatar overlays the bottom-right of
    the user profile image, and opening the menu moves the team avatar below the user profile image while showing joined
    teams for switching.
  - Context-scoped list/read/create behavior for chats, billing, usage, tasks, projects, plans, workflows, memories, and connected accounts.
  - >-
    Team-wide visibility in V1 means every team member/viewer can see all team chats, tasks, projects, plans, workflows,
    memories, and approved team-connected-account capabilities, subject to viewer read-only restrictions.
  - Team memories encrypted with the specific team's team key or a per-memory object key wrapped by that team key.
  - Personal memories and personal connected accounts are inaccessible to all team-context requests, including AI requests.
  - Team-owned connected accounts use team-scoped encrypted credentials; owner/admin manage them, members use approved capabilities,
    viewers remain read-only, and Personal connected-account fallback is forbidden.
  - Confirmed move commands for chats, tasks, projects, plans, and workflows from personal context into a team.
  - Team chats require an explicit @openmates mention to trigger AI processing.
  - Team chat LLM context includes per-human sender attribution so the model can distinguish speakers.
  - Active members receive newly created team chats, human messages, AI processing state, and completed AI responses in realtime.
  - Shared team credit balance and team billing profile.
  - Team AI usage consumes team credits only, never personal credits.
  - Owner/admin team credit purchase by bank-transfer order from CLI/SDK; card payment starts remain web/Apple-only.
  - Per-member team usage attribution and owner/admin usage reporting.
  - Viewer read-only role with export and all write/AI-trigger actions disabled.
  - Member removal revokes server/sync access, revokes that member's team key wrapper, and instructs managed clients to delete
    local team data.
  - Owner/admin team data export and import with the same privacy guarantees as personal account export: exported data is
      encrypted/redacted, scoped only to the selected team, and never mixes personal rows.
  - Team encryption uses unified key wrappers with team_key_epoch fixed to 1 for V1; no automatic team key rotation on member
    removal.
  - Web app and Apple app parity after CLI and SDK gates are green.
  out:
  - A top-level Teams workspace, `/teams` route, workspace navigation Teams item, or Teams-as-workspace surface.
  - Private team chats, project ACLs, item-specific permissions, or participant lists.
  - Per-member credit limits or user groups.
  - SSO, SAML, domain-restricted teams, public team discovery, or public community teams.
  - Team-to-personal credit transfers.
  - Team key rotation, historical rewrap, public-key member key distribution, connected-account secret rewrap after every
    role change, or strict cryptographic erasure of already-synced data.
  - Team exports for viewers.
  - Sharing, copying, importing, or falling back to a member's Personal connected account in Team context.
  - Importing team data into a personal account context or implicitly merging team data with personal memories, connected
    accounts, chats, tasks, projects, plans, or workflows.
  - Web or Apple implementation before CLI and SDK contracts are verified.
  - Enterprise sales flows, per-seat subscriptions, or contact-us pricing.
