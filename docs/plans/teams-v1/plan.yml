  - AC-14
  assertions:
  - owner/admin email invites create one-time token hashes and enqueue a notification email with a safe invite link.
  - invite creation returns indistinguishable responses for existing-account and no-account emails.
  - invite command/API copy includes the current OpenMates domain/deployment reminder.
  - invite emails and logs do not expose raw team keys, wrapped keys, personal data, private team content, or plaintext private
    emails beyond authorized delivery.
  - accepting an email invite requires authenticated recipient context, creates Waiting for team access approval state, and
    blocks active membership until owner/admin approval creates a team_key_wrapper.
  - expired, declined, revoked, or reused invite links fail closed.
