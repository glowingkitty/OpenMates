        backend/tests/test_teams_billing.py backend/tests/test_teams_chat_ai.py backend/tests/test_teams_move_authorization.py
        backend/tests/test_teams_routes.py backend/tests/test_teams_memory_isolation.py backend/tests/test_teams_connected_accounts.py
        backend/tests/test_teams_invite_email.py backend/tests/test_teams_data_portability.py scripts/tests/test_teams_privacy_audit.py
