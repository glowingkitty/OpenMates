implementation_notes:
  plan_path: docs/plans/sdk-cleartext-encryption-boundary/plan.yml
  existing_patterns:
    - frontend/packages/openmates-cli/src/tasksCli.ts and sdk.ts already provide plaintext task SDK helpers backed by encrypted storage payload builders.
    - frontend/packages/openmates-cli/src/cli.ts already implements instruction-only ask commands and internal encryption for task/plan/project create/update apply calls.
    - packages/openmates-python/openmates/sdk.py already has task plaintext create/list/decrypt helpers that can be extended to plans and projects.
    - scripts/audit_sdk_cli_parity.py provides the current deterministic parity audit baseline.
    - docs/plans/account-import-v1/plan.yml defines plaintext scan then client-encrypted persistence as the safe import pattern.
  architecture: >
    Treat public CLI/SDK methods as a cleartext facade over first-party encrypted
    storage transports. Keep encrypted transport helpers internal, rename them so
    they cannot be confused with public ask APIs, and add deterministic audits
    that reject public encrypted payload fields and npm/pip parity drift. Replace
    account export/import with cleartext user-readable files plus local
    re-encryption on import; never export OpenMates decrypt authority.
  data_flow:
    - Caller passes cleartext to CLI or SDK.
    - Client fetches/unlocks local account master key or object key material using existing approved first-party auth.
    - Client encrypts durable private fields and sends encrypted storage/apply payloads to first-party backend routes.
    - Backend stores encrypted durable fields and safe metadata only.
    - Client decrypts returned encrypted records before printing, returning, or exporting user-facing content.
    - Account export materializes cleartext files locally and optionally wraps the zip with a user-supplied password.
    - Account import reads cleartext locally and re-encrypts into destination-account storage payloads before server writes.
  affected_files:
    - path: frontend/packages/openmates-cli/src/sdk.ts
      reason: Public npm SDK cleartext facades and internal encrypted transport helper cleanup.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Lower-level CLI client helper names and public export boundaries.
    - path: frontend/packages/openmates-cli/src/index.ts
      reason: Remove crypto payload builder exports from the public SDK entrypoint.
    - path: frontend/packages/openmates-cli/src/cli.ts
      reason: Keep CLI ask/export/import cleartext behavior aligned with SDK contracts.
    - path: frontend/packages/openmates-cli/tests/sdk-cleartext-boundary.test.ts
      reason: npm cleartext-in/out and encrypted-over-wire coverage.
    - path: packages/openmates-python/openmates/sdk.py
      reason: Public pip SDK cleartext facades and internal encrypted transport helper cleanup.
    - path: packages/openmates-python/tests/test_cleartext_boundary.py
      reason: pip cleartext-in/out and encrypted-over-wire coverage.
    - path: scripts/audit_sdk_cleartext_boundary.py
      reason: Deterministic guard against public encrypted payload/key leaks.
    - path: scripts/audit_sdk_cleartext_parity.py
      reason: Full public npm/pip SDK user-perspective parity audit.
    - path: scripts/verify_account_cleartext_export.py
      reason: Deterministic no-key cleartext export guard.
    - path: scripts/verify_account_cleartext_import.py
      reason: Deterministic cleartext import then encrypted storage guard.
    - path: backend/core/api/app/routes/user_tasks.py
      reason: Route names/models may need internal apply naming or first-party-only contract clarification.
    - path: backend/core/api/app/routes/user_plans.py
      reason: Route names/models may need internal apply naming or first-party-only contract clarification.
    - path: backend/core/api/app/routes/projects.py
      reason: Route names/models may need internal apply naming or first-party-only contract clarification.
    - path: docs/user-guide/developers/sdk.md
      reason: Public docs must show cleartext SDK examples only.
  verification_strategy:
    - Run red-phase deterministic audits/tests before implementation and record evidence.
    - Implement npm SDK cleartext facades and hidden encrypted transports.
    - Implement pip SDK cleartext facades and hidden encrypted transports.
    - Implement account export/import format guards and first CLI/SDK paths.
    - Run local unit/audit tests.
    - Restart affected API service if backend route policy/model changes are made, then run real dev API CLI/npm/pip smoke against https://api.dev.openmates.org.
  verification_order:
    - Direct REST/API route classification and first-party auth checks.
    - CLI cleartext ask/export/import smoke against dev API.
    - npm SDK cleartext tests and live smoke against dev API.
    - pip SDK cleartext tests and live smoke against dev API.
    - Deterministic parity and public encrypted API audits.
    - Account export/import fixture verifiers.

