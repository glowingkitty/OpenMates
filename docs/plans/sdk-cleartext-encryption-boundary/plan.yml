schema_version: 2
id: sdk-cleartext-encryption-boundary
title: SDK Cleartext Encryption Boundary
status: implementing

goal: >
  Make every public CLI, npm SDK, and pip SDK workspace data operation feel like
  ordinary cleartext product APIs while preserving client-side encrypted durable
  storage. Callers must never construct encrypted payloads, key wrappers, or key
  material manually; encryption and decryption happen automatically inside the
  first-party client. Account export/import must become a user-readable cleartext
  folder or password-encrypted zip format that never exports OpenMates user keys,
  object keys, or key wrappers.

scope:
  in:
    - Public CLI JSON output and public npm/pip SDK methods for chats, projects, tasks, plans, workflows, memories/settings, embeds, account export/import, and app skills expose cleartext user-facing fields where the caller owns the data.
    - All public npm/pip SDK methods accept cleartext inputs for user-facing private data and return cleartext outputs for user-facing private data.
    - Client-side encrypted storage payloads, encrypted_* field names, object keys, master keys, and key wrappers remain internal implementation details.
    - Existing first-party backend storage/apply endpoints may continue to accept encrypted payloads only from first-party clients, but public SDK methods must not expose those fields or names.
    - CLI/SDK account export writes a cleartext directory tree or a password-encrypted zip whose file contents are still cleartext user-readable documents/data.
    - Account export never includes account master keys, object keys, key wrappers, API-key wrapping material, or raw encrypted database backup rows.
    - Account import accepts the cleartext directory/zip format, decrypts zip files locally with a user-supplied password, and re-encrypts imported data with the destination account's current client-side keys before storage.
    - Deterministic audits fail when public npm and pip SDK surfaces drift from each other from a user perspective, allowing only TypeScript/Python naming idioms.
    - Deterministic audits fail when public SDK types, methods, docs, or examples expose encrypted payload construction or exported key material.
  out:
    - Removing client-side encryption from durable server storage.
    - Server-side durable plaintext storage of private user chat, project, task, plan, memory, workflow, or embed content.
    - Exporting OpenMates account master keys, object keys, key wrappers, or API-key wrapping material in any format.
    - Making archive zip passwords recoverable by OpenMates.
    - Apple implementation in the first slice, unless shared backend/API changes require native regression verification.
    - Team-shared collaborative export/import semantics beyond preserving owner-owned records and safe team metadata placeholders.

context_discovery:
  github_issues:
    - "GitHub MCP returned 401 bad credentials. gh issue list --search 'SDK cleartext encryption plans tasks projects' --limit 10 --state all returned no matching issues."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/sdk-cli-parity-v1/plan.yml
    - docs/plans/sdk-packages-v1/plan.yml
    - docs/plans/tasks-v1/plan.yml
    - docs/plans/plans-v1/plan.yml
    - docs/plans/unified-key-wrappers/plan.yml
    - docs/plans/account-export-v1/plan.yml
    - docs/plans/account-import-v1/plan.yml
  code_patterns:
    - frontend/packages/openmates-cli/src/cli.ts already keeps `openmates tasks|plans|projects ask` instruction-first and encrypts internally.
    - frontend/packages/openmates-cli/src/client.ts exposes lower-level ask/apply helpers with encryptedCreate and encryptedUpdate names.
    - frontend/packages/openmates-cli/src/sdk.ts exposes public npm SDK ask/create/update methods that still accept encrypted payload records for Plans and Projects.
    - packages/openmates-python/openmates/sdk.py exposes matching pip SDK ask/create/update methods with encrypted_create and encrypted_update arguments.
    - backend/core/api/app/routes/user_tasks.py, user_plans.py, and projects.py use `/ask/plan` for plaintext proposal generation and `/ask` for encrypted apply operations.
    - scripts/audit_sdk_cli_parity.py already checks selected CLI/npm/pip parity but does not yet audit the full SDK surface or encrypted-public-field leaks.
    - scripts/verify_account_export_archive.py currently treats encrypted archive records as expected backup content and must be superseded for user-facing account export/import.
  tests:
    - frontend/packages/openmates-cli/tests/sdk-workspace-history.test.ts currently asserts public SDK encryptedCreate behavior and must be replaced.
    - frontend/packages/openmates-cli/tests/workspace-history.test.ts currently asserts lower-level encrypted ask transport behavior.
    - frontend/packages/openmates-cli/tests/sdk-tasks.test.ts covers plaintext task create/update/list behavior.
    - frontend/packages/openmates-cli/tests/sdk-plans.test.ts covers Plan SDK facades but currently allows encrypted payloads.
    - packages/openmates-python/tests/test_sdk.py currently asserts public encrypted_create arguments.
    - packages/openmates-python/tests/test_plans.py covers Plan SDK facades.
    - backend/tests/test_user_tasks_api.py, test_user_plans_api.py, and project route tests cover encrypted storage endpoints.
  clarification_summary: >
    The user confirmed that public CLI/SDK functions must accept and return
    cleartext while encrypting/decrypting automatically in the background. The
    user also clarified that account export must never export user keys or raw
    encrypted key material; account export/import should use cleartext files, with
    optional password-encrypted zip wrapping only the archive container.

apple_impact:
  affected_files:
    - none for the first implementation slice
  parity_expectations:
    - Apple remains a first-party encrypted client and must preserve the same no-key-export invariant when native account export/import exists.
    - Shared backend route changes must not regress Apple session-auth or encrypted storage behavior.
  verification:
    - Apple not directly affected unless shared backend encryption/auth routes change beyond CLI/SDK/account export contracts.
  intentional_native_differences:
    - Native export/import UI can be designed later; this spec focuses on CLI/npm/pip and backend contracts.

