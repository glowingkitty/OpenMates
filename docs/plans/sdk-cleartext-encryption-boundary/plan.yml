risks:
  - Existing encrypted backup archives may no longer match the intended account export/import product contract and need a migration or explicit legacy import path.
  - Public SDK users might already rely on encryptedCreate-style methods before package publication; removing them is acceptable unless a concrete external compatibility need is identified.
  - Account cleartext export can expose sensitive private data on disk; password zip mode and warnings must make the responsibility explicit without exporting keys.
  - Deterministic parity audits can be noisy if they parse implementation details instead of explicit public surface manifests.

open_questions:
  - resolved: Public SDK and CLI APIs accept/return cleartext; no encrypted public exports are allowed.
  - resolved: Account export/import uses cleartext folder/zip content and never exports OpenMates keys or key wrappers.
  - resolved: Optional encrypted zip mode is password-based archive encryption only; OpenMates does not store or recover the password.
  - resolved: npm and pip parity must cover the full public SDK surface, not only projects, tasks, plans, or workflows.
