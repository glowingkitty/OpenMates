scenarios:
  - id: S-1
    title: npm SDK task ask is cleartext-only
    given:
      - Alice has an approved npm SDK API key with task read/write scopes.
    when:
      - Developer code calls `client.tasks.ask("Prepare launch copy", { projectId })`.
    then:
      - The method accepts only cleartext instruction and cleartext options.
      - The SDK builds any encrypted task create/update payload internally.
      - The returned task or tasks contain cleartext title, description, labels, and status.
      - The public TypeScript type does not expose encryptedCreate, encryptedUpdate, encrypted_*, key_wrappers, or key material.

  - id: S-2
    title: pip SDK plan ask is cleartext-only
    given:
      - Alice has an approved pip SDK API key with plan read/write scopes.
    when:
      - Developer code calls `client.plans.ask("Plan the launch", chat_id=chat_id)`.
    then:
      - The method accepts only cleartext instruction and cleartext options.
      - The SDK creates or updates encrypted plan records internally and creates needed chat/project wrappers internally.
      - The returned plan contains cleartext title, goal, summary, status, and safe link metadata.
      - The public Python signature does not expose encrypted_create, encrypted_update, encrypted_*, key_wrappers, or key material.

  - id: S-3
    title: Projects SDK methods hide project encryption
    given:
      - Alice owns an encrypted Project.
    when:
      - Developer code calls projects.list(), projects.ask(), projects.create(), or projects.update().
    then:
      - Inputs use cleartext name, description, icon, color, and status fields.
      - Outputs return cleartext project fields.
      - Stored project rows remain encrypted and do not durably store plaintext private project fields.

  - id: S-4
    title: Plans SDK section helpers are cleartext-first
    given:
      - Alice owns an encrypted Plan.
    when:
      - Developer code creates, updates, attaches, starts, edits checks, records check evidence, edits success criteria, edits learnings, or creates learning tasks.
    then:
      - Inputs and outputs use user-visible names such as title, goal, successCriteria, checks, evidence, and learnings.
      - SDK internals encrypt private strings and decrypt returned records.
      - No public helper requires encrypted_* fields or raw wrapper construction.

  - id: S-5
    title: Account export produces cleartext content without keys
    given:
      - Alice has chats, projects, tasks, plans, workflows, settings, and memories.
    when:
      - Alice runs CLI or SDK account export to a folder or zip.
    then:
      - The export contains user-readable cleartext files organized by resource type and nested folders where useful.
      - The export contains no account master keys, object keys, key wrappers, API-key wrapping material, encrypted_* storage rows, or raw encrypted database backup payloads.
      - If Alice requests a password-protected zip, the zip container is encrypted with Alice's supplied password and OpenMates does not store or log the password.

  - id: S-6
    title: Account import re-encrypts cleartext export content
    given:
      - Alice has a cleartext folder export or password-encrypted cleartext zip export.
    when:
      - Alice imports it into an OpenMates account through CLI or SDK.
    then:
      - The client reads cleartext locally and prompts for the zip password locally when needed.
      - The client encrypts imported private content with the destination account's current client-side keys before any durable server write.
      - The server never receives exported old keys and never persists plaintext private content.

  - id: S-7
    title: Full npm and pip SDK parity remains deterministic
    given:
      - The npm and pip SDKs expose public namespaces for account, chats, projects, tasks, plans, workflows, embeds, memories/settings, app skills, docs, billing-safe methods, notifications, reminders, teams, and export/import.
    when:
      - The SDK parity audit runs.
    then:
      - Every public npm SDK method has a pip equivalent or an explicit approved language/platform exclusion.
      - Every public pip SDK method has an npm equivalent or an explicit approved language/platform exclusion.
      - TypeScript camelCase and Python snake_case differences are accepted.
      - Public method option names are semantically equivalent.

  - id: S-8
    title: Storage and wire payloads remain encrypted behind cleartext APIs
    given:
      - Alice creates or edits private tasks, plans, projects, chats, memories, or embeds through public CLI or SDK calls.
    when:
      - Tests inspect intercepted HTTP request bodies and resulting Directus/API records.
    then:
      - Private durable fields are sent and stored as ciphertext storage fields.
      - Plaintext input strings are not present in durable storage payloads, history snapshots, logs, or exported backup metadata.
      - Public return values are decrypted cleartext objects.

  - id: S-9
    title: Public exports are cleartext while internal storage stays encrypted
    given:
      - Alice calls CLI JSON output, SDK return values, chat download, account export, or direct object export helpers.
    when:
      - Data leaves CLI internal storage, IndexedDB, SDK in-memory crypto internals, or backend durable storage.
    then:
      - User-facing output/export content is cleartext.
      - Internal CLI cache/IndexedDB-style local storage remains client-side encrypted where it persists private app state.
      - No exported file contains encrypted storage field names unless the file is explicitly a developer diagnostic with a no-private-data guard.

  - id: S-10
    title: Encrypted apply endpoints are not public SDK contracts
    given:
      - Backend storage endpoints still require client-side encrypted payloads for durable writes.
    when:
      - SDK docs, generated type declarations, package exports, and parity audits run.
    then:
      - Encrypted apply helper names are absent from public package exports and documentation.
      - Internal helpers are clearly named private/internal and not reachable through documented SDK namespaces.
      - API-key route policy continues to allow only approved first-party clients with proper scopes for encrypted storage routes.

