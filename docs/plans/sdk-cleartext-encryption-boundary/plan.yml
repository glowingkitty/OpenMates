decisions:
  - id: D-1
    status: active
    decision: Public CLI and SDK surfaces are cleartext-only from the caller's perspective.
    reason: Users should not notice client-side encryption or manually build encrypted payloads.
    decided_at: "2026-07-25"
  - id: D-2
    status: active
    decision: No OpenMates user keys, object keys, key wrappers, or API-key wrapping material may be exported.
    reason: Exported key material would turn account exports into portable decrypt authority and violate the user's security expectation.
    decided_at: "2026-07-25"
  - id: D-3
    status: active
    decision: Account export files are cleartext; optional zip password encryption protects the container only.
    reason: Export should be user-readable and portable while still allowing users to encrypt the archive at rest with their chosen password.
    decided_at: "2026-07-25"
  - id: D-4
    status: active
    decision: Backend encrypted storage/apply routes remain first-party/internal implementation details.
    reason: Durable storage still requires client-side encryption, but public SDK callers should not construct or see storage ciphertext fields.
    decided_at: "2026-07-25"
  - id: D-5
    status: active
    decision: npm and pip SDK parity must be audited for the full public SDK surface.
    reason: Developers should receive equivalent product behavior regardless of language, with only idiomatic naming differences.
    decided_at: "2026-07-25"

