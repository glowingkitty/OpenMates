schema_version: 2
id: two-branch-repository-invariant
title: Enforce a dev/main-only repository
status: implementing

goal: >
  Keep exactly two local and remote Git branches, dev and main. Agent work stays
  in detached managed worktrees; pre-deploy GitHub CI receives exact candidate
  source through private expiring artifacts rather than Git refs; repository
  ordinary automation cannot create any other branch; an administrator retains
  an explicit break-glass bypass; and every existing extra branch is recoverably
  archived and removed.

scope:
  in:
    - Replace codex/ci candidate branches with SHA-verified binary patch artifacts in private lifecycle-managed object storage.
    - Reconstruct and verify the exact deterministic candidate commit in detached state on GitHub-hosted runners.
    - Preserve reviewed stale-base deployment without a remote candidate ref.
    - Change release-version automation to commit directly to dev without a pull-request branch.
    - Disable Dependabot branch-producing updates while retaining deterministic vulnerability reporting.
    - Add local deterministic guards and a GitHub ruleset that reject routine branch creation outside dev and main while retaining an administrator break-glass bypass.
    - Back up, classify, and remove every existing local and remote branch except dev and main.
  out:
    - Removing or merging unresolved worktree changes.
    - Changing product behavior or product Specifications.
    - Replacing detached worktrees as the repository isolation mechanism.

approvals:
  specification:
    status: not_required
    approved_at: "2026-09-19T15:00:00Z"
    reason: Engineering repository workflow changes do not alter a user-facing product contract.
  plan:
    status: approved
    approved_at: "2026-09-19T15:00:00Z"
    reason: "The user explicitly approved the branchless transport, two-branch enforcement, and cleanup proposal and instructed implementation."

decisions:
  - id: D-1
    status: active
    decision: dev and main are the only permitted local or remote branches.
    reason: Worktree isolation makes per-task branches unnecessary and repository refs must remain comprehensible.
    decided_at: "2026-09-19T15:00:00Z"
  - id: D-2
    status: active
    decision: Candidate source moves as a private expiring binary patch bound to base SHA, patch SHA-256, tree SHA, and deterministic candidate SHA.
    reason: GitHub-hosted runners need candidate bytes, but transport does not require a branch or any persistent Git ref.
    decided_at: "2026-09-19T15:00:00Z"
  - id: D-3
    status: active
    decision: Detached worktrees remain the only agent workspace mechanism.
    reason: They isolate indexes and files without adding branches.
    decided_at: "2026-09-19T15:00:00Z"
  - id: D-4
    status: active
    decision: Existing extra refs are archived to an external Git bundle and manifest before exact-SHA deletion.
    reason: Cleanup must be reversible without retaining repository branches.
    decided_at: "2026-09-19T15:00:00Z"
  - id: D-5
    status: active
    decision: The branch-creation ruleset has an administrator break-glass bypass, while automatic version advancement uses the repository's sole write deploy key to push only dev through its protection ruleset.
    reason: Recovery must remain possible without granting the ordinary GitHub Actions token or other automation a protected-branch bypass.
    decided_at: "2026-09-19T16:00:37Z"

scenarios:
  - id: S-1
    title: A dirty detached worktree runs isolated GitHub CI without a branch
    given:
      - A managed detached worktree contains reviewed source changes.
    when:
      - The session publishes and submits an isolated CI candidate.
    then:
      - No local or remote branch is created.
      - A private expiring artifact carries a binary patch and immutable identity metadata.
      - The runner checks out the reachable base, verifies the patch, reconstructs the exact candidate commit, and tests that detached commit.
  - id: S-2
    title: Repository automation updates dev without an intermediate branch
    given:
      - A release version or vetted dependency update is ready.
    when:
      - Automation applies the change.
    then:
      - It commits through the existing dev integration path or pushes only dev.
      - No Dependabot, automation, hotfix, or candidate branch is created.
  - id: S-3
    title: Routine attempts to create a third branch are rejected
    given:
      - The repository contains only dev and main.
    when:
      - A user, agent, GitHub Action, or app without the administrator break-glass role attempts to create another branch.
    then:
      - Local deterministic guards reject the command before push where applicable.
      - GitHub rejects remote branch creation through an active ruleset.
      - A repository audit reports any invariant violation.
      - An administrator can deliberately bypass the rule for recovery and must return the repository to dev and main afterward.
  - id: S-4
    title: Existing branch clutter is removed without losing recoverability
    given:
      - Extra local and remote branches have been inventoried.
    when:
      - Cleanup runs after branchless transport and enforcement are active.
    then:
      - An external bundle and exact ref-to-SHA manifest exist.
      - Open PR heads and unmerged local work are explicitly resolved or archived.
      - Local and remote branch inventories contain exactly dev and main.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Candidate publication and dispatch contain no push or remote refs/heads operation and runner verification rejects altered patch, base, tree, or candidate identity.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-CI-SOURCE, T-CI-DISPATCH, T-CI-WORKFLOW]
  - id: AC-2
    scenario: S-1
    text: Reviewed candidate deployment validates the retained local candidate manifest and bytes without requiring origin/codex/ci.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-REVIEWED-DEPLOY]
  - id: AC-3
    scenario: S-2
    text: Version advancement and dependency policy cannot create pull-request branches and continue to preserve required checks and security reporting.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-AUTOMATION, T-DEPENDENCY]
  - id: AC-4
    scenario: S-3
    text: Tooling tests reject any scripted branch-producing push outside dev/main and the active GitHub ruleset restricts other branch creation with an administrator-only break-glass bypass.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-BRANCH-GUARD, T-RULESET]
  - id: AC-5
    scenario: S-4
    text: A verified external rollback bundle and manifest precede deletion, and authoritative local and remote inventories end with exactly dev and main.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-CLEANUP]

tests:
  - id: T-CI-SOURCE
    type: pytest
    file: scripts/tests/test_ci_source.py
    command: python3 -m pytest scripts/tests/test_ci_source.py
    assertions:
      - Publishing a dirty detached worktree creates a private candidate artifact and no Git branch or push.
    covers: [AC-1]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CI-DISPATCH
    type: pytest
    file: scripts/tests/test_ci_dispatch.py
    command: python3 -m pytest scripts/tests/test_ci_dispatch.py scripts/tests/test_ci_coordinator.py
    assertions:
      - Dispatch persists and forwards the base, tree, digest, owner, and expiring artifact URL as one immutable candidate identity.
    covers: [AC-1]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CI-WORKFLOW
    type: pytest
    file: scripts/tests/test_ci_workflow_scope.py
    command: python3 -m pytest scripts/tests/test_ci_workflow_scope.py
    assertions:
      - The isolated runner verifies the artifact digest and reconstructs the expected detached commit before tests run.
    covers: [AC-1]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-REVIEWED-DEPLOY
    type: pytest
    file: scripts/tests/test_reviewed_deploy.py
    command: python3 -m pytest scripts/tests/test_reviewed_deploy.py
    assertions:
      - Reviewed deployment authenticates the retained local manifest and patch without a remote candidate ref.
    covers: [AC-2]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-AUTOMATION
    type: pytest
    file: scripts/tests/test_advance_dev_version_workflow.py
    command: python3 -m pytest scripts/tests/test_advance_dev_version_workflow.py
    assertions:
      - Version advancement writes only to dev with a dedicated repository deploy key and cannot create an automation branch or pull request.
    covers: [AC-3]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-DEPENDENCY
    type: pytest
    file: scripts/tests/test_dependency_update_policy.py
    command: python3 -m pytest scripts/tests/test_dependency_update_policy.py
    assertions:
      - Dependabot version-update pull requests are disabled while vulnerability scanning remains configured externally.
    covers: [AC-3]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-BRANCH-GUARD
    type: pytest
    file: scripts/tests/test_branch_invariant.py
    command: python3 -m pytest scripts/tests/test_branch_invariant.py
    assertions:
      - Local command guards and repository audits reject creation or publication of branches other than dev and main.
    covers: [AC-4]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-RULESET
    type: manual
    command: gh api repos/glowingkitty/OpenMates/rulesets
    assertions:
      - An active GitHub ruleset restricts creation of every branch except dev and main for ordinary actors and retains only an administrator break-glass bypass.
    covers: [AC-4]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-CLEANUP
    type: manual
    command: git ls-remote --heads origin
    assertions:
      - A verified external bundle and manifest exist and authoritative local and remote branch inventories contain only dev and main.
    covers: [AC-5]
    red_phase: {required: false, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}

