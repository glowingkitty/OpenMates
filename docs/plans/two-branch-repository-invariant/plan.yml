  - id: TASK-1
    title: Replace branch-based candidate transport
    status: done
    phase: complete
    covers: {scenarios: [S-1], acceptance_criteria: [AC-1, AC-2]}
    expected_files: [scripts/ci_source.py, scripts/ci_dispatch.py, scripts/ci_queue.py, scripts/reviewed_deploy.py, .github/workflows/isolated-tests.yml]
    verification_ids: [T-CI-SOURCE, T-CI-DISPATCH, T-CI-WORKFLOW, T-REVIEWED-DEPLOY]
    dependencies: []
    blockers: []
    follow_up_tasks: [TASK-2]
    ownership: {files: [scripts, .github/workflows/isolated-tests.yml], shared_files: []}
  - id: TASK-2
    title: Enforce the two-branch invariant
    status: done
    phase: complete
    covers: {scenarios: [S-2, S-3], acceptance_criteria: [AC-3, AC-4]}
    expected_files: [.github/workflows/advance-dev-version.yml, .github/dependabot.yml, .claude/hooks/bash-guard.sh, scripts/branch_invariant.py]
    verification_ids: [T-AUTOMATION, T-DEPENDENCY, T-BRANCH-GUARD, T-RULESET]
    dependencies: [TASK-1]
    blockers: []
    follow_up_tasks: [TASK-3]
    ownership: {files: [.github, .claude/hooks, scripts/branch_invariant.py], shared_files: []}
  - id: TASK-3
    title: Archive and remove legacy branches
    status: done
    phase: complete
    covers: {scenarios: [S-4], acceptance_criteria: [AC-5]}
    expected_files: [scripts/branch_invariant.py]
