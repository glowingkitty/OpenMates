verification:
  required:
    - python3 scripts/plan_validate.py docs/plans/two-branch-repository-invariant/plan.yml
    - python3 -m pytest scripts/tests/test_ci_source.py scripts/tests/test_ci_dispatch.py scripts/tests/test_ci_coordinator.py scripts/tests/test_reviewed_deploy.py scripts/tests/test_advance_dev_version_workflow.py scripts/tests/test_dependency_update_policy.py
    - python3 scripts/sync_agent_parity.py --check
    - python3 scripts/audit_agent_tooling_parity.py
    - python3 scripts/codex_cached_context.py doctor --repository /home/superdev/projects/OpenMates --thread 01a0ba14-f844-7e00-a653-d9bbbe425b2a
    - Authoritative git ls-remote and local refs show only refs/heads/dev and refs/heads/main after cleanup.
  not_required:
    - Product browser E2E because this changes engineering transport and repository automation rather than product behavior.

rollout:
  - Implement and locally verify branchless candidate creation, runner reconstruction, and reviewed deployment.
  - Deploy the branchless transport and automation changes to dev.
  - Disable branch-producing Dependabot settings and activate the dev/main-only GitHub ruleset.
  - Create and verify the external rollback bundle and exact deletion manifest.
  - Resolve open PR heads and branch-attached legacy worktrees, then delete every extra remote and local branch.
  - Verify the invariant and retain the rollback artifact location in the implementation report.

rollback:
  - Restore deleted refs from the external bundle only for recovery, then integrate needed commits into dev and delete the temporary recovery refs again.
  - Revert the code commit on dev if artifact transport fails before cleanup.
  - Disable the GitHub ruleset temporarily only for an explicitly reviewed recovery operation.

