- Relevant REST/CLI/npm/pip/browser E2E coverage through isolated GitHub CI; real inference on dev only.
- Real multi-message CLI learning chat and same-article cache reuse.
- Web preview and laptop/mobile rendering/action verification.
- Apple handoff tied to the final deployed dev commit; native compile and interaction checks assigned to the Mac agent.
