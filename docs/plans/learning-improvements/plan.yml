scope:
  in:
  - Canonical wiki label validation.
  - Public-only GPT-OSS 120B learning bundles, 24-hour Redis cache with miss coalescing and bounded authenticated
    generation.
  - Existing CLI chat validation and npm/pip Wikipedia learning API access, optional Study goal difficulty.
  - Web fullscreen related links, preserve-draft send to originating chat and encrypted deduplicated Study save.
  - Strengthened learning follow-ups and phased Learn topic/Test knowledge with learner evidence.
  - "Apple handoff prompt for the user\u2019s Mac agent, based on the deployed dev commit."
  - User-approved wiki search and wiki show commands; show mirrors fullscreen article content, related articles
    and questions.
  out:
  - Production rollout or TestFlight release.
  - New memory permission or encryption protocol.
  - New mastery scoring or arbitrary phase graphs.
  - Socratic and Code Learn by building phase conversion in the initial release.
  - Apple implementation or release in this Linux session; user requested a Mac-agent handoff.
delivery_sequence:
- backend and CLI/SDK implementation plus required isolated CI
- scoped dev deploy and real CLI/SDK AI evidence
- web implementation, component and browser CI, dev deploy and laptop/mobile smoke
- Prepare a self-contained Apple implementation/test handoff with deployed source commit and web evidence.
