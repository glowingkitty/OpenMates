  then:
  - One encrypted interest is saved or one message sends in the original chat, preserving drafts and teaching
    state.
- id: S-2
  title: Tutor with evidence and no answer leaks
  given:
  - A learner practices in an active Study focus.
  when:
  - The tutor evaluates an attempt and creates follow-ups.
  then:
  - Hints preserve unanswered exercises and progression follows learner evidence.
