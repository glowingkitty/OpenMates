assumptions:
  - id: A-1
    text: New-chat draft markdown and preview remain directly encrypted with the account master key using Format D.
    category: encryption
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/core/encryption-code-inventory.md
        summary: draftSave.ts uses encryptWithMasterKey for encrypted_draft_md and encrypted_draft_preview with no chat-key involvement.
  - id: A-2
    text: Chat.updated_at represents the latest successful local or synchronized draft save without changing message-only ordering.
    category: data
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/services/drafts/draftSave.ts
        summary: Successful draft persistence writes updated_at; draftWebsocket applies synchronized update time while intentionally preserving last_edited_overall_timestamp ordering.
  - id: A-3
    text: Existing update_draft, delete_draft, draft_update_receipt, draft_deleted, and draft_v reconciliation already satisfy the encrypted cross-device transport contract.
    category: sync
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/plans/cross-client-draft-apple-parity/plan.yml
        summary: The existing protocol and cross-client lifecycle are verified; this spec changes only presentation and activation semantics.

contracts:
  api:
    - surface: Existing authenticated draft WebSocket events; no endpoint or payload change.
      access_model: first-party client surface only
      auth: Authenticated account/device WebSocket session required.
      rate_limits: Existing WebSocket and draft autosave limits remain unchanged.
      credit_budget: No credit charge or inference budget applies to draft save or clear.
      encryption_boundary: Server receives Format-D ciphertext and version metadata only; draft plaintext remains client-side.
    - surface: Existing authenticated draft REST read endpoints; no endpoint or payload change.
      access_model: first-party client surface only
      auth: Authenticated owner session required.
      rate_limits: Existing route limits remain unchanged.
      credit_budget: No credits charged.
      encryption_boundary: Responses expose ciphertext transport fields; clients decrypt locally.
  data:
    - A draft-only chat has non-empty encrypted draft content, no sent messages, and no generated title metadata.
    - Empty temporary shells are not active, routable, visible, or navigable draft chats.
    - updated_at is the draft saved-time source; last_edited_overall_timestamp remains message-only ordering state.
    - Draft-only header plaintext exists only in transient decrypted UI/cache state.
    - The same UUID survives first autosave, navigation, reload, sync, and first send.
  ui_states:
    - Blank welcome composer at / with no header and no active-draft New Chat control.
    - Persisting first draft with no saved-state claim until success.
    - Active draft-only header with icon, badge, preview title, and Last saved.
    - Failed update retaining last successful header values.
    - Normal new-chat processing after send on the same route.
    - Cleared draft returning to focused blank welcome state.
    - Established chat with draft and unchanged established header.
  privacy_security:
    - Never log draft plaintext, preview plaintext, master keys, chat keys, or encrypted payload bodies.
    - Route and test diagnostics may record only UUIDs, versions, lengths, timestamps, and boolean state.
    - Existing owner-scoped first-party draft access remains unchanged.
    - Incognito drafts remain outside durable persistence and cross-device sync.

phase_gates:
  api_websocket:
    status: not_applicable
    reason: No backend endpoint, event, auth, rate-limit, budget, or encryption-boundary behavior changes; existing verified protocol is reused unchanged.
  cli:
    status: not_applicable
    reason: No CLI command or mutation contract changes; CLI-created drafts already use the shared UUID and encrypted protocol.
  sdk:
    status: not_applicable
    reason: npm and pip remain read-only for draft transport and require no API change.
  web:
    status: pending
    reason: This is the authoritative implementation surface for activation, routing, header, navigation, and clear behavior.
  visual_smoke:
    status: pending
    reason: Draft header and composer control visibility require reviewed laptop and mobile screenshots.
  user_confirmation:
    status: pending
    reason: User confirmation of deployed web behavior is required before Apple parity.
  apple:
    status: pending
    reason: Native draft-only header parity follows confirmed deployed web behavior.

