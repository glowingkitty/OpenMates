decisions:
  - id: D-1
    status: active
    decision: Reuse #chat-id=<UUID> for draft-only and sent states.
    reason: The persisted draft shell is already a chat identity; a parallel draft route would duplicate routing and restoration logic.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: active
    decision: Activate draft-only UI only after successful persistence, not on focus or raw typing.
    reason: Header, route, and Last saved must never claim persistence that failed.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: active
    decision: Derive draft-only state from non-empty persisted draft fields plus absence of sent messages/generated metadata.
    reason: One shared predicate prevents empty shells and established-chat drafts from entering draft-only presentation.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-4
    status: active
    decision: Use Chat.updated_at as the successful draft-save timestamp while last_edited_overall_timestamp remains message-only sorting state.
    reason: Existing draft save and sync handlers already update updated_at without perturbing chronological message ordering.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-5
    status: active
    decision: Keep established-chat headers unchanged even when a draft exists.
    reason: The user limited the new presentation to chats with no sent messages.
    decided_at: "2026-08-04T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-2
