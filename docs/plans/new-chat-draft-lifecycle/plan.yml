schema_version: 2
id: new-chat-draft-lifecycle
title: Navigable New-Chat Draft Lifecycle
status: approved

goal: >
  Treat a successfully persisted new-chat draft as an active, navigable draft-only
  chat with an explicit draft header, while preserving one chat ID through save,
  navigation, reload, cross-device sync, send, and clear.

scope:
  in:
    - Activate a new-chat draft-only shell only after its first non-empty draft save succeeds.
    - Use the existing #chat-id=<UUID> route for active draft-only chats.
    - Show a draft-only chat header with the canonical idea/draft icon, Draft badge, saved preview title, and localized relative Last saved time.
    - Refresh the draft header title and saved time after every successful local or synchronized draft update.
    - Show the existing New Chat composer control while a draft-only chat is active.
    - Keep draft-only chats in sidebar, landing resume cards, search, and chronological ChatHeader previous/next navigation.
    - Preserve the same chat ID and route when the first message is sent and draft presentation transitions to normal new-chat processing.
    - Delete an emptied draft-only shell, return to the focused blank welcome composer at /, and prevent late saves or sync events from recreating it.
    - Preserve existing-chat title, icon, summary, timestamp, and header behavior when an established chat has an unsent draft.
    - Add web unit, deployed Playwright, cross-device, visual-smoke, and Apple parity coverage in the required phase order.
  out:
    - Changing Format-D encryption, draft_v conflict resolution, or the update_draft/delete_draft protocol.
    - Adding #draft-id routing or changing a draft chat ID when it is sent.
    - Changing the visual header of chats that already contain sent messages.
    - Persisting whitespace-only or structurally empty editor content as a draft-only chat.
    - Persisting incognito drafts.
    - Exposing interactive draft mutation through public CLI or SDK APIs.

context_discovery:
  github_issues:
    - "gh issue search for draft chat header navigation returned no matching issue; GitHub MCP authentication returned 401."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/cross-client-draft-apple-parity/plan.yml
    - docs/architecture/core/client-side-encryption.md
    - docs/architecture/core/encryption-formats.md
    - docs/architecture/messaging/message-input-field.md
  code_patterns:
    - frontend/packages/ui/src/services/drafts/draftSave.ts persists Format-D draft markdown and preview, creates the UUID draft-only shell, and updates draftEditorUIState.
    - frontend/packages/ui/src/services/drafts/draftWebsocket.ts applies synchronized draft ciphertext and updated_at without changing message-only sort timestamps.
    - frontend/packages/ui/src/components/chats/Chat.svelte already renders a dedicated draft-only sidebar row.
    - frontend/packages/ui/src/components/ActiveChat.svelte already renders draft-only landing resume cards and restores draft-only hash routes.
    - frontend/packages/ui/src/stores/chatNavigationStore.ts currently excludes inactive draft-only chats after commit fb23f950d.
    - frontend/packages/ui/src/components/ChatHistory.svelte and ChatHeader.svelte own active header visibility and rendering.
    - apple/OpenMates/Sources/Core/Services/DraftService.swift exposes synchronized draft previews.
    - apple/OpenMates/Sources/Features/Chat/Views/ChatHeaderView.swift is the native compact chat-header counterpart.
  tests:
    - frontend/packages/ui/src/services/drafts/__tests__/draftSave.test.ts
    - frontend/packages/ui/src/stores/__tests__/chatNavigationStore.spec.ts
    - frontend/apps/web_app/tests/stop-new-chat-draft.spec.ts
    - frontend/apps/web_app/tests/cross-client-draft-sync.spec.ts
    - frontend/apps/web_app/tests/chat-header-navigation-order.spec.ts
    - apple/OpenMatesTests/DraftSyncParityTests.swift
    - apple/OpenMatesUITests/ChatFlowParityUITests.swift

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Core/Services/DraftService.swift
    - apple/OpenMates/Sources/Features/Chat/Views/ChatHeaderView.swift
    - apple/OpenMates/Sources/Features/Chat/Views/ChatView.swift
    - apple/OpenMatesTests/DraftSyncParityTests.swift
    - apple/OpenMatesUITests/ChatFlowParityUITests.swift
  parity_expectations:
    - After deployed web behavior and user confirmation, Apple draft-only chats use the same stable chat ID, draft preview title, Draft badge, canonical draft icon, and relative saved time.
    - Existing-chat headers remain unchanged when those chats contain drafts.
    - Apple continues to store and transmit only Format-D ciphertext outside transient editor memory.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py test-ios --simulator "iPhone 17" --only-testing "OpenMatesTests/DraftSyncParityTests"
    - python3 scripts/apple_remote.py test-ios --simulator "iPhone 17" --only-testing "OpenMatesUITests/ChatFlowParityUITests"
  intentional_native_differences:
    - Apple uses its compact native chat-header composition and native relative-date formatting while matching the visible information hierarchy and state transitions.

clarification:
  rounds:
    - question: Should draft-only chats remain discoverable outside the active composer?
      answer: Yes. They already appear in the sidebar and Continue where you left off and must remain there.
    - question: Should active drafts use #draft-id or the existing chat route?
      answer: Use #chat-id=<draft UUID> so save, reload, navigation, and send retain one identity.
    - question: What should the draft-only header show?
      answer: A canonical idea/draft icon, Draft badge, live saved preview title, and localized relative Last saved time, with no generated category, mate profile, or summary.
    - question: Does draft presentation apply to established chats with messages?
      answer: No. Existing-chat headers remain completely unchanged.
    - question: What happens when the active new-chat draft is cleared?
      answer: Delete the shell, return to /, hide the header and New Chat control, and preserve composer focus.
  vision_summary: >
    A non-empty new-chat composer remains an uncommitted welcome state until its
    first successful autosave. The acknowledged draft-only shell then becomes a
    normal navigable chat route with explicit draft presentation. Every successful
    save updates the preview and saved time; send promotes the same ID, while clear
    removes it and returns to the focused blank welcome composer.
  approved_by_user: true

