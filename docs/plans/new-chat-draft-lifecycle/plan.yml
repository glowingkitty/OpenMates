scenarios:
  - id: S-1
    title: First successful save activates a draft-only chat
    given:
      - An authenticated user is on the blank welcome composer at /.
      - No chat exists for the empty composer.
    when:
      - The user types "Plan a weekend cycling route around Berlin" and the first autosave succeeds.
    then:
      - One UUID draft-only chat is persisted with encrypted markdown and preview.
      - The active route becomes #chat-id=<UUID> using history replacement.
      - The header and New Chat control appear only after persistence succeeds.
      - Sidebar, landing resume cards, search, reload, and cross-device sync refer to the same UUID.

  - id: S-2
    title: Draft header reflects acknowledged content and time
    given:
      - A draft-only chat is active.
    when:
      - The user saves a second revision "Plan a weekend cycling route around Berlin with lakes".
    then:
      - The header shows the canonical draft icon and Draft badge.
      - The header title updates to the saved preview, visually truncated as needed.
      - Last saved uses the successful updated_at value and a localized relative date.
      - A failed later save leaves the last successful title and time visible.

  - id: S-3
    title: Draft-only chats participate in header navigation
    given:
      - The sorted user list contains a regular chat, a draft-only chat, and an older regular chat.
    when:
      - The user uses ChatHeader previous or next controls from any of those chats.
    then:
      - The draft-only chat is a normal chronological target.
      - Empty metadata-less shells and hidden candidates remain excluded.
      - Navigation works while the sidebar is closed and after cold boot.

  - id: S-4
    title: Sending promotes the same draft shell
    given:
      - A draft-only chat is active at #chat-id=<UUID>.
    when:
      - The user sends the saved draft.
    then:
      - The same UUID and route remain active.
      - Draft badge, draft icon, and Last saved presentation disappear.
      - Normal Creating new chat processing and generated metadata presentation take over.

  - id: S-5
    title: Clearing removes an active draft-only shell
    given:
      - A draft-only chat is active and contains no sent messages.
    when:
      - The user clears the composer and deletion succeeds.
    then:
      - The shell is removed locally and through the existing synchronized deletion contract.
      - The route returns to / using history replacement.
      - Header and New Chat control disappear.
      - The blank welcome composer remains focused.
      - Late save receipts or sync events do not recreate or reopen the deleted shell.

  - id: S-6
    title: Existing-chat drafts do not alter established headers
    given:
      - A chat has sent messages and generated title, icon, category, and summary.
    when:
      - The user types or saves an unsent draft in that chat.
    then:
      - The established title, icon, category, summary, route, and header timestamp remain unchanged.
      - Existing sidebar draft preview behavior remains unchanged.

  - id: S-7
    title: Synchronized draft updates refresh active presentation
    given:
      - The same draft-only chat is active in web and edited by another authenticated client.
    when:
      - Web receives a newer encrypted draft update.
    then:
      - Web decrypts inside the client boundary and updates the header preview and Last saved time.
      - No draft plaintext enters server logs, analytics, or durable unencrypted storage.

  - id: S-8
    title: Late first-save activation preserves newer navigation
    given:
      - A new-chat draft is being persisted for the first time.
      - The user explicitly selects a different saved chat before draft activation finishes.
    when:
      - The delayed persisted-draft activation signal arrives.
    then:
      - The explicitly selected saved chat remains active in the route, sidebar, and rendered chat surface.
      - The draft-only chat remains persisted and navigable but does not reopen itself.

