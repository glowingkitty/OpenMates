risks:
  - id: R-1
    risk: A late autosave acknowledgement recreates a draft shell after the user cleared it.
    mitigation: Bind save results to the active draft revision/generation and test clear during an in-flight save.
  - id: R-2
    risk: Existing-chat drafts accidentally enter draft-only header mode.
    mitigation: Use one predicate requiring no sent messages and no generated title metadata, with explicit regression coverage.
  - id: R-3
    risk: Route activation before persistence reports a draft that cannot be restored.
    mitigation: Publish active chat ID and replace history only after local persistence succeeds.
  - id: R-4
    risk: Relative time or preview updates cause broad render/decrypt churn.
    mitigation: Reuse decrypted preview cache and update only the active draft header from local/sync draft events.

