implementation_notes:
  plan_path: docs/plans/new-chat-draft-lifecycle/plan.yml
  existing_patterns:
    - draftSave.ts already creates and persists the UUID shell before publishing draft UI state.
    - draftWebsocket.ts already applies newer encrypted revisions and updated_at without changing message-only ordering.
    - ActiveChat already restores draft-only hash routes and supplies decrypted draft preview data for landing resume cards.
    - Chat.svelte already defines the sidebar draft-only visual hierarchy and canonical Draft translation.
    - ChatHeader already supports badge, icon, title, relative timestamp, and previous/next composition for other chat kinds.
    - chatNavigationStore already filters empty/hidden shells and only needs draft fields restored to the normal eligibility predicate.
    - The verified cross-client draft spec remains the transport and encryption source of truth.
  architecture: >
    Add one reusable draft-only predicate over persisted Chat fields and pass an
    explicit draft presentation model from ActiveChat through ChatHistory into
    ChatHeader. Keep save, sync, and clear side effects in existing draft services;
    publish the newly persisted shell ID through draftEditorUIState only after a
    successful first save so ActiveChat can select the normal chat route. Use
    updated_at as presentation time, preserve last_edited_overall_timestamp for
    existing ordering, and guard asynchronous save/delete results with the current
    chat ID/revision so stale completions cannot reopen a cleared shell.
  data_flow:
    - The blank composer receives non-empty canonical content but remains at / until draftSave persists encrypted markdown/preview for UUID 11111111-1111-4111-8111-111111111111.
    - After local persistence succeeds, draftEditorUIState publishes that UUID; ActiveChat loads the persisted shell and replaces the hash with #chat-id=11111111-1111-4111-8111-111111111111.
    - ActiveChat derives draft-only state, decrypts/caches preview inside the client, and passes preview plus updated_at to ChatHistory and ChatHeader.
    - A later successful local or synchronized revision updates encrypted fields, draft_v, updated_at, cache preview, and active header presentation.
    - Header navigation includes the shell in the existing sorted list and selects it through the same chatHeaderNavigation event as regular chats.
    - Send reuses the UUID and changes the derived predicate once a user message exists, allowing the normal processing header to replace draft presentation.
    - Clear/delete invalidates the shell generation, removes local/cache/server discovery, replaces the hash with /, and focuses the blank composer; stale completions are ignored.
  affected_files:
    - { path: frontend/packages/ui/src/utils/chatDraftState.ts, reason: Shared persisted draft-only predicate and presentation helpers if no existing reusable utility fits }
    - { path: frontend/packages/ui/src/services/drafts/draftSave.ts, reason: Publish activation only after successful persistence and guard stale save completion }
    - { path: frontend/packages/ui/src/services/drafts/draftState.ts, reason: Carry saved shell ID/revision presentation state without a parallel route type }
    - { path: frontend/packages/ui/src/services/drafts/draftWebsocket.ts, reason: Refresh active draft presentation timestamp/preview from synchronized revisions }
    - { path: frontend/packages/ui/src/stores/chatNavigationStore.ts, reason: Restore draft-only chats as normal chronological targets }
    - { path: frontend/packages/ui/src/components/ActiveChat.svelte, reason: Select persisted draft route, derive draft-only presentation, and reset route/focus on clear }
    - { path: frontend/packages/ui/src/components/ChatHistory.svelte, reason: Show the header for draft-only chats and pass explicit draft props }
    - { path: frontend/packages/ui/src/components/ChatHeader.svelte, reason: Render canonical draft icon, badge, preview title, and Last saved time }
    - { path: frontend/packages/ui/src/services/drafts/__tests__/draftSave.test.ts, reason: Test successful activation and stale-clear guards }
    - { path: frontend/packages/ui/src/stores/__tests__/chatNavigationStore.spec.ts, reason: Test draft-only chronological navigation }
    - { path: frontend/apps/web_app/tests/stop-new-chat-draft.spec.ts, reason: Focused new-chat draft activation/send/clear/established-header lifecycle }
    - { path: frontend/apps/web_app/tests/cross-client-draft-sync.spec.ts, reason: Synchronized header update and deletion behavior }
    - { path: frontend/apps/web_app/tests/chat-header-navigation-order.spec.ts, reason: Deployed sidebar-closed regular-to-draft navigation }
    - { path: apple/OpenMates/Sources/Core/Services/DraftService.swift, reason: Expose native presentation revision time after web confirmation }
    - { path: apple/OpenMates/Sources/Features/Chat/Views/ChatHeaderView.swift, reason: Native draft-only header parity after web confirmation }
  api_data_ui_privacy_impact:
    - API/WebSocket payloads, access control, rate limits, and credit behavior are unchanged.
    - Data uses existing encrypted fields, draft_v, UUID, and updated_at; no migration or backfill is required.
    - UI adds an explicit draft-only header state and restores draft navigation; established chats are unchanged.
    - Plaintext preview remains transient inside authenticated clients and is excluded from diagnostics.
  migration_rollout:
    - No schema migration or backfill.
    - Existing persisted draft-only shells become navigable and gain header presentation immediately after deployment.
    - Roll out web first, inspect deployed laptop/mobile behavior, obtain user confirmation, then implement Apple parity.
  observability:
    - Reuse existing draft service logs with chat ID, draft_v, timestamp, and boolean fields only.
    - Do not add plaintext preview/title logging.
    - Playwright diagnostics may record route, test IDs, timestamp attributes, and encrypted-field presence only.
  assumptions_to_verify:
    - A-1 is confirmed by encryption inventory and must remain unchanged.
    - A-2 is confirmed by draftSave/draftWebsocket and will be protected by tests.
    - A-3 is confirmed by the verified cross-client spec; no backend phase is required.
  acceptance_coverage:
    - { acceptance_criterion: AC-1, verification_ids: [T-VITEST-002, T-E2E-001] }
    - { acceptance_criterion: AC-2, verification_ids: [T-E2E-001, V-UI-VISUAL-SMOKE] }
    - { acceptance_criterion: AC-3, verification_ids: [T-VITEST-001, T-E2E-003] }
    - { acceptance_criterion: AC-4, verification_ids: [T-E2E-001] }
    - { acceptance_criterion: AC-5, verification_ids: [T-VITEST-002, T-E2E-001, T-E2E-002] }
    - { acceptance_criterion: AC-6, verification_ids: [T-E2E-001] }
    - { acceptance_criterion: AC-7, verification_ids: [T-E2E-002] }
    - { acceptance_criterion: AC-8, verification_ids: [V-USER-CONFIRMATION, T-APPLE-001, T-APPLE-002] }
  verification_strategy:
    - Validate the spec before test or source edits.
    - Change unit and deployed Playwright assertions first and record expected red evidence against pre-implementation dev.
    - Run Vitest only through python3 scripts/tests.py run --suite vitest.
    - Deploy scoped web changes before commit-pinned Playwright green runs.
    - Run stop-new-chat-draft, chat-header-navigation-order, then cross-client-draft-sync.
    - Capture and inspect laptop/mobile Playwright visual smoke for / and the active draft route.
    - Obtain user confirmation of deployed web behavior and visuals.
    - Implement and remotely verify Apple parity only after user confirmation.
    - Run spec_verify after all required evidence is recorded.
  verification_order:
    - Spec validation and red unit contracts
    - Deployed web Playwright red evidence
    - Web implementation and Vitest green
    - Deployed focused lifecycle and navigation Playwright green
    - Deployed cross-client Playwright green
    - Reviewed laptop/mobile visual smoke
    - User confirmation
    - Apple unit/UI parity and remote verification
    - Final spec verification
  separate_technical_approval_required: false
  separate_technical_approval_reason: The plan reuses approved existing persistence, routing, encryption, and sync architecture without a new security, migration, rollout, or dependency decision.

