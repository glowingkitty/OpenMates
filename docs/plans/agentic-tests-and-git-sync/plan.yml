schema_version: 2
profile: concise
id: agentic-tests-and-git-sync
title: Agentic coding - recorded test results, Git repository sync and the two acceptance flows
status: draft
goal: >-
  Get the agentic coding setup properly working and tested for two user flows:
  a user asks for a simple recipe web app and gets a new Project with the app,
  tests and commits; a user asks for a feature in a connected remote repository
  and the assistant searches, edits, tests and commits there. Tests must record
  what happened (video for browser tests, a terminal timeline for command-line
  tests), and a Project must be linkable to a real Git repository such as GitHub.

