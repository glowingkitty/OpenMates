checks:
  - Backend pytest for the test run contract, revision identity and artifact allowlist (T1).
  - Recorder unit tests with a fixed sample app - identical steps and identical preview frame on repeated runs (T2, T3).
  - Rust core tests for the test result embed model and the CLI rendering (T4).
  - Component preview and one web E2E spec for the test result embed (T5).
  - A1 and A2 green in isolated CI for the exact deployed commit, with the latest successful recording per flow.
  - Live inference parts run only on dev in disposable Projects with default routing.

risks:
  - Whether git commit works under the remote confinement is untested (remote plan R5).
  - The hosted flow needs the client to wrap each application file key with the Project key during streaming; if no client is online the files stay chat-only until one connects, and that state must be visible.
  - Video size against artifact caps - the recorder needs a resolution and duration limit, with a visible truncation state.
  - Two other running chats change neighbouring code (Rust core switch-over, Project document creation).
