schema_version: 2
id: deterministic-stale-code-reporting
title: Deterministic Stale Code Reporting
status: verified

goal: >
  Produce a conservative daily report of code that is safe for a separately
  invoked OpenCode agent to delete, without modifying source automatically and
  without presenting dynamic, registered, generated, public, or compatibility
  code as deletion-ready.

scope:
  in:
    - Harden the existing Python, TypeScript, Svelte, and CSS stale-code detector.
    - Classify findings as deletion_ready, review_only, or suppressed with deterministic evidence.
    - Prefer precision over recall and omit ambiguous findings from deletion_ready.
    - Write latest JSON and Markdown reports under gitignored logs/nightly-reports/.
    - Run the report-only detector every day and post a compact Discord notification.
    - Add a remove-stale-code OpenCode skill that revalidates report revision and evidence before editing.
    - Add adversarial fixture and current-repository regression tests for known false-positive classes.
  out:
    - Automatic source edits, commits, deploys, or OpenCode cleanup sessions from cron.
    - A claim that static analysis can prove arbitrary reflective or dynamically loaded code is unused.
    - Automatic deletion of CSS selectors, compatibility shims, public exports, migrations, generated files, or metadata-driven components.
    - Product, API, CLI, SDK, web UI, or Apple behavior changes.

context_discovery:
  github_issues:
    - GitHub MCP search unavailable because authentication returned HTTP 401; no issue was created.
  docs:
    - docs/architecture/infrastructure/cronjobs.md
    - docs/contributing/guides/spec-driven-development.md
  code_patterns:
    - scripts/find_dead_code.py
    - scripts/nightly-dead-code-removal.sh
    - scripts/_dead_code_removal_helper.py
    - scripts/_nightly_report.py
    - frontend/packages/ui/src/services/embedFullscreenResolver.ts
    - frontend/packages/ui/src/services/skillStoreExamplesResolver.ts
    - frontend/apps/web_app/src/routes/dev/preview/[...path]/+page.svelte
  tests:
    - No focused tests currently cover scripts/find_dead_code.py or the dead-code cron workflow.
  observed_baseline:
    - A full current-worktree scan returned 193 findings: 62 Python, 68 TypeScript, 55 Svelte, and 8 CSS.
    - All 55 Svelte findings were labeled high confidence even though the component tree is loaded by Vite import.meta.glob and embed components are metadata registered.
    - Dynamic app and provider class construction invalidated multiple CSS zero-reference claims.
    - The installed dead-code crontab entry is commented with DISABLED.
    - The existing helper dispatches an editing agent and records submitted items as removed even when that agent fails.

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This is repository maintenance tooling with no Apple runtime counterpart.
  verification:
    - Apple build and UI verification are not required.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should the stale-code cron continue deleting findings automatically?
      answer: Replace it with a strictly report-only daily job and use a separately invoked cleanup skill.
    - question: Should ambiguous dynamic or public candidates appear as safe to delete?
      answer: No. Prefer conservative multi-signal detection and suppress or demote ambiguous candidates.
  vision_summary: >
    The daily job must be deterministic, report-only, and deliberately
    conservative. Discord should announce the result and local report path; a
    user-invoked OpenCode skill may delete small batches only after revalidating
    the current revision, candidate fingerprint, references, and targeted checks.
  approved_by_user: true

implementation_state:
  subject_commit: 35556ace20dafe5f74af99515aba58244e353398

approvals:
  specification:
    status: approved
    approved_at: "2026-08-05"
  plan:
    status: not_required
    reason: >
      The approved contract already fixes the material architecture decision:
      cron reports only, deterministic code owns classification, and cleanup is
      an explicitly invoked revalidation skill.

decisions:
  - id: D-1
    status: active
    decision: The scheduled job never edits source or launches an editing agent.
    reason: False-positive evidence shows the current automatic deletion path is unsafe.
    decided_at: "2026-08-05"
  - id: D-2
    status: active
    decision: Only converging deterministic evidence may produce deletion_ready findings.
    reason: Dynamic language and framework behavior requires abstention when usage cannot be disproved.
    decided_at: "2026-08-05"
  - id: D-3
    status: active
    decision: CSS findings remain review_only unless a future exact generated-class contract proves deletion safety.
    reason: OpenMates constructs app, provider, and rendered-content classes dynamically.
    decided_at: "2026-08-05"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Run the existing detector unchanged against the current worktree.
    outcome: succeeded
    notes: >
      It produced 193 findings and demonstrated systematic false positives in
      Svelte import.meta.glob and dynamic CSS classes.
    recorded_at: "2026-08-05"
  - id: ATTEMPT-2
    task_id: TASK-4
    approach: Run the broad OpenCode output-quality audit after adding the skill.
    outcome: blocked
    notes: >
      The audit reported pre-existing opencode.json Firecrawl permission gaps
      unrelated to this skill. Agent skill parity and agent tooling parity both
      passed; no unrelated opencode.json changes were made.
    recorded_at: "2026-08-05"

handoff:
  current_task_id: TASK-5
  next_action: No implementation work remains; use the remove-stale-code skill when a future report contains deletion_ready findings.
  command: python3 scripts/stale_code_daily.py --dry-run-notify --limit 100
  expected_outcome: A report-only scan completes without editing source or launching an agent.
  blocker: null
  last_verified_commit: 35556ace20dafe5f74af99515aba58244e353398

scenarios:
  - id: S-1
    title: Dynamic and registered code is not called deletion-ready
    given:
      - A Svelte component is loaded by import.meta.glob or named in app metadata.
      - A CSS class or Python symbol is accessed through a recognized dynamic framework contract.
    when:
      - The detector scans the repository.
    then:
      - The candidate is suppressed or review_only with the reason recorded.
      - It never appears as deletion_ready.

  - id: S-2
    title: Converging evidence produces an actionable candidate
    given:
      - A seeded private import, variable, function, class, export, or file has no static, dynamic, registry, public, generated, test-fixture, or compatibility use.
      - Every configured analyzer and exclusion check agrees it is unused.
    when:
      - The detector scans the fixture.
    then:
      - It emits a stable candidate fingerprint and evidence list.
      - It classifies the candidate deletion_ready only when the candidate kind satisfies the strict policy.

  - id: S-3
    title: Daily report is durable and notification-only
    given:
      - Cron invokes the stale-code job on the dev host.
    when:
      - Detection succeeds, finds nothing, or fails.
    then:
      - Latest JSON and Markdown reports are atomically written under logs/nightly-reports/.
      - Discord receives a bounded status summary using the configured nightly webhook.
      - No source file, git state, deployment, or OpenCode session is changed.

  - id: S-4
    title: Cleanup skill rejects stale or ambiguous evidence
    given:
      - A maintainer invokes remove-stale-code with the latest report.
    when:
      - The report commit differs, the fingerprint no longer matches, references appear, or required checks are unavailable.
    then:
      - The skill skips the candidate and explains the failed guard.
    when_valid:
      - A small deletion_ready batch revalidates successfully.
    then_valid:
      - The skill applies the smallest deletion and runs candidate-specific verification before deployment.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Known import.meta.glob, app.yml registry, public export, decorator, fixture, reflection, generated-file, migration, compatibility, and computed-class cases never become deletion_ready.
