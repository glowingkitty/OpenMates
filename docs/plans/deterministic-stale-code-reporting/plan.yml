    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-CRON]
  - id: AC-5
    scenario: S-4
    text: The synchronized remove-stale-code skill requires current commit and fingerprint revalidation, small batches, reference checks, and targeted verification before deletion or deploy.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-SKILL]

assumptions:
  - id: A-1
    text: logs/ and scripts dot-state files remain excluded from git.
    category: persistence
    required_before: implementation
    status: confirmed
