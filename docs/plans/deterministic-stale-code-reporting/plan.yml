        summary: Existing ignore rules cover runtime reports and scripts dot-state files.
  - id: A-2
    text: DISCORD_WEBHOOK_DEV_NIGHTLY is the existing optional dev-maintenance notification channel.
    category: notification
    required_before: implementation
    status: confirmed
