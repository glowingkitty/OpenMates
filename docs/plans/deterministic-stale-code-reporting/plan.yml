implementation_notes:
  plan_path: docs/plans/deterministic-stale-code-reporting/plan.yml
  existing_patterns:
    - Harden scripts/find_dead_code.py rather than creating a parallel detector entry point.
    - Reuse the existing nightly Discord environment convention and gitignored nightly-report location.
    - Replace the unsafe nightly removal shell workflow with report-only execution and tracked idempotent setup.
    - Author the skill canonically under .claude/skills and generate the OpenCode mirror.
  architecture: >
    A deterministic Python detector owns analyzers, exclusions, classification,
    stable fingerprints, and JSON/Markdown rendering. A thin daily runner invokes
    it, atomically publishes local reports, and sends a redacted Discord summary.
    Cron never launches an agent. The user-invoked cleanup skill consumes only
    deletion_ready findings and independently revalidates all safety evidence.
  data_flow:
    - Daily runner resolves the current repository revision and invokes the detector.
    - Analyzer candidates pass through framework, registry, dynamic-use, public-boundary, generated-file, and compatibility exclusions.
    - Classifier emits deletion_ready only when all required evidence is available and agrees; otherwise it demotes or suppresses.
    - Runner writes JSON and Markdown atomically, then posts a bounded Discord summary.
    - Cleanup skill later revalidates report revision and candidate fingerprint before any edit.
  affected_files:
    - path: scripts/find_dead_code.py
      reason: Conservative analyzers, exclusions, classification, fingerprints, and report formatting.
    - path: scripts/tests/test_find_dead_code.py
      reason: True-positive and adversarial false-positive contract.
    - path: scripts/stale_code_daily.py
      reason: Report publication and Discord notification.
    - path: scripts/stale-code-cron-setup.sh
      reason: Idempotent daily host schedule installation.
    - path: scripts/tests/test_stale_code_daily.py
      reason: Runner, notification, and cron tests.
    - path: scripts/nightly-dead-code-removal.sh
      reason: Remove or convert the unsafe automatic editing entrypoint.
    - path: scripts/_dead_code_removal_helper.py
      reason: Remove obsolete automatic editing behavior.
    - path: docs/architecture/infrastructure/cronjobs.md
      reason: Document actual report-only schedule and manual commands.
    - path: .claude/skills/remove-stale-code/SKILL.md
      reason: Canonical revalidating cleanup workflow.
    - path: .agents/skills/remove-stale-code/SKILL.md
      reason: Generated OpenCode-compatible skill mirror.
  verification_strategy:
    - Write and run focused detector and runner tests red before implementation.
    - Run focused tests green after each implementation slice.
    - Run a full repository scan and manually review every deletion_ready result.
    - Run skill parity and OpenCode quality audits after synchronization.
    - Install cron through the tracked idempotent setup command and inspect the resulting crontab.
  verification_order:
    - Deterministic detector fixture and regression tests.
    - Daily runner, report, Discord, and cron tests.
    - Full current-repository scan and deletion_ready precision review.
    - Skill synchronization and tooling audits.
    - Host cron installation and dry-run notification verification.

