contracts:
  api:
    - No endpoint is added or changed; access model, auth, rate limits, credits, and encryption boundaries are not applicable.
  detector:
    - Every finding includes category, kind, path, line when available, symbol, classification, stable fingerprint, and evidence or suppression reasons.
    - Tool failures are visible and make affected analyzer classes unavailable; they never silently promote candidates.
    - A generated, vendored, migration, route, fixture, public API, metadata-registered, glob-loaded, decorated, reflective, or compatibility-marked candidate cannot be deletion_ready.
    - Report ordering and fingerprints are deterministic for an unchanged repository revision.
  reporting:
    - JSON is the machine-readable cleanup-skill input and Markdown is the local human review artifact.
    - Reports contain paths and symbol metadata but no credentials, environment values, source bodies, private logs, or user data.
    - Missing Discord configuration is recorded as skipped without failing an otherwise successful scan.
    - Discord failures are visible in runner status but do not erase the local report.
  cron:
    - Schedule is daily, report-only, idempotently installed, and logs to a gitignored host log.
    - The Python runner reads only the configured Discord webhook from process environment or .env without printing secrets.
  cleanup_skill:
    - The canonical skill is authored under .claude/skills and synchronized to .agents/skills for OpenCode.
    - The skill never acts on review_only or suppressed findings.
    - The skill rechecks HEAD, fingerprint, symbol references, dynamic exclusions, and candidate-specific tests before editing.
    - The skill handles a small bounded batch and uses sessions.py deploy only after verification.
  privacy_security:
    - Discord receives counts, status, commit abbreviation, and report path only.
    - Webhook values, environment contents, source snippets, and private repository data are never included.

