schema_version: 2
id: encrypted-metadata-key-acceptance-race
title: Encrypted Metadata Key Acceptance Race
status: verified

goal: >
  Prevent cross-device encrypted chat metadata sync from reusing a stale local
  chat key after a device receives an authoritative encrypted_chat_key for the
  same chat. A second logged-in browser session must decrypt the same newly
  created chat metadata and messages that the sending session can decrypt.

scope:
  in:
    - Web client handling of encrypted_chat_metadata WebSocket payloads.
    - Ordering between incoming encrypted_chat_key acceptance, local key cache
      clearing, IndexedDB persistence, and metadata/message decryption.
    - Regression coverage for stale IndexedDB key reload after an incoming key
      mismatch.
    - Existing multi-session-encryption Playwright verification on dev.
  out:
    - Test-account cleanup hardening and login retry changes.
    - Backend WebSocket contract changes.
    - CLI, npm SDK, pip SDK, and Apple implementation changes.
    - Broad chat-key redesign, key wrapper migration, or legacy chat repair.

