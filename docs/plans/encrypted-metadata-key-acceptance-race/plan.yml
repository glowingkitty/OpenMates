    Fix the real cross-device key mismatch exposed by multi-session-encryption
    without expanding into account cleanup, login flake, or broader encryption
    redesign work. The receiving device should accept the incoming authoritative
    encrypted_chat_key before decrypting or saving encrypted metadata/messages.
