scenarios:
  - id: S-1
    title: Second browser accepts authoritative metadata key before decrypting chat
    given:
      - Alice is logged into two independent browser contexts with the same account and master key.
      - Session A creates a new encrypted chat and syncs encrypted_chat_metadata with an encrypted_chat_key.
      - Session B may already have a stale or mismatched key cached in memory or IndexedDB for that chat id.
    when:
      - Session B receives encrypted_chat_metadata for the chat with the authoritative encrypted_chat_key.
    then:
      - Session B unwraps and accepts the incoming encrypted_chat_key before any metadata validation/decryption uses withKey.
      - Session B does not reload or use the stale IndexedDB key for the incoming metadata/messages.
      - Session B decrypts the assistant message for the chat without key fingerprint mismatch errors.
  - id: S-2
    title: Existing matching key remains stable
    given:
      - Session B already has the same raw key as the encrypted_chat_metadata payload.
    when:
      - Session B receives encrypted_chat_metadata for that chat.
    then:
      - The handler does not rotate or replace the key unnecessarily.
      - Metadata validation/decryption continues with the existing matching key.
  - id: S-3
    title: No plaintext or raw key leakage during race handling
    given:
      - Session B detects an incoming key mismatch for encrypted metadata.
    when:
      - The handler records diagnostics or warnings.
    then:
      - Logs may include sanitized fingerprints and chat ids needed for debugging.
      - Logs do not include raw chat keys, master keys, decrypted private content, or encrypted payload bodies.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: A receiving web session accepts the incoming encrypted_chat_key before validating or decrypting encrypted_chat_metadata when its cached key differs.
