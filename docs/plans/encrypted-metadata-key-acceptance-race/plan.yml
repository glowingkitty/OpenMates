    verification_scope: custom
    verification_ids:
      - T-LINT-001

assumptions:
  - id: A-1
    text: encrypted_chat_metadata carries the authoritative encrypted_chat_key for the chat when present.
    category: encryption
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/core/encryption-architecture.md
        summary: The key distribution protocol says recipients receive encrypted_chat_key and call ChatKeyManager.receiveKeyFromServer to unwrap and inject it.
      - source: docs/architecture/core/chat-encryption-implementation.md
        summary: Multi-device sync stores and syncs encrypted chat keys through encrypted_chat_key.
  - id: A-2
    text: This slice does not require a backend WebSocket contract change.
    category: sync
    required_before: implementation
    status: confirmed
    evidence:
      - source: test-results/screenshots/current/multi-session-encryption/playwright.json
        summary: The failing Session B run received data but used a mismatched local key, indicating client key ordering rather than absent backend payload.

contracts:
  api:
    - route: WebSocket encrypted_chat_metadata event
      access_model: first-party client surface only
      request: Existing encrypted metadata payload; no schema change planned.
      response: Existing client-side handler effects only.
      auth: Logged-in user WebSocket session required.
      rate_limits: Existing WebSocket limits unchanged.
      credit_budget: Not applicable.
      encryption_boundary: Payload contains client-side encrypted metadata and an encrypted_chat_key wrapped for the account; no decrypted plaintext or raw keys cross the server boundary.
      errors:
        - Existing visible decrypt failures remain possible for unrecoverable missing/corrupt keys; this fix covers recoverable incoming-key mismatch ordering.
  data:
    - The accepted encrypted_chat_key for a chat must be persisted before downstream metadata handling can reload a stale key from IndexedDB.
    - Raw chat keys stay in ChatKeyManager memory and are never written to logs or server APIs.
  ui_states:
    - Session B opens the synced chat and sees decrypted user and assistant messages.
    - No decryption error placeholder appears for the active newly-created chat.
  privacy_security:
    - No raw chat key, master key, decrypted message content, or full encrypted payload body is logged.
    - The handler must not silently generate a replacement key for an existing synced chat.

