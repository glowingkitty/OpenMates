implementation_notes:
  plan_path: docs/plans/encrypted-metadata-key-acceptance-race/plan.yml
  existing_patterns:
    - ChatKeyManager.receiveKeyFromServer unwraps and injects server-provided encrypted_chat_key.
    - chatSyncServiceHandlersChatUpdates.test.ts already mocks ChatKeyManager and chat DB collaborators for websocket handler regressions.
  architecture: >
    Keep the encrypted_chat_metadata WebSocket payload contract unchanged. In
    the web handler, make incoming encrypted_chat_key acceptance the first
    operation when a mismatch is detected, then run metadata validation and
    persistence with the accepted key. Do not generate a replacement key for an
    existing synced chat.
  data_flow:
    - Session B receives encrypted_chat_metadata for a synced chat.
    - Handler detects incoming encrypted_chat_key is present and cached key differs or is missing.
    - Handler accepts the incoming encrypted_chat_key through ChatKeyManager and persists the key state before validation.
    - Metadata/messages decrypt with the accepted key; stale IndexedDB key is not reloaded.
  affected_files:
    - path: frontend/packages/ui/src/services/chatSyncServiceHandlersChatUpdates.ts
      reason: Key-acceptance ordering in encrypted metadata handler.
    - path: frontend/packages/ui/src/services/__tests__/chatSyncServiceHandlersChatUpdates.test.ts
      reason: Focused regression coverage for stale-key reload.
    - path: docs/plans/encrypted-metadata-key-acceptance-race/plan.yml
      reason: Durable encryption/sync contract and evidence ledger.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/encrypted-metadata-key-acceptance-race/plan.yml
    - python3 scripts/tests.py run --suite vitest
    - ./scripts/lint_changed.sh --ts --path frontend/packages/ui/src/services/chatSyncServiceHandlersChatUpdates.ts
    - Deploy to dev, wait for Vercel Ready, then python3 scripts/tests.py run --spec multi-session-encryption.spec.ts --expected-commit <commit> --lease-id lease-chat_sync_encryption-30e9a67ffe-8d534261
    - python3 scripts/plan_verify.py docs/plans/encrypted-metadata-key-acceptance-race/plan.yml
  verification_order:
    - Spec validation and focused frontend unit regression first.
    - Lint/static privacy check for changed handler path second.
    - Web Playwright after dev deploy third.
    - Apple not affected because no native files or WebSocket contract changes are in scope.

