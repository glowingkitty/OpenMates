scenarios:
  - id: S-1
    title: User enables speech for one chat
    given:
      - Alice has Chat A and Chat B with Auto speak response off.
    when:
      - Alice enables Auto speak response in Chat A.
    then:
      - Chat A remains enabled across Alice's devices until she disables it.
      - Chat B remains disabled.
  - id: S-2
    title: Voice recording visibly enables speech
    given:
      - Auto speak response is off in the current chat.
    when:
      - Alice completes a voice-recording embed in the composer.
    then:
      - Auto speak response becomes enabled before send.
      - The speech control briefly highlights without blocking recording, transcription, editing, or send.
      - Sending while transcription finishes preserves one message ID and finalizes the transcript in place.
      - The prerecorded acknowledgement starts or autoplay recovery appears within five seconds after send acceptance.
  - id: S-3
    title: Automatic response speaks progressively
    given:
      - Auto speak response is enabled and a mate has a valid fixed voice profile.
    when:
      - The assistant streams three prose paragraphs.
    then:
      - A deterministic prerecorded acknowledgement plays with a passive top waveform without waiting for optional thinking or incurring a runtime charge.
      - Each immutable paragraph creates one ElevenLabs request and one encrypted S3 file.
      - Paragraph one plays only when its complete encrypted file is ready while later text and audio continue independently.
  - id: S-4
    title: App and embed content is spoken naturally
    given:
      - The response uses Web, Images, and Travel and includes a map and code block.
    when:
      - Speakable segments are projected.
    then:
      - App previews appear in Processing state before provider completion.
      - A localized generated app-use announcement names the selected apps and plays in passive waveform mode when ready.
      - Prose is preserved and raw JSON, URLs, protocol, and code syntax are omitted.
      - The map and code use factual structured summaries or localized fallback announcements.
  - id: S-5
    title: User speaks a historical response
    given:
      - An assistant response has no generated speech files and is decrypted on Alice's authorized client.
    when:
      - Alice selects Speak.
    then:
      - The client submits deterministic missing segments through the owner-scoped first-party surface.
      - Playback begins after the first segment is ready.
      - A later replay reuses matching files and charges nothing.
      - The Speak response action is beside the mate name and absent from the generated-by footer.
  - id: S-6
    title: User controls paragraph playback
    given:
      - A response queue has one ready chapter and later ready or generating chapters.
    when:
      - Alice pauses, resumes, closes, skips forward, or skips backward in app or through supported OS controls.
    then:
      - The responsive Figma-defined bar overlays the active-chat history below its action buttons and keeps the composer and transcript reachable.
      - Passive Confirmation and Using apps clips are labeled but cannot be revisited through replay navigation.
      - Replayable chapters use a nearest heading or localized Part N/semantic fallback label and highlight the current transcript segment only while playing.
      - Selecting a generating chapter immediately shows it with Loading and a flat waveform, transitions to real samples, and autoplays when ready unless paused or closed.
      - Pausing reveals Play and Close; Close hides local playback while requested generation continues and persists.
      - Unsupported Media Session controls do not remove in-app controls.
      - Starting another response queue stops the previous local playback without deleting files or cancelling requested generation.
  - id: S-7
    title: Speech failure never affects text
    given:
      - Paragraphs one and two are ready and paragraph three fails credit preflight, safety, provider, or storage processing.
    when:
      - The text response continues and completes.
    then:
      - The speech queue stops visibly at paragraph three and Auto speak response disables for that chat.
      - Earlier paragraph files remain replayable.
      - Retry resumes at the first failed or missing segment without duplicate charges.
  - id: S-8
    title: Browser blocks delayed autoplay
    given:
      - Paragraph one is ready but the browser rejects automatic play.
    when:
      - The queue enters blocked_by_autoplay.
    then:
      - Auto speak response stays enabled and the ready queue is preserved.
      - One Tap to continue audio action appears without regeneration or another charge.
  - id: S-9
    title: Speech assets follow message lifecycle
    given:
      - An assistant message has five encrypted paragraph files.
    when:
      - The message is changed, its voice profile version changes, or the message/chat is deleted.
    then:
      - Only mismatched segments are invalidated and regenerated.
      - Message or chat deletion removes associated manifests, records, and S3 files.
  - id: S-10
    title: Web and Apple preserve semantics
    given:
      - API, backend, and web gates have passed and the user confirms web behavior.
    when:
      - Apple parity is implemented.
    then:
      - Apple preserves preference, queue, segment, billing, privacy, and failure semantics.
      - Native background controls are provided where supported.
  - id: S-11
    title: CLI generates speech for existing assistant messages
    given:
      - Alice's paired CLI can decrypt an existing owner-accessible chat.
    when:
      - Alice runs `openmates chats speak <chat> --message <message>` or `--all`.
    then:
      - The CLI projects eligible assistant content locally and requests only missing or invalidated private segments.
      - It reports generated, reused, failed, and charged segments without printing plaintext, keys, provider IDs, or private object paths.
  - id: S-12
    title: Logged-out visitor plays reviewed example speech
    given:
      - A landing-linked example was converted from a real CLI chat whose private speech segments are ready.
      - A reviewer explicitly approved publication of selected message audio.
    when:
      - The conversion workflow publishes immutable public S3 fixture copies and a logged-out visitor selects Speak.
    then:
      - Ordered paragraph audio plays without login, generation, provider calls, or credits.
      - The fixture exposes no source private object reference, encryption material, owner metadata, or storage credential.

