goal: >
  Let authenticated users enable speech for one chat and hear each immutable
  assistant paragraph or structured summary as its own encrypted, independently
  skippable ElevenLabs audio file, while text streaming remains authoritative
  and unaffected, replay is free, generation is billed through one character-based
  aggregate per assistant message, paired CLI owners can generate historical-message audio,
  and reviewed public examples can replay separately published fixtures.

scope:
  in:
    - A chat-scoped Auto speak response control in the message composer, off by default and synchronized across the user's devices.
    - Completing a voice-recording embed visibly enables Auto speak response for that chat and briefly highlights the control.
    - Deterministic selection of a free prerecorded acknowledgement from mate voice, response language, and request category.
    - Fixed versioned ElevenLabs voice profiles for built-in mates with deterministic multilingual fallback.
    - Immutable speech segments for prose paragraphs, localized app-use announcements, and structured embed, code, or table summaries.
    - One ElevenLabs request and encrypted private chatfiles S3 object per generated segment, with one idempotent character-based usage row per assistant message.
    - Speech generation and playback run in parallel with and never block assistant text streaming or persistence.
    - User-message rendering, rainbow state, optional thinking, app-skill Processing previews, embeds, and text publish before related speech work and never wait for app-skill or audio completion.
    - Prerecorded acknowledgement and generated app-use clips use a passive top waveform; replay and track controls appear only for durable response paragraphs and summaries.
    - The responsive Figma-defined top player stays visible with localized Loading state while more response audio can arrive.
    - Progressive playback begins after the first segment is ready and automatically follows manifest order.
    - A compact Speak action on every assistant response expands its localized label on hover/focus, generates only missing or invalidated segments, and reuses matching durable files.
    - The Speak response action sits beside the mate name in the assistant identity row rather than in the generated-by footer.
    - The web client starts the prerecorded acknowledgement or shows autoplay recovery within five seconds of an accepted auto-speak send, while a separate real-provider smoke records ElevenLabs generation latency.
    - "`openmates chats speak` generates or reuses private encrypted segments for one or all existing assistant messages in an owner-accessible chat."
    - The example-chat conversion workflow can explicitly publish reviewed segment copies to immutable public S3 fixture keys.
    - One existing landing-linked example chat receives reviewed public speech fixtures that play for logged-out visitors without generation or credits.
    - One active response queue with play, pause, close, previous chapter, and next chapter controls; Close dismisses local playback without cancelling requested generation.
    - A responsive waveform bar matching Figma node 5903:75417, with deterministic chapter labels, desktop mate identity, mobile-prioritized controls, transcript emphasis, and a flat-to-real waveform transition for a selected pending chapter.
    - Best-effort web Media Session controls plus complete in-app fallback controls and visible autoplay recovery.
    - Safe visible retry, credit, provider, storage, and cancellation behavior without browser-speech or provider fallback.
    - Message/chat deletion and source/voice-version invalidation clean up only affected speech assets.
    - Web implementation and proof before user confirmation, then Apple native parity including background and lock-screen controls where supported.
  out:
    - A combined message-level audio file.
    - Anonymous or developer API-key generation, public npm/pip SDK generation, and public access to source private encrypted speech objects.
    - User-selectable voices, raw ElevenLabs voice IDs, voice cloning, or impersonation.
    - Reading raw JSON, raw URLs, protocol fences, code syntax, or full table markup aloud.
    - A general-purpose Groq, Gemini, or other LLM rewrite/cleanup pass before TTS.
    - Browser speech synthesis or a second provider as an automatic fallback.
    - Changing audio.speak app-skill request or response semantics.

