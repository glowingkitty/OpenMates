implementation_notes:
  plan_path: docs/plans/assistant-response-speech/plan.yml
  specification_refs:
    - feature.assistant-response-speech@5 fingerprint 3f66240297ca59d6a809d4e849b1a7487fa699e555402266e5f3d40af4b24184
  affected_specification_assertions:
