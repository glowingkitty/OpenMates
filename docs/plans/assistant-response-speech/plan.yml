decisions:
  - id: D-1
    status: active
    decision: Use a dedicated assistant-response speech contract and leave audio.speak unchanged.
    reason: Automatic response narration has chat, streaming, queue, persistence, and billing semantics that do not belong to an explicit app-skill request.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-2
    status: active
    decision: Generate and store one encrypted audio file per immutable paragraph or structured summary segment.
    reason: Per-segment files enable progressive playback, skipping, targeted retries, reuse, and exact billing attribution.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-3
    status: active
    decision: Use deterministic speech projection and producer-supplied summaries without a general cleanup LLM.
    reason: This minimizes latency, provider disclosure, cost, and factual drift.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-4
    status: superseded
    decision: Limit generation access to authenticated first-party clients and expose no public SDK surface.
    reason: Superseded by D-9 after the paired CLI was approved as a first-party owner client.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-5
    status: active
    decision: Complete API/backend and web proof before Apple implementation.
    reason: Repository phase gates require shared server behavior and reviewed web behavior before native parity.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-6
    status: active
    decision: Use Eleven v3 for assistant-response speech while leaving the explicit audio.speak app skill on Eleven Multilingual v2.
    reason: Eleven v3 has the same published per-character price as Multilingual v2, supports more languages, and better fits expressive paragraph narration; compare v3 Conversational only after the full assistant-response speech specification is complete.
    decided_at: "2026-08-31T00:00:00Z"
  - id: D-7
    status: active
    decision: Daily deployed web verification replays a recorded realistic AI and app-skill chat and uses committed acknowledgement MP3 bytes for generated speech segments only inside the exact live-mock request context.
    reason: The full inference, skill, encrypted asset, WebSocket, and playback pipeline must remain regression-tested without recurring LLM, app-provider, or ElevenLabs cost; production and unmarked requests must remain on the normal provider and billing path.
    decided_at: "2026-09-01T00:00:00Z"
  - id: D-8
    status: active
    decision: Complete and encrypt each Eleven v3 paragraph segment before client playback instead of relaying partial provider audio.
    reason: Eleven v3 supports HTTP streaming, but user-visible chunk relay would require a new encrypted streaming transport and would bypass the complete durable asset, waveform, duration, replay, and exactly-once settlement boundary; the standard TTS WebSocket endpoint also does not support eleven_v3.
    decided_at: "2026-09-01T00:00:00Z"
  - id: D-9
    status: active
    decision: Allow paired `openmates chats speak` generation for owner-accessible existing chats while keeping anonymous and developer API-key generation forbidden.
    reason: The CLI already participates in first-party encrypted chat access and can locally project decrypted messages without weakening owner authorization.
    decided_at: "2026-09-01T00:00:00Z"
  - id: D-10
    status: active
    decision: Publish public example audio only as reviewed immutable fixture copies, separate from source private encrypted speech objects.
    reason: Logged-out playback requires public bytes, but generation, source objects, keys, owner metadata, and private paths must remain inaccessible.
    decided_at: "2026-09-01T00:00:00Z"

