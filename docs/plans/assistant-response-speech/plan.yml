    - assistant-speech.preference.voice-recording-visible-activation
    - assistant-speech.acknowledgement.deterministic-free
    - assistant-speech.acknowledgement.first-useful-feedback-within-five-seconds
    - assistant-speech.voice.fixed-versioned-mate-profile
    - assistant-speech.segmentation.one-file-per-segment
    - assistant-speech.segmentation.immutable-source
    - assistant-speech.projection.deterministic-semantic
