    notes:
      - "Apple cache location: Swift passes the container the system hands out plus one folder name (CoreConfig.cache_container, cache_directory_name); Rust creates and checks only that folder (FileByteStore::open_in). An app cannot open the folders above its container."
      - "The unsigned CI simulator build has no Keychain entitlement (status -34018). KeychainCredentialStore.swift is therefore not exercised in CI; bridge tests use an in-memory store. Prove it on a signed build."
      - "The terminal UI has no load-older or close-chat command; only the core supports them."
      - "The core emits Partial list events, never Complete; the core Message record has no timestamp."
      - "L9 Apple binding (uncommitted): ViewModelCore send/cancelSend export the core send (SendState mirrored as SendStateRecord, emit_detached forwarded to the listener). Swift app screens are not rewired yet."
      - "Core login for Swift (uncommitted): ViewModelCore loginPassword and the pair-login steps (begin, poll, PIN, finish, cancel) run in the core and hand over through the new AcknowledgedCredentials::begin_client_session / finish_pair_session (shell_session/login.rs), then start. A signed-in core refuses another login with Invalid. Passkey, recovery-key, backup-code, device 2FA verification and password-v1 migration are not in the core; AuthManager.swift is unchanged."
      - "Session ownership for un-migrated Swift (uncommitted): ViewModelCore adoptSession (one-time hand-over of a Swift-finished login; removed with A3), httpRequest (authenticated /v1/ passthrough through Client::prepare_shell_http/finish_shell_http, client/shell_http.rs; removed with A6), sessionInfo, and auth loss (401 wipes the profile and emits Session(Expired))."
      - "Frozen remainders: legacySocketGrant (removed with A4a; the server keys sockets by account and device, so it holds only while the core opens no socket) and legacyMasterKey (removed with A3b); both refused while signed out. Uploads (upload host) and streaming are not in the passthrough; typed core calls follow."
      - "L8 part 2 (uncommitted):ViewModelCore openChat/loadOlder/closeChat/markRead exported; fresh session after logout through shell_session::begin_session_epoch (moved from the terminal app's Store::begin_session_if, which now calls it) and AcknowledgedCredentials::begin_session."
