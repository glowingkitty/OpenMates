      - "One job compiles and tests: apple-unit and apple-ui build first (all Swift errors listed on failure, no x86_64 Watch build, Rust cache shared between the modes) and test on that build; submit both together and fix all listed errors in one round. No separate compile job before them, no static compile-review lanes."
