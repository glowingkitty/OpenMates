    remaining_in_order:
      - "Apple login hand-over: the Apple login (password, passkey, recovery, pairing finish) still runs in Swift and keeps cookies and the master key there; the core begin path (shell_session::begin, ViewModelCore::begin_session, Rust only) waits for a core login or an approved import of the Swift-held session."
