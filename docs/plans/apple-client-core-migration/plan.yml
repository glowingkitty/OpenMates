  lessons_from_web_core_rollout:
    note: Defects found while turning the Rust core on in the web app (dev commits b8b83bbba0, 6c67df588b, 18ffa6a947, 1164c58318). Check each one when rewiring the Apple app (A4, A5).
    items:
      - "Nothing the app needs offline or on a dropped connection may be loaded on first use. Apple links the core statically, so code loading is not an issue, but the same rule holds for state: create the core object, cache and listener at app start, not on the first chat open."
      - "A dropped connection must settle every pending connect and send. Swift callers of core calls always pass a CoreCancellation and handle the error branch; no continuation may wait forever."
      - "Do not merge a whole chat with the core once per page or per stream update (quadratic for long chats). The core emits a full ChatWindow record after each stream update; Swift applies Stream events to the open message and replaces the window only on Canonical, or the core gains a delta event before A5."
      - "Decide on stored rows first, filter presentation-only rows afterwards (the first voice turn lost its history because a system row was filtered before the history decision). History and send decisions stay in the core; Swift filters only for display."
      - "A failed request for derived content (formatting, render plan) is retried with backoff instead of leaving the message unrendered."
