# Approved decisions (user, 2026-10-21 .. 2026-11-02). Do not re-ask.
decisions:
  - CLI/TUI is 100% Rust (Ratatui/Crossterm/Tokio); no Node/Python/sidecar at runtime.
  - Shared Rust owns all reusable headless logic for CLI/TUI, web (WASM) and later
    Apple. Svelte keeps only UI/DOM and thin browser APIs (media, WebRTC);
    IndexedDB/SwiftData stay as thin storage adapters.
  - Packaging (2026-11-02) - ONE published crate `openmates` containing the SDK
    library and the `openmates` CLI binary. `cargo install openmates` installs
    the CLI; `cargo add openmates` gives the SDK. TUI/CLI-only dependencies sit
    behind a default `cli` feature so SDK users can opt out. The Node-API/PyO3 and
    WASM binding crates stay internal (shipped inside npm, PyPI and the web app,
    not on crates.io). GitHub executable downloads are out of scope.
  - The npm CLI stays installed and working until full parity plus explicit
    agent AND user retirement acceptance. Rust is available side by side as
    `openmates-rust` for daily testing.
  - Sync budget is 20 parent chats plus their sub-chats; no full-account sync.
  - Performance rule - Rust slower than TypeScript on any measured flow is a
    blocker that requires debugging/optimization, never acceptance.
  - Login must keep working exactly as today, especially in the production web
    app. Security improvements are recorded separately and never shipped as a
    side effect of the migration.
  - Order - CLI/TUI essential flows, then web/WASM immediately, then remaining CLI
    parity and SDKs in parallel, then Apple via the Mac workflow. Backend Rust is
    a later, separate project.
  - Linux dev plus macOS testing; Windows explicitly waived.
  - Agent harness is Claude Code; Codex is no longer used.

