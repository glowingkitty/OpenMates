  - id: browser-integration
    outcome: Start browser/WASM integration immediately after essential-native proof, retaining Svelte UI/DOM and
      thin browser API adapters.
    acceptance: Comparable before/after web measurements and actual essential-flow browser evidence; exhaustive
      CLI parity continues independently.
  - id: complete-native-parity
    outcome: Continue all CLI/app/platform parity, SDK/security/publication and self-host requirements as separately
      tracked work.
    acceptance: Complete parity and reliable operation verified before explicit agent and user retirement acceptance.
  - id: apple-after-web
    outcome: Migrate Apple after verified web through coordinated Mac workflow.
    acceptance: Required Apple/native platform evidence and preserved data; no automatic source removal.
  - id: backend-later
    outcome: Backend migration remains a separately scoped later stage.
    acceptance: Every client migration and its explicitly accepted cleanup is complete first.
