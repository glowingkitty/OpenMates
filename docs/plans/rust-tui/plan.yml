goal: Create and test a rust version of our current TUI with a focus on improved performance, stability, and at
  least matching the security level of the existing TUi. Then compare the performance of the two. The Rust TUI must
  be 100% Rust. Fully migrate the existing CLI and TUI to one native Rust application, extract a headless Rust SDK,
  and maintain synchronized library-only npm and Python SDKs. Make verified Rust available alongside the installed
  npm CLI early for daily use and user testing without automatic global replacement. Retain npm CLI/TUI source until
  the agent and user confirm feature completeness and reliable operation. Verify self-hosting edition setup through
  Rust in GitHub CI. Share Rust components for all client encryption, storage policy, networking, reconnection,
  synchronization and reusable application operations. Prove essential native auth, encrypted chat, streaming/cancel,
  persistence and sync/reconnect/recovery first; begin browser/WASM integration immediately afterward with before/after
  measurements. Continue exhaustive CLI command/app parity separately, then verify web before Apple. Use Cargo installation
  first; GitHub executable distribution is out of scope. Backend migration follows reliable completion and old-code
  cleanup of the clients.
