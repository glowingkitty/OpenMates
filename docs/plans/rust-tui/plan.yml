# Workflow rules adopted 2026-11-02 after the Codex run (12 days, ~18B tokens,
# 430 CI jobs with 67% failures, no landed product code).
workflow:
  - Land small, compiling increments on dev via sessions.py deploy; inactive code
    is fine. The git commit is the only source identity - no seals, pins,
    manifests, proof packets or candidate-authority registrations.
  - At most one independent code review per landing.
  - Two identical failures, then stop and reassess; never retry CI blindly.
  - Parallel helpers each own disjoint paths and work in their own session
    worktree; one integrator lands. Lanes - core auth/crypto; sync/storage/cache;
    CLI commands; TUI; WASM + web adapter; npm/Python bindings; CI; benchmark.
  - Shared CARGO_TARGET_DIR outside worktrees (~/.cache/openmates-rust-target),
    builds with -j 4 (linker OOM above that on this host).
  - Hourly checklist + latest performance table to the user. Never stop to wait
    for answers on non-critical questions; keep other lanes running.
  - Memory acceptance - peak RSS of the whole process tree per client
    (/usr/bin/time or cgroup memory.peak), Rust <= TypeScript.
