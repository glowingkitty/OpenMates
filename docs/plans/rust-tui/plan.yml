profile: concise
id: rust-tui
title: Move the OpenMates CLI/TUI, web client logic and SDKs onto one shared Rust core
status: implementing
task: TASK-1517
goal: >-
  Replace the TypeScript CLI/TUI with one 100% Rust application, move all reusable
  web client logic (auth, encryption, storage policy, networking, reconnect, sync,
  recovery) into the same shared Rust core compiled to WASM, and keep synchronized
  Rust/npm/Python SDKs. Users must notice no difference except speed: existing
  logins keep working unchanged, every existing chat, embed and other user data
  decrypts, security never degrades, and wall time, CPU and memory are at least
  as good as TypeScript (ideally noticeably better). Priority: CLI/TUI and web
  app first; SDK parity is secondary but required before publication.

specifications:
  - specifications/surfaces/cli/specification.yml
  - specifications/surfaces/sdk/specification.yml
  - specifications/features/terminal-ui/specification.yml
  - specifications/architecture/sync/specification.yml
  - specifications/architecture/storage-lifecycle/specification.yml
