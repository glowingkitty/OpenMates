- Cross-SDK executable conformance and strict npm/PyPI/Rust publication gates, including missing capability detection.
- Isolated GitHub self-host edition install/setup and lifecycle tests executed through the Rust CLI.
- Standalone full-application comparison and side-by-side dev native-binary smoke, separate from renderer-only measurements;
  keep the installed npm command.
- Joint agent/user explicit retirement acceptance after full parity/security before npm CLI/TUI command or source
  removal.
- Essential-native exact-source exit criteria gate browser admission; exhaustive CLI/app parity is separately required
  off the web critical path.
- Full-web BEFORE and AFTER download/transfer/JavaScript/WASM/cold startup/core-flow/CPU/RAM measurements use matching
  conditions; no assumed minimal overhead.
