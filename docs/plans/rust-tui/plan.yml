architecture_follow_up:
  date: '2026-10-22'
  status: approved_client_expansion
  user_goal: We do want to use shared Rust components, I think as described in the document, for all the clients.
    So all the clients use the same logic for encryption, for data storage, connecting to server, reconnecting to
    server, synchronization, and this kind of stuff. Let's quickly clarify this and then plan out the next steps.
  source_document: Migration_Shared_Rust_Core_Architecture_Plan.docx supplied by the user on 2026-10-22.
  authority: Five clarification rounds explicitly settle storage adapters, CLI/TUI then web then Apple sequencing,
    all reusable Rust application logic, Linux/macOS verification and Cargo-first distribution. User reiterates
    updating Specifications and then implementing; the attachment remains reference material rather than an independent
    directive.
  implementation_state: The 2026-10-23 user-approved sequencing amendment below supersedes the earlier full-native
    prerequisite. Prove essential native flows, then begin browser/WASM integration immediately; exhaustive CLI
    parity remains required separately.
  backend_boundary: Moving backend services from Python to Rust is a later stage only. Do not implement it now;
    begin separately after all client migrations work reliably, their required verification is complete and superseded
    client code is cleaned up and removed under acceptance gates.
  confirmed_decisions:
    storage: Shared Rust models, encryption, schema/migration and transactional recovery rules with thin platform
      storage adapters; retain IndexedDB and SwiftData initially. Performance and reliability require measured evidence
      before replacement.
    sequence: Superseded by the approved 2026-10-23 essential-native then immediate browser/WASM sequence below.
      Web is verified before coordinated Apple migration; full CLI parity continues separately.
    rust_scope: All reusable headless application operations and decisions belong in Rust; web Svelte/TypeScript
      is limited to UI/DOM and thin browser API integration such as media/WebRTC. CLI/TUI application functionality
      remains entirely Rust.
    testing: Required Linux dev and actual macOS CLI/TUI verification; Windows testing is explicitly waived and
      no extra CPU-architecture test matrix is required. Existing mandatory isolated GitHub CI and self-host setup
      verification remain required. Untested Windows support must not be claimed or silently dropped from inventory.
    distribution: Primary CLI/TUI installation is cargo install from a published binary crate; Rust SDK is a separate
      library crate. Versioned development prereleases precede stable publication. GitHub downloadable executable
      assets are expressly out of scope for this work.
    web_performance: Compare total compressed JavaScript plus WASM bytes, cold page load, first usable chat, runtime
      responsiveness, CPU and memory with the original web baseline. Minimal download overhead is a measured target
      rather than a guaranteed consequence of Rust.
  scope:
  - Evolve the existing packages/openmates-rust implementation into shared client components; do not start a competing
    SDK or move repository trees merely to match the attachment.
  - Share protocol/domain validation, encryption and key lifecycle policy, auth/session transitions, streaming,
    sync/recovery, replay/conflict rules and durable repository policy across Rust CLI/TUI, web, Apple clients and
    supported npm/Python libraries.
  - Keep Svelte and SwiftUI interfaces native to their hosts. CLI/TUI parsing/rendering remain native Rust; supported
    npm/Python libraries remain direct libraries with explicit credentials and no CLI subprocess.
  - Separate portable policy/state transitions from target-specific transport, storage, secret access, timers/randomness
    and lifecycle capabilities. Adapters execute platform operations without reimplementing sync or security policy.
  - Preserve browser-managed Cookie/TLS behavior and native credential protection. Keychain, protected key handles,
    browser storage access and suspension/background scheduling remain explicit host capabilities.
  - Rust owns persistence semantics, encryption boundaries, schema/migration policy and atomic commit requirements;
    a shared policy does not require identical physical storage APIs on every target.
  boundaries:
    portable_core: Domain/protocol models, audited crypto composition, privacy/consent policy, auth/sync/recovery
      reducers, outbox and replay fences; no CLI profile discovery, UI, Unix syscalls or unconditional native event-loop
      dependency.
    runtime_and_repository: Execute core effects, serialize account/Team transitions and credential rotation, durably
      commit encrypted records/cursors/outbox acknowledgements and enforce one authorized writer per context.
    adapters_and_bindings: Rust-native executor/storage; Swift binding plus Apple secret/lifecycle adapters; WASM
      worker plus browser fetch/WebSocket/storage adapters; existing Node-API/PyO3 bindings to the same core.
    hosts: UI/navigation, terminal command parsing, platform login presentation, push/widgets/audio/video and OS
      background scheduling. Hosts pass lifecycle events to the shared state machine.
  verified_starting_points:
  - Existing Rust SDK already supplies substantial auth/crypto/HTTP-WebSocket/stream/recovery logic and direct npm/Python
    session bindings, but unconditional Tokio network and rustix dependencies mean it is not yet a portable browser
    core.
  - Current web persistence uses IndexedDB in frontend/packages/ui/src/services/db.ts; Apple OfflineStore uses SwiftData
    and separate Watch recovery components exist.
  - Existing 138 SDK gaps, CLI draft CI failure, self-host verification and native dev installation remain open.
    Pure-core tests alone cannot close any platform or adapter gap.
  implementation_details_to_validate:
  - Exact crate/executor boundary, async ownership, cancellation, backpressure and versioned batched event/command
    contracts; no per-frame or per-token UI callback requirement.
  - UniFFI Swift packaging and watchOS/extension constraints; WASM worker/browser credentials, WebSocket and multi-tab
    writer coordination.
  - Keep existing storage through thin adapters initially; select native SQLite and any browser OPFS SQLite only
    after compatibility, quota, private browsing, concurrency and data migration/recovery trials.
  - No claim that Rust alone guarantees constant-time crypto, secret erasure, browser XSS protection or faster network/inference.
    Preserve audited primitives and measure whole applications.
  stages:
  - id: boundary-audit
    outcome: Preserve shared Rust ownership and explicit browser/native/Apple adapters in existing Specifications.
    acceptance: Security, credentials, encrypted persistence, cancellation and replay/commit fences remain unchanged.
  - id: essential-native-client
    outcome: Prove auth, encrypted chat, streaming/cancel, persistence and sync/reconnect/recovery through the entirely
      Rust CLI/TUI.
    acceptance: The concrete essential-native stage below has required exact-source evidence; unsupported unrelated
