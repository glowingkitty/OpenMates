scope:
  - One native Rust application owns layouts, input, state, auth, encryption, storage, sync and network calls.
  - Ratatui/Crossterm with Tokio networking; no Node/TypeScript runtime, client bridge, sidecar or delegated rendering.
  - Preserve current Chats, Apps, Projects, Workflows, Tasks, settings and rich-message workflows.
  - Native first-party auth and existing encrypted API/WebSocket protocols; no new server access or plaintext endpoints.
  - Complete CLI commands, flags, scripting, JSON/output channels, exit codes, streaming, cancellation, platform behavior and self-host management.
  - Shared headless Rust SDK owns explicit-credential auth, crypto, API/WebSocket, streaming and recovery; CLI/TUI own rendering, parsing and interactive profiles.
  - All reusable headless client operations move to the same Rust components, with thin platform storage/network/secret/lifecycle adapters; preserve existing IndexedDB and SwiftData initially.
  - Prove essential native auth/chat/stream/cancel/persistence/sync/recovery, then start browser/WASM immediately while full CLI parity continues separately; verify web before Apple and defer backend until accepted client cleanup.
  - Cargo/crates.io CLI and separate SDK packages, versioned dev prereleases and source-package install proof; no GitHub executable assets.
  - Supported npm and PyPI libraries call library functionality directly and never launch a CLI; idiomatic APIs preserve compatibility or version/document breaking changes.
  - Maintained three-SDK capability matrix, shared schemas/protocol fixtures/crypto vectors, executable conformance and publication gates.
  - Secure independent Rust credential store, encrypted owner-scoped caches and strict transport/session/Team fencing.
  - Reproducible comparison of full native layout/render startup, redraw, CPU, output and memory with the current TypeScript TUI.
decisions:
- User explicitly rejected the earlier hybrid paint-backend approach; its code and measurements are superseded and
  excluded.
- Use existing product contracts and cryptographic wire formats; architecture/language changes introduce no new
  product semantics.
- No model/provider overrides inside OpenMates; retain automatic routing.
- Expose a verified Rust command or explicit installation path alongside the installed npm CLI early for daily testing;
  do not automatically replace the global command or silently fall back.
- Developer SDK instances never automatically inherit the CLI user's stored login.
- SDK public capabilities include matching relevant auth modes, operations, encryption, streaming, recovery and
  typed errors in all three languages.
- Backend services and separate test/benchmark harnesses are outside the all-Rust application runtime requirement.
- Retiring npm CLI/TUI source requires passing replacement parity/security plus explicit agent and user confirmation;
  this approval does not bypass that later acceptance condition.
- The 2026-10-23 essential-native exit gate admits browser/WASM immediately; exhaustive command/app parity, full
  release readiness and retirement acceptance remain separate requirements.
