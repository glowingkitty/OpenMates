schema_version: 2
id: workflow-reordering-and-input-controls
title: Workflow node reordering and typed skill inputs
status: verified
goal: >-
  Workflow authors can reorder eligible nodes by dragging or using adjacent
  move buttons, and every enabled app skill presents location and date inputs
  with controls matching the input semantics.
scope:
  in: [graph edge reordering, move controls, location selection, calendar inputs, paired date ranges, enabled skill schema audit]
  out: [new workflow node types, execution semantics, unrelated skill APIs]
scenarios:
  - id: S-1
    title: Reorder a workflow
    given: [A workflow has consecutive independent steps.]
    when: [The author drags a step or uses an available move button.]
    then: [The graph saves the new order while branches and dependencies stay valid.]
  - id: S-2
    title: Enter typed skill inputs
    given: [The author edits an enabled app skill.]
    when: [Its schema declares a place, date, time, URL, or paired date range.]
    then: [The editor presents the corresponding picker or input control.]
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Buttons and drag moves persist valid order; invalid moves are hidden or rejected.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-UNIT-REORDER, T-PW-PREVIEW, T-PW-ROUTE]
  - id: AC-2
    scenario: S-2
    text: Enabled skill schemas select location, calendar date, time, URL, and combined range controls where appropriate.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_frontend
    verification_ids: [T-PY-SCHEMA, T-PW-PREVIEW, T-PW-ROUTE]
