schema_version: 2
profile: concise
id: spec-sub-chats
title: Sub-chats as general delegation; spec-driven development checks assumptions and runs Tasks in linked sub-chats that inherit the Project focus
status: implementing
goal: >-
  Spec-driven development must use sub-chats, and sub-chats are a general mechanism, not a Deep research special
  case. Whenever a task is complex and splits into independent parts, the model delegates to sub-chats, in every focus
  and in plain chats, without over-triggering on simple tasks. The Write specification focus requires one sub-chat per
  assumption check and one per Task when implementing; the main chat only coordinates, summarises results and asks the
  user's decisions. Each assumption gets its linked_sub_chat_id and each Task its sub-chat, visible in the
  Specification, Check and Plan cards and in the sub-chat UI. A sub-chat inherits its parent's Project focus as its base
  and may add one specific focus on top (two-focus rule). Backend, web and Rust core; Apple gets a note. Proven by a
  real-inference web run (owner request 2026-11-22, receipt a981bf2c79cd93d4).

