decisions:
  - Sub-chats are a general mechanism; delegate when a request splits into two or more independent, substantial parts; never for simple or single-answer requests (owner 2026-11-22, receipt a981bf2c79cd93d4).
  - Write specification requires one sub-chat per assumption check and one per Task when implementing; the main chat only coordinates, summarises results and asks the user's decisions (owner, same receipt).
  - Assumptions get linked_sub_chat_id, Tasks their sub-chat; both visible in the Specification, Check and Plan cards and in the sub-chat UI (owner, same receipt).
  - A sub-chat inherits its parent's Project focus as base and may add one specific focus; at most two focus modes are active, a newly activated specific focus replaces the current one and the base stays (owner, receipts a981bf2c79cd93d4 and f26a3efc87da4825).
  - No Plan or Task before the user approved the drafted Specification (owner 2026-11-14, spec-driven-flow). Therefore the Plan with its assumptions is saved right after approval, the Plan state checking_assumptions runs the assumption sub-chats, and Tasks follow; this matches the existing missing_investigation gate.
  - Plans stay client-encrypted. The assistant's plans:create becomes a server-to-client action executed by the Rust core (same shape as the Project create request); the server mints the Plan and assumption ids so the model can link sub-chats in the same turn, and the client writes linked_sub_chat_id when it applies the spawn event. Task rows are server-written, so the server sets the Task's sub-chat link itself.
  - Existing sub-chat limits stay (three automatic per turn, more needs the user's confirmation card, depth two is terminal).
  - A child gets the parent's Project base by copying the parent's server-side Project focus binding to the child chat at dispatch (same user, Project and instruction revision); a child's specific focus is limited to a built-in focus or the parent's currently selected Project Focus.

contract:
  start_sub_chats_item_fields: >-
    focus_id (optional; one specific focus for the child, validated as above), link (optional;
    {kind: assumption|task, plan_id, id}); the spawn_sub_chats event carries both per child.
  child_binding: "project_focus:v1 binding copied to the child chat id with a new activation_id and parent_activation_id; dropped when the parent has none."
  plan_create_request_doc: docs/plans/spec-sub-chats/contracts/plan-create-request.md
  plan_create_request: "openmates.plan_create_request v1: {request_id, plan_id, title, summary, goal, specification_ref, assumptions: [{assumption_id, text, required_before}]}; the client encrypts and creates the Plan and assumption rows with those ids and answers with the result."
  task_link: "user_tasks.linked_sub_chat_id (string, plaintext like the assumption field); tasks:create accepts plan_id."

