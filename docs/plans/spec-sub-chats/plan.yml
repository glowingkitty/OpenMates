  - {id: L3, outcome: "Rust core: plan_create_request executor (encrypted Plan and assumption rows with server ids, answer to the server); sub-chat shell creation from the spawn event (encrypted title, category, icon and active focus) moves from TypeScript into the core and writes the assumption linked_sub_chat_id; old TS code deleted"}
  - {id: L3a, outcome: "Plan create delivery: server publishes plan_create_requested to clients with the plan_create_requests capability and validates plan_create_result (contracts/plan-create-request.md); the Rust core validates the request and plans the encrypted Plan and assumption creates with the server ids; the web relay runs them through the existing Plan service"}
  - {id: L4, outcome: "Write specification focus: sub-chat instructions per phase, server guard that the depth-0 spec chat delegates assumption checks and Task work (research and code tools not offered there while those are open)"}
  - {id: L5, outcome: "Web: Specification, Check and Plan cards and the active Plan panel show each assumption's and Task's sub-chat; the sub-chat header names what it checks or implements and links back; component specs with screenshots"}
  - {id: L6, outcome: "Real-inference web proof: a Specification for a new feature in a Project creates assumption sub-chats, then Task sub-chats, each with the right focus pill; video and screenshots"}

verification:
  rules:
    - Backend behaviour has pytest at the API/tool boundary; preprocessor wording has routing tests for complex and simple requests.
    - Rust core changes have cargo tests; the web shell suite stays green after the TS sub-chat shell code is deleted.
    - Every changed card has a /dev/preview fixture and component spec; screenshots go to the owner.
    - Final proof is the L6 real-inference web video on the deployed commit.
