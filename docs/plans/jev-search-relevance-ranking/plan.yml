    command: python3 -m pytest backend/tests/test_search_relevance.py
    covers: [AC-1]
    assertions:
      - Complete score responses produce stable descending relevance order.
      - Missing, malformed, unavailable, timed-out, or oversized decisions preserve input order.
      - State and questions are bounded and candidate text is labeled untrusted.
    red_phase: {required: true, expected: fail, evidence: {status: pending}}
    green_phase: {required: true, expected: pass, evidence: {status: pending}}
  - id: T-SKILLS
    type: pytest
    file: backend/tests/test_search_relevance.py
