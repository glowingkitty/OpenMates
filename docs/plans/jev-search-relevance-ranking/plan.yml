schema_version: 2
id: jev-search-relevance-ranking
title: Optional Jev Relevance Ranking For Search Skills
status: implementing

goal: >
  Add an optional relevance_criteria field to web, news, events, and home search;
  when the user states a material purpose, have the assistant fill it faithfully,
  retrieve a bounded pool of up to forty candidates, use one skill-specific Jev
  decision to rank them, and return the requested count (default ten). Preserve
  the current provider order and cost path when no criteria are present, and do
  not add this ranking to health appointment search.

scope:
  in:
    - Shared bounded Jev ranking infrastructure with minimized untrusted candidate projections, usage logging, deterministic tie-breaking, and provider-order fallback.
    - Optional relevance_criteria request fields and assistant tool guidance for web, news, events, and home search.
    - Forty-candidate retrieval when ranking is active: two Brave pages for web, one Brave News request, and bounded deduplicated merged pools for events and home.
    - Public count or max_results controls with a default of ten and their existing public maximums.
    - Focused backend tests, app-skill E2E contract updates, privacy disclosure updates, and one real dev CLI inference proving faithful automatic criteria population.
    - Real-provider evidence for Jev ranking quality, latency, token use, and cost on web, news, events, and home examples.
  out:
    - Jev ranking or a relevance_criteria field for health appointment search.
    - Changing eligibility, structured filters, provider attribution, output safety, user credit pricing, or Brave billing semantics.
    - Inventing preferences for plain searches or allowing relevance scores to override hard filters.

