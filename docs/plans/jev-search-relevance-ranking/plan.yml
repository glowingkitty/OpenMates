implementation_state:
  subject_commit: pending

decisions:
  - id: D-1
    status: active
    decision: Run Jev only when relevance_criteria is nonblank.
    reason: Plain searches retain existing provider use, ordering, latency, and cost.
    decided_at: "2026-09-23T00:00:00Z"
  - id: D-2
    status: active
    decision: Web ranking uses two sequential twenty-result Brave pages while news uses one up-to-forty result Brave News request.
    reason: These are the bounded provider limits the user selected after evaluating Brave usage.
    decided_at: "2026-09-23T00:00:00Z"
  - id: D-3
    status: active
    decision: Events and home rank deduplicated candidates only after structured filters and before the final result limit or expensive result-only enrichment.
    reason: Hard constraints remain authoritative and enrichment cost stays bounded to returned results.
    decided_at: "2026-09-23T00:00:00Z"
  - id: D-4
    status: active
    decision: Each skill uses a separate evidence-based Jev rubric and falls back to the exact pre-ranking deterministic order, truncated to the requested public limit before formatting, enrichment, or embed creation, on any ranking failure.
    reason: Relevance evidence differs across general web, news, events, and housing, while a ranking outage must not break search or leak the forty-to-fifty-result internal pool into AI context.
    decided_at: "2026-09-23T00:00:00Z"
  - id: D-5
    status: active
    decision: Health appointments retain deterministic eligibility and earliest-availability ordering without this field or Jev path.
    reason: Medical appointment ranking carries distinct clinical and fairness risks and the current contract is already purpose- and eligibility-aware.
    decided_at: "2026-09-23T00:00:00Z"

scenarios:
  - id: S-1
    title: Purpose-aware search ranks a bounded pool
    given:
      - A web, news, events, or home search includes a nonblank relevance_criteria value.
    when:
      - The skill obtains candidates that satisfy its structured filters.
    then:
      - At most one bounded skill-specific Jev decision ranks the deduplicated candidates.
      - The final response contains no more than the requested count.
  - id: S-2
    title: Plain search preserves existing behavior
    given:
      - relevance_criteria is absent or blank.
    when:
      - The search executes.
    then:
      - The skill makes no Jev relevance-ranking call.
      - Existing provider retrieval and deterministic ordering remain unchanged.
  - id: S-3
    title: Ranking failure degrades safely
    given:
      - Candidate retrieval succeeds but Jev is unavailable, invalid, incomplete, rejected, oversized, or timed out.
    when:
      - The skill attempts optional ranking.
    then:
      - Candidates keep their pre-ranking deterministic order.
      - The successful provider search returns only the requested count before formatting, enrichment, or embed creation.
  - id: S-4
    title: Assistant infers a stated ranking purpose
    given:
      - An ordinary user request states a material purpose or preference that should affect ordering.
    when:
      - The assistant constructs a supported search tool call.
    then:
      - The tool call contains a concise faithful relevance_criteria value.
      - A plain control request does not gain an invented preference.
  - id: S-5
    title: Health appointments retain eligibility-first ordering
    given:
      - The user searches for a health appointment.
    when:
      - The appointment skill validates eligibility and availability.
    then:
      - The request schema has no relevance_criteria field.
      - Jev does not reorder appointments.

