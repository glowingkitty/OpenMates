contracts:
  api:
    - surface: GET /v1/default-inspirations?lang=<code>
      access_model: unauthenticated public REST API
      auth: None required.
      rate_limits: 60 requests per minute per existing limiter.
      credit_budget: No credits or inference budget charged at request time; records are pre-generated or static.
      encryption_boundary: Returns public cleartext inspiration copy and public media/wiki/feature metadata; no user content or encrypted account material.
      response: Up to ten public records targeting 3 video, 3 wiki, and 4 guest-accessible actionable feature entries.
      errors:
        - Existing HTTP errors remain unchanged; web authenticated fallback logs the error and uses static authenticated-safe content.
    - surface: Existing GET and POST /v1/daily-inspirations plus Daily Inspiration WebSocket events
      access_model: first-party client surface only
      auth: Existing authenticated account/device session required.
      rate_limits: Existing route and WebSocket limits unchanged.
      credit_budget: No credits charged for storage, delivery, or viewing.
      encryption_boundary: Existing client-encrypted personalized fields remain unchanged; this task does not alter payload formats.
  data:
    - Guest onboarding records are tagged guest-onboarding and never persisted as authenticated daily records.
    - Personalized records always outrank public-daily and authenticated-fallback records.
    - Public-daily and authenticated-fallback records may be replaced by later personalized delivery.
    - Daily set maximum and target count are ten across backend generation, public selection, endpoint top-up, and frontend store.
  ui_states:
    - Existing guest onboarding, unchanged.
    - Authenticated personalized Daily Inspiration.
    - Authenticated public-daily fallback.
    - Authenticated static wiki/tip fallback after visible logged errors.
    - Authenticated empty/loading transition without guest signup content.
  privacy_security:
    - Do not log personalized phrase, assistant response, follow-up text, keys, ciphertext bodies, or private user identifiers.
    - Guest onboarding remains local and is not written to authenticated IndexedDB or Directus records.
    - Public endpoint remains cleartext and contains no user-derived data beyond already-public pooled content.

