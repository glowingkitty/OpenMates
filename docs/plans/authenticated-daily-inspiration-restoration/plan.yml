risks:
  - risk: Auth transitions race with IndexedDB, Phase 1, or live WebSocket writes.
    mitigation: Explicit source priority and duplicate-delivery tests make writes deterministic.
  - risk: Restoring feature tips accidentally changes logged-out landing content.
    mitigation: Guest source files are out of scope and unchanged guest Playwright runs are required.
  - risk: Public pool inventory cannot always satisfy 3/3/4.
    mitigation: Endpoint tops up wiki and guest-accessible actionable features, returns up to ten, and reports actual counts in verification evidence.
  - risk: Concurrent landing work changes shared banner behavior.
    mitigation: Avoid DailyInspirationBanner guest markup/CSS edits and rebase through sessions.py deploy with exact guest regression verification.

