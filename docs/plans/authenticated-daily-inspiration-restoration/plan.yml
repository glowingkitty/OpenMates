schema_version: 2
id: authenticated-daily-inspiration-restoration
title: Authenticated Daily Inspiration Restoration
status: approved

goal: >
  Restore the authenticated Daily Inspiration header to useful daily video,
  Wikipedia, and actionable OpenMates tip cards while preserving the existing
  logged-out six-slide OpenMates onboarding carousel without visual, copy,
  timing, ordering, or interaction changes.

scope:
  in:
    - Distinguish guest onboarding records from authenticated personalized, public-daily, and authenticated-fallback records.
    - Prevent transient pre-auth guest records from remaining after authentication succeeds.
    - Restore authenticated IndexedDB, Phase 1, WebSocket, account API, public-default, and static-fallback priority in that order.
    - Restore actionable OpenMates tips with valid settings destinations.
    - Standardize personalized and public daily sets at ten cards targeting 3 videos, 3 Wikipedia entries, and 4 feature tips.
    - Preserve the existing authenticated Daily Inspiration layout, media previews, arrows, progress, chat creation, chat resume, and settings navigation.
    - Add deterministic backend, store, loader, deployed web, and unchanged-guest regression coverage.
  out:
    - Any edit to guestProductInspirations.ts, guest landing story components, guest story copy, guest animations, guest ordering, guest signup behavior, or guest responsive CSS.
    - Redesigning the authenticated banner or changing its existing visual hierarchy.
    - Changing encrypted daily-inspiration fields, IndexedDB encryption, Directus storage, WebSocket payloads, or authentication protocols.
    - Changing Apple UI composition; Apple consumes the corrected shared content contract without native visual work in this slice.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401; fallback gh issue search returned no matching issue on 2026-08-04.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/guest-interest-smart-selection/plan.yml
    - docs/plans/landing-page-onboarding-refresh/plan.yml
    - docs/architecture/frontend/daily-inspiration.md
    - docs/user-guide/daily-inspiration.md
  code_patterns:
    - +page.svelte currently calls loadDefaultInspirations before auth initialization completes.
    - loadDefaultInspirations.ts seeds guest product records while auth defaults false and then returns before authenticated recovery.
    - Chats.svelte skips account API fallback after waiting when any record exists, including non-personalized guest records.
    - DailyInspirationBanner switches renderer variants from auth state but reads one shared record array.
    - Commit 7373e90d2 replaced actionable feature tips with guest-oriented product statements.
    - The live public endpoint returned 2 videos, 3 wiki entries, and 5 feature cards despite the selector's 3/3/4 target.
  tests:
    - backend/tests/test_daily_inspiration_public_defaults.py
    - frontend/packages/ui/src/stores/__tests__/dailyInspirationStore.test.ts
    - frontend/apps/web_app/tests/daily-inspiration-chat-flow.spec.ts
    - frontend/apps/web_app/tests/landing-page-onboarding-refresh.spec.ts
    - frontend/apps/web_app/tests/landing-page-header-stories.spec.ts
    - frontend/apps/web_app/tests/unauthenticated-app-load.spec.ts

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Chat/Views/DailyInspirationView.swift
  parity_expectations:
    - Authenticated Apple users continue consuming personalized or public daily video, wiki, and actionable feature records and never receive the web guest signup slide as authenticated content.
    - No native layout or interaction change is required because this slice corrects shared content and web source selection.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios
  intentional_native_differences:
    - The web-only logged-out animated onboarding remains governed by the existing landing specification and is not added to Apple in this task.

clarification:
  rounds:
    - question: Should the current logged-out six-slide product carousel change while authenticated Daily Inspiration is repaired?
      answer: No. It must remain untouched.
    - question: What should authenticated users receive?
      answer: Actual useful OpenMates tips plus daily Wikipedia and video entries, using the existing authenticated header presentation.
    - question: Should the implementation proceed after specification?
      answer: Yes. The user approved the plan and explicitly requested spec creation plus implementation.
  vision_summary: >
    Logged-out visitors keep the exact existing OpenMates education journey.
    Authenticated users see only useful daily content: personalized or public
    videos, Wikipedia prompts, and actionable OpenMates tips with working
    destinations. Guest signup and product-story records never survive an auth
    transition into the authenticated header.
  approved_by_user: true

