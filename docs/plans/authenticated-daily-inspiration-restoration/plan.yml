scenarios:
  - id: S-1
    title: Logged-out onboarding remains unchanged
    given:
      - A visitor has no authenticated or remembered session.
    when:
      - The visitor opens the new-chat landing screen.
    then:
      - The existing six IDs remain openmates-intro, openmates-actionable-events, openmates-privacy-safety, openmates-mates-focus, openmates-provider-cross-platform, and openmates-signup-cta in that order.
      - Existing expanded intro, animations, progress, arrows, swipe, responsive layout, and final signup behavior are unchanged.

  - id: S-2
    title: Authentication replaces guest bootstrap records
    given:
      - The shared store temporarily contains guest onboarding records before authentication resolves.
    when:
      - The session resolves authenticated.
    then:
      - The authenticated loader runs even though the store is non-empty.
      - Guest onboarding records cannot satisfy personalized or public-daily recovery checks.
      - The authenticated header never contains openmates-signup-cta or guest story animation state.

  - id: S-3
    title: Personalized records retain priority
    given:
      - An authenticated account has encrypted Daily Inspiration records in IndexedDB, Phase 1 sync, live WebSocket delivery, or account API storage.
    when:
      - The new-chat screen loads or sync completes.
    then:
      - Personalized records replace non-personalized bootstrap or public records.
      - Duplicate deliveries preserve opened chat state and manual carousel position.

  - id: S-4
    title: Authenticated account without personalized records receives useful defaults
    given:
      - An authenticated account has no usable personalized records.
    when:
      - IndexedDB, Phase 1, live delivery, and account API recovery produce no records.
    then:
      - The client loads the public daily set rather than retaining guest onboarding.
      - The set targets 3 videos, 3 Wikipedia entries, and 4 actionable OpenMates tips.
      - Endpoint failure leaves a dedicated authenticated wiki/tip fallback, never guest signup content.

  - id: S-5
    title: Actionable feature tips open valid destinations
    given:
      - An authenticated feature card is visible.
    when:
      - The user activates the card.
    then:
      - The card has a non-empty valid settings_path.
      - Examples include export data, personal-data hiding, trusted source skills, focus modes, memories, incognito, and privacy controls.
      - The existing authenticated renderer shows its settings CTA and opens that destination.

  - id: S-6
    title: Video and wiki cards retain existing behavior
    given:
      - An authenticated video or Wikipedia card is visible.
    when:
      - The user opens the preview or activates the main card.
    then:
      - Preview actions retain existing fullscreen behavior.
      - Main-card activation creates or resumes the encrypted inspiration chat.

