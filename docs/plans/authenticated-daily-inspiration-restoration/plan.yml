implementation_notes:
  plan_path: docs/plans/authenticated-daily-inspiration-restoration/plan.yml
  existing_patterns:
    - dailyInspirationStore already protects personalized records from public writes and preserves duplicate delivery state.
    - loadDefaultInspirations already implements IndexedDB then public endpoint recovery but currently conflates guest bootstrap records.
    - Phase 1 and live WebSocket handlers already mark personalized records.
    - The pre-7373e90d2 feature catalog provides actionable copy and currently valid settings destinations.
    - Existing guest Playwright tests encode the protected six-slide behavior.
  architecture: >
    Extend the existing store with an explicit source rather than introducing a
    parallel carousel. Split guest bootstrap and authenticated recovery entry
    points while reusing the current loader internals. On auth success, run
    authenticated recovery regardless of non-personalized guest occupancy; on
    logout, reset and explicitly load guest onboarding. Restore the backend
    actionable feature catalog and unify all quota constants at 3/3/4. Keep the
    shared banner markup and guest story implementation unchanged.
  data_flow:
    - A logged-out new-chat load writes the current six records with source guest-onboarding.
    - Authentication success invokes authenticated recovery; guest records do not count as recovered content.
    - IndexedDB, Phase 1, WebSocket, or account API writes source personalized and wins permanently over defaults.
    - Empty personalized recovery fetches the public endpoint and writes source public-daily.
    - Public failure writes authenticated-safe static wiki/actionable tips with source authenticated-fallback after logging the failure.
    - Logout resets authenticated state and reloads the unchanged guest records.
  affected_files:
    - { path: docs/plans/authenticated-daily-inspiration-restoration/plan.yml, reason: Executable product, plan, task, and evidence ledger }
    - { path: backend/apps/ai/daily_inspiration/feature_suggestions.py, reason: Restore actionable authenticated/public-safe feature tips }
    - { path: backend/core/api/app/tasks/daily_inspiration_tasks.py, reason: Restore personalized 3/3/4 ten-card target }
    - { path: backend/core/api/app/routes/default_inspirations.py, reason: Align public fallback top-up to four features }
    - { path: backend/tests/test_daily_inspiration_public_defaults.py, reason: Red/green actionable catalog and quota contract }
    - { path: frontend/packages/ui/src/stores/dailyInspirationStore.ts, reason: Explicit source and audience-safe write priority }
    - { path: frontend/packages/ui/src/demo_chats/loadDefaultInspirations.ts, reason: Separate guest bootstrap from authenticated recovery and fallback }
    - { path: frontend/packages/ui/src/components/chats/Chats.svelte, reason: Do not let guest/public records suppress personalized account recovery }
    - { path: frontend/packages/ui/src/stores/authSessionActions.ts, reason: Trigger authenticated recovery after successful auth restoration if required }
    - { path: frontend/packages/ui/src/stores/authLoginLogoutActions.ts, reason: Explicitly restore guest onboarding after logout }
    - { path: frontend/packages/ui/src/stores/__tests__/dailyInspirationStore.test.ts, reason: Source priority regression coverage }
    - { path: frontend/apps/web_app/tests/daily-inspiration-chat-flow.spec.ts, reason: Deployed authenticated audience-isolation coverage }
  api_data_ui_privacy_impact:
    - Public API composition returns the intended 3/3/4 mix without changing route, schema, auth, rate limit, or cleartext boundary.
    - Personalized encryption formats and WebSocket payloads are unchanged.
    - Authenticated UI layout is unchanged; only correct content reaches it.
    - Guest onboarding source, presentation, and interaction are unchanged.
  migration_rollout:
    - No database migration or backfill.
    - Existing personalized records continue to decrypt and render.
    - Restart local API and worker services under Docker lock before direct dev API proof.
    - Deploy web/backend changes together, verify REST then CLI then deployed Playwright and visual smoke.
  observability:
    - Log source transitions, record counts, and content-type counts without logging personalized content.
    - Retain visible errors for IndexedDB, account API, public endpoint, and fallback failures.
  assumptions_to_verify: [A-1, A-2, A-3]
  acceptance_coverage:
    - { acceptance_criterion: AC-1, verification_ids: [T-E2E-GUEST, V-UI-VISUAL-SMOKE] }
    - { acceptance_criterion: AC-2, verification_ids: [T-VITEST-STORE, T-E2E-AUTH] }
    - { acceptance_criterion: AC-3, verification_ids: [T-VITEST-STORE, T-E2E-AUTH] }
    - { acceptance_criterion: AC-4, verification_ids: [T-PYTEST, V-REST, V-CLI, T-E2E-AUTH] }
    - { acceptance_criterion: AC-5, verification_ids: [T-PYTEST, V-REST] }
