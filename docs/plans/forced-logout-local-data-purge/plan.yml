implementation_notes:
  plan_path: docs/plans/forced-logout-local-data-purge/plan.yml
  architecture: >
    Introduce shared purge helpers instead of duplicating partial cleanup logic.
    Web cleanup must fail closed by clearing UI/key state immediately and keeping
    durable purge markers until IndexedDB deletion succeeds. CLI cleanup must use
    one local purge helper from all logout paths and WebSocket force-logout handling.
  existing_patterns:
    - Web manual logout already has `resetLocalLogoutState()` for immediate UI/cache cleanup.
    - Web session-expiry cleanup already dispatches `userLoggingOut` for one path.
    - ChatKeyManager already tracks key provenance with `master_key`, `server_sync`, `bulk_init`, `shared_storage`, `share_link`, and `anonymous_session`.
    - CLI storage centralizes session and cache files in `storage.ts`.
    - Backend force-logout broadcast helper already exists in `auth_sessions.py`.
  data_flow:
    - Backend invalidates session or account and publishes `force_logout`.
    - Web/CLI receive force logout, synchronously clear active UI and in-memory keys, then delete durable private data.
    - If durable deletion is blocked, a persistent marker blocks private logged-out reads and retries on startup or next auth check.
    - Offline CLI detects invalid session on `/v1/auth/session` or WebSocket auth failure and runs the same purge helper.
  affected_files:
    - path: frontend/packages/ui/src/stores/authLoginLogoutActions.ts
      reason: Share reliable private local purge between manual and forced web logout paths.
    - path: frontend/packages/ui/src/stores/authSessionActions.ts
      reason: Route every auth-false security path through the shared purge behavior.
    - path: frontend/packages/ui/src/services/db.ts
      reason: Make `chats_db` deletion markers truthful and blocked deletion retryable.
    - path: frontend/packages/ui/src/services/userDB.ts
      reason: Make `user_db` deletion markers truthful and blocked deletion retryable.
    - path: frontend/packages/ui/src/components/ActiveChat.svelte
      reason: Prevent private key provenance from preserving logged-out chats.
    - path: frontend/apps/web_app/src/routes/+page.svelte
      reason: Prevent logged-out private IndexedDB deep-link loading.
    - path: frontend/apps/web_app/tests/session-revoke-flow.spec.ts
      reason: Add deployed browser regression assertions for local data and active chat cleanup.
    - path: frontend/packages/openmates-cli/src/storage.ts
      reason: Add destructive local purge helper for session, caches, and keys.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Use purge helper on all CLI logout/account/session-invalid paths.
    - path: frontend/packages/openmates-cli/src/ws.ts
      reason: Handle `force_logout` and close remote-access/WebSocket sessions.
    - path: backend/core/api/app/routes/settings.py
      reason: Broadcast force logout during account deletion.
    - path: backend/tests/test_forced_logout_broadcasts.py
      reason: Prove backend broadcast wiring.
  verification_strategy:
    - Add or extend tests first and run red where possible.
    - Implement web storage purge and guard behavior before Playwright deployment.
    - Implement CLI purge and WebSocket force-logout handling before SDK parity checks because CLI is the affected non-browser surface.
    - Add backend broadcast test and implementation for account deletion.
    - Deploy before Playwright green verification.
    - Attempt Apple remote status/build after web and CLI/backend green gates.
  verification_order:
    - T-PYTEST-BACKEND-001 red/green for backend broadcast wiring.
    - T-CLI-UNIT-001 through T-CLI-UNIT-004 red/green for CLI local purge and force logout.
    - T-VITEST-WEB-001 through T-VITEST-WEB-003 red/green for web local behavior.
    - T-E2E-WEB-001 red/green after deploy against app.dev.openmates.org.
    - V-APPLE-001 final parity check or sanitized blocker.

