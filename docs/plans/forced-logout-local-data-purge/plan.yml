apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Auth/**/*.swift
    - apple/OpenMates/Sources/Features/Settings/**/*.swift
    - apple/OpenMates/Sources/Features/Chat/**/*.swift
  parity_expectations:
    - Apple must clear native local account/team chat caches and keys on forced logout/session revocation/account deletion if equivalent local persistence exists.
    - This implementation slice changes web, CLI, and backend first; Apple parity is verified or explicitly handed off after those gates are green.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios --simulator "iPhone 17"
  intentional_native_differences:
    - Apple uses Keychain/native persistence rather than IndexedDB or `~/.openmates`, but must preserve the same security outcome.

clarification:
  rounds:
    - question: Should all CLI logout paths purge local encrypted cache, user keys, team cache, and team keys, or only forced/session-revoked/account-deleted logout?
      answer: All logout types must purge local encrypted cache/user keys and team cache/keys.
    - question: What must happen on web forced logout?
      answer: Ensure local data is deleted, active chat is cleared, and the not-authenticated new-chat screen is opened.
    - question: What must happen when the user disconnects a CLI device from the web app?
      answer: Forced logout must disconnect the remote-access session, delete the local copy of user/team data, and clear local keys.
  vision_summary: >
    Web and CLI must treat logout as a trust-boundary crossing, not only an auth
    flag change. The visible chat state, encrypted local caches, and decrypted
    keys must all be cleared reliably, with online forced logout delivered by
    WebSocket and offline clients purging on their next authenticated operation.
  approved_by_user: true

decisions:
  - id: D-1
    status: active
    decision: Resolve logout cleanup only after private local data is either deleted or a durable purge marker remains for retry.
    reason: Treating blocked IndexedDB deletion as success allows logged-out clients to retain private data.
    decided_at: "2026-07-26T00:00:00Z"
  - id: D-2
    status: active
    decision: Logged-out web clients may preserve only explicit public, anonymous, session-only draft, or shared-key-provenance chats.
    reason: A surviving private IndexedDB row or cached private key must never be enough to render a logged-out chat.
    decided_at: "2026-07-26T00:00:00Z"
  - id: D-3
    status: active
    decision: CLI normal logout and forced logout share the same destructive local purge helper.
    reason: A logout command should not leave encrypted account/team caches or local keys behind.
    decided_at: "2026-07-26T00:00:00Z"
  - id: D-4
    status: active
    decision: Account deletion must broadcast logout to active clients in addition to invalidating server sessions.
    reason: Online clients should purge immediately instead of waiting for a later failed auth request.
    decided_at: "2026-07-26T00:00:00Z"

scenarios:
  - id: S-1
    title: Web forced logout clears private local data and opens logged-out new chat
    given:
      - Alice is authenticated in the web app and has a private chat open.
      - "`chats_db`, `user_db`, local crypto storage, chat caches, and active chat state contain Alice's private account data."
    when:
      - The server invalidates Alice's session through session revocation, all-devices logout, account deletion, or session expiry.
    then:
      - The active chat and URL hash are cleared immediately.
      - The app shows the not-authenticated new-chat screen with login/signup available.
      - Private browser databases, local crypto keys, chat caches, drafts, pending responses, and account/team markers are purged or remain durably marked for retry if the browser blocks deletion.

  - id: S-2
    title: Blocked web IndexedDB deletion stays unsafe until retry succeeds
    given:
      - A second web tab or lingering connection blocks `chats_db` or `user_db` deletion.
    when:
      - A logout or forced logout starts local data cleanup.
    then:
      - Cleanup does not clear initialized/needs-cleanup markers as if deletion succeeded.
      - Other tabs receive a close/purge signal and clear in-memory keys/UI.
      - Future app boot or auth checks retry deletion before allowing private chat reads while unauthenticated.

  - id: S-3
    title: Logged-out web cannot load private chat rows or private cached keys
    given:
      - A private chat row or cached private chat key survives locally after logout.
    when:
      - The logged-out app starts with `#chat-id=<PRIVATE_CHAT_ID>` or ActiveChat sees auth become false.
    then:
      - The private chat is not loaded or rendered.
      - The app clears the active chat and returns to logged-out new-chat.
      - Public/example, anonymous, session draft, and explicit shared-key chats remain allowed only through their explicit provenance.

  - id: S-4
    title: CLI logout purges all local account and team artifacts
    given:
      - Alice has logged into the CLI and has personal sync cache, team sync cache, master key, email key, and team key material on the local device.
    when:
      - Alice runs normal CLI logout, or a command detects the session is invalid.
    then:
      - The CLI deletes session credentials, master key, email key, team keys, personal sync cache, and every team sync cache.
      - Subsequent CLI commands report that Alice must log in again and cannot read stale cached encrypted account/team data.

  - id: S-5
    title: CLI device removal from web forces CLI purge and remote disconnect
    given:
      - Alice has an active CLI WebSocket or remote-access session.
      - Alice removes that CLI session from the web app Active Sessions screen.
    when:
      - The backend broadcasts `force_logout` to the revoked CLI connection.
    then:
      - The CLI closes the WebSocket/remote-access session.
      - The CLI runs the same local purge as normal logout.
      - Any in-flight CLI command stops with a re-authentication error and leaves no local account/team cache or key material.

  - id: S-6
    title: Account deletion broadcasts forced logout before clients go stale
    given:
      - Alice has active web and CLI sessions.
    when:
      - Alice's account deletion starts from web, CLI, or a policy-triggered server path.
    then:
      - Active sessions receive `force_logout` with an account-deletion reason when online.
      - Offline clients purge local account/team artifacts the next time they call `/v1/auth/session` or open an authenticated WebSocket.
      - The deleting client also purges local data before reporting completion.

