assumptions:
  - id: A-1
    text: "`force_logout` is the canonical real-time client event for session revocation and logout-all-devices."
    category: backend_contract
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/routes/auth_routes/auth_sessions.py
        summary: "Session revoke and logout-all-devices publish `event_for_client: force_logout`."
  - id: A-2
    text: CLI remote-access sessions use the same OpenMatesWsClient transport or an equivalent WebSocket that can receive account/session events.
    category: cli_contract
    required_before: task_execution
    status: checking
  - id: A-3
    text: Anonymous/public/example chat state is not encrypted with the user's account or team keys and can be preserved when explicitly identified.
    category: privacy_security
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/packages/ui/src/components/ActiveChat.svelte
        summary: Public, anonymous, and session-draft chat paths are separate from authenticated private chat loading.

contracts:
  api:
    - route: WebSocket user_updates force_logout
      access_model: first-party client surface only
      auth: authenticated WebSocket session/cookie/token
      rate_limits: backend event fanout only; no public caller surface
      encrypted_data: no decrypted chat content in event payload
      changes:
        - Account deletion paths must publish `force_logout` before or while server sessions are invalidated.
        - CLI and web clients must treat `reason` values including `session_revoked`, `all_other_sessions_revoked`, `all_devices_logout`, and account-deletion reasons as local purge triggers.
    - route: POST /v1/auth/session
      access_model: first-party client surface only
      auth: refresh-token cookie/session token
      rate_limits: existing auth/session rate policy
      encrypted_data: may return encrypted user metadata only; no decrypted chat plaintext
      changes:
        - CLI and web stale-session handling must purge local account/team artifacts when the response proves the local session is invalid.
  data:
    - "Web private stores: `chats_db`, `user_db`, `openmates_crypto`, shared in-memory chat/key caches, drafts, pending AI responses, and logout retry markers."
    - "CLI private stores: `~/.openmates/session.json`, keychain/encrypted/plaintext master and email key entries, `sync_cache.json`, `sync_cache.team.*.json`, and `team_keys.json` entries."
    - Deletion must be idempotent and safe when files/databases are already absent.
  ui_states:
    - Web forced logout clears active chat and URL hash.
    - Web forced logout closes private fullscreen embeds/settings surfaces that depend on authenticated private data.
    - Web forced logout shows logged-out new-chat state with login/signup available.
    - CLI forced logout prints or throws a re-authentication message and does not continue using stale local cache.
  privacy_security:
    - Decrypted chat keys and master/team keys must be cleared from memory and durable storage on logout.
    - Private encrypted account/team caches must not be readable as logged-out state even if deletion is delayed by browser locks.
    - Logs and test artifacts must not include raw chat content, keys, cookies, tokens, private emails, or share URL `#key=` fragments.

