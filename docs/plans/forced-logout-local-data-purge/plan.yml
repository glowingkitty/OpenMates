schema_version: 2
id: forced-logout-local-data-purge
title: Forced Logout Local Data Purge
status: implementing

goal: >
  Enforce one security invariant across OpenMates clients: when an account session
  becomes unauthenticated through forced logout, session revocation, account
  deletion, or normal logout, private account and team data must be removed from
  local storage, decrypted keys must be cleared, and the user must not continue
  seeing or loading a private active chat while unauthenticated.

scope:
  in:
    - Web forced logout/session invalidation/account deletion cleanup for private IndexedDB, crypto keys, caches, drafts, active chat state, URL hash, and logged-out new-chat screen state.
    - Web IndexedDB deletion reliability, including blocked deletion retry markers and cross-tab close coordination.
    - Web route/render guards that prevent logged-out private chat loading from surviving local IndexedDB rows or cached private keys.
    - CLI normal logout, forced WebSocket logout, session-revoked logout, account-deleted logout, and next-command stale-session cleanup.
    - CLI deletion of session credentials, master key, email key, team keys, personal and team sync caches, and active remote-access/WebSocket sessions.
    - Backend broadcast coverage for session revocation, logout-all-devices, and account deletion paths that invalidate active sessions.
    - Regression tests for web unit behavior, web Playwright `*.spec.ts` session revocation cleanup, CLI storage/client behavior, and backend broadcast wiring.
  out:
    - Changing the zero-knowledge encryption format for chats, messages, embeds, memories, or team keys.
    - Deleting anonymous/public/example chat state that is explicitly not account-owned or encrypted with a user/team key.
    - Redesigning Settings session-management UI beyond test selectors or assertions required for cleanup verification.
    - Adding new public/developer REST endpoints.
    - Server-side permanent account deletion semantics outside ensuring logout broadcasts are sent before or during deletion.

