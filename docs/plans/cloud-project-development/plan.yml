scope:
  in:
    - Existing cloud-hosted encrypted Projects and Project creation, with no remote-host prerequisite.
    - Persistent human-readable Specifications, direct/chat editing, immutable revisions, review, approval, history and Project/chat links.
    - Plans with goal, optional assumptions and criteria, linked executable Tasks, required Check references and visible execution state.
    - Assumption research in linked Tasks/subchats, encrypted evidence and corrections, dependent-work gates and the no-assumption path.
    - Research, test-writing and implementation/debugging roles on the existing subchat and Task infrastructure.
    - Reusable deterministic, structured AI/Jev and human-confirmation Checks with revision-bound Runs and encrypted artifacts.
    - Exact hosted snapshots, isolated cloud build/test/preview, proposed changes and conflict-safe encrypted save-back.
    - Relevant logs, source, existing failure evidence and focused verification for bug fixes.
    - Short paths for small UI and other fixes, with no mandatory new Specification, Plan, assumption or subchat when unnecessary.
    - Live Plan, Task, assumption, subchat, Check and blocker projections in chat settings and Project views.
    - Stop, scope changes, missing context, reconnect, recovery, duplicate events and truthful completion.
    - Existing-stack preference; Rust backend and React web defaults for a new project without user constraints; relevant Rules/Memories.
  out:
    - Replacing the existing Project, Task, workflow scheduler, focus lifecycle or encryption model.
    - Requiring repository YAML files, terminal recovery or remote-access installation from product users.
    - A new model/provider integration, model-name guarantees, paid model benchmarks or customer cache-pricing changes.
    - Public publishing, production deployment or new third-party account/credential authority from ordinary Plan approval.
    - Retiring the installed CLI, replacing existing stores, or bypassing the shared Rust client architecture.

architecture:
  project: Container for related chats, files, Specifications, Plans, Tasks and Checks.
  specification: Durable required behavior, boundaries, models and user flows; requirement ids and exact revisions are referenced rather than copied.
  plan: A bounded delivery/change record that owns assumptions, success criteria and references to Tasks and required Checks.
  assumption: An uncertain claim discovered while planning; its investigation belongs to the Plan and records sources, correction and affected work.
  task: The only executable work unit and authority for assignment, status, ordering, dependency and activity.
  check: An independently reusable proof definition; a Run evaluates one exact definition and subject revision and owns its result/artifacts.
  subchat: An execution context for an authorized assignment, with a validated role packet, scoped authority, bounded context and structured report.
  focus: Guidance and phases for clarification/planning/execution; it does not become another scheduler or grant authority.
  reusable_client_logic: Shared Rust owns headless operations, crypto, persistence policy and recovery; web/Apple retain thin UI/platform adapters and Rust/npm/pip SDKs remain synchronized.
  automation: Deterministic code owns known states, permissions, gates, dispatch/retry and completion. Jev handles bounded semantic judgments; generative models write plans, code, explanations and improvements.
  routing: All OpenMates chats and inference tests use current default automatic routing without model/provider overrides. Role hints are routing inputs, not pinned model promises.

source_findings:
  existing:
    - Project creation, encrypted hosted file revisions, expected-base writes, history and focus authorization.
    - A read-only Specification fullscreen reader and draft Specification/Check product contracts.
    - Encrypted Plan records, revisions, assumptions, criteria, verifications, Task links, admission and evidence blockers.
    - General parallel/sequential subchats and Task-triggered AI execution.
    - Chat-settings Plan/Tasks tabs and a task-count progress display.
    - E2B Code Run, terminal output, artifacts, cancellation and preview building blocks.
  gaps:
    - Persistent Specification identity/revision APIs, authoring and trusted chat integration.
    - Complete reusable Check/Run storage and execution linkage; existing Plan verifications must be adapted without losing history.
    - Automatic assumption dispatch, validated result merge and event-driven dependent-work continuation.
    - Hosted-project snapshot/build/test/save-back receipts and authoritative coding completion.
    - Failed required verification currently blocks the Plan; this service path does not itself create repair work.
    - Plan UI confirmation supplies a summary without the source evidence required by the backend; corrected assumptions are also counted inconsistently.
    - Existing completion code requires one to five learnings despite the draft Plan contract making non-required fields optional.
    - Current chat-settings Plan cards show title/goal/status rather than the complete linked execution/proof projection.
  evidence_limit: Source inspection and existing tests are evidence of implementation shape, not a new passing product journey.
  prior_work:
    - docs/plans/native-agentic-coding-readiness/plan.yml: Project/file foundation; preserve its later checkpoints rather than the historical overview alone.
    - docs/plans/jev-agentic-project-work/plan.yml: Existing context, Focus/Rule/Workflow selection, direction assessment and improvement recommendations.
    - TASK-4636: Earlier cloud-first proposal retained in /home/superdev/.codex/artifacts/agentic-coding-01a16eba; no new provider work is implied by reusing that proposal.

