verification:
  rules:
    - Keep meaningful regression/contract metadata; no weakened assertions or invented tests for purely mechanical documentation.
    - Run focused pure/unit/lint/build checks locally. Product REST/WebSocket, native CLI/SDK and browser checks use immutable source in existing isolated GitHub CI.
    - Real-inference acceptance runs only on dev in disposable Projects/state using default automatic routing, with no model/provider override.
    - Never use the engineering Project or real user files as mutable test fixtures. Logs and tool results remain permission-scoped, bounded and private.
    - Use the shared Rust capability/conformance mechanisms as they land; coordinate with the active migration rather than creating a competing core or hidden Node/Python fallback.
    - Capture and deliver only the latest relevant successful recording per accepted flow, or the latest failure when no success exists; run each receipt's evidence command.
  checks:
    - id: V-1
      required: true
      proof: REST/CLI/SDK encrypted Specification and Check lifecycle, access denial, immutable revisions, conflicts, reload and executable conformance.
      coverage: Extend existing Plans/Projects client tests and add focused Specification/Check integration coverage in isolated CI.
    - id: V-2
      required: true
      proof: Specification/Plan direct edits, review/approval/history, optional-field semantics and mobile/desktop detail navigation.
      coverage: specification-fullscreen.spec.ts component baseline; plans-flow.spec.ts; plan-acceptance-checks-flow.spec.ts; Project and chat-settings tests plus focused authoring cases.
    - id: V-3
      required: true
      proof: Assumption investigation dispatch, source/correction merge, no-assumption fast path, duplicate events, missing context and dependent-work blocking/resume.
      coverage: test_plan_assumption_workflow.py; test_user_work_control.py; test_user_task_admission.py; plan-assumptions-flow.spec.ts; sub-chats-flow.spec.ts.
    - id: V-4
      required: true
      proof: Deterministic failure/repair/pass, Jev rubric result validation, stale subject/definition rejection and encrypted result/artifact history.
      coverage: Existing Plan verification/unit and code-run-languages tests extended with real Check/Run integration; direct Jev only in dev acceptance.
    - id: V-5
      required: true
      proof: Hosted snapshot/build/preview/save identity, supported Rust/React toolchain, no leaked keys/private paths, concurrent-edit preservation, stop and replay/reconnect recovery.
      coverage: projects-chat-file-executor.spec.ts; cli-project-file-chat.spec.ts; Code Run and Project authorization tests plus hosted-run integration.
    - id: V-6
      required: true
      proof: Real automatically routed conversations for S-1 through S-6, including bounded log investigation and a small UI fix without full planning.
      coverage: New focused agentic-project lifecycle browser/CLI acceptance with isolated dev test state; deterministic mechanics remain in CI.

follow_on_architecture:
  sequencing: Deliver the usable cloud lifecycle first; retain these mindmap items as explicit later packages rather than silently counting them as implemented.
  items:
    - Bounded deterministic/Jev supervision from Task/check telemetry; useful correction proposals without model polling for known state.
    - Unified Improvements suggestions with concrete Focus/Workflow/Rule references and selected user-triggered Apply; reuse existing Project recommendation jobs.
    - Dependency-version discovery, reproducible lockfiles and vulnerability checks with scoped tested updates rather than blind latest-version upgrades.
    - Optimize role/model/cache choices using measured quality/cost after the default-routed loop works; new provider access, credits and processing-region choices remain separate.
    - Verify remote-access parity against the same contract after cloud acceptance, preserving confinement, existing files and exact command approval.
    - Apple adapter/UI parity follows verified web behavior through the coordinated Mac workflow; reuse shared Rust operations.

