scenarios:
  - id: S-1
    title: New hosted recipe-planning project
    given: A user requests a recipe-planning app, with no existing files or specified stack.
    when: The assistant clarifies scope, creates the hosted Project and presents an editable Specification and linked Plan.
    then: Approved work creates meaningful tests and implementation, runs checks, repairs failures, saves the tested encrypted revision and presents its preview; the user can inspect progress and reopen the records.
    acceptance: [AC-1, AC-2, AC-3, AC-5, AC-6, AC-7, AC-8]
  - id: S-2
    title: Existing-project feature with uncertain assumptions
    given: A feature depends on an unverified claim about the existing API or a documented external capability.
    when: A linked research Task/subchat inspects authorized source or permitted public documentation.
    then: Sources and corrections are recorded, dependent implementation waits, and material scope changes return for review before work resumes.
    acceptance: [AC-2, AC-3, AC-6, AC-7, AC-8]
  - id: S-3
    title: Log-driven bug repair
    given: A user supplies a bug with relevant existing logs or a known failure in an accessible Project.
    when: The assistant inspects bounded relevant logs/source, links existing governing requirements and applies a focused fix.
    then: The repair is verified against the changed revision without requiring a fresh reproduction, full new Plan or new Specification; unresolved assumptions get targeted research only when necessary.
    acceptance: [AC-4, AC-5, AC-6, AC-7, AC-8]
  - id: S-4
    title: Small UI or other fix
    given: The user requests a bounded UI correction or another simple change.
    when: The assistant uses a short Task or current chat assignment and the relevant existing contract.
    then: It makes and checks the change, shows the result, and optionally records useful Specification documentation at chat completion without imposing the full planning lifecycle.
    acceptance: [AC-4, AC-5, AC-6, AC-7]
  - id: S-5
    title: Qualitative marketing Check
    given: A Project requires marketing text to satisfy an explicit style rubric.
    when: A Jev-backed structured Check evaluates a specific text revision and the text is later revised.
    then: The result identifies rubric/evaluator/input, a failure leads to correction work, and the earlier result becomes stale until the revised text is evaluated.
    acceptance: [AC-5, AC-6, AC-7, AC-8]
  - id: S-6
    title: Stop, interruption and conflicting edits
    given: Coding or checks are in flight while the user stops, reconnects or edits a newer file revision.
    when: An old worker report, duplicate event or late save arrives.
    then: Stop remains effective, recovery reconciles ownership, newer changes survive and stale proof cannot report completion.
    acceptance: [AC-1, AC-5, AC-6, AC-7, AC-8]

acceptance_criteria:
  - {id: AC-1, required: true, text: Specifications survive reload with encrypted private content, immutable revision identity, exact approval, history and visible optimistic conflicts.}
  - {id: AC-2, required: true, text: Direct and chat edits affect the same authoritative Specification; Plans reference its requirements and revision without owning a second editable copy.}
  - {id: AC-3, required: true, text: Each required assumption has a tracked investigation and source-backed outcome before dependent work starts; no assumptions means no invented research gate.}
  - {id: AC-4, required: true, text: Bug and small-fix paths run without a mandatory full Specification/Plan lifecycle; relevant existing evidence is reused and useful documentation may follow the fix.}
  - {id: AC-5, required: true, text: Required Checks have validated revision-bound Runs and private evidence; failed or stale evidence cannot satisfy completion.}
  - {id: AC-6, required: true, text: Authorized Tasks and subchats write tests, implement and repair within scope, preserve dependencies and stop/recovery, and cannot claim completion from a finished chat response alone.}
  - {id: AC-7, required: true, text: Chat and Project views show current Plan progress, task/subchat state, assumptions, Checks and explicit blockers with functioning detail links and reload.}
  - {id: AC-8, required: true, text: The displayed preview, test receipts and final encrypted saved content identify the same revision; conflicts preserve newer edits and sandboxes receive no Project/chat keys.}

