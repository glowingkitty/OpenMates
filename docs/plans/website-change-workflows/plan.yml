approval_context:
  product_implementation: 'Explicit user approval: Sounds good. Implement and test.'
  recommended_defaults: Future changes only; no alert on initialization; false or
    unsure sends no update.
  state_lifetime: Dedicated encrypted monitoring state; explicit owning-run/workflow
    deletion, source generations, and the 100-event bound determine its lifetime.
    Run-log payload expiry alone does not reset monitoring.
