schema_version: 1
id: website-change-workflows
title: Website changes that match the user's requirements
status: implementing
goal: Add support for workflows that inform when a website has changed and match the
  user requirements, by processing the text diff of the website and then only processing
  the diff via Jev.
scope:
  in:
  - Implementation and verification of the user-approved Read website plus Check design.
  - Public website text, successful-read validation, normalized text diffs, and Jev
    relevance checks.
  - Existing Read website plus exact/AI Check composition, scheduled execution, and
    summary/chat delivery.
  - Encrypted comparison state, pending changes, concurrency, retention, and non-sending
    tests.
  out:
  - RSS monitoring, article-list extraction, crawling an entire site, and general
    Filter/loop nodes.
  - Authenticated/paywalled websites, CAPTCHA bypass, provider-owned monitoring, and
    new delivery channels.
  - Additional public skills or top-level Check modes.
  - Mixed result-list embeds in a website-change notification; v1 messages contain
    text and links.
task_reference: 0e51f9f1-3e85-4d9c-91d6-971f07122f3c
investigation: docs/plans/website-change-workflows/investigation.md
source_commit: 607cd834fa7d1563a05d3ee6e39840a0de144231
proposal:
  authoring:
  - Keep the website URL and extraction settings in the existing Read website action.
  - Offer Has changed since last successful read and Changes since last successful
    read as typed outputs for Check consumers.
  - An exact Check selects Has changed and compares that boolean without relevance
    inference.
  - The existing AI confirms Check selects Changes and evaluates the user's question
    against that diff.
  - Clearly distinguish current page text from changes in the variable picker.
  - Normal setup requires no separate skill, comparison node, storage node, or Track
    changes toggle.
  - Reuse the existing schedule and Send message destination controls.
  - Show a read test and extracted-text preview before enablement, including unsupported
    or blocked reads.
  - Explain that the first successful scheduled run establishes a baseline and only
    later changes notify.
  - Show the diff and change status through existing typed run outputs; keep existing
    decision and delivery views.
  execution:
  - The executor recognizes change-output consumers and enables a trusted comparison
    path for their Read website action.
  - That internal path reuses web.read extraction, rate limits, and billing; durable
    comparison state belongs to Workflow runtime.
  - Keep full-page text private to deterministic comparison; do not send it to semantic
    scanning or Jev.
  - Validate upstream page status and useful text; invalid/uncertain reads preserve
    the successful baseline.
  - Normalize text deterministically while preserving links, numbers, negation, and
    meaningful order.
  - The first usable read initializes encrypted state without Jev or a change notification.
  - An unchanged normalized page performs no semantic scanning, relevance inference,
    or summary inference.
  - Atomically save each new baseline and its pending diff event using revision and
    configuration generation fences.
  - Safety-scan changed hunks with limited diff context; preserve the normal standalone
    web.read safety path.
  - An AI Check evaluates only its selected bounded safe diff using existing Jev machinery;
    an exact change Check needs no relevance call.
  - A false decision consumes the event without a message; unsure retains it for retry
    on subsequent runs.
  - A true decision feeds only the diff to existing Ask AI and Send message, with
    source links preserved.
  - Keep matching events pending until existing owner-client delivery acknowledgement;
    unchanged runs retry pending work.
  - Extend acknowledged delivery membership for text-only change events; do not pass
    them through result-embed accounting unchanged.
  - Oversized diffs become visibly unsupported or unsure; never silently truncate
    and claim a reliable decision.
  identity:
  - Scope source comparison state to workflow, stable Read website node, source URL,
    extraction settings, and source generation.
  - Scope pending requirement decisions to the consuming Check and its requirement
    generation, independently of other consumers.
  - Use an occurrence revision for changes, so A to B to A produces two distinct events.
  - Use event identities for delivery; do not deduplicate all changes by the monitored
    website URL.
  - Source/extraction edits visibly initialize a new source generation; requirement
    edits invalidate only that Check's old decision generation.
  - Requirement edits apply to future changes by default; harmless graph edits preserve
    state and other Checks' pending events.
  lifecycle:
  - Test read and Test condition previews do not update production baselines, reserve
    deliveries, or send messages.
  - A full Run now uses the production monitor state and delivery path, as existing
    Workflow runs do.
  - Tie snapshots and pending diffs to visible owning runs and bounded encrypted storage.
  - Deleting the owning run or Workflow clears its state; source edits initialize
    a new baseline.
  - Retain one encrypted baseline and at most 100 bounded pending events per source
    separately from run-log retention. Explicit owning-run or Workflow deletion removes
    state; the next successful read initializes silently.
decisions:
- id: D-1
  status: active
  decision: 'Follow the user''s clarification: website text diff first, then requirement
    evaluation.'
  reason: New-article/RSS monitoring was an example and is outside the clarified implementation
    proposal.
  decided_at: '2026-09-30'
- id: D-2
  status: superseded
  decision: Propose a combined Website has changed Check rather than a user-managed
    snapshot graph.
  reason: Existing web.read scans full-page text before returning; a trusted comparison
    path is needed for diff-only inference.
  decided_at: '2026-09-30'
- id: D-3
  status: active
  decision: Compose existing Read website and exact/AI Check nodes through explicit
    change outputs.
  reason: Reading owns the URL and Check owns the condition. Internal comparison-before-safety-scanning
    requires no separate visible skill or Check-owned website fetch.
  decided_at: '2026-09-30'
implementation_sequence:
- Extend the owning Workflow and UI Specifications with concrete examples after the
  design is selected.
- Add typed read-quality metadata and the trusted comparison-before-semantic-scan
  path without changing normal reads.
- Add encrypted baseline/pending-diff storage and atomic revision/generation updates
  to the existing runtime transaction.
- Extend read output declarations, change-input references, runner coordination, authoring,
  and YAML/CLI/SDK contracts while retaining exact/AI Check modes.
- Reuse diff-only Jev decision, Ask AI, acknowledged chat delivery, and event-specific
  retry identities.
- Add the simple Check editor, previews, run explanations, i18n, and focused coverage.
scenarios:
- id: S-1
  title: Only qualifying changes notify
  given:
  - A readable website baseline and a requirement about Congress announcements.
  when:
  - The website adds new text.
  then:
  - Only the diff is evaluated
  - and matching text produces a summary with its source link.
- id: S-2
  title: Baseline and unusable reads are safe
  given:
  - A new monitor or a previously successful monitor.
  when:
  - The first usable read occurs or a later read is blocked or empty.
  then:
  - The first read initializes silently; unusable reads preserve the last successful
    baseline.
- id: S-3
  title: Pending changes survive retries and concurrent runs
  given:
  - A detected change with uncertain inference or unacknowledged delivery.
  when:
  - A retry
  - overlapping run
  - crash
  - or source configuration edit occurs.
  then:
  - The event remains recoverable without duplicate acknowledged delivery or stale-state
    overwrite.
- id: S-4
  title: Setup and testing explain behavior
  given:
  - An owner configures a website-change Workflow.
  when:
  - They test the read/condition
  - enable the Workflow
  - or inspect a failed check.
  then:
  - Previews do not mutate production state
  - and initialization/change/blocked/unsure/delivery states are distinct.
