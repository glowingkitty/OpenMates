scenarios:
- id: S-1
  title: Spawn a main chat and open it from the event
  given:
  - Alice is in her chat "Weekly planning".
  when:
  - She asks it to start a chat that collects kitchen tile quotes.
  then:
  - A new sidebar chat starts with the brief, and "Weekly planning" shows "Started chat ..." that opens it.
- id: S-2
  title: Spawned chat reports back
  given:
  - '"Kitchen quotes" was started by "Weekly planning".'
  when:
  - Its assistant finishes or reports.
  then:
  - '"Weekly planning" shows a report event and a finished event.'
- id: S-3
  title: Creator coordinates its chats
  given:
  - '"Weekly planning" spawned two chats.'
  when:
  - It lists, reads or messages them, or the user types in one.
  then:
  - Only its own spawned chats are reachable, reads/writes run on the device, and user typing is surfaced and guarded.
