goal: >
  Make slow AI turns diagnosable as one privacy-safe browser-to-worker
  waterfall without changing AI behavior. First establish reliable propagation,
  phase spans, identity-free metrics, and a content-free debug CLI; only after a
  stable dev baseline, add OpenObserve dashboards and low-noise Discord-first
  alerts with optional enabled server-admin email fallback.

scope:
  in:
    - Repair browser, WebSocket, API, Celery producer, AI worker, and final-marker trace propagation.
    - Initialize tracing in every AI worker process that emits AI-turn spans.
    - Replace permissive trace attribute filtering with explicit production allowlists.
    - Remove raw user IDs, raw exceptions, content, URLs, filenames, tool payloads, and stable product IDs from exported AI telemetry.
    - Emit identity-free aggregate histograms for every AI turn.
    - Emit content-free sampled structural traces with bucketed counts by default.
    - Add explicit, audited, time-bounded diagnostic mode for approved exact non-content counts.
    - Instrument queueing, preparation, preprocessing, provider calls, model iterations, TTFT, streaming, tools, validation, billing, persistence, final-marker publication, and postprocessing.
    - Extend the operator debug CLI to render a redacted AI request waterfall and missing-span diagnostics.
    - Verify effective OpenObserve stream retention remains 14 days and never exceeds 30 days.
    - Build OpenObserve AI latency, complexity, reliability, and finalization dashboards after a stable seven-day dev baseline.
    - Derive sustained alert thresholds from that baseline rather than hardcoding arbitrary values.
    - Send content-free AI observability alerts to connected Discord first.
    - Use server-admin email only when Discord is unavailable and server-owner email notifications are enabled.
    - Require a separate approval before production rollout.
    - Preserve every repeated provider, iteration, and tool span with lifecycle and completion timing.
    - Reuse unchanged decrypted embed versions only inside one finalization request.
    - Coalesce ordinary content delivery for at most 50 milliseconds while preserving structural event order and final flush.
    - Run same-batch app-skill calls concurrently only when every call explicitly declares parallel_safe true.
  out:
    - Prompt, model-routing, context-window, tool-planning, or billing-authority optimization.
    - Parallel execution of undeclared, dependent, mutating, payment, account, or workspace tools.
    - User-facing web, Apple, npm SDK, or pip SDK observability features.
    - Public or developer telemetry APIs.
    - Prompt, response, message, tool parameter/result, URL, filename, ciphertext, key, provider payload, or raw stack-trace storage.
    - Per-user, per-chat, or long-lived cross-request analytics.
    - Third-party hosted analytics or observability services.
    - Alert thresholds chosen before measured baseline evidence exists.
    - Production deployment or production alert activation without separate explicit approval.

context_discovery:
  issue:
    - Production issue M9JH3 reported an AI turn taking about 48 seconds; available logs identify broad stages but cannot produce an exact distributed waterfall.
  github_issues:
    - No matching public GitHub issue was found during contract discovery.
  docs:
    - docs/architecture/observability.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/operational-monitoring-digest-alerts/plan.yml
    - shared/docs/privacy_policy.yml
    - shared/docs/privacy_promises.yml
  contracts:
    - architecture.ai-request-observability@1 approved in session 0d33 with fingerprint 9d02a0beb68b1f4ffd28d5af3ad1658700b8c41ef1635a57fe1b681410f86d06.
    - architecture.operational-monitoring@1 provides existing privacy-safe monitoring and operator delivery patterns.
  code_patterns:
    - frontend/packages/ui/src/services/tracing/wsSpans.ts injects traceparent only from the active context, while callers can create non-active spans.
    - The browser issue-report ring records only traces created through createWsSpan.
    - backend/shared/python_utils/tracing/ws_span_helper.py attaches a custom current-span context value instead of the OpenTelemetry span context.
    - backend/shared/python_utils/tracing/privacy_filter.py uses denylist-style filtering, bypasses filtering on dev, and permits raw user identity at elevated tiers.
    - backend/core/api/main.py initializes API tracing, but no AI worker tracing initialization was found under backend/apps/ai.
    - backend/scripts/debug_trace.py already queries and renders traces but currently assumes shallow stream structure.
    - backend/core/api/app/services/operational_monitoring.py and operational_monitoring_tasks.py provide existing Discord and server-admin email delivery infrastructure.
  tests:
    - backend/tests/test_tracing/test_privacy_filter.py
    - backend/tests/test_tracing/test_integration.py
    - backend/tests/test_tracing/test_ws_trace_context.py
    - backend/tests/test_tracing/test_handler_instrumentation.py
    - backend/tests/test_tracing/test_debug_trace.py
    - frontend/packages/ui/src/services/tracing/__tests__
  verified_facts:
    - Production OpenObserve currently runs v0.70.0-rc3 with an effective 14-day retention target; policy permits no more than 30 days.
    - Current production trace queries return shallow API spans rather than a complete AI request tree.
    - The M9JH3 billing conflict consumed only a small part of the total latency and should not drive an AI behavior change.
    - Existing logs suggest latency across preprocessing, tools, repeated inference, and finalization, but cumulative token reporting prevents precise attribution.

