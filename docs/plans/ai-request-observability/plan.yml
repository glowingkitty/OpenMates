contracts:
  api:
    changed: false
    access_model: first-party client surface only
    auth: Existing authenticated WebSocket session and internal Celery/OTel service credentials; no new endpoint.
    owner_team_scope: Existing chat ownership remains unchanged; telemetry contains no owner/team identifier.
    rate_limits: Existing chat and internal telemetry ingestion limits apply; diagnostic CLI queries are bounded to one trace and operator credentials.
    credit_budget: Telemetry creates no OpenMates credit charge and invokes no additional paid AI/provider requests.
    encryption_boundary: Client-encrypted chat payloads remain on existing paths and are never copied, decrypted, or exported by observability instrumentation.
    plaintext_handling: AI workers already process authorized plaintext in memory; instrumentation may measure counts/durations only and cannot export plaintext or derived content.
  telemetry:
    default_metrics: Identity-free low-cardinality histograms for all turns.
    default_traces: Content-free sampled structural spans with bucketed counts and one request-scoped trace ID.
    diagnostic_mode: Audited incident or explicit opt-in scope with owner, reason, start, expiry, and exact approved non-content fields.
    forbidden: [prompt, response, message, title, tool_parameters, tool_results, url, filename, ciphertext, key_material, raw_provider_payload, raw_exception, user_id, chat_id, message_id, task_id, device_id, session_id, cache_key]
    retention: Verify effective 14 days; reject configuration above 30 days.
  alert_delivery:
    primary: Connected and configured Discord.
    fallback: Server-admin email only when Discord is unavailable and server-owner email notifications are enabled.
    deduplication: Accepted Discord suppresses email for the same logical alert; one recovery event closes each incident.
    receipt_fields: [environment, logical_alert_id, channel, attempted_at, accepted_or_failed_or_unavailable, sanitized_failure_class]
    forbidden_receipt_fields: [destination, webhook_url, email_address, secret, user_id, chat_id, raw_error]
  phase_gates:
    rest_websocket: Real authenticated dev WebSocket chat proves browser-to-worker propagation; no endpoint contract changes.
    cli: Internal debug.py trace request command proves the operator waterfall against the real dev OpenObserve stream.
    sdks: Not applicable because observability is not exposed through npm or pip SDKs.
    web: Browser propagation is verified through the real dev chat path; no user-visible UI or Playwright visual change.
    visual_smoke: Not applicable because there is no user-facing visual change.
    user_confirmation: Not applicable because behavior and UI are unchanged.
    apple: Not affected.

