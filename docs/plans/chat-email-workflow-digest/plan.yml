schema_version: 2
goal: 'Investigate, implement, and verify email notifications for completed chat responses and a daily
  workflow-run digest in OpenMates.

  '
scope:
  in:
  - Independent default-on chat and scheduled Workflow digest categories.
  - Preserve identifiable opt-outs, unsubscribes, and unrelated category settings.
  - Record explicit preference choices separately from defaults.
  - Verified account contact addresses through the existing Vault path.
  - Fresh foreground web/Apple presence and interactive CLI chat viewing.
  - Completed visible Mate and committed Team user messages, excluding own and all Workflow output.
  - Content-free defaults, authenticated links, and separately consented bounded previews.
  - One fixed-window daily digest with computation and acknowledged delivery reported separately.
  - Automated, failure-blocking preference migration during supported core upgrades.
  out:
  - Production rollout; webhook functionality; workflow UI and device-delivery acknowledgement changes.
decisions:
- id: legacy_transition
  status: active
  decision: 'User chose a clean default-on transition on 2026-10-01 after disclosure that legacy master=false
    values have no provenance. Reset only ambiguous master values; stored category false and identifiable
    user opt-outs still win.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: unrelated_mail
  status: active
  decision: 'Legacy master-off accounts had no effective backup/webhook permission; preserve that effective
    off state while enabling the two requested categories.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: verified_email
  status: active
  decision: 'Resolve the verified matching account_contact_emails Vault ciphertext and check ignored_emails
    at send time. Client-only encrypted account addresses cannot be decrypted offline and are never bypassed.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: digest_window
  status: active
  decision: 'Daily 09:00 UTC cutoff, preceding half-open 24-hour acceptance window. Fixed cutoff survives
    retries. Scheduled runs qualify regardless of user activity; manual and test runs never qualify. Webhook
    eligibility has an allowlist seam.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: team_preview
  status: active
  decision: 'Authorized sender obtains scoped recipient-consent capability before transmitting a bounded
    preview on the first-party WebSocket. Server seals per-recipient Vault envelopes with short TTL. No
    stored chat or Team keys are disclosed. Missing capability/material falls back to private mail.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: workflow_preview
  status: active
  decision: 'Opted-in titles may be decrypted using existing Workflow Vault encryption. Execution context
    is not a user output preview; do not mail internal inputs or arbitrary output_summary structures.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: coordination
  status: active
  decision: 'TASK-3503/session 3e87 owns Workflow UI and delivery acknowledgement handlers. Digest reads
    their acknowledged state and never updates it.

    '
  reason: User requirements and inspected encryption/delivery boundaries.
  decided_at: '2026-10-01'
- id: automated_migration
  status: active
  decision: Upgrade the production CLI before the first core rollout, require its setup-gate capability,
    stop the old API and email consumers, and run fresh cms-setup successfully before resuming them.
    The migration is packaged, transactional and idempotent; no operator SQL is required.
  reason: User explicitly requires safe automatic migration on production deployment. Old updater
    processes cannot execute newly added ordering until upgraded.
  decided_at: '2026-10-01'
- id: verification_follow_up
  status: active
  decision: Repair the two identified web login console errors and add supported, audited
    Apple native verification operations using the online Mac. Reuse session 02ea; preserve
    installed apps, account data and the repository-scoped Mac safety policy.
  reason: User explicitly asked to continue the recommended next steps on 2026-10-02.
  decided_at: '2026-10-02'
checks:
- Focused backend unit and CLI viewer checks.
- Isolated GitHub product tests for settings, Team preview transport, chat dispatch and digest capture.
- Source privacy and race review, migration/setup verification, and authenticated links.
- Controlled live email delivery with provider acceptance and mailbox receipt recorded separately.
references:
- feature.notifications@1
- TASK-7066
id: chat-email-workflow-digest
title: Chat response email and daily Workflow digest
status: implementing
scenarios:
- id: S-1
  title: Private message email after reconnect grace
  given:
  - A completed message exists and no human foreground client views OpenMates.
  when:
  - The dispatch grace expires.
  then:
  - Fresh preferences, verified address, membership, presence and viewed state gate one email.
- id: S-2
  title: Independent categories and explicit preview consent
  given:
  - An account has default or explicit category choices.
  when:
  - Another client changes one category.
  then:
  - Only that choice changes; unknown categories and opt-outs survive.
- id: S-3
  title: Daily scheduled runs with pending delivery
  given:
  - Scheduled, manual and test runs cross the daily UTC cutoff.
  when:
  - The daily dispatcher aggregates the immutable window.
  then:
  - Only scheduled runs qualify; acknowledged chat delivery stays separate.
- id: S-4
  title: External controlled mailbox evidence
  given:
  - Controlled test mailbox access is available.
  when:
  - The deployed worker sends a synthetic sample.
  then:
  - Provider acceptance and actual receipt are separately recorded.
- id: S-5
  title: Core upgrade automatically migrates existing preferences
  given:
  - An existing installation is updated using the released CLI with the setup-gate capability.
  when:
  - A full or filtered core-runtime update runs.
  then:
  - Old API and email consumers stop before fresh cms-setup; setup failure prevents their restart.
  - Repeated setup preserves explicit choices, category opt-outs and unsubscribes.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Foreground human presence, viewed state, opt-outs and duplicate completions govern content-free
    or consented preview email.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-CHAT
  - T-APPLE-LIFECYCLE
- id: AC-2
  scenario: S-2
  text: Sparse persisted choices preserve other devices and categories, defaults and identifiable opt-outs.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-PREFS
- id: AC-3
  scenario: S-3
  text: Scheduled-only daily aggregation preserves cutoff, dedupe, privacy and pending device delivery
    states.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-DIGEST
- id: AC-4
  scenario: S-4
  text: Actual controlled-mailbox receipt is recorded separately from provider acceptance; unavailable
    configuration remains unverified.
  required: true
  status: blocked
  coverage_status: blocked
  verification_scope: manual
- id: AC-5
  scenario: S-5
  text: Supported core updates automatically run the packaged migration before compatible email
    consumers resume, block on failure, and preserve preferences on repeated setup.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: custom
  verification_ids:
  - T-UPGRADE-CLI
  - T-UPGRADE-SIDECAR
  - T-MIGRATION
  - T-SELFHOST
