clarification:
  rounds:
    - question: Which checks should run after an update and how should spending be authorized?
      answer: Keep deterministic no-spend checks automatic; prompt before one real chat, Web Search, and other cheap app skills, and require explicit automation consent.
    - question: What happens when the CLI is not logged into the self-hosted instance?
      answer: Explain that login to that instance is required and print the instance-scoped login command.
  vision_summary: >
    Every core update proves infrastructure for free, then offers a bounded real
    account-level test. Declining or lacking login does not invalidate the
    deterministic update, while an accepted functional-test failure is visible
    and marks the update degraded without rollback.
  approved_by_user: true

