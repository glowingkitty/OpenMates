  - {id: R-2, risk: Session cookies are sent to the wrong server, mitigation: Compare normalized origins before every quick suite and fail before network use.}
  - {id: R-3, risk: Synthetic chats remain in user history, mitigation: Delete in a finally path and expose cleanup failure.}
  - {id: R-4, risk: Provider volatility creates false server failures, mitigation: Classify provider failures separately while still marking an explicitly accepted functional suite degraded.}

