goal: >
  After every interactive core-server update, offer an authenticated quick test
  that proves one real encrypted saved chat and cheap app skills work through the
  updated self-hosted instance, without ever spending credits implicitly.

scope:
  in:
    - Keep the existing provider-free runtime verifier mandatory before update success.
    - Offer "Continue with quick server test?" after a successful interactive core update.
    - Require a CLI session whose normalized API origin matches the updated installation.
    - Explain how to log into the self-hosted instance when no matching session exists.
    - Create, reload, and delete one synthetic encrypted saved chat through the normal first-party WebSocket path.
    - Run math.calculate and one-result web.search through the normal session-authenticated CLI client.
    - Add openmates server test --quick so operators can rerun the suite without updating.
    - Support explicit non-interactive execution with --quick-test --confirm-spend-credits.
    - Persist only bounded sanitized check metadata in update status.
  out:
    - New REST or WebSocket endpoints.
    - API-key creation or SDK-device approval.
    - Paid checks in periodic monitoring or continuous updates by default.
    - Automatic rollback after a functional-test failure.
    - Web or Apple UI changes.
    - Exact provider-price prediction when server metadata cannot provide one.

