implementation_notes:
  plan_path: docs/plans/post-update-quick-server-tests/plan.yml
  status: approved
  existing_patterns:
    - frontend/packages/openmates-cli/src/server.ts post-readiness verification and update-status handling
    - frontend/packages/openmates-cli/src/client.ts authenticated chat lifecycle and direct app-skill execution
    - frontend/packages/openmates-cli/src/serverConfig.ts instance API URL persistence
  architecture: >
    Add a small pure/testable quick-test orchestrator beside server.ts. Pass the
    already-loaded OpenMatesClient into handleServer, compare its session origin
    to the installation API origin, and reuse client chat and runSkill methods.
  first_slice: Write red orchestration tests for consent, origin binding, bounded execution, sanitization, and cleanup.
  data_flow:
    - Update completes existing provider-free verification.
    - CLI resolves the installation API origin and evaluates prompt eligibility.
    - Explicit consent starts session validation, chat lifecycle, math, and Web Search checks.
    - The orchestrator returns only sanitized per-check metadata and always attempts known-chat cleanup.
    - server.ts persists the bounded result and marks accepted failures degraded.
  boundaries: [No endpoint changes, no public OpenMates SDK facade changes, no web or Apple changes, no periodic paid checks.]
  affected_files:
    - {path: frontend/packages/openmates-cli/src/serverQuickTest.ts, reason: Pure consent, origin, orchestration, sanitization, and result contracts.}
    - {path: frontend/packages/openmates-cli/src/server.ts, reason: Prompt, standalone command, post-update integration, and status handling.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Pass the existing loaded client into server dispatch.}
    - {path: frontend/packages/openmates-cli/src/client.ts, reason: Allow a caller-generated ID to retain new-chat semantics for uncertain-outcome cleanup.}
    - {path: backend/apps/ai/tasks/runtime_health_probe_task.py, reason: Distinct provider-free app_ai Redis round-trip and cleanup probe.}
    - {path: backend/scripts/runtime_health_verifier.py, reason: Dispatch and validate the distinct chat-plumbing probe.}
    - {path: backend/tests/test_runtime_health_verifier.py, reason: Behavioral no-spend transport and cleanup contracts.}
    - {path: frontend/packages/openmates-cli/tests/serverQuickTest.test.ts, reason: Test-first deterministic orchestration coverage.}
    - {path: scripts/verify_post_update_quick_server_test.mjs, reason: Real logged-in dev CLI proof.}
    - {path: docs/user-guide/cli/server-management.md, reason: Operator behavior and automation safety.}
  migrations: [None.]
  observability: [Persist stable check IDs, status, duration, timestamp, and sanitized failure class only.]
  assumptions_checked:
    - A-1 confirmed by existing public OpenMatesClient chat and skill methods.
    - A-2 confirmed by ServerConfig.apiUrl and installation VITE_API_URL handling.
  acceptance_mapping:
    AC-1: [T-CLI-QUICK-UNIT, T-CLI-QUICK-LIVE]
    AC-2: [T-CLI-QUICK-UNIT]
    AC-3: [T-CLI-QUICK-UNIT]
    AC-4: [T-CLI-QUICK-UNIT, T-CLI-QUICK-LIVE, T-SDK-CLI-AUDIT]
    AC-5: [T-CLI-QUICK-UNIT]
    AC-6: [T-CLI-QUICK-UNIT, T-CLI-QUICK-LIVE]
    AC-7: [T-PYTEST-CHAT-PLUMBING]
  verification_order: [CLI unit red, implementation, CLI unit green, build, real dev CLI, parity audit, proof video review.]
  verification_strategy:
    - Record focused red Node test evidence before implementing the orchestrator.
    - Run focused unit tests and the CLI package build after implementation.
    - Run one explicitly consented real CLI suite against the logged-in dev account.
    - Run SDK/CLI parity audit and review a bounded terminal proof before completion.
  demonstration:
    capture_source: Real PTY execution of the compiled OpenMates CLI against dev.
    caption_renderer: Repository WebVTT proof workflow with exact post-verification captions.
    frame_sampling: Three-second intervals plus prompt, login guidance, check transition, and result boundaries; full video never enters model context.
    retention: Keep transcript, clean capture, captions, bounded frames, and response-media snippet under proof workflow retention.
    delivery: Publish approved terminal proof through opencode_response_media.py; do not send to Discord.
