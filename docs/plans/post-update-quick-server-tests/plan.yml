scenarios:
  - id: S-1
    title: Logged-in operator accepts the post-update quick test
    given:
      - Provider-free core verification passed.
      - The CLI session API origin matches the updated installation.
    when:
      - The operator answers yes to "Continue with quick server test?"
    then:
      - A real encrypted saved chat completes, reloads, and is deleted.
      - math.calculate returns a successful calculation.
      - web.search returns one bounded result group.
      - Sanitized per-check results are displayed and persisted.
  - id: S-2
    title: Operator is not logged into this self-hosted instance
    given: [Provider-free core verification passed.]
    when: [No session exists or its API origin differs from the installation.]
    then:
      - No paid request is sent and no confirmation prompt is shown.
      - The CLI prints an instance-scoped login command and standalone rerun command.
      - The deterministic update remains successful.
  - id: S-3
    title: Non-interactive updates never spend implicitly
    given: [The update runs with JSON, redirected input, or continuous mode.]
    when: [Explicit quick-test spend confirmation is absent.]
    then:
      - The CLI does not prompt and reports the quick test as not run.
      - The existing --yes flag does not authorize credits.
  - id: S-4
    title: Accepted quick test fails visibly and cleans up
    given: [The operator explicitly accepted credit use.]
    when: [Chat, reload, math, Web Search, or cleanup fails.]
    then:
      - Independent checks continue where safe and every failure is sanitized.
      - Temporary chat cleanup is attempted in a finally path.
      - Update state becomes degraded, exits non-zero, and never automatically rolls back.

