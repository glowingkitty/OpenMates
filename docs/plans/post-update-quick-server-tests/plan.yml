contracts:
  api:
    access_model: first-party client surface only
    auth: Existing paired CLI session cookies and WebSocket token; no API key is created.
    rate_limits: Existing chat and app-skill limits apply.
    credit_budget: One model turn, one math calculation, and one one-result Web Search only after explicit consent.
    encryption_boundary: Chat plaintext and keys remain client-side except transient inference delivery under the existing Chats contract; status persistence contains no content or identifiers.
  cli:
    prompt: Continue with quick server test? [y/N]
    commands:
      - openmates server update [--skip-quick-test]
      - openmates server update --quick-test --confirm-spend-credits
      - openmates server test --quick [--confirm-spend-credits]
    automation: --yes never implies --confirm-spend-credits.
  status:
    fields: [status, completed_at, checks, sanitized_reason]
    forbidden: [chat_id, message_id, prompt, response, cookies, user_id, email, provider_payload]

privacy_security:
  - Compare normalized API origins before any authenticated request.
  - Never forward stored cookies to a different API origin.
  - Use a generated chat ID with a fixed synthetic prompt in personal context and never persist chat content in status or logs.
  - Attempt temporary chat deletion after every creation outcome where the chat ID is available.
  - Sanitize error output to stable failure classes rather than raw provider bodies.
  - Never interpret --yes as permission to spend credits.

