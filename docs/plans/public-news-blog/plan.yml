schema_version: 2
id: public-news-blog
title: Public news, blog, and social archive
status: implementing
goal: >-
  It’s time to create separate news and blog pages as well as the fullscreen
  views / separate pages for product releases/updates, social media posts and blog posts.

scope:
  in:
    - Replace announcement demo-chat presentation with the supplied News, Blog, Press release / Update, Blog post, and Social post designs.
    - English and German public pages, indexable article URLs, matching fullscreen views, responsive layouts, and accessible controls.
    - News and blog sidebars show their respective publications newest first, never the reader's chats.
    - Markdown and metadata authored in the separate private marketing repository; sanitized public feed consumed by OpenMates.
    - Automatically archive successfully published official OpenMates Buffer posts and backfill available official-channel history.
    - Direct Hetzner S3 media delivery initially, permanent publication assets, optimized images/videos, and independently verified read-only public access.
    - Search, related posts, metadata-selected featured articles, feature links, press kits, and email subscriptions for news/press using existing infrastructure.
    - Fixture-driven UI previews and explicit user confirmation of desktop/mobile layouts before implementing publishing, storage, Buffer or other product integration logic.
    - Preserve old announcement URLs, chat deep links, and sent newsletter destinations during migration.
  out:
    - Sharing controls, personal/founder Buffer channels, external-article summary pages, and social-platform publishing from the website.
    - Narration, browser push subscriptions, readership-based ranking, and the release-information OpenMates skill.
    - Blog email notifications, blog subscription controls, and blog-specific newsletter categories or delivery automation.
    - Admin content editor, automatic cross-posting to Medium, additional launch languages, and native Apple UI implementation.
    - CDN deployment and splitting the application onto app.openmates.org.
    - Production infrastructure changes and production rollout.

