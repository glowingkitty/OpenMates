ui_confirmation_gate:
  requested_by: User explicitly requested UI confirmation before logic implementation to avoid overtesting unapproved responsive behavior.
  first_deliverable: Reusable presentation components and fixture-driven /dev/preview pages for News, Blog, Press release / Update, Blog post and Social post.
  fixtures: Use representative public/synthetic English and German text, long titles, populated/empty lists, landscape/portrait media and mixed-media slideshows; no live feed, Buffer, email or S3 operations.
  allowed_before_confirmation: Minimal fixture types, presentation components, local preview interactions and bounded render/layout checks needed to make the design review usable.
  held_until_confirmation: Production content contracts/parsers, publisher/feed/cache implementation, S3 provisioning/media pipelines, Buffer sync/backfill, newsletter wiring, migration and broad product/integration testing.
  responsive_review: Present a phone and desktop layout plus a representative intermediate-width view; explicitly highlight sidebar collapse, card stacking, media sizing, horizontal scrolling and article/fullscreen navigation.
  delivery: Provide exact clickable /dev/preview URLs with named fixture variants, plus representative phone/desktop screenshots. Use chrome=0 for component captures. Label unconnected controls as preview-only in the review notes.
  minimal_verification: Run one bounded account-free component-preview check for render errors, obvious clipping/overflow and essential navigation/play controls. Reuse its evidence; do not build an exhaustive viewport/state matrix before design approval.
  publication: Use isolated candidate CI for the focused preview check, then a scoped dev preview deployment when implementation is authorized so the user can inspect the exact revision interactively.
  stop: Present the concrete previews and wait for explicit UI confirmation. Elapsed time, automated screenshot checks and approval of this written plan are not UI approval.
  iteration: Apply requested visual changes and repeat only affected preview checks. Ask about ambiguous design choices rather than iterating speculative responsive layouts or expanding tests.
  after_confirmation: Record the approved preview revision and accepted responsive behavior, then implement real logic using the same components. Reopen review only for material visual changes to that approved design.

architecture:
  authoring:
    source: Separate private openmates-marketing repository.
    layout: Extend campaigns/<campaign>/ with release, blog, and social entries containing localized Markdown and metadata; standalone publications are supported.
    metadata: Stable content ID, type, slug, locale variants, title, summary, author, publication/update times, feature links, related IDs, featured order, media references, and press-kit assets.
    media_manifest: Stable asset IDs, hashes, MIME types, dimensions, duration, posters, responsive renditions, alt text, captions/transcripts, and public URLs.
    separation: Article publication, Buffer scheduling, and newsletter delivery have independent state; article edits never send email or repost social content.
  publication:
    format: Versioned JSON index plus immutable per-item content revisions and asset manifests; explicit public-field allowlist.
    process: Validate and prepare all assets, upload complete content revision, verify references, then switch the small current-revision manifest under a publisher lock.
    exclusions: Never export draft/embargoed copy, private notes, local paths, raw Buffer responses, account identifiers, author email fields, credentials, or recipient data.
    recovery: Preserve previous published revisions for rollback; retry uploads idempotently and never expose a partially uploaded revision.
    previews: Keep unpublished content in private preview storage; a noindex tag alone is not a confidentiality boundary.
  consumption:
    server: SvelteKit server loads a configured HTTPS feed, validates its schema, and renders full article/index HTML without Buffer access or S3 credentials.
    cache: Start with five-minute index revalidation and immutable revision caching; refresh related indexes, sidebars, sitemap and search together.
    failures: Serve bounded last-known-good data where available; use 503 on an unavailable uncached feed and 404 only for a confirmed missing article. Honor explicit removal records on the next refresh.
    security: Allowlist feed/media origins and asset formats, bound downloads, sanitize Markdown/URLs and JSON-LD, and block private-network redirects in importers.
    open_source: Ship generic schemas, renderer, synthetic fixtures and configurable feed/media base URLs; no private repository checkout or publishing key required for builds.
    maintainer_docs: Add a short pointer to the optional sibling marketing workspace; detailed operational instructions stay private. Honor its AGENTS.md when working there.
  routes:
    english: [/news, /news/<slug>, /blog, /blog/<slug>, /social/<slug>]
    german: [/de/news, /de/news/<slug>, /de/blog, /de/blog/<slug>, /de/social/<slug>]
    canonical: One canonical URL per publication and available language, shared by direct and in-app navigation; no duplicate indexable modal URLs.
    translations: Reciprocal hreflang only for existing translations. Missing German content links to labeled English content without a duplicate German URL.
    social_navigation: Preserve news/blog entry context; direct social visits default to news navigation. Browser Back restores origin and scroll position.
    discovery: Crawlable paginated archives and normal links, semantic headings, author/date information, per-page descriptions, social preview metadata, breadcrumbs, and sitemap lastmod from actual edits.
    structured_data: Article/BlogPosting and appropriate social/video metadata reflecting visible content; no promises of search ranking or AI citation.
    media_seo: Expose meaningful article/post text, image descriptions, captions and available video transcripts; do not depend on social embeds for content.
  email_subscriptions:
    news_press: Retain subscription entry points on news and release/update pages, reusing existing confirmed-subscriber/category/opt-out behavior.
    blog: No blog email signup UI or blog-triggered notification delivery in this release.
    delivery: Preserve the existing newsletter campaign workflow; publishing a news article does not automatically broadcast an email.

storage_and_delivery:
  initial_delivery: Browser requests HTTPS objects directly from the provider bucket hostname; no CDN or application proxy for video bytes.
  isolation:
    - Use a dedicated publication bucket/project, separate from application/user-data and temporary Buffer/review storage.
    - Public policy grants only object reads for the published namespace; no anonymous listing, uploads, deletes, ACL/policy changes, or version enumeration.
    - Keep drafts and raw/private media out of that public namespace entirely; obscurity of filenames is not access control.
    - Hetzner credentials are project-wide by default. Prefer a publisher key in a separate credentials project with an explicit policy granting only required publication object actions.
    - Keep bucket administration credentials outside normal publishing jobs; no admin key in Vercel, frontend, public feed, or open-source configuration.
    - Avoid existing startup ACL/lifecycle reconciliation overriding the custom publication policy; provision/manage this bucket explicitly.
  lifecycle: No expiry for published assets. Preserve stable hashed keys, retain a private backup of approved masters, and use explicit unpublish/removal rather than temporary-media cleanup.
  headers: Correct MIME types, immutable long-lived caching for hashed assets, short caching for current manifests, CORS for required read origins/headers, and downloadable attachment headers for press kits.
  cors_boundary: CORS controls browser access, not authorization; prove access policy with anonymous HTTP requests independently of CORS.
  prepared_media:
    - Responsive AVIF/WebP images with fallback, explicit dimensions, optimized social preview images and posters.
    - Fast-start H.264/AAC MP4 playback and downloads; short compressed silent teaser derivatives for card/header previews.
    - Pre-generated adaptive HLS renditions for longer release videos; retain MP4 fallback and verify Range-based seeking and CORS in supported browsers.
    - Captions/transcripts where available, lazy-loaded below-fold media, no background download of entire videos for previews, and accessible slideshow controls.
    - Strip unnecessary private metadata from publication copies; keep approved originals separate.
  direct_delivery_trial: Measure start time, stalls, errors and transferred bytes on desktop/mobile and representative EU/non-EU connections using bounded concurrency and optimized assets.
  cdn_trigger: Reconsider a CDN only if measured startup/stall rates, regional latency, sustained errors or forecast audience volume make direct delivery inadequate; keep asset-base configuration replaceable.

buffer_archive:
  eligibility: Explicit allowlist of official OpenMates channels only; publish after Buffer reports sent, never for drafts, scheduled or failed posts.
  new_posts: Extend existing Buffer tooling and private ledger with stable campaign/content/asset references; keep prepared media permanently before passing its URL to Buffer.
  synchronization: Run every 15 minutes initially with pagination, rate-limit backoff, overlap/reconciliation for delayed links or edits, idempotent per-post keys and last-success receipts.
  grouping: Prefer explicit campaign/social content IDs across platforms. During backfill use conservative text/media matching; flag uncertain merges and keep distinct posts separate.
  original_links: Store each verified platform permalink; retry missing links and omit unavailable platform buttons without fabricating URLs.
  language: Preserve original language and text; connect authored translations when available. Do not silently translate historical posts or publish false language variants.
  backfill:
    - Inventory every accessible sent-post page for official channels, combining API history with the existing private ledger; do not stop at the CLI's default display limit.
    - Preserve real publication dates; recover assets from campaign originals or existing owned storage first, then copy retrievable Buffer/platform media to permanent storage.
    - Report totals by channel, coverage dates, duplicates, unavailable media/links and history gaps; Buffer retention does not guarantee complete lifetime history.
    - Produce a private dry-run preview, then publish the confirmed backfill through the same sanitized export path; never reschedule or repost historical content.
    - Retain useful text/original links when media cannot be recovered, with a deliberate no-media presentation rather than broken thumbnails or silent third-party hotlinking.
  removal: Explicit editorial hide/unpublish overrides survive resync; a transient API omission never deletes the archive. Reconcile verified removals without exposing draft revisions.

implementation_sequence:
  - outcome: Review and approve fixture-driven desktop/mobile UI.
    work: Build the five presentation previews and minimal fixture interactions, run the bounded preview check, deliver interactive dev URLs and screenshots, and wait for explicit user confirmation under ui_confirmation_gate.
    ownership: OpenMates presentation components, colocated preview fixtures and focused preview evidence only.
  - outcome: Define content contract, migration map and privacy boundaries after UI confirmation.
    work: Map agreed behavior and approved UI to a compact publication Specification with examples; reuse newsletter privacy/category contracts. Define public schema and legacy redirects.
    ownership: OpenMates schema/docs/tests and private marketing authoring contract.
  - outcome: Prepare permanent media and prove direct S3 isolation.
    work: Add media preparation, explicit publication storage policy/provisioning, asset manifests and read-only delivery checks before uploading historical assets.
    ownership: Private marketing media/publishing tools; generic OpenMates media consumers.
  - outcome: Publish atomic public content revisions.
    work: Extend campaign Markdown export, media grouping, locale handling and preview; add validated feed reader, consistent caches and configurable source URLs.
    ownership: Private marketing publisher and OpenMates server content module.
  - outcome: Connect approved news/blog UI to real content and actions.
    work: Reuse approved preview components for server-rendered routes, chronological sidebars, search, crawlable pagination, featured cards, press coverage links, related posts and press-kit downloads. Wire email forms on news/press only.
    ownership: OpenMates Svelte UI, routes, translations and focused browser coverage.
  - outcome: Connect official Buffer publication sync and historical backfill.
    work: Extend private ledger/API importer, channel allowlist, grouping and media recovery; run dry-run inventory and import through the validated feed publisher.
    ownership: Private marketing Buffer/sync tooling; synthetic integration fixtures in OpenMates only.
  - outcome: Migrate announcements, prove SEO and release safely.
    work: Import registered announcements, update new email destinations, map old paths/hash chat IDs, replace announcement chat entry points, verify dev, then prepare production rollout and rollback.
    ownership: OpenMates announcement/chat URL integration, sitemap/head hooks, newsletter links and tests.

required_verification:
  - Before UI confirmation, run only the bounded preview checks described in ui_confirmation_gate and necessary focused compile/lint checks. All remaining checks below occur after UI confirmation and relevant implementation.
  - Local schema/export/parser tests cover media adjacency, blank lines, mixed media, code fences, missing translations, duplicate IDs, malicious URLs/HTML, and accidental private-field export.
  - Feed tests prove atomic publication, interrupted uploads, invalid feed rejection, cache consistency, last-known-good fallback, unpublish and rollback.
  - Buffer tests cover all pagination pages, official-only filtering, non-sent exclusion, retry/idempotency, grouping, missing media and permalinks, preserved dates, and backfill without posting side effects.
  - Isolated storage checks prove anonymous GET/HEAD and Range playback succeed, while listing/PUT/DELETE/policy operations and reads of synthetic private canaries fail; publisher credentials cannot access application buckets.
  - Start policy tests against disposable S3 in CI; then perform bounded provider-specific verification in a dedicated test bucket before publication, since emulation cannot prove Hetzner policy behavior.
  - Component previews and focused isolated GitHub browser CI cover supplied layouts, mobile navigation, keyboard/focus, slideshow playback, reduced motion, search, paging, fullscreen/direct visits and Back behavior.
  - Browser/no-JavaScript checks prove article text, canonical/hreflang/JSON-LD, sitemap entries, social previews and redirects; drafts stay absent and dev stays noindex.
  - Focused newsletter tests verify news/press signup, consent, confirmation, category choices and unsubscribes remain intact; blog pages offer no email signup and no blog publication, article edit or social sync sends email.
  - Deployed dev smoke verifies actual article/media loading and the direct-delivery trial; record recoverable and unrecoverable backfill counts before production activation.
  - After relevant checks pass, repeat or broaden only for changed behavior, a concrete failure or an unresolved risk; do not rerun successful suites to generate extra media or speculate about unapproved UI variants.

migration_and_rollout:
  - Keep the old publisher compatible while introducing the new feed; importing an announcement must preserve its dates and must not reset sent-state or trigger delivery.
  - Use permanent server redirects from each /announcements/<slug> to its new /news/<slug>; route legacy hash chat links client-side because fragments never reach the server.
  - Preserve /tips behavior unless an explicit content migration is defined; do not absorb unrelated examples or intro pages into this change.
  - Replace legacy sidebar/demo-chat sources after destinations and redirects pass verification; retain a small compatibility map for historical links.
  - Use an isolated candidate/deployed dev feed first. Production activation remains a separate explicit action after review of the concrete implementation and backfill evidence.
  - Roll back by restoring the previous complete feed revision and compatible application revision; do not delete historical media during rollout.

