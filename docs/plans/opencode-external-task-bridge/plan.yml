decisions:
  - id: D-1
    status: active
    decision: External-chat association is an additive typed Task context, not a label convention and not a primary_chat_id overload.
    reason: The model needs validated routing and privacy without synthetic native Chat identities or accidental label detachment.
    decided_at: "2026-09-02T00:00:00Z"
  - id: D-2
    status: active
    decision: primary_chat_id and external-chat context are mutually exclusive.
    reason: A Task has one primary chat execution context and one key-wrapper source.
    decided_at: "2026-09-02T00:00:00Z"
  - id: D-3
    status: active
    decision: Blocked explanations are client-encrypted while blocked_reason_code is an allowlisted safe enum.
    reason: Automation needs stable routing metadata while user explanations may contain private project or credential context.
    decided_at: "2026-09-02T00:00:00Z"
  - id: D-4
    status: active
    decision: OpenCode checks Tasks only at completed top-level response boundaries and delivers continuation only after idle.
    reason: Tool-level hooks would over-query, race active work, and produce duplicate continuations.
    decided_at: "2026-09-02T00:00:00Z"
  - id: D-5
    status: active
    decision: OpenCode native todowrite is denied, while the task subagent launcher remains available.
    reason: OpenMates Tasks must be the only runtime queue without breaking delegated research/review agents.
    decided_at: "2026-09-02T00:00:00Z"

apple_impact:
  affected_files: [none]
  parity_expectations:
    - Apple must preserve unknown additive external-chat and encrypted blocker fields when native Task mutation is implemented later.
    - Apple Task UI is not launch-gated by this OpenCode-first and web Task-detail slice.
  verification:
    - Run shared schema/API compatibility tests; no Xcode build is required unless Apple Task clients already decode strict record shapes.
  intentional_native_differences:
    - External OpenCode source and blocked explanation rendering launch on web before Apple.

contracts:
  api:
    access_model: first-party-client-only
    auth: Trusted session/device authentication; OpenCode uses the opencode-personal CLI profile.
    rate_limits: Existing Task read/write limits plus one bounded context read per top-level turn completion.
    credit_budget: No OpenMates credits; external-chat Task orchestration does not invoke product inference.
    encryption_boundary: External chat id/title and blocked explanation are encrypted client-side; backend sees provider, blind index, safe reason code, status, version, and routing state only.
  cli:
    create_filter_input: provider:id is parsed locally; plaintext external id is never sent as query or durable metadata.
    blocked_reason_compatibility: --reason remains a code alias; --reason-code and --reason-text are canonical.
    json: Machine output includes decrypted authorized external context and blocked explanation plus safe metadata/version fields.
  opencode:
    source_of_truth: Trusted openmates CLI JSON commands only.
    trigger: Completed top-level assistant response followed by busy-to-idle transition.
    prohibited: Native todowrite/todoread, Plan-backed grouping, tool-completion continuation, prose-inferred Task state.

privacy_security:
  - Derive external_chat_lookup_hash with a domain-separated HMAC key scoped to owner or Team context.
  - Never persist raw OpenCode session ids, external titles, or blocked explanations in Directus plaintext fields or server logs.
  - Validate external_chat_provider against the allowlist and reject native-plus-external context atomically.
  - Use owner master wrappers for personal external-context Tasks and preserve Team authorization rules before any future Team external bridge.
  - Inject decrypted Task context only into the active first-party model request; sessions.py stores ids, hashes, versions, and generations, not decrypted Task text.
  - Fail closed on CLI authentication, decryption, ambiguity, version conflict, multiple active Tasks, or API failure; never fall back to native OpenCode todos.

scenarios:
  - id: S-1
    title: OpenCode Task is privately bound to its external chat
    given:
      - A trusted OpenCode session creates a Task for non-trivial work.
    when:
      - The CLI sends the encrypted Task mutation.
    then:
      - external_chat_provider is opencode.
      - The server stores only the provider, blind lookup hash, and encrypted external id/title.
      - primary_chat_id is null and the Task uses the owner master wrapper.
      - Listing with the same local provider:id returns and decrypts the Task.
  - id: S-2
    title: Blocked Task shows a private explanation
    given:
      - An active Task cannot continue without a repository credential.
    when:
      - The client blocks it with code missing_credentials and a private explanation.
    then:
      - Status is blocked and queue state is waiting_for_user.
      - The backend stores the allowlisted code and encrypted explanation only.
      - CLI, SDK, and web decrypt and display the explanation.
      - A Task without explanation displays a localized code fallback.
  - id: S-3
    title: Every OpenCode turn receives one authoritative Task snapshot
    given:
      - The OpenCode chat has one in_progress Task and ordered remaining Tasks.
    when:
      - A top-level model turn is prepared, retried, or compacted.
    then:
      - The request receives complete active Task details.
      - Remaining Tasks include short id, title, and status only.
      - The context is request-only and does not appear as a visible fake user message.
  - id: S-4
    title: Completed response resumes remaining work once
    given:
      - A top-level assistant response completes with open runnable external-chat Tasks.
    when:
      - Presence transitions from busy to idle.
    then:
      - A deterministic CLI reconciliation records one idempotent task_ready continuation.
      - The next turn must continue the active Task, explicitly complete and advance it, or explicitly block it with a reason.
      - Tool completions and duplicate completion events do not schedule turns.
  - id: S-5
    title: Blocked or user-controlled work remains idle
    given:
      - Work is blocked, waiting for a question/permission, explicitly stopped, failed, or aborted.
    when:
      - Completion and idle events occur.
    then:
      - No continuation is delivered.
      - A new user message cancels any ready continuation.
      - Restart reconstructs future decisions from Task state and durable ids rather than plugin memory.

