implementation_notes:
  plan_path: docs/plans/opencode-external-task-bridge/plan.yml
  status: approved
  existing_patterns:
    - Task client-encrypted fields and owner-scoped master wrappers in user_tasks.yml and tasksCli.ts.
    - Domain-separated Task label blind indexes for private equality filtering.
    - Explicit Task block/unblock lifecycle with optimistic versions and waiting_for_user state.
    - OpenCode completed-assistant detection, presence transitions, and durable continuation queue.
  architecture: >
    Ship and verify the encrypted Task data contract first, then the web blocked
    reason surface, and only then activate the protected OpenCode bridge through
    a dedicated Codex control-plane release. OpenCode never owns a second task
    store; sessions.py persists only binding and continuation metadata while all
    Task reads and mutations execute through the trusted CLI profile.
  first_slice: Add red backend, CLI, SDK, and web-service tests for external context and encrypted blocked explanations before changing schema or product code.
  boundaries:
    - No OpenMates Plan dependency or native Chat creation.
    - No developer API-key access for the OpenCode bridge.
    - No native OpenCode todo storage or prose-inferred Task transitions.
    - No decrypted Task content in backend or durable sessions.py state.
  affected_files:
    - {path: backend/core/directus/schemas/user_tasks.yml, reason: Add encrypted external-chat and blocked-reason storage fields plus safe metadata indexes.}
    - {path: backend/core/api/app/routes/user_tasks.py, reason: Validate and transport external context and blocked reason contracts.}
    - {path: frontend/packages/openmates-cli/src/tasksCli.ts, reason: Derive blind index and encrypt/decrypt new Task fields locally.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Add external-chat filters and blocked reason CLI flags/output.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: Preserve pip SDK parity.}
    - {path: frontend/packages/ui/src/services/userTaskService.ts, reason: Encrypt/decrypt fields for web Task records.}
    - {path: frontend/packages/ui/src/components/tasks/, reason: Render blocked explanation and fallback.}
    - {path: opencode.json, reason: Deny native todowrite while preserving task delegation.}
    - {path: .opencode/plugins/openmates-hooks.js, reason: Inject Task context and reconcile completed responses.}
    - {path: scripts/sessions.py, reason: Deterministic CLI task bridge and durable continuation metadata.}
  migrations:
    - Add nullable external_chat_provider, external_chat_lookup_hash, encrypted_external_chat_id, encrypted_external_chat_title, and encrypted_blocked_reason fields; existing rows remain valid.
  observability:
    - Log only provider, decision enum, task id/version/generation, and sanitized failure class; never external ids, Task text, or blocked explanations.
  assumptions_checked:
    - External context uses owner master wrapping and not a synthetic Chat key.
    - Existing Task lifecycle supports blocked/waiting_for_user and optimistic versions.
    - Existing OpenCode continuation queue supplies idempotent bounded delivery.
  acceptance_mapping:
    AC-1: [T-SPEC, T-BACKEND, T-CLI, T-SDK, T-WEB-SERVICE, V-LIVE-CONTRACT]
    AC-2: [T-SPEC, T-BACKEND, T-CLI, T-SDK, T-WEB-SERVICE, T-WEB-COMPONENT, V-LIVE-CONTRACT, V-WEB]
    AC-3: [T-OPENCODE-CONFIG, T-TASK-BRIDGE, T-HOOK, V-DISPOSABLE]
    AC-4: [T-TASK-BRIDGE, T-HOOK, V-DISPOSABLE]
    AC-5: [T-TASK-BRIDGE, T-HOOK, V-DISPOSABLE, V-RESTART]
    AC-6: [T-OPENCODE-CONFIG, T-HOOK]
  verification_strategy:
    - Approve the permanent Specification and focused Plan before implementation.
    - Run required backend, CLI, SDK, and web-service tests red before schema/product changes.
    - Verify real REST, CLI, npm SDK, and pip SDK behavior against api.dev.openmates.org before web.
    - Deploy web, run focused component Playwright and visual review, then hand off protected control-plane work to Codex.
    - Codex activates one immutable runtime release only after disposable-session and restart reconstruction tests pass.
  verification_order: [Specification and Plan approval, product red tests, API/schema implementation, REST and CLI live proof, SDK parity, web implementation and proof, Codex control-plane red tests, task bridge implementation, disposable sessions, atomic restart]
  data_flow:
    - The client parses opencode:session-id locally, encrypts id/title with the Task key, and computes an owner-scoped blind lookup hash.
    - The backend validates provider, exclusivity, version, reason code, ownership, and ciphertext presence without decrypting content.
    - Web/CLI/SDK clients decrypt authorized external and blocked fields locally.
    - OpenCode prepares each turn by invoking a deterministic sessions.py bridge that calls openmates tasks context --external-chat ... --json.
    - The hook stages reconciliation on completed top-level assistant message and delivers one durable continuation after idle when open runnable Tasks remain.
  codex_handoff:
    - Begin only after TASK-1 and TASK-2 are deployed and V-LIVE-CONTRACT plus V-WEB pass.
    - Use a dedicated control-plane recovery branch; ordinary OpenCode deploys must remain blocked for protected files.
    - Preserve the task subagent launcher while denying todowrite/todoread.
    - Build an immutable runtime bundle, test disposable sessions, restart once, and verify exact runtime identity before historical chat use.
