goal: >
  Make OpenMates Tasks the sole runtime task system for OpenCode chats. Tasks
  can be privately associated with an allowlisted external chat such as an
  OpenCode session, blocked Tasks retain a safe machine code plus an encrypted
  user-facing explanation rendered in the web UI, and a deterministic OpenCode
  completion hook resumes only when authoritative CLI Task state remains open.

scope:
  in:
    - Add an additive typed external-chat context to Tasks without using or depending on OpenMates Plans.
    - Allow only the opencode provider in the first release.
    - Store external provider as safe metadata, external id/title as client ciphertext, and equality lookup as a domain-separated owner-scoped blind index.
    - Enforce mutual exclusivity between primary_chat_id and external-chat context.
    - Keep external-context Task keys under the owner master wrapper; never create a synthetic native Chat or Chat key.
    - Add fixed blocked reason codes plus an optional encrypted blocked explanation.
    - Preserve openmates tasks block --reason <code> as a compatibility alias while adding --reason-code and --reason-text.
    - Render decrypted blocked explanations in Task cards/detail UI with a localized code fallback.
    - Add REST, CLI, npm SDK, pip SDK, export/import, and web semantic parity.
    - Disable OpenCode todowrite/todoread while preserving the separate task subagent launcher.
    - Expose a typed OpenCode task tool whose implementation shells out only to the trusted openmates CLI JSON contract.
    - Inject one request-only Task snapshot into every top-level OpenCode model turn: full active Task details and ordered remaining Task titles.
    - Reconcile once after a top-level assistant response completes and the chat transitions from busy to idle.
    - Resume through the existing durable continuation queue only when deterministic CLI state reports open runnable Tasks.
    - Stop for blocked, waiting-user, failed, aborted, explicitly stopped, permission-pending, or question-pending state.
  out:
    - OpenMates Plans, Plan UI, Plan-backed Task grouping, or Plan execution.
    - Creating a native OpenMates Chat for an OpenCode session.
    - Exposing external-chat Tasks through developer API keys in the first release.
    - Supporting external-chat providers other than opencode.
    - Apple UI for external source or blocked explanation in this first slice.
    - Inferring Task completion or blocking from assistant prose.
    - Resuming on individual tool completion or session.idle without a completed assistant response and fresh Task reconciliation.

context_discovery:
  github_issues:
    - No matching issue was found in glowingkitty/OpenMates for OpenCode external-chat Tasks or encrypted blocked explanations.
    - Existing Tasks direction remains documented in historical issue references inside docs/plans/tasks-v1/plan.yml.
  docs:
    - docs/plans/tasks-v1/plan.yml
    - docs/plans/opencode-recovery/plan.yml
    - docs/plans/task-queue-auto-continuation/plan.yml
    - docs/contributing/guides/agent-workflow-core.md
    - docs/contributing/guides/spec-driven-development.md
  contracts:
    - specifications/features/tasks/specification.yml
    - specifications/features/tasks/examples.yml
    - specifications/surfaces/cli/specification.yml
    - specifications/surfaces/sdk/specification.yml
  code_patterns:
    - user_tasks already separates server-visible routing metadata from encrypted title, description, labels, activity, and instructions.
    - Task label filtering already uses client-derived keyed blind indexes, providing the pattern for an external-context lookup hash.
    - Task blocking already stores blocked_reason_code and sets queue_state plus ai_execution_state to waiting_for_user.
    - The web task service already decrypts Task content and owns block/unblock requests but does not render a detailed blocked explanation.
    - OpenCode permissions distinguish todowrite from the task subagent launcher.
    - openmates-hooks.js already detects completed assistant messages, tracks busy/idle presence, and delivers idempotent durable continuations.
    - sessions.py already persists atomic continuation records with bounded retry and chronological synthetic message ids.
  tests:
    - backend/tests/test_user_tasks_api.py
    - frontend/packages/openmates-cli/tests/tasks.test.ts
    - frontend/packages/openmates-cli/tests/client.test.ts
    - frontend/packages/openmates-cli/tests/sdk-tasks.test.ts
    - packages/openmates-python/tests/test_tasks.py
    - frontend/packages/ui/src/services/__tests__/userTaskService.test.ts
    - scripts/tests/test_opencode_hooks_contract.mjs
    - scripts/tests/test_opencode_runtime_config.py

clarification:
  rounds:
    - question: Should OpenCode chats be represented through unfinished OpenMates Plans or through Tasks directly?
      answer: Use Tasks directly; the Plan web UI is unfinished and out of scope.
    - question: How should an OpenCode chat associate its Tasks without creating a native OpenMates Chat?
      answer: Add a typed encrypted external-chat reference such as opencode:session-id with a private lookup hash.
    - question: When should OpenCode automatically create Tasks?
      answer: For non-trivial multi-step work, explicit task requests, and discovered follow-up work; not for informational or trivial one-step turns.
    - question: When should automatic continuation run?
      answer: Once after a top-level assistant response completes and the chat switches from busy to idle, never after individual tool calls.
    - question: What must a blocked Task retain?
      answer: One allowlisted machine-readable reason code plus an optional encrypted explanation shown in the web UI.
  vision_summary: >
    OpenCode uses OpenMates Tasks directly and has no native parallel todo list.
    Every model turn receives authoritative external-chat Task context. At response
    completion a deterministic CLI check either resumes the active Task, advances
    after explicit completion, or stops on an explicitly blocked Task whose
    encrypted reason is visible to the user.
  approved_by_user: true

