decisions:
- id: D-1
  status: active
  decision: Use configured preprocessing fallback; preserve disabled retries and existing
    encrypted completion helper.
  reason: Exact approved missing-output contract and existing chats recovery contract.
  decided_at: '2026-09-08T13:26:45.735680+00:00'
- id: D-2
  status: active
  decision: Divide remaining total preprocessing time among remaining configured providers;
    preserve total cap, per-attempt ceiling, provider order and retry-disable control.
  reason: Two full timeouts consumed 25+20 seconds and deterministically starved the
    third configured provider; this repairs bounded fallback allocation without adding
    a provider or increasing the approved deadline.
  decided_at: '2026-09-08T13:58:11.139786+00:00'
  examples:
  - Three providers with 45 seconds remaining receive up to 15 seconds each, so a
    healthy third provider remains reachable.
  - A retry-disabled caller retains its single up-to-25-second attempt and never dispatches
    a fallback.
- id: D-3
  status: active
  decision: Initialize absent/null fork title_v from encrypted title presence and
    tolerate legacy null versions during message dispatch, without rewriting stored
    ciphertext.
  reason: User assigned the newly observed fork crash; existing first-party encrypted
    fork behavior requires usable independent saved chats. No access/auth/encryption
    policy change.
  decided_at: '2026-09-08T14:21:34.520720+00:00'
  examples:
  - A new encrypted fork with an encrypted title and omitted version starts at title_v
    1; explicit numeric versions remain unchanged.
  - An existing fork with null title_v can send a follow-up without replacing its
    stored encrypted title or source messages.
