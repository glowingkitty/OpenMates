schema_version: 2
id: reminder-email-redesign
title: Identifiable reminder emails with rendered cards and exact targets
status: implementing
goal: >
  Let's actually implement this properly and test it out. And also send me a
  test notification email for both as well.
references:
  - task:f22a4b44-453b-4e6a-84e0-1b10c47abd02
  - feature.notifications@2
  - docs/architecture/reminder-email-redesign.md
scope:
  in:
    - Approved newsletter shell, reminder bell and native workspace-style chat/embed preview images.
    - Identifying subjects, exact title alt text, embed descriptions, notes and readable HTML/plain-text facts.
    - Limited encrypted reminder snapshots, private image capabilities and explicit hide-content choices.
    - Exact chat/child-embed navigation through login, cold storage and sync.
    - Focused checks, isolated GitHub CI, scoped dev deployment and two authorized test emails.
  out:
    - Production activation, general notification preference redesign and unrelated mail templates.
    - Browser rendering infrastructure, arbitrary remote-image fetching and full-chat server decryption.
implementation_state:
  subject_commit: 256e41626964d2537f3883f8886b1d47a765d9ce
  note: Email delivery/rendering, all3 navigation cases and all4 shared-guest cases passed isolated CI with verified cleanup. Final regression source513231e4 differs from the primary tested application source256e4162 only in test assertions, documentation and generated records; product inputs are byte-identical. Dev deployment and both live emails remain pending.
approvals:
  specification:
    status: approved
    approved_at: '2026-10-23'
    reason: User explicitly authorized the related specification updates without another approval question.
  plan:
    status: approved
    approved_at: '2026-10-23'
    reason: User approved the rendered-card design, requested embed descriptions and authorized implementation, tests and both test emails in the existing chat.
decisions:
  - id: accepted-design-and-specification-updates
    status: active
    decision: Implement the approved newsletter shell with a reminder bell, rendered product-style cards and real-text descriptions, facts and notes.
    reason: This records the accepted user design and explicit implementation/specification authorization; it does not start another approval round.
    decided_at: '2026-10-23'
  - id: bounded-static-rendering
    status: active
    decision: Use Pillow, CairoSVG, bundled product palettes/icons and existing licensed Lexend fonts for 600x400 PNGs.
    reason: A bounded native card preserves the approved geometry without a browser fleet, HTML execution or network image fetches.
    decided_at: '2026-10-23'
  - id: private-image-capability
    status: active
    decision: Serve one encrypted reminder snapshot through an opaque recipient-held bearer capability expiring at most 90 days after its latest email delivery.
    reason: The selected transactional path uses a first-party remote preview rather than relying on unverified inline Content-ID transport; origin access is scoped, revocable, rate-limited and redacted from logs.
    decided_at: '2026-10-23'
scenarios:
  - id: S-1
    title: Useful reminder email with or without images
    given: [An eligible non-redacted chat or saved-item reminder has captured limited context.]
    when: [The reminder email is rendered and opened in a desktop or narrow mobile inbox.]
    then:
      - Subject and body identify the target; available description, facts and saved note are real text.
      - The rounded native preview and separate action share one exact destination and the preview alt text is the target title.
      - HTML and plain-text content remain useful with images blocked or expired; explicit hide-content and legacy fallback remain effective.
  - id: S-2
    title: Durable private preview after temporary caches expire
    given: [A reminder retains a bounded encrypted snapshot independently of temporary embed caches.]
    when: [An email client fetches the preview capability or an invalid, expired or revoked variant.]
    then:
      - A valid capability returns only its authorized bounded PNG without fetching URLs or executing HTML.
      - Wrong-token, expired, cancelled and deleted cases are uniformly unavailable without private output or content logging.
  - id: S-3
    title: Exact target survives startup and authentication
    given: [An email action references a private chat or child embed with verified source context.]
    when: [The action opens after authenticated reload or cold signed-out startup and required login/sync.]
    then:
      - The complete target survives and opens the referenced chat or child detail.
      - Missing or inaccessible targets show a visible unavailable state and existing public/shared guest routes remain usable.
  - id: S-4
    title: Authorized dev delivery of both examples
    given: [The scoped candidate has passed required checks and is deployed to dev.]
    when: [One chat reminder and one event/embed reminder send to the user's verified configured address.]
    then: [Both deliveries contain the approved design and readable details with their actual exact-target actions.]
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Chat and embed emails preserve target identity, descriptions, notes, facts, image alt text and HTML/plain-text actions, including blocked images, explicit redaction and legacy prompts.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-RENDER, T-ISOLATED]
  - id: AC-2
    scenario: S-2
    text: Context remains bounded and encrypted beyond cache expiry; the preview enforces bearer scope, expiry/revocation, rate limits, safe native rendering and private diagnostics.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-CONTEXT, T-RENDER, T-ISOLATED]
  - id: AC-3
    scenario: S-3
    text: Actual captured email destinations preserve chat and child-embed identity across reload, cold login and sync, with visible unavailable targets and retained public/shared behavior.
    required: true
    status: satisfied
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-ISOLATED]
  - id: AC-4
    scenario: S-4
    text: Scoped dev deployment completes and both authorized chat and event/embed test emails are delivered to the user's verified configured notification address.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: manual
    verification_ids: [T-LIVE]
