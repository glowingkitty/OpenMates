implementation_notes:
  plan_path: docs/plans/streaming-message-render-convergence/plan.yml
  status: approved
  existing_patterns:
    - backend/apps/ai/utils/stream_utils.py
    - frontend/packages/ui/src/message_parsing/streamingDocDiff.ts
    - frontend/packages/ui/src/components/enter_message/extensions/streamingNodeIdentity.ts
    - frontend/packages/ui/src/services/embedRefIndex.ts
  architecture: >
    Replace cumulative whole-document recompilation with one per-message TipTap
    editor containing a derived newest-first app-skill top group, immutable
    committed authored blocks, and one mutable tail. Persist only canonical
    Markdown and reconstruct once on reopen. Apply explicit corrections through
    stable block transactions; never use setContent after initialization during
    normal lifecycle events.
  data_flow:
    - ActiveChat receives cumulative paragraph-buffered Markdown and persists the final server-verified Markdown unchanged.
    - ChatHistory separates one derived newest-first app-skill group, safe committed authored blocks, and the mutable suffix.
    - ReadOnlyMessage applies append, tail-replace, app-skill-group-update, or targeted-correction ProseMirror transactions.
    - Embed NodeViews resolve and update through stable persisted IDs/refs without message reconstruction.
    - Reload and reopen compile persisted Markdown once and compare against the normalized live-final structure.
  affected_files:
    - {path: frontend/packages/ui/src/components/ChatHistory.svelte, reason: "Own cumulative snapshot block state and ordering."}
    - {path: frontend/packages/ui/src/components/ReadOnlyMessage.svelte, reason: "Apply block-scoped ProseMirror transactions without post-init setContent."}
    - {path: frontend/packages/ui/src/message_parsing/streamingMessageBlocks.ts, reason: "Define safe boundaries, identities, corrections, and normalized parity."}
    - {path: frontend/packages/ui/src/message_parsing/embedGrouping.ts, reason: "Restore newest-first permanent app-skill top grouping."}
    - {path: frontend/apps/web_app/tests/skill-events-search.spec.ts, reason: "Prove deployed streaming-to-final topology and preview stability."}
    - {path: frontend/apps/web_app/tests/chat-streaming-reopen-parity.spec.ts, reason: "Prove reload, reopen, and share reconstruction parity."}
  required_slices:
    - Define safe commit boundaries, stable block identities, correction diffing, and normalized structure comparison as pure tested utilities.
    - Integrate committed blocks and mutable-tail transactions into ChatHistory and ReadOnlyMessage.
    - Restore permanent newest-first top app-skill grouping while preserving authored result positions.
    - Remove normal post-init setContent fallbacks and make broad divergence observable.
    - Prove completion, metadata refresh, Report Issue, reload, reopen, anonymous persistence, sharing, maps, and performance on deployed dev.
  verification_order:
    - Backend paragraph contract and focused frontend red tests.
    - Focused backend/frontend green tests.
    - Scoped dev deploy and exact-commit Playwright gates.
    - Laptop and mobile reviewed visual smoke.
    - User confirmation.
    - Apple parity handoff.
  verification_strategy:
    - Capture red evidence for safe block commits, newest-first app-skill ordering, targeted correction, and reopen parity before source changes.
    - Run focused backend and frontend unit contracts before deployment.
    - Deploy the scoped web implementation and run exact-commit authenticated, reopen, map, performance, and anonymous Playwright gates.
    - Review laptop and mobile screenshots before requesting user confirmation.
  rollout:
    - No persisted-data migration, API rollout, or feature availability change is planned.
    - Existing REST, CLI, and SDK contracts are unchanged; their phase gates are not applicable to this browser rendering implementation.
  observability:
    - Record sanitized block commits, tail replacements, targeted corrections, setContent attempts, NodeView mounts, hydration counts, and convergence failures.
  risks:
    - Markdown constructs spanning paragraph boundaries require conservative tail retention.
    - Stable source-range identities must tolerate targeted corrections without colliding or exposing content.
    - Scattered app-skill collection must preserve execution chronology independently from authored result refs.
    - Reopen parity must include legacy persisted messages without introducing compatibility-only rendering divergence.
  open_questions: []
  material_plan_approval_required: false

