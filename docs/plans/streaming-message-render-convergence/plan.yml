assumptions:
  - id: A-1
    text: Backend text streaming is primarily paragraph-buffered and each WebSocket payload contains cumulative full_content_so_far.
    category: protocol
    required_before: implementation
    status: confirmed
    evidence:
      - {source: backend/apps/ai/utils/stream_utils.py, summary: "aggregate_paragraphs yields double-newline paragraphs, closed code blocks, forced-size segments, and the final remainder."}
      - {source: backend/apps/ai/tasks/stream_consumer.py, summary: "Each published payload includes the joined cumulative response."}
  - id: A-2
    text: Final encrypted Markdown and separately persisted embed records are sufficient to reconstruct deterministic message order without a new render manifest.
    category: persistence
    required_before: implementation
    status: confirmed
    evidence:
      - {source: docs/architecture/messaging/message-parsing.md, summary: "Messages persist as Markdown and parse client-side; embed references preserve their authored locations."}
  - id: A-3
    text: Stable block IDs can be derived deterministically from semantic role, canonical source range/content, and persisted embed identity without leaking content into telemetry.
    category: identity
    required_before: implementation
    status: checking
    blocker: Confirm the exact identity algorithm in the regenerated implementation plan and red tests.

contracts:
  api:
    - route: Existing authenticated and anonymous chat WebSocket/message-sync surfaces only
      access_model: first-party client surface only
      auth: Existing session, approved device auth, or anonymous identity; unchanged.
      rate_limits: Existing chat and WebSocket limits; unchanged.
      credit_budget: Existing inference and skill costs; rendering spends no credits.
      encryption_boundary: Cumulative plaintext exists only in approved first-party client memory; persisted messages and embeds retain client-side encryption.
      change: none
  data:
    - Canonical encrypted Markdown remains authoritative for content and relative authored ordering.
    - App-skill execution refs compile into one derived top group sorted by execution chronology newest first.
    - Authored result refs compile at their Markdown positions.
    - Live render state contains stable committed blocks and one mutable tail but is not separately persisted.
    - Fresh compilation of final Markdown is the reopen oracle and must equal normalized live-final structure.
    - Embed metadata and content update through stable persisted IDs/refs without message-level replacement.
  ui_states:
    - Empty stream and mutable initial tail.
    - Permanent newest-first top app-skill group in processing, finished, error, and cancelled states.
    - Committed prose with complete inline links, previews, quotes, formatting, and result views.
    - Incomplete mutable Markdown tail.
    - Targeted corrected block.
    - Final converged message.
    - Reloaded, reopened, synced, and shared reconstruction.
    - Visible sanitized convergence failure fallback.
  privacy_security:
    - No telemetry may contain private Markdown, decrypted embed content, readable embed refs, or share fragment keys.
    - Structural diagnostics may record block counts, roles, node types, durations, revisions, remount counts, and sanitized failure classes only.
    - Rendering introduces no provider calls, decrypted-content uploads, or persistence writes.

