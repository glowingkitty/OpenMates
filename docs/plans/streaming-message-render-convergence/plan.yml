schema_version: 2
id: streaming-message-render-convergence
title: Streaming Message Render Convergence
status: implementing

goal: >
  Render each completed assistant Markdown block once inside one TipTap editor,
  preserve already-rendered prose and embeds while later blocks stream, and make
  the live final, reloaded, reopened, synced, and shared-chat message structurally
  and visually equivalent without whole-message replacement.

scope:
  in:
    - Authenticated and anonymous web assistant-message rendering.
    - One TipTap editor per assistant message with a committed block prefix and one mutable trailing block.
    - Canonical encrypted Markdown as the authoritative persisted ordering source.
    - Paragraph-buffered cumulative WebSocket snapshots mapped to stable semantic blocks.
    - Complete inline embed links, large previews, source quotes, result views, and formatting during streaming.
    - One permanent app-skill execution group at the top of the assistant message, ordered newest execution first.
    - Targeted replacement of only blocks changed by explicit final validation or correction.
    - Stable ProseMirror and Svelte NodeView identity across streaming, completion, metadata refresh, layout changes, reload, and reopen.
    - Exact structural parity between the live final document and a fresh compile of persisted Markdown.
    - Bounded parsing, document mutation, embed resolution, component mounting, and heavy map hydration.
    - Desktop and mobile deployed verification followed by explicit user confirmation.
    - Mandatory handoff to the existing Apple chat-streaming parity spec after web confirmation.
  out:
    - A new persisted render-block manifest or migration away from canonical Markdown.
    - One TipTap editor per transport chunk or paragraph.
    - Replacing TipTap/ProseMirror.
    - Moving authored result previews or inline embed links into the top app-skill group.
    - Rendering syntactically incomplete internal JSON, links, result-view fences, or code fences as complete previews.
    - Eager hydration of hidden carousel slides or offscreen maps.
    - Changing inference, billing, provider, encryption, CLI, or SDK behavior.
    - Apple implementation before deployed web behavior is visually reviewed and user-confirmed.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401 during the original discovery; no duplicate public issue was created.
  reported_issues:
    - "7LZDH / OPE-607: finalization changes message topology, introduces Loading preview, and displaces app-skill embeds."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/messaging/message-parsing.md
    - docs/architecture/messaging/message-previews-grouping.md
    - docs/architecture/messaging/embeds.md
    - docs/plans/anonymous-streaming-ui/plan.yml
    - docs/plans/apple-chat-streaming-parity/plan.yml
  code_patterns:
    - backend/apps/ai/utils/stream_utils.py aggregates provider tokens at double-newline paragraph and closed-code-fence boundaries, with bounded forced-yield exceptions.
    - backend/apps/ai/tasks/stream_consumer.py publishes cumulative full_content_so_far after each aggregated chunk.
    - frontend/packages/ui/src/components/ActiveChat.svelte stores cumulative raw Markdown and persists the final server-verified Markdown.
    - frontend/packages/ui/src/message_parsing/parse_message.ts currently performs document-wide grouping, promotion, hoisting, and scattered app-skill collection.
    - frontend/packages/ui/src/components/ChatHistory.svelte currently recompiles cumulative full documents on a bounded scheduler.
    - frontend/packages/ui/src/components/ReadOnlyMessage.svelte currently diffs full documents and retains setContent fallbacks that can destroy all NodeViews.
    - frontend/packages/ui/src/message_parsing/streamingDocDiff.ts can preserve unchanged ProseMirror ranges but does not define committed semantic block ownership.
    - frontend/packages/ui/src/services/embedStore.ts provides event-driven stable embed ID/ref resolution independently of message parsing.
  tests:
    - frontend/apps/web_app/tests/skill-events-search.spec.ts
    - frontend/apps/web_app/tests/anonymous-free-chat.spec.ts
    - frontend/apps/web_app/tests/embeds-map-view.spec.ts
    - frontend/apps/web_app/tests/chat-streaming-render-performance.spec.ts
    - frontend/apps/web_app/tests/chat-scroll-streaming.spec.ts
    - frontend/apps/web_app/tests/chat-flow.spec.ts
    - frontend/packages/ui/src/message_parsing/__tests__/streamingMessageCompiler.test.ts
    - frontend/packages/ui/src/message_parsing/__tests__/parse_message_large_promotion.test.ts

apple_impact:
  affected_files:
    - none in the web-first implementation slice
    - docs/plans/apple-chat-streaming-parity/plan.yml after web user confirmation
  parity_expectations:
    - Web remains the rendered source of truth for block ordering, progressive semantics, app-skill placement, and final/reopen parity.
    - Apple must later implement equivalent committed-block and persistence convergence using native rendering primitives.
  verification:
    - Record an upstream_web_handoff in the Apple spec with the confirmed web commit and evidence IDs.
    - Resume Apple verification only after V-USER-CONFIRMATION passes.
  intentional_native_differences:
    - Apple may use SwiftUI render documents rather than TipTap, but no visible ordering or lifecycle difference is approved.

clarification:
  rounds:
    - question: Should map/calendar result views mount during streaming once their descriptor is complete?
      answer: Yes; show lightweight unresolved entries and defer expensive hydration.
    - question: Does Apple parity immediately follow confirmed web behavior?
      answer: Yes.
    - question: Should canonical encrypted Markdown remain the sole persisted ordering source?
      answer: Yes; do not introduce a persisted render-block manifest.
    - question: Where and in what order should app-skill execution embeds render?
      answer: Always in one top group regardless of execution time, with the most recently executed skill first.
    - question: Should authored previews and inline links retain their Markdown position while final corrections update only their affected block?
      answer: Yes.
    - question: Should one TipTap editor own immutable committed blocks plus one mutable trailing block?
      answer: Yes.
  vision_summary: >
    Canonical encrypted Markdown remains authoritative. One TipTap editor renders
    a permanent newest-first app-skill group at the top, committed prose and
    authored embed blocks in Markdown order, and one mutable tail. Complete
    streamed constructs immediately use final display semantics; completion does
    not rebuild the message; targeted corrections touch only changed blocks; and
    reload, reopen, sync, and sharing reproduce the same ordered document.
  approved_by_user: true

implementation_state:
  subject_commit: f2e556f1f

approvals:
  specification:
    status: approved
    approved_at: "2026-08-05T16:49:01Z"
  plan:
    status: approved
    approved_at: "2026-08-05T16:49:01Z"
    reason: The user approved the single-editor committed-block architecture and explicitly requested implementation after the spec update.

decisions:
  - id: D-1
    status: active
    decision: Keep canonical encrypted Markdown as the sole persisted content and ordering authority.
    reason: This preserves existing encryption, sync, sharing, CLI, SDK, and cross-device contracts.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-2
    status: active
    decision: Use one TipTap editor per assistant message with stable committed blocks and one mutable tail.
    reason: ProseMirror can mutate only changed ranges while retaining cross-block selection, highlighting, accessibility, and mounted NodeViews.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-3
    status: active
    decision: Treat complete server paragraphs as commit candidates, subject to a safe Markdown-boundary check.
    reason: Transport chunks are primarily paragraphs, but lists, tables, fences, embed runs, and forced-size chunks can require a mutable suffix.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-4
    status: active
    decision: Render all app-skill executions in one permanent top group ordered newest execution first.
    reason: This restores established product behavior and keeps execution UI separate from authored result references.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-5
    status: active
    decision: Keep result previews, inline embed links, source quotes, and result views at their authored Markdown positions.
    reason: These nodes are part of the assistant answer, not app-skill execution history.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-6
    status: active
    decision: Apply explicit final corrections as stable block replacements and prohibit silent whole-message replacement.
    reason: Source validation may legitimately change one block but must not move or remount unaffected content.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-7
    status: active
    decision: Prohibit setContent after initial editor creation for normal streaming, completion, embed metadata refresh, and layout changes.
    reason: Full replacement destroys correctly hydrated NodeViews and caused the visible convergence regression.
    decided_at: "2026-08-05T16:49:01Z"
  - id: D-8
    status: active
    decision: Require normalized structural equality between live final and fresh persisted-Markdown compilation.
    reason: Visual continuity is incomplete unless reload, reopen, sync, and shared-chat reconstruction preserve order and identity.
    decided_at: "2026-08-05T16:49:01Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-2
    approach: Use write-mode parsing while streaming and read-mode parsing after completion.
    outcome: rejected
    recorded_at: "2026-08-05T10:55:56Z"
    reason: Parser modes produce incompatible embed and grouping semantics.
  - id: ATTEMPT-2
    task_id: TASK-2
    approach: Recompile each cumulative full document at an 80 ms cadence and apply a whole-document diff with setContent fallbacks.
    outcome: rejected
    recorded_at: "2026-08-05T16:49:01Z"
    reason: Issue 7LZDH proved completion can still change topology, insert an unresolved large preview, move app-skill UI, and lose loaded preview state.
  - id: ATTEMPT-3
    task_id: TASK-1
    approach: Commit safe semantic blocks, mutate only the tail or explicitly corrected blocks, and reconstruct once from persisted Markdown on reopen.
    outcome: planned
    recorded_at: "2026-08-05T16:49:01Z"

handoff:
  current_task_id: TASK-1
  next_action: Add and run red block-commit, ordering, correction, and reopen-parity tests before source changes.
  command: python3 scripts/tests.py run --suite vitest
  expected_outcome: New append-oriented contracts fail against the current cumulative whole-document implementation.
  blocker: null
  last_verified_commit: f2e556f1f

scenarios:
  - id: S-1
    title: Completed streamed paragraphs immediately use final display semantics
    given:
      - A cumulative assistant response contains prose, inline embed links, large previews, source quotes, and formatting.
    when:
      - A paragraph reaches a safe semantic boundary while later content is still pending.
    then:
      - The paragraph is committed within the bounded update interval using final read/display semantics.
      - Complete inline links and previews are interactive during streaming.
      - Only the syntactically incomplete mutable tail may remain provisional.

  - id: S-2
    title: App-skill execution UI remains at the top and newest first
    given:
      - Skills execute before and between assistant prose paragraphs.
    when:
      - New app-skill references arrive, finish, the message completes, or the chat reopens.
    then:
      - One app-skill group remains above all assistant prose.
      - The newest execution appears first and earlier executions follow in reverse chronological order.
      - Existing cards update in place and retain loaded preview content.

  - id: S-3
    title: Authored result references retain Markdown positions
    given:
      - Assistant Markdown contains a large result preview and an inline embed link between prose paragraphs.
    when:
      - Later paragraphs, app-skill executions, or completion arrive.
    then:
      - The result preview and inline link remain at their authored positions.
      - They are not extracted into or confused with the top app-skill group.
      - Their semantic IDs, presentation variants, and interactions remain stable.

  - id: S-4
    title: Finalization commits the tail without rebuilding the message
    given:
      - The top app-skill group and at least two prose/embed blocks are already rendered.
    when:
      - The final cumulative event contains no correction to committed content.
    then:
      - Only the remaining tail is committed and streaming presentation ends.
      - No committed node changes position or type.
      - No existing NodeView remounts and no new Loading preview shell appears.

  - id: S-5
    title: Explicit final correction replaces only affected blocks
    given:
      - Source or URL validation removes or changes content in one previously rendered block.
    when:
      - The final cumulative Markdown is not a strict extension of the previous snapshot.
    then:
      - Stable block comparison identifies and replaces only changed blocks.
      - Unaffected prose, app-skill cards, previews, selections, and hydration state remain mounted and ordered.
      - Every changed stable block is replaced in one atomic transaction; transaction or schema failure emits a sanitized visible fallback rather than silent setContent.

  - id: S-6
    title: Reload and reopen reproduce the live final message
    given:
      - A completed message contains a newest-first top app-skill group, prose, inline links, and previews.
    when:
      - The page reloads, the chat closes and reopens, another device syncs it, or a shared chat renders it.
    then:
      - Fresh compilation of persisted Markdown produces the normalized live-final block sequence.
      - App-skill order, authored positions, node types, semantic identities, and preview variants match.
      - Resolved embeds recover through persisted IDs/refs without permanent loading placeholders.

  - id: S-7
    title: Result views render progressively with deferred heavy hydration
    given:
      - A valid result-view descriptor closes before the message completes.
    when:
      - Referenced entries resolve over time.
    then:
      - One stable result-view node renders during streaming and after completion.
      - Lightweight unresolved rows recover in place.
      - Leaflet and other heavy work remain visibility/idle-gated and initialize once per stable instance.

  - id: S-8
    title: Large responses perform work proportional to changed blocks
    given:
      - A 10000-character response streams 20-35 transport chunks per second and contains ten previews and one result view.
    when:
      - It streams, completes, and receives an embed metadata refresh.
    then:
      - Parsing and ProseMirror mutation are bounded to the mutable tail, newly committed blocks, the top app-skill group, or explicitly corrected blocks.
      - No normal lifecycle performs setContent after editor creation.
      - Rendering triggers no IndexedDB writes, provider calls, or work proportional to full chat history.

  - id: S-9
    title: Authenticated and anonymous paths share lifecycle guarantees
    given:
      - Authenticated and anonymous chats receive equivalent supported cumulative streams.
    when:
      - They render, complete, persist locally, reload, or are interrupted.
    then:
      - Both use committed blocks, stable identity, targeted corrections, and safe cleanup.
      - Existing encryption and anonymous persistence boundaries remain unchanged.

  - id: S-10
    title: Confirmed web behavior hands directly to Apple parity
    given:
      - Unit, deployed Playwright, performance, reopen-parity, and visual-smoke gates pass.
      - The user confirms deployed laptop and mobile behavior.
    when:
      - The web phase closes.
    then:
      - The Apple parity spec receives the web commit and evidence handoff and becomes the next implementation ledger.

