schema_version: 2
profile: concise
id: shopping-reference-images
title: Shopping product images and visual relevance
status: verified
goal: >-
  Improve the shopping search skill by getting additional images, adding support
  for using Jev to evaluate / filter also based on user/assistant provided images
  and compare to the product description and product images.
scope:
  - Preserve all distinct image URLs already supplied by each product search response.
  - Keep the existing primary image and structured product identity, price and purchase link.
  - Accept up to three authorized uploaded or generated reference images per request.
  - Compare references, stated requirements, product descriptions and bounded product photos with Jev.
  - Expose evaluated versus unavailable visual comparisons; do not claim exact identity from appearance alone.
  - Make every supplied product photo accessible in the shopping product gallery.
  - Keep assistant explanations grounded in stated product facts and the explicit zero-to-four score scale.
  - Retrieve up to forty candidates before relevance filtering and retain the caller's final result limit.
decisions:
  - User chose no additional paid Amazon product-details requests for gallery enrichment.
  - Keep shopping results separate from images.search; no additional search provider integration.
  - Keep the existing Jev model route; no global version change or SubQ fallback.
  - Filter only on a usable evaluation; preserve deterministic fallback when image evaluation is unavailable.
  - User explicitly confirmed forty candidates on 2026-10-20; use at most eight visual batches and three concurrent calls, without paid Amazon pagination or gallery enrichment.
  - Limit and validate image downloads and owner-check private reference embeds before decryption.
checks:
  - Focused parser tests cover image order, duplicate/malformed entries, prices and primary compatibility.
  - Focused visual-ranking tests cover three references, multimodal evaluation, authorization and fallback.
  - Isolated GitHub E2E covers structured image results and reference validation through real skill dispatch.
  - Relevant local lint, TypeSafe provider tests and schema checks pass before scoped dev publication.
  - Isolated component proof covers product-gallery selection, keyboard navigation and primary-image fallback.
  - Grounding regressions preserve score scale and composition limits through assistant tool history.
  - Real-inference validation uses automatic routing without overrides and verifies the actual Gemini 3.8 Flash model and applicable thinking level.
  - Objective image tests cover OCR, object counts, ambiguous evidence, multiple references and a text follow-up after images.view, with no unsolicited coordinate or label dumps.
  - Forty-candidate coverage proves a matching candidate beyond rank twenty survives filtering and final result limits remain unchanged.
