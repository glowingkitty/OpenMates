id: project-chat-previews
title: Linked chat cards in Project folders
goal: Chats must show up in folders in the same grid like other embeds including following the same sorting,
  even for remote access projects while offline.
scope:
  in:
  - Shared Continue card appearance at embed preview size with compact list rows
  - Mixed stored and remote folder grids, bounded pagination and encrypted folder membership
  - Linked chats and their folder paths remain reachable when the remote source is offline
  - Navigation to the original chat and account/team cache isolation
  out:
  - Writing or exporting chats into connected device files
  - Automatic new-chat Project membership
  - Apple implementation and production release
decisions:
- id: encrypted-links
  status: active
  decision: Merge encrypted Project chat links with connected files; retain link-derived folder navigation
    offline
  reason: User explicitly requested mixed sorting and offline support without remote chat storage
  decided_at: '2026-10-03'
checks:
- Focused metadata cache, folder projection and merged pagination unit tests
- Isolated bare component CI with narrow screenshots reviewed
- Isolated encrypted organization and disconnected remote source browser coverage
authorization: User requested implementation and testing, including mixed remote folders and offline availability.
status: verified
scenarios:
- id: S-1
  title: Browse linked chats with files
  given:
  - A Project contains encrypted chat links and stored or connected files
  when:
  - The user opens Files, changes sorting or disconnects the source
  then:
  - The mixed grid remains bounded and linked chats stay reachable through their folders
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Shared cards, mixed sorting, original-chat navigation and offline folder reachability preserve
    encrypted membership and account isolation
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_frontend
