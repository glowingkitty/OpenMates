  expanded_run_progress: Expanded correction and workflow comparisons completed 96 rows each. Correction manual fidelity passed 46/48 Mercury versus 45/48 Gemini. Workflow INSTANT had six critical/incomplete rows and two unresolved relevance gaps; later LOW diagnostic had one critical/incomplete row and one unresolved gap across 48 rows. Independent arms do not prove chained recovery.
  restriction_transport_gate: Disabled models/servers are processing restrictions per userProfile.ts lines 53-57, but message_received_handler.py from line 2555 does not forward them. Candidate backend guards require supplied settings. This predates Mercury, but the user now explicitly requires restriction preservation, so implement and verify the narrow transport fix before automatic rollout. Parent owns source and contract approval receipts.
  expanded_readiness_plan: 24 new transcript correction cases (12 German and 12 English), two native model arms and two repeats yield 96 planned completions; 24 workflow cases (original eight plus sixteen new), two native arms and two repeats yield 96 planned results. Correction only; no new summarization scope.
  remaining:
    - Implement and verify disabled-model/server restriction transport and enforcement, including user/model/key eligibility, before automatic rollout.
    - Record exact updated workflow contract presentation/approval and verify bounded recovery against retained critical expanded-suite defects without claiming universal repair.
    - Implement and verify native Mercury LOW ordinary correction with five-second Gemini 3.8 Flash LOW fallback, replacing the older Gemini fallback version.
    - Implement and verify request-global max-three workflow author calls INSTANT then LOW then Gemini LOW, outage skips/one Gemini repair within budget, Stop/cancel termination, immutable accepted prefixes, disabled partial information and per-attempt billing.
    - Implement and verify eligible low-complexity text default routing, five-second first-substantive Gemini fallback, exact preferences and unsupported-modality eligibility.
    - Verify healthy Jev never invokes generative recovery; permitted recovery uses Mercury then Gemini 3.5 Flash-Lite without changing Unsure contracts.
    - Record final cache-composition, routing restriction and isolated CI evidence, scoped dev publication and runtime verification receipts; implementation remains pending rollout.
