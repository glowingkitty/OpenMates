schema_version: 2
profile: concise
id: mercury-fast-inference
title: Mercury 3 integration and speed-sensitive workload evaluation
status: verified
goal: >-
  Research and implement Inception Labs' new Mercury model, benchmark it against
  Gemini 3.8 Flash for low-complexity tasks, use it for transcript correction after
  confirming API access, and evaluate its suitability for AI workflow creation
  and other generative tasks where maximum speed matters.
scope:
  in:
    - Direct Mercury 3 text, tool-call and streaming adapter with authoritative usage and pricing.
    - Vault-first credentials and explicit provider availability, with current automatic routing preserved.
    - Paired synthetic transcript and bounded generation benchmarks against Gemini 3.8 Flash and the current correction baseline.
    - Synthetic-only Mercury benchmarks through OpenRouter, explicitly authorized to inform a paid direct-account decision; pin Inception and label gateway timings separately.
    - Workflow author evaluation through the existing compiler, prefix validation and semantic oracle; no workflow model replacement in this phase.
    - Mercury-first ordinary audio correction with bounded Gemini fallback, actual model attribution and original transcript preservation.
    - Provider privacy disclosure and reproducible private benchmark reports.
    - Cited public Mercury 3 versus Gemini 3.8 Flash benchmark comparison to inform low- and medium-complexity routing recommendations.
  out:
    - Default chat routing or account model changes.
    - Replacing Jev decisions or enabling workflow transcript correction by default.
    - Production deployment or changes to real user workflows.
    - OpenRouter as a product Mercury route or automatic replacement for direct Inception access.
contracts:
  api:
    - GET https://api.inceptionlabs.ai/v1/models uses Bearer authentication and provides a nonbilling availability probe; listing alone does not prove generation access.
    - POST https://api.inceptionlabs.ai/v1/chat/completions uses Bearer authentication, model mercury-3, messages and max_completion_tokens; tools and normal SSE streaming use the OpenAI-compatible wire contract.
    - Model input and output are text only; context is 1M tokens and maximum completion is 131072 tokens.
    - Reasoning is instant, low, medium or high; temperature is constrained to 0.5 through 1.0.
    - Normalized outputs retain content, parsed tool calls, finish reason and actual provider usage, including reported reasoning and cached input without inventing missing counters.
    - Authentication and malformed responses fail explicitly without logging private content or credentials; transient retry is bounded and correction uses a short timeout before fallback.
    - Regular USD per million input/output is 0.20/0.70, cached input 0.02; launch promotion is 0.10/0.35 and cached input 0.01, checked 2026-10-20 with no published end date. Existing temporary_prices applies the 50% launch discount to supplier costs and customer credits, as explicitly requested by the user.
  preserved:
    - Existing audio correction result, title cleanup, language and meaning preservation, sanitization and failure behavior.
    - Original transcript remains the timestamp source; unsuccessful correction never marks raw text corrected.
    - Workflow generation remains Gemini and retains existing billing, validation, accepted-prefix and no-auto-execution contracts.
verification:
  required:
    - Focused local adapter, audio correction, benchmark protocol and metadata checks.
    - Live Vault-backed model generation and paired synthetic provider benchmarks outside CI, recording exact source identity and validation outcomes.
    - Relevant audio product E2E coverage updated and verified in isolated GitHub CI.
    - Scoped dev publication through sessions.py with required repository checks.
evidence:
  api_access: Vault-backed mercury-3 replied API_ACCESS_OK in 1.255 seconds on 2026-10-20; the local environment contains the normal IMPORTED_TO_VAULT marker rather than an API credential.
  training_opt_out: The account owner explicitly confirmed on 2026-10-20 that Improve the model for everyone is OFF in the Inception API Platform.
  direct_capacity: Earlier direct requests intermittently returned HTTP 429 shared free-tier capacity errors; later completed native suites produced 54 fast-suite HTTP 200 responses and 48 completed workflow rows with zero 429s. This establishes usable capacity during those runs, not a broad availability guarantee. Product routing remains direct.
  benchmark_transport: The user explicitly authorized OpenRouter for synthetic benchmarking only on 2026-10-20, to decide whether to upgrade the direct Inception account. Gateway timing and capacity cannot establish direct API performance.
  gateway_capacity: Initial small gateway probe succeeded, followed by intermittent upstream HTTP 429 and an interrupted partial suite. Those gateway results are availability context only; completed native suites now supply the quality and latency evidence.
  availability_recheck: On October 20 at 11:34 Berlin time, direct and gateway forced-tool probes completed; gateway 429s recurred during a restarted suite. This is intermittent request rejection, not an established broad outage. No accessible official incident announcement was found. Harnesses now stop at their first 429.
  manual_selection: Mercury 3 is present in the direct-only manual catalog under More providers > Inception; allow_auto_select false restricts automatic routing only. Added focused browser selection/icon/capability coverage.
  dev_backend_revision: e27304e2c31f76c5b23714c094ca3a7e7f89fbd7
  native_harness_revision: 7fb52e4ad35cf31190abc80ec30f8345721229e3
  native_runtime_identity: Disposable child processes loaded published benchmark modules against runtime 0cbcf2c715b49c83424f028659948683b4dbc94e; sidecars verify identical product dependencies and benchmark-only differences, without shared runtime mutation.
  native_fast: 54 HTTP 200 responses, no skipped rows. Transcript strict and manual passes were Gemini 12/12, Mercury instant 5/12, Mercury low 12/12; median seconds 3.302, 0.507, 0.750. Across transcript and writing, manual passes were 18/18, 9/18, 17/18. Uncached promotional supplier estimates are not actual charges.
  native_workflow: 48 completed rows, zero 429s. Gemini and Mercury instant had 16/16 full valid intent-matching graphs; Mercury low 15/16 valid and 14/16 intent matching. Median retry-inclusive seconds 4.294, 1.426, 2.571. Manual review found unsupported historic starts_at in four Gemini plans; low repeated a forbidden capability field and added an unrequested Check. Cost subtotals have incomplete usage and caching affects timings.
  recommendation: Mercury low for ordinary transcript correction with bounded Gemini fallback; Mercury instant for a scoped workflow pilot only; preserve general Gemini defaults and decision provider.
  correction_enablement: Native stop finish reason supported with strict tool validation. Initial six-case facade proof passed; first shared check retained a retracted date at case five. Refined generic self-correction instructions in e27304e passed twelve repeated actual-facade cases, manually reviewed, median 0.706 seconds. Dev opt-in configured under docker-4baf58cc; coordinated source refresh docker-a2fe2078 passed health checks. Final actual shared-module proof matched published e27304e source bytes and enabled gate with no override, passed all six direct cases without fallback, manually reviewed, median 0.795 seconds. Five-second deadline, zero correction retries and Gemini fallback remain; production is unchanged.
  picker_verification: Isolated browser CI passed on source 4a71c76d9d7f25979609540dd81ad73429d1926f, run 39405570105, request f79efd519e5dfe7aa7bd403ad2465d969923026617d6e2c7a1b1e49e47a3df28. Verified loaded icons, capability, exact manual draft choice and return to Auto without inference; latest successful recording uploaded through its receipt.
  reports:
    - docs/plans/mercury-fast-inference/evaluation-2026-10-20.md
    - docs/plans/mercury-fast-inference/public-benchmarks.md
  remaining: []
  follow_up_decisions:
    - Paid direct access and any scoped workflow pilot; no broad low- or medium-complexity default switch is supported.
    - Production rollout is outside this dev-only task.
