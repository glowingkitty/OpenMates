scenarios:
  - id: S-1
    title: Fresh logged-out visitor sees expanded app-shell intro
    given:
      - A fresh logged-out visitor opens `/` without a chat hash.
      - The page is rendered inside the normal OpenMates app shell.
    when:
      - The guest welcome state finishes initial loading.
    then:
      - The guest daily inspiration intro expands to fill the active chat container.
      - The headline reads exactly `Simply ask your` and `AI team mates` on separate lines.
      - A user-message style bubble rotates through the four approved short requests.
      - Active app icons move in two rails under the message bubble.
      - The current matching active app icon is visually emphasized.
      - The existing-style progress bar is visible at the bottom.

  - id: S-2
    title: Visitor can skip intro and see regular-size slide 2
    given:
      - A logged-out visitor is viewing the expanded intro.
    when:
      - The visitor clicks the right carousel arrow before the intro completes.
    then:
      - The expanded intro collapses immediately.
      - The regular daily inspiration header shows slide 2 with `Actionable.` and `Not just a wall of text.`.
      - The example-chat area remains visible below the header.

  - id: S-3
    title: Intro auto-collapses after the fourth request
    given:
      - A logged-out visitor does not interact with the intro.
    when:
      - The intro reaches the end of `Explain the news`.
    then:
      - The intro collapses without a hold screen.
      - Slide 2 appears at regular daily inspiration header size.
      - The page remains usable with the message input and example-chat carousel visible.

  - id: S-4
    title: Actionable slide demonstrates a localized one-shot embed interaction
    given:
      - The visitor is on the `Actionable` slide.
    when:
      - The slide plays the first event explainer animation.
    then:
      - The animation shows a simple user message for tech events in Berlin.
      - It shows a real chat-history-style user bubble with the speech-tail pointer.
      - It shows a real chat-history-style assistant response with the localized general-knowledge mate name and speech-tail pointer saying the localized equivalent of `Of course, here you go:`.
      - A real events embed preview for `DEPIN DAY BERLIN` fades in with its Luma cover image.
      - A visible cursor moves over the preview and clicks it.
      - The click reveals the actual CTA text `Open on Luma`, and the cursor clicks that CTA.
      - Every user-visible demo string comes from the translation sources for every supported locale.
      - Each content stage enters quickly from below at reduced scale, continues drifting upward very slowly through the center without stopping, then accelerates upward while scaling and fading down.
      - At every viewport width, the large icon-free headline enters from below, keeps moving subtly through center with eased deceleration and acceleration, then fades and exits upward.
      - The first user-message stage starts only after the heading is fully hidden and unmounted; no frame shows heading text together with the animation.
      - The chat messages and CTA use readable presentation-scale text rather than compact metadata sizing.
      - The preview is fully visible and centered during its center dwell at desktop and mobile sizes.
      - The event title appears only inside the real event preview; no separate title overlays its date or metadata.
      - The animation plays once, the progress bar reaches 100% at the final clicked state, and the carousel advances to the privacy slide without repeating.
      - On mobile, every post-intro slide transition fades the old content fully out, swaps the slide while hidden without geometry transitions, then fades the new content in.
      - Navigating backward before the `Actionable` slide restores the full-height intro with its app wheel; the removed compact `AI team mates for everyday tasks` intro is never reachable.
      - The slide does not show the rejected simplified fullscreen/map surface.
      - The animation is visually faithful to real OpenMates chat and events embed styling without mounting a full interactive chat runtime.

  - id: S-5
    title: Future landing sections show filtered real examples instead of pre-signup tags
    given:
      - A logged-out visitor views any regular-size explanatory slide.
    when:
      - The slide changes between actionable, privacy, mates/focus modes, and cross-platform benefits.
    then:
      - The cards below the header show real matching public example chats for the current benefit.
      - "`Show all example chats` opens the all-examples grid."
      - Secondary links alternate between apps exploration and privacy/encryption education as specified by the active benefit.
      - Topic tags are not shown before signup.

  - id: S-6
    title: Future post-signup onboarding replaces public examples
    given:
      - A visitor completes signup.
    when:
      - The app returns to the welcome/new-chat area.
    then:
      - The public example-chat area is replaced by an onboarding flow that offers chat import, job-based topic selection, and filtered inspiration.
      - If imported chats exist, the user sees `Continue where you left off` with real user chats instead of generic example chats.

  - id: S-7
    title: Privacy and safety header tells nine product-faithful one-shot scenes
    given:
      - A logged-out visitor reaches `Privacy & safety by design.`.
    when:
      - The coordinated privacy header timeline plays.
    then:
      - The full-width icon-free heading uses the shared enter/continuous-motion/exit envelope and is fully removed before the nine animation scenes begin.
      - Scene 1 reads `Only your devices can decrypt all your data.`.
      - Scene 2 floats chat, files, tasks, and memory icons, reveals an unlocked lock, animates it closed and larger, and fades the surrounding icons to 0.5 opacity.
      - Scene 3 reads `Personal details are replaced, before the AI sees them.`.
      - Scene 4 uses the real user-message bubble and PII yellow-highlight treatment to detect an email address.
      - Scene 5 reads `Only you can view the originals.`.
      - Scene 6 uses the real hidden-placeholder and revealed-original colors and switches from the placeholder to the original email like the chat-history reveal control.
      - Scene 7 reads `Personalized responses. But only when you want them.`.
      - Scene 8 uses the real user-message bubble for `Recommended places for my next trip?`.
      - Scene 9 presents the same travel trips memory permission-card structure used by the live assistant memory request.
      - Every scene uses the reusable Actionable-style sub-slide enter/dwell/exit wrapper.
      - The progress bar reaches 100% when the timeline completes and advances once to the mates/focus slide.

  - id: S-8
    title: Mates and focus modes make expert behavior understandable
    given:
      - A logged-out visitor reaches the AI accessibility slide.
    when:
      - The 12000ms header timeline plays.
    then:
      - The headline reads `No deep tech knowledge needed.` and uses the shared full-width heading-only motion before the animation.
      - The first 6000ms segment scrolls real metadata-backed mates and highlights their localized specialties one at a time.
      - The second 6000ms segment scrolls real focus-mode entries and ends with one visibly active.
      - The progress bar reaches 100% when the timeline completes and advances once to the people-first slide.

  - id: S-9
    title: People-first header explains provider choice and portable access
    given:
      - A logged-out visitor reaches the people-first experience slide.
    when:
      - The 12000ms header timeline plays.
    then:
      - The headline reads `Built for people & the best possible experience.` and uses the shared full-width heading-only motion before the animation.
      - The first 6000ms segment highlights Google Gemini, Anthropic Claude, OpenAI, and Mistral around OpenMates using current provider identities.
      - The second 6000ms segment transitions through a web chat, the real CLI chat-list command, and a concise TypeScript SDK example before ending on Web, CLI, and SDK together.
      - The progress bar reaches 100% when the timeline completes and advances once to signup.
      - Signup remains terminal and does not expose a next control.

  - id: S-10
    title: Reduced-motion visitors get static readable header stories
    given:
      - A logged-out visitor prefers reduced motion.
    when:
      - They navigate among the explanatory slides.
    then:
      - Each slide immediately shows its static summary without autoplay; heading and animation content remain readable and do not overlap.
      - Automatic slide advancement and decorative infinite motion are disabled.
      - Previous and next controls remain usable.

  - id: S-11
    title: Guest New chat opens a blank focused composer
    given:
      - A logged-out visitor has opened a public example chat on a desktop viewport.
    when:
      - They press the adjacent New chat action.
    then:
      - The example chat is cleared and the URL no longer selects a chat.
      - The blank message editor receives focus so the visitor can type immediately.
      - The expanded landing intro does not reset to slide 0.

