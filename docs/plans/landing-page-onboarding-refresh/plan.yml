    decided_at: "2026-07-22"
  - id: D-2
    status: active
    decision: The expanded full-container state is one-time per fresh page load but not persisted as seen.
    reason: Replaying preserves the product overview for every fresh visitor while manual arrows keep it skippable.
    decided_at: "2026-07-22"
  - id: D-3
    status: active
    decision: The icon rails may only use active app metadata.
    reason: The user rejected showing non-existing, inactive, or future app affordances in the landing intro.
    decided_at: "2026-07-22"
  - id: D-4
    status: active
    decision: Post-signup topic selection supersedes logged-out topic tags.
    reason: The refreshed landing should show real example chats and product benefits before asking visitors to categorize themselves.
    decided_at: "2026-07-22"
  - id: D-5
    status: active
    decision: Activate the regular-size Actionable event explainer slide after deployed iPad rail verification.
    reason: User instructed continuation with the other slides once the app rail clipping fix was confirmed working.
    decided_at: "2026-07-23"
  - id: D-6
    status: active
    decision: The primary intro app rail keeps moving right-to-left, slower than the secondary rail, with the highlighted apps consecutive.
    reason: User explicitly rejected a static top row and asked to remove filler app placeholders between the highlighted apps while preserving near-center highlighted visibility.
    decided_at: "2026-08-02"
  - id: D-7
    status: superseded
    decision: The Actionable animation is a one-shot timeline whose completion advances to the privacy slide, with a mobile-only same-node headline/icon morph and progress derived from the same duration.
    reason: The user rejected the repeating animation, abrupt compact heading replacement, and inaccurate fixed-duration progress behavior.
    decided_at: "2026-08-03"
  - id: D-8
    status: superseded
    decision: All regular explanatory slides use the mobile-style large-to-compact centered heading structure at every viewport width; the earlier desktop side-by-side Figma frame is outdated.
    reason: The user found the split headline and animation difficult to read and explicitly approved one full-width structure for desktop and mobile.
    decided_at: "2026-08-04"
  - id: D-9
    status: superseded
    decision: The privacy story says saved chats and memories are encrypted before storage and only the user's devices can unlock saved data.
    reason: This preserves direct non-technical privacy language while accurately scoping the claim away from transient plaintext required for AI inference.
    decided_at: "2026-08-04"
  - id: D-10
    status: active
    decision: Example chats and supporting links are excluded from the current header-animation milestone.
    reason: The user explicitly requested that example-chat work remain a separate story.
    decided_at: "2026-08-04"
  - id: D-11
    status: active
    decision: Every landing heading uses one reusable enter/continuously-moving/exit motion contract for slide changes, with no compact re-entry over the animation.
    reason: The user rejected static and overlapping headings and specified bottom-to-center motion, continuous eased movement, and an upward fade before the animation begins.
    decided_at: "2026-08-04"
  - id: D-12
    status: active
    decision: Actionable and privacy render each internal scene through one reusable keyed sub-slide motion component while preserving Actionable's visual rhythm.
    reason: The user approved slide 1's staged motion and requested the same deterministic mechanism for later stories.
    decided_at: "2026-08-04"
  - id: D-13
    status: active
    decision: The privacy story contains nine ordered scenes and reuses the real chat bubble, PII highlight/reveal colors, and memory permission-card presentation.
    reason: The user rejected abstract placeholder visuals and explicitly required product-faithful PII and travel-memory UI.
    decided_at: "2026-08-04"
  - id: D-14
    status: active
    decision: Guest New chat from an open example returns to a blank composer-focused chat state without resetting the landing carousel to slide 0.
    reason: The user's intent is to start typing immediately; the prior guest intro reset prevents that flow.
    decided_at: "2026-08-04"
  - id: D-15
    status: superseded
    decision: Compact landing stories keep their heading and animation close together, enter headings from below and exit them upward, and present the PII exchange as a product-faithful user-to-Burton conversation without decorative icons on copy-only scenes.
    reason: The user rejected the deployed spacing, clipped compact heading, reversed-feeling motion, generic privacy copy, and fixed-size mobile permission preview after reviewing screenshots.
    decided_at: "2026-08-04"
  - id: D-16
    status: active
    decision: Coordinated landing stories show a large icon-free heading first and mount the existing animation only after that heading has fully exited.
    reason: The user explicitly rejected category icons, small compact captions, static heading dwell, and any frame that shows heading text together with the product animation.
    decided_at: "2026-08-13"

