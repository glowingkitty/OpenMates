clarification:
  rounds:
    - question: What nesting policy should be enforced?
      answer: Enforce the intended maximum of children and grandchildren; grandchildren are never allowed to spawn further sub-chats.
    - question: What aggregate breadth limit applies across the root tree?
      answer: Three automatic descendants and twenty after explicit approval.
    - question: What automatic cumulative credit budget applies?
      answer: Two thousand credits; higher ceilings require explicit approval.
    - question: How should billing present descendant usage?
      answer: One root summary with a detailed auditable tree of root, child, and grandchild operations.
    - question: What happens when child shells cannot all persist before dispatch?
      answer: Prepare the full batch atomically; dispatch none if preparation fails. Runtime provider failures may produce partial synthesis but never automatic replacement spawning.
  vision_summary: >
    Sub-chat safety must be enforced by immutable server state and atomic root
    counters, not inferred from model behavior or optional chat lookups. A bounded
    tree shares one financial envelope and one billing identity while retaining
    raw descendant operations for audit. Persistence failure before dispatch is
    all-or-nothing; runtime failures are reported without recursive replacement.
  approved_by_user: true

