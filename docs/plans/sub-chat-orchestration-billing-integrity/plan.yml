schema_version: 2
id: sub-chat-orchestration-billing-integrity
title: Sub-Chat Orchestration And Billing Integrity
status: implementing

goal: >
  Make sub-chat trees structurally bounded, durably attributable, financially
  contained, and auditable so one root turn cannot create a cascading wave of
  descendants or fragmented billing entries. Billing must show one root chat
  total while preserving every descendant operation in its detail view.

scope:
  in:
    - Server-issued immutable root chat, root turn, and depth identity for every root, child, grandchild, continuation, AI call, and app-skill call.
    - Maximum depth of root -> child -> grandchild; grandchildren cannot spawn and continuations cannot spawn.
    - One cumulative descendant allowance per root turn: 3 automatic and 20 after explicit user approval, including parallel and sequential work.
    - One cumulative root credit budget: 2,000 automatic credits and an explicitly approved higher ceiling for expanded trees.
    - Atomic budget reservation and descendant-count checks before every AI, provider, app-skill, or child dispatch.
    - Atomic encrypted-safe child-shell and orchestration-ledger preparation before billable child dispatch.
    - Idempotent personal and team credit charges, including concurrent retries.
    - Root-attributed usage summaries, details, exports, chat totals, and deleted-root behavior across root, child, and grandchild operations.
    - Deterministic backfill only where historical root attribution is provable; preserve unmatched legacy rows without guessing.
    - Auditable reconciliation of the affected dev test account after implementation verification, without deleting forensic usage rows.
    - REST/WebSocket, CLI, npm SDK, pip SDK, web, visual-smoke, user-confirmation, and Apple parity gates.
  out:
    - Further focus-mode routing, activation, rendering, or persistence work.
    - More than two descendant levels.
    - Automatic replacement batches after a child fails.
    - Hiding or deleting raw billing operations.
    - Guessing historical ancestry where no deterministic evidence exists.
    - Production account reconciliation or destructive usage-history changes.

