implementation_notes:
  plan_path: docs/plans/sub-chat-orchestration-billing-integrity/plan.yml
  architecture: >
    Add a dedicated internal Directus extension named
    sub-chat-orchestration-transaction, following the authenticated transactional
    pattern of chat-recovery-transaction. PostgreSQL-backed orchestration and
    charge ledgers are authoritative; Redis is projection/notification only.
    Transaction operations atomically prepare a complete child batch, reserve
    root descendant slots and credit estimates, settle actual cost, transition
    terminal state, and claim stable charge identities. Personal billing uses an
    encrypted-balance compare-and-swap inside the same database transaction as
    charge-ledger and raw-usage insertion; cache updates happen only after commit
    and heal from Directus after cache failure. Existing usage APIs gain additive
    hierarchy fields and root-attributed rollups.
  existing_patterns:
    - Existing chat-turn preflight and inference-outbox uniqueness constraints for durable lifecycle identity.
    - Existing team billing event_id handling as a partial idempotency reference.
    - Existing zero-knowledge child-key reuse and encrypted client persistence contract.
    - Existing usage raw rows plus monthly/daily rollups and SDK billing facades.
  data_flow:
    - A root turn such as root_chat_id=root-1 and root_turn_id=turn-1 creates orchestration orch-1 with depth 0, max_depth 2, descendant_limit 3, and credit_limit 2000.
    - A proposed two-child batch calls prepare_batch once; the transaction reserves two root slots, creates two minimal child records plus child ledger rows, and returns a stable dispatch token only after every write succeeds.
    - Each child request carries orch-1, root-1, turn-1, immutable depth 1, and its dispatch token. One explicitly authorized child may prepare depth-2 grandchildren; depth-2 and continuation requests are rejected transactionally.
    - Before each AI iteration or app skill, reserve_operation claims a stable operation_id and reserves a conservative credit quote under orch-1. Duplicate reservations return the existing state.
    - AI reservation uses known input tokens plus configured maximum output tokens and current provider pricing for that iteration. App skills reserve their deterministic quote or configured maximum before provider dispatch.
    - settle_operation records actual credits, releases unused reservation, and invokes idempotent billing settlement. Failure/cancellation releases unspent reservation exactly once.
    - Personal billing passes expected encrypted balance ciphertext and newly encrypted balance ciphertext to the transaction; a compare-and-swap, charge ledger, raw usage row, and root rollup update commit together. A stale ciphertext retries from the current committed state.
    - Team billing reuses its event-id ledger but adopts the same operation_id, root attribution, and settlement result contract.
    - Usage APIs query root-attributed monthly/daily rollups and raw rows. actual_chat_id remains available in details/export while root_chat_id is the summary identifier.
  affected_files:
    - path: backend/apps/ai/sub_chat_orchestration.py
      reason: Enforce immutable depth, root counters, atomic preparation, and dispatch guards.
    - path: backend/apps/ai/processing/main_processor.py
      reason: Gate tool exposure and provider/skill dispatch from the server envelope.
    - path: backend/apps/ai/tasks/stream_consumer.py
      reason: Preserve root identity and settle terminal orchestration state.
    - path: backend/core/api/app/routes/internal_api.py
      reason: Require and enforce idempotent charge identity and root attribution.
    - path: backend/core/api/app/services/billing_service.py
      reason: Replace cache-first deduction with transactional encrypted-balance compare-and-swap, then refresh cache after commit.
    - path: backend/core/api/app/services/sub_chat_orchestration_service.py
      reason: Provide the typed internal client and safe operation allow-list for the transaction extension.
    - path: backend/core/directus/extensions/sub-chat-orchestration-transaction/src/index.js
      reason: Own atomic batch, reservation, settlement, idempotent charge, and terminal-state transactions.
    - path: backend/core/directus/migrations
      reason: Add orchestration, child, operation, charge identity, hierarchy usage fields, uniqueness constraints, and deterministic backfill support.
    - path: backend/core/api/app/services/directus/usage.py
      reason: Aggregate summaries and details by immutable root identity.
    - path: backend/core/api/app/routes/settings.py
      reason: Return root totals and hierarchy details through existing usage APIs.
    - path: frontend/packages/ui/src/components/settings/SettingsUsage.svelte
      reason: Render one root summary and auditable descendant rows.
    - path: frontend/packages/openmates-cli
      reason: Display root-level approvals and verify root usage totals.
    - path: packages/openmates-python/openmates/sdk.py
      reason: Preserve pip SDK parity for hierarchy usage fields.
    - path: apple/OpenMates/Sources/Features/Settings/Views/SettingsBillingView.swift
      reason: Render shared root usage and approval contracts after web confirmation.
  verification_strategy:
    - Record deterministic red tests for cascade, persistence failure, concurrency, idempotency, and aggregation before implementation.
    - Prove direct authenticated dev API and WebSocket rejection, budget, privacy, and hierarchy contracts first.
    - Prove real CLI, npm SDK, and pip SDK behavior against the dev server before web.
    - Deploy before strengthened Playwright and reviewed billing visual smoke.
    - Obtain user confirmation before Apple parity and reconcile the dev account only after all gates pass.
  verification_order:
    - deterministic backend red and green tests
    - direct dev API and WebSocket contract
    - real CLI contract
    - npm SDK and pip SDK parity
    - deployed web Playwright
    - reviewed laptop and mobile visual smoke
    - user confirmation
    - Apple parity
    - dev-only auditable reconciliation
  required_slices:
    - immutable orchestration identity and atomic root limits
    - atomic encrypted-safe child preparation and terminal lifecycle
    - idempotent budget reservation, charge settlement, and team parity
    - root usage attribution, schema migration, backfill, and API compatibility
    - CLI and SDK parity
    - web billing hierarchy and strengthened real sub-chat verification
    - Apple parity after user confirmation
  transaction_operations:
    - create_root
    - approve_root_limits
    - prepare_batch
    - reserve_operation
    - settle_operation
    - fail_operation
    - transition_child
    - transition_root
    - get_root_state
    - cleanup_expired_reservations
  schema_changes:
    - sub_chat_orchestrations stores immutable owner/team hash, root identities, limits, counters, approval, status, and version.
    - sub_chat_orchestration_children stores unique child chat identity, direct parent, depth, dispatch token, and lifecycle state.
    - sub_chat_orchestration_operations stores unique operation_id, quote, reservation, actual credits, phase, app/skill, and settlement state.
    - billing_charge_identities stores unique charge_id, billing subject, encrypted balance before/after references, raw usage id, and committed result.
    - usage gains additive root_chat_id, actual_chat_id, root_turn_id, orchestration_id, depth, charge_id, and operation_id fields with indexes.
    - monthly/daily chat summary uniqueness and aggregation move from actual chat id to root chat id for new attributed rows.
  migration_backfill_rollout:
    - Add nullable fields, new ledgers, extension operations, and indexes before changing writers.
    - Deploy dual-write attribution while existing readers continue using chat_id; audit root totals versus raw sums with no UI change.
    - Run a dry-run backfill that maps ancestry only from surviving chat chains, orchestration evidence, or an operator-supplied sanitized incident mapping; emit unmatched counts and never mutate raw credits.
    - Enable root-attributed API reads behind a sparse feature flag after parity audit and rollback proof.
    - Update CLI and SDK readers, then web, visual smoke, user confirmation, and Apple.
    - Keep old chat_id fields through at least one alpha train; rollback switches readers to legacy summaries without deleting new ledgers.
    - Reconcile the dev account only after the new root totals and raw sums are independently verified.
  observability:
    - Structured events for root_created, batch_prepared, reservation_rejected, operation_reserved, operation_settled, duplicate_charge_replayed, root_terminal, and reservation_expired.
    - Metrics for active roots, descendants per root, reserved versus spent credits, rejected depth/count/budget attempts, orphan-prevention failures, duplicate charge retries, and unmatched legacy usage.
    - Alerts when a root exceeds three automatic descendants, approaches 80 percent of budget, remains non-terminal past TTL, or has charged work without a durable child/lifecycle row.
    - Logs include bounded orchestration, root, operation, and charge identifiers but no prompts, summaries, chat keys, credentials, or decrypted content.
  acceptance_criteria_mapping:
    AC-1: [T-UNIT-ORCHESTRATION, T-API-WEBSOCKET]
    AC-2: [T-UNIT-ORCHESTRATION, T-API-WEBSOCKET]
    AC-3: [T-API-WEBSOCKET, T-CLI-REAL, T-E2E-SUB-CHAT, V-APPLE]
    AC-4: [T-UNIT-PERSISTENCE, T-API-WEBSOCKET]
    AC-5: [T-UNIT-ORCHESTRATION, T-E2E-SUB-CHAT]
    AC-6: [T-UNIT-BILLING-IDEMPOTENCY, T-API-USAGE]
    AC-7: [T-API-USAGE, T-CLI-REAL, T-SDK-NPM, T-SDK-PIP, T-E2E-USAGE, V-APPLE]
    AC-8: [T-UNIT-USAGE-AGGREGATION, T-E2E-USAGE, V-MIGRATION-DRY-RUN]
    AC-9: [T-API-WEBSOCKET, T-CLI-REAL, T-E2E-SUB-CHAT, V-UI-VISUAL-SMOKE]
    AC-10: [V-DEV-RECONCILIATION]
  demonstration_plan:
    capture_source: Passing deployed Playwright recordings from T-E2E-SUB-CHAT and T-E2E-USAGE.
    caption_renderer: Existing create-demo-video caption pipeline after all normal green gates.
    privacy_scan: Deterministically scan transcript, captions, filenames, metadata, and publication text before frame review.
    frame_sampling: Three-second intervals plus action, state-change, approval, terminal, and billing-detail boundaries; full video never enters model context.
    retention: Keep the sanitized manifest, captions, hashes, and bounded review frames with spec evidence; retain raw CI recording under existing artifact policy.
    delivery: Attempt Discord dev-smoke publication only after review passes; publication_pending does not invalidate review evidence.
  technical_approval:
    required: true
    reason: The new transaction extension, encrypted-balance compare-and-swap, schema migration, and dual-read rollout are material architecture and billing decisions beyond the approved product behavior.

