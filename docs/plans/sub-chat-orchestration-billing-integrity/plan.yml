scenarios:
  - id: S-1
    title: Automatic root tree remains bounded
    given:
      - Alice starts one root chat turn with no expanded-tree approval.
      - The server issues a root orchestration envelope with depth 0, descendant allowance 3, and credit ceiling 2,000.
    when:
      - The root and its descendants request sub-chats concurrently or sequentially.
    then:
      - At most three cumulative descendants are reserved and dispatched.
      - A child may create an explicitly authorized grandchild only while root allowance remains.
      - Grandchildren and every continuation are rejected before dispatch if they request start_sub_chats.
      - No race can exceed the root count or credit ceiling.
  - id: S-2
    title: Expanded tree requires root-level count and cost approval
    given:
      - A proposed tree needs more than three descendants or more than 2,000 credits.
    when:
      - The server requests approval.
    then:
      - Web, CLI, and Apple show the proposed cumulative descendant count and maximum credit ceiling.
      - Approval can raise the root allowance to at most twenty descendants and to the explicitly displayed credit ceiling.
      - Approval is consumed once for the root tree; descendants and continuations cannot obtain separate allowances.
      - Cancellation dispatches no unapproved work.
  - id: S-3
    title: Child preparation is atomic and encrypted-safe
    given:
      - A root proposes three child shells.
    when:
      - Any child shell or orchestration-ledger write fails validation or persistence.
    then:
      - No child task is dispatched and no child provider or skill charge occurs.
      - Prepared records are rolled back or durably marked aborted without plaintext prompts or titles.
      - The parent receives a visible retryable batch failure.
      - Success is logged only after the complete batch is verified.
  - id: S-4
    title: Runtime child failures do not create replacement cascades
    given:
      - Three prepared children are already running.
    when:
      - One child encounters provider throttling, billing rejection, cancellation, or another terminal failure.
    then:
      - Successful children may finish and the parent may synthesize their reports with the failure disclosed.
      - The failed child does not automatically create a replacement batch.
      - Root counters and actual spend settle once and terminal root state becomes observable.
  - id: S-5
    title: Retries charge exactly once
    given:
      - One AI or app-skill billing operation has a stable charge identity.
    when:
      - The caller, worker, or network retries the same charge concurrently or after timeout.
    then:
      - The balance is deducted once, one raw usage row exists, and every retry returns the original result.
      - A different operation in the same message retains a different charge identity.
      - Personal and team billing enforce equivalent idempotency semantics.
  - id: S-6
    title: Billing groups the complete tree under the root
    given:
      - A root, two children, and one grandchild create AI and app-skill usage.
    when:
      - Alice opens usage summaries, daily overview, chat total, details, or export.
    then:
      - Exactly one top-level root chat entry contains the sum of every descendant operation.
      - Detail rows identify root/child/grandchild depth, actual chat, app/skill/model, charge identity, and credits.
      - No descendant appears as a separate top-level Deleted chat entry.
      - API, CLI, npm SDK, pip SDK, web, and Apple return the same total and row identities.
  - id: S-7
    title: Deleted roots and legacy rows remain auditable
    given:
      - A billed root chat is later deleted or historical descendants lack chat records.
    when:
      - Alice views or exports usage.
    then:
      - A deleted root appears once with its complete attributable tree total.
      - Deterministically attributable historical rows are backfilled without changing credits or raw operation identity.
      - Unprovable rows remain explicitly unmatched legacy usage rather than being guessed or hidden.
  - id: S-8
    title: Real nested flow terminates and becomes idle
    given:
      - A controlled dev account starts a root request that creates children and one authorized grandchild.
    when:
      - The tree completes through the real WebSocket, worker, provider, persistence, and billing paths.
    then:
      - The final parent synthesis is visible and non-error.
      - Child and grandchild summaries are visible after reload.
      - Typing and stop controls become idle and no new descendant or charge appears during a bounded quiet window.
      - Charged chat ids have durable records or an explicit terminal lifecycle record.
  - id: S-9
    title: Affected dev account is reconciled audibly
    given:
      - All implementation and verification gates pass.
      - The forensic incident rows remain preserved.
    when:
      - An operator performs the approved dev-only reconciliation.
    then:
      - Legitimate root/direct work and runaway descendant charges are calculated from immutable evidence.
      - The erroneous amount is restored through an auditable adjustment entry.
      - No raw usage row is deleted or rewritten.

