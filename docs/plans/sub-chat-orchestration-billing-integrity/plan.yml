contracts:
  orchestration:
    root_envelope:
      required_fields: [root_chat_id, root_turn_id, orchestration_id, depth, max_depth, descendant_limit, descendant_reserved, credit_limit, credit_reserved, credit_spent, approval_state]
      invariants:
        - root_chat_id, root_turn_id, orchestration_id, and depth are server-issued and immutable.
        - depth is 0 for root, 1 for child, and 2 for grandchild; no other value can dispatch.
        - is_sub_chat_continuation always disables start_sub_chats regardless of depth.
        - descendant reservations and budget reservations are atomic and idempotent.
        - sequential queues consume the same cumulative root allowance as parallel batches.
        - terminal orchestration state includes completed, partial, failed, cancelled, budget_exhausted, and limit_exhausted.
    automatic_limits:
      max_descendants: 3
      max_credits: 2000
      max_depth: 2
    approved_limits:
      max_descendants: 20
      credit_limit: explicitly displayed and approved
      max_depth: 2
  persistence:
    - Child preparation stores only encrypted-safe metadata; no plaintext prompt, title, summary, or user content is added to Directus.
    - The complete batch and root ledger are verified before any child dispatch.
    - Partial preparation failure dispatches zero children and produces an explicit parent error.
    - Charged work always has a durable chat record or an explicit orchestration lifecycle record.
  billing:
    - Every operation has a stable unique charge_id and immutable root_chat_id, root_turn_id, actual_chat_id, depth, orchestration_id, app_id, skill_id, and phase.
    - Charge retries with the same charge_id return the original result and never deduct or create usage twice.
    - A root reservation is checked before dispatch and settled with actual credits idempotently after completion; unused reservation is released.
    - Root summaries sum raw attributable rows exactly; raw rows remain immutable.
    - Personal and team billing use equivalent root attribution and idempotency behavior.
  api:
    - surface: Existing authenticated chat WebSocket sub-chat lifecycle
      access_model: first-party client surface only
      auth: Authenticated user/device with owned or authorized team chat context.
      owner_team_scope: Root and every descendant must share the authorized owner/team scope.
      rate_limits: Existing chat limits plus root descendant and credit limits.
      credit_budget: Three automatic descendants, twenty approved, 2,000 automatic credits, explicit higher ceiling.
      encryption: Transports orchestration ids, counts, budgets, and encrypted-safe child metadata; no chat key or decrypted private chat content is persisted server-side.
    - surface: /internal/billing/charge and /internal/billing/team/charge
      access_model: internal-only
      auth: Internal service authentication only.
      owner_team_scope: Charge identity binds the authenticated billing subject and immutable root envelope.
      rate_limits: Internal service controls plus idempotency and root reservation enforcement.
      credit_budget: Charge cannot settle beyond the reserved root ceiling.
      encryption: Usage metadata contains identifiers and costs, not decrypted chat content or keys.
    - surface: Existing /v1/usage and /v1/sdk/billing usage endpoints
      access_model: developer API-key REST API and first-party session clients
      auth: Session or approved API key scoped to the authenticated user's or team's own usage.
      owner_team_scope: Cross-user and cross-team root ids return 403 or no records.
      rate_limits: Existing 30/minute detail and 60/minute total limits remain unless measured evidence requires change.
      credit_budget: Read-only; returns enforced limits, reservations, actual totals, and hierarchy attribution.
      encryption: Returns usage metadata and existing encrypted chat metadata only; never returns decrypted chat content or keys.
  billing_ui:
    - One top-level row per root chat and period with the complete attributable total.
    - Detail rows expose root, child, or grandchild labels and operation metadata without revealing plaintext prompts.
    - Deleted roots appear once; descendants do not create separate Deleted chat summaries.
    - CSV and SDK output preserve root_chat_id and actual_chat_id.
  privacy_security:
    - Never store plaintext child prompts, titles, summaries, share keys, chat keys, or private report content in orchestration or usage records.
    - Logs may contain bounded identifiers for correlation but never plaintext user content or credentials.
    - Migration and reconciliation preserve immutable forensic rows and create auditable adjustment records.

