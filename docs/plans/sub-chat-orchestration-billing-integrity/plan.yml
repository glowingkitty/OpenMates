risks:
  - A Redis-only counter can be lost or split-brain across retries; plan must define durable recovery and atomic reservation semantics.
  - Reserving too little before provider calls can overshoot the root budget; reservation estimates and settlement must fail closed.
  - A schema migration that rewrites raw usage rows can damage forensic integrity; raw operation rows must remain immutable.
  - SDK/API response changes can break existing clients; additive compatibility and versioned fields require explicit plan coverage.
  - Partial child creation rollback can race client sync; the ledger must expose prepared, dispatched, aborted, and terminal states.
  - Team and personal billing implementations differ; idempotency and attribution must be proven on both paths.
  - Strengthened E2E may expose provider or account instability; tests must use exact created root ids and never accept generic assistant attachment as completion.

open_questions:
  - Which durable store and transaction boundary will provide atomic root count/budget reservations and recovery?
  - What conservative per-operation reservation estimate prevents credit overshoot before actual provider usage is known?
  - Which additive response fields preserve compatibility for existing usage API, CLI, npm SDK, pip SDK, web, and Apple clients?
  - How will deterministically attributable historical rows be backfilled when the original child chat record is absent?
