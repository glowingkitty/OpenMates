  eligibility:
    status: required
    surface: visual
    reason: Users must see bounded approval, completed nested summaries, one root billing total, and auditable descendant details.
    classified_at: "2026-08-07T11:41:27Z"
  narration_outline:
    - id: NARR-1
      purpose: Show a bounded root tree completing without cascade.
      expected_proof: Exactly two children and one authorized grandchild complete, the parent synthesizes, and processing becomes idle.
      scenario_ids: [S-1, S-8]
      acceptance_criteria: [AC-1, AC-2, AC-9]
    - id: NARR-2
      purpose: Show expanded-tree count and cost approval.
      expected_proof: The approval UI displays cumulative descendants and the maximum credit ceiling before any extra work starts.
      scenario_ids: [S-2]
      acceptance_criteria: [AC-3]
    - id: NARR-3
      purpose: Show one auditable root billing entry.
      expected_proof: Billing lists one root total and its detail view contains root, child, and grandchild operation rows whose credits sum exactly.
      scenario_ids: [S-5, S-6, S-7]
