decisions:
  - id: D-1
    status: active
    decision: Trust only a server-issued immutable orchestration envelope for root identity, root turn, and depth.
    reason: Tool visibility and database ancestry lookups both failed open during the incident.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-2
    status: active
    decision: Allow children and grandchildren only; continuations and grandchildren cannot spawn.
    reason: This preserves intended bounded decomposition and makes recursive waves structurally impossible.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-3
    status: active
    decision: Apply 3 automatic and 20 approved descendants cumulatively across the root turn, including sequential queues.
    reason: Per-parent limits multiply across generations and do not bound total work.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-4
    status: active
    decision: Apply a 2,000-credit automatic root budget and require explicit approval for a higher displayed ceiling.
    reason: Count limits alone do not bound expensive AI and provider work.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-5
    status: active
    decision: Persist and verify the complete encrypted-safe child batch and orchestration ledger before dispatching any child.
    reason: Billable orphan work is unacceptable and breaks completion, sync, cancellation, and billing attribution.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-6
    status: active
    decision: Group summaries by root_chat_id while preserving actual_chat_id, depth, operation identity, and cost on raw rows and exports.
    reason: Users need one understandable total and a complete audit trail.
    decided_at: "2026-08-07T11:41:27Z"
  - id: D-7
    status: active
    decision: Backfill only deterministically provable ancestry and preserve unmatched legacy rows explicitly.
    reason: Incorrect billing attribution is worse than visibly unmatched legacy data.
    decided_at: "2026-08-07T11:41:27Z"

