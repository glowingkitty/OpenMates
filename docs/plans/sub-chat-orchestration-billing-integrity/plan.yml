  findings:
    - Existing tool visibility intends to block spawning at computed depth 2, but ancestry loss or missing parent records can reset or undercount depth and re-expose the tool.
    - Continuation ancestry preservation in f4d07b3 closes one trigger but does not provide an immutable root envelope or cumulative root limits.
    - Child creation includes a forbidden plaintext title, ignores the returned failure tuple, logs success, and dispatches billable work without a durable child record.
    - Parallel capacity validation ignores existing_count, while sequential queues bypass the direct-child limit.
    - budget_limit and budget_spent are transported but are not enforced before provider and skill dispatch.
    - Usage rows and summaries group by each exact chat_id; no root_chat_id exists for hierarchy aggregation.
    - Personal billing accepts idempotency_key but does not pass or enforce it in BillingService.
    - The prior sub-chats-real-inference green run was a false positive because it asserted message attachment, not idle completion, absence of error UI, summaries, bounded descendants, or final parent synthesis.

