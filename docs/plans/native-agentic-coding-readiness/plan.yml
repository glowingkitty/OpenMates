multi_chat_design:
  status: direction_accepted_U9_with_encryption_constraint_U10
  user_visible_behavior:
  - Read and plan in parallel. Same-file commits take brief turns; show a waiting indication when
    needed, followed by applied, refreshed, or blocked status. No user decision for ordinary contention.
  - A successful change can record originating chat and operation for authorized attribution, but a
    competing writer does not gain access to another private chat's title, transcript, or instructions.
  - Overlapping code changes can require a material choice even if a textual patch can apply. Never
    treat other-chat content or change metadata as authority to override this chat's user request.
  accepted_enforcement_direction:
  - Hosted files use an atomic expected-revision update of encrypted content and consistent version/diff
    history. Authorized clients verify/decrypt the base, apply patches, and encrypt the new snapshot and
    history; the server checks scoped identity and opaque revision/version only. It receives no new
    file plaintext, plaintext content hashes, or decryption authority via this protocol. All supported
    writers to the same object, including existing edit/restore paths, must obey this boundary.
  - Remote writes use a host-wide coordinator shared by bridge processes. Coordinate by the underlying
    local target after path/access validation, not by chat, Project link, source session, or process alone.
    Overlapping roots and aliases must not bypass coordination; unsupported shared-filesystem or alias
    cases must fail explicitly rather than claim protection that is unavailable.
  - Acquire only for final revalidation and mutation, never for model thinking, network approval waits,
    or a whole chat. Use bounded fair waiting and release on failure/process exit; prevent stale owners
    from later committing after takeover. Reads must not observe an in-progress partial write.
  - Carry an operation identity and a recoverable result/journal so a lost response or reconnect does
    not double-apply a write. Preserve preimages; recovery and undo must not overwrite later changes.
  - Keep content/version validation and scheduling deterministic; the main agent adapts rejected edits.
    No extra Jev decision is needed to grant a write turn or establish file freshness.
  limits_and_followups:
  - Host-wide coordination protects participating OpenMates writers, not arbitrary editors or shell
    commands. Revalidate near mutation and preserve recoverable preimages, but do not describe a hash
    check plus rename as universal atomic compare-and-swap against external processes.
  - Same-file safety does not provide an isolated workspace. Chats see shared direct edits; different
    files can still conflict semantically and checks can become stale after another chat writes. Bind
    eventual verification evidence to the files/revisions tested; detailed validation belongs to its
    later design step, not a claim that file hashes prove correctness.
  - Multi-file change grouping, all-or-nothing guarantees, crash recovery, conflict-aware undo, and exact
    retry/wait limits need further design. Do not imply a remote multi-file
    transaction or silently roll back already applied files over another writer's changes.
hosted_encryption_boundary:
  accepted:
  - File snapshots, diffs, undo/history, private paths, and content fingerprints remain encrypted or in
    their existing authorized local/transient contexts. Coordination does not introduce key escrow,
    server-readable wrappers, independent storage decryption, or plaintext recovery jobs/logs.
  - Server revision arbitration operates on scoped object identity and version/opaque revision metadata;
    it cannot establish plaintext patch correctness. The authorized client performs that validation.
  - Existing user-authorized transient AI context remains distinct from decrypting stored ciphertext by
    itself. Earlier chat context does not grant keys or fresh file access, and this work must not silently
    widen that inference boundary.
  accepted_executor_wait:
  - Pause only the work requiring unavailable authorized client-side execution; retain no exclusive write
    turn while waiting. Do not treat disconnect as authorization loss or as automatic write approval.
  - Before twenty minutes, reconnect may trigger reconciliation and safe recovery within the original
    request. Revalidate focus, role, current write policy, file base, and needed concrete approval. Skip
    if canceled, no longer authorized, or expired. At/after twenty minutes explicit chat resume is required.
  - An already-submitted encrypted commit may complete without a connected client. Distinguish that from
    new decryption/patch/encryption work which has no available executor, and avoid a false pending or
    success report when the actual commit outcome is unknown.
  later_detail:
  - Define executor selection and capability advertisement using existing first-party/CLI authenticated
    connections; do not turn every logged-in device into an implicit background worker.
  - Define encrypted pending-operation persistence and reconnect behavior; no plaintext persistence as a
    shortcut when a client disappears before preparing a safely encrypted continuation.
executor_wait_policy:
  authority: U11
  timing:
    reminder_after_seconds: 600
    require_explicit_resume_after_seconds: 1200
  implementation_direction:
  - Persist waiting start and absolute reminder/expiry times with an episode/generation identity tied to
    the chat run. Schedule backend events; deadlines and readiness checks are deterministic, without Jev
    or repeated model calls. Multiple blocked files share the interruption's reminder.
  - Send one generic localized email through the existing eligible notification channel at ten minutes,
    only if the episode is still waiting and not expired. Recheck state and preferences before dispatch;
    deduplicate transport intent and record actual skipped/failed/unknown outcomes honestly.
  - No private titles, paths, code, diffs, keys, or decryption-bearing links in email or its logs. Link
    opens the chat after normal authorization; opening it does not resume the run.
  - At twenty minutes latch paused_requires_explicit_resume for this run and fence automatic continuation
    from reconnect, scheduler retries, and old claims. Check the deadline on resume even if the timeout
    worker ran late; delivery failure or service restart never extends it.
  - Connection flapping without resumed file progress does not reset the episode. Explicit resume starts
    a fresh attempt/episode if needed, rechecking all guards and reconciling earlier committed work.
implementation_start:
  prerequisites: File-writing direction was sufficient to start. U14 subsequently requests five new
    search/terminal rounds before continuing integration; this does not revoke earlier decisions.
  first_slice: Shared typed create/update proposal and result contract, current Project-focus/write-policy
    authorization, immutable operation identities, expected-base guards, and remote/hosted integration seams.
  following_slices:
  - Remote CLI coordinated file creates/updates with current-base checks, recoverable local history, and
    focused product evidence for actual chat writes.
  - Hosted client-side patch/encryption with atomic encrypted head/history publication and all existing
    writers using the same revision boundary; actual CLI/chat read-write evidence.
  - Authorized executor readiness and encrypted reconnect handling with the ten-minute private reminder,
    twenty-minute manual-resume cutoff, and meaningful coverage for duplicate/stale events.
  - Required setup write-policy choice and shared CLI/web/native Project settings integrated with the gate.
  boundaries:
  - Preserve the overall P1 through P4 sequence. Completing one slice does not claim all Project editing,
    web browsing, Tasks, Plans, or Specifications work is finished.
  - Track outcomes and verification in this same plan, with only necessary code-level decisions escalated.
search_terminal_clarification:
  authority: U14
  status: accepted
  rounds_total: 5
  rounds_answered: 5
  rounds:
  - id: S1
    topic: Search access to ordinary source and configuration
    question: With Project access active, should filename/content search automatically include ordinary
      source and configuration, including package.json, Dockerfile, and authentication code, while
      known credential files remain excluded unless separately authorized?
    recommendation: Yes. Separate read/search restrictions from write/command restrictions. Offer
      dedicated filename glob and literal/regex content search, bounded results, and no per-search
      prompt inside existing access. A model may choose useful queries; deterministic code enforces
      access, limits, and secret-path exclusions. This does not itself grant terminal execution.
    example: Find package.json and src/**/auth*.ts, then find uses of refreshToken with relative paths
      and line numbers. package.json, Dockerfile, and src/auth/session.ts are searchable; .env,
      private key files, and credential stores remain excluded by default.
    status: resolved
    answer: User chose a dedicated file-search product skill with no per-call approval and proposed
      separate confirmed remote Code Run commands with independent LLM explanations. This resolves
      the search-versus-terminal approval boundary; it does not grant whole-machine search or silently
      waive existing Project access. Detailed ordinary-file/credential patterns remain to be specified.
  - id: S2
    topic: Remote command filesystem scope
    question: Should an approved terminal command be confined to the Project and explicitly allowed
      build/cache folders, or be allowed to use the full remote machine?
    recommendation: Confine execution by default with OS enforcement, while allowing required toolchain
      reads and approved temporary/cache paths. Show any requested additional resource access in the
      same command approval. A working directory alone is not confinement. Do not silently fall back
      to unrestricted execution if the declared isolation is unavailable.
    example: npm test may use the Project, its test output and approved caches. Another Project and
      ~/.ssh remain inaccessible by default; a build needing /opt/shared-sdk must declare that extra
      read access for review. The command still requires the user's Run once confirmation.
    status: resolved
    answer: Accepted Project confinement and the command-review approach. User selected latest Gemini
      Flash-Lite for explanations and requested selectable repository-stored command allowlists.
  - id: S3
    topic: Effect of selecting a command allowlist
    question: Should explicitly enabling an allowlist preapprove its matching commands, or should even
      listed commands continue to require confirmation every time?
    recommendation: Keep Ask first as the default. Let users explicitly enable a narrow Project command
      preset as a standing approval, with matching executions retaining explanation and all deterministic
      guards. Other eligible commands still ask; explicit denials remain denied. This is a proposed
      opt-in exception to U17 accepted by U20; broader permissions remain subject to explicit user action.
    example: A user enables a Checks list containing exact npm test and npm run lint invocations at the
      Project root. They then run without repeated prompts, while npm install still asks. The alternative
      is a restrictive list where both test/lint also ask and unlisted commands are unavailable until
      separately authorized. Both choices retain Project confinement and current focus requirements.
    status: resolved
    answer: Accepted. Explicitly enabling a narrow command list preapproves matching executions; other
      eligible commands still ask. Model explanations and deterministic guards remain required.
  - id: S4
    topic: Reusable network and credential access for commands
    question: Should commands start without network or credentials, with users able to enable reusable
      Project access profiles for specific destinations and selected credentials?
    recommendation: Yes. Define bounded named access profiles and let the user activate them once for
      the Project. Include any newly requested access in the same command confirmation rather than
      layering routine prompts. Command preapproval alone grants neither network nor credentials.
      New destinations or credentials require explicit expansion; secrets are supplied by the authorized
      executor without exposing their values to the explanation model or ordinary server persistence.
    example: Checks runs npm test offline with no credentials; Packages lets npm install contact the
      approved npm registry without personal tokens; Staging tests lets npm run integration contact
      api.staging.example using only the selected TEST_API_TOKEN. A command still asks unless separately
      preapproved; existing access profiles remove repeated network/credential prompts.
    status: resolved
    answer: Accepted reusable Project network/credential profiles with both disabled by default and
      explicit activation. Keep credential values local to authorized execution and outside review context.
  - id: S5
    topic: Managed command jobs and their lifetime
    question: Should commands run as managed jobs with status, bounded logs and Stop, including explicit
      background mode for builds/dev servers so the chat can continue other work?
    recommendation: Yes. Record each execution and its approved lifetime/mode; show status, logs and Stop.
      Browser closure alone need not end an approved job while its authorized CLI remains available.
      Stop or loss of authorization terminates the owned process tree when reachable; lost executors
      produce an honest interrupted/unknown state until reconciliation, never a blind duplicate launch.
      Commands that may change source must coordinate against overlapping edits; background dev servers
      use read-only source with explicitly writable caches/output so they do not reserve source indefinitely.
    example: A build card shows Running, elapsed time, logs and Stop while the chat reviews other files.
      A dev server can remain as an explicitly approved background job with a visible time limit and
      writable cache/output folders. A formatter writing src cannot run concurrently with another chat's
      edit commit to the overlapping scope. Remote disconnect does not turn an unknown exit into success.
    status: resolved
    answer: U23 accepts the refined async-skill flow, wait/continue choice and checked output batches;
      proceed with implementation using the preceding managed-job and authorization constraints.
    clarification: U22 asks for the existing skill waiting/continuation contract and safe terminal-output
      buffering/scanning before deciding. This is part of round 5, not an additional question round.
  later_round_topics_provisional: []
  command_job_recommendation:
    status: Accepted in U23 with the refined shared async and output-safety flow
    lifecycle: Reuse Code Run execution IDs, status/output stream and authenticated cancellation surfaces,
      extending them with remote source/host-session identity, approved foreground/background mode,
      deadline, process-tree ownership and durable outcome reconciliation. No unbounded detached daemon.
    authorization: Revocation prevents new launches immediately at the authorization boundary. Reachable
      executors stop revoked jobs; disconnected hosts need a bounded local authorization lease so work
      cannot continue indefinitely. Do not claim a remote process stopped without evidence. Parent exit,
      timeout and cancellation must clean up descendants within the supported sandbox boundary.
    concurrency: Match declared writable scopes using runtime-enforced filesystem access, not an LLM
      guess about a command name. Acquire coordination against overlapping Project file commits only
      for actual execution, never while explaining or awaiting approval. A command with unrestricted
      writes inside the Project needs a Project-wide mutation turn. Source-read-only background jobs
      with separate writable caches/output avoid blocking source edits. Cross-source aliases of the
      same host files must retain shared coordination. External editors remain outside this guarantee.
    evidence: A test/build can read live files while other work continues; successful exit is not proof
      of a coherent latest Project revision. Record the relevant observed versions and mark results
      stale/uncertain when inputs change rather than claiming snapshot isolation. Reconnection checks
      the prior execution outcome before any retry, preserving independent user-approved grants.
    boundaries: Existing ten-minute reminder and twenty-minute manual-resume cutoff govern waiting for
      an unavailable executor, not a blanket command runtime limit. Command limits/mode are visible in
      their own approval or selected preset. Interactive terminal sessions and public preview tunnels
      are not implicitly included by managed background process support.
  terminal_async_and_output_review:
    status: U22 research and refinement of S5 accepted in U23
    current_output_behavior:
    - backend/shared/providers/e2b_code_runner.py applies limited secret-pattern redaction and caps
      combined output at 100000 characters. backend/apps/code/tasks/run_code_task.py appends events
      to execution state and publishes them; the authenticated stream route forwards snapshots/events.
      CodeEmbedFullscreen.svelte uses escaped text interpolation. This stream has no semantic scan or
      complete terminal-control normalization before publication.
    - Initial Code Run tool responses pass the central skill output sanitizer, but contain processing
      metadata rather than later stdout. The asynchronous completion result excludes stdout/stderr
      events and includes status, exit/duration and artifact/error metadata. A scan of the initial
      response cannot cover later output.
    - Later-turn output does reach inference. CodeEmbedFullscreen.persistRunOutput sends encrypted
      output plus a separate inference_payload via sendersCodeRunOutputs.ts. The websocket
      code_run_output_handlers.py path bounds the plaintext inference copy to 24000 characters and
      vault-encrypts it in a three-day cache. EmbedService appends it as a TOON block when resolving
      the embed on later turns. No shared ASCII/semantic scan was found in this cache write/read path.
      Thus the initial dispatch scan and metadata-only callback do not cover cached terminal output.
      The ciphertext payload does not establish that its separate inference copy is safe or identical.
    - The shared app-skill scanner selects fields and lengths, uses bounded units with neighboring
      context, and marks technical failures unscanned while returning cleaned input. Terminal output
      needs explicit required-text coverage including short lines and errors, rather than provider
      inference or default field heuristics. Scanner uncertainty remains distinct from a failed scan;
      checked uncertain text still remains untrusted data, not a reason to claim safety or permission.
    current_async_behavior:
    - backend/apps/ai/processing/main_processor.py uses a static ASYNC_SKILLS set. Only selected
      social-media calls get the existing single-call inline wait of up to ten seconds. Code Run and
      other listed skills become background jobs by orchestration policy; their schemas have no
      model-selectable wait/background argument.
    - backend/apps/code/skills/run_code_skill.py returns processing plus execution/task identifiers.
      backend/apps/code/tasks/run_code_task.py dispatches completion into the generic
      backend/apps/ai/tasks/async_skill_continuation.py path. It re-enters the originating chat on
      completion; this callback is not confirmed for every skill in the static async set.
    - start_sub_chats exposes wait_for_completion and each/all report triggers. That is the current
      explicit model choice the user recalls; sub-chat orchestration is distinct from skill execution.
    proposed_wait_contract: Reuse the app-skill async lifecycle and completion events, with a model-selected
      wait-for-result versus continue-independent-work orchestration hint for terminal skills. Waiting
      suspends dependent chat work until a result event rather than occupying inference or polling with
      an LLM. Both modes execute asynchronously underneath. This choice is separate from permission,
      process background lifetime, and the choice of remote versus E2B executor.
    proposed_examples:
    - Run tests before declaring a fix complete; await their checked result through the completion event.
    - Run tests while drafting independent documentation; continue, then incorporate the checked result.
    - A dev server needs a verified readiness event rather than waiting for process exit; stdout saying
      ready is untrusted and cannot alone establish readiness or grant network access.
    proposed_output_flow:
    - Treat every stdout/stderr byte as untrusted external data even when the agent wrote the command.
      Preserve execution identity and sequence; apply output limits, secret redaction and deterministic
      control-character/ASCII-smuggling cleanup before model review or client display. Render logs as
      inert text; do not execute terminal escape actions, HTML, suggested commands or apparent permissions.
    - Short commands can scan their complete bounded output once. Long commands release bounded batches
      through the shared app-skill output-safety scanner, retaining source order and neighboring context
      to reduce split-message gaps. Bound queue size, bytes and scan cadence; avoid a model call per line,
      repeated scans of unchanged text, and scanning only a tail while claiming all output was reviewed.
    - Status/progress metadata can update live. Deliver checked text batches to the log surface and feed
      the coding model only relevant checked completion/checkpoint excerpts. Scanning logs does not
      require restarting the coding model for every batch. A summarizer must not bypass the same input
      safety boundary. A detected injection is redacted with an honest marker, preserving usable output.
    - Existing generic scan failure returns cleaned content with an unscanned status. Recommend a narrow
      stronger terminal-to-agent rule; keep unscanned text out of autonomous agent input, retain visible
      scan status and process state, and allow the job itself to continue. Do not mark it safe, rerun the
      command, or change all app-skill failure behavior as a side effect. This exception needs explicit
      Specification requirements; UI access to inert unreviewed logs is distinct from agent consumption.
    - Store durable remote logs only under the accepted client encryption boundary. Semantic scanning
      requires an authorized transient plaintext excerpt, never server decryption rights to stored logs.
      The independent Gemini command explainer remains separate from the existing output-safety model.
    continuation_guards: Bind output coverage and completion to the exact execution, originating chat/run
      and sequence. Apply the shared safety boundary to asynchronous completion payloads as well as the
      initial tool response and later code_run_outputs inference-cache hydration. Gate legacy unreviewed
      cache entries before model use; encryption or a client-supplied scan claim is not a scan receipt.
      Do not give the server Project keys to compare encrypted logs with an inference copy. Deduplicate
      result delivery and never resume canceled/expired runs from
      stale callbacks. Revalidate current authority and incorporate newer chat context before follow-up
      actions; scanned terminal text never becomes a source of permissions or system instructions.
  deferred_scope:
  - A new terminal attached to OpenMates-stored encrypted Projects is not implicitly authorized by the
    remote-target decision. Preserve existing E2B behavior while its Project/client connection remains
    to be designed; remote terminal rules must not grant server access to stored plaintext or keys.
  command_allowlist_recommendation:
    status: Core selection and activation semantics accepted in U20; detailed schema remains to implement.
    repository_path: .openmates/permissions.yml
    current_implementation: Reserved by the historical plan only; no product schema or loader exists yet.
    rationale: Existing remote-source design reserves this path for restrictions, warnings and suggested
      checks. Research found tool-specific JSON/TOML formats rather than a shared cross-tool standard.
    authority: The repository file contains reviewable definitions and suggestions. It cannot grant
      itself permissions through an agent edit, repository pull or branch change. User-approved active
      selections are recorded outside the command-writable Project in protected local control state;
      any synchronized Project settings/receipts preserve encryption. A changed rule cannot inherit an
      older broader grant. Users can revoke selections in Project settings without editing source.
    matching: Prefer exact executable/argument lists plus Project-relative cwd and declared resource
      scope. Avoid broad npm-star or shell-prefix rules. Shell composition, extra arguments and wrappers
      cannot inherit a narrower command approval. Scripts remain executable project code; allowlisting
      a command does not prove its contents harmless or bypass runtime confinement. Relevant launcher
      or permission-definition changes require renewed review; ordinary development edits must not be
      presented as automatically harmless merely because the command text stays the same.
    selection_example:
      label: Checks
      commands:
      - argv: [npm, test]
        cwd: .
      - argv: [npm, run, lint]
        cwd: .
      active_by_default: false
    compatibility: External tool policy files may later be imported as visible suggestions. Do not
      automatically activate another tool's permissions or assume equivalent rule semantics.
  command_review_recommendation:
    status: Core review flow accepted in U17/U18/U20; pending Specification additions and implementation.
    flow: Agent proposes exact command and context; deterministic preflight prepares the request;
      separate model explains it; user approves once unless a current explicitly enabled list already
      covers the execution; executor revalidates current authority and approval binding immediately
      before execution; results return to the originating chat.
    approval_context: Bind the exact command/script, target device/source and Project, working directory,
      requested environment/resource access and operation identity. Any changed request requires fresh
      review and a current matching grant or new confirmation; no blanket terminal grant follows from
      Apply and show file-write mode. A command-list match cannot silently widen resource access.
    explanation: Use the latest Gemini Flash-Lite with the concrete request and necessary authorized
      context, such as the package.json test script. Treat repository text as untrusted data, disclose
      uncertainty and indirect script effects, and never present a model's safe label as a guarantee.
      Do not include credentials or persist new plaintext command/code records on the server.
    explanation_model:
      required_family: Gemini Flash-Lite
      verified_model_id: gemini-3.5-flash-lite
      configured_model_reference: google/gemini-3.5-flash-lite
      verified_on: '2026-09-22'
      official_status: stable; official latest update July 2026
      source: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
      existing_provider_path: backend/providers/google.yml already declares this model; the generative
        helper in backend/apps/ai/utils/llm_utils.py can route it with a bounded structured explanation
        result. Preserve the selected Flash-Lite model through configured Google server fallback;
        do not inherit utility fallbacks that silently substitute another model family.
      implementation_note: Verify provider availability and the latest stable Flash-Lite again when
        wiring execution; use an explicit configured model version rather than silently substituting
        an older model or granting commands when explanation fails.
      context_boundary: Fixed review instructions, exact command and target/cwd/resource facts, and
        minimal authorized script excerpts. No inherited coding-agent conversation or Project focus
        instructions. Treat command/code/comments as untrusted data. Give the reviewer no execution
        tools or power to approve; context separation reduces exposure but does not prove immunity.
    search_boundary: The search product skill accepts query, path, filename glob and literal/regex mode.
      It constructs a fixed rg argument array, disables untrusted rg configuration/preprocessors and
      enforces root, credential-path, output and runtime limits. Arbitrary shell strings or flags must
      not turn approval-free search into command execution. Fallback semantics must match.
  research:
    inspected_workspace: session 6407; distinguish committed code from partial file-write additions
    current_search:
    - frontend/packages/openmates-cli/src/remoteAccess.ts already implements encrypted-relay content
      search with rg, up to 20 results, 500-character snippets, and a ten-second rg timeout. It lacks
      recursive filename search and an include-glob parameter. The regex rg query and literal fallback
      currently disagree; list/read/fallback and rg also differ in hidden/ignore behavior.
    - frontend/packages/openmates-cli/src/projectFileRisk.ts applies broad restrictions to reads/search,
      including ordinary dependency manifests, Docker files, and auth/security source. Its protected
      paths differ from backend/shared/python_utils/project_file_risk.py. A common policy needs separate
      read/search and write/execute concerns, without treating all configuration as secret.
    - ProjectsPage.svelte exposes remote browsing/search, but chat model Project tools are not wired.
      Hosted files are encrypted linked embeds without implemented Project filename/content search;
      client-side authorized search is required to preserve the storage encryption boundary.
    current_execution:
    - Remote bridge rg/git subprocesses currently inherit the CLI environment. Future command execution
      needs an explicit minimal environment and named credential selection; reusing those spawn defaults
      would expose unrelated host credentials. Existing Code Run has no secret-injection schema and
      only a coarse outbound-internet switch, not per-destination grants. Existing output redaction is
      supplementary protection, not a guarantee that executing code cannot disclose an injected secret.
    - backend/apps/code/skills/run_code_skill.py and backend/shared/providers/e2b_code_runner.py execute
      supplied chat code/files in transient E2B sandboxes. This is not a shell attached to a Project.
    - Existing Code Run authorization is a temporary chat/message/embed marker, allows limited unprompted
      reruns, and does not bind an exact remote command, source, cwd or environment. Assistant-created
      inline code follows its own path. Do not reuse either mechanism to authorize remote commands;
      remote execution needs a distinct one-execution approval and host transport under the shared UX.
    - The current Jev/TypeSafe wrapper provides structured choices/scores, not prose explanations.
      A natural-language command explanation needs a generative model call. Existing safety handling
      supplies a useful precedent for treating submitted commands and repository context as untrusted
      data, but cannot confer execution authority.
    - Committed remote relay operations are list/search/read_text. This session's partial create/update
      additions do not add shell execution. Existing remote-source plans explicitly excluded arbitrary
      commands; consent for configured checks is a narrower distinct permission.
    - General Project commands lack an agreed environment, network/credential policy, process lifecycle,
      and coordination with guarded file writes. Command names such as npm test do not prove no side
      effects; scripts and child processes need enforceable boundaries.
    existing_design_sources:
    - docs/plans/projects-remote-sources/plan.yml
    - docs/plans/cli-remote-access-live-bridge/plan.yml
    - docs/plans/code-run-cli-app-skill/plan.yml
    - docs/architecture/privacy/prompt-injection.md
    external_primary_sources:
    - url: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
      finding: Stable model code gemini-3.5-flash-lite, latest update July 2026, supports text output.
    - url: https://code.claude.com/docs/en/settings
      finding: Shared Project permission settings use .claude/settings.json; local settings use
        .claude/settings.local.json. These are Claude-specific files, not a cross-tool standard.
    - url: https://opencode.ai/docs/permissions/
      finding: OpenCode uses its own opencode.json permission configuration with allow/ask/deny rules.
    - url: https://geminicli.com/docs/reference/policy-engine/
      finding: Gemini CLI uses TOML policy rules, including ~/.gemini/policies/*.toml. Current docs warn
        that workspace .gemini/policies loading is disabled; do not promise portable Project behavior.
    - url: https://github.com/BurntSushi/ripgrep
      finding: ripgrep is invoked as rg, optimized for recursive code search, with ignore and binary
        filtering defaults. Performance depends on the workload; it is the existing remote-search engine.
    - url: https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
      finding: rg supports literal/regex search and glob filters, but also configurable preprocessors;
        approval-free search must expose a controlled query interface rather than arbitrary rg options.
    - url: https://opencode.ai/docs/tools/
      finding: Separate grep, glob, and bash tools; search uses ripgrep and respects ignore files.
    - url: https://geminicli.com/docs/tools/file-system/
      finding: Separate filename glob and content-search tools, with path/line results and no edit prompt.
    - url: https://code.claude.com/docs/en/sandboxing
      finding: OS filesystem and network restrictions apply to commands and child processes. Permission
        prompts and command labels do not substitute for enforced runtime isolation.
