- id: U19
  direction: Support user-selectable command allowlists and investigate a standard repository file for
    storing them. Existing design reserves .openmates/permissions.yml. U20 resolves selection as explicit
    preapproval of matching commands, subject to the remaining guards.
- id: U20
  decision: Accept user-enabled command allowlists as standing approval for their exact matching
    commands, with Ask first remaining the default for other eligible commands. Every execution retains
    the separate Gemini explanation, current Project authority and confinement. Store reviewable list
    definitions in .openmates/permissions.yml; repository changes cannot activate or broaden grants.
- id: U21
  decision: Accept network and credentials off by default for remote commands, with explicitly enabled
    reusable Project access profiles for destinations and selected credentials. Use a minimal executor
    environment; never inherit unrelated host credentials. Existing profiles avoid repeated prompts;
    requested expansions appear in the command approval. Command preapproval alone grants neither
    network nor credentials, and credential values stay out of the explanation model's context.
- id: U22
  clarification_request: Before answering final S5, inspect safe terminal-output delivery and existing
    long-running app-skill behavior. User proposes scanning completed output or periodic batches through
    existing prompt-injection protection and asks whether skills already support waiting versus
    continuing with later completion updates, or whether that is a sub-chat feature. S5 remains open.
- id: U23
  decision: Accept the refined final round and proceed with implementation. Reuse the shared async-skill
    lifecycle with agent-selected wait-for-result or continue-independent-work; use events rather than
    model polling. Buffer short command results and scan once; scan bounded long-command batches with
    neighboring context before agent use. Close later-turn cached Code Run output's missing scan path.
    Technical unscanned text remains visible as unreviewed logs/status but is withheld from autonomous
    model input. Checked output remains untrusted and cannot confer permissions. Preserve client-side
    encryption, tracked execution/cancellation, and the preceding Project/command/resource decisions.
- id: U24
  decision: Tests that strictly need real AI inference must always run directly on the dev server,
    never in CI, for now. This supersedes the earlier isolated-CI requirement for those tests only.
    Keep disposable test Projects/folders and isolated CLI state; preserve runtime target/lease guards.
