integration_constraints:
  source_command_coordination: Kernel shared/exclusive coordination currently serializes source-writing
    commands against all participating file commits under the same OS user. This intentionally covers
    overlapping roots at the cost of serializing unrelated source-writing commands.
  network_profiles: The first confined adapter supports exact public HTTPS hostnames on port 443 through
    an isolated-namespace proxy. HTTP, UDP, private/IP targets and arbitrary ports remain unsupported;
    no unsupported request falls back to unrestricted host networking.
  terminal_inference: An explicitly authorized source executor may send a bounded transient output copy
    through the existing semantic guard for AI continuation, separately from encrypted durable logs.
    This gives the server neither Project keys nor independent access to stored log contents.
