open_questions:
- id: Q2
  topic: Worktrees
  question: For the first version, edit the connected folder directly with version checks and undo, deferring
    automatic worktree creation, or include isolated worktree creation now?
  recommendation: Direct connected-folder edits first; no model-decided automatic worktree creation.
  status: resolved
  answer: Direct edits; automatic worktrees deferred.
- id: Q3
  topic: Read versus write consent
  question: When the correct Project focus is active and the user asks for an edit, apply routine changes
    without another per-file confirmation, or require a preview approval first?
  recommendation: Apply ordinary requested edits and show the diff; reserve additional confirmation for
    separately defined exceptions.
  status: resolved
  answer: Apply and show changes by default; required explicit setup choice; Always ask alternative; CLI/web/native
    settings parity.
- id: Q4
  topic: Focus deactivation
  status: deferred_until_needed
  question_to_ask_later: Files already shown remain readable; clarify fresh remote fetch versus retained
    content, in-flight writes, and reactivation consent.
- id: Q5
  topic: Focus composition
  status: deferred_until_needed
  question_to_ask_later: Define specific Project focus inheritance, generic focus switching, and chats
    involving more than one Project.
- id: Q6
  topic: Concurrent file edits
  question: If a file changes after the agent reads it, should the agent reread and regenerate its requested
    edit automatically, asking only when intent conflicts, or always ask before retrying?
  recommendation: Reread and regenerate within the original request; never overwrite unseen changes. Ask
    when preserving both edits needs a material choice.
  example: User adds a README paragraph in their editor while the assistant is updating installation steps;
    reread and preserve the paragraph while updating the steps.
  status: resolved
  answer: Automatic bounded reread and regeneration accepted, with deterministic guards, a user question
    for conflicting intent or repeated failure, and clear Specification edge cases including other chats.
- id: Q7
  topic: Multiple chats editing one file
  question: Allow chats to work in parallel, with brief exclusive write turns for the same underlying
    file and automatic recovery for a stale second writer, rather than reserving files for an entire chat?
  recommendation: Parallel reading and planning with brief per-file commit serialization; preserve each
    chat's own authorization and surface meaningful conflicts without silently overriding another chat.
  example: Chats A and B read README base 12. A saves installation changes as 13. B's edit to the examples
    section is rejected against 12, rebuilt against 13, and saved as 14 preserving both changes.
  status: resolved
  answer: Accepted brief per-file write turns with parallel reading/planning; hosted encryption and the
    server's inability to decrypt stored files independently must remain intact.
- id: Q8
  topic: No authorized client available for file work
  question: When no authorized app or CLI can perform the next client-side file operation, should that
    work wait and resume automatically once an authorized executor reconnects?
  recommendation: Show waiting for an authorized device, release any write turn, and resume within the
    original request after validating current permissions, focus, write policy, and file base. Do not
    create a server decryption fallback or silently grant a different device access.
  example: Closing the browser can leave an already-authorized CLI handling Project work. If no authorized
    executor remains, the next operation needing decrypted file access waits; reconnection triggers safe
    recovery. A ciphertext commit already dispatched can still complete and its result must be reconciled.
  status: resolved
  answer: Accepted automatic recovery before a twenty-minute wait deadline, with a private email reminder
    after ten minutes. Expiry stops automatic continuation and requires an explicit chat resume.
