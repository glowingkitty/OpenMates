- id: U6
  decision: Use direct edits to the connected remote folder. Automatic worktree creation and management
    are out of scope for now; revisit only if later multitasking warrants it.
- id: U7
  decision: Apply and show changes is the default write-policy option, with Always ask before writes as
    the alternative. New Project setup and adding an existing folder as a Project require an explicit
    answer. Users can inspect/change the same persisted Project setting through CLI, web, and native Project
    settings at any time. Both modes still require a focus belonging to that Project to be active for
    chat writes.
- id: U8
  decision: Accept automatic reread-and-regenerate recovery after deterministic stale-write rejection,
    asking only for material intent conflicts or bounded repeated failures. Always ask mode still requires
    approval of a refreshed concrete diff. Record clear Specification requirements and edge-case examples;
    apply the same correctness rules when the intervening writer is another chat.
- id: U9
  decision: Accept parallel chats with brief per-file write turns covering final validation and commit,
    leaving files available while chats think or await approval. Use atomic hosted revision publication
    and shared remote-machine coordination, preserving each chat's own access and automatic stale recovery.
- id: U10
  constraint: Files and embeds stored in OpenMates remain client-side encrypted. The server cannot decrypt
    them by itself, and the coding/write/concurrency implementation must preserve that property.
- id: U11
  decision: Accept automatic waiting and recovery for an unavailable authorized executor, with an email
    notification after ten minutes waiting. After twenty minutes stop automatic waiting and require an
    explicit chat resume; device reconnection alone must no longer restart the run.
- id: U12
