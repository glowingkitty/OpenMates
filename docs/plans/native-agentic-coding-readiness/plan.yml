    - path: frontend/packages/openmates-cli/src/remoteAccess.ts
      lines: '365-373, 417-419, 466-504, 560-563'
      finding: Current bridge operations are read-only and dispatched concurrently. Existing authenticated
        session/source/client bindings must survive the addition of write coordination.
    - path: docs/plans/projects-remote-sources/plan.yml
