research:
  concurrent_file_edits:
    purpose: Research informed the automatic recovery behavior accepted in U8; the detailed multi-chat
      coordination proposal is tracked separately under Q7.
    method: Primary project documentation, official changelog and commit-pinned public source; no runtime
      reproduction or claim of universal tool behavior.
    tools:
    - name: Claude Code
      finding: Official release notes confirm unexpected-file-modification safeguards and fixes for false
        conflicts when watchers, sync tools, antivirus, or Git only change timestamps. Internal current
        guard implementation was not verified; do not claim a specific current hash algorithm or guaranteed
        retry policy.
      sources:
      - https://github.com/anthropics/claude-code/blob/56f36532530f88b572854538d685fcf781141e8c/CHANGELOG.md#L5889
      - https://github.com/anthropics/claude-code/blob/56f36532530f88b572854538d685fcf781141e8c/CHANGELOG.md#L5910
    - name: OpenCode
      finding: Inspected dev edit path reads current contents under an internal per-file semaphore, tries
        exact and several flexible/fuzzy replacement strategies, and rejects missing/ambiguous/disproportionate
        matches. It has no prior-read FileTime check in this version. Permission handling is separate.
        Internal locking does not cover external editors and there is no external-editor compare-and-swap
        immediately before writing in the inspected path.
      sources:
      - https://github.com/anomalyco/opencode/blob/2406400f0aeb07b36d0495af4e05aaca49159832/packages/opencode/src/tool/edit.ts#L88
      - https://github.com/anomalyco/opencode/blob/2406400f0aeb07b36d0495af4e05aaca49159832/packages/opencode/src/tool/edit.ts#L694
    - name: Aider
      finding: Reads current files when a message begins and when applying search/replace edits. Failed
        edits are returned as model feedback with a bounded reflection loop (max_reflections=3 in inspected
        code). Its FAQ advises avoiding manual edits while a reply is in progress because conflicts remain
        possible. Some partial edits can already have succeeded; retries are told not to resend those
        edits.
      sources:
      - https://aider.chat/docs/faq.html#can-i-edit-files-myself-while-aider-is-running
      - https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/coders/editblock_coder.py#L41
      - https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/coders/base_coder.py#L932
      - https://github.com/Aider-AI/aider/blob/5dc9490bb35f9729ef2c95d00a19ccd30c26339c/aider/coders/base_coder.py#L2305
    - name: Gemini CLI
      finding: EditTool reads current disk content and uses exact, indentation, whitespace-regex and fuzzy
        matching. Optional internal LLM correction refreshes file content using a local hash comparison,
        but is disabled by default in the inspected settings and is not an atomic guard tied to an earlier
        ReadFile call. Ordinary permission approval is separate; execution re-reads but a read/write race
        remains.
      sources:
      - https://github.com/google-gemini/gemini-cli/blob/62364cb2000795537a6895261b37ec668e4cf527/packages/core/src/tools/edit.ts#L680
      - https://github.com/google-gemini/gemini-cli/blob/62364cb2000795537a6895261b37ec668e4cf527/packages/core/src/tools/edit.ts#L302
      - https://github.com/google-gemini/gemini-cli/blob/62364cb2000795537a6895261b37ec668e4cf527/packages/cli/src/config/settingsSchema.ts#L1761
      - https://github.com/google-gemini/gemini-cli/blob/62364cb2000795537a6895261b37ec668e4cf527/packages/core/src/tools/edit.test.ts#L928
    recommendations_presented_for_Q6:
    - Compare expected content hash or stored version, not timestamps alone; a mismatch returns file_changed
      to the agent without applying the stale patch.
    - Let the main agent reread and regenerate an in-scope edit without a new user question in Apply and
      show changes mode; ask about material intent conflicts or after bounded unsuccessful recovery.
    - Require exact applicability to the refreshed base; do not silently force a fuzzy patch onto changed
      project files.
    - Always ask mode still requires approval of the refreshed concrete proposal; an old approval must
      not authorize a changed patch.
    - Enforce hosted-storage version updates atomically and serialize bridge-managed writes with revalidation
      near mutation. Hash-check-plus-rename is not a universal atomic compare-and-swap against arbitrary
      external filesystem writers; retain recoverable preimages and test the actual residual race.
    example: 'User adds an unrelated README paragraph while the assistant changes installation steps:
      refresh and preserve both. If the user switches npm to pnpm while the requested patch assumes npm,
      ask which tool should govern.'
