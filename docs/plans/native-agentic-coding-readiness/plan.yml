ignored_path_policy_checkpoint:
  status: implementation_in_progress_apparmor_terminal_approved
  user_direction: U28-U30
  approval_scope: The user's explicit approval covers the defined ignored/private requirements and
    six examples; no additional Specification-approval reprompt is required within that scope.
  user_question: Determine whether files matched by .gitignore are impossible to inspect through
    Project list, search, read and terminal tools, or whether their names or contents are anonymized.
  confirmed_behavior:
  - In a native Git root, remoteAccess.ts uses git check-ignore for ordinary untracked ignored paths;
    their names and contents are omitted and only aggregate omission counts are returned. Tracked
    files remain visible even when a later ignore pattern matches them.
  - The .gitignore file itself remains readable and can reveal private-looking path patterns.
  - Plain folders, nested repositories and fallback list/read paths do not apply one consistent
    ignore policy. Native ripgrep applies ignore patterns, so native and fallback search can diverge.
  - Terminal execution masks credential-classified values plus .git/config and configured aliases,
    but does not generally deny paths because .gitignore matches them. Masked names can remain visible.
  confirmed_gap: Current behavior is neither a deterministic cross-tool private-path boundary nor
    a consistent anonymization contract across list, search, read and terminal execution.
  approved_policy:
  - Treat .gitignore as a discovery and direct-read filter rather than a secrecy boundary. Ignored
    untracked files require explicit client user confirmation for a signed ephemeral exact-file grant
    bound to Project, source, chat, request and path; no model or Project-file allowlist can grant it.
  - Keep built-in private paths plus trusted additive .openmates/permissions.yml
    file_access.private_paths as a deterministic deny boundary across list, search, read, import,
    edit, recovery and terminal content access. Dedicated file tools hide matching names and content;
    a terminal may reveal a filename but cannot obtain or mutate its private content.
  - Enforce private policy at the source before bytes are read, transmitted or decrypted, and before
    commands launch. Plain folders, nested repositories, native rg and fallback traversal must agree.
  - Allow exact approved confined commands to use ordinary ignored dependencies and build outputs;
    this command access neither exposes them to agent file tools nor overrides private paths.
  authority: Built-ins and activated user additions are additive trusted state outside the
    agent-writable Project. The permissions file is itself private; agent output, repository content,
    deletion or edits cannot weaken active policy. Remote and hosted encryption remains unchanged.
  approved_examples:
  - An ignored local note remains absent until the user approves that exact file for one bound request.
  - A tracked configuration file matching .gitignore remains filtered and needs its own exact grant.
  - Git roots, nested repositories, plain folders, native search and fallback traversal return the
    same ignored-file boundary.
  - Built-in and custom private paths reveal neither names nor contents through dedicated file tools;
    terminal filename visibility does not grant content access.
  - An approved npm test may read ignored node_modules and write an allowed ignored test report.
  - An approved shell command still cannot read .env, .git/config, the permissions file, or a custom
    private certificate directly or through an alias.
  contract_assertions:
  - projects.files.ignored-exact-inclusion
  - projects.files.private-path-deny
  - code-run.remote.ignored-project-files
  - code-run.remote.private-path-deny
  implementation_status: Contracts, user documentation and the reviewed local implementation are
    complete for the kernel-tested candidate, and the mandatory web-chat Project focus, source
    discovery and origin-review slices are locally ready. Bounded host setup, dev runtime verification,
    final publication and the separate earlier deployment remain pending.
  implementation_evidence:
  - The backend read/waiting focused suite passes 16 tests; the focused HMAC ignored-file grant case
    passes 1 test. Independent ignored-file list, search and exact-read implementation may continue.
  - The source policy helper suite reports 31 tests with 30 passing and 1 unsupported-host skip. This is focused
    source evidence, not proof of live AppArmor enforcement or dev-host terminal behavior.
  - Focused AppArmor broker tests pass 7 cases, installer tests pass 5 cases, Git compatibility shim
    tests pass 5 cases, ignored-read tests pass 5 cases, and the full CLI bundle plus declaration
    build passes. The build receipt is
    /tmp/openmates-6407-u30-cli-build.log.
  - backend/tests/test_remote_command_apparmor_live.py provides the kernel integration fixture.
    The first two isolated runs failed before the kernel assertions. Explicit user-namespace setup
    was then added to runtime and test preparation, and minimal toolchain mounts were added to the
    fixture. Final request 6c96d4fadf0e06a024295d2fdcbf7e0738e8f2a53fe8f5eb5c4e57428e7ee91e
    passed from source 4c8915b8fcc1e7c6470fbe12a4e143ee9b6715d7 at base
    9f3b6921fb7661d80afc4c36376fa729226b0881 in run 35873282657. This is isolated
    kernel proof, not dev-host setup or live Project command proof.
  terminal_live_mount_gap:
    finding: The current terminal sandbox masks private paths found before launch but exposes a live
      Project mount. A matching private path created concurrently after mask construction can therefore
      become visible to the running command, violating the deterministic deny boundary.
    rejected_approach: U29 rejects a filtered temporary Project copy with checked writeback because
      it behaves like another worktree or staging layer. Do not implement overlay copies, temporary
      worktrees, staged source mirrors, or post-command writeback reconciliation for this boundary.
    approved_architecture: U30 chooses a Linux AppArmor-first adapter that runs against the original
      live Project folder and enforces private-content restrictions on every kernel access, including
      newly created matching private paths, symlinks resolving into denied paths and known pre-existing
      hard-link aliases. Filenames and ordinary metadata may be visible; content access and mutation
      remain denied without copy, worktree, staging or writeback. The sandbox cannot create or rename
      a denied source into an allowed alias, and source-owning peer processes should run under the same
      policy. AppArmor does not taint file contents; an external unconfined owner deliberately copying
      or hard-linking private data to a new allowed pathname republishes it outside this path boundary,
      just as copying a secret into ordinary source would.
    implementation: The reviewed broker and installer cache immutable per-policy profiles until reboot
      and release per-command leases without unloading reusable profiles. Conservative widening for
      Unicode and bracket-class rules fails closed, and protected ancestor-directory renames are denied.
