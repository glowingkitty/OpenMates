sequence:
- id: P1
  outcome: CLI and chat can read, create, and update Project files in both remote sources and OpenMates
    storage.
  includes:
  - Agree write permissions, project-focus access lifecycle, patch/version contract, conflict behavior,
    recovery/undo, and worktree scope.
  - Use effective deterministic guards without repeated prompts for already-authorized routine edits.
  - Validate actual chat read/write behavior against both storage locations before moving on.
  - Require the setup write-policy choice and editable Project settings in CLI, web, and native apps;
    full native Project browsing remains separately scoped.
- id: P2
  outcome: Web Projects can be discovered, browsed, opened in embed fullscreen, and edited from chats.
  includes:
  - Show connected Projects with expandable subfolders and appropriate file embed previews, including code.
  - Open file previews in the existing fullscreen embed view and deliver remote content safely on demand.
  - Keep remote Project file content transient on the authorized client; do not persist it as hosted
    files/embeds or upload entire repositories to OpenMates. Preserve bounded encrypted transport.
  - Verify the actual connected-source browse/preview/fullscreen flow with a disposable Project.
  - Retrieve remote tree/content on demand without uploading entire repositories.
  - Preserve encryption, scoped permissions, and honest online/offline state.
  - Confirm web-chat edits work for both storage locations.
- id: P3
  outcome: Address Task execution and completion gaps after Project editing works.
- id: P4
  outcome: Address Specifications and Plans gaps after Tasks; clarify their detailed order later.
