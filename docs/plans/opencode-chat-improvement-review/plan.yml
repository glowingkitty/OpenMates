risks:
  - Transcript volume can exceed useful context; deterministic bounds and explicit truncation metadata are required.
  - Local transcripts may contain secrets or private prose; reports are gitignored and Discord receives only a bounded report artifact rather than raw database exports.
  - Self-analysis can create recursive noise; the current analyzer session must be excluded and prior analysis sessions should be identifiable.
  - Model recommendations can be wrong or stale; the implementation skill must independently revalidate evidence and current files.
  - Existing in-progress agent-workflow-quality-parity work may touch related audit files; implementation must reread and preserve concurrent changes.

