schema_version: 2
id: opencode-chat-improvement-review
title: Manual OpenCode Workflow Review
status: verified

goal: >
  Let maintainers manually analyze recent local OpenCode chats with GPT-5.6
  Luna, research evidence-backed improvements to skills, hooks, agents, and
  agent instructions, save durable gitignored reports, and optionally notify
  Discord without allowing any scheduled path to create report noise or edit
  tracked files.

scope:
  in:
    - Analyze top-level OpenCode sessions and their subagent sessions from the local SQLite store.
    - Read full local prompts, responses, and tool results while keeping transcript evidence in gitignored local reports.
    - Use GPT-5.6 Luna for the manual research and recommendation session.
    - Save latest and dated JSON and Markdown reports under logs/nightly-reports/opencode-improvements/.
    - Send a bounded Discord summary and attach the Markdown report only for explicit manual runs when configured.
    - Retire automated host cron installation and provide an uninstall path for the old managed cron block.
    - Add one user-invocable skill for manual workflow review and a separate user-invoked skill for implementing a saved report.
    - Reuse and extend the existing OpenCode workflow collector, dispatch, Discord, and agent parity patterns.
  out:
    - Cron-triggered edits, commits, deploys, or implementation sessions.
    - Automatically accepting or applying a recommendation.
    - Product APIs, SDKs, web UI, Apple UI, or customer chat data.
    - Sending raw transcripts, credentials, environment files, webhook URLs, or reasoning traces to Discord.

context_discovery:
  github_issues:
    - GitHub MCP discovery was unavailable because authentication returned HTTP 401; no issue was created.
  docs:
    - docs/architecture/infrastructure/cronjobs.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/deterministic-workflow-guardrails/plan.yml
    - docs/plans/agent-workflow-quality-parity/plan.yml
    - docs/plans/deterministic-stale-code-reporting/plan.yml
  code_patterns:
    - scripts/_workflow_review_helper.py
    - scripts/_opencode_utils.py
    - scripts/_nightly_scanner_helper.py
    - scripts/stale_code_daily.py
    - scripts/discord_webhook.py
    - scripts/sync_agent_parity.py
  tests:
    - scripts/tests/test_workflow_review_helper.py
    - scripts/tests/test_stale_code_daily.py
    - scripts/tests/test_opencode_automation_budget_audit.py
  observed_baseline:
    - The existing workflow collector reads OpenCode SQLite in read-only mode but intentionally excludes transcript prose and subagent analysis.
    - The verified deterministic-workflow-guardrails contract previously prohibited scheduled workflow review; this revision returns the workflow to maintainer-invoked analysis only.
    - run_opencode_session currently accepts but discards its model argument, so callers cannot guarantee GPT-5.6 Luna.
    - Existing nightly reports and logs are already gitignored and shared into session worktrees.

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This is repository-local developer tooling with no Apple product counterpart.
  verification:
    - Apple verification is not required.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: May analysis inspect complete local OpenCode transcripts?
      answer: Yes; outputs are gitignored, so local reports do not require an overcomplicated redaction pipeline.
    - question: May cron implement recommendations?
      answer: No. The managed cron is retired; implementation is started manually in a new chat with a separate skill.
    - question: Should subagent sessions be analyzed?
      answer: Yes; include top-level and subagent sessions and attribute children to their parent.
    - question: Where should reports be stored?
      answer: Use the existing gitignored nightly-report area.
    - question: Should useful but mostly ignored daily Luna reports continue automatically?
      answer: No. Keep the report-only research workflow, but make it weekly/on-demand by maintainer invocation and leave implementation explicit through implement-opencode-improvements.
  vision_summary: >
    A maintainer-invoked Luna research session examines bounded recent OpenCode
    work, including delegated subagents, and writes actionable local
    recommendations with optional manual Discord notification. The unattended
    daily cron is retired; a maintainer explicitly starts a separate
    implementation skill when ready.
  approved_by_user: true

implementation_state:
  subject_commit: working-tree@73b0043e1b26e831e2440391b85efaf634f4756d

approvals:
  specification:
    status: approved
    approved_at: "2026-08-06"
  plan:
    status: not_required
    reason: The approved contract fixes the material architecture boundary by separating report-only research from user-triggered implementation.

decisions:
  - id: D-1
    status: active
    decision: Manual analysis may read local transcript content but may write only gitignored reports and notification state.
    reason: Instruction and skill failures cannot be diagnosed reliably from aggregate counters alone.
    decided_at: "2026-08-06"
  - id: D-2
    status: active
    decision: The analyzer uses openai/gpt-5.6-luna explicitly.
    reason: The user selected Luna for the workflow research workload.
    decided_at: "2026-08-06"
  - id: D-3
    status: active
    decision: Retired managed cron commands must not invoke the implementation skill or use an editing OpenCode agent.
    reason: Recommendations require human selection and current-code revalidation before tracked changes, and unattended reports created noise.
    decided_at: "2026-08-06"
  - id: D-4
    status: superseded
    decision: This spec supersedes the explicit-only and aggregate-only workflow-review restriction in deterministic-workflow-guardrails and agent-workflow-quality-parity.
    reason: The user explicitly requested automatic daily transcript research while preserving manual implementation.
    decided_at: "2026-08-06"
  - id: D-5
    status: active
    decision: Retire unattended daily OpenCode improvement analysis and expose the workflow as a weekly/on-demand report-only skill.
    reason: The reports were useful but mostly ignored, so daily automated Luna analysis created notification and budget noise.
    decided_at: "2026-08-10"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Reuse the existing explicit aggregate workflow collector unchanged.
    outcome: rejected
    notes: It excludes transcript prose and subagent evidence, so it cannot identify instruction or skill defects.
    recorded_at: "2026-08-06"
  - id: ATTEMPT-2
    task_id: TASK-4
    approach: Run the real 24-hour Luna analysis from the isolated implementation worktree.
    outcome: blocked
    notes: The run stopped before model dispatch because the shared logs symlink resolved outside the worktree and the draft path could not be made relative to the worktree root. Normalize against the canonical checkout and rerun.
    recorded_at: "2026-08-06T17:31:00Z"
  - id: ATTEMPT-3
    task_id: TASK-4
    approach: Let the read-only Luna session write its designated gitignored draft after successful analysis.
    outcome: blocked
    notes: Luna completed research and identified four recommendations, but OpenCode worktree routing blocked every report write. Capture structured final JSON from the OpenCode JSONL stream and let the trusted runner publish it instead.
    recorded_at: "2026-08-06T17:38:00Z"
  - id: ATTEMPT-4
    task_id: TASK-4
    approach: Capture Luna's structured final response while passing raw bounded OpenCode row dictionaries as prompt evidence.
    outcome: blocked
    notes: The JSONL capture worked, but encrypted reasoning metadata and attachment-shaped payloads triggered compaction that discarded the evidence prompt. Project rows to observable text/tool outcomes and omit reasoning, snapshots, and binary content before rerunning.
    recorded_at: "2026-08-06T17:45:00Z"
  - id: ATTEMPT-5
    task_id: TASK-4
    approach: Independent code review of the green implementation and live Luna proof.
    outcome: succeeded
    notes: The review identified enforced read-only permissions, Discord secret scanning, SQL-side limits, complete-payload byte bounds, generation consistency, and notification exception coverage. The implementation was hardened before final verification.
    recorded_at: "2026-08-06T17:55:00Z"
  - id: ATTEMPT-6
    task_id: TASK-5
    approach: Retire the managed daily cron while keeping the Luna research runner available through a manual skill.
    outcome: succeeded
    notes: The runner default was changed to 168 hours, cron installation was retired, uninstall removes the old managed block, skill mirrors were synchronized, and focused pytest plus OpenCode audits passed.
    recorded_at: "2026-08-10T15:01:40Z"

handoff:
  current_task_id: TASK-5
  next_action: No implementation work remains; invoke opencode-workflow-review for a weekly or on-demand report, then explicitly invoke implement-opencode-improvements only for selected recommendations.
  command: python3 scripts/opencode_chat_improvement_review.py --hours 168 --dry-run-notify
  expected_outcome: A strictly read-only GPT-5.6 Luna session publishes bounded local reports only when manually requested.
  blocker: null
  last_verified_commit: working-tree@73b0043e1b26e831e2440391b85efaf634f4756d

scenarios:
  - id: S-1
    title: Manual research analyzes a bounded recent interval
    given:
      - Local OpenCode contains top-level and child sessions updated during the requested UTC interval.
    when:
      - The manual research runner executes.
    then:
      - It collects bounded transcript and tool evidence for the repository.
      - Child sessions are attributed to their top-level parent.
      - The analyzer session itself is excluded from its input.
      - GPT-5.6 Luna researches likely improvements against current repository files and relevant documentation.

  - id: S-2
    title: Research results are durable and visible
    given:
      - Luna completes, partially completes, times out, or fails.
    when:
      - The runner finalizes the job.
    then:
      - Latest and dated JSON and Markdown artifacts remain under the gitignored report directory.
      - Every recommendation names its evidence, target type, target files, expected benefit, risk, and verification.
      - Discord receives a bounded status summary and the Markdown report only when an explicit manual run requests notification and the webhook is configured.
      - Missing or failed Discord delivery is recorded without deleting the local report.

  - id: S-3
    title: Retired scheduled execution cannot run or implement recommendations
    given:
      - A host crontab may contain the previous managed OpenCode improvement research block.
    when:
      - A maintainer runs the uninstall path or attempts to install the retired cron.
    then:
      - The managed cron block is removed idempotently and no new scheduled entry is installed.
      - Retired install exits visibly instead of silently re-enabling daily analysis.
      - No tracked file, git ref, commit, deployment, or implementation session is changed.

  - id: S-4
    title: Maintainer implements a selected saved report
    given:
      - A maintainer explicitly invokes the implementation skill in a new chat.
    when:
      - The skill loads a latest or selected dated report.
    then:
      - It rechecks the evidence against current transcripts, source, documentation, and existing tests.
      - It rejects stale, weak, duplicate, conflicting, or unsafe recommendations.
      - It applies only selected valid changes and runs required skill, hook, instruction, and agent parity checks.
      - Deployment uses the normal sessions.py workflow and never occurs from cron.

