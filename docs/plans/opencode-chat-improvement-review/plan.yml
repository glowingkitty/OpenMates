implementation_notes:
  plan_path: docs/plans/opencode-chat-improvement-review/plan.yml
  existing_patterns:
    - Extend scripts/_workflow_review_helper.py collection logic rather than adding another OpenCode database abstraction.
    - Use scripts/_opencode_utils.py for persisted read-only OpenCode dispatch with explicit model routing.
    - Reuse scripts/discord_webhook.py for confirmed Markdown attachment delivery.
    - Follow stale_code_daily.py for atomic reports and optional Discord, while retiring this runner's user cron installation.
    - Author skills canonically under .claude/skills and regenerate .agents/skills.
  architecture: >
    A bounded read-only collector extracts the requested repository interval from
    OpenCode SQLite into a temporary local prompt. A persisted GPT-5.6 Luna plan
    session researches current repository guidance and writes a structured draft.
    The runner validates and atomically publishes latest and dated reports, then
    optionally sends a bounded Discord notification for explicit manual runs. The
    retired cron install path fails visibly, and the uninstall path removes the
    old managed block. A separate user-invoked implementation skill consumes and
    revalidates reports.
  data_flow:
    - Runner fixes the UTC interval and current subject commit, then queries OpenCode SQLite read-only when manually invoked.
    - Collector groups top-level and child evidence, excludes the current analyzer, and applies deterministic bounds.
    - Luna inspects the evidence and current skills, hooks, agents, instructions, tests, and official documentation where needed.
    - Runner validates the result, publishes local JSON and Markdown, and optionally posts the Markdown to Discord when requested.
    - Uninstall removes only the old managed crontab block and preserves unrelated cron entries.
