schema_version: 2
profile: concise
id: result-embed-redesign
title: Consistent result embed previews and fullscreens
status: approved
goal: >-
  Redesign and finish embed previews and fullscreen views from the supplied Figma
  PDFs, starting with home listings and health appointments, deploying those so
  the user can review while the remaining result embeds are adapted.
scope:
  - Establish mandatory reusable result-embed design guidance.
  - Reuse shared preview/fullscreen, fact, tooltip, map, media and composer structures.
  - Preserve specialized Code, Docs and Sheets content and behavior beneath the automatic shared result preview chrome.
  - Exclude calendar views and new additional-results behavior from this phase.
  - Apply the user’s screenshot corrections to sizing, corners, grouped navigation, calendar badges, media fitting, facts, gallery, tooltips, followup and memory actions.
references:
  - docs/design-guide/result-embeds.md
  - specifications/features/app-skills/home-search/specification.yml
  - specifications/features/app-skills/health-search-appointments/specification.yml
decisions:
  - Deploy Home/Health first; continue other results during user review.
  - News mirrors websites and adds a publication-date badge.
  - Git repositories use text-first identity and compact icon facts.
  - 3D/image/video media remains uncropped; preserve existing playback and PiP.
  - Assistant cards use selectable content and explicit Expand; result grids remain clickable.
  - All result previews automatically use the app corner; only app-skill executions retain the circular icon bar.
  - The animated landing event imports the same pure result card/calendar/corner/event presentation as the app and uses a first-party event cover.
  - The landing demo uses a non-OpenMates meetup illustration without a printed date; dates appear only in the shared UI badge.
  - Text/table previews use natural heights within the existing caps; Docs/PDF pages center in the available width, and Social dates reuse the shared rounded time pill.
  - Preview primary/More/Expand controls share one icon color and standard hover scaling; the collapsed follow-up AI icon is gray and decorative while the input keeps its existing expansion.
  - Saved assistant previews replace More with a clickable pink heart; unsaving shows the existing notification and restores More. Search-result grids show only a decorative pink heart for saved cards and retain card-click opening. External provider preview buttons are removed; specialized file Copy/Download remains.
  - Compact Home copy is title/price, every Home preview has known or city-bounds map geometry when available, and unavailable geometry is never fabricated.
  - Social publication dates are plain text; compact Weather omits provider and extended metrics; compact Fitness prioritizes query/provider/count and supplied class or venue photos.
verification:
  required:
    - Focused local lint and unit checks for touched behavior.
    - Isolated GitHub bare-preview component checks before deployment.
    - Inspect artifacts against supplied PDF designs.
    - Scoped dev deployment and reviewed phone/laptop visual smoke.
    - Provide deployed previews and selected successful E2E recordings.

deferred:
  - More events from the organizer, after the corrected design is applied and reviewed.
