clarification:
  approved_by_user: true
  vision_summary: >
    Keep default-on search protection; replace entire flagged snippets with a fixed
    warning; fail closed without automatic retries; meet one-call and p95 targets
    while retaining all mandatory safety and benign-content cases.
  rounds:
    - {question: "Keep search semantic protection enabled by default?", answer: "Yes; improve processing speed rather than remove protection."}
    - {question: "Replace whole flagged fields?", answer: "Replace each affected search snippet with a fixed prompt-injection warning."}
    - {question: "Automatically retry failed batch scans?", answer: "No; return a safe retryable error and fail closed."}
    - {question: "Adopt one-call and p95 quality/performance gates?", answer: "Yes."}

contracts:
  api:
    - route: POST /v1/apps/web/skills/search
      access: Existing authenticated developer API-key REST and approved first-party session access; not public anonymous access.
      request: Existing validated WebSearchRequest; existing explicit programmatic security option unchanged.
      response: Existing result envelope; whole-field warnings and stable safety-error prefixes.
    - route: POST /v1/apps/web/skills/read
      access: Existing authenticated developer API-key REST and approved first-party session access.
      response: Existing page result envelope with protected contextual text sections.
  privacy_security:
    - Existing identity, account scope, request limits, provider throttling, credits, and budget enforcement remain in force.
    - Inputs and public provider results are plaintext on the existing server path; no new access to encrypted chats, keys, or private material.
    - The model only classifies server-assigned units; it cannot supply replacement text or trusted coverage flags.
    - Scan coverage is bound to exact content and active policy within the request; untrusted ignored-field claims cannot bypass it.
    - Preserve safe content after deterministic cleanup; apply replacements only after all decisions validate.

implementation_notes:
  plan_path: docs/plans/app-skill-safety-single-pass/plan.yml
  existing_patterns:
    - backend/shared/python_utils/app_skill_output_safety.py
    - backend/apps/ai/processing/content_sanitization.py
    - backend/apps/ai/processing/external_result_sanitizer.py
    - backend/apps/web/skills/search_skill.py
    - backend/apps/web/skills/read_skill.py
  architecture: >
    Reuse the provider-call adapter for the current safety model, with a compact
    field-classification prompt and strict response validation. Keep reusable logic
    in backend/shared, using the existing AI adapter rather than importing skill code.
    Select and partition fields deterministically with contextual boundaries, bounded
    batches and concurrency. A request-scoped server-owned safety context coordinates
    local persistence and outer dispatch so no output escapes before its complete
    coverage is validated and no unchanged unit is rescanned. Search-specific result
    handling replaces snippets/descriptions and omits unsafe identities.
  data_flow:
    - Provider output undergoes deterministic text cleanup and server-owned field selection.
    - Stable IDs and source context enter bounded batches; typical six-result search uses one model call.
    - Validate exact decision coverage, then replace whole flagged units with application-owned warnings.
    - Return or persist only the validated payload; propagate stable safe errors and cancellation on failures.
  affected_files:
    - {path: backend/shared/python_utils/app_skill_output_safety.py, reason: Planned structured field decisions, coverage validation, and atomic warning replacement.}
    - {path: backend/apps/ai/processing/external_result_sanitizer.py, reason: Planned shared single-boundary integration.}
    - {path: backend/apps/web/skills/search_skill.py, reason: Planned removal of duplicate skill-local semantic processing.}
    - {path: backend/apps/web/skills/read_skill.py, reason: Planned shared protection integration for long document sections.}
    - {path: frontend/packages/openmates-cli/src/storage.ts, reason: Planned removal of the misleading session-save decryption notice.}
    - {path: backend/tests/test_app_skill_output_safety.py, reason: Planned red and green shared safety contract coverage.}
    - {path: frontend/apps/web_app/tests/app-skill-safety.spec.ts, reason: Planned deployed CLI and web proof contract.}
  rollout:
    - Scoped dev deployment and coordinated API/affected-worker restart before live verification.
    - No production deployment in this task; no security-disabled performance shortcut.
  verification_order:
    - Focused red unit/contract tests and baseline real-model corpus evidence.
    - Backend implementation, scoped dev deployment, then authenticated direct REST verification.
    - CLI storage regression and real CLI command/proof against dev.
    - npm and pip SDK parity against the same dev endpoints.
    - Wire CI/daily regression only after real REST, CLI, and SDK checks pass.
    - Deployed web skill proof on phone and laptop, then user confirmation and Apple parity last.
  documentation_impact:
    - Update shared prompt-injection architecture and skill safety/error documentation.
    - Regenerate Specification indexes and replace affected assertion evidence.
  verification_strategy:
    - Add focused red tests for shared decisions, atomic failure, and cross-surface coverage before implementation.
    - Run real authenticated dev REST, CLI, and SDK checks before deployed web proof.
    - Run fixed-corpus quality and real-provider latency gates without masking failed attempts.
    - Deploy only after prior gates are green, then capture reviewed CLI and phone/laptop proof.

risks:
  - Safety model classification or long-context behavior may miss mandatory adversarial cases; a failure blocks completion.
  - Field boundaries can split attacks; include cross-snippet and section-boundary fixtures before rollout.
  - Provider latency may exceed approved p95 gates; report shortfall rather than remove slow attempts.
  - Shared changes affect other external-data skills; audit all sanitizer entry points before removing local calls.
  - Live search outputs can change between baseline and candidate; fixed-corpus quality and live timing remain separate evidence.

scenarios:
  - id: S-1
    title: One safe batch with complete injection removal
    given: [A six-result response contains benign text and one instruction-bearing snippet.]
    when: [The protected skill executes through a supported surface.]
    then: [One semantic call classifies every selected unit., The whole flagged snippet becomes the fixed warning and unaffected text remains unchanged.]
  - id: S-2
    title: Unreliable scanner never exposes unchecked content
    given: [A scan is unavailable or times out or returns invalid decisions.]
    when: [The shared deadline or validator rejects it.]
    then: [No payload is partially mutated or exposed., A safe retryable error is returned without automatic retries.]
  - id: S-3
    title: Long and cross-surface output remains protected
    given: [A web/read document or another external-data skill spans multiple units.]
    when: [REST or assistant or Workflow dispatch processes the result.]
    then: [All required units receive bounded coverage., No provider-supplied trust flag or ignored-field claim bypasses scanning.]
  - id: S-4
    title: Fast truthful search command
    given: [The CLI has a protected stored session and dev services are warm.]
    when: [A normal single-query search executes.]
    then: [No session-save decryption notice appears., JSON output stays clean., Approved quality and latency gates are met.]

