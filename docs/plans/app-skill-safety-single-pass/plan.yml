    - The measured successful search spent about 10.85 seconds in 36 semantic calls.
    - A returned snippet retained its behavioral instruction after a removal marker.
    - Current batching tests require the now-superseded per-field fallback.
    - Existing skill-web-search E2E uses provider fixtures; it cannot prove live latency or model quality.
    - The previous standalone REST test credential returned 401; authenticated REST preflight must be repaired or use an approved existing first-party session without exposing credentials.

