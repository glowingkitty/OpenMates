  subject_commit: a32637da0d6749191108ab3f7fb19b1b7ca5b24f

scope:
  in:
    - Structured field decisions, deterministic whole-unit warnings, atomic validation and finite deadlines.
    - One shared logical safety boundary across REST, assistant, and Workflow dispatch with request-local trusted coverage.
    - Eliminate duplicate semantic work, including web/search and web/read skill-local TOON redaction.
    - Preserve long-document protection, deterministic ASCII cleanup, and existing explicit programmatic opt-out policy.
    - Remove session-save decryption notices without changing authentication or encryption.
    - Fixed-corpus quality evaluation, real-provider latency measurements, and deployed cross-client proof.
  out:
    - Disabling search protection to meet latency targets.
    - Silent model changes, cross-request safety caching, billing redesign, or new public endpoints.
    - New UI configuration, safety opt-out controls, or unrelated visual redesign.

