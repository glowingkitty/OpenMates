    type: pytest
    file: backend/tests/test_single_pass_output_safety.py
    command: python3 -m pytest backend/tests/test_single_pass_output_safety.py
    covers: [AC-1]
    assertions: [All registered external skills defer local scans and apply ASCII cleanup before one semantic call; failure returns cleaned content.]
    red_phase: {required: false, expected: fail, evidence: {status: skipped, reason: Prior live false-positive evidence establishes the defect.}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, result: Focused scanner suite passed 194 checks.}}
