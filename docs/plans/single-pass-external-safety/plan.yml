schema_version: 2
id: single-pass-external-safety
title: Single-pass external content safety with availability-preserving fallback
status: approved
goal: >
  Implement and test the new shared prompt injection system, its token and money
  costs, processing delay versus disabled detection, and reliability including
  the original video example.
approved_design:
  - User approved one model call per external skill result, no retries or user input.
  - ASCII-smuggling cleanup precedes semantic detection and remains on failure or explicit opt-out.
  - Exact verified injection spans are redacted; safe and uncertain text is preserved.
  - Scanner failures and oversized inputs return cleaned content and are logged as unscanned.
  - Preserve existing external skill and field coverage across REST, CLI/SDK, assistant, Workflow, and background helpers.
  - Keep gpt-oss-safeguard-20b and measure before considering a model change.
scope:
  in:
    - Shared classifier, structured field sanitization, local helper deferral and REST opt-out preservation.
    - Focused unit and API coverage, isolated CI, dev deployment and explicit dev global-CLI benchmark.
    - Token/cost accounting, paired latency measurements and benign/adversarial reliability evaluation.
  out:
    - Changing downstream tool authorization or introducing additional semantic model calls.
checks:
  - Focused scanner, fallback, all-registered-skills, cancellation, helper-deferral and REST tests.
  - Real model evaluation on versioned cases and both supplied transcript files, with repeated runs.
  - Live global CLI requests with detection enabled and disabled; report changed provider responses.
  - Report failed/unscanned requests separately from successful classifications and latency samples.
authorization:
  source: User approved the processing design and explicitly requested implementation and testing in this conversation.
  dev_cli: User specifically requested use of globally installed openmates on the dev server.
scenarios:
  - id: S-1
    title: Available external data with one semantic scan
    given: [An external app skill returns multiline text.]
    when: [The shared output safety boundary handles the result.]
    then: [ASCII cleanup runs first and at most one model call produces verified span redactions or logged fail-open delivery.]
acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Existing selected external fields use one call with exact span removal and fail-open delivery, measured on both original transcripts and synthetic attacks.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-SAFETY]
tests:
