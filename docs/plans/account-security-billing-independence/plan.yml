schema_version: 2
id: account-security-billing-independence
title: Account Security Independence From Billing
status: approved

goal: >
  Keep account authentication and security settings available in every OpenMates
  edition without loading payment code, while requiring official dev to boot with
  the private OpenMatesCloud billing overlay and making authentication capability
  failures explicit and retryable instead of reporting false account state.

scope:
  in:
    - Move authentication-method discovery from `/v1/payments/user-auth-methods` to an always-registered auth route.
    - Remove the old payments route and migrate web, OpenMates CLI, and Apple clients together.
    - Keep password, passkey, 2FA, recovery-key, email-change, account-deletion, and protected-personal-data settings usable in billing-free self-hosted installs.
    - Return a retryable service failure when authentication records cannot be read; never convert storage failures into false capability flags.
    - Add visible retry states to affected web settings flows and preserve explicit native errors.
    - Require the official dev deployment to mount and enable the private OpenMatesCloud overlay.
    - Add deterministic route-boundary, self-host, official-dev overlay, CLI, web, and Apple regression coverage.
    - Rerun the relevant authentication and account-security regression suites after deployment.
  out:
    - Changing password, passkey, 2FA, recovery-key, or encryption formats.
    - Changing authentication policy or weakening reauthentication requirements.
    - Adding payment functionality to self-hosted installations.
    - Keeping a compatibility alias under `/v1/payments`; payment routes remain payment-only.
    - Exposing authentication capability state through developer API keys or public OpenAPI.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401, so no GitHub issue result was available.
  reported_issues:
    - Issue 77CRV on dev reports that the Password settings section does not load.
  docs:
    - docs/plans/openmatescloud-billing-overlay/plan.yml
    - docs/plans/apple-auth-security-parity/plan.yml
    - docs/contributing/guides/spec-driven-development.md
    - .claude/rules/backend.md
    - .claude/rules/testing.md
  code_patterns:
    - backend/core/api/app/routes/auth.py
    - backend/core/api/app/routes/auth_routes/auth_password.py
    - backend/core/api/app/routes/payments.py
    - backend/core/api/app/utils/server_mode.py
    - backend/core/api/main.py
    - backend/core/docker-compose.yml
    - ../OpenMatesCloud/docker-compose.openmatescloud.yml
    - frontend/packages/ui/src/config/api.ts
    - frontend/packages/ui/src/components/settings/security/SettingsPassword.svelte
    - frontend/packages/openmates-cli/src/client.ts
    - apple/OpenMates/Sources/Features/Settings/Services/AccountSecurityService.swift
  tests:
    - backend/tests/test_openmatescloud_overlay_packaging.py
    - scripts/api_tests/test_cloud_overlay_boot.py
    - frontend/apps/web_app/tests/selfhost-smoke.spec.ts
    - frontend/apps/web_app/tests/recovery-key-settings.spec.ts
    - frontend/apps/web_app/tests/settings-change-email.spec.ts
    - frontend/apps/web_app/tests/backup-codes-settings.spec.ts
    - frontend/apps/web_app/tests/signup-skip-2fa-flow.spec.ts
  verified_findings:
    - The dev API container has cloud overlay opt-in disabled even though its domain is payment-eligible.
    - The running dev Compose project includes core and override files but not the sibling OpenMatesCloud overlay Compose file.
    - The official cloud overlay boot script fails because dev does not report payment enabled.
    - Authentication-method discovery reads only core Directus authentication records and does not require payment services.
    - Seven non-billing web settings flows plus CLI and Apple call the payments-scoped endpoint.
    - The Password page becomes blank after endpoint failure because it leaves `currentStep` at `loading` after `isLoading` becomes false.

clarification:
  rounds:
    - question: Should the billing-scoped endpoint remain as a compatibility alias?
      answer: No. User-auth-method discovery is an auth endpoint and must move to auth; payments is for payments only.
    - question: What should the UI report when authentication-method storage cannot be read?
      answer: Show a visible retryable failure and never claim that no password or other method is configured merely because loading failed.
    - question: How should official dev run billing functionality?
      answer: Official dev must use the private OpenMatesCloud repository and its billing overlay.
  vision_summary: >
    Core account security is edition-independent and fail-closed. Self-hosted users
    retain all non-billing security controls without payment code, while official
    dev always boots with and verifies the private billing overlay. Web, CLI, and
    Apple migrate to the auth contract together with no payments alias.
  approved_by_user: true

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Settings/Services/AccountSecurityService.swift
    - apple/OpenMates/Sources/Features/Settings/Views/SettingsSubPages.swift
    - apple/OpenMatesTests/AuthSecurityParityTests.swift
  parity_expectations:
    - Apple reads auth capabilities from the same always-registered auth endpoint as web and CLI.
    - Apple shows an explicit error and does not infer false capability state when loading fails.
    - Existing password, 2FA, and recovery semantics remain unchanged.
  verification:
    - Run the targeted Apple auth/security unit tests remotely after web verification and user confirmation.
    - Run a remote iOS simulator build after the endpoint migration.
  intentional_native_differences:
    - Apple uses native credential prompts where required by the operating system.

