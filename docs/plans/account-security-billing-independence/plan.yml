  - id: T-ROUTE-BOUNDARY
    type: pytest
    file: backend/tests/test_openmatescloud_overlay_packaging.py
    covers: [AC-4]
    command: python3 -m pytest backend/tests/test_openmatescloud_overlay_packaging.py
    assertions:
      - Auth-method discovery is defined under auth and absent from payments.
      - Core/self-host route registration does not import the cloud billing overlay.
    red_phase: {required: true, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-API-AUTH-METHODS
    type: pytest
    file: backend/tests/test_auth_methods.py
    covers: [AC-1, AC-2]
    command: python3 -m pytest backend/tests/test_auth_methods.py && python3 scripts/api_tests/test_auth_methods.py --api-url https://api.dev.openmates.org
    assertions:
      - Authenticated capability shape and values are correct.
      - Unauthenticated access returns 401.
      - Any required Directus read failure returns 503.
      - Endpoint works without cloud billing services.
    red_phase: {required: true, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-SELFHOST-SECURITY
    type: unit
    file: frontend/apps/web_app/tests/selfhost-smoke.spec.ts
    covers: [AC-1]
    command: python3 scripts/tests.py run --spec selfhost-smoke.spec.ts
    assertions:
      - Self-host signup can open Password settings and receives auth capabilities from `/v1/auth/methods`.
      - Security traffic does not call `/v1/payments/*`.
      - Billing remains unavailable.
    red_phase: {required: true, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-CLI-AUTH-METHODS
    type: unit
    file: frontend/packages/openmates-cli/tests/client.test.ts
    covers: [AC-1, AC-4]
    command: python3 scripts/audit_sdk_cli_parity.py && npm --prefix frontend/packages/openmates-cli test
    assertions:
      - CLI auth capability helper uses `/v1/auth/methods` with first-party session auth.
      - No CLI auth capability request uses `/v1/payments`.
    red_phase: {required: true, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-WEB-PASSWORD-SETTINGS
    type: playwright
    file: frontend/apps/web_app/tests/recovery-key-settings.spec.ts
    target: app.dev.openmates.org
    covers: [AC-2, AC-5]
    command: python3 scripts/tests.py run --spec recovery-key-settings.spec.ts
    assertions:
      - Password settings loads a real auth state before the recovery-key journey continues.
      - Auth-method requests use `/v1/auth/methods` and return success.
      - A service failure shows Retry and never produces a blank page or false not-configured state.
    red_phase: {required: true, expected: fail, evidence: {status: not_run}}
    green_phase: {required: true, expected: pass_after_deploy, evidence: {status: not_run}}
  - id: T-OFFICIAL-DEV-OVERLAY
    type: pytest
    file: scripts/api_tests/test_cloud_overlay_boot.py
    covers: [AC-3]
    command: python3 scripts/api_tests/test_cloud_overlay_boot.py --api-url https://api.dev.openmates.org --cli-overlay --redact
    assertions:
      - Official dev reports official-cloud mode and payments enabled.
      - OpenMatesCloud package markers exist on API and worker containers.
      - Billing webhook route is registered and stops invalid input at signature validation.
    red_phase:
      required: true
      expected: fail
      evidence:
        status: failed
        command: python3 scripts/api_tests/test_cloud_overlay_boot.py --api-url https://api.dev.openmates.org --cli-overlay --redact
        run_id: local-2026-08-04-overlay-disabled
        timestamp: "2026-08-04T00:00:00Z"
        summary: Official dev reported payment disabled because the cloud overlay was not included.
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-AUTH-REGRESSION
    type: manual
    file: frontend/apps/web_app/tests/
    covers: [AC-5]
    command: python3 scripts/tests.py run --spec <each-scoped-auth-security-spec>
    assertions:
      - Relevant login, password, passkey, 2FA, backup-code, recovery-key, email-change, account-recovery, account-deletion, location-security, and session-security specs pass.
    red_phase: {required: false, expected: fail, evidence: {status: not_required}}
    green_phase: {required: true, expected: pass, evidence: {status: not_run}}
  - id: T-APPLE-AUTH-SECURITY
