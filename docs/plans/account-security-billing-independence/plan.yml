approvals:
  specification:
    status: approved
    approved_at: "2026-08-04T00:00:00Z"
  plan:
    status: approved
    approved_at: "2026-08-04T00:00:00Z"
    reason: The user explicitly requested creation and implementation of the approved spec.

decisions:
  - id: D-1
    status: active
    decision: Authentication-method discovery belongs under the always-registered auth router, with no payments alias.
    reason: Account security must not depend on billing availability, and payment routes must contain payment behavior only.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: active
    decision: Authentication storage failures return a retryable service error and clients preserve unknown state.
    reason: Reporting false capabilities can mislead or lock out users and is not a valid fallback.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: active
    decision: Official dev uses the sibling private OpenMatesCloud Compose overlay; self-host keeps the overlay disabled.
    reason: Billing is official-cloud-only, while core account security is shared by every edition.
    decided_at: "2026-08-04T00:00:00Z"

assumptions:
  - id: A-1
    text: The sibling OpenMatesCloud checkout and overlay Compose file are available on the official dev host.
    status: confirmed
    required_before: task_execution
    evidence:
      - The sibling repository and `docker-compose.openmatescloud.yml` exist locally.
  - id: A-2
    text: Existing authenticated first-party session handling is suitable for the capability endpoint.
    status: confirmed
    required_before: implementation
    evidence:
      - The old handler already uses `get_current_user` and is excluded from public OpenAPI.

scenarios:
  - id: S-1
    title: Self-hosted account security works without billing
    given:
      - A self-hosted server runs with the OpenMatesCloud overlay disabled.
      - An authenticated user has password and optionally passkey, 2FA, and recovery-key records.
    when:
      - Web, CLI, or Apple requests authentication capabilities and opens account security settings.
    then:
      - The auth endpoint returns the correct capabilities without importing payment code.
      - Password, 2FA, recovery-key, email-change, account-deletion, and protected-data flows can reach their required reauthentication UI.
      - No payment route or payment provider is required.
  - id: S-2
    title: Authentication storage failure remains unknown and retryable
    given:
      - An authenticated user opens an affected security page.
      - Directus cannot read one or more required authentication records.
    when:
      - The client requests authentication capabilities.
    then:
      - The API returns a retryable service error rather than a successful all-false response.
      - The client shows an error with Retry and disables sensitive actions.
      - The client does not state that a password, passkey, 2FA method, or recovery key is absent.
  - id: S-3
    title: Official dev requires the private cloud overlay
    given:
      - The official dev domain is payment-eligible.
    when:
      - The dev stack is started or verified.
    then:
      - The sibling OpenMatesCloud Compose overlay is included.
      - API and worker containers expose overlay markers and billing routes are registered.
      - A core-only official dev boot fails its deterministic health gate instead of silently operating as self-hosted.
  - id: S-4
    title: Payments remains payment-only
    given:
      - Current web, CLI, and Apple clients have migrated.
    when:
      - Route and source-boundary tests inspect the application.
    then:
      - "`/v1/payments/user-auth-methods` does not exist."
      - No non-billing settings component or account-security client calls a payments endpoint for authentication state.
  - id: S-5
    title: Existing auth and account-security journeys remain green
    given:
      - The implementation is deployed to official dev.
    when:
      - Relevant API, CLI, web, self-host, and Apple checks run in the required order.
    then:
      - Password, login, 2FA, backup-code, recovery-key, email-change, account recovery, account deletion, passkey, and session security checks pass or have explicit unrelated blockers.

