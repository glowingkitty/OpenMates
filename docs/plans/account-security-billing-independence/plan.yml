implementation_notes:
  plan_path: docs/plans/account-security-billing-independence/plan.yml
  existing_patterns:
    - The always-registered `/v1/auth` router composes focused auth route modules.
    - "`get_current_user`, `get_directus_service`, and the shared limiter already enforce the old endpoint contract."
    - The OpenMates CLI owns official-cloud Compose planning and already appends the sibling overlay in official-cloud mode.
    - Settings pages use `SecurityAuth` after capability discovery; explicit unknown/error state must precede it.
    - Apple centralizes the endpoint in `AccountSecurityService.authMethods()`.
  architecture: >
    Move the existing capability query into a focused auth route module and make
    all four Directus reads mandatory for a successful response. Add one shared
    frontend capability loader/store shape so pages preserve loading, loaded, and
    failed states. Migrate CLI and Apple directly, remove the payments handler,
    and enforce official-dev overlay composition through the existing CLI plan and
    boot smoke rather than weakening the fail-closed core default.
  data_flow:
    - An authenticated first-party client calls `GET /v1/auth/methods`.
    - The API resolves the current user and reads passkey, 2FA, password, and recovery-key records from core Directus storage.
    - All reads succeed and the API returns four booleans, or any required read fails and the API returns 503.
    - Web, CLI, and Apple preserve unknown state until a successful response and expose retry on failure.
    - Self-host never loads OpenMatesCloud; official dev starts core Compose plus the sibling overlay Compose and passes the overlay smoke gate.
  api_security:
    - First-party session-authenticated endpoint, excluded from public OpenAPI.
    - Current-user owner scope only, 30/minute, no credits or billing dependency.
    - Capability booleans only; no credential, key, encrypted payload, or plaintext content.
  rollout:
    - Land route and all current client migrations in one deployment because no old payments alias remains.
    - Restart the local API with official-cloud overlay composition before live REST and Playwright verification.
    - Keep self-host templates explicitly overlay-disabled and verify security there independently.
  observability:
    - Log a sanitized auth-method storage failure without capability values or user identifiers.
    - Preserve browser/native error diagnostics without secrets.
    - Make overlay boot failure deterministic through `test_cloud_overlay_boot.py`.
  affected_files:
    - path: backend/core/api/app/routes/auth_routes/auth_methods.py
      reason: Focused always-registered capability contract.
    - path: backend/core/api/app/routes/auth.py
      reason: Register the capability router under `/v1/auth`.
    - path: backend/core/api/app/routes/payments.py
      reason: Remove non-payment handler and response model.
    - path: backend/tests/test_auth_methods.py
      reason: Handler success, authorization, and fail-closed storage coverage.
    - path: backend/tests/test_openmatescloud_overlay_packaging.py
      reason: Deterministic auth/payment route-boundary and overlay guard coverage.
    - path: scripts/api_tests/test_auth_methods.py
      reason: Real dev REST proof with first-party authentication.
    - path: frontend/packages/ui/src/config/api.ts
      reason: Move endpoint metadata from payments to auth.
    - path: frontend/packages/ui/src/services/authMethodsService.ts
      reason: Shared typed loader and error contract for settings consumers.
    - path: frontend/packages/ui/src/components/settings/
      reason: Migrate seven affected settings consumers and add visible retry states.
    - path: frontend/apps/web_app/tests/selfhost-smoke.spec.ts
      reason: Billing-free account-security regression.
    - path: frontend/apps/web_app/tests/recovery-key-settings.spec.ts
      reason: Deployed Password-page load and fail-closed UI regression.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Migrate first-party CLI capability request.
    - path: frontend/packages/openmates-cli/tests/client.test.ts
      reason: CLI path regression.
    - path: apple/OpenMates/Sources/Features/Settings/Services/AccountSecurityService.swift
      reason: Migrate native capability request.
    - path: apple/OpenMatesTests/AuthSecurityParityTests.swift
      reason: Native endpoint and failure-state regression.
    - path: docs/plans/openmatescloud-billing-overlay/plan.yml
      reason: Record corrected official-dev rollout requirement and evidence.
    - path: ../OpenMatesCloud/docker-compose.openmatescloud.yml
      reason: Make inclusion of the official-cloud overlay explicitly enable billing on API and worker services.
    - path: ../OpenMatesCloud/backend/tests/test_overlay_compose.py
      reason: Guard the official-cloud enabled marker on every overlaid core service.
  verification_strategy:
    - Validate this spec and run focused backend red tests.
    - Restart API with official-cloud overlay, then prove live REST 200/401 behavior.
    - Run CLI parity and client tests against dev.
    - Run self-host smoke through its dedicated workflow.
    - Deploy web and run Password, recovery, 2FA, email, account, login, passkey, and session specs through the test control plane.
    - Review laptop and mobile Password settings screenshots.
    - Obtain user confirmation, then run remote Apple tests/build last.
  verification_order:
    - Spec validation and red backend boundary tests.
    - Core API implementation and live dev REST proof.
    - CLI migration and real dev-server proof.
    - Self-host smoke and web implementation.
    - Scoped deploy, Playwright security regressions, and reviewed visual smoke.
    - User confirmation.
    - Apple endpoint migration, remote tests, and build.
    - Final spec verification.
  ac_coverage:
    AC-1: [T-API-AUTH-METHODS, T-SELFHOST-SECURITY, T-CLI-AUTH-METHODS]
    AC-2: [T-API-AUTH-METHODS, T-WEB-PASSWORD-SETTINGS, T-APPLE-AUTH-SECURITY, V-UI-VISUAL-SMOKE]
    AC-3: [T-OFFICIAL-DEV-OVERLAY]
    AC-4: [T-ROUTE-BOUNDARY, T-CLI-AUTH-METHODS, T-APPLE-AUTH-SECURITY]
    AC-5: [T-AUTH-REGRESSION, T-WEB-PASSWORD-SETTINGS, T-APPLE-AUTH-SECURITY, V-UI-VISUAL-SMOKE]
  first_slice: Add failing backend boundary and handler tests before moving the endpoint.
  material_new_decisions: none; the plan implements the user-approved route, failure, edition, and rollout decisions.

