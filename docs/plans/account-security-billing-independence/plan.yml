api_contract:
  endpoint: GET /v1/auth/methods
  classification: first-party client surface only
  auth: Authenticated user session cookie or approved first-party CLI/native session headers.
  owner_scope: Capabilities are read only for the current authenticated user.
  rate_limit: 30/minute per existing limiter behavior.
  credit_budget: none
  request_data: none
  response_data:
    - has_passkey boolean
    - has_2fa boolean
    - has_password boolean
    - has_recovery_key boolean
  encryption_boundary: Returns capability booleans only; no encrypted payload, decrypted plaintext, credential, key, or secret material.
  failure_contract:
    - 401 when no valid first-party session exists.
    - 503 when required authentication storage cannot be read.
    - No partial-success or all-false fallback after storage errors.
  public_openapi: false

privacy_security:
  - Do not log capability values with user identifiers or any credential material.
  - Preserve current owner scoping through `get_current_user`.
  - Sensitive actions remain disabled until capability state is known.
  - Tests use synthetic or isolated test accounts and never record passwords, OTP seeds, recovery keys, or session tokens in committed evidence.

