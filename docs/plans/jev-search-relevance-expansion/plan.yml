decisions:
  - id: D-1
    status: active
    decision: Maps, shopping products, and travel stays rank at most twenty candidates from one provider request or first page.
    reason: Forty requires additional billable or rate-limited provider requests for at least one provider in each skill family.
    decided_at: "2026-09-23T18:24:00Z"
  - id: D-2
    status: active
    decision: Videos rank up to forty candidates from one Brave Videos call and existing at-most-fifty-item YouTube metadata batches.
    reason: Brave supports fifty results per request, so forty does not consume a second Brave query.
    decided_at: "2026-09-23T18:24:00Z"
  - id: D-3
    status: active
    decision: Fitness location and class searches rank up to forty candidates from provider pages already fetched by the existing client.
    reason: The current client retrieves and enriches its page/date candidates before applying the local limit.
    decided_at: "2026-09-23T18:24:00Z"
  - id: D-4
    status: active
    decision: Every skill keeps its existing deterministic retrieval path when relevance_criteria is absent or blank.
    reason: Optional ranking must not add latency, provider use, or preferences to plain searches.
    decided_at: "2026-09-23T18:24:00Z"
  - id: D-5
    status: active
    decision: Any Jev, schema, or timeout failure returns the requested count in unchanged pre-ranking provider order.
    reason: Internal candidate pools must never leak into embeds or later AI context.
    decided_at: "2026-09-23T18:24:00Z"

implementation_state:
  subject_commit: d85bbe6f52ed5631ea2cc971949210f10386ff36

scenarios:
  - id: S-1
    title: Cost-aware purpose ranking
    given: [A newly eligible search includes nonblank relevance criteria.]
    when: [The provider returns candidates that satisfy structured filters.]
    then:
      - The skill uses its approved twenty- or forty-candidate profile without ranking-only pagination.
      - One domain-specific Jev decision ranks the pool and only the requested count is returned.
  - id: S-2
    title: Plain search and ranking failure stay bounded
    given: [Relevance criteria are absent or Jev fails after provider retrieval.]
    when: [The skill finalizes results.]
    then:
      - Plain searches preserve existing retrieval and make no Jev call.
      - Failures preserve provider order and return only the requested count.
  - id: S-3
    title: Public surface parity and inferred criteria
    given: [A caller uses assistant, REST, typed CLI, JSON CLI, npm SDK, or pip SDK.]
    when: [The caller supplies or clearly implies a material ranking goal.]
    then:
      - Every surface accepts the same optional relevance_criteria field.
      - Assistant inference is faithful and plain controls do not gain invented preferences.

