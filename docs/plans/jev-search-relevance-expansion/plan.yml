schema_version: 2
id: jev-search-relevance-expansion
title: Expand Optional Jev Search Relevance Ranking
status: verified

goal: >
  Fix CLI, SDK, and REST schema parity for relevance_criteria and extend the
  approved optional Jev filtering behavior to maps, shopping products, travel
  stays, videos, and fitness location/class search, using forty candidates only
  when that does not add provider requests or material rate-limit cost and twenty
  otherwise. Tune each skill's ranking instructions against real provider data,
  preserve existing public result limits, and return only the requested count on
  success or fallback.

scope:
  in:
    - Regenerated npm/pip app-skill metadata and typed CLI --relevance-criteria support.
    - REST/OpenAPI request schema parity from each app.yml and Pydantic request model.
    - Twenty-candidate maps, shopping-product, and travel-stay profiles without ranking-only pagination.
    - Forty-candidate video and fitness profiles without additional provider-page requests.
    - Skill-specific minimized projections, evidence rubrics, deterministic fallback, and final requested-count clipping.
    - Focused backend, CLI/SDK generator, REST schema, and app-skill E2E contract coverage.
    - Real public-provider/Jev probes recording quality, candidate count, latency, and token use.
  out:
    - Social-media ranking, because async multi-provider aggregation and comment hydration need a separate rate-limit design.
    - Health appointment ranking or clinical suitability decisions.
    - Changes to public result-limit defaults, hard filters, provider attribution, billing, or output-safety policy.

