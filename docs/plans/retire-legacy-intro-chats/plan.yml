schema_version: 2
id: retire-legacy-intro-chats
title: Retire Legacy Intro Chats And Align Product Positioning
status: implementing

specification_refs:
  - id: feature.landing-onboarding
    version: 3
    fingerprint: 2fabfce4b17e391345e0c264efd61821a9da44c9cdea71ade627e12563194862
  - id: feature.public-example-chats
    version: 4
    fingerprint: e53c1ac327993825e19716c865be2aff5f1e37dd8f79f1f01035d1113463ec4e

specification_impact:
  classification: behavior_change
  specification_update_required: true
  affected_assertions:
    - landing-onboarding.uses-real-chat-shell
    - landing-onboarding.legacy-intros-retired
    - landing-onboarding.primary-slogan-consistent
    - public-example-chats.catalog.discoverable
  reason: The approved Specifications replace public intro chats with neutral guest onboarding plus real example chats.

documentation_impact:
  generated_reference: {status: update_required, reason: Approved Specification bundles changed., documents: []}
  user_docs:
    status: update_required
    reason: Demo-chat documentation and README links must stop advertising retired intro chats.
    documents: [README.md, docs/user-guide/demo-chats.md]
  semantic_layer: {status: update_required, reason: Landing and public-example Specifications changed.}

goal: >
  Keep “Your AI team for getting things done” on visible headline surfaces, use
  the approved agentic-operating-system description in English SEO metadata,
  preserve the existing logged-out onboarding slides and real example-chat
  discovery, and safely retire the For everyone and For developers public intro
  chats across web, backend compatibility, SEO, and Apple catalogs.

scope:
  in:
    - Website SEO, Open Graph, and Twitter description updates while visible headline and README copy remain unchanged.
    - Neutral guest-onboarding translations and runtime data independent of public intro-chat content.
    - Removal of both intro chats from web and Apple catalogs, discovery, special rendering, SEO content, and sitemap.
    - Compatibility handling for old path and fragment links.
    - Neutral auth-recovery last_opened behavior instead of demo-for-everyone.
    - Focused web and backend verification plus deployed web proof.
  out:
    - Manual social-media, Luma, Meetup, Eventbrite, Discord, and YouTube account edits.
    - New docs.openmates.org information architecture, user-guide landing page, or blog.
    - Apple builds, Apple tests, or Apple proof in this speed-focused slice.
    - Removing the unrelated Directus demo_chats collection or Vault bootstrap key.
    - Rewriting historical release notes, completed plans, or archived evidence.

clarification:
  rounds:
    - question: Should the existing onboarding slides remain while both legacy public intro chats are removed?
      answer: Yes. Keep the normal unauthenticated app shell, slides, and real example-chat exploration.
    - question: Should Apple verification run in this slice?
      answer: No. Update or remove Apple references without spending time on Apple builds or tests.
  vision_summary: >
    Logged-out users continue to see the real web app welcome surface and product-story slides,
    followed by real example chats. Legacy intro-chat content, discovery, and routes are retired;
    docs and blog architecture remain future decisions.
  approved_by_user: true

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/App/MainAppView.swift
    - apple/OpenMates/Sources/Features/Chat/ViewModels/ChatViewModel.swift
    - apple/OpenMates/Sources/Features/Chat/Views/ChatView.swift
    - apple/OpenMates/Sources/Features/Settings/Views/SettingsView.swift
    - apple/OpenMates/Sources/Shared/Components/ChatListRow.swift
    - apple/OpenMates/Sources/Shared/Components/RichMarkdownRenderer.swift
    - apple/OpenMatesUITests/ChatFlowParityUITests.swift
  parity_expectations:
    - Apple no longer catalogs or recommends either retired intro chat.
    - Apple keeps its existing logged-out onboarding slides and real example-chat discovery.
  verification:
    - waived_by_user: Apple builds and tests explicitly skipped to prioritize web delivery speed.
  intentional_native_differences: [No new native feature is introduced.]

scenarios:
  - id: S-1
    title: Fresh guest sees onboarding and real examples
    given: [A logged-out visitor opens /.]
    when: [The welcome surface renders and onboarding advances.]
    then:
      - No public chat is active and no chat hash is written.
      - The existing full-height and compact product-story slides remain.
      - Real example-* chats remain available for exploration.
  - id: S-2
    title: Retired links recover safely
    given: [A visitor opens an old /intro path or demo-for-* hash link.]
    when: [The route or client deep-link compatibility handler resolves it.]
    then:
      - The visitor reaches the neutral root welcome state.
      - The retired hash is cleared and no missing-chat error appears.
  - id: S-3
    title: Authentication recovery uses neutral state
    given: [An account finishes an OTP or backup-code recovery path from an early-signup route.]
    when: [The backend normalizes last_opened.]
    then: [Neither retired demo ID is persisted or returned as the recovery target.]
  - id: S-4
    title: Headlines and SEO descriptions use distinct approved copy
    given: [An English visitor or developer reads a primary OpenMates product surface.]
    when: [Landing metadata or visible headline surfaces render.]
    then:
      - Visible headlines use “Your AI team for getting things done”.
      - SEO description fields use the approved agentic-operating-system description.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    specification_assertions: [landing-onboarding.uses-real-chat-shell, public-example-chats.catalog.discoverable]
    text: Fresh logged-out web onboarding is unchanged structurally and exposes real examples without either retired intro chat.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-WEB]
  - id: AC-2
    scenario: S-2
    specification_assertions: [landing-onboarding.legacy-intros-retired]
    text: Old intro paths and fragment IDs reach the neutral welcome state without errors and are absent from sitemap and discovery.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: playwright
    verification_ids: [T-WEB]
  - id: AC-3
    scenario: S-3
    specification_assertions: [landing-onboarding.legacy-intros-retired]
    text: Auth recovery no longer writes either retired public-chat ID.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: related_backend
    verification_ids: [T-BACKEND]
  - id: AC-4
    scenario: S-4
    specification_assertions: [landing-onboarding.primary-slogan-consistent]
    text: Visible headline copy remains unchanged while approved English SEO description fields use the longer agentic-operating-system description.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: manual
    verification_ids: [T-POSITIONING]

contracts:
  api:
    changed_endpoints:
      - route: Existing /auth/login completion paths
        access_model: first-party client surface only
        auth: Existing login and recovery authentication requirements are unchanged.
        rate_limits: Existing auth limits are unchanged.
        credits: none
        encryption_boundary: Existing client-wrapped account material is unchanged; only non-sensitive last_opened routing metadata changes.
        contract_change: No request or response schema change; early-signup recovery selects neutral new-chat state.
  data:
    - Existing demo-for-everyone last_opened values remain tolerated as legacy input and resolve to neutral new-chat state.
    - No destructive bulk migration or Directus schema change is required.
  ui:
    - Guest onboarding is a first-class neutral welcome surface, not a public chat.
    - Public discovery contains real example-* chats and no retired demo-for-* entries.
    - Visible landing and social-preview image headlines remain unchanged; only metadata descriptions use the longer positioning copy.

tests:
  - id: T-POSITIONING
    type: lint
    specification_assertions: [landing-onboarding.primary-slogan-consistent]
    file: README.md
    command: npm --prefix frontend/packages/ui run build:translations
    covers: [AC-4]
    assertions: [Canonical translations build, visible headline sources retain the short slogan, and English metadata descriptions contain the approved longer copy.]
    red_phase: {required: false, expected: not_captured, evidence: {status: waived, reason: Mechanical copy alignment.}}
    green_phase: {required: true, expected: pass, evidence: {status: pending, command: "", run_id: "", subject_commit: "", timestamp: ""}}
  - id: T-BACKEND
    type: pytest
    specification_assertions: [landing-onboarding.legacy-intros-retired]
    file: backend/tests/test_retired_intro_chat_recovery.py
    command: python3 -m pytest backend/tests/test_retired_intro_chat_recovery.py
    covers: [AC-3]
    assertions: [OTP and backup-code recovery use neutral new-chat state instead of either retired ID.]
    red_phase: {required: false, expected: not_captured, evidence: {status: waived, reason: Implementation started before this consolidated Plan was created.}}
    green_phase: {required: true, expected: pass, evidence: {status: pending, command: "", run_id: "", subject_commit: "", timestamp: ""}}
  - id: T-WEB
    type: playwright
    specification_assertions: [landing-onboarding.uses-real-chat-shell, landing-onboarding.legacy-intros-retired, public-example-chats.catalog.discoverable]
    file: frontend/apps/web_app/tests/guest-interest-smart-selection.spec.ts
    command: python3 scripts/tests.py run --spec guest-interest-smart-selection.spec.ts --gate-deploy --expected-commit <COMMIT_SHA>
    target: app.dev.openmates.org
    covers: [AC-1, AC-2]
    assertions: [Fresh guest onboarding remains hash-free with real examples, retired hashes recover to welcome, and retired intro chats are absent.]
    red_phase: {required: false, expected: not_captured, evidence: {status: waived, reason: Implementation started before this consolidated Plan was created.}}
    green_phase: {required: true, expected: pass_after_deploy, evidence: {status: pending, command: "", run_id: "", subject_commit: "", timestamp: ""}}

