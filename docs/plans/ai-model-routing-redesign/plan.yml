implementation_notes:
  plan_path: docs/plans/ai-model-routing-redesign/plan.yml
  architecture: >
    Tier defaults remain authenticated-user fields on the existing settings path,
    extended compatibly from simple/complex to simple/complex/most-demanding. Add
    Directus user_chat_preferences as the sole durable chat-selection store, with
    unique(hashed_user_id, chat_id), encrypted_selected_ai_model Format D
    master-key ciphertext, preference_v compare-and-set version, and updated_at.
    The client produces ciphertext locally and persists only Auto or an approved
    stable exact model variant ID; Directus and the API never persist plaintext.
    The server derives the owner hash from authenticated identity, authorizes chat
    access, and broadcasts accepted opaque records only to the same user's devices.
    Drafts, shared chat metadata, exports, shares, and generic metadata messages
    reject this payload. The client reconciles local-first writes by preference_v;
    plaintext is permitted only transiently in the authorized inference request,
    never in logs, durable cache, broadcasts, or generic metadata.
  existing_patterns:
    - AiAskSkillSettings persists authenticated model defaults.
    - Existing CLI/SDK settings mutation paths provide parity entry points.
    - Existing encrypted chat metadata has shared-chat lifecycle/versioning and is deliberately not reused for an owner-scoped preference.
    - ConnectionManager.broadcast_to_user provides the same-user device broadcast primitive.
  data_flow:
    - Authenticated owner updates a tier preference through first-party settings REST; optional-field semantics preserve existing first-party clients during the three-tier rollout.
    - Picker or mention resolution produces Auto or an exact stable variant ID. The client locally encrypts it to Format D master-key ciphertext, persists the local envelope, and sends only ciphertext, chat_id, and expected preference_v to the authorized preference sync path.
    - The server derives owner hash, authorizes chat membership, compare-and-sets the dedicated record, and emits the opaque accepted record to the owner's other devices. Offline devices load the dedicated record on authenticated sync and decrypt locally before picker display.
    - For send, an exact selection is decrypted transiently only inside the authorized client/inference request and bypasses model-tier classification; Auto evaluates tier preference then automatic selection and configured fallback. The inference response and persisted chat data never contain the plaintext selection.
    - If an exact selection is unavailable, the client visibly notifies, encrypts Auto locally, persists the replacement through the same compare-and-set path, broadcasts the opaque update, and resumes automatic routing.
  migration_rollout:
    - Add the Directus schema and unique database constraint before enabling preference reads/writes. Deploy schema idempotently and fail startup/health validation if the collection or unique constraint is absent.
    - Release server reads as absent-is-Auto and retain existing tier-default behavior. There is no backfill because no prior durable per-user/chat selection exists and copying shared metadata or drafts is prohibited.
    - Release clients that understand the dedicated record and Format D envelope. Older clients continue without a chat override; newer clients treat missing records as Auto.
    - Enable writes after REST/WebSocket authorization, conflict, same-user broadcast, and privacy checks pass on the real dev server. Monitor adoption/conflicts/invalid envelopes before making the picker entry visible broadly.
    - Roll back by disabling new writes and hiding the picker entry; retain opaque records so a later compatible client can restore selections. Do not decrypt, transform, or delete records as part of rollback.
  access_rate_privacy_boundaries:
    - Access model is first-party client surface only: authenticated web, CLI, npm SDK, pip SDK, and Apple clients with approved session/device/API-key authentication. No public or developer API exposes this record.
    - Every read/write filters by server-derived hashed_user_id and authorizes the requested chat. Non-owner/non-member access is forbidden; malformed ciphertext, invalid Auto/exact envelope, stale preference_v, and attempts to use drafts/shared metadata are rejected visibly and audibly in structured telemetry.
    - Preference mutations use the approved 30 requests/minute per authenticated owner limit and equivalent owner-scoped WebSocket throttling. Selection mutation consumes no credits; inference still enforces normal availability, authorization, and account credit/budget limits.
    - Logs, metrics, traces, broadcasts, exports, and error messages use event names, owner/chat hashes, preference_v, result class, and model availability category only. They must not include ciphertext, plaintext model IDs, keys, message text, drafts, or share fragments.
  observability:
    - Emit counters for preference read/write accepted, conflict, unauthorized, forbidden, throttled, malformed-envelope, unavailable-reset, local/server reconciliation, and same-user broadcast delivery/failure.
    - Emit latency histograms for dedicated-record read/write and owner-device convergence, tagged only with safe result classes and deployment revision.
    - Add deterministic privacy assertions that Directus rows, API/WebSocket responses, logs, exports, drafts, and shared metadata contain neither plaintext selected model nor the preference payload outside user_chat_preferences.
  affected_files:
    - {path: backend/core/directus/schemas/user_chat_preferences.yml, reason: New dedicated owner/chat preference collection, encrypted field, version, timestamp, and unique constraint.}
    - {path: backend/core/directus/setup/setup_schemas.py, reason: Apply and verify collection schema/constraint rollout.}
    - {path: backend/core/api/app/schemas/settings.py, reason: Compatibly add most-demanding tier and preference transport schema.}
    - {path: backend/core/api/app/routes/settings.py, reason: Existing authenticated tier preference evolution and first-party rate-limit behavior.}
    - {path: backend/core/api/app/routes/websockets.py, reason: Register dedicated preference sync message and same-user opaque broadcast.}
    - {path: backend/core/api/app/routes/handlers/websocket_handlers/encrypted_chat_metadata_handler.py, reason: Explicitly reject preference payloads from shared encrypted chat metadata.}
    - {path: backend/core/api/app/routes/handlers/websocket_handlers/draft_update_handler.py, reason: Explicitly reject preference payloads from drafts.}
    - {path: backend/core/api/app/services/directus/, reason: Add narrow owner-scoped user_chat_preferences CRUD and compare-and-set repository method.}
    - {path: backend/apps/ai/processing/preprocessor.py, reason: Three-tier routing, exact-over-tier precedence, and transient authorized inference selection.}
    - {path: frontend/packages/ui/src/services/, reason: Local-first Format D encryption, preference reconciliation, and unavailable reset.}
    - {path: frontend/packages/ui/src/components/settings/AiAskSkillSettings.svelte, reason: Canonical three-tier settings hierarchy.}
    - {path: frontend/packages/ui/src/components/enter_message/MessageInput.svelte, reason: Responsive picker, mention resolution, and local selection state.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: First-party CLI parity.}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: npm SDK parity.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: pip SDK parity.}
    - {path: frontend/apps/web_app/tests/, reason: Deployed settings/composer and encrypted selection behavior proof.}
    - {path: backend/tests/, reason: Directus isolation, authorization, conflict, routing, and privacy assertions.}
  first_vertical_slice:
    - Create user_chat_preferences schema plus owner-scoped Directus repository with unique(hashed_user_id, chat_id) and preference_v compare-and-set.
    - Implement a first-party authenticated REST/WebSocket preference mutation/read path that accepts only opaque Format D ciphertext, proves owner isolation and same-user opaque broadcasts, and rejects drafts/shared metadata payloads.
    - Add red then green backend/API assertions for AC-5, AC-6, AC-8, and AC-11 before adding picker UI, CLI, SDK, or Apple code.
    - Keep the slice Auto-only/exact-ID transport focused; settings hierarchy and composer presentation follow only after the REST/WebSocket gate is green.
  acceptance_mapping:
    - {acceptance_criteria: [AC-1, AC-4], implementation: Three-tier settings schema and conservative preprocessor classification, assertions: [ai-model-routing.tiers.conservative-three-way, ai-model-routing.defaults.google-tier-profiles], verification: [T-ROUTING-TIERS, V-REST-WS-ROUTING]}
    - {acceptance_criteria: [AC-2], implementation: Field-presence compatible three-tier owner defaults, assertions: [ai-model-routing.preferences.exclusive-tier-defaults], verification: [T-TIER-PREFERENCES, V-REST-WS-ROUTING, V-CLI-ROUTING]}
    - {acceptance_criteria: [AC-3, AC-9], implementation: Canonical settings catalog/navigation with Figma review, assertions: [ai-model-routing.catalog.capability-recommendation-variants, ai-model-routing.settings.hierarchy-canonical], verification: [T-MODEL-CATALOG, T-WEB-AI-SETTINGS, V-UI-VISUAL-SMOKE, V-PROOF-VIDEO]}
    - {acceptance_criteria: [AC-5], implementation: Dedicated encrypted owner/chat preference record and local-first convergence, assertions: [ai-model-routing.chat-selection.encrypted-user-chat-scope], verification: [T-CHAT-SELECTION-ENCRYPTION, V-REST-WS-ROUTING, V-SDK-ROUTING]}
    - {acceptance_criteria: [AC-6], implementation: Transient exact selection in authorized inference only, assertions: [ai-model-routing.precedence.chat-over-tier-over-auto], verification: [T-ROUTING-PRECEDENCE, V-REST-WS-ROUTING, V-CLI-ROUTING]}
    - {acceptance_criteria: [AC-7, AC-10], implementation: Picker/mention resolution and responsive composer with Figma review, assertions: [ai-model-routing.composer.mention-to-exact-selection, ai-model-routing.composer.responsive-actions], verification: [T-COMPOSER-MENTIONS, T-WEB-COMPOSER-ROUTING, V-UI-VISUAL-SMOKE, V-PROOF-VIDEO]}
    - {acceptance_criteria: [AC-8], implementation: Visible unavailable reset to encrypted Auto, assertions: [ai-model-routing.unavailable.notify-reset-auto], verification: [T-UNAVAILABLE-MODEL, V-REST-WS-ROUTING, V-WEB-ROUTING]}
    - {acceptance_criteria: [AC-11], implementation: Ordered first-party surface parity, assertions: [ai-model-routing.surface.semantic-parity], verification: [V-REST-WS-ROUTING, V-CLI-ROUTING, V-SDK-ROUTING, V-WEB-ROUTING, V-APPLE-ROUTING]}
  verification_strategy:
    - Write and run red contract tests for the first vertical slice before product changes; prove Directus uniqueness, opaque durable storage, compare-and-set conflict, owner/member authorization, same-user broadcast, and draft/shared-metadata rejection.
    - Run green real-auth REST/WebSocket proof against https://api.dev.openmates.org before CLI work; record A-3 confirmation immediately before the CLI gate by exercising its auth fixture and command/facade entry points.
    - Run real CLI, then local npm and pip SDK proof against the same dev server, followed by audit_sdk_cli_parity.py; only then implement/deploy web behavior.
    - Run deployed Playwright settings/composer tests, inspect laptop and phone Figma-aligned visual smoke, create/review separate captioned proof videos, obtain user confirmation, then execute Apple parity.
  verification_order:
    - REST/WebSocket red then green against https://api.dev.openmates.org.
    - CLI red then green against the same dev server.
    - npm and pip SDK red then green, followed by SDK/CLI parity audit.
    - Deploy and run web Playwright green.
    - Review laptop and mobile visual smoke against the Figma PNG evidence.
    - Create and review laptop and phone proof video.
    - Obtain user confirmation.
    - Run Apple parity last.

