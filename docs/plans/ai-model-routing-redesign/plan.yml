assumptions:
  - id: A-1
    text: The existing settings route can evolve from two tier fields to three without breaking first-party clients.
    status: confirmed
    required_before: implementation
    confirmation_path: "Confirmed by source research: AiModelDefaultsRequest and POST /v1/settings/ai-model-defaults use field-presence updates, while existing clients send the same authenticated first-party payload; add the third optional field compatibly and retain the existing fields."
    evidence:
      - backend/core/api/app/schemas/settings.py: AiModelDefaultsRequest has optional simple and complex fields.
      - backend/core/api/app/routes/settings.py: update_ai_model_defaults uses model_fields_set for compatible partial updates.
  - id: A-2
    text: Client-encrypted chat metadata can carry the exact selection without a durable server plaintext model field.
    status: confirmed
    required_before: implementation
    confirmation_path: "Confirmed by persistence research, with architecture correction: existing encrypted chat metadata has shared-chat lifecycle/versioning, so do not extend it. Persist opaque Format D ciphertext in dedicated user_chat_preferences and use existing same-user WebSocket broadcast primitives for owner-device convergence."
    evidence:
      - backend/core/api/app/routes/handlers/websocket_handlers/encrypted_chat_metadata_handler.py: shared chat metadata versions are allocated from chat-level persistence.
      - backend/core/api/app/routes/connection_manager.py: broadcast_to_user targets connected devices for one authenticated user.
  - id: A-3
    text: The CLI and both SDKs can exercise the real first-party settings and chat contracts with a real dev test account.
    status: unchecked
    required_before: task_execution
    confirmation_path: Confirm auth fixture and command/facade entry points before the CLI phase.

contracts:
  api:
    access_model: first-party client surface only
    auth: Authenticated first-party settings REST and WebSocket session or approved device/API-key authentication; unauthenticated and non-owner calls are rejected.
    owner_team_scope: Tier preferences are authenticated-user scoped; chat selection is authenticated-user plus chat scoped and never shared with other participants.
    rate_limits: POST /v1/settings/ai-model-defaults is limited to 30 requests per minute per authenticated owner; WebSocket selection mutations use equivalent owner-scoped throttling.
    credit_budget: Preference and selection mutations consume no credits; normal send routing remains subject to existing model availability and account credit/budget checks.
    encryption_boundary: Durable per-user/chat selection is client-encrypted before sync; decrypted selection is transient in the authorized first-party client and routing path only.
    plaintext_handling: Transient decrypted model routing values are permitted only to choose an authorized route; durable server plaintext model selection is forbidden.
    endpoints:
      - route: POST /v1/settings/ai-model-defaults
        classification: first-party client surface only
        purpose: Persist authenticated owner-scoped tier preferences including simple, complex, and most-demanding.
      - route: WebSocket chat preference sync
        classification: first-party client surface only
        purpose: Synchronize client-encrypted per-user/chat Auto or exact-model selection and routing recovery.
  data:
    - Tier preferences are one Auto or exact model value per authenticated user and request tier.
    - Chat selection stores Auto or exact stable model variant IDs only in client-encrypted sync metadata.
  ui:
    figma_evidence:
      - node: "4406:53279"
        reference_png: test-results/figma/ai-settings-redesign/figma-ai-settings-overview-updated.png
      - node: "5815:59169"
        reference_png: test-results/figma/ai-settings-redesign/figma-message-input-overview.png
  privacy_security:
    - Tests and demonstrations use test-account data and never record decrypted chat content, key material, or share fragments.
    - No public or developer API contract exposes durable plaintext chat selection.
  phase_gates:
    - REST/WebSocket first: real authenticated dev API and WebSocket contract proof covers owner isolation, unauthorized/forbidden behavior, 30/min limit, encrypted durable selection, and routing precedence.
    - CLI second: real openmates CLI commands against https://api.dev.openmates.org cover tier defaults and chat routing after REST/WebSocket green.
    - npm/pip third: real local npm and pip SDK calls against https://api.dev.openmates.org cover the same contract, then run audit_sdk_cli_parity.py.
    - Web fourth: deploy web implementation and run live Playwright routing/settings/composer specs after REST, CLI, and SDK green.
    - Visual smoke fifth: inspect deployed laptop and mobile AI Settings and composer routes with the Figma PNG references.
    - Proof video sixth: create and review laptop and phone proof videos with toggleable WebVTT captions after normal green gates.
    - User confirmation seventh: obtain confirmation of deployed dev web behavior and visual quality.
    - Apple last: implement and test native parity only after all previous gates pass.

