  classification: implementation_only
  specification_update_required: false
  affected_assertions:
    - ai-model-routing.tiers.conservative-three-way
    - ai-model-routing.preferences.exclusive-tier-defaults
    - ai-model-routing.catalog.capability-recommendation-variants
    - ai-model-routing.defaults.google-tier-profiles
    - ai-model-routing.chat-selection.encrypted-user-chat-scope
    - ai-model-routing.precedence.chat-over-tier-over-auto
    - ai-model-routing.composer.mention-to-exact-selection
    - ai-model-routing.unavailable.notify-reset-auto
    - ai-model-routing.settings.hierarchy-canonical
    - ai-model-routing.composer.responsive-actions
    - ai-model-routing.surface.semantic-parity
  reason: The approved contract already defines the routing, encrypted persistence, recovery, settings, and responsive composer semantics; this spec plans their implementation without changing those semantics.

documentation_impact:
  generated_reference:
    status: unchanged
    reason: The approved contract fingerprint and generated assertion registry already contain the asserted behavior.
  user_docs:
    status: update_required
    documents:
      - docs/architecture/ai/ai-model-selection.md
    reason: Settings navigation, model-selection precedence, and unavailable-model recovery need user-facing explanation after implementation.
  semantic_layer:
    status: unchanged
    documents:
      - specifications/features/ai-model-routing/specification.yml
      - specifications/features/ai-model-routing/examples.yml
    reason: Product semantics are governed by the approved feature contract and do not change in this implementation spec.

goal: >
  Deliver the approved three-tier AI model settings and responsive composer
  model-selection experience across first-party clients, preserving encrypted
  owner-scoped preferences, deterministic routing precedence, and clear recovery.

scope:
  in:
    - Three-tier simple, complex, and most-demanding automatic routing with conservative classification.
    - One Auto or exact-model default per authenticated user's request tier.
    - Provider-tier catalogs, capability indicators, recommendations, model detail, and canonical AI settings hierarchy.
    - Per-user, per-chat Auto or exact-model selection with client-encrypted durable sync and cross-device restore.
    - Composer picker, exact-model and alias mention resolution, unavailable-model reset, and responsive actions.
    - First-party REST/WebSocket, CLI, npm SDK, pip SDK, web, and Apple semantic parity.
  out:
    - GPT-5.6 Luna, Terra, Sol, or Sol (Max) provider metadata or provider integration, owned by a separate chat.
    - A provider-independent user-facing reasoning-level control.
    - Automatic mutation of saved preferences after catalog recommendation changes.
    - Invented pricing for unsupported image modalities.

context_discovery:
  github_issues:
    - No issue lookup was required for this approved-contract spec-only request.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/ai/ai-model-selection.md
  contracts:
    - specifications/features/ai-model-routing/specification.yml
    - specifications/features/ai-model-routing/examples.yml
    - specifications/generated/registry.yml
  figma:
    nodes:
      - id: "4406:53279"
        purpose: AI model settings redesign reference.
      - id: "5815:59169"
        purpose: Message composer redesign reference.
    reference_pngs:
      - test-results/figma/ai-settings-redesign/figma-ai-settings-overview-updated.png
      - test-results/figma/ai-settings-redesign/figma-message-input-overview.png
  code_patterns:
    - frontend/packages/ui/src/components/settings/AiAskSkillSettings.svelte persists existing simple/complex defaults through the authenticated settings endpoint.
    - backend/core/api/app/routes/settings.py owns POST /v1/settings/ai-model-defaults.
    - backend/apps/ai/processing/preprocessor.py currently selects simple or complex defaults.
    - frontend/packages/ui/src/components/enter_message/MessageInput.svelte and mentionSearchService.ts own composer model mentions.
    - frontend/packages/openmates-cli/src/cli.ts and sdk.ts already expose AI model default mutation paths.
  tests:
    - frontend/apps/web_app/tests/default-model-cli.spec.ts
    - frontend/apps/web_app/tests/image-model-inference-real.spec.ts

