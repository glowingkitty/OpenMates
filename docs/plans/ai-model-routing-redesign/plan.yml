approvals:
  specification:
    status: approved
    approved_at: "2026-08-26T00:00:00Z"
    reason: Explicit approval receipt for feature.ai-model-routing@1 was already recorded with fingerprint bedc508fe88efc9ca0193efb841b7b9c0fa05e679b2bc000a61f5cf7c24d7325.
  plan:
    status: approved
    approved_at: "2026-08-26T00:00:00Z"
    reason: The user explicitly approved the governing contract and instructed implementation to proceed; the dedicated preference record is the smallest architecture that preserves its per-user/chat encrypted isolation.

decisions:
  - id: D-1
    status: active
    decision: Implement only the approved feature.ai-model-routing@1 contract.
    reason: The user requested a spec-only implementation ledger and supplied the exact approved contract fingerprint.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep GPT-5.6 provider metadata and integration out of this spec's implementation scope.
    reason: A separate chat owns that provider work.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-3
    status: active
    decision: Use Figma nodes 4406:53279 and 5815:59169 as visual evidence, not as a substitute for the approved semantic contract.
    reason: The contract deliberately excludes raw Figma values and component structure.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-4
    status: active
    decision: Store a chat selection in a dedicated Directus user_chat_preferences record with unique(hashed_user_id, chat_id), encrypted_selected_ai_model Format D master-key ciphertext, preference_v compare-and-set version, and updated_at.
    reason: A dedicated owner-scoped record is the smallest architecture that preserves approved per-user/chat encrypted isolation without placing selection data in shared chat metadata or drafts.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-5
    status: active
    decision: Encrypt selections locally before durable sync; broadcast the opaque updated record only to the same authenticated user's devices; permit plaintext model identity only transiently in an authorized inference request.
    reason: This preserves the approved encryption boundary while providing cross-device convergence and routing precedence without participant disclosure.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-6
    status: active
    decision: Reject chat-selection reads and writes through drafts and shared chat metadata paths.
    reason: Both paths have different lifetime or participant visibility semantics and cannot preserve the approved owner-only preference boundary.
    decided_at: "2026-08-26T00:00:00Z"

scenarios:
  - id: S-1
    title: Automatic requests use conservative three-tier routing
    given: [Alice has Auto selected for a chat and asks a simple weather question, a focused debugging question, or an uncertain high-complexity question.]
    when: [The request reaches the routing preprocessor.]
    then: [The route is simple, complex, or most demanding under the conservative policy, and uncertainty resolves to complex.]
  - id: S-2
    title: Tier defaults remain exclusive and stable
    given: [Alice has one preference for each of simple, complex, and most demanding.] 
    when: [Alice changes the complex tier from Auto to one exact eligible model.] 
    then: [Only the complex preference changes, the prior exact complex model is replaced, and later recommendation changes do not mutate Alice's choice.]
  - id: S-3
    title: Settings reveal capability, variants, and Google defaults
    given: [Alice opens AI Settings and a tier-specific provider catalog.] 
    when: [Alice opens Google models and a model detail page.] 
    then: [Every selectable variant has a capability indicator, one eligible recommendation is identified for the tier, Gemini defaults match the approved profiles, and no generic reasoning control appears.]
  - id: S-4
    title: Chat selection is encrypted and isolated
    given: [Alice selects an exact model in a shared chat while Bob keeps Auto.] 
    when: [Alice opens the chat on another device.] 
    then: [Alice's selection restores before the composer presents it, durable server plaintext is absent, and Bob's selection remains Auto.]
  - id: S-5
    title: Exact chat selection takes precedence
    given: [Alice selects an exact model for one chat and retains Auto in another.] 
    when: [Alice sends the same simple factual request in each chat.] 
    then: [The exact chat model bypasses tier classification for model routing while Auto applies tier preference then automatic fallback.]
  - id: S-6
    title: Composer picker and mentions resolve to exact selections
    given: ["Alice uses the picker or types an exact model, @best, or @fast in the composer."]
    when: [Alice sends the message.] 
    then: [One routable exact model is selected and persisted, the selector identifies it, and the redundant visible model mention is removed from editable text.]
  - id: S-7
    title: Unavailable saved selection recovers visibly
    given: [Alice's saved exact model is unavailable, unhealthy, or has no usable route.] 
    when: [The chat loads or Alice sends a message.] 
    then: [The client notifies Alice, synchronizes Auto, and resumes normal automatic routing rather than silently substituting another exact model.]
  - id: S-8
    title: Settings and composer remain usable at regular and compact widths
    given: [Alice uses AI Settings or the composer at 1440x900 and 390x844.] 
    when: [Alice navigates settings, opens the attachment menu, and changes the model.] 
    then: [Canonical settings hierarchy is reachable, model selection remains accessible, Drawing/Location/Files are grouped, camera/audio/send remain direct, and no horizontal clipping occurs.]

