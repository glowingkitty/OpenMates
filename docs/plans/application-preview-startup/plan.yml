schema_version: 2
profile: concise
id: application-preview-startup
title: Repair and measure application preview startup
status: implementing
goal: |
  Go ahead and implement the first three optimizations, then measure the time
  until the app is actually interactive. Keep all compilation inside E2B and
  preserve current user costs and privacy.

  go ahead and debug
  and reproduce the issue and confirm startup is happening within seconds
  (as fast as possible)
  drastically improve the processing time (but warn me / ask for consent if the
  optimizations have impact on costs or user privacy), and also ensure we can't
  only execute python code on e2b but also various other common languages like
  rust and others.
notes: |
  Complete the supported two-file Svelte bundle at the shared
  startup-planning boundary, preserving supplied entry pages and source files.
  Reproduce with a disposable synthetic app and measure HTTP readiness separately
  from the first rendered screenshot; verify actual browser interaction.
  A real cold run reached HTTP readiness in 10.742 seconds but installed browser
  dependencies before returning a screenshot at 47.891 seconds.
  Publish a secured-access-compatible E2B base template with browser dependencies
  prepared ahead of time. Select it through E2B_APPLICATION_PREVIEW_TEMPLATE;
  absence retains the ordinary base-template installation path.
  Configure only the existing dev runtime under its coordinator lease, then
  measure a fresh sandbox again. Never turn off secured access or pass provider
  credentials or OpenMates account data into a sandbox.
  Update the minimal E2E fixture and assertions. Run focused provider checks
  locally and backend integration checks in isolated GitHub CI. The full
  application-preview browser spec is held by existing CI executor/gateway
  provisioning; report that separately from real E2B provider proof.
  Follow-up uses batched setup and exact prepared dependency validation, preserving
  installation fallback and exact host checks. Release startup workers promptly
  once a preview is opened, while enforcing the unopened deadline in the startup
  task so a busy cleanup queue cannot extend billed time or source retention.
  A credential-free delayed cleanup task remains a recovery backstop.
  Verify existing Python, JavaScript, TypeScript, shell, C, C++, Rust and Go paths.
  Do not add idle sandbox pools, larger allocations, user-state snapshots,
  regional transfers or increased retention without explicit cost/privacy consent.
  User authorized E2B build/test spending on 2026-10-21. Continue testing without
  further cost confirmation; report user privacy and user cost effects at completion.
  Preserve current runtime allocations and fresh per-execution user state.
  A warm template snapshots only public Vite/Svelte tooling and a blank browser,
  with the same 2 CPU / 1024 MB preview allocation. Upload source privately and
  activate only after every file matches its revision digest. Custom bootstraps,
  npm lifecycle hooks and unsupported dependencies retain the ordinary path.
  Real original-app checks passed browser interactions: warm runs ranged from
  5.465 to 7.368 seconds for HTTP readiness and 7.539 to 11.256 seconds for the
  screenshot. These are individual samples, not a percentile guarantee.
  A separate 2 CPU / 512 MB public-toolchain template passed all eight language
  smoke programs with internet disabled. No user state is baked into either image.
  Treat all app code as malicious. Dependency installation, compilation,
  execution and browser rendering must remain inside E2B; the OpenMates host
  only validates, hashes and transfers data and coordinates disposable sandboxes.
  Follow-up approved 2026-10-21: use one bounded SDK-side readiness waiter then
  verify the public current revision; snapshot a generic already-listening Vite
  server with optimized public dependencies; publish running through the existing
  authenticated owner event transport and adopt late/pending client sessions.
  Preserve generic fallback, exact allowed hosts, digest activation, timeouts,
  /open semantics, billing boundaries and teardown. No provider/account secrets
  enter a VM. Measure cold invocation through a public-URL browser interaction
  in E2B, separately from HTTP readiness, screenshot and full OpenMates UI proof.
