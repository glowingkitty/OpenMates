decisions:
  - id: D-1
    status: active
    decision: Maintain presence out of band and never send unsolicited coordination messages into chats.
    reason: Messages interrupt reasoning, mutate conversation history, may trigger inference, and can create feedback loops.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep ephemeral presence separate from durable sessions.json and worktree reconciliation records.
    reason: High-frequency runtime state has different lifetime, contention, and recovery requirements than durable work ownership and deploy history.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: active
    decision: Track execution, user attention, and last-turn outcome independently.
    reason: A single active flag cannot distinguish streaming, completed-idle, explicitly waiting, aborted, failed, and stale processes.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-4
    status: active
    decision: Surface coordination only when it is relevant to the current task, path, or protected resource.
    reason: A full session list increases context cost and trains agents to stop for harmless parallel work.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-5
    status: active
    decision: Keep read overlap and broad area overlap non-blocking; reserve hard blocks for duplicate task ownership, live exact-file writes, stale reads, and existing protected resources.
    reason: Parallel reading is safe, and historical modified_files entries are advisory rather than ownership.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-6
    status: active
    decision: Treat read-only subagents as child activity under the parent work unit.
    reason: Independent writable identities for diagnostic subagents exaggerate concurrency and create unnecessary sessions and worktrees.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-7
    status: active
    decision: Roll out observe-only, then warnings, then narrowly scoped enforcement.
    reason: Real event ordering and false-positive rates must be measured before new guards can block work.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-8
    status: active
    decision: Do not use unconditional experimental.chat.system.transform injection in the first implementation.
    reason: It may repeat during tool loops, invalidate prompt caches, and add context when no collision exists.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-9
    status: active
    decision: Use the OpenCode child session agent field as explicit pre-tool role metadata and keep parentID insufficient on its own.
    reason: OpenCode creates task child sessions with both parentID and agent before prompting, while task-result metadata arrives only after the child finishes.
    decided_at: "2026-08-14T00:00:00Z"
  - id: D-10
    status: active
    decision: Let explicitly writable task children mutate the parent chat's inherited repository worktree.
    reason: A writable child is part of the parent work unit; creating a second repository session or worktree violates the one-worktree-per-top-level-chat contract.
    decided_at: "2026-08-16T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-3
    approach: Inject every active session after each assistant turn.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: It cannot affect the completed turn and risks unsolicited turns, repeated context, and irrelevant interruption.
  - id: ATTEMPT-2
    task_id: TASK-1
    approach: Derive live activity from worktree status and 48-hour reconciliation age.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: The sampled reconciliation marked 115 merged worktrees as recent-active.
  - id: ATTEMPT-3
    task_id: TASK-1
    approach: Persist every streaming delta synchronously through a Python subprocess.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: Token-level events are too frequent; streaming heartbeat writes must be debounced and non-blocking.
  - id: ATTEMPT-4
    task_id: TASK-5
    approach: Select deterministic provider behavior from all historical user messages.
    outcome: rejected
    recorded_at: "2026-08-05T00:45:00Z"
    reason: A prior tool sentinel retriggered during resume; the fixture now selects only the latest user message.
  - id: ATTEMPT-5
    task_id: TASK-5
    approach: Require idle sessions to remain present in the authoritative session/status map.
    outcome: rejected
    recorded_at: "2026-08-05T00:47:00Z"
    reason: OpenCode returns only non-idle entries; authoritative session and message queries now prove reconciliation.
  - id: ATTEMPT-6
    task_id: TASK-1
    approach: Treat every replayed user message.updated event as a new turn.
    outcome: rejected
    recorded_at: "2026-08-05T00:52:00Z"
    reason: Live metadata-only tracing showed the original user message can replay after completed-idle; user turn identity now prevents that stale transition.

