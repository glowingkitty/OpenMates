    - GitHub MCP authentication returned 401 Bad credentials on 2026-08-04, so
      duplicate issue discovery could not be completed through GitHub.
  docs:
    - AGENTS.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/concurrent-sessions.md
    - docs/architecture/agent-tooling-parity.md
    - docs/plans/agent-worktree-deploy/plan.yml
  code_patterns:
    - .opencode/plugins/openmates-hooks.js
    - scripts/sessions.py
    - scripts/start-opencode-server.sh
    - scripts/_opencode_utils.py
  tests:
    - scripts/tests/test_opencode_hooks_contract.mjs
    - scripts/tests/test_opencode_worktree_guards.mjs
    - scripts/tests/test_sessions_edit_leases.py
    - scripts/tests/test_sessions_stale_read.py
    - scripts/tests/test_sessions_worktree_lifecycle.py
  official_contracts:
    - Installed OpenCode CLI version 1.17.20.
    - Installed @opencode-ai/plugin version 1.14.25 exposes a general event hook,
      chat.message, tool.execute.before, tool.execute.after, and shell.env, and
      imports Event from the unversioned @opencode-ai/sdk package.
    - The installed unversioned Event union declares session.status busy, idle,
      and retry; session and message lifecycle events; permission.updated and
      permission.replied; todo.updated; session.error; and deprecated session.idle.
      Isolated OpenCode 1.17.20 runtime observation emits the newer
      permission.asked name instead of the stale permission.updated declaration,
      so the reducer must normalize both event families.
    - The installed unversioned plugin Event union does not expose question
      events even though the separate V2 SDK types define them; required-question
      tracking therefore needs capability detection or authoritative reconciliation.
    - Assistant messages expose time.completed and typed errors including
      MessageAbortedError; sessions expose parentID, but parentID alone does not
      identify a child's read/write role.
  local_evidence:
    - A four-hour sample contained 61 recent chats, including 46 subagents, and
      30 repository sessions, but only 9 repository sessions were bound to their
      OpenCode chat at the sampled point.
    - Eight top-level chats had OpenCode activity in one 15-minute sample while
      only five repository sessions reported activity in the same interval.
    - Reconciliation classified 226 worktrees as recent-active even though 115
      were already marked merged, so worktree age is not a live-presence signal.
    - Twenty-eight of 114 distinct recently modified paths were touched by more
      than one session, demonstrating the need for earlier task/path coordination.
    - Existing OpenCode hooks enforce exact edit leases and stale-read checks but
      do not subscribe to lifecycle events or maintain runtime presence.

