implementation_notes:
  plan_path: docs/plans/agent-presence-coordination/plan.yml
  existing_patterns:
    - .opencode/plugins/openmates-hooks.js general plugin factory and tool hooks
    - scripts/sessions.py atomic metadata mutation and status commands
    - scripts/tests/test_opencode_hooks_contract.mjs plugin-host contract tests
    - scripts/tests/test_sessions_edit_leases.py exact-file concurrency tests
  architecture: >
    Add an event reducer and bounded ephemeral presence store, connect the
    OpenCode general event hook with debounced heartbeats, expose live status and
    intent operations through sessions.py, and integrate conflict-only checks at
    existing tool boundaries. Keep durable sessions/worktrees authoritative for
    deployment history and keep existing exact-file guards independent.
  data_flow:
    - OpenCode lifecycle event enters the project plugin.
    - A pure reducer normalizes the event into execution, attention, turn, parent, and heartbeat fields.
    - A debounced writer persists only the allowlisted ephemeral record with ordering metadata.
    - sessions.py combines current presence with durable repository session and worktree identity for status output.
    - Tool boundaries query only relevant task/path conflicts before reads, edits, claims, and deploy preparation.
    - Existing edit leases and stale-read checks make the final exact-file decision.
  affected_files:
    - path: .opencode/plugins/openmates-hooks.js
      reason: Subscribe to lifecycle events, heartbeat presence, and surface conflict-only tool context.
    - path: scripts/sessions.py
      reason: Add presence query, status, intent, expiry, and diagnostics commands without mixing ephemeral state into sessions.json.
    - path: scripts/opencode_presence_store.py
      reason: Provide a concurrency-safe, privacy-allowlisted ephemeral store if assumption testing confirms this boundary.
    - path: scripts/verify_opencode_presence_live.py
      reason: Exercise actual concurrent OpenCode sessions and cleanup.
    - path: scripts/tests/test_opencode_presence_events.mjs
      reason: Verify lifecycle reduction and ordering.
    - path: scripts/tests/test_sessions_presence_store.py
      reason: Verify concurrent persistence, expiry, and task claims.
    - path: scripts/tests/test_opencode_presence_collisions.mjs
      reason: Verify relevance and non-interruption policy.
    - path: scripts/tests/test_opencode_task_child_roles.mjs
      reason: Verify pre-tool child-role derivation and the observed read-only command corpus.
    - path: scripts/audit_opencode_output_quality.py
      reason: Separate unknown child-role routing defects from expected inherited-child mutation blocks.
    - path: scripts/tests/test_opencode_output_quality_audit.py
      reason: Verify routing telemetry categories and budgets remain actionable.
    - path: opencode.json
      reason: Deny the unavailable local Firecrawl parse capability while retaining other ask-gated Firecrawl tools.
    - path: scripts/tests/test_sessions_presence_status.py
      reason: Verify live status views.
    - path: scripts/tests/test_opencode_presence_privacy.py
      reason: Verify strict data minimization.
    - path: scripts/tests/test_opencode_presence_failure_containment.py
      reason: Verify durable coordination remains safe when presence fails.
    - path: scripts/tests/test_opencode_presence_performance.mjs
      reason: Verify debounce and no-collision overhead contracts.
    - path: docs/contributing/guides/concurrent-sessions.md
      reason: Document live presence states, task intent, and collision behavior.
    - path: docs/architecture/agent-tooling-parity.md
      reason: Document OpenCode event integration and parity boundaries.
  verification_strategy:
    - Confirm assumptions with installed runtime observation before implementing enforcement.
    - Run deterministic red tests before production hook and store changes.
    - Run all deterministic green tests after each implementation slice.
    - Run observe-only against active OpenCode chats and review event ordering and false positives.
    - Run the real concurrent OpenCode verifier before enabling blocking duplicate-task behavior.
    - Run sync and tooling audits after hook or generated-agent changes.
    - Run spec_verify.py and obtain user confirmation before completion.
  verification_order:
    - Installed OpenCode event contract and live ordering proof
    - Pure reducer and privacy schema tests
    - Concurrent store, expiry, and failure-containment tests
    - Status and collision-policy tests
    - Observe-only runtime comparison
    - Actual concurrent OpenCode session smoke
    - Warning rollout and false-positive review
    - Narrow exact task/path enforcement
    - User confirmation

