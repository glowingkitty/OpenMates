  reason: Latest explicit user requirement supersedes the historical daily cap.
  decided_at: '2026-09-28'
scenarios:
- id: S-1
  title: A terminal technical failure queues an email even when its result envelope
    says completed; expected policy/credit/cancellation outcomes do not.
  given:
  - The approved managed-server notification policy is active.
  when:
  - A terminal failure is handled.
  then:
  - The scenario title describes the required outcome.
- id: S-2
  title: Every distinct eligible failure remains immediately eligible, including
    the sixth and later failures of a UTC day; duplicate jobs and restarts cannot
    send extra emails for the same request.
  given:
  - The approved managed-server notification policy is active.
  when:
  - A terminal failure is handled.
  then:
  - The scenario title describes the required outcome.
- id: S-3
  title: Self-hosting sends no alerts; notification infrastructure failure leaves
