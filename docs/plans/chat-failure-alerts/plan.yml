implementation:
- Add a shared notification dispatcher and atomic email-worker deduplication and
  daily counting using existing Redis and mail services.
- Connect worker terminal outcomes and WebSocket dispatch/handler failures.
- Cover pre-wrapper admission failures and canonicalize turn identity across notification boundaries.
- Retain durable recovery failure alerts until definite broker acknowledgement, then acknowledge the exact failed record idempotently.
- Run focused checks and report dev and production runtime verification separately.
