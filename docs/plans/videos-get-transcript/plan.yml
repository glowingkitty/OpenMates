contracts:
  api:
    - route: POST /v1/apps/audio/skills/transcribe
      access_model: Existing session or API-key REST access; CLI --file additionally needs existing paired upload auth.
      limits_billing: Existing upload limit applies to extracted audio and existing successful-audio formula remains sole charge.
      privacy: Existing private upload/storage, server-side decrypt for Mistral, and optional Gemini text correction apply; provider credentials never reach clients.
      negotiation: "Only audio/transcribe version 1 general dispatch uses omitted=word; old unversioned omission=none; versioned speech sends none."
  data_flow:
    - "CLI: ffprobe -> ffmpeg audio derivative -> uploadFile -> transcribeUploadedAudio -> validate/map offset -> atomic JSON."
    - "API/SDK: version marker -> validate timing/language -> regular audio pipeline -> timed original plus separate correction."
    - "Speech: explicit none at web/CLI/native boundary -> unchanged speech behavior."

