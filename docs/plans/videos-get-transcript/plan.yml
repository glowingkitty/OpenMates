decisions:
  - id: D-1
    status: active
    decision: >
      Add transcription_contract_version: 1 only to new GENERAL audio/transcribe
      dispatchers, including generic npm/pip metadata. Versioned omission means
      word; versioned speech explicitly sends none. Unversioned omission remains
      legacy none; transitional unversioned explicit timestamps validate normally.
    reason: >
      Omission cannot distinguish shipped speech from general transcription. This
      additive rollout preserves the approved general default without guessing.
    stop_condition: >
      Stop and request a Specification change if legacy unversioned none and new
      versioned general omitted=word cannot both be preserved.
    decided_at: "2026-09-05"
