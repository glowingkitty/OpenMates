  - id: feature.app-skill.videos-get-transcript
    version: 1
    fingerprint: 0cf398725542a92e74b140d063e641b121ef9d24dcf9342866fc736d3fe964b7
    role: primary
scope:
  in: ["YouTube backfill", "Audio timestamp negotiation", "CLI --file audio extraction and atomic JSON", "npm/pip timestamp schemas", "web/native speech compatibility"]
  out: ["Video upload or Videos file route", "provider fork or auth/billing redesign", "web/native local-video picker", "SRT or retention APIs", "marketing/Remotion work"]
context_discovery:
  specs: [specifications/features/app-skills/videos-get-transcript/specification.yml, specifications/features/app-skills/videos-get-transcript/examples.yml]
  source: [backend/apps/audio/skills/transcribe_skill.py, backend/apps/audio/app.yml, backend/core/api/app/routes/apps_api.py, frontend/packages/openmates-cli/src/uploadService.ts, frontend/packages/openmates-cli/src/cli.ts, frontend/packages/openmates-cli/src/client.ts, frontend/packages/openmates-cli/src/sdk.ts, packages/openmates-python/openmates/sdk.py, frontend/packages/ui/src/components/enter_message/embedHandlers.ts, apple/OpenMatesShared/BackgroundChatSender.swift]
  tests: [backend/tests/test_transcribe_skill.py, backend/tests/test_audio_transcribe_ascii_sanitization.py, backend/tests/test_videos_transcript_timeout.py, frontend/packages/openmates-cli/tests/uploadService.test.ts, frontend/packages/openmates-cli/tests/fileEmbed.test.ts, frontend/packages/openmates-cli/tests/sdk.test.ts, packages/openmates-python/tests/test_sdk.py, frontend/apps/web_app/tests/audio-recording-and-speech.spec.ts, frontend/apps/web_app/tests/skill-videos-transcript.spec.ts, apple/OpenMatesTests/BackgroundChatSenderParityTests.swift, apple/OpenMatesUITests/MessageInputAudioRecordingUITests.swift]
discovery_summary: >
  web embedHandlers.ts, native BackgroundChatSender.swift, and CLI
  uploadService.ts call transcribeUploadedAudio without timestamps or a reliable
  semantic discriminator. A global omitted=word default would regress shipped
  speech behavior. uploadFile and transcribeUploadedAudio already provide the
  authenticated audio-only boundary; Mistral rejects language with word/segment.

