schema_version: 2
id: videos-get-transcript
title: Video Transcript Retrieval And CLI-Local Video Audio
status: implementing
goal: >
  Backfill the existing YouTube transcript skill and add CLI-only local video
  audio extraction through existing authenticated audio transcription, with
  optional accurate timestamps and no new video upload service.

