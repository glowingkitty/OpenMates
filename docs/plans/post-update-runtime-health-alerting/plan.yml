scenarios:
  - id: S-1
    title: Successful core update displays a passing runtime checklist
    given:
      - A CLI-managed core server has completed container startup after an update.
    when:
      - The CLI runs the role-aware post-update verifier.
    then:
      - The CLI displays every required check and its status.
      - Required container, API, database, cache, Vault, queue, scheduler, and deterministic chat-plumbing checks pass.
      - The periodic verifier and independent watchdog are installed, enabled, and fresh.
      - The update is recorded as successful only after all required checks pass.

  - id: S-2
    title: Failed post-update verification preserves operator control
    given:
      - Updated containers are reachable.
      - The task-worker cannot complete the deterministic queue probe.
    when:
      - The post-update verifier reaches the task-worker check.
    then:
      - The check fails with a sanitized actionable reason.
      - The updated deployment remains running.
      - The update status is failed or degraded rather than successful.
      - Configured notification channels receive one failure event.
      - The CLI prints the exact openmates server restore command for the pre-update backup.
      - If no verified backup exists, the CLI reports restore_unavailable and its reason instead of an unusable restore command.

  - id: S-3
    title: Official cloud verifies billing readiness without a transaction
    given:
      - The server is the official OpenMates cloud runtime and payment_enabled is true.
    when:
      - Post-update or periodic billing verification runs.
    then:
      - It verifies production Stripe account access, billing route registration, required worker availability, webhook configuration, and a fresh billing-health timestamp.
      - It does not create, confirm, capture, refund, or mutate a payment, customer, invoice, or subscription.
      - A credential or required-configuration failure alerts immediately.

  - id: S-4
    title: Self-hosted server never evaluates or alerts on billing
    given:
      - A CLI-managed server reports is_self_hosted true and omits cloud payment state.
    when:
      - Post-update and periodic verification run.
    then:
      - No Stripe secret is read and no Stripe request is made.
      - Billing fields, sections, check IDs, statuses, and messages are entirely absent.
      - No billing event is stored or sent to email, Discord, or webhook destinations.

  - id: S-5
    title: Ongoing monitoring detects sustained and stale failures
    given:
      - Essential runtime checks run every five minutes.
    when:
      - A transient check fails once and recovers on the next run.
      - Another check fails twice consecutively.
      - A scheduler stops updating health state for more than fifteen minutes.
    then:
      - The transient one-off failure does not page operators.
      - The second consecutive failure sends one deduplicated firing alert.
      - An independent host watchdog sends a distinct stale-monitor alert even though the application scheduler is stopped.
      - Recovery sends one recovery event and clears the active incident state.

  - id: S-6
    title: Operator verifies notification delivery safely
    given:
      - One or more email, Discord, or signed webhook destinations are configured.
    when:
      - The operator runs the CLI notification test command.
    then:
      - Each configured destination receives a clearly labeled test event.
      - Human and JSON output report each destination independently.
      - Secret values, webhook URLs, tokens, user data, and chat content are never printed or included in payloads.

  - id: S-7
    title: Dev verification gates production rollout
    given:
      - The verifier and notification changes are implemented but not deployed to production.
    when:
      - Dev post-update success, injected failure, billing no-spend, self-host no-billing, and all notification channel tests run.
    then:
      - Production rollout remains blocked until all required dev evidence passes.
      - Production rollout starts with no-spend checks and a controlled notification test before ongoing alerts are enabled.

