  verified_facts:
    - openmates server update currently waits for role-specific HTTP health checks before recording success.
    - Image-mode updates create one rotating pre-update backup for data-bearing roles.
    - A failed health wait leaves updated containers running and prints Docker Compose status; automatic rollback is not implemented.
    - Official-cloud Stripe health uses stripe.Account.retrieve without creating a transaction.
    - General Prometheus alerts cover API, Celery, container, and scrape health but do not alert directly on stale or unhealthy cached Stripe health.
    - The CLI has no update-specific notification hook or post-update runtime contract checklist today.

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple apps are not affected because this changes host CLI and server operations only.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - Native clients do not update or monitor server hosts.

clarification:
  rounds:
    - question: What should happen when required post-update runtime checks fail after containers are reachable?
      answer: Keep the updated deployment running, mark the update failed or degraded, notify operators, and show the exact restore command.
    - question: Should the server run unit tests or runtime contracts after an update?
      answer: Run fast deterministic runtime contracts; keep conventional unit tests in CI.
    - question: Should this apply only to official production or every CLI-managed server?
      answer: Every CLI-managed server runs the checklist; official production requires notifications and self-host notifications are configurable.
    - question: Which notification channels should v1 support?
      answer: Email, Discord, and a signed generic webhook, plus a delivery test and daily heartbeat.
    - question: When should ongoing monitoring alert?
      answer: Alert after two consecutive five-minute failures, immediately for credential or required-configuration failures, on stale checks over fifteen minutes, and on recovery.
    - question: How should billing behave on self-hosted servers?
      answer: Self-hosting omits every billing field, section, check, status, and notification without mentioning billing in operator output.
  vision_summary: >
    Every CLI-managed server should display and persist a deterministic
    post-update runtime checklist. Required failures leave the new deployment
    running but make the update fail, trigger configured notifications, and show
    a restore command. Ongoing monitoring uses two-failure thresholds, immediate
    configuration alerts, stale-check detection, recovery messages, and daily
    heartbeats. Billing monitoring exists only on official OpenMates cloud and
    must never spend money; self-hosted servers omit billing entirely.
  approved_by_user: true

