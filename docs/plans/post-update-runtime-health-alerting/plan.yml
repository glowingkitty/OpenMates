    - backend/core/api/app/tasks/health_check_tasks.py
    - backend/core/api/app/tasks/celery_config.py
    - backend/core/monitoring/prometheus/alert_rules.yml
    - backend/core/monitoring/alertmanager/alertmanager.yml
    - backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
