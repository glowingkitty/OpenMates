implementation_notes:
  plan_path: docs/plans/post-update-runtime-health-alerting/plan.yml
  status: approved
  existing_patterns:
    - frontend/packages/openmates-cli/src/server.ts post-readiness update status handling
    - frontend/packages/openmates-cli/src/serverPlanning.ts pure role, update, and systemd planning helpers
    - backend/core/api/app/tasks/health_check_tasks.py provider-free task registration, cache transport, and Stripe account-read pattern
    - backend/core/api/app/utils/server_mode.py domain and cloud-overlay witnesses
    - backend/shared/python_utils/discord_webhook.py bounded Discord delivery behavior
    - scripts/run_tests.py independent Discord and email channel semantics
  architecture: >
    Keep verification internal and host controlled. A packaged Python verifier
    runs inside the API container through docker compose exec and returns a
    bounded JSON checklist; it adds no HTTP route. The CLI runs that verifier
    after readiness and every five minutes from an idempotently installed
    systemd timer, persists sanitized role state under
    <install>/.openmates/runtime-health, evaluates incidents, and delivers
    email, Discord, and signed-webhook events independently. A dedicated
    provider-free Celery task routed to app_ai proves dispatch, Redis event
    transport, worker execution, and completion. Database, cache, Vault, and
    scheduler checks are separate and non-user-facing. A strict backend resolver
    accepts billing only when OPENMATES_DEPLOYMENT_MODE=official_cloud and all
    local overlay/domain/environment witnesses agree; every missing or conflicting
    state selects self_host before Stripe secret resolution.
  data_flow:
    - CLI writes OPENMATES_DEPLOYMENT_MODE and creates the mode-0700 host runtime-health directory before Compose starts.
    - Install/update idempotently renders and enables openmates-<role>-runtime-monitor.service and .timer using the existing continuous-updater systemd pattern.
    - After HTTP readiness, CLI runs docker compose exec -T api python /app/backend/scripts/runtime_health_verifier.py --role core --json.
    - The verifier resolves deployment mode before constructing its inventory or resolving secrets.
    - Compose and HTTP checks complete first; independent DB, cache, Vault, worker, scheduler, chat-probe, and official-cloud billing checks then run concurrently under one sixty-second deadline.
    - The provider-free Celery probe publishes a synthetic event and completion marker in a runtime-health Redis namespace, then deletes probe keys; it never enters inference or writes user chat data.
    - CLI validates the bounded verifier schema, atomically replaces <role>.json with mode 0600, renders the checklist, and records update success or failure plus restore availability.
    - The host timer invokes openmates server monitoring run every five minutes, updates consecutive failure and freshness state, and sends firing, reminder, recovery, heartbeat, or delivery-test events.
    - Host monitoring treats malformed, missing, or older-than-fifteen-minute verifier state as monitor_stale without depending on API/Celery notification code.
    - Each notification channel records delivered, retrying, or exhausted independently; official cloud requires at least one fallback destination.
  boundaries:
    - No new public, developer, first-party, or internal HTTP endpoint.
    - No Directus schema migration and no user/chat/payment persistence for verifier state.
    - No SDK, web, or Apple product surface change.
    - The verifier module adds no development-test dependency; current image hygiene outside this change is not expanded.
  deployment_mode:
    - Persist exact OPENMATES_DEPLOYMENT_MODE=self_host|official_cloud in runtime .env and pass it to API, workers, and scheduler.
    - server.json remains display metadata and never authorizes billing.
    - official_cloud also requires exact OPENMATES_CLOUD_OVERLAY_ENABLED=true, OpenMatesCloud package witness, importable billing overlay, loaded encrypted official-domain policy, and matching SERVER_ENVIRONMENT/domain class.
    - Any missing, duplicate, malformed, conflicting, or unavailable witness returns effective self_host and a sanitized reason before billing imports, secrets, state, or notifications.
  state:
    path: <install>/.openmates/runtime-health/<role>.json
    permissions: Directory 0700 and files 0600, written atomically.
    fields:
      - Current bounded checklist and last_completed_at
      - Consecutive failure counters and active incident IDs by check ID
      - Last reminder, recovery, and daily heartbeat timestamps
      - Per-channel delivery status without destinations or credentials
      - Version/image digest, role, effective deployment mode, and sanitized mode status
    retention: Current state only; notification logs remain in normal redacted operational logs.
  notification_delivery:
    email: Use configured Brevo API credentials directly from the host monitor so API downtime does not suppress delivery.
    discord: Reuse Discord payload limits and independently record delivery outcome.
    webhook: Canonical JSON with HMAC-SHA256 timestamp/event headers, redirects disabled, bounded I/O, and DNS/IP validation before connection.
    watchdog: Host systemd timer and service have bounded runtime, Persistent=true, startup grace, and official-cloud fallback configuration outside application Vault.
  rollout:
    - Add tests and deterministic audit first and record red evidence.
    - Implement pure deployment-mode, check-inventory, state-transition, webhook-policy, and systemd-plan helpers before integration.
    - Prove the packaged verifier against current dev Docker services without notifications.
    - Integrate CLI standalone verify, monitoring status/run, notification test, and post-update checklist.
    - Prove injected dev failure/recovery and three-channel delivery before enabling the dev timer.
    - Extend self-host smoke only after local self-host/no-billing proof passes.
    - Run the same-tag real dev update and V-DEV-ROLLOUT-GATE before requesting production rollout.
    - Production rollout remains a separate operator-approved task and begins with no-spend verify plus controlled delivery test.
  observability:
    - Log stable check IDs, failure classes, durations, incident transitions, and channel delivery status.
    - Never log mode witnesses, secrets, destination URLs, Stripe responses, synthetic payload contents, or user identifiers.
    - Emit one daily heartbeat only after all required checks pass and at least one configured channel delivers.
  demonstration:
    capture_source: Sanitized PTY recording of real dev CLI commands after all normal green gates.
    caption_renderer: Repository implementation-demonstration caption pipeline with exact captions authored from verified behavior.
    privacy_scan: Run complete-frame local privacy scanning before selecting review frames.
    frame_sampling: Three-second intervals plus command, checklist transition, failure, notification, and recovery boundaries; full video never enters model context.
    retention: Keep raw evidence and edited demonstration artifacts separate under the repository test-result retention policy.
    delivery: Review the bounded caption/frame bundle first; Discord publication is separately retryable and does not replace review evidence.
  affected_files:
    - path: frontend/packages/openmates-cli/src/server.ts
      reason: Run/render verifier, manage runtime state, expose monitoring/notification commands, and provision systemd services.
    - path: frontend/packages/openmates-cli/src/serverPlanning.ts
      reason: Define role check inventory, deployment-mode parsing, and pure systemd plans.
    - path: frontend/packages/openmates-cli/src/serverHealth.ts
      reason: New host-state, incident transition, and independent notification adapters shared by update and timer commands.
    - path: frontend/packages/openmates-cli/src/serverConfig.ts
      reason: Persist deployment mode as metadata without using it as runtime billing authority.
    - path: backend/core/api/app/utils/server_mode.py
      reason: Resolve strict fail-closed runtime deployment mode before billing boundaries.
    - path: backend/core/api/app/tasks/health_check_tasks.py
      reason: Register provider-free app_ai queue probe and scheduler heartbeat task.
    - path: backend/core/api/app/tasks/celery_config.py
      reason: Route the chat probe and schedule a lightweight scheduler heartbeat.
    - path: backend/scripts/runtime_health_verifier.py
      reason: New packaged no-spend verifier invoked only through host-local Docker exec.
    - path: backend/core/docker-compose.yml
      reason: Propagate deployment mode and runtime-health host path to official source-mode services.
    - path: backend/core/docker-compose.selfhost.yml
      reason: Default deployment mode to self_host and propagate verifier inputs.
    - path: frontend/packages/openmates-cli/templates/core/docker-compose.selfhost.yml
      reason: Keep packaged image-mode template aligned with self-host fail-closed defaults.
    - path: frontend/packages/openmates-cli/tests/server.test.ts
      reason: CLI checklist, mode, state, notification, and systemd behavior contracts.
    - path: backend/tests/test_runtime_health_verifier.py
      reason: Runtime and no-spend billing/self-host contracts.
    - path: frontend/packages/openmates-cli/tests/server.test.ts
      reason: Host-state, threshold, delivery, mode, checklist, and CLI lifecycle contracts.
    - path: scripts/audit_runtime_health_contract.py
      reason: Deterministically prevent paid-call, billing-mode, watchdog, and webhook-policy drift.
    - path: scripts/verify_post_update_runtime_health.py
      reason: Real dev success, injected failure/recovery, and no-spend billing evidence.
    - path: scripts/verify_post_update_notifications.py
      reason: Real dev email, Discord, and signed-webhook delivery evidence.
    - path: .github/workflows/selfhost-smoke.yml
      reason: Retain self-host no-provider/no-billing update verification after local proof.
  migrations:
    - No database or Directus migration.
    - Existing installs gain OPENMATES_DEPLOYMENT_MODE=self_host unless the CLI can prove all official-cloud witnesses; official deployment configuration explicitly sets official_cloud.
    - Existing monitoring service files are replaced idempotently; uninstall/repair remains available through CLI commands.
  assumptions_checked:
    - A-1 confirmed by API image packaging; implementation adds no test dependency.
    - A-2 confirmed with a dedicated provider-free Celery/Redis probe and separate database check.
    - A-3 confirmed by adding the strict runtime enum and witness resolver before billing selection.
  acceptance_mapping:
    AC-1: [T-CLI-UNIT-001, T-DEV-UPDATE-001, T-DEV-CLI-001]
    AC-2: [T-CLI-UNIT-001, T-DEV-FAILURE-001]
    AC-3: [T-PYTEST-001, T-DEV-UPDATE-001, T-CONTRACT-AUDIT-001]
    AC-4: [T-PYTEST-001, T-DEV-BILLING-001, T-CONTRACT-AUDIT-001]
    AC-5: [T-PYTEST-001, T-SELFHOST-001, T-CONTRACT-AUDIT-001]
    AC-6: [T-PYTEST-ALERTS-001, T-DEV-FAILURE-001, T-CONTRACT-AUDIT-001]
    AC-7: [T-PYTEST-ALERTS-001, T-DEV-NOTIFY-001]
    AC-8: [T-CLI-UNIT-001, T-DEV-NOTIFY-001, T-DEV-CLI-001, T-SDK-CLI-AUDIT-001, T-CONTRACT-AUDIT-001]
    AC-9: [V-DEV-ROLLOUT-GATE, T-PROD-BILLING-001, V-PROD-ROLLOUT]
    AC-10: [T-CLI-UNIT-001, T-DEV-UPDATE-001]
  verification_strategy:
    - Tests first with red evidence.
    - Backend verifier unit and deterministic policy checks before live execution.
    - Packaged backend verifier against dev Docker services before CLI integration proof.
    - Real CLI verify, monitoring, notification, and same-tag update commands against dev.
    - Self-host workflow proves billing is absent.
    - Production rollout only after V-DEV-ROLLOUT-GATE passes and the operator approves V-PROD-ROLLOUT.
  verification_order:
    - Backend/internal runtime verifier contracts on the real dev server
    - OpenMates CLI verification and post-update behavior against dev
    - npm SDK and pip SDK not applicable because no SDK surface changes
    - GitHub Actions self-host reproduction after local dev proof
    - Web and Playwright not applicable because no web UI changes
    - User confirms CLI output and dev notification behavior
    - Apple not affected
  material_plan_approval:
    required: false
    reason: The strict local mode enum, host-owned watchdog, no-new-endpoint boundary, and no-spend probe directly implement security and availability requirements already approved in the product contract.

