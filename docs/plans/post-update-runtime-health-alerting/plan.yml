schema_version: 2
id: post-update-runtime-health-alerting
title: Post-Update Runtime Health And Essential-Service Alerting
status: approved

goal: >
  Make every CLI-managed OpenMates server prove that its essential runtime
  services work after an update, and notify operators when essential services
  become unhealthy, without creating payment transactions or paid AI/provider
  requests. Official OpenMates cloud additionally verifies billing readiness;
  self-hosted servers never run billing checks or send billing alerts.

scope:
  in:
    - Run a role-aware runtime verification checklist after containers become reachable during openmates server update.
    - Show each post-update check as pending, running, passed, failed, skipped, or not applicable in human and JSON output with deterministic exit codes.
    - Mark the update failed or degraded when a required check fails, keep the updated deployment running, and print the exact restore command when a verified backup exists.
    - Run ongoing essential-service checks every five minutes after startup.
    - Run an independent host watchdog that detects stale application-scheduler health state even when the application scheduler is stopped.
    - Provision and enable the periodic verifier and independent watchdog idempotently during server install and update.
    - Alert after two consecutive failures, immediately for credential or required-configuration failures, and when checks are stale for more than fifteen minutes.
    - Send deduplicated firing, recovery, daily-heartbeat, and post-update failure notifications through email, Discord, and a signed generic webhook.
    - Add a safe CLI notification-delivery test.
    - Verify official-cloud billing configuration, Stripe account connectivity, billing routes, required workers, webhook configuration, and health freshness without creating or confirming a payment.
    - Verify deterministic chat transport, queue, persistence, and completion plumbing without invoking an LLM or paid provider.
    - Prove all behavior on the current dev server before any production rollout.
  out:
    - Running the complete unit-test suite on a production server after every update.
    - Packaging general development test dependencies or repository test sources in production images.
    - Creating, confirming, refunding, or otherwise mutating Stripe payments for health verification.
    - Calling paid LLM, search, media, or other provider APIs from deterministic chat verification.
    - Automatically restoring backups, rolling back images, or rolling back database migrations after failed checks.
    - Sending billing checks, billing status, or billing notifications from self-hosted servers.
    - Changing Apple, web, npm SDK, or pip SDK product behavior.

