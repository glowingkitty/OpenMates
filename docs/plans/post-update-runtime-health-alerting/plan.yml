contracts:
  api:
    access_model: internal-only
    auth: Host-local CLI execution or existing internal service authentication; no new public or developer endpoint is approved.
    rate_limits: Periodic checks run at most once per five minutes per server role; CLI post-update and explicit notification tests are operator initiated.
    credit_budget: Zero OpenMates credits and zero paid provider requests are allowed for deterministic checks.
    encryption_boundary: Checks must not read, decrypt, return, or transmit user chat, memory, file, key, share, or billing content.
  cli:
    - openmates server install and update idempotently install, enable, and verify the periodic runtime-check schedule plus independent host watchdog.
    - openmates server update automatically runs the required role-aware post-update verification phase.
    - openmates server verify [--role core|upload|preview] [--json] runs the same verifier without updating.
    - openmates server monitoring install-service [--role core|upload|preview] repairs or explicitly reprovisions the automatically managed host watchdog and periodic verifier schedule.
    - openmates server monitoring status [--json] reports application-check freshness, watchdog freshness, and notification delivery state.
    - openmates server notifications test [--channel email|discord|webhook|all] [--json] sends clearly labeled test events.
    - openmates server update status --json includes per-check results, timestamps, duration, failure class, notification delivery state, and restore command when applicable.
  runtime_check_result:
    fields:
      - id
      - label
      - status: pending|running|passed|failed|skipped|not_applicable
      - required
      - started_at
      - completed_at
      - duration_ms
      - sanitized_reason
      - failure_class
      - cleanup_status
    persistence:
      - Store only operational metadata needed for current status, failure counting, deduplication, recovery, and heartbeat state.
      - Never store secrets, raw provider responses, user identifiers, chat content, payment data, or notification destination URLs.
  essential_checks:
    selection:
      - Read one locally authoritative deployment_mode value before resolving secrets or building the check inventory.
      - The only billing-capable value is official_cloud.
      - Missing, malformed, conflicting, or unavailable mode state selects self_host and the no-billing inventory.
    core_all_modes:
      - {id: compose.required_services, required: true, timeout_seconds: 15, applies_to: [core, upload, preview]}
      - {id: http.role_health, required: true, timeout_seconds: 10, applies_to: [core, upload, preview]}
      - {id: core.database, required: true, timeout_seconds: 10, applies_to: [core]}
      - {id: core.cache, required: true, timeout_seconds: 10, applies_to: [core]}
      - {id: core.vault, required: true, timeout_seconds: 10, applies_to: [core, upload]}
      - {id: core.worker_queue, required: true, timeout_seconds: 15, applies_to: [core]}
      - {id: core.scheduler_freshness, required: true, timeout_seconds: 5, applies_to: [core]}
      - id: core.chat_plumbing
        required: true
        timeout_seconds: 20
        applies_to: [core]
        cleanup: Synthetic IDs are idempotent; timeout, duplicate execution, persistence failure, and cleanup failure are explicit failure classes, and cleanup retries never touch user records.
      - {id: upload.antivirus, required: true, timeout_seconds: 10, applies_to: [upload]}
      - {id: preview.renderer, required: true, timeout_seconds: 15, applies_to: [preview]}
    official_cloud_only:
      - {id: billing.mode_enabled, required: true, timeout_seconds: 5}
      - {id: billing.stripe_account_read, required: true, timeout_seconds: 15}
      - {id: billing.routes_registered, required: true, timeout_seconds: 5}
      - {id: billing.workers_registered, required: true, timeout_seconds: 10}
      - {id: billing.webhook_configured, required: true, timeout_seconds: 5}
      - {id: billing.health_freshness, required: true, timeout_seconds: 5}
    self_hosted:
      - Billing fields, sections, check IDs, statuses, and messages are omitted entirely.
      - No billing incident state or notification can be created.
    execution:
      - Apply one sixty-second global deadline after container readiness.
      - Run independent checks concurrently after compose.required_services and http.role_health satisfy their dependencies.
      - Run only dependency-linked checks serially and document those dependencies in the implementation plan.
      - On the global deadline, cancel unfinished work, mark each unfinished required check failed with failure_class timeout, run bounded cleanup, and report every specific unfinished check.
  notifications:
    channels: [email, discord, signed_webhook]
    event_types: [post_update_failed, service_unhealthy, monitor_stale, recovered, daily_heartbeat, delivery_test]
    threshold: Two consecutive failures except immediate required-configuration or credential failures.
    deduplication: One active incident per server role and check ID; reminders occur no more than once every four hours while firing.
    heartbeat: One green delivery-health heartbeat per UTC day after runtime checks and at least one configured notification channel succeed.
    retries: Each channel receives three bounded attempts with exponential backoff; delivery state is persisted as pending, delivered, retrying, or exhausted.
    no_destination: Self-host records notification_not_configured without failing runtime health; official_cloud treats no configured destination as an immediate required-configuration failure.
    all_channels_failed: Official cloud writes host-local critical state and uses an independently configured host-watchdog fallback destination; self-host records exhausted delivery state for operator inspection.
    webhook_security:
      - Sign payload bytes with HMAC-SHA256 using an operator-configured secret.
      - Include timestamp and event ID for replay protection.
      - Never include the destination URL or signing secret in logs or status output.
      - Require HTTPS outside explicitly marked local development fixtures.
      - Reject loopback, private, link-local, multicast, and otherwise non-public destination addresses in official cloud.
      - Resolve and validate every DNS result, disable redirects, and enforce bounded connection timeout, response timeout, request size, and response size.
      - Route official-cloud delivery through the approved egress policy or allowlist.
  update_failure:
    - Keep updated containers running.
    - Record update status as failed or degraded.
    - Send configured notifications independently so one channel failure does not suppress others.
    - Print and persist the exact role-scoped restore command only when a verified backup manifest exists; otherwise persist restore_unavailable with a reason.
    - Never automatically restore data, images, or migrations.

privacy_security:
  - Runtime verification uses only synthetic, ephemeral, non-user data and cleans up any temporary state.
  - Billing verification is read-only and must not create provider objects or transactions.
  - Notification payloads contain service/check IDs, sanitized failure classes, timestamps, server role, version/digest, and source links only.
  - Generic webhooks are signed and replay-bounded.
  - Generic webhook delivery enforces SSRF-safe destination validation and redirect handling.
  - Notification channel failures are independently visible and do not mask the original health failure.
  - Self-host mode selection fails closed to no billing checks.
  - Missing, malformed, conflicting, or unavailable deployment mode is tested as self-host/no-billing before secret resolution.

