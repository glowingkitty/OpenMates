decisions:
  - id: D-1
    status: active
    decision: Use deterministic runtime contracts after updates instead of a packaged production unit-test suite.
    reason: Runtime contracts prove the deployed containers and dependencies while avoiding development test dependencies and image bloat.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-2
    status: active
    decision: Failed post-update checks do not automatically roll back containers or data.
    reason: Automatic rollback is unsafe across migrations and partial writes; the existing backup and explicit restore command preserve operator control.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-3
    status: active
    decision: Self-hosted runtimes omit billing checks and billing notifications entirely.
    reason: Self-hosting does not expose OpenMates cloud billing or payment processing.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-4
    status: active
    decision: External notifications support email, Discord, and signed generic webhooks with deduplication, recovery, heartbeat, and delivery-test events.
    reason: Multiple independent channels reduce silent alert loss and make the feature useful to self-hosted operators.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-5
    status: active
    decision: Production rollout is blocked until the same verifier and failure notifications pass on dev.
    reason: Monitoring and alert delivery must be proven without risking production billing or update availability.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-6
    status: active
    decision: The host CLI owns periodic scheduling, incident state, and notification delivery; a packaged in-container verifier only returns sanitized check results.
    reason: Host ownership remains functional when API, Redis, or Celery are unhealthy and avoids a new HTTP endpoint or Directus dependency for alert state.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-7
    status: active
    decision: OPENMATES_DEPLOYMENT_MODE is the local billing-authority enum and official_cloud requires agreeing overlay, environment, and encrypted-domain witnesses.
    reason: Request headers, generic dev-domain matching, and server.json are not safe authority before Stripe secret resolution.
    decided_at: "2026-08-06T00:00:00Z"
  - id: D-8
    status: active
    decision: Deterministic chat plumbing uses a provider-free Celery probe on the app_ai queue plus Redis event/result transport; database connectivity is verified separately with non-user operational data.
    reason: The normal chat path necessarily reaches model inference, while the dedicated probe validates dispatch, worker execution, transport, and completion without paid calls or user-visible records.
    decided_at: "2026-08-06T00:00:00Z"

