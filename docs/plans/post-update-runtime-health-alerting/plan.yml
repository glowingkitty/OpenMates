risks:
  - id: R-1
    risk: A verifier mutates production data or incurs provider costs.
    mitigation: Enforce read-only billing calls, deterministic chat plumbing, explicit call-deny tests, and dev evidence before production.
  - id: R-2
    risk: Monitoring depends on the same failed service as its notification path.
    mitigation: Keep host CLI status local, run freshness checks in an independent host watchdog, deliver channels independently, and configure an official-cloud fallback destination outside the application scheduler.
  - id: R-3
    risk: Update verification extends maintenance windows or creates false failures during startup.
    mitigation: Run only after readiness, use a sixty-second target, classify startup retries separately, and require two failures for ongoing alerts.
  - id: R-4
    risk: Self-hosted servers accidentally read cloud billing secrets or emit billing incidents.
    mitigation: Select check inventory from fail-closed server mode before secret resolution and test that Stripe functions are never called.
  - id: R-5
    risk: Notification destinations leak secrets or private operational data.
    mitigation: Use bounded schemas, HMAC signing, SSRF-safe egress validation, output redaction, and deterministic sensitive-logging tests.

