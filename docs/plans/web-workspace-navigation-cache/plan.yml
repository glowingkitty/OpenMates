id: web-workspace-navigation-cache
title: Immediate recent workspace navigation with current content
status: verified
goal: so a user could quickly switch between chats, then to tasks, then to projects - with minimal to none delay
  before seeing the rendered chats, tasks, workflows, projects.
request_scope: The user approved implementation on 2026-09-30 after live observation and the final recommendation.
  Implement P1-P3 and their correctness/verification requirements. P4 persistence and populated project projection
  caching remain conditional on the measured need described below. Scoped dev rollout is authorized by repository
  implementation guidance; production is out of scope.
confirmed_requirements:
- Of course requesting a single task must only load/decrypt that single task.
