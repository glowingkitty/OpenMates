rollout:
  production_migration: not_required
  reason: Task Activity has not shipped to production and the user explicitly rejected backward compatibility for its unreleased ciphertext format.
  development_state:
    - Update the Directus schema and setup migration to remove encrypted_entry_key and add assignment identity plus lifecycle metadata.
    - Reset or normalize disposable development Task/Activity fixtures as needed; do not add dual-read or dual-write behavior.
  deployment:
    - Rebuild/restart the local API and affected workers through openmates server commands.
    - Prove REST, CLI, npm, and pip behavior against api.dev.openmates.org before deploying web.
    - Deploy through sessions.py and run commit-scoped web verification before updating the validated OpenCode runtime.
    - Audit active OpenCode sessions before restarting its server; do not interrupt busy chats.

