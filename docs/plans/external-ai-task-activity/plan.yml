  specifications:
    - feature.tasks@4 is approved at fingerprint 5e7167beae96b903de9c67b65dc93bde4567846ea12cada88aa4333b44dac312.
  plans:
    - docs/plans/opencode-external-task-bridge/plan.yml implements the current external-chat bridge but conflates native and external AI as assignee_type ai.
    - docs/plans/task-activity-comments/plan.yml implements the unreleased per-entry wrapped-key Activity format and generic comment transport.
    - docs/plans/task-queue-auto-continuation/plan.yml assumes assignee_type ai for native queue admission.
  code_patterns:
    - backend/core/api/app/services/user_task_service.py already accepts AI assignment during create; the two-step OpenCode workaround exists only in scripts/sessions.py.
    - backend/core/api/app/services/directus/user_task_methods.py currently creates only user-authored comment_added Activity rows.
    - Task queue and admission services identify native execution with assignee_type == ai and must move to openmates.
    - Web and CLI Activity clients currently generate an entry key, wrap it with the Task key, then encrypt the comment with the entry key.
    - Directus user_task_activity already supports comment, lifecycle_update, and tombstone kinds plus safe event metadata.
    - OpenCode request instructions require Task creation and explicit completion but do not require meaningful Activity summaries.
  tests:
    - backend/tests/test_user_tasks_api.py
    - backend/tests/test_user_task_activity_api.py
    - backend/tests/test_user_task_admission.py
    - backend/tests/test_task_queue_auto_continuation.py
