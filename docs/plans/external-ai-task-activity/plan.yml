    status: checking
    evidence: []

risks:
  - id: R-1
    risk: Task mutations and lifecycle entries can diverge if implemented as two independent Directus requests.
    mitigation: Add one transaction-capable persistence operation and test rollback plus idempotent retry behavior.
  - id: R-2
    risk: Replacing ai checks incompletely could admit external_ai work to native capacity or strand OpenMates Tasks.
    mitigation: Centralize assignment predicates and add a repository audit that rejects semantic ai comparisons in Task runtime code.
  - id: R-3
    risk: Reusing a Task key with an AES-GCM nonce or the wrong authenticated context would weaken encryption integrity.
    mitigation: Use existing combined-ciphertext helpers with fresh nonces and deterministic versioned AAD; cover nonce/AAD separation in client tests.
  - id: R-4
    risk: A general CLI credential could spoof OpenCode attribution.
    mitigation: Derive external actor identity from an allowlisted authenticated client/profile binding and reject body-supplied display names.
  - id: R-5
    risk: Milestone instructions could generate noisy Activity streams.
    mitigation: Define bounded posting criteria and deterministic output-quality tests that reject per-command or per-retry posting guidance.
  - id: R-6
    risk: Broad retries could hide permanent request failures or amplify invalid mutations.
    mitigation: Match only gateway and connection-unavailable signatures, cap the retry window at five delays totaling 42 seconds, and test that conflicts fail after one attempt.

scenarios:
  - id: S-1
    title: OpenCode creates its Task atomically
    given:
      - A non-trivial OpenCode session needs a Task.
    when:
      - The bridge calls the trusted CLI once.
    then:
      - The Task is created as external_ai with identity opencode and its encrypted external-chat context.
      - The web UI shows OpenCode as assignee.
      - No intermediate user-owned Task exists.
      - The Task is excluded from native OpenMates admission and capacity.
  - id: S-2
    title: Explicit human work stays human-owned
    given:
      - The user asks for a Task they must perform personally or in the physical world.
    when:
      - OpenCode creates the Task.
    then:
      - The Task is assigned to the authenticated human identity.
      - OpenCode does not claim or auto-complete it.
  - id: S-3
    title: Activity uses the Task key directly
    given:
      - An authorized client has the Task key and posts a comment with an embed.
    when:
      - It constructs the Activity request.
    then:
      - Comment ciphertext and embed-key ciphertext use independent fresh nonces and versioned bound AAD.
      - No encrypted_entry_key is generated, accepted, returned, or stored.
      - Authorized clients decrypt the same comment and embed keys with the Task key.
  - id: S-4
    title: Status mutation generates authoritative Activity
    given:
      - A Task is todo.
    when:
      - Any authorized surface changes it to in_progress.
    then:
      - The mutation atomically stores the new status and one system lifecycle_update using event_type status.
      - The entry carries previous_status todo and next_status in_progress as safe metadata.
      - A retry or no-op update does not duplicate the lifecycle entry.
  - id: S-5
    title: OpenCode records a meaningful summarized update
    given:
      - OpenCode completes a meaningful milestone or discovers a durable learning.
    when:
      - It invokes the Task bridge Activity action.
    then:
      - One ordinary encrypted comment_added entry is attributed to external_ai/opencode and rendered as OpenCode.
      - Routine commands, retries, and internal subagent chatter are not posted.
      - Status changes still generate separate backend-owned system entries.
  - id: S-6
    title: API restart does not strand Task bridge work
    given:
      - The dev API is briefly unavailable while its container restarts.
    when:
      - OpenCode invokes a Task bridge command during the unavailable window.
    then:
      - The CLI describes 502, 503, and 504 session checks as temporary rather than invalid login.
      - The bridge retries with bounded backoff and returns the successful result once the API is ready.
      - Authentication, validation, authorization, and conflict errors are not retried.

