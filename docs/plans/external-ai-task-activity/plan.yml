schema_version: 2
id: external-ai-task-activity
title: Named External-AI Task Assignment and Activity
status: implementing

goal: >
  Distinguish native OpenMates, human, and named external-AI Task assignment;
  create OpenCode Tasks atomically as external_ai/opencode; simplify unreleased
  Activity encryption to use the Task key directly; generate lifecycle Activity
  centrally for Task state changes; and make OpenCode post concise milestone and
  learning summaries as ordinary encrypted comments.
  OpenCode Task bridge calls also tolerate short dev-API restart windows through
  bounded retries while permanent authentication and request errors fail immediately.

specification_refs:
  - id: feature.tasks
    version: 4
    role: primary
    fingerprint: 5e7167beae96b903de9c67b65dc93bde4567846ea12cada88aa4333b44dac312

specification_impact:
  classification: approved_semantic_change
  specification_update_required: false
  affected_assertions:
    - tasks.content.client-encrypted
    - tasks.lifecycle.visible
    - tasks.assignment.identity-separated
    - tasks.external-chat.encrypted-context
    - tasks.activity.client-encrypted
    - tasks.activity.context-attribution
    - tasks.activity.lifecycle-system-generated
    - tasks.activity.task-scoped-authorization
    - tasks.execution.capacity-scoped
    - tasks.surface.semantic-parity

