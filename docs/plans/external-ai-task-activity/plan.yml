decisions:
  - id: D-1
    status: active
    decision: Assignment type and assignment identity are separate; external_ai/opencode renders OpenCode and openmates/openmates renders OpenMates.
    reason: Execution ownership is semantic while identity controls trusted human-readable attribution.
    decided_at: "2026-09-04T13:35:00Z"
  - id: D-2
    status: active
    decision: OpenCode creates external_ai/opencode Tasks atomically, except explicitly human or real-world Tasks which remain user-assigned.
    reason: The current create-as-user then edit-to-AI sequence leaves orphan Tasks when the second request fails.
    decided_at: "2026-09-04T13:35:00Z"
  - id: D-3
    status: active
    decision: Unreleased Activity comments and embed-key material are encrypted directly with the Task key; no compatibility decoder or migration is retained.
    reason: Per-entry keys wrapped by the same Task key add complexity without a current independent-sharing, rotation, or revocation requirement.
    decided_at: "2026-09-04T13:35:00Z"
  - id: D-4
    status: active
    decision: Backend Task mutations generate lifecycle Activity; OpenCode never implements lifecycle history itself.
    reason: Every client and automation path must produce identical authoritative history.
    decided_at: "2026-09-04T13:35:00Z"
  - id: D-5
    status: active
    decision: OpenCode progress summaries reuse comment_added and carry their meaning in encrypted prose rather than new event categories.
    reason: Milestone and learning labels are agent workflow concepts, not durable Task event taxonomy.
    decided_at: "2026-09-04T13:35:00Z"
  - id: D-6
    status: active
    decision: The OpenCode Task bridge retries only recognizable transient API restart failures with bounded backoff; authentication, validation, authorization, and conflict failures remain terminal.
    reason: A dev API container replacement must not falsely invalidate the CLI login or strand otherwise successful Task workflow updates.
    decided_at: "2026-09-04T14:30:00Z"

assumptions:
  - id: A-1
    text: Task Activity has no production records requiring ciphertext compatibility.
    category: rollout
    required_before: implementation
