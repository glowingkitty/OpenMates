implementation_state:
  subject_commit: 8e585234e0bc3aabc147825cdf4001ebb277b9b9

scope:
  in:
    - Replace assignee_type ai with user, openmates, external_ai, and unassigned semantics across persisted Tasks and every exposed client.
    - Store a safe allowlisted assignee_identity and derive its display name and icon from one shared identity registry.
    - Support openmates/OpenMates and opencode/OpenCode identities initially without accepting caller-defined display names.
    - Create OpenCode-owned external-chat Tasks in one API mutation as external_ai/opencode; create explicitly human or real-world work as user-assigned.
    - Restrict native OpenMates queue admission and capacity accounting to openmates-assigned Tasks.
    - Remove encrypted_entry_key from the unreleased Activity format and encrypt comment text plus embed-key material directly with the Task key using unique AES-GCM nonces and bound AAD.
    - Create one system lifecycle_update for Task creation and each actual status transition in the backend mutation boundary.
    - Reuse created, status, comment_added, and comment_deleted event types; OpenCode milestones and learnings remain ordinary comments.
    - Attribute trusted OpenCode comments as external_ai/opencode and render OpenCode in Task assignment and Activity UI.
    - Update OpenCode bridge instructions and tests so milestone, learning, blocker, and completion summaries are posted without logging routine commands or retries.
    - Retry Task bridge commands across bounded 502/503/504 and connection-unavailable windows caused by dev API restarts.
  out:
    - Backward-compatible Activity ciphertext decoding or migration; Task Activity has not shipped to production.
    - Arbitrary third-party identity registration or caller-controlled assignee display names.
    - OpenCode-specific lifecycle event types or client-generated status history.
    - Posting every tool call, test, retry, heartbeat, or subagent message to Activity.
    - Giving external_ai Tasks access to native OpenMates execution capacity.
    - Recursive Tasks for internal OpenCode subagent work.

context_discovery:
  github_issues:
