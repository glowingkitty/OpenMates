technical_boundaries:
  assignment:
    persisted_types: [user, openmates, external_ai, unassigned]
    identity_registry:
      openmates: OpenMates
      opencode: OpenCode
    native_execution_predicate: assignee_type == openmates
  activity_encryption:
    key: Task key
    algorithm: existing client AES-GCM combined-ciphertext helper
    nonce: fresh random nonce for every comment and embed-key payload
    comment_aad: task_activity_comment:<task_id>:<entry_id>:v1
    embed_aad: task_activity_embed_keys:<task_id>:<entry_id>:v1
    removed_field: encrypted_entry_key
  lifecycle:
    actor_type: system
    source_surface: system
    creation_event: created
    transition_event: status
    status_metadata: [previous_status, next_status]
    consistency: Task row and lifecycle row commit in one transaction-capable operation.

data_flow_examples:
  opencode_create:
    - OpenCode calls openmates_task create with default ownership external_ai/opencode and its external chat context.
    - sessions.py invokes one openmates tasks create JSON command containing assignment and encrypted context inputs.
    - The API validates identity/type pairing and persists the Task plus created lifecycle entry atomically.
  opencode_comment:
    - OpenCode calls openmates_task activity_add with a concise summary.
    - The CLI unlocks the Task key, encrypts the summary directly with bound AAD, and sends ciphertext.
    - The API derives external_ai/opencode attribution from the trusted OpenCode client binding and stores comment_added.
  status_transition:
    - Any client sends an optimistic-version Task status mutation.
    - The backend compares prior and next status and commits the Task row plus one system status lifecycle entry.
    - Activity readers render the safe transition without decryption.

contracts:
  api:
    access_model: first-party client surface only
    routes:
      - POST /v1/user-tasks
      - PATCH /v1/user-tasks/{task_id}
      - POST /v1/user-tasks/{task_id}/activity
      - GET /v1/user-tasks/{task_id}/activity
      - DELETE /v1/user-tasks/{task_id}/activity/{entry_id}
    auth: Authenticated web session or approved first-party CLI/npm/pip device credential; owner or authorized Team role.
    owner_team_scope: Existing Task read/mutation authorization; Team viewers remain read-only.
    rate_limits: Existing Task read 60/minute and mutation 30/minute limits.
    credit_budget: No credits; uploads and voice transcription retain their independent existing limits.
    encryption_boundary: Activity routes accept and return Task-key ciphertext and opaque embed references only; no server-side Task-key or content decryption.
    public_allowlist: The encrypted Activity surface remains unavailable to unauthenticated public or generic developer API clients.
  cli:
    assignment_inputs: [user, openmates, external-ai]
    external_identity_input: Allowlisted identity opencode, inferred by the OpenCode bridge but represented explicitly in JSON.
    activity: Existing list/add/delete commands retain generic event types and gain trusted external-AI attribution when invoked through the OpenCode binding.
  sdks:
    npm: Assignment identity and direct Task-key Activity encryption/decryption parity.
    pip: Assignment identity and direct Task-key Activity encryption/decryption parity.
  web:
    assignment: Resolve safe identity keys through the shared registry and render OpenCode/OpenMates.
    activity: Render named external-AI comments and backend lifecycle status entries in the existing final Activity section.
  opencode:
    source_of_truth: OpenMates Task CLI JSON output only.
    create_default: external_ai/opencode for OpenCode work; user only for explicitly human or real-world work.
    comments: Post one ordinary summarized comment at meaningful milestones, durable learnings/decisions, user-relevant blockers, and completion.
    prohibited: Per-command updates, custom event categories, client-generated lifecycle entries, and internal-subagent Task duplication.

