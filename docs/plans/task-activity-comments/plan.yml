contracts:
  api:
    - route: GET /v1/user-tasks/{task_id}/activity
      access_model: first-party client surface only
      auth: authenticated session or approved CLI/npm/pip device API key; owner or authorized Team reader
      request: "query: team_id?, cursor?, limit?"
      response: "{ entries: EncryptedTaskActivityEntry[], next_cursor?: string }"
      errors: [401 unauthenticated, 403 unauthorized, 404 task missing, 429 standard read limit]
      rate_limits: 60/minute per existing Task read conventions
      credit_budget: no credits
      encryption_boundary: Returns ciphertext and safe metadata only; no server-side decryption.
    - route: POST /v1/user-tasks/{task_id}/activity
      access_model: first-party client surface only
      auth: authenticated session or approved CLI/npm/pip device API key; owner or Team owner/admin/member
      request: "{ entry_id, encrypted_entry_key, encrypted_message, encrypted_embed_key_material?, embed_refs?, created_at, team_id? }"
      response: "{ entry: EncryptedTaskActivityEntry }"
      errors: [400 invalid encrypted payload, 401 unauthenticated, 403 viewer or unauthorized, 404 task missing, 409 conflicting entry identity, 429 standard mutation limit]
      rate_limits: 30/minute per existing Task mutation conventions
      credit_budget: no credits; voice transcription and upload retain their existing independent limits/cost behavior
      encryption_boundary: Client encrypts text and key material before submission; backend stores no comment, transcript, file, entry-key, embed-key, or Task-key plaintext.
    - route: DELETE /v1/user-tasks/{task_id}/activity/{entry_id}
      access_model: first-party client surface only
      auth: authenticated session or approved CLI/npm/pip device API key; comment author or Task-mutation-authorized role
      request: "{ team_id? }"
      response: "{ entry: TaskActivityTombstone }"
      errors: [401 unauthenticated, 403 unauthorized, 404 task or entry missing, 409 already changed, 429 standard mutation limit]
      rate_limits: 30/minute per existing Task mutation conventions
      credit_budget: no credits
      encryption_boundary: Backend suppresses encrypted content/embed references from normal response and retains safe author/deleter tombstone metadata.
  data:
    - user_task_activity gains a stable entry_id, owner/Team scope, source_surface, encrypted_entry_key, encrypted_embed_key_material, embed references, deletion timestamp, and deleting-user hash while preserving encrypted_message and safe event metadata.
    - Actor and source attribution are derived from authenticated identity and allowlisted client identity, not arbitrary user-authored display strings.
    - A unique task_id plus entry_id constraint makes retrying create idempotent; created_at plus entry_id defines stable order.
    - Deletion is logical for Activity rendering; private ciphertext/embed references are removed or suppressed according to retention policy while safe tombstone metadata remains.
  ui_states:
    - Loading, empty, ready, text draft, recording, transcribing, uploading, upload failed, sending, create failed, populated stream, delete confirmation, delete failed, and tombstone.
    - Team viewer read-only Activity hides or disables mutation controls with accessible explanation.
    - Laptop and phone layouts keep the final Activity section and composer reachable without horizontal overflow or obscured content.
  privacy_security:
    - Never log or index decrypted comment text, voice transcripts, file content, raw Task keys, raw entry keys, or raw embed keys.
    - Profile display data is resolved only for users authorized to read the Team Task.
    - Client source labels are validated against authenticated first-party client identity to prevent attribution spoofing.

