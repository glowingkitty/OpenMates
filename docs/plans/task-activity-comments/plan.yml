decisions:
  - id: D-1
    status: active
    decision: Extend user_task_activity as the canonical Activity store; keep workspace change-set history separate.
    reason: Current dev already has both concepts, and the approved Specification requires one user-facing Activity stream without conflating it with restore history.
    decided_at: "2026-09-03T17:46:03Z"
  - id: D-2
    status: active
    decision: Activity endpoints are first-party client surface only and accept/return ciphertext without server-side decryption.
    reason: The endpoints handle client-side encrypted Task, entry-key, and embed-key material.
    decided_at: "2026-09-03T17:46:03Z"
  - id: D-3
    status: active
    decision: The server derives or validates source_surface from authenticated client identity instead of trusting arbitrary caller attribution.
    reason: CLI/SDK via labels and Team attribution must not be spoofable by request content.
    decided_at: "2026-09-03T17:46:03Z"
  - id: D-4
    status: active
    decision: Reuse message-processing services and subcomponents behind a Task-specific composer adapter rather than nesting a chat-only MessageInput instance unchanged.
    reason: Activity needs full voice/upload/embed parity but sends an encrypted Activity entry instead of a chat turn.
    decided_at: "2026-09-03T17:46:03Z"
  - id: D-5
    status: active
    decision: Delete comments logically by replacing normal rendering with immutable author/deleter tombstone metadata.
    reason: The approved wording requires attribution after content and attachments disappear from normal rendering.
    decided_at: "2026-09-03T17:46:03Z"

