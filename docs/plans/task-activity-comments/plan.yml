implementation_notes:
  plan_path: docs/plans/task-activity-comments/plan.yml
  existing_patterns:
    - Extend user_task_activity and UserTaskMethods rather than introducing a parallel comment persistence service.
    - Reuse UserTaskService task-key handling and MessageInput processing helpers for client encryption and rich composer inputs.
    - Extend existing task CLI and SDK facades plus their real dev-server smoke scripts.
  architecture: >
    Evolve user_task_activity into a Task-owned append-oriented encrypted stream.
    Clients unlock the Task key, generate/wrap entry and embed key material, and
    encrypt/decrypt Activity locally. The API authorizes against the parent Task,
    derives attribution metadata from authenticated identity, and never decrypts
    private content. A focused TaskActivity component adapts shared message
    processing to Activity persistence and is mounted last by TaskDetailContent.
  data_flow:
    - Client loads the parent Task and unlocks its Task key.
    - Composer reuses message input processing to finish transcription/uploads and collect embed references.
    - Client generates an entry identity/key, encrypts text, wraps entry/embed keys through the Task key, and submits ciphertext.
    - API verifies Task access, derives actor/source metadata, writes one idempotent Activity row, and returns ciphertext plus safe metadata.
    - Authorized clients list and decrypt entries locally, resolve Team display identity/profile data, and render stable chronological Activity.
    - Authorized deletion removes/suppresses content and embed references and returns safe tombstone metadata.
  affected_files:
    - {path: backend/core/directus/schemas/user_tasks.yml, reason: Extend canonical Activity schema and indexes.}
    - {path: backend/core/api/app/routes/user_tasks.py, reason: Add encrypted first-party Activity endpoints and authorization.}
    - {path: backend/core/api/app/services/user_task_service.py, reason: Enforce parent Task existence before Activity persistence.}
    - {path: backend/core/api/app/services/directus/user_task_methods.py, reason: Add owner/Team-scoped Activity persistence.}
    - {path: backend/tests/test_user_task_activity_api.py, reason: Backend privacy, auth, attribution, ordering, and tombstone contract.}
    - {path: scripts/verify_task_activity_api_live.py, reason: Real dev API phase gate.}
    - {path: specifications/generated/assertion-index.yml, reason: Regenerated assertion-to-test traceability for Activity contract tests.}
    - {path: specifications/generated/coverage.yml, reason: Regenerated Specification coverage for Activity contract tests.}
    - {path: frontend/packages/openmates-cli/src/client.ts, reason: Activity wire types and methods.}
    - {path: frontend/packages/openmates-cli/src/tasksCli.ts, reason: Local Activity encryption/decryption and rendering.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Task Activity commands and help.}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: npm Activity facade.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: pip Activity facade and encryption.}
    - {path: scripts/verify_tasks_cli_smoke.py, reason: Real CLI Activity phase gate.}
    - {path: scripts/verify_sdk_tasks_live_smoke.mjs, reason: Real npm/pip Activity phase gate.}
    - {path: frontend/packages/ui/src/services/userTaskService.ts, reason: Browser Activity models, crypto, and API calls.}
    - {path: frontend/packages/ui/src/components/tasks/TaskActivity.svelte, reason: Unified Activity stream and composer adapter.}
    - {path: frontend/packages/ui/src/components/tasks/TaskActivity.preview.ts, reason: Deterministic component states.}
    - {path: frontend/packages/ui/src/components/tasks/TaskDetailContent.svelte, reason: Mount Activity as final detail section.}
    - {path: frontend/apps/web_app/tests/task-activity.spec.ts, reason: Deployed component behavior and proof contract.}
  rollout:
    - Apply Directus schema additions before enabling client Activity mutations.
    - Preserve existing user_task_activity rows as lifecycle entries; migration must not invent plaintext or require decrypting legacy ciphertext.
    - Backend/API deploy precedes real API, CLI, SDK, and web gates; web deploy follows successful direct API/CLI/SDK evidence.
  documentation_impact:
    - Update task user-guide/API/CLI references only after implementation names and command syntax are verified.
  verification_strategy:
    - Write and run backend privacy/authorization tests before API product code.
    - Prove the encrypted contract against the real dev API before CLI, SDK, or web work.
    - Prove real CLI and npm/pip SDK behavior before deploying and testing the web component.
    - Verify the deployed bare component at laptop and phone sizes, then review visual smoke and proof videos before user confirmation.
  verification_order:
    - Backend schema/routes and direct real dev API contract first.
    - Real OpenMates CLI command against the dev API second.
    - npm and pip SDK calls plus parity audit against the dev API third.
    - Wire successful direct coverage into CI/daily tests before web implementation.
    - Web service/component and deployed component Playwright fourth.
    - Reviewed laptop/mobile visual smoke fifth.
    - Reviewed laptop/phone proof videos, then user confirmation sixth.
    - Apple parity implementation last in a later Plan; record deferral here.

