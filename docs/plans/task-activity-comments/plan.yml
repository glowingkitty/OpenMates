schema_version: 2
id: task-activity-comments
title: Task Activity Comments
status: implementing

goal: >
  Make Activity the single final section of Task detail, with a composer at the
  top that supports multiline text, voice, files/uploads, and normal message
  embeds; keep Activity content and embed keys client-encrypted through the Task
  key boundary; and preserve the approved personal, Team, CLI, SDK, OpenMates,
  and deletion-tombstone attribution semantics across supported surfaces.

scope:
  in:
    - Extend the existing user_task_activity collection into the canonical Task Activity store rather than introducing a parallel comment or update collection.
    - Add first-party task-scoped list, create-comment, and delete-comment routes with owner/Team authorization, idempotent entry identities, and standard Task rate limits.
    - Store comment text, entry-key wrappers, and embed-key material as client ciphertext while retaining only approved routing, attribution, ordering, and tombstone metadata server-side.
    - Add account-wide and Team-aware CLI commands for listing, adding, and deleting Task Activity comments.
    - Add semantically equivalent npm and pip SDK methods with local encryption/decryption.
    - Add one final Activity section to Task detail with a top composer that reuses normal message input processing for multiline text, voice, uploads, and embeds.
    - Render comments, lifecycle updates, and tombstones in one stable chronological stream with approved source-aware attribution.
    - Add direct dev API, CLI, npm SDK, pip SDK, deployed component Playwright, visual-smoke, proof-video, and user-confirmation evidence in the mandated order.
  out:
    - A standalone Activity or Comments Specification, separate Updates and Comments UI sections, or a second Task history source of truth.
    - Public unauthenticated or generic developer API access to encrypted Task Activity.
    - Server-side plaintext comment search, server-side content decryption, notification delivery, reactions, threaded replies, or comment editing.
    - Replacing workspace change-set history or restore APIs; those remain audit/restore infrastructure and are not rendered by default as Activity.
    - Native Apple Task Activity implementation in this Plan; required parity is recorded for a later Apple Tasks slice.

