clarification:
  rounds:
    - question: Should Activity/comments be a standalone Specification or part of Tasks?
      answer: Activity/comments must be part of the Task Specification.
    - question: Should the Task Specification remain draft?
      answer: No; approve feature.tasks@3 together with the Activity/comment requirements.
  vision_summary: >
    Task Activity is intrinsic Task behavior. It is one final Task-detail section,
    not a separate product domain, and combines rich encrypted comments, visible
    lifecycle updates, source-aware attribution, and deletion tombstones.
  approved_by_user: true

