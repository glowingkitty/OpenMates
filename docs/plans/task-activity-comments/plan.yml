risks:
  - id: R-1
    risk: Reusing MessageInput directly could accidentally submit a chat message or duplicate its large state machine.
    mitigation: Extract or reuse focused processing helpers/subcomponents and prove the Task adapter never calls chat-send persistence.
  - id: R-2
    risk: Client-supplied actor/source metadata could spoof Team attribution.
    mitigation: Resolve actor identity from authentication and allowlisted client headers; test spoofed fields are ignored or rejected.
  - id: R-3
    risk: Comment deletion could orphan uploaded files or leak decrypted previews through local state.
    mitigation: Tombstone rendering removes content/embed references immediately and cleanup behavior is explicit and tested.
  - id: R-4
    risk: Existing task history consumers could confuse restore history with Activity.
    mitigation: Use dedicated Activity endpoints and models while leaving /history and /restore semantics unchanged.

scenarios:
  - id: S-1
    title: Personal Task receives a rich encrypted comment
    given:
      - Alice can mutate a personal Task and unlock its Task key locally.
    when:
      - Alice enters multiline text, records voice, and attaches a private file in the Activity composer.
      - Alice sends the Activity comment after transcription and upload complete.
    then:
      - One idempotent comment entry appears below the composer in the final Activity section.
      - Text and entry-key material are client ciphertext, and the uploaded embed key is decryptable through the Task key boundary.
      - No chat message is created and no private plaintext is durably stored by the backend.
  - id: S-2
    title: Team attribution identifies the user and client surface
    given:
      - Sam can mutate a Team Task and has a profile image.
    when:
      - Sam comments from web, Apple, CLI, npm SDK, and pip SDK clients.
    then:
      - Web and Apple entries show Sam plus the profile image with no via suffix.
      - CLI entries add via OpenMates CLI, while npm and pip entries add via OpenMates SDK.
      - A mate-authored entry shows OpenMates and never the mate's actual name.
  - id: S-3
    title: Authorized deletion leaves an attributed tombstone
    given:
      - Activity contains comments by Sam and OpenMates.
    when:
      - Sam deletes an own comment and an authorized Team admin Taylor deletes another comment.
    then:
      - Content, attachment links, and embed previews disappear from normal rendering.
      - Tombstones read Comment by Sam deleted by Sam, Comment by Sam deleted by Taylor, or Comment by OpenMates deleted by Sam as applicable.
  - id: S-4
    title: Read-only Team member cannot mutate Activity
    given:
      - Lee is a Team viewer who may read the Task.
    when:
      - Lee attempts to add or delete an Activity comment.
    then:
      - The API rejects the action before mutation and every client presents a visible permission failure.
  - id: S-5
    title: Lifecycle updates and comments share one Activity stream
    given:
      - A Task has blocked, comment-added, completed, and comment-deleted entries.
    when:
      - An authorized client lists Activity.
    then:
      - Entries use stable chronological ordering and idempotent identities in one stream.
      - Workspace restore history is not rendered unless explicitly materialized as a user-facing lifecycle entry.

