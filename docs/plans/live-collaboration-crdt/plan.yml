schema_version: 2
profile: concise
id: live-collaboration-crdt
title: Live editing of documents, sheets, slides and code files with an encrypted CRDT
status: implementing
goal: "Documents, sheets, decks and hosted Project code files can be edited live: assistant edits appear while the assistant writes and never overwrite a newer human change, one account edits on several devices, and Team and Project members co-edit with presence, offline merge and a session-grouped version timeline, while the server only handles ciphertext."
specifications:
  - feature.live-collaboration@1
context:
  - "v2 proposal 2026-11-14 (architecture-v2.md): audit, levels R1-R5, options (encrypted Yjs relay in the core / PowerSync / Automerge+Keyhive), recommendation. Builds on the Phase 0 spike (spike.md, done 2026-11-10)."
  - "Already shipped: single-user core deck replica on yrs with typed operations and undo (client/shared_items/deck*.rs) driving the web slides editor; whole-version saves with a stale-base refusal for all four types (embed_user_revision.rs); Project file create/edit on web (7512c73eb1, dev-only)."
  - "Build contract for the parallel lanes: build-contract.md (2026-11-22). Built on a session worktree and proven in isolated CI/E2B only; merge to dev only after the owner's go (planned 2026-11-23 ~15:00)."
scope:
  - "Phase 1 - one core model for all four types (single user): sheet, document and code schema adapters next to the deck in the core, parsers/serialisers to the markdown table, docx_model and file text; web document editor on TipTap with the collaboration extension and code editor on CodeMirror 6 with y-codemirror, both as typing mirrors; sheet grid sends typed operations; contenteditable and textarea editors deleted; saves still whole versions. Tests: core round-trip property tests per type (text form -> model -> text form is identical), id-based formula rewrite tests, convergence tests per type; component specs docs-editor, code-editor, sheet-fullscreen, slides-editor updated; projects-create-edit-files.spec.ts and embed-diff-editing.spec.ts stay green; docx_model survives a manual edit (new assertion in docs-editor spec)."
  - "Phase 2 - encrypted log, relay and the same account on two devices (R3): item_subscribe / item_update / item_snapshot / item_presence WebSocket messages with typed refusals, Redis hot tail with batched append-only Directus storage, client snapshots with second-load confirmation before compaction, AES-GCM packets with item id, kind and key epoch in the AAD, automatic saving with Saved/waiting states, checkpoint versions in embed_diffs, offline outbox in the core cache. Tests: pytest for ciphertext-only storage, sequence assignment, refusal of foreign or relabelled packets and compaction safety; core tests for outbox merge and snapshot+tail rebuild; CLI E2E editing a code file while a second CLI session sees it; two-context Playwright spec (same account, two browser contexts) for each type, including a disconnect-and-reconnect merge."
  - "Phase 3 - live assistant edits as change sets (R1, R2): the core pins the base for each assistant read, applies each finished hunk on a fork and broadcasts the change set; one undo step and one checkpoint per turn; deferred application when the requester is offline; the server-side current_version + 1 write in stream_consumer.py is removed for all four types. Tests: core tests for hunk-by-hunk application that keeps concurrent edits (doc paragraphs and marks, sheet cells, slide elements, code lines); pytest that the AI path no longer writes embed versions; real-stack Playwright spec where the user types while the assistant edits and both survive, with the change visible before the turn ends; CLI E2E for an assistant edit of a hosted code file."
  - "Phase 4 - Team and Project members co-edit (R4): access by membership role (view, comment, edit) checked per packet, immediate cut-off on removal, encrypted presence with names, colours, cursors and selections, sender stamping and contributors per version. Tests: pytest for role refusals and mid-session removal; core presence expiry tests; two-user Playwright specs per type (concurrent edits, presence, same-cell conflict, restore for everyone); Team Project save scope added to the core (today Team scope returns null)."
  - "Phase 5 - key epochs and Team key rotation on member removal: item-key epochs with wrappers per epoch, Team key rotation with Project key re-wrap, fresh snapshot under the new epoch, re-sealing of offline outboxes, private copy when access was lost offline. Built together with phase 4 (owner decision Q5, 2026-11-22). Tests: core tests that a removed member's keys cannot open packets of the new epoch; pytest that wrappers for the removed member are gone and stale epochs are refused."
  - "Later (not in this build, owner 2026-11-22): editing and commenting through share links (they stay view-only), anonymous guests, encrypted comments, Apple editors (TASK-6504)."
checks:
  - Rust unit and property tests for convergence, same-cell and same-property conflicts, offline merge, assistant change sets and key epochs for all four types.
  - REST and WebSocket tests in isolated CI for ciphertext-only storage, role refusals, removal mid-session, share-link authorisation, expiry, revoke and guest limits.
  - Two-context and two-user web E2E in isolated CI for a document, a sheet, a deck and a code file; CLI E2E for code files.
  - A result video on the deployed commit for each phase that changes visible behaviour (phases 2, 3, 4 and 6).
decisions:
  - CRDT, not operational transform, because the server must not read content.
  - Yjs format with yrs in the Rust core, confirmed by the Phase 0 spike (spike.md).
  - "The Rust core holds the authoritative replica of each open item and owns structure, merge, assistant diffs, undo, versions, persistence, crypto and sync. Sheet and slides editors send typed operations to the core and render its view model; no TypeScript schema accessors for sheets or slides. A JS Yjs mirror on the main thread is allowed only for rich-text typing (document editor, slide text boxes) and only exchanges update bytes with the core. Apple calls the core directly without a mirror (user decision 2026-11-10; replaces spike architecture b for sheets and slides)."
  - Sheet formulas are stored in id form inside the shared model and shown as A1; the markdown table the assistant edits stays A1 (spike recommendation, adopted as default).
  - Editors are built on the shared model from the start and ship single-user first; multi-user is switched on later (user decision 2026-11-10).
  - "Docs, sheets and code that the assistant creates support live collaborative editing, including across Teams; this work absorbed the Projects doc/sheet/code editing item and the open note whether PowerSync is needed (owner, 2026-11-10 daily meeting)."
  - "Share links: the owner asked on 2026-11-14 for editing through share links by signed-in outsiders and anonymous visitors, view-only by default; this replaces the 2026-11-10 decision that share links stay view-only."
  - "Owner answers 2026-11-22 (receipt 14ec110bcfa6810c): Q1 encrypted Yjs/yrs log in the Rust core, no PowerSync, no Automerge; Q2 live assistant edits and multi-device first, then Team co-editing; Q3 TipTap for documents and CodeMirror for code, each with a typing mirror; Q4 autosave, no Save step; Q5 rotate the Team key on every member removal; Q6-Q8 guests, share-link editing and comments later, share links stay view-only."
  - "Timeline (owner 2026-11-22): never per keystroke; versions grouped per editing session after a few idle minutes, with contributors; named versions; each assistant edit its own entry and one undo step; restore creates a new version for everyone and never deletes; tiny steps compacted after about 30 days; the embed_diffs timeline and previews keep working."
  - "Assistant and human (owner 2026-11-22): the human wins and the assistant never overwrites a newer human change; the assistant reads a frozen state and writes its diff as today, which the core turns into one change set anchored to content; a soft lock shows '<mate> is editing here' once its diff streams; same spot changed: re-read and regenerate once, then a suggestion card; big changes elsewhere: re-check or ask in chat; target deleted: drop and say so in chat; sheets per cell, a human-changed cell becomes a suggestion, formulas to deleted rows show an error; two assistants take turns; hosted Project code: the assistant edits its E2B sandbox copy and merges on write-back, same lines become a proposal, tests rerun after the merge."
