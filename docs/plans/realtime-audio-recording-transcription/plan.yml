context_discovery:
  code_patterns:
    - frontend/packages/ui/src/components/enter_message/RecordAudio.svelte currently records a complete MediaRecorder blob and only displays time plus waveform.
    - frontend/packages/ui/src/components/enter_message/embedHandlers.ts uploads first, then calls the blocking batch transcribe endpoint, which also waits for Gemini correction.
    - frontend/packages/ui/src/components/enter_message/handlers/sendHandlers.ts already snapshots uploading and transcribing embeds and finalizes immediate sends in place.
    - backend/apps/audio/skills/transcribe_skill.py currently performs batch Voxtral transcription, waveform extraction, and Gemini correction serially.
    - backend/core/api/app/routes/auth_ws.py provides the existing session, device, and short-lived WebSocket-token authentication contract.
  provider_research:
    - Mistral documents voxtral-mini-transcribe-realtime-2602 as a native streaming model with configurable sub-second latency.
    - Mistral prices realtime transcription at $0.006 per minute and batch Voxtral Mini Transcribe V2 at $0.003 per minute.
    - Mistral's protocol accepts base64 PCM append messages and emits incremental transcription.text.delta plus final transcription.done events.

