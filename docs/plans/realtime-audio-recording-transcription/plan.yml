tests:
  - id: T-PYTEST-REALTIME
    type: pytest
    command: PYTHONPATH=/tmp/openmates-audio-test-deps:. python3 -m pytest backend/tests/test_audio_realtime_transcription.py backend/tests/test_audio_transcribe_ascii_sanitization.py -q
    file: backend/tests/test_audio_realtime_transcription.py
    assertions:
      - Origin validation and one-stream admission fail closed before provider use.
      - Provider PCM, text deltas, and final text are relayed without persisting transcript content.
      - Correction success and failure produce the documented terminal events.
      - Provider usage is billed once at six credits per started minute, including client disconnect after audio use.
    covers: [AC-3, AC-6]
    red_phase: {required: true, expected: fail, evidence: {status: skipped_with_reason, reason: "Focused proxy tests were added with the implementation; no pre-implementation route existed to execute.", timestamp: "2026-09-19T20:02:46Z"}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "PYTHONPATH=/tmp/openmates-audio-test-deps:. python3 -m pytest backend/tests/test_audio_realtime_transcription.py backend/tests/test_audio_transcribe_ascii_sanitization.py -q", run_id: "local-audio-realtime-20260919", subject_commit: "ac16ba9d4f2a73c5898bba0727b937be6dad7136", timestamp: "2026-09-19T20:30:39Z", notes: "12 focused tests passed after the final fail-closed admission and disconnect cleanup changes. Isolated backend run 35465829256 also passed every audio-focused test on candidate f08bf400 while the broad baseline had 126 unrelated failures."}}
  - id: T-VITEST-REALTIME
    type: vitest
    command: pnpm --dir frontend/packages/ui exec vitest run src/services/__tests__/audioRealtimeTranscription.test.ts
    file: frontend/packages/ui/src/services/__tests__/audioRealtimeTranscription.test.ts
    assertions:
      - Float microphone samples are downmixed, resampled, and encoded as bounded PCM16 messages.
      - Text deltas accumulate in order and final transcript plus correction promises resolve independently.
      - Finishing before readiness flushes buffered PCM followed by the end signal.
      - Server failure rejects both result phases and closes the capture cleanly for batch fallback.
    covers: [AC-1, AC-2, AC-3, AC-4]
    red_phase: {required: true, expected: fail, evidence: {status: skipped_with_reason, reason: "The browser capture service and its focused unit test were introduced together.", timestamp: "2026-09-19T20:02:46Z"}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "corepack pnpm --config.engine-strict=false --dir frontend/packages/ui exec vitest run src/services/__tests__/audioRealtimeTranscription.test.ts", run_id: "local-audio-realtime-vitest-20260919", subject_commit: "ac16ba9d4f2a73c5898bba0727b937be6dad7136", timestamp: "2026-09-19T20:30:40Z", notes: "Four focused PCM, lifecycle, late-readiness, and failure tests passed; the final upload-state ordering follow-up is lint-verified and does not change the capture protocol."}}
  - id: T-PLAYWRIGHT-COMPONENT
    type: playwright
    command: Run focused bare component-preview specs through isolated GitHub CI.
    file: frontend/apps/web_app/tests/components/audio-recording-realtime.spec.ts
    target: /dev/preview/embeds/audio/RecordingEmbedPreview?variant=correcting&chrome=0
    execution_environment: isolated_github_ci
    assertions:
      - The recording embed renders raw transcript text and an Auto correction processing indicator without clipping.
    covers: [AC-1, AC-2]
    red_phase: {required: true, expected: fail, evidence: {status: skipped_with_reason, reason: "The new correcting preview variant and its focused component spec were added together.", timestamp: "2026-09-19T20:02:46Z"}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "python3 scripts/ci_coordinator.py wait 2fb3a3189a67004c8f9c084522fdc3da87680085755adb5b5a55e4fbc35697bc --json", run_id: "35465830799", subject_commit: "ac16ba9d4f2a73c5898bba0727b937be6dad7136", target: "github-isolated://localhost:5173/dev/preview/embeds/audio/RecordingEmbedPreview?variant=correcting&chrome=0", deployment_reference: "github-actions:35465830799", timestamp: "2026-09-19T20:12:00Z", notes: "Isolated GitHub component preview executed one assertion set with zero skips, unexpected results, or flakes on candidate f08bf400; subsequent candidate changes only extend flow mocks, coverage registration, and verification records."}}
  - id: T-PLAYWRIGHT-FLOW
    type: playwright
    command: Run the audio recording immediate-send regression spec through isolated GitHub CI.
    file: frontend/apps/web_app/tests/audio-recording-deferred-send.spec.ts
    target: https://app.dev.openmates.org/
    execution_environment: isolated_github_ci
    assertions:
      - Realtime text appears before recording stops.
      - Immediate send creates one optimistic message and patches it with the completed corrected embed.
      - The successful realtime path performs no batch transcription request.
      - Realtime failure performs one batch fallback and preserves the recording.
    covers: [AC-4, AC-5]
    red_phase: {required: true, expected: fail, evidence: {status: failed_as_expected, command: "python3 scripts/ci_coordinator.py wait 89e69b0517fad4c71b4a26b702735ff937ecac72def78e5be0b32a96288463c4 --json", run_id: "35465827524", subject_commit: "f08bf40099fa4dabf93e3905d52090808076f771", timestamp: "2026-09-19T20:12:30Z", reason: "The isolated runner correctly exposed that the external upload boundary was still live; the final cost-free daily spec now mocks that boundary explicitly."}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "python3 scripts/ci_coordinator.py wait 4156d77f53d6aed10ab607460d0a2dc6bac4f93d01a4e6c29237bdde943125a0 --json", run_id: "35466853762", subject_commit: "ac16ba9d4f2a73c5898bba0727b937be6dad7136", target: "github-isolated://localhost:5173/", deployment_reference: "github-actions:35466853762", timestamp: "2026-09-19T20:33:00Z", notes: "Both authenticated audio recording scenarios passed with zero skips, unexpected results, or flakes. Provider and upload boundaries are mocked, so daily execution incurs no Mistral, Gemini, storage, or ElevenLabs spend."}}

