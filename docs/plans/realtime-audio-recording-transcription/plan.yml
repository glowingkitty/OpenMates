schema_version: 2
id: realtime-audio-recording-transcription
title: Realtime Audio Recording Transcription
status: verified

goal: >
  Make web voice messages feel immediate by showing a live transcript while the
  user records, preserving the final raw transcript in the audio embed as soon
  as recording ends, visibly applying automatic correction in parallel with the
  encrypted upload, and finalizing the same embed whether it remains in the
  composer or is sent immediately.

scope:
  in:
    - Authenticated web recordings stream 16 kHz PCM through a first-party WebSocket proxy to Mistral Voxtral Realtime.
    - The recording overlay shows the latest bounded transcript text while audio is still being captured.
    - The audio embed shows the raw realtime transcript immediately and a distinct automatic-correction processing state.
    - Gemini transcript correction begins after the final realtime transcript and overlaps the encrypted audio upload.
    - Successful realtime recordings do not invoke the existing batch Voxtral transcription endpoint a second time.
    - Realtime failure falls back to the existing encrypted upload plus batch transcription path.
    - Cancellation closes capture and provider work without creating an embed; provider usage already incurred remains billable.
    - Immediate send continues to use deferred embed finalization and updates the same optimistic chat message.
    - Provider usage is authenticated, rate/concurrency bounded, duration bounded, and billed at six credits per started minute.
    - Focused backend, frontend unit, component-preview, and browser E2E coverage for the new states and fallback.
  out:
    - Anonymous live transcription or new anonymous provider spend.
    - Apple/native live transcription parity in this slice.
    - Self-hosting the open-weight realtime model.
    - Replacing the existing batch endpoint for uploaded audio files or CLI/SDK clients.
    - Persisting plaintext transcript or audio in backend caches or logs.

decisions:
  - id: D-1
    status: active
    decision: Proxy realtime audio through an authenticated first-party WebSocket instead of issuing reusable provider client tokens to browsers.
    reason: The proxy prevents token replay and unmetered provider use while keeping the Mistral API key outside the browser.
    decided_at: "2026-09-19T00:00:00Z"
  - id: D-2
    status: active
    decision: Use Voxtral Mini Transcribe Realtime at one second target delay and replace, rather than duplicate, the batch Voxtral call on success.
    reason: Native streaming provides progressive text without repeatedly billing overlapping chunks; the managed price is $0.006/min versus $0.003/min for batch.
    decided_at: "2026-09-19T00:00:00Z"
  - id: D-3
    status: active
    decision: Run transcript correction on the same backend WebSocket after the provider's final transcript while the client uploads encrypted audio independently.
    reason: This exposes the raw transcript immediately, overlaps two independent waits, and avoids temporarily caching plaintext transcript state.
    decided_at: "2026-09-19T00:00:00Z"
  - id: D-4
    status: active
    decision: Keep the current batch transcription request as the transparent fallback when realtime capture, transport, or finalization fails.
    reason: Recording must remain usable on browsers or networks where realtime PCM capture cannot complete.
    decided_at: "2026-09-19T00:00:00Z"

scenarios:
  - id: S-1
    title: Transcript grows during recording
    given:
      - Alice is authenticated and microphone access is granted.
    when:
      - Alice records a voice message and Voxtral emits text deltas.
    then:
      - The recording overlay keeps the waveform and controls usable.
      - The most recent transcript text is visible and updates without waiting for recording to finish.
      - Transcript content is not written to logs or durable backend storage.
  - id: S-2
    title: Finished recording shows raw text while auto correction runs
    given:
      - Realtime transcription has produced a final raw transcript.
    when:
      - Alice finishes recording.
    then:
      - An audio embed appears immediately with local playback, waveform, and raw transcript.
      - The embed labels automatic correction as processing while encrypted upload and correction run concurrently.
      - The corrected transcript and generated title replace the raw presentation when correction succeeds.
      - Correction failure finishes the embed with the raw transcript instead of failing the recording.
  - id: S-3
    title: Immediate send finalizes the same message
    given:
      - Alice has finished recording and upload or correction is still pending.
    when:
      - Alice presses Send immediately.
    then:
      - One optimistic user message appears in chat history.
      - Completion patches that same message with the persisted audio embed, final transcript, title, waveform, and provider attribution.
      - No duplicate message or second batch transcription is created.
  - id: S-4
    title: Realtime failure falls back safely
    given:
      - Realtime capture, WebSocket transport, or provider transcription fails.
    when:
      - Alice finishes a valid local recording.
    then:
      - The encrypted audio upload continues.
      - The existing batch transcription and correction request runs once.
      - The embed finishes or exposes its existing retryable error state.

verification:
  required:
    - python3 scripts/plan_validate.py docs/plans/realtime-audio-recording-transcription/plan.yml
    - Focused pytest coverage for WebSocket auth, protocol validation, provider relay, correction fallback, billing, and cancellation.
    - Focused Vitest coverage for PCM conversion, realtime lifecycle, transcript accumulation, and fallback selection.
    - Focused component-preview Playwright coverage for live transcript and automatic-correction states in bare chrome=0 mode.
    - Browser E2E coverage for an immediately sent recording finalizing in place without a duplicate batch request.

