risks:
  - {id: R-1, risk: An over-broad purge deletes other app memories., mitigation: Use one exact app_id equality predicate and fixture tests covering personal/team AI plus multiple preserved apps.}
  - {id: R-2, risk: An old or generic client recreates AI rows after migration., mitigation: Reject app_id ai on every persistence boundary and verify REST, CLI, SDK, and WebSocket behavior.}
  - {id: R-3, risk: Offline IndexedDB rows survive and later re-sync., mitigation: Run idempotent client cleanup before memory sync and block server-side AI writes.}
  - {id: R-4, risk: Removing generic memory code breaks app-owned memories., mitigation: Keep shared machinery intact and require positive non-AI checks on every surface.}

