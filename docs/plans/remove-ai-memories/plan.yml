schema_version: 2
id: remove-ai-memories
title: Remove AI Memories
status: implementing

specification_refs: []

specification_impact:
  classification: removal
  specification_update_required: false
  affected_assertions: []
  reason: >
    This removes an obsolete AI-owned feature. The user explicitly requested
    that the durable shared app-memories contract be created only after this
    removal is complete.

documentation_impact:
  generated_reference:
    status: unchanged
    reason: No approved contract bundle changes during removal.
    documents: []
  user_docs:
    status: update_required
    reason: AI must no longer be documented or demonstrated as owning memories.
    documents:
      - docs/user-guide/apps/settings-and-memories.md
  semantic_layer:
    status: follow_up_required
    reason: Create the shared app-memories contract after removal is complete.

goal: >
  Clean up AI settings and future AI behavior by removing all AI-owned memory
  categories and active data without changing historical chats or any memory
  feature owned by another app.

scope:
  in:
    - Remove communication_style, learning_preferences, and interaction_preferences from the AI app metadata.
    - Remove the Memories section and all AI-memory loading from AI settings.
    - Reject future creation, update, synchronization, request, approval, loading, and prompt use for app_id ai.
    - Delete personal and team-owned rows whose app_id is exactly ai from active Directus/PostgreSQL storage.
    - Evict server caches and delete IndexedDB/in-memory entries whose app_id is exactly ai.
    - Remove AI-memory CLI and SDK registry entries and reject removed AI memory types.
    - Remove the two public AI-memory example chats and their generated/localized metadata.
    - Preserve all non-AI app-memory metadata, data, APIs, synchronization, settings, and examples.
  out:
    - Rewriting or deleting existing user chats containing historical memory system messages.
    - Removing or redesigning the shared app-memory feature.
    - Deleting retained backups before normal retention expiry.
    - Adding custom mate instructions or replacement personalization controls.
    - Defining the durable shared app-memories contract before this removal completes.

context_discovery:
  github_issues:
    - gh issue list found no matching issue for AI-memory removal.
  docs:
    - docs/user-guide/apps/settings-and-memories.md
    - docs/contributing/guides/spec-driven-development.md
  contracts:
    - No approved AI-memory contract exists; user directed removal before defining the shared app-memory contract.
  code_patterns:
    - backend/apps/ai/app.yml defines the three AI memory categories.
    - backend/core/directus/schemas/user_app_settings_and_memories.yml stores all app memories in one collection with cleartext app_id.
    - frontend/packages/ui/src/components/settings/SettingsAI.svelte loads and renders AI memories.
    - frontend/packages/ui/src/stores/appSettingsMemoriesStore.ts stores encrypted app rows in IndexedDB and memory.
    - frontend/packages/openmates-cli/src/client.ts contains generated AI memory type registry entries.
    - Generic WebSocket and SDK memory handlers must continue supporting non-AI apps while rejecting app_id ai.
  tests:
    - frontend/packages/ui/src/stores/__tests__/appSkillsStore.test.ts
    - frontend/packages/openmates-cli/tests/client.test.ts
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/apps/web_app/tests/cli-memories.spec.ts
    - frontend/apps/web_app/tests/mention-dropdown-settings-memory.spec.ts
    - backend/tests/test_app_settings_memories_continuation.py
    - backend/tests/test_teams_memory_isolation.py

clarification:
  rounds:
    - question: Which persisted AI-memory data should be purged?
      answer: All app_id ai rows in dev and production, including personal and team-owned rows, plus local and cached copies; all other apps remain untouched.
    - question: Should existing chats containing historical AI-memory messages be rewritten?
      answer: No. Existing chats remain untouched; removal applies to future requests, settings, and memory data.
    - question: Is a removal-specific durable contract required?
      answer: No. Create the broader app-memories contract only after the AI-memory removal is complete.
  vision_summary: >
    Remove AI memories to simplify AI settings and prevent all future AI-owned
    memory behavior. Purge only exact app_id ai data and copies, preserve every
    non-AI app-memory capability and all historical chats, then define the shared
    app-memories contract as follow-up work.
  approved_by_user: true

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Core/Intents/MemoryIntents.swift
    - apple/OpenMates/Sources/Features/Settings/Views/SettingsMemoriesFull.swift
  parity_expectations:
    - Apple metadata-driven settings expose no AI memory categories after metadata refresh.
    - Memory settings for other apps remain available.
  verification:
    - Run Apple settings/memory parity tests or build after web confirmation.
  intentional_native_differences:
    - Client-local cleanup implementation may differ, but the resulting ownership boundary is identical.

scenarios:
  - id: S-1
    title: AI settings no longer show memories
    given: [A user opens AI settings.]
    when: [AI settings metadata and content render.]
    then:
      - No AI Memories heading or memory-category cards appear.
      - Model, provider, pricing, and other AI settings remain available.
  - id: S-2
    title: AI rows are purged exactly
    given:
      - Active storage contains personal and team rows for ai, travel, and books.
    when: [The idempotent removal migration runs.]
    then:
      - Every row whose app_id is exactly ai is deleted.
      - Every row whose app_id is not ai remains unchanged.
      - Running the migration again succeeds without additional effects.
  - id: S-3
    title: Removed clients cannot recreate AI memories
    given: [A web, CLI, SDK, or WebSocket client submits an AI-owned memory entry or request.]
    when: [The server validates app_id and memory metadata.]
    then:
      - The operation fails visibly as an unsupported memory app/type.
      - No AI row or prompt context is created.
      - Equivalent non-AI app-memory operations continue to work.
  - id: S-4
    title: Existing chats remain historical records
    given: [An encrypted chat contains old AI-memory request or approval messages.]
    when: [The removal deploys and the chat is opened.]
    then:
      - Existing chat messages are unchanged.
      - Deleted AI memory content cannot be loaded for a new request.
  - id: S-5
    title: AI memory examples disappear
    given: [The public example catalog previously contained two AI-memory examples.]
    when: [The updated catalog and routes deploy.]
    then:
      - AI communication-style and learning-preferences examples are absent.
      - Non-AI memory examples remain available.

