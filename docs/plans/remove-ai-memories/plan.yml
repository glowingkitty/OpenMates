assumptions:
  - id: A-1
    text: app_id is the authoritative cleartext discriminator for rows in user_app_settings_and_memories.
    category: data
    required_before: implementation
    status: confirmed
    evidence:
      - {source: backend/core/directus/schemas/user_app_settings_and_memories.yml, summary: app_id is an indexed cleartext field used for filtering.}
  - id: A-2
    text: Removing AI metadata alone is insufficient because generic clients could submit arbitrary app_id values.
    category: security
    required_before: implementation
    status: confirmed
    evidence:
      - {source: backend/core/api/app/routes/sdk.py, summary: Generic memory persistence routes accept app memory rows and require a server-side AI rejection guard.}

contracts:
  api:
    changed_endpoints:
      - route: Existing app metadata endpoint
        access_model: unauthenticated public REST API
        auth: none for public metadata
        owner_scope: not applicable
        rate_limits: existing metadata route limits unchanged
        credit_budget: none
        encryption_boundary: Returns schemas only; no encrypted memory content.
      - route: Existing SDK memory persistence endpoints
        access_model: developer API-key REST API
        auth: valid developer API key and existing owner/team scope
        owner_scope: existing personal or active team context
        rate_limits: existing SDK route limits unchanged
        credit_budget: none
        encryption_boundary: Accepts client-encrypted rows; rejects app_id ai before persistence and never decrypts content.
      - route: Existing first-party memory WebSocket messages
        access_model: first-party client surface only
        auth: authenticated WebSocket session and existing owner/team scope
        owner_scope: existing personal or active team context
        rate_limits: existing WebSocket limits unchanged
        credit_budget: none
        encryption_boundary: Accepts client-encrypted rows or transient approved plaintext; rejects app_id ai before storage or AI use.
  data:
    - Idempotently delete from user_app_settings_and_memories where app_id equals ai.
    - Do not delete, update, decrypt, or rewrite rows with any other app_id.
    - Do not inspect or mutate chat collections.
  ui_states:
    - AI settings without a Memories section.
    - Other app details continue showing their memory categories.
    - Removed AI-memory deep links fail safely instead of opening an editable category.
  privacy_security:
    - Purge encrypted AI rows without decrypting them.
    - Do not log encrypted payloads, user identifiers, item keys, or deleted content.
    - Retained backups expire under existing retention policy.

