implementation_notes:
  plan_path: docs/plans/remove-ai-memories/plan.yml
  status: pending
  existing_patterns:
    - Existing idempotent SQL migrations invoked by backend/core/directus/setup/setup_schemas.py.
    - Shared generated app metadata consumed by REST, CLI, SDK, web, and Apple.
    - Existing encrypted app-memory IndexedDB and server synchronization services.
  architecture: >
    Remove AI category definitions at the metadata source, add one shared exact
    AI-memory rejection guard to generic persistence/runtime boundaries, run an
    idempotent active-storage purge, and clean first-party local/cache copies.
    Leave generic app-memory behavior and historical chat collections unchanged.
  first_slice: Add deterministic registry and migration tests that fail while AI categories and rows remain.
  data_flow:
    - Deployment migration deletes active user_app_settings_and_memories rows where app_id equals ai.
    - Server startup or sync evicts AI cache entries and rejects any future AI-memory write or load.
    - First-party clients delete local AI rows before normal memory synchronization.
    - Metadata regeneration removes AI memory types from all discovery and settings surfaces.
  boundaries:
    - No chat collection mutation.
    - No non-AI app metadata or row mutation.
    - No new endpoint or replacement personalization feature.
  affected_files:
    - {path: backend/apps/ai/app.yml, reason: Remove the three AI memory categories.}
    - {path: backend/core/directus/migrations/, reason: Add the exact idempotent active-row purge.}
    - {path: backend/core/directus/setup/setup_schemas.py, reason: Execute and verify the purge migration.}
    - {path: backend/core/api/app/routes/sdk.py, reason: Reject developer API AI-memory writes.}
    - {path: backend/core/api/app/routes/handlers/websocket_handlers/, reason: Reject first-party AI-memory writes and confirmations.}
    - {path: frontend/packages/ui/src/components/settings/SettingsAI.svelte, reason: Remove the AI Memories section and loading.}
    - {path: frontend/packages/ui/src/stores/appSettingsMemoriesStore.ts, reason: Delete local AI rows before sync.}
    - {path: frontend/packages/ui/src/demo_chats/, reason: Remove AI-memory examples only.}
    - {path: frontend/packages/openmates-cli/src/client.ts, reason: Regenerate memory registry without AI types.}
  migrations:
    - Idempotent exact app_id ai deletion in active storage; no schema change and no rollback restoration of deleted data.
  observability:
    - Log only aggregate deleted-row/cache counts and migration completion; never payloads, IDs, or item keys.
  assumptions_checked: [A-1, A-2]
  acceptance_mapping:
    AC-1: [T-METADATA-AUDIT, T-WEB-E2E]
    AC-2: [T-MIGRATION]
    AC-3: [T-REST, T-CLI, T-SDK-NPM, T-SDK-PIP]
    AC-4: [T-MIGRATION, T-HISTORY]
    AC-5: [T-EXAMPLES, T-WEB-E2E]
    AC-6: [T-CACHE, T-LOCAL-STORE]
  verification_strategy:
    - Record focused red failures before implementation.
    - Verify migration and server guards locally, then restart the dev API under the session Docker lock.
    - Prove REST, CLI, npm SDK, and pip SDK behavior against api.dev.openmates.org in order.
    - Deploy web changes, run Playwright and reviewed laptop/mobile visual smoke, then request user confirmation.
    - Verify Apple parity last, complete the shared app-memories contract, and run spec completion verification.
  verification_order: [Static and migration red tests, implementation, backend green tests, dev API restart, REST, CLI, npm SDK, pip SDK, scoped dev deploy, Playwright, visual smoke, user confirmation, Apple parity, shared app-memories contract, spec verification]
  material_plan_approval:
    required: true
    reason: The plan permanently deletes encrypted production data and adds cross-client rejection behavior.

