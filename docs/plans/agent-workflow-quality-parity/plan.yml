    - "gh fallback found #459 Prepare chat storage architecture for agentic coding scale; related but out of scope because this spec is repo-local tooling only."
    - "gh fallback found #447 Design planning, tasks, projects, and permissions for agentic coding; related but out of scope because this spec excludes product agentic-coding features."
    - "No exact issue for OpenCode output quality plus Claude/Codex parity was found in the first fallback search results."
