decisions:
  - id: D-1
    status: active
    decision: Keep this spec repo-local and developer-tooling only.
    reason: The user chose the repo tooling scope and explicitly excluded broader product agentic-coding work from this first slice.
    decided_at: "2026-07-29T15:20:00Z"
  - id: D-2
    status: active
    decision: Keep Claude Code as the canonical skill, agent, hook, and rule authoring source while improving generated and bridged parity.
    reason: AGENTS.md and agent-tooling-parity.md already define this as the repository contract; removing it would create unnecessary migration risk.
    decided_at: "2026-07-29T15:20:00Z"
  - id: D-3
    status: active
    decision: Improve OpenCode output quality with deterministic audits and concise core context rather than relying on longer prompt instructions.
    reason: Local OpenCode telemetry shows high input and cache-read volume, and repeated instructions increase cost without guaranteeing better final answers.
    decided_at: "2026-07-29T15:20:00Z"
  - id: D-4
    status: active
    decision: Use aggregate-only OpenCode telemetry for quality and context reports.
    reason: Reports must not persist raw prompts, reasoning, command output bodies, private messages, credentials, or session titles.
    decided_at: "2026-07-29T15:20:00Z"
  - id: D-5
    status: active
    decision: Require a concise workflow retrospective in every non-trivial task-closing summary across supported agent runtimes.
    reason: A universal instruction plus deterministic audit applies to research, debugging, planning, and implementation without relying on optional skill loading or unreliable end-of-chat lifecycle detection.
    decided_at: "2026-08-06T18:32:24Z"

