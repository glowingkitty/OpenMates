    - .claude/settings.local.json
    - .codex/hooks.json
    - .codex/hooks/claude-hook-bridge.sh
    - .opencode/plugins/openmates-hooks.js
    - scripts/sync_agent_parity.py
    - scripts/audit_opencode_spec_workflow.py
    - scripts/audit_opencode_automation_budget.py
    - scripts/audit_worktree_deploy_contract.py
