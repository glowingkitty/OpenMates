schema_version: 2
id: agent-workflow-quality-parity
title: Agent Workflow Output Quality And Tool Parity
status: verified

goal: >
  Improve OpenCode output quality and context efficiency for OpenMates repo work,
  while closing the Claude Code, Codex, and OpenCode parity gaps that make hook
  coverage and workflow guarantees hard to reason about across tools.

scope:
  in:
    - Replace always-loaded OpenCode instruction bulk with a concise audited core plus lazy task-specific rules and skills.
    - Add deterministic output-quality audits for instruction budget, duplicated guidance, required final-answer/check-evidence guidance, and redacted aggregate OpenCode telemetry.
    - Add a tracked hook/config parity contract that compares Claude Code, Codex, and OpenCode coverage from one inventory or manifest.
    - Align tracked Claude Code hook settings with the high-confidence safety hooks that Codex/OpenCode are expected to share.
    - Fix stale workflow audits so they validate the current guard implementation rather than outdated copied snippets.
    - Add concise onboarding documentation for which agent tool owns which workflow layer.
  out:
    - Product agentic-coding UI, remote filesystem access, planning views, and high-stakes user permission features.
    - OpenMates chat storage architecture, hot/cold archival, or product transcript retention changes.
    - Deleting Claude Code compatibility files or removing Claude as the canonical skill/agent authoring source.
    - Adding automatic scheduled workflow review sessions.
    - Changing product APIs, SDK public APIs, encrypted chat data flows, billing, teams, permissions, or Apple product UI.
    - Persisting raw agent prompts, raw private chat messages, reasoning text, command output bodies, credentials, or session titles in new reports.

