  affected_files:
    - none
  parity_expectations:
    - This is repo-local developer tooling for coding agents and has no Apple product counterpart.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should the spec be limited to repo-local developer tooling for this first slice?
      answer: Repo tooling only.
    - question: Confirm the vision is higher OpenCode output quality/context efficiency and stronger Claude Code/Codex/OpenCode parity through deterministic audits and tracked hook/config alignment.
      answer: Confirmed.
    - question: Should every non-trivial task-closing summary include observed workflow failures, avoidable waste, and resulting workflow recommendations across research, debugging, planning, and implementation chats?
      answer: Yes. Apply it across chat types, allow "None observed", and enforce it through shared instructions and deterministic audits rather than a skill or lifecycle hook.
  vision_summary: >
    This spec improves the local OpenMates agent workflow rather than the
    OpenMates product. The first slice focuses on making OpenCode produce better,
    more evidence-grounded output with less default context, and making Claude
    Code, Codex, and OpenCode safety coverage auditable from tracked files.
  approved_by_user: true

