scenarios:
  - id: S-1
    title: OpenCode starts with concise core workflow context
    given:
      - A developer starts an OpenCode session in the OpenMates repository.
      - The task does not yet require frontend, backend, testing, privacy, Apple, or spec-specific details.
    when:
      - OpenCode loads repository instructions.
    then:
      - It receives one concise core instruction surface with repository-specific safety and response-quality rules.
      - It does not eagerly load full planning, testing, and spec-driven development documents by default.
      - It is still instructed how to lazy-load task-specific rules and skills when the task requires them.

  - id: S-2
    title: OpenCode output quality is auditable without reading private chat content
    given:
      - A maintainer wants to know whether OpenCode sessions are getting cheaper and more focused.
      - The local OpenCode SQLite store contains prior OpenMates sessions.
    when:
      - The output-quality audit runs.
    then:
      - It reports aggregate session counts, input-token percentiles, cache-read percentiles, agent/model counts, and high-level warning/error counts.
      - It redacts or omits session titles, prompts, message bodies, reasoning, command output bodies, credentials, and private identifiers.
      - It fails when always-loaded instruction budgets or duplicated guidance exceed the approved thresholds.

  - id: S-3
    title: Claude Code hook coverage is reproducible from tracked files
    given:
      - A contributor clones the repository and uses Claude Code without local ignored settings.
    when:
      - Claude Code loads the tracked project settings.
    then:
      - The tracked settings include the high-confidence safety hooks that the repository expects every agent tool to share.
      - Local-only hooks remain explicitly documented as local extensions, not hidden requirements.
      - The parity audit can distinguish shared required hooks from tool-specific or local-only exceptions.

  - id: S-4
    title: Codex and OpenCode parity is checked against the same hook contract
    given:
      - A canonical Claude hook, agent, skill, or required rule changes.
    when:
      - The parity sync and parity audit run.
    then:
      - Generated Codex and OpenCode mirrors are checked for drift.
      - The Codex hook bridge and OpenCode plugin are checked against the tracked shared-hook inventory.
      - Tool-specific differences are allowed only when listed with a reason in the inventory.

  - id: S-5
    title: Stale workflow audits validate active guard implementations
    given:
      - A guard implementation moves from a copied hook script into a shared Python guard or plugin.
    when:
      - A workflow contract audit runs.
    then:
      - The audit validates the active implementation path and behavior.
      - It does not fail solely because an old copied hook file no longer contains exact documentation snippets.
      - Existing safety behavior remains covered by unit or source-contract tests.

  - id: S-6
    title: Contributors can quickly choose the correct agent workflow
    given:
      - A contributor needs to decide whether to update Claude sources, generated mirrors, OpenCode config, Codex hooks, or session/deploy scripts.
    when:
      - They read the repo agent workflow quickstart.
    then:
      - The quickstart explains the canonical source, generated mirrors, hook bridge, output-quality audit, session worktree flow, and verification commands.
      - It links to deeper docs instead of duplicating long policy text.
      - It calls out that product agentic-coding design is tracked separately.

  - id: S-7
    title: Non-trivial task summaries include agent workflow retrospectives
    given:
      - An agent completes a non-trivial research, debugging, planning, review, spec, or implementation task.
    when:
      - It returns the task-closing summary.
    then:
      - The summary reports observed preventable problems in the agentic process across the main chat, research, tool use, delegated agents, and sub-chats.
      - It excludes implementation results, product bugs, test outcomes, and remaining product work unless an agent-workflow deficiency caused or unnecessarily prolonged them.
      - It states "None observed" instead of inventing failures, waste, or recommendations.
      - Recommendations check existing workflow coverage first and identify the smallest relevant hook, skill, agent or subagent definition, agent instruction, deterministic audit, or test change, or state that existing coverage is sufficient and no change is warranted.
      - It reports observed facts without hidden reasoning, guessed durations, raw private logs, or private chat content.
      - Simple requests, clarification-only turns, and progress updates do not require the retrospective.

