implementation_notes:
  plan_path: docs/plans/agent-workflow-quality-parity/plan.yml
  existing_patterns:
    - scripts/sync_agent_parity.py generates and checks Claude, Codex, and OpenCode mirrors.
    - .codex/hooks/claude-hook-bridge.sh maps supported lifecycle events to shared Claude hook scripts.
    - .opencode/plugins/openmates-hooks.js keeps runtime hooks fast and delegates deterministic shell compatibility to the bridge.
    - scripts/audit_opencode_spec_workflow.py and scripts/audit_opencode_automation_budget.py provide static audit patterns for agent workflow guardrails.
    - scripts/tests/test_opencode_hooks_contract.mjs and scripts/tests/test_opencode_worktree_guards.mjs test plugin source contracts without launching OpenCode.
  architecture: >
    Introduce a small audited OpenCode core instruction surface and deterministic
    audits that enforce output-quality guidance, privacy-safe aggregate telemetry,
    and cross-tool hook/config parity. Keep Claude sources canonical, but make
    required shared hooks reproducible from tracked files and make Codex/OpenCode
    exceptions explicit rather than implicit.
  data_flow:
    - OpenCode starts and loads a concise core instruction file from opencode.json.
    - The agent lazy-loads detailed rules or skills only when the task touches that area.
    - Shell/edit tool events run through OpenCode plugin guards and the Codex/Claude bridge.
    - Parity and output-quality audits read tracked config plus aggregate local telemetry fixtures or read-only stores.
    - Audits report pass/fail and redacted aggregate metrics without persisting raw chat content.
  affected_files:
    - path: opencode.json
      reason: Replace eager long instruction list with concise audited core guidance.
    - path: AGENTS.md
      reason: Link the quickstart and clarify lazy-loading/output-quality expectations.
    - path: docs/architecture/agent-tooling-parity.md
      reason: Document the required shared-hook inventory and explicit exception model.
    - path: docs/contributing/guides/agent-workflow-quickstart.md
      reason: New concise onboarding entry point for agent tooling workflow.
    - path: .claude/settings.json
      reason: Make the required Claude Code shared-hook baseline reproducible from tracked files.
    - path: .codex/hooks.json
      reason: Ensure Codex hook routing matches the shared parity inventory.
    - path: .codex/hooks/claude-hook-bridge.sh
      reason: Keep shared hook invocation aligned with the tracked parity contract.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Keep OpenCode hook coverage and output-quality hints aligned with the tracked parity contract.
    - path: .claude/hooks/skill-embed-registry-guard.sh
      reason: Ensure bridged OpenCode worktree app metadata edits trigger the registry guard.
    - path: scripts/sync_agent_parity.py
      reason: Extend or integrate parity validation for hook/config inventory drift.
    - path: scripts/audit_skill_embed_registry.py
      reason: Accept worktree backend app metadata paths when invoked by bridged hooks.
    - path: scripts/audit_opencode_output_quality.py
      reason: New deterministic output-quality and context-efficiency audit.
    - path: scripts/audit_agent_tooling_parity.py
      reason: New or extracted deterministic parity audit for Claude, Codex, and OpenCode hooks/config.
    - path: scripts/audit_worktree_deploy_contract.py
      reason: Fix stale expectations so the audit checks active guard behavior.
    - path: scripts/tests/test_opencode_output_quality_audit.py
      reason: Test the output-quality audit and redacted aggregate telemetry behavior.
    - path: scripts/tests/test_agent_tooling_parity_audit.py
      reason: Test shared-hook inventory, tracked Claude baseline, and Codex/OpenCode exception handling.
    - path: scripts/tests/test_opencode_spec_workflow_audit.py
      reason: Update tests after concise-core instruction split.
    - path: scripts/tests/test_opencode_hooks_contract.mjs
      reason: Preserve plugin source-contract coverage after parity changes.
    - path: scripts/tests/test_skill_embed_registry_worktree_paths.py
      reason: Prove bridged skill/embed registry guard coverage for OpenCode worktree paths.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/agent-workflow-quality-parity/plan.yml
    - python3 -m pytest scripts/tests/test_opencode_output_quality_audit.py
    - python3 -m pytest scripts/tests/test_agent_tooling_parity_audit.py
    - python3 scripts/sync_agent_parity.py --check
    - python3 scripts/audit_opencode_spec_workflow.py
    - python3 scripts/audit_worktree_deploy_contract.py
    - node --test scripts/tests/test_opencode_hooks_contract.mjs
    - python3 scripts/audit_opencode_output_quality.py
    - Manual review of one privacy-safe OpenCode sample or aggregate report for raw-content leakage.
  verification_order:
    - Run spec validation after every spec edit.
    - Write red tests for output-quality and parity audits before implementation.
    - Fix the failing worktree deploy contract audit before marking parity work complete.
    - Implement concise OpenCode core instructions and update the spec workflow audit.
    - Implement tracked shared-hook parity inventory and align Claude, Codex, and OpenCode coverage.
    - Run all listed deterministic checks locally.
    - No REST API, CLI, npm SDK, pip SDK, Playwright, user-visible web, or Apple verification is required because this is repo-local developer tooling only.

