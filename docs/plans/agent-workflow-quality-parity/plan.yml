    - scripts/tests/test_opencode_worktree_guards.mjs
    - scripts/tests/test_opencode_spec_workflow_audit.py
    - scripts/tests/test_opencode_automation_budget_audit.py
    - backend/tests/test_deterministic_quality_audits.py
  current_findings:
    - "python3 scripts/sync_agent_parity.py --check passed during discovery."
    - "python3 scripts/audit_opencode_spec_workflow.py passed during discovery."
    - "python3 scripts/audit_opencode_automation_budget.py --all exited cleanly during discovery."
    - "python3 scripts/audit_worktree_deploy_contract.py failed because .codex/hooks/bash-guard.sh is missing expected worktree snippets while the effective raw-worktree guard now lives in scripts/safe_bash_guard.py."
    - "The local OpenCode SQLite store contained 764 OpenMates sessions, 98451 messages, and 497256 parts at discovery time; aggregate-only queries showed median input around 169840 tokens and p90 around 1509838 tokens."
    - "The local OpenCode runtime log was about 590 MB and included many snapshot/git warnings and stream errors at discovery time."
    - "Tracked .claude/settings.json is much thinner than ignored .claude/settings.local.json, creating reproducibility and parity ambiguity for Claude Code users."

