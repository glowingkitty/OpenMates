contracts:
  no_product_api_change:
    - No REST API or WebSocket endpoints are added, removed, or changed.
    - Endpoint access model is not applicable.
    - Auth, rate limits, credit/budget limits, and client-side encrypted data boundaries are unchanged.
  opencode_context:
    - Always-loaded OpenCode repository instructions must remain concise and point to lazy-loaded rules or skills for detail.
    - Output-quality guidance must emphasize evidence, exact files/commands, uncertainty, verification results, and concise final responses.
    - Output-quality audits must be deterministic and runnable without network access.
  workflow_retrospective:
    - Every non-trivial task-closing summary must cover observed preventable failures and avoidable waste in the agentic process, including research, tool use, delegated agents, and sub-chats.
    - The retrospective must not repeat implementation results, changed files, discovered product bugs, test outcomes, or remaining product work unless an agent-workflow deficiency caused or unnecessarily prolonged them.
    - The requirement applies to research, debugging, planning, review, spec, and implementation work, but not simple requests, clarification-only turns, or progress updates.
    - Agents must use "None observed" where appropriate and must not invent issues, recommendations, hidden reasoning, or guessed durations.
    - Recommendations must check existing hooks, skills, agents, agent instructions, and deterministic audits or tests before identifying the smallest concrete workflow change, or state that existing coverage is sufficient and no change is warranted.
    - New prompt prose must not be recommended when an existing mechanism covers the issue or a deterministic guard would be more reliable.
  telemetry_privacy:
    - Aggregate reports may include counts, timestamps rounded or bounded to report periods, token percentiles, agent/model names, and error category counts.
    - Aggregate reports must not include raw prompt text, raw assistant text, reasoning, tool output bodies, session titles, private identifiers, credentials, or source code excerpts from chats.
  hook_parity:
    - Required shared hooks are listed in tracked source with event, tool matcher, block/warn behavior, and tool applicability.
    - Claude Code, Codex, and OpenCode may have tool-specific exceptions only when the inventory names the exception and reason.
    - Parity checks must distinguish canonical source drift from intentional generated mirror differences.
  documentation:
    - The quickstart must link to canonical deeper docs instead of copying long rules.
    - Documentation must state that Claude remains canonical for skills/agents/hooks and OpenCode is the primary active runtime.

