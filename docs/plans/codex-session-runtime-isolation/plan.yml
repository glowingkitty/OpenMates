schema_version: 2
id: codex-session-runtime-isolation
title: Codex workspace and resource-gated runtime isolation
status: implementing
goal: Focus on implementing the updated codex setup.
scope:
  in:
  - Durable Codex identity and reuse of one managed worktree per writing task.
  - Structured on-demand private API/CMS/Postgres/cache/worker environments.
  - Atomic memory and disk admission; >=30 GiB disk reserve; durable waiting and safe cleanup.
  - Verified routing, environment-bound evidence, reconciliation and staged rollout.
  out:
  - 'Resuming OpenCode tasks or launching orchestration: owned by the separate daily coordinator.'
  - 'Product Specifications: user explicitly excludes engineering workflows.'
  - Production changes, cloning live user databases, automatic deletion of source worktrees.
authorization:
  source: User confirmed content and instructed implementation on 2026-09-07.
  specification_required: false
  reason: User explicitly limits Specifications to OpenMates product features.
  additional_plan_approval_required: false
architecture:
  authority: Extend sessions.py and engineering_control_plane; existing OpenMates server CLI remains lifecycle
    authority.
  identity: Codex task + host + repository; child inherits parent binding; explicit existing-session adoption
    preserves historic metadata.
  admission: Reserve maximum outstanding growth atomically; recheck on release and periodic reconciliation;
    no shared-dev fallback.
  cleanup: Successful lease saves evidence then deletes disposable environment; failure stops containers
    and retains bounded data, charged against disk. Unknown/live ownership is never pruned.
  rollout: One environment plus one heavy build; second enabled only after measured concurrent peaks and
    enforcement proof.
  verification: Immutable source/build/runtime identity and explicit matching endpoints; no stale epoch
    evidence.
  rollback: Disable new admission, drain or retain owned resources, use explicit shared-dev leases.
discovery:
  related_plans:
  - agent-worktree-deploy
  - opencode-native-worktree-binding
  - agent-presence-coordination
  existing_tests:
  - scripts/tests/test_sessions_worktree_lifecycle.py
  - scripts/tests/test_sessions_docker_orchestration.py
  - backend/engineering_control_plane/tests/test_coordination.py
  host_findings:
  - ext4 rw,relatime; quota support not enabled/verified
  - Docker overlay2; current task user belongs to docker group
  - Previous snapshot ~68 GiB disk available and ~20 GiB RAM available; snapshots are not peak guarantees
  risks:
  - Direct Docker access bypasses hook enforcement.
  - A free-space preflight cannot bound subsequent writes.
  - Shared frontend/test dispatcher currently assumes fixed dev URLs.
  - Other coordinator owns recovered tasks and may use shared dev; preserve runtime leases.
verification_strategy:
  red_first: true
  unit: Focused Python orchestration tests and existing CLI tests; no live Docker mutations in fixture
    tests.
  runtime: Actual Codex shell/edit/child probes; concurrent request, restart, cleanup and cross-environment
    tests.
  capacity: Verify enforced storage budgets and memory caps before isolated admission; test races and
    outstanding reservation accounting.
  surfaces: Internal engineering tooling, no new product REST/SDK/web/Apple surface; validate actual server
    CLI lifecycle where extended.
  completion: All slices implemented and applicable real runtime checks passed; do not equate disabled
    admission with completed rollout.
  current_evidence:
    combined_python: 62 passed at d3f5cb4780a18dc01862a72f2018a3a17ad95112; additional stale/retired-owner
      regressions in progress.
    cli_server: 101 passed
    postgres_capacity: Two concurrent requests admit one; restart preserves ledger; release admits waiter;
      retry creates no duplicate; temporary schema removed.
    hook_adapter: Installed Codex shell without workdir and relative apply_patch routed to agent-ecad
      at d3f5cb4780a18dc01862a72f2018a3a17ad95112; root untouched; synthetic file removed.
    postgres_handoff: 16 concurrent publications reused one event; response retry and retained expiry
      reused it; actual retention deletion permitted republication, requiring independent consumer ownership.
      Disposable schema removed.
handoff:
  session: ecad
  next: Complete retired-owner binding guard; private broker/provisioning remains the next runtime stage.
  completed:
  - Removed rejected workflow Specification and uploaded/local PDF.
  - Codex binding and explicit adoption implemented; own ecad binding preserved.
  - Hook routing adapter and shared denial aggregation implemented.
  - Task-owned protected handoff hunks integrated without replacing worker files.
  - Resource reducer and PostgreSQL adapter implemented; real isolated-schema race/restart/release probe
    passed.
  - Task environment CLI target rejects while broker is unavailable.
  pending:
  - Actual child execution proof when a worker slot is available; installed parent shell/patch passed.
  - Private runtime provisioning and privileged broker/storage enforcement.
  - Environment-bound dispatcher integration and live isolated pilot.
  - Trusted product eligibility and automatic assignment producer/consumer remain a separate Task dependency;
    reviewed contract at coordinator checkpoint.
  current_task_id: TASK-1
  next_action: Deploy final binding hardening and PostgreSQL event probe, then prepare bounded host runtime
    provisioning.
  command: python3 scripts/sessions.py prepare-deploy --session ecad
  expected_outcome: Review exact scoped files; preserve Task worker original patches and shared runtime
    slot.
  last_verified_commit: d3f5cb4780a18dc01862a72f2018a3a17ad95112
  host_activation_constraint: sudo -n requires a password. No OS changes or shared-dev restart performed;
    broker activation needs a concrete operator-run setup step.
