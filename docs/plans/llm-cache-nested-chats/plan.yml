scope:
  - Retain direct Baseten and use live-verified Together as the DeepSeek V4.1 Flash primary, with OpenRouter fallback.
  - Preserve reported usage and usage-only terminal events across all compatible providers; never invent cache hits.
  - Admit authenticated orchestrated parent/child/grandchild cache tariffs while retaining native replay and summary-charge boundaries.
  - Preserve root reservation limits, attribution, idempotency and encrypted receipts.
  - Document provider-specific cache support, tariff eligibility and verified limitations.
checks:
  required:
    - Focused local provider transport, normalization, nested reservation and receipt arithmetic tests.
    - Isolated GitHub product regression coverage for cache receipts and nested attribution.
    - Catalog/metadata generation, relevant lint, Plan and existing contract validation.
constraints:
  - OpenMates chat tests retain automatic routing with no account/model/provider overrides.
  - Real inference runs only on isolated dev state; no paid inference in CI.
  - No raw prompt/response or credential logging in the new provider.
  - No new workflow, Spec Navigator or cloud coding runner work.
provider_contract:
  reviewed_on: '2026-10-25'
  permission_source: https://www.baseten.co/terms-and-conditions/
  api_documentation: https://docs.baseten.co/reference/inference-api/chat-completions
  privacy_policy: https://www.baseten.co/privacy-policy/
  endpoints:
    - POST https://inference.baseten.co/v1/chat/completions; Bearer API key; documented OpenAI-compatible messages/tools/reasoning; SSE with final usage.
    - GET https://inference.baseten.co/v1/models; Bearer API key; non-billable credential/catalog health check.
  usage: Inclusive prompt/completion totals, optional cached input/write/reasoning counters, actual request identity and inference host.
  affinity: Opaque owner-scoped root chat identity, shared across descendants, never raw user identifiers.
  failures: Bounded 429 retry before execution only; no silent partial-stream replay; existing logical-model fallback handles unavailable keys/hosts.
  pricing: Verified host-specific supplier costs and customer cache rates; missing counters remain unknown.
  retention: Existing client encryption unchanged; synchronous Model APIs document zero data retention, with automatic transient KV caching. Shared regions are not fixed residency guarantees.

