scenarios:
  - id: S-1
    title: Fresh Apple installation logs in and restores securely
    given:
      - Alice has an existing OpenMates account with password plus OTP and usable client-wrapped master-key material.
      - The iPhone or iPad app container is freshly installed.
    when:
      - Alice logs in, reaches the chat shell, closes the app, and launches it again.
    then:
      - Login converges on the normal first-party session contract without exposing account existence or secrets.
      - The master key is unwrapped locally before encrypted chat sync requires it.
      - Relaunch restores a valid session or shows an explicit expired or revoked session state.
      - Logout removes account-scoped local state and push registration without removing another account's state.

  - id: S-2
    title: Apple opens chats created by deployed web and real CLI
    given:
      - A deployed web Playwright producer creates a uniquely marked saved encrypted chat for a reserved dev test account.
      - A real OpenMates CLI producer creates a different uniquely marked saved encrypted chat for the same account.
      - Apple starts with an empty local chat store.
    when:
      - Alice logs in on iPhone or iPad and opens each producer chat.
    then:
      - Both chat shells appear once in authoritative newest-first order.
      - Metadata-only chats request a bounded content batch instead of settling on an empty transcript.
      - Apple accepts current server key and metadata versions, decrypts the bounded message window locally, and renders no ciphertext.
      - Missing keys, delayed hydration, or decryption failure remain explicit target-specific loading, retry, or error states.

  - id: S-3
    title: Apple-created chat continues on web and CLI
    given:
      - Alice is authenticated on Apple with usable chat encryption material.
    when:
      - Alice creates a saved chat, receives an assistant completion, and then opens that chat from web and CLI.
    then:
      - Durable user and assistant rows are client-encrypted and use stable identities.
      - Web and CLI decrypt the same ordered conversation without duplicate terminal messages.
      - A queued, retried, or reconnecting Apple send cannot advance durable metadata without recoverable encrypted message rows.

  - id: S-4
    title: Cold boot, reconnect, and rapid navigation remain coherent
    given:
      - Alice has local encrypted cache state and server-side changes from another client.
    when:
      - Apple cold boots, loses and restores connectivity, or selects chat B while chat A hydration is pending.
    then:
      - Startup remains pending while a known server window is incomplete and never fabricates sync completion.
      - Reconnect uses current client versions and does not repeat a completed full sync unnecessarily.
      - Partial windows do not delete older local chats without complete authority or tombstones.
      - Stale chat A events cannot overwrite chat B, duplicate messages, regress ordering, or replace current keys with stale keys.

  - id: S-5
    title: Privacy-safe Apple push opens and continues the correct chat
    given:
      - Alice grants notification permission and has an acknowledged, non-revoked APNs registration.
      - An assistant completes a chat response while no visible first-party client is viewing that chat.
    when:
      - The backend worker dispatches APNs and Alice receives, taps, or replies to the notification.
    then:
      - APNs alert fields contain generic safe text and optional preview content remains device-encrypted.
      - Warm and cold taps select the target chat and use authoritative hydration.
      - Inline reply creates one encrypted user message in the target chat.
      - Foreground presentation is not duplicated by a custom banner, and opening the chat clears its unread state and badge coherently.
      - Token rotation, logout, reinstall, and invalid-token provider responses cannot leave fabricated push success.

  - id: S-6
    title: Apple E2E automatically records reviewable iPhone and iPad proof
    given:
      - A proof-enabled Apple UI test defines actions, checkpoints, assertions, and device-scoped narration intent.
    when:
      - The unified test control plane runs the test on iPhone portrait or iPad landscape.
    then:
      - The remote runner records the complete clean simulator frame and writes an xcresult bundle plus named attachments.
      - Raw and exact-profile media, timeline, hashes, captions, frames, and review receipts share one run directory.
      - Passing runs automatically enter bounded frame-and-caption review and response-media publication.
      - Failures retain diagnostic video and representative screenshots without being published as passing proof.

