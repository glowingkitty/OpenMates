clarification:
  rounds:
    - question: Which Apple devices are blocking runtime-test targets for the first parity milestone?
      answer: iPhone and iPad. macOS must receive corresponding source updates, but macOS UI testing is not a blocking gate because it cannot currently be tested properly.
    - question: Should the implementation use the approved contracts as source of truth and proceed through the proposed phases?
      answer: Yes. Contracts are the semantic source of truth, and the phased plan is approved.
  vision_summary: >
    Core Apple parity means seamless encrypted chat continuation across web, CLI,
    iPhone, and iPad, including reliable login, cold sync, existing-chat opening,
    bidirectional messages, and push notifications. Existing contracts govern
    semantics, rendered web governs owned visual states, iPhone and iPad provide
    blocking runtime proof, and macOS stays source-aligned with documented test limits.
  approved_by_user: true

