contracts:
  api:
    - surface: Authenticated first-party WebSocket phased sync and chat events
      access_model: first-party_client_only
      auth: Session or approved-device authentication; server derives user scope.
      rate_limits: Existing WebSocket connection and chat-send limits; unchanged.
      credit_budget: Sync and hydration do not charge credits; AI sends retain existing budget checks.
      encryption_boundary: Metadata, messages, drafts, embeds, and keys remain ciphertext or wrapped key material on transport and durable storage; plaintext exists only transiently on authorized clients or inference paths already covered by the chat contract.
    - surface: POST /v1/notifications/register-device
      access_model: first-party_client_only
      auth: Authenticated Apple session with expected native client headers.
      rate_limits: Existing notification registration limits; add deterministic abuse coverage if absent.
      credit_budget: No credit charge.
      encryption_boundary: Device token and notification public key are routing/key material, never message plaintext; full token logging is forbidden.
    - surface: Internal push worker dispatch
      access_model: internal_only
      auth: Celery task invocation with server-held provider configuration.
      rate_limits: Existing retry and idempotency policy.
      credit_budget: No credit charge.
      encryption_boundary: Generic alert text plus optional device-encrypted preview only.
  data:
    - Apple sync client state includes every contract-relevant version used by backend reconciliation, including metadata versions.
    - Current server chat keys replace stale local candidates through the same acceptance rules used by web.
    - Metadata-only chat shells remain addressable and request bounded encrypted content on open.
    - Durable authenticated chat rows remain client-encrypted with stable identities and coherent messages_v state.
    - Push registration records stable device identity, environment, token lifecycle, permission state, and optional public preview-encryption material without logging full tokens.
    - Proof artifacts contain synthetic or reserved-account test content only and never include credentials, keys, tokens, or raw private logs.
  ui_states:
    - Auth loading, method selection, OTP, passkey system prompt boundary, success, expired session, revoked session, and visible error.
    - Sync pending, local-ready, metadata-only hydration, retry, decryption/key error, offline, reconnecting, and complete.
    - Existing-chat selected shell, bounded transcript, send, streaming, completion, and cross-client restored state.
    - Push permission, registered, denied, foreground notification, background notification, tap, reply, unread, and cleared badge.
  privacy_security:
    - Never log message plaintext, auth/session tokens, APNs tokens, notification preview plaintext, chat keys, master keys, OTP secrets, or private test-account identifiers.
    - Test artifacts use opaque run IDs and synthetic markers; environment-only credentials are removed after use.
    - APNs alert fields are generic. Optional previews are encrypted to the device and decrypted only by the notification service extension.
    - Apple sync remains first-party only and must not be exposed through public or developer API-key startup-sync routes.
  phase_gates:
    - Direct authenticated WebSocket and notification-route proof against https://api.dev.openmates.org runs first.
    - A real OpenMates CLI producer and consumer run against the dev server second.
    - npm and pip SDK startup-sync proof is not applicable because architecture.sync explicitly excludes SDK-owned startup and offline queues; existing notification SDK regressions run only if notification history/read APIs change.
    - Deployed web producer and consumer Playwright proof runs after earlier shared gates.
    - User confirmation of the existing web contract is inherited from the approved contract and current deployed web evidence; new web UI confirmation is required only if implementation changes web behavior.
    - iPhone and iPad Apple implementation and runtime proof run last.

