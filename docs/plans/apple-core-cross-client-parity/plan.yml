implementation_notes:
  plan_path: docs/plans/apple-core-cross-client-parity/plan.yml
  existing_patterns:
    - specifications/architecture/sync/specification.yml
    - specifications/features/auth/specification.yml
    - specifications/features/chats/specification.yml
    - specifications/features/chat-navigation/specification.yml
    - specifications/features/notifications/specification.yml
    - docs/plans/apple-ui-parity-program/plan.yml
    - scripts/apple_remote.py
    - scripts/tests.py
    - scripts/proof_video_workflow.py
  architecture: >
    Preserve the existing backend and web contracts, repair Apple as a conforming
    first-party client, and add a cross-client test orchestrator whose web, CLI,
    and Apple phases exchange only opaque run-scoped manifests. Extend the remote
    Apple runner to capture xcresult, full-frame video, timeline attachments, and
    proof artifacts, then reuse the existing proof renderer and reviewer.
  data_flow:
    - Contract-indexed tests prove existing dev WebSocket and notification boundaries first.
    - Deployed web and real CLI create encrypted run-scoped producer chats and publish opaque manifests.
    - Fresh Apple tests consume the manifests, sync shells and keys, request bounded content, and render decrypted windows.
    - Apple emits an opaque manifest for its own saved chat; web and CLI consume and verify it.
    - Notification tests progress from worker/config to simulator behavior to physical-device sandbox and TestFlight production proof.
    - Remote test execution captures raw video and xcresult; the Linux control plane validates, renders, reviews, and publishes iPhone/iPad proof.
  affected_files:
    - path: docs/plans/apple-core-cross-client-parity/plan.yml
      reason: Durable program contract, implementation ledger, and evidence source.
    - path: apple/OpenMates/Sources/Core/Networking
      reason: Auth, WebSocket sync, notification registration, and routing parity.
    - path: apple/OpenMates/Sources/Core/Crypto
      reason: Current server-key acceptance and client-wrapped key readiness.
    - path: apple/OpenMates/Sources/Core/Persistence
      reason: Versioned encrypted shell and bounded content persistence.
    - path: apple/OpenMates/Sources/Features/Auth
      reason: Login and session-state UI parity.
    - path: apple/OpenMates/Sources/Features/Chat
      reason: Existing-chat hydration, bidirectional send, and visible state parity.
    - path: apple/OpenMatesTests
      reason: Native sync, key, persistence, and notification unit contracts.
    - path: apple/OpenMatesUITests
      reason: iPhone and iPad contract-driven E2E journeys and proof timelines.
    - path: apple/project.yml
      reason: Authoritative APNs capability and notification-extension generation.
    - path: backend/core/api/app/tasks/push_notification_task.py
      reason: Worker-local push service initialization and visible failures.
    - path: scripts/apple_remote.py
      reason: Remote result-bundle, recording, artifact transfer, and cleanup orchestration.
    - path: scripts/tests.py
      reason: Unified Apple evidence ingestion and automatic proof finalization.
    - path: frontend/apps/web_app/tests/apple-cross-client-chat.spec.ts
      reason: Deployed web producer and Apple-chat consumer evidence.
    - path: frontend/packages/openmates-cli/tests/apple-cross-client-chat.e2e.ts
      reason: Real CLI producer and Apple-chat consumer evidence.
  verification_strategy:
    - Validate contract fingerprints and spec assertion mappings.
    - Record missing/failing tests before product changes.
    - Run shared dev API/WebSocket, CLI, and web producer/consumer gates before Apple green evidence.
    - Run iPhone and iPad auth, cross-client, resilience, push simulator, and proof tests.
    - Run physical-device and TestFlight APNs checks.
    - Run macOS build/source parity and record the accepted runtime-test limitation.
  verification_order:
    - Contract mapping and direct dev WebSocket/API proof.
    - Real CLI producer and consumer.
    - SDK gate explicitly not applicable for startup sync; run notification SDK regressions only if shared history/read APIs change.
    - Deployed web producer and consumer.
    - Phase 1 push/config safety and recording-tool unit tests.
    - iPhone and iPad native tests with automatic proof capture.
    - Physical-device APNs, TestFlight APNs, proof review, and macOS source/build parity.

