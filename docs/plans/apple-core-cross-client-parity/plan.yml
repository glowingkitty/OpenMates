risks:
  - A broad parity program can hide ordering dependencies; task dependencies and contract-linked acceptance criteria keep slices explicit.
  - Live cross-client E2E can leak or collide with test-account state; use opaque run manifests, leases, cleanup, and environment-only credentials.
  - Sync/key changes can cause destructive local reconciliation; require red tests for partial deletion, stale keys, and stale selection before product edits.
  - Simulator push cannot prove APNs; physical-device sandbox and TestFlight production checks remain required.
  - Simulator video dimensions may differ from logical proof profiles; retain raw source and permit only full-frame aspect-preserving normalization with explicit provenance, never crop, pad, border, or caption burn-in.
  - Shared Swift changes may affect macOS even when UI automation is unavailable; require source mapping and build attempts with sanitized blockers.

