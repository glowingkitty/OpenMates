goal: >
  Make the Apple app a reliable first-party OpenMates client for core account
  access and chat continuation. A user can log in on iPhone or iPad, restore an
  encrypted session, list and open chats created on web or CLI, continue those
  chats bidirectionally, recover across cold boot and reconnect, and receive
  privacy-safe actionable push notifications. Apple E2E runs automatically
  record clean iPhone and iPad videos and feed the same proof workflow used by
  deployed web and real CLI tests.

scope:
  in:
    - Contract-driven parity for password plus OTP login, passkey login where available, session restoration, expiration, and logout.
    - Client-wrapped master-key readiness before authenticated chat sync.
    - Apple parity for phased startup sync, metadata versions, key replacement, deletion authority, bounded content, reconnect, and stale-event fencing.
    - On-demand hydration and explicit loading, retry, and error states for metadata-only existing chats.
    - Real cross-client flows where deployed web and real CLI create encrypted chats that fresh Apple installations list, open, and decrypt.
    - Apple-created encrypted chats that web and CLI can subsequently list and decrypt.
    - APNs registration, backend worker delivery, notification service extension, foreground behavior, cold/warm tap, inline reply, unread state, badges, and token lifecycle.
    - Automatic iPhone portrait and iPad landscape recording, result-bundle export, timeline attachments, captions, bounded frame review, and response-media publication.
    - macOS source parity and build verification for shared changes, with iPhone and iPad as the blocking interaction-test devices.
  out:
    - Replacing existing auth, sync, encryption, chat, or notification product contracts.
    - Making startup sync public or developer-API accessible.
    - Server-side decryption of private chat content, chat keys, master keys, or notification previews.
    - Full signup, recovery-key, backup-code, account-management, settings, embed, or broad visual parity beyond states required for core use.
    - Watch parity, except preventing shared-source regressions.
    - Treating macOS UI runtime evidence as a blocking gate while reliable macOS UI testing remains unavailable.

context_discovery:
  tracker:
    - No issue was provided; this approved program originates from a direct parity investigation request.
  contracts:
    - architecture.sync@1 defines first-party phased startup, bounded content, metadata-only Phase 2, deletion authority, and web/Apple/CLI semantic parity.
    - feature.auth@1 defines client-wrapped keys, converged login, session lifecycle, and Apple first-party boundaries.
    - feature.chats@2 defines encrypted persistence, stable identities, local-state precedence, key gating, and web/Apple/CLI parity.
    - feature.chat-navigation@2 defines coherent local-first existing-chat opening and target-specific loading or error states.
    - feature.apple-notifications@1 defines acknowledged APNs registration, privacy-safe payloads, native action routing, unread/badge coherence, and idempotency.
  existing_specs:
    - docs/plans/apple-ui-parity-program/plan.yml
    - docs/plans/apple-auth-security-parity/plan.yml
    - docs/plans/apple-chat-opening-parity/plan.yml
    - docs/plans/apple-sync-decryption-performance/plan.yml
    - docs/plans/apple-durable-chat-persistence-parity/plan.yml
    - docs/plans/unified-notifications/plan.yml
    - docs/plans/progressive-chat-opening/plan.yml
  confirmed_findings:
    - Apple builds on the configured remote iPhone simulator.
    - Current AuthSecurityParityUITests fails before the login tab appears.
    - Apple routes chat_content_batch_response but has no request_chat_content_batch sender.
    - Cached Apple chat keys can suppress newer server key material.
    - Apple sync state omits metadata_v and reconnect reuses initial client state.
    - Push workers can execute without initializing the push service singleton.
    - The main Apple entitlement lacks aps-environment and project.yml does not own the notification service extension target.
    - APNs device-token logging violates native diagnostics privacy rules.
    - Apple tests produce screenshots but no automatic test-run video or proof finalization.
  tests:
    - frontend/apps/web_app/tests/startup-sync-contract.spec.ts
    - frontend/apps/web_app/tests/chat-flow.spec.ts
    - frontend/apps/web_app/tests/background-chat-notification.spec.ts
    - apple/OpenMatesTests/ChatSyncParityTests.swift
    - apple/OpenMatesUITests/AuthSecurityParityUITests.swift
    - apple/OpenMatesUITests/ChatFlowRealAccountUITests.swift
    - apple/OpenMatesUITests/BackgroundChatNotificationUITests.swift

