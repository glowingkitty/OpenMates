schema_version: 2
id: focus-and-memories
title: Focus modes and source-scoped Memories
status: implementing
goal: 'Go ahead and implement the updated architecture: Focus modes with optional phases and Memories, preserving
  Specifications as required outcomes.'
approved_by_user: true
approvals:
  plan:
    status: approved
    approved_at: '2026-10-05'
    reason: User approved the discussed architecture and instructed implementation in Codex chat 01a10bd4-f5b0-75c2-8ed5-30e6147550aa;
      this Plan records that existing approval.
  specification:
    status: approved
    approved_at: '2026-10-05'
    reason: User approved the discussed architecture and instructed implementation in Codex chat 01a10bd4-f5b0-75c2-8ed5-30e6147550aa;
