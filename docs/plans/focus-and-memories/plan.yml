tracking:
  authority: OpenMates Tasks
  task: TASK-490
  session: 5c24
  external_chat: codex:01a10bd4-f5b0-75c2-8ed5-30e6147550aa
scope:
  in:
  - 'Two user-facing concepts: Focus modes and Memories; Focus phases remain optional.'
  - Public app-provided Memories selected automatically when relevant and inspectable as loaded context.
  - Project Memories selected when relevant only within a fresh authorized active Project Focus.
  - Existing encrypted personal/team app memories retain request/approve/reject/continuation and explicit-mention
    behavior.
  - Legacy private Rule documents remain encrypted, are presented as Memories and follow their private source access
    policy.
  - Web, CLI/SDK metadata and Apple semantic parity; compatibility for existing encrypted history and documents.
  out:
  - A new user-facing Facts/Rules/Instructions hierarchy.
  - Replacing approved Specifications or deterministic tool authorization.
  - Server decryption of durable private content or rewriting encrypted history.
decisions:
- id: ownership
  status: active
  decision: Extend feature.app-memories as the owning Memories contract and supersede feature.rules; update Focus
    and Project references.
  reason: Implements the architecture approved in this chat.
  decided_at: '2026-10-05'
- id: precedence
  status: active
  decision: Memory content provides context and practices, never permissions or approval; preserve user intent and
    required Specifications.
  reason: Implements the architecture approved in this chat.
  decided_at: '2026-10-05'
- id: compatibility
  status: active
  decision: Use canonical memory document names for new writes and bounded legacy adapters for existing data.
  reason: Implements the architecture approved in this chat.
  decided_at: '2026-10-05'
- id: private_guides
  status: active
  decision: Keep existing encrypted private documents; expose them through the existing per-conversation memory
    request and explicit mention pipeline, never the public app catalog.
  reason: Implements the architecture approved in this chat.
  decided_at: '2026-10-05'
- id: visibility_cards
  status: active
  decision: Render public app and encrypted private Memories with the existing shared Memory cards, using Public/web
    and Private/lock labels at the top left with description-colored text; explain each source loading policy.
  reason: Explicit user steering in this chat on 2026-10-05 authorizes this UI update and its Specification examples.
  decided_at: '2026-10-05'
checks:
- Focused backend and web/CLI unit tests for source selection, revocation, forged ownership, history projection
  and optional phases.
- Relevant browser and product E2E coverage through isolated GitHub CI.
- Generated metadata, Specification validation/coverage and source-bound deployment checks.
- Apple parser/source parity and available native verification; report actual verification limits.
scenarios:
- id: S-1
  title: Source-scoped context
  given:
  - Public app, private personal and active Project Memories exist.
  when:
  - The user asks for relevant work and may approve personal memory requests.
  then:
  - Only eligible relevant app/Project and explicitly approved personal content is used.
- id: S-2
  title: Unified discovery and compatibility
  given:
  - Legacy Rules and encrypted memory entries exist.
  when:
  - Updated clients browse Memories and inspect applied context.
  then:
  - Content remains encrypted and readable without duplicate concepts or false consent.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Relevant public app Memories and fresh authorized Project Memories load automatically; private personal/team
    content requires permission or a specific mention.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: custom
  verification_ids:
  - T-CONTEXT
- id: AC-2
  scenario: S-2
  text: Existing encrypted content and legacy history remain readable; canonical new writes use Memory names and
    the loaded receipt shows the exact applied set. Public and private Memories share the existing card layout with
    accurate visibility labels, icons and source loading explanations.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: custom
  verification_ids:
  - T-SURFACES
- id: AC-3
  scenario: S-1
  text: Focus modes remain distinct from required Specifications and work without phases; optional Memory selection
    grants no tool authority.
  required: true
  status: pending
  coverage_status: covered
  verification_scope: custom
  verification_ids:
  - T-CONTEXT
tests:
- id: T-CONTEXT
  type: pytest
  file: backend/tests/test_memory_context.py
  command: python3 -m pytest backend/tests/test_memory_context.py backend/tests/test_memory_loader.py
  assertions:
  - Source access, stale revision/revocation, consent and optional phases.
  covers:
  - AC-1
  - AC-3
  red_phase:
    required: false
    expected: new contract cases fail before implementation
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence: {}
- id: T-SURFACES
  type: manual
  assertions:
  - Web/CLI/native memory discovery, legacy compatibility and encrypted loaded receipts using focused tests and
    isolated CI.
  covers:
  - AC-2
  red_phase:
    required: false
    expected: legacy Rule-only display
    evidence: {}
  green_phase:
    required: true
    expected: pass
    evidence: {}
