schema_version: 2
id: dependency-supply-chain-hardening
title: Dependency And Container Supply-Chain Hardening
status: implementing

goal: >
  Implement the approved phased dependency and container security-update system,
  prioritizing urgent open vulnerability fixes and scoped dev deployment while
  preventing routine automation from continuously adopting newly published or
  insufficiently reviewed releases.

specifications:
  - id: architecture.server-management
    version: 1
    status: approved
    assertions:
      - server-management.update.safety-sequence
      - server-management.host.preflight-caddy-continuous
  - id: architecture.operational-monitoring
    version: 2
    status: approved
    assertions:
      - operational-monitoring.alerts.independent-urgent-path
      - operational-monitoring.alerts.actionable-low-noise
      - operational-monitoring.delivery.observable

scope:
  in:
    - Remediate currently open critical and high dependency alerts to the minimum fixed versions.
    - Cover pnpm, Python, Docker and GitHub Actions dependency updates.
    - Separate urgent vulnerability remediation from delayed routine version updates.
    - Make dependency inputs and published container artifacts reproducible and attributable.
    - Add deterministic vulnerability, provenance and policy gates before merge and deployment.
    - Stage eligible automated updates through protected dev checks before stable promotion.
    - Alert when security scans, remediation queues or rollout checks become stale or fail.
  out:
    - Automatically merging major dependency upgrades.
    - Automatically accepting new third-party dependencies.
    - Pulling mutable latest tags directly into production.
    - Automatic rollback of database migrations.
    - Changes to public APIs, encrypted-data handling, web UI, SDK contracts or Apple clients.

context_discovery:
  github_issues:
    - none found for dependency updates, Dependabot, container vulnerabilities or supply-chain hardening
  live_findings:
    - Sixteen open Dependabot alerts were observed on 2026-09-04, including high-severity npm alerts.
    - Dependabot automatic security updates and GitHub secret scanning were disabled.
    - The dev branch had no GitHub branch protection.
    - The last ten observed scheduled npm-audit runs failed.
    - The host Dependabot remediation cron was disabled while the partial OSV/NVD cron remained active.
    - No OpenMates continuous-update systemd timer was active on the development host.
  docs:
    - docs/architecture/infrastructure/cronjobs.md
    - docs/architecture/github-actions-ci.md
    - docs/architecture/audit_frontend_dependency_pins.md
    - docs/user-guide/cli/server-management.md
  code_patterns:
    - .github/dependabot.yml
    - .github/workflows/dependency-review.yml
    - .github/workflows/npm-audit.yml
    - .github/workflows/publish-selfhost-images.yml
    - .github/workflows/supply-chain-guard.yml
    - pnpm-workspace.yaml
    - scripts/check-dependabot-daily.sh
    - scripts/check-eu-vulns-daily.sh
    - scripts/_dependabot_helper.py
    - scripts/_eu_vuln_helper.py
    - frontend/packages/openmates-cli/src/serverPlanning.ts
  tests:
    - scripts/tests/test_audit_frontend_dependency_pins.py
    - frontend/packages/openmates-cli/tests/server.test.ts
    - .github/workflows/selfhost-smoke.yml

clarification:
  rounds:
    - question: Which update and rollout policy should be implemented?
      answer: >
        The user approved the proposed phased system: urgent minimum-fixed-version
        security remediation first, delayed routine updates, deterministic gates,
        immutable container promotion and staged deployment.
  vision_summary: >
    Known exploitable vulnerabilities move quickly through narrow deterministic
    fixes, while ordinary patch, minor and major releases wait behind increasing
    quarantine and review periods. Automation promotes only the exact artifact
    tested on dev; it never treats latest stable as sufficient evidence of trust.
  approved_by_user: true
  approved_at: "2026-09-04T13:47:16Z"

apple_impact:
