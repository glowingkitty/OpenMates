decisions:
  - id: D-1
    status: active
    decision: Keep GitHub Dependabot as the update bot for the first implementation.
    reason: It is already authorized and avoids adding a second privileged dependency service.
    decided_at: "2026-09-04T13:47:16Z"
  - id: D-2
    status: active
    decision: Security updates target the minimum fixed version and remain separate from routine updates.
    reason: This minimizes change while closing known exposure without adopting unrelated latest releases.
    decided_at: "2026-09-04T13:47:16Z"
  - id: D-3
    status: active
    decision: Routine patch and minor updates wait at least fourteen days; major updates wait thirty days and require review.
    reason: A quarantine window reduces exposure to newly published malicious or withdrawn releases.
    decided_at: "2026-09-04T13:47:16Z"
  - id: D-4
    status: active
    decision: Only tightly coupled package families may be grouped.
    reason: Small PRs preserve attribution, make failures diagnosable and avoid one package blocking unrelated fixes.
    decided_at: "2026-09-04T13:47:16Z"
  - id: D-5
    status: active
    decision: Production and self-host promotion uses signed immutable digests that already passed dev checks.
    reason: Mutable channel tags cannot prove that production runs the artifact tested on dev.
    decided_at: "2026-09-04T13:47:16Z"
  - id: D-6
    status: active
    decision: Deterministic tools enforce trust and vulnerability policy; OpenCode only investigates blocked remediation.
    reason: Merge and deployment safety must not depend on nondeterministic model judgment.
    decided_at: "2026-09-04T13:47:16Z"

scenarios:
  - id: S-1
    title: Urgent known vulnerability receives a narrow fix
    given:
      - A critical or high advisory applies to a resolved OpenMates dependency.
      - A fixed release exists.
    when:
      - The security lane creates a remediation change.
    then:
      - The change selects the minimum fixed version.
      - Unrelated dependencies are not upgraded.
      - Required deterministic tests and scans pass before scoped dev deployment.
  - id: S-2
    title: Routine releases remain quarantined
    given:
      - A dependency publishes a new release without an applicable advisory.
    when:
      - Routine update automation evaluates the release.
    then:
      - Patch and minor releases wait at least fourteen days.
      - Major releases wait at least thirty days and cannot auto-merge.
      - New dependencies cannot auto-merge.
  - id: S-3
    title: Candidate container is attributable and no less secure
    given:
      - An OpenMates or third-party container dependency changes.
    when:
      - CI builds or evaluates the candidate image.
    then:
      - The input image is pinned by digest.
      - The output has SBOM and provenance attestations and an OpenMates signature.
      - Policy rejects new applicable critical or high vulnerabilities.
  - id: S-4
    title: Stable rollout promotes the tested artifact
    given:
      - A candidate digest passed dev deployment and health checks.
    when:
      - It is promoted to stable or consumed by a continuous updater.
    then:
      - The exact signed candidate digest is selected.
      - Mutable latest-style tags are not trusted as deployment identity.
      - Failure pauses rollout and preserves an explicit previous-digest recovery path.
  - id: S-5
    title: Broken automation becomes an incident
    given:
      - A required security scan fails or has no successful run within twenty-four hours.
    when:
      - Operational monitoring evaluates security automation freshness.
    then:
      - A deduplicated actionable alert identifies the failed or stale control.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Every currently applicable critical and high alert with a fix is remediated using the minimum fixed version and deployed to dev after focused checks.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-URGENT-AUDIT, T-SCOPED-TESTS, T-DEV-DEPLOY]
  - id: AC-2
    scenario: S-2
    text: Update configuration covers npm, pip, Docker and GitHub Actions with fourteen-day routine and thirty-day major quarantine and no major auto-merge.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-POLICY-AUDIT]
  - id: AC-3
    scenario: S-1
    text: Vulnerability checks use resolved inventories across all deployable manifests rather than a fixed subset of direct dependency declarations.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-INVENTORY-AUDIT]
  - id: AC-4
    scenario: S-3
    text: Third-party container inputs are version-and-digest pinned and published OpenMates images receive vulnerability, SBOM, provenance and signature gates.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-CONTAINER-POLICY]
  - id: AC-5
    scenario: S-4
    text: Automated stable updates consume the exact signed digest tested on dev and retain an explicit previous-digest recovery path.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-ROLLOUT-POLICY]
  - id: AC-6
    scenario: S-5
    text: Required security jobs alert when failed or stale for more than twenty-four hours.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: custom
    verification_ids: [T-MONITORING-POLICY]

