implementation_notes:
  plan_path: docs/plans/dependency-supply-chain-hardening/plan.yml
  architecture: >
    Dependabot proposes narrowly scoped version changes. Repository-owned policy
    checks validate release age, update class, lock completeness, image identity,
    vulnerability deltas and attestations. GitHub branch controls gate merges;
    dev validates the immutable candidate before stable promotion.
  data_flow:
    - Registry or advisory event is classified as urgent security or routine maintenance.
    - The updater selects a minimum fixed or quarantined eligible version and opens a narrow PR.
    - CI resolves immutable inputs, scans the dependency graph and candidate images, and runs affected tests.
    - Eligible security changes deploy to dev and produce an exact candidate digest.
    - Stable promotion references the tested signed digest; monitoring records freshness and rollout state.
  verification_order:
    - Deterministic repository policy and unit tests.
    - GitHub-hosted dependency and image scans.
    - Scoped dev deployment and runtime health verification.
    - Stable promotion contract tests without a production deployment.
  existing_patterns:
    - Dependabot opens update PRs against dev and pnpm enforces a minimum release age.
    - sessions.py deploy provides scoped dev integration and deployment.
  affected_files:
    - path: .github/dependabot.yml
      reason: Ecosystem coverage, grouping and quarantine policy.
    - path: .github/workflows/publish-selfhost-images.yml
      reason: Candidate image scanning, SBOM, provenance and signing.
    - path: scripts/_eu_vuln_helper.py
      reason: Complete resolved vulnerability inventory.
  verification_strategy:
    - Run focused deterministic policy tests before each phase deploy.
    - Require live GitHub Actions evidence for hosted security and image gates.
    - Verify scoped dev deployment and runtime health before recording containment complete.
  demonstration:
    eligibility: not_applicable
    surface: non_visual
    reason: Infrastructure policy and CI automation have no user-visible product surface.

