  - Second increment contains native live calls, functional Watch three-action entry and bundled Whistle evaluation after device feasibility passes.
  - Keep the previously requested storage/offline/guest and native notification proof visible under existing Tasks; do not mark them complete from unrelated UI or unit evidence.
