schema_version: 2
profile: concise
id: video-call-experiment
title: Gemini Voice And H3 Turbo Experiment
status: implementing
goal: >
  Implement a first test to see how well such a system can actually work, before
  spending more time on it: a basic /experiment/videocall page for Gemini voice
  calling where Gemini can trigger video generation, the user can close video
  or end generation, and audio/video use is charged as usual.

scope:
  in:
    - Authenticated first-party experiment with native Gemini 3.8 Live speech and transient transcript.
    - Gemini-only visual tool driving sequential five-second H3 Max Turbo 480p clips.
    - Ten-second generation inactivity timeout with complete playback of accepted clips and independent video/hangup controls.
    - Clearly audible Gemini speech, quieter video ambience/effects and automatic ducking.
    - Wide side-by-side transcript/video and narrow fullscreen video with transcript access.
    - Authoritative proportional billing, 1.2 multiplier, visible rates/time/credits and bounded spend.
    - Two-minute experimental session limit, one pending video job and deterministic cleanup.
    - Focused backend and frontend checks plus component and route evidence in isolated CI.
  out:
    - Normal chat/sidebar integration, ordinary app skills, app-skill result rendering and native clients.
    - S3 recording, replay and download, including whole-call recording composition.
    - Automatic paid reconnect, unlimited sessions and production deployment.

decisions:
  - User approved the limited experiment after five sequential clarification answers.
  - User approved committing both reviewed Specification bundles as drafts; the full chat-bound mode remains future scope.
  - Full-mode calls stay attached to their starting chat; sidebar selection opens another tab while a call is active.
  - Future full mode saves one whole-call encrypted recording at hangup; audio-only calls use audio files.
  - Future mixed calls use video recordings with mate portrait/animated AI-icon backgrounds in audio-only intervals.
  - Recording composition technology, including Remotion, is deferred until the live experiment is evaluated.
  - The experiment does not require CLI/SDK parity because its private live voice capture surface is web-only.
  - The route uses session authentication and origin protection, never developer API-key or anonymous paid access.
  - Video rate is 0.015 USD/generated second through the researched October 15 promotion, then 0.025; credits use 0.001 USD accounting basis.
  - Gemini is billed from modality usage including reprocessed history, not only elapsed call time.
  - UI prices stay in rounded whole credits per minute; proportional per-second usage settles with a one-credit minimum for positive billable usage.
  - Requests such as show me how or visualize must trigger the visual tool without requiring the word video.
  - Gemini speech interruption or cancellation of an acknowledged tool turn never interrupts accepted video playback.
  - After ten seconds without a visual instruction, stop new generation and finish accepted clips before closing video; explicit user stop and hangup remain immediate.
  - Delayed visuals autoplay muted; scene ambience plays through the gesture-unlocked call audio context, independently of Gemini speech interruption.
  - Every fal submission enforces no speaker, speech, narration, vocals or music and physically appropriate background sound; space and vacuum are silent.
  - Optimize the existing Turbo completed-clip API with prompt expansion disabled, earlier continuation, binary media delivery and no server frame extraction before playback.
  - User declined Director because of its sixty-second billing minimum; the experiment stays Turbo only.

draft_contract:
  path: specifications/features/video-call/specification.yml
  id: feature.video-call
  status: draft
  closest_existing_contracts:
    - feature.chats defines encrypted chat persistence but does not define live call lifecycle or recording.
    - feature.chat-navigation defines ordinary chat switching, not a call-bound new-tab override.
    - feature.billing supplies existing settlement boundaries but does not define live provider usage metering.
    - feature.assistant-response-speech covers response TTS, not native bidirectional Gemini conversation.

experimental_contract:
  path: specifications/features/video-call-experiment/specification.yml
  id: feature.video-call-experiment
  status: draft
  approval: Both exact draft bundles were explicitly approved and committed to dev as 7b8ab00b10a375bb6df89d4dd12a0d73a98804ff.

acceptance_criteria:
  - id: AC-1
    text: Start with permitted microphone and session; receive native Gemini audio and live transcript.
    coverage_status: covered
  - id: AC-2
    text: Gemini can request an initial visual and redirect upcoming clips without invoking other app skills.
    coverage_status: covered
  - id: AC-3
    text: User stop returns to audio immediately and fences late clips; ten-second visual inactivity stops generation, finishes accepted clips and then returns to audio.
    coverage_status: covered
  - id: AC-4
    text: Gemini remains audible over video sound and interruptions flush queued speech.
    coverage_status: covered
  - id: AC-5
    text: Auth/origin, balance failure, packet limits and concurrent admission reject paid work safely.
    coverage_status: covered
  - id: AC-6
    text: Browser unmount, hangup and session expiry stop tracks, sources, provider jobs and future paid work.
    coverage_status: covered
  - id: AC-7
    text: Usage settlement is proportional, bounded and idempotent; current rates and accrued credits are visible.
    coverage_status: covered
  - id: AC-8
    text: Both screen layouts retain usable controls; no recording or ordinary chat persistence occurs.
    coverage_status: covered

verification:
  execution_waivers:
    - User explicitly requested immediate experiment deployment on 2026-10-06 after completed desktop and unit checks; the in-flight authenticated route run is retained as supplementary evidence and is not a deployment gate.
    - User explicitly requested desktop-only testing on 2026-10-06; responsive test execution and phone smoke are waived for this experiment delivery. Responsive implementation and focused coverage remain available.
  required:
    - Specification and Plan validation.
    - Focused backend tests for auth, usage, inactivity, admission and accepted-job cleanup.
    - Focused frontend checks for transport and media lifecycle.
    - Isolated component-preview Playwright before experiment route Playwright.
    - Download/upload all existing CI recordings and include returned video links in chat.
  live_inference:
    - Only on an authorized scoped dev runtime after candidate checks and deployment, never paid-provider CI.
    - Record actual provider/session failures or unavailable credentials; do not claim mocked runs prove latency or quality.
  deployment:
    - Commit the two approved draft Specification bundles before publishing the experimental implementation.
    - Run focused candidate component proof before authenticated route proof, then deploy the scoped experimental code to dev.
    - Keep the full-mode contract as a draft; chat binding, recordings and other app skills remain outside this implementation.
    - Never issue real fal/H3 requests in automated verification; a bounded Gemini-only provider probe is authorized.

verification_evidence:
  backend: 36 focused mocked route/provider/billing tests passed, including mandatory prompt constraints, earlier bounded continuation, legacy and binary delivery, idle drain and stop fencing; Ruff passed.
  frontend: Eleven focused audio/controller tests passed, including gesture-first audio unlock, independent decoded ambience, retained ducking gain across clips, aborted pending media fetches, binary media delivery and late-byte stop fencing; changed-path ESLint and panel compilation passed.
  component:
    source: d3055576339a88bbaa0d64b261ca525d4f48c5dd
    request: cb1f1df676311b2f27697ea325d5738295ec3bc63d2c14f123ef115670feb33c
    run: 37521112579
    result: Four desktop cases passed with synthetic clips, including simultaneous speech, idle drain and explicit close during drain; captures reviewed and all four recordings uploaded.
    source_scope: Panel, preview and desktop spec stayed frozen after this candidate; later bounded frame-feedback guards and backend drain cleanup passed focused unit checks.
  responsive: Execution waived by the user; the separate responsive spec remains available.
  provider_limits: No automated real fal requests were made. Further automated verification is not a deployment gate; the user will evaluate the deployed experiment.
  route:
    source: 32dbc1abbe46725d6b5243f14fad9e6253f015ac
    request: 161d14ea435eb0176f723f0058d13e28b05763f8b6df92879a3983e0d32880ae
    result: Failed during test collection in the existing module loader; no route tests or recordings ran. The user waived this run as a deployment gate.
    retrieval: Artifact download hit the host disk-budget limit; the GitHub failure log confirms no tests executed.
  deployment:
    code_commit: 8ebcbfc99111c9975fe6f3e869253b3ed287c142
    backend: Dev API and dependent workers refreshed together with independent playback, accepted-clip idle drain and displayed-frame feedback; all services healthy (docker-2b051573).
    frontend: Exact code deployment succeeded; https://app.dev.openmates.org/experiment/videocall is published (Vercel HrYi68FUHmKKWj8nAdNb9U47TZvf).
    connection_route: Operator applied the managed Caddy update; the authenticated call WebSocket reaches the backend.
  gemini_live_probe:
    result: The exact candidate accepted setup and returned native PCM audio, output transcription, turn completion and modality-level usage.
    framing: Real Google setup replies use binary UTF-8 JSON; startup and streaming now decode both text and binary frames.
    bounds: One benign text turn, maximum 20 seconds and 256 output tokens; no fal request or saved media.
    provider_cost_usd: "0.00200025"
  gemini_tool_probe:
    failure: A real spoken video request produced a function-call-only turn with positive responseTokenCount and no responseTokensDetails; the old billing validator ended the call.
    fix: Infer the text output rate only for a turn that emitted function calls and no audio. Mixed or unknown output still requires provider modality details. SILENT scheduling now uses the FunctionResponse schema position.
    result: The corrected candidate completed and billed one real tool-only turn with 59 output tokens and omitted response details.
    tool_turn_provider_cost_usd: "0.00198675"
    bounds: Two Google connections for synthetic speech and one spoken tool request, at most 45 seconds; tool response mocked, no fal request, no saved media or transcripts.
    diagnostics: Future route failures report exception type and origin function/line without provider payloads or user content.
    limitation: The original user attempts lacked a stack trace; actual fal playback and perceived browser behavior remain for the user's manual trial.
  gemini_visual_intent_probe:
    result: The exact candidate setup triggered generate_visual_clip from the spoken request Show me how black holes work.
    bounds: Two Google connections for synthetic speech and one live spoken request, at most 45 seconds; mocked visual tool response, zero fal requests, no saved media or transcripts.
    tool_turn_provider_cost_usd: "0.00166425"
    limitation: This cost covers the live tool turn only. Synthetic speech preparation is separate; actual fal latency and output quality remain for manual evaluation.
