implementation_notes:
  plan_path: docs/plans/openmatescloud-billing-overlay/plan.yml
  existing_patterns:
    - frontend/packages/openmates-cli/src/server.ts owns server management command wiring.
    - frontend/packages/openmates-cli/src/serverPlanning.ts owns pure CLI planning helpers.
    - backend/core/api/main.py registers routers and initializes startup services.
    - backend/core/api/app/utils/server_mode.py owns domain and self-host/official-cloud mode decisions.
    - backend/core/api/app/services/payment/revolut_business_service.py already verifies and API-confirms Revolut webhooks.
    - backend/core/api/app/services/invoiceninja/invoiceninja.py already owns income invoice/payment behavior.
  architecture: >
    Add fail-closed overlay gating first: self-host/core-only mode explicitly sets
    OPENMATES_CLOUD_OVERLAY_ENABLED=false and does not create payment/accounting
    provider clients or register payment/creator routes. Official-cloud mode is
    planned through a sibling OpenMatesCloud overlay path. The API now loads
    billing services, provider startup, and payment/creator route registration
    from the mounted OpenMatesCloud overlay package in official-cloud mode only.
  data_flow:
    - Operator starts self-host core mode; CLI writes OPENMATES_CLOUD_OVERLAY_ENABLED=false and self-host Compose propagates it.
    - API startup evaluates is_cloud_billing_enabled as overlay opt-in plus domain payment eligibility.
    - Core-only/self-host runtime skips PaymentService and InvoiceNinjaService creation and payment/creator route registration.
    - Official-cloud CLI planning resolves a sibling OpenMatesCloud path and overlay Compose file.
    - Official-cloud mode dynamically imports openmatescloud.api.billing_overlay for billing service creation, provider initialization, and route registration.
    - Later Revolut transactions sync to Invoice Ninja through the same overlay boundary.
  affected_files:
    - path: docs/plans/openmatescloud-billing-overlay/plan.yml
      reason: Durable product contract, plan, tasks, and evidence ledger.
    - path: backend/core/api/app/utils/server_mode.py
      reason: Overlay-aware cloud billing predicate.
    - path: backend/core/api/main.py
      reason: Guard cloud payment provider startup and payment/creator route registration through the dynamic OpenMatesCloud billing hook module.
    - path: backend/core/api/app/tasks/celery_config.py
      reason: Avoid eager Invoice Ninja imports during core worker bootstrap; import cloud accounting services only when the worker initializes billing-capable queues.
    - path: backend/core/api/app/tasks/base_task.py
      reason: Avoid eager payment/accounting service imports during Celery task base import.
    - path: backend/core/api/app/routes/settings.py
      reason: Server status reports overlay-aware payment availability.
    - path: backend/core/api/app/routes/sdk.py
      reason: SDK payment facade fails closed before importing payment route handlers in core-only mode.
    - path: backend/core/api/app/routes/teams.py
      reason: Team bank-transfer payment dependency fails closed when cloud billing is unavailable.
    - path: backend/core/docker-compose.selfhost.yml
      reason: Root self-host Compose explicitly disables OpenMatesCloud overlay.
    - path: frontend/packages/openmates-cli/templates/core/docker-compose.selfhost.yml
      reason: Packaged self-host Compose explicitly disables OpenMatesCloud overlay.
    - path: frontend/packages/openmates-cli/src/server.ts
      reason: Generated self-host .env defaults overlay off; official-cloud install persists overlay env/config and composeArgs appends overlay Compose for lifecycle commands.
    - path: frontend/packages/openmates-cli/src/serverConfig.ts
      reason: Persist deployment mode and configured OpenMatesCloud overlay path for official-cloud installs.
    - path: backend/core/docker-compose.yml
      reason: Current core dev/prod Compose remains overlay-enabled until payment services move.
    - path: frontend/packages/openmates-cli/src/serverPlanning.ts
      reason: Pure CLI official-cloud overlay path and compose planning helpers.
    - path: frontend/packages/openmates-cli/tests/server.test.ts
      reason: CLI overlay planning coverage.
    - path: backend/tests/test_openmatescloud_overlay_packaging.py
      reason: Self-host overlay exclusion, backend startup/router guard coverage, and lazy import boundary tests.
    - path: backend/tests/test_bank_transfer.py
      reason: Preserve real email task package importability when the bank-transfer suite stubs Celery config for combined regression runs.
    - path: scripts/api_tests/test_cloud_overlay_boot.py
      reason: Read-only dev boot gate for official-cloud overlay status, payment webhook route registration, and local CLI overlay worker markers.
    - path: ../OpenMatesCloud/docker-compose.openmatescloud.yml
      reason: Top-level overlay Compose package appended by official-cloud CLI mode, now mounting the OpenMatesCloud Python hook package.
    - path: ../OpenMatesCloud/backend/openmatescloud/api/billing_overlay.py
      reason: Mounted official-cloud billing hooks that import and register cloud billing services/routes only after the overlay gate passes.
    - path: ../OpenMatesCloud/backend/tests/test_overlay_compose.py
      reason: OpenMatesCloud package guard for the CLI-expected overlay Compose file.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/openmatescloud-billing-overlay/plan.yml
    - python3 -m pytest backend/tests/test_openmatescloud_overlay_packaging.py backend/tests/test_billing_worker_compose.py
    - cd frontend/packages/openmates-cli && npm run test:unit:server
    - cd frontend/packages/openmates-cli && npm run build
    - cd ../OpenMatesCloud && python3 -m pytest backend/tests/test_overlay_compose.py
    - python3 scripts/tests.py run --spec selfhost-smoke.spec.ts after deploy
    - python3 scripts/api_tests/test_revolut_business_bank_transfer_settlement.py --api-url https://api.dev.openmates.org --scenarios exact,overpaid,underpaid-complete,duplicate-completed-reference --execute
    - python3 scripts/api_tests/test_invoice_ninja_revolut_expense_sync.py --api-url https://api.dev.openmates.org --revolut-sandbox --invoice-ninja-testing-account --execute
    - python3 scripts/api_tests/test_cloud_overlay_boot.py --api-url https://api.dev.openmates.org --cli-overlay --redact
  verification_order:
    - Spec validation.
    - Red backend and CLI guard tests.
    - Implement overlay opt-in and self-host exclusion.
    - Focused backend and CLI unit checks.
    - Deploy to dev before Playwright self-host smoke or live provider checks.
    - Real dev REST/provider smoke tests for Stripe, Revolut Business Sandbox, and Invoice Ninja testing account.
    - Read-only production doctor before production rollout.

