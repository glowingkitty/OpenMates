contracts:
  api:
    - route: POST /v1/payments/webhook
      access_model: unauthenticated provider webhook with signed Stripe or Revolut headers
      auth: Stripe signature verification or Revolut HMAC timestamp/signature verification.
      rate_limits: Provider retry path with signature/replay/idempotency protections; no normal user rate limit.
      credit_or_budget_limits: Credits granted only by existing official-cloud billing contracts after provider confirmation.
      encryption_boundary: Existing encrypted billing data may be read; no chat/memory/file/key/share material is exposed.
      behavior: Official cloud provides this via OpenMatesCloud overlay; self-host does not register cloud billing routes.
    - route: GET /v1/settings/server-status
      access_model: public first-party status endpoint
      auth: unauthenticated
      rate_limits: existing settings route limits apply.
      credit_or_budget_limits: none
      encryption_boundary: no decrypted user data.
      behavior: Self-host omits cloud payment state; official cloud reports overlay-aware payment availability.
  cli:
    - OpenMates CLI remains the official dev/prod operator entry point.
    - Self-host mode must not require OpenMatesCloud and must set OPENMATES_CLOUD_OVERLAY_ENABLED=false.
    - Official-cloud mode must resolve a sibling or configured OpenMatesCloud overlay path and append its Compose file.
  data:
    - Revolut transaction processing has durable idempotency by transaction ID and environment.
    - Each processed Revolut transaction stores classification and Invoice Ninja bank transaction ID when available.
    - Owner-transfer allowlist values are configuration/secret data, not committed source data.
  privacy_security:
    - Do not commit or log real account IDs, IBANs, API keys, refresh tokens, owner names, cardholder details, or private counterparty identifiers.
    - Admin alerts include sanitized transaction ID, amount, currency, direction, provider, classification, and failure code only.
    - Provider secrets stay in Vault or environment secret stores and are not included in self-host images or docs.
  provider:
    - Revolut signed webhooks trigger transaction lookup only.
    - Invoice Ninja bank transaction creation happens before expense conversion when possible.
    - Vendor lookup/create is automatic for outgoing business payments.
    - Category resolution is deterministic; unresolved categories preserve bank transactions and alert admins.
    - The implementation does not call Revolut Expenses/Receipts APIs.

