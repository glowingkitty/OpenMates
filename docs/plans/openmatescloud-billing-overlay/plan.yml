scenarios:
  - id: S-1
    title: Official cloud starts as a CLI-managed overlay runtime
    given:
      - OpenMates and OpenMatesCloud are present on the dev or production server.
    when:
      - An operator runs official-cloud install, start, update, restart, or deploy through OpenMates CLI.
    then:
      - The CLI composes OpenMates core and OpenMatesCloud overlay services.
      - Existing CLI-managed production operations remain the entry point.
      - Payment routes and cloud accounting workers load only from the overlay runtime.
  - id: S-2
    title: Self-host builds exclude user-charging code
    given:
      - A self-host operator installs or updates OpenMates.
    when:
      - The self-host stack builds, starts, and serves server status.
    then:
      - Payment routes and cloud accounting workers are absent or disabled.
      - Server status identifies self-host mode and does not expose payment-enabled behavior.
      - Non-charging usage accounting remains available where needed.
  - id: S-3
    title: Existing income processing survives the split
    given:
      - Combined dev runtime has sandbox Stripe, Revolut Business, and Invoice Ninja credentials.
    when:
      - Stripe credit purchase, Revolut bank-transfer purchase, and invoice sync are exercised.
    then:
      - Credits are granted exactly as before.
      - Existing invoice, PDF, S3, email, and Invoice Ninja income records are created without duplicates.
      - Revolut bank-transfer webhooks still API-confirm transactions before settlement.
  - id: S-4
    title: Confirmed Revolut income creates bank transaction accounting
    given:
      - Revolut sends a signed webhook for incoming external money.
    when:
      - OpenMatesCloud confirms the transaction with GET /transaction/{id}.
    then:
      - The transaction is classified as income.
      - At least one Invoice Ninja bank transaction exists for the Revolut transaction ID.
      - Duplicate webhook deliveries do not create duplicate bank transactions.
  - id: S-5
    title: Outgoing business payment becomes an expense
    given:
      - Revolut confirms a completed outgoing transaction to a non-allowlisted counterparty.
    when:
      - OpenMatesCloud processes the transaction.
    then:
      - An Invoice Ninja bank transaction is created or reused.
      - A vendor is found or created.
      - A category-resolved expense is created and matched, or an admin alert is sent.
  - id: S-6
    title: Owner transfer creates no income or expense
    given:
      - Revolut confirms a transaction between allowlisted personal and business accounts.
    when:
      - OpenMatesCloud processes the transaction.
    then:
      - A bank transaction is created or reused.
      - No Invoice Ninja invoice, payment, or expense is created.
      - The transaction is marked for accounting clarity.
  - id: S-7
    title: Fallback alerts preserve the ledger
    given:
      - A completed API-confirmed Revolut transaction cannot be fully classified, converted, or matched.
    when:
      - OpenMatesCloud handles the failure.
    then:
      - The safest available bank transaction record is preserved.
      - No duplicate or contradictory income/expense record is created.
      - A sanitized server-admin email is queued.
  - id: S-8
    title: Dev proof gates production rollout
    given:
      - Implementation is complete in combined dev runtime.
    when:
      - The team prepares production rollout.
    then:
      - Dev has passing real provider evidence for payment/accounting paths.
      - Self-host smoke proves payment code is absent or disabled.
      - A production read-only doctor proves configuration without mutating financial state.

