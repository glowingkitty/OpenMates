schema_version: 2
id: openmatescloud-billing-overlay
title: OpenMatesCloud Billing Overlay
status: implementing

goal: >
  Move official-cloud-only payment, billing, and accounting automation out of
  self-host OpenMates into an OpenMatesCloud overlay while keeping OpenMates CLI
  as the dev/production server manager and adding complete Revolut Business to
  Invoice Ninja ledger coverage.

scope:
  in:
    - Create a CLI Overlay Build model where official dev/prod combine OpenMates core with OpenMatesCloud.
    - Keep self-host source/image builds free of user-charging routes, provider secrets, and cloud accounting workers.
    - Preserve existing Stripe, Revolut bank-transfer, invoice, credit, and refund behavior on official cloud.
    - Verify live dev accounting with both Revolut Business Sandbox and the Invoice Ninja testing account before production.
    - Sync every API-confirmed Revolut Business transaction to at least one Invoice Ninja bank transaction.
    - Convert true outgoing business payments into Invoice Ninja expenses when deterministic vendor/category rules resolve.
    - Treat configured owner transfers as bank-transaction-only records.
    - Alert server admins when classification, conversion, matching, or sync cannot complete safely.
  out:
    - Using Revolut paid Expenses/Receipts.
    - Creating outgoing Revolut payments, payout links, refunds, or money movement automation.
    - Changing credit pricing, refund policy, or user billing UX in this first slice.
    - Apple StoreKit billing changes.
    - Replacing the OpenMates CLI as the production server management entry point.
    - Removing usage/credit accounting that is not a user-charging payment feature.

