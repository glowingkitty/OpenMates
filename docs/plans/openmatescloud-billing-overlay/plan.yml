    status: active
    decision: Use CLI Overlay Build for official dev and production.
    reason: Preserves existing OpenMates CLI production management while making cloud-only code an explicit overlay.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-2
    status: active
    decision: Revolut webhooks are triggers only; Revolut Business API transaction reads are the source of truth.
    reason: Webhook payload fields must not drive financial side effects directly.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-3
    status: active
    decision: Every API-confirmed Revolut Business transaction creates or reconciles an Invoice Ninja bank transaction.
    reason: Income, expenses, and owner transfers need full ledger coverage without CSV gaps.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-4
    status: active
    decision: Owner transfers are identified only by configured allowlists and do not create income or expenses.
    reason: Personal/business account movements must not distort profit reporting.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-5
    status: active
    decision: Outgoing payments may create vendors automatically, but unresolved conversion problems alert admins.
    reason: Vendor creation is safe, while uncertain expense categories should not silently create wrong books.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-6
    status: active
    decision: Live dev accounting verification must use both Revolut Business Sandbox and the Invoice Ninja testing account.
    reason: Provider integration must be proven against real test systems before production.
    decided_at: "2026-07-31T12:55:43Z"
  - id: D-7
    status: active
    decision: Use /home/superdev/projects/OpenMatesCloud as the local overlay repository path.
    reason: The sibling repository exists locally and matches the CLI Overlay Build discovery model.
    decided_at: "2026-07-31T12:55:43Z"

