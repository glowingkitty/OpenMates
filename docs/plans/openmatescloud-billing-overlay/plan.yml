apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This spec changes backend deployment, payment/accounting services, and operator tooling only.
  verification:
    - Apple not affected unless later implementation changes shared billing APIs consumed by native clients.
  intentional_native_differences:
    - Apple app does not manage OpenMatesCloud overlay or Revolut/Invoice Ninja operator accounting automation.

clarification:
  rounds:
    - question: Should the split preserve the OpenMates CLI as the production server manager?
      answer: Yes. Production uses the OpenMates CLI to manage the server.
    - question: Which deployment model should the spec target?
      answer: CLI Overlay Build. Official dev/prod combine OpenMates and OpenMatesCloud; self-host excludes OpenMatesCloud.
    - question: How should personal-account to business-account transfers be represented in Invoice Ninja?
      answer: Bank transaction only, not income or expense.
    - question: What should happen for outgoing business payments without a known mapping?
      answer: Always create at least the bank transaction; create vendors when possible and alert admins when full conversion cannot complete.
    - question: How should owner transfers be detected?
      answer: Use a configured allowlist.
  vision_summary: >
    Official cloud keeps the same CLI-managed operational model but loads a
    separate OpenMatesCloud overlay for payment and accounting features. Self-host
    artifacts exclude user-charging features, production payment paths are proven
    on dev before rollout, and every confirmed Revolut Business transaction is
    represented in Invoice Ninja.
  approved_by_user: true

