schema_version: 2
id: jev-context-budget
title: Bound Jev context and batch independent decisions
status: implementing
goal: Implement and test splitting larger Jev requests into requests below the 32,000-token
  context limit with a safety margin and TikToken estimates.
scope:
  in:
  - Shared 30,000 estimated-token working budget, retaining serialized-size and question-count
    bounds.
  - Complete question and independent-candidate batching with stable IDs, bounded
    concurrency and deadlines.
  - Complete latest preprocessing request; optional older context yields before essential
    input.
  - Complete external-text safety batches with neighbor context and atomic failure
    handling.
  - Typed upstream context errors, privacy-safe sizing metrics, and regression coverage.
  - Whole-artifact decisions retain independent fallback or uncertainty when essential
    input cannot fit.
  out:
  - Changes to answer-model context, provider transport, safety thresholds, authorization
    or encryption.
  - Arbitrary partitioning of whole-artifact judgments or silent input truncation.
authorization: User approved implementation and testing after reviewing the batching
  design in this chat.
approved_by_user: true
scenarios:
- id: S-1
  title: Complete bounded decisions on large input
  given:
  - A request exceeds one Jev input budget.
  when:
  - The caller partitions independent questions or candidates.
  then:
  - All IDs are covered within bounded calls or the caller uses its existing fallback.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Dense input and upstream context errors are rejected without overflow retries;
    every physical request respects the shared estimate and character bounds.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-UNIT
  - T-LIVE
- id: AC-2
  scenario: S-1
  text: Question and candidate batches preserve IDs and sum usage; later failures
    invalidate the aggregate and cancel unfinished work; the latest preprocessing
    request is complete.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-UNIT
- id: AC-3
  scenario: S-1
  text: REST external-output safety covers every selected passage with neighboring
    context and atomic fallback inside the existing deadline.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: related_backend
  verification_ids:
  - T-REST
