verification:
- Focused local unit tests for token sizing, candidate coverage, response merging,
  cancellation and safety boundaries.
- Isolated GitHub CI for affected backend integration and REST/CLI regression coverage.
- Bounded synthetic real-provider sizing and batching probe on dev after scoped deployment.
decisions:
- id: D-1
  status: active
  decision: Use the larger TikToken proxy with 2,000 tokens of headroom; bound encoding
    fragments and physical batches.
  reason: Jev's native tokenizer is undocumented; limits and typed fallback remain
    essential.
  decided_at: '2026-10-05'
- id: D-2
  status: active
  decision: Preserve complete safety coverage and current failure policy; do not split
    whole-artifact judgments.
  reason: Chunking must not change the decision or imply unscanned input is safe.
  decided_at: '2026-10-05'
