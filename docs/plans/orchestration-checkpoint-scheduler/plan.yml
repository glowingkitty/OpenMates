schema_version: 2
id: orchestration-checkpoint-scheduler
title: Durable orchestration checkpoints
status: implementing
goal: 'Fix the orchestration chat stopping after announcing further work, with a supported persistent
  checkpoint scheduler, deduplicated wake-ups, explicit stop handling, and worker blockers separate from
  coordinator monitoring.

  '
scope:
  in:
  - Persist per-worker cadence and expiry in existing session metadata.
  - Deliver due checkpoints through the existing OpenCode continuation queue and heartbeat.
  - Preserve schedules across user turns and runtime restarts; suppress delivery while busy or awaiting
    input.
  - Keep coordinator task continuation paced by its monitor and retain worker-specific blockers.
  - Verify cadence, delivery deduplication, user questions, stops, expiry and restart recovery.
  out:
  - New services, cron jobs, or a replacement task system.
  - Changing worker assignments or product task scheduling.
