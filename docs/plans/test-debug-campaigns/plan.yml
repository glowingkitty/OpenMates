schema_version: 2
id: test-debug-campaigns
title: Durable Test Debug Campaigns
status: implementing

goal: >
  Make failed-test debugging a durable, acceptance-driven workflow in which
  OpenCode selects an explicit failure scope, records expected behavior and
  attempts per root-cause group, verifies every group member, and resumes from
  structured evidence or blockers until all campaign groups are green.

scope:
  in:
    - Add Directus-backed test debug campaign and root-cause group records.
    - Keep `test_claims` focused on short-lived ownership while linking claims to durable groups.
    - Make `fix-tests` automatically create or resume a campaign with an explicit selected failure manifest.
    - List active and blocked campaigns before starting a new campaign so fresh chats can discover resumable work without duplicating coordinators.
    - Derive routine acceptance criteria from existing test assertions and failure evidence before source edits.
    - Persist observed failures, expected behavior, root-cause hypotheses, attempts, blockers, and red/green evidence.
    - Run exact campaign group members from Directus-backed selection instead of local `last-run.json` state.
    - Require every member of a group to pass before that group becomes green.
    - Automatically add newly exposed failures as recorded child groups with a scope-amendment reason.
    - Keep campaigns active and blocked when required human or external input prevents green verification.
    - Complete a campaign when every selected and discovered child group is individually green.
    - Integrate interactive skills, deterministic triage, and the sequential auto-fix controller with the same records.
    - Dispatch persistent visible worker chats for conflict-safe parallel groups.
    - Allow an explicitly identified current visible coordinator chat to take over an active or blocked campaign from a stale coordinator session.
    - Require each worker to submit a bounded fix intent before source edits.
    - Let the coordinator approve, reject, or request boundary expansion before worker mutation.
    - Let workers finish with a deterministic checkpoint that the coordinator can harvest, integrate, deploy, and verify serially.
  out:
    - Replacing GitHub Actions, Playwright, pytest, Vitest, CLI, or Apple test execution backends.
    - Rewriting product test suites except for focused control-plane regression coverage.
    - Requiring a final combined run of every campaign-selected test after each group passed individually.
    - Adding a user-facing web interface for campaigns.
    - Automatically changing disputed product behavior or high-risk contracts without clarification.
    - Letting worker chats commit, deploy, merge, or close campaign groups independently.
    - Running hidden disposable agents as the primary parallel debugging mechanism.
    - Storing raw screenshots, traces, private logs, credentials, or unredacted user data in Directus.

context_discovery:
  github_issues:
    - GitHub MCP returned 401 Bad Credentials.
    - "`gh issue list --repo glowingkitty/OpenMates --search \"test debug campaign\"` returned no matching issues."
    - "`gh issue list --repo glowingkitty/OpenMates --search \"test control plane Directus\"` returned no matching issues."
  docs:
    - docs/plans/directus-test-control-plane/plan.yml
    - docs/architecture/test-orchestration.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/testing.md
    - .claude/rules/testing.md
  code_patterns:
    - scripts/tests.py
    - scripts/run_tests.py
    - scripts/auto_fix_failed_tests.py
    - backend/core/directus/schemas/test_claims.yml
    - .agents/skills/fix-tests/SKILL.md
    - .agents/skills/fix-next-test/SKILL.md
    - .agents/skills/reproduce-first/SKILL.md
    - .opencode/agents/test-failure-triager.md
  tests:
    - scripts/tests/test_tests_control.py
    - scripts/tests/test_tests_control_directus_schema.py
    - scripts/tests/test_run_tests_backend_mock_preflight.py
  recent_session_evidence:
    - The 2026-08-03 mass-failure investigation improved several areas but ended with 16 pytest failures and a selected E2E still red because no frozen campaign scope existed.
    - The embed and app-skill session eventually reached green after several hypotheses, but attempts and descendant-commit evidence required forensic reconstruction.
    - The billing session ended with unresolved configuration and iframe groups but no durable blocker or exact continuation command.
    - The 2026-08-10 parallel dispatcher attempt proved visible spawned chats are useful, but lacked a fix-intent gate, boundary expansion contract, finish checkpoint, coordinator harvest loop, and stale-worker rejection.
    - A leased preflight group became green while newly exposed example-chat failures continued outside any recorded parent campaign.

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - The Apple product application is not changed by this developer-tooling architecture.
    - Apple test failures can be selected as campaign group members and retain their remote verification command and evidence.
  verification:
    - Add deterministic control-plane coverage for Apple canonical test keys where campaign selection is suite-agnostic.
    - No Apple app build or UI parity run is required.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should durable campaigns and root-cause groups use separate Directus collections while claims remain ownership leases?
      answer: Yes, use separate collections.
    - question: Should `fix-tests` automatically create or resume a campaign?
      answer: Yes, auto-create or resume with an explicit selected manifest.
    - question: Must campaign completion run all selected tests together after their individual group checks pass?
      answer: No, individual group passes are sufficient.
    - question: What should happen when a fix exposes a new failure?
      answer: Add it to the same campaign as a recorded child group.
    - question: Can routine acceptance criteria be derived from existing test assertions?
      answer: Yes; ask only when expected product behavior is disputed or high-risk.
  vision_summary: >
    Failed-test work should behave like a lightweight executable spec without
    requiring a full product spec for routine regressions. Directus preserves
    selected scope, group acceptance, attempts, evidence, child failures, and
    blockers; OpenCode continues autonomously until every campaign group is
    individually green, while disputed or high-risk product behavior escalates
    to clarification or a dedicated product spec.
  approved_by_user: true

implementation_state:
  subject_commit: 18e5b2cba8b7720d3e26ed6b5dca1c423a43ce3e

approvals:
  specification:
    status: approved
    approved_at: "2026-08-03T00:00:00Z"
  plan:
    status: not_required
    reason: The implementation uses the existing Directus adapter and test-control-plane architecture without a new security, privacy, or rollout decision.

decisions:
  - id: D-1
    status: active
    decision: Store campaigns and root-cause groups in separate Directus collections.
    reason: Durable debugging state has a different lifecycle from expiring ownership claims and must remain queryable after leases complete.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-2
    status: active
    decision: "`fix-tests` automatically creates or resumes a campaign, while explicit CLI commands remain available."
    reason: The reliable path must also be the lowest-friction path for agents and operators.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-3
    status: active
    decision: Each group must verify all of its members, but campaign closure does not require a final combined selected-set run.
    reason: The user prefers individual group proof and wants to avoid an additional potentially expensive aggregate run.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-4
    status: active
    decision: Newly exposed failures become child groups with an explicit scope-amendment record.
    reason: This preserves causality and prevents silent scope drift without abandoning failures exposed by the current fix.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-5
    status: active
    decision: Routine acceptance criteria are derived from existing assertions; ambiguity or high-risk behavior requires clarification.
    reason: Existing regressions should remain autonomous while product decisions remain protected.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-6
    status: active
    decision: Parallel failed-test debugging uses one persistent visible OpenCode worker chat per leased root-cause group.
    reason: Keeping research, approved edits, retests, and finish checkpoints in one visible chat preserves continuity while avoiding hidden disposable-agent state.
    decided_at: "2026-08-11T00:00:00Z"
  - id: D-7
    status: active
    decision: Worker chats must submit a structured fix intent and wait for coordinator approval before mutating source files.
    reason: The coordinator must be able to reject stale work, overlapping write sets, high-risk changes, and boundary expansions before parallel edits collide.
    decided_at: "2026-08-11T00:00:00Z"
  - id: D-8
    status: active
    decision: Parallel workers never deploy or complete campaign groups; the coordinator harvests finished checkpoints and serializes integration plus verification.
    reason: Deployment, commit, and group-completion evidence are subject-commit-sensitive and must remain centralized.
    decided_at: "2026-08-11T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Define campaign and group contracts before changing schemas or runner behavior.
