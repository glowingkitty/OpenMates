assumptions:
  - id: A-1
    text: Existing Directus JSON fields are sufficient for acceptance criteria, attempts, evidence lists, scope amendments, and blockers in the first version.
    category: data_model
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/directus/schemas/test_claims.yml
        summary: Existing control-plane schemas already use JSON payloads for variable structured records.
  - id: A-2
    text: Canonical test keys and result timestamps can identify whether each member passed after group selection without changing test binaries.
    category: test_control
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/tests.py
        summary: Current state and append-only results already carry canonical keys, run keys, statuses, commits, and timestamps.
  - id: A-3
    text: No public API, user authentication, credit, billing, encryption, or plaintext product-data boundary is changed.
    category: access
    required_before: implementation
    status: confirmed
    evidence:
      - source: docs/architecture/test-orchestration.md
        summary: The control plane is internal developer tooling backed by service-authenticated Directus access.

contracts:
  api:
    - access_model: internal-only
      surface: scripts/tests.py and service-authenticated Directus collections
      auth: Existing Directus service token requirements remain unchanged.
      rate_limits: No new public rate limit; commands remain operator-triggered.
      credit_budget: No product credits are consumed by persistence operations; selected tests may retain their existing execution costs.
      encrypted_or_plaintext_data: Store redacted test metadata only; do not store client-side encrypted user material or decrypted product content.
  data:
    - collection: test_debug_campaigns
      purpose: Durable selected scope, lifecycle, blocker, and completion summary for one failed-test effort.
      required_fields:
        - campaign_key
        - status
        - session_id
        - source_run_keys
        - selected_test_keys
        - selected_group_keys
        - current_group_key
        - completion_policy
        - blocker
        - created_at
        - updated_at
        - completed_at
    - collection: test_debug_groups
      purpose: Durable acceptance, diagnosis, attempts, membership, evidence, and child relationships for one root cause.
      required_fields:
        - group_key
        - campaign_key
        - triage_group_id
        - parent_group_key
        - status
        - member_test_keys
        - observed_failure
        - expected_behavior
        - acceptance_criteria
        - root_cause
        - attempts
        - red_evidence
        - green_evidence
        - blocker
        - verification_command
        - selected_at_unix
        - updated_at
    - collection: test_claims
      change: Add nullable campaign and durable group keys while preserving lease lifecycle semantics.
    - collection: test_runs
      change: Reliably populate requested test keys and campaign/group references for completed runs.
  cli:
    - "`python3 scripts/tests.py campaign list --active --overlap-current-failures --json` lists resumable campaigns, owner sessions, current-failure overlap, and status/resume/handoff commands."
    - "`python3 scripts/tests.py campaign start --session <id> --json` creates or resumes a campaign from Directus failures."
    - "`python3 scripts/tests.py campaign handoff --campaign <id> --from-session <old> --to-session <current> --reason <why> --json` explicitly rebinds stale campaign coordination to the current non-worker visible chat."
    - "`python3 scripts/tests.py campaign status --campaign <id> --json` returns groups, attempts, evidence, blockers, and next action."
    - "`python3 scripts/tests.py campaign next --campaign <id> --lease --session <id> --json` leases the next campaign group."
    - "`python3 scripts/tests.py campaign attempt --group <id> ...` appends a structured investigation attempt."
    - "`python3 scripts/tests.py campaign block --group <id> ...` records a resumable blocker."
    - "`python3 scripts/tests.py campaign complete-group --group <id> --commit <sha>` requires all member evidence green."
    - "`python3 scripts/tests.py campaign intent --group <id> --lease <id> ...` records a worker fix intent before source edits."
    - "`python3 scripts/tests.py campaign approve-intent --group <id> --lease <id> ...` approves the current non-overlapping write set."
    - "`python3 scripts/tests.py campaign boundary --group <id> --lease <id> ...` records an explicit boundary expansion request."
    - "`python3 scripts/tests.py campaign approve-boundary --group <id> --lease <id> ...` approves an explicit boundary expansion request."
    - "`python3 scripts/tests.py campaign edit-gate --session <id> --file <path>` enforces approved worker write sets before edits."
    - "`python3 scripts/tests.py campaign finish-worker --group <id> --lease <id> ...` records a coordinator-harvestable finish checkpoint."
    - "`python3 scripts/tests.py run --campaign <id> --group <id>` selects exact durable group members."
  privacy_security:
    - Persist sanitized summaries and artifact references only.
    - Never copy raw chat transcripts, screenshots, traces, credentials, cookies, emails, or user identifiers into campaign records.
    - Directus writes must remain idempotent and visible on failure.
    - High-risk or disputed product behavior must create a blocker and link to a dedicated approved product spec before implementation.

tests:
  - id: T-CAMPAIGN-SCHEMA
    type: pytest
    file: scripts/tests/test_tests_control_directus_schema.py
    command: python3 -m pytest scripts/tests/test_tests_control_directus_schema.py
    covers: [AC-9]
    assertions:
      - Campaign and group schema files define required lifecycle and evidence fields.
      - Campaign and group keys are unique.
      - Claims expose nullable campaign and durable group references.
    red_phase:
      required: true
      expected: fail
      evidence:
        status: failed_as_expected
        command: python3 -m pytest scripts/tests/test_tests_control_directus_schema.py scripts/tests/test_tests_control_campaigns.py scripts/tests/test_test_debug_campaign_workflow.py -q
