risks:
  - risk: Campaign groups become stale when triage signatures change between runs.
    mitigation: Persist immutable canonical member keys and source result references; treat later signatures as evidence or child groups rather than identity replacements.
  - risk: Automatic child-group creation absorbs unrelated failures.
    mitigation: Only add failures newly observed in a campaign/group-bound run and persist the discovery run plus parent reason.
  - risk: Large JSON attempt histories become hard to query.
    mitigation: Keep concise redacted records in the first version and introduce normalized attempt records only if observed size or query needs justify them.
  - risk: Campaign completion is falsely inferred from current state changed by unrelated runs.
    mitigation: Require passing result evidence after group selection and bind evidence to explicit run/result identifiers.
  - risk: Skill text diverges across Claude, Codex, and OpenCode mirrors.
    mitigation: Update canonical Claude sources, run agent parity sync, and enforce a deterministic workflow audit.
  - risk: Worker chats receive generic execute-mode instructions to deploy independently.
    mitigation: Add a no-deploy spawn mode used only by coordinator-owned worker workflows and cover it with deterministic tests.
  - risk: A stale worker edits after the coordinator has moved the campaign to a newer base commit.
    mitigation: Persist base commit in worker intent and finish checkpoints; reject stale approval or finish attempts.

