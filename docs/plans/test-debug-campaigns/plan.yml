demonstration:
  eligibility:
    status: not_applicable
    surface: non_visual
    reason: This spec changes internal test-orchestration CLI behavior and persistent worker coordination, with no user-facing browser, CLI product, or native UI surface to demonstrate.
    classified_at: "2026-08-11T00:00:00Z"
    verification_ids: [V-SPEC-VALIDATE]
implementation_notes:
  plan_path: docs/plans/test-debug-campaigns/plan.yml
  existing_patterns:
    - scripts/tests.py DirectusTestControlStore and in-memory test store
    - backend/core/directus/schemas/test_claims.yml
    - scripts/tests/test_tests_control.py
  architecture: >
    Extend the existing test-control-plane stores with campaign and group CRUD,
    expose campaign lifecycle commands from `scripts/tests.py`, bind exact group
    selections and evidence to runs, then make all debugging skills and auto-fix
    orchestration consume that canonical workflow.
  data_flow:
    - Current failed state is deterministically triaged into durable campaign groups.
    - A claim links temporary ownership to one durable group.
    - Parallel workers record intent before source edits and wait for coordinator approval.
    - Finished workers record a checkpoint that the coordinator harvests before serial integration and verification.
    - Group-bound runs select exact member keys and write requested scope plus result evidence.
    - Imported new failures become child groups; verified groups update campaign completion state.
  boundaries:
    - "`scripts/tests.py` owns persistence, selection, lifecycle transitions, and evidence validation."
    - "`scripts/run_tests.py` remains the execution engine and receives explicit selected canonical keys."
    - "`scripts/sessions.py spawn-chat` owns visible worker chat launch and must support no-deploy execute prompts for coordinator-owned workflows."
    - Skills orchestrate commands but cannot substitute chat-only state for campaign records.
  impacts:
    api: Internal operator CLI only; no public or developer API changes.
    data: Two additive Directus collections and nullable claim/run linkage fields.
    ui: No user-facing UI impact.
    privacy_security: Redacted test metadata only; existing Directus service authentication remains mandatory.
  affected_files:
    - path: scripts/tests.py
      reason: Campaign lifecycle, group selection, evidence binding, and CLI commands.
    - path: backend/core/directus/schemas/test_debug_campaigns.yml
      reason: Durable campaign records.
    - path: backend/core/directus/schemas/test_debug_groups.yml
      reason: Durable root-cause group records.
    - path: .claude/skills/fix-tests/SKILL.md
      reason: Canonical campaign-driven debugging workflow.
    - path: scripts/sessions.py
      reason: No-deploy worker chat prompt mode.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Safe read-only chat inspection while routing is unresolved.
  migration_rollout:
    - Apply the additive Directus schemas through the existing schema setup path.
    - Do not backfill historical chats or claims; campaigns start from current Directus failures after deployment.
    - Preserve existing status, triage, lease, and run commands while campaign-aware skills migrate to the new commands.
  observability:
    - Campaign status JSON exposes selected, green, blocked, pending, and verification-pending counts.
    - Failed Directus writes and invalid lifecycle transitions fail visibly.
    - Store run/result references instead of raw artifacts so existing test history remains the evidence source.
  assumptions_before_implementation:
    - A-1, A-2, and A-3 are confirmed by existing schema and control-plane code.
  acceptance_coverage:
    - AC-1, AC-2, AC-4, AC-5, AC-6, AC-7, and AC-8 map to T-CAMPAIGN-CONTROL.
    - AC-3 maps to T-CAMPAIGN-SELECTION.
    - AC-9 maps to T-CAMPAIGN-SCHEMA.
    - AC-10 maps to T-WORKFLOW-AUDIT.
    - AC-11, AC-12, AC-13, AC-14, and AC-15 map to T-PARALLEL-WORKER-LIFECYCLE.
    - AC-15 also maps to T-SPAWN-NO-DEPLOY and T-HOOK-READONLY-RECOVERY.
    - AC-16 maps to T-CAMPAIGN-CONTROL.
  technical_approval:
    required: false
    reason: Separate campaign/group collections and individual-group completion were approved in the product clarification.
  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/test-debug-campaigns/plan.yml
    - python3 -m pytest scripts/tests/test_tests_control_directus_schema.py scripts/tests/test_tests_control_campaigns.py scripts/tests/test_test_debug_campaign_workflow.py
    - python3 -m pytest scripts/tests/test_spawn_chat_opencode.py -k no_deploy
    - python3 -m pytest scripts/tests/test_opencode_hooks_recovery.py
    - python3 scripts/plan_verify.py docs/plans/test-debug-campaigns/plan.yml
  verification_order:
    - Validate schemas and in-memory campaign state transitions.
    - Verify exact Directus-backed member selection and run metadata.
    - Verify skills and auto-fix workflow references.
    - Run existing test-control-plane regression tests.
    - Verify no-deploy spawned workers and read-only chat recovery hooks.

