scenarios:
  - id: S-1
    title: Starting-folder discovery connects repository Projects
    given:
      - Alice is authenticated in the CLI and starts in `/work`.
      - "`/work/api` is a Git repository already associated with the OpenMates Project `API`."
      - "`/work/web` is a Git repository with no OpenMates Project association."
      - "`/work/notes` is an ordinary folder."
    when:
      - Alice runs `openmates remote-access`.
    then:
      - The CLI preserves `/work` as one browsable approved source tree.
      - The CLI reconnects `/work/api` to `API`.
      - The CLI shows `/work/web` in one reviewed missing-Project confirmation and creates it only if Alice approves.
      - The CLI keeps `/work/notes` visible in Alice's owner-only local discovery tree without silently granting `API` or `Web` access to it or sending its names to OpenMates.
      - Alice must explicitly bind `/work/notes` or a child subtree to a Project before that Project can request its content.
      - The command remains running and shows live source connection state.
  - id: S-2
    title: Explicit paths replace starting-folder discovery
    given:
      - Alice is in `/work`, which contains several repositories.
      - Alice wants to expose only `/work/web` and `/srv/private-api`.
    when:
      - Alice runs `openmates remote-access --path ./web --path /srv/private-api`.
    then:
      - The CLI approves only the canonical realpaths of `/work/web` and `/srv/private-api`.
      - The CLI does not discover or expose other repositories under `/work`.
      - The outside-current-folder path is shown clearly before connection.
      - Any broad root requires an additional strong local confirmation.
  - id: S-3
    title: OpenMates performs bounded list, search, and text read
    given:
      - Alice has a connected source rooted at `/work/api`.
      - The source contains safe text files, ignored files, binary files, `.env`, and a symlink escaping to `/etc`.
    when:
      - Alice browses a directory, searches for `billing`, and opens one selected safe text result from OpenMates.
    then:
      - The live request reaches only Alice's authenticated foreground bridge.
      - Listing, search results, and file content stay within configured item, byte, line, depth, duration, and concurrency caps.
      - Git ignored, secret/high-risk, binary, and outside-root paths are excluded or fail closed with an actionable reason.
      - The selected safe text file appears as a bounded virtual preview and is not uploaded as a durable embed unless Alice explicitly chooses Upload to OpenMates.
      - A request from another Project cannot traverse into `/work/api`, even when both Projects share the same workspace bridge session.
  - id: S-4
    title: Encryption is automatic and invisible to the user
    given:
      - Alice connects `/work/api` to the encrypted Project `API`.
    when:
      - The CLI stores source metadata and exchanges bridge requests and responses requiring Project encryption.
    then:
      - Alice enters and sees cleartext Project names, paths, queries, statuses, and results.
      - The CLI obtains approved key material through existing first-party key flows and encrypts or decrypts automatically.
      - Normal remote-access help and execution expose no ciphertext flags, ciphertext prompts, raw encryption keys, or copy-paste encrypted payloads.
      - The backend persists only approved sparse operational fields plus opaque ciphertext for user-facing source metadata.
      - Logs, traces, errors, and analytics never contain raw keys or decrypted file contents.
      - An ephemeral source-session key encrypts path, query, snippet, and file-content payloads end-to-end between the requesting first-party client and CLI; the backend sees only opaque routing metadata.
      - Assistant-initiated retrieval is client-mediated: the client approves and encrypts the bridge request, decrypts the bounded result, and sends only explicitly approved context through the existing assistant plaintext boundary.
      - The ephemeral key agreement transcript is authenticated with key material derived from the Project key and binds the owner, Project, source, source-session, and requesting-client identities so the backend cannot substitute either party's key.
  - id: S-5
    title: Temporary network loss reconnects without lying about state
    given:
      - Alice's foreground bridge is connected for the `API` and `Web` Projects.
    when:
      - Network connectivity is temporarily lost and later restored while the process remains running.
    then:
      - The CLI reports reconnecting and retries with bounded backoff and jitter.
      - Heartbeat expiry marks affected sources offline while the connection is unavailable.
      - Restoration re-authenticates the bridge and marks only successfully reconnected sources connected.
      - Requests during the offline interval fail clearly and never use silent stale filesystem content.
  - id: S-6
    title: Shutdown and revocation terminate access
    given:
      - Alice has a connected foreground bridge.
    when:
      - Alice presses Ctrl+C, the process exits unexpectedly, or the session receives `force_logout`.
    then:
      - Clean shutdown sends a disconnect transition before exiting when the network is available.
      - Crash or unreachable-client heartbeat expiry marks sources offline within the documented timeout.
      - Forced logout stops requests immediately, closes the bridge, marks sources offline or revoked, and uses the canonical credential and local-account-data purge path.
      - Source revocation, Project deletion, Project access removal, source unbinding, or source-session key replacement immediately rejects new work and invalidates in-flight requests for the affected scope.
      - A second process for the same source ID connects only after Alice confirms takeover; the old session is revoked atomically, and a later stale disconnect cannot mark the replacement offline.
      - No hidden process continues serving filesystem access.
  - id: S-7
    title: Documentation matches the shipped command
    given:
      - A user reads CLI help, the npm package README, user documentation, architecture documentation, or VS Code setup guidance.
    when:
      - The user follows the remote-access instructions.
    then:
      - Every surface uses `openmates remote-access` without start, stop, status, or search subcommands.
      - Every surface explains starting-folder discovery, explicit-path replacement, foreground lifetime, reconnect/offline behavior, read-only operations, and automatic encryption.
      - No surface claims that source registration alone proves a live bridge.
      - Documentation labels deferred daemon, file mutation, command execution, and BYOC worker work as separate future features.
  - id: S-8
    title: End-to-end evidence uses a real live bridge
    given:
      - A dedicated test account and bounded temporary repository are available against `https://api.dev.openmates.org` and `https://app.dev.openmates.org`.
    when:
      - The remote-access verification suite runs.
    then:
      - A real CLI process registers and stays alive against the dev WebSocket/API path.
      - The test requests list, search, and selected-file preview through that live process.
      - The test observes connected, reconnecting or offline, and clean shutdown states.
      - Synthetic direct source metadata insertion and mocked transports are supplemental only and cannot satisfy the live bridge gate.

