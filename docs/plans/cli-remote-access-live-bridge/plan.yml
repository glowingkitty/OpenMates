decisions:
  - id: D-1
    status: active
    decision: Keep `openmates remote-access` as the only public lifecycle command and make its process lifetime the source of truth for connection state.
    reason: The user explicitly rejected start/stop commands and wants foreground lifetime to control availability.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-2
    status: active
    decision: Support list, search, and selected text-file read/preview in the first live bridge slice.
    reason: Search results need bounded navigation and inspection to provide useful remote Project context.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-3
    status: active
    decision: Default discovery connects repository Projects beneath the starting folder; explicit repeated paths replace that discovery scope.
    reason: This gives convenient workspace-wide startup while keeping explicit invocations predictable and least-privileged.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-4
    status: active
    decision: Never expose ciphertext or encryption-key handling as a normal user-facing remote-access input or output.
    reason: OpenMates encryption and decryption must be transparent first-party implementation details while users operate on cleartext.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-5
    status: active
    decision: Keep the first live bridge strictly read-only and separate from daemon, mutation, command-execution, and BYOC worker designs.
    reason: A narrow live transport and filesystem security boundary must be proven before adding higher-risk capabilities.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-6
    status: active
    decision: Project requests may access only their explicitly bound repository or ordinary-folder subtree, even when several Projects share one owner-only workspace source tree.
    reason: A parent workspace view must not allow one Project to traverse another Project's repository or unrelated ordinary folders.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-7
    status: active
    decision: Encrypt bridge operation payloads end-to-end with an ephemeral source-session key; the backend validates opaque routing metadata but never decrypts paths, queries, snippets, or file content.
    reason: The backend must coordinate the bridge without becoming a plaintext filesystem proxy or durable plaintext store.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-8
    status: active
    decision: Only one foreground session may own a source ID; a second process requires confirmed takeover and atomically revokes the old session.
    reason: Accurate connected/offline state and request routing require one authoritative session while allowing intentional recovery from a stale process.
    decided_at: "2026-08-02T00:00:00Z"
  - id: D-9
    status: active
    decision: Use one stable source ID per exact Project binding root; one foreground process may supervise several independently scoped source IDs.
    reason: The existing unique source/owner index remains valid while each request retains an unambiguous Project subtree and takeover authority.
    decided_at: "2026-08-02T00:00:00Z"

