implementation_notes:
  plan_path: docs/plans/cli-remote-access-live-bridge/plan.yml
  maturity: Initial product-contract outline; refine with create-plan only after product-contract approval.
  existing_patterns:
    - frontend/packages/openmates-cli/src/protonBridgeConnector.ts for foreground lifetime, heartbeat, abort, and reconnect behavior.
    - frontend/packages/openmates-cli/src/ws.ts for authenticated WebSocket events and forced logout.
    - backend/core/api/app/services/connected_accounts_service.py for correlated local-connector requests and expiration.
    - frontend/packages/openmates-cli/src/remoteAccess.ts for source persistence, root-scoped rg search, and path-risk filtering.
    - frontend/packages/ui/src/services/projectRemoteSources.ts for bounded virtual previews and explicit upload conversion.
  architecture: >
    Extend the authenticated first-party transport with a source-session registry
    and correlated, expiring read-only bridge requests. The foreground CLI owns
    all filesystem access and validates every operation against canonical
    approved roots. Trusted clients handle Project metadata encryption and
    decryption automatically; the backend relays operational state and opaque
    envelopes without becoming a durable plaintext filesystem store. A live
    heartbeat, not source creation, determines connected state.
  data_flow:
    - CLI authenticates, discovers default or explicit roots, reuses associations, and obtains reviewed confirmation for missing Projects and any ordinary-folder-to-Project bindings.
    - CLI acquires approved Project keys through existing first-party key flows and registers encrypted source metadata without user-visible ciphertext.
    - CLI opens the authenticated foreground transport, registers source session capabilities, and establishes an ephemeral source-session encryption key with the requesting first-party client without exposing the key to the backend.
    - First-party Projects UI or client-mediated assistant-context orchestration creates and encrypts a bounded correlated list, search, or read request.
    - Backend validates auth, owner, Project, source, capability, session, limits, and expiry before delivery.
    - CLI validates request correlation and canonical path policy, executes only the typed read-only operation, and returns a bounded result.
    - Requesting client decrypts and renders ephemeral virtual context; only explicitly approved bounded context crosses into assistant plaintext processing, and selected upload follows the existing encrypted embed path.
    - Heartbeats and disconnect events drive connected/offline status; forced logout aborts service before purging credentials.
  affected_files:
    - path: frontend/packages/openmates-cli/src/cli.ts
      reason: Canonical long-running command, repeated path parsing, discovery review, and removal of ciphertext-facing flags.
    - path: frontend/packages/openmates-cli/src/remoteAccess.ts
      reason: Project discovery, bounded list/read operations, per-request path safety, and live bridge orchestration.
    - path: frontend/packages/openmates-cli/src/ws.ts
      reason: Typed remote-source request delivery, reconnect, and forced-logout integration.
    - path: frontend/packages/openmates-cli/src/remoteAccessCrypto.ts
      reason: Project-key-authenticated ephemeral source-session handshake, envelope encryption, replay protection, and key rotation.
    - path: frontend/packages/openmates-cli/src/client.ts
      reason: Project key/source registration and bridge lifecycle API calls.
    - path: backend/core/api/app/routes/projects.py
      reason: First-party source session, heartbeat, disconnect, and correlated completion contracts if REST participation is required.
    - path: backend/core/api/app/services/project_remote_access_service.py
      reason: Expiring owner/source/session-scoped registry and request correlation.
    - path: backend/tests/test_project_remote_access_bridge.py
      reason: Auth, isolation, lifecycle, limits, and plaintext-persistence contract tests.
    - path: frontend/apps/web_app/tests/projects-remote-sources.spec.ts
      reason: Replace synthetic-only evidence with a real live CLI bridge path.
    - path: docs/user-guide/cli/remote-access.md
      reason: Canonical user-facing command and behavior.
    - path: frontend/packages/openmates-cli/README.md
      reason: Package command examples and foreground behavior.
    - path: docs/architecture/platforms/cli-package.md
      reason: Correct partial-implementation and current architecture claims.
    - path: frontend/apps/vscode_extension/src/extension.ts
      reason: Correct setup command and live bridge explanation.
    - path: frontend/apps/vscode_extension/src/webviewHtml.ts
      reason: Correct setup copy shown inside VS Code.
    - path: scripts/audit_cli_remote_access_docs.py
      reason: Prevent lifecycle-command and capability documentation drift.
    - path: scripts/audit_cli_remote_access_privacy.py
      reason: Prevent ciphertext-facing CLI and plaintext persistence/logging regressions.
  verification_strategy:
    - Validate this spec before planning and after material contract changes.
    - Prove authenticated source lifecycle and request isolation directly against the real dev API/WebSocket first.
    - Prove the real foreground CLI and list/search/read path against the same dev server second.
    - Run CLI-only SDK parity audit third; no npm/pip remote-source API is added.
    - Add CI/daily reproduction only after direct dev API and CLI gates pass.
    - Deploy web changes, run the Projects Playwright spec against the expected commit, then inspect laptop and mobile screenshots.
    - Obtain user confirmation of deployed source lifecycle before Apple build verification.
  verification_order:
    - Real authenticated REST/WebSocket dev-server contract and negative security probes.
    - Real foreground CLI dev-server lifecycle plus list, search, and read/preview.
    - SDK parity audit confirming the intentional CLI-only exclusion.
    - GitHub Actions or daily-test reproduction of already-green live contracts.
    - Deployed Projects Playwright verification against the expected commit.
    - Reviewed laptop and mobile visual smoke for connected, preview, and offline states.
    - User confirmation of deployed dev behavior.
    - Apple remote build for shared Project source status compatibility.

