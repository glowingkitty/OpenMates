contracts:
  api:
    - surface: Remote-source bridge register, heartbeat, disconnect, request, and completion lifecycle
      access_model: first-party client surface only
      auth: Authenticated CLI session and authenticated requesting first-party client; API keys and anonymous sessions are rejected.
      owner_scope: Source sessions, requests, and results are scoped to the authenticated owner and associated Project; cross-user and unrelated-Project access fails closed.
      transport: Authenticated WebSocket for request delivery and account events, with REST only where durable source metadata or correlated completion requires it.
      rate_limits: At most 4 in-flight operations and 16 queued operations per source session, 60 operation requests per minute per user, and one heartbeat no more often than every 10 seconds; excess work returns 429 without delivery.
      credit_budget: Filesystem list, search, and read do not consume AI credits; later model operations using approved context follow normal model budget controls.
      encryption_boundary: User-facing source metadata is encrypted with the Project key. Each live bridge session uses an ephemeral source-session key established between the requesting first-party client and CLI through a Project-key-authenticated transcript bound to owner, Project, source, source session, and requesting-client identity; the backend never receives that key and cannot decrypt operation paths, queries, snippets, or file content. Only client-decrypted context authorized by the explicit context-grant contract may enter assistant plaintext processing.
      errors:
        - 401 or WebSocket authentication failure for unauthenticated sessions.
        - 403 for owner, Project, source, capability, or grant mismatch.
        - 404 or explicit offline error for absent or expired sessions without revealing source existence cross-user.
        - 409 for stale or duplicate session state when it cannot be reconciled safely.
        - 413 for bounded request or response payload overflow.
        - 429 for request, byte, or concurrency limits.
        - Timeout and connector-offline errors fail closed without stale broad-context fallback.
  bridge_operations:
    - operation: list
      request: Source ID, approved relative directory, depth, item cap, and request ID.
      response: Bounded relative entries with safe type and display metadata; no unrestricted recursive tree.
    - operation: search
      request: Source ID, cleartext user query inside the trusted endpoint, result cap, snippet cap, and request ID.
      response: Bounded safe relative paths, line numbers, and snippets plus omitted/excluded counts.
    - operation: read_text
      request: Source ID, one selected safe relative path, byte/line cap, expected metadata when available, and request ID.
      response: Bounded text preview and safe file metadata; binary or disallowed content fails closed.
  lifecycle_limits:
    - Heartbeat interval is 15 seconds and three missed heartbeats, 45 seconds total, marks the source offline.
    - Reconnect delays start at 1 second, double to a maximum of 30 seconds, include up to 20 percent jitter, and continue only while the foreground process and credentials remain valid.
    - Bridge requests expire after 45 seconds, are single-use, and reject late or duplicate completion.
    - A source session permits at most 4 in-flight operations and 16 queued operations.
    - Exactly one live source session owns a source ID; confirmed takeover atomically invalidates the previous session, and status transitions include the session ID so stale disconnects cannot overwrite current state.
  operation_limits:
    - At most 16 approved roots may be active in one process.
    - Repository discovery does not follow symlinks and continues through all accessible descendants; candidate review is paged in batches of 100 without truncating discovery or silently omitting deeper repositories.
    - Directory list returns at most 500 entries and at most 3 levels per request.
    - Search returns at most 20 matches, at most 2,000 UTF-8 characters per snippet, and at most 256 KiB total response data.
    - Text read returns at most 200 KiB and 4,000 lines, whichever is reached first.
    - Each local operation has a 15-second execution deadline and a 256 KiB serialized response ceiling.
    - Files with a null byte in the first 8 KiB or any invalid UTF-8 sequence in the bounded read window are treated as binary or unsupported and rejected.
    - Broad roots are filesystem root, the current user's home/profile directory, or any ancestor of that home/profile directory.
  data:
    - Backend source rows retain hashed ownership, opaque IDs, sparse capability/status/timestamps, and encrypted user-facing metadata only.
    - Local source association and cache state remains under `~/.openmates` with owner-only filesystem permissions.
    - Connected state requires a live authenticated session or unexpired heartbeat and cannot be set permanently by source creation alone.
    - Request IDs are single-use, expire promptly, and cannot be completed by another user, source, Project, or stale session.
    - Durable preview embeds are created only after explicit Upload to OpenMates; normal list/search/read responses are ephemeral virtual context.
    - A locally generated opaque source ID plus canonical-root association metadata identifies reconnectable sources; repository name or remote URL alone is never an identity key.
    - Nested Git repositories and submodules are separate candidates only when their work-tree root differs from the parent; duplicate or symlink-aliased roots are canonicalized and shown once, while intentional overlapping explicit roots are shown and require confirmation of the narrower Project bindings.
    - Permission-denied discovery paths are skipped with a reviewed partial-result warning and are never inferred as safe or empty.
  cli:
    - "Canonical syntax: `openmates remote-access [--path <folder>]... [--json]`."
    - No public remote-access positional subcommands are accepted.
    - No public ciphertext, encrypted-metadata, raw-key, daemon, write, execute, or BYOC-worker flags are part of this spec.
    - Human output displays discovered Projects, approval choices, live connection/reconnect state, approved roots, and safe actionable errors.
    - JSON mode emits structured lifecycle events while keeping the process alive and does not print remotely requested decrypted file contents.
    - The missing-Project review allows per-candidate selection, rename, attach to an existing Project, create, or skip; rejection leaves the candidate unbound and inaccessible remotely.
    - Ordinary-folder candidates use the same review to bind an exact subtree to an existing or newly approved Project; until binding, they remain local discovery output only and support no remote list, search, or read operation.
    - If Project creation or binding requires a decision and stdin is not an interactive TTY, the command fails before connecting with a structured list of unresolved candidates and instructions to rerun interactively; `--json` does not imply approval.
  privacy_security:
    - Canonical realpaths are checked at startup and for every operation, but validation alone is insufficient: file access must use race-resistant no-follow or descriptor-relative traversal and verify the opened object remains inside the approved root before reading.
    - List, search, and read exclude names and content ignored by the containing Git work tree, `.git/**`, the canonical patterns exported by `projectFileRisk.ts`, Project-specific protected patterns stored in encrypted Project settings, null-byte files, invalid UTF-8, and unsupported non-text content.
    - Content-based binary detection supplements extension filtering.
    - Filesystem operations use argument arrays and dedicated filesystem APIs, never a remotely supplied shell string.
    - Each operation enforces explicit item, byte, line, depth, duration, and concurrency caps before buffering or returning content.
    - Requests are authenticated, correlated, replay-resistant, owner-scoped, Project-scoped, source-scoped, and session-scoped.
    - One owner-only workspace session may contain several Project bindings, but a request is restricted to its Project's explicit subtree bindings and cannot traverse sibling Project repositories or unbound ordinary folders.
    - Source revocation, Project deletion, owner/team access removal, source unbinding, or source-session key rotation invalidates queued and in-flight requests for the affected binding.
    - >
      Owner-initiated browser list/search/read authorizes only that operation.
      Assistant retrieval uses the three existing Project privacy modes:
      `always_ask` requires approval for every list, search, and read;
      `ask_for_broad_access` allows a mentioned Project/folder map for the current
      chat but requires approval for every search or read unless an exact file
      mention grants that file for the current message; `allow_for_mentions`
      allows bounded list, search, and read under the mentioned Project/folder
      subtree for the current chat. Folder grants include descendants only inside
      the same explicit Project binding. Grants expire when their message/chat
      scope ends and are invalidated immediately by user revocation, source
      unbinding, Project access removal, or session-key replacement.
    - Plaintext paths, queries, snippets, file contents, keys, and ciphertext are excluded from logs, traces, analytics, and error reporting except sanitized counts and opaque IDs.
    - Forced logout immediately stops request handling before local account credentials and cached account data are purged.

