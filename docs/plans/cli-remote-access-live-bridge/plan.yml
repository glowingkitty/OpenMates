schema_version: 2
id: cli-remote-access-live-bridge
title: CLI Remote Access Live Read-Only Bridge
status: verified

goal: >
  Make `openmates remote-access` a truthful, long-running foreground connection
  between user-approved project folders and OpenMates, with automatic Project
  discovery and background encryption, plus bounded list, search, and text-file
  read/preview operations that become unavailable when the command disconnects.

scope:
  in:
    - One canonical `openmates remote-access` foreground command with no start, stop, status, or search subcommands.
    - A live authenticated first-party bridge that remains connected until Ctrl+C, process exit, forced logout, or unrecoverable authentication failure.
    - Automatic reconnect with bounded backoff after temporary network interruption.
    - Heartbeats and accurate connected/offline source state after clean shutdown, crashes, network loss, and revocation.
    - Default recursive Git-repository discovery under the command's starting folder.
    - Reconnection of existing repository-to-Project associations and one reviewed confirmation before creating missing OpenMates Projects.
    - Preservation of ordinary folders in the owner-only local discovery tree, with no remote operation until the user explicitly binds an ordinary-folder subtree to a Project.
    - Up to 16 repeated `--path <folder>` values that replace starting-folder discovery and may select roots inside or outside the current folder.
    - Realpath-based approved-root enforcement, broad-root warnings, symlink escape prevention, Git ignored-file exclusion, secret/high-risk path exclusion, and content-aware binary exclusion.
    - Bounded directory listing, text search, and selected text-file read/preview operations over the live bridge.
    - Cleartext-only user-facing CLI input and output, with key handling, encryption, and decryption performed automatically inside trusted first-party clients.
    - Removal of public `--encrypted-display-name` and `--encrypted-metadata` requirements from normal remote-access usage.
    - Accurate CLI, package, user-guide, architecture, and VS Code setup documentation for the implemented foreground command.
    - Real dev-server REST/WebSocket and CLI evidence proving the live bridge, followed by deployed Projects UI verification.
  out:
    - Public lifecycle subcommands such as `remote-access start`, `stop`, `status`, or `search`.
    - A hidden daemon, operating-system service, or bridge that remains active after the foreground command exits.
    - File creation, update, delete, rename, patch application, chmod, or any other filesystem mutation.
    - Shell commands, package installation, test execution, Git mutation, or arbitrary process execution requested by OpenMates.
    - Background repository synchronization, bulk upload, or automatic mirroring of source contents.
    - BYOC Claude subscription worker mode or routing model inference through a local Claude Code process.
    - Remote-access source management in the public npm or pip SDKs; the source-machine bridge remains CLI-only.
    - Automatic creation of Projects without a reviewed user confirmation.
    - Apple-native hosting of the source-machine bridge.

context_discovery:
  github_issues:
    - "GitHub MCP authentication returned 401, so current issue lookup could not be completed. Existing projects-remote-sources discovery records #447, #442, and closed #140 as related context."
  docs:
    - docs/plans/projects-remote-sources/plan.yml
    - docs/plans/forced-logout-local-data-purge/plan.yml
    - docs/plans/vscode-extension-v1/plan.yml
    - docs/architecture/platforms/cli-package.md
    - docs/user-guide/cli/remote-access.md
    - docs/contributing/guides/spec-driven-development.md
  code_patterns:
    - frontend/packages/openmates-cli/src/cli.ts currently registers a source, prints foreground-session copy, and returns immediately.
    - frontend/packages/openmates-cli/src/remoteAccess.ts contains local source persistence and bounded rg search primitives but no live transport wiring.
    - frontend/packages/openmates-cli/src/ws.ts provides an authenticated first-party WebSocket and force-logout event support.
    - frontend/packages/openmates-cli/src/protonBridgeConnector.ts provides a reusable foreground connector, heartbeat, reconnect, and correlated-request pattern.
    - backend/core/api/app/routes/projects.py exposes authenticated Project source create/list routes but no source heartbeat, status update, revocation, or bridge request lifecycle.
    - backend/core/api/app/services/connected_accounts_service.py provides a reusable pending/result request-correlation pattern for local connectors.
    - frontend/packages/ui/src/services/projectService.ts decrypts Project source metadata with the Project key.
    - frontend/packages/ui/src/services/projectRemoteSources.ts normalizes bounded virtual previews and explicit upload candidates.
  tests:
    - frontend/packages/openmates-cli/tests/remoteAccess.test.ts
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/packages/openmates-cli/tests/remoteSources.test.ts
    - backend/tests/test_project_remote_sources.py
    - frontend/packages/ui/src/services/__tests__/projectRemoteSources.test.js
    - frontend/apps/web_app/tests/projects-remote-sources.spec.ts
  verified_facts:
    - id: VF-1
      finding: The current command writes local metadata, optionally registers one Project source, prints that a foreground session started, and returns without a live bridge.
      evidence: frontend/packages/openmates-cli/src/cli.ts:2907-2944
    - id: VF-2
      finding: Internal source search is root-scoped and capped but has no production caller outside remoteAccess.ts.
      evidence: frontend/packages/openmates-cli/src/remoteAccess.ts:136-250
    - id: VF-3
      finding: Normal Project registration currently requires callers to supply encrypted display-name and metadata flags.
      evidence: frontend/packages/openmates-cli/src/cli.ts:2981-3013
    - id: VF-4
      finding: The deployed Projects E2E test inserts synthetic encrypted preview metadata directly through REST instead of exercising a running CLI bridge.
      evidence: frontend/apps/web_app/tests/projects-remote-sources.spec.ts:42-140
    - id: VF-5
      finding: Current user and package documentation advertises lifecycle/search subcommands that current CLI tests require to fail.
      evidence: docs/user-guide/cli/remote-access.md:15-32; frontend/packages/openmates-cli/tests/cli.test.ts:995-1044

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Settings/Views/SettingsProjectsView.swift
  parity_expectations:
    - Apple does not host the CLI bridge and does not gain local filesystem authority.
    - Existing native Project source settings continue to decrypt source names and represent connected/offline state from the shared backend contract.
    - No Apple implementation begins until backend, CLI, deployed web, visual review, and user-confirmation gates are complete.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios
  intentional_native_differences:
    - Starting, supervising, and stopping remote access remains a terminal workflow on the source machine.

clarification:
  rounds:
    - question: Should the first live bridge support only remote search, or bounded list, search, and text-file read/preview operations?
      answer: Support bounded list, search, and text-file read/preview operations.
    - question: How should the command choose Projects?
      answer: By default connect all projects discovered in the folder where the command starts, except when explicit project paths are supplied.
    - question: Should missing OpenMates Projects be created automatically?
      answer: Detect repository candidates, reconnect existing associations, and ask once before creating and connecting missing Projects; never create silently.
    - question: How should temporary disconnection, clean shutdown, and forced logout behave?
      answer: Reconnect automatically with bounded backoff, mark sources offline on shutdown or heartbeat expiry, and exit plus purge credentials on forced logout.
    - question: Do repeated explicit paths add to or replace current-folder discovery?
      answer: Explicit `--path` values replace current-folder discovery so only those roots are connected.
  vision_summary: >
    `openmates remote-access` is one foreground command that actually remains
    connected and serves bounded read-only filesystem operations. It discovers
    repository Projects under the starting folder by default, uses explicit
    paths as a complete scope override, keeps ordinary folders browsable, and
    requires review before creating missing Projects. Users always work with
    cleartext names, paths, queries, and results; trusted clients perform all
    encryption, decryption, and key handling invisibly.
  approved_by_user: true

