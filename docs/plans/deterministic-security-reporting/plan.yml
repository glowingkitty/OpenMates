  - incomplete
  - failed or unchanged results.
  then:
  - Record outcomes without reporting inference and preserve remediation.
- id: S-2
  title: Critical alert deduplication
  given:
  - Two scanners observe aliases of the same critical finding.
  when:
  - Concurrent runs
  - restarts and delivery retries occur.
  then:
  - Keep one canonical incident and never resend accepted delivery.
- id: S-3
  title: One actionable daily report
  given:
