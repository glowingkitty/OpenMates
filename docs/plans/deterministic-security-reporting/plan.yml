schema_version: 2
id: deterministic-security-reporting
title: Deterministic Daily Security Reporting
status: implementing
goal: 'Stop emails for every hourly security scan, consolidate results into a daily security issues email, retain
  deduplicated immediate critical alerts, and use no AI inference for work that can be performed reliably and deterministically.

  '
specifications:
- id: architecture.security-reporting
  version: 1
  status: approved
  fingerprint: c83d857845771131cc1d9278b500e71078b93c3662e2d7cab0cfa543f7221516
  assertions:
  - security-reporting.processing.deterministic
  - security-reporting.notifications.daily-not-per-scan
  - security-reporting.findings.canonical-lifecycle
  - security-reporting.alerts.new-critical-only
  - security-reporting.coverage.no-false-clean
  - security-reporting.digest.actionable-content
  - security-reporting.delivery.durable-observable
  - security-reporting.content.operator-boundary
scope:
  in:
  - Durable scan outcomes, canonical findings, critical incidents and email receipts.
  - Daily 08:30 UTC email including weekends and clean days.
  - Structured audit/red-team snapshots with dates and explicit unavailable states.
  - Removal of reporting-only agents and routine security completion emails.
  out:
  - Changing substantive audits, scan frequency, remediation eligibility or permissions.
  - Unrelated cron notifications, reliability/operational digests or Discord delivery.
  - Public APIs, product CLI commands, SDKs, web/Apple screens or production rollout.
