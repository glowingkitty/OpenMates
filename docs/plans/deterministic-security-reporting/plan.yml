technical_boundaries:
  persistence: 'Use private host-local SQLite under logs/security-reporting, with transactions, schema versioning
    and bounded lock waits. Keep run IDs, alias mappings, transitions, immutable report payloads and delivery claims
    separate from remediation tracking. Retain open incidents and pending/unknown deliveries; prune only completed
    history beyond 30 days. Do not fabricate historical runs.

    '
  collection: 'Persist scan results before remediation dispatch and record dispatch outcomes separately. Preserve
    findings from partially failed scans. Verify resolution against complete inventories and affected version ranges.
    Ingest structured audit snapshots by source/timestamp; missing structure remains unavailable.

    '
  delivery: 'Reuse existing configured email transport/rendering after verifying acceptance and idempotency semantics.
    Persist queued versus provider-accepted states; unknown outcomes require reconciliation, not blind retries.
    If an internal receipt extension is needed, retain service-token authentication, bounded payloads, stable idempotency
    keys and configured recipients. No public access, user data, ciphertext, user credits or arbitrary recipient
    input is involved. Definite failures use bounded backoff independently of scan observations. Before implementation
    of retries, verify transport idempotency/reconciliation capability. Persist provider message ID when available,
    stable request key, payload hash, attempt timestamp and outcome. Reconcile unknown outcomes using provider lookup
    or retry the same supported idempotency key; if neither is supported keep unknown visible for operator reconciliation
    and do not resend.

    '
  scheduling: 'One host systemd daily timer at 08:30 UTC with persistent catch-up owns digest generation; a bounded
    retry tick sends pending attempts, never extra digests. Preserve hourly scanner cron entries at minutes 30 and
    35 and all unrelated schedules. Installer check mode verifies ownership without mutating state.

    '
  rollout: 'Deploy collection and delivery infrastructure first. Verify a labeled dev email and durable receipt
    before enabling the timer and suppressing generic security emails. Remove clean/no-change summary agents in
    the cutover. Keep state on rollback and stop only the new reporting timers, never scans or remediation. Document
    missing history and missed windows rather than sending a backlog burst. Record the deployed commit before claiming
    completion.

    '
