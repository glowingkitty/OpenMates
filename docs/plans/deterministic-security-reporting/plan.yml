  - backend/tests/test_dependency_security_schedule.py
  - scripts/tests/test_dependency_update_policy.py
  findings:
  - Clean EU scans currently launch a reporting agent and generic completion email.
  - OSV batch failures can become an empty finding list; collection completeness must be explicit.
  - Scanner runtime state already has isolated paths and atomic writes; preserve remediation state.
  - Latest-only nightly reports are insufficient for a day's transitions.
  - Internal queue acceptance is not email-provider acceptance.
