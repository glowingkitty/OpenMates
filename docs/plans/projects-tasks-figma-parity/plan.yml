schema_version: 2
id: projects-tasks-figma-parity
title: Projects and Tasks web Figma alignment
status: verified
goal: 'Make the web Projects detail, folder browser, project task board and Tasks
  workspace match the approved Figma layouts while preserving existing encrypted data
  and actions.

  '
scope:
  in:
  - Persistent blue project header reaching the pane edges, shared chat/embed
    More actions, and shared icon tabs for Overview, Files and Tasks.
  - Root README.md rendered as safe, readable Markdown with proxied images; Figma
    empty state otherwise.
  - Folder and embed cards using the shared preview surface and responsive
    fullscreen behavior; connected remote cards show a cloud marker and remote
    fullscreen files identify their server or device. Create offers New chat,
    New workflow and Project-linked New plan.
  - Five task statuses, including Blocked, with the newer Figma board styling and
    colored status lines.
  - Workspace-specific sidebar content and responsive project/task layout.
  - Bare component previews and focused browser coverage for changed states.
  out:
  - README editing, document/sheet/code creation, production changes or unrelated
    chat sidebar styling.
design_reference:
  file_key: PzgE78TVxG0eWuEeO6o8ve
  nodes:
    project_details: 5386:33360
    folders: 5394:45975
    project_tasks: 5395:47058
    tasks_newer: 5371:46140
    tasks_toolbar: 5395:47061
    task_card: 5371:46143
    task_assigned_ai: 5376:47116
    task_assigned_user: 5376:47084
    task_workflow_run: 5376:47191
  interpretation: Exact layout target for project surfaces and Tasks workspace, adapted
    to current data and five statuses.
  viewport_sizes: Desktop frames 1512px wide; project details and Tasks also show
    393px mobile frames.
  reusable_components:
  - frontend/packages/ui/src/components/settings/elements/SettingsTabs.svelte
  - frontend/packages/ui/src/components/embeds/code/CodePreviewPane.svelte
  - frontend/packages/ui/src/components/projects/ProjectBrowserItem.svelte
  - frontend/packages/ui/src/components/tasks/TaskBoard.svelte
  evidence_paths:
  - test-results/figma/projects-redesign/reference/
  - test-results/figma/projects-redesign/rendered/
  accepted_differences:
  - Keep a fifth Blocked task column because the current product has that status.
  - Shade only Blocked; the linked Figma frame predates the fifth column.
  - Use each saved project icon, or a folder fallback, in place of the example airplane
    icon.
  - Create offers New chat, New workflow and Project-linked New plan; README
    editing is deferred.
  - Ignore the exact chat sidebar contents shown in Figma.
  - Show muted live counts beside each task category title instead of the Figma
    count summary at the top left.
  - The empty Overview retains Upload and Create actions; Upload and Create also
    remain in Files, and neither appears in the Project header More menu.
scenarios:
- id: S-1
  title: Project detail and folder navigation
  given:
  - A project has optional root README, folders and linked embeds.
  when:
  - The user opens the project and switches Overview or Files.
  then:
  - The Figma header and tabs persist, README renders safely, and folders show reusable
    previews.
- id: S-2
  title: Project and global task boards
  given:
  - Tasks exist in five statuses.
  when:
  - The user opens project Tasks or the global Tasks workspace.
  then:
  - The newer Figma styling appears and Blocked remains a visible fifth column.
acceptance_criteria:
- id: AC-1
  scenario: S-1
  text: Opening a project selects Overview and keeps the edge-to-edge header and
    width-limited tabs and content visible across views. The header uses the existing
    chat/embed More UI for Settings and Delete, with no Upload or Delete at top left.
    A root README renders headings, images, links and code without executing
    untrusted content or direct remote image loading. The empty Overview prompts for
    a README and retains Upload and Create actions. Files also exposes Upload
    and the approved Create actions; neither Upload nor Create belongs in the
    Project More menu.
    Folders show reusable embed previews and open files through existing split or
    overlay fullscreen behavior. Connected remote cards show a cloud marker; their
    fullscreen files identify the server or device above the line count. The narrow
    split pane shows the three Files actions above stacked previews without remote
    browser chrome. New chat enters chat creation with a project mention; New
    workflow carries the selected project and folder path; New plan starts a
    Project-linked draft.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-PROJECTS
- id: AC-2
  scenario: S-2
  text: Project tasks and Tasks workspace share a five-column board with the newer
    Figma visual treatment, with only Blocked shaded, colored category lines,
    black-on-light task titles limited to three lines, and lift/rotate/drop animation.
    Each category shows a muted live count, while the toolbar has the Figma search
    field, compact tags, and circular filter control. Relevant preview states and browser flows are verified
    at desktop and mobile sizes against exported Figma PNGs.
  required: true
  status: satisfied
  coverage_status: covered
  verification_scope: playwright
  verification_ids:
  - T-TASKS
