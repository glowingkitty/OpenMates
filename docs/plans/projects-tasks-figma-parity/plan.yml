decisions:
- id: D-1
  status: active
  decision: Use Overview first, root README, reusable settings tabs, saved icon fallback
    and five task columns.
  reason: These choices were explicitly confirmed by the user.
  decided_at: '2026-09-24'
- id: D-2
  status: active
  decision: Reuse the chat/embed HeaderActionMenu; place Delete there, keep Upload
    in the Files flow, and extend the project hero to the top and side edges of
    its pane while limiting width only below the hero.
  reason: User corrected the rendered header and action placement during review.
  decided_at: '2026-09-24'
- id: D-3
  status: active
  decision: Keep encrypted Project folders as folder records, render them through
    the shared embed preview surface, and remove New folder and standalone Remote
    sources sections. Show only Blocked with a darker task-column background;
    task cards have no completion circle and animate lift, ten-degree rotation,
    and settle on drag and drop.
  reason: User corrected the Files and Tasks previews and clarified that folder
    visuals must not create new embed records.
  decided_at: '2026-09-25'
- id: D-4
  status: active
  decision: Use the existing Create icon and white selected tab icons in dark mode;
    center Upload and Create icons over their labels, align the tab pill center to
    the content panel top edge, and match the Figma task toolbar search, compact
    tags, and circular filter button while showing counts beside each category.
  reason: User corrected the light and dark preview screenshots.
  decided_at: '2026-09-25'
- id: D-5
  status: active
  decision: In the remote-file split view, show only the three Files actions above
    stacked shared preview cards in the narrow pane. Mark all remote folders and
    files with a cloud icon on the card, and identify the server or device above
    the line count in the remote fullscreen viewer.
  reason: User corrected the live split-view screenshot and remote provenance cues.
  decided_at: '2026-09-25'
- id: D-6
  status: active
  decision: Retain Upload and Create in the empty Overview and Files, while the
    Project header More menu reuses the chat/embed menu styling for Settings and
    Delete only.
  reason: User explicitly clarified the empty Overview buttons and shared More
    menu behavior after reviewing the screenshot.
  decided_at: '2026-09-25'
