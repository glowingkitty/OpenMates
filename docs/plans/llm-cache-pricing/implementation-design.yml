scenario_assumptions:
  main_example: 100000 input tokens, 1000 billable output tokens, 80000 unchanged reusable prefix; one cold call followed by nine reported hits, all within retention.
  baseline: Correctly accounted uncached reference at existing ordinary input/output rates, not the current undercounting on some Anthropic paths.
  lower_bound: No measured production hit rate. Smaller prompts, output-heavy turns, changing tools, compression, expiry, and fallback routing reduce savings; no hit means no read discount.
  paid_write_downside: At 80 percent written input, a cold five-minute/1.25x Claude write request is approximately 19 percent more expensive for users. OpenAI's same supplier premium is absorbed within ordinary input under the approved policy; repeated expired writes reduce our contribution.
  excluded_from_example: Auxiliary inference, infrastructure, funding/FX/payment effects, minimum contribution, provider price changes, and Google explicit storage.
  artifacts: [simulate.py, scenarios.csv]

configured_scope:
  source: Provider YAML inventory at the audited repository head, not verified active production traffic.
  google:
    in_scope_gemini: [gemini-3-flash-preview, gemini-3.7-flash, gemini-3.8-flash, gemini-3.1-pro-preview, gemini-3.5-flash, gemini-3.5-flash-lite]
    outside_requested_host_scope: Gemma 4 31B routes to Cerebras; Google publication does not make it an AI Studio/Vertex cache tariff.
    per_model_requirement: Add cache supplier/public rates currently missing in YAML; verify minimum prefix, modality and long-context rate for each Gemini rather than copying Flash introductory terms.
  openai:
    paid_write_candidates: [gpt-6-astra, gpt-6.1-sol, gpt-6-sol, gpt-6-luna, gpt-5.6-luna, gpt-5.6-terra, gpt-5.6-sol, gpt-5.6-sol-max]
    earlier_implicit_candidates: [gpt-5.5, gpt-5.4]
    outside_requested_host_scope: GPT-OSS 120B/20B are served via Bedrock/OpenRouter, not the native OpenAI API. Normalize them without asserting identical caching prices or controls.
    per_model_requirement: Verify both API contracts and model threshold/context/retention rates; GPT-5.4 lacks cached cost metadata and must not inherit an invented zero or GPT-6.1 Sol ratio.
  anthropic:
    direct_candidates: [claude-fable-5-1, claude-fable-5, claude-opus-5-5, claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001, claude-sonnet-4-6, claude-opus-4-6, claude-opus-4-7, claude-opus-4-8]
    preferred_bedrock: [claude-haiku-4-5-20251001, claude-sonnet-4-6, claude-opus-4-6]
    per_model_requirement: Preserve each model read multiplier, minimum prefix and supported host/TTL; cost EU Bedrock profiles separately from direct. Verify additional Bedrock fallback model capability before admission.
  mistral:
    direct_candidates: [mistral-large-4, mistral-small-latest, mistral-medium-latest]
    current_served_families: [Large 4, Small 4, Medium 3.5]
    per_model_requirement: Add Small 4 and Medium 3.5 read costs from official pricing, resolve latest aliases to versioned effective models, and revalidate Large 4 sale pricing.

architecture:
  normalized_usage:
    location: Shared provider usage contract and billing schema
    fields: [input_total, input_uncached, cache_read, cache_write_by_retention, output_billable, output_reasoning_subset, provider_host, upstream_model, region, tier, modality, context_band, provider_request_id, attempt_id, phase, usage_provenance, completeness, tariff_version]
    invariants:
      - Total input equals uncached plus reads plus writes. Categories never overlap, including legacy aliases and TTL subtotals.
      - Provider-reported zero differs from unsupported/missing usage. Do not apply a fabricated cache discount to an estimate.
      - Merge cumulative streaming usage, then emit exactly one final normalized record per invocation. Retries and tool iterations have distinct attempt identities.
      - Output includes paid reasoning once; visible output and reasoning subsets never add to an already-inclusive provider total.
    incomplete_attempt: Track an estimated upper cost bound for internal liability and reconciliation. Do not invent customer token counts; reserve uncertainty and preserve the approved partial-failure charge policy.
  prompt_cache_context:
    entrypoints: [backend/apps/ai/utils/llm_utils.py:962, backend/apps/ai/utils/llm_utils.py:1589]
    design: Optional typed context with structured stable instructions/tools/history, explicit boundary, model capability, permitted retention, and opaque owner-scoped key. Translate per adapter; do not pass unsupported generic kwargs to every callable.
    system_mapping: Both main and preprocessing dispatch currently pass one joined system string; Anthropic/Bedrock/Google converters must preserve stable and dynamic segments without dropping later system text or altering instruction priority.
    clock_and_history: Separate fresh current-time/context suffix from immutable instructions. A changing suffix before chat history still prevents history reuse; use bounded temporal updates/append-only context where semantically safe, and measure system-only versus history reuse. Never freeze the actual time or authorization context.
    compression: Compression may invalidate a prefix while lowering total token cost. Retain token-saving compression; do not optimize hit percentage at the expense of total spend.
  tariff_catalog:
    owners: [backend/providers/google.yml, backend/providers/openai.yml, backend/providers/anthropic.yml, backend/providers/mistral.yml, backend/core/api/app/utils/config_manager.py, backend/shared/python_utils/billing_utils.py]
    design: Keep private route supplier costs separate from public user credit rates. A versioned resolver handles model revision, actual host/upstream, location, context band, modality, tier, retention, effective date, expiry, and metric availability.
    route_pricing: Prefer one published per-model user tariff that is safe across admitted fallback hosts, while supplier costs remain route-specific. If a route needs different user pricing, disclose/select its variant and reserve the maximum accepted fallback price before dispatch; no surprise repricing.
    snapshot: Freeze public tariff and private cost version per attempt before the provider call. Settlement/retries/outbox replay use that snapshot, not the latest YAML. Reject expired unverified configurations at admission.
    public_source: Runtime backend catalog is the billing authority; generated web/native catalogs carry version/effective dates and refresh against it. The billed receipt always contains its exact charged version.
  aggregation_and_charge:
    paths:
      - backend/apps/ai/processing/model_usage_tracker.py:52
      - backend/apps/ai/processing/main_processor.py:5235
      - backend/apps/ai/processing/main_processor.py:9949
      - backend/apps/ai/tasks/stream_consumer.py:3405
      - backend/shared/python_utils/billing_utils.py:84
    changes: Aggregate normalized usage by actual attempt/route/tariff, preserve it through the final sentinel, calculate category credits once, and atomically commit the same receipt with personal or team debit. Count all supplier-paid phases internally even where their customer fee is bundled.
    other_callers: Inventory OpenAI-compatible client-tool billing, workflow authoring, account imports, anonymous quotes, preprocessing/postprocessing/compression, and image-to-HTML. Migrate shared semantics or explicitly retain a validated ordinary-only tariff; do not claim global parity with old independent calculators.
  reservation:
    paths: [backend/apps/ai/processing/main_processor.py:2062, backend/apps/ai/processing/main_processor.py:2113, backend/apps/ai/processing/main_processor.py:2296]
    design: Replace standard-input-only quoting with worst admitted cold write/retention, maximum billable output/reasoning, fallback context/host tariffs, bounded retries, auxiliary budgets, and explicit-cache storage liability. Release unused reservation after final settlement.
    behavior_preserved: Preserve existing atomic personal/team funding checks, authorized personal overdraft, anonymous hard caps, and idempotent recovery. Changing those limits is a separate product decision.
  receipt_persistence:
    new_field: Encrypted structured llm_usage_breakdown JSON with schema_version and immutable public itemized usage/rates/fractional amounts/rounding allocation.
    paths:
      - backend/core/directus/schemas/usage.yml:100
      - backend/core/api/app/services/billing_service.py:417
      - backend/core/api/app/services/team_billing_service.py:109
      - backend/core/api/app/services/directus/usage.py:245
      - backend/core/api/app/services/directus/usage.py:1350
      - backend/core/api/app/services/directus/usage.py:1911
      - backend/core/api/app/services/usage_overview_service.py:56
      - backend/core/api/app/services/usage_archive_service.py:92
      - backend/core/api/app/routes/settings.py:1909
    compatibility: Add optional schema fields, extend both save/decrypt and service allowlists, REST/detail/chat/CSV/archives. Old entries show unavailable cache breakdown, not invented zeros; immutable historical totals remain unchanged.
    charge_reconciliation: Input category counts sum to total input. Fractional credit rows plus a rounding/minimum adjustment sum exactly to the committed integer credits, or use deterministic largest-remainder allocation. Token-composition rows are a separate view, never additional charges.
    privacy: Public receipts contain charged credit rates, not private supplier costs or prompt text. Minimal private cost/provenance ledger has the existing restricted ownership/access policy, encryption, retention, and immutable operation identity.
  client_surfaces:
    metadata:
      - frontend/packages/ui/scripts/generate-models-metadata.js
      - frontend/packages/ui/src/data/modelsMetadata.d.ts
      - backend/shared/python_schemas/app_metadata_schemas.py
      - frontend/packages/ui/src/types/apps.ts
      - backend/core/api/app/routes/apps_api.py
      - backend/core/api/app/routes/internal_api.py
      - backend/core/api/app/routes/openai_compat.py
    pricing_ui:
      - frontend/packages/ui/src/components/settings/AiAskModelDetails.svelte
      - frontend/packages/ui/src/components/settings/AppSkillModelDetails.svelte
      - frontend/packages/ui/src/components/apps/AppsSkillForm.svelte
      - frontend/packages/ui/src/components/settings/SkillDetails.svelte
    receipt_ui:
      - frontend/packages/ui/src/components/settings/SettingsUsage.svelte
      - frontend/packages/ui/src/types/chat.ts
      - frontend/packages/ui/src/components/chats/chatUsageRows.ts
    transport: Extend final websocket usage payload and REST schemas with an optional itemized receipt, plus CLI ws.ts/client.ts and npm/pip SDK types; pass-through routes still need contract/documentation checks.
    apple: Update generated native catalog schema and NativeModelCatalog/NativeComposerModelDetails, settings model pricing, SettingsBillingView, and ChatSettingsUsageModel; match web rate/receipt semantics and unknown legacy states.
    public_rows: [Ordinary input, Cache read, Cache write with retention or included label, Output including billable thinking]
    conditional_rows: [Explicit storage or bundled prepaid retention, Service or minimum-charge adjustment if calibrated and approved]
    rate_display: Prefer credits per 1000 tokens plus an optional existing tokens-per-credit conversion; show write retention, valid version/date, and caching availability. Fractional precision must not imply a different integer charge.

implementation_outcomes:
  - outcome: Approved cache pricing/receipt contract and calibrated economics
    dependencies: []
    deliverable: Extend feature.billing examples/assertions and approve exact review; establish net-credit value, margin/minimum targets, route rates, rounding, contribution disclosure, and maximum liability.
  - outcome: Trustworthy normalized provider usage and shadow cost ledger
    dependencies: []
    deliverable: Both streaming/nonstreaming APIs, direct/Bedrock Claude, Google thinking, all attempts/phases, private cost snapshots, fixture validation and invoice reconciliation. No customer pricing switch yet.
  - outcome: Stable prompt segments and provider cache controls
    dependencies: [Trustworthy normalized provider usage and shadow cost ledger]
    deliverable: Capability-gated explicit boundaries/keys with privacy and temporal semantics preserved; dev-only bounded real cache validation.
  - outcome: Versioned category pricing, budget reservation, and atomic receipts
    dependencies: [Approved cache pricing/receipt contract and calibrated economics, Trustworthy normalized provider usage and shadow cost ledger]
    deliverable: Shared tariff resolver, cold/retry/storage liability, personal/team charges, persisted/decrypted/archived immutable receipt, legacy compatibility and other billing callers.
  - outcome: Identical public pricing and usage details across clients
    dependencies: ['Versioned category pricing, budget reservation, and atomic receipts']
    deliverable: Generated catalog/backend APIs, web disclosures/exports, websocket/CLI/npm/pip schemas, Apple catalog/settings; matching exact total and rate versions.
  - outcome: Gradual separate-cache pricing activation
    dependencies: [Stable prompt segments and provider cache controls, Identical public pricing and usage details across clients]
    deliverable: Shadow-versus-final comparison, funded promotions, per-model/route flags, cold-cache stress evidence, clear prospective accounting correction, price-expiry checks and rollback preserving old receipts.
  - outcome: Optional bounded Google explicit-cache retention pricing
    dependencies: [Gradual separate-cache pricing activation]
    deliverable: Only for eligible reference-heavy use cases with lower measured all-in cost than implicit misses; prepaid retention lifecycle and storage reconciliation.
tracking: Proposed independent outcomes/dependencies only. Create implementation Tasks after that work is authorized; OpenMates Tasks remains the sole status ledger.

future_contract_examples:
  owner: specifications/features/billing
  current_assertions: [billing.usage.receipt-token-breakdown, billing.surface.semantic-parity]
  candidates:
    - given: A 100000-token input contains 20000 ordinary tokens, 60000 cache reads, and 20000 newly written tokens.
      when: The completed request is charged and its receipt is opened in any supported client.
      then: Three mutually exclusive input rows sum to 100000, each uses its frozen rate, and their charge plus output and the disclosed rounding adjustment equals the debit.
    - given: A Gemini implicit-cache call reports cached reads but no write counter.
      when: Pricing and the usage receipt are displayed.
      then: Cached reads receive their published rate; other input is ordinary input, and cache writes say included rather than showing a fabricated paid write.
    - given: A one-hour explicit cache is created and reused twice, then the catalog changes before settlement recovery.
      when: Billing resumes the interrupted operation.
      then: Fill and prepaid retention are charged once, both references pay their own reads, and replay uses the original rates without another debit.
    - given: A legacy receipt predates cache usage tracking, or a provider omits cache metrics.
      when: The receipt is viewed or a new request is admitted.
      then: Legacy detail remains unavailable with its original total; missing telemetry never creates free usage or a promised cache discount.
    - given: An admitted request retries on a more expensive host while the first attempt has incurred supplier cost.
      when: The fallback is considered.
      then: The frozen published tariff and funding bound cover the accepted attempts, or the next attempt is stopped without undisclosed repricing.
  preservation: Reuse existing charge atomicity/idempotency/privacy/ownership, anonymous cap, authorized personal overdraft, partial failure, and semantic-parity requirements. Do not expand this research into an unapproved Specification edit.

verification_plan:
  local_fixture_checks:
    - Extend test_provider_usage_extraction.py for inclusive/exclusive input, both OpenAI APIs, Google reasoning, direct Anthropic message_start/delta, Bedrock reads/writes, Mistral cached details, zero/unknown, invalid partitions, and one final usage record.
    - Extend test_model_usage_tracker.py, test_billing_utils.py, test_ai_fallback_billing.py for per-attempt snapshot aggregation, write TTLs, output thinking, cost floors, expired tariffs, paid misses, and one-time rounding.
    - Extend test_usage_entries.py, test_billing_idempotency.py and test_billing_settlement_reliability.py for encrypted optional breakdown, personal/team transactions, replay, archived/legacy decrypt and exports.
  isolated_product_ci:
    - Extend usage-token-breakdown.spec.ts, ai-model-settings.spec.ts and components/apps-skill-form.spec.ts for price rows, included writes, unknown legacy detail, exact receipt totals and version parity.
    - Add relevant REST/OpenAI-compatible/CLI/npm/pip and Apple semantic-parity cases, including NativeModelCatalogTests.swift and SettingsBillingParityUITests.swift.
    - Use sessions.py ci-source plus coordinator submission; deliver every recording using the CI receipt's codex_evidence_command.
  real_inference_dev_only: Bounded isolated test account/budget; one cold write, warm read, partial append, cache expiry, tool/schema change and host fallback per supported model/API/TTL. Record numeric usage and reconcile supplier bill; never use private customer prompts or run real AI in CI.
  launch_limits: Numeric contribution targets, cash exposure, expiry/revalidation intervals, loss reserve, and pilot thresholds must be calibrated from evidence. Missing financial data is a launch constraint, not a blocker for this completed planning work.
