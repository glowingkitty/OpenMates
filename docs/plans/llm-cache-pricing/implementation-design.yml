schema_version: 1
kind: research_and_implementation_reference
status: draft
plan: plan.yml
as_of: '2026-10-06'
purpose: Separate cache read/write pricing and receipts for the four requested providers while preserving funded contribution.
authorization: User approved authenticated reservations, bundled auxiliary accounting and verified OpenAI read discounts with unreported writes included in ordinary input on 2026-10-07. plan.yml records accepted scope; flags remain disabled until route and financial checks pass.
working_assumption: Preserve a protected margin percentage plus a minimum contribution. The optional user preference remains unconfirmed; alternatives are evaluated below.

recommendation:
  pricing: >-
    Publish fixed rates for ordinary input, verified cache reads, writes with
    their retention, and output. Price paid writes instead of ordinary input for
    those tokens, never on top of it. Keep implicit Google and Mistral writes
    included in ordinary input, because neither provides a separately billable
    implicit-write category. Google explicit storage needs its own disclosed
    price or a bounded retention price bundled into the write operation.
  rollout: Normalize and shadow costs first; improve stable prefixes; calibrate tariffs/reservations; publish receipts and all client surfaces; activate model/route groups gradually. Evaluate Google explicit resources after implicit savings.
  margin: Proportional category pricing preserves the supplier markup ratio before overhead and rounding. It does not prove OpenMates net margin; fixed work, all inference phases, funding, fees, FX, and promotions must be covered.

provider_design:
  google:
    hosts: [google_ai_studio, google]
    current: Implicit caching is available; cached_content_token_count and thoughts_token_count are lost. No explicit cache objects are created/referenced.
    phase_one:
      - Keep implicit caching, make the leading prefix stable, preserve cached_content_token_count.
      - Treat prompt_token_count as inclusive; uncached = total minus reported reads. The remainder is ordinary input, not a fabricated write count.
      - Add thoughts_token_count to billable output when candidates_token_count excludes it; do not add thinking twice to providers with inclusive output.
      - Distinguish provider hosting, actual Vertex SDK location, model revision, context tier, modality, and service tier.
    phase_two_explicit:
      - Introduce a server cache-resource manager for create, reuse, reference, expiry, and deletion on each host; use Google SDK caches.create and GenerateContentConfig.cached_content.
      - Represent the prefix as structured system/tools/contents. Do not resend cached system/tools/prefix as live input; the resource reference supplies them.
      - Scope resources to authorized owner/project/conversation and exact prefix version. Store only opaque resource handles, hashes, ownership, reported token count, and expiration; do not retain another plaintext prompt copy.
      - Lock concurrent creation, reserve the entire bounded TTL liability first, keep a strict TTL/cache-count/storage budget, and avoid unbounded automatic renewals.
      - Recheck authorization before use; stop reuse on membership/context changes, promptly delete handles on revocation where supported, and retain the existing provider retention/residency policy.
      - Record resource fill once as a write operation, including all creation processing; reference requests separately record reads. Idempotent creation/charge handling must recover from provider success with an interrupted API response.
      - Reconcile deletion/TTL billing, concurrent failures, duplicate resource creation, and any refundable prepaid storage in the internal cost ledger.
    public_write_label_implicit: Included in ordinary input; no separate cache-write fee.
    public_write_label_explicit: Cache write with stated retention; creation and bounded storage included, reads charged separately.
    costs:
      gemini_3_8_flash_ai_studio_standard_usd_per_million:
        through_2026_12_31: {input: '0.75', read: '0.075', output: '3.75', explicit_storage_per_hour: '0.50'}
        from_2027_01_01: {input: '1.50', read: '0.15', output: '7.50', explicit_storage_per_hour: '1.00'}
      gemini_3_8_flash_vertex_standard:
        global_intro_effective_usd_per_million: {input: '0.75', read: '0.075', output: '3.75'}
        non_global_intro_effective_usd_per_million: {input: '0.825', read: '0.0825', output: '4.125'}
        global_non_promotional_usd_per_million: {input: '1.50', read: '0.15', output: '7.50'}
        explicit_storage_usd_per_million_token_hour: '1.00'
        qualification: Vertex describes introductory discounts as credits back on eligible net spend. Admission/cash exposure must use undiscounted costs until eligibility and posting are reconciled; do not assume AI Studio storage or region rates.
    break_even_explicit: 'N references are cheaper than N cold prefixes only if N > (input_rate + storage_rate * retained_hours) / (input_rate - read_rate). Every reference, including the first, pays reads after the one-time fill.'
    explicit_examples:
      - AI Studio Flash introductory rates, one-hour retention, prefix only; two references beat two cold prefixes, but cost more than equally successful implicit caching because implicit storage is free.
      - Vertex effective introductory rates and one-hour storage; three references are needed to beat cold prefixes. Credit-back eligibility must first be established.
    sources:
      - https://ai.google.dev/gemini-api/docs/caching
      - https://ai.google.dev/gemini-api/docs/pricing
      - https://ai.google.dev/api/generate-content#UsageMetadata
      - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
      - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing

  openai:
    hosts: [openai_direct]
    current: Both Responses and Chat Completions discard cache details; application sends no explicit mode/breakpoints or scoped cache key.
    implementation:
      - Normalize Responses input_tokens_details and Chat prompt_tokens_details, including cached_tokens and cache_write_tokens where supported.
      - On supported GPT-5.6+ models, use explicit-only mode with a breakpoint after the reusable prefix to avoid paid writes for the changing suffix. Put a reusable developer instruction in a supported input_text block, not unmarkable top-level instructions.
      - Keep model/API capability rules; older models have implicit caching without the new write surcharge. Do not send unsupported cache controls or invent write usage.
      - Preserve explicit boundaries across turns, tool loops, and forks. Support at most four writes per request, model minimums, and the documented retention/key behavior.
    minimum_example_tokens: 1024
    retention_example: GPT-5.6+ supports a 30-minute minimum TTL, refreshed on reads; check model-specific controls before enabling.
    gpt_6_1_sol_standard_usd_per_million: {input: '2.00', read: '0.10', write: '2.50', output: '10.00'}
    qualifications: Greater than 272k input changes full-request input/cache costs to 2x and output to 1.5x; fast, regional, flex/batch tiers need independent tariffs. These examples use ordinary standard context.
    sources:
      - https://developers.openai.com/api/docs/guides/prompt-caching
      - https://developers.openai.com/api/docs/models/gpt-6.1-sol

  anthropic:
    hosts: [anthropic_direct, aws_bedrock]
    current: Direct adapter marks system and every long message without a four-marker cap. Native cache input is excluded from standard input but is ignored by main billing. Direct streaming misses message_start usage. Bedrock has no application cachePoint and drops cache counters; current AWS documentation also lists implicit caching availability.
    implementation:
      - Explicit stable-prefix breakpoints, at most four, model-specific thresholds and 20-block lookup behavior. Do not put a changing clock before reusable history or cache the whole changing system block.
      - Merge direct message_start and message_delta top-level usage into one final record. Split writes by reported ephemeral_5m_input_tokens and ephemeral_1h_input_tokens; never charge the aggregate plus its TTL parts.
      - For Converse, append cachePoint after the reusable system/message/tool block; generic cache_control does not survive its converter. Parse cacheReadInputTokens, cacheWriteInputTokens, and cacheDetails TTL attribution; validate actual SDK fixtures for each model.
      - Anthropic and Bedrock inputTokens are exclusive of reported cache reads/writes; normalized total input is their sum. Missing TTL attribution on an enabled paid-write route requires a known single permitted TTL or conservative internal cost attribution with explicit receipt provenance.
      - Default to five minutes initially. Add one hour only where reuse within the longer window offsets its 2x write cost; never silently extend retention based on a presumed saving.
    direct_multipliers: {write_5m: '1.25', write_1h: '2.00', read: Model-specific; usually 0.10, Opus 5.5 0.05, Fable 5.1 0.025}
    direct_opus_5_5_usd_per_million: {input: '4.00', read: '0.20', write_5m: '5.00', write_1h: '8.00', output: '20.00'}
    preferred_bedrock_eu_profile_usd_per_million:
      haiku_4_5: {input: '1.10', read: '0.11', write_5m: '1.375', write_1h: '2.20', output: '5.50', minimum_prefix_tokens: 4096}
      sonnet_4_6: {input: '3.30', read: '0.33', write_5m: '4.125', write_1h: '6.60', output: '16.50', minimum_prefix_tokens: 1024}
      opus_4_6: {input: '5.50', read: '0.55', write_5m: '6.875', write_1h: '11.00', output: '27.50', minimum_prefix_tokens: 4096}
    accounting_change: Existing generic costs reflect lower global/direct rates on these EU profiles. Fix route costs and disclose prospective correction for missing input; never retroactively charge old receipts.
    sources:
      - https://platform.claude.com/docs/en/build-with-claude/prompt-caching
      - https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
      - https://www-cdn.anthropic.com/files/4zrzovbb/website/3684c2faafb97418665782cea0001f439f74b1d2.pdf

  mistral:
    hosts: [mistral_direct]
    current: No stable prompt_cache_key is sent; prompt_tokens_details.cached_tokens is discarded.
    implementation:
      - Supply an opaque stable owner/conversation/prefix-scoped prompt_cache_key; preserve exact serialized prefix, tools and content. A key improves reuse but does not guarantee a hit.
      - Normalize cached_tokens within inclusive prompt_tokens; ordinary input is the remainder. Do not fabricate paid writes, storage, or a retention guarantee absent documented terms.
      - Use model-card/pricing cached rates rather than multiplying every model by exactly 0.10; Large 4 is rounded to 0.07/0.68.
    minimum_prefix_tokens: 64
    cache_token_blocks: 64
    standard_usd_per_million:
      large_4_intro: {input: '0.68', read: '0.07', output: '2.09'}
      large_4_non_sale: {input: '1.36', read: '0.14', output: '4.18'}
      small_4: {input: '0.15', read: '0.015', output: '0.60'}
      medium_3_5: {input: '1.50', read: '0.15', output: '7.50'}
    public_write_label: Included in ordinary input; no separate cache-write fee.
    qualification: Large 4 is currently a public-preview sale; no expiry was verified. Require price revalidation and a conservative non-sale liability bound before activation.
    sources:
      - https://docs.mistral.ai/studio/conversations/advanced/prompt-caching
      - https://docs.mistral.ai/inference/pricing
      - https://docs.mistral.ai/models/mistral-large-4-0

pricing_policies:
  recommended_proportional:
    read_user_rate: 'existing_input_credit_rate * supplier_read_rate / supplier_input_rate'
    write_user_rate: 'existing_input_credit_rate * supplier_write_rate / supplier_input_rate'
    meaning: Retain the input markup ratio for each mutually exclusive category; output rate stays unchanged initially. This is a candidate, not activation authority or a net-margin guarantee.
  half_read_rate_savings:
    read_user_rate: 'existing_input_credit_rate * (1 - 0.5 * (1 - supplier_read_rate / supplier_input_rate))'
    write_user_rate: Same paid-write rate as the proportional policy.
    meaning: Leaves greater contribution per hit; saves approximately half as many credits on a warm request. This differs from passing half the supplier dollar saving.
  preserve_prior_absolute_contribution:
    formula: 'target_credits = ceil((actual_all_in_cost + previous_reference_contribution) / net_value_per_credit)'
    tradeoff: Smaller discounts; depends on actual funded credit value and a properly accounted uncached reference. Any service/contribution component must be published before dispatch, not hidden in a post-response floor.
  minimum_contribution:
    floor: 'ceil(max(all_in_cost / (1 - target_margin), all_in_cost + minimum_contribution) / conservative_net_value_per_credit)'
    how_to_publish: Calibrate fixed category rates plus a disclosed minimum charge or service component before activation. If a quoted tariff fails the cost bound, reject/limit future admission or publish a new version; never secretly change completed prices.
    inputs_needed: [net payment settlement by pack and region, FX stress bound, payment fees and taxes, auxiliary and retry cost, variable infrastructure, funded promotional credits, reserve, numerical margin and contribution targets]
  rounding: Preserve the existing floor-once plus one-credit minimum unless its contract is changed. Keep exact rational/decimal category amounts until aggregation; any required ceil margin floor is a separate disclosed policy and must not be silently introduced as a rounding change.
  google_explicit_write_with_retention: 'write_credit_rate_per_million = ordinary_input_credit_rate_per_million * (1 + storage_usd_per_million_hour * prepaid_hours / supplier_input_usd_per_million)'
  google_explicit_disclosure: One-time fill with its prepaid retention, then separate reads. Additional renewal requires another disclosed bounded storage purchase. Never bill ordinary input again for the same fill tokens.

