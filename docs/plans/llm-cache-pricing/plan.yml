goal: >-
  Double check for conflicts with pre, main and post processing, implement
  cache-aware pricing only with accurate provider usage, update the web model
  prices, compare user credits before and after, and verify real OpenMates CLI
  chats and their committed billing receipts. Ask when conflicts arise.
