risks:
  - id: R-1
    risk: Treating S3 as optional could permit provider work whose result cannot be persisted.
    mitigation: Central storage-required guard must run before provider work and charging, with an audit covering registered durable-output tasks.
  - id: R-2
    risk: A stale availability cache could reject work after recovery or allow work during an outage.
    mitigation: Use bounded probe freshness and still treat each provider operation result as authoritative; recovery probe clears incident state.
  - id: R-3
    risk: Optional health checks may be excluded from the existing incident engine.
    mitigation: Separate overall required-check pass/fail from transition evaluation over required and optional observable checks.
  - id: R-4
    risk: Broad BaseServiceTask changes could break tasks that legitimately require S3.
    mitigation: Introduce explicit/lazy storage initialization and focused representative job tests plus a deterministic capability audit.
  - id: R-5
    risk: Concurrent operational-monitoring work changes the shared CLI alert files.
    mitigation: Rebase onto the landed monitoring contract and implementation before editing shared files; never overwrite concurrent worktree changes.

