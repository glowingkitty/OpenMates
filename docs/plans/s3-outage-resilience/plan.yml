assumptions:
  - id: A-1
    text: Text AI execution does not require S3 when requests contain no files or storage-backed embed references.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/apps/ai/tasks/ask_skill_task.py
        summary: The ordinary ask task initializes SecretsManager, CacheService, EncryptionService, and DirectusService without S3UploadService.
  - id: A-2
    text: Existing host runtime monitoring can represent optional S3 degradation without making required core checks fail.
    category: reliability
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/scripts/runtime_health_verifier.py
        summary: CheckDefinition already carries required state and the final result fails only required checks.
      - source: frontend/packages/openmates-cli/src/serverHealth.ts
        summary: Existing incident state and independent channel delivery can be extended for optional storage transitions.
  - id: A-3
    text: Storage operations can expose a stable retryable error without revealing provider or object details.
    category: privacy
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/s3/service.py
        summary: S3 service methods already normalize missing initialization to HTTP errors and centralize provider exception handling.

contracts:
  api:
    changed_endpoints:
      - path: /health
        access_model: unauthenticated public REST API
        auth: none
        rate_limits: Existing 60 requests per minute limit on redirected /v1/health applies.
        credit_budget: zero
        encryption_boundary: No client-side encrypted data or decrypted plaintext is accepted or returned.
      - path: existing storage-dependent routes and WebSocket operations
        access_model: first-party client surface only or internal-only as currently classified
        auth: Existing session, device, owner/team, or internal-service authentication remains unchanged.
        rate_limits: Existing per-route and WebSocket limits remain unchanged.
        credit_budget: Provider work and charging are forbidden before confirmed storage availability when durable storage is required.
        encryption_boundary: Existing client-side encryption and ownership boundaries remain unchanged; failure payloads contain no object metadata.
    new_endpoints: []
    stable_error:
      status: 503
      code: storage_temporarily_unavailable
      retryable: true
  storage:
    startup_role: optional_degraded_dependency
    reconciliation: Must not block API liveness; failures remain observable and retryable.
    local_fallback: forbidden
    success_claim: Requires confirmed provider operation success.
  monitoring:
    check_id: core.object_storage
    required_for_core_liveness: false
    warning_after_consecutive_failures: 2
    critical_after_continuous_outage: 1h
    recovery_after_successes: 1
    channels: all_configured_host_owned
    digest: Include active degradation without private provider details.
  cli:
    commands: [openmates server monitoring run, openmates server monitoring status, openmates server monitoring digest]
    new_commands: []
  sdk:
    npm: Existing generic error propagation only; no new method.
    pip: Existing generic error propagation only; no new method.

privacy_security:
  - Never log or notify S3 credentials, signed URLs, bucket/object keys, filenames, user identifiers, content, ciphertext, or raw provider bodies.
  - Keep environment incident state and destinations isolated.
  - Do not weaken existing storage route authentication, ownership, encryption, or rate limits.
  - Do not start paid provider work when durable output cannot be stored.
  - Do not delete authoritative source data until required storage operations are confirmed.

