implementation_notes:
  plan_path: docs/plans/s3-outage-resilience/plan.yml
  status: approved
  specification_refs:
    - architecture.storage-resilience@1:ea241c299958673f921ef157aec4d96c4661ed1bafa6b64a7630b6fee78ca9fd
  affected_assertions:
    - storage-resilience.core.s3-is-noncritical
    - storage-resilience.operations.fail-before-cost
    - storage-resilience.jobs.preserve-and-retry
    - storage-resilience.monitoring.transition-alerts
    - storage-resilience.monitoring.not-configured
    - storage-resilience.content.privacy-boundary
  contract_change: new_specification
  surface_proof:
    rest_api: V-DEV-S3-OUTAGE proves public liveness and first-party text AI while storage is unavailable.
    cli: V-DEV-S3-ALERT-DRILL proves host-owned warning, escalation, all-channel delivery, and recovery state.
    sdks: Existing npm and pip generic errors are unchanged; the stable backend code is covered by API proof and parity audit if generated clients change.
    gui: Not affected.
  documentation_impact:
    - Generated contract indexes.
    - Server management operator guidance.
    - Health-check and server architecture semantics.
  existing_patterns:
    - S3UploadService centralizes client setup and object operations.
    - Runtime health already separates required checks from persisted incident and delivery state.
  architecture: >
    Separate storage client configuration and availability from remote reconciliation,
    add a shared preflight guard for durable-output operations, and feed an optional
    object-storage check into host-owned incident delivery without changing core liveness.
  first_slice: Write focused red backend and CLI tests for startup isolation, fail-before-cost, optional health, alert escalation, and recovery.
  data_flow:
    - API loads configured credentials and local S3 client metadata, records unavailable if remote reconciliation returns 503, and completes startup so GET /health returns 200.
    - A text-only ai.ask request bypasses the storage guard and proceeds through Vault, Redis, Directus, and the selected LLM provider without touching S3.
    - A generated image request invokes the shared durable-storage guard before provider execution; unavailable storage returns HTTP 503 with code storage_temporarily_unavailable and retryable true before charging.
    - Archive and deletion jobs leave source rows or pending intent unchanged when an S3 operation fails and let bounded task retry policy retain the operation.
    - Runtime verifier probes one configured bucket with a bounded non-mutating request and emits core.object_storage as passed, failed/storage_unavailable, or skipped/not_configured.
    - Host CLI evaluates both required and observable optional checks, opens a warning on failure two, escalates once at one hour, includes active state in the next digest, and resolves on the first success.
  boundaries:
    - No new endpoint, authentication scope, local durable fallback, provider failover, browser UI, or Apple UI.
  affected_files:
    - {path: backend/core/api/app/services/s3/service.py, reason: Separate non-blocking configuration, availability, and reconciliation behavior.}
    - {path: backend/core/api/main.py, reason: Make S3 optional during API lifespan startup.}
    - {path: backend/core/api/app/tasks/base_task.py, reason: Remove unconditional storage initialization.}
    - {path: backend/scripts/runtime_health_verifier.py, reason: Add optional bounded core.object_storage check.}
    - {path: frontend/packages/openmates-cli/src/serverHealth.ts, reason: Evaluate optional storage transitions and one-hour escalation.}
    - {path: frontend/packages/openmates-cli/src/server.ts, reason: Persist and deliver optional storage incidents.}
    - {path: scripts/audit_s3_outage_resilience.py, reason: Prevent renewed startup and cost coupling.}
  migrations: [None.]
  observability:
    - Stable core.object_storage check ID, sanitized availability state, warning/escalation/recovery timestamps, and per-channel delivery state.
  assumptions_checked: [A-1, A-2, A-3]
  verification_strategy:
    - Run focused red backend startup, storage guard, background job, runtime verifier, and CLI alert tests before product code.
    - Run focused green tests and the deterministic storage-resilience audit after each implementation slice.
    - Rebuild/restart the API and affected workers, then prove /health and text AI against the dev API while the controlled S3 probe is unavailable.
    - Run the host-owned warning, one-hour escalation, all-channel delivery, and recovery drill with sanitized receipts.
  verification_order:
    - T-BACKEND-S3-RESILIENCE
    - T-BACKEND-S3-JOBS
    - T-RUNTIME-STORAGE-CHECK
    - T-STORAGE-GATE-AUDIT
    - V-DEV-S3-OUTAGE
    - T-CLI-STORAGE-ALERTS
    - V-DEV-S3-ALERT-DRILL
  acceptance_coverage:
    AC-1: [T-BACKEND-S3-RESILIENCE, V-DEV-S3-OUTAGE]
    AC-2: [T-BACKEND-S3-RESILIENCE, T-STORAGE-GATE-AUDIT, V-DEV-S3-OUTAGE]
    AC-3: [T-BACKEND-S3-JOBS, T-STORAGE-GATE-AUDIT]
    AC-4: [T-RUNTIME-STORAGE-CHECK, T-CLI-STORAGE-ALERTS, V-DEV-S3-ALERT-DRILL]
    AC-5: [T-RUNTIME-STORAGE-CHECK, T-CLI-STORAGE-ALERTS]
    AC-6: [T-CLI-STORAGE-ALERTS, T-STORAGE-GATE-AUDIT, V-DEV-S3-ALERT-DRILL]
  rollout:
    - Land contract, tests, backend isolation, and monitoring code together on dev.
    - Restart/rebuild only api and affected workers through openmates server restart under the Docker lock.
    - Run controlled dev outage and recovery drills before considering production rollout.
    - Production deployment remains separately approved and out of scope.
  material_plan_approval:
    required: false
    reason: All material dependency, cost, data-integrity, privacy, alert, and rollout decisions are already in the explicitly approved product contract.

