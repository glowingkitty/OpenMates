  - {id: D-2, status: active, decision: Storage-required work fails before provider execution or charging with no local fallback., reason: This prevents cost without durable output and avoids inconsistent encrypted persistence., decided_at: "2026-08-25T00:00:00Z"}
  - {id: D-3, status: active, decision: Reuse host-owned runtime monitoring with two-failure warning, one-hour escalation, and one-success recovery., reason: The existing path is independent, environment-isolated, retrying, and low-noise., decided_at: "2026-08-25T00:00:00Z"}

