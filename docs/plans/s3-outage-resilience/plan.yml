goal: >
  Keep OpenMates API ingress, text AI, and non-storage app skills operational
  during temporary S3-compatible object-storage outages, fail storage-dependent
  work safely before cost, preserve durable retry intent, and notify server
  administrators through the existing host-owned monitoring channels.

scope:
  in:
    - Decouple API startup and liveness from remote bucket, ACL, lifecycle, and CORS reconciliation.
    - Expose bounded storage availability to existing internal health and runtime-monitoring code.
    - Keep text-only AI and non-storage skill dispatch independent of S3 initialization.
    - Return the stable retryable storage_temporarily_unavailable error before paid provider work or credit charging when durable storage is required.
    - Remove unconditional S3 initialization from shared task setup for tasks that do not use storage.
    - Preserve authoritative records and pending intent when archive, deletion, or cleanup jobs encounter storage downtime.
    - Add an optional core.object_storage runtime check without making required core health fail.
    - Notify all configured host-owned channels after two failed probes, escalate once after one hour, include degradation in the digest, and notify once on recovery.
    - Apply environment-isolated behavior to development, production, and configured self-hosted installations.
  out:
    - A second object-storage provider or cross-provider replication.
    - Local-disk fallback for durable user files or generated media.
    - New public API routes, CLI commands, SDK methods, browser UI, or Apple UI.
    - Production deployment or production configuration changes without separate approval.
    - Rewriting every storage-backed feature; this slice establishes the shared gate and migrates representative high-risk paths with a deterministic audit for remaining direct calls.

context_discovery:
  github_issues:
    - gh issue search returned no matching S3 outage-resilience issue.
  docs:
    - docs/architecture/infrastructure/health-checks.md
    - docs/architecture/infrastructure/file-upload-pipeline.md
    - docs/plans/operational-monitoring-digest-alerts/plan.yml
    - docs/plans/post-update-runtime-health-alerting/plan.yml
  contracts:
    - architecture.storage-resilience@1 approved in session cb27 with fingerprint ea241c299958673f921ef157aec4d96c4661ed1bafa6b64a7630b6fee78ca9fd.
    - architecture.operational-monitoring supplies the existing independent delivery, environment isolation, privacy, and recovery infrastructure reused by implementation.
  code_patterns:
    - backend/core/api/main.py currently awaits S3UploadService.initialize during FastAPI lifespan startup.
    - backend/core/api/app/services/s3/service.py currently performs remote bucket and CORS reconciliation inside initialize and propagates CORS failure.
    - backend/core/api/app/tasks/base_task.py currently initializes S3 for every BaseServiceTask regardless of task capability.
    - backend/apps/ai/tasks/ask_skill_task.py initializes Vault, cache, encryption, and Directus but does not initialize S3 for ordinary AI asks.
    - backend/scripts/runtime_health_verifier.py and frontend/packages/openmates-cli/src/serverHealth.ts already provide provider-free checks, persisted incident state, deduplication, recovery, and independent delivery.
  tests:
    - backend/tests/test_s3_service_no_sync_boto3_in_async.py
    - backend/tests/test_runtime_health_verifier.py
    - backend/tests/test_task_smoke.py
    - frontend/packages/openmates-cli/tests/server.test.ts
    - scripts/audit_runtime_health_contract.py
  live_findings:
    - On 2026-08-25 Hetzner returned repeated 503 responses for HeadBucket and CORS operations.
    - Those failures escaped FastAPI lifespan startup, Uvicorn exited repeatedly, and Caddy returned 502 because no API upstream remained.
    - Existing workers also showed unrelated workflow and email tasks failing because BaseServiceTask initialized S3 unconditionally.

clarification:
  rounds:
    - question: Which operator channels and transition policy should S3 use?
      answer: Send one outage and one recovery event through every configured host-owned channel; keep ongoing degradation in the daily digest.
    - question: How should storage-dependent work behave while S3 is down?
      answer: Fail before provider work or charging with a retryable storage_temporarily_unavailable error; do not use local persistence.
    - question: What thresholds should alerts use?
      answer: Warn after two failed probes, escalate once after one continuous hour, and resolve after one successful probe.
    - question: Which deployments are covered?
      answer: Development, production, and self-hosted deployments with configured S3; intentionally unconfigured storage reports not_configured without a false outage.
  vision_summary: >
    Core OpenMates remains usable without object storage, while storage-backed
    features fail explicitly and safely. Operators receive low-noise, independent,
    environment-isolated warning, escalation, digest, and recovery information.
  approved_by_user: true

