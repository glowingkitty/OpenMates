scenarios:
  - id: S-1
    title: API and text AI start while S3 returns 503
    given:
      - S3 credentials are configured.
      - Bucket and CORS requests return 503 or timeout.
    when:
      - The API starts and a text-only AI request is submitted.
    then:
      - FastAPI completes startup and /health responds through Caddy.
      - Storage reports unavailable without changing core liveness to failed.
      - The text AI request reaches inference without an S3 access attempt.

  - id: S-2
    title: Storage-dependent work fails before cost
    given: [Storage is currently unavailable.]
    when:
      - A user starts an upload, generated-media request, or existing stored-file read.
    then:
      - The operation returns storage_temporarily_unavailable with retryable true.
      - Paid provider work and credit charging do not begin where durable output storage is required.
      - Existing object metadata remains intact.

  - id: S-3
    title: Background work preserves authoritative state
    given: [An archive, deletion, or cleanup task requires S3 and storage is unavailable.]
    when: [The task executes.]
    then:
      - Source rows and pending intent remain durable.
      - No destructive source cleanup is reported as successful.
      - The task follows a bounded durable retry path after recovery.

  - id: S-4
    title: Configured server emits warning escalation and recovery
    given:
      - S3 is configured.
      - At least one host-owned operator destination is configured.
    when:
      - Two probes fail, the outage lasts one hour, and a later probe succeeds.
    then:
      - Exactly one warning, one critical escalation, and one resolved event are delivered through all configured channels.
      - Daily digests report the active degradation.
      - Incident state and destinations remain isolated by environment.

  - id: S-5
    title: Intentionally unconfigured storage does not create an outage
    given: [A self-hosted installation intentionally has no S3 configuration.]
    when: [Runtime monitoring executes.]
    then:
      - Storage reports not_configured and storage-backed features remain unavailable.
      - No provider-outage warning, escalation, or recovery incident is created.

