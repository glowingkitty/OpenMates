assumptions:
  - id: A-1
    text: Raw usage rows remain the authoritative billing record for unarchived periods.
    category: billing
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/directus/usage.py
        summary: Detail methods query the `usage` collection and decrypt raw usage entries; summary rows are fast aggregate helpers.
  - id: A-2
    text: Legacy summary identifiers are cleartext fields suitable for indexes but not personally identifying without user context.
    category: privacy
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/directus/schemas/usage_daily_chat_summaries.yml
        summary: Daily summaries store user_id_hash, date, identifier, total_credits, and entry_count.
      - source: backend/core/directus/schemas/usage_monthly_chat_summaries.yml
        summary: Monthly summaries store user_id_hash, year_month, identifier, total_credits, entry_count, and archive metadata.

contracts:
  api:
    - route: GET /v1/settings/usage/daily-overview
      access_model: first-party client surface and approved API-key SDK billing-read surface
      auth: session cookie or API key accepted by existing get_current_user_or_api_key dependency
      rate_limit: existing 30/minute route limit unchanged
      credit_budget: no new credit charge or billing budget consumption
      encryption_boundary: returns cleartext aggregate credits/counts and encrypted chat metadata already present today; does not return decrypted chat titles or API key labels
      response_requirement: one item per date/type/identifier after coalescing duplicates
    - route: GET /v1/settings/usage/summaries
      access_model: first-party client surface and approved API-key SDK billing-read surface
      auth: session cookie or API key accepted by existing get_current_user_or_api_key dependency
      rate_limit: existing 30/minute route limit unchanged
      credit_budget: no new credit charge or billing budget consumption
      encryption_boundary: returns cleartext aggregate credits/counts and cleartext identifier buckets as today; no decrypted sensitive fields are introduced
      response_requirement: one summary per user/type/identifier/year_month after coalescing duplicates
    - route: GET /v1/settings/usage/details
      access_model: first-party client surface and approved API-key SDK billing-read surface
      auth: session cookie or API key accepted by existing get_current_user_or_api_key dependency
      rate_limit: existing 30/minute route limit unchanged
      credit_budget: no new credit charge or billing budget consumption
      encryption_boundary: decrypts raw usage fields only for the authenticated owner as today
      response_requirement: archive lookup is deterministic if duplicate monthly summary rows existed before repair
    - route: GET /v1/settings/usage/chat-total
      access_model: first-party client surface
      auth: existing authenticated settings route behavior
      rate_limit: existing route limit unchanged
      credit_budget: no new credit charge or billing budget consumption
      encryption_boundary: returns an aggregate cleartext credit count only
      response_requirement: duplicate monthly chat rows do not create duplicate visible chat totals after repair
  data:
    - summary_identity:
        usage_daily_chat_summaries: [user_id_hash, chat_id, date]
        usage_daily_app_summaries: [user_id_hash, app_id, date]
        usage_daily_api_key_summaries: [user_id_hash, api_key_hash, date]
        usage_monthly_chat_summaries: [user_id_hash, chat_id, year_month]
        usage_monthly_app_summaries: [user_id_hash, app_id, year_month]
        usage_monthly_api_key_summaries: [user_id_hash, api_key_hash, year_month]
    - Schema SQL repair merges duplicate helper totals and counts because raw usage credits are encrypted outside the migration boundary.
    - Archived repair preserves is_archived/archive_s3_key metadata and must not delete the only archive reference for a month.
    - Malformed summary rows with null or empty identifiers are reported and excluded from user-facing totals until a separate manual cleanup decision is made.
    - Unique indexes must be created only after duplicate repair has reduced valid identities to one row per key.
  ui_states:
    - Settings usage overview shows one row per chat/API-key/device identity per date.
    - Existing drilldown loading, empty, error, and deleted-chat states remain unchanged.
    - If repair reports malformed rows, users still see valid usage data without an unnamed duplicate bucket.
  privacy_security:
    - No raw usage rows are deleted or repriced.
    - No decrypted model names, provider names, token totals, chat titles, API key labels, or raw private identifiers are logged during repair.
    - Repair diagnostics may report counts by table and environment using placeholders, not private user IDs or chat IDs.
    - Cross-user grouping is forbidden; user_id_hash is mandatory in every dedupe query, coalescing key, and unique index.

