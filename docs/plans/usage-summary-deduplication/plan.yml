schema_version: 2
id: usage-summary-deduplication
title: Usage Summary Deduplication And Repair
status: implementing

goal: >
  Ensure legacy usage summary tables never make billing usage look duplicated or
  nonsensical by coalescing duplicate rows in read paths, repairing existing
  duplicate summary rows from authoritative usage data where possible, and
  enforcing race-safe unique summary identities for future writes without
  changing raw usage charges.

scope:
  in:
    - Read-side coalescing for daily overview, monthly summaries, chat total credits, and usage detail archive lookups that consume legacy summary tables.
    - Race-safe creation/update of daily and monthly summary rows keyed by user_id_hash, identifier, and period.
    - Directus migration repair for duplicate rows in usage_daily_*_summaries and usage_monthly_*_summaries.
    - Unique indexes for each concrete legacy summary identity after duplicate repair succeeds.
    - Existing duplicate repair in dev/prod that preserves raw usage charges and avoids deleting authoritative usage rows.
    - Regression tests for duplicate identity grouping, cross-user isolation, malformed/null identifiers, and migration/index verification.
    - REST, CLI, npm SDK, pip SDK, web, user-confirmation, and Apple-impact verification for the shared billing usage surface.
  out:
    - Repricing, deleting, or recalculating authoritative raw usage rows.
     - Reworking the encrypted usage_period_rollups architecture from docs/plans/usage-overview-rollups/plan.yml.
    - Adding new billing usage endpoints or changing public API route names.
    - Changing existing rate limits, billing credit budgets, or API-key permission semantics beyond preserving the current billing-read surface.
    - Storing decrypted model names, provider names, token totals, chat titles, or API key labels in cleartext summary tables.
    - Team billing summary repair unless a later team-billing spec explicitly extends this contract.

context_discovery:
  github_issues:
    - GitHub MCP `get_me` returned 401 Bad credentials, so authenticated tracker search could not be completed.
    - Firecrawl scoped GitHub issue search found no public matching issue for OpenMates usage summary duplicates.
  docs:
    - docs/contributing/guides/spec-driven-development.md
     - docs/plans/usage-overview-rollups/plan.yml
    - docs/plans/apple-settings-billing-parity/plan.yml
    - docs/user-guide/billing/usage.md
    - docs/user-guide/cli/settings.md
  code_patterns:
    - backend/core/api/app/services/directus/usage.py `_update_summary` and `_update_daily_summary` currently do read-then-create with `limit: 1`.
    - backend/core/api/app/services/directus/usage.py `get_daily_overview` appends every daily summary row as a separate item and sums every row into day totals.
    - backend/core/api/app/services/directus/usage.py `get_monthly_summaries` returns every monthly summary row and caches the uncoalesced result.
    - backend/core/api/app/services/directus/usage.py `get_usage_entries_for_summary` checks one matching monthly summary row to decide archived behavior.
    - backend/core/api/app/services/directus/usage.py `get_chat_total_credits` sums all matching monthly chat rows.
    - backend/core/directus/setup/migrate_usage_overview_indexes.sql currently adds non-unique legacy summary lookup indexes.
    - backend/core/directus/setup/setup_schemas.py verifies usage overview migration indexes through `USAGE_OVERVIEW_INDEXES`.
    - backend/core/api/app/routes/settings.py exposes `/v1/settings/usage/summaries`, `/usage/details`, `/usage/daily-overview`, `/usage/chat-total`, and `/usage/overview` to session or API-key callers.
    - backend/core/api/app/routes/usage_api.py re-exports the usage endpoints for OpenAPI visibility.
    - backend/core/api/app/routes/sdk.py forwards SDK billing usage paths to the settings route handlers.
    - frontend/packages/ui/src/components/settings/SettingsUsage.svelte renders usage overview and drilldown data from those endpoints.
  tests:
    - backend/tests/test_usage_entries.py
    - backend/tests/test_usage_overview_rollups.py
    - backend/tests/test_setup_schemas.py
    - frontend/apps/web_app/tests/usage-token-breakdown.spec.ts
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/packages/openmates-cli/tests/sdk.test.ts
    - packages/openmates-python/tests/test_sdk.py
    - scripts/verify_usage_overview_cli_sdk.py
  observed_data:
    - A production report for `<PROD_CHAT_ID>` showed raw usage rows were present and limited, while summary-derived overview output looked duplicated/nonsensical.
    - A local dev duplicate query using the full identity found duplicate groups in daily_chat, monthly_chat, daily_app, and no duplicate groups in daily_api_key.
    - A prior duplicate query that omitted user_id_hash overcounted shared identifiers such as `incognito` and was rejected.

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Settings/**
    - apple/OpenMatesTests/SettingsBillingParityTests.swift
    - apple/OpenMatesUITests/SettingsBillingStoreKitParityUITests.swift
  parity_expectations:
    - Apple settings billing parity already depends on the shared billing usage API surface.
    - The backend/API fix should make Apple usage summaries no more duplicated than web/CLI/SDK without requiring native UI code changes for this slice.
    - Apple verification is still required or must record a sanitized remote-Mac failure/waiver because billing settings have a native counterpart.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios or targeted Settings billing usage test after REST, CLI, SDK, web, and user-confirmation gates.
  intentional_native_differences:
    - Native rendering can differ from web as long as duplicate summary rows are not shown and totals match the shared API contract.

clarification:
  rounds:
    - question: Should the spec include repairing existing duplicate summary rows in prod/dev, or only prevent future duplicates and coalesce reads?
      answer: >
        Full repair: prevent future duplicates, coalesce reads immediately, and
        add an explicit safe migration/repair path for existing duplicate summary
        rows.
  vision_summary: >
    The user wants the complete repair path, not only future prevention. Legacy
    summary tables should stop producing duplicate/nonsensical usage displays
    immediately through read coalescing, then existing duplicate rows should be
    repaired safely before unique identities prevent the race from returning.
  approved_by_user: true

