decisions:
  - id: D-1
    status: active
    decision: Create a focused usage-summary-deduplication spec instead of editing the already-approved usage-overview-rollups spec.
    reason: The broad rollups spec covers a newer encrypted rollup layer, while this repair targets existing legacy summary tables and current user-visible duplicate behavior.
    decided_at: "2026-07-29T00:00:00Z"
  - id: D-2
    status: active
    decision: Use the full summary identity of user_id_hash, identifier, and period for duplicate detection and unique indexes.
    reason: Identifier values such as `incognito`, app IDs, and API-key/device buckets can repeat across users; omitting user_id_hash overcounts and can merge unrelated users.
    decided_at: "2026-07-29T00:00:00Z"
  - id: D-3
    status: active
    decision: Read paths must coalesce duplicates before the database migration is deployed.
    reason: Read coalescing removes the immediate user-visible duplicate display and makes the application tolerant during a rolling deploy or before all environments are repaired.
    decided_at: "2026-07-29T00:00:00Z"
  - id: D-4
    status: active
    decision: Existing duplicate summaries should merge conservatively in schema SQL; exact raw-row recompute is out of the migration because raw credits are encrypted with user vault keys.
    reason: Raw usage rows are authoritative, but the migration does not have a safe user-vault decryption boundary and usage rows do not store vault key IDs.
    decided_at: "2026-07-29T00:00:00Z"
  - id: D-5
    status: active
    decision: Defer any exact encrypted raw-usage audit to a separate encryption-aware repair job if merged summaries still disagree with raw details.
    reason: This fix can safely remove duplicate helper rows and prevent future races without touching raw charges or introducing privileged decryption into Directus schema setup.
    decided_at: "2026-07-29T12:46:04Z"

