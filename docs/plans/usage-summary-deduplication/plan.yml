implementation_notes:
  plan_path: docs/plans/usage-summary-deduplication/plan.yml
  existing_patterns:
    - backend/core/api/app/services/directus/usage.py for raw usage entry creation, summary writes, summary reads, and decryption.
    - backend/core/directus/setup/migrate_usage_overview_indexes.sql for usage-related migration SQL.
    - backend/core/directus/setup/setup_schemas.py for migration verification and required index names.
    - backend/core/api/app/routes/settings.py for authenticated billing usage routes.
    - backend/core/api/app/routes/sdk.py and backend/core/api/app/routes/usage_api.py for SDK/OpenAPI usage routing.
    - frontend/packages/ui/src/components/settings/SettingsUsage.svelte for web rendering of daily overview and summary data.
    - scripts/verify_usage_overview_cli_sdk.py for real dev-server CLI/SDK verification style.
  architecture: >
    Keep raw usage rows authoritative. Add small backend coalescing helpers for
    legacy summary reads, make summary write operations retry or upsert against a
    database-enforced full identity, and update the Directus migration so it
    repairs valid duplicate identities before creating unique indexes. Repair is
    scoped to summary helper rows; it must never delete or reprice raw usage.
  data_flow:
    - Billing writes the raw usage row exactly as before.
    - Summary update computes the daily and monthly full identity for chat, app, API key, or synthetic device buckets.
    - Summary update creates or updates exactly one summary row per full identity, retrying duplicate-key races as updates.
    - Summary read paths fetch legacy rows and coalesce by full identity before caching or returning data.
    - Migration repairs duplicate valid summary rows, reports malformed rows, and then creates unique indexes.
    - REST, CLI, SDK, web, and Apple surfaces consume the same deduplicated API behavior.
  affected_files:
    - path: backend/core/api/app/services/directus/usage.py
      reason: Summary write race fix plus read-side coalescing for daily/monthly summary consumers.
    - path: backend/core/directus/setup/migrate_usage_overview_indexes.sql
      reason: Existing duplicate summary repair and unique summary identity indexes.
    - path: backend/core/directus/setup/setup_schemas.py
      reason: Required index names and migration verification for new unique summary indexes.
    - path: backend/tests/test_usage_summary_deduplication.py
      reason: Read-side dedupe, cross-user isolation, and malformed-row regression tests.
    - path: backend/tests/test_usage_summary_write_race.py
      reason: Race-safe summary write regression tests.
    - path: backend/tests/test_setup_schemas.py
      reason: Migration/index verification tests.
    - path: scripts/verify_usage_overview_cli_sdk.py
      reason: Real dev-server CLI, npm SDK, and pip SDK proof.
    - path: frontend/apps/web_app/tests/usage-token-breakdown.spec.ts
      reason: Web Settings billing usage UI regression proof after deploy.
    - path: docs/user-guide/billing/usage.md
      reason: Document that summary totals are deduplicated helper data and raw usage rows remain authoritative if user-facing docs need clarification.
  verification_strategy:
    - Validate this spec before implementation.
    - Add backend red tests for summary read coalescing, write races, migration repair, and unique index verification.
    - Implement backend repair/coalescing/write changes and rerun focused pytest commands.
    - Restart the local api service if backend code changes are needed for dev-server proof.
    - Run real dev-server REST proof against https://api.dev.openmates.org before CLI or SDK proof.
    - Run real CLI proof against the dev server before npm/pip SDK proof.
    - Run npm SDK and pip SDK proof against the same dev server, then run parity audit if CLI/SDK surface code changes.
    - Deploy before Playwright green verification because Playwright runs against app.dev.openmates.org.
    - Ask user to confirm deployed web Settings usage behavior.
    - Run Apple remote status/build or record a sanitized failure/waiver last.
  verification_order:
    - Direct REST API contract against https://api.dev.openmates.org first, including auth/rate-limit/budget/encryption-boundary classification.
    - Real OpenMates CLI command against https://api.dev.openmates.org second.
    - npm SDK and pip SDK calls against https://api.dev.openmates.org third.
    - GitHub Actions or daily-test reproduction only after local REST, CLI, and SDK proof passes.
    - Web Playwright after deployment to app.dev.openmates.org.
    - User confirmation of deployed web Settings usage behavior.
    - Apple remote status/build/test or explicit waiver.

