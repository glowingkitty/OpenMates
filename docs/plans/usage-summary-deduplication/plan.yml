scenarios:
  - id: S-1
    title: Existing duplicate daily rows do not duplicate the overview
    given:
      - Alice has two `usage_daily_chat_summaries` rows with the same user_id_hash, chat_id, and date.
      - The matching raw usage rows are not duplicated.
    when:
      - Alice opens Settings > Usage or calls `/v1/settings/usage/daily-overview`.
    then:
      - The response has one chat item for that date/chat identity.
      - The item entry_count and total_credits are coalesced once for the identity.
      - The day total includes the coalesced identity once and does not display duplicate rows.

  - id: S-2
    title: Existing duplicate monthly rows do not duplicate summaries or drilldowns
    given:
      - Alice has duplicate `usage_monthly_chat_summaries`, `usage_monthly_app_summaries`, or `usage_monthly_api_key_summaries` rows for the same identity and month.
    when:
      - Alice requests monthly summaries through REST, CLI, npm SDK, or pip SDK.
      - Alice opens a usage detail drilldown for the affected identity/month.
    then:
      - The summaries response contains one row per user/identifier/month.
      - The detail endpoint still reads authoritative usage entries for the requested identifier/month.
      - Archive lookup behavior is deterministic if any duplicate monthly summary row is archived.

  - id: S-3
    title: Repair migration consolidates existing duplicate summaries
    given:
      - The database contains duplicate daily and monthly summary rows for the same full identity.
    when:
      - The Directus usage summary repair/index migration runs.
    then:
      - Duplicate rows are reduced to one canonical row per full identity.
      - Valid duplicate rows are merged by summing helper totals and counts.
      - Archived canonical rows preserve archive metadata and do not lose the only remaining archive reference.
      - The migration is idempotent and safe to rerun.

  - id: S-4
    title: Concurrent writes cannot create future duplicate summary rows
    given:
      - Two usage entries for the same user/identifier/period are created concurrently.
    when:
      - The billing usage service updates daily and monthly summaries.
    then:
      - At most one summary row exists for the full identity in each affected summary table.
      - Both usage entries are reflected in total_credits and entry_count.
      - A duplicate-key race is retried or converted into an update without failing raw usage creation.

  - id: S-5
    title: Duplicate detection never crosses user boundaries
    given:
      - Alice and Bob both have summaries with the same app_id, chat label, API-key/device identifier, or month/date.
    when:
      - Summaries are read, repaired, or indexed.
    then:
      - Alice and Bob remain separate because user_id_hash is part of every grouping key.
      - No user's summary totals are merged into another user's totals.

  - id: S-6
    title: Malformed summary rows do not contaminate valid totals
    given:
      - A summary table contains a row with a null or empty identifier field.
    when:
      - Usage summaries are read or repaired.
    then:
      - The malformed row is not merged into a valid identifier's totals.
      - User-facing overview and summary responses do not display an unnamed duplicate item.
      - The repair path reports malformed rows for follow-up without silently deleting raw usage evidence.

