implementation_notes:
  plan_path: docs/plans/usage-chat-total-reconciliation/plan.yml
  existing_patterns:
    - Raw usage rows are authoritative and projections are rebuildable.
    - The daily overview endpoint runs only when Usage settings requests it.
  architecture: >
    Keep the existing endpoint and UI, but let the browser Usage request opt into bounded,
    authenticated-user response reconciliation from authoritative raw rows.
  data_flow:
    - Opening Usage calls the existing authenticated daily overview endpoint.
    - The endpoint reconciles bounded recent summary projections from the user's raw usage rows.
    - The endpoint returns corrected daily chat totals to the existing UI.
  affected_files:
    - path: backend/core/api/app/services/directus/usage.py
      reason: User-scoped response reconciliation.
    - path: backend/core/api/app/routes/settings.py
      reason: Supply the authenticated user's vault key to lazy reconciliation.
    - path: backend/tests/test_usage_summary_write_race.py
      reason: Deterministic race and stale-summary regression coverage.
    - path: frontend/apps/web_app/tests/usage-token-breakdown.spec.ts
      reason: Deployed UI total reconciliation assertion.
  verification_strategy:
    - Run focused backend regression tests red and green through scripts/tests.py.
    - Deploy API and spec changes, then run usage-token-breakdown.spec.ts against the exact dev commit.
  verification_order:
    - Focused backend contract test.
    - Existing endpoint on the local dev API after API restart.
    - Deployed web Playwright spec.

