schema_version: 2
id: usage-chat-total-reconciliation
title: Usage Chat Total Reconciliation
status: implementing

specification_refs:
  - id: feature.billing
    role: primary
    fingerprint: 4e117abca429900b5223ae9be2231cd72607646e34d291c3f1079c5a43310336

specification_impact:
  classification: implementation_fix
  specification_update_required: false
  affected_assertions:
    - billing.surface.semantic-parity
  reason: Existing billing semantics require summary totals to match authoritative usage entries.

goal: >
  Fix incorrect per-chat credit totals in Usage by reconciling the signed-in user's
  recent response totals from authoritative raw usage only when that user opens Usage.

scope:
  in:
    - Reconcile recent per-chat daily overview response totals when Usage is opened.
    - Scope reads and writes to the authenticated user.
    - Aggregate descendant usage under its recorded root chat.
    - Verify overview totals equal the sum of chat detail entries on deployed dev.
  out:
    - Background or global migrations.
    - Changes to prices, balances, raw usage rows, or charge settlement.
    - New API routes or background/global projection writes.

clarification:
  rounds:
    - question: Should existing incorrect totals be repaired, or only future totals?
      answer: Repair existing totals, but only when the user opens Usage settings.
  vision_summary: >
    Usage performs bounded, user-scoped lazy repair; no global or background data update runs.
  approved_by_user: true

implementation_state:
  subject_commit: 713b7534b297a588a5b61e3f2cdd30686c86ff37

approvals:
  specification:
    status: approved
    approved_at: "2026-09-01T15:39:51+00:00"
    fingerprint: 4e117abca429900b5223ae9be2231cd72607646e34d291c3f1079c5a43310336
  plan:
    status: approved
    approved_at: "2026-09-04"
    reason: User approved the recommended lazy, Usage-open repair scope.

decisions:
  - id: D-1
    status: active
    decision: Reconcile only when the authenticated user opens Usage settings.
    reason: Repairs visible historical drift without a global migration or background scan.
    decided_at: "2026-09-04"

