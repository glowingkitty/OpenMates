contracts:
  api:
    - route: GET /v1/settings/usage/daily-overview
      access: Existing authenticated session or developer API-key REST surface
      auth: Existing session or approved API-key authentication; reconciliation is scoped by the authenticated user hash.
      rate_limit: Existing 30 requests per minute.
      credit_budget: Read-only request; no credits charged.
      encrypted_data: Raw encrypted credit values are decrypted server-side with the authenticated user's vault key for reconciliation and are not exposed beyond the existing response totals.
  data:
    - Raw usage rows remain authoritative; daily summary rows remain optional fast projections.

apple_impact:
  affected_files: [none]
  parity_expectations:
    - The existing shared backend endpoint returns corrected totals without native source changes.
  verification:
    - Shared backend contract only; Apple UI is not changed.
  intentional_native_differences: [none]

scenarios:
  - id: S-1
    title: Opening Usage repairs an undercounted chat summary
    given:
      - The authenticated user has multiple raw usage rows for one root chat.
      - Its daily summary is stale or undercounted.
    when:
      - The user opens Usage and the daily overview endpoint runs.
    then:
      - Only that user's recent summaries are reconciled.
      - The overview chat total equals the sum of its detail entries.

