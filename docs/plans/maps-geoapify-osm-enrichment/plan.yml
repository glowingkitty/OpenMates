implementation_notes:
  plan_path: docs/plans/maps-geoapify-osm-enrichment/plan.yml
  existing_patterns:
    - backend/apps/maps/skills/search_skill.py direct async app-skill execution and grouped request handling.
    - backend/shared/providers/google_maps/google_places.py Vault-backed provider module and normalized result formatting.
    - backend/core/api/app/services/cache_base.py simple JSON get/set cache helpers with TTL.
    - docs/plans/fitness-urban-sports-search/plan.yml provider-backed app-skill phase ladder and provider/legal updates.
    - frontend/apps/web_app/tests/skill-maps-search.spec.ts four-phase maps skill coverage across preview, CLI, CLI chat, and web chat.
  architecture: >
    Add a small Geoapify provider adapter under `backend/shared/providers`, wire it
    into `maps.search` after Google Places returns candidates, and normalize all
    OSM-backed fields into an `osm_enrichment` object. Matching should prefer
    cached Google-place-id to Geoapify-place-id mappings, otherwise use bounded
    Geoapify Places lookups around Google coordinates with name/address matching.
    Default enrichment uses the Places response only; strict amenity verification
    may follow with up to five Place Details requests. The skill remains direct
    async I/O-bound work and returns Google-only results with visible warnings
    when best-effort enrichment is not available.
  data_flow:
    - REST/CLI/SDK/web sends a `maps.search` request with optional `osmEnrichment` and `amenityFilters`.
    - Backend validates the existing request array and calls Google Places first.
    - Skill detects whether enrichment is disabled, best-effort, or required based on explicit request fields and parsed amenity needs.
    - Geoapify adapter checks demand cache for Google-to-Geoapify match and detail records.
    - Cache misses use one Geoapify Places request with supported filters/bias where possible, then up to five Geoapify Place Details requests only for strict amenity verification.
    - Skill merges only `osm_enrichment`, filter summaries, and warnings into the response while preserving Google result fields.
    - CLI/SDK/web/Apple consume the same canonical response without provider secrets or raw oversized payloads.
  affected_files:
    - path: docs/plans/maps-geoapify-osm-enrichment/plan.yml
      reason: Product contract, task ledger, and verification evidence.
    - path: backend/providers/geoapify.yml
      reason: Provider metadata, API key, privacy policy, pricing, and rate-limit contract.
    - path: backend/apps/maps/app.yml
      reason: Maps skill provider metadata and request schema update.
    - path: backend/apps/maps/skills/search_skill.py
      reason: Integrate enrichment and filtering after Google Places search.
    - path: backend/shared/providers/geoapify/
      reason: Geoapify Places/Place Details adapter, normalization, cache key helpers, and health/error handling.
    - path: backend/tests/test_geoapify_places_provider.py
      reason: Provider normalization, cache, timeout, and unsupported-condition coverage.
    - path: backend/tests/test_maps_geoapify_enrichment.py
      reason: Maps skill request/response, filtering, fallback, and field-preservation tests.
    - path: scripts/maps_geoapify_live_smoke.py
      reason: Direct dev-server REST/API smoke with real auth and no mocked API path.
    - path: scripts/audit_app_provider_contracts.py
      reason: Extend deterministic provider/legal sync checks if the current audit does not cover non-training provider legal disclosures.
    - path: frontend/packages/openmates-cli/tests/cli.test.ts
      reason: CLI request-schema coverage if direct flags or examples are added.
    - path: frontend/packages/openmates-cli/tests/sdk.test.ts
      reason: npm SDK parity if generated or facade behavior changes.
    - path: packages/openmates-python/tests/test_sdk.py
      reason: pip SDK parity if generated or facade behavior changes.
    - path: frontend/apps/web_app/tests/skill-maps-search.spec.ts
      reason: Deployed web and CLI E2E coverage for enriched maps results.
    - path: frontend/packages/ui/src/components/embeds/maps/MapsSearchEmbedPreview.svelte
      reason: Optional source/warning/result summary display.
    - path: frontend/packages/ui/src/components/embeds/maps/MapsSearchEmbedFullscreen.svelte
      reason: Optional enriched field and no-verified-results rendering in result list.
    - path: frontend/packages/ui/src/components/embeds/maps/MapLocationEmbedFullscreen.svelte
      reason: Optional child place detail display for enrichment fields and source labels.
    - path: shared/docs/privacy_policy.yml
      reason: Canonical privacy policy source for Geoapify provider disclosure.
    - path: frontend/packages/ui/src/i18n/sources/legal/privacy.yml
      reason: User-facing legal provider disclosure translations.
