  verification_strategy:
    - python3 scripts/plan_validate.py docs/plans/maps-geoapify-osm-enrichment/plan.yml
    - Write provider and maps-skill pytest coverage before implementation and record red evidence.
    - Restart affected Docker services after backend changes before probing `https://api.dev.openmates.org`.
    - Prove direct REST/API against the real dev server before CLI, SDK, web, user confirmation, or Apple work.
    - Deploy before Playwright green verification because `skill-maps-search.spec.ts` runs against `app.dev.openmates.org`.
    - Run Apple remote status plus build/test only after web and user confirmation gates pass.
  verification_order:
    - Product contract approval for this spec.
    - Backend provider and maps skill tests in red phase.
    - Backend implementation and provider/legal metadata updates.
    - Direct REST/API dev-server smoke, including auth failure and enrichment/filter behavior.
