schema_version: 2
id: maps-geoapify-osm-enrichment
title: Maps Geoapify OSM Enrichment
status: implementing

goal: >
  Enrich `maps.search` results with low-latency, source-labelled OpenStreetMap
  attributes via Geoapify while keeping Google Places as the primary search,
  ranking, and business-data provider. Users should be able to ask for place
  amenities such as air conditioning, internet access, wheelchair access,
  seating, toilets, smoking, diet, and payment support without OpenMates
  silently treating missing OSM data as `false`.

scope:
  in:
    - Extend the existing `maps.search` skill contract instead of adding a new app or route.
    - Add Geoapify Places and Place Details as an OSM-backed enrichment provider with the API key stored server-side in Vault.
    - Keep Google Places first for name, address, coordinates, phone, website, business status, hours, rating, price, images, and default ranking.
    - Add source-labelled `osm_enrichment` metadata to place results with tri-state or provider-native values and explicit `unknown` when data is missing.
    - Support amenity-aware filtering for air conditioning, internet access, wheelchair access, toilets, outdoor seating, smoking, diet, and payment fields.
    - Use Geoapify-supported Places `conditions` prefilters only where documented and proven, then use Place Details plus post-filtering for unsupported conditions such as air conditioning.
    - Demand-cache Geoapify match and detail results in Dragonfly/Redis; do not preload a global OSM dataset.
    - Update provider metadata, privacy policy sources, legal link rendering, Maps user guide copy, CLI/SDK tests, web renderers, and Apple parity evidence as needed.
  out:
    - Replacing Google Places ranking or core business fields with Geoapify data.
    - Self-hosting planet-scale OSM, PostGIS, Overpass, Pelias, Photon, or Nominatim for this first slice.
    - Calling public Overpass instances in production.
    - Claiming complete or authoritative amenity coverage when OSM/Geoapify data is absent.
    - Storing user identifiers, chat IDs, provider API keys, or raw long provider responses in enrichment cache entries or embeds.
    - Adding place booking, reservations, reviews beyond existing Google review support, or user account linking with Geoapify or OSM.

context_discovery:
  github_issues:
    - "GitHub MCP `get_me` previously returned 401 Bad credentials. Fallback `gh issue list --repo glowingkitty/OpenMates --search \"maps OpenStreetMap OR OSM OR air_conditioning\" --limit 10` returned no matching output."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/user-guide/apps/maps.md
    - docs/plans/fitness-urban-sports-search/plan.yml
    - docs/plans/models3d-search/plan.yml
    - docs/architecture/frontend/data-driven-embed-fullscreen-routing.md
  code_patterns:
    - backend/apps/maps/skills/search_skill.py returns grouped Google Places `place_result` dictionaries and runs direct async I/O-bound skill calls.
    - backend/shared/providers/google_maps/google_places.py retrieves the Google Maps API key from Vault and formats Google Places Text Search results.
    - backend/providers/google_maps.yml defines provider metadata, required Vault key, rate limits, and user-facing credit pricing for the current Maps provider.
    - backend/apps/maps/app.yml declares the existing `maps.search` tool schema and app-skill-use parent/`maps-place` child embed metadata.
    - frontend/packages/ui/src/components/embeds/maps/MapsSearchEmbedPreview.svelte renders the search parent provider/result count.
    - frontend/packages/ui/src/components/embeds/maps/MapsSearchEmbedFullscreen.svelte and MapLocationEmbedFullscreen.svelte render maps result lists, per-place details, OpenStreetMap map links, and Google Maps CTA.
    - shared/docs/privacy_policy.yml, frontend/packages/ui/src/i18n/sources/legal/privacy.yml, frontend/packages/ui/src/config/links.ts, and frontend/packages/ui/src/legal/buildLegalContent.ts are the legal/provider disclosure surfaces.
    - scripts/audit_app_provider_contracts.py audits provider/app metadata and can require specific provider IDs.
    - apple/OpenMates/Sources/Features/Embeds/Renderers/AppSkillUseRenderer.swift renders generic app-skill parent previews and has specialized provider-result renderers for some apps.
    - scripts/apple_ui_contracts.py maps `maps-place` to the maps-search fixture for Apple embed parity coverage.
  tests:
    - frontend/apps/web_app/tests/skill-maps-search.spec.ts covers maps/search embed preview, CLI direct skill command, CLI chat trigger, and web chat trigger.
    - backend/tests/test_rest_api_media.py has a live integration test for `/v1/apps/maps/skills/search` basic Google result shape.
    - backend/tests/test_app_skills.py has older app-container integration coverage for maps/search single and multi-request shapes.
    - backend/tests/test_apple_ui_contracts.py checks generated embed registry/native fixture contracts.
  external_research:
    - "Geoapify official Places docs at https://apidocs.geoapify.com/docs/places/ state the Places API uses OpenStreetMap as a data source and says results can be cached/stored with no limits."
    - "Geoapify Places docs expose endpoint `/places` with parameters including `categories`, `filter`, `bias`, `conditions`, and `limit`; docs mention conditions such as wheelchair access and internet availability."
    - "Geoapify Place Details docs at https://apidocs.geoapify.com/docs/place-details/ expose `/v2/place-details`, with `id` from Places/Geocoding or `lat`/`lon`, and details including facilities, catering, contact, payment, wheelchair, internet_access, toilets, smoking, and air_conditioning."
    - "Geoapify official pricing states the free plan includes 3,000 credits per day, about 90,000 credits per month. Places API costs 1 credit for `limit <= 20`; Place Details `features=details` costs 1 credit per place."
    - "Live dev-container probes confirmed Vault secret `kv/data/providers/geoapify` key `api_key` is present after importing `SECRET__GEOAPIFY__API_KEY`."
    - "Live Geoapify probes returned 200 for `conditions=internet_access.free` and `conditions=wheelchair`, but 400 `Invalid parameters` for `conditions=air_conditioning` and `conditions=air_conditioning.yes`."
    - "A live 20-result Berlin restaurant Places scan cost 1 credit and returned top-level `facilities` on 20/20 results, `catering` on 15/20, `contact` on 10/20, `payment_options` on 4/20, raw `wheelchair` on 15/20, raw `outdoor_seating` on 12/20, raw `air_conditioning` on 2/20, raw `internet_access` on 1/20, and raw `toilets` on 2/20."
    - "A live AC-tagged restaurant probe confirmed Geoapify can expose `facilities.air_conditioning: true` when OSM has `air_conditioning=yes`, even though AC is not accepted as a Places `conditions` filter."
    - "Provider alternatives were considered: public Overpass was too slow/unreliable for production, Geofabrik hosted Overpass gives raw tags but is paid and higher latency, and a global self-hosted OSM/PostGIS dataset was estimated at tens to hundreds of GB."
    - "Geoapify privacy policy at https://www.geoapify.com/privacy-policy/ was reachable on 2026-07-30 and describes service/API data collection including request body, headers, IP address, and timestamps for access control, usage counting, troubleshooting, and performance."

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Embeds/Renderers/AppSkillUseRenderer.swift
    - apple/OpenMatesUITests/EmbedRenderingParityUITests.swift
    - scripts/apple_ui_contracts.py
  parity_expectations:
    - Apple must continue rendering maps search parent previews and maps-place child previews without generic JSON leakage or crashes when `osm_enrichment` fields are present.
    - If web exposes visible amenity badges or source labels in maps result cards, native rendering should either match them or record an intentional native difference after user web approval.
    - Apple verification starts only after REST/API, CLI, SDK, deployed web, and user confirmation gates are complete.
  verification:
    - Run `python3 scripts/apple_remote.py status` and then `python3 scripts/apple_remote.py build-ios`, or a targeted `test-ios` if a maps embed parity test is added.
  intentional_native_differences:
    - Native may continue to show a simpler generic maps search summary for the first slice if the enriched fields remain in expandable/detail metadata and web user confirmation accepts that native difference.

clarification:
  rounds:
    - question: Should this session continue with the spec gate or stop for more clarification first?
      answer: The user said to continue if there are next steps, or stop and ask for clarification only if unsure how to proceed.
    - question: How should missing OSM or Geoapify amenity data be represented?
      answer: Prior session context established that missing OSM/Geoapify fields mean `unknown`, not `false`.
    - question: Should the first implementation self-host a global OSM dataset?
      answer: Prior session context rejected global self-hosted OSM/PostGIS for now and selected an external API with demand caching.
    - question: Are the proposed credit/cap defaults acceptable after confirming Geoapify's free tier is 3,000 credits per day?
      answer: "The user confirmed the corrected daily credit model and approved the proposed approach: default 1 Places request per search group, strict filters capped at 5 Place Details calls, 1200 ms best-effort timeout, and 30-day positive / 7-day no-match cache TTLs."
  vision_summary: >
    `maps.search` should remain a Google Places-first search skill, then add
    Geoapify as a server-side, OSM-backed enrichment layer for amenities Google
    does not reliably expose. Enrichment must be visibly source-labelled,
    cache-backed, bounded by latency and provider cost, and privacy-disclosed.
    The approved first slice uses one Geoapify Places request per enriched search
    group by default, up to five Place Details calls only for strict amenity
    verification, and demand-cache TTLs that avoid repeated provider spend.
  approved_by_user: true

