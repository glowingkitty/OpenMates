decisions:
  - id: D-1
    status: active
    decision: Keep Google Places as the primary provider and add Geoapify only as an enrichment/matching layer.
    reason: Google already powers `maps.search` ranking and core business fields, while Geoapify supplies OSM detail fields that Google Places does not expose consistently.
    decided_at: "2026-07-30T14:10:00Z"
  - id: D-2
    status: active
    decision: Use demand caching only for Geoapify place matches and details.
    reason: Global OSM storage is too large for the current server and public Overpass is not production-safe for latency or rate limits.
    decided_at: "2026-07-30T14:10:00Z"
  - id: D-3
    status: active
    decision: Represent absent enrichment fields as `unknown`, never as `false`.
    reason: OSM/Geoapify omissions mean missing data, not proof that a place lacks the amenity.
    decided_at: "2026-07-30T14:10:00Z"
  - id: D-4
    status: active
    decision: Use Geoapify Places `conditions` prefilters only for documented/proven conditions, then post-filter Place Details for unsupported fields such as air conditioning.
    reason: Live probes showed `conditions=air_conditioning` is rejected by Geoapify while `internet_access.free` and `wheelchair` work.
    decided_at: "2026-07-30T14:10:00Z"
  - id: D-5
    status: active
    decision: Treat Geoapify's free allowance as 3,000 credits per day and cap the first slice to 1 Places credit by default plus at most 5 Place Details credits for strict amenity verification.
    reason: Official pricing and live probes show Places `limit <= 20` costs 1 credit and Place Details `features=details` costs 1 credit per place; the cap protects latency and spend while preserving useful AC/Wi-Fi/wheelchair verification.
    decided_at: "2026-07-30T14:35:00Z"

