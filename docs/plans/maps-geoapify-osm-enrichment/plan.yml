    text: Existing app-skill REST access for `/v1/apps/maps/skills/search` remains authenticated and is not an unauthenticated public endpoint.
    category: auth
    required_before: implementation
    status: confirmed
    evidence:
      - source: frontend/apps/web_app/tests/skill-maps-search.spec.ts
        summary: Existing CLI phase skips without `OPENMATES_TEST_ACCOUNT_API_KEY`, confirming test access uses authenticated/API-key state.

contracts:
  api:
    - route: POST /v1/apps/maps/skills/search
      access_model: first-party and developer API-key app-skill REST surface; not unauthenticated public; not internal-only
      auth: valid OpenMates session or API key, matching the existing app-skill endpoint behavior
      rate_limits: existing app-skill/provider rate limits plus a separate `geoapify` provider rate-limit key for enrichment calls
      credit_budget: keep existing Maps base pricing unless the approved implementation changes pricing; default enrichment uses at most 1 Geoapify Places credit per search group, and strict amenity verification may use up to 5 additional Place Details credits
      encryption_boundary: accepts plaintext search queries/location hints as an app-skill request; does not accept or return client-side encrypted chat/key/file material
      request: >
        `{ requests: [{ id?, query, pageSize?, languageCode?, locationBias?, includedType?, minRating?, openNow?, includeReviews?, priceLevels?, osmEnrichment?: 'auto' | 'disabled' | 'required', amenityFilters?: object }] }`
      response: >
        `{ results: [{ id, results: [{ ...existingGooglePlaceFields, osm_enrichment?: object }], warnings?, filter_summary? }], provider: 'Google Maps + Geoapify' | 'Google Maps', suggestions_follow_up_requests?, error? }`
      errors:
        - Missing `query` stays a per-request validation error.
        - Google Places failure still fails that request group as today.
        - Geoapify failures in best-effort mode return warnings/status while preserving Google results.
        - Geoapify failures in required-enrichment mode return a visible typed error or no-verified-results explanation instead of claiming matches.
  data:
    - "`osm_enrichment.provider` is `Geoapify`; `osm_enrichment.data_source` is `OpenStreetMap via Geoapify`."
    - "`osm_enrichment.status` is one of `matched`, `no_match`, `not_requested`, `timed_out`, `rate_limited`, `unavailable`, or `not_configured`."
    - "`osm_enrichment.match` stores Geoapify place id, match method, match confidence, and cache hit status when available."
    - "`osm_enrichment.fields` stores field records with `value`, `source`, and optional `raw_value`; missing fields use `value: unknown`."
    - "Amenity values include provider-native detail where useful, such as `internet_access: free`, `wheelchair: limited`, `smoking: outside`, or diet/payment keys."
    - Cache keys use provider/place identifiers, normalized coordinates, and stable field/schema versions, never user IDs, chat IDs, API keys, or raw prompts beyond normalized provider search text needed for matching.
  ui_states:
    - Search parent loading, finished with enriched results, finished with Google-only fallback warning, zero verified amenity matches, provider unavailable, and strict-filter no-verified-results.
    - Child place detail with visible source label or amenity detail where web chooses to render it, while existing Google Maps and OpenStreetMap CTAs remain functional.
  privacy_security:
    - Geoapify receives only server-side search/matching data needed for place enrichment and no OpenMates user identifiers.
    - Geoapify API keys stay server-side in Vault and are never serialized into embeds, SDK responses, frontend bundles, logs, screenshots, or Apple fixtures.
    - Provider failures and cache logs must redact request bodies to metadata-only summaries where possible.
    - Legal/provider disclosures must state that place queries, approximate coordinates/location bias, category/filter parameters, and provider place IDs may be sent to Geoapify when Maps search/enrichment is used.

