scenarios:
  - id: S-1
    title: Generic Maps search keeps Google quality and adds source-labelled enrichment
    given:
      - Alice asks for "cafes in Berlin Mitte" with no special amenity filter.
      - Google Places returns ranked results with names, addresses, coordinates, ratings, hours, phone, website, and photos.
    when:
      - "`maps.search` runs with default enrichment behavior."
    then:
      - Results remain in Google Places order unless an explicit amenity filter requires narrowing them.
      - Google-derived fields are preserved and not overwritten by Geoapify.
      - Each enriched result includes an `osm_enrichment` object with provider, data source, match status, cache status, and field-level source metadata.

  - id: S-2
    title: Amenity filters return verified matches or explain unknown coverage
    given:
      - Alice asks for "restaurants in Berlin with air conditioning, free Wi-Fi, and wheelchair access".
      - Geoapify supports prefiltering internet access and wheelchair access but not air conditioning.
    when:
      - "`maps.search` detects amenity requirements and enriches Google candidates through Geoapify Places plus Place Details."
    then:
      - Places shown as matching a required amenity have provider-backed `yes`, provider-native equivalent, or explicitly accepted values for that amenity.
      - "`unknown` amenity values are not described as matching the required amenity."
      - If few verified matches are available within the latency/detail budget, the response includes a visible warning or summary explaining the verified count and unknown coverage.

  - id: S-3
    title: Geoapify timeout or outage does not break Google-only search
    given:
      - Alice asks a normal Maps question that does not require OSM-only amenities.
      - Geoapify is slow, unavailable, rate limited, or missing an API key.
    when:
      - Google Places succeeds but Geoapify enrichment fails or exceeds the configured timeout.
    then:
      - "`maps.search` returns Google Places results instead of failing the whole request."
      - The response includes a warning or enrichment status such as `timed_out`, `rate_limited`, `unavailable`, or `not_configured`.
      - The system logs the provider failure without API keys, user identifiers, chat IDs, or raw long provider payloads.

  - id: S-4
    title: Required OSM-only filters fail visibly when they cannot be verified
    given:
      - Alice explicitly asks for places with a required field such as air conditioning.
      - Geoapify returns no matching details, only `unknown` values, or is unavailable.
    when:
      - The field cannot be verified from the bounded enrichment pass.
    then:
      - The assistant does not claim the returned places have the required amenity.
      - The result group either contains only verified matches or explains that no verified matches were found and suggests relaxing the filter.
      - Missing provider fields remain `unknown` in machine-readable data.

  - id: S-5
    title: Provider, privacy, cost, and cache boundaries are explicit
    given:
      - Geoapify is added as a new third-party location provider.
      - A user invokes `maps.search` with location text, coordinates, or amenity filters.
    when:
      - OpenMates sends a server-side request to Geoapify.
    then:
      - Geoapify receives only the search/matching data needed for the request, such as place query text, approximate coordinates, category/filter parameters, and provider place IDs, without OpenMates user identifiers.
      - Provider metadata, privacy policy source YAML, legal i18n source, legal renderer links, and Maps user guide disclose Geoapify use.
      - Cached enrichment data is demand-derived, TTL-bound, and stores no user IDs, chat IDs, API keys, or raw oversized provider responses.
      - The implementation uses explicit rate-limit, timeout, and detail-count caps so provider spend cannot grow with unbounded per-result detail calls.

  - id: S-6
    title: REST, CLI, SDK, web, user confirmation, and Apple parity stay aligned
    given:
      - Alice uses the same maps amenity search through REST/API, OpenMates CLI, npm SDK, pip SDK, and web chat.
    when:
      - The feature is implemented and deployed through the required phase ladder.
    then:
      - Each client can request enrichment/filtering through the same canonical schema and receives the same canonical response shape.
      - Web maps search and child place embeds render useful labels or details for enriched amenities without breaking existing Google Maps and OpenStreetMap CTAs.
      - Apple builds or targeted parity tests confirm native maps/app-skill rendering remains compatible after web user confirmation.

