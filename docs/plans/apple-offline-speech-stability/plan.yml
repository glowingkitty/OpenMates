schema_version: 2
id: apple-offline-speech-stability
title: Apple offline speech and connection stability
status: implementing
goal: 'Make the Apple app responsive and reliable for daily use: remove rejected speech adapters, research offline neural replacements and provide warm
  debounced contextual PII highlighting, recover interrupted model downloads, retain recent chats and complete workspace
  metadata offline, and expose authorized background progress through Live Activities and notifications.'
goal_source: Direct user request in codex thread 01a0eeac-16cd-7ff1-941a-5d1fb4908fae on 2026-10-03.
tracking:
  task: TASK-8137
  status_authority: OpenMates Tasks
scope:
  in:
  - Existing optional local model laboratory and its signed Mac packaging.
  - Supported model visibility, download and verification progress, inference phase timing and cancellation.
  - Correlation of connection failures with lifecycle, sync and resource pressure.
  - Recommendation and bounded evaluation of offline Apple speech engines.
  - Twenty most recent encrypted chat record snapshots with local-first paging and navigation preemption.
  - The same complete twenty-chat offline cohort on Apple Watch, with bounded encrypted message/embed pages.
  - Watch offline retention of fifty most recent tasks per status, workflow definitions and run metadata;
    on-demand read-only run details and fullscreen embeds, horizontal preview groups and message zoom.
  - New-task app-icon and Mac shortcuts, task editing, and configurable encrypted Tasks home and Lock Screen widgets.
  - Circular and rectangular Active chats Lock Screen widgets, plus a configurable Workflow widget for explicit manual runs of scheduled workflows.
  - All current workflow definitions, task/plan inventories and project metadata in a scoped encrypted device cache.
  - Live Activities for background model downloads and upcoming saved memory embeds; Active chats widgets and
    completion notifications remain separate. Processing-chat Live Activities were explicitly withdrawn by the user.
  - Web-parity task context menus, drag/drop and workflow-run opening; workspace and workflow-node transitions;
    Apps workspace parity.
  - Separate optional Watch foreground tiny Whisper developer experiment; multilingual pinned assets and thirty-second
    local microphone tests.
  out:
  - Backend Project connectivity assigned to another chat.
  - Automatic production speech rerouting or unselected neural runtime integration.
  - Raw audio, transcript, credentials or private chat content in diagnostics.
recommendation:
  default: Supertonic3 and exact KittenMini0.8 selected for developer testing only. Pocket TTS, Apple system voice testing and Kokoro remain removed.
  optional_candidate: Optional explicit pinned downloads and local lab playback are approved. Kitten uses the publisher pure Swift BuiltinPhonemizer; CE/eSpeak/GPL data are excluded. The selected adapters are included in the next consolidated build92; native synthesis and developer UI evidence are required before release.
  existing_kokoro: Removed at the user's explicit instruction; no automatic restoration.
  alternatives: Selected engines still need blind listening and physical-device validation. KittenTTS2 and NeuTTS remain research only.
  experimental_alternative: Desktop benchmarks and small download sizes do not establish human voice quality or iPhone reliability.
sequence:
- step: Repair Mac laboratory input access.
  work: Add the user-selected read entitlement to the effective macOS distribution entitlement path. Audit microphone
    entitlement separately. Check the signed exported app, then verify audio import and local transcription in TestFlight.
  evidence: Installed Mac 0.27.0(89) is sandboxed and lacks user-selected file access. AppKit explicitly refuses
    the open panel. Whisper assets became ready within 89.2 seconds of the download click, but no inference fixture
    could be imported.
- step: Separate progress and inference phases.
  work: Expose transfer, verification, tokenizer preparation, model loading, transcription and cleanup. Record monotonic
    durations and bounded numeric resource samples. Show verification during hashing; preserve terminal updates
    and responsive download cancellation during another model's inference.
  checks: LocalModelStoreTests and LocalModelLabControllerTests cover monotonic progress, terminal delivery, phase
    ordering, cancellation drain and stale generation suppression. Native lab UI coverage proves visible advancement
    and cancellation.
- step: Measure identical-input cold and warm performance.
  work: Run the same disposable 16 kHz mono fixture after relaunch and three repeats, first with sync settled, then
    with measured sync activity. Compare install verification or another download only as a separate controlled
    condition. Record OS, model revision, Low Power Mode, thermal state and background load.
  devices:
  - Apple M1 Mac
  - iPhone 13 Pro
  - supported iPad
  interpretation: Optimize the dominant measured phase. Model/tokenizer reuse requires bounded memory and explicit
    unload ownership. Scheduling hashing or sync requires evidence that those operations compete with inference.
- step: Diagnose connection loss on the same timeline.
  work: Record lifecycle and network path changes, close/error categories, ping schedule drift and RTT, callback-to-main-actor
    delay, sync phase duration and operation counts. Exercise foreground, background/foreground and network interruption.
    Distinguish authentication rejection from transport failure.
  limitation: Reconnecting banners alone do not identify an internet outage or a heartbeat timeout.
- step: Research the next offline speech comparison.
  work: Remove rejected Pocket TTS source, assets registration and build linkage. Compare current primary-source
    alternatives and implement the user-selected Supertonic3/KittenMini0.8 developer tests. Use explicit verified offline assets, stock voices and ephemeral input/playback; expose the Kitten pure Swift phonemizer limitation. Blind listening/device measurements remain separate verification. Production routing remains unchanged and Apple voices stay removed.
  measures:
  - time to first audio
  - cold load
  - synthesis duration
  - download bytes
  - sampled memory
  - listening quality
  - cancellation
  - repeated-session stability
  gate: No iPhone reliability or quality claim based only on Mac smoke tests or upstream desktop benchmarks.
- step: Keep recent chat records and workspaces local first.
  work: Maintain twenty truly recent encrypted chat snapshots with bounded on-demand message windows. Add complete
    scoped encrypted workflow/task/plan/project metadata snapshots, cursor traversal and background coalescing.
    Foreground navigation preempts utility maintenance. Apply the same twenty-chat selection and complete-content
    receipts to Apple Watch, including unopened conversations.
    On Watch, retain at most fifty recent tasks per status, complete workflow definitions and bounded run metadata
    in encrypted scoped storage. Run details remain on demand. Enforce explicit storage budgets without reporting
    a truncated or rejected snapshot as complete, and retain usable cached data during connection interruptions.
  checks: Native cohort/window/integrity/isolation tests and workspace cache/full-traversal/local-first tests; focused
    UI cold/offline navigation.
  limitation: Remote binary chat attachments are not bulk-prefetched in this slice. Existing cached media remains
    available; connected Project file content depends on its source.
- step: Expose actual background progress.
  work: Use durable iOS background URLSession transfers with pinned-operation journals, full size/SHA verification,
    Live Activity progress and once-per-operation completion notifications. Reconcile generic upcoming saved memory
    timing within four hours using supported local scheduling and bounded Previous/Next navigation. Show current
    processing chats only through Active chats widgets, separately from completion push notifications.
  checks: Transfer recovery/cancellation/validation, Activity lifecycle/permission/privacy, memory timestamp eligibility
    and widget census/completion tests.
  limitation: Live Activity presentation depends on OS authorization. Server APNs delivery tracing remains blocked
    while dev SSH refuses connections.
- step: Finish workspace interaction parity.
  work: Reuse shared task menus, implement eligible drag/drop with optimistic lifecycle/position reconciliation
    and run navigation. Add My workflows/Templates, smooth reduced-motion-aware detail/node transitions, and Apps
    workspace explicit app-skill execution. Add draft-preserving focused task creation shortcuts, version-checked
    task editing and status-filtered Tasks home widgets.
    Add Watch long-press message zoom with a fifteen-point default, correctly positioned horizontal embed groups
    and read-only fullscreen text, thumbnail and map previews.
  checks: Focused native unit and UI coverage using disposable fixtures; real-account read-only comparison where
    available.
evidence:
  report: research.md
  watch_whisper_research: watch-whisper-research.md
  private_mac_receipt: .runtime/offline117/mac-lab-observation117.json
  initial_source_findings:
  - Whisper creates and unloads its runtime on every run; displayed elapsed includes setup and cleanup.
  - Current memory metric is process lifetime ru_maxrss, not the model run's measured peak.
  - Install progress is clamped at .99 while the view labels verification only at 1; hashing can look like stalled
    downloading.
  - Cached model restoration rehashes assets and can overlap other laboratory work.
  - WebSocket ping scheduling and receive routing use the main actor; direct inference blocking it is unproven.
  native_followups:
    watch: Nine tiny-model asset/lifecycle unit cases and developer-entry, download, result, removal and cancellation
      Watch Simulator checks passed. Physical Watch inference remains unmeasured.
    share: Real Safari article sharing on iPhone Simulator loaded decrypted recent chats and accepted the encrypted
      send. Original URL persistence and substantive assistant completion were verified after ordinary app restart.
    performance: Measured composer/search main-thread work was coalesced and moved to bounded snapshots and detached
      matching. Focused search/composer unit checks and actual search navigation passed.
    workspaces: Task menus, actual dragging and rollback, title/description editing, New task shortcut and workflow-run
      opening passed focused UI checks. Apps explicit skill execution/result opening, separate owner/template workflow
      browsing, workflow sidebar and node expansion/reveal/contraction checks passed.
    laboratory: Supported download controls, advancing transfer/verification, interrupted Privacy Filter retry,
      installed Apple voice playback, cancellation and cleanup passed focused UI checks.
  release_gates:
  - TestFlight 0.27.0 (91) is available for iOS with its Watch companion and universal macOS. Its signed archives
    and availability receipts are retained. Later consolidated fixes and the two selected neural speech laboratories
    are assigned build 92 and are not included in build 91.
  - Dev SSH is unavailable until Monday. The user authorized a one-time process-local reviewed-source admission
    route for scoped dev publication; it preserves source, scope, integration and push-lock checks and does not
    claim an isolated CI pass.
  - Build 92 requires current source-matched native tests/builds, real-account read-only navigation and native
    synthetic Focus history/details verification, followed by signed archive and actual TestFlight availability
    checks. The current TASK-8137 release policy requires zero real inference; TASK-7858 remains open for its
    separately required real native eight-turn acceptance. No build 92 upload has started.
approval:
  research_and_plan: Requested by the user.
  unsupported_model_visibility: User explicitly requested hiding unavailable models.
  speech_engine_selection: User initially approved Apple built-in premium voice testing, then rejected it and
    authorized removing the laboratory and implementing Pocket TTS testing.
  implementation: User explicitly instructed proceeding with this combined plan on 2026-10-03.
  neural_engine_selection: Historical Pocket TTS selection is superseded by the user quality rejection on 2026-10-04.
    Remove it completely and research alternatives only. Same-model Core ML PII conversion remains unselected.
  removed_runtime: User explicitly instructed removing Kokoro from the app rather than hiding it.
  offline_and_activities: Direct user instructions authorize twenty-chat and complete workspace offline sync, download/memory
    Live Activities, Active chats widgets, and further push investigation. The user's later instruction removes
    processing-chat Live Activities entirely while preserving the widget and completion pushes.
checks:
- Preserve signed TestFlight delivery for Mac app testing; do not install a Debug replacement.
- Extend relevant native coverage for each implemented behavior fix.
- Verify signed sandbox entitlements before the next TestFlight upload.
- Record measured phases and device conditions before selecting an optimization.
