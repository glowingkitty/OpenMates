    work:
    - Native selection handles and exact selected-text copy; read-only embed TextKit source selection/copy.
    - Daily card measured web parity at 300-by-200 points with equal columns; iPad bottom inset and keyboard layout repair.
    - Lexend README Create flow with shared toast feedback.
    - Filter empty-draft metadata hydration and require the exact decrypted-empty row plus current owner fences before tombstoning.
    - Assistant-response speech retry, canonical-source chapter readiness and replacement/deletion/cancellation fences; retain eager native sends and production provider.
    private_read_only_observation: Personal dev CLI observed 25 drafts, zero semantically empty drafts and five media markers;
      private marker checks are aggregated by root and are not a destructive cleanup or native runtime receipt.
    limitations:
    - Legacy draft deletion sends chatId only. Native exact-row and owner fences do not prove atomic server deletion
      or prevent another device concurrently adding content before that legacy delete is applied.
    - Spoken-paragraph highlighting remains unimplemented because projected speech chunks lack an exact displayed-text mapping.
    - Selection/copy coverage must preserve block annotation text segments and raster boundaries; partial text proof does not certify those surfaces.
    - New focused native and UI receipts, source preservation, publication and TestFlight availability remain required.
  compatibility_handoff:
    reference: Canonical dev 8a0ec19683c2d1fa23cea1f46e57913b3d259222; backend implementation remains a private candidate.
    blockers: Canonical encrypted artifact references, exact retry journals across restart, commitment-bound accepted
      acknowledgements and reference-availability receipts require matching backend contracts and native verification.
    writer_hold: Hold deployment of handlers requiring new parent/key writer checks until native compatibility and
      supported-client release policy are verified. Archive switches do not gate those writer checks.
    billing_hold: The proposed feature.billing@6 contract and matching API await approval/publication; implement no
      native logical-storage billing, Team storage bill or expiration behavior from the proposed handoff.
