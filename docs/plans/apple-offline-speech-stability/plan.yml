current_regression_pass:
  source: Direct user reports after TestFlight 0.27.0 (90), 2026-10-03
  status: implementing
  verification_2026_10_04:
    source_status: Prior-source evidence; these receipts do not verify the subsequent 319/320 changes.
    units: 235 unique synthetic native unit cases have passing evidence across native-focused256 and corrected258,
      recorded with log hashes in .runtime/followups98/cumulative-native-unit-evidence306.json. This is not a single
      all-green run; repeated executions are not additional cases.
    watch: Four unique Watch UI cases passed across native-watch-ui286 and native-watch-ui296. Run 286 proved
      bounded foreground paging, unopened offline history and cached category/icon rows; its Share case failed.
      Run 296 passed that Share case after clipped scroll bounds, targeted gestures and close-button zIndex repair.
    widget_run: The actual production Run App Intent fixture case passed in native-ui266; other failures in that
      run prevent labeling the whole run successful. No real workflow execution or inference was performed.
    mac: Final native-mac316 compiled and linked successfully with exit 0 and unchanged source. Preserved
      __eh_frame sections are documented in .runtime/followups98/native-mac316-unwind-sections.txt; earlier
      native-mac287 build and unwind evidence remain retained.
    ipad: Final normal native-ipad315 passed all three cases with unchanged source, covering cold Apps to Tasks,
      initial Tasks to narrow resize, and external-selection to Apps to Tasks. The dedicated normal
      WorkspaceTabButtonStyle consumes configuration.isPressed; temporary diagnostics were removed. The exact
      SwiftUI cause remains unproven; earlier native-ipad301 and native-ipad304 failed receipts remain historical evidence.
    publication: Source remains unpublished. Final source preservation, scoped inventory review, actual CI disk
      reserve, isolated product CI and coordinated publication remain required.
  followup_319_320:
    source: Canonical dev 046e28be58d3ba80d7dfc5912ee33321362e4bd6 after Directus accountability updates; session 6dc7
      contains unpublished followup changes. The storage API implementation remains unannounced.
    verification: Requested native stages complete. IOS349, native-mac-build345 and native-watch-build346 builds passed
      with unchanged source; Mac and Watch evidence is compile-only. Installed Mac app/authentication were untouched.
      No new Watch runtime evidence is inferred. Isolated product CI, dev publication and TestFlight remain pending.
      Receipts below remain bound to their own source; later repairs do not rewrite failed runs.
    focused_units: 174 unique new-focused native cases have passing evidence across323/331/333; this is not one
