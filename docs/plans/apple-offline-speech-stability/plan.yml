workflow_widget:
  selection: Current owner's cached workflows with an actual schedule trigger; require complete offline definitions.
  storage: Dedicated device-only App Group encryption key and account/server/Team-scoped snapshots; clear on logout
    or scope change. Do not copy session or master keys into the widget.
  execution: Explicit Run opens the app, validates a bounded encrypted ticket against current scope and workflow
    version, and invokes the existing manual endpoint with a stable idempotency identity. Disabled automatic schedules
    may run manually; backend input/readiness checks remain authoritative.
  retries: Retain uncertain dispatch identities for an explicitly reauthorized retry. Do not automatically run workflows
    on refresh, navigation, launch or connectivity recovery. Consume matching success and known pre-acceptance failures.
  verification: Thirteen synthetic native tests and the production Run App Intent Simulator fixture passed. Physical
    WidgetKit presentation and actual workflow execution remain device/backend integration checks; no real inference
    or workflow run was requested by this verification.

