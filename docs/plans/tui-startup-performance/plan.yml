  - Index cached top-level embeds once and avoid duplicate network-window decryption.
  - Preserve ciphertext-only persistence, authorized Team key resolution, account/context/cancellation fences and recovery ordering.
checks:
  - Focused CLI client, crypto, cache, Team and terminal navigation unit tests.
  - CLI bundle and declaration build, focused lint and contract metadata validation.
  - Isolated GitHub synthetic encrypted-cache terminal proof and authenticated rich-chat offline reopen proof.
