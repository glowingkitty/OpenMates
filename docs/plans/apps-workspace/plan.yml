schema_version: 2
id: apps-workspace
title: Apps workspace and metadata-driven direct skill use
status: implementing
goal: Allowing a user to also use app skills directly without the need for an ai chat (using the same
  endpoints like the app skill commands via cli do).
specification_refs:
- id: feature.apps-workspace
  version: 1
- id: feature.workspace-shell
  version: 3
scope:
  in:
  - Apps workspace (second header tab), bottom-slide detail view and legacy route forwarding.
  - Lazy public metadata, shared schema forms, existing direct endpoints and guest eligibility.
  - Encrypted chatless results, guest promotion, Personal/Team app libraries with pagination.
  - Relevant unit and isolated browser coverage; scoped dev publication.
  - Show locally retained skill results without waiting for remote graph saves; recover and retry encrypted
    background uploads without re-executing skills.
  - Expose optional natural-language Requirements when the native skill schema declares relevance_criteria.
  out:
  - Native Apple UI.
  - New app skills/providers, changes to CLI retention or billing.
  - Proof videos.
scenarios:
- id: S-1
  title: Public Apps workspace
  given:
  - The app catalog is available and the browser is in Personal, Team or guest context.
  when:
  - Public Apps workspace
  then:
  - Open Apps from the Apps tab (second of five) or canonical hash routes and browse apps, skills, focus
    modes and memories.
- id: S-2
  title: Direct skill use
  given:
  - The app catalog is available and the browser is in Personal, Team or guest context.
  when:
  - Direct skill use
  then:
  - Render at most two primary schema-driven inputs, reveal advanced settings, execute direct endpoints,
    and gate guest execution by CLI eligibility and free budget.
- id: S-3
  title: Retained app libraries
  given:
  - The app catalog is available and the browser is in Personal, Team or guest context.
  when:
  - Retained app libraries
  then:
  - Retain encrypted parent and children in the submitted account, paginate app-scoped embeds and saved
    workflows, and adopt local guest results into Personal after signup without rerunning.
