apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Features/Embeds/Renderers/CodeRenderers.swift
    - apple/OpenMates/Sources/Features/Embeds/Views/EmbedContentView.swift
    - apple/OpenMates/Sources/Features/Embeds/Views/EmbedFullscreenView.swift
    - apple/OpenMates/Sources/Core/I18n/AppStrings.swift
    - apple/OpenMatesUITests/EmbedRenderingParityUITests.swift
  parity_expectations:
    - Apple renders code-notebook previews and fullscreen content as notebook cells, not raw JSON.
    - Apple may keep notebook execution disabled in v1 if the native Run UI is not implemented, but the disabled state must be explicit and localized.
    - Apple does not execute notebook code locally; any future native Run action must call the same first-party notebook execution API and E2B boundary as web.
  verification:
    - Run or attempt `python3 scripts/apple_remote.py status` before Apple verification.
    - Run or attempt `python3 scripts/apple_remote.py build-ios` after native rendering changes, or a targeted notebook embed parity UI test if one exists.
  intentional_native_differences:
    - Native text rasterization, scroll physics, and safe-area behavior may differ while preserving the same cell hierarchy, labels, and read-only execution state.
    - Native notebook execution can be deferred from v1 if web execution is complete and Apple renders a clear unsupported-yet state.

clarification:
  rounds:
    - question: Should the preview card render notebook cells or show raw `.ipynb` JSON?
      answer: The preview card must render the first notebook lines/cells non-interactively; fullscreen is interactive.
    - question: Should run results be stored separately from the canonical notebook embed or written back into the `.ipynb` content after every run?
      answer: Store run results separately like current Code Run sidecars; do not use diff editing for execution outputs.
    - question: For v1, should executable notebooks be Python-only?
      answer: Yes. Support Python-only `.ipynb` execution first via E2B, and show non-Python notebooks as readable but execution unsupported.
  vision_summary: >
    Notebook embeds are source artifacts, while runtime outputs are per-user run
    artifacts. The preview should look like a notebook immediately, fullscreen
    should be the interactive notebook workspace, and v1 execution is strictly
    Python-only in E2B with encrypted sidecar output persistence.
  approved_by_user: true

