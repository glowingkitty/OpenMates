decisions:
  - id: D-1
    status: active
    decision: Store notebook run outputs in encrypted sidecars instead of mutating canonical notebook embeds.
    reason: Execution output is user/session-specific, can be large, and would create noisy embed versions if written back to source content.
    decided_at: "2026-07-30T00:00:00Z"
  - id: D-2
    status: active
    decision: Limit executable notebooks to Python kernels in v1.
    reason: Python covers the primary Jupyter use case while avoiding multi-kernel security, dependency, image, and billing complexity for the first slice.
    decided_at: "2026-07-30T00:00:00Z"
  - id: D-3
    status: active
    decision: Notebook execution is explicit user action only; generation and preview never auto-run code.
    reason: E2B runtime has billing and untrusted-code implications, so users must intentionally start execution.
    decided_at: "2026-07-30T00:00:00Z"

