    - python3 -m pytest backend/tests/test_notebook_run_outputs.py
    - python3 scripts/tests.py run --suite vitest
    - Restart the affected local Docker service under the Docker lock before dev-server REST/API proof.
    - Direct REST/API proof against https://api.dev.openmates.org for 401, 403, 422, and valid Python start/status/stream behavior.
    - python3 scripts/audit_sdk_cli_parity.py
    - Deploy to dev before Playwright green-phase verification.
    - python3 scripts/tests.py run --spec code-notebook-flow.spec.ts
    - Run the realistic CLI chat prompt against https://api.dev.openmates.org and inspect the resulting real chat for a valid `code-notebook` embed.
    - Share the selected real chat and run `node scripts/create-example-chat-from-share.mjs "<SHARE_URL>" --slug "open-meteo-weather-notebook" --title "Open-Meteo weather notebook" --summary "A Python notebook that fetches no-key weather forecast data, analyzes daily trends, and plots conditions for planning a bike ride." --icon "weather" --category "work" --keywords "jupyter notebook,python,pandas,open-meteo,weather api,data analysis"`.
    - Build/validate example chat translations and verify the deployed `/example/open-meteo-weather-notebook` page.
    - User confirmation of deployed notebook preview/fullscreen/run UX.
    - python3 scripts/apple_remote.py status followed by python3 scripts/apple_remote.py build-ios or targeted UI test.
  verification_order:
    - Direct REST API/WebSocket backend contract against the dev server first, with access model, auth, rate-limit, credit/budget, and encryption-boundary classification.
    - CLI gate second is intentionally not applicable for v1 because notebook execution is first-party web only; record this through `python3 scripts/audit_sdk_cli_parity.py`.
    - npm SDK and pip SDK gates third are intentionally not applicable for v1 because no developer API surface is exposed; record this through `python3 scripts/audit_sdk_cli_parity.py`.
    - GitHub Actions CI/daily-test reproduction only after local REST/API proof and local frontend/backend tests are green.
    - Web Playwright fourth after deploy to app.dev.openmates.org.
    - Real CLI notebook chat and example-chat conversion fifth, only after deployed web notebook behavior works.
    - User confirmation sixth for deployed web notebook preview, fullscreen, run UX, and example-chat UI validation.
    - Apple remote build or targeted test last for read-only notebook rendering parity.

