implementation_notes:
  plan_path: docs/plans/code-notebook-embed/plan.yml
  existing_patterns:
    - backend/apps/code/app.yml direct embed metadata for `code` and `application`.
    - backend/core/api/app/routes/code_execution.py Code Run auth, rate limits, E2B task lifecycle, status, stream, and cancellation patterns.
    - backend/core/directus/schemas/code_run_outputs.yml encrypted sidecar storage model.
    - frontend/packages/ui/src/components/embeds/code/CodeEmbedPreview.svelte preview behavior for source-like embeds.
    - frontend/packages/ui/src/components/embeds/code/CodeEmbedFullscreen.svelte fullscreen and run-action behavior for source-like embeds.
    - .agents/skills/add-example-chat/SKILL.md required workflow for turning a real CLI chat into a public example chat.
    - apple/OpenMates/Sources/Features/Embeds/Renderers/CodeRenderers.swift native embed rendering parity surface.
  architecture: >
    Add notebook as a Code app direct embed with encrypted nbformat source. Web
    renders notebooks client-side and starts Python execution through a new
    first-party notebook run route that reuses Code Run's E2B isolation,
    pricing, rate limits, and stream/status concepts. Execution outputs are
    client-encrypted into notebook-run sidecars and merged into fullscreen views
    at render time, while source changes remain ordinary encrypted embed edits.
  data_flow:
    - Assistant emits a structured notebook artifact or `.ipynb` payload.
    - Backend validates nbformat and creates an encrypted `code-notebook` embed.
    - Preview/fullscreen decrypt and render notebook cells locally.
    - User clicks Run all or Run cell in fullscreen.
    - First-party notebook API validates auth, access, Python kernel support, limits, and billing, then starts E2B.
    - E2B executes selected Python cells and streams cell outputs back to the client.
    - Client encrypts the latest run result with the notebook embed key and upserts `notebook_run_outputs`.
    - Sync broadcasts encrypted sidecars to the runner's devices; fullscreen merges decrypted sidecar output on reload.
    - After deployed web verification, a real CLI chat asks for the notebook use case and produces a real notebook embed.
    - The source chat is inspected in CLI and web, shared with a key-fragment URL, and converted into a public example chat.
    - The deployed example page becomes the stable UI validation surface for the user.
  affected_files:
    - path: backend/apps/code/app.yml
      reason: Add `code-notebook` embed metadata and content fields.
    - path: backend/apps/ai/tasks/stream_consumer.py
      reason: Detect or accept assistant notebook artifacts and avoid treating `.ipynb` as raw Python code.
    - path: backend/apps/ai/instructions/base_code_block_instruction.md
      reason: Teach generation rules for notebook artifacts and Python-only execution expectations.
    - path: backend/core/api/app/routes/code_notebook_execution.py
      reason: New first-party notebook run route, status, stream, auth, billing, and validation contract.
    - path: backend/shared/providers/e2b_code_runner.py
      reason: Add or factor notebook execution helpers that run Python cells safely in E2B.
    - path: backend/core/directus/schemas/notebook_run_outputs.yml
      reason: Encrypted Directus sidecar storage for rich notebook outputs.
    - path: backend/shared/python_schemas/notebook_run_outputs.py
      reason: Shared schema for sync and API-side notebook output rows.
    - path: backend/core/api/app/routes/handlers/websocket_handlers/notebook_run_output_handlers.py
      reason: WebSocket upsert/request/sync handling for encrypted notebook output sidecars.
    - path: backend/core/api/app/routes/sync_api.py
      reason: Include notebook sidecars in authenticated sync payloads after metadata phases.
