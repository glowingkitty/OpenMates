  code_patterns:
    - backend/apps/code/app.yml declares current Code app direct embed types `code` and `application`; no notebook embed type exists yet.
    - backend/core/api/app/routes/code_execution.py implements `/v1/code/run`, Code Run auth, rate limits, E2B task start/status/cancel/stream, executable allowlists, package validation, and client file fallback behavior.
    - backend/shared/providers/e2b_code_runner.py is the isolated E2B execution boundary and never gives sandboxes OpenMates credentials.
    - backend/core/directus/schemas/code_run_outputs.yml defines encrypted Code Run terminal-output sidecars keyed by `chat_id`, `embed_id`, and `author_user_id`.
    - backend/core/api/app/routes/handlers/websocket_handlers/code_run_output_handlers.py validates chat/embed access, upserts encrypted sidecars, broadcasts sync events, and writes a compact vault-encrypted inference cache.
    - frontend/packages/ui/src/services/db/codeRunOutputs.ts stores decrypted Code Run sidecars locally without mutating canonical code embed content.
    - frontend/packages/ui/src/components/embeds/code/CodeEmbedPreview.svelte and CodeEmbedFullscreen.svelte are the current source-like preview/fullscreen patterns.
    - frontend/packages/ui/src/components/embeds/code/codeHighlighting.ts registers `.ipynb` as a Python highlight alias only; it does not parse notebooks.
    - frontend/packages/ui/src/data/embedRegistry.generated.ts is generated from app metadata and should not be hand-edited.
    - backend/apps/ai/tasks/stream_consumer.py and backend/apps/ai/instructions/base_code_block_instruction.md are likely generation/parser touchpoints for assistant notebook artifacts.
    - apple/OpenMates/Sources/Features/Embeds/Renderers/CodeRenderers.swift is the native code/embed rendering parity surface.
