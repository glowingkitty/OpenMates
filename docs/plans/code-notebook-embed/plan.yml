contracts:
  api:
    - route: POST /v1/code/notebooks/run
      access_model: first-party client surface only
      auth: Authenticated OpenMates session or approved first-party device auth; no public anonymous or developer API-key access in v1.
      request: >
        `{ chat_id: string, notebook_embed_id: string, run_scope: "all" | "cells",
        cell_indices?: number[], enable_internet?: boolean, dependency_installs?:
        CodeRunDependencyInstall[] }` plus optional client notebook content fallback when
        server cache cannot resolve encrypted notebook source.
      response: >
        `{ execution_id, status, credits_per_minute, stream_path, status_path,
        notebook_embed_id, source_version }`.
      errors:
        - 401 when unauthenticated.
        - 403 when the chat or notebook embed is not accessible to the current user.
        - 402 or existing budget error shape when credits are insufficient.
        - 422 for malformed nbformat, unsupported kernel, unsafe dependency specs, oversized notebooks, invalid cell indices, or missing runnable Python code cells.
        - 429 when user or provider creation rate limits are exceeded.
      rate_limits:
        - Reuse or define a notebook equivalent to Code Run start limits, initially 10 starts per minute per authenticated user unless implementation discovery requires a stricter value.
        - Enforce the existing active-run cap, initially 5 active code/notebook runs per user and provider-level active E2B cap.
      billing:
        - Existing Code Run price of 5 credits per started minute of E2B runtime for v1.
      plaintext_boundary:
        - The run route may handle decrypted notebook source transiently to validate and forward to E2B; it must not persist plaintext notebook source or outputs in Directus.
    - route: GET /v1/code/notebooks/run/{execution_id}/status
      access_model: first-party client surface only
      auth: Same authenticated user that started the run or an authorized device for that user.
      response: >
        Current run status, selected cell statuses, elapsed time, cancellation state,
        and billing/runtime metadata without raw decrypted notebook source.
    - route: WebSocket /v1/code/notebooks/run/{execution_id}/stream
      access_model: first-party client surface only
      auth: Authenticated WebSocket session for the runner.
      response: >
        Ordered events for run_started, cell_started, stream, display_data,
        execute_result, error, cell_finished, run_finished, timeout, failed, and cancelled.
    - route: WebSocket event upsert_notebook_run_output
      access_model: first-party client surface only
      auth: Authenticated WebSocket session with chat and notebook embed access.
      request: >
        Routeable metadata plus `encrypted_payload` encrypted client-side with the
        notebook embed key. Optional compact inference payload must follow Code Run
        truncation, redaction, TTL, and user-vault encryption rules.
      response: notebook_run_output_synced broadcast to the runner's devices.
  data:
    - Add Directus collection `notebook_run_outputs` with `id`, `chat_id`, `notebook_embed_id`, `author_user_id`, `source_version`, `key_version`, `encrypted_payload`, `created_at`, and `updated_at`.
    - Add a unique index on `[chat_id, notebook_embed_id, author_user_id]` for the latest saved output per runner.
    - Encrypted payload shape includes notebook output version, run_id, status, selected cell indices, source version, per-cell execution_count, outputs, errors, saved_at, duration, and truncation flags.
    - IndexedDB gets a `notebook_run_outputs` store with `chat_id` and `notebook_embed_id` indexes.
    - Sync payloads include notebook run outputs only after metadata phases, matching the existing code_run_outputs pattern.
  ui_states:
    - Processing preview with streamed cell count such as `Write 4 cells ...`.
    - Finished preview with filename, cell count, Notebook label, and first visible cells.
    - Error preview for invalid notebook generation.
    - Fullscreen default source view with latest saved outputs merged in.
    - Run all, run selected cell, running, cancelling, cancelled, failed, timeout, unsupported kernel, insufficient credits, and saved output after reload states.
  privacy_security:
    - Treat notebook source and outputs as client-side encrypted chat material.
    - Do not expose OpenMates auth cookies, API tokens, vault keys, provider keys, or user secrets to E2B.
    - Sanitize markdown and rich HTML outputs before rendering; no scripts, event handlers, unsafe URLs, or raw iframe execution from outputs.
    - Reject or warn on secret-like notebook source before execution, following Code Run secret checks.
    - Do not auto-start E2B during preview, generation, sync, or share rendering.

