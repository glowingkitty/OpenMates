scenarios:
  - id: S-1
    title: Assistant creates a Python notebook embed
    given:
      - Alice is authenticated in a normal chat.
      - Alice asks OpenMates to create a notebook that fetches and analyzes weather forecast data from a no-key public API.
    when:
      - The assistant emits a notebook artifact or `.ipynb` payload.
    then:
      - OpenMates validates the payload as nbformat JSON with `nbformat`, `nbformat_minor`, `metadata`, and `cells`.
      - OpenMates creates one encrypted direct `code-notebook` embed with filename `open_meteo_weather_analysis.ipynb`.
      - The notebook content contains markdown and Python code cells but no runtime outputs unless the assistant intentionally authored static example output.
      - The assistant message shows a notebook preview labeled `14 cells, Notebook`, not a raw JSON code block.

  - id: S-2
    title: Preview renders first cells without interactivity
    given:
      - Alice has a finished notebook embed containing markdown and code cells.
    when:
      - Alice views the chat message at desktop or mobile preview size.
    then:
      - The preview shows the notebook filename, total cell count, and a Notebook type label.
      - The preview renders the first visible markdown/code cells with safe markdown and syntax highlighting.
      - The preview does not expose Run, Run all, editable cell controls, or raw `.ipynb` JSON.
      - Processing previews can show progress such as `Write 4 cells ...` while cells stream in.

  - id: S-3
    title: Fullscreen notebook shows source plus latest saved outputs
    given:
      - Alice opens a finished Python notebook embed in fullscreen.
      - Alice previously ran cell 2 and saved an encrypted notebook-run sidecar.
    when:
      - The fullscreen view loads.
    then:
      - Markdown, code, and raw cells render in notebook order with stable cell indexes.
      - The latest decrypted sidecar output for Alice is merged into the rendered view without changing the canonical notebook content.
      - Outputs support at least stdout/stderr streams, execute_result/display_data text, HTML rendered through sanitization, PNG/SVG images, and Python errors.
      - Alice can inspect source cells and saved outputs after reload.

  - id: S-4
    title: User runs Python notebook cells in E2B
    given:
      - Alice has a Python notebook embed with a valid Python kernelspec or Python language metadata.
      - Alice has enough credits for Code Run pricing.
    when:
      - Alice clicks Run all or runs a selected code cell in fullscreen.
    then:
      - The web app sends a first-party authenticated notebook run request for the notebook embed and selected cell scope.
      - The backend validates chat access, notebook ownership, nbformat shape, Python-only execution support, dependency selections, and payload limits.
      - The backend starts an E2B task; OpenMates API, worker, browser, and Apple hosts never execute notebook code.
      - The stream reports per-cell status, stdout/stderr, final outputs, errors, cancellation, and terminal run state.
      - The run is billed at the existing Code Run price of 5 credits per started minute unless implementation discovery requires a separate approved SKU.

  - id: S-5
    title: Non-Python notebooks render read-only
    given:
      - Alice opens a notebook whose kernelspec language is R, Julia, Bash, JavaScript, or missing/ambiguous.
    when:
      - Alice views preview or fullscreen.
    then:
      - OpenMates renders the notebook cells safely.
      - Run controls are hidden or disabled with a localized message such as `Python notebooks only in v1`.
      - A direct notebook execution API call for the same embed returns a structured unsupported-language error and starts no E2B task.

  - id: S-6
    title: Run outputs persist as encrypted sidecars
    given:
      - Alice completes a Python notebook run that produced stdout, a dataframe display, and one error cell.
    when:
      - The web app saves the run result.
    then:
      - The client encrypts a notebook-run output payload with the notebook embed key.
      - Directus stores only routeable sidecar metadata plus `encrypted_payload`; canonical notebook embed content is unchanged.
      - The sidecar is keyed by `chat_id`, `notebook_embed_id`, and `author_user_id` so each runner can keep their latest output independently.
      - Other signed-in devices for Alice receive a sync event and can decrypt the latest output with the embed key.

  - id: S-7
    title: Source edits do not mix with runtime outputs
    given:
      - Alice asks the assistant to add a data-cleaning cell after she has already run the notebook.
    when:
      - The assistant updates the notebook source.
    then:
      - The edit updates canonical notebook cells through the normal encrypted embed update/diff path.
      - Existing run sidecars remain separate and are marked stale or visually tied to the source version they were produced from.
      - Running the notebook again creates or updates a sidecar for the new source version.

  - id: S-8
    title: Unauthorized or unsafe execution is rejected before E2B
    given:
      - Mallory is unauthenticated or does not have access to Alice's notebook chat.
    when:
      - Mallory posts to the notebook run route.
    then:
      - The route returns 401 when unauthenticated and 403 when the notebook is outside the user's accessible chats.
      - Oversized notebooks, too many cells, suspicious secret-like content, unsafe dependency specs, and malformed nbformat payloads are rejected before E2B starts.
      - The response is structured and does not include raw stack traces or decrypted notebook content.

  - id: S-9
    title: CLI and SDK do not expose notebook execution in v1
    given:
      - A developer inspects the OpenMates CLI, npm SDK, and pip SDK after notebook web execution ships.
    when:
      - They look for public notebook run methods or commands.
    then:
      - No public developer API, CLI command, npm method, or pip method is added for notebook execution in v1 unless a later approved plan explicitly adds parity.
      - The first-party web route is documented as a first-party client surface only, not a developer API-key surface.
      - The SDK/CLI parity audit records the intentional non-exposure.

  - id: S-10
    title: Apple renders notebook embeds read-only
    given:
      - Alice opens a chat containing a code-notebook embed on the Apple app.
    when:
      - The native embed preview or fullscreen view renders.
    then:
      - Apple shows notebook cells, filename, and cell count instead of raw JSON.
      - Apple does not execute notebook code locally.
      - If native execution is not implemented in v1, Apple shows no Run action or a localized unsupported-yet state.

  - id: S-11
    title: Real CLI notebook chat becomes a public example chat
    given:
      - The full dev web app notebook implementation has been deployed and verified enough to render notebook previews and fullscreen.
      - A logged-in OpenMates CLI session targets `https://api.dev.openmates.org`.
    when:
      - The implementer runs a realistic natural-language chat prompt such as `openmates chats new "Create a Jupyter notebook that pulls the next 7 days of hourly weather data for Berlin from the free Open-Meteo API, no API key. Use Python requests and pandas to fetch temperature, precipitation, wind speed, and cloud cover, clean the JSON into a dataframe, calculate daily min/max temperature and total precipitation, plot the 7-day temperature trend and precipitation by day, and end with a short explanation of what the forecast means for planning a weekend bike ride. Use markdown explanations and Python cells only."`.
    then:
      - The real chat response creates a `code-notebook` embed rather than a raw JSON code block.
      - The notebook is useful as a public product demo: it has a clear use case, explanatory markdown cells, Python-only code cells, and enough visual/content structure to validate preview and fullscreen UI.
      - The implementer inspects the real chat in CLI and web, confirms the notebook embed renders correctly, and rejects the candidate if the content is weak or the embed is malformed.
      - The selected real chat is shared through `openmates chats share <chat-id>` and converted with `scripts/create-example-chat-from-share.mjs`.
      - The resulting public example chat is deployed and verified at `/example/<slug>` so the user can validate notebook preview and fullscreen UI from stable demo content.

