schema_version: 2
id: code-notebook-embed
title: Code Notebook Embed And Python Execution
status: implementing

goal: >
  Let OpenMates create, render, and execute assistant-generated Jupyter
  notebooks as a first-class Code app embed. The canonical `.ipynb` notebook
  content stays encrypted and immutable unless the assistant edits source cells;
  user-triggered Python execution runs only in E2B and saves rich cell outputs in
  encrypted sidecars instead of mutating the notebook embed.

scope:
  in:
    - Add a `code-notebook` direct embed type for nbformat `.ipynb` content generated or updated in chat.
    - Render notebook previews as structured notebook cells, not raw JSON, including the first visible markdown/code cells and a cell count.
    - Render notebook fullscreen with markdown, code, raw cells, metadata summary, latest sidecar outputs, and run controls.
    - Support Python-only notebook execution in v1 through E2B when an authenticated user explicitly clicks Run.
    - Support run-all and targeted cell execution for Python code cells, with markdown/raw cells skipped.
    - Persist cell outputs, execution status, errors, timing, and saved_at metadata in encrypted notebook-run sidecars keyed by chat, notebook embed, and runner.
    - Keep source edits and output persistence separate: assistant diffs edit notebook cells; runtime outputs update only sidecars.
    - Apply existing Code Run billing, rate limits, cancellation/status/streaming patterns where practical.
    - Add sync/share payload support so saved outputs reload across the owner's devices without exposing plaintext in Directus.
    - Create a realistic natural-language OpenMates CLI chat against the dev API that asks for a Jupyter notebook, confirm the real chat creates the notebook embed as expected, and convert the successful source chat into a public example chat for UI validation.
    - Add Apple read-only notebook rendering parity in v1, with execution intentionally disabled unless the native Run UI is implemented behind the same API contract.
  out:
    - Executing R, Julia, Bash, JavaScript, SQL, or mixed-kernel notebooks in v1.
    - Mutating canonical `.ipynb` embeds just because a user ran cells.
    - Auto-running notebooks immediately after generation.
    - Persisting E2B filesystem state, variables, or kernel memory after the run completes.
    - Letting notebook code execute on OpenMates API, worker, browser, or Apple client hosts.
    - Public anonymous share-page notebook execution.
    - Full collaborative live kernels or multi-user simultaneous notebook sessions.
    - Importing arbitrary local notebooks from a user's filesystem in this first slice.
    - Hand-authoring or fixture-replaying the public notebook example chat instead of creating it from a real CLI chat.

