schema_version: 2
id: gpt-5-6-openai-model-variants
title: GPT-5.6 OpenAI Model Variants
status: verified

goal: >
  Add OpenAI GPT-5.6 Luna, Terra, Sol, and Sol Max as first-class `ai.ask`
  model choices while keeping OpenAI request payloads aligned with the official
  model IDs, reasoning-effort controls, pricing, and OpenMates billing metadata.

scope:
  in:
    - Provider catalog entries for `gpt-5.6-luna`, `gpt-5.6-terra`, `gpt-5.6-sol`, and `gpt-5.6-sol-max`.
    - "Direct OpenAI Chat Completions payload behavior for Sol Max, which routes to upstream `gpt-5.6-sol` with `reasoning_effort: max`."
    - "Explicit `reasoning_effort: medium` for the normal Sol catalog entry."
    - Token pricing and credit pricing derived from official OpenAI GPT-5.6 pricing.
    - Generated frontend model metadata and CLI mention parity for the new chat models.
    - Dev-server model listing and a low-cost chat smoke using the new provider metadata.
  out:
    - New REST API routes or changes to `/v1/chat/completions` auth, rate limits, or response schema.
    - Migrating OpenAI provider calls from Chat Completions to Responses API.
    - AI settings redesign, message input redesign, or visual layout work.
    - Apple app model-picker changes in this slice.
    - Changing default auto-selection rankings beyond allowing the new models to participate when configured.

context_discovery:
  github_issues:
    - "`gh issue list --search \"GPT-5.6 Luna Terra Sol OpenAI model catalog\" --limit 10` returned no matching issues."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/plans/openai-compatible-api/plan.yml
    - docs/architecture/ai/ai-model-selection.md
    - "https://platform.openai.com/docs/models: official model IDs include `gpt-5.6-luna`, `gpt-5.6-terra`, and `gpt-5.6-sol`."
    - "https://platform.openai.com/docs/guides/reasoning: OpenAI reasoning requests support a `reasoning_effort` control."
    - "https://platform.openai.com/docs/pricing: official GPT-5.6 token pricing used for provider metadata."
  code_patterns:
    - backend/providers/openai.yml is the source provider/model catalog for OpenAI-backed `ai.ask` models.
    - backend/apps/ai/llm_providers/openai_client.py builds direct OpenAI Chat Completions payloads and already treats GPT-5 models as reasoning models.
    - backend/apps/ai/utils/llm_utils.py resolves provider YAML `servers[].model_id` for generic server routing.
    - frontend/packages/ui/scripts/generate-models-metadata.js generates web model metadata from backend provider YAMLs.
    - frontend/packages/openmates-cli/src/mentions.ts keeps a hardcoded chat-model mention list in sync with generated model metadata.
  tests:
    - backend/tests/test_openai_tool_choice.py
    - backend/tests/test_model_selection.py
    - frontend/packages/openmates-cli/tests/mentions.test.ts

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple model-picker parity is not implemented in this slice; the changed catalog and direct provider payload behavior are backend/CLI/web-metadata surfaces.
  verification:
    - Apple not affected for this provider-catalog slice.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should Sol Max be a separate OpenMates model or just a runtime option on Sol?
      answer: "Treat Sol Max as a separate catalog variant that maps to upstream `gpt-5.6-sol` with `reasoning_effort: max`."
    - question: Should the existing OpenAI Chat Completions wrapper be migrated to Responses API for GPT-5.6?
      answer: No. Keep Chat Completions for this slice and add only the request fields needed for official GPT-5.6 reasoning variants.
  vision_summary: >
    The user wants the new OpenAI GPT-5.6 model family available as normal
    OpenMates `ai.ask` models, with official OpenAI docs used for IDs, pricing,
    and reasoning behavior. Sol Max is intentionally a convenience catalog alias,
    not a separate upstream model ID.
  approved_by_user: true

implementation_state:
  subject_commit: 86383a1bc145f0823bee83e5c2834c3d075f99c9

approvals:
  specification:
    status: approved
    approved_at: "2026-08-26T00:00:00Z"
    reason: The user asked to continue with the already-scoped next steps for adding the GPT-5.6 OpenAI model variants.
  plan:
    status: approved
    approved_at: "2026-08-26T00:00:00Z"
    reason: The implementation plan only updates provider metadata, request-shape handling, and parity checks for the approved model variants.

decisions:
  - id: D-1
    status: active
    decision: Represent Sol Max as OpenMates model ID `gpt-5.6-sol-max` while sending upstream model ID `gpt-5.6-sol` to OpenAI.
    reason: Official OpenAI docs list Sol as the upstream model and expose reasoning effort as request configuration; a separate OpenMates ID makes the high-reasoning variant selectable.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep direct OpenAI calls on Chat Completions for this slice.
    reason: The current OpenMates streaming pipeline and OpenAI-compatible `/v1` contract are Chat Completions based; migrating APIs is a larger separate contract.
    decided_at: "2026-08-26T00:00:00Z"
  - id: D-3
    status: active
    decision: Use official short-context OpenAI prices for the token billing metadata in this slice.
    reason: Existing provider YAML cost fields are single price-per-million-token records, and short-context pricing is the conservative default for ordinary chat requests.
    decided_at: "2026-08-26T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Research official OpenAI model, reasoning, and pricing docs before implementation.
    outcome: succeeded
    recorded_at: "2026-08-26T00:00:00Z"

handoff:
  current_task_id: TASK-4
  next_action: Complete; no further GPT-5.6 provider integration work is pending.
  command: python3 scripts/plan_verify.py docs/plans/gpt-5-6-openai-model-variants/plan.yml --phase complete --json
