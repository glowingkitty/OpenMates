implementation_notes:
  plan_path: docs/plans/gpt-5-6-openai-model-variants/plan.yml
  existing_patterns:
    - backend/providers/openai.yml
    - backend/apps/ai/llm_providers/openai_client.py
    - frontend/packages/ui/scripts/generate-models-metadata.js
    - frontend/packages/openmates-cli/src/mentions.ts
  architecture: >
    Add the new GPT-5.6 variants to the existing OpenAI provider YAML and teach
    the direct OpenAI wrapper to honor per-model upstream IDs and reasoning effort
    from provider metadata before dispatching Chat Completions requests.
  data_flow:
    - Provider YAML defines OpenMates model IDs, upstream server model IDs, costs, and optional reasoning effort.
    - Backend model listing and frontend metadata generation read the same provider YAML.
    - User-selected model IDs route through existing AI Ask/OpenAI dispatch.
    - The OpenAI wrapper sends the official upstream model ID and reasoning effort to the SDK.
  affected_files:
    - path: docs/plans/gpt-5-6-openai-model-variants/plan.yml
      reason: Durable provider integration contract and evidence ledger.
    - path: backend/providers/openai.yml
      reason: Source of truth for the new OpenAI model catalog entries and pricing.
    - path: backend/apps/ai/llm_providers/openai_client.py
      reason: Direct OpenAI request payload needs upstream model-id and reasoning-effort mapping.
    - path: backend/tests/test_openai_gpt56_models.py
      reason: Focused provider catalog and request-shape regression tests.
    - path: frontend/packages/openmates-cli/src/mentions.ts
      reason: CLI mention parity for chat-selectable models.
    - path: frontend/packages/openmates-cli/tests/mentions.test.ts
      reason: CLI mention regression coverage.
    - path: docs/architecture/ai/ai-model-selection.md
      reason: Document model catalog metadata fields relevant to reasoning-effort variants.
  verification_strategy:
