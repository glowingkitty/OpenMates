assumptions:
  - id: A-1
    text: Official OpenAI docs remain the source of truth for the GPT-5.6 model IDs and reasoning effort behavior.
    category: provider_docs
    required_before: implementation
    status: confirmed
    evidence:
      - source: https://platform.openai.com/docs/models
        summary: Official model docs list `gpt-5.6-luna`, `gpt-5.6-terra`, and `gpt-5.6-sol`.
      - source: https://platform.openai.com/docs/guides/reasoning
        summary: Official reasoning docs define request-level reasoning effort.
  - id: A-2
    text: The provider YAML `servers[].model_id` field should be honored for direct OpenAI calls when it differs from the OpenMates model ID.
    category: routing
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/apps/ai/utils/llm_utils.py
        summary: Generic provider routing already uses `servers[].model_id` to transform configured model IDs for server-specific calls.
  - id: A-3
    text: No privacy policy update is required because OpenAI is already an existing provider and this slice adds only model variants.
    category: privacy
    required_before: completion
    status: confirmed
    evidence:
      - source: backend/providers/openai.yml
        summary: OpenAI provider metadata and privacy policy URL already exist.

contracts:
  provider_catalog:
    - model_id: gpt-5.6-luna
      upstream_model_id: gpt-5.6-luna
      for_app_skill: ai.ask
      reasoning_effort: null
      pricing_source: official OpenAI short-context GPT-5.6 Luna pricing
    - model_id: gpt-5.6-terra
      upstream_model_id: gpt-5.6-terra
      for_app_skill: ai.ask
      reasoning_effort: null
      pricing_source: official OpenAI short-context GPT-5.6 Terra pricing
    - model_id: gpt-5.6-sol
      upstream_model_id: gpt-5.6-sol
      for_app_skill: ai.ask
      reasoning_effort: medium
      pricing_source: official OpenAI short-context GPT-5.6 Sol pricing
    - model_id: gpt-5.6-sol-max
      upstream_model_id: gpt-5.6-sol
      for_app_skill: ai.ask
      reasoning_effort: max
      pricing_source: official OpenAI short-context GPT-5.6 Sol pricing
  api:
    - route: GET /v1/models
      access_model: developer API-key REST API
      auth: Bearer OpenMates API key
      change: Existing route behavior only; model list gains new provider-prefixed IDs from provider metadata.
      rate_limits: Existing `/v1/models` rate limits remain unchanged.
      credit_budget: No credit charge for listing models.
      encryption_boundary: Does not accept or return client-side encrypted data or decrypted plaintext.
    - route: POST /v1/chat/completions
      access_model: developer API-key REST API
      auth: Bearer OpenMates API key
      change: Existing route behavior only; selecting the new model IDs routes through existing AI Ask/OpenAI provider dispatch.
      rate_limits: Existing chat-completions rate limits remain unchanged.
      credit_budget: Existing AI usage billing remains unchanged and uses provider token costs.
      encryption_boundary: Treats request messages as prompt content; no client-side encrypted chat/key/share material is accepted or returned by this change.
  privacy_security:
    - No new provider is added; OpenAI remains the processor for these OpenAI model IDs.
    - No new public unauthenticated endpoint is added.
    - Provider request logs must not include full user messages or secrets.

