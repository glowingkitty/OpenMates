  blocker: null
  last_verified_commit: 86383a1bc145f0823bee83e5c2834c3d075f99c9

scenarios:
  - id: S-1
    title: User selects a GPT-5.6 chat model
    given:
      - OpenMates loads provider metadata from `backend/providers/openai.yml`.
    when:
      - The AI Ask model catalog is generated or listed through model metadata.
    then:
      - Luna, Terra, Sol, and Sol Max appear as `ai.ask` text models from OpenAI.
      - Each model has OpenAI server routing, pricing, and reasoning-capability metadata.

  - id: S-2
    title: Sol Max maps to official OpenAI Sol with max reasoning
    given:
      - A user routes an AI Ask request to `openai/gpt-5.6-sol-max`.
    when:
      - OpenMates builds the direct OpenAI Chat Completions request.
    then:
      - "The payload uses upstream `model: gpt-5.6-sol`."
      - "The payload includes `reasoning_effort: max`."
      - "The normal Sol variant keeps upstream `model: gpt-5.6-sol` with `reasoning_effort: medium`."

  - id: S-3
    title: CLI and generated metadata stay in sync
    given:
      - The provider YAML contains the four new `ai.ask` models.
    when:
      - The frontend metadata generator and CLI mention resolver are checked.
    then:
      - Generated model metadata includes all four GPT-5.6 entries.
      - "CLI model mentions resolve each new GPT-5.6 display name to the matching `@ai-model:` wire syntax."

  - id: S-4
    title: Dev API exposes the new catalog entries
    given:
      - The change has been deployed to the dev API at `https://api.dev.openmates.org`.
    when:
      - An authenticated API-key client calls `/v1/models` and a low-cost chat request with a GPT-5.6 model.
    then:
      - "`/v1/models` includes the new provider-prefixed GPT-5.6 model IDs."
      - The chat request reaches the OpenAI provider path using the configured upstream model ID and reasoning effort.

