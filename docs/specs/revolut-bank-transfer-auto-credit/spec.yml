implementation_plan:
  spec_path: docs/specs/revolut-bank-transfer-auto-credit/spec.yml
  existing_patterns:
    - backend/core/api/app/routes/payments.py _handle_revolut_business_webhook owns settlement branching.
    - backend/scripts/approve_bank_transfer.py has the operator fallback settlement path.
    - backend/core/api/app/tasks/email_tasks/bank_transfer_reminder_email_task.py has the bank-transfer user email decryption pattern.
    - backend/shared/providers/revolut_business/oauth.py and client.py already implement token exchange and read-only client calls.
    - scripts/revolut_business_setup.py already proves /sandbox/topup shape but should not remain the long-term test contract.
  architecture: >
    Keep webhook matching in payments.py for the first slice, but isolate the new
    amount accumulation/classification helpers enough to test them deterministically.
    Extend pending_bank_transfers with durable transaction/idempotency summary
    fields instead of adding a separate table unless implementation discovery
    proves a normalized ledger is necessary.
  data_flow:
    - User starts a bank-transfer order and receives an OM reference.
    - Revolut sends a signed TransactionCreated webhook for incoming EUR money.
    - The handler matches the pending order by reference.
    - The handler ignores duplicate Revolut transaction IDs.
    - The handler appends the transaction amount to the order ledger and recomputes cumulative received amount.
    - If cumulative received is below expected, the order remains pending, expires_at extends 7 days, and remaining-payment email is queued.
    - If cumulative received is at least expected, existing settlement logic grants the selected personal/team/gift-card value and queues existing purchase confirmation.
    - If cumulative received exceeds expected, an overpayment email is additionally queued.
  affected_files:
    - path: docs/specs/revolut-bank-transfer-auto-credit/spec.yml
      reason: Durable product contract and evidence ledger.
    - path: backend/core/api/app/routes/payments.py
      reason: Revolut webhook settlement, amount classification, idempotency, and email task dispatch.
    - path: backend/core/directus/schemas/pending_bank_transfers.yml
      reason: Durable transaction ledger and surplus/remaining summary fields.
    - path: backend/core/api/app/services/cache_bank_transfer_mixin.py
      reason: Cache extra settlement fields for status polling and duplicate checks.
    - path: backend/core/api/app/tasks/email_tasks/bank_transfer_amount_notice_email_task.py
      reason: User-facing overpayment and underpayment emails.
    - path: frontend/packages/ui/src/i18n/sources/email/main.yml
      reason: Email template copy for bank-transfer amount notices.
    - path: backend/tests/test_bank_transfer.py
      reason: Core webhook and settlement coverage.
    - path: backend/tests/test_approve_bank_transfer_script.py
      reason: Fallback regression coverage.
    - path: scripts/api_tests/test_revolut_business_bank_transfer_settlement.py
      reason: Optional real Sandbox verification against the dev API.
    - path: backend/shared/providers/revolut_business/client.py
      reason: Optional Sandbox top-up helper for live provider testing.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/revolut-bank-transfer-auto-credit/spec.yml
    - python3 -m pytest backend/tests/test_bank_transfer.py backend/tests/test_approve_bank_transfer_script.py
    - python3 scripts/api_tests/test_revolut_business_bank_transfer_settlement.py --api-url https://api.dev.openmates.org --scenarios exact,overpaid,underpaid-complete when Vault/company Sandbox credentials are configured.
  verification_order:
    - Backend deterministic pytest first.
    - Spec validation before final handoff.
    - Optional Revolut Sandbox live provider proof after backend code is deployed to the local dev API and company credentials/webhook are configured.

