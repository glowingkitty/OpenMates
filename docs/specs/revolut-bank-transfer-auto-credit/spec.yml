schema_version: 2
id: revolut-bank-transfer-auto-credit
title: Revolut Bank Transfer Auto Credit
status: implementing

goal: >
  Automatically settle Revolut Business SEPA bank-transfer credit purchases when
  incoming transactions match an OpenMates bank-transfer reference, including
  overpaid and underpaid orders, without requiring manual admin confirmation for
  normal mismatches.

scope:
  in:
    - Personal credit-purchase bank-transfer orders.
    - Team credit-purchase bank-transfer orders.
    - Gift-card bank-transfer purchase orders.
    - Accumulating multiple Revolut transactions with the same OpenMates reference.
    - User email notifications for overpayments and underpayments.
    - Revolut Sandbox verification via /sandbox/topup when company credentials are available.
  out:
    - Support-contribution bank-transfer automation changes.
    - Automatically upgrading users to a larger credit pack when they overpay.
    - Automatically refunding surplus money.
    - Production Revolut writes outside normal incoming-transfer webhook processing.
    - Web UI redesign for bank-transfer status.
    - Self-hosted credit-sale or support-contribution bank-transfer endpoints.

context_discovery:
  github_issues:
    - "GitHub MCP returned 401. Fallback `gh issue list --repo glowingkitty/OpenMates --search \"bank transfer Revolut credits overpaid underpaid partial payment\" --state all --limit 10` found no matching issue."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/payments/payment-processing.md
    - docs/specs/bank-transfer-invoice-visibility/spec.yml
    - docs/specs/cli-signup-billing-provisioning/spec.yml
    - docs/apis/revolut-business.md
    - https://developer.revolut.com/docs/guides/manage-accounts/api-usage-and-testing/test-flows-with-simulations
  code_patterns:
    - backend/core/api/app/routes/payments.py
    - backend/core/api/app/services/payment/revolut_business_service.py
    - backend/core/api/app/services/cache_bank_transfer_mixin.py
    - backend/core/directus/schemas/pending_bank_transfers.yml
    - backend/scripts/approve_bank_transfer.py
    - backend/shared/providers/revolut_business/client.py
    - backend/shared/providers/revolut_business/oauth.py
    - scripts/revolut_business_setup.py
  tests:
    - backend/tests/test_bank_transfer.py
    - backend/tests/test_approve_bank_transfer_script.py
    - backend/tests/test_cli_bank_transfer_gift_card_purchase.py
    - backend/tests/test_teams_routes.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple billing uses native StoreKit-oriented flows and does not own the web SEPA bank-transfer settlement path.
  verification:
    - Apple not affected for this backend settlement slice.
  intentional_native_differences:
    - Native apps are not expected to initiate or render SEPA bank-transfer status changes in this slice.

clarification:
  rounds:
    - question: Should underpaid follow-up transfers be linked by the same OpenMates bank-transfer reference rather than the same Revolut transaction ID?
      answer: Yes, use the same bank-transfer reference.
    - question: Should overpayments ever upgrade the selected credit pack automatically?
      answer: No. Credit only the selected pack and ask the user to contact support about surplus money.
    - question: Should the behavior apply only to personal credit purchases or also team and gift-card bank-transfer orders?
      answer: Apply it to personal, team, and gift-card bank-transfer purchases.
    - question: Should an underpaid order keep the original 7-day expiry or extend when partial money arrives?
      answer: Extend the deadline by 7 days.
    - question: Should testing use Revolut Sandbox and can existing Revolut Business code be reused?
      answer: Use deterministic tests first plus Revolut Sandbox for live verification; reuse shared Revolut OAuth/client code with company Vault credentials rather than the Finance skill runtime.
  vision_summary: >
    Matched Revolut Business incoming transfers should be handled automatically
    when the OM reference identifies a pending personal, team, or gift-card
    credit purchase. The selected pack is the contract: enough money grants that
    pack, surplus is handled with support by email, and short payments accumulate
    under the same reference until the expected price is reached.
  approved_by_user: true

