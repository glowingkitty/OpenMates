risks:
  - Duplicate webhook retries can create financial over-crediting if transaction ID idempotency is incomplete.
  - Directus schema changes need migration/deployment coordination before live provider webhooks rely on new fields.
  - Email decryption can fail if the original order lacks email_encryption_key and the user lacks server-side email fallback.
  - Revolut Sandbox webhook delivery depends on external configuration and may not be reliable enough for default CI.

open_questions:
  - Should support-contribution overpayments/underpayments get similar user emails in a later slice?
  - Should Billing > Invoices eventually display partial paid/remaining amount state before completion?
