contracts:
  api:
    - route: POST /v1/payments/webhook
      access_model: unauthenticated provider webhook with signed Revolut or Stripe headers
      auth: Revolut requests require Revolut-Request-Timestamp and Revolut-Signature HMAC verification.
      rate_limits: Provider webhook route has no normal user rate limit; signature verification and idempotency protect repeated delivery.
      credit_budget: Credits are granted only for matching pending credit-purchase, team-credit-purchase, or gift-card-purchase orders whose cumulative received amount reaches amount_expected_cents.
      encryption_boundary: Uses stored user_id, vault_key_id, encrypted balance, and email_encryption_key; does not expose client-side encrypted chat/memory/file material.
      behavior: Match Revolut TransactionCreated events by OM reference and classify cumulative EUR amount as underpaid, funded/exact, or overpaid.
    - route: POST /v1/payments/create-bank-transfer-order and related bank-transfer status/support endpoints
      access_model: first-party official-cloud client surface only
      auth: Authenticated user session is required for credit-purchase order creation and status reads; support-contribution creation is public but official-cloud-only.
      rate_limits: Existing endpoint limits apply.
      credit_budget: No credits are granted by these creation/status endpoints; credits are granted only by signed provider webhooks or operator scripts.
      encryption_boundary: Stores encrypted email key material for cloud billing emails only; no client-side encrypted chat/memory/file material is exposed.
      behavior: Self-hosted domains receive 404 or hidden bank-transfer availability even if local Revolut-like secrets are present.
  data:
    - pending_bank_transfers records cumulative received_amount_cents, latest revolut_transaction_id, and a durable transaction ledger/idempotency field for all matched Revolut transaction IDs.
    - Underpaid rows remain status pending and extend expires_at by 7 days from the latest partial receipt.
    - Completed rows store overpaid_amount_cents when cumulative received exceeds amount_expected_cents.
    - Directus remains the durable store; Redis cache is updated with the same settlement summary fields when available.
  ui_states:
    - Existing bank-transfer status polling can continue to show pending until enough cumulative money arrives.
    - No new web UI is required for surplus or remaining amount in this slice; email is the user-facing mismatch channel.
  privacy_security:
    - Do not store or log full Revolut counterparty data for these flows.
    - Do not include raw user IDs, Vault keys, email encryption keys, or Revolut credentials in user emails, logs, or Sandbox evidence.
    - Support email link is mailto:support@openmates.org or equivalent safe text.
    - Idempotency must prevent replayed provider webhooks from granting duplicate credits or gift cards.
  provider:
    - Reuse shared Revolut OAuth/client code for company-level Sandbox probes, but do not reuse user connected-account refresh token envelopes from the Finance app skill.
    - Company Revolut credentials come from Vault or explicit operator env for manual Sandbox verification.

