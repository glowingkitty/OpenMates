decisions:
  - id: D-1
    status: active
    decision: Match incoming money by the OpenMates bank-transfer reference, not Revolut transaction ID.
    reason: Follow-up underpayment transfers get new Revolut transaction IDs but can reuse the same OM reference.
    decided_at: "2026-07-22T00:00:00Z"
  - id: D-2
    status: active
    decision: Credit exactly the selected purchased pack when cumulative received money is at least the expected pack price.
    reason: User explicitly rejected automatic pack upgrades on overpayment.
    decided_at: "2026-07-22T00:00:00Z"
  - id: D-3
    status: active
    decision: Use deterministic signed webhook tests as required evidence and Revolut Sandbox /sandbox/topup as live provider evidence when credentials are configured.
    reason: Sandbox proves provider integration but is too credential- and webhook-dependent for default CI.
    decided_at: "2026-07-22T00:00:00Z"
  - id: D-4
    status: active
    decision: Expose bank-transfer credit-sale endpoints only on the official cloud deployment.
    reason: Self-hosted OpenMates must not ask instance users to send money to buy OpenMates credits; the operator-only manual script remains available for official-cloud fallback handling.
    decided_at: "2026-07-23T00:23:07Z"

