risks:
  - Plan scope can become too broad if V1 tries to implement every app-specific planner at once; V1 should add the generic openmates.plan and wire existing code.project_planner first, then add more app planners incrementally.
  - Anti-drift can be annoying if too sensitive; thresholds must allow intentional user pivots and ask whether to update the plan when scope changes.
  - AI evaluation can produce false confidence; critical criteria require deterministic checks or user confirmation.
  - Client-encrypted plan data limits server-side search and routing; V1 should keep server-visible metadata sparse and explicit.
  - Verification tasks may clutter task boards; UI should visually distinguish work tasks from verification tasks while keeping them assignable and actionable.
  - Chat header can become overloaded; V1 should only show plan title/current task and navigation, with details in the Tasks tab.
  - Requiring learnings can create low-value filler if agents are not instructed to merge or reject weak observations; completion should allow only 1-5 finalized entries and UI/CLI should encourage concise, actionable learnings.
  - Learning task drafts could become a backdoor for unsafe instruction changes; create-tasks must route changes through normal tasks and scan drafts rather than mutating workflows or instructions directly.

open_questions:
  - resolved: Ship only code.project_planner plus generic openmates.plan in the CLI/SDK-first implementation slice; other app-specific planners are later app-by-app follow-up specs.
  - resolved: If @plan is used in a chat with an existing active plan, ask whether to update the existing plan or create a new draft; CLI non-interactive use may pass --update-active or --new-plan.
  - resolved: Defer Project-page plan-card UI work for this slice; keep API, CLI, and SDK data ready without requiring new web UI.
  - resolved: Do not set a global AI evaluation threshold default in V1; each qualitative AI Check must specify a threshold to block completion, otherwise it is advisory/non-blocking.
  - resolved: Tasks created from Learnings default to backlog when the task model supports it, otherwise todo with source_plan_id and source_learning_id provenance.
