id: plans-v1
title: Plans V1
status: implementing

goal: >
  Add a durable privacy-preserving Plans product model that lets users and
  assistants turn complex natural-language requests into structured plans with
  tasks, optional user flows, acceptance criteria, verification checks,
  anti-drift guardrails, and project/chat context. Plans must work for coding, research, document work,
  electronics, social media, personal projects, and other multi-step workflows;
  they must remain available to the assistant even after chat compression.

scope:
  in:
    - A separate durable Directus plan model, distinct from user-facing tasks and chat messages.
    - Client-encrypted durable plan content, including title, goal, scope, optional user flows, assumptions, open questions, decisions, risks, phases, steps, acceptance criteria, verification instructions, and evaluation rubrics.
    - First-class encrypted reference patterns that identify existing docs, design guidelines, source files, components, tests, naming conventions, visual patterns, and anti-patterns the assistant must inspect and follow before implementation.
    - One unique client-generated symmetric plan key per plan, with owner/master, primary chat, and linked-project access following the same client-side envelope-encryption model as chats, embeds, projects, and tasks.
    - Short-lived Vault-encrypted active-plan execution context for plans attached to active chats so assistant planning/execution context survives compression without durable plaintext.
    - Minimal server-visible metadata for ownership, chat/project linking, ordering, status, versioning, active-step routing, and safe assistant orchestration.
    - A new product API namespace under /v1/user-plans.
    - Plan creation from explicit @plan, generic /goal and CLI --goal aliases, explicit CLI plan commands, and natural-language auto-detection.
    - Planner focus-mode routing with app-specific planner focus modes where applicable and a generic OpenMates plan focus mode as fallback.
    - Clarifying-question flow where planner focus modes ask one high-value question at a time and wait for the user's answer before asking the next.
    - Durable plan activation and deactivation where plan focus mode exits only after user approval, required pre-implementation assumptions are confirmed/corrected/waived, corrected assumptions are applied, and required checks are normalized.
    - No automatic plan execution by default; execution starts only after explicit user approval, except CLI/autonomous flows that pass an explicit --autoconfirm-style flag and still satisfy safety, assumption, and check gates.
    - Every executable or active plan has a primary chat that acts as the plan command center; standalone manually created plans may remain draft-only until attached to a chat.
    - Plan injection into assistant context as protected active-plan context for every active plan turn, not only after chat compression, so the assistant always sees the current plan regardless of compressed chat history.
    - Chat header state that shows the active plan title before execution and the current task title during execution, with previous/next task navigation.
    - Chat details/settings Tasks tab showing a Plan section above linked tasks and verification tasks.
    - Project plan management surfaces similar to project chat management, including plan cards, status, progress, linked chat, linked tasks, and open-plan actions.
    - Plan-created code/document/sheet/mail/Remotion artifacts use the existing diff-based embed editing contract: small assistant edits target the existing embed ref, patch the same parent embed, increment version_number, and append encrypted embed_diffs rows rather than creating duplicate Project items.
    - Projects, plans, tasks, and workflows can be linked to actual OpenMates app IDs such as code, finance, electronics, business, design, docs, or workflows so UI color/icon treatment and assistant routing reuse app metadata instead of inventing a separate taxonomy.
    - Preprocessing receives only privacy-minimized workspace context metadata from the client, grouped by object kind and OpenMates app ID, without object titles, descriptions, IDs, counts, statuses, timestamps, or plaintext content.
    - A unified encrypted-context permission flow can request client-decrypted memories, projects, plans, tasks, and workflows by app ID, replacing the memory-only request path over time while preserving explicit user approval and bounded context limits.
    - Shared chat exports include active/chat-primary plans by default as read-only shared plan context; plan decrypt authority is carried in the share URL fragment payload, matching the existing chat/embed share-link pattern.
    - Acceptance criteria as structured machine-processable plan records with user-facing natural-language descriptions.
    - Reference-pattern enforcement so implementation plans can require matching existing UI, API, CLI, SDK, test, or documentation structure instead of relying on generic LLM style.
    - Acceptance criteria verification policy requiring every required criterion to map to explicit checks, user confirmation, waiver, or blocker before completion.
    - Assumptions as structured machine-processable factual statements for any kind of plan, based on initial user answers plus quick research in approved project data, uploaded content, prior context, or online sources; when required, they must be checked, corrected, waived, or explicitly blocked before the dependent phase starts.
    - Hardcoded deep assumption verification through dedicated sub-chats for each required assumption unless an explicit grouping rule applies, with each result linked back to source evidence such as embeds, code/text line anchors, prior chats, or quoted web/search sources.
    - Verification records for automated tests, deterministic checks, AI evaluator sub-chats, user confirmation, manual checks, and artifact reviews.
    - Each check includes a user-facing natural-language description of what it verifies before a test/script/evaluator is created.
    - AI validation checks that link to an existing evaluator sub-chat with explicit evaluator instructions instead of pretending to be deterministic test runs.
    - Runnable test-file checks that execute in isolated sandbox runners and expose structured run details with source, output, screenshots, video, traces, logs, steps, and environment metadata when produced by the runner.
    - Verification tasks that appear in the regular Tasks view, can be assigned to AI or user, and link back to acceptance criteria.
    - Finalized plan learnings that capture 1-5 workflow or project agent-instruction improvements before a plan can be completed.
    - One encrypted suggested task draft per learning, materialized into a normal user_tasks row only when the user or assistant explicitly creates tasks from learnings.
    - Learning provenance from materialized tasks back to the source plan and source learning so future agents can see why the improvement task exists.
    - Multi-phase plan processing: draft, check assumptions, await approval, work tasks, run checks, loop back to tasks when checks fail, and complete only when required evidence is satisfied or waived.
    - Test-first enforcement for coding checks: planned deterministic test/check files are created and red-run before implementation when feasible; passed_unexpectedly, skipped_with_reason, or not_applicable must be explicitly recorded with rationale.
    - Required green/final verification evidence before a plan or task can be marked done.
    - Anti-drift detection that steers the assistant back to the active plan/task or stops to ask the user when the assistant drifts too far from the original objective.
    - Anti-drift correction messages sent to the LLM as user-role messages while rendered in the UI as system/status messages.
    - Retention and cleanup policies for completed/archived plans, plan key wrappers, and expired active-plan execution contexts.
    - CLI, npm SDK, and pip SDK contracts for plan creation, listing, updates, acceptance criteria, verification evidence, and active-plan lookup before web E2E verification.
  out:
    - Fully collaborative team/shared plans in V1.
    - Public plan sharing in V1.
    - Defaulting user plan checks to GitHub Actions or repo CI; connected-repository CI can be a future explicit integration, but plan-authored checks use OpenMates-managed sandbox runs by default.
    - Server-side decryption of durable plan title, goal, scope, criteria, verification prompts, evidence, or plan notes.
    - Server-side full-text search over encrypted private plan content.
    - Unlimited dependency graphs or arbitrary workflow engines beyond simple ordered phases, steps, and task/criterion links.
    - Automatic execution of high-stakes remote filesystem writes, shell commands, payments, or account mutations without later permission specs.
    - Native Apple plan UI implementation in the first web/API slice, although the spec records expected parity.
    - Directly modifying workflow definitions, hooks, global agent instructions, or project agent instructions when a learning is recorded.
    - Auto-executing learning improvement tasks or creating recursive improvement plans from learning records in V1.
    - Building Mac/Xcode, electronics CAD, or hardware-control automation in V1; these can be represented as user-confirmed verification tasks.
    - Sending project, plan, task, workflow, or memory titles/descriptions/details to the chat LLM merely because app-level workspace metadata exists; details require explicit mention or user approval.
    - Exposing workspace object counts to preprocessing by default, because counts can reveal more than app-level existence.

context_discovery:
  github_issues:
    - "#442 Design a plan view for multi-step chats: directly asks for plan data model, UI placement, step status, requirements, task/sub-chat links, and focus-mode constraints."
    - "#447 Design planning, tasks, projects, and permissions for agentic coding: broader foundation for planning, task management, Projects 2.0, permissions, and remote access."
    - "GitHub MCP issue reads returned 401 bad credentials in prior discovery; gh issue list/view was used instead."
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/planning.md
    - docs/specs/tasks-v1/spec.yml
    - docs/specs/projects-remote-sources/spec.yml
    - docs/specs/workflows-v1/spec.yml
    - docs/specs/interactive-questions-parity/spec.yml
    - docs/specs/apple-sub-chat-focus-parity/spec.yml
    - docs/design-guide/settings-ui.md
    - docs/user-guide/apps/code.md
  code_patterns:
    - backend/core/api/app/utils/override_parser.py supports explicit @focus overrides and should add @plan as a first-class shorthand rather than requiring users to type @focus:code:project_planner.
    - backend/apps/code/app.yml already defines code.project_planner as an app-specific planning focus mode.
    - frontend/packages/ui/src/data/appsMetadata.ts mirrors Project Planner focus-mode metadata for the web app.
    - backend/apps/ai/tasks/ask_skill_task.py applies explicit focus-mode overrides after preprocessing.
    - backend/apps/ai/processing/main_processor.py injects active focus prompts and owns focus-mode activation/deactivation tool behavior.
    - backend/apps/ai/processing/chat_compressor.py replaces older message history with compression summaries; plans therefore cannot live only as chat message text.
    - backend/core/directus/schemas/chat_compression_checkpoints.yml stores client-encrypted compression checkpoint summaries; Plans V1 should use separate durable plan storage and active-plan context injection.
    - backend/core/directus/schemas/user_tasks.yml and backend/core/api/app/routes/user_tasks.py define the existing privacy-preserving task model that Plans V1 should link to rather than duplicate.
    - backend/apps/ai/processing/preprocessor.py already accepts app_settings_memories_metadata from the client and validates requested memory keys before the main processor asks for encrypted context.
    - backend/apps/ai/processing/main_processor.py and backend/core/api/app/utils/app_settings_memories_request.py implement a permission-gated request/confirm/continue flow for client-decrypted app settings and memories that should be generalized for workspace context.
    - frontend/packages/openmates-cli/src/client.ts already advertises memory metadata and can auto-approve requested memories with --auto-approve-memories, but it needs a generalized encrypted-context approval surface for projects, plans, tasks, workflows, and memories.
    - frontend/packages/ui/src/components/enter_message/services/mentionSearchService.ts resolves project mentions client-side, which supports the explicit-mention-consent pattern for workspace objects.
    - backend/shared/python_schemas/app_metadata_schemas.py and backend/apps/*/app.yml provide canonical app IDs, app categories, icons, and focus metadata that should drive workspace object classification and UI color/icon treatment.
    - frontend/packages/ui/src/components/tasks/ActiveChatTaskPreview.svelte shows the existing top-of-chat task preview pattern that Plans V1 extends for plan/title/current-task header state.
    - frontend/packages/ui/src/components/tasks/TasksPage.svelte, TaskBoard.svelte, and TaskCard.svelte provide the reusable task surfaces that verification tasks should appear in.
    - frontend/packages/ui/src/components/settings/elements provides canonical settings components for chat details/settings plan and tasks sections.
  tests:
    - backend/tests/test_user_tasks_api.py
    - backend/tests/test_user_tasks_scheduler.py
    - frontend/packages/openmates-cli/tests/tasks.test.ts
    - frontend/packages/openmates-cli/tests/sdk-tasks.test.ts
    - packages/openmates-python/tests/test_tasks.py
    - frontend/apps/web_app/tests/projects-flow.spec.ts
    - frontend/apps/web_app/tests/sub-chats-flow.spec.ts
    - frontend/apps/web_app/tests/feature-availability.spec.ts
  external_research:
    - "Martin Fowler SDD tool comparison: distinguishes spec-first, spec-anchored, and spec-as-source; highlights requirements, design, tasks, planning, research, and memory banks."
    - "Addy Osmani AI-agent spec guidance: good specs need boundaries, testing, commands, project structure, code style, git workflow, always/ask-first/never guardrails, and clear enough detail without overlong prompts."
    - "Augment SDD guide: specifications act as executable contracts with outcomes, scope boundaries, constraints, decisions, task breakdown, and verification criteria."
    - "Atlassian software design document guidance: useful sections include overview, architecture, data design, interface design, UI design, assumptions/dependencies, glossary, traceability, and current central storage."

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Chat/ChatView.swift
    - apple/OpenMates/Sources/Chat/ChatHeaderView.swift
    - apple/OpenMates/Sources/Tasks/TaskBoardView.swift
    - apple/OpenMates/Sources/Projects/ProjectDetailView.swift
    - apple/OpenMates/Sources/Core/Networking/OpenMatesAPIClient.swift
  parity_expectations:
    - Apple should eventually list active plans, show active plan/task header state, display project-linked plans, and handle user-assigned verification tasks through the same /v1/user-plans and /v1/user-tasks contracts.
    - Apple must preserve the same client-side encryption model for durable plan content.
    - Apple may defer rich plan editing in the first native slice if it can show active plan/task state and user verification tasks accessibly.
  verification:
    - Run or attempt python3 scripts/apple_remote.py status when Apple task or chat header UI is implemented.
    - Run or attempt python3 scripts/apple_remote.py build-ios after shared API clients or native UI are touched.
  intentional_native_differences:
    - Native may use compact disclosure sections instead of the full web chat settings tab layout.

clarification:
  rounds:
    - question: Should plan mode be explicit, automatic, or both?
      answer: >
        Both. A user must always be able to type @plan to trigger plan mode.
        The assistant should also auto-detect complex natural-language requests
        that need planning.
    - question: Should Plans V1 be only for coding or for broader tasks?
      answer: >
        Plans must work beyond code: research, project planning, documents,
        electronics, social media, personal workflows, and other complex tasks.
    - question: Should there be one generic plan focus mode or app-specific planners?
      answer: >
        Prefer app-specific planner focus modes when the domain matches. Add a
        generic Plan focus mode to the OpenMates app for complex workflows that
        do not match an existing app.
    - question: Where should a chat plan be shown?
      answer: >
        Show the plan inside the chat Tasks tab as the top Plan section. The
        active chat header should show the plan title before execution starts and
        the currently worked task once execution begins.
    - question: How should acceptance criteria, tests, and AI evaluation work?
      answer: >
        Acceptance criteria should be processable structured records. Verification
        checks/tests should be explicit runnable commands or user-confirmed checks
        whenever possible, and can become regular task items assigned to AI or
        user. Coding work should support red/green tests, but red phase should be
        flexible when initial tests unexpectedly pass. Green/final deterministic
        verification is the hard requirement. AI evaluation can use numeric scores
        and thresholds only for qualitative review or first-pass checking; it
        must not replace deterministic tests when test files or static checks can
        be defined. Failed required checks keep the plan active and force
        continuation until they pass, are completed by the assigned user, or are
        explicitly waived.
    - question: How should anti-drift correction work?
      answer: >
        The system should detect when the assistant gets distracted or moves too
        far away from the active plan/task. Correcting messages should be sent to
        the LLM as user-role messages for steering strength, while rendered in the
        UI as system messages.
    - question: Should /goal be coding-specific or a generic shortcut?
      answer: >
        /goal is generic, not coding-specific. It is a low-friction alias for
        creating a valid minimal Plan with goal, primary chat, current focus,
        success criteria or checks when available, and continuation policy. It
        uses the same durable encrypted Plans model and can be expanded into a
        richer Plan later.
    - question: When should planning mode exit and execution begin?
      answer: >
        A draft plan is presented for user approval before assumption checking
        starts, so the user can reject or manually edit the plan before spending
        more tokens. After approval, required pre-implementation assumptions are
        checked through sub-chats or verification tasks, corrected assumptions are
        applied to the plan, required checks are normalized, and only then does
        planning mode exit into execution. Plans never auto-execute by default;
        CLI/autonomous flows need an explicit autoconfirm flag and still obey
        safety, assumption, and check gates.
    - question: What are the core user-visible plan sections?
      answer: >
        The user-visible plan sections are Goal, Current focus, Tasks, Success
        Criteria, User Flows, Checks, Scope in, Scope out, Assumptions, Open
        questions, Constraints, Decisions, Risks, Reference Patterns, Context,
        and Activity. Tasks are actual user_tasks records linked to the plan so
        users can see all tasks across chats and plans. Check evidence is not a
        separate top-level UI section; it is displayed inside each Check.
        Reference Patterns are first-class because the assistant must know which
        existing files, docs, components, tests, visual systems, or examples to
        match before implementation starts.
    - question: Can newly discovered checks or reference patterns become blocking during execution?
      answer: >
        Newly discovered checks and reference patterns default to proposed, not
        blocking, so the user is not surprised by contract changes. They may
        auto-block without additional approval only for privacy, security, legal,
        destructive-action, repo-rule, approved-spec-rule, failed-required-check,
        missing-required-input, or contradicted-assumption cases. Otherwise the
        user must approve making them required.
    - question: How should execution learnings improve future workflows and agent instructions?
      answer: >
        Plan execution should produce 1-5 finalized learnings before completion.
        V1 learnings focus on workflow improvements and project agent-instruction
        improvements. Each learning can carry one encrypted suggested task draft;
        creating tasks from learnings materializes those drafts as regular tasks
        with provenance back to the source plan and learning. Learnings must not
        directly mutate workflows, hooks, or agent instructions in V1.
    - question: What does CLI --autoconfirm approve?
      answer: >
        --autoconfirm may approve the generated plan, assumption/check workflow,
        and implementation/code changes by default for local/dev-safe coding work
        when required checks and permissions are satisfied. It must not allow
        production changes, payments, destructive deletes, credential changes,
        external account mutations, or other high-risk actions without a separate
        explicit permission flag or future permission spec.
    - question: How should natural-language planning focus mode activate?
      answer: >
        Use the existing focus metadata and preprocessor LLM selection path rather
        than hardcoded keyword routing. The code-planning focus mode should expose
        clear preprocessor guidance, be validated with multiple real multilingual
        chat tests for true positives and false positives, and remain cancellable.
        If the user cancels focus mode, the assistant loses plan-creation skills
        and continues with an ordinary response strategy.
    - question: When should a natural-language planning request create a Plan?
      answer: >
        The focus mode should first ask one interactive clarifying question at a
        time, including examples and a recommended answer. A draft Plan is created
        only after enough scope, target, and success criteria exist. The delayed
        focus-mode activation pattern used by web must also work in CLI.
    - question: How should Projects be selected or created for code-building Plans?
      answer: >
        Code-building Plans should always create or link a Project, but the
        assistant should not receive all project details by default. The client
        sends app-level workspace metadata to preprocessing, then the main
        processor requests relevant Project details through a permission prompt,
        unless the user explicitly mentions a specific Project.
    - question: How should Projects, Plans, Tasks, Workflows, and Memories be represented for assistant context and UI grouping?
      answer: >
        Use actual OpenMates app IDs as the taxonomy. Projects, Plans, Tasks, and
        Workflows should have a primary_app_id and optional secondary_app_ids so
        the web UI can use app icons/colors and the assistant can request context
        by app. Preprocessing should see only object-kind to app-ID availability,
        with no object counts or details. Main processing should use a unified
        encrypted-context request that can ask for bounded recent memories,
        projects, plans, tasks, or workflows grouped by app, and details are sent
        only after user approval or explicit mention consent.
    - question: What are assumptions for Plans, and how should they be verified?
      answer: >
        Assumptions are factual statements for any plan domain, not just software.
        They are initially saved from user answers and quick research in approved
        project data/content or online sources. Required assumptions trigger a
        hardcoded verification phase that spawns dedicated deep-investigation
        sub-chats, normally one per assumption, so each assumption receives proof
        links such as embeds, source file or text line anchors, prior-chat links,
        or website/search-result quotes. Grouping is allowed only when assumptions
        share the same source and cannot be checked independently.
    - question: How should public CLI and SDK names describe plan activation, criteria, and verification?
      answer: >
        Do not expose activate as the primary user-facing verb. Active means the
        plan is attached to a chat or project execution context and selected as
        the current command-center plan. Public CLI and SDK names should use
        attach for linking an existing plan to a chat or project and start or
        resume for entering execution mode. Success Criteria and Checks are
        plan sections/fields, not separate user concepts named criteria and
        verification. Public commands should therefore edit `success-criteria`
        and `checks`; lower-level API or storage names may still use acceptance
        criteria and verification records as implementation terms.
    - question: How should Open questions gate plan implementation?
      answer: >
        Required Open questions must be asked as interactive questions before a
        plan can start implementation. The assistant asks them one at a time,
        includes examples and a recommended answer when useful, records the
        answer into the Plan, and updates affected fields before start. Optional
        Open questions may remain on the Plan, but required questions must be
        answered, waived with a visible reason, or converted into an explicit
        accepted blocker before implementation tasks begin.
  vision_summary: >
    Plans V1 is the durable coordination layer above chats and tasks. Plan focus
    modes create structured plans through one-question-at-a-time clarification,
    users approve or edit drafts before assumption checking, plans stay visible in
    their primary chat and project UI, tasks and verification items execute against
    structured acceptance criteria, and anti-drift plus deterministic continuation
    guardrails keep the assistant aligned with the user's original goal until the
    plan is complete or honestly blocked.
  approved_by_user: true

scenarios:
  - id: S-1
    title: User explicitly starts generic planning with @plan
    given:
      - Alice is logged into the web app and is in a normal chat.
      - Alice types "@plan Help me plan a 60-person community workshop in Berlin".
    when:
      - The message is sent.
      - The planner needs more information about date, budget, audience, accessibility, and language.
    then:
      - "@plan is removed from the user-visible prompt text after parsing."
      - The generic OpenMates Plan focus mode activates for this planning request.
      - The assistant asks one clarifying question, waits for Alice's answer, and does not ask a batch of unrelated questions at once.
      - A durable draft plan is created after enough context exists and is attached to the current primary chat.
      - Alice can edit or reject the draft plan before any assumption sub-chat, verification task, or implementation work starts.
      - The plan appears at the top of the chat Tasks tab and the chat header shows the plan title before any task starts.

  - id: S-2
    title: Natural language routes to an app-specific planner
    given:
      - Alice asks "Help me plan and implement password-protected shared chats" without typing @plan.
      - The Code app has the project_planner focus mode enabled.
    when:
      - The preprocessing layer classifies the request as a complex coding feature.
    then:
      - The request routes to the Code Project Planner focus mode.
      - The assistant explains that it will plan first because the request is multi-step and user-facing.
      - The plan contains coding-specific user flows when useful, acceptance criteria, verification tests, risks, and implementation tasks.
      - Alice approves or edits the draft plan before assumption checking starts.
      - The plan exits planner focus mode only after required pre-implementation assumptions are resolved, corrections are applied, and required checks are normalized.

  - id: S-3
    title: Durable plan survives chat compression
    given:
      - Alice has a long chat with an active plan and linked tasks.
      - The chat history exceeds the compression threshold.
    when:
      - Chat compression replaces older messages with a compression summary.
      - Alice sends "Continue".
    then:
      - The assistant receives a protected active-plan context block separate from compressed message history.
      - The active plan title, current step, open acceptance criteria, and verification blockers remain available to the assistant.
      - The plan content is not lost or degraded by compression summaries.

  - id: S-4
    title: Plan creates linked tasks and verification tasks
    given:
      - Alice approves a plan for a research report comparing open-source vector databases.
    when:
      - The assistant creates the plan execution tasks.
    then:
      - Regular work tasks are created for source collection, comparison, and recommendation writing.
      - Verification tasks are created for citation count, source freshness, structured comparison completeness, and AI rubric evaluation.
      - Verification tasks appear in the regular Tasks view with type verification and link back to the plan acceptance criteria.

  - id: S-5
    title: Coding plan supports flexible red phase and required green phase
    given:
      - Alice approves a plan for a new user-facing coding feature.
      - The plan includes a backend pytest and a Playwright spec.
    when:
      - The assistant proposes a natural-language description for each deterministic check before creating test code.
      - Alice confirms or edits the check descriptions.
      - The assistant creates or runs the tests before implementation.
      - One red-phase test unexpectedly passes because adjacent behavior already exists.
    then:
      - The test/check file content hash, command, and red-phase run are recorded before implementation tasks are allowed to start.
      - The red-phase evidence records passed_unexpectedly with a reason.
      - The assistant either adjusts the test if coverage is inadequate or proceeds if the test still validates the missing behavior.
      - The plan is not blocked solely because red phase did not fail.
      - The plan cannot be marked done until required green/final checks pass and evidence is attached.

  - id: S-6
    title: AI evaluation enforces qualitative criteria
    given:
      - Alice asks for a research plan output with criteria for neutrality, source quality, and recommendation usefulness.
      - The plan defines an AI evaluation threshold of 85.
    when:
      - The assistant finishes a draft report.
      - The AI evaluator scores the result 78 because licensing comparison is missing.
    then:
      - The verification record is marked failed.
      - A system-rendered correction message is shown in the UI.
      - The same correction is sent to the LLM as a user-role message instructing it to continue working on the missing requirement.
      - The plan remains active until the evaluation passes or Alice waives the criterion.

  - id: S-7
    title: Anti-drift steers the assistant back to the active task
    given:
      - Alice has an active plan whose current task is "Finish AC-2: add source citations".
      - The assistant starts discussing unrelated social media promotion ideas.
    when:
      - The drift checker compares the latest assistant action with the active plan goal, current task, and unsatisfied acceptance criteria.
    then:
      - A drift score above the configured threshold is recorded.
      - A correction is sent to the LLM as a user-role message telling it to return to AC-2.
      - The UI displays the correction as a system/status message, not as Alice-authored text.
      - If drift is severe or the user's latest message intentionally changes scope, the assistant asks whether to update the plan or return to the original goal.

  - id: S-8
    title: Chat header shows plan before work and current task during work
    given:
      - Alice has an approved plan with three ordered tasks.
      - No task is currently in progress.
    when:
      - Alice opens the active chat.
      - The assistant starts the first task.
    then:
      - Before execution, the active chat header shows the plan title and opens the chat details Tasks tab when clicked.
      - During execution, the header shows the current task title.
      - Previous and next buttons navigate across tasks without changing task status.
      - The first position before Task 1 shows the plan overview/title.

  - id: S-9
    title: Project manages linked plans like linked chats
    given:
      - Alice has a Project named Community Workshop.
      - The workshop plan is linked to the Project and its primary chat.
    when:
      - Alice opens the Project page.
    then:
      - The Project page shows a Plans section with plan cards.
      - Each plan card shows encrypted title after client decryption, status, progress, linked chat, and linked task counts.
      - Alice can open the plan's primary chat or the plan detail in the chat settings Tasks tab.
      - Alice can filter project tasks by plan.

  - id: S-10
    title: User-confirmed checks support domains without automation
    given:
      - Alice is planning an electronics prototype.
      - The plan includes a check "Confirm KiCad DRC passes" and no automated KiCad runner exists in V1.
    when:
      - The assistant creates verification tasks.
    then:
      - The KiCad check is created as a user-assigned verification task.
      - The plan explains that the user must confirm this check manually.
      - The plan cannot be marked done until Alice completes or waives the user-confirmed verification task.

  - id: S-11
    title: Shared chats include decryptable read-only active plans
    given:
      - Alice owns a chat with an active plan whose primary_chat_id is the chat.
      - Alice has another project-only plan linked to the same project but not the shared chat.
    when:
      - Alice creates a shared chat link with default plan sharing enabled.
      - Bob opens the shared chat link.
    then:
      - Bob can decrypt and view the chat-primary active plan using the existing plan key wrapped by the share-link fragment key inside the exported bundle.
      - Bob sees the plan as read-only context, not editable owner data.
      - The project-only plan is excluded unless Alice explicitly includes project context in a future share flow.

  - id: S-14
    title: Plan sharing uses URL-fragment key material, not server-readable share grants
    given:
      - Alice owns an active chat-primary plan encrypted with a per-plan key.
      - Alice creates a shared chat link with optional password protection.
    when:
      - OpenMates builds the shared chat payload.
    then:
      - The share payload includes the plan id and the existing plan key wrapped by the share-link fragment key; no new durable plan key is created for sharing.
      - The wrapped existing plan key is decryptable only from the URL fragment key and optional password, following the existing chat/embed share contract.
      - The backend never receives the URL fragment key, optional password, raw plan key, or a server-readable durable share wrapper.
      - Existing chat and embed share links continue to work without format changes.

  - id: S-15
    title: Required assumptions are checked in parallel sub-chats before implementation
    given:
      - Alice and the assistant draft a plan for a Teams feature.
      - The plan includes assumptions about chat sharing, encryption, sync, project linking, and Apple parity.
      - The assumptions are marked required before implementation.
    when:
      - Alice approves the draft plan after reviewing or editing it.
      - OpenMates starts the assumption-checking phase.
    then:
      - OpenMates creates one verification task or sub-chat per assumption or coherent assumption cluster.
      - Assumption checks run in parallel when they do not depend on each other.
      - Each sub-chat returns confirmed, corrected, contradicted, blocked, waived, or still unchecked status.
      - Confirmed assumptions include source evidence such as file paths, stable code anchors, docs, embeds, prior chats, or web sources.
      - Corrected assumptions preserve the original text and store the corrected text plus evidence.
      - Contradicted or blocked required assumptions prevent implementation until the plan is revised, the user resolves the blocker, or the user explicitly waives the assumption.

  - id: S-16
    title: Failed checks create follow-up tasks and loop back to work
    given:
      - Alice has an active plan with completed implementation tasks and required final checks.
      - One required check fails because the implementation missed an acceptance criterion.
    when:
      - The assistant records the failed check evidence.
    then:
      - The plan remains active and moves from running_checks back to working_tasks or blocked.
      - OpenMates creates or suggests follow-up tasks linked to the failed check and affected acceptance criteria.
      - The failed check remains visible with evidence and required fixes.
      - The plan cannot be marked complete until the follow-up task is done and the required check passes, is user-confirmed, or is explicitly waived.

  - id: S-17
    title: Acceptance criteria are normalized into explicit checks before completion
    given:
      - Alice and the assistant draft a plan whose acceptance criteria include "All tests run successfully".
      - The plan has not yet defined which tests, suites, commands, or manual confirmations satisfy that criterion.
    when:
      - The plan moves from drafting or assumption checking toward implementation.
    then:
      - OpenMates treats the criterion as ambiguous until it is expanded into scoped checks such as backend pytest, CLI contract tests, npm SDK tests, pip SDK tests, Playwright specs, Apple build/test, full CI, or user confirmation.
      - The assistant asks Alice to choose the scope when it cannot infer the correct scope from the plan and touched surfaces.
      - The plan cannot be marked complete while any required acceptance criterion lacks explicit verification coverage.
      - Once scoped checks are defined, OpenMates keeps running the required check/fix/check loop until each check passes, is completed by its assigned user, is explicitly waived, or is blocked by user/external input.

  - id: S-19
    title: Generic /goal creates a minimal Plan without hiding the full Plans model
    given:
      - Alice is in the CLI and wants lightweight agentic work without a full visible spec-style plan.
    when:
      - Alice runs `openmates chat --goal "Improve the onboarding email and verify it reads clearly"`.
    then:
      - OpenMates creates a valid durable Plan, not a separate goal object.
      - The plan uses the same encrypted storage, primary chat, status, current focus, checks, and continuation policy as richer plans.
      - Only minimal fields are initially populated unless the planner needs assumptions, tasks, or additional checks to make the goal executable.
      - The plan can later be expanded manually or by plan deltas into the full rich model.

  - id: S-20
    title: Approved plan keeps working until checks pass or a blocker is explicit
    given:
      - Alice has approved a plan and required assumptions are resolved.
      - One required deterministic check still has no passing green/final evidence.
    when:
      - The assistant stops after reporting partial progress without recording a blocker.
    then:
      - OpenMates schedules or sends a deterministic continuation event for the primary chat.
      - The UI renders the event as system/status content, not as Alice-authored text.
      - The LLM receives a steering message that points to the current focus and next required check.
      - The plan remains executing or blocked, never completed, until required checks pass, are user-confirmed, are waived, or hit an explicit external blocker.

  - id: S-21
    title: Plan enforces reference patterns before implementation and completion
    given:
      - Alice approves a UI or API plan that should follow existing OpenMates conventions.
      - The plan lists required reference patterns such as design guidelines, neighboring component files, route/service examples, tests, or SDK command structure.
    when:
      - The assistant starts implementation without inspecting the required patterns.
      - Or the final implementation drifts from required patterns.
    then:
      - Implementation is blocked until required_before implementation patterns are inspected or waived.
      - Completion is blocked until required_before completion patterns are matched, waived, or explicitly blocked with a user-visible reason.
      - Pattern drift is shown in the plan and can create follow-up tasks or checks.
      - The active-plan context includes required pattern rules near the current focus so continuation turns keep matching the source-of-truth examples.

  - id: S-22
    title: Assistant records learnings before completing an active chat plan
    given:
      - Alice has an active plan in a chat and the assistant has finished the required work tasks and checks.
      - The plan has no finalized learnings yet.
    when:
      - The assistant attempts to mark the plan complete during normal chat continuation.
    then:
      - Completion is blocked with a missing-learnings blocker, just like missing required checks or unresolved assumptions.
      - The assistant summarizes 1-5 useful workflow or project agent-instruction learnings from the execution.
      - Each learning includes one encrypted suggested task draft describing how to improve the workflow or project agent instructions later.
      - The assistant saves the learnings and then completes the plan after all other completion blockers are resolved.
      - The final chat response includes a concise Learnings / Suggested Improvements section.

  - id: S-23
    title: User creates tasks from plan learnings without mutating workflows directly
    given:
      - Alice opens a completed plan whose learnings include task drafts for a workflow improvement and a project agent-instruction improvement.
    when:
      - Alice runs `openmates plans learnings create-tasks <plan-id> --all` or confirms the equivalent UI action.
    then:
      - OpenMates creates one normal user_tasks record for each selected learning that has an unapplied task draft.
      - Each created task stores provenance linking it to the source plan id and source learning id.
      - The learning is marked applied and records the created task id.
      - No workflow record, hook, global instruction, or project instruction is modified by the create-tasks action itself.
      - A repeated create-tasks action skips already applied learnings instead of creating duplicate tasks.

  - id: S-24
    title: Workspace context uses OpenMates app metadata without exposing object details
    given:
      - Alice has encrypted Projects, Plans, Tasks, and Memories associated with Code and Finance app IDs.
      - Alice sends "Build a small recipe manager CLI" in a normal chat.
    when:
      - The client sends preprocessing metadata for the request.
      - The preprocessor evaluates focus mode activation and context needs.
    then:
      - The preprocessor receives only that workspace context exists for object kinds grouped by app IDs such as code and finance.
      - The preprocessor does not receive Project, Plan, Task, Workflow, or Memory titles, descriptions, IDs, counts, statuses, timestamps, or plaintext content.
      - The code project-planning focus mode can request recent Code Projects from the main processor because the user is asking for implementation work.
      - A false positive such as "What are good recipe manager features?" does not create a Plan unless the focus metadata and message indicate build or implementation intent.

  - id: S-25
    title: Unified encrypted-context permission request is grouped by app
    given:
      - Alice has several Code Projects, Plans, Tasks, and Memories on her device.
      - The code planner needs to know whether to create a new Project or link an existing one.
    when:
      - The main processor requests encrypted workspace context.
      - Alice opens the permission prompt in web or handles the same request in CLI.
    then:
      - The request is shown as a grouped app-aware permission prompt, such as "Include recent Code projects" and "Include recent Code plans".
      - The client limits decrypted details to the bounded requested set, such as recent 10 Projects, recent 5 Plans, or active 10 Tasks for the requested app or selected object.
      - If Alice approves, the client decrypts and sends only the approved objects for transient assistant use.
      - If Alice rejects, the assistant continues without those details and can ask whether to create a fresh Project from scratch.
      - If Alice explicitly mentions one Project, Plan, Task, Workflow, or Memory, only that object is included without asking for unrelated objects from the same app.

  - id: S-18
    title: Check cards open either sub-chat validation or structured test run details
    given:
      - Alice opens the Checks section of an active plan.
      - One check is an AI validation check named "Web app UI is clean looking" with an existing evaluator sub-chat.
      - Another check is a Playwright spec file named create-team.spec.ts that has run in an isolated sandbox runner.
    when:
      - Alice opens the AI validation check.
      - Alice opens the Playwright test check.
    then:
      - The AI validation check shows an Open chat action that opens the linked evaluator sub-chat and its structured verdict.
      - The Playwright check shows an Open test run action that opens structured run details rather than a raw log-only page.
      - The test run details include the source test file as a code embed, structured result summary, stdout/stderr, step timeline, environment metadata, and any produced screenshots, videos, traces, HTML reports, or JSON reports.
      - Browser test artifacts prioritize failure screenshots and traces; videos are attached when produced by the runner and are especially expected for failed or flaky runs.
      - Pytest or non-browser deterministic checks reuse the source-code embed and existing code-output UI, with artifact sections only when the run produced additional files.
      - The run details identify the runner as an OpenMates-managed isolated sandbox, such as E2B, unless the user explicitly connected a repository CI integration in a later feature.

  - id: S-12
    title: Active-plan context uses Vault-encrypted execution context
    given:
      - Alice has an active plan linked to a long-running chat.
      - Chat compression has replaced older plan discussion messages.
    when:
      - The assistant continues execution after compression or after a task transition.
    then:
      - The backend injects the active plan from short-lived Vault-encrypted execution context.
      - The backend never decrypts durable plan fields stored in Directus.
      - If the execution context is missing or expired, the assistant asks Alice to resume or refresh plan context.

  - id: S-13
    title: Old plan data is retained or deleted according to lifecycle policy
    given:
      - Alice has completed, archived, active, and blocked plans from several months ago.
      - Alice has configured chat auto-delete and default plan retention settings.
    when:
      - The daily retention job runs.
    then:
      - Expired active-plan execution contexts and orphan key wrappers are deleted first.
      - Completed or archived plans past the retention window are deleted with criteria, verification records, activity, key wrappers, and execution contexts.
      - Active, executing, blocked, or explicitly kept plans are not deleted.
      - Chat auto-delete either deletes chat-primary plans with the chat or preserves them only when explicitly detached/kept by the user.

acceptance_criteria:
  - id: AC-1
    scenario: S-1
    text: Explicit @plan always forces planner routing and never requires the user to know the lower-level @focus syntax.
  - id: AC-2
    scenario: S-1
    text: Generic planning uses an OpenMates Plan focus mode that asks one clarifying question at a time and waits for the user's answer before continuing.
  - id: AC-3
    scenario: S-2
    text: Natural-language planning intent can select an app-specific planner focus mode when the domain clearly matches an enabled app.
  - id: AC-4
    scenario: S-2
    text: Planner focus mode exits only after the user approves the draft plan, required pre-implementation assumptions are confirmed/corrected/waived, corrections are applied, and required checks are normalized; execution never starts automatically by default.
  - id: AC-5
    scenario: S-3
    text: Active plans are stored separately from chat messages and injected into assistant context on every active-plan turn, including after compression, without depending on compressed chat history text.
  - id: AC-6
    scenario: S-4
    text: Plans can contain structured phases, optional grouping steps, optional user flows, linked user_tasks, Success Criteria, and Checks with stable IDs and traceability between them; user-facing plan Tasks are actual task records, not embedded-only steps.
  - id: AC-7
    scenario: S-4
    text: Checks can be represented as user-facing tasks with type verification, assignment, status, and links back to plan Success Criteria.
  - id: AC-8
    scenario: S-5
    text: Coding plans create or identify deterministic test/check files before implementation when feasible, record the check description, command, source hash, and red-phase evidence, and do not fail solely because a red-phase test passes unexpectedly when the result is recorded and handled explicitly.
  - id: AC-9
    scenario: S-5
    text: Required green/final verification evidence blocks plan and task completion until all required checks pass, are completed by the assigned user, or are explicitly waived.
  - id: AC-10
    scenario: S-6
    text: AI evaluation verification returns numeric per-criterion scores, thresholds, pass/fail status, confidence, reasons, and required fixes.
  - id: AC-11
    scenario: S-6
    text: Failed AI evaluation generates a system-rendered correction that is sent to the LLM as a user-role steering message and keeps the plan active.
  - id: AC-12
    scenario: S-7
    text: Anti-drift checks compare the latest assistant behavior against the active plan goal, active step/task, and unsatisfied acceptance criteria and either continue, steer back, ask the user, or stop.
  - id: AC-13
    scenario: S-7
    text: Anti-drift correction messages render as system/status messages in the UI while carrying metadata that the LLM receives them as user-role messages.
  - id: AC-14
    scenario: S-8
    text: The active chat header shows the active plan title before execution and the current task title during execution, with previous/next navigation and a click target to open the Tasks tab.
  - id: AC-15
    scenario: S-9
    text: Project pages can show and manage linked plans similarly to linked chats, including status, progress, primary chat, and task filters.
  - id: AC-16
    scenario: S-10
    text: Plans support user-confirmed verification tasks for domains where automated checks are impractical in V1.
  - id: AC-17
    scenario: S-3
    text: Durable private plan content is client-encrypted; the server only stores minimal metadata needed for ownership, filtering, status, versioning, active-plan lookup, and safe orchestration.
  - id: AC-18
    scenario: S-4
    text: CLI, npm SDK, and pip SDK expose the shared plan contract before web-only flows are considered complete.
  - id: AC-19
    scenario: S-11
    text: Every plan has a per-plan key and owner/chat/project access contexts; shared chat links include chat-primary active plan records and the existing plan keys wrapped by the share URL fragment key by default.
  - id: AC-20
    scenario: S-12
    text: Active plans linked to active chats have short-lived Vault-encrypted execution contexts used for assistant context injection after compression and task transitions.
  - id: AC-21
    scenario: S-13
    text: Plan retention jobs delete expired execution contexts, orphan key wrappers, and eligible completed/archived plans without deleting active, executing, or blocked plans.
  - id: AC-22
    scenario: S-14
    text: Shared plan decryptability is granted by share-link fragment key material, not by a persistent server-readable share key grant.
  - id: AC-23
    scenario: S-15
    text: Plans can store required assumptions with status, source evidence, sub-chat/task links, original text, and corrected text when an assumption is corrected.
  - id: AC-24
    scenario: S-15
    text: Required assumptions marked for pre-implementation checking block task execution until they are confirmed, corrected and applied to the plan, waived, or resolved from a blocker by the user.
  - id: AC-25
    scenario: S-15
    text: Assumption verification can spawn parallel sub-chats or verification tasks and merge their results back into the parent plan with visual confirmed, corrected, checking, unchecked, blocked, or contradicted states.
  - id: AC-26
    scenario: S-16
    text: Failed required checks keep the plan active, create or suggest linked follow-up tasks, and loop the plan back to work until the check passes, is user-confirmed, or is explicitly waived.
  - id: AC-27
    scenario: S-17
    text: Every required acceptance criterion must have explicit verification coverage through one or more concrete checks, user confirmations, waivers, or blockers before the plan can be completed.
  - id: AC-28
    scenario: S-17
    text: Vague acceptance criteria such as "all tests pass" are blocked until normalized into scoped runnable checks or explicit user-confirmed/manual checks.
  - id: AC-29
    scenario: S-17
    text: Required failed checks keep the assistant working through a check/fix/check loop until all required acceptance criteria are satisfied, user-confirmed, waived, or blocked by user/external input.
  - id: AC-30
    scenario: S-18
    text: AI validation checks define explicit evaluator instructions, open the linked evaluator sub-chat, and expose the verdict, prompt/version, confidence, evidence summary, and transcript instead of rendering as deterministic test runs.
  - id: AC-31
    scenario: S-18
    text: Runnable test-file checks open structured run details with source code, command, status, output, step timeline, environment metadata, and produced artifacts such as screenshots, videos, traces, HTML reports, or JSON reports.
  - id: AC-32
    scenario: S-19
    text: /goal and --goal are generic aliases that create minimal encrypted Plans using the same durable Plans model, not separate goal records, and can later be expanded into rich plans.
  - id: AC-33
    scenario: S-19
    text: Minimal Plans expose only simple user-facing fields by default while preserving the full model contract for goal, primary chat, current focus, checks, status, and continuation policy.
  - id: AC-34
    scenario: S-20
    text: Active executable plans require a primary_chat_id and the primary chat is the command center where plan progress, assumption sub-chats, tasks, checks, and continuation events remain visible.
  - id: AC-35
    scenario: S-20
    text: The assistant cannot mark a plan complete while required checks lack passing, user-confirmed, waived, or explicitly blocked evidence; if it stops early without a blocker, the deterministic continuation controller resumes the current focus.
  - id: AC-36
    scenario: S-5
    text: Every check has a user-facing natural-language description explaining what it verifies before executable test code, commands, or evaluator sub-chat instructions are created.
  - id: AC-37
    scenario: S-1
    text: Users can manually edit a draft plan before approval; edited client-side plan deltas are encrypted by the client and persisted without server-side plaintext.
  - id: AC-38
    scenario: S-21
    text: Required reference patterns are first-class plan records whose inspection/match status gates implementation or completion, preventing agents from ignoring existing design guidelines, source examples, and structural conventions.
  - id: AC-39
    scenario: S-22
    text: Plan completion is blocked until the plan has 1-5 finalized learnings; finalized learnings are proposed, accepted, or applied, while draft, rejected, duplicate, and merged records do not satisfy the count.
  - id: AC-40
    scenario: S-22
    text: Learnings are client-encrypted plan child records focused on workflow_improvement or agent_instruction_improvement in V1, with server-visible metadata limited to routing, count, status, type, target, severity, confidence, links, and timestamps.
  - id: AC-41
    scenario: S-22
    text: Assistant-driven chat continuation treats missing learnings as an active-plan completion blocker, records useful learnings before completion, and includes a concise Learnings / Suggested Improvements section in the final response.
  - id: AC-42
    scenario: S-23
    text: Learnings can create normal task records from their single encrypted suggested task draft with provenance to source plan and source learning, but do not directly mutate workflows, hooks, global instructions, or project agent instructions.
  - id: AC-43
    scenario: S-24
    text: Projects, Plans, Tasks, and Workflows support a primary OpenMates app ID and optional secondary app IDs so UI color/icon treatment and assistant routing reuse canonical app metadata.
  - id: AC-44
    scenario: S-24
    text: Preprocessing receives only app-level workspace context metadata grouped by object kind and app ID, never object details or default counts.
  - id: AC-45
    scenario: S-25
    text: A unified encrypted-context request can ask the client for bounded recent Memories, Projects, Plans, Tasks, and Workflows grouped by OpenMates app ID, and client approval controls which decrypted details are sent.
  - id: AC-46
    scenario: S-25
    text: Explicit mentions of a specific Project, Plan, Task, Workflow, or Memory count as consent for that object only and must not imply consent to include unrelated objects from the same app.
  - id: AC-47
    scenario: S-1
    text: Required Open questions are asked as one-at-a-time interactive questions and must be answered, waived with a visible reason, or accepted as explicit blockers before a plan can start implementation.

contracts:
  product_model:
    minimal_plan:
      purpose: Lightweight /goal-compatible plan shape for users who want a persistent objective without a full visible spec-style plan.
      required_user_visible_sections:
        - goal
        - checks_or_success_criteria_when_needed
      required_system_fields:
        - plan_id
        - status
        - primary_chat_id before attach, start, resume, or execution
        - continuation_policy
        - version
      behavior:
        - /goal and --goal create this shape as a normal encrypted Plan.
        - Minimal plans can be expanded into rich plans through user edits or client-applied plan deltas.
        - Minimal mode changes the default UI density, not the storage/enforcement model.
    build_and_execution_order:
      - step: route
        description: Detect @plan, /goal, --goal, selected focus mode, or natural-language planning intent and choose the generic or app-specific planner.
      - step: clarify
        description: Ask blocking clarification and required Open questions one at a time as interactive questions, with examples and a recommended answer when useful.
      - step: draft
        description: Create a draft Plan only after goal, scope, target context, and initial success criteria are clear enough to be useful.
      - step: attach_context
        description: Create or link the required Project/chat context, request permission-gated workspace context when needed, and persist key wrappers without exposing plaintext to the server.
      - step: user_review
        description: Show the draft Plan for user review; allow manual edits before approval or autoconfirmed safe execution.
      - step: resolve_preconditions
        description: Resolve required Open questions, required assumptions, required reference patterns, constraints, and ambiguous Success Criteria before implementation.
      - step: normalize_checks
        description: Convert Success Criteria into concrete Checks, commands, evaluator sub-chats, or user-confirmed verification tasks.
      - step: start
        description: Start execution only after approvals and preconditions are satisfied; create or link normal user_tasks for execution and checks.
      - step: implement
        description: Work through tasks while injecting active-plan context, applying anti-drift corrections, and editing artifacts through their proper embed/version contracts.
      - step: verify
        description: Run required Checks, attach evidence, create follow-up tasks for failed required Checks, and keep the Plan active until blockers are resolved.
      - step: learn
        description: Record 1-5 finalized Learnings before completion, optionally creating normal tasks from suggested learning drafts.
      - step: complete
        description: Complete only when required Success Criteria are covered, required Checks have passing/user-confirmed/waived/accepted-blocked evidence, required Learnings exist, and unresolved required Open questions or assumptions are gone.
    rich_plan_sections:
      - section: Goal
        purpose: Defines the desired outcome.
        enforcement: Used by active-plan context, anti-drift, and completion review.
        examples:
          - Build a recipe manager CLI that stores recipes locally and supports search by ingredient.
          - Plan and prepare a 60-person community workshop in Berlin.
      - section: Current focus
        purpose: Names the current task, check, question, assumption, or blocker.
        enforcement: Continuation and anti-drift target this field before choosing the next action.
        examples:
          - Asking the budget question before drafting workshop tasks.
          - Implementing the import/export command.
          - Waiting for user confirmation on the deployment target.
      - section: Tasks
        purpose: User-visible work and verification items.
        enforcement: Must be actual user_tasks linked by plan_id, not embedded-only plan text, so Tasks views can show all work across plans and chats.
        examples:
          - Create CLI command parser for recipe add/list/search.
          - Write pytest coverage for malformed recipe files.
          - User: confirm venue accessibility requirements.
      - section: Success Criteria
        purpose: Acceptance criteria that define what done means.
        enforcement: Required criteria must have covered, waived, or explicitly blocked verification before completion.
        examples:
          - A user can add, list, search, edit, and delete recipes from the CLI.
          - The workshop plan includes venue, agenda, staffing, budget, risk plan, and follow-up message.
      - section: User Flows
        purpose: Optional end-to-end user journeys that clarify product or process behavior.
        enforcement: Inform tasks/checks and anti-drift but do not block completion by themselves.
        examples:
          - "New user runs `recipes add`, enters title/ingredients/steps, then finds it with `recipes search tomato`."
          - Attendee receives invite, registers, arrives, joins a breakout group, and receives follow-up notes.
      - section: Checks
        purpose: Deterministic commands, runnable checks, AI evaluator sub-chats, user confirmations, manual checks, or artifact reviews that prove criteria.
        enforcement: Required checks block completion until evidence inside the check is passing, user-confirmed, waived, or explicitly blocked.
        examples:
          - "`python3 -m pytest tests/test_recipes_cli.py`"
          - User confirms the venue can seat 60 people and has wheelchair access.
          - AI evaluator sub-chat reviews the final email for clarity and tone.
      - section: Scope in
        purpose: Defines included work.
        enforcement: Anti-drift and plan updates compare new work against scope-in boundaries.
        examples:
          - Local-only JSON storage, no server sync.
          - Workshop agenda, speaker outreach, registration copy, and day-of checklist.
      - section: Scope out
        purpose: Defines non-goals.
        enforcement: Assistant must ask before doing scope-out work.
        examples:
          - No mobile app or hosted backend in V1.
          - No paid ads campaign for this event plan.
      - section: Assumptions
        purpose: Factual statements based on the assistant's current understanding from user answers, approved project/context data, uploaded content, prior chats, quick source inspection, or online research that plan execution depends on.
        enforcement: Assumptions required before implementation or task execution block those phases until confirmed, corrected and applied, waived, or user-resolved.
        examples:
          - The project already uses Click for CLI commands.
          - The venue budget is capped at 1200 EUR.
          - The uploaded CSV contains the full invitee list.
      - section: Open questions
        purpose: Missing user or external input.
        enforcement: Required Open questions must be asked as interactive questions and answered, waived with a visible reason, or accepted as an explicit blocker before implementation starts.
        examples:
          - Should recipe data be stored in JSON, SQLite, or an existing project format? Recommended: JSON for V1 simplicity.
          - What is the workshop date and target audience?
          - Should this plan include German copy as well as English?
      - section: Constraints
        purpose: Hard boundaries for tools, files, budget, privacy, permissions, data, and allowed actions.
        enforcement: Tool use, check execution, and continuation must obey constraints.
        examples:
          - Do not touch production data.
          - Keep implementation limited to CLI and SDK packages for now.
          - Budget must stay under 1200 EUR.
      - section: Decisions
        purpose: Accepted choices and rationale.
        enforcement: Later plan changes must preserve or explicitly supersede decisions.
        examples:
          - Use JSON storage for V1 because it keeps installation simple.
          - Ship CLI/SDK first and defer web UI until the contracts are stable.
      - section: Risks
        purpose: Known risks and mitigations.
        enforcement: High-risk items can require checks, user confirmation, or blockers before completion.
        examples:
          - "Risk: ambiguous success criteria cause endless implementation. Mitigation: normalize into required Checks before start."
          - "Risk: external venue availability changes. Mitigation: user confirmation task before final schedule."
      - section: Reference Patterns
        purpose: Existing files, docs, design guidelines, source components, API/CLI/SDK examples, tests, naming conventions, visual systems, and anti-patterns that the plan must follow.
        enforcement: Required reference patterns block implementation until inspected or explicitly waived; completion checks compare changed work against required patterns so agents do not invent inconsistent structure or visual style.
        examples:
          - Match `frontend/packages/openmates-cli/tests/tasks.test.ts` command test style.
          - Follow existing Project card layout and app color/icon metadata.
      - section: Learnings
        purpose: Final execution reflections that identify improvements to future workflows or project agent instructions.
        enforcement: Completion requires 1-5 finalized learnings; each finalized learning should include exactly one suggested task draft when the improvement is actionable.
        examples:
          - Add a future task to document repeated CLI naming decisions.
          - Record that required Open questions should be asked before plan start, not discovered during implementation.
      - section: Context
        purpose: Compact plan context and artifact references needed after chat compression.
        enforcement: Injected into active-plan turns through protected active-plan context, never by server-side durable decryption.
        examples:
          - Linked Project ID, primary chat ID, code embed refs, uploaded source docs, and approved recent Code memories.
          - Active plan summary containing current focus, blockers, next task, and unresolved required Checks.
      - section: Activity
        purpose: Append-only history of plan edits, assumption results, check evidence, task transitions, continuations, waivers, and blockers.
        enforcement: Provides auditability for completion, waivers, and plan deltas.
        examples:
          - User answered required Open question about storage format.
          - Required Check failed and follow-up task was created.
          - Assistant recorded final Learning before completion.
    app_linked_workspace_objects:
      purpose: Reuse actual OpenMates app metadata for workspace object grouping, UI treatment, and privacy-minimized assistant context routing.
      object_kinds:
        - projects
        - plans
        - tasks
        - workflows
      app_fields:
        - primary_app_id: One canonical OpenMates app ID such as code, finance, electronics, business, design, docs, or workflows.
        - secondary_app_ids: Optional supporting OpenMates app IDs used for cross-app workflows and UI hints.
      privacy_notes:
        - For Projects, Plans, and Tasks, app link fields should be encrypted client-owned metadata unless a later approved migration explicitly accepts server-visible app filtering.
        - The client may decrypt app link metadata locally for UI app color/icon grouping and for building ephemeral preprocessing metadata.
        - Workflows may already support server-side runtime decryption for scheduled execution, but sending workflow details to a chat LLM still follows explicit mention or permission approval.
    workspace_context_metadata:
      purpose: Privacy-minimized client-provided routing metadata for preprocessing.
      shape_example:
        projects:
          - code
          - finance
        plans:
          - code
        tasks:
          - code
          - business
        workflows:
          - finance
          - reminder
        memories:
          - code:preferred_technologies
          - docs:writing_style
      constraints:
        - Contains object kind and app ID availability only for Projects, Plans, Tasks, and Workflows.
        - Does not contain object IDs, titles, descriptions, counts, statuses, timestamps, snippets, or plaintext content.
        - Memories keep their existing app/item-key metadata shape until migrated into the unified context request contract.
    encrypted_context_request:
      purpose: Unified permission-gated request for client-decrypted user context needed by the main processor.
      replaces_over_time:
        - request_app_settings_memories
        - app_settings_memories_confirmed
      request_shape_example:
        request_id: ctx_123
        chat_id: <CHAT_ID>
        reason: The assistant needs existing Code projects to decide whether to create or link a project.
        items:
          - kind: projects
            app_id: code
            limit: 10
            sort: recent
            fields:
              - id
              - name
              - description
              - updated_at
          - kind: plans
            app_id: code
            limit: 5
            sort: recent
            fields:
              - id
              - title
              - summary
              - status
              - linked_project_ids
      default_limits:
        projects: 10
        plans: 5
        tasks: 10
        workflows: 5
        memories: existing-requested-category-limit
      rules:
        - The client renders requests grouped by OpenMates app with app icon/color metadata.
        - The client sends only approved decrypted objects, and only for transient assistant processing.
        - Rejection resumes processing without those details instead of failing the entire chat.
        - Explicit object mentions bypass the permission prompt only for the mentioned object and never for unrelated objects from the same app.
        - CLI must expose explicit approval controls such as --auto-approve-context projects,plans or narrower app-specific flags before non-interactive context sharing.
    cli_sdk_naming:
      purpose: Keep public CLI and SDK names aligned with user-visible plan sections while allowing lower-level API/storage terms to remain implementation details.
