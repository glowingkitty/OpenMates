implementation_plan:
  spec_path: docs/specs/search-skill-embed-reliability/spec.yml
  architecture: >
    Extract companion expansion and schema-aware request-item normalization into
    focused pure helpers used by main_processor.py. Normalize before streaming placeholders,
    retain the same parsed arguments for execution, and rely on existing matched-ID
    update paths so a successful call terminalizes its original placeholders.
  existing_patterns:
    - Existing COMPANION_SKILLS expansion already adds images-search.
    - Existing web search skill converts string requests to query objects, but too late.
    - Existing placeholder maps correlate normalized request IDs.
  data_flow:
    - Preprocessor selects web-search; companion expansion adds news-search and images-search.
    - Main model emits requests; schema-aware normalization converts strings to query objects.
    - Placeholder creation assigns IDs on normalized objects.
    - Execution reuses those objects and updates the matching placeholders to finished.
    - Encrypted assistant persistence retains only matched durable references; clients reload terminal embeds with queries.
  affected_files:
    - {path: backend/apps/ai/processing/search_skill_reliability.py, reason: Pure helper seam for companion expansion and malformed request-item recovery.}
    - {path: backend/apps/ai/processing/main_processor.py, reason: Companion expansion and pre-placeholder normalization.}
    - {path: backend/apps/ai/tests/test_search_skill_reliability.py, reason: Focused red/green regression coverage.}
    - {path: frontend/apps/web_app/tests/skill-web-search.spec.ts, reason: Durable query and lifecycle assertions.}
    - {path: frontend/apps/web_app/tests/skill-news-search.spec.ts, reason: Companion routing and durable rendering assertions.}
  api_data_ui_privacy:
    - No endpoint or public data model changes.
    - Existing first-party encrypted chat/embed persistence remains unchanged.
    - Provider costs and credit accounting remain one usage entry per actual skill call.
  rollout:
    - Restart app-ai-worker and affected AI/API services on dev before CLI proof.
    - Deploy frontend/test changes to dev before Playwright.
  observability:
    - Existing debug request cache must show preselected skills, offered tools, tool calls, and final response references.
  verification_strategy:
    - Run focused pytest red then green.
    - Run a real current-news CLI chat against the dev server and inspect called skills/terminal embeds.
    - Deploy and run both requested Playwright specs, then visual smoke and proof video.
  verification_order: [T-BACKEND-SEARCH-LIFECYCLE, V-LIVE-CLI, T-WEB-SEARCH, T-NEWS-SEARCH, V-UI-VISUAL-SMOKE, V-SPEC-VERIFY]

