    file: backend/tests/test_operational_monitoring_digest.py
    command: python3 -m pytest backend/tests/test_operational_monitoring_digest.py -q
    covers: [AC-1, AC-7, AC-8, AC-9]
    contract_assertions: [operational-monitoring.digest.real-24h-snapshot, operational-monitoring.delivery.observable, operational-monitoring.content.privacy-boundary, operational-monitoring.environments.isolated-labeled]
    assertions:
      - Bounded real-source query adapters produce a 24-hour snapshot and freshness state.
      - SVG and PNG rendering remains deterministic and scan-first.
      - At most three issues are ranked by severity, active state, frequency, and recency.
      - Dev, production, and self-host report subjects and namespaces are isolated.
      - One channel failure preserves the other channel result and yields partial failure.
