  - id: D-1
    status: active
    decision: Use existing Prometheus, OpenObserve, Directus aggregates, and host runtime monitoring instead of deploying Grafana.
    reason: The repository already operates these systems and Grafana was intentionally removed as unused overhead.
    decided_at: "2026-08-14T15:22:57Z"
  - id: D-2
    status: active
    decision: Add node-level metrics for host CPU, memory, disk capacity, free space, and filesystem health while retaining cAdvisor for containers.
    reason: cAdvisor does not provide a reliable complete host disk and memory view.
    decided_at: "2026-08-14T15:22:57Z"
  - id: D-3
    status: active
    decision: Deliver critical alerts through the host notifier or direct Alertmanager destination without requiring API or Celery availability.
    reason: The current APIDown route cannot be trusted when its receiver is the down API.
    decided_at: "2026-08-14T15:22:57Z"
  - id: D-4
    status: active
    decision: Render one deterministic SVG-to-PNG report using existing CairoSVG/Pillow dependencies.
    reason: A compact image works in both email and Discord without adding a dashboard service.
    decided_at: "2026-08-14T15:22:57Z"
  - id: D-5
    status: active
    decision: Completely omit billing inventory, fields, sections, state, and text in self-host mode.
    reason: The user explicitly rejected even a not-applicable billing mention in the self-host edition.
    decided_at: "2026-08-14T15:22:57Z"
  - id: D-6
    status: active
    decision: Use real dev delivery receipts and artifact inspection instead of proof video.
    reason: This is a non-visual background workflow and the user explicitly waived video while requiring stronger real-channel validation.
    decided_at: "2026-08-14T15:22:57Z"

scenarios:
  - id: S-1
    title: Official dev receives a compact real-data daily digest
    given:
      - The dev host has at least 24 hours of resource and application telemetry.
      - Dev email and Discord destinations are configured.
    when:
      - The scheduled operational digest runs.
    then:
      - One graph shows CPU, memory, disk used, and disk free over the preceding 24 hours.
      - The summary shows aggregate activity, processing outcomes, official-cloud billing health, monitoring freshness, and at most three prioritized issues.
      - Email and Discord delivery states are recorded independently.

  - id: S-2
    title: Self-host automatically sends an email without billing concepts
    given:
      - A CLI-managed self-host core server defines an admin email.
      - Its configured email service passes a bounded availability check.
    when:
      - Installation or update provisions the operational digest schedule.
    then:
      - The digest runs daily and attempts email delivery automatically.
      - No billing field, section, label, check ID, incident, credential read, or payment-provider call exists in its collection, output, logs, or status.
      - Missing prerequisites produce explicit local configuration state rather than false delivery success.

  - id: S-3
    title: Operator proves dev email and Discord with current server data
    given:
      - The implementation is deployed to the current dev server.
      - Both dev operator destinations are configured.
    when:
      - The operator runs the real-data delivery verification for a 24-hour window.
    then:
      - A clearly labeled test email is accepted with the real current dev snapshot.
      - A clearly labeled Discord message is accepted with the same snapshot window and compact image.
      - Fixture or invented metric values cannot satisfy the verification.
      - Each result records timestamp, report hash, destination type, and accepted or failed state without destination secrets.

  - id: S-4
    title: Urgent API failure reaches operators independently
    given:
      - The API is unavailable long enough to cross the critical threshold.
    when:
      - Prometheus or the host watchdog fires the API-down incident.
    then:
      - At least one configured urgent channel receives the incident without calling the unavailable API or application scheduler.
      - Retries do not create duplicate logical incidents.
      - Recovery emits one resolved notification.

  - id: S-5
    title: Invalid metrics cannot create alert floods
    given:
      - A container has memory usage but no finite positive configured memory limit.
    when:
      - Resource alert rules evaluate.
    then:
      - No percentage-based memory alert is evaluated for that container.
      - No infinite, NaN, or fabricated percentage reaches Alertmanager, email, Discord, or the daily report.
      - Host absolute and capacity-based resource thresholds remain available from node metrics.

  - id: S-6
    title: Monitoring silence becomes an incident
    given:
      - A daily report is expected for the environment.
    when:
      - No successful report and required channel acceptance are recorded within the allowed freshness window.
    then:
      - The independent watchdog creates a stale-report incident.
      - The incident identifies whether collection, rendering, scheduling, email, or Discord failed.
      - Recovery clears the active incident after a fresh accepted report.

  - id: S-7
    title: Production rollout remains gated by dev evidence
    given:
      - Unit, contract, self-host, and dev integration checks pass.
      - The real dev email and Discord artifacts have been inspected.
    when:
      - Production rollout is proposed.
    then:
      - Production access and changes require separate explicit approval.
      - Production configuration is audited before enablement.
      - A controlled production delivery test and failure/recovery drill run before ongoing production alerts are accepted.

