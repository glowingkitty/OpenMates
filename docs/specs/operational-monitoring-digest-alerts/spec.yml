contracts:
  api:
    access_model: internal-only
    auth: Host-local CLI execution, private container network access, or existing internal-service authentication only; no new public route.
    rate_limits: One scheduled digest per environment per day, bounded explicit operator tests, and existing alert grouping/repeat intervals.
    credit_budget: Zero OpenMates credits and zero paid AI/provider calls for report collection or verification.
    encryption_boundary: No client-side encrypted chat, message, embed, file, memory, key, or share material is read, returned, decrypted, or transmitted.
  snapshot:
    window: Exactly the preceding 24 hours ending at generation time.
    resource_resolution: Downsample to a bounded number of points suitable for one compact graph.
    required_official_cloud_sections: [resource_graph, activity, processing, billing, reliability, prioritized_issues]
    required_self_host_sections: [resource_graph, activity, processing, reliability, prioritized_issues]
    forbidden_self_host_tokens: [billing, payment, stripe, invoice, subscription, purchase]
    prioritized_issue_limit: 3
  delivery:
    email: Full compact report with inline image and scan-first text.
    discord: Same report image plus no more than five concise status lines.
    urgent: Critical incidents use independent Discord and email destinations when configured; one channel failure cannot suppress another.
    receipts: Persist environment, logical event/report ID, generated timestamp, content hash, channel, attempt count, accepted/failed/unavailable state, and sanitized failure class.
    forbidden_receipt_data: [destination, email_address, webhook_url, secret, user_id, payment_id, raw_content, ciphertext]
  scheduling:
    official_cloud: Daily plus independent stale-report watchdog.
    self_host: Install/update activates daily email when admin email and email service availability checks pass; Discord is used only when configured.
    freshness: A report expected but not accepted within 26 hours creates a stale-report incident.
  severity:
    critical: Immediate after the approved condition duration; repeated at most hourly while firing.
    warning: Notify only after sustained confirmation; otherwise include in digest.
    digest: Daily report only.
    recovery: One resolved event per active incident.
  privacy_security:
    - Use aggregate counts and sanitized service/check identifiers only.
    - Do not persist or transmit raw log rows in reports.
    - Keep monitoring endpoints private to the Docker network or host.
    - Redact notification destinations and provider credentials from output and receipts.
    - Keep dev, production, and self-host incident namespaces and destinations separate.

