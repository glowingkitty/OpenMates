implementation_plan:
  spec_path: docs/specs/operational-monitoring-digest-alerts/spec.yml
  architecture: >
    Extend the existing Prometheus/OpenObserve and host runtime monitoring stack.
    Add private node metrics, fix and test Prometheus rules, collect bounded
    aggregate snapshots in a packaged backend helper, render one SVG-to-PNG
    artifact, and let the existing host notifier own independent delivery,
    receipts, scheduling freshness, and urgent fallback behavior.
  existing_patterns:
    - Prometheus already remote-writes metrics to OpenObserve and Alertmanager already groups alerts.
    - Daily issue and degraded-service tasks already query sanitized errors and use email/Discord transports.
    - server_stats_global_daily already holds privacy-safe aggregate activity and official-cloud financial counters.
    - serverHealth.ts already implements host-local state, retries, daily heartbeat, incident deduplication, and recovery.
  data_flow:
    - Prometheus scrapes private node, container, API, and worker metrics with environment labels.
    - The packaged snapshot collector queries a bounded 24-hour metric range, aggregate server stats, health transitions, and sanitized error clusters.
    - Environment mode selects official-cloud sections or the self-host schema before billing sources can be resolved.
    - The renderer creates a deterministic compact SVG and PNG plus short email/Discord text.
    - The host notifier sends configured channels independently and persists redacted receipts and report freshness.
    - Alertmanager and the host watchdog route urgent incidents without depending on the API or application scheduler.
  affected_files:
    - {path: backend/core/docker-compose.yml, reason: Add private node metrics and monitoring configuration.}
    - {path: backend/core/docker-compose.selfhost.yml, reason: Keep packaged self-host monitoring and automatic schedule support aligned.}
    - {path: frontend/packages/openmates-cli/templates/core/docker-compose.selfhost.yml, reason: Published self-host template parity.}
    - {path: backend/core/monitoring/prometheus/prometheus.yml, reason: Scrape node metrics and add environment labels.}
    - {path: backend/core/monitoring/prometheus/alert_rules.yml, reason: Correct resource rules and add disk/staleness alerts.}
    - {path: backend/core/monitoring/prometheus/alert_rule_tests.yml, reason: Deterministic Prometheus rule tests.}
    - {path: backend/core/monitoring/alertmanager/alertmanager.yml, reason: Add urgent path that does not depend on API availability.}
    - {path: backend/core/api/app/services/operational_monitoring.py, reason: Aggregate and render privacy-safe snapshots.}
    - {path: backend/core/api/app/tasks/operational_monitoring_tasks.py, reason: Scheduled official-cloud collection and bounded report generation.}
    - {path: backend/core/api/app/tasks/celery_config.py, reason: Register the daily task while host watchdog verifies freshness.}
    - {path: frontend/packages/openmates-cli/src/serverHealth.ts, reason: Host schedule, receipts, self-host activation, and stale-report incidents.}
    - {path: frontend/packages/openmates-cli/src/server.ts, reason: Operator real-data delivery-test and status commands.}
    - {path: scripts/verify_operational_monitoring.py, reason: Real dev delivery and controlled failure verification.}
    - {path: scripts/audit_operational_monitoring_contract.py, reason: Deterministic privacy, self-host omission, and deployment guard.}
    - {path: backend/tests/test_operational_monitoring_digest.py, reason: Snapshot, renderer, ranking, isolation, and receipt tests.}
    - {path: frontend/packages/openmates-cli/tests/server.test.ts, reason: Host monitoring and self-host contract tests.}
    - {path: docs/specs/post-update-runtime-health-alerting/spec.yml, reason: Replace legacy self-host billing not-applicable language with complete omission when implementation begins.}
  verification_strategy:
    - Write and run failing digest, Prometheus-rule, CLI, self-host, and privacy tests before implementation.
    - Rebuild/restart only affected dev monitoring, API, scheduler, and host-monitor components under repository locks.
    - Run focused green tests and deterministic audits.
    - Send the real current dev 24-hour email and Discord test and inspect both received artifacts.
    - Run controlled dev alert and stale-report drills with guaranteed restoration and recovery checks.
    - Observe seven consecutive fresh daily dev reports before requesting production access.
    - Audit and roll out production only after separate explicit approval.
  verification_order:
    - T-DIGEST-UNIT, T-ALERT-RULES, T-CLI-MONITORING, T-SELFHOST-CONTRACT, and T-PRIVACY-AUDIT red phase.
    - Resource collection and alert-rule green phase.
    - Snapshot, renderer, scheduling, self-host, and delivery green phase.
    - V-DEV-REAL-DELIVERY and V-DEV-ARTIFACT-REVIEW with current dev data.
    - V-DEV-FAILURE-DRILL and seven-day V-DEV-ROLLOUT-GATE.
    - V-PROD-ROLLOUT after separate production approval.
    - V-SPEC-VERIFY final.

