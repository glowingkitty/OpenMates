implementation_plan:
  spec_path: docs/specs/opencode-native-worktree-binding/spec.yml
  existing_patterns:
    - sessions.py detached worktrees, patch identity, finalization, and reconciliation
    - openmates-hooks.js identity binding, guards, leases, stale reads, and rewriting
    - OpenCode v1.17.19 compatibility-target project-copy, move-session, directory routing, Bash cwd, and child creation
  architecture: >
    Retain sessions.py as lifecycle authority, bind its source worktree into
    OpenCode's native directory, and use explicit native, fallback, or
    grandfathered modes. Validate patches in disposable integration worktrees and
    serialize only final refresh, commit, and non-force push.
  data_flow:
    - Bind OpenCode ID to repository session, create worktree, and bootstrap it.
    - Capability-probe and establish the native directory through safe movement or directory-scoped session creation before source edits.
    - Parent and new child requests execute natively from the source worktree.
    - Deploy captures selected patch and validates it in an exact-base integration worktree.
    - Finalization locks, refreshes dev, rebuilds and revalidates if needed, pushes, records evidence, and cleans integration state.
  affected_files:
    - {path: .opencode/plugins/openmates-hooks.js, reason: Bind native directory and retire rewriting for native sessions.}
    - {path: scripts/sessions.py, reason: Record binding/bootstrap and implement root-free integration.}
    - {path: scripts/verify_opencode_native_worktree.py, reason: Prove installed-runtime behavior.}
    - {path: scripts/tests/test_opencode_native_worktree_binding.mjs, reason: Verify plugin rollout contract.}
    - {path: scripts/tests/test_sessions_native_worktree_lifecycle.py, reason: Verify modes and grandfathering.}
    - {path: scripts/tests/test_sessions_worktree_bootstrap.py, reason: Verify prerequisites.}
    - {path: scripts/tests/test_sessions_integration_worktree.py, reason: Verify failure containment.}
    - {path: scripts/tests/test_sessions_integration_concurrency.py, reason: Verify finalization ordering.}
    - {path: scripts/tests/test_sessions_native_worktree_reconciliation.py, reason: Verify cleanup.}
    - {path: scripts/audit_native_worktree_scope.py, reason: Prevent this spec from absorbing presence implementation or dropping prior safety outcomes.}
    - {path: docs/contributing/guides/concurrent-sessions.md, reason: Document native directories and integration.}
    - {path: docs/architecture/agent-tooling-parity.md, reason: Document OpenCode binding boundary.}
    - {path: docs/specs/agent-presence-coordination/spec.yml, reason: Update dependency after implementation.}
  verification_strategy:
    - Confirm installed-runtime assumptions before production hook changes.
    - Write red tests before binding, bootstrap, or integration code.
    - Review pilot structural diagnostics before strict enforcement.
    - Keep grandfathered sessions deployable until natural finalization.
    - Run existing worktree suites and tooling audits after each slice.
    - Run spec_verify.py and obtain user confirmation before completion.
  verification_order:
    - installed OpenCode native directory and child proof
    - binding lifecycle and bootstrap tests
    - pilot binding and review
    - disposable integration and concurrency tests
    - strict binding and existing-worktree regressions
    - user confirmation

