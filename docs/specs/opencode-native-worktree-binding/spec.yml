  official_contracts:
    - OpenCode v1.17.19 is the compatibility target and supports detached git_worktree project copies and native TUI session movement.
    - Its sessions persist directory, request routing prefers session.directory, and Bash defaults to the current instance directory.
    - New task children are created in the parent instance context and therefore inherit its directory.
    - Programmatic project-copy and move-session routes are experimental and require installed-runtime proof before enforcement.
  local_evidence:
    - The current plugin rewrites read/edit paths while activeCwd remains the OpenCode process directory.
    - Transcript review found contention near 4 percent before and after enforcement, but concrete integration/recovery friction in at least 16.7 percent of post-enforcement top-level chats.
    - Chats reported missing dependencies, worktree-prefixed paths, partial root integration, patch reapplication failures, and root drift.
    - The repository sample had 233 linked worktrees, including 33 nested managed worktrees.
    - Deploy currently applies files to root, unlocks for gates, then relocks for commit and push.

apple_impact:
  affected_files: [none]
  parity_expectations: [Local developer tooling has no Apple product counterpart.]
  verification: [Apple verification is not required unless Apple source is unexpectedly changed.]
  intentional_native_differences: [none]

clarification:
  rounds:
    - question: Should the first spec cover only native binding or also root-free deploy integration?
      answer: Cover both native binding and disposable integration worktrees.
    - question: What should happen when native binding fails during rollout?
      answer: Permit a visible pilot fallback, then block source edits after strict rollout.
    - question: How should existing chats be handled?
      answer: Grandfather them under the legacy model without moving dirty state.
    - question: May integrations prepare concurrently?
      answer: Yes; serialize only final refresh, commit, and push.
    - question: How should worktrees receive ignored prerequisites?
      answer: Run deterministic worktree-local bootstrap backed by shared package caches.
  vision_summary: >
    New mutating chats execute natively in their detached worktree and pass that
    directory to child sessions. Existing chats finish through the legacy path,
    pilot failures remain visible, and live proof enables strict binding;
    deployments validate in disposable integration worktrees and converge on dev
    only through a short refresh, commit, and push lock.
  approved_by_user: true

