schema_version: 2
id: opencode-native-worktree-binding
title: Native OpenCode Worktree Binding and Isolated Integration
status: draft

goal: >
  Make each new mutating OpenCode chat execute natively inside its session
  worktree so file tools, Bash, generators, tests, and child sessions share one
  authoritative directory, then deploy through disposable integration worktrees
  so failed gates and concurrent deploys never leave partial patches in root.

scope:
  in:
    - Bind each new mutating OpenCode top-level session to the detached worktree created by sessions.py.
    - Make OpenCode session.directory equal the canonical repository-session worktree before the first source edit.
    - Bootstrap ignored dependencies and generated prerequisites deterministically inside new worktrees without mutating root dependencies.
    - Prove relative reads, edits, Bash commands, generators, and new child sessions use the bound worktree.
    - Retain path rewriting as a measured pilot fallback, then require native binding after live verification.
    - Grandfather already-running legacy chats without moving or discarding their dirty state.
    - Replace root patch application during deploy with disposable integration worktrees based on exact origin/dev commits.
    - Allow parallel integration preparation and validation, with a short lock for final refresh, commit, and push.
    - Rebuild and revalidate prepared work when origin/dev advances; never overwrite or force-push newer dev work.
    - Preserve edit leases, stale-read checks, deploy selection, blocked-deploy visibility, finalization, reconciliation, manifests, and release readiness.
    - Add deterministic tests and an isolated real OpenCode verifier before strict rollout.
  out:
    - Upgrading OpenCode or enforcing a hardcoded OpenCode version.
    - Implementing docs/specs/agent-presence-coordination/spec.yml.
    - Changing the verified stale-worktree deletion policy.
    - Replacing edit leases, stale-read checks, Docker locks, test-account leases, or commit-scoped deployed verification.
    - Isolating Docker, the dev API, databases, caches, test accounts, providers, or Vercel aliases.
    - Adding a background integration worker or automatic merge queue.
    - Migrating active legacy chats or force-moving root changes.
    - Adding an OpenMates product API or user-facing web/Apple UI.

