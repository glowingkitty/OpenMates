decisions:
  - id: D-1
    status: active
    decision: Keep Git worktrees as the source-edit isolation primitive.
    reason: Shared root reintroduces file, untracked-content, and index contamination.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: active
    decision: Bind new mutating sessions to their actual worktree directory.
    reason: File tools, Bash, generators, tests, and children need one workspace.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: active
    decision: Keep rewriting only for pilot fallback and grandfathered sessions, then require native binding.
    reason: Transition safely without retaining split-directory execution permanently.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-4
    status: active
    decision: Bootstrap worktree-local prerequisites using shared immutable caches, not writable root dependencies.
    reason: Local commands must work without cross-session dependency mutation.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-5
    status: active
    decision: Validate selected patches in disposable integration worktrees.
    reason: Failed gates and retries must not partially modify root.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-6
    status: active
    decision: Allow parallel preparation and serialize only final refresh, commit, and non-force push.
    reason: Long gates should not hold a global deploy lock.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-7
    status: active
    decision: Keep presence and shared runtime identity outside this spec.
    reason: They have separate state and failure boundaries.
    decided_at: "2026-08-04T00:00:00Z"

attempts:
