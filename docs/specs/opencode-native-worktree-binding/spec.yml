contracts:
  api:
    access_model: local developer tooling only
    changed_endpoints: none in OpenMates; capability-probes the installed local OpenCode directory-scoped session, project-copy, and move-session surfaces
    auth: local OpenCode client/server authentication only
    rate_limits: one bind attempt per repository session plus bounded retry
    credit_budget: no OpenMates credits or provider calls
    encryption_boundary: no encrypted or decrypted OpenMates product data
  workspace_identity:
    - Store repository session ID, OpenCode session ID, canonical worktree path, binding mode, status, and structural failure reason.
    - binding_mode is native, pilot_fallback, or legacy_grandfathered; modes never overlap.
    - Native binding finishes before source edits; read-only questions need no worktree.
    - Lease and stale-read keys normalize to repository-relative paths.
    - New children inherit native directory; resumed children with another directory are not silently remapped.
  bootstrap:
    - Bootstrap is idempotent, bounded, observable, and worktree-local.
    - Shared immutable caches are allowed; writable root dependencies and generated artifacts are not shared.
    - The first supported scope covers frontend workspace dependency links plus generated design-token and locale prerequisites required by existing scoped lint commands.
    - TASK-1 must record the measured bootstrap time budget and exact cache/link layout before implementation begins.
    - Failure records a stable structural reason and follows pilot or strict policy.
  integration:
    - Each preparation uses a unique integration worktree at an exact fetched origin/dev commit.
    - Only the selected source patch enters it; all gates, staging, hooks, and commit creation run there.
    - Root remains orchestration-only and unchanged by preparation or failure.
    - Finalization locks, fetches dev, compares the base, rebuilds and revalidates if advanced, and pushes without force.
    - Record exact commit, patch identity, source base, final base, and integration identity.
    - Conflict records a blocked item without modifying root, source worktree, or dev.
  migration:
    - Pilot stores only structural success, failure, timing, child-inheritance, and root-cleanliness diagnostics.
    - Existing sessions become legacy_grandfathered and finalize normally.
    - Strict mode applies only to new sessions after pilot evidence is accepted.
    - Rewrite helpers remain only while grandfathered sessions exist.
  privacy_security:
    - Persist no prompts, responses, reasoning, tool data, source patches, file contents, environment values, credentials, or secrets.
    - Stored paths are canonical and repository-scoped; reject traversal and symlink escapes.
    - Live verification uses temporary Git/OpenCode state, synthetic identities, and random ports.
    - Never force-delete worktrees with unique or uncertain changes.

tests:
