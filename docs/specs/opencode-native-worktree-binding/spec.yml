scenarios:
  - id: S-1
    title: New mutating chat binds to its real worktree
    given: [A new top-level OpenCode chat starts in OpenMates.]
    when: [The chat initializes repository work that may edit source.]
    then:
      - OpenCode session.directory equals the canonical session worktree before the first source edit.
      - Relative reads, edits, and Bash commands resolve there without rewriting.
      - Root remains unchanged.
  - id: S-2
    title: Bootstrap provides local prerequisites
    given: [The detached worktree excludes ignored dependencies and generated prerequisites.]
    when: [Native binding initializes the worktree.]
    then:
      - Bounded idempotent bootstrap creates valid worktree-local links and generated prerequisites.
      - Shared caches may be reused, but writable root dependency directories are unchanged.
      - Failure is visible in session diagnostics.
  - id: S-3
    title: Pilot fallback is visible and temporary
    given: [Native move or bootstrap fails for a new pilot session.]
    when: [The session reaches an edit boundary.]
    then:
      - Pilot mode records one failure reason and may use legacy rewriting.
      - Native and rewritten paths are never mixed silently.
      - Strict mode blocks the same failure with an actionable retry path.
  - id: S-4
    title: Existing chats finish without forced migration
    given: [A chat began under the legacy model and may contain dirty worktree state.]
    when: [Native binding rollout begins.]
    then:
      - It remains explicitly grandfathered and keeps its existing path.
      - Its files are not moved, reset, discarded, or copied automatically.
      - New worktrees cannot be created beneath an existing managed worktree.
  - id: S-5
    title: Child inherits the parent worktree
    given: [A natively bound parent launches a new task child.]
    when: [The child reads or runs Bash without an explicit workdir.]
    then:
      - Child and parent directories match.
      - The child sees the parent's uncommitted changes through relative tools.
  - id: S-6
    title: Failed deploy leaves root unchanged
    given: [A selected session patch has a gate that will fail.]
    when: [The session runs sessions.py deploy.]
    then:
      - Deploy applies only that patch to an integration worktree based on exact origin/dev.
      - Gates run there and report the failure.
      - Root, root index, origin/dev, and source worktree remain unchanged by integration.
      - Retry does not reapply a patch to root.
  - id: S-7
    title: Parallel preparation converges safely
    given: [Sessions A and B validate from the same origin/dev base.]
    when: [A pushes first and B later finalizes.]
    then:
      - B refreshes and rebuilds on current origin/dev.
      - B reruns every invalidated gate.
      - A is never overwritten or force-pushed.
      - A true conflict becomes a visible blocked integration.
  - id: S-8
    title: Existing safety contracts survive migration
    given: [Native and grandfathered sessions coexist.]
    when: [They edit, deploy, finalize, reconcile, or prepare a pull request.]
    then:
      - Leases and stale reads use canonical repository-relative paths.
      - Deploy selection includes no foreign files.
      - Integrated worktrees finalize transactionally.
      - Residual, blocked, stale, orphaned, and uncertain work stays visible.

