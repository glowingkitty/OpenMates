    type: unit
    file: scripts/tests/test_opencode_native_worktree_binding.mjs
    command: node --test scripts/tests/test_opencode_native_worktree_binding.mjs
    covers: [AC-1, AC-3]
    assertions:
      - bind exact OpenCode identity once and disable rewriting only in native mode
      - pilot failure records fallback while strict failure blocks source edits
      - no binding action creates an unsolicited prompt or assistant turn
    red_phase: {required: true, expected: fail, evidence: {status: failed, command: "node --test scripts/tests/test_opencode_native_worktree_binding.mjs", run_id: "local-red-native-binding", subject_commit: "eb6139578acf84908d23d68eb9e8cdf299e8f3f1", timestamp: "2026-08-04T13:30:00Z"}}
    green_phase: {required: true, expected: pass, evidence: {status: passed, command: "node --test scripts/tests/test_opencode_native_worktree_binding.mjs", run_id: "local-green-native-binding", subject_commit: "e317916f58ebbc62c06f844d16101800fcf51985", timestamp: "2026-08-04T20:28:59Z"}}
  - id: T-PYTEST-LIFECYCLE
    type: pytest
    file: scripts/tests/test_sessions_native_worktree_lifecycle.py
    command: python3 -m pytest scripts/tests/test_sessions_native_worktree_lifecycle.py
    covers: [AC-3, AC-4]
    assertions:
      - binding modes are mutually exclusive and grandfathered sessions are never moved
