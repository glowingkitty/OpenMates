assumptions:
  - id: A-1
    text: GitHub-hosted runners can reach the configured dev web and API URLs.
    category: infrastructure
    required_before: task_execution
    status: confirmed
    evidence:
      - source: .github/workflows/playwright-spec.yml
        summary: Existing ubuntu-latest jobs use those public URLs.
  - id: A-2
    text: The repository can publish and read a named commit status on an exact SHA.
    category: github
    required_before: implementation
    status: confirmed
    evidence:
      - source: GitHub commit statuses API
        summary: The authenticated repository operator can publish status and Actions can read it.
  - id: A-3
    text: The first automatic PR run cannot occur until the workflow exists on main.
    category: github
    required_before: task_execution
    status: confirmed
    evidence:
      - source: GitHub Actions pull_request behavior
        summary: The workflow file must exist on the base branch.

contracts:
  api:
    - route: GitHub commit statuses API
      access_model: internal-only
      auth: Authenticated gh CLI writes on the dev host; workflow GITHUB_TOKEN reads.
      rate_limits: GitHub repository API limits apply.
      credit_budget: No OpenMates credits are used by attestation.
      encryption_boundary: No encrypted or decrypted user data is handled.
      request: Publish or read a stable status context for an exact SHA.
      response: State, context, description, and target URL.
      errors:
        - Missing or non-success status fails readiness.
  data:
    - CORE_JOURNEY_SPECS is canonical for hourly smoke and release CI.
    - Release-candidate attestation is keyed by exact Git SHA and a stable context and is published only after exact-SHA Vercel readiness plus backend health.
  ui_states:
    - No product UI changes.
  privacy_security:
    - Use pull_request, never pull_request_target.
    - Reject sources other than the same-repository dev branch.
    - Use minimum permissions and explicitly mapped secrets.
    - Disable credential updates for release calls.
    - Never log or persist test credentials in tracked files.

