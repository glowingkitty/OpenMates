schema_version: 2
id: release-core-journeys-gate
title: Release Core Journeys Gate
status: implementing

goal: >
  Prevent promotion from dev to main when the deployed development release
  candidate cannot complete essential reachability, signup, billing, and chat
  journeys, while keeping non-core failures advisory.

scope:
  in:
    - One canonical core-journey Playwright suite shared by hourly smoke and release CI.
    - A GitHub Actions workflow for dev-to-main pull requests and manual bootstrap runs.
    - Commit-pinned test code, deployment readiness checks, and one aggregate gate result.
    - A dev-host command that prepares core Docker services and publishes a commit status attestation.
    - Account-level Playwright serialization and advisory rollout documentation.
  out:
    - Opening or merging a dev-to-main pull request in this session.
    - Changing branch protection before advisory validation succeeds.
    - Making the complete nightly test suite release-blocking.
    - Giving GitHub Actions remote Docker access to the dev host.

context_discovery:
  github_issues:
    - No matching public issue found for release gate, core journeys, branch protection, or required checks.
  docs:
    - docs/architecture/test-orchestration.md
    - docs/contributing/guides/git-and-deployment.md
    - docs/contributing/guides/testing.md
    - frontend/apps/web_app/tests/dev-smoke/README.md
  code_patterns:
    - .github/workflows/playwright-spec.yml
    - scripts/run_tests.py
    - scripts/tests.py
    - scripts/sessions.py
  tests:
    - scripts/tests/test_run_tests_account_policy.py
    - frontend/apps/web_app/tests/dev-smoke/dev-smoke-reachability.spec.ts
    - frontend/apps/web_app/tests/chat-flow.spec.ts
    - frontend/apps/web_app/tests/settings-buy-credits-stripe-managed.spec.ts
    - frontend/apps/web_app/tests/signup-flow-stripe-managed.spec.ts

apple_impact:
  affected_files: [none]
  parity_expectations:
    - Release automation does not change Apple application behavior.
  verification:
    - Not required.
  intentional_native_differences: [none]

clarification:
  rounds:
    - question: Should fixed signup, billing, and chat journeys block dev-to-main promotion while other failures remain advisory?
      answer: Yes; implement the core journeys release gate.
    - question: Should the authoritative result run locally or in GitHub CI?
      answer: GitHub CI owns the result while exercising the real dev deployment.
    - question: Should this session create or merge the dev-to-main pull request?
      answer: No; the user will handle it later.
  vision_summary: >
    GitHub exposes one stable core-journey result. The dev host prepares and
    attests the Docker-backed backend because GitHub-hosted runners cannot control
    it. The workflow starts advisory and the first promotion uses manual dispatch
    because the new pull-request workflow is not yet present on main.
  approved_by_user: true

implementation_state:
  subject_commit: b19f7ae4b0b3ee4e40b298f55e230556edf86274

approvals:
  product_contract:
    status: approved
    approved_at: "2026-08-03T00:00:00Z"
    reason: The user approved the plan and requested implementation.
  implementation_plan:
    status: approved
    approved_at: "2026-08-03T00:00:00Z"
    reason: The user approved GitHub CI orchestration with dev-host preparation.

decisions:
  - id: D-1
    status: active
    decision: Require one aggregate job rather than individual matrix jobs.
    reason: It provides a stable branch-protection contract.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep Docker control on the dev host and publish a commit-scoped status.
    reason: GitHub-hosted runners cannot safely operate the local dev Docker stack.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-3
    status: active
    decision: Defer branch-protection changes until advisory runs are green.
    reason: The current ruleset covers main and dev and the new check is unproven.
    decided_at: "2026-08-03T00:00:00Z"
  - id: D-4
    status: active
    decision: Bootstrap through scripts/tests.py run --core-journeys with an exact commit.
    reason: GitHub does not register or trigger a brand-new workflow from a non-default branch.
    decided_at: "2026-08-03T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Reuse hourly dev mode unchanged.
    outcome: rejected
    recorded_at: "2026-08-03T00:00:00Z"
    note: Hourly mode lacks the required commit pinning and normal account preflight behavior.
  - id: ATTEMPT-2
    task_id: TASK-4
    approach: Manually dispatch the new aggregate workflow from dev before it exists on main.
    outcome: rejected
    recorded_at: "2026-08-03T16:50:00Z"
    note: GitHub returned 404 because brand-new workflows are not registered from non-default branches; bootstrap now uses the existing single-spec workflow through scripts/tests.py.

handoff:
  current_task_id: TASK-1
  next_action: Add and run red workflow contract tests.
  command: python3 -m pytest scripts/tests/test_release_core_journeys_gate.py -q
  expected_outcome: Tests fail because the workflow and preparation command do not exist.
  blocker: null
  last_verified_commit: b19f7ae4b0b3ee4e40b298f55e230556edf86274

scenarios:
  - id: S-1
    title: Attested release candidate passes every core journey
    given:
      - A dev-to-main PR or manual bootstrap identifies an exact dev commit.
      - Vercel is Ready and backend preparation succeeded for that commit.
    when:
      - GitHub runs the canonical core suite.
    then:
      - Every spec checks out the exact commit.
      - All specs run even if one fails.
      - The aggregate gate succeeds only when every prerequisite succeeds.
  - id: S-2
    title: Core failure blocks promotion
    given:
      - Deployment provenance is valid.
    when:
      - Reachability, signup, billing, or chat fails.
    then:
      - Diagnostic artifacts are preserved.
      - The remaining core specs complete.
      - The aggregate gate fails.
  - id: S-3
    title: Missing backend preparation fails closed
    given:
      - The exact commit lacks a successful backend release-candidate status.
    when:
      - Deployment readiness runs.
    then:
      - Browser journeys do not start.
      - The aggregate gate fails with preparation instructions.
  - id: S-4
    title: Superseded runs do not collide on shared accounts
    given:
      - A release workflow is active.
    when:
      - A newer dev commit starts another run.
    then:
      - The old release run is cancelled.
      - Every single-spec workflow invocation serializes by account slot.
  - id: S-5
    title: Initial workflow reaches main safely
    given:
      - Main does not contain the release workflow yet.
    when:
      - The first promotion is prepared.
    then:
      - An operator runs the canonical suite through scripts/tests.py for the exact commit.
      - Automation does not create or merge the PR.
      - Required-check enforcement remains deferred until advisory proof exists.

