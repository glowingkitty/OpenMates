    verification_scope: custom
    verification_ids: [T-PY-CORE-GATE, V-ATTESTATION]
  - id: AC-5
    scenario: S-4
    text: PR concurrency cancels superseded runs and account concurrency serializes single-spec runs.
    required: true
    status: pending
    coverage_status: covered
    verification_scope: full_ci
    verification_ids: [T-PY-CORE-GATE]
  - id: AC-6
