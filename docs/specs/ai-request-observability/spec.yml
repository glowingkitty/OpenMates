implementation_plan:
  spec: docs/specs/ai-request-observability/spec.yml
  spec_path: docs/specs/ai-request-observability/spec.yml
  contract_classification: new_contract
  permanent_assertions:
    - ai-request-observability.propagation.complete
    - ai-request-observability.waterfall.complete
    - ai-request-observability.default-metrics.identity-free
    - ai-request-observability.structural-traces.content-free
    - ai-request-observability.diagnostic-mode.bounded
    - ai-request-observability.exporter.allowlist
    - ai-request-observability.operator-debug.waterfall
    - ai-request-observability.retention.verified
    - ai-request-observability.alerts.discord-email-fallback
    - ai-request-observability.no-behavior-change
  architecture: >
    Reuse the existing OpenTelemetry-to-OpenObserve path, but make standard OTel
    context propagation and a reviewed attribute registry authoritative. Add
    low-cardinality histograms for all turns, sampled structural spans for
    request waterfalls, and a bounded diagnostic scope. Reuse existing
    operational monitoring delivery for milestone-two Discord-first alerts.
  existing_patterns:
    - Shared Python tracing setup already configures OTLP export and automatic FastAPI, HTTPX, Celery, and Redis instrumentation.
    - W3C traceparent helpers already carry context in reserved WebSocket payload metadata.
    - The debug trace CLI already queries OpenObserve and renders trace trees.
    - Operational monitoring already supports sanitized Discord and server-owner email delivery receipts.
  data_flow:
    - The browser starts one active request span and injects its W3C traceparent into the authenticated WebSocket message.
    - The API extracts and activates that context, then Celery instrumentation propagates it into the AI worker.
    - The worker creates one AI-turn span with bounded child phases and records identity-free histograms.
    - The privacy exporter drops unknown and forbidden attributes before OTLP sends spans to self-hosted OpenObserve.
    - The operator CLI queries one trace and renders only reviewed structural fields and missing-span diagnostics.
    - After the baseline gate, aggregate rules create incidents routed to Discord or conditional server-admin email fallback.
  phase_order:
    - Write and record failing propagation, privacy, waterfall, debug, audit, and alert-routing tests before product source changes.
    - Milestone 1A: repair browser/WebSocket/Celery/worker context and make privacy allowlists authoritative.
    - Milestone 1B: instrument AI phases and metrics, then add the redacted debug waterfall.
    - Restart affected dev API and AI workers under repository locks and prove one real authenticated dev trace.
    - Verify retention and collect seven complete privacy-valid dev days.
    - Milestone 2: create dashboards, derive sustained thresholds, and implement Discord-first alert fallback.
    - Run controlled dev alert drills and artifact review.
    - Request separate production approval; do not activate production telemetry changes or alerts before it.
  affected_files:
    - {path: frontend/packages/ui/src/services/tracing/wsSpans.ts, reason: Create active request spans, inject traceparent, and record request traces consistently.}
    - {path: frontend/packages/ui/src/services/sendersChatMessages.ts, reason: Keep the send span active through WebSocket payload injection.}
    - {path: backend/shared/python_utils/tracing/ws_span_helper.py, reason: Attach standard active OTel span context.}
    - {path: backend/shared/python_utils/tracing/privacy_filter.py, reason: Enforce reviewed allowlists and remove raw identity/error escalation.}
    - {path: backend/shared/python_utils/tracing/config.py, reason: Register privacy-safe span and metric exporters consistently.}
    - {path: backend/apps/ai/tasks/stream_consumer.py, reason: Initialize worker tracing and root AI-turn/finalization spans.}
    - {path: backend/apps/ai/processing/preprocessor.py, reason: Instrument local and provider preprocessing phases.}
    - {path: backend/apps/ai/processing/main_processor.py, reason: Instrument model iterations, TTFT, streaming, tool calls, and aggregate counts.}
    - {path: backend/scripts/debug_trace.py, reason: Render deterministic redacted AI waterfalls and gaps.}
    - {path: backend/core/monitoring, reason: Add aggregate AI dashboard and sustained alert configuration after baseline.}
    - {path: backend/core/api/app/services/operational_monitoring.py, reason: Reuse content-free Discord-primary and conditional email-fallback delivery.}
    - {path: scripts/audit_ai_observability_contract.py, reason: Prevent unreviewed telemetry fields and missing worker initialization.}
    - {path: scripts/verify_ai_observability.py, reason: Verify retention, baseline completeness, and controlled alert routing.}
  verification_strategy:
    - Require red tests to fail for the discovered propagation, privacy, worker-init, waterfall, and routing gaps.
    - Run focused backend pytest and dispatched Vitest green checks.
    - Restart only API and affected AI workers, then send one real authenticated dev chat without extra provider calls beyond the normal request.
    - Query the resulting trace through the operator CLI and inspect only content-free output.
    - Run the deterministic source audit and retention verifier.
    - Delay dashboard thresholds and alerts until seven days of complete dev evidence pass privacy review.
    - Drill Discord acceptance, Discord unavailability with enabled email, and both unavailable/disabled states.
  verification_order:
    - T-TRACE-PROPAGATION, T-WEB-TRACE-CONTEXT, T-TRACE-PRIVACY, T-AI-WATERFALL, T-DEBUG-TRACE, T-OBSERVABILITY-AUDIT, and T-AI-ALERT-ROUTING red evidence.
    - Milestone-one focused green tests and deterministic audit.
    - V-DEV-AI-TRACE and V-OPENOBSERVE-RETENTION against the real dev stack.
    - V-DEV-BASELINE after seven complete privacy-valid days.
    - Milestone-two T-AI-ALERT-ROUTING, V-DASHBOARD-REVIEW, and V-DEV-ALERT-DRILL.
    - V-SPEC-VERIFY, then separate V-PRODUCTION-ROLLOUT approval.
  risks:
    - High-cardinality attributes can increase OpenObserve cost; reviewed enums and histograms are mandatory.
    - Incorrect context attachment can join unrelated users' turns; context teardown and concurrency tests are mandatory.
    - Exact counts can fingerprint uncommon requests; default buckets and expiring diagnostic scope are mandatory.
    - Instrumentation overhead can affect latency; measure exporter and span overhead and keep content transformation out of the hot path.
    - Alert thresholds can become noisy; milestone two remains blocked until baseline coverage is sufficient.
  open_questions: []
  separate_technical_approval_required: false
  first_slice: Add red tests for exporter allowlisting and end-to-end trace context before product source changes.

