    text: Existing OpenTelemetry libraries support standard context attachment across browser, WebSocket, Celery, and worker processes without a new provider.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/tests/test_tracing/test_integration.py
        summary: Existing tests already exercise W3C traceparent extraction/injection and Celery instrumentation dependencies.
  - id: A-2
    text: Existing OpenObserve and Prometheus infrastructure can store/query the approved spans and histograms without a public endpoint or third-party service.
    category: infrastructure
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/core/docker-compose.yml
        summary: Self-hosted OpenObserve, OTel, Prometheus, and monitoring services already exist.
  - id: A-3
    text: Existing operational monitoring delivery can enforce Discord-primary and conditional server-admin email fallback without exposing destinations.
    category: architecture
    required_before: task_execution
    status: confirmed
    evidence:
      - source: backend/core/api/app/services/operational_monitoring.py
        summary: Existing helpers resolve environment-specific Discord and server-owner notification configuration.
      - source: backend/core/api/app/tasks/operational_monitoring_tasks.py
        summary: Existing tasks record channel-specific sanitized delivery states.
  - id: A-4
    text: Seven days of dev telemetry will contain enough representative AI traffic to set initial sustained thresholds.
    category: operations
    required_before: task_execution
    status: unchecked
    blocker: Extend the baseline window or run approved representative dev traffic if sample coverage is insufficient.

contracts:
  api:
    changed: false
    access_model: first-party client surface only
    auth: Existing authenticated WebSocket session and internal Celery/OTel service credentials; no new endpoint.
    owner_team_scope: Existing chat ownership remains unchanged; telemetry contains no owner/team identifier.
    rate_limits: Existing chat and internal telemetry ingestion limits apply; diagnostic CLI queries are bounded to one trace and operator credentials.
    credit_budget: Telemetry creates no OpenMates credit charge and invokes no additional paid AI/provider requests.
    encryption_boundary: Client-encrypted chat payloads remain on existing paths and are never copied, decrypted, or exported by observability instrumentation.
    plaintext_handling: AI workers already process authorized plaintext in memory; instrumentation may measure counts/durations only and cannot export plaintext or derived content.
  telemetry:
    default_metrics: Identity-free low-cardinality histograms for all turns.
    default_traces: Content-free sampled structural spans with bucketed counts and one request-scoped trace ID.
    diagnostic_mode: Audited incident or explicit opt-in scope with owner, reason, start, expiry, and exact approved non-content fields.
    forbidden: [prompt, response, message, title, tool_parameters, tool_results, url, filename, ciphertext, key_material, raw_provider_payload, raw_exception, user_id, chat_id, message_id, task_id, device_id, session_id, cache_key]
    retention: Verify effective 14 days; reject configuration above 30 days.
  alert_delivery:
    primary: Connected and configured Discord.
    fallback: Server-admin email only when Discord is unavailable and server-owner email notifications are enabled.
    deduplication: Accepted Discord suppresses email for the same logical alert; one recovery event closes each incident.
    receipt_fields: [environment, logical_alert_id, channel, attempted_at, accepted_or_failed_or_unavailable, sanitized_failure_class]
    forbidden_receipt_fields: [destination, webhook_url, email_address, secret, user_id, chat_id, raw_error]
  phase_gates:
    rest_websocket: Real authenticated dev WebSocket chat proves browser-to-worker propagation; no endpoint contract changes.
    cli: Internal debug.py trace request command proves the operator waterfall against the real dev OpenObserve stream.
    sdks: Not applicable because observability is not exposed through npm or pip SDKs.
    web: Browser propagation is verified through the real dev chat path; no user-visible UI or Playwright visual change.
    visual_smoke: Not applicable because there is no user-facing visual change.
    user_confirmation: Not applicable because behavior and UI are unchanged.
    apple: Not affected.

tests:
  - id: T-TRACE-PROPAGATION
    type: pytest
    file: backend/tests/test_tracing/test_integration.py
    command: python3 -m pytest backend/tests/test_tracing/test_integration.py backend/tests/test_tracing/test_ws_trace_context.py backend/tests/test_tracing/test_handler_instrumentation.py -q
    covers: [AC-1]
    contract_assertions: [ai-request-observability.propagation.complete]
    assertions:
      - WebSocket handler spans attach extracted W3C parent context as the active span.
      - Celery producer and worker spans retain the trace lineage.
      - AI worker tracing initializes before task processing.
      - Missing context yields an explicit gap without throwing or fabricating lineage.
    red_phase: {required: true, expected: fail_before_implementation, status: pending, evidence: {}}
    green_phase: {required: true, expected: pass_after_implementation, status: pending, evidence: {}}
  - id: T-WEB-TRACE-CONTEXT
    type: vitest
    file: frontend/packages/ui/src/services/tracing/__tests__/wsSpans.test.ts
    command: python3 scripts/tests.py run --suite vitest --test wsSpans
    covers: [AC-1]
    contract_assertions: [ai-request-observability.propagation.complete]
    assertions:
      - The message-send span is active while traceparent is injected.
      - Every issued request trace can enter the bounded issue-report ring once.
      - No trace context leaks to later unrelated messages.
    red_phase: {required: true, expected: fail_before_implementation, status: pending, evidence: {}}
    green_phase: {required: true, expected: pass_after_implementation, status: pending, evidence: {}}
  - id: T-TRACE-PRIVACY
    type: pytest
    file: backend/tests/test_tracing/test_privacy_filter.py
    command: python3 -m pytest backend/tests/test_tracing/test_privacy_filter.py backend/tests/test_tracing/test_user_attribute_injection.py -q
    covers: [AC-2, AC-5]
    contract_assertions: [ai-request-observability.default-metrics.identity-free, ai-request-observability.structural-traces.content-free, ai-request-observability.diagnostic-mode.bounded, ai-request-observability.exporter.allowlist]
    assertions:
      - Unknown attributes are dropped in production and dev export paths.
      - Raw user IDs and raw exception text never survive export at any tier.
      - Default counts are bucketed and diagnostic-only exact fields require an unexpired approved scope.
      - Forbidden content fields remain rejected in diagnostic mode.
    red_phase: {required: true, expected: fail_before_implementation, status: pending, evidence: {}}
    green_phase: {required: true, expected: pass_after_implementation, status: pending, evidence: {}}
  - id: T-AI-WATERFALL
    type: pytest
    file: backend/tests/test_ai_request_observability.py
    command: python3 -m pytest backend/tests/test_ai_request_observability.py -q
    covers: [AC-3, AC-9]
    contract_assertions: [ai-request-observability.waterfall.complete, ai-request-observability.no-behavior-change]
    assertions:
