decisions:
  - id: D-1
    status: active
    decision: Establish observability before changing prompts, model routing, context selection, tool planning, or processing order.
    reason: Existing production evidence cannot attribute the 48-second turn precisely enough to justify behavioral optimization.
    decided_at: "2026-08-24T00:00:00Z"
  - id: D-2
    status: active
    decision: Default telemetry uses identity-free aggregate metrics and content-free structural traces with bucketed counts.
    reason: Aggregate distributions provide operational value without persistent user or chat correlation.
    decided_at: "2026-08-24T00:00:00Z"
  - id: D-3
    status: active
    decision: Exact non-content counts require explicit audited and time-bounded diagnostic mode.
    reason: Exact sizes improve incident diagnosis but can increase fingerprinting risk when retained by default.
    decided_at: "2026-08-24T00:00:00Z"
  - id: D-4
    status: active
    decision: Dashboards and alerts follow a stable seven-day dev baseline.
    reason: Measured distributions are required to choose useful sustained thresholds without noisy alerts.
    decided_at: "2026-08-24T00:00:00Z"
  - id: D-5
    status: active
    decision: Connected Discord is primary; enabled server-admin email is attempted only when Discord is unavailable.
    reason: This avoids duplicate notifications while preserving an operator fallback.
    decided_at: "2026-08-24T00:00:00Z"

scenarios:
  - id: S-1
    title: One chat turn produces one complete distributed trace
    given:
      - An authenticated user sends a normal chat message from the web app.
      - The request reaches the WebSocket API and AI worker through Celery.
    when:
      - The worker streams and persists the response.
    then:
      - One trace links browser send, WebSocket handler, API dispatch, Celery producer, worker task, AI phases, and final-marker publication.
      - Missing propagation is reported as a trace gap rather than a falsely complete waterfall.
  - id: S-2
    title: Default telemetry remains identity-free and content-free
    given:
      - A regular AI turn includes private chat content and tool arguments.
    when:
      - Metrics and sampled spans are exported.
    then:
      - Metrics contain only reviewed low-cardinality dimensions and histograms.
      - Spans contain reviewed structural fields and one request-scoped trace identifier.
      - Content, stable product IDs, destinations, secrets, raw errors, URLs, and filenames are absent.
  - id: S-3
    title: Operator diagnoses a slow multi-tool request
    given:
      - A sampled turn uses web and image capabilities across multiple model iterations.
    when:
      - The operator queries its trace ID through the debug CLI.
    then:
      - The CLI shows queue, preparation, preprocessing, provider, TTFT, streaming, tool, validation, billing, persistence, final-marker, and postprocessing durations.
      - Counts are bucketed unless approved diagnostic mode was active.
      - No raw span payload or private identifier is printed.
  - id: S-4
    title: Diagnostic mode expires without weakening content restrictions
    given:
      - An operator opens an audited diagnostic scope for an incident or an opted-in turn.
    when:
      - Exact non-content counts and approved identifiers are exported.
    then:
      - The scope has an owner, reason, expiry, and audit record.
      - Prompts, responses, tool parameters/results, URLs, filenames, ciphertext, secrets, and raw errors remain forbidden.
      - The scope stops exporting diagnostic-only values after expiry.
  - id: S-5
    title: Baseline produces meaningful dashboards and thresholds
    given:
      - Milestone-one telemetry has remained complete and privacy-valid on dev for seven days.
    when:
      - Operators create OpenObserve dashboards and derive alert thresholds.
    then:
      - Dashboards show total and phase P50/P95/P99 latency, TTFT, queueing, tools, finalization, retries, errors, and complexity distributions.
      - Thresholds are documented from observed distributions and require sustained breach windows.
      - No per-user or per-chat breakdown exists.
  - id: S-6
    title: Alert delivery uses Discord with enabled email fallback
    given:
      - A sustained AI observability threshold is breached.
    when:
      - Connected Discord accepts the alert.
    then:
      - Email is not attempted for that logical alert.
      - A redacted Discord delivery receipt is recorded.
    alternatives:
      - If Discord is unavailable and server-owner email notifications are enabled, one content-free email fallback is attempted.
      - If both channels are unavailable or disabled, state remains explicitly undelivered rather than falsely successful.

