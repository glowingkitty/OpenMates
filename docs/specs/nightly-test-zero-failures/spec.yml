contracts:
  api:
    - access_model: internal_only
      route: none
      auth: Existing Directus test-control-plane credentials and GitHub Actions permissions only.
      rate_limits: Existing test-control-plane and GitHub Actions limits.
      credit_budget: No product credits are introduced by the tooling contract.
      encryption_boundary: Test metadata only; no client-side encrypted product content is accepted or returned.
  data:
    - Existing test catalog, current-state, campaign, group, run, result, and claim records gain bounded metadata where possible.
    - Raw email addresses, credentials, cookies, message bodies, and private URLs are never persisted in test reliability records.
  ui_states: [not_applicable]
  privacy_security:
    - Gmail credentials remain GitHub or Vault secrets and never enter source, test output, Directus records, or agent prompts.
    - Gmail aliases are redacted or hashed in persisted evidence.
    - Gift-card test authorization uses an exact identity boundary, never the shared gmail.com domain.

