decisions:
  - id: D-1
    status: active
    decision: Gmail is the only active automated-test inbox receiver.
    reason: The Mailosaur subscription is inactive and fallback behavior produces stale assumptions and impossible recipient/provider combinations.
    decided_at: "2026-08-16T00:00:00Z"
  - id: D-2
    status: active
    decision: Deterministic and live-probe lanes report separately, but neither can hide failures and global zero requires both lanes green.
    reason: Separate ownership improves diagnosis without weakening the eventual quality goal.
    decided_at: "2026-08-16T00:00:00Z"
  - id: D-3
    status: active
    decision: Failed tests are never quarantined or converted to green by retries.
    reason: The user prefers visible risk over a faster but potentially misleading gate.
    decided_at: "2026-08-16T00:00:00Z"
  - id: D-4
    status: active
    decision: The global campaign requires a final full nightly-equivalent zero-failure run.
    reason: Batch interactions and shared-state contamination are not proved by isolated group reruns.
    decided_at: "2026-08-16T00:00:00Z"
  - id: D-5
    status: active
    decision: Historical unrelated failures do not block feature work whose scoped required checks pass.
    reason: Failure reduction must not stop product development, while newly attributable regressions remain owned by the introducing change.
    decided_at: "2026-08-16T00:00:00Z"
  - id: D-6
    status: active
    decision: No proof video is required for this non-visual internal tooling implementation.
    reason: The user explicitly waived proof video and no product UI is changed.
    decided_at: "2026-08-16T00:00:00Z"

