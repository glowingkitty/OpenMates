scenarios:
  - id: S-1
    title: Gmail is the only automated email receiver
    given:
      - Gmail OAuth credentials and a dedicated Gmail test address are configured.
    when:
      - An email-dependent test creates a client and a run-scoped recipient.
    then:
      - The client uses Gmail and exposes provider-neutral helper names.
      - The recipient is a Gmail alias belonging to the configured test inbox.
      - Mailosaur configuration cannot select a fallback client.
      - Exact test-identity authorization replaces unsafe gmail.com-wide authorization.
  - id: S-2
    title: Failed shared prerequisite creates one parent incident
    given:
      - The task worker is unavailable before 18 dependent Playwright specs would run.
    when:
      - The nightly prerequisite graph executes.
    then:
      - One environment-health parent incident is recorded.
      - All 18 dependants remain visible as blocked_by_parent and none count as passed.
      - Triage does not create 18 independent root-cause groups.
  - id: S-3
    title: Correlated embed failures share one actionable group
    given:
      - Multiple skill specs lack a parent embed.
      - The same run contains WebSocket disconnects and embed persistence or decryption failures.
    when:
      - Dependency-aware triage runs.
    then:
      - The failures group under embed_delivery before selector text is considered.
      - The group links correlated evidence, affected tests, relevant revisions, and an owner state.
  - id: S-4
    title: Deterministic test starts from declared isolated state
    given:
      - A logged-out share test follows an authenticated settings test in the same nightly.
    when:
      - The share test fixture starts.
    then:
      - Cookies, local storage, session storage, and IndexedDB use a fresh context.
      - Account, chat, notification, and security-reminder state matches the test declaration.
      - The result is independent of test order and shard assignment.
  - id: S-5
    title: Test lanes preserve separate and global health
    given:
      - Deterministic tests have zero failures and the Gmail live probe has one failure.
    when:
      - Nightly status is reported.
    then:
      - The deterministic lane reports green.
      - Integration health reports the Gmail parent incident red.
      - Global zero-failure status remains incomplete.
  - id: S-6
    title: Historical failures do not block unrelated feature verification
    given:
      - A reminder email failure predates a new unrelated feature.
      - The new feature passes every scoped required check and introduces no attributable failure.
    when:
      - The feature's verification is evaluated.
    then:
      - The historical reminder failure remains visible and owned.
      - The unrelated feature can complete without global backlog clearance.
  - id: S-7
    title: Ambiguous campaign overlap fails closed
    given:
      - Two active campaigns overlap the requested failures.
    when:
      - A caller requests implicit campaign start or resume.
    then:
      - The command returns selection_required and structured candidate IDs.
      - No campaign, group, claim, or attempt state changes.
  - id: S-8
    title: One command returns canonical investigation evidence
    given:
      - A canonical test key and source run ID are supplied.
    when:
      - The operator runs tests.py investigate.
    then:
      - The command returns current state, parent incident, last-good and first-bad-or-unknown revisions, linked changed files, and durable report, trace, and screenshot locations.
      - Missing artifacts are explicit after one lookup.
      - Diagnostic presets are schema-valid and sensitive values are redacted.
  - id: S-9
    title: Global campaign requires a full zero-failure run
    given:
      - Every selected and child group is individually green.
    when:
      - Campaign completion is evaluated.
    then:
      - The campaign remains verification_pending until a full nightly-equivalent run completes.
      - A newly exposed failure becomes a child group in the same campaign.
      - Completion succeeds only when deterministic and live-probe failed counts are both zero.
  - id: S-10
    title: Shared behavior moves to the lowest effective test layer
    given:
      - Many skill specs duplicate the same app-skill delivery and embed hydration journey.
    when:
      - Coverage is rationalized.
    then:
      - REST, WebSocket, CLI, SDK, persistence, and provider normalization are covered below Playwright where applicable.
      - Playwright retains generic browser hydration and skill-specific renderer or interaction assertions.
      - Live provider canaries remain visible in the live-probe lane.

