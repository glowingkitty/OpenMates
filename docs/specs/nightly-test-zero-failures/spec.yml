clarification:
  rounds:
    - question: Should deterministic tests and live probes report separately?
      answer: Yes; both remain visible and the eventual global goal is zero failures across all tests.
    - question: Should active Mailosaur support be retained as a fallback?
      answer: No; fully remove it because the subscription is inactive and Gmail is the sole receiver.
    - question: May flaky tests be quarantined temporarily?
      answer: No; do not risk hiding failures.
    - question: Is a final full nightly-equivalent run required after individual groups pass?
      answer: Yes; the global campaign completes only after the combined run reaches zero.
    - question: May the existing failure backlog block unrelated feature development?
      answer: No; new features continue with their scoped verification and own attributable regressions.
  vision_summary: >
    Every failure remains visible and owned, but shared prerequisite failures are
    represented once with blocked dependants rather than debugged as unrelated
    symptoms. Gmail is the only inbox receiver, deterministic and live probes
    have separate health signals, unrelated features continue through scoped
    gates, and the global campaign reaches completion only after a full run has
    zero failures in every lane.
  approved_by_user: true

