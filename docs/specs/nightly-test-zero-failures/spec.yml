  evidence:
    - The 2026-08-16 nightly recorded 84 failures among 5061 tests, compared with 74 failures in the preceding nightly.
    - Deterministic triage produced 71 groups for 84 failures even though current evidence identified shared auth-state, worker-health, chat-transport, and embed-delivery causes.
    - Recent failure screenshots showed tests expecting logged-out or shared state while authenticated settings state remained active.
    - Gmail polling currently exposes the legacy method name waitForMailosaurMessage and can poll Gmail for a Mailosaur-domain recipient.
    - Seven-day OpenCode telemetry recorded repeated routing failures, missing runtime artifacts, oversized searches, and ambiguous campaign selection.

