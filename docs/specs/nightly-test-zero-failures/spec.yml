implementation_plan:
  spec_path: docs/specs/nightly-test-zero-failures/spec.yml
  existing_patterns:
    - scripts/tests.py Directus-backed status, triage, campaign, group, claim, and run selection.
    - scripts/audit_playwright_determinism.py path-scoped deterministic Playwright checks.
    - frontend/apps/web_app/tests/signup-flow-helpers.ts shared email client and test identity helpers.
    - frontend/apps/web_app/tests/helpers/chat-test-helpers.ts shared auth, chat readiness, and cleanup helpers.
  architecture: >
    Extend the existing Directus test control plane and durable campaign metadata
    rather than introducing a second state store. Implement Gmail-only email
    helpers and static guards first, then prerequisite/lane metadata,
    dependency-aware triage, canonical investigation, campaign completion,
    isolation fixtures, and lower-layer coverage migrations. Use the resulting
    mechanisms to continue one durable zero-failure campaign.
  data_flow:
    - Nightly preflight evaluates shared prerequisites and records parent incidents.
    - Test execution records deterministic or live-probe lane plus parent dependency.
    - Triage groups by dependency and correlated evidence before error signature.
    - Operators and agents retrieve one bounded investigation bundle.
    - Campaign workers fix parent groups and verify exact members.
    - A final full nightly-equivalent run either completes the campaign at zero or adds new child groups.
  affected_files:
    - path: frontend/apps/web_app/tests/signup-flow-helpers.ts
      reason: Gmail-only provider-neutral email helper.
    - path: .github/workflows/playwright-spec.yml
      reason: Remove inactive Mailosaur inputs and secrets.
    - path: scripts/tests.py
      reason: Parent incidents, lanes, investigation command, campaign selection, and completion.
    - path: scripts/audit_playwright_determinism.py
      reason: Prevent provider and isolation drift.
    - path: frontend/apps/web_app/tests/helpers/chat-test-helpers.ts
      reason: Shared clean-state and readiness fixtures.
    - path: .claude/skills/fix-tests/SKILL.md
      reason: Canonical workflow instructions; generated mirrors follow parity sync.
  verification_strategy:
    - Run focused pytest red and green checks for each internal-tooling slice.
    - Run deterministic audits after Gmail and Playwright-pattern migrations.
    - Deploy before rerunning affected Playwright specs.
    - Dispatch the final full nightly-equivalent run only after individual groups are green.
  verification_order:
    - Internal deterministic pytest and static audits.
    - Deployed Gmail and isolation Playwright specs.
    - Exact campaign-group verification.
    - Final full nightly-equivalent run across deterministic and live-probe lanes.

