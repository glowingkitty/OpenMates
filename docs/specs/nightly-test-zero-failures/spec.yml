schema_version: 2
id: nightly-test-zero-failures
title: Nightly Test Zero-Failure Workflow
status: implementing

goal: >
  Make nightly failures fast to classify and eliminate by removing Mailosaur,
  isolating deterministic tests, separating visible deterministic and live-probe
  lanes, collapsing shared prerequisite failures into parent incidents, and
  giving campaigns one canonical evidence and full-run completion workflow,
  without blocking unrelated feature development on the historical backlog.

scope:
  in:
    - Remove active Mailosaur clients, fallbacks, credentials, test identities, CI inputs, docs, and agent instructions.
    - Use Gmail run aliases and provider-neutral email test helper names exclusively.
    - Replace broad test-domain authorization with exact test-identity authorization where Gmail domains would be unsafe.
    - Add deterministic prerequisite checks and parent-incident classification for deployment, workers, Gmail, auth state, chat transport, embed delivery, mutable fixtures, and external providers.
    - Report deterministic tests and live integration probes in separate visible lanes while preserving the eventual goal of zero failures in both.
    - Add run-scoped state declarations and shared reset/readiness fixtures for browser, storage, account, chat, notifications, and security reminders.
    - Make campaign overlap selection fail closed and require an explicit campaign or canonical failure scope.
    - Add a canonical privacy-safe investigation command with durable artifact resolution and validated diagnostic presets.
    - Require a final full nightly-equivalent zero-failure run before the global campaign completes.
    - Move duplicated shared app-skill and delivery behavior to lower-layer contracts while retaining browser-specific Playwright assertions.
    - Extend deterministic audits so new tests cannot reintroduce removed providers, undeclared shared state, or repeated timing workarounds.
    - Run a durable campaign that continues reducing the existing backlog to zero without gating unrelated feature work.
  out:
    - A user-facing web or Apple interface.
    - A public or developer REST API.
    - Proof-video generation; the user explicitly waived it for this internal tooling work.
    - Quarantining, suppressing, omitting, or silently retrying away failed tests.
    - Treating blocked dependent tests as passing.
    - Requiring the historical global backlog to be green before unrelated feature work can be implemented or verified.
    - Automatically changing disputed product behavior merely to satisfy a test.

