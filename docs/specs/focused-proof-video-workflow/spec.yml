decisions:
  - id: D-1
    status: active
    decision: Audio is off by default and remains opt-in.
    reason: Captioned transcripts provide the review contract without provider cost, latency, or safety-classifier friction.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-2
    status: active
    decision: Explicit readiness markers are authoritative for trimming; only a bounded low-resolution first-frame check is allowed as fallback validation.
    reason: Markers are cheaper and more reliable than generic frame scanning.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-3
    status: active
    decision: Pacing uses only whole-video slowdown down to 0.75x and a final-frame hold, with no per-scene retiming.
    reason: Existing renderer support is predictable and avoids a fragile editing engine.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-4
    status: active
    decision: Semantic review receives one to twelve frames per device at a five-second cadence plus prioritized event frames and returns a classified frame-grounded verdict.
    reason: A bounded reviewer is more reliable than pixel heuristics and cheaper than repeated main-agent frame exploration.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-5
    status: active
    decision: The initial review permits at most two automatic correction rounds and one high-confidence product-code correction; uncertain or repeated findings ask the user immediately.
    reason: Bounded corrections reduce avoidable loops without allowing video editing or low-confidence changes to conceal broken product behavior.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-6
    status: active
    decision: One proof contract permits six AI review calls and forty-eight cumulative submitted frames; immutable receipts and unchanged-device cache entries are revalidated before reuse.
    reason: Persistent budgets cap cost across process restarts while hash-bound provenance prevents stale or forged review completion.
    decided_at: "2026-08-14T00:00:00Z"
  - id: D-7
    status: active
    decision: The proof-enabled `.spec.ts` file owns the full transcript, devices, checkpoints, and paired deterministic plus visual assertions; no separate LLM-authored approval contract is required.
    reason: Committed test metadata is reviewable, versioned with behavior, and deterministic to extract.
    decided_at: "2026-08-20T00:00:00Z"
  - id: D-8
    status: active
    decision: Remotion composes normal-speed action segments and deterministic checkpoint freezes inside a browser frame showing the attested deployed domain.
    reason: Presentation pacing must not increase E2E runtime, and the raw Playwright viewport must remain the real product evidence.
    decided_at: "2026-08-20T00:00:00Z"
  - id: D-9
    status: active
    decision: Real CLI E2E evidence records a graphical terminal on Xvfb; reconstructed ASS terminal videos are no longer eligible proof sources.
    reason: Terminal colors, wrapping, cursor, prompts, and TUI behavior are part of the CLI product surface.
    decided_at: "2026-08-20T00:00:00Z"

