schema_version: 2
id: focused-proof-video-workflow
title: Focused OpenCode Proof Video Workflow
status: implementing

goal: >
  Make each proof-enabled Playwright spec the source of truth for its complete
  tutorial transcript, deterministic assertions, visual-review assertions, and
  capture checkpoints; turn the fast real test recording into a deterministic
  Remotion browser tutorial, and record real terminal-emulator pixels for every
  OpenMates CLI E2E journey without slowing test execution for presentation.

scope:
  in:
    - Add one repository-local `proof_video_workflow.py start --current` entry point.
    - Infer the current sessions.py session, subject commit, and matching passing test run when unambiguous.
    - Store an LLM-authored tutorial transcript plus one to five visible assertions as an approved hash-addressed proof contract.
    - Require an explicit capture-ready timestamp for browser and native recordings and trim from that marker with a small fixed lead.
    - Default to caption-only proof videos; retain existing narration audio only as explicit opt-in behavior.
    - Render sentence-level captions at bottom center with bounded whole-video slowdown and final-frame hold.
    - Enforce fixed duration, frame-count, concurrency, analysis-call, cumulative-frame, and automatic-correction limits.
    - Build an immutable hash-bound frame bundle for assertion and independent visual-integrity review, then classify failures as capture, render, product, or uncertain.
    - Persist review budgets across commands, cache only fully revalidated unchanged device evidence, and bind completion/publication to a canonical review receipt.
    - Update the create-demo-video skill and completion hint to use the focused entry point.
    - Define a typed proof contract directly in each proof-enabled `.spec.ts` file.
    - Record proof actions, assertions, and checkpoints as a hash-bound Playwright attachment without presentation sleeps.
    - Build a deterministic edit timeline from real action intervals and checkpoint holds calculated from committed transcript text.
    - Render the real Playwright viewport inside a deterministic Remotion browser frame that displays the tested domain.
    - Keep captions as a hash-bound toggleable WebVTT sidecar rather than burning them into browser or terminal pixels.
    - Capture real OpenMates CLI E2E pixels from a pinned graphical terminal on an isolated Xvfb display while preserving PTY transcript provenance.
    - Require all real CLI E2E entry points to use the shared recorder or declare a deterministic non-E2E classification.
  out:
    - Product REST API, WebSocket, SDK, web UI, Apple app, CLI product command, or Directus changes.
    - Marketing video creation or promotional editing.
    - OCR, generic pixel-based UI understanding, full-video model input, scene-by-scene retiming, or unbounded product-code repair.
    - Automatic scrolling inferred from video pixels.
    - Requiring audio by default or removing existing opt-in audio support.
    - Recording generic unit tests, SDK-only tests, cleanup polling commands, or scripts that do not expose the OpenMates CLI as the tested product surface.
    - Treating the deterministic browser frame as native Chromium chrome; the page pixels are real and the surrounding tutorial frame is an explicit Remotion composition.

context_discovery:
  github_issues:
    - No tracker issue was supplied; this is an explicitly requested OpenCode workflow improvement.
  docs:
    - docs/specs/narrated-spec-demonstration-videos/spec.yml
    - docs/contributing/guides/agent-workflow-core.md
    - docs/contributing/guides/spec-driven-development.md
    - .claude/skills/create-demo-video/SKILL.md
  code_patterns:
    - scripts/spec_demo.py already owns FFmpeg rendering, device profiles, frame extraction, and OpenCode response-media publication.
    - scripts/sessions.py already owns proof-video session evidence and the completion gate.
    - scripts/tests.py stores passing run IDs, subject commits, and GitHub run URLs.
    - Recent OpenCode sessions repeatedly rediscovered 800x450 source incompatibility, audio setup, blank opening frames, manual trimming, and narration pacing.
  tests:
    - scripts/tests/test_sessions_proof_video.py
    - scripts/tests/test_spec_demonstration_pipeline.py
    - scripts/tests/test_opencode_spec_workflow_audit.py

clarification:
  rounds:
    - question: Should proof narration audio remain mandatory?
      answer: No. Transcript captions are sufficient by default; audio creation is off unless explicitly requested.
    - question: Should the workflow automatically understand video frames?
      answer: No. Deterministic tooling handles only objective provenance and media mechanics; semantic judgment belongs to bounded frame review.
    - question: How much automation is appropriate?
      answer: Use one start command, an explicit ready marker, bounded slowdown/final hold, fixed frame limits, and at most one mechanical rerender.
    - question: Should product defects be fixed automatically by the video workflow?
      answer: No. Product defects return to the responsible failing-test and implementation workflow and must never be hidden by editing.
  vision_summary: >
    Proof creation consumes no LLM call for authoring, timing, device selection,
    or composition. The committed `.spec.ts` contract supplies the complete
    transcript and paired executable/visual assertions; the fast source run emits
    checkpoints; deterministic tooling performs Remotion composition; and only
    the bounded image-review step uses model inference.
  approved_by_user: true
  resumed_rounds:
    - question: Should browser tutorials record native Chromium chrome or compose deterministic browser chrome around real Playwright pixels?
      answer: Compose the real Playwright recording inside a deterministic Remotion browser UI that shows the tested domain.
    - question: Should proof-enabled tests pause to make recordings watchable?
      answer: No. Tests run at normal speed and deterministic post-processing inserts checkpoint holds based on the committed transcript.
    - question: Should CLI proof continue reconstructing terminal text from PTY events?
      answer: No. All OpenMates CLI E2E journeys use real terminal-emulator screen recordings; PTY events remain sidecar provenance only.
    - question: Is implementation and end-to-end proof output approved now?
      answer: Yes. The user requested implementation, tests, and one web plus one CLI proof video in the current chat.

