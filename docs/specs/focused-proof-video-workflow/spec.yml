scenarios:
  - id: S-1
    title: One command resolves current proof context
    given:
      - An active OpenCode chat is mapped to a sessions.py session.
      - A named spec has a passing test result for the current deployed commit.
    when:
      - The agent runs `python3 scripts/proof_video_workflow.py start --current --spec example.spec.ts`.
    then:
      - The script infers the short session ID, full subject commit, and matching passing source run ID.
      - Ambiguous or missing state returns one precise next action rather than guessing.
      - Generic 800x450 Playwright video is rejected before rendering when an exact phone or laptop profile is required.
  - id: S-2
    title: Approved transcript contract gates capture
    given:
      - New user-visible proof claims require a short tutorial transcript and one to five visible assertions.
    when:
      - The script receives a draft contract without an approval hash.
    then:
      - It writes a canonical contract file, prints its complete content and hash, and stops before capture.
      - A later invocation accepts only an unchanged approved contract hash.
  - id: S-3
    title: Marker-based caption-only rendering remains bounded
    given:
      - An exact-dimension recording has a capture-ready marker and an approved transcript.
    when:
      - The workflow prepares the render.
    then:
      - The source is trimmed to the marker minus a fixed small lead.
      - Audio is omitted unless explicitly requested.
      - Sentence captions render bottom-center.
      - The workflow calculates at most 0.75x slowdown plus a final hold and caps output at 35 seconds.
      - Only one device renders at a time and at most one mechanical rerender is allowed.
  - id: S-4
    title: Bounded frame review routes defects
    given:
      - Deterministic provenance and render checks pass.
    when:
      - The review bundle is prepared.
    then:
      - It contains the approved contract, deterministic metadata, and an immutable index of one to twelve frames per device, never the full video.
      - The reviewer checks every assertion and independently scans for obvious visual-integrity defects before returning passed, capture_defect, render_defect, product_defect, or uncertain.
      - Six-call and forty-eight-frame budgets persist across commands, while unchanged-device cache hits require complete receipt, request, manifest, frame, and source-video integrity.
      - Product defects return to implementation and cannot be hidden by cropping, trimming, captions, or transcript changes.
  - id: S-5
    title: Spec-owned proof contract and timeline
    given:
      - A Playwright spec declares the complete device-scoped transcript, proof assertions, tested domain, and tutorial policy.
    when:
      - The fast test records actions, executable assertion results, and named checkpoints.
    then:
      - The test attaches one canonical proof timeline bound to the spec, test, retry, profile, deployed commit, and source video.
      - Every proof assertion has a passing executable result and a visual-review description at a reached checkpoint.
      - No presentation-only sleep is added to the source test.
  - id: S-6
    title: Remotion browser tutorial composition
    given:
      - A passed exact-profile Playwright recording and matching proof timeline exist.
    when:
      - The deterministic renderer builds the tutorial.
    then:
      - Real source action intervals play at normal speed and transcript-derived holds freeze reached checkpoints.
      - The full real viewport is shown inside a deterministic browser frame with the attested domain in its address bar.
      - The output and WebVTT sidecar are reproducible from source, contract, timeline, profile, and renderer hashes.
  - id: S-7
    title: Real CLI terminal recording
    given:
      - An E2E test visibly invokes the real OpenMates CLI.
    when:
      - The shared CLI test runner executes the journey.
    then:
      - The command runs in a real PTY displayed by a pinned graphical terminal on an isolated 1280x720 Xvfb display.
      - FFmpeg records the terminal pixels while transcript, input, exit status, environment classification, and checkpoints are retained as sidecar provenance.
      - Secrets are passed through environment or hidden input and never placed in displayed argv or proof metadata.
  - id: S-8
    title: CLI E2E coverage enforcement
    given:
      - CLI E2E coverage exists across Playwright helpers, workflow helpers, standalone verifier scripts, and GitHub workflows.
    when:
      - The deterministic CLI recording audit runs.
    then:
      - Every real OpenMates CLI E2E entry point routes through the shared recorder or is explicitly classified as unit, SDK-only, cleanup-only, or non-recordable with a reason.
      - Passed and failed attempts retain real recordings; only passed current-commit journeys may become tutorial proofs.
  - id: S-9
    title: End-to-end web and CLI proof output
    given:
      - The architecture tests and normal product gates pass.
    when:
      - One deployed web spec and one real CLI E2E journey are processed.
    then:
      - Both videos pass deterministic media checks and bounded frame review.
      - Both hash-bound captioned videos are published through OpenCode response media and embedded in the current chat.

