implementation_plan:
  spec_path: docs/specs/focused-proof-video-workflow/spec.yml
  architecture: >
    Extend the existing orchestrator with a canonical spec-owned proof contract
    and event timeline. Preserve real Playwright and PTY evidence as immutable raw
    sources. Use a small repository-local Remotion package only for browser-frame
    composition and deterministic action/freeze sequencing. Add a shared Xvfb
    terminal recorder for real CLI E2E journeys and a source audit that prevents
    unclassified direct CLI spawning.
  existing_patterns:
    - Reuse sessions.py session/test evidence instead of creating a new state store.
    - Reuse spec_demo.py media, privacy, frame, and publication helpers.
    - Keep create-demo-video as concise agent guidance around one script command.
    - Reuse Playwright result attachments and exact-commit proof-source attestations.
    - Reuse existing CLI helper families while routing process creation through one recorder-aware launcher.
  data_flow:
    - Start resolves session, commit, spec, and passing run metadata.
    - A canonical YAML proof contract is hashed and checked for approval.
    - Capture records an explicit ready marker; orchestration computes trim and pacing.
    - spec_demo renders caption-only media and extracts bounded frames.
    - A frame-only reviewer records a classified verdict; sessions.py persists completion state.
    - The spec runtime writes canonical contract and timeline attachments containing device, domain, actions, checkpoints, and executable assertion outcomes.
    - tests.py binds timeline and raw video hashes to the terminal retry result and deployed commit.
    - The timeline compiler removes setup/cleanup, plays action intervals at 1x, and derives checkpoint holds from transcript word count.
    - Remotion renders those segments inside browser chrome; WebVTT remains a separate player track.
    - CLI E2E commands run in a real PTY displayed by a pinned terminal on Xvfb while FFmpeg records that display and the driver retains transcript/events.
  affected_files:
    - { path: scripts/proof_video_workflow.py, reason: "Add the focused single-command orchestrator and bounded calculations." }
    - { path: scripts/spec_demo.py, reason: "Make audio optional and fix bottom-center Playwright captions." }
    - { path: scripts/sessions.py, reason: "Expose caption-only production and point completion hints to the orchestrator." }
    - { path: .claude/skills/create-demo-video/SKILL.md, reason: "Replace manual recipes with the focused workflow." }
    - { path: scripts/audit_opencode_spec_workflow.py, reason: "Audit the focused entry point and caption-first contract." }
    - { path: scripts/tests/test_proof_video_workflow.py, reason: "Test orchestration and resource bounds." }
    - { path: scripts/tests/test_sessions_proof_video.py, reason: "Test caption-only session rendering and completion." }
    - { path: frontend/apps/web_app/tests/helpers/video-proof.ts, reason: "Define and execute spec-owned proof contracts and canonical timelines." }
    - { path: frontend/apps/web_app/tests/proof-video-architecture.spec.ts, reason: "Provide the deployed web architecture proof source." }
    - { path: tooling/proof-video-remotion/, reason: "Render deterministic browser chrome and action/freeze segments around real Playwright pixels." }
    - { path: scripts/cli_video_capture.py, reason: "Record real graphical terminal pixels and PTY provenance for CLI E2E journeys." }
    - { path: scripts/audit_cli_e2e_recording.py, reason: "Prevent real CLI E2E entry points from bypassing shared recording." }
    - { path: frontend/apps/web_app/tests/helpers/cli-test-helpers.ts, reason: "Route shared Playwright CLI execution through the recorder-aware launcher." }
    - { path: frontend/apps/web_app/tests/helpers/workflow-cli-e2e-helpers.ts, reason: "Route pair-login and Workflow CLI execution through the recorder-aware launcher." }
    - { path: .github/workflows/playwright-spec.yml, reason: "Install pinned terminal dependencies and retain CLI video artifacts." }
  verification_strategy:
    - Run the new focused pytest file red before implementation.
    - Run existing proof-video tests to preserve privacy, provenance, device, and publication guards.
    - Run the workflow audit and agent parity sync check after skill edits.
    - Use synthetic media for red/green renderer and recorder unit tests.
    - Deploy and run one exact-profile proof-enabled web spec against app.dev.openmates.org.
    - Run one real OpenMates CLI E2E journey against api.dev.openmates.org through the graphical terminal recorder.
    - Review and embed both resulting videos with hash-bound WebVTT captions.
  verification_order:
    - Validate this executable spec.
    - Add and record failing focused tests.
    - Implement orchestration and caption-only rendering.
    - Update skill, completion hint, and audit.
    - Run focused regressions, workflow audit, parity checks, and spec verification.
    - Run CLI recorder/audit checks before deployed browser proof generation.
    - Deploy, run the web and CLI proof specs, review both frame bundles, and publish both response-media videos.

