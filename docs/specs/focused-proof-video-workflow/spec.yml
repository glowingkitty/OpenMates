risks:
  - risk: Metadata inference may select stale or ambiguous test evidence.
    mitigation: Require exact commit/status/spec matching and fail with one actionable next command when multiple candidates remain.
  - risk: Caption-only media changes could weaken existing proof completion checks.
    mitigation: Preserve privacy, provenance, frame review, device, and publication requirements while making only audio optional.
  - risk: Media processing may consume excessive CPU.
    mitigation: Process one device at a time, cap output, calls, and cumulative frame submissions, avoid OCR/full scans, revalidate caches by source/contract/frame hashes, and allow only two correction rounds.
  - risk: Trimming could hide a product defect.
    mitigation: Trim only to an explicit ready marker with a small fixed lead; semantic product defects return to implementation.

