assumptions:
  - id: A-1
    text: Existing sessions.py and tests.py metadata can resolve current session, test commit, and passing run without adding a new datastore.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/sessions.py and scripts/tests.py
        summary: Session mappings, proof records, test git_sha, external run IDs, and GitHub run URLs already exist.
  - id: A-2
    text: Existing spec_demo.py FFmpeg paths can render caption-only media after making audio optional.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/spec_demo.py
        summary: Video and subtitle rendering are already separate FFmpeg filter inputs; audio can be conditionally omitted without replacing the pipeline.
  - id: A-3
    text: The CI runner can install or provide Xvfb, one pinned graphical terminal, tmux, FFmpeg, and Chromium dependencies required by deterministic real terminal capture and Remotion rendering.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: Current dev runner and playwright-spec workflow
        summary: Xvfb and FFmpeg are already available or installed; the workflow can install the pinned terminal/tmux packages alongside Playwright dependencies.
  - id: A-4
    text: Remotion supports parameterized server-side rendering of prerecorded video segments, trimming, sequencing, and frozen frames.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: Official Remotion documentation
        summary: OffthreadVideo, Sequence, Freeze, selectComposition, and renderMedia support the required deterministic composition.

contracts:
  api:
    - surface: Repository-local OpenCode workflow only; no endpoint changes.
      access_model: internal-only
      auth: Existing local filesystem, GitHub CLI, and configured test tooling access only.
      rate_limits: No product rate limit; fixed local CPU and frame limits apply.
      credit_budget: No product credits; audio provider use is disabled by default.
      encryption_boundary: No client-encrypted product content contract changes; proof videos do not run proof-specific PII/sensitive-data detection or replacement.
  data:
    - Proof contracts and workflow manifests are local gitignored evidence; only the executable spec and tooling are tracked.
    - Full videos never enter agent/model context.
    - Source and contract hashes make cached processing reusable and detect stale approval.
    - Proof timeline attachments are canonical JSON generated by the spec runtime and retained beside source video attestations.
    - Raw CLI recordings, transcripts, and manifests are private test artifacts; only reviewed intentionally shareable proof outputs use response media.
  privacy_security:
    - Owner-only artifact permissions remain required.
    - The workflow never prints webhook URLs, credentials, raw private test data, or unsanitized source metadata.

phase_gates:
  api_websocket: { status: not_applicable, reason: "No product API or WebSocket behavior changes." }
  cli: { status: required, reason: "The workflow changes how every real OpenMates CLI E2E journey is executed and recorded; one real dev-server CLI proof is required." }
  sdk: { status: not_applicable, reason: "No npm or pip SDK behavior changes." }
  web: { status: required, reason: "One deployed proof-enabled web spec must emit the canonical contract/timeline and produce the Remotion browser tutorial." }
  visual_smoke: { status: not_applicable, reason: "The implementation is non-visual repository tooling; synthetic media fixtures verify rendering." }
  user_confirmation: { status: required, reason: "The user will inspect the embedded web and CLI tutorial outputs in this chat." }
  apple: { status: not_applicable, reason: "Apple product behavior is unaffected." }

