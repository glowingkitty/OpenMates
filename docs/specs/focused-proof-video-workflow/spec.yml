schema_version: 2
id: focused-proof-video-workflow
title: Focused OpenCode Proof Video Workflow
status: approved

goal: >
  Replace manual proof-video assembly with one focused OpenCode command that
  infers current evidence, preserves an approved caption/assertion contract,
  performs bounded mechanical media processing, and prepares a small frame-only
  review bundle without mandatory audio or CPU-heavy video analysis.

scope:
  in:
    - Add one repository-local `proof_video_workflow.py start --current` entry point.
    - Infer the current sessions.py session, subject commit, and matching passing test run when unambiguous.
    - Store an LLM-authored tutorial transcript plus one to five visible assertions as an approved hash-addressed proof contract.
    - Require an explicit capture-ready timestamp for browser and native recordings and trim from that marker with a small fixed lead.
    - Default to caption-only proof videos; retain existing narration audio only as explicit opt-in behavior.
    - Render sentence-level captions at bottom center with bounded whole-video slowdown and final-frame hold.
    - Enforce fixed duration, frame-count, concurrency, analysis, and automatic-rerender limits.
    - Build a bounded frame bundle for semantic review and classify failures as capture, render, product, or uncertain.
    - Update the create-demo-video skill and completion hint to use the focused entry point.
  out:
    - Product REST API, WebSocket, SDK, web UI, Apple app, CLI product command, or Directus changes.
    - Marketing video creation or promotional editing.
    - OCR, generic pixel-based UI understanding, full-video model input, scene-by-scene retiming, or automatic product-code repair.
    - Automatic scrolling inferred from video pixels.
    - Requiring audio by default or removing existing opt-in audio support.

context_discovery:
  github_issues:
    - No tracker issue was supplied; this is an explicitly requested OpenCode workflow improvement.
  docs:
    - docs/specs/narrated-spec-demonstration-videos/spec.yml
    - docs/contributing/guides/agent-workflow-core.md
    - docs/contributing/guides/spec-driven-development.md
    - .claude/skills/create-demo-video/SKILL.md
  code_patterns:
    - scripts/spec_demo.py already owns FFmpeg rendering, device profiles, frame extraction, privacy scanning, and Discord publication.
    - scripts/sessions.py already owns proof-video session evidence and the completion gate.
    - scripts/tests.py stores passing run IDs, subject commits, and GitHub run URLs.
    - Recent OpenCode sessions repeatedly rediscovered 800x450 source incompatibility, audio setup, blank opening frames, manual trimming, and narration pacing.
  tests:
    - scripts/tests/test_sessions_proof_video.py
    - scripts/tests/test_spec_demonstration_pipeline.py
    - scripts/tests/test_opencode_spec_workflow_audit.py

clarification:
  rounds:
    - question: Should proof narration audio remain mandatory?
      answer: No. Transcript captions are sufficient by default; audio creation is off unless explicitly requested.
    - question: Should the workflow automatically understand video frames?
      answer: No. Deterministic tooling handles only objective provenance and media mechanics; semantic judgment belongs to bounded frame review.
    - question: How much automation is appropriate?
      answer: Use one start command, an explicit ready marker, bounded slowdown/final hold, fixed frame limits, and at most one mechanical rerender.
    - question: Should product defects be fixed automatically by the video workflow?
      answer: No. Product defects return to the responsible failing-test and implementation workflow and must never be hidden by editing.
  vision_summary: >
    Proof creation should consume few agent turns and predictable CPU. An LLM
    writes the short tutorial transcript and assertions; the user approves new
    visible claims; deterministic tooling performs bounded capture/render work;
    a narrowly instructed reviewer sees only selected frames and routes real
    defects back to the correct workflow.
  approved_by_user: true

apple_impact:
  affected_files: [none]
  parity_expectations:
    - Apple recordings may use the focused tooling later, but this implementation changes no Apple product behavior.
  verification:
    - Apple not affected.
  intentional_native_differences: [none]

implementation_state:
  subject_commit: b8f6f6b20107bc3df1d5018dd3a48fbb7f299c12

approvals:
  product_contract:
    status: not_required
    reason: The user explicitly classified this as repository-local OpenCode workflow tooling rather than an OpenMates product feature.
  implementation_plan:
    status: approved
    approved_at: "2026-08-12T00:00:00Z"
    reason: The user approved the focused one-command, caption-first, bounded-processing plan and requested implementation and tests.

decisions:
  - id: D-1
    status: active
    decision: Audio is off by default and remains opt-in.
    reason: Captioned transcripts provide the review contract without provider cost, latency, or safety-classifier friction.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-2
    status: active
    decision: Explicit readiness markers are authoritative for trimming; only a bounded low-resolution first-frame check is allowed as fallback validation.
    reason: Markers are cheaper and more reliable than generic frame scanning.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-3
    status: active
    decision: Pacing uses only whole-video slowdown down to 0.75x and a final-frame hold, with no per-scene retiming.
    reason: Existing renderer support is predictable and avoids a fragile editing engine.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-4
    status: active
    decision: Semantic review receives three to eight frames per device and returns a classified frame-grounded verdict.
    reason: A bounded reviewer is more reliable than pixel heuristics and cheaper than repeated main-agent frame exploration.
    decided_at: "2026-08-12T00:00:00Z"
  - id: D-5
    status: active
    decision: Mechanical defects may rerender once; product defects must return to implementation.
    reason: Video editing must not conceal broken product behavior.
    decided_at: "2026-08-12T00:00:00Z"

attempts:
