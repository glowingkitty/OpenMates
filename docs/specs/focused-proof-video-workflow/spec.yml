implementation_plan:
  spec_path: docs/specs/focused-proof-video-workflow/spec.yml
  architecture: >
    Add a small orchestration module that computes context, contract hashes,
    marker trims, pacing, frame budgets, cache keys, and classified next actions.
    Keep FFmpeg and publication mechanics in spec_demo.py and sessions.py.
  existing_patterns:
    - Reuse sessions.py session/test evidence instead of creating a new state store.
    - Reuse spec_demo.py media, privacy, frame, and publication helpers.
    - Keep create-demo-video as concise agent guidance around one script command.
  data_flow:
    - Start resolves session, commit, spec, and passing run metadata.
    - A canonical YAML proof contract is hashed and checked for approval.
    - Capture records an explicit ready marker; orchestration computes trim and pacing.
    - spec_demo renders caption-only media and extracts bounded frames.
    - A frame-only reviewer records a classified verdict; sessions.py persists completion state.
  affected_files:
    - { path: scripts/proof_video_workflow.py, reason: "Add the focused single-command orchestrator and bounded calculations." }
    - { path: scripts/spec_demo.py, reason: "Make audio optional and fix bottom-center Playwright captions." }
    - { path: scripts/sessions.py, reason: "Expose caption-only production and point completion hints to the orchestrator." }
    - { path: .claude/skills/create-demo-video/SKILL.md, reason: "Replace manual recipes with the focused workflow." }
    - { path: scripts/audit_opencode_spec_workflow.py, reason: "Audit the focused entry point and caption-first contract." }
    - { path: scripts/tests/test_proof_video_workflow.py, reason: "Test orchestration and resource bounds." }
    - { path: scripts/tests/test_sessions_proof_video.py, reason: "Test caption-only session rendering and completion." }
  verification_strategy:
    - Run the new focused pytest file red before implementation.
    - Run existing proof-video tests to preserve privacy, provenance, device, and publication guards.
    - Run the workflow audit and agent parity sync check after skill edits.
    - Use synthetic short media fixtures only; no deployed product proof or proof video is required for this non-product tooling change.
  verification_order:
    - Validate this executable spec.
    - Add and record failing focused tests.
    - Implement orchestration and caption-only rendering.
    - Update skill, completion hint, and audit.
    - Run focused regressions, workflow audit, parity checks, and spec verification.

