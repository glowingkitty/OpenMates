  current_task_id: TASK-5
  next_action: Deploy the verified focused proof-video workflow tooling.
  command: python3 scripts/sessions.py deploy --session 59a3 --title "Focus proof-video workflow" --message "Focus proof-video workflow"
  expected_outcome: Verified workflow tooling is committed and pushed through the session deploy path.
  blocker: null
  last_verified_commit: b8f6f6b20107bc3df1d5018dd3a48fbb7f299c12

scenarios:
  - id: S-1
    title: One command resolves current proof context
    given:
      - An active OpenCode chat is mapped to a sessions.py session.
      - A named spec has a passing test result for the current deployed commit.
    when:
      - The agent runs `python3 scripts/proof_video_workflow.py start --current --spec example.spec.ts`.
    then:
      - The script infers the short session ID, full subject commit, and matching passing source run ID.
      - Ambiguous or missing state returns one precise next action rather than guessing.
      - Generic 800x450 Playwright video is rejected before rendering when an exact phone or laptop profile is required.
  - id: S-2
    title: Approved transcript contract gates capture
    given:
      - New user-visible proof claims require a short tutorial transcript and one to five visible assertions.
    when:
      - The script receives a draft contract without an approval hash.
    then:
      - It writes a canonical contract file, prints its complete content and hash, and stops before capture.
      - A later invocation accepts only an unchanged approved contract hash.
  - id: S-3
    title: Marker-based caption-only rendering remains bounded
    given:
      - An exact-dimension recording has a capture-ready marker and an approved transcript.
    when:
      - The workflow prepares the render.
    then:
      - The source is trimmed to the marker minus a fixed small lead.
      - Audio is omitted unless explicitly requested.
      - Sentence captions render bottom-center.
      - The workflow calculates at most 0.75x slowdown plus a final hold and caps output at 35 seconds.
      - Only one device renders at a time and at most one mechanical rerender is allowed.
  - id: S-4
    title: Bounded frame review routes defects
    given:
      - Deterministic provenance and render checks pass.
    when:
      - The review bundle is prepared.
    then:
      - It contains the approved contract, deterministic metadata, and three to eight frames per device, never the full video.
      - The reviewer returns passed, capture_defect, render_defect, product_defect, or uncertain with frame-grounded observations.
      - Product defects return to implementation and cannot be hidden by cropping, trimming, captions, or transcript changes.

acceptance_criteria:
  - { id: AC-1, scenario: S-1, text: "The single start command infers current session, subject commit, and matching passing run when unambiguous and emits one actionable blocker otherwise.", required: true, status: satisfied, coverage_status: covered, verification_scope: custom, verification_ids: [T-PROOF-WORKFLOW] }
  - { id: AC-2, scenario: S-2, text: "New visible claims stop before capture until the canonical transcript and one-to-five assertion contract hash is approved; unchanged approved hashes are reusable.", required: true, status: satisfied, coverage_status: covered, verification_scope: custom, verification_ids: [T-PROOF-WORKFLOW] }
  - { id: AC-3, scenario: S-3, text: "Caption-only is the default, Playwright captions are bottom-centered, and existing audio support requires explicit opt-in.", required: true, status: satisfied, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-PROOF-WORKFLOW, T-PROOF-RENDER] }
  - { id: AC-4, scenario: S-3, text: "Marker trim, simple pacing, 35-second output, bounded frame analysis, serial device processing, caching, and one-rerender limits are deterministic and tested.", required: true, status: satisfied, coverage_status: covered, verification_scope: related_backend, verification_ids: [T-PROOF-WORKFLOW] }
  - { id: AC-5, scenario: S-4, text: "The review request contains three-to-eight frames per device plus the approved contract and metadata but no full video content.", required: true, status: satisfied, coverage_status: covered, verification_scope: custom, verification_ids: [T-PROOF-WORKFLOW, T-PROOF-RENDER] }
  - { id: AC-6, scenario: S-4, text: "Mechanical defects permit at most one automated correction while product defects produce a classified return-to-implementation result.", required: true, status: satisfied, coverage_status: covered, verification_scope: custom, verification_ids: [T-PROOF-WORKFLOW] }

assumptions:
  - id: A-1
    text: Existing sessions.py and tests.py metadata can resolve current session, test commit, and passing run without adding a new datastore.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/sessions.py and scripts/tests.py
        summary: Session mappings, proof records, test git_sha, external run IDs, and GitHub run URLs already exist.
  - id: A-2
    text: Existing spec_demo.py FFmpeg paths can render caption-only media after making audio optional.
    category: tooling
    required_before: implementation
    status: confirmed
    evidence:
      - source: scripts/spec_demo.py
        summary: Video and subtitle rendering are already separate FFmpeg filter inputs; audio can be conditionally omitted without replacing the pipeline.

contracts:
  api:
    - surface: Repository-local OpenCode workflow only; no endpoint changes.
      access_model: internal-only
      auth: Existing local filesystem, GitHub CLI, and configured test tooling access only.
      rate_limits: No product rate limit; fixed local CPU and frame limits apply.
      credit_budget: No product credits; audio provider use is disabled by default.
      encryption_boundary: No client-encrypted product content contract changes; existing proof privacy scanning remains fail-closed.
  data:
    - Proof contracts and workflow manifests are local gitignored evidence; only the executable spec and tooling are tracked.
    - Full videos never enter agent/model context.
    - Source and contract hashes make cached processing reusable and detect stale approval.
  privacy_security:
    - Existing secret scanner and owner-only artifact permissions remain required.
    - The workflow never prints webhook URLs, credentials, raw private test data, or unsanitized source metadata.

