goal: >
  Let authenticated users enable speech for one chat and hear each immutable
  assistant paragraph or structured summary as its own encrypted, independently
  skippable ElevenLabs audio file, while text streaming remains authoritative
  and unaffected, replay is free, and generation is billed exactly once per
  successful segment.

scope:
  in:
    - A chat-scoped Auto speak response control in the message composer, off by default and synchronized across the user's devices.
    - Completing a voice-recording embed visibly enables Auto speak response for that chat and briefly highlights the control.
    - Deterministic selection of a free prerecorded acknowledgement from mate voice, response language, and request category.
    - Fixed versioned ElevenLabs voice profiles for built-in mates with deterministic multilingual fallback.
    - Immutable speech segments for prose paragraphs, localized app-use announcements, and structured embed, code, or table summaries.
    - One ElevenLabs request, encrypted private chatfiles S3 object, idempotency identity, and usage row per generated segment.
    - Speech generation and playback run in parallel with and never block assistant text streaming or persistence.
    - Progressive playback begins after the first segment is ready and automatically follows manifest order.
    - A Speak action on every assistant response generates only missing or invalidated segments and reuses matching durable files.
    - One active response queue with play, pause, stop, previous segment, and next segment controls.
    - A waveform bar pinned inside the top of the active-chat container, showing the full response as duration-proportional paragraph regions and highlighting the current paragraph.
    - Best-effort web Media Session controls plus complete in-app fallback controls and visible autoplay recovery.
    - Safe visible retry, credit, provider, storage, and cancellation behavior without browser-speech or provider fallback.
    - Message/chat deletion and source/voice-version invalidation clean up only affected speech assets.
    - Web implementation and proof before user confirmation, then Apple native parity including background and lock-screen controls where supported.
  out:
    - A combined message-level audio file.
    - Public, anonymous, developer API-key, CLI, or public npm/pip SDK access in V1.
    - User-selectable voices, raw ElevenLabs voice IDs, voice cloning, or impersonation.
    - Reading raw JSON, raw URLs, protocol fences, code syntax, or full table markup aloud.
    - A general-purpose Groq, Gemini, or other LLM rewrite/cleanup pass before TTS.
    - Browser speech synthesis or a second provider as an automatic fallback.
    - Changing audio.speak app-skill request or response semantics.

