implementation_plan:
  spec_path: docs/specs/assistant-response-speech/spec.yml
  contract_refs:
    - feature.assistant-response-speech@1 fingerprint c49e523b71fcd4be3ddd819b1612f33a13219cae12ea8b71e36d43217f1b7288
  affected_contract_assertions:
    - assistant-speech.preference.chat-scoped-default-off
    - assistant-speech.preference.voice-recording-visible-activation
    - assistant-speech.acknowledgement.deterministic-free
    - assistant-speech.voice.fixed-versioned-mate-profile
    - assistant-speech.segmentation.one-file-per-segment
    - assistant-speech.segmentation.immutable-source
    - assistant-speech.projection.deterministic-semantic
    - assistant-speech.projection.no-cleanup-inference
    - assistant-speech.execution.text-stream-independent
    - assistant-speech.execution.first-segment-progressive
    - assistant-speech.playback.single-queue-segment-control
    - assistant-speech.playback.pinned-full-response-waveform
    - assistant-speech.playback.os-controls-best-effort
    - assistant-speech.playback.autoplay-recovery-visible
    - assistant-speech.on-demand.generate-missing-only
    - assistant-speech.access.first-party-owner-scoped
    - assistant-speech.safety.provider-after-approval
    - assistant-speech.privacy.transient-plaintext-encrypted-audio
    - assistant-speech.billing.segment-success-once
    - assistant-speech.failure.nonblocking-visible-resumable
    - assistant-speech.lifecycle.disable-delete-invalidate
    - assistant-speech.surface.semantic-parity
  contract_classification: new_contract
  surface_proof:
    - Authenticated first-party API/WebSocket proof against https://api.dev.openmates.org covers happy path, wrong owner, unauthenticated, rate, budget, safety, storage, retry, and deletion behavior.
    - Deterministic audit proves no public CLI, npm SDK, or pip SDK assistant-speech generation facade exists in V1.
    - Deployed web Playwright plus laptop/mobile visual smoke proves the composer toggle, recording glow, pinned full-response waveform, queue controls, autoplay recovery, and durable replay.
    - User confirmation follows reviewed web proof; Apple remote test/build and native proof follow user confirmation.
  documentation_impact:
    - Add architecture and user guides and update ElevenLabs privacy disclosures and localized feature strings.
  existing_patterns:
    - backend/apps/ai/utils/stream_utils.py paragraph aggregation.
    - backend/apps/ai/tasks/stream_consumer.py structural event publication.
    - backend/apps/audio/tasks/speak_task.py ElevenLabs safety, storage, and billing.
    - backend/apps/audio/tasks/common.py encrypted generated-asset helpers.
    - frontend audioEmbedCrypto.ts encrypted audio loading and Blob URL lifecycle.
    - frontend streamingMessageBlocks.ts deterministic semantic block parsing.
    - Apple MediaRenderers.swift encrypted AVAudioPlayer playback.
  architecture: >
    Add a first-party assistant-speech domain that receives immutable semantic
    segments from AI streaming or authorized historical-message projection,
    queues one safeguarded ElevenLabs job per segment, stores each result as one
    encrypted generated asset with idempotent billing, and publishes ordered
    status events. Web and Apple clients share manifest semantics but own their
    local single-response playback queue and platform media controls.
  data_flow:
    - The owner client sends the chat-scoped enabled state with a user turn; recording completion updates the encrypted chat preference first.
    - Preprocessing chooses a deterministic prerecorded acknowledgement from request category, language, and mate voice metadata.
    - Main processing emits normal cumulative text plus separate immutable semantic speech-segment events without awaiting speech work.
    - The speech worker validates owner/message scope, safety, idempotency, credit headroom, and voice profile before one ElevenLabs request.
    - The worker encrypts one segment file, indexes it, charges successful duration once, and publishes a safe ready/error event.
    - The client starts segment zero when ready, advances in manifest order, and exposes in-app plus supported OS controls.
    - The client concatenates encrypted duration-aligned paragraph waveform summaries into one pinned active-chat visualization while retaining separate audio files.
    - Speak on historical content submits only deterministic missing segment plaintext from the authorized decrypted client.
    - Disable, retry, source changes, voice-version changes, and deletion operate at segment/manifest scope.
  migration_and_rollout:
    - No destructive Directus migration is planned; A-4 must prove the encrypted chat metadata envelope can carry the preference before implementation.
    - Existing assistant messages have no manifests and generate deterministic segments on first Speak.
    - Roll out disabled by default per chat; the recording trigger enables only the current chat and remains visible.
    - Versioned voice profiles and source hashes invalidate only mismatched generated segments.
  observability:
    - Log content-free manifest and segment IDs, state transitions, duration, provider request ID, billing usage ID, retry class, and safe error category.
    - Never log speakable text, waveform samples, keys, provider credentials, safety reasoning, raw embed payloads, or unrelated chat content.
    - Track time to first ready segment, segment generation latency, queue underruns, autoplay blocks, provider/storage failures, and billing reconciliation without user identity in default metrics.
  assumptions_to_check:
    - A-4 by tracing encrypted chat metadata serialization, sync, reload, and Apple compatibility before changing schemas.
    - A-5 by tracing mate metadata generation and server-only provider configuration before adding voice fields.
  risks_and_open_questions:
    - Full-response waveform cannot be complete before the final manifest; the approved bar expands over all known segments and becomes complete at finalization.
    - Request stitching may serialize provider work enough to create queue underruns; measure time-to-first and inter-segment wait before tuning concurrency.
    - Browser autoplay and Media Session behavior differs by platform; retain complete in-app controls and explicit recovery.
    - Historical on-demand plaintext must remain a first-party owner-scoped transient boundary and may not become a developer endpoint.
    - A quality and latency comparison with Eleven v3 Conversational is deferred until this specification is fully implemented and verified.
  technical_plan_approval:
    required: false
    reason: All material boundaries are already explicit in the approved permanent contract; remaining choices are implementation details verified by tests.
  demonstration_plan:
    capture_source: Deployed assistant-response-speech.spec.ts runs for phone 390x844 and laptop 1440x900, followed by Apple iPhone portrait and iPad landscape evidence after user confirmation.
    captions: Write exact device-scoped WebVTT captions only after normal green gates; captions remain toggleable and never reduce the clean frame.
    review: Provide bounded frames plus complete captions to the reviewer; never place the full video in model context and do not run proof-specific PII replacement.
    publication: Upload approved video and WebVTT through scripts/opencode_response_media.py and embed every returned snippet in the completion response.
  affected_files:
    - path: contracts/features/assistant-response-speech
      reason: Approved permanent behavior and examples.
    - path: docs/specs/assistant-response-speech/spec.yml
      reason: Executable implementation and evidence ledger.
    - path: backend/apps/ai
      reason: Immutable speech-segment emission parallel to text streaming.
    - path: backend/apps/audio
      reason: Assistant segment worker, storage, safety, and billing reuse.
    - path: backend/shared/python_schemas
      reason: Shared manifest, segment, request, and status event schemas.
    - path: backend/core/api/app/routes
      reason: Authenticated owner-scoped first-party WebSocket/API handling.
    - path: frontend/packages/ui/src
      reason: Chat preference, deterministic projection, playback queue, composer/message controls, and pinned full-response waveform bar.
    - path: frontend/apps/web_app/tests/assistant-response-speech.spec.ts
      reason: Deployed user-flow verification and proof source.
    - path: apple/OpenMates
      reason: Native preference, queue, controls, and parity tests after web confirmation.
    - path: docs/architecture/assistant-response-speech.md
      reason: Durable data flow, privacy boundary, and operational behavior.
  verification_strategy:
    - Validate and approve the permanent contract and executable spec first.
    - Write focused backend and frontend tests and record expected red evidence before product implementation.
    - Prove authenticated happy path, unauthorized/wrong-owner, rate, budget, safety, storage, and deletion behavior against the real dev API/WebSocket.
    - Deterministically verify no CLI or public SDK generation surface was added.
    - Deploy web, run the focused Playwright spec, inspect laptop/mobile visual smoke, and produce reviewed phone/laptop proof videos.
    - Obtain user confirmation before Apple implementation and remote native verification.
  verification_order:
    - Contract and spec validation plus exact approval.
    - Backend unit/contract red tests.
    - Real authenticated first-party API/WebSocket dev-server proof; CLI and public SDK phases are explicitly not exposed in V1.
    - Backend green tests for projection, streaming independence, worker, billing, privacy, and lifecycle.
    - Frontend queue Vitest.
    - Scoped dev deploy and deployed Playwright.
    - Reviewed laptop/mobile visual smoke and phone/laptop proof videos.
    - User confirmation of deployed web behavior.
    - Apple implementation, remote test/build, and native proof last.

