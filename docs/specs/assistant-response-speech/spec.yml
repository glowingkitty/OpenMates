clarification:
  rounds:
    - question: How long should Auto speak response remain enabled?
      answer: It remains enabled for the current chat until explicitly disabled.
    - question: What should happen when the user adds a voice-recording embed?
      answer: Enable speech for that chat by default and briefly make the message-input speech control glow.
    - question: Should generated speech be durable?
      answer: Store encrypted durable files, charge successful generation once, and make replay free.
    - question: What content should be narrated?
      answer: Speak prose plus deterministic producer-supplied summaries for code, tables, maps, calendars, and embeds.
    - question: How should voices and failures behave?
      answer: Use one fixed curated voice per mate; speech failures remain visible and nonblocking while text and speech run as parallel tasks.
    - question: Should one message become one audio file?
      answer: No. Every paragraph or structured summary gets its own ElevenLabs request and encrypted S3 file.
  vision_summary: >
    Assistant response speech is an optional chat-scoped companion to the
    authoritative text stream. It uses deterministic semantic projection, one
    durable encrypted file per paragraph or summary, curated mate voices,
    progressive queue playback, and segment-level success-only billing without
    adding a general cleanup model or exposing encrypted chat history.
  approved_by_user: true

