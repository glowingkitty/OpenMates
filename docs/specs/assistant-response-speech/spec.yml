assumptions:
  - id: A-1
    text: Existing generated-audio encryption, chatfiles S3 indexing, and chat/message billing attribution can be reused without weakening the client-encrypted chat boundary.
    category: architecture
    required_before: implementation
    status: confirmed
    evidence:
      - source: backend/apps/audio/tasks/speak_task.py and backend/apps/audio/tasks/common.py
        summary: Existing audio.speak workers already encrypt generated audio, index private files, and charge with chat and message metadata.
  - id: A-2
    text: ElevenLabs request IDs or previous text can preserve continuity across separate paragraph requests.
    category: provider
    required_before: implementation
    status: confirmed
    evidence:
      - source: ElevenLabs official Text-to-Speech stream and request-stitching documentation reviewed through Context7
        summary: The API supports previous_request_ids, previous_text, and streaming output for separately generated text segments.
  - id: A-3
    text: Web Media Session previous-track and next-track controls are best-effort and cannot replace in-app controls.
    category: browser
    required_before: implementation
    status: confirmed
    evidence:
      - source: MDN Media Session API and setActionHandler documentation reviewed 2026-08-31
        summary: Media Session actions exist but the API is not Baseline and autoplay remains user-agent controlled.
  - id: A-4
    text: A dedicated encrypted_auto_speak_response ciphertext field can carry the chat-scoped preference through Directus, cache, WebSocket metadata revisions, phased sync, web IndexedDB, and Apple persistence without plaintext storage or a destructive migration.
    category: encryption_sync
    required_before: implementation
    status: corrected
    evidence:
      - source: backend/core/directus/schemas/chats.yml and encrypted chat metadata/sync handlers
        summary: Existing metadata is explicit per encrypted field, so an additive encrypted column plus version-aware web/Apple sync support is required; missing ciphertext safely means false for legacy chats.
  - id: A-5
    text: Provider-neutral voice profile keys and versions can live in backend mate frontmatter after typed loader support, while a separate backend-only audio resolver owns ElevenLabs voice IDs and settings.
    category: metadata
    required_before: implementation
    status: corrected
    evidence:
      - source: backend/apps/ai/mates/*.md and backend/apps/ai/utils/mate_utils.py
        summary: Mate frontmatter is the canonical runtime source but currently discards unknown voice fields; typed VoiceProfile support and a separate backend-only provider resolver are required.

contracts:
  api:
    - route: "Existing authenticated first-party chat WebSocket: request assistant speech segments"
      access_model: first-party client surface only
      auth: authenticated owner session or approved first-party device auth
      owner_scope: chat and assistant message must belong to the authenticated user
      rate_limits: per-user and per-chat segment dispatch limits plus bounded segment count and text length
      credit_budget_limits: preflight before each ElevenLabs dispatch; successful duration charge only
      encryption_boundary: accepts only current transient speakable segment plaintext derived from client-encrypted chat content; no unrelated chat plaintext; returns status and encrypted generated-asset metadata
    - route: "Existing authenticated first-party chat WebSocket: stream speech segment status"
      access_model: first-party client surface only
      auth: active owner chat subscription
      owner_scope: status is delivered only to authorized devices for the active chat/message
      rate_limits: bounded status events; no client-controlled provider polling loop
      credit_budget_limits: no charge for status delivery or replay
      encryption_boundary: carries IDs, state, duration, safe errors, and encrypted asset metadata; never segment plaintext, provider credentials, or raw diagnostics
  data:
    - Chat speech preference is synchronized as encrypted chat metadata and defaults false when absent.
    - Speech manifests contain message, voice-version, source-version, ordered segment IDs, and operational states but no durable segment plaintext.
    - Every ready segment references exactly one AES-GCM encrypted private chatfiles S3 object and one upload_files ownership record.
    - Segment idempotency binds chat ID, assistant message ID, source hash, voice profile version, and sequence.
    - Deleting a message or chat deletes its speech manifest, segment records, and generated S3 objects.
  ui_states:
    - Auto speak off, enabled, recording-trigger highlight, acknowledgement playing, waiting for first segment, playing, paused, waiting for next segment, autoplay blocked, failed, retrying, and completed.
    - Assistant message Speak, Pause, Resume, Stop, Previous paragraph, Next paragraph, Retry, and chat usage actions.
    - Pinned active-chat speech bar with full-response waveform, active paragraph highlight, generating paragraph state, progress, and direct paragraph selection.
  privacy_security:
    - No public, anonymous, developer API-key, CLI, or SDK generation surface in V1.
    - Deterministic projection and a minimal non-rewriting semantic safety decision run before ElevenLabs.
    - Segment plaintext, provider IDs, credentials, encryption keys, safety reasoning, raw embeds, and unrelated chat content are excluded from durable logs and provider payloads.
    - Existing privacy disclosures must accurately identify ElevenLabs processing and generated-audio retention/deletion behavior.

