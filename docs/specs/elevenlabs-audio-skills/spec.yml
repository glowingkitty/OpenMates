scenarios:
  - id: S-1
    title: Generate short OpenMates sound effects
    given:
      - Alice is authenticated and has enough credits for generated audio.
      - ElevenLabs provider credentials are configured on the server.
    when:
      - Alice calls audio.generate with provider elevenlabs and a prompt such as soft upward message sent confirmation tick, warm and subtle, no speech.
    then:
      - The request is validated with duration between 0.5 and 2.0 seconds and no speech/TTS content.
      - ElevenLabs sound generation runs only after safety checks pass.
      - The response preserves request IDs and returns playable audio/mpeg data or encrypted generated-audio embed metadata.
      - Credits are charged only for successful audio output.

  - id: S-2
    title: Speak an approved assistant response sample
    given:
      - Alice is authenticated and asks for a short assistant response sample.
      - Alice chooses provider elevenlabs and an OpenMates voice preset such as warm_neutral.
    when:
      - Alice calls audio.speak with text such as Welcome back. I found the best next step for you.
    then:
      - The request accepts only OpenMates voice presets, accent values, style values, and supported formats.
      - The optimized GPT OSS safeguard prompt classifies the text before ElevenLabs is called.
      - Approved text starts ElevenLabs TTS and returns playable audio/mpeg data or encrypted generated-audio embed metadata.
      - The assistant response sample can be posted to Discord without exposing secrets, full logs, or binary payloads to the LLM.

  - id: S-3
    title: Reject malicious or deceptive speech before provider execution
    given:
      - Alice submits text that requests a seed phrase, impersonates a CEO, or tries to clone a private person's voice.
    when:
      - audio.speak validates the request.
    then:
      - Deterministic rules and the GPT OSS safeguard return a reject decision.
      - ElevenLabs is not called.
      - No generation credits are charged.
      - The user receives a safe visible error without raw safeguard reasoning or provider diagnostics.

  - id: S-4
    title: Provider metadata exposes availability and pricing
    given:
      - The server has or lacks SECRET__ELEVENLABS__API_KEY in Vault or env.
    when:
      - The app metadata and provider-availability endpoints load audio app skills.
    then:
      - ElevenLabs appears as the explicit provider for audio.generate and audio.speak when configured.
      - Missing provider credentials hide or disable the provider-backed skills as unavailable.
      - Pricing metadata uses verified ElevenLabs pricing with at least a one-credit successful-output floor.

  - id: S-5
    title: CLI and SDK callers use the same public contract
    given:
      - Alice has a paired CLI session or approved API-key SDK device.
    when:
      - Alice runs openmates apps audio generate or calls om.apps.audio.generate and om.apps.audio.speak from npm or pip.
    then:
      - CLI, npm SDK, and pip SDK send the same provider, request, validation, safety, error, and output shape as REST.
      - CLI/SDK docs expose native audio app-skill methods rather than a generic provider escape hatch.

  - id: S-6
    title: Web and Apple render generated audio embeds
    given:
      - A chat contains successful audio.generate and audio.speak app-skill outputs.
    when:
      - Alice opens the web app or Apple app chat and fullscreen embed.
    then:
      - The generated-audio preview and fullscreen include a playable audio control, provider/model/duration metadata, and safe error state.
      - Binary audio fields, encryption keys, nonces, wrapped keys, raw provider diagnostics, and safeguard reasoning are excluded from assistant-visible text and logs.
      - Web and Apple parity differences are recorded only as approved visual chrome differences.

  - id: S-7
    title: Live samples are posted to Discord
    given:
      - ElevenLabs credentials and the Discord webhook helper are available.
    when:
      - The implementation generates OpenMates SFX candidates and one assistant response voice sample.
    then:
      - Generated MP3 files are saved under a local temporary artifact directory.
      - The files are posted to the configured Discord dev channel with concise captions and without secrets.
      - The spec records the Discord message ID or a publication blocker.

