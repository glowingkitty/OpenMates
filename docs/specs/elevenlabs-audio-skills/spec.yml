decisions:
  - id: D-1
    status: active
    decision: audio.generate and audio.speak are separate app skills under the existing audio app.
    reason: SFX and TTS have different safety, voice, duration, and prompt semantics.
    decided_at: "2026-08-09T14:11:06Z"
  - id: D-2
    status: active
    decision: "The v1 request surface includes provider: elevenlabs even though no fallback provider is implemented yet."
    reason: Future providers can extend the enum without changing the public request shape.
    decided_at: "2026-08-09T14:11:06Z"
  - id: D-3
    status: active
    decision: audio.speak must run deterministic checks and the Groq-hosted openai/gpt-oss-safeguard-20b classifier before ElevenLabs generation.
    reason: TTS can turn malicious or deceptive text into more convincing synthetic audio and must be blocked before provider execution or billing.
    decided_at: "2026-08-09T14:11:06Z"
  - id: D-4
    status: superseded
    decision: Direct synchronous execution is allowed only if low-cost live probes stay within the 5-6 second target.
    reason: Superseded on 2026-08-11 by the encrypted generated-asset storage/indexing parity requirement; latency no longer controls whether generated audio may be returned inline.
    decided_at: "2026-08-09T14:11:06Z"
  - id: D-5
    status: active
    decision: audio.generate and audio.speak successful outputs must use the existing async app-skill task pattern and encrypted generated-asset storage indexed in upload_files.
    reason: Generated audio should match image, music, and video storage/privacy/indexing semantics and must not add new inline audio_base64 payloads to chat sync.
    decided_at: "2026-08-11T00:00:00Z"
  - id: D-6
    status: superseded
    decision: audio.speak defaults to ElevenLabs Multilingual v2, while Flash v2.5 remains an explicit lower-cost model selection.
    reason: Superseded on 2026-08-31 by the user-approved Eleven v3 default and three-model selection contract.
    decided_at: "2026-08-11T00:00:00Z"
  - id: D-7
    status: active
    decision: audio.speak defaults to Eleven v3 and allows explicit selection of Eleven v3, Multilingual v2, or Flash v2.5.
    reason: Eleven v3 is the highest-quality option at the same published price as Multilingual v2; Multilingual v2 and Flash remain available for stability and lower-cost use cases.
    decided_at: "2026-08-31T00:00:00Z"

