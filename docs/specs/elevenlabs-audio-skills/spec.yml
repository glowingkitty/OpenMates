goal: >
  Add ElevenLabs-backed audio.generate and audio.speak as first-class OpenMates
  app skills, with explicit provider input, safe pre-provider speech
  classification, success-only billing, playable generated-audio embeds, CLI and
  SDK parity, and sample outputs delivered to Discord for review.

scope:
  in:
    - "audio.generate generates short non-speech OpenMates sound effects from text prompts using provider: elevenlabs."
    - "audio.speak generates explicit user-invoked speech samples using provider: elevenlabs and OpenMates voice presets only."
    - audio.speak runs deterministic rules and the Groq-hosted openai/gpt-oss-safeguard-20b model with an optimized audio-speech safety prompt before any ElevenLabs call.
    - Rejected audio.speak requests call no speech provider and charge no generation credits.
    - Generated audio returns playable MP3-compatible direct output or encrypted generated-audio embed metadata without exposing audio bytes or encryption material to LLM inference.
    - REST API, CLI, npm SDK, pip SDK, web embed, and Apple rendering semantics follow the approved contracts.
    - Generate and post OpenMates sound-effect samples plus one assistant-response voice sample to Discord for review.
  out:
    - Automatic assistant voice replies or chat-wide voice playback settings.
    - Voice cloning, user-uploaded voice samples, raw ElevenLabs voice IDs, or imitation of real people/public figures.
    - Long-form narration, podcasts, audio books, streaming TTS, singing, or music generation.
    - Unauthenticated public anonymous audio generation.
    - Adding non-ElevenLabs providers in this slice; the request shape remains provider-extensible.

