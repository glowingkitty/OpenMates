contracts:
  api:
    - route: POST /v1/apps/audio/skills/generate
      access_model: first-party client surface only plus approved developer API-key SDK access
      auth: authenticated session or approved API key/device
      rate_limits: existing app-skill route limiter plus provider/budget limits
      credit_budget_limits: user credit headroom before provider call; charge only successful outputs
      encryption_boundary: accepts plaintext prompts for provider generation; returns audio bytes only in direct response or encrypted generated-asset metadata
      request: AudioGenerateRequest from feature.app-skill.audio-generate@1
      response: AudioGenerateResponse from feature.app-skill.audio-generate@1
    - route: POST /v1/apps/audio/skills/speak
      access_model: first-party client surface only plus approved developer API-key SDK access
      auth: authenticated session or approved API key/device
      rate_limits: existing app-skill route limiter plus provider/budget limits
      credit_budget_limits: user credit headroom before safeguard/provider call; charge only successful outputs using generated-audio duration pricing
      encryption_boundary: accepts plaintext TTS text for safeguard and provider generation; returns audio bytes only in direct response or encrypted generated-asset metadata
      request: AudioSpeakRequest from feature.app-skill.audio-speak@1
      response: AudioSpeakResponse from feature.app-skill.audio-speak@1
  data:
    - Generated sample artifacts are temporary local files or encrypted generated assets; no provider credentials or raw safeguard diagnostics are persisted.
    - OpenMates voice presets map internally to provider voice IDs and are not exposed through public request contracts.
  ui_states:
    - Audio preview, fullscreen playback, processing or unavailable state, validation error, safeguard rejection, provider timeout, and provider unavailable.
  privacy_security:
    - Binary audio, AES keys, nonces, wrapped keys, raw provider diagnostics, and safeguard reasoning are excluded from LLM inference, logs, assistant prose, committed examples, and Discord captions.
    - audio.speak must receive explicit GPT OSS approval before ElevenLabs generation starts.
    - Rejected or safeguard-error speech requests do not call ElevenLabs and do not charge generation credits.

