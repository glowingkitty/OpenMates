clarification:
  rounds:
    - question: Should the feature be a generic ElevenLabs helper or real app skills?
      answer: Implement real OpenMates app skills with REST API, CLI, SDKs, and embeds.
    - question: Should SFX and TTS be one skill or separate skills?
      answer: Use separate audio.generate for short non-speech SFX and audio.speak for explicit TTS.
    - question: Should provider be implicit when only ElevenLabs exists?
      answer: No. Provider must be an explicit input enum/list parameter for every provider-backed app skill.
    - question: Should audio.speak expose raw ElevenLabs voice IDs?
      answer: No. Use OpenMates voice presets that map internally to provider voice IDs.
    - question: How should malicious audio.speak input be prevented?
      answer: The GPT OSS safeguard model with an optimized safety prompt must approve or reject audio.speak input before audio generation starts.
  vision_summary: >
    Users should be able to generate short OpenMates SFX and one-off assistant
    response speech through proper app skills, not a generic provider escape
    hatch. Every provider-backed request exposes provider selection now, and
    speech input must be approved by the Groq-hosted GPT OSS safeguard before
    ElevenLabs is called.
  approved_by_user: true

