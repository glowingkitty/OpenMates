implementation_plan:
  spec_path: docs/specs/elevenlabs-audio-skills/spec.yml
  existing_patterns:
    - backend/core/api/app/routes/apps_api.py dynamic app-skill route registration from app.yml.
    - backend/apps/music/tasks/generate_task.py encrypted generated-audio asset and billing pattern.
    - backend/shared/providers/groq/safeguard.py structured GPT OSS safeguard pattern.
    - scripts/generate_sdk_app_skills.py generated npm/pip app-skill method pattern.
    - frontend/packages/ui/src/components/embeds/music/MusicGenerateEmbedPreview.svelte generated-audio UI pattern.
  architecture: >
    Add ElevenLabs as a pure provider wrapper under backend/shared/providers,
    expose audio.generate and audio.speak through the existing audio app metadata
    and dynamic app-skill REST routes, use existing generated-asset encryption
    helpers for persisted embed metadata, and gate audio.speak through a minimal
    GPT OSS safeguard classifier before provider execution or billing.
  data_flow:
    - "Authenticated REST/CLI/SDK caller sends audio.generate or audio.speak with provider: elevenlabs."
    - Backend validates request schema and provider availability from app metadata and Vault-backed provider metadata.
    - audio.generate applies deterministic SFX safety checks; audio.speak applies deterministic checks and GPT OSS safeguard approval.
    - Approved requests call the ElevenLabs provider wrapper and receive MP3 bytes plus normalized metadata.
    - Successful results are charged once, direct responses include audio_base64 only when allowed, and persisted embeds use encrypted generated-asset metadata.
    - Web and Apple render generated-audio app-skill outputs with playable controls and safe error states.
  affected_files:
    - path: docs/specs/elevenlabs-audio-skills/spec.yml
      reason: Full executable spec and evidence ledger.
    - path: contracts/features/app-skills/audio-generate/contract.yml
      reason: Approved audio.generate durable contract.
    - path: contracts/features/app-skills/audio-speak/contract.yml
      reason: Approved audio.speak durable contract.
    - path: backend/providers/elevenlabs.yml
      reason: Provider key, model, pricing, and docs metadata.
    - path: backend/shared/providers/elevenlabs/client.py
      reason: Pure ElevenLabs API wrapper.
    - path: backend/shared/providers/groq/safeguard.py
      reason: Add audio-speech GPT OSS safeguard classifier if not already shared.
    - path: backend/shared/python_utils/media_generation_safety/pipeline.py
      reason: Extend deterministic safety rules for SFX and speech.
    - path: backend/apps/audio/app.yml
      reason: Add audio.generate/audio.speak skill metadata and provider/tool schemas.
    - path: backend/apps/audio/skills/generate_skill.py
      reason: audio.generate skill implementation.
    - path: backend/apps/audio/skills/speak_skill.py
      reason: audio.speak skill implementation.
    - path: backend/tests/test_media_generation_safety.py
      reason: Safety red/green coverage.
    - path: backend/tests/test_rest_api_audio.py
      reason: REST app-skill contract coverage.
    - path: frontend/packages/openmates-cli/src/generated/appSkills.ts
      reason: Generated npm/CLI app-skill surface.
    - path: packages/openmates-python/openmates/generated/app_skills.py
      reason: Generated pip SDK app-skill surface.
    - path: frontend/packages/ui/src/components/embeds/audio
      reason: Generated-audio preview/fullscreen rendering.
    - path: frontend/apps/web_app/tests/skill-audio-generate-speak.spec.ts
      reason: Deployed web app-skill embed coverage.
    - path: shared/docs/privacy_policy.yml
      reason: ElevenLabs privacy disclosure.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/elevenlabs-audio-skills/spec.yml
    - python3 scripts/contracts.py check-generated
    - python3 -m pytest backend/tests/test_media_generation_safety.py backend/tests/test_rest_api_audio.py
    - python3 scripts/audit_sdk_cli_parity.py
    - python3 scripts/sessions.py deploy --session d4bc --title "Add ElevenLabs audio app skills" --message "Add ElevenLabs audio app skills"
    - python3 scripts/tests.py run --spec skill-audio-generate-speak.spec.ts --gate-deploy --expected-commit <COMMIT_SHA>
    - node frontend/apps/web_app/scripts/visual-smoke.mjs --url https://app.dev.openmates.org/<route> --session d4bc
    - python3 scripts/spec_verify.py docs/specs/elevenlabs-audio-skills/spec.yml
  verification_order:
    - Direct REST API contract and live provider probe against https://api.dev.openmates.org first.
    - Real CLI command against the dev server second.
    - npm SDK and pip SDK local calls against the dev server third.
    - GitHub Actions or daily-test wiring only after local REST, CLI, and SDK evidence passes.
    - Web implementation and deployed Playwright fourth.
    - Reviewed laptop/mobile visual smoke fifth.
    - User confirmation of deployed dev web behavior sixth.
    - Apple parity/build last.

