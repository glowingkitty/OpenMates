contracts:
  api:
    - route: POST /v1/apps/audio/skills/generate
      access_model: first-party client surface only plus approved developer API-key SDK access
      auth: authenticated session or approved API key/device
      rate_limits: existing app-skill route limiter plus provider/budget limits
      credit_budget_limits: user credit headroom before provider call; charge only successful outputs
      encryption_boundary: accepts plaintext prompts for provider generation; returns processing task/embed IDs first and final encrypted generated-asset metadata only, never new inline audio_base64
      request: AudioGenerateRequest from feature.app-skill.audio-generate@1
      response: AudioGenerateDispatchResponse followed by AudioGenerateResponse from feature.app-skill.audio-generate@1
    - route: POST /v1/apps/audio/skills/speak
      access_model: first-party client surface only plus approved developer API-key SDK access
      auth: authenticated session or approved API key/device
      rate_limits: existing app-skill route limiter plus provider/budget limits
      credit_budget_limits: user credit headroom before safeguard/provider call; charge only successful outputs using result-declared duration pricing
      encryption_boundary: accepts plaintext TTS text for safeguard and provider generation; returns processing task/embed IDs first and final encrypted generated-asset metadata only, never new inline audio_base64
      request: AudioSpeakRequest from feature.app-skill.audio-speak@1
      response: AudioSpeakDispatchResponse followed by AudioSpeakResponse from feature.app-skill.audio-speak@1
  data:
    - Successful private generated audio is encrypted into chatfiles S3, indexed in upload_files, and exposed to REST/CLI/SDK consumers through short-lived generated-asset download URLs.
    - Public example audio uses static public MP3 fixtures derived from real generated outputs and must not commit private generated-asset keys, signed tokens, wrapped keys, or inline audio_base64.
    - OpenMates voice presets map internally to provider voice IDs and are not exposed through public request contracts.
  ui_states:
    - Audio preview, fullscreen playback, processing or unavailable state, validation error, safeguard rejection, provider timeout, and provider unavailable.
  privacy_security:
    - New successful outputs never include inline audio_base64; binary audio, AES keys, nonces, wrapped keys, generated-asset bearer tokens, raw provider diagnostics, and safeguard reasoning are excluded from LLM inference, logs, assistant prose, committed examples, public examples, and Discord captions.
    - audio.speak must receive explicit GPT OSS approval before ElevenLabs generation starts.
    - Rejected or safeguard-error speech requests do not call ElevenLabs and do not charge generation credits.

