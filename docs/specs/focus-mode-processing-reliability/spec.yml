risks:
  - Removing the gate entirely could weaken active Deep research delegation; tests must distinguish inactive relevance from active continuation.
  - Live model choice is nondeterministic; backend invariants require deterministic tests in addition to real-provider E2E evidence.
  - Existing E2E failures may include test timing or shared app-skill infrastructure defects unrelated to focus state.
  - Focus activation persists encrypted metadata across clients; accidental server-side persistence would violate the encryption boundary.

