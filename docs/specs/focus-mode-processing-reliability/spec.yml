scenarios:
  - id: S-1
    title: Relevant Deep research remains an activation candidate
    given:
      - A user sends a current-information request without selecting a focus mode.
      - Preprocessing returns `web-search` as a relevant skill and `web-research` as a relevant focus mode.
      - The chat has no active focus mode.
    when:
      - Main processing constructs the available tools.
    then:
      - "`web-search` remains available."
      - "`activate_focus_mode` is available with `web-research` as a valid candidate."
      - "`active_focus_id` remains unset."
      - "`start_sub_chats` may remain available, but it is not the only tool forced by focus relevance."
  - id: S-2
    title: Ordinary web search runs without activating Deep research
    given:
      - The tools from S-1 are available.
    when:
      - The main model calls `web-search`.
    then:
      - The call passes the strict allow-list and executes normally.
      - No focus countdown, active-focus event, focus persistence, or sub-chat is created.
      - The final answer incorporates actual search results.
  - id: S-3
    title: Main model explicitly requests focus activation
    given:
      - "`web-research` is relevant but inactive."
    when:
      - The main model calls `activate_focus_mode` with `web-research`.
    then:
      - A visible activation embed starts in countdown state.
      - The user can reject activation before auto-confirm.
      - Main processing does not directly assign or persist active focus state.
  - id: S-4
    title: Confirmed Deep research continues with delegated research
    given:
      - The user did not reject the countdown.
    when:
      - Auto-confirm publishes `focus_mode_activated` and continuation starts with `active_focus_id` set to `web-research`.
    then:
      - Web stores and returns the encrypted active focus identifier through the existing first-party WebSocket contract.
      - The active focus pill and activation state are visible.
      - Deep research instructions are injected.
      - The active-mode continuation exposes the intended sub-chat delegation path.
  - id: S-5
    title: User rejects focus activation
    given:
      - A focus activation countdown is visible.
    when:
      - The user rejects it before auto-confirm.
    then:
      - The focus mode never becomes active or persisted.
      - The activation card leaves countdown state and hides according to the existing UI contract.
      - Processing continues without the focus prompt and can still use ordinary relevant skills.
  - id: S-6
    title: Related deployed focus-mode journeys remain healthy
    given:
      - The backend state-machine repair is deployed to dev.
    when:
      - Activation, rejection, post-activation UI, and real video continuation specs run.
    then:
      - Failures caused by this state-machine defect pass.
      - Any unrelated test or UI defect is documented and repaired separately without weakening assertions.
  - id: S-7
    title: OpenMates CLI explicitly activates Deep research
    given:
      - A user is authenticated in OpenMates CLI against the dev server.
      - CLI app metadata resolves `@Web-Research` to `@focus:web:research`.
    when:
      - The user runs `openmates chats new "@Web-Research compare today's major AI announcements and cite current sources" --json`.
    then:
      - The CLI sends an explicit focus-mode override through the real dev chat path.
      - The backend activates the requested focus mode through the existing explicit-user activation path rather than treating it as an inferred candidate.
      - The returned chat and embed data identify Deep research as active.
      - Focused continuation delegates research through sub-chats and returns a final sourced answer without invalid-tool or preprocessing errors.

