decisions:
  - id: D-1
    status: active
    decision: Category and icon are encrypted Workflow metadata and never plaintext Directus fields.
    reason: Workflow subject identity can reveal private intent and follows the existing encrypted Workflow metadata boundary.
    decided_at: '2026-08-26'
  - id: D-2
    status: active
    decision: Identity resolution uses graph/app metadata first and a bounded metadata classifier only for ambiguous graphs.
    reason: Obvious Workflows need no AI cost; ambiguous title/manual Workflows still receive useful identity.
    decided_at: '2026-08-26'
  - id: D-3
    status: active
    decision: Identity fallback is category general_knowledge and icon help-circle, using existing category gradients and icon validation.
    reason: Creation must remain reliable and visually coherent when classification fails.
    decided_at: '2026-08-26'
  - id: D-4
    status: active
    decision: Existing Workflow routes are extended rather than adding a new identity endpoint.
    reason: Category/icon are ordinary Workflow metadata and should preserve REST/CLI/SDK parity through existing create, update, list, and detail contracts.
    decided_at: '2026-08-26'
  - id: D-5
    status: active
    decision: The same graph renderer powers editable Template, historical versions, and run execution detail.
    reason: Shared geometry is required by the visual contract and avoids divergent card/timeline implementations.
    decided_at: '2026-08-26'
  - id: D-6
    status: active
    decision: Reuse only call_preprocessing_llm through a bounded Workflow identity adapter after redacting category/icon arguments; never call the full chat preprocessing pipeline.
    reason: The low-level seam has no credit debit or chat side effects, while the full pipeline is unsafe and unnecessary for Workflow metadata assignment.
    decided_at: '2026-08-26'

scenarios:
  - id: S-1
    title: Alice creates a category-styled disabled Workflow draft
    given:
      - Alice is authenticated and opens /workflows.
      - Existing Workflows and starter cards are available.
    when:
      - Alice enters Daily weather check in the bottom composer.
    then:
      - A disabled persisted draft opens in Template.
      - Its category and icon are assigned automatically and stored encrypted.
      - Its card and header use the resolved existing category gradient and assigned icon.
      - Invalid or missing identity falls back to general_knowledge and help-circle without blocking creation.
  - id: S-2
    title: Alice edits a Workflow through the Template canvas
    given:
      - Alice has opened a Workflow in Template.
    when:
      - Alice expands the Weather action and changes Berlin to Paris.
    then:
      - The action expands inside its existing card.
      - Save and Undo appear in the contextual unsaved panel.
      - The server graph remains unchanged until Save.
      - Saving creates a new immutable definition version.
  - id: S-3
    title: Dirty edits are protected during navigation
    given:
      - Alice has unsaved Template changes.
    when:
      - Alice selects Runs, another Workflow, a historical version, or workspace home.
    then:
      - Alice must choose Save, Discard, or Stay.
      - No transition silently discards local edits.
  - id: S-4
    title: Alice inspects and restores a historical version
    given:
      - The Workflow has multiple immutable definition versions.
    when:
      - Alice selects an older timestamp in the version timeline.
    then:
      - The full Workflow graph renders read-only with the same Template geometry.
      - The current version remains visibly marked Active.
      - Confirmed restore creates a new current version without mutating history.
  - id: S-5
    title: Alice inspects the full Workflow run lifecycle
    given:
      - The Workflow has a next scheduled occurrence and completed, failed, or active persisted runs.
    when:
      - Alice switches to Runs and selects a persisted run.
    then:
      - A horizontal timeline distinguishes Next, completed, failed, active, waiting, and cancelled states with text and icons.
      - The selected run renders its pinned Workflow version and per-node execution statuses.
      - Available input, output, source, branch, and error detail is grouped inside expanded nodes.
      - Expired content remains explicitly unavailable while run and node statuses remain visible.
      - Cancellation is available only for cancellable runs and requires confirmation.
  - id: S-6
    title: Laptop and phone render the same Workflow hierarchy
    given:
      - The deployed app is opened at 1440x900 and 390x844.
    when:
      - Alice uses the workspace, Template, expanded editor, version history, and Runs.
    then:
      - The category header, tabs, cards, timelines, save controls, and bottom composer remain reachable without clipping or page overflow.
      - Mobile forms stack in one column and timelines scroll horizontally.
      - Dark mode uses only color-grey tokens and preserves hierarchy.
  - id: S-7
    title: Workflow identity metadata remains consistent across programmatic surfaces
    given:
      - A Workflow has encrypted category software_development and icon code.
    when:
      - Alice reads it through REST, CLI, npm SDK, pip SDK, and web.
    then:
      - Every surface resolves the same decrypted category and icon for its authorized owner context.
      - No API, log, notification, or Directus cleartext field exposes private category/icon values.

