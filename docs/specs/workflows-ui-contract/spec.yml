goal: >
  Make the deployed Workflows workspace implement the approved visual and UX
  contract: category-derived Workflow identity, recommendation-led creation,
  a stable detail header with shared Template/Runs tabs, compact in-place graph
  editing, guarded explicit saves, immutable version inspection, and a detailed
  run timeline on laptop and mobile.

scope:
  in:
    - Add encrypted Workflow category and icon persistence, API models, graph-first assignment, bounded metadata fallback, and stable fallbacks.
    - Preserve owner/team scoping and expose category/icon through existing Workflow REST, CLI, npm SDK, pip SDK, and web models.
    - Render start cards and Workflow headers from existing category gradients and assigned icons.
    - Use only dark-mode-aware `--color-grey-*` tokens for reusable grey surfaces.
    - Implement the stable category-gradient detail header and existing shared icon-tab system for Template and Runs.
    - Refactor the graph into a reusable renderer for editable Template, read-only versions, and read-only run executions.
    - Implement contextual Save/Undo and Save/Discard/Stay navigation protection.
    - Replace the version list with a timestamp selector, horizontal timeline, full read-only graph, and restore-as-new confirmation.
    - Replace run summary cards with a next/past run timeline and selected execution graph containing available statuses, inputs, outputs, sources, branches, and errors.
    - Verify deployed behavior and visual quality at 1440x900 and 390x844 and publish separate laptop and phone proof videos.
  out:
    - Natural-language Workflow planning or modification.
    - Voice Workflow authoring.
    - Public Workflow marketplace changes.
    - New Workflow execution node types or changes to existing execution semantics.
    - Apple-native Workflow workspace implementation.
    - Pixel-copying raw Figma values or introducing raw reusable colors.

context_discovery:
  github_issues:
    - Targeted `gh issue list` search for Workflow UI, category, icon, runs, and version history returned no matching issue.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/specs/workflows-v1/spec.yml
    - DESIGN.md
    - contracts/features/workflows-ui/contract.yml
    - contracts/features/workflows/contract.yml
    - contracts/features/workspace-shell/contract.yml
  code_patterns:
    - frontend/apps/web_app/src/routes/workflows/+page.svelte owns current hash state, creation, editing, and view orchestration.
    - frontend/packages/ui/src/components/settings/elements/SettingsTabs.svelte is the existing icon-tab system with a sliding gradient pill.
    - frontend/packages/ui/src/utils/categoryUtils.ts owns existing category gradients and category fallback icons.
    - frontend/packages/ui/src/components/workflows/WorkflowDetailPage.svelte owns the current Workflow header.
    - frontend/packages/ui/src/components/workflows/WorkflowVersionHistory.svelte owns immutable history and restore behavior.
    - frontend/packages/ui/src/components/workflows/WorkflowRunHistory.svelte currently renders summary cards only.
    - frontend/packages/ui/src/stores/workflowWorkspaceStore.ts caches Workflow detail and run lists but not selected run detail.
    - backend/core/directus/schemas/workflows.yml stores encrypted Workflow metadata but has no category/icon fields.
    - backend/core/api/app/services/workflow_service.py encrypts, hydrates, versions, and scopes Workflow records.
    - backend/core/api/app/services/workflow_models.py exposes Workflow summary, version, and run detail models.
    - backend/core/api/app/routes/workflows.py exposes existing authenticated/API-key CRUD, version, restore, run detail, and cancellation routes.
  tests:
    - backend/tests/test_workflow_core_ui_contract.py
    - backend/tests/test_workflow_runner.py
    - backend/tests/test_workflow_template_projection.py
    - frontend/apps/web_app/tests/workflows-input.spec.ts
