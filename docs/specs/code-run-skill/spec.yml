implementation_plan:
  spec_path: docs/specs/code-run-skill/spec.yml
  architecture: >
    Keep Code Run centered on the existing `/v1/code/run` and
    `/v1/apps/code/skills/run` execution services. Extend the E2B provider to
    return explicit output artifacts before sandbox teardown, then let the task
    store safe artifact status and call shared generated-asset storage adapters.
    Make `code.run` assistant-dispatchable through a bounded async continuation
    path, update CLI/SDK generated surfaces, and add minimal web artifact/history
    rendering on top of the existing terminal UI.
  existing_patterns:
    - Existing Code Run direct/chat-bound app-skill endpoint and status/stream primitives.
    - Existing generated-asset encrypted S3/upload_files storage used by image, audio, video, and 3D apps.
    - Existing code_run_outputs sidecar encryption and vault-encrypted inference cache.
    - Existing app-skill async continuation pattern for long-running assistant tool work.
    - Existing Remotion source-version/render-artifact separation precedent.
  data_flow:
    - Caller submits direct files or chat-bound target/selected embed references.
    - API validates ownership, paths, sizes, dependencies, rate limits, credits, and provider capacity.
    - E2B receives inert files, executes the selected target, streams sanitized terminal events, discovers explicit output artifacts, reads bounded artifact bytes, and closes.
    - Task stores terminal events plus safe artifact metadata; persisted artifacts are encrypted/indexed through generated-asset storage.
    - Direct callers receive transient terminal/artifact metadata; chat-bound clients encrypt terminal output sidecars and associate artifacts with normalized output-path history.
    - Assistant receives safe terminal/artifact summaries, may patch current-turn code, and reruns within the approved limit.
  affected_files:
    - {path: backend/shared/providers/e2b_code_runner.py, reason: Discover and read explicit output artifacts before sandbox teardown.}
    - {path: backend/apps/code/tasks/run_code_task.py, reason: Persist safe artifact status and encrypted generated assets alongside terminal state.}
    - {path: backend/core/api/app/routes/code_execution.py, reason: Extend request/status/app-skill response contracts and direct/chat-bound metadata.}
    - {path: backend/apps/code/skills/run_code_skill.py, reason: Replace stub with assistant-dispatchable Code Run skill entrypoint or async handoff.}
    - {path: backend/apps/ai/processing/main_processor.py, reason: Allow bounded async Code Run tool execution and current-turn rerun feedback.}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: Surface direct-run artifact metadata/download behavior.}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: Expose npm SDK Code Run artifact metadata.}
    - {path: packages/openmates-python/openmates/sdk.py, reason: Expose pip SDK Code Run artifact metadata.}
    - {path: frontend/packages/ui/src/services/codeRunService.ts, reason: Type and handle safe artifact/skipped metadata.}
    - {path: frontend/packages/ui/src/components/embeds/code/CodeEmbedFullscreen.svelte, reason: Render captured artifacts and history in the existing Code Run surface.}
    - {path: docs/user-guide/cli/apps-and-skills.md, reason: Document outputs/, openmates_outputs.json, and direct/chat-bound artifact behavior.}
  verification_strategy:
    - Add red tests for explicit artifact discovery, storage privacy, direct transient behavior, chat-bound history, and assistant auto-run before implementation.
    - Implement backend execution/artifact changes first and verify locally, then dev-server REST/WebSocket proof.
    - Verify CLI, npm SDK, and pip SDK against `https://api.dev.openmates.org` with real auth/API-key state.
    - Deploy web and run deployed Playwright plus reviewed visual smoke on laptop and mobile.
    - Collect user confirmation, then Apple parity evidence or an explicit waiver.
  verification_order: [T-PY-CODE-RUN, T-PY-AI-CODE-RUN, T-NODE-CLI-CODE-RUN, T-NODE-SDK-CODE-RUN, T-PY-SDK-CODE-RUN, T-FRONTEND-CODE-RUN, V-REST-CLI-SDK-DEV, V-LIVE-INFERENCE, T-PW-CODE-RUN, V-UI-VISUAL-SMOKE, V-USER-CONFIRMATION, V-APPLE-PARITY, V-SPEC-VERIFY]

