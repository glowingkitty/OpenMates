goal: >
  Make Code Run a complete app skill: assistant, web, REST, CLI, npm SDK, and pip
  SDK callers can execute bounded code only inside E2B, observe live terminal
  status, persist chat-bound encrypted output, collect intentional generated
  artifacts, keep same-path artifact history, and let the assistant debug code it
  created or edited without repeatedly asking the user.

scope:
  in:
    - Define Code Run as the canonical `code.run` app skill across assistant, web, REST, CLI, npm SDK, pip SDK, and Apple parity surfaces.
    - Preserve the existing E2B-only execution boundary, path validation, dependency validation, language dispatch, internet controls, cancellation, rate limits, and billing semantics.
    - Extend the E2B provider and task/status payloads to discover only explicit output artifacts before sandbox teardown.
    - Store persisted artifacts encrypted in private generated-asset storage and index them in upload_files.
    - Return direct-run artifact metadata/download URLs without creating chat state.
    - Create or update chat-bound artifact embeds by normalized output path and retain prior versions.
    - Include terminal output plus safe artifact metadata in assistant-visible context while excluding keys, bytes, URLs, tokens, s3 keys, sandbox IDs, and raw diagnostics.
    - Add a real inference test for assistant create-run-fail-debug-rerun-final-artifact behavior.
  out:
    - Private repository authentication.
    - Unbounded project upload, arbitrary binary input expansion, or backend URL fetching of user code.
    - Capturing all changed workspace files or hidden/dependency/cache/credential files as artifacts.
    - Replacing the existing web fullscreen Code Run UI beyond artifact affordances needed for the contract.
    - Making direct-run outputs durable chat content unless the caller explicitly uses chat-bound mode.

