decisions:
  - id: D-1
    status: active
    decision: >
      Code Run output artifacts are explicit-only: `outputs/` plus optional
      `openmates_outputs.json` entries after allowlist, denylist, path, size, and
      count checks.
    reason: Prevents accidental capture of source, dependency caches, secrets, and arbitrary workspace diffs.
    decided_at: "2026-08-23T00:00:00Z"
  - id: D-2
    status: active
    decision: >
      Chat-bound artifacts use one visible artifact per normalized output path
      with retained version history.
    reason: Same-path reruns represent iterations of the same generated output, not separate chat objects.
    decided_at: "2026-08-23T00:00:00Z"
  - id: D-3
    status: active
    decision: >
      Direct CLI/API/SDK runs return run-scoped terminal and artifact metadata
      without chat persistence.
    reason: Direct runs have no embed key or chat context and must remain transient unless explicitly chat-bound.
    decided_at: "2026-08-23T00:00:00Z"
  - id: D-4
    status: active
    decision: >
      Assistant auto-run is allowed only for code created or edited in the
      current assistant turn, with a two-rerun unprompted failure limit.
    reason: Enables useful self-debugging while keeping user-supplied code and repeated failures under user control.
    decided_at: "2026-08-23T00:00:00Z"

scenarios:
  - id: S-1
    title: Direct CLI/API run returns terminal output and run-scoped artifacts
    given:
      - Alice has an authenticated CLI/API session, at least 5 credits, and a local Python file that writes `outputs/summary.csv`.
    when:
      - Alice runs Code Run in direct mode through `openmates apps code run` or the REST/SDK app-skill endpoint.
    then:
      - OpenMates validates paths, payload size, dependency manifests, and internet controls before starting E2B.
      - E2B executes the target file and discovers `outputs/summary.csv` before sandbox teardown.
      - The direct result includes live terminal output, final exit status, and a short-lived artifact download URL.
      - No chat, message, embed, embed key, code_run_outputs sidecar, or artifact history is created.
  - id: S-2
    title: Chat-bound run persists encrypted terminal output
    given:
      - Alice has a non-incognito chat with a code embed and an embed key.
    when:
      - Alice runs the code from web fullscreen or chat-bound CLI/API mode.
    then:
      - The run reuses the existing chat/embed ownership checks and selected file collection.
      - Terminal output persists as the latest client-encrypted code_run_outputs sidecar for the target embed.
      - The transient inference cache is vault-encrypted, truncated when needed, and excludes artifact-sensitive fields.
  - id: S-3
    title: Chat-bound artifacts update same-path history
    given:
      - Alice has a chat-bound code embed that writes `outputs/chart.png`.
    when:
      - Alice runs it twice and the second run writes a different `outputs/chart.png`.
    then:
      - The chat shows one visible artifact for `outputs/chart.png`.
      - The second successful capture becomes the latest version.
      - The first capture remains available through artifact history.
  - id: S-4
    title: Unsafe and unintended files are not captured
    given:
      - A sandbox contains `outputs/.env`, `node_modules/cache.bin`, `__pycache__/main.pyc`, and a manifest entry for `../secret.txt`.
    when:
      - Artifact discovery runs after execution.
    then:
      - Hidden, dependency, cache, traversal, and out-of-policy files are skipped or rejected with safe visible reasons.
      - No artifact bytes, secret values, keys, signed tokens, or raw diagnostics are exposed to inference or logs.
  - id: S-5
    title: Assistant creates, runs, debugs, and reruns code
    given:
      - The assistant creates a Python code embed intended to generate `outputs/chart.png`.
    when:
      - The first Code Run fails with an import or runtime error.
    then:
      - The assistant may inspect terminal output, patch the code, and rerun without asking up to the approved limit.
      - The final response references the terminal result and generated artifact without exposing sensitive fields.
      - If failures continue or unexpected security/network risk appears, the assistant asks the user before another run.
  - id: S-6
    title: Web renders terminal output, artifacts, and history after reload
    given:
      - A deployed chat contains a code embed with a saved terminal output sidecar and a generated artifact with history.
    when:
      - Alice opens, reloads, and views the chat on laptop and mobile.
    then:
      - Terminal output, final status, artifact preview/download affordances, and artifact history render without raw protocol text.
      - Primary controls remain responsive and objective visual issues are fixed before completion.
  - id: S-7
    title: Cross-surface parity is preserved
    given:
      - The Code Run skill is available through REST, WebSocket status/stream, CLI, npm SDK, pip SDK, assistant, web, and Apple.
    when:
      - Equivalent direct and chat-bound runs are exercised.
    then:
      - Request validation, E2B-only execution, streaming, billing, output persistence, artifact discovery, version history, privacy exclusions, and visible failures match the approved contract or record explicit approved exceptions.

