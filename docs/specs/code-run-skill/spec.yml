contracts:
  api:
    - route: POST /v1/apps/code/skills/run
      access_model: first-party client surface plus approved developer API-key REST API
      auth: authenticated session cookie or Bearer API key with code.run app-skill scope
      rate_limits: existing Code Run start route limiter plus active-run and provider-capacity limits
      credit_budget_limits: minimum Code Run credits before start; minute-rounded charge after billable sandbox work begins
      encryption_boundary: direct mode accepts plaintext file payloads as inert data and returns transient terminal/artifact metadata; chat_bound mode may use client-decrypted code and persists terminal/artifact records only through encrypted chat/embed-key or generated-asset storage paths
    - route: GET /v1/code/run/{execution_id}
      access_model: first-party client surface plus approved developer API-key REST API
      auth: owner session or API key/device context matching the execution user hash
      rate_limits: existing authenticated API limits
      credit_budget_limits: none beyond the started execution
      encryption_boundary: returns sanitized execution status/events plus safe artifact metadata, never artifact bytes or encryption material
    - route: WS /v1/code/run/{execution_id}/stream
      access_model: first-party client surface only
      auth: websocket user session token matching execution user hash
      rate_limits: existing websocket/session limits
      credit_budget_limits: none beyond the started execution
      encryption_boundary: streams sanitized status/stdout/stderr and safe artifact updates only
    - route: GET /v1/generated-assets/{asset_id}/files/{variant}/download
      access_model: first-party/generated-asset signed download surface
      auth: signed short-lived generated-asset token and ownership validation
      rate_limits: existing generated-asset download limits
      credit_budget_limits: none
      encryption_boundary: server decrypts authorized encrypted generated artifact bytes for download; tokens and keys never enter inference
  data:
    - Redis execution records gain safe artifact/skipped metadata before TTL expiry.
    - Chat-bound terminal output remains latest encrypted code_run_outputs sidecar.
    - Chat-bound artifacts use encrypted private generated-asset storage plus upload_files indexing and path-version metadata.
    - Direct-run artifact download metadata expires and creates no chat records.
  ui_states:
    - Pre-run file/package selection, queued/preparing/uploading/installing/running/cancelling, finished, failed, timeout, cancelled, captured artifact, skipped artifact, storage failure, artifact history, expired/unauthorized download.
  privacy_security:
    - E2B remains the only place where user code, dependency installs, and artifact discovery execute.
    - Code Run inference payloads exclude artifact bytes, AES keys, nonces, vault-wrapped keys, signed tokens, s3 keys, sandbox IDs, raw provider diagnostics, and raw backend traces.
    - Direct-run outputs are transient unless explicitly chat-bound.

