implementation_plan:
  spec_path: docs/specs/landing-page-onboarding-refresh/spec.yml
  existing_patterns:
    - frontend/packages/ui/src/components/DailyInspirationBanner.svelte
    - frontend/packages/ui/src/components/ActiveChat.svelte
    - frontend/packages/ui/src/data/appsMetadata.ts
    - frontend/apps/web_app/tests/guest-interest-smart-selection.spec.ts
    - frontend/packages/ui/src/components/landing/LandingActionableEventDemo.svelte
  architecture: >
    Keep the landing in the existing app shell. Extend the guest intro variant of
    DailyInspirationBanner with an expanded-first-slide state, metadata-backed
    icon rails, deterministic request timing, and immediate skip/collapse behavior.
    The Actionable subcomponent owns one deterministic phase schedule and reports
    completion to DailyInspirationBanner. The parent delays playback until the
    mobile headline is compact, derives progress from the same shared duration,
    and advances exactly once without mounting the full chat runtime. Explicit
    mobile heading and slide phases ensure geometry and content change only at
    zero opacity.
  data_flow:
    - ActiveChat renders DailyInspirationBanner with `variant='guest-intro'` for logged-out welcome state.
    - DailyInspirationBanner detects first guest intro slide and starts expanded on mount for logged-out users.
    - Intro request timing drives current request text, highlighted app id, icon-rail alignment, and progress.
    - Manual next/previous updates the carousel immediately and disables the expanded intro state for the current component instance.
    - Auto completion collapses and advances to slide 2.
    - The Actionable slide starts immediately beside its headline on desktop and after headline compaction on mobile.
    - Actionable completion advances to the privacy slide and its progress bar uses the same desktop/mobile total duration.
    - Post-intro mobile navigation delays the current slide index update until content opacity reaches zero, then fades the newly mounted slide in.
  affected_files:
    - path: docs/specs/landing-page-onboarding-refresh/spec.yml
      reason: Product contract, implementation plan, and evidence ledger.
    - path: frontend/packages/ui/src/components/DailyInspirationBanner.svelte
      reason: Phase-1 guest intro animation implementation.
    - path: frontend/apps/web_app/tests/guest-interest-smart-selection.spec.ts
      reason: Focused deployed Playwright coverage for the refreshed logged-out intro.
    - path: frontend/packages/ui/src/components/landing/LandingActionableEventDemo.svelte
      reason: Localized one-shot messages, embed/pointer interactions, and stage motion.
    - path: frontend/packages/ui/src/components/embeds/events/EventEmbedPreview.svelte
      reason: Accept localized event-type and attendance labels from the landing demo while preserving shared preview rendering.
    - path: frontend/packages/ui/src/i18n/sources/demo_chats/for_everyone.yml
      reason: All visible Actionable demo copy for every supported locale.
    - path: frontend/apps/web_app/tests/landing-page-onboarding-refresh.spec.ts
      reason: Deployed behavioral, timing, localization, and responsive layout coverage.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/landing-page-onboarding-refresh/spec.yml
    - bash scripts/lint_changed.sh with focused `--path` arguments for the touched files before deploy.
    - python3 scripts/sessions.py deploy --session aab5 after focused local checks.
    - python3 backend/scripts/debug.py vercel until Ready.
    - Deploy the strengthened Playwright contract first and capture its expected red result against the old implementation.
    - Deploy the implementation and rerun `landing-page-onboarding-refresh.spec.ts` against the exact Ready commit.
    - Run Playwright visual smoke for `/` at laptop and mobile sizes and inspect the screenshots.
    - User visual confirmation before Apple parity.
  verification_order:
    - Spec validation.
    - Browser-only web implementation and focused local static/lint checks.
    - Deploy to dev.
    - Firecrawl visual inspection against app.dev.openmates.org across viewports.
    - User visual confirmation.
    - Full landing-page Playwright specs and Apple parity only after the full landing page refresh is implemented.

