    decision: Activate the regular-size Actionable event explainer slide after deployed iPad rail verification.
    reason: User instructed continuation with the other slides once the app rail clipping fix was confirmed working.
    decided_at: "2026-07-23"
  - id: D-6
    status: active
    decision: The primary intro app rail keeps moving right-to-left, slower than the secondary rail, with the highlighted apps consecutive.
    reason: User explicitly rejected a static top row and asked to remove filler app placeholders between the highlighted apps while preserving near-center highlighted visibility.
    decided_at: "2026-08-02"
  - id: D-7
    status: active
    decision: The Actionable animation is a one-shot timeline whose completion advances to the privacy slide, with a mobile-only same-node headline/icon morph and progress derived from the same duration.
    reason: The user rejected the repeating animation, abrupt compact heading replacement, and inaccurate fixed-duration progress behavior.
    decided_at: "2026-08-03"

