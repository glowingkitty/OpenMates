schema_version: 2
id: opencode-active-progress-notifier
title: Active OpenCode Progress Discord Notifier
status: verified

goal: >
  Give maintainers a periodic, low-noise Discord digest of currently active
  OpenCode chats so they can stay aware of decisions, blockers, code issues, and
  agent-workflow issues without relying on each chat to self-report.

scope:
  in:
    - Inspect live OpenCode presence and durable sessions from the existing local control plane.
    - Summarize only currently active top-level chats: working, waiting for user, stopped, or failed.
    - Exclude idle completed chats and notifier-owned analysis sessions.
    - Use Gemini 3.5 Flash Lite for every LLM summary generation.
    - Post one Discord message containing one overall summary and one per-active-chat section.
    - Default the recurring cadence to 10 minutes and provide a `--once`/`--dry-run` test path.
    - Persist local notification state only to suppress duplicates and record last summaries.
  out:
    - Product APIs, SDKs, web UI, Apple UI, or customer chat data.
    - OpenCode hook side effects, passive lifecycle prompt injection, or self-reporting agent instructions.
    - Automatic edits, commits, deploys, or task continuation.
    - Posting raw transcripts, reasoning traces, credentials, environment values, webhook URLs, or full command outputs to Discord.

documentation_impact:
  generated_reference:
    status: unchanged
    reason: No generated product API, SDK, or UI reference is affected.
  user_docs:
    status: unchanged
    reason: The change is maintainer tooling, not user-facing documentation.
  semantic_layer:
    status: unchanged
    reason: Product behavior and semantic model contracts are unchanged.

context_discovery:
  github_issues:
    - GitHub MCP returned HTTP 401 for `get_me`.
    - "`gh issue list --search \"\\\"OpenCode progress\\\" OR \\\"agent progress\\\" OR \\\"Discord notifier\\\"\" --limit 10 --json number,title,state,url` returned no matching issues."
  docs:
    - AGENTS.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/agent-tooling-parity.md
    - docs/specs/opencode-chat-improvement-review/spec.yml
    - docs/specs/agent-workflow-quality-parity/spec.yml
    - docs/specs/opencode-session-coordination/spec.yml
  code_patterns:
    - scripts/sessions.py exposes live presence through `status --json` and bounded transcript reads through `read_opencode_chat`.
    - .opencode/plugins/openmates-hooks.js writes passive presence heartbeats and must not launch prompts from passive observation.
    - scripts/discord_webhook.py provides stdlib Discord webhook posting helpers.
    - scripts/release_intelligence.py and scripts/audit_example_chat_quality.py show existing Gemini key resolution and generateContent calls.
  tests:
    - scripts/tests/test_opencode_chat_improvement_review.py
    - scripts/tests/test_run_tests_discord_summary.py
    - scripts/tests/test_spec_workflow_validation.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This is repository-local developer tooling with no Apple product counterpart.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Which architecture should report progress?
      answer: Use a separate inspector script rather than making chats self-report.
    - question: Which model should summarize active chat progress?
      answer: Always use the new Gemini 3.5 Flash Lite model for summarization.
    - question: What should the Discord output contain?
      answer: One overall summary of all currently ongoing chats, highlighting important decisions and places to watch, followed by a list of all active chats with title, OpenCode link, and per-chat summary.
    - question: What cadence should the first implementation use?
      answer: Start with every 10 minutes and adjust later if needed.
  vision_summary: >
    The notifier is an external active-chat observer. It only posts when active
    chats exist, uses Gemini 3.5 Flash Lite for summaries, and produces a single
    maintainer-oriented Discord digest with an overall status plus per-chat links
    and summaries.
  approved_by_user: true

implementation_state:
  subject_commit: working-tree@78f29f1fedde174359ef65f749a6ee6036f14b5a+opencode-progress-notifier

approvals:
  product_contract:
    status: approved
    approved_at: "2026-08-10T12:45:00Z"
  implementation_plan:
    status: not_required
