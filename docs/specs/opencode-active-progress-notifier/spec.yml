decisions:
  - id: D-1
    status: active
    decision: Use a separate inspector script instead of instructing active chats to send updates.
    reason: Presence and transcript inspection continue to work when a chat is stuck, blocked, or waiting for user input, and avoids prompt pollution.
    decided_at: "2026-08-10T12:45:00Z"
  - id: D-2
    status: active
    decision: Use Gemini 3.5 Flash-Lite for LLM summary attempts.
    reason: Gemini 3 Flash Preview is available only as an older preview without a documented cheaper current price, while current docs price Gemini 3.5 Flash-Lite as the lowest-cost current Gemini option; the user explicitly rejected Mistral for the normal path.
    decided_at: "2026-08-10T12:45:00Z"
  - id: D-3
    status: superseded
    decision: Keep the notifier outside OpenCode hooks.
    reason: Superseded by D-8 after maintainer feedback that periodic progress notifications are useless and hook-triggered events are preferred.
    decided_at: "2026-08-10T12:45:00Z"
  - id: D-4
    status: active
    decision: Do not send a Discord message when no active chats are present.
    reason: The user explicitly requested no summary when no chats are currently actively running.
    decided_at: "2026-08-10T12:45:00Z"
  - id: D-5
    status: active
    decision: Group the Discord embed into currently active, waiting for user input, and completed in the last 30 minutes.
    reason: The user explicitly rejected stale waiting chats such as the old Fiverr research chat and requested these three buckets.
    decided_at: "2026-08-11T16:35:00Z"
  - id: D-6
    status: active
    decision: Do not show the summarizer model or cost estimate in the visible Discord response, and do not intentionally shorten normal summary or task text with ellipses.
    reason: The user validated the grouped format except for visible ellipses, hidden tasks, and unnecessary model/cost metadata.
    decided_at: "2026-08-11T17:10:00Z"
  - id: D-7
    status: superseded
    decision: Summarize a chat with Gemini only the first time it appears; render follow-up notifications as deterministic task/status deltas and skip unchanged chats.
    reason: The maintainer found repeated full summaries too dense and explicitly asked to focus follow-ups on updates while saving tokens.
    decided_at: "2026-08-11T17:58:00Z"
  - id: D-8
    status: active
    decision: Replace periodic active-chat progress digests with two hook-triggered notifications.
    reason: The maintainer does not use the current progress notification stream and requested notifications only for task-list changes and completed responses.
    decided_at: "2026-08-12T14:30:00Z"
  - id: D-9
    status: active
    decision: Task-list notifications are deterministic; completed-response notifications use Gemini 3.5 Flash-Lite for a short summary.
    reason: Task list changes are already structured OpenCode `todowrite` data, while completion notifications need a short maintainer-readable summary without posting the full response.
    decided_at: "2026-08-12T14:30:00Z"

