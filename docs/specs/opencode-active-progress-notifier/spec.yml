risks:
  - id: R-1
    risk: Discord noise if unchanged active chats are summarized too often.
    mitigation: Default 15-minute cadence, transcript fingerprint dedupe, and no-active silence.
  - id: R-2
    risk: Summaries could leak raw transcript or secret-like content.
    mitigation: Use bounded projections, omit reasoning/attachments, apply simple secret redaction, and post summaries instead of raw evidence.
  - id: R-3
    risk: Model name availability may differ across provider releases.
    mitigation: Keep the model configurable by explicit CLI override while defaulting to `mistral-small-latest` and retaining `gemini-3.5-flash-lite` only for comparison.

open_questions: []

privacy_security:
  data_classification: Repository-local developer tooling metadata and bounded OpenCode transcript projections.
  secrets_handling:
    - Do not print or persist Discord webhook URLs, Mistral API keys, or Gemini API keys.
    - Resolve Mistral and Gemini keys from existing environment or Vault-backed helper patterns.
    - Redact secret-like tokens before prompts and Discord payloads.
  retention:
    - Persist only summary state and fingerprints in `.opencode/progress-notifier-state.json`.
    - Do not persist raw transcripts or model prompt bodies.

