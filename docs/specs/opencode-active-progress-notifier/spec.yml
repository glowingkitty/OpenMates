implementation_plan:
  spec_path: docs/specs/opencode-active-progress-notifier/spec.yml
  existing_patterns:
    - scripts/sessions.py status --json and chat read projections
    - scripts/opencode_chat_improvement_review.py report, Discord, and scheduled tooling style
    - scripts/release_intelligence.py Gemini generateContent function-calling style
  architecture: >
    Add a standalone script that reads live status, fetches bounded transcripts
    for active top-level chats, calls Gemini 3.5 Flash Lite for a structured JSON
    digest, formats a single Discord payload, and stores local dedupe state.
  data_flow:
    - Read live session status from the local control plane.
    - Fetch bounded OpenCode transcript projections for active top-level session IDs.
    - Build a bounded JSON evidence prompt for Gemini 3.5 Flash Lite.
    - Format the returned overall and per-chat summaries into one Discord message.
    - Persist the active digest fingerprint and last-send timestamp in a local state file.
  affected_files:
    - path: scripts/opencode_progress_notifier.py
      reason: New active chat inspector and Discord notifier.
    - path: scripts/tests/test_opencode_progress_notifier.py
      reason: Focused contract tests for selection, model, payload, dedupe, and privacy bounds.
    - path: docs/specs/opencode-active-progress-notifier/spec.yml
      reason: Durable contract and evidence ledger for the new recurring notifier.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/opencode-active-progress-notifier/spec.yml
    - python3 -m pytest scripts/tests/test_opencode_progress_notifier.py
    - python3 scripts/opencode_progress_notifier.py --once --dry-run --no-state-update --max-chats 5
  verification_order:
    - Spec validation before implementation.
    - Focused pytest after tests and script are present.
    - Dry-run against current local active OpenCode state.

