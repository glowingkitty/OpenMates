scenarios:
  - id: S-1
    title: Task-list changes produce deterministic Discord diffs
    given:
      - An OpenCode chat runs `todowrite` with a structured todo list.
      - The notifier has a previous task snapshot for that chat, or no prior snapshot for a first task-list notification.
    when:
      - The OpenCode tool hook calls the notifier with `--event task-list-changed`.
    then:
      - Gemini is not called.
      - Discord receives a compact diff of added, removed, and status-changed tasks when the snapshot changed.
      - Identical task snapshots do not post another Discord message.

  - id: S-5
    title: Completed assistant responses produce short summaries
    given:
      - OpenCode emits a `message.updated` event for an assistant message with a completed timestamp.
    when:
      - The OpenCode event hook calls the notifier with `--event response-completed`.
    then:
      - Gemini 3.5 Flash-Lite receives bounded latest-response evidence.
      - Discord receives the chat link plus a short summary and at most three bullets, not the full assistant response.
      - Repeated events for the same completed message are deduped.

  - id: S-2
    title: Legacy periodic progress path stays silent
    given:
      - An old cron entry or operator invokes `scripts/opencode_progress_notifier.py --once` without a specific event.
    when:
      - The notifier runs.
    then:
      - The legacy periodic path exits with `skipped_legacy_periodic_disabled` by default.
      - Gemini and Discord are not called.

  - id: S-3
    title: Hook argument construction stays bounded
    given:
      - OpenCode observes a task-list tool completion or assistant message completion event.
    when:
      - The OpenCode plugin builds notifier process arguments.
    then:
      - The task-list event receives only the session id and structured todo JSON.
      - The response-completed event receives only the session id and message id.

  - id: S-4
    title: Notification evidence remains bounded and privacy safe
    given:
      - Chat transcripts contain tool outputs, attachments, or issue signals.
    when:
      - The notifier builds event evidence and Discord payloads.
    then:
      - Reasoning, snapshots, attachment content, environment values, webhook URLs, and oversized outputs are omitted or bounded.
      - Discord receives only summaries and links, not raw transcript dumps.

