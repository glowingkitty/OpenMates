risks:
  - id: R-1
    risk: Discord noise if unchanged active chats are summarized too often.
    mitigation: Default 10-minute cadence, transcript fingerprint dedupe, and no-active silence.
  - id: R-2
    risk: Summaries could leak raw transcript or secret-like content.
    mitigation: Use bounded projections, omit reasoning/attachments, apply simple secret redaction, and post summaries instead of raw evidence.
  - id: R-3
    risk: Model name availability may differ across Google AI Studio releases.
    mitigation: Keep the model configurable only by explicit CLI/env override while defaulting to the required Gemini 3.5 Flash Lite identifier.

open_questions: []

privacy_security:
  data_classification: Repository-local developer tooling metadata and bounded OpenCode transcript projections.
  secrets_handling:
    - Do not print or persist Discord webhook URLs or Gemini API keys.
    - Resolve Gemini keys from existing environment or Vault-backed helper patterns.
    - Redact secret-like tokens before prompts and Discord payloads.
  retention:
    - Persist only summary state and fingerprints in `.opencode/progress-notifier-state.json`.
    - Do not persist raw transcripts or Gemini prompt bodies.

