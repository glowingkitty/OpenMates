    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/agent-tooling-parity.md
    - docs/specs/opencode-chat-improvement-review/spec.yml
    - docs/specs/agent-workflow-quality-parity/spec.yml
    - docs/specs/opencode-session-coordination/spec.yml
  code_patterns:
    - scripts/sessions.py exposes live presence through `status --json` and bounded transcript reads through `read_opencode_chat`.
    - .opencode/plugins/openmates-hooks.js writes passive presence heartbeats and must not launch prompts from passive observation.
    - scripts/discord_webhook.py provides stdlib Discord webhook posting helpers.
    - scripts/release_intelligence.py and scripts/audit_example_chat_quality.py show existing Gemini key resolution and generateContent calls.
    - backend/apps/ai/llm_providers/mistral_client.py shows the existing Mistral API key Vault path and chat-completions usage fields.
  tests:
    - scripts/tests/test_opencode_chat_improvement_review.py
    - scripts/tests/test_run_tests_discord_summary.py
    - scripts/tests/test_spec_workflow_validation.py

