schema_version: 2
id: opencode-active-progress-notifier
title: Active OpenCode Progress Discord Notifier
status: verified

goal: >
  Give maintainers a periodic, low-noise Discord digest of currently active
  OpenCode chats so they can stay aware of decisions, blockers, code issues, and
  agent-workflow issues without relying on each chat to self-report.

scope:
  in:
    - Inspect live OpenCode presence and durable sessions from the existing local control plane.
    - Summarize only currently active top-level chats: working, waiting for user, stopped, or failed.
    - Exclude idle completed chats and notifier-owned analysis sessions.
    - Use Mistral Small by default for LLM summary generation, with Gemini retained as an explicit comparison model.
    - Post one Discord message containing a readable plain-text top summary and one per-active-chat section.
    - Include completed/current/next task lists for every active chat, preferring exact OpenCode `todowrite` data when available and model-generated task lists otherwise.
    - Include an estimated model API cost per run and per day using a 15-minute cadence over up to 12 active hours.
    - Default the recurring cadence to 15 minutes and provide a `--once`/`--dry-run` test path.
    - Persist local notification state only to suppress duplicates and record last summaries.
  out:
    - Product APIs, SDKs, web UI, Apple UI, or customer chat data.
    - OpenCode hook side effects, passive lifecycle prompt injection, or self-reporting agent instructions.
    - Automatic edits, commits, deploys, or task continuation.
    - Posting raw transcripts, reasoning traces, credentials, environment values, webhook URLs, or full command outputs to Discord.

documentation_impact:
  generated_reference:
    status: unchanged
    reason: No generated product API, SDK, or UI reference is affected.
  user_docs:
    status: unchanged
