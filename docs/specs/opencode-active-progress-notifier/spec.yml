risks:
  - id: R-1
    risk: Discord noise if hook events fire repeatedly for unchanged task lists or duplicate completed messages.
    mitigation: Persist task snapshots and completed message ids for local dedupe.
  - id: R-2
    risk: Summaries could leak raw transcript or secret-like content.
    mitigation: Use bounded projections, omit reasoning/attachments, apply simple secret redaction, and post summaries instead of raw evidence.
  - id: R-3
    risk: Model name availability may differ across Google AI Studio releases.
    mitigation: Default to the currently priced low-cost Gemini model `gemini-3.5-flash-lite`; keep `--model` explicit but reject unsupported Gemini model names in the normal call path.

