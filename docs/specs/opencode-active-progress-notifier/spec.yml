implementation_plan:
  spec_path: docs/specs/opencode-active-progress-notifier/spec.yml
  existing_patterns:
    - scripts/sessions.py status --json and chat read projections
    - scripts/opencode_chat_improvement_review.py report, Discord, and scheduled tooling style
    - scripts/release_intelligence.py Gemini generateContent function-calling style
  architecture: >
    Reuse the existing notifier script as a hook-triggered Discord sender.
    OpenCode hook events spawn the script in detached mode for task-list changes
    and completed assistant messages. The script renders task-list changes from
    structured todos deterministically, uses Gemini 3.5 Flash-Lite only for short
    completed-response summaries, and keeps legacy periodic invocations silent by
    default.
  data_flow:
    - OpenCode `todowrite` tool completion passes session id and todo JSON to `--event task-list-changed`.
    - OpenCode completed assistant message events pass session id and message id to `--event response-completed`.
    - The notifier resolves the top-level session, builds bounded chat context only where needed, and posts one compact Discord message.
    - Persist task snapshots and completed message ids in `.opencode/progress-notifier-state.json` for dedupe.
  affected_files:
    - path: scripts/opencode_progress_notifier.py
      reason: Event-driven task-list and response-completed notifier.
    - path: scripts/tests/test_opencode_progress_notifier.py
      reason: Focused contract tests for event payloads, model use, dedupe, legacy silence, and privacy bounds.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Trigger notifier events from bounded OpenCode hook events.
    - path: scripts/tests/test_opencode_hooks_recovery.py
      reason: Hook helper tests for bounded notifier event arguments.
    - path: docs/specs/opencode-active-progress-notifier/spec.yml
      reason: Durable contract and evidence ledger for the event-driven notifier.
  verification_strategy:
