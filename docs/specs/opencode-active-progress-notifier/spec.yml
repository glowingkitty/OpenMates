scenarios:
  - id: S-1
    title: Active chats produce one Discord digest
    given:
      - The OpenCode presence view contains at least one top-level chat in working, waiting_for_user, stopped, or failed state.
    when:
      - The notifier runs with Discord delivery enabled.
    then:
      - Mistral Small receives bounded active-chat evidence by default.
      - Discord receives one readable message with a plain-text summary and one section per active chat.
      - Every chat section includes the title, OpenCode link, current summary, and a completed/current/next task list.
      - The top summary includes estimated model API cost per run and per day.

  - id: S-2
    title: No active chats stay silent
    given:
      - The OpenCode presence view has no working, waiting_for_user, stopped, or failed top-level chats.
    when:
      - The notifier runs.
    then:
      - The summary model is not called.
      - Discord is not called.
      - Local state is not updated as a sent notification.

  - id: S-3
    title: Duplicate unchanged summaries are suppressed between cadence windows
    given:
      - A previous digest was sent for the same active-chat transcript fingerprint less than 15 minutes ago.
    when:
      - The notifier runs again.
    then:
      - Discord is not called unless the operator uses a force flag.
      - The persisted state records the duplicate suppression.

  - id: S-4
    title: Notification evidence remains bounded and privacy safe
    given:
      - Active chat transcripts contain tool outputs, attachments, or issue signals.
    when:
      - The notifier builds the model prompt and Discord payload.
    then:
      - Reasoning, snapshots, attachment content, environment values, webhook URLs, and oversized outputs are omitted or bounded.
      - Discord receives only summaries and links, not raw transcript dumps.

