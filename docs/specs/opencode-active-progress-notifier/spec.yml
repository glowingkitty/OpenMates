schema_version: 2
id: opencode-active-progress-notifier
title: Event-Driven OpenCode Discord Notifier
status: verified

goal: >
  Give maintainers low-noise Discord notifications for only two OpenCode chat
  events: deterministic task-list changes and completed assistant responses with
  short Gemini Flash-Lite summaries.

scope:
  in:
    - Trigger task-list notifications from OpenCode `todowrite` hook events only.
    - Render task-list notifications deterministically from the hook-provided todo list and local previous snapshot; do not call an LLM for task-list changes.
    - Trigger completed-response notifications from OpenCode `message.updated` events when an assistant message has a completed timestamp.
    - Use Gemini 3.5 Flash-Lite only to create a short summary for completed assistant responses; do not post the full response.
    - Keep the legacy periodic `--once` path as a safe no-op by default so old cron entries do not send progress digests.
    - Persist local per-chat snapshots for task-list dedupe and completed-message dedupe.
  out:
    - Product APIs, SDKs, web UI, Apple UI, or customer chat data.
    - Periodic progress summaries, recurring cadence, or cron-driven Discord digests.
    - Self-reporting agent instructions.
    - Automatic edits, commits, deploys, or task continuation.
    - Posting raw transcripts, reasoning traces, credentials, environment values, webhook URLs, or full command outputs to Discord.

documentation_impact:
  generated_reference:
    status: unchanged
    reason: No generated product API, SDK, or UI reference is affected.
  user_docs:
    status: unchanged
    reason: The change is maintainer tooling, not user-facing documentation.
  semantic_layer:
    status: unchanged
    reason: Product behavior and semantic model contracts are unchanged.

context_discovery:
  github_issues:
    - GitHub MCP returned HTTP 401 for `get_me`.
    - "`gh issue list --search \"\\\"OpenCode progress\\\" OR \\\"agent progress\\\" OR \\\"Discord notifier\\\"\" --limit 10 --json number,title,state,url` returned no matching issues."
  docs:
    - AGENTS.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/architecture/agent-tooling-parity.md
    - docs/specs/opencode-chat-improvement-review/spec.yml
    - docs/specs/agent-workflow-quality-parity/spec.yml
    - docs/specs/opencode-session-coordination/spec.yml
  code_patterns:
    - scripts/sessions.py exposes live presence through `status --json` and bounded transcript reads through `read_opencode_chat`.
    - .opencode/plugins/openmates-hooks.js writes passive presence heartbeats and must not launch prompts from passive observation.
    - scripts/discord_webhook.py provides stdlib Discord webhook posting helpers.
    - scripts/release_intelligence.py and scripts/audit_example_chat_quality.py show existing Gemini key resolution and generateContent calls.
  tests:
    - scripts/tests/test_opencode_chat_improvement_review.py
    - scripts/tests/test_run_tests_discord_summary.py
    - scripts/tests/test_spec_workflow_validation.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - This is repository-local developer tooling with no Apple product counterpart.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Which architecture should report progress?
      answer: Use a separate inspector script rather than making chats self-report.
    - question: Which model should summarize active chat progress?
      answer: Initially use Gemini 3.5 Flash Lite, briefly compare Mistral Small, then switch back to Gemini 3.5 Flash-Lite because Gemini 3 Flash Preview lacks a cheaper current price and Mistral is not desired.
    - question: What should the Discord output contain?
      answer: One overall summary of all currently ongoing chats, highlighting important decisions and places to watch, followed by a list of all active chats with title, OpenCode link, and per-chat summary.
    - question: What cadence should the first implementation use?
      answer: Start with every 10 minutes, then revise to every 15 minutes with up to 12 active hours per day for cost estimates.
    - question: What format should be validated before cron installation?
      answer: Make the summary easier to scan with a short text summary at the top, balanced icons, clearer spacing, per-chat task lists showing completed/current/next work, grouped active/waiting/completed sections, no visible model/cost details, and no intentional ellipsis shortening for normal summaries/tasks.
    - question: How should follow-up notifications behave after the initial format was still too dense?
      answer: Show Gemini-generated overviews only the first time a chat appears, then use deterministic follow-up messages containing only task/status deltas and omit unchanged chats.
  vision_summary: >
    The notifier is an external active-chat observer. It only posts when active
    chats are new or have meaningful deterministic changes. It uses Gemini 3.5
    Flash-Lite only for first-time chat overviews, then produces short
    maintainer-oriented Discord deltas with completed tasks, current work, new
    next tasks, status changes, links, and unchanged-chat omission counts.
  approved_by_user: true

