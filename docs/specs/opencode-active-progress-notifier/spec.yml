clarification:
  rounds:
    - question: Which architecture should report progress?
      answer: Use a separate inspector script rather than making chats self-report.
    - question: Which model should summarize active chat progress?
      answer: Initially use Gemini 3.5 Flash Lite, then compare and switch the validation path to Mistral Small because Gemini cost was too high.
    - question: What should the Discord output contain?
      answer: One overall summary of all currently ongoing chats, highlighting important decisions and places to watch, followed by a list of all active chats with title, OpenCode link, and per-chat summary.
    - question: What cadence should the first implementation use?
      answer: Start with every 10 minutes, then revise to every 15 minutes with up to 12 active hours per day for cost estimates.
    - question: What format should be validated before cron installation?
      answer: Make the summary easier to scan with a short text summary at the top, fewer icons, clearer spacing, per-chat task lists showing completed/current/next work, and a pricing estimate per run and per day.
  vision_summary: >
    The notifier is an external active-chat observer. It only posts when active
    chats exist, uses Mistral Small by default for summaries, and produces a single
    maintainer-oriented Discord digest with a plain-text top summary, per-chat
    links, summaries, task status lists, and per-run/per-day cost estimate.
  approved_by_user: true

