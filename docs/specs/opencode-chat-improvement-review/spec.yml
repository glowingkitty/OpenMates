implementation_plan:
  spec_path: docs/specs/opencode-chat-improvement-review/spec.yml
  existing_patterns:
    - Extend scripts/_workflow_review_helper.py collection logic rather than adding another OpenCode database abstraction.
    - Use scripts/_opencode_utils.py for persisted read-only OpenCode dispatch with explicit model routing.
    - Reuse scripts/discord_webhook.py for confirmed Markdown attachment delivery.
    - Follow stale_code_daily.py for atomic reports, optional Discord, and idempotent user cron installation.
    - Author skills canonically under .claude/skills and regenerate .agents/skills.
  architecture: >
    A bounded read-only collector extracts the requested repository interval from
    OpenCode SQLite into a temporary local prompt. A persisted GPT-5.6 Luna plan
    session researches current repository guidance and writes a structured draft.
    The runner validates and atomically publishes latest and dated reports, then
    sends a bounded Discord notification. Cron reaches only this research path.
    A separate user-invoked implementation skill consumes and revalidates reports.
  data_flow:
    - Runner fixes the UTC interval and current subject commit, then queries OpenCode SQLite read-only.
    - Collector groups top-level and child evidence, excludes the current analyzer, and applies deterministic bounds.
    - Luna inspects the evidence and current skills, hooks, agents, instructions, tests, and official documentation where needed.
    - Runner validates the result, publishes local JSON and Markdown, and optionally posts the Markdown to Discord.
    - A maintainer later invokes the implementation skill, selects recommendations, and performs normal verified edits.
  affected_files:
    - path: scripts/_workflow_review_helper.py
      reason: Bounded transcript and subagent evidence collection.
    - path: scripts/_opencode_utils.py
      reason: Honor explicit OpenCode model routing.
    - path: scripts/opencode_chat_improvement_review.py
      reason: Daily research, report publication, Discord notification, and cron installation.
    - path: scripts/prompts/opencode-improvement-research.md
      reason: Research-only Luna analysis contract and report schema.
    - path: scripts/tests/test_opencode_chat_improvement_review.py
      reason: Collector, dispatch, reporting, notification, and cron contracts.
    - path: .claude/skills/opencode-improvement-research/SKILL.md
      reason: Canonical automatic/manual research workflow.
    - path: .claude/skills/implement-opencode-improvements/SKILL.md
      reason: Canonical user-triggered implementation workflow.
    - path: docs/architecture/infrastructure/cronjobs.md
      reason: Schedule, safety boundary, outputs, model, and manual commands.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/opencode-chat-improvement-review/spec.yml
    - python3 -m pytest scripts/tests/test_opencode_chat_improvement_review.py scripts/tests/test_workflow_review_helper.py
    - python3 scripts/sync_agent_parity.py --check
    - python3 scripts/audit_agent_tooling_parity.py
    - python3 scripts/audit_opencode_output_quality.py
    - python3 scripts/audit_opencode_automation_budget.py scripts/opencode_chat_improvement_review.py scripts/prompts/opencode-improvement-research.md scripts/_opencode_utils.py opencode.json
    - python3 scripts/opencode_chat_improvement_review.py --hours 24 --dry-run-notify
  verification_order:
    - Focused collector and runner tests
    - Agent skill parity and OpenCode automation audits
    - Real local GPT-5.6 Luna analysis with Discord dry-run
    - Spec verification and scoped dev deploy

