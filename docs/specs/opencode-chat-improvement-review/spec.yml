contracts:
  api:
    - No endpoint is added or changed; access model, authentication, rate limits, credits, and encryption boundaries are not applicable.
  collection:
    - Default interval is the previous 24 hours ending at runner start, expressed as inclusive UTC start and exclusive UTC end.
    - Repository directory filtering applies before transcript extraction.
    - Top-level and child sessions are included; child evidence carries its parent identifier only inside the local analyzer input.
    - Collection is bounded by explicit maximum sessions, messages, parts, per-field characters, and total serialized bytes.
    - The session limit is applied in SQLite before transcript rows are materialized, and only selected parent ancestry is resolved.
    - Evidence projection retains observable text and tool inputs, outputs, errors, roles, models, and outcomes while omitting reasoning, snapshots, encrypted metadata, and binary attachment content.
    - Analyzer session IDs supplied by the runner are excluded.
  reporting:
    - Local JSON is the implementation-skill input and Markdown is the review and Discord attachment artifact.
    - The latest report and dated history contain status, period, subject commit, model, source counts, recommendations, analysis session ID, and notification status.
    - Discord payload contains a compact summary and a canonical-secret-scanned Markdown attachment but no raw transcript dump, environment values, or webhook URL.
    - The analysis agent never writes files; the parent runner captures its structured final response and owns report publication.
    - Dated artifacts are written first and latest.json is the final generation completion marker with the Markdown hash.
  recommendation:
    - Each recommendation includes stable ID, priority, category, evidence references, current behavior, proposed change, target files, expected benefit, risk, research sources, and verification commands.
    - Allowed categories are skill, hook, agent, instruction, deterministic_guard, and no_change.
    - The analyzer distinguishes observed evidence from inference and abstains when evidence is insufficient.
  cron:
    - Installation is idempotent and owns one marked block in the user crontab.
    - The cron process invokes only the report-producing research runner in read-only OpenCode plan mode.
    - No cron code imports, names, or invokes the implementation skill or deployment workflow.
    - OpenCode dispatch selects the dedicated cron-research agent, which denies edit, Bash, child-agent, question, and todo tools.
  skills:
    - opencode-improvement-research is safe for scheduled use, cannot edit files, and returns structured JSON to the parent runner.
    - implement-opencode-improvements is user-invocable only and starts a normal sessions.py feature session before edits.
    - Implementation rereads current source and docs, checks report age and subject revision, and requires user selection when multiple recommendations exist.
    - Canonical skill files live under .claude/skills and are mirrored to .agents/skills.
  privacy_security:
    - Full OpenCode transcript content remains confined to local SQLite, temporary prompt files, and gitignored reports.
    - Secrets and webhook values are never intentionally copied into Discord payloads or tracked files.
    - Temporary analyzer prompts are deleted after OpenCode exits.

