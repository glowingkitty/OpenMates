contracts:
  api:
    - access_model: internal-only
      surface: scripts/tests.py and service-authenticated Directus collections
      auth: Existing Directus service token requirements remain unchanged.
      rate_limits: No new public rate limit; commands remain operator-triggered.
      credit_budget: No product credits are consumed by persistence operations; selected tests may retain their existing execution costs.
      encrypted_or_plaintext_data: Store redacted test metadata only; do not store client-side encrypted user material or decrypted product content.
  data:
    - collection: test_debug_campaigns
      purpose: Durable selected scope, lifecycle, blocker, and completion summary for one failed-test effort.
      required_fields:
        - campaign_key
        - status
        - session_id
        - source_run_keys
        - selected_test_keys
        - selected_group_keys
        - current_group_key
        - completion_policy
        - blocker
        - created_at
        - updated_at
        - completed_at
    - collection: test_debug_groups
      purpose: Durable acceptance, diagnosis, attempts, membership, evidence, and child relationships for one root cause.
      required_fields:
        - group_key
        - campaign_key
        - triage_group_id
        - parent_group_key
        - status
        - member_test_keys
        - observed_failure
        - expected_behavior
        - acceptance_criteria
        - root_cause
        - attempts
        - red_evidence
        - green_evidence
        - blocker
        - verification_command
        - selected_at_unix
        - updated_at
    - collection: test_claims
      change: Add nullable campaign and durable group keys while preserving lease lifecycle semantics.
    - collection: test_runs
      change: Reliably populate requested test keys and campaign/group references for completed runs.
  cli:
    - "`python3 scripts/tests.py campaign start --session <id> --json` creates or resumes a campaign from Directus failures."
    - "`python3 scripts/tests.py campaign status --campaign <id> --json` returns groups, attempts, evidence, blockers, and next action."
    - "`python3 scripts/tests.py campaign next --campaign <id> --lease --session <id> --json` leases the next campaign group."
    - "`python3 scripts/tests.py campaign attempt --group <id> ...` appends a structured investigation attempt."
    - "`python3 scripts/tests.py campaign block --group <id> ...` records a resumable blocker."
    - "`python3 scripts/tests.py campaign complete-group --group <id> --commit <sha>` requires all member evidence green."
    - "`python3 scripts/tests.py run --campaign <id> --group <id>` selects exact durable group members."
  privacy_security:
    - Persist sanitized summaries and artifact references only.
    - Never copy raw chat transcripts, screenshots, traces, credentials, cookies, emails, or user identifiers into campaign records.
    - Directus writes must remain idempotent and visible on failure.
    - High-risk or disputed product behavior must create a blocker and link to a dedicated approved product spec before implementation.

