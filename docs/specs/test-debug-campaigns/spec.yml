scenarios:
  - id: S-1
    title: Fix-tests creates a campaign with explicit selected scope
    given:
      - Directus current state contains failed tests `playwright::embed-diff-editing.spec.ts` and `pytest_unit::backend/tests/test_embed_diff.py::test_patch`.
      - No active campaign exists for the requesting session.
    when:
      - The workflow starts a test-debug campaign for the current failures.
    then:
      - Directus stores one active campaign with an immutable initial selected-test manifest and source run references.
      - Deterministic triage creates durable groups containing the complete matching member keys.
      - Repeating the command for the same session resumes the active campaign instead of creating a duplicate.
  - id: S-2
    title: Group acceptance is recorded before source edits
    given:
      - "`playwright::billing-settings.spec.ts` fails because credit controls and the payment iframe are not visible."
      - Existing assertions unambiguously state those expected outcomes.
    when:
      - The group is prepared for investigation.
    then:
      - The group stores the observed failure, expected behavior, and concrete acceptance criteria derived from the assertions.
      - The group stores red evidence linked to the source run and failed result.
      - Ambiguous or high-risk expected behavior produces a structured blocker instead of an inferred product change.
  - id: S-3
    title: Exact group members are verified from Directus selection
    given:
      - One group contains two Playwright specs sharing a root cause.
      - A stale local `test-results/last-run.json` also lists an unrelated failed spec.
    when:
      - The operator runs verification for the campaign group.
    then:
      - Only the two durable group member keys are selected.
      - The unrelated local-artifact failure is not selected.
      - The completed test run stores the exact requested canonical test keys and campaign/group references.
  - id: S-4
    title: Failed attempts remain available to the next agent
    given:
      - An embed-diff group has failed hypotheses for tool-count drift and temperature drift.
    when:
      - A later session resumes the campaign.
    then:
      - Both attempts, outcomes, changed files, verification runs, and latest root-cause hypothesis are returned.
      - The next action points to the latest failure rather than repeating a rejected approach.
  - id: S-5
    title: Newly exposed failure becomes a child group
    given:
      - The `account_preflight` group passes after its fix.
      - Its campaign-bound verification exposes a new `playwright::example-chats-load.spec.ts` failure.
    when:
      - The result is imported into the control plane.
    then:
      - The preflight group can become green.
      - The new failure is added as a child group with its discovery run, parent group, and scope-amendment reason.
      - The campaign remains active until the child group is green.
  - id: S-6
    title: Green evidence is required for every group member
    given:
      - A group contains two failed test keys and has an active ownership claim.
      - Only one member has passed since the group was leased.
    when:
      - The operator attempts to complete the group.
    then:
      - Completion is rejected and the missing member remains visible.
      - Completion succeeds only after both members have passing result evidence from verification after group selection.
      - The group records green run/result IDs, tested commits, and timestamps.
  - id: S-7
    title: Blocked work remains resumable
    given:
      - Three campaign groups are green.
      - A billing group requires a human decision about disabled dev payment capability.
    when:
      - The investigator records the blocker.
    then:
      - The campaign status becomes blocked rather than completed or partially successful.
      - The blocker stores the reason, question, current group, and exact next action.
      - Resuming the workflow returns that blocker before leasing unrelated work.
  - id: S-8
    title: Campaign completes after individual group proof
    given:
      - Every selected group and every discovered child group has verified all of its own members green.
      - No verification is pending and no blocker remains.
    when:
      - Campaign completion is evaluated.
    then:
      - The campaign becomes completed.
      - No additional combined selected-set run is required.
      - The completion summary identifies every group and its green evidence.

