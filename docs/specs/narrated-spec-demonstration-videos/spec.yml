schema_version: 2
id: narrated-spec-demonstration-videos
title: Narrated Demonstration Videos For OpenCode Specs
status: implementing
goal: 'Make completed OpenCode implementation work visibly understandable by requiring planned narration points, real execution
  recordings, canonical synchronized captions, and an AI-reviewed demonstration video before eligible specs or plans are considered
  complete, then publish the reviewed result to Discord when a destination is configured.

  '
scope:
  in:
  - Require every new or materially resumed Tier 2 full spec to declare a demonstration contract or an explicit non-visual
    not-applicable record before implementation.
  - Require every user-visible Tier 1 OpenCode implementation plan to declare narration bullets and produce a reviewed demonstration
    video.
  - Define narration bullets during specification or planning, but write exact narration and captions only after the implementation's
    normal tests are green.
  - Reuse real deployed Playwright recordings for browser flows and real pseudo-terminal command/output capture for CLI flows.
  - Permit a Remotion terminal reconstruction only when direct recording is impractical, the displayed input/output exactly
    matches a sanitized real transcript, and the video labels the segment as reconstructed.
  - Generate canonical timestamped captions and render them into or alongside the final video; audio narration is deferred
    from v1.
  - Review the finished video indirectly using synchronized captions, sampled frames, recording metadata, and linked acceptance
    criteria without placing the full video in model context.
  - Classify review failures as implementation, test coverage, recording, narration, composition, or environment defects and
    return to the responsible stage.
  - Retry failed demonstration review automatically at most three times before recording a structured user-input blocker.
  - Prevent spec or eligible Tier 1 plan completion until required demonstration review passes; only the approved non-visual
    not-applicable classification may bypass video production.
  - Post the reviewed video and sanitized implementation summary to Discord when a webhook is configured, while treating delivery
    failure as a retryable publication issue rather than reopening implementation.
  - Add deterministic workflow audits, fixtures, and privacy checks for the demonstration contract and completion gate.
  out:
  - User-facing OpenMates Plans product persistence, API, playback UI, or status expansion.
  - Marketing videos, release trailers, polished promotional editing, or changes to the external openmates-marketing Remotion
    workflow.
  - Text-to-speech or audio narration in v1; self-hosted Kokoro-82M may be considered after this captioned workflow is implemented
    and tested.
  - Requiring videos for Tier 0 work, non-visual Tier 1 work, or legacy completed specs that are not materially resumed.
  - Treating reconstructed UI or terminal output as automated verification evidence.
  - Publishing raw test logs, credentials, user data, private URLs, reasoning traces, or unsanitized terminal history to Discord.
context_discovery:
  github_issues:
  - GitHub MCP authentication returned 401 Bad credentials during discovery.
  - The gh CLI fallback returned no matching issue for narrated spec implementation videos or Discord demonstration evidence.
  docs:
