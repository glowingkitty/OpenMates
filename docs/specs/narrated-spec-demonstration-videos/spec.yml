implementation_plan:
  spec_path: docs/specs/narrated-spec-demonstration-videos/spec.yml
  first_slice: 'Enforce the demonstration eligibility and completion contract in fixture specs, then prove one synthetic CLI
    transcript can be captured, captioned, scanned, frame-sampled, reviewed, and represented in a manifest before integrating
    real Playwright recordings or Discord delivery.

    '
  existing_patterns:
  - scripts/spec_validate.py and scripts/spec_verify.py enforce Schema V2 structure and completion evidence.
  - scripts/run_tests.py downloads Playwright videos, screenshots, step logs, and metadata and already supports Discord multipart
    attachments.
  - frontend/apps/web_app/playwright.config.ts records every deployed Playwright run by default.
  - scripts/audit_opencode_spec_workflow.py audits OpenCode Plan Mode, canonical skills, generated mirrors, and workflow instructions.
  - frontend/packages/secret-scanner provides the canonical vendor-secret and general-PII pattern registry for scanning extracted
    text.
  - test-results is gitignored and existing Playwright recording bundles already use run IDs, commit SHAs, videos, screenshots,
    and manifest metadata.
  - The external create-video skill separates polished marketing production from product verification recordings.
  architecture: 'Add scripts/spec_demo.py as one repository-local orchestration CLI around a versioned JSON manifest in test-results/spec-demos/<spec>/<run-id>/.
    Use ffmpeg/ffprobe subprocesses for media metadata, caption composition, terminal rendering, compression, and frame extraction;
    use a Python stdlib PTY recorder for exact argv/output/timing/exit events; invoke the canonical TypeScript secret scanner
    for all extracted text; and use local Tesseract over every distinct decoded frame before creating the bounded frame bundle
    read by the active OpenCode agent. The agent records structured claim verdicts through the CLI. Discord publication reuses
    a small shared webhook helper extracted from run_tests.py. Raw test artifacts remain immutable, generated videos are deleted
    after confirmed delivery or 24 hours, and sanitized text evidence remains.

    '
  boundaries:
  - No product backend, REST API, SDK, web UI, Apple app, Directus collection, or encrypted user-data contract changes.
  - No generated video bytes or full-video path is passed to the agent or a multimodal API.
  - No external marketing Remotion workspace or E2B Remotion renderer is used for engineering evidence.
  - No shell interpolation is used for CLI capture; the PTY recorder launches an explicit argv list and records combined terminal
    events.
  - No implementation video is committed to git; only the YAML ledger stores sanitized hashes, run IDs, statuses, and references.
  data_flow:
  - A spec records `NARR-1` with purpose `Show persisted completion`, expected proof `checked item after reload`, and link
    `AC-5`; exact caption text remains empty during implementation.
  - Existing tests pass for subject commit `abc1234`; the browser adapter resolves run `30999`, target `app.dev.openmates.org`,
    deployment `abc1234`, and the matching WebM hash without copying or modifying the source bundle.
  - For CLI evidence, the PTY adapter runs argv such as `[openmates, plans, show, demo-plan, --json]`, records timestamped
    input/output events and exit code 0, strips ANSI control sequences for the sanitized transcript, and hashes both event
    and transcript artifacts.
  - The post-green caption step writes an exact segment such as `After reload, the first item remains complete.` from 12.4
    to 17.1 seconds and links it to `NARR-1`, `AC-5`, and the matching evidence interval.
  - FFmpeg renders captions over the browser video or renders terminal state events on a fixed DejaVu Sans Mono canvas, then
    ffprobe records duration, dimensions, codecs, and final SHA-256.
  - The privacy pass scans all text with the canonical secret scanner, decodes every video frame locally, skips only byte-identical
    frames, OCRs every distinct frame with Tesseract, scans OCR text, and records frame counts without retaining OCR images
    after the pass.
  - The review-bundle builder extracts default three-second frames plus scene, action, caption-boundary, and before-after
    frames. The active agent reads only those images and may request a bounded exact timestamp such as 14.8 seconds.
  - The agent records supported, contradicted, not_visible, ambiguous, or wrong_time for each claim and one defect class for
    each failure. One initial review plus three classified repair retries are allowed.
  - spec_verify accepts completion only after the current-commit privacy and review records pass, or after a valid pre-implementation
    non-visual not-applicable classification.
  - Discord publication uses `wait=true`, records the returned message and attachment identifiers without the webhook URL,
    then deletes generated MP4/WebM files after confirmed delivery. Failed delivery retries for 24 hours, then deletes video
    while retaining sanitized transcripts, captions, manifest, hashes, review result, and publication failure.
  artifact_contract:
  - Root: test-results/spec-demos/<spec-or-plan-slug>/<run-id>/ with owner-only directory and file permissions.
  - manifest.json is versioned and stores eligibility, subject commit, source evidence, narration outline, caption segments,
    artifact hashes, privacy counts, frame index, review attempts, publication state, and deletion timestamps.
  - transcript.txt, captions.srt or captions.ass, review.json, and publication.json are sanitized retained text artifacts;
    unsanitized PTY events exist only in a private temporary directory until sanitization succeeds.
  - demo.mp4 or demo.webm and extracted frame files are disposable; frames are deleted after review and video is deleted after
    confirmed Discord delivery or the 24-hour undelivered limit.
  - Browser source recordings remain governed by the existing Playwright artifact and test-recording retention rather than
    being duplicated into the spec-demo directory.
  privacy_security_impact:
  - Complete-frame OCR is local and fail-closed; a missing Tesseract binary, undecodable frame, frame-count mismatch, or scanner
    error blocks review and publication.
  - The canonical secret-scanner patterns are reused through a small Node bridge; findings expose type and location only,
    never matched values.
  - Environment values, webhook URLs, raw Discord response bodies, login/setup flows, and unsanitized terminal events never
    enter retained manifests or agent context.
  - The active OpenCode session sees sanitized captions and selected image frames only; it never receives the complete video.
  - Cleanup is idempotent and hash-aware so it cannot delete the original Playwright artifact or files outside the manifest-owned
    run directory.
  migration_rollout:
  - Add demonstration fields as optional while existing Schema V1 and already-completed Schema V2 specs remain valid.
  - Require the fields for newly approved or materially resumed Tier 2 specs after the workflow audit and validator land.
  - Apply the Tier 1 gate through planning/session instructions rather than backfilling historical inline plans.
  - Roll out in fixture mode first, then one synthetic CLI proof, then one real deployed Playwright proof, and only then enable
    completion enforcement by default.
  observability:
  - Every spec_demo command prints one redacted JSON result with manifest path, stage, status, run ID, subject commit, and
    next action.
  - Manifest attempts record stage duration, source and output hashes, frame counts, OCR counts, retry count, defect class,
    and deletion timestamps without text bodies or private values.
  - Publication records `not_configured`, `pending`, `delivered`, `failed_retryable`, or `expired_deleted`; only delivered
    includes sanitized Discord message and attachment IDs.
  - The doctor command reports missing ffmpeg, ffprobe, Tesseract, font, Node secret-scanner build, and webhook configuration
    without printing paths containing credentials or secret values.
  affected_files:
  - path: docs/contributing/guides/spec-driven-development.md
    reason: Define demonstration eligibility, narration-outline timing, post-green rendering, review, retry, and completion
      ordering.
  - path: docs/contributing/guides/planning.md
    reason: Require user-visible Tier 1 plans to declare narration bullets and expected proof.
  - path: docs/contributing/guides/agent-workflow-core.md
    reason: Add concise final demonstration and Discord evidence guidance to the active OpenCode workflow.
  - path: .claude/rules/testing.md
    reason: Define Playwright and CLI recording provenance and keep demonstration editing separate from verification evidence.
  - path: .claude/rules/session-lifecycle.md
    reason: Keep eligible work active until demonstration review passes, a valid non-visual not-applicable classification
      applies, or a structured user-input blocker exists.
