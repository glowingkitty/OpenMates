  - .claude/rules/testing.md
  - .claude/rules/privacy.md
  code_patterns:
  - scripts/spec_validate.py
  - scripts/spec_verify.py
  - scripts/spec_evidence.py
  - scripts/audit_opencode_spec_workflow.py
  - scripts/run_tests.py
  - frontend/apps/web_app/playwright.config.ts
  - .claude/skills/specify/SKILL.md
  - .claude/skills/plan-from-spec/SKILL.md
  - .claude/skills/tasks-from-spec/SKILL.md
  - .claude/skills/verify-spec/SKILL.md
  - .agents/skills/create-video/SKILL.md
  tests:
  - scripts/tests/test_spec_workflow_validation.py
  - scripts/tests/test_opencode_spec_workflow_audit.py
  - scripts/tests/test_run_tests_discord_summary.py
  current_findings:
  - Playwright currently records every deployed spec run through video mode on and preserves recordings under test-results/test-recordings
    after artifact download.
  - scripts/run_tests.py already contains multipart Discord attachment support and configured development webhook patterns
    that can be reused rather than duplicated.
  - The existing create-video skill targets external marketing production and must not become the engineering evidence source
    of truth.
  - The official hexgrad/Kokoro-82M model is an Apache-2.0 open-weight 82M parameter model suitable for later self-hosting,
    but audio is not part of this first slice.
  - The official Kokoro model card warns that kokorottsai.com is unaffiliated; this workflow must not use that site.
apple_impact:
  affected_files:
  - none
  parity_expectations:
  - This change affects repository-local OpenCode planning, verification, media evidence, and Discord reporting only.
  verification:
  - Apple not affected.
  intentional_native_differences:
  - none
clarification:
  rounds:
  - question: Which completed work should the first version require a narrated demonstration video for?
    answer: Require it for Tier 2 full specs and user-visible Tier 1 plans; allow explicit not-applicable evidence for non-visual
      work.
  - question: Should successful Discord delivery be required before work is considered complete?
    answer: The reviewed video gates completion; Discord delivery is required when configured but delivery failure is a retryable
      publication issue and does not reopen implementation.
  - question: Should v1 require captions, audio, or both?
    answer: Captions are required; audio is deferred from the first implementation.
  - question: How autonomous should the post-render mismatch loop be?
    answer: Classify the mismatch, repair the responsible stage, and retry up to three times before asking the user.
  - question: Should the user-facing OpenMates Plans product be included?
    answer: Focus on the OpenCode spec-driven development flow; discuss the Plans product expansion only after this workflow
      is implemented and tested.
  vision_summary: 'Eligible OpenCode work declares concise narration bullets before implementation, completes its normal test
    ladder, and then turns real execution evidence into a captioned demonstration video. A multimodal reviewer compares timestamped
    captions and expected proof with the rendered result, routes mismatches to the correct stage, and blocks completion until
    the review passes; Discord is the delivery destination, not the canonical evidence store.

    '
  approved_by_user: true
