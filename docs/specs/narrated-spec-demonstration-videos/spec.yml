scenarios:
- id: S-1
  title: Full spec declares what its final demonstration must prove
  given:
  - An author creates or materially resumes a Tier 2 spec for a user-visible feature.
  when:
  - The product contract is prepared for approval.
  then:
  - The spec contains ordered narration bullets linked to scenarios or acceptance criteria.
  - Each bullet states its purpose and the visual or terminal proof expected while it is presented.
  - Exact narration sentences and timestamps remain unset until final implementation evidence is green.
- id: S-2
  title: Non-visual work records why a demonstration adds no useful proof
  given:
  - A Tier 2 spec or Tier 1 plan changes only non-visual repository tooling or documentation behavior.
  when:
  - The author classifies demonstration eligibility.
  then:
  - The work may declare the demonstration not applicable with a concrete reason and verification reference.
  - The classification cannot be used for user-visible browser, native, or CLI behavior.
  - The verifier rejects an unreasoned or ineligible not-applicable declaration.
- id: S-3
  title: Browser implementation uses the real deployed Playwright recording
  given:
  - A user-visible web implementation has passed its required deployed Playwright test and visual-smoke gates.
  - The passing run produced video, screenshots, step metadata, and an exact subject commit.
  when:
  - The demonstration pipeline builds the browser segment.
  then:
  - It selects the passing recording for the approved subject commit rather than replaying a mocked or local substitute.
  - It preserves a reference to the raw run and uses editing only for trimming, highlighting, captions, and explanatory composition.
  - It does not record login, signup, verification codes, credentials, unrelated account content, or private identifiers.
- id: S-4
  title: CLI implementation shows exact real command input and output
  given:
  - A CLI requirement has passed against the required real dev API or local deterministic environment.
  when:
  - The demonstration pipeline builds the CLI segment.
  then:
  - It captures the actual pseudo-terminal input, output, timing, and exit status after sanitization.
  - If direct video capture is impractical, a Remotion reconstruction uses the exact sanitized transcript and is visibly labeled
    as reconstructed.
  - The raw transcript hash and run identifier remain linked to the rendered segment.
- id: S-5
  title: Green implementation evidence becomes a captioned demonstration
  given:
  - All normal implementation gates that apply to the work are complete; non-applicable product API, user-confirmation, and
    platform-parity gates have recorded reasons.
  - Narration bullets identify the claims and expected visible proof.
  when:
  - The demonstration renderer runs.
  then:
  - It writes exact narration text based only on verified behavior.
  - It creates canonical timestamped captions and a final video with readable synchronized captions.
  - Every factual caption claim maps to an acceptance criterion and a visible or terminal evidence interval.
  - The raw recording remains separate from the derived narrated demonstration artifact.
- id: S-6
  title: Multimodal review detects and routes a mismatch
  given:
  - A final video, timestamped captions, expected proof, raw evidence references, and subject commit are available.
  when:
  - The AI demonstration review runs.
  then:
  - It does not receive the full video file, video bytes, or a full-video model attachment.
  - It inspects frames at scene boundaries, before and after important actions, caption boundaries, and a default three-second
    periodic interval.
  - It may request additional individual frames at specific timestamps when the default review bundle leaves a claim uncertain.
  - It marks each caption claim supported, contradicted, not visible, ambiguous, or visible at the wrong time.
  - It classifies each failure as an implementation, test coverage, recording, narration, composition, or environment defect.
  - It returns to only the responsible stage and invalidates implementation evidence only for an implementation or material
    test-contract defect.
- id: S-7
  title: Failed demonstration review retries safely and remains active
  given:
  - A required demonstration review fails.
  when:
  - The OpenCode workflow continues the active implementation.
  then:
  - It records the attempt, classification, evidence, responsible stage, and next action.
  - After the initial failed review, it performs at most three classified repair-and-review retries.
  - Every retry records one approved defect class and responsible return stage.
  - After a fourth unresolved review result, comprising the initial review plus three retries, it records a structured current-task
    blocker requiring user input.
  - It does not weaken acceptance criteria, alter captions to hide a real implementation defect, or mark the work complete.
- id: S-8
  title: Reviewed demonstration is published safely to Discord
  given:
  - The required demonstration review passed and a Discord webhook is configured.
  when:
  - The publication step runs.
  then:
  - It scans the video metadata, captions, transcript, filenames, message text, and OCR from every decoded frame or an equivalently
    complete frame stream before upload.
  - It posts the video as an attachment when within configured limits or uses an approved non-public artifact link when direct
    attachment is unavailable.
  - The message identifies the spec or plan, subject commit, covered scenarios, review result, and canonical evidence location
    without exposing private data.
  - A delivery failure records publication_pending with retry details but does not change a passed implementation or demonstration
    review back to failed.
