  - path: .claude/skills/plan-from-spec/SKILL.md
    reason: Select capture sources and review requirements without prematurely writing exact narration.
  - path: .claude/skills/tasks-from-spec/SKILL.md
    reason: Place capture, captions, review, repair, and publication after normal implementation verification.
