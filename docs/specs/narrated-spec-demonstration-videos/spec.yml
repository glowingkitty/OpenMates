    manifest_hash: sha256:77112cecabe60f089c4a4ad5d357c58b4fe95549c82e42fc02eaf6f22d7d67dc
    privacy_status: passed
    review_status: passed
    review_run_id: review-cli-7cf67ad
    review_attempts: 1
