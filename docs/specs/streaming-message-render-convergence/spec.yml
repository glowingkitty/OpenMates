schema_version: 2
id: streaming-message-render-convergence
title: Streaming Message Render Convergence
status: implementing

goal: >
  Render assistant responses progressively with the same semantic document and
  embed presentation used after completion, while bounding parsing, document
  updates, embed resolution, component mounting, and heavy map hydration so a
  continuous stream does not create token-level UI work.

scope:
  in:
    - Authenticated and anonymous web chat assistant-message rendering.
    - One canonical display compiler for streaming snapshots and completed messages.
    - Progressive text plus inline, small, large, individual, grouped, source-quote, map, and calendar-capable embed presentation.
    - A per-message scheduler that coalesces chunks before parsing and rendering.
    - Stable ProseMirror node and Svelte NodeView identity across stream growth and completion.
    - Safe parsed-content caching and event-driven embed-ref hydration.
    - Bounded parsing, diffing, resolver, component-mount, and Leaflet hydration work.
    - Desktop and mobile deployed verification followed by explicit user confirmation.
    - Mandatory handoff to the existing Apple chat-streaming parity spec after web confirmation.
  out:
    - Changing backend model output, WebSocket event shapes, encryption, persistence, billing, or provider behavior.
    - Replacing TipTap/ProseMirror or introducing a general incremental Markdown parser.
    - Parsing read-only assistant messages with composer/write-mode semantics.
    - Rendering syntactically incomplete internal JSON or result-view fences as final previews.
    - Eagerly hydrating every hidden carousel slide or offscreen map.
    - Implementing Apple parity before the web contract is deployed, visually reviewed, and user-confirmed.

