implementation_plan:
  spec_path: docs/specs/streaming-message-render-convergence/spec.yml
  existing_patterns:
    - frontend/packages/ui/src/message_parsing/streamingDocDiff.ts
    - frontend/packages/ui/src/components/embeds/embedPreviewHydration.ts
    - frontend/packages/ui/src/services/embedRefIndex.ts
  architecture: >
    Raw assistant Markdown remains authoritative. ChatHistory owns a per-message
    bounded scheduler and invokes one canonical display compiler for both streaming
    and final snapshots. ReadOnlyMessage receives canonical TipTap JSON and only
    applies structural document updates. Embed NodeViews update presentation props
    without remounting when semantic identity is unchanged; result views mount from
    complete descriptors and retain deferred heavy hydration.
  data_flow:
    - ActiveChat accumulates the latest raw assistant Markdown through the unchanged WebSocket lifecycle.
    - ChatHistory records the latest per-message snapshot and schedules a bounded canonical compile.
    - The compiler applies final read/display semantics to every complete construct and marks only incomplete suffix state as provisional.
    - ReadOnlyMessage converts the canonical JSON through the editor schema and applies an incremental ProseMirror transaction.
    - Embed and result-view components react to stable attrs and embed-ref index versions without message-level reparsing.
    - Completion cancels scheduled work, compiles the latest raw Markdown synchronously, and applies no semantic transition when the same snapshot was already rendered.
  affected_files:
    - path: frontend/packages/ui/src/components/ChatHistory.svelte
      reason: Canonical compile ownership and per-message scheduling.
    - path: frontend/packages/ui/src/components/ReadOnlyMessage.svelte
      reason: Pure canonical-document rendering and bounded fallback behavior.
    - path: frontend/packages/ui/src/message_parsing/parse_message.ts
      reason: Explicit canonical display semantics and provisional suffix contract.
    - path: frontend/packages/ui/src/message_parsing/streamingRenderScheduler.ts
      reason: Pure per-message leading/trailing cadence, revision, completion, and cancellation contract.
    - path: frontend/packages/ui/src/message_parsing/streamingDocDiff.ts
      reason: Structural equality/diff instrumentation and safe fallback accounting.
    - path: frontend/packages/ui/src/components/enter_message/extensions/EmbedPreviewLargeNode.ts
      reason: Stable semantic identity across carousel metadata changes.
    - path: frontend/packages/ui/src/components/enter_message/extensions/embed_renderers/EmbedsMapViewRenderer.ts
      reason: Avoid equivalent-ref remounts and support in-place prop updates when needed.
    - path: frontend/packages/ui/src/components/embeds/EmbedsMapView.svelte
      reason: Cancellable single-shot idle/visibility hydration and authoritative content identity.
    - path: frontend/packages/ui/src/utils/contentCache.ts
      reason: Collision-safe immutable final-content caching or removal from the canonical chat path.
  verification_strategy:
    - Write and execute every listed Vitest and deployed Playwright red test before production source changes.
    - Prove semantic convergence and scheduler bounds with deterministic fake-time tests.
    - Prove mounted identity and map hydration counts with component instrumentation that contains no private content.
    - Deploy once focused unit checks pass, then run exact-commit Playwright, performance, and reviewed visual smoke.
    - Obtain user confirmation before recording the mandatory Apple handoff.
  verification_order:
    - REST/API, CLI, and SDK gates are not applicable because no external or shared protocol changes.
    - Focused frontend Vitest red and green phases.
    - Exact-commit deployed web Playwright red and green phases.
    - Laptop and mobile reviewed visual smoke.
    - User confirmation of deployed web behavior.
    - Apple parity spec handoff as the immediate next phase.
  rollout:
    - No data migration, backfill, feature flag, API rollout, or persisted-document rewrite is required.
    - Deploy the web implementation to dev only after focused Vitest green evidence.
    - Use exact-commit Playwright and visual-smoke evidence before asking for user confirmation.
  observability:
    - Development and test builds expose sanitized per-message counters for chunks, scheduled flushes, compile/apply durations, full-replacement fallbacks, NodeView mounts, resolver calls, and Leaflet initializations.
    - Production logging records only bounded counts, durations, and sanitized failure classes; it never records message text, embed refs, decrypted content, or share keys.
  risks:
    - Replacing write-mode streaming compilation may expose malformed trailing Markdown unless provisional suffix handling is explicit.
    - Updating Svelte NodeView props in place must not retain stale fullscreen or carousel state when semantic identity truly changes.
    - Performance thresholds require repository-pinned Chromium and pipeline-owned marks to avoid unrelated browser work.
  open_questions: []
  material_plan_approval_required: false

