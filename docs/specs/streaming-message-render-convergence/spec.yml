decisions:
  - id: D-1
    status: active
    decision: Use one upstream canonical assistant display compiler for both streaming and completed snapshots.
    reason: >
      Separate write-mode and read-mode compilation changes document topology at
      completion and prevents inline and large preview nodes from appearing during streaming.
    decided_at: "2026-08-05T10:55:56Z"
  - id: D-2
    status: active
    decision: Coalesce raw per-message chunks before compilation instead of parsing every incoming token chunk.
    reason: >
      This bounds parser and DOM work while preserving one parser owner and one
      semantic contract. A general incremental Markdown parser adds disproportionate complexity.
    decided_at: "2026-08-05T10:55:56Z"
  - id: D-3
    status: active
    decision: Treat streaming phase as presentation metadata, not as a different parser mode.
    reason: >
      Syntactically complete prefixes must use final read/display semantics.
      Only the incomplete trailing construct may be provisional or omitted.
    decided_at: "2026-08-05T10:55:56Z"
  - id: D-4
    status: active
    decision: Preserve NodeView identity by semantic embed identity rather than carousel position or other changing presentation attributes.
    reason: >
      Group growth changes index and total metadata but should not decrypt, resolve,
      or remount previews that are already visible.
    decided_at: "2026-08-05T10:55:56Z"
  - id: D-5
    status: active
    decision: Mount map/calendar-capable result views after their descriptor closes and defer expensive hydration.
    reason: >
      This provides progressive, semantically convergent rendering while retaining
      existing intersection/idle and unresolved-ref loading safeguards.
    decided_at: "2026-08-05T10:55:56Z"
  - id: D-6
    status: active
    decision: Complete and confirm web behavior before resuming Apple parity as the next phase.
    reason: The user explicitly selected a web-first sequence with mandatory Apple follow-up.
    decided_at: "2026-08-05T10:55:56Z"

attempts:
