contracts:
  api:
    - route: Existing authenticated and anonymous chat WebSocket/message-sync surfaces only
      access_model: first-party client surface only
      auth: Existing session, approved device auth, or existing anonymous-chat identity; unchanged by this work.
      rate_limits: Existing chat and WebSocket limits apply; rendering introduces no endpoint or request.
      credit_budget: Existing inference and skill costs apply; client rendering spends no credits and triggers no provider enrichment.
      encryption_boundary: Client-side encrypted messages and embeds retain their current storage and client-only decryption boundaries.
      change: none
  data:
    - Raw accumulated assistant Markdown remains the transport and persistence source of truth.
    - Canonical display documents are derived, non-authoritative presentation state.
    - Streaming and final compilation use the same display transforms for every syntactically complete construct.
    - Provisional state is restricted to the incomplete trailing construct and cannot alter completed-prefix semantics.
    - Stable semantic identity is embedId or embedRef for previews and deterministic descriptor identity for result views.
    - Parsed-content cache entries use complete semantic-key equality, immutable document values, a capacity of 100 entries, a five-minute TTL, and access-order LRU eviction.
  ui_states:
    - Initial empty stream.
    - Progressive prose.
    - Incomplete trailing Markdown or internal fence.
    - Resolved and unresolved inline, small, large, individual, and grouped embeds.
    - Growing carousel with stable current selection.
    - Result view with partial entries, calendar availability, deferred map hydration, and unavailable refs.
    - Final synchronous convergence.
    - Error fallback that preserves message text without crashing the message editor.
    - Cancelled, superseded, errored, navigated-away, and destroyed stream lifecycles.
  privacy_security:
    - No new telemetry may include raw private message Markdown, decrypted embed content, readable embed refs, or share fragment keys.
    - Performance counters may record only durations, counts, node types, and sanitized failure classes.
    - Rendering performs no new storage writes, provider calls, or decrypted-content uploads.

