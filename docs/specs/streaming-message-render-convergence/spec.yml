apple_impact:
  affected_files:
    - none in the web-first implementation slice
    - docs/specs/apple-chat-streaming-parity/spec.yml after web user confirmation
    - Native source and tests discovered and owned by the existing Apple parity spec
  parity_expectations:
    - Web remains the rendered product source of truth for progressive assistant-message and embed behavior.
    - The next implementation phase after web user confirmation must resume docs/specs/apple-chat-streaming-parity/spec.yml.
    - Apple must adopt equivalent canonical streaming/final render convergence and bounded update behavior while all native tasks remain exclusively owned by the Apple spec.
  verification:
    - Record a one-way upstream_web_handoff in docs/specs/apple-chat-streaming-parity/spec.yml with this spec ID, confirmed web subject commit, acceptance evidence IDs, and user-confirmation timestamp.
    - Resume the Apple spec and let it select or create its own next actionable native parity task.
    - Run Apple verification only from the Apple parity spec after the required web gates pass.
  intentional_native_differences:
    - Apple may use its native ChatHistoryRenderDocument and SwiftUI update model instead of TipTap/ProseMirror, but no visible semantic difference is approved.

clarification:
  rounds:
    - question: Should a map/calendar result view mount during streaming once its descriptor is complete, or remain a placeholder until message completion?
      answer: >
        Mount the same semantic result-view node once the complete descriptor
        arrives. Show lightweight loading placeholders while refs resolve and
        defer expensive map hydration through visibility and idle scheduling.
    - question: Does the web-first scope require Apple parity as the immediate next phase after web behavior is confirmed?
      answer: Yes. Focus on web first, then make Apple parity the mandatory next step.
  vision_summary: >
    Streaming and completed assistant messages use one canonical display compiler
    and converge to the same semantic document. Work is coalesced at a bounded
    cadence, stable previews stay mounted, map/calendar views mount from complete
    descriptors with deferred heavy hydration, and confirmed web behavior hands
    directly to the existing Apple parity work.
  approved_by_user: true

