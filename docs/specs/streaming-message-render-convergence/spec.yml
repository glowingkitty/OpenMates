scenarios:
  - id: S-1
    title: Complete constructs render identically before and after completion
    given:
      - An assistant response is streaming Markdown into one message.
      - The response includes prose, an inline embed link, a small app-skill embed, a large preview, and a source quote.
    when:
      - Each Markdown construct becomes syntactically complete while more response text is still pending.
    then:
      - The construct renders within the bounded update interval using final display semantics.
      - Completing the message does not change its semantic node type, embed identity, styling variant, or interaction behavior.
      - Only a syntactically incomplete trailing construct may remain text, be omitted, or show a provisional placeholder.

  - id: S-2
    title: Continuous fast chunks cannot starve progressive rendering
    given:
      - Chunks arrive every 30 ms for at least two seconds.
      - The assistant message remains visible and streaming throughout that interval.
    when:
      - The per-message render scheduler receives each newer raw snapshot.
    then:
      - Under fake scheduler time, the first non-empty snapshot flushes immediately and no later than one 80 ms cadence window.
      - While newer revisions remain pending, the interval between flushes is at most 80 ms under fake scheduler time.
      - Completion cancels pending work and performs at most one final document application, only when the final raw revision differs from the rendered revision.

  - id: S-3
    title: Growing individual and grouped previews preserve mounted work
    given:
      - A streaming response has already rendered one preview.
      - Later complete refs extend an adjacent group or large-preview carousel.
    when:
      - The canonical document adds the new refs and updates group presentation metadata.
    then:
      - Existing previews preserve semantic identity and mounted component state.
      - Existing embed resolution, decryption, image loading, and fullscreen behavior are not restarted solely because group count or position changed.
      - Hidden carousel slides remain bounded by the existing hydration overscan policy.

  - id: S-4
    title: Map and calendar-capable results render progressively without eager heavy work
    given:
      - A streaming response closes a valid embeds-results-view descriptor before the message completes.
      - Some referenced entries are resolved and others are still loading.
    when:
      - The canonical compiler emits the deterministic result-view node.
    then:
      - The same result-view node used by the completed message mounts during streaming.
      - Resolved rows and lightweight unresolved placeholders render immediately.
      - Calendar presentation becomes available from resolved event data.
      - Leaflet imports, map creation, and tile work remain visibility/idle-gated and initialize at most once per mounted result-view instance with stable normalized descriptor/ref identity.

  - id: S-5
    title: Finalization converges without stale cache or full-message churn
    given:
      - A long streaming response shares its first 200 characters with earlier snapshots or another message.
      - Embed ref-index entries may arrive after the Markdown ref is visible.
    when:
      - The final snapshot is compiled and embed index versions advance.
    then:
      - Cache lookup verifies the complete semantic key, so shared prefixes or hash collisions cannot return another snapshot or message document.
      - The final canonical document equals the latest streaming canonical document for the same complete Markdown.
      - Embed components hydrate from ref-index updates without reparsing or replacing the whole message when document semantics are unchanged.

  - id: S-6
    title: A large mixed response stays within explicit performance bounds
    given:
      - A 10,000-character response streams at 20-35 chunks per second.
      - It contains ten previews, a growing carousel, and one result view.
    when:
      - The response streams and completes on the deployed web app.
    then:
      - Canonical compile/render flushes do not exceed 13 per second, plus one initial and one final flush.
      - The repository-pinned Playwright Chromium revision records one warm-up and three measured samples on the Linux x64 self-hosted E2E runner using named pipeline-owned performance marks.
      - The median measured parser-plus-document-update p95 stays below 32 ms and no individual pipeline measure exceeds 50 ms; reruns are allowed only for browser crash, runner loss, or exact-commit deployment mismatch.
      - Rendering performs no IndexedDB writes, provider calls, or work proportional to the full chat history per chunk.

  - id: S-7
    title: Confirmed web behavior hands directly to Apple parity
    given:
      - Unit, deployed Playwright, performance, and visual-smoke gates pass for web.
      - The user confirms the deployed laptop and mobile behavior.
    when:
      - The web implementation phase closes.
    then:
      - docs/specs/apple-chat-streaming-parity/spec.yml records a one-way handoff containing this spec ID, confirmed web subject commit, acceptance evidence, and confirmation timestamp.
      - The Apple spec resumes and exclusively owns selection or creation of its next native parity task.
      - No unrelated web feature phase is inserted before the Apple parity handoff.

  - id: S-8
    title: Authenticated and anonymous web chat share the convergence contract
    given:
      - One authenticated chat and one anonymous chat receive equivalent controlled streaming responses.
    when:
      - Each response renders complete prose and embed constructs and then completes.
    then:
      - Both paths use the canonical display compiler and bounded scheduler.
      - Both paths preserve semantic convergence, scheduler cleanup, and deferred embed hydration.
      - Existing anonymous encryption, local persistence, and supported-embed constraints remain unchanged.

  - id: S-9
    title: Interrupted or malformed streams cannot update stale messages
    given:
      - A stream has pending scheduled work or an incomplete/malformed trailing descriptor.
    when:
      - The user navigates away, the message is removed, a newer revision supersedes it, the stream errors, or the renderer is destroyed.
    then:
      - Message-ID and monotonic-revision guards prevent stale callbacks from mutating another or unmounted message.
      - Pending timers, idle callbacks, and async result-view loads are cancelled or ignored by generation guards.
      - Valid completed-prefix text and embeds remain visible through a safe fallback.
      - A later valid snapshot can recover without recreating the entire chat history.

