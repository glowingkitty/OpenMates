    - docs/specs/apple-chat-streaming-parity/spec.yml
  code_patterns:
    - frontend/packages/ui/src/components/ChatHistory.svelte currently compiles streaming messages with write mode and completed messages with read mode.
    - frontend/packages/ui/src/components/ReadOnlyMessage.svelte currently contains a second parser path, a cleanup-cancelled streaming debounce, incremental ProseMirror updates, and full-replacement fallbacks.
    - frontend/packages/ui/src/message_parsing/parse_message.ts applies inline links, source quotes, assistant large-preview promotion, and final grouping only in read mode.
    - frontend/packages/ui/src/message_parsing/streamingDocDiff.ts preserves unchanged ProseMirror nodes through targeted ReplaceSteps.
    - frontend/packages/ui/src/components/enter_message/extensions/Embed.ts has stable server embed IDs and incremental grouped-item handling.
    - frontend/packages/ui/src/components/enter_message/extensions/EmbedPreviewLargeNode.ts currently remounts its Svelte component whenever presentation attributes change.
    - frontend/packages/ui/src/components/enter_message/extensions/embed_renderers/EmbedsMapViewRenderer.ts currently remounts the result view on every accepted update.
    - frontend/packages/ui/src/components/embeds/embedPreviewHydration.ts bounds carousel hydration to the active slide and overscan.
    - frontend/packages/ui/src/components/embeds/EmbedsMapView.svelte already defers Leaflet hydration through visibility and idle scheduling and retries unresolved entries on embed-ref index changes.
    - frontend/packages/ui/src/utils/contentCache.ts currently truncates cache keys to 200 characters and can collide for long messages with a shared prefix.
  tests:
