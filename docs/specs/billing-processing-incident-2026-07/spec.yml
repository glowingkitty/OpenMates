  - id: A-1
    text: ADMIN_NOTIFY_EMAIL is the correct recipient for server-admin billing error notifications.
    category: operations
    required_before: implementation
    status: confirmed
    evidence:
      - source: production task-worker environment
        summary: ADMIN_NOTIFY_EMAIL is configured in production environment.

contracts:
  api:
    - route: none
      access_model: internal-only
      auth: not_applicable
      rate_limits: not_applicable
      credit_or_budget_limits: not_applicable
      encryption_boundary: Existing encrypted invoice storage is preserved; no public route changes.
  data:
    - Directus invoice rows are created only for Stripe orders missing Directus records.
    - Directus-present rows missing Invoice Ninja records are report-only until an Invoice-Ninja-only backfill exists.
    - Stripe invoice issue/due dates are resolved from Stripe latest charge creation time, then PaymentIntent creation time, before falling back to task time.
    - Repaired encrypted PDFs rotate AES key, nonce, and encrypted S3 object-key metadata together, leaving the old encrypted object referenced until Directus update succeeds.
    - Locked Invoice Ninja paid-row repair creates complete replacement invoice/payment/bank-transaction rows before archiving old active rows.
    - Old Invoice Ninja row archival stops on first delete failure so a complete replacement remains available for manual cleanup.
  privacy_security:
    - Backfill does not send invoice PDFs or customer emails.
    - Admin error notifications include order/provider/error context only and must not include decrypted user email, PDF bytes, payment secrets, or raw Vault values.

