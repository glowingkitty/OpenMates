scenarios:
  - id: S-1
    title: Production worker uses production billing services
    given:
      - A production Stripe payment succeeds and queues invoice processing.
    when:
      - The task-worker processes the invoice task.
    then:
      - The worker uses production Stripe credentials.
      - The worker uses the production Invoice Ninja API key.
      - The worker writes invoice files to the production invoice bucket.
      - The worker can read Vault secrets.
  - id: S-2
    title: Bank transfer accounting records sync to Invoice Ninja
    given:
      - A bank transfer order has completed and a Directus invoice exists.
    when:
      - Invoice Ninja accounting sync runs.
    then:
      - The transaction maps to the Revolut Business bank integration.
      - Unknown processors still fail closed.
  - id: S-3
    title: Billing errors alert admins
    given:
      - Invoice generation, payment lookup, S3 upload, Directus invoice creation, email delivery, or Invoice Ninja sync fails.
    when:
      - The invoice-processing task handles the error.
    then:
      - The error is logged.
      - A server-admin notification email is sent with a sanitized order/provider/error summary.
  - id: S-4
    title: Backfill never emails users
    given:
      - Historical direct-Stripe or bank-transfer accounting records are missing.
    when:
      - An operator runs the backfill flow.
    then:
      - User-facing invoice emails are not sent.
      - Only safe internal records are created or reported for a dedicated backfill path.

