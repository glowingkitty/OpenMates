schema_version: 2
id: billing-processing-incident-2026-07
title: Billing Processing Incident July 2026
status: implementing

goal: >
  Stop production billing invoice processing from silently failing, restore the
  worker environment, and backfill internal accounting records without sending
  confusing invoice emails to users.

scope:
  in:
    - Emergency production worker hotfix for the invoice-processing Celery queue.
    - Invoice Ninja bank-transfer bank-account mapping for completed bank transfers.
    - Admin email notification whenever billing invoice or accounting processing fails.
    - Dry-run reconciliation for Stripe, Directus invoices, and Invoice Ninja records.
    - No-email backfill for missing internal accounting records.
    - Original Stripe payment-date repair for the 2026-07-30 backfilled invoices.
  out:
    - Sending historical invoice PDFs to users during backfill.
    - Replaying Stripe or bank-transfer payments.
    - Changing public billing APIs, CLI, SDK, web billing UX, or Apple billing UX.
    - Customer-visible refund policy changes.

context_discovery:
  github_issues:
    - not_checked_emergency_prod_hotfix: User approved immediate incident response in chat before tracker creation.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/user-guide/billing/invoices-and-refunds.md
    - docs/specs/cli-signup-billing-provisioning/spec.yml
  code_patterns:
    - backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
    - backend/core/api/app/services/payment/stripe_service.py
    - backend/core/api/app/services/invoiceninja/invoiceninja.py
    - backend/scripts/audit_backfill_missing_stripe_invoices.py
    - backend/core/docker-compose.selfhost.yml
  tests:
    - backend/tests/test_invoice_ninja_bank_integrations.py
    - backend/tests/test_invoice_reconciliation_script.py
    - backend/tests/test_billing_admin_notifications.py
    - backend/tests/test_billing_worker_compose.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - No Apple code path changes; this incident affects backend worker execution and internal accounting reconciliation only.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should backfilled invoices be emailed to users?
      answer: No. Backfill must update internal accounting data only and must not send invoice PDFs to users.
    - question: Should billing processing errors notify the server admin?
      answer: Yes. Any billing processing error must send an admin notification so failures are not silent.
  vision_summary: >
    Production billing must use production Stripe, production Invoice Ninja, and production invoice storage. Historical backfill is internal-only and no-email, and invoice records/PDFs/accounting surfaces must preserve the original provider payment date. Any future billing processing error must notify the server admin in addition to being logged.
  approved_by_user: true

implementation_state:
  subject_commit: 3381f58f5a7bc01aab875b6a5d425135017653c7+working-tree-new-s3-object-repair

approvals:
  product_contract:
    status: approved
    approved_at: "2026-07-30T17:30:00Z"
    reason: User explicitly approved the urgent plan with no-user-email backfill and admin billing-error notification corrections.
  implementation_plan:
    status: approved
    approved_at: "2026-07-30T17:30:00Z"
    reason: User approved executing the discussed hotfix and permanent dev-branch plan.

decisions:
  - id: D-1
    status: active
    decision: Backfill direct-Stripe gaps with the existing invoice task only when both Directus and Invoice Ninja are missing.
    reason: Replaying the full task when Directus or Invoice Ninja already has the order can create duplicates.
    decided_at: "2026-07-30T17:30:00Z"
  - id: D-2
    status: active
    decision: Backfills run with send_email=false by default.
    reason: Users already paid successfully; sending historical invoice PDFs could confuse them.
    decided_at: "2026-07-30T17:30:00Z"
  - id: D-3
    status: active
    decision: Bank-transfer Invoice Ninja transactions map to the Revolut Business integration, not Revolut Business Merchant.
    reason: Prod Invoice Ninja exposes both names; SEPA bank transfers should reconcile to the bank account, not the card merchant integration.
    decided_at: "2026-07-30T17:30:00Z"
  - id: D-4
    status: active
    decision: Directus-missing rows that already exist in Invoice Ninja are report-only until a Directus-only backfill exists.
    reason: Replaying the full invoice task after Invoice Ninja exists can duplicate external accounting records.
    decided_at: "2026-07-30T19:35:00Z"
  - id: D-5
    status: active
    decision: Stripe PaymentIntents without a unique current Directus user mapping are not backfilled as user invoices.
    reason: Encrypted PDF and Directus invoice creation require a verified user profile, vault key, and account ID.
    decided_at: "2026-07-30T19:35:00Z"
  - id: D-6
    status: active
    decision: Historical Stripe backfills use Stripe latest_charge.created, then PaymentIntent.created, as the invoice issue/due date.
    reason: The 2026-07-30 backfill initially used task execution time, which made Directus invoice dates, PDFs, filenames, and Invoice Ninja rows appear on the repair date instead of the payment date.
    decided_at: "2026-07-30T20:40:20Z"
  - id: D-7
    status: active
    decision: Locked paid Invoice Ninja rows are repaired by creating and verifying complete replacement rows before archiving old active invoice/payment/bank-transaction rows through the API.
    reason: Invoice Ninja rejects date updates for paid invoices with a locked-invoice 422 response; replacement creation must be proven before old active accounting rows are archived.
    decided_at: "2026-07-30T20:40:20Z"
  - id: D-8
    status: active
    decision: Repaired invoice PDFs always use fresh AES-GCM key/nonce metadata and a new encrypted S3 object key.
    reason: AES-GCM nonces must not be reused with the same key for different PDF plaintexts, and Directus update failure must leave the old encrypted invoice object decryptable.
    decided_at: "2026-07-30T21:12:50Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Start the prod Compose-managed task-worker.
    outcome: failed_as_expected
    recorded_at: "2026-07-30T17:34:00Z"
    notes: Prod Compose file was older and the worker lacked /vault-data, so Vault secrets were unavailable.
  - id: ATTEMPT-2
    task_id: TASK-1
    approach: Start a scoped manual hotfix worker with production env and Vault/config/log mounts.
    outcome: succeeded
    recorded_at: "2026-07-30T17:37:00Z"
    notes: Worker logs showed production Invoice Ninja, Stripe Production True, and openmates-invoices bucket.
  - id: ATTEMPT-3
    task_id: TASK-5
    approach: Recreate prod task-worker from the rebuilt image and source Compose worker command.
    outcome: blocked
    recorded_at: "2026-07-30T19:02:00Z"
    notes: The image lacked celeryuser/gosu and then lacked generated locale JSON required by production invoice PDF rendering.
  - id: ATTEMPT-4
    task_id: TASK-5
    approach: Patch the API image packaging to include celeryuser/gosu and generated locale JSON, then retry only safe no-email Stripe backfills.
    outcome: succeeded
    recorded_at: "2026-07-30T19:35:00Z"
    notes: Eight mapped direct-Stripe records were backfilled without user emails; four Stripe records and thirteen bank-transfer records remain report-only or blocked.
  - id: ATTEMPT-5
    task_id: TASK-6
    approach: Update locked paid Invoice Ninja invoices in place during original-date repair.
    outcome: failed_as_expected
    recorded_at: "2026-07-30T20:10:00Z"
    notes: Invoice Ninja rejected paid invoice date updates with 422 locked-invoice errors, while Directus and S3 date/PDF metadata were repairable.
  - id: ATTEMPT-6
    task_id: TASK-6
    approach: Delete/recreate active Invoice Ninja invoice, payment, and bank-transaction rows, then regenerate PDFs and Directus metadata from Stripe payment timestamps.
    outcome: succeeded
    recorded_at: "2026-07-30T20:40:20Z"
    notes: All eight 2026-07-30 backfilled Stripe invoices were repaired to their original Stripe payment dates; direct PostgreSQL verification confirmed Directus persisted the corrected dates.
  - id: ATTEMPT-7
    task_id: TASK-6
    approach: Run focused code review on the committed original-date repair diff and add deterministic safety guards for the findings.
    outcome: succeeded
    recorded_at: "2026-07-30T21:12:50Z"
    notes: Review found delete-before-replacement and AES-GCM nonce reuse risks; follow-up code now creates/verifies replacement rows before archiving old active rows, rotates PDF encryption metadata, and covers the safety behavior with tests.
  - id: ATTEMPT-8
    task_id: TASK-6
    approach: Re-review the safety hardening and address transactional S3/Directus failure risk.
    outcome: succeeded
    recorded_at: "2026-07-30T21:21:44Z"
    notes: Repair mode now uploads corrected PDFs to a new S3 object key and updates Directus to the new key/key/nonce together, so failed Directus updates leave the old encrypted invoice metadata and object intact.
  - id: ATTEMPT-9
    task_id: TASK-6
    approach: Re-review new-S3-object hardening and address old-row archival failure semantics.
    outcome: succeeded
    recorded_at: "2026-07-30T21:27:04Z"
    notes: Old Invoice Ninja row archival now stops on first delete failure and keeps the verified replacement set; explicit PaymentIntent retries skip S3/Directus rewrites when Directus already has the original payment date.

handoff:
  current_task_id: TASK-6
  next_action: Deploy the new-S3-object repair hardening and rerun reconciliation dry-runs.
  command: python3 scripts/spec_verify.py docs/specs/billing-processing-incident-2026-07/spec.yml
  expected_outcome: Required completed evidence passes; follow-up accounting gaps remain explicitly recorded.
  blocker: null
  last_verified_commit: 3381f58f5a7bc01aab875b6a5d425135017653c7+working-tree-new-s3-object-repair

scenarios:
  - id: S-1
    title: Production worker uses production billing services
    given:
      - A production Stripe payment succeeds and queues invoice processing.
    when:
      - The task-worker processes the invoice task.
    then:
      - The worker uses production Stripe credentials.
      - The worker uses the production Invoice Ninja API key.
      - The worker writes invoice files to the production invoice bucket.
      - The worker can read Vault secrets.
  - id: S-2
    title: Bank transfer accounting records sync to Invoice Ninja
    given:
      - A bank transfer order has completed and a Directus invoice exists.
    when:
      - Invoice Ninja accounting sync runs.
    then:
      - The transaction maps to the Revolut Business bank integration.
      - Unknown processors still fail closed.
  - id: S-3
    title: Billing errors alert admins
    given:
      - Invoice generation, payment lookup, S3 upload, Directus invoice creation, email delivery, or Invoice Ninja sync fails.
    when:
      - The invoice-processing task handles the error.
    then:
      - The error is logged.
      - A server-admin notification email is sent with a sanitized order/provider/error summary.
  - id: S-4
    title: Backfill never emails users
    given:
      - Historical direct-Stripe or bank-transfer accounting records are missing.
    when:
      - An operator runs the backfill flow.
    then:
      - User-facing invoice emails are not sent.
      - Only safe internal records are created or reported for a dedicated backfill path.
  - id: S-5
    title: Backfilled Stripe invoices preserve original payment dates
    given:
      - A historical Stripe PaymentIntent is backfilled after its original payment date.
    when:
      - The invoice task or repair tooling creates or repairs Directus, PDF, S3 filename, and Invoice Ninja surfaces.
    then:
      - The Stripe charge/payment timestamp is used as the invoice issue and due date.
      - The generated PDF and stored filename use that original date.
      - Repaired PDF encryption metadata uses a fresh AES-GCM key, nonce, and S3 object key.
      - Locked paid Invoice Ninja old rows are archived only after complete replacement rows are created.

