implementation_plan:
  spec_path: docs/specs/billing-processing-incident-2026-07/spec.yml
  existing_patterns:
    - backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
    - backend/core/api/app/tasks/email_tasks/error_digest_task.py
    - backend/scripts/audit_backfill_missing_stripe_invoices.py
  architecture: >
    Keep payment processing behavior unchanged. Add admin notification to the
    billing task error paths, extend Invoice Ninja bank integration mapping, and
    make reconciliation/backfill fail closed to avoid duplicate records or user
    invoice emails.
  data_flow:
    - Payment webhook grants credits and queues invoice processing.
    - Invoice task creates encrypted invoice/PDF records and attempts Invoice Ninja sync.
    - Any billing error logs and sends a sanitized admin notification.
    - Backfill script audits Stripe, Directus, and Invoice Ninja before dispatching no-email tasks.
  affected_files:
    - path: backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
      reason: Notify admins on billing processing errors and keep backfill no-email behavior.
    - path: backend/core/api/templates/email/billing-processing-error.mjml
      reason: Sanitized server-admin billing error email template.
    - path: backend/core/api/app/services/email_template.py
      reason: Treat billing processing error alerts as transactional system notifications.
    - path: backend/core/api/app/services/invoiceninja/invoiceninja.py
      reason: Add bank_transfer bank integration mapping.
    - path: backend/scripts/audit_backfill_missing_stripe_invoices.py
      reason: Safe reconciliation/backfill tooling.
    - path: backend/core/docker-compose.selfhost.yml
      reason: Permanent worker Vault/config/log mount and production env definition.
    - path: frontend/packages/openmates-cli/templates/core/docker-compose.selfhost.yml
      reason: Keep the packaged self-host task-worker definition aligned with backend Compose.
  verification_strategy:
    - /home/superdev/projects/OpenMates/.venv/bin/ruff check backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py backend/core/api/app/services/email_template.py backend/core/api/app/services/invoiceninja/invoiceninja.py backend/scripts/audit_backfill_missing_stripe_invoices.py backend/tests/test_invoice_ninja_bank_integrations.py backend/tests/test_invoice_reconciliation_script.py backend/tests/test_billing_admin_notifications.py backend/tests/test_billing_worker_compose.py
    - /home/superdev/projects/OpenMates/.venv/bin/python3 -m pytest -q backend/tests/test_invoice_reconciliation_script.py backend/tests/test_invoice_ninja_bank_integrations.py backend/tests/test_billing_admin_notifications.py backend/tests/test_billing_worker_compose.py
