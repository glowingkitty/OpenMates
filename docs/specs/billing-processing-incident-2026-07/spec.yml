schema_version: 2
id: billing-processing-incident-2026-07
title: Billing Processing Incident July 2026
status: implementing

goal: >
  Stop production billing invoice processing from silently failing, restore the
  worker environment, and backfill internal accounting records without sending
  confusing invoice emails to users.

scope:
  in:
    - Emergency production worker hotfix for the invoice-processing Celery queue.
    - Invoice Ninja bank-transfer bank-account mapping for completed bank transfers.
    - Admin email notification whenever billing invoice or accounting processing fails.
    - Dry-run reconciliation for Stripe, Directus invoices, and Invoice Ninja records.
    - No-email backfill for missing internal accounting records.
  out:
    - Sending historical invoice PDFs to users during backfill.
    - Replaying Stripe or bank-transfer payments.
    - Changing public billing APIs, CLI, SDK, web billing UX, or Apple billing UX.
    - Customer-visible refund policy changes.

context_discovery:
  github_issues:
    - not_checked_emergency_prod_hotfix: User approved immediate incident response in chat before tracker creation.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/user-guide/billing/invoices-and-refunds.md
    - docs/specs/cli-signup-billing-provisioning/spec.yml
  code_patterns:
    - backend/core/api/app/tasks/email_tasks/purchase_confirmation_email_task.py
    - backend/core/api/app/services/invoiceninja/invoiceninja.py
    - backend/scripts/audit_backfill_missing_stripe_invoices.py
    - backend/core/docker-compose.selfhost.yml
  tests:
    - backend/tests/test_invoice_ninja_bank_integrations.py
    - backend/tests/test_invoice_reconciliation_script.py
    - backend/tests/test_billing_admin_notifications.py
    - backend/tests/test_billing_worker_compose.py

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - No Apple code path changes; this incident affects backend worker execution and internal accounting reconciliation only.
  verification:
    - Apple not affected.
  intentional_native_differences:
    - none

clarification:
  rounds:
    - question: Should backfilled invoices be emailed to users?
      answer: No. Backfill must update internal accounting data only and must not send invoice PDFs to users.
    - question: Should billing processing errors notify the server admin?
      answer: Yes. Any billing processing error must send an admin notification so failures are not silent.
  vision_summary: >
    Production billing must use production Stripe, production Invoice Ninja, and production invoice storage. Historical backfill is internal-only and no-email. Any future billing processing error must notify the server admin in addition to being logged.
  approved_by_user: true

