decisions:
  - id: D-1
    status: active
    decision: Backfill direct-Stripe gaps with the existing invoice task only when both Directus and Invoice Ninja are missing.
    reason: Replaying the full task when Directus or Invoice Ninja already has the order can create duplicates.
    decided_at: "2026-07-30T17:30:00Z"
  - id: D-2
    status: active
    decision: Backfills run with send_email=false by default.
    reason: Users already paid successfully; sending historical invoice PDFs could confuse them.
    decided_at: "2026-07-30T17:30:00Z"
  - id: D-3
    status: active
    decision: Bank-transfer Invoice Ninja transactions map to the Revolut Business integration, not Revolut Business Merchant.
    reason: Prod Invoice Ninja exposes both names; SEPA bank transfers should reconcile to the bank account, not the card merchant integration.
    decided_at: "2026-07-30T17:30:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-1
    approach: Start the prod Compose-managed task-worker.
    outcome: failed_as_expected
    recorded_at: "2026-07-30T17:34:00Z"
    notes: Prod Compose file was older and the worker lacked /vault-data, so Vault secrets were unavailable.
  - id: ATTEMPT-2
    task_id: TASK-1
    approach: Start a scoped manual hotfix worker with production env and Vault/config/log mounts.
    outcome: succeeded
    recorded_at: "2026-07-30T17:37:00Z"
    notes: Worker logs showed production Invoice Ninja, Stripe Production True, and openmates-invoices bucket.

