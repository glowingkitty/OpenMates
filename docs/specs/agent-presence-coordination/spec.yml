contracts:
  api:
    access_model: local developer tooling only
    changed_endpoints: none
    auth: none; no network endpoint is added
    rate_limits: event writes are debounced and locally bounded
    credit_budget: no product credits or provider calls are consumed by presence processing
    encryption_boundary: no OpenMates encrypted or decrypted product data is handled
  data:
    - Presence is ephemeral and stored separately from .claude/sessions.json.
    - Every update is keyed by OpenCode session ID and turn or request identity where available.
    - One plugin source orders callback receipt locally; multiple writers use a source generation plus local monotonic sequence and reconcile from authoritative session status before enforcement rather than inventing a global order.
    - Presence stores only structured identifiers, explicit child role, state, timestamps, normalized repository-relative paths, and references to durable repository sessions, specs, or tasks.
    - Free-form OpenCode titles, prompts, todos, question text, and permission metadata are not copied into presence storage.
    - Busy entries expire to unknown after at most two minutes without a heartbeat.
    - A bounded timer renews heartbeat while the runtime remains busy or a tool call is open; startup, reconnect, and pre-expiry paths reconcile authoritative session status.
    - Completed, stopped, failed, and closed records have bounded retention defined before implementation.
    - Store corruption or unavailability is visible in status diagnostics and cannot corrupt durable session metadata.
  state_machine:
    execution: [busy, retrying, idle, stopped, error, closed, unknown]
    attention: [none, optional, required_question, required_permission, required_both]
    turn: [none, streaming, completed, aborted, failed]
    precedence:
      - Pending user requests are sets keyed by request ID; resolving one cannot clear another.
      - Simultaneous pending question and permission sets derive required_both until one set is empty.
      - Supported open question or permission requests override optional attention until matching resolution or session closure.
      - Aborted or failed turn outcomes are not overwritten by a later idle status.
      - Turn outcomes are keyed by assistant message or turn ID so late events from an older turn cannot overwrite a resumed turn.
      - A new user message starts a new turn and clears only prior terminal turn display state, not unrelated pending requests.
      - Retry, completion, abort, deletion, missing-session errors, and reconnect reconciliation have explicit reducer transitions before enforcement.
      - Expiry changes stale busy or retrying execution to unknown without inventing a completed outcome.
  collision_policy:
    - Concurrent reads are always allowed.
    - Broad area overlap is warning-only.
    - Historical modified_files entries are informational only.
    - A live exact-file edit lease blocks another writer.
    - A changed-since-read hash blocks until reread.
    - A duplicate live spec/task implementation claim blocks the second explicit claim; claims record owner, role, expiry, renewal, release, and stale takeover.
    - Parent and child activity does not conflict with itself only when an explicit role and ownership contract permits it.
    - Presence failures do not weaken existing edit-lease, stale-read, Docker, or deploy locks.
  delivery:
    - Presence updates are silent and never append a user-visible message.
    - Unrelated chats receive no injected coordination context.
    - sessions.py start and status may print relevant coordination normally.
    - A completed read may append a concise warning to that tool's output; this enters model context but does not create a chat message.
    - A hard pre-edit conflict is delivered by the existing thrown guard error.
    - Relevant context is limited to structured spec/task IDs, role, phase, conflicting repository-relative path, age, and navigable session identifier.
    - The first release does not use unconditional experimental.chat.system.transform injection.
  privacy_security:
    - Do not persist prompt or response bodies, titles, todo text, reasoning, question text, permission patterns, tool input, tool output, logs, patches, environment variables, or credentials.
    - Use repository-relative paths in persisted records when possible.
    - Presence files use owner-only permissions, reject symlink/traversal paths, and disclose records only within the same canonical project/workspace.
    - Live-verifier output and evidence contain only synthetic test titles, IDs, states, timestamps, and fixture paths.
    - Test sessions are deleted after successful or failed verification.

tests:
  - id: T-NODE-EVENTS
    type: unit
    file: scripts/tests/test_opencode_presence_events.mjs
    command: node --test scripts/tests/test_opencode_presence_events.mjs
    covers: [AC-1, AC-2, AC-3, AC-4, AC-6]
    assertions:
      - busy and debounced deltas produce streaming live presence
      - assistant completion plus idle produces completed and optional attention
      - installed permission events and capability-probed request fixtures survive unrelated status events until matching resolution
      - unsupported question capability is reported without inferring required attention from idle
      - simultaneous question and permission requests derive required_both and resolve independently
      - abort plus idle remains aborted and stopped
      - older events for a prior turn cannot overwrite a newer turn
      - parentID groups a child while explicit role metadata controls ownership
    red_phase:
      required: true
      expected: fail
