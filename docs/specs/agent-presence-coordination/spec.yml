decisions:
  - id: D-1
    status: active
    decision: Maintain presence out of band and never send unsolicited coordination messages into chats.
    reason: Messages interrupt reasoning, mutate conversation history, may trigger inference, and can create feedback loops.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-2
    status: active
    decision: Keep ephemeral presence separate from durable sessions.json and worktree reconciliation records.
    reason: High-frequency runtime state has different lifetime, contention, and recovery requirements than durable work ownership and deploy history.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-3
    status: active
    decision: Track execution, user attention, and last-turn outcome independently.
    reason: A single active flag cannot distinguish streaming, completed-idle, explicitly waiting, aborted, failed, and stale processes.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-4
    status: active
    decision: Surface coordination only when it is relevant to the current task, path, or protected resource.
    reason: A full session list increases context cost and trains agents to stop for harmless parallel work.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-5
    status: active
    decision: Keep read overlap and broad area overlap non-blocking; reserve hard blocks for duplicate task ownership, live exact-file writes, stale reads, and existing protected resources.
    reason: Parallel reading is safe, and historical modified_files entries are advisory rather than ownership.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-6
    status: active
    decision: Treat read-only subagents as child activity under the parent work unit.
    reason: Independent writable identities for diagnostic subagents exaggerate concurrency and create unnecessary sessions and worktrees.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-7
    status: active
    decision: Roll out observe-only, then warnings, then narrowly scoped enforcement.
    reason: Real event ordering and false-positive rates must be measured before new guards can block work.
    decided_at: "2026-08-04T00:00:00Z"
  - id: D-8
    status: active
    decision: Do not use unconditional experimental.chat.system.transform injection in the first implementation.
    reason: It may repeat during tool loops, invalidate prompt caches, and add context when no collision exists.
    decided_at: "2026-08-04T00:00:00Z"

attempts:
  - id: ATTEMPT-1
    task_id: TASK-3
    approach: Inject every active session after each assistant turn.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: It cannot affect the completed turn and risks unsolicited turns, repeated context, and irrelevant interruption.
  - id: ATTEMPT-2
    task_id: TASK-1
    approach: Derive live activity from worktree status and 48-hour reconciliation age.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: The sampled reconciliation marked 115 merged worktrees as recent-active.
  - id: ATTEMPT-3
    task_id: TASK-1
    approach: Persist every streaming delta synchronously through a Python subprocess.
    outcome: rejected
    recorded_at: "2026-08-04T00:00:00Z"
    reason: Token-level events are too frequent; streaming heartbeat writes must be debounced and non-blocking.

handoff:
  current_task_id: TASK-1
  next_action: Confirm the live OpenCode event ordering and storage concurrency assumptions before implementation planning.
  command: node --test scripts/tests/test_opencode_presence_events.mjs
  expected_outcome: The red test records the expected official event sequences and fails because no presence reducer exists.
  blocker: null
  last_verified_commit: 0340d8ed83abeaeef6d3503337d609ebe25f33ce

scenarios:
  - id: S-1
    title: Streaming chat appears as live work
    given:
      - A top-level OpenCode chat belongs to the OpenMates project.
      - Its repository session and worktree may or may not have been created yet.
    when:
      - OpenCode emits session.status busy and assistant streaming events.
    then:
      - Presence reports execution busy and last-turn streaming within two seconds.
      - A debounced heartbeat keeps the entry live during a long inference or tool call.
      - No user or assistant message body is persisted.
  - id: S-2
    title: Completed response waits without appearing busy
    given:
      - An assistant response is streaming.
    when:
      - The assistant message records time.completed and OpenCode emits session.status idle.
    then:
      - Presence reports execution idle, last-turn completed, and user attention optional.
      - The chat is visible in an idle-after-response view but excluded from currently-working and collision-owner counts.
  - id: S-3
    title: Explicit user response is required
    given:
      - A chat is processing a turn.
    when:
      - The installed runtime emits permission.updated, or a capability-probed
        question event or authoritative pending-request query reports an open request.
    then:
      - Presence keeps an allowlisted set of pending request IDs and derives
        required_question or required_permission without exposing request content.
      - A reply or rejection clears only the matching request.
      - An unrelated session.status event cannot erase a still-open required-user request.
      - An unsupported request capability is reported as unsupported rather than inferred from idle state.
  - id: S-4
    title: User stops processing
    given:
      - A chat is busy or retrying.
    when:
      - OpenCode reports MessageAbortedError or the verified installed-runtime equivalent.
    then:
      - Presence records stopped and last-turn aborted.
      - A following idle event does not relabel the aborted turn as completed.
      - The stopped chat is not treated as a live collision owner.
  - id: S-5
    title: Crashed or disconnected process expires
    given:
      - Presence says a chat is busy.
      - No terminal lifecycle event arrives because the process or server exits unexpectedly.
    when:
      - Its heartbeat exceeds the configured live timeout.
    then:
      - The entry becomes unknown rather than busy within two minutes.
      - Exact-file edit leases retain their existing independent stale timeout.
      - Presence failure cannot corrupt sessions.json or worktree metadata.
  - id: S-6
    title: Parent and diagnostic subagent form one work unit
    given:
      - A top-level chat launches a child session with parentID.
      - OpenMates records an explicit child role of read_only, reviewer, or writable.
    when:
      - Parent and child emit lifecycle and tool events.
    then:
      - Status shows child activity under the parent task.
      - A child explicitly marked read_only or reviewer does not create a repository session, worktree, or false parent collision.
      - A writable child is separate only when explicitly assigned disjoint ownership.
      - Missing role metadata never infers read-only behavior from parentID alone.
  - id: S-7
    title: Unrelated work receives no coordination noise
    given:
      - Chat A is actively editing scripts/sessions.py.
      - Chat B is working on an unrelated frontend task.
    when:
      - Chat B has not requested scripts/sessions.py.
    then:
      - Chat B receives no collision context and no new chat message.
  - id: S-8
    title: Relevant collision is surfaced without interruption
    given:
      - Chat A holds a live edit lease for scripts/sessions.py.
      - Chat B is active in the same repository.
    when:
      - Chat B reads or attempts to edit scripts/sessions.py.
    then:
      - A completed read may append concise conflict metadata to that read tool's output, which enters model context but does not create a chat message.
      - A conflicting edit is rejected through the existing pre-tool hard-guard error channel.
      - A live exact-file write or stale read remains blocked by deterministic existing guards.
  - id: S-9
    title: Duplicate task is caught before duplicate implementation
    given:
      - Chat A owns TASK-4 in one executable spec.
    when:
      - Chat B claims the same spec and task while Chat A is live.
    then:
      - An explicit atomic task-claim command rejects Chat B's duplicate implementation claim while Chat A's renewable claim is live.
      - Read-only review of TASK-4 remains allowed when explicitly declared as child or reviewer work.
      - Claim expiry, renewal, release, and stale takeover are deterministic.
  - id: S-10
    title: Status reflects current OpenCode reality
    given:
      - The repository contains merged worktrees, idle chats, active chats, and a chat waiting on a question.
    when:
      - An agent runs sessions.py status.
    then:
      - The default view separates streaming, retrying, waiting-for-user, and idle-after-response sections.
      - Merged worktrees without live OpenCode presence are not reported as currently working.
      - --all includes durable and historical records, --conflicts shows relevant active conflicts, and --session shows one identity chain.
  - id: S-11
    title: Real concurrent OpenCode smoke proves the workflow
    given:
      - A dedicated OpenCode server runs with a temporary XDG data directory,
        temporary Git fixture, project plugin, deterministic local streaming
        fixture provider, synthetic title prefix, and random ports.
    when:
      - The verifier uses real OpenCode APIs to create at least two top-level
        sessions and one explicit child, drives deterministic streamed, delayed,
        completed, resumed, permission, tool, and aborted turns, and exercises a
        controlled collision through actual runtime tool-hook dispatch.
    then:
      - Observed presence transitions match the runtime events within bounded time.
      - Deterministic parent, status, resume, message-delta, permission-capability,
        abort, tool-hook dispatch, collision, and cleanup behavior passes.
      - Optional external-model canaries are recorded separately and cannot substitute for the isolated deterministic runtime gate.
      - The second session sees only the relevant collision through a supported hook output or error channel.
      - The first session receives no injected coordination message or resumed turn.
      - Only sessions created by the run are removed, and startup scavenging cleans abandoned synthetic sessions from earlier runs.

