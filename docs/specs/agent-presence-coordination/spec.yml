schema_version: 2
id: agent-presence-coordination
title: Real-Time Agent Presence and Collision Coordination
status: draft

goal: >
  Give parallel OpenCode chats an accurate, privacy-minimal view of which work is
  streaming, retrying, waiting for required user input, idle after a completed
  response, stopped, failed, or closed; surface only relevant task and file
  collisions at natural workflow boundaries; and prove the behavior with
  deterministic tests plus real concurrent OpenCode sessions.

scope:
  in:
    - Subscribe the OpenMates OpenCode plugin to lifecycle events exposed by the
      installed unversioned plugin Event contract, with capability detection for
      optional newer question and permission event families.
    - Maintain ephemeral presence separately from durable sessions.json and
      worktree reconciliation metadata.
    - Represent execution state, user-attention state, and last-turn outcome as
      separate fields so idle, completed, stopped, and waiting states are not
      conflated.
    - Associate top-level OpenCode chats, explicitly classified child roles,
      repository sessions, worktrees, task keys, and path intent without storing
      message bodies, reasoning, free-form titles or todos, or tool output.
    - Make sessions.py status show genuinely current work by default and expose
      explicit all, conflict, and single-session views.
    - Record exact write intent immediately before an edit and use existing edit
      leases and stale-read checks as the hard exact-file safety boundary.
    - Surface concise conflict-only context at session start, relevant file reads,
      edits, task claims, and deploy preparation without sending unsolicited chat
      messages or starting new assistant turns.
    - Roll out passive observation before warnings and warnings before any new
      blocking behavior.
    - Add deterministic event-sequence, concurrent-store, collision-policy,
      privacy, performance-budget, and failure-containment tests.
    - Add an on-demand live verifier that uses actual OpenCode sessions and the
      installed project plugin to prove busy, streaming heartbeat, completed-idle,
      resumed-user-turn, stopped, parent-child, and parallel collision behavior.
    - Run the isolated OpenCode server against a deterministic local streaming
      fixture provider so prompt, tool, permission, delay, completion, resume,
      and abort sequences do not depend on an external model.
  out:
    - Sending coordination messages into running chats when another chat changes
      state.
    - Injecting a full active-session list after every assistant turn or every
      model/tool loop.
    - Persisting user prompts, assistant responses, reasoning, tool arguments,
      tool output, credentials, logs, or source patches in presence storage.
    - Treating broad area overlap, prior file touches, or concurrent reads as
      exclusive ownership.
    - Replacing worktrees, edit leases, stale-read checks, Docker locks, deploy
      locks, or worktree reconciliation.
    - Reopening or changing the verified stale-worktree deletion policy in
      docs/specs/agent-worktree-deploy/spec.yml.
    - Adding a public, developer, first-party, or internal OpenMates product API.
    - Shipping a user-facing web or Apple UI.

context_discovery:
  github_issues:
    - GitHub MCP authentication returned 401 Bad credentials on 2026-08-04, so
      duplicate issue discovery could not be completed through GitHub.
  docs:
    - AGENTS.md
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/concurrent-sessions.md
    - docs/architecture/agent-tooling-parity.md
    - docs/specs/agent-worktree-deploy/spec.yml
  code_patterns:
    - .opencode/plugins/openmates-hooks.js
    - scripts/sessions.py
    - scripts/start-opencode-server.sh
    - scripts/_opencode_utils.py
  tests:
    - scripts/tests/test_opencode_hooks_contract.mjs
    - scripts/tests/test_opencode_worktree_guards.mjs
    - scripts/tests/test_sessions_edit_leases.py
    - scripts/tests/test_sessions_stale_read.py
    - scripts/tests/test_sessions_worktree_lifecycle.py
  official_contracts:
    - Installed OpenCode CLI version 1.17.20.
    - Installed @opencode-ai/plugin version 1.14.25 exposes a general event hook,
      chat.message, tool.execute.before, tool.execute.after, and shell.env, and
      imports Event from the unversioned @opencode-ai/sdk package.
    - The installed unversioned Event union exposes session.status busy, idle,
      and retry; session and message lifecycle events; permission.updated and
      permission.replied; todo.updated; session.error; and deprecated session.idle.
    - The installed unversioned plugin Event union does not expose question
      events even though the separate V2 SDK types define them; required-question
      tracking therefore needs capability detection or authoritative reconciliation.
    - Assistant messages expose time.completed and typed errors including
      MessageAbortedError; sessions expose parentID, but parentID alone does not
      identify a child's read/write role.
  local_evidence:
    - A four-hour sample contained 61 recent chats, including 46 subagents, and
      30 repository sessions, but only 9 repository sessions were bound to their
      OpenCode chat at the sampled point.
    - Eight top-level chats had OpenCode activity in one 15-minute sample while
      only five repository sessions reported activity in the same interval.
    - Reconciliation classified 226 worktrees as recent-active even though 115
      were already marked merged, so worktree age is not a live-presence signal.
    - Twenty-eight of 114 distinct recently modified paths were touched by more
      than one session, demonstrating the need for earlier task/path coordination.
    - Existing OpenCode hooks enforce exact edit leases and stale-read checks but
      do not subscribe to lifecycle events or maintain runtime presence.

apple_impact:
  affected_files: [none]
  parity_expectations:
    - This is local developer tooling with no Apple product counterpart.
  verification:
    - Apple build and parity verification are not required unless implementation unexpectedly changes Apple source.
  intentional_native_differences: [none]

clarification:
  rounds:
    - question: Should coordination changes send new messages into running chats?
      answer: No. Presence updates must be silent and must not interrupt or resume a chat.
    - question: Which chat states need to be distinguished?
      answer: Actual streaming work, completed responses, explicit waiting for a user response, stopped processing, retries, failures, and closed sessions.
    - question: Should collision information be injected after every assistant turn?
      answer: Evaluate it, but prefer conflict-only information at natural boundaries because unconditional turn injection is noisy and risky.
    - question: Must the setup be tested through actual OpenCode sessions?
      answer: Yes. Deterministic unit tests alone are insufficient; the completed setup needs real concurrent OpenCode runtime proof.
  vision_summary: >
    OpenCode lifecycle hooks update an out-of-band presence registry without
    messaging active chats. Agents receive concise, relevant coordination only
    when starting or resuming work, reading or editing a colliding path, claiming
    the same task, or preparing a deploy. Exact-file safety remains deterministic,
    and a real multi-session OpenCode smoke must prove the final behavior.
  approved_by_user: false

