    question: Which storage implementation provides the lowest reliable multi-process overhead on this host?
    owner: implementation
    resolution_gate: TASK-1
  - id: OQ-2
    question: What exact event sequence does OpenCode 1.17.20 emit for user interrupt and for explicit question or permission waits?
    owner: implementation
    resolution_gate: TASK-1
  - id: OQ-3
    question: What bounded retention should apply to idle, stopped, failed, and closed presence entries after live observation?
    owner: implementation
    resolution_gate: TASK-4
  - id: OQ-4
    question: Does conflict-only tool-boundary context provide enough early warning, or is one compact next-user-turn summary needed after observation?
    owner: user
    resolution_gate: TASK-6
