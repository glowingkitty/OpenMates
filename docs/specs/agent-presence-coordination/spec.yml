risks:
  - id: R-1
    severity: high
    risk: Incorrect event ordering could mark an aborted or waiting chat as completed.
    mitigation: Pure reducer tests, sequence ordering, passive observation, and live runtime proof precede enforcement.
  - id: R-2
    severity: high
    risk: Presence writes could slow streaming or tool execution.
    mitigation: Debounce deltas, avoid synchronous per-delta subprocesses, bound queues, and test slow-store behavior.
  - id: R-3
    severity: high
    risk: False collision blocks could reduce parallel throughput.
    mitigation: Observe-only and warning phases precede blocks; only duplicate task claims and existing exact-file safety boundaries block.
  - id: R-4
    severity: medium
    risk: Runtime storage could leak private conversation or tool data.
    mitigation: Allowlisted schema, privacy tests, synthetic live evidence, and separate ephemeral retention.
  - id: R-5
    severity: medium
    risk: Plugin or server crashes could leave busy records stuck.
    mitigation: Heartbeat expiry changes stale live entries to unknown within two minutes.
  - id: R-6
    severity: medium
    risk: OpenCode upgrades could change event payloads or ordering.
    mitigation: Version-aware event-contract tests and the live verifier run after upgrades before enforcement remains enabled.

