implementation_plan:
  spec_path: docs/specs/embeds-map-view/spec.yml
  existing_patterns:
    - Fenced embed parsing in frontend/packages/ui/src/message_parsing/embedParsing.ts.
    - Group rendering in frontend/packages/ui/src/components/enter_message/extensions/embed_renderers/GroupRenderer.ts.
    - Ref resolution and IndexedDB-backed embed loading in frontend/packages/ui/src/services/embedStore.ts.
    - List/map fullscreen UX in frontend/packages/ui/src/components/embeds/maps/MapsSearchEmbedFullscreen.svelte.
    - Shared Leaflet rendering in frontend/packages/ui/src/components/embeds/EmbedLeafletMap.svelte.
    - Real example-chat creation from shared CLI chats in scripts/create-example-chat-from-share.mjs.
  architecture: >
    Add a lightweight message parser node and renderer for `embeds_map_view` that
    references existing embeds by ref, resolves direct and source-backed entries
    client-side, and renders a bounded responsive list/map UI. Backend work is
    limited to AI instructions, output guards, and cost-safety tests; no new public
    endpoint, provider wrapper, persisted embed type, or Directus schema is added.
  data_flow:
    - App skills create normal parent and child embeds through existing encrypted embed flows.
    - The assistant emits a text fenced block containing refs only.
    - The frontend parser converts the fenced block into a message node with title, direct refs, source refs, and highlight refs.
    - The renderer resolves refs through local decrypted/indexed embed metadata, then hydrates visible entries plus bounded overscan.
    - Filters, marker labels, route summaries, and highlight state are derived from resolved embed content.
    - Example-chat workflow extracts real shared CLI chats and commits sanitized hardcoded example data.
  affected_files:
    - path: frontend/packages/ui/src/message_parsing/embedParsing.ts
      reason: Parse and validate `embeds_map_view` fenced blocks.
    - path: frontend/packages/ui/src/message_parsing/types.ts
      reason: Add typed node attributes for map-view refs and highlights.
    - path: frontend/packages/ui/src/components/enter_message/extensions/embed_renderers/GroupRenderer.ts
      reason: Route parsed map-view nodes to the renderer.
    - path: frontend/packages/ui/src/components/embeds/EmbedsMapView.svelte
      reason: New responsive list/map message renderer.
    - path: frontend/packages/ui/src/components/embeds/EmbedLeafletMap.svelte
      reason: Support multiple markers/routes, selected state, and callbacks needed by grouped map views.
    - path: frontend/packages/ui/src/services/embedStore.ts
      reason: Resolve source refs and visible child refs without eager all-child hydration.
    - path: backend/apps/ai/tasks/async_skill_continuation.py
      reason: Teach the assistant when and how to emit compact map-view syntax.
    - path: backend/apps/ai/processing/main_processor.py
      reason: Add map-view hints to synchronous app-skill tool results.
    - path: backend/apps/ai/tasks/stream_consumer.py
      reason: Guard or normalize malformed map-view blocks before client rendering.
    - path: backend/apps/ai/utils/embeds_map_view.py
      reason: Shared map-view syntax, detection, normalization, and deterministic repair helpers.
    - path: backend/tests/test_embeds_map_view_contract.py
      reason: Red/green contract tests for AI instructions, guards, and no paid enrichment.
    - path: frontend/apps/web_app/tests/embeds-map-view.spec.ts
      reason: Deployed web rendering and cost-safety E2E coverage.
    - path: frontend/apps/web_app/tests/embeds-map-view-examples.spec.ts
      reason: Deployed example-chat rendering coverage.
  verification_strategy:
    - python3 scripts/spec_validate.py docs/specs/embeds-map-view/spec.yml
    - python3 scripts/spec_verify.py docs/specs/embeds-map-view/spec.yml --phase red
    - python3 -m pytest backend/tests/test_embeds_map_view_contract.py
    - python3 scripts/tests.py run --suite vitest
    - Real OpenMates CLI inference against https://api.dev.openmates.org with recorded chat IDs.
    - python3 scripts/audit_sdk_cli_parity.py if CLI or SDK command surface changes.
    - python3 scripts/tests.py run --spec embeds-map-view.spec.ts after deploy.
    - python3 scripts/tests.py run --spec embeds-map-view-examples.spec.ts after deploy.
    - python3 scripts/apple_remote.py status and build-ios/test-ios after user confirmation, unless Apple is proven unaffected or unavailable.
  verification_order:
    - Product contract approval before implementation.
    - Red parser/render/AI contract tests before feature code.
    - Direct REST/API/WebSocket classification first; no new endpoint is expected, so evidence must state existing first-party chat surfaces, auth, rate limits, credit budget, and encryption boundaries.
    - Real CLI inference against the dev API second, proving assistant output and guard behavior with real auth/test-account state.
    - npm SDK and pip SDK parity third only if a programmatic SDK surface changes; otherwise record not applicable with reason.
    - GitHub Actions CI/daily-test reproduction only after local REST/API, CLI, and SDK applicability are resolved.
    - Web Playwright fourth, after deploy to dev.
    - User confirmation fifth for deployed visual/example behavior.
    - Apple remote status plus build/test last when a native counterpart is confirmed.

