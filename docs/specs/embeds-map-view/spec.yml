clarification:
  rounds:
    - question: Should this be a new persisted embed type or a message-level presentation block?
      answer: >
        It is a message-level presentation block named `embeds_map_view`, not a new
        persisted embed type or a fullscreen-only pattern.
    - question: What compact syntax should the assistant emit for curated results?
      answer: >
        Use a fenced block with `title` and `embeds`, where `embeds` is a comma-separated
        list of readable embed refs such as `ai-founders-meetup-7f3a91`.
    - question: How should full app-skill result sets and selected highlights be represented?
      answer: >
        Use `sources` for parent app-skill embed refs and `highlight` for child refs
        that should be visually emphasized and sorted first.
    - question: Should filters be assistant-authored or derived by the frontend?
      answer: >
        Filters are derived by the frontend from resolved embed content. The assistant
        should only emit `title`, `embeds`, `sources`, and `highlight`.
    - question: Should the map view trigger extra provider lookups for richer data?
      answer: >
        No. The map view may use existing embed data, local decrypt/IndexedDB work,
        and normal OpenStreetMap tile requests, but it must not automatically spend
        extra app-skill/provider credits or call enrichment endpoints.
    - question: Should map-view generation remain opt-in only?
      answer: >
        No. When an app skill returns geo-capable results, include the map-specific
        instruction and recommend a map-view block by default. Omit it only when a
        map clearly does not fit the request, such as explicit no-map, text-only,
        or list-only wording, or when resolved content exposes no usable spatial data.
  vision_summary: >
    Users should receive a compact map/list block for geo-capable app-skill
    results by default, even when they did not explicitly say "map", unless their
    request makes the spatial overview inappropriate. The block references
    existing embeds by ref, can point at full app-skill result sources with
    highlighted children, derives filters and travel route lines client-side, and
    remains bounded and cost-safe even when a source contains many child embeds.
  approved_by_user: true

