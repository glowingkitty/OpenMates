scenarios:
  - id: S-1
    title: Assistant emits a curated map view for selected event embeds
    given:
      - Alice asks for Berlin AI events this week.
      - The assistant has already created or received event child embeds with readable refs.
    when:
      - The assistant writes its response.
    then:
      - The response contains normal prose and a fenced `embeds_map_view` block.
      - The block has a human-readable `title`.
      - The `embeds` field references the selected child embed refs only.
      - The message can still render the same event embeds as standalone previews elsewhere in the response.

  - id: S-2
    title: Assistant references a full source result set and highlights selected children
    given:
      - Alice asks for travel options from Munich to Zurich and wants the options on a map.
      - The travel app-skill returns a parent source embed containing child connection embeds.
      - The assistant wants to recommend two connections while keeping all source results available.
    when:
      - The assistant writes an `embeds_map_view` block with `sources` and `highlight`.
    then:
      - The frontend resolves the source parent ref to its child embed refs.
      - Highlighted child refs render first and receive a visible highlighted state.
      - Non-highlighted child refs from the same source remain accessible in the grouped list/map.
      - The assistant does not copy route geometry, fares, schedules, or provider details into the block.

  - id: S-9
    title: Geo-capable app-skill results recommend a map view by default
    given:
      - Alice asks for events, appointments, places, stays, or travel connections without explicitly saying "map".
      - The selected app skill returns parent or child embeds with coordinates or route segment coordinates.
    when:
      - The assistant receives the app-skill result and writes the response.
    then:
      - The map-view instruction is present for the model by default.
      - A missing map-view block is deterministically repaired from source or inline refs when possible.
      - The block is omitted when Alice explicitly asks for no map, text-only output, list-only output, or the resolved content has no usable spatial data.

  - id: S-3
    title: Frontend renders a responsive list and map using existing embed content
    given:
      - A message contains an `embeds_map_view` block with event, appointment, place, stay, or route refs.
      - Some referenced embeds are still resolving from IndexedDB or decrypted storage.
    when:
      - Alice opens the chat on desktop and mobile widths.
    then:
      - Desktop uses a list-left and map-right layout with the list around 30% and the map around 70% of the content width.
      - Mobile uses a horizontal scrollable list inside the message container and a full-width map below or above it.
      - Hovering, focusing, or selecting a list item highlights the corresponding marker or route.
      - Multiple travel connection child embeds render as separate route polylines on the same map using existing segment coordinates.
      - Unresolved refs show a recoverable loading state and do not break rendering for resolved refs.

  - id: S-4
    title: Filters are derived from resolved content without assistant-authored schema
    given:
      - A map view contains a mix of events, places, health appointments, stays, and travel connections.
    when:
      - The frontend resolves enough embed metadata to classify entries.
    then:
      - The UI derives filters such as type, date, price, specialty, rating, provider, or transport mode only from fields already present in resolved embed content.
      - Missing data omits that filter rather than asking the server or provider for enrichment.
      - The assistant-authored block remains valid if it contains no filter fields at all.

  - id: S-5
    title: Source references stay bounded for large result sets
    given:
      - An `embeds_map_view` block references an app-skill source with many child embeds.
      - The chat follows the scalable chat loading policy.
    when:
      - Alice scrolls to the message or opens the chat through a share link.
    then:
      - The map view resolves only the metadata needed for visible list/map entries plus a bounded overscan.
      - It does not eagerly decrypt or render all child embed content just because a source ref is present.
      - Deep links or explicit user actions can hydrate additional child content on demand.
      - Parent preview rendering remains self-contained and does not regress scalable chat loading guarantees.

  - id: S-6
    title: Map view rendering is cost-safe and privacy-safe
    given:
      - A map view references events, travel connections, stays, appointments, places, or flights.
      - Some referenced records could be enriched by paid app-skill or provider calls.
    when:
      - The message renders, filters change, map bounds change, or Alice selects entries.
    then:
      - OpenMates performs no automatic paid app-skill/provider calls.
      - No `travel.flight_details`, booking-details, Flightradar24, FlightAware, or similar enrichment request is made unless Alice explicitly invokes such a skill outside the map-view render path.
      - Existing client-side encrypted embed content stays client-side; decrypted plaintext is not sent to a new endpoint for map rendering.
      - Normal OpenStreetMap tile requests are allowed for map display.

  - id: S-7
    title: Real CLI chats demonstrate reliable assistant generation
    given:
      - The implementation updates AI instructions and output guards for `embeds_map_view`.
      - Test prompts ask naturally for mapped events, appointments, stays, or travel routes.
    when:
      - The real OpenMates CLI sends those prompts against `https://api.dev.openmates.org` with a real test account.
    then:
      - The assistant produces syntactically valid `embeds_map_view` blocks in the expected cases.
      - Guards reject or repair slight structure issues such as extra fields, JSON-looking blocks, duplicate refs, or refs that are not comma-separated.
      - The generated blocks reference actual embeds created or available in the same chat.

  - id: S-8
    title: Public example chats preserve the real behavior
    given:
      - At least three natural CLI-generated candidate chats have been created for map-view scenarios.
      - The strongest examples are shared with key fragments and scaffolded through the example-chat workflow.
    when:
      - The examples are deployed and opened at `/example/<slug>`.
    then:
      - The public example pages render the map view, referenced embeds, highlights, filters, and fullscreens correctly.
      - Example data preserves the real generated transcript instead of a hand-authored fixture.
      - Private fields, share keys, provider secrets, and raw account identifiers are absent from committed example-chat data.

