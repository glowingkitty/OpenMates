implementation_plan:
  spec_path: docs/specs/cli-remote-access-cross-device-requester/spec.yml
  existing_patterns:
    - Reuse Teams context/roles, current Project encryption, unified wrappers, and the verified live bridge.
    - Keep source-host/requester behavior in production CLI code; scripts only orchestrate real dev proof.
  architecture: >
    Add owner-context and attacher fields to Project child/source persistence,
    enforce one Personal/Team authorization path across REST and bridge routing,
    build deterministic CLI CRUD/requester commands, and add stored-data parity to
    npm/pip SDKs. No remote plaintext or raw key crosses backend boundaries.
  provisional: false
  first_slice: Confirm Teams prerequisites, then add context-owned Project persistence and direct REST contract tests without changing CLI or SDK behavior.
  data_flow:
    - Alice selects Team `acme`; the client sends opaque team ID `team-acme-id` while the API verifies Alice's active role.
    - A Team Project row stores hashed_team_id, created_by_user_hash, ciphertext metadata, and a key_type team wrapper for epoch 1; no raw key reaches the API.
    - Alice's desktop confirms Team Acme before discovering `/work/api`, attaches source `src-api-1`, and registers session `source-session-1`.
    - Alice's laptop or teammate Bob resolves Project `project-api-1`, unwraps its Project key, and creates request `request-1` through the first-party bridge.
    - Requester and source establish Project-authenticated encryption and relay opaque list/search/read data through the backend.
    - The source applies existing filesystem bounds and encrypts the result; the requester decrypts only the bounded response.
    - Removing the host invalidates `source-session-1` and `request-1` synchronously before the source is projected offline.
  migration_rollout:
    - Add nullable owner-context and creator/attacher fields plus context-aware indexes before switching queries.
    - Run an idempotent backfill that classifies existing child/source/settings rows as Personal from hashed_user_id.
    - Audit and reject invalid mixed Personal/Team ownership before enabling Team mutation paths.
    - Restart the local `api` service under the Docker lock before real dev REST/WebSocket verification.
    - Keep additive fields on rollback; disable Team paths without deleting encrypted rows or wrappers.
  observability:
    - Log only opaque Project/source/session/request IDs, owner-context type, role decision, stable error code, duration, and byte/item counts.
    - Emit counters for denied context/role access, offline requests, stale sessions, takeover, rate limits, and membership-triggered revocation.
    - Never log Team display names, member emails, device IDs, paths, queries, snippets, file contents, keys, or ciphertext blobs.
  assumption_checks:
    - A-1 is checked by T-TEAMS-PREREQUISITE-LIVE before TASK-2; failure keeps TASK-2A active and either repairs Teams V1 or records a user/external blocker.
    - A-2 is enforced by wrapper unit tests in T-BACKEND-PROJECT-CONTEXT and T-REMOTE-CRYPTO before Team Project creation ships.
    - A-3 remains guarded by existing remote-access tests plus T-BACKEND-REMOTE-TEAM and T-CLI-TWO-DEVICE-LIVE.
    - A-4 remains guarded by T-CLI-PROJECTS-UNIT and the privacy audit.
  acceptance_coverage:
    - AC-1, AC-2, and AC-6 map to backend pytest, direct dev REST, and real CLI checks.
    - AC-3 through AC-5, AC-7, and AC-9 map to bridge pytest/crypto, direct dev WebSocket, and real two-CLI checks.
    - AC-8 maps to real npm/pip dev tests and the parity audit.
    - AC-10 maps to deployed Playwright regression; AC-11 maps to Apple remote build; AC-12 maps to deterministic docs audit.
  risks:
    - Teams V1 deployed evidence may be incomplete; TASK-2A resolves this before feature code.
    - Context fields can create cross-scope leaks if any child query omits owner context; backend tests enumerate every Project collection and route.
    - Membership changes can race heartbeats/completions; runtime bindings use session IDs and synchronous invalidation before removal success.
    - Developer SDK Project CRUD must not accidentally expose first-party remote file routes; parity/privacy audits enforce the split.
  open_questions:
    - None for product behavior; failed Teams prerequisite evidence may reveal an implementation blocker but not a new product decision.
  material_plan_approval_required: false
  affected_files:
    - {path: backend/config/backend_config.dev.yml, reason: "Enable Teams only in the local development stack for required real-dev verification."}
    - {path: backend/core/docker-compose.override.yml, reason: "Select the development-only backend configuration for api."}
    - {path: backend/core/directus/schemas/projects.yml, reason: "Normalize Team Project ownership and creator fields."}
    - {path: backend/core/directus/schemas/project_sources.yml, reason: "Add Team context and source-attacher fields."}
    - {path: backend/core/directus/schemas/project_folders.yml, reason: "Add Team context and creator fields."}
    - {path: backend/core/directus/schemas/project_items.yml, reason: "Add Team context and link-attacher fields."}
    - {path: backend/core/directus/schemas/project_settings.yml, reason: "Scope settings to owner context."}
    - {path: backend/core/api/app/services/directus/project_methods.py, reason: "Centralize context-scoped persistence."}
    - {path: backend/core/api/app/routes/projects.py, reason: "Enforce roles and add source removal."}
    - {path: backend/core/api/app/services/project_remote_access_service.py, reason: "Bind/revoke Team sessions and requesters."}
    - {path: backend/core/api/app/routes/websockets.py, reason: "Revalidate bridge Team context."}
    - {path: frontend/packages/openmates-cli/src/cli.ts, reason: "Add Project CRUD/requester/context UX."}
    - {path: frontend/packages/openmates-cli/src/client.ts, reason: "Complete context-aware session methods."}
    - {path: frontend/packages/openmates-cli/src/remoteAccess.ts, reason: "Thread owner/host context."}
    - {path: frontend/packages/openmates-cli/src/remoteAccessCrypto.ts, reason: "Bind Team/member/device identities."}
    - {path: frontend/packages/openmates-cli/src/sdk.ts, reason: "Complete npm stored Project parity."}
    - {path: packages/openmates-python/openmates/sdk.py, reason: "Complete pip stored Project parity."}
    - {path: scripts/verify_project_remote_access_cli.py, reason: "Prove production two-CLI behavior."}
    - {path: scripts/verify_projects_api.py, reason: "Prove changed Project REST routes directly against dev before CLI work."}
    - {path: scripts/audit_cli_remote_access_docs.py, reason: "Keep public command documentation deterministic."}
  verification_strategy:
    - Write backend, crypto, CLI, and SDK red tests before implementation.
    - Prove direct REST/WebSocket dev behavior before production CLI requester work.
    - Prove real deterministic/two-CLI behavior before SDK gates.
    - Prove npm/pip locally against dev, then run parity audit.
    - Run deployed browser regression and Apple build after backend/CLI/SDK gates.
    - Run spec_verify before completion.
  verification_order:
    - Direct REST API/WebSocket unit and real dev proof first.
    - Real deterministic and two-CLI Personal/Team commands second.
    - npm and pip SDK stored Project parity against dev third.
    - CI/daily reproduction only after local API, CLI, and SDK evidence.
    - Existing deployed web Playwright regression fourth.
    - Visual smoke/user confirmation not applicable unless web behavior changes.
    - Apple remote build last.

