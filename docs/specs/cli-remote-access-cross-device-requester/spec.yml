schema_version: 2
id: cli-remote-access-cross-device-requester
title: Project CLI CRUD And Cross-Device Remote Access
status: implementing

goal: >
  Make Projects fully navigable and manageable from the OpenMates CLI, let one
  authenticated CLI request bounded encrypted files from another online CLI,
  and extend that remote-access model to Team Projects without weakening Project
  encryption, Team permissions, or source-host revocation.

scope:
  in:
    - Deterministic `openmates projects` list, show, open, create, update, archive, unarchive, and delete commands.
    - Project item and source listing plus permission-scoped link and source removal.
    - "`openmates projects files list|search|read` as the requester interface for a source hosted by another `openmates remote-access` CLI."
    - Explicit Personal or Team context for Project and remote-access operations.
    - Interactive context confirmation before source discovery and connection.
    - Non-interactive fail-closed behavior unless `--personal` or `--team <team>` is supplied.
    - Explicit context flags for non-interactive or JSON live file requests; ordinary stored Project CRUD may use persisted context.
    - Personal cross-device access only between active first-party CLI sessions for the same account.
    - Team cross-device reads for active owner, admin, member, and viewer roles.
    - Team-key-wrapped Project keys and Project-key-authenticated ephemeral source-session encryption between approved CLI clients.
    - Team role enforcement for Project mutation, source ownership, item ownership, remote reads, and destructive actions.
    - Immediate source-session revocation when a source host loses Team access while retaining the source record as offline.
    - Team-aware Project, key-wrapper, child-item, source, settings, history, and bridge routing persistence.
    - npm and pip SDK parity for encrypted Project navigation and CRUD; remote filesystem hosting and live file reads remain CLI-only.
    - Real Personal and Team two-CLI dev-server proof before web and Apple regression checks.
    - CLI help, package README, user guide, and architecture documentation for the deterministic Project/requester commands.
  out:
    - Remote file mutation, command execution, Git mutation, or a background source daemon.
    - Public, anonymous, or arbitrary developer API access to live remote files.
    - npm or pip SDK methods that host a filesystem source or request live source contents.
    - Item-level Team ACLs, private Team Projects, new roles, or Team key rotation beyond Teams V1.
    - Reassigning an offline source host without a new local attachment and approval flow.
    - New web or Apple Team Project UI; those surfaces remain governed by `teams-v1`.
    - Compatibility aliases for undocumented Project CLI commands.

context_discovery:
  github_issues:
    - GitHub MCP issue search returned 401 Bad credentials; no current issue result could be verified.
    - Brave fallback returned SUBSCRIPTION_TOKEN_INVALID; repository specs remain the discovery source of truth.
    - Existing `projects-remote-sources` discovery records related issues #447, #442, and closed #140.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/specs/cli-remote-access-live-bridge/spec.yml
    - docs/specs/projects-remote-sources/spec.yml
    - docs/specs/teams-v1/spec.yml
    - docs/specs/unified-key-wrappers/spec.yml
    - docs/architecture/platforms/cli-package.md
    - docs/user-guide/cli/remote-access.md
  code_patterns:
    - frontend/packages/openmates-cli/src/cli.ts exposes only Project ask, history, and restore commands, while internal helpers already list and decrypt Projects.
    - frontend/packages/openmates-cli/src/client.ts has session Project list/create/source/item/history/bridge helpers, but deterministic CRUD is incomplete.
    - frontend/packages/openmates-cli/src/sdk.ts and packages/openmates-python/openmates/sdk.py lack complete show/update/archive/delete and Team context parity.
    - backend/core/api/app/routes/projects.py supports Team context only on Project list/get; mutation, children, sources, settings, history, and remote requests use personal paths.
    - backend/core/api/app/services/directus/project_methods.py scopes Team list/get by hashed_team_id but other methods by hashed_user_id.
    - backend/core/directus/schemas/projects.yml supports hashed_team_id and Team Project key wrappers.
    - backend/core/directus/schemas/project_sources.yml lacks Team and source-attacher identity fields.
    - frontend/packages/openmates-cli/src/remoteAccessCrypto.ts already authenticates opaque requester/source handshakes with Project key material.
    - scripts/project_remote_access_live.mjs is a test-only requester rather than a production requester CLI.
  tests:
    - backend/tests/test_projects.py
    - backend/tests/test_project_remote_access_bridge.py
    - backend/tests/test_project_task_plan_key_wrappers.py
    - frontend/packages/openmates-cli/tests/cli.test.ts
    - frontend/packages/openmates-cli/tests/client.test.ts
    - frontend/packages/openmates-cli/tests/remoteAccess.test.ts
    - frontend/packages/openmates-cli/tests/remoteAccessCrypto.test.ts
    - frontend/packages/openmates-cli/tests/sdk-projects.test.ts
    - packages/openmates-python/tests/test_projects.py
    - frontend/apps/web_app/tests/projects-remote-sources.spec.ts
    - scripts/audit_cli_remote_access_docs.py
  verified_facts:
    - id: VF-1
      finding: The production Project CLI handler accepts only ask, history, and restore.
      evidence: frontend/packages/openmates-cli/src/cli.ts:2343-2411
    - id: VF-2
      finding: Project list/get accept Team context, but mutation and child/source routes do not consistently enforce it.
      evidence: backend/core/api/app/routes/projects.py:272-309,401-703
    - id: VF-3
      finding: Project source rows are keyed to hashed_user_id and do not record hashed_team_id or the attaching member.
      evidence: backend/core/directus/schemas/project_sources.yml
    - id: VF-4
      finding: The CLI already unwraps Project keys and decrypts display metadata locally.
      evidence: frontend/packages/openmates-cli/src/cli.ts:1280-1347
    - id: VF-5
      finding: A live source host exists, but a second production CLI has no requester command.
      evidence: frontend/packages/openmates-cli/src/remoteAccess.ts:302-453; scripts/project_remote_access_live.mjs

apple_impact:
  affected_files:
    - apple/OpenMates/Sources/Core/Networking/OpenMatesAPIClient.swift
    - apple/OpenMates/Sources/Features/Settings/Views/SettingsProjectsView.swift
  parity_expectations:
    - Existing personal Project/source views continue to decode the additive API contract without plaintext paths or private host identity.
    - No Team Project or source-host UI is implemented here; future native Team parity uses the same roles and wrappers.
    - Apple verification is a final regression build, not acceptance evidence for the CLI requester flow.
  verification:
    - python3 scripts/apple_remote.py status
    - python3 scripts/apple_remote.py build-ios
  intentional_native_differences:
    - Apple does not host local folders or expose `projects files` commands in this slice.

clarification:
  rounds:
    - question: What complete cross-device flow must work first?
      answer: One CLI runs `openmates remote-access`; another authenticated CLI lists Projects/sources and lists, searches, and reads bounded files.
    - question: How is Personal versus Team context selected for source hosting?
      answer: Interactive startup confirms active context before discovery; `--personal` or `--team <team>` selects one invocation and skips confirmation.
    - question: What happens non-interactively without an explicit context flag?
      answer: Fail before discovery with `context_confirmation_required`.
    - question: Which Team roles may read and mutate Project data?
      answer: All active roles may read. Viewers are otherwise read-only; members may create/update/archive and manage links/sources they attached; owners/admins may also remove any link/source, delete Projects, and change settings.
    - question: What happens when a Team source host leaves or loses access?
      answer: Revoke the live session immediately, retain the source as offline, and let owner/admin remove it.
  vision_summary: >
    Projects become a complete deterministic CLI workspace instead of an ask-only
    surface. A source machine remains an explicit foreground host while another
    trusted CLI retrieves bounded encrypted file data in Personal or Team context.
    Team access is broad for reads, role-scoped for mutation, and revoked when
    membership changes; the backend routes opaque encrypted payloads and never
    becomes a plaintext filesystem proxy.
  approved_by_user: true

