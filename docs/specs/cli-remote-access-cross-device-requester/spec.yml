contracts:
  api:
    - surface: Project CRUD, children, sources, settings, and history
      routes: Existing `/v1/projects` routes plus `DELETE /v1/projects/{project_id}/sources/{source_id}`.
      access_model: Developer API-key REST API and first-party client surface with approved device key access.
      auth: Authenticated session or developer API key; encrypted data requires separately approved local key material.
      owner_team_scope: Every lookup includes resolved Personal or Team context; Team requests require active membership and operation-specific role.
      rate_limits: Existing list/get 60 per minute, mutation 30 per minute, delete 20 per minute; source delete 20 per minute.
      credit_budget: Deterministic operations consume no AI credits; Project ask behavior is unchanged.
      encryption_boundary: Metadata and Project keys remain client-encrypted; API returns ciphertext/wrappers and never plaintext or raw keys.
      errors: [401 unauthenticated, 403 TEAM_PERMISSION_DENIED, 404 absent_or_out_of_context, 409 conflict_or_missing_confirmation, 429 rate_limited]
    - surface: Remote request/result and WebSocket source lifecycle
      routes: Existing Project remote-access REST and authenticated WebSocket contracts.
      access_model: First-party client surface only.
      auth: Approved CLI device session; anonymous and developer API-key-only requests are rejected.
      owner_team_scope: Personal requests require the same account; Team requests require active membership and an active attaching host member.
      rate_limits: Preserve 60 requests/minute, 180 polls/minute, 4 in-flight, 16 queued, and current heartbeat limits.
      credit_budget: List, search, and read consume no AI credits.
      encryption_boundary: Project-authenticated ephemeral keys encrypt arguments/results between approved CLIs; backend sees opaque routing/state/ciphertext only.
      errors: [401 unauthenticated, 403 scope_or_role_mismatch, 404 hidden_source, 409 offline_revoked_stale_or_context_required, 413 too_large, 429 rate_limited]
  cli:
    project_commands:
      - openmates projects list [--include-archived] [--personal|--team <team>] [--json]
      - openmates projects show|open <project> [--personal|--team <team>] [--json]
      - openmates projects create <name> [--description <text>] [--icon <name>] [--color <token>] [--pinned] [--personal|--team <team>] [--json]
      - openmates projects update <project> [--name <name>] [--description <text>] [--icon <name>] [--color <token>] [--pin|--unpin] [--personal|--team <team>] [--json]
      - openmates projects archive|unarchive <project> [--personal|--team <team>] [--json]
      - openmates projects delete <project> [--confirm <exact-project-id>] [--personal|--team <team>] [--json]
      - openmates projects items list <project> [--personal|--team <team>] [--json]
      - openmates projects items remove <project> --type <type> --target <id> [--confirm] [--personal|--team <team>] [--json]
      - openmates projects sources list <project> [--personal|--team <team>] [--json]
      - openmates projects sources remove <project> --source <source-id> [--confirm <source-id>] [--personal|--team <team>] [--json]
      - openmates projects files list <project> [--source <source-id>] [--path <relative-path>] [--depth <n>] [--personal|--team <team>] [--json]
      - openmates projects files search <project> <query> [--source <source-id>] [--personal|--team <team>] [--json]
      - openmates projects files read <project> <relative-path> [--source <source-id>] [--personal|--team <team>] [--json]
    resolution:
      - UUID is canonical; exact short ID or exact decrypted name is accepted only when unique in selected context.
      - Multiple eligible live sources require `--source` or interactive selection; JSON/non-interactive returns source_selection_required.
    context:
      - Project commands use persisted context unless one invocation supplies `--personal` or `--team`.
      - Interactive hosting confirms context before discovery; non-interactive/JSON hosting requires an explicit context flag.
      - Interactive live file requests display the resolved context before source selection; non-interactive/JSON file requests require an explicit context flag and never use persisted context.
    output:
      - Human output is concise cleartext; JSON uses stable snake_case fields/error codes.
      - Never print raw keys, ciphertext fields, another host's absolute root, private host identity, or handshake data.
  sdk:
    - npm and pip expose list/show/create/update/archive/unarchive/confirmed-delete with explicit Personal or Team context.
    - SDKs may list stored child/source metadata with local key material but do not host or request live filesystem data.
    - Real SDK gates use approved credentials against `https://api.dev.openmates.org`; mocks are supplemental.
  data:
    - Personal Project rows have hashed_user_id/no hashed_team_id; Team rows have hashed_team_id and created_by_user_hash.
    - Team create stores a key_type team Project wrapper encrypted by Team key epoch 1; raw keys never reach backend.
    - Folders, item links, sources, and settings gain owner-context and creator/attacher fields needed for Team scoping.
    - Existing rows backfill idempotently as Personal; mixed invalid owner states fail validation.
    - Team source uniqueness is hashed_team_id plus source_id; Personal uniqueness remains hashed_user_id plus source_id.
    - Host membership loss clears runtime bindings and marks durable source offline without deleting encrypted metadata.
    - Membership removal does not return success until active bindings and pending requests are invalidated; best-effort source WebSocket revocation is emitted within 5 seconds, while all later backend work is already rejected synchronously.
    - Exactly one foreground session owns a source ID; confirmed takeover atomically invalidates the old session, and stale disconnect/heartbeat messages cannot change the replacement state.
    - Additive schema fields deploy before context-aware code; rollback retains fields and encrypted records.
  role_matrix:
    viewer: [read_projects_items_sources_and_remote_files]
    member: [viewer_reads, create_update_archive_projects, manage_own_item_links_and_sources]
    admin: [viewer_reads, create_update_archive_delete_projects, project_settings, manage_any_item_links_and_sources]
    owner: [viewer_reads, create_update_archive_delete_projects, project_settings, manage_any_item_links_and_sources]
  privacy_security:
    - Backend authorizes opaque routing but never decrypts Project/source metadata or remote paths, queries, snippets, or contents.
    - Team role is checked on durable mutation and bridge register/request/delivery/completion/heartbeat/reconnect/takeover.
    - Session transcripts bind owner context, Team, Project, source, session, key epoch, host device/member, and requester device/member.
    - Context confirmation precedes discovery so cancellation traverses no local directories.
    - Existing root, symlink, race, ignore, protected-path, binary, UTF-8, byte, line, depth, timeout, replay, and concurrency controls remain mandatory.
    - Logs and artifacts use opaque IDs/counts, never raw keys, ciphertext blobs, private paths, queries, snippets, contents, or emails.
    - Previously decrypted data cannot be recalled after removal; product copy must not promise cryptographic erasure.
    - Viewers/members see `Attached by you` for their own source or `Team source` for another member; owner/admin may see the authorized Team member display label for cleanup. No role sees another host's device ID or absolute path.

