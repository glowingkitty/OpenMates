schema_version: 2
id: opencode-orchestration-remediation
title: OpenCode Orchestration Remediation
status: implementing

goal: >
  Remove the remaining orchestration bottlenecks that keep OpenCode chats from
  completing independently: dead test leases must be reclaimed immediately,
  Docker/runtime operations must queue deterministically, deploy/test evidence
  must stay commit-scoped, and restored or child sessions must keep using the
  intended worktree.

scope:
  in:
    - Reclaim same-host dead-owner test leases before they can block Docker or test work until TTL expiry.
    - Make runtime operations idempotent for the same chat and FIFO-queued for different chats that need the same resource.
    - Preserve shared test concurrency while blocking only the operations that truly conflict with exclusive runtime mutation.
    - Keep deploy and lint gates bound to the candidate checkout or integration checkout, never the dirty shared root.
    - Keep browser proof/test runs tied to an immutable expected commit and reject evidence when the tested deployment changes.
    - Ensure restore and child/reviewer flows keep using the parent session worktree or fail with a deterministic recovery action.
    - Deduplicate repeated OpenCode hook routing warnings for the same session, head, and reason.
    - Provide focused regression tests and operational checks before any stopped chats are resumed.
    - Make queued-operation polling reconcile expired leases and missed admission signals transactionally.
    - Report the exact lease or earlier runtime operation that blocks admission.
    - Reuse the running OpenCode server for proof review and emit bounded progress and timeout cleanup.
    - Keep deploy test discovery module-local when an exact sibling test or explicit test-file contract exists.
    - Mount every shared product-code container from one clean integrated runtime checkout and repair mixed generations together.
  out:
    - Rewriting the full engineering control-plane architecture.
    - Changing product-facing OpenMates behavior, self-hosting CLI behavior, or user-visible UI.
    - Running Apple native jobs on the Mac as part of this remediation.
    - Forcing completion of the stopped feature chats before the orchestration fixes are deployed.
    - Adding control-plane services to normal self-hosted Docker images.

context_discovery:
  prior_specs:
    - docs/specs/independent-engineering-control-plane/spec.yml
  docs:
    - docs/architecture/test-orchestration.md
    - docs/contributing/guides/spec-driven-development.md
    - AGENTS.md
  code_patterns:
    - backend/engineering_control_plane/coordination.py defines the in-memory lease, runtime-operation, dispatch, and event contract.
    - backend/engineering_control_plane/coordination_repository.py persists the same contract in PostgreSQL.
    - scripts/sessions.py owns OpenCode sessions, managed worktrees, deploy gates, Docker locks, runtime operations, restore, and local fallback coordination.
    - scripts/tests.py and scripts/run_tests.py own commit-scoped Playwright/proof execution and shared test resource leases.
    - .opencode/plugins/openmates-hooks.js routes OpenCode tool calls and surfaces routing failures.
  observed_failures:
    - A dead same-host test lease blocked Docker restart admission until the 30 minute TTL.
    - Runtime restart requests reported conflicts instead of behaving like a durable FIFO queue.
    - A same-session Docker wait could look like the session was waiting on itself.
    - A root checkout with unrelated dirty changes blocked restore/deploy workflows that should have used managed worktrees.
    - A child/reviewer session ran relative commands from the root checkout instead of the parent worktree.
    - Hook routing warnings repeated for the same session/head/reason and obscured useful progress.
    - A proof run could become suspect when dev alias deployment moved while the proof was still running.
    - A queued Docker operation remained queued after all visible blockers disappeared because polling did not rerun admission.
    - Standalone proof reviewers each booted a full OpenCode and unrelated MCP stack, consumed roughly 600 MB, and stayed silent for up to ten minutes.
    - The deploy gate mapped engineering_control_plane/api.py to unrelated product API-key tests and failed on dependencies outside the changed component.
    - API and worker containers mounted different chat worktrees and resolved the same HEL1 storage configuration differently while sharing one Compose project.
  user_direction:
    - Create and execute a spec that resolves the remaining agentic coding flow issues.
    - Stop wasting tokens in the currently running chats until the orchestration flow is fixed.
    - Keep self-hosted users independent from the private engineering control plane.

clarification:
  rounds:
    - question: Should currently running chats keep working while orchestration is repaired?
      answer: No. The user manually stopped the chats to avoid wasting tokens.
  vision_summary: >
    The feature chats should resume only after the orchestration layer can
    distinguish real conflicts from safe parallel work, can reclaim abandoned
    resources deterministically, and can preserve exact worktree and commit
    identity across tests, deploys, children, and restores.
  approved_by_user: true

apple_impact:
  affected_files:
    - none
  parity_expectations:
    - Apple product behavior is unchanged.
    - Apple remote execution remains single-lane and is not started by this remediation.
  verification:
    - Tooling tests are sufficient; no Xcode or Mac run is required.
  intentional_native_differences:
    - The private orchestration control plane is developer infrastructure only.

scenarios:
  - id: S-1
    title: Dead test owner does not block runtime mutation
    given:
      - A test lease exists for dev-stack with owner_key dev-server:<dead-pid>.
      - A Docker restart operation requests dev-stack.
    when:
      - The restart checks blocking leases.
    then:
      - The same-host dead-owner lease is released before timeout.
      - The runtime operation continues without waiting for the lease TTL.
      - Live foreign-host or live same-host leases remain active.

  - id: S-2
    title: Runtime operations queue instead of conflicting
    given:
      - Chat A owns or is running a Docker restart for dev-stack.
      - Chat B requests another restart for dev-stack.
    when:
      - Chat B uses the canonical sessions.py Docker restart command.
    then:
      - Chat B receives or reuses a durable runtime operation record.
      - The operation waits FIFO until earlier conflicting runtime work completes.
      - Repeating the same request from Chat B reattaches to the same active operation.

  - id: S-3
    title: Tests run in parallel unless a real exclusive mutation conflicts
    given:
      - Multiple Playwright or CLI proof runs target the same deployed dev stack without mutating the runtime.
    when:
      - The runs acquire shared dev-stack read leases.
    then:
      - Shared read leases coexist.
      - An exclusive Docker restart waits for those live leases.
      - New shared test runs wait only when an admitted or active exclusive runtime operation owns the same resource.

  - id: S-4
    title: Proof and deploy evidence remains commit-scoped
    given:
      - A browser proof starts for expected commit A.
      - origin/dev or the dev alias advances to commit B before the proof completes.
    when:
      - The proof runner records final evidence.
    then:
      - The evidence is rejected or marked stale unless it can prove it used an immutable deployment for commit A.
      - The chat receives a deterministic next action to rerun against the current expected commit or immutable preview.

  - id: S-5
    title: Worktree routing survives restore and child sessions
    given:
      - A stopped top-level OpenCode chat has a managed worktree.
      - A child/reviewer session is spawned or the parent chat is restored.
    when:
      - The session executes relative git, pytest, lint, or source-inspection commands.
    then:
      - Commands run in the parent managed worktree.
      - If routing cannot be guaranteed, the hook blocks once with a deterministic recovery command.
      - The shared root checkout is not used as a fallback for source work.

  - id: S-6
    title: Queue polling heals missed admission signals and names blockers
    given:
      - A runtime operation is queued behind a lease or earlier operation.
    when:
      - The blocker expires or completes and the waiting client polls again.
    then:
      - Expiry and FIFO admission are reconciled in the same transaction.
      - The waiter is admitted without manual database mutation.
      - While still queued, status names the blocking lease or operation owner and phase.
      - A terminal operation cannot be moved back into an active phase.

  - id: S-7
    title: Proof review reuses OpenCode and remains observable
    given:
      - Multiple chats need bounded frame review while the OpenCode server is running.
    when:
      - The proof workflow launches a reviewer.
    then:
      - The reviewer attaches to the existing server instead of starting another plugin and MCP stack.
      - The launcher passes canonical proof paths directly under a generated narrow read policy and creates no temporary repository symlinks.
      - Progress is printed at least every 30 seconds.
      - Timeout terminates the reviewer and preserves partial output for diagnosis.

  - id: S-8
    title: Shared product containers use one source generation
    given:
      - Multiple chats restart different services in the shared development Compose project.
    when:
      - A canonical Docker operation is admitted.
    then:
      - The operation refreshes one clean product-runtime checkout only after dependent tests drain.
      - Every recreated code-mounted service uses that checkout and records its exact commit and container ID.
      - Existing services with another mount, commit, or unrecorded container generation are included in the coherence restart.
      - Incoherent containers are force-recreated; a health-only restart cannot preserve an old bind mount and still complete.
      - Code-service recreation does not traverse or recreate infrastructure dependencies outside the admitted service set.
      - Exact mount and source-tree provenance is recorded before the runtime operation becomes completed.
      - Already coherent services are not restarted unnecessarily.

