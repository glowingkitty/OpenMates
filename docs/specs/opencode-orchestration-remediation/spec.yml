implementation_plan:
  spec_path: docs/specs/opencode-orchestration-remediation/spec.yml
  architecture: >
    Keep the existing independent engineering control plane and sessions.py
    local fallback. Add narrowly scoped coordination semantics, tests, and hook
    guardrails instead of replacing the orchestration system.
  existing_patterns:
    - Use backend/engineering_control_plane/coordination.py as the deterministic reference contract.
    - Use PostgresCoordinationRepository for durable runtime-operation and lease semantics.
    - Use sessions.py as the compatibility client for both persistent API coordination and local JSON fallback.
    - Use .opencode/plugins/openmates-hooks.js only for fast, low-noise OpenCode guardrails.
  data_flow:
    - Test runners acquire shared leases for dev-stack read/proof work.
    - Docker restart requests create or reuse runtime-operation records and wait for exclusive admission.
    - Dead same-host lease owners are detected by sessions.py using host PID liveness and released through the coordination API.
    - Restore and child-session commands resolve to the top-level repository session worktree before source commands run.
  affected_files:
    - path: docs/specs/opencode-orchestration-remediation/spec.yml
      reason: Executable contract and evidence ledger for this remediation.
    - path: backend/engineering_control_plane/coordination.py
      reason: Reference runtime-operation queue and lease semantics.
    - path: backend/engineering_control_plane/coordination_repository.py
      reason: Persistent FIFO queue, same-session reattach, and queued admission semantics.
    - path: backend/engineering_control_plane/api.py
      reason: API exposure for any needed operation/lease coordination metadata.
    - path: scripts/sessions.py
      reason: Client-side dead lease reclamation, Docker queue behavior, restore readiness, and local fallback semantics.
    - path: scripts/run_tests.py
      reason: Shared lease heartbeat and commit-scoped proof/test evidence checks.
    - path: scripts/tests.py
      reason: Expected-commit and deployment-reference gate behavior.
    - path: .opencode/plugins/openmates-hooks.js
      reason: Deduplicate routing warnings and keep source commands in managed worktrees.
    - path: backend/engineering_control_plane/tests/test_coordination.py
      reason: Contract regression coverage for coordination semantics.
    - path: scripts/tests/test_sessions_docker_orchestration.py
      reason: sessions.py Docker coordination regression coverage.
    - path: scripts/tests/test_sessions_native_worktree_lifecycle.py
      reason: Worktree restore/child routing regression coverage.
    - path: scripts/tests/test_opencode_hooks_contract.mjs
      reason: Hook dedupe and routing guard regression coverage.
  verification_strategy:
    - Run red-phase focused tests where practical before implementation, or record missing-test evidence when adding a new regression.
    - Implement the smallest coordination and hook changes needed to satisfy the spec.
    - Run focused pytest and Node tests from this spec.
    - Inspect active coordination state before resuming stopped chats.
  verification_order:
    - T-CONTROL-PLANE
    - T-SESSIONS-DOCKER
    - T-RUN-TESTS
    - T-SESSIONS-WORKTREE
    - T-OPENCODE-HOOKS
    - V-OPERATIONAL-READINESS

