decisions:
- id: D-1
  status: active
  decision: Use local ephemeral worktrees as the default isolation boundary for agent edit sessions.
  reason: The shared root checkout caused repeated foreign-staged aborts, stale locks, and manual unlocks.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-2
  status: active
  decision: Keep `dev` as the only integration and deployment branch.
  reason: The repository workflow treats `dev` as the permanent current branch and deploy target.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-3
  status: active
  decision: Use hybrid verification with fast deploys by default and exact-SHA proof when behavior requires it.
  reason: Exact proof is valuable for release-critical checks, but forcing it for every tiny non-runtime change would slow
    iteration.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-4
  status: active
  decision: Archive stale dirty worktrees visibly after 12 hours instead of auto-committing, pushing, or deleting their changes.
  reason: Unreviewed changes may contain useful work or user data and must not be silently lost or merged.
  decided_at: '2026-07-26T00:00:00Z'
- id: D-5
  status: active
  decision: Roll out root guards in a transitional warn-only mode before strict enforcement.
  reason: Existing agents and hooks need a safe migration path without blocking urgent deploys during the transition.
  decided_at: '2026-07-26T00:00:00Z'
