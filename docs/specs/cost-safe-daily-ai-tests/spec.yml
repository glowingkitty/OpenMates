goal: >
  Make daily AI test runs broad and deterministic without unnecessary provider
  spend: all ordinary daily specs replay every external processing call, while
  exactly one fixed and one rotating full-pipeline canary make real calls under
  a shared EUR 0.25 hard cap that never applies to ordinary inference.

scope:
  in:
    - Replace partial fixture behavior with full-pipeline replay for daily AI specs.
    - Replay preprocessing, main inference, tools, postprocessing, translation, safety, compression, delivery, and persistence dependencies.
    - Fail before provider dispatch on every missing or mismatched replay entry.
    - Run one short fixed and one deterministically rotating real-inference canary per UTC day.
    - Enforce one distributed EUR 0.25 budget across both real canaries.
    - Restrict daily-test controls to non-production signed run identity and dedicated test accounts.
    - Preserve normal development, manual, self-hosted, and production inference behavior.
    - Record cache data manually or for one manifest-allowlisted scheduled candidate into isolated persistent storage and promote only after passing real and zero-call replay runs.
    - Classify existing Playwright AI specs as replay, bounded rotating canary, manual expensive, or non-AI.
    - Produce content-free daily call, token, estimated-cost, phase, provider, model, and cache summaries.
  out:
    - Changing prompts, normal model routing, tool planning, user billing, or product response behavior.
    - Public or developer API access to test controls or cache management.
    - npm or pip SDK methods for test orchestration.
    - Implicit recording after cache misses, unbounded scheduled recording, or more than one scheduled candidate per UTC day.
    - Daily deep-research, generated-media, long-chat, or other expensive inference.
    - Exact generated-text assertions for real canaries.
    - Web or Apple product UI changes.

context_discovery:
  github_issues:
    - No matching GitHub issue was found for daily inference cache cost control.
  docs:
    - docs/contributing/guides/spec-driven-development.md
    - docs/contributing/guides/testing.md
    - docs/specs/free-testing-credits-budget/spec.yml
    - docs/specs/ai-request-observability/spec.yml
  contracts:
    - architecture.daily-ai-test-inference@2 approved in session fd78 with fingerprint 8e340e096114f9956ce9509464aadb8e0e9f92e6ee50800b0cddcd88a3b80452.
    - architecture.ai-request-observability@1 provides content-free provider-purpose and phase telemetry requirements.
  code_patterns:
    - backend/apps/ai/tasks/ask_skill_task.py currently skips preprocessing and main inference for TEST_MOCK but explicitly performs real postprocessing.
    - backend/apps/ai/processing/postprocessor.py can issue one postprocess call plus separate summary, CTA, title, and new-chat-suggestion translation calls.
    - backend/shared/testing/mock_context.py activates replay or recording only when a per-request marker is present and defaults to real-provider passthrough.
    - backend/apps/ai/testing/caching_llm_wrapper.py and backend/shared/testing/caching_http_transport.py already provide replay-only cache misses for covered LLM and HTTP paths.
    - frontend/apps/web_app/tests/signup-flow-helpers.ts selects fixture, replay, or record markers from environment flags.
    - scripts/run_tests.py enables mock-related environment variables but discovers most top-level Playwright specs unless explicitly excluded.
    - scripts/ci/get_spec_batch.py and scripts/sync_obsidian_test_results.py maintain separate excluded-spec sets that can drift.
    - The mock context references docs/architecture/live-mock-testing.md, but that document is currently absent.
  tests:
    - backend/tests/test_caching_llm_wrapper.py
    - backend/tests/test_caching_http_transport.py
    - scripts/tests/test_run_tests_backend_mock_preflight.py
    - scripts/tests/test_release_core_journeys_gate.py
    - frontend/apps/web_app/tests/deep-research-real-inference.spec.ts
    - frontend/apps/web_app/tests/sub-chats-real-inference.spec.ts
  verified_facts:
    - TEST_MOCK is not a full-provider replay because postprocessing remains real.
    - Live replay fails on covered cache misses rather than calling the real provider.
    - A daily-run environment flag does not activate replay for an unmarked chat request.
    - Existing provider observability distinguishes preprocess, main, postprocess, translation, compression, safety, and inspiration purposes.

clarification:
  rounds:
    - question: Should daily real coverage use fixed or rotating scenarios?
      answer: Use one fixed canary plus one rotating scenario from a curated pool.
    - question: How should paid daily inference be bounded?
      answer: Enforce a hard run-level provider budget with no fallback beyond it.
    - question: What is the initial combined daily budget?
      answer: EUR 0.25, configurable only through test-specific configuration.
    - question: How are caches refreshed?
      answer: Cache misses always fail closed; one manifest-allowlisted missing-cache scenario may be recorded automatically per daily run and promoted only after receipt validation and zero-call candidate replay.
    - question: When does a repaired spec require real inference and cache promotion?
      answer: Require it only for AI contract changes; UI-only repairs may remain replay-only, and promotion follows a passing real run plus immediate replay verification.
  vision_summary: >
    Daily coverage should execute meaningful OpenMates orchestration broadly but
    spend only on two bounded canaries. Test controls are isolated from ordinary
    traffic, scheduled backfill is limited to one reviewed candidate, and known-good
    cassettes cannot be replaced by a failing recording or replay.
  approved_by_user: true

