        summary: Providers using the shared HTTP transport can replay or record external HTTP responses.
      - source: scripts/audit_daily_ai_test_inference.py
        summary: Deterministic audit passed with shared LLM, HTTP, httpx, aiohttp, and requests provider-boundary guards present.
    blocker: null
  - id: A-2
    text: The shared development Redis can provide atomic budget reservations with run-scoped TTL cleanup across workers.
    category: architecture
    required_before: implementation
