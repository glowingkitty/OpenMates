risks:
  - id: R-1
    risk: A provider path bypasses replay and creates paid calls.
    mitigation: Enforce at a shared provider boundary, add an exhaustive path audit, and require zero-call run accounting.
  - id: R-2
    risk: Test budget state throttles normal users on the shared dev server.
    mitigation: Require signed run context plus a dedicated account and prove ordinary requests never consult test state.
  - id: R-3
    risk: Conservative reservation blocks meaningful canaries before actual cost approaches EUR 0.25.
    mitigation: Use short prompts, bounded output limits, current pricing metadata, and choose canary models whose worst-case reservation fits.
  - id: R-4
    risk: Provider nondeterminism creates noisy daily failures.
    mitigation: Assert semantic schema and terminal behavior, permit no exact prose checks, and keep one stable fixed baseline plus curated rotation.
  - id: R-5
    risk: Failed record runs corrupt known-good cache data.
    mitigation: Stage isolated candidates and require pass-gated atomic promotion plus immediate replay.
  - id: R-6
    risk: Multiple exclusion lists drift and reintroduce expensive specs.
    mitigation: Replace them with one canonical manifest consumed by discovery, CI batching, result synchronization, and audits.

