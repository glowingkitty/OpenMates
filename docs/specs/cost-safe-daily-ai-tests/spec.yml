    blocker: null

contracts:
  api:
    access_model: internal-only
    auth: Short-lived signed daily-run identity plus a dedicated allowlisted test account; disabled in production.
    rate_limits: Existing chat limits remain; test budget may be stricter and cannot weaken normal limits.
    credit_budget: Replay is exactly zero paid calls; fixed and rotating canaries share EUR 0.25 per UTC daily run.
    encryption_boundary: Existing first-party client encryption remains unchanged; test-control metadata is content-free and must not enter encrypted message content or provider prompts.
    endpoints_changed: none
  cli:
    operations:
      - Run the complete replay daily plan.
      - Run the fixed and selected rotating canaries under one budget.
      - Record one named scenario into an isolated candidate cache manually.
      - Promote a passing candidate and immediately verify replay.
      - Print a content-free test-cost and cache summary.
  data:
    persisted:
      - Reviewed cache entries and manifests committed to the repository.
      - Approved contract receipt and generated assertion indexes.
    ephemeral:
      - Signed run context, atomic budget reservations, reconciled cost totals, and candidate cache staging.
    forbidden:
      - Prompts, generated responses, tool payloads, user IDs, chat IDs, credentials, raw provider errors, and production identifiers in summaries or budget state.

privacy_security:
  - Production rejects all daily test controls even when a signed value or test account is presented.
  - Ordinary and manual requests do not consult replay mode or the daily budget.
  - Dedicated account identity and signed short-lived run context are both required; neither alone is sufficient.
  - Test context remains outside prompts, encrypted chat content, cache-key diagnostics, and persisted user messages.
  - Budget state and summaries contain only low-cardinality structural metadata and normalized failures.
  - Cache files must be reviewed for secrets and private content before promotion.

