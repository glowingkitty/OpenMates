scenarios:
  - id: S-1
    title: Daily replay executes the full local pipeline without provider spend
    given:
      - A daily Playwright or CLI AI scenario has a complete reviewed cache group.
      - The request carries valid replay test context.
    when:
      - The encrypted chat request executes on the shared dev stack.
    then:
      - Local preprocessing, main orchestration, tools, postprocessing, translations, safety, compression, delivery, and persistence execute where applicable.
      - Every external AI and skill-provider response comes from reviewed cache data.
      - The run reports zero real provider calls.
  - id: S-2
    title: Replay cache drift fails before cost
    given:
      - A replay request has a missing, ambiguous, exhausted, or request-shape-mismatched entry.
    when:
      - The corresponding provider boundary is reached.
    then:
      - No provider or fallback dispatch starts.
      - The spec fails with the normalized phase and sanitized cache identity.
  - id: S-3
    title: Daily real coverage is bounded and meaningful
    given:
      - The fixed canary and curated rotating pool are configured.
      - The UTC date selects one stable rotating scenario.
    when:
      - The daily paid stage runs.
    then:
      - Exactly one fixed and one rotating scenario execute the real full pipeline.
      - Assertions validate terminal state, usable content, required phases, schemas, and visible error boundaries rather than exact prose.
      - Retries do not select a different rotating scenario.
  - id: S-4
    title: Shared daily budget blocks overspend without affecting users
    given:
      - Both canaries share a signed test run and EUR 0.25 budget.
      - Ordinary inference is active on the same development server.
    when:
      - Concurrent workers reserve estimated provider cost.
    then:
      - Atomic conservative reservations prevent the test run from exceeding its cap.
      - Exhaustion blocks retries, fallbacks, and later paid test calls.
      - Ordinary and manual inference never consults the daily-test budget.
  - id: S-5
    title: Manual recording promotes only a proven candidate
    given:
      - A prompt, model, routing, processing, tool, or AI assertion contract changed.
      - A maintainer explicitly starts candidate recording for one scenario.
    when:
      - The real spec finishes.
    then:
      - Failure discards the candidate and leaves known-good cache data unchanged.
      - Success permits atomic promotion followed immediately by the same replay run.
      - The cache becomes valid only after replay passes with zero provider calls.
  - id: S-6
    title: Daily selection excludes uncontrolled paid inference
    given:
      - Existing Playwright specs include replayable, bounded real, expensive real, and non-AI scenarios.
    when:
      - Daily discovery builds its test plan.
    then:
      - Every AI spec has one explicit classification in a canonical manifest.
      - Only the two canary selections may make real calls.
      - Expensive and unclassified AI specs fail planning rather than silently entering the daily run.
  - id: S-7
    title: Daily reporting is actionable and content-free
    given:
      - Replay and real stages have completed or failed.
    when:
      - The runner publishes its summary.
    then:
      - The summary includes mode, phase, provider, model, cache totals, calls, tokens, estimated EUR cost, budget state, and normalized failures.
      - It excludes prompts, responses, cache keys, tool payloads, identities, credentials, and raw provider errors.
  - id: S-8
    title: One missing-cache scenario becomes verified replay coverage automatically
    given:
      - A manifest entry is explicitly classified as backfill_pending with an audited cache group.
      - Persistent candidate storage and the daily EUR budget are available.
    when:
      - The daily runner selects its one scheduled backfill candidate.
    then:
      - The passing real run writes only to the isolated candidate root and emits content-free receipts.
      - The same spec replays directly from that candidate with zero misses and zero real provider calls.
      - Runtime and source cache groups are promoted atomically and persisted through an exact-scope sessions.py deployment.
      - Any failure remains visible while known-good cache data and the ordinary nightly suite remain unchanged.

