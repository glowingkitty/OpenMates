  - id: D-2
    status: active
    decision: Share a EUR 0.25 hard cap across both canaries and fail before any call that cannot be conservatively reserved.
    reason: A hard provider-boundary ceiling prevents silent cost growth.
    decided_at: "2026-08-30T00:00:00Z"
  - id: D-3
    status: superseded
    decision: Keep daily cache use replay-only and cache refresh manual-only.
    reason: Scheduled recording can silently spend and normalize regressions.
    decided_at: "2026-08-30T00:00:00Z"
  - id: D-6
    status: active
    decision: Allow one manifest-allowlisted automatic cache backfill per daily run, with persistent candidate storage, content-free receipts, candidate replay, atomic promotion, and exact-scope dev deployment.
    reason: Missing replay caches should converge automatically without turning ordinary cache misses into paid calls or risking known-good data.
    decided_at: "2026-08-30T23:30:00Z"
  - id: D-4
    status: active
    decision: Require real validation only when AI request, processing, tool, model, prompt, or assertion contracts change.
    reason: UI-only repairs gain no useful signal from additional nondeterministic paid inference.
    decided_at: "2026-08-30T00:00:00Z"
  - id: D-5
    status: active
    decision: Promote recorded cache candidates only after a passing real run and immediate passing replay.
    reason: Known-good cassettes must survive failures and prove deterministic reuse before adoption.
    decided_at: "2026-08-30T00:00:00Z"

