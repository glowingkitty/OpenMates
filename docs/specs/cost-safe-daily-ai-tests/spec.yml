      - daily-ai-tests.reporting.content-free
  surface_proof:
    rest_api: No endpoint change; prove the internal first-party WebSocket path through dev CLI replay and isolation probes.
    cli: Prove replay, isolation, candidate refresh, and content-free summaries against api.dev.openmates.org.
    sdks: Not applicable because no npm or pip API changes.
    gui_web: Prove only the existing encrypted chat path through the deployed real-canary Playwright spec.
    gui_apple: Not applicable because no native behavior changes.
  documentation:
    architecture: docs/architecture/live-mock-testing.md
    contributor: docs/contributing/guides/testing.md
    generated: [contracts/generated/registry.yml, contracts/generated/assertion-index.yml, contracts/generated/coverage.yml]
  existing_patterns:
    - backend/shared/testing/mock_context.py
    - backend/apps/ai/testing/caching_llm_wrapper.py
    - backend/shared/testing/caching_http_transport.py
    - backend/shared/python_utils/tracing/ai_observability.py
    - scripts/run_tests.py
    - frontend/apps/web_app/tests/signup-flow-helpers.ts
  architecture: >
    Introduce a content-free signed DailyAITestContext propagated across the
    existing first-party request and worker path. Replay context makes every
    registered external provider boundary fail closed on cache miss. Real-canary
    context reserves shared Redis-backed test budget before dispatch and
    reconciles actual usage. One canonical spec manifest drives daily discovery,
    rotation, recording eligibility, and reporting. Candidate caches remain
    isolated until the runner promotes them after real and replay success.
  data_flow:
    - The daily orchestrator creates signed run daily-2026-08-30 with replay mode and a canonical test plan.
    - Replay specs propagate content-free context through API, Celery, worker, tools, and provider boundaries without changing encrypted message text.
    - A postprocess call for cache group chat-flow resolves its ordered entry or fails before Mistral dispatch.
    - Fixed and UTC-selected rotating canaries use one real-canary context and shared Redis budget key with bounded TTL.
    - Each provider boundary reserves worst-case EUR cost atomically, dispatches only when accepted, then reconciles actual tokens and cost.
    - Manual recording writes candidate entries and a manifest outside known-good cache paths.
    - Runner promotes only after passing real assertions and then requires the same scenario to pass replay with real_provider_calls=0.
    - Daily aggregation publishes content-free cache, phase, call, token, cost, and normalized-failure totals.
  affected_files:
    - path: backend/shared/testing/mock_context.py
      reason: Replace marker-only activation with validated propagated test context while retaining production disablement.
    - path: backend/apps/ai/testing/caching_llm_wrapper.py
      reason: Enforce replay accounting, real budget reservation, candidate staging, and phase metadata at LLM boundaries.
    - path: backend/shared/testing/caching_http_transport.py
      reason: Apply the same replay and budget contracts to external skill HTTP calls.
    - path: backend/apps/ai/tasks/ask_skill_task.py
      reason: Remove partial TEST_MOCK bypass for daily AI specs and propagate full-pipeline context.
    - path: backend/shared/python_utils/tracing/ai_observability.py
      reason: Add reviewed content-free test mode, cache status, and budget state dimensions if the privacy contract permits them.
    - path: scripts/run_tests.py
      reason: Build replay and canary stages from one canonical manifest and aggregate budget evidence.
    - path: scripts/ci/get_spec_batch.py
      reason: Consume canonical classifications instead of a duplicate exclusion set.
    - path: scripts/sync_obsidian_test_results.py
      reason: Consume the same canonical daily classification.
    - path: frontend/apps/web_app/tests/signup-flow-helpers.ts
      reason: Emit validated request context through a content-free mechanism rather than relying on plaintext prompt markers.
    - path: frontend/apps/web_app/tests/daily-ai-fixed-canary.spec.ts
      reason: Define the fixed semantic full-pipeline canary.
    - path: frontend/apps/web_app/tests/daily-ai-rotating-canary.spec.ts
      reason: Define the UTC-selected rotating semantic full-pipeline canary.
    - path: scripts/audit_daily_ai_test_inference.py
      reason: Deterministically enforce exhaustive classification and provider-boundary coverage.
    - path: docs/architecture/live-mock-testing.md
      reason: Document the approved replay, recording, promotion, budget, and isolation architecture.
  verification_strategy:
    - Validate the approved contract bundle and Schema V3 spec.
    - Record red unit and audit evidence before implementation.
    - Prove request identity, replay fail-closed behavior, budget concurrency, and cache transactions locally.
    - Deploy backend and runner changes to dev before real API, CLI, and Playwright evidence.
    - Run real dev CLI replay and isolation probes before the web canaries.
    - Run the deployed fixed-plus-rotating Playwright canary under the shared budget.
    - Review zero-spend replay and bounded-canary content-free artifacts.
  migration_rollout:
    data_migration: none
    cache_transition: Existing fixture groups remain readable until each classified scenario has a complete full-pipeline cassette; daily discovery switches only after the audit proves exhaustive coverage.
    rollout: Deploy fail-closed replay and accounting first, verify dev CLI replay, then enable canonical daily selection and finally the two paid canaries.
    rollback: Disable the daily canary stage and retain replay-only execution; never restore provider fallback on replay misses.
  observability:
    required_fields: [mode, phase, provider, model, cache_status, real_provider_calls, input_tokens, output_tokens, estimated_eur, reserved_eur, budget_state, normalized_failure_class]
    forbidden_fields: [prompt, response, tool_payload, cache_key, user_id, chat_id, credentials, raw_provider_error]
    evidence_artifacts: [zero_spend_replay_manifest, bounded_canary_summary]
  assumption_checks:
