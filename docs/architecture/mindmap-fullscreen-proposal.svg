  <title id="title">Mindmap fullscreen proposal — awaiting approval</title>
  <desc id="desc">Original design proposal, not a product screenshot. A spacious canvas has a central Launch Plan topic, colored curved branches on both sides, small zoom controls and no JSON panel. A phone illustration shows the same navigable canvas.</desc>
