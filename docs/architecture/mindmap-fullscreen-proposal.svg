    <text x="40" y="733" font-size="17" font-weight="700">Readable branches. One canvas. No source panel in normal fullscreen.</text>
    <text x="40" y="764" font-size="15" fill="#626979">Preserve download, cross-links, collapse and error recovery. Layout reserves actual wrapped-text height.</text>
    <text x="40" y="790" font-size="15" fill="#626979">Phone keeps the same map with pan/pinch navigation; the illustration simplifies secondary branches for clarity.</text>
