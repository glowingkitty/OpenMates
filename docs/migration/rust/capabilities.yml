# Curated capability status: one entry per client capability, per shell (web, apple, tui).
# Authoritative source of the migration progress metric (plan
# docs/plans/client-core-one-core-three-shells/plan.yml, rule .claude/rules/client-core.md).
# Status enum: ts-only | swift-only | rust-twin | rust-default | rust-only | stays-shell.
# Done = rust-only (old files deleted, shell suite green on the deployed commit) or stays-shell.
# A rust-only cell must not list an existing `old` path; scripts/rust_migration_yaml.py validates this.
# Update the cell and last_commit in the same deploy that moves a capability.
schema_version: 1
as_of: '2026-11-12'
capabilities:
- id: transport
  what: WebSocket/REST connect, auth handshake, reconnect, message routing
  web:
    status: rust-only
    old: []
    unit: ws
    note: WebSocket lifecycle decisions (online, connection change, resume, close, pong timeout, periodic retry) run only in the Worker ws unit; the TypeScript reconnect branches, flag and opt-out are deleted. The socket itself stays in the shell. Received chat frames are also forwarded in order to the shared core (Worker ops ingest_socket_frames and admit_chat via the server-checked session); the TypeScript chat handlers still run beside it until their deletion lane.
    last_commit: c17164fa5b
  apple:
    status: rust-twin
    old:
    - apple/OpenMates/Sources/Core/Networking/WebSocketManager.swift
    - apple/OpenMates/Sources/Core/Networking/APIClient.swift
