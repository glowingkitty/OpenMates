# Curated capability status: one entry per client capability, per shell (web, apple, tui).
# Authoritative source of the migration progress metric (plan
# docs/plans/client-core-one-core-three-shells/plan.yml, rule .claude/rules/client-core.md).
# Status enum: ts-only | swift-only | rust-twin | rust-default | rust-only | stays-shell.
# Done = rust-only (old files deleted, shell suite green on the deployed commit) or stays-shell.
# A rust-only cell must not list an existing `old` path; scripts/rust_migration_yaml.py validates this.
# Update the cell and last_commit in the same deploy that moves a capability.
