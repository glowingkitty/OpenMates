# Web client logic -> Rust: lane plan and live lane status. HAND-CURATED (edit lane
# `status` / `commit` as lanes progress, then run python3 scripts/rust_migration_yaml.py).
# Validated by scripts/rust_migration_yaml.py: every lane has a status; landed lanes name
# a commit; ranks are 1..N; deps resolve to a lane or a slice id.
# status: planned | running | landed.  commit: lowercase hex, required when landed.
# Narrative plan: web-lanes.md. Lane briefs were working files and are not kept in the repo.
# spec_assertions: ids from specifications/generated/assertion-index.yml (validated). spec_gaps: behavior the
# lane moves to Rust that no assertion covers. Specification files are never edited from here.
schema_version: 1
plan_date: 2026-11-07
base_commit: f725997112
goal: Move all web client-side logic into shared Rust in the one shared Worker; Svelte keeps UI/DOM/browser APIs;
  VITE_OPENMATES_RUST_CORE default off; flag-off byte-identical.
units:
  installed:
  - core
  - crypto
  - auth
  - apps
  - embedData
  - embedWrite
  - search
  - transfer
  - sync
  planned: [chatState, ws]
  new_in_wave: [settings, composer, parse]
hot_files:
- frontend/packages/ui/src/services/rustCore/host/sharedWorkerProtocol.ts
- frontend/apps/web_app/src/lib/rustCore/shared/sharedWorkerUnits.ts
- packages/openmates-browser-bindings/src/lib.rs
- packages/openmates-rust/src/lib.rs
- '**/mod.rs'
- config/sdk-capabilities.json
- config/cli-command-catalog.json
- docs/architecture/platforms/rust-migration-status.md
- frontend/packages/ui/src/services/rustCore/sync/syncProtocol.ts
- frontend/packages/ui/src/services/rustCore/crypto/cryptoUnitInstaller.ts
- frontend/packages/ui/src/services/rustCore/auth/authProtocol.ts
- frontend/packages/ui/src/services/rustCore/embeds/embedDataProtocol.ts
- frontend/packages/ui/src/services/rustCore/chatState/chatStateProtocol.ts
- frontend/apps/web_app/src/lib/rustCore/shared/coreUnit.ts
- frontend/packages/ui/src/services/rustCore/workerDispatch.ts
- frontend/apps/web_app/tests/web-rust-core-bench-run.ts
landing_protocol:
- work only in owned and new files
- all hot hunks in one final registry commit
- sessions.py worktree refresh-base, then sessions.py edit-lease acquire --file <hot files>; wait once if held
- regenerate generated files with generators; run the sdk-capabilities matrix validator
- deploy with ONE --only list; wait-deploy; edit-lease release
- simultaneous readiness lands in rank order; new namespaces appended to SHARED_NAMESPACES
- each new namespace proves it does not leak into the flag-off build
gates:
  ci:
  - rust-check
  - rust-wasm
  - vitest
  - sdk-conformance
  - lane e2e flag-on
  - flag-off byte-identical
  bench:
    workers: 1
    wasm_instances: 1
    main_thread_wasm: 0
    verdict: rust_not_worse
    per_reload_memory_growth: none
  perf_budget: wall CI95 upper <= max(+10%, +50 ms); p95 <= +100 ms (+200 ms cold start); CPU CI95 upper <= +15%
