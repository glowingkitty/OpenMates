# Web-app Rust port ledger: which portable TypeScript routes to the shared Rust core
# Worker behind VITE_OPENMATES_RUST_CORE. Curated input; read and validated by
# scripts/rust_web_port_ledger.py (via scripts/rust_migration_yaml.py), which derives
# the web_app percent in overview.yml from it. Procedure: docs/migration/rust/README.md.
#
# Every routing function in scope (a function whose body reads the flag, a flag
# constant or a value imported from a Rust bridge module) must be listed in exactly
# one slice, and every listed function must route; --check fails otherwise.
# Proof is derived per slice: e2e-flag-on when `e2e` names a web-rust-core spec,
# vectors when `vectors` names a parity test, else none. A listed spec says the slice
# has flag-on E2E coverage in the repo, not that its latest run was green.
# `commit: null` means "the commit that adds this entry" (a lane cannot know its own
# hash before deploying); `git log -S'id: <slice id>' -- docs/migration/rust/web-port-ledger.yml` finds it.
schema_version: 1
counting:
  rule: 'code line = non-blank line that is not only a comment. ported = union of the lines of the
    listed functions; a function above full_function_max_code_lines counts only its flag decision
    sites (the flag/bridge statement and its block, including an else block), because one Rust
    decision inside a long TS function does not port the function.'
  full_function_max_code_lines: 80
scope:
  roots:
  - frontend/packages/ui/src/services
  - frontend/packages/ui/src/utils
  - frontend/packages/ui/src/stores
  excluded:
  - {glob: '*/__tests__/*', reason: tests}
  - {glob: '*.test.ts', reason: tests}
  - {glob: '*.d.ts', reason: type declarations}
  bridge:
  - {glob: frontend/packages/ui/src/services/rustCore/*, reason: 'Rust bridge (Worker clients, protocols, installers): new code, not TS logic to port'}
  - {glob: '*Rust.ts', reason: Rust bridge helper}
non_portable:
- glob: frontend/packages/ui/src/services/voiceCall*
  reason: Voice calls are media/WebRTC/audio-API driven; portability survey 2026-11-08 keeps them in TS (supersedes the wave-5 voice row in web-lanes.md).
- glob: frontend/packages/ui/src/services/assistantSpeech*
  reason: Speech playback queue and controller drive the audio APIs in real time; portability survey 2026-11-08.
- glob: frontend/packages/ui/src/services/audioRealtimeTranscription.ts
  reason: Realtime microphone transcription (MediaStream, AudioWorklet).
- glob: frontend/packages/ui/src/utils/audioWaveform.ts
  reason: Audio waveform rendering for the UI.
- glob: frontend/packages/ui/src/utils/spokenWordHighlight.ts
  reason: Spoken-word highlight timing tied to audio playback.
- glob: frontend/packages/ui/src/utils/voiceTranscriptDisplay.ts
  reason: Voice transcript display formatting for the UI.
- glob: frontend/packages/ui/src/utils/embedLinkUtils.ts
  reason: Synchronous link builders called inline by markdown/HTML renderers and Svelte; a Worker hop would make them async (embeds-3 lane declined them).
- glob: frontend/packages/ui/src/utils/internalLinkValidation.ts
  reason: Synchronous link validation called inline from Svelte/markdown rendering.
- glob: frontend/packages/ui/src/stores/i18n.ts
  reason: i18n setup stays in TS (web-lanes.md "Stays in TS").
- glob: frontend/packages/ui/src/stores/theme.ts
  reason: Theme is view state (web-lanes.md "Stays in TS").
- glob: frontend/packages/ui/src/stores/uiFont.ts
  reason: UI font is view state (web-lanes.md "Stays in TS").
- glob: frontend/packages/ui/src/utils/themeDetection.ts
  reason: matchMedia theme detection (browser API).
- glob: frontend/packages/ui/src/utils/clipboardUtils.ts
  reason: Clipboard API (web-lanes.md "Stays in TS").
- glob: frontend/packages/ui/src/services/tracing/*
  reason: OpenTelemetry browser SDK setup and spans.
- glob: frontend/packages/ui/src/services/pushNotificationService.ts
  reason: Push API and service-worker registration (web-lanes.md "Stays in TS").
- glob: frontend/packages/ui/src/stores/pushNotificationStore.ts
  reason: Push permission view state.
- glob: frontend/packages/ui/src/services/e2eTestHooks.ts
  reason: E2E test hooks, not product logic.
- glob: frontend/packages/ui/src/services/*.svelte.ts
  reason: Svelte rune modules.
- glob: frontend/packages/ui/src/utils/chunkErrorHandler.ts
  reason: Vite chunk-load error recovery (bundler/runtime).
- glob: frontend/packages/ui/src/services/passwordV2Worker.ts
  reason: Dedicated worker entry point.
- glob: frontend/packages/ui/src/stores/menuState.ts
  reason: Pure view state.
- glob: frontend/packages/ui/src/stores/panelStateStore.ts
  reason: Pure view state (panel layout).
- glob: frontend/packages/ui/src/stores/uiStateStore.ts
  reason: Pure view state.
- glob: frontend/packages/ui/src/stores/introVideoFullscreenStore.ts
  reason: Pure view state.
- glob: frontend/packages/ui/src/stores/skillStoreExampleFullscreenStore.ts
  reason: Pure view state.
