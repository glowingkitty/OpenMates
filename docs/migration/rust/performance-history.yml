# Rust vs TypeScript web performance history. APPEND-ONLY: never edit or reorder
# existing entries; add new ones with scripts/record_perf_measurement.py after a bench.
# Validated by scripts/rust_perf_history.py (scripts/tests/test_rust_migration_yaml.py).
#
# Field notes:
#   value_kind ratio = rust/ts (1.0 = equal); delta_* = rust minus ts in that unit.
#   ci95 = [low, high] in the unit of value_kind, null when not recorded.
#   verdict_basis reported = verdict taken from the bench/CI output; derived = computed
#   from a ratio CI by the gate rule (upper <= 1.10 wall, 1.15 CPU, else inconclusive;
#   absolute ms are not known here so it never derives rust_worse); none = no verdict.
#   confidence traced = source commit or CI job named; uncertain = taken from a lane
#   summary without a traceable run or with an assumed flow/arm mapping.
#   ci_job / source_commit are lowercase hex prefixes (full ids: test-results/ci-runs).
