        de: {path: shared/events/assets/newsletter/events-newsletter-card_openmates_for_teams.png, alt: OpenMates für Teams Webinar Eventkarte}
  - id: spec-driven-development-webinar-2026-10-28
    slug: spec-driven-development-webinar-2026-10-28
    status: published
    event_type: webinar
    starts_at: "2026-10-28T19:00:00+01:00"
    ends_at: "2026-10-28T19:50:00+01:00"
    timezone: Europe/Berlin
    localized_content:
      en:
        title: Beyond vibe coding - Introduction to spec-driven development
        summary: Learn how plans, tasks, projects, and enforced rules can make agentic coding more reliable and secure.
        description: This presentation and Q&A introduces OpenMates Projects, Plans, and Tasks for structured agentic coding beyond vibe coding, including enforced planning and recommendations for improving development workflows.
      de:
        title: Beyond Vibe Coding - Einstieg in spec-driven development
        summary: Lerne, wie Pläne, Aufgaben, Projekte und erzwungene Regeln agentisches Coding verlässlicher und sicherer machen.
        description: Diese Präsentation mit Q&A stellt OpenMates Projects, Plans und Tasks für strukturiertes agentisches Coding jenseits von Vibe Coding vor, inklusive erzwungener Planung und Empfehlungen zur Verbesserung von Entwicklungsabläufen.
