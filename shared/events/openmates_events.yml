  - id: everyday-workflows-webinar-2026-09-30
    slug: everyday-workflows-webinar-2026-09-30
    status: published
    event_type: webinar
    starts_at: "2026-09-30T19:00:00+02:00"
    ends_at: "2026-09-30T19:50:00+02:00"
    timezone: Europe/Berlin
    localized_content:
      en:
        title: Intro to automating everyday workflows - No coding experience needed
        summary: Learn to automate recurring searches for events, apartments, appointments, news, and other personal or work tasks.
        description: This presentation and Q&A shows how to set up OpenMates workflows within minutes without coding or automation experience, with practical tips and recommendations for improving personal workflows.
      de:
        title: Einstieg in automatisierte Alltags-Workflows - Keine Programmiererfahrung nötig
        summary: Lerne wiederkehrende Suchen nach Events, Wohnungen, Terminen, Nachrichten und anderen persönlichen oder beruflichen Aufgaben zu automatisieren.
        description: Diese Präsentation mit Q&A zeigt, wie OpenMates Workflows in wenigen Minuten ohne Programmier- oder Automatisierungserfahrung eingerichtet werden, inklusive praktischer Tipps zur Verbesserung persönlicher Workflows.
    online_url: https://meet.openmates.org
    luma_url: https://luma.com/fql7sc2a
    openmates_url:
