  - id: openmates-teams-webinar-2026-10-14
    slug: openmates-teams-webinar-2026-10-14
    status: published
    event_type: webinar
    starts_at: "2026-10-14T19:00:00+02:00"
    ends_at: "2026-10-14T19:50:00+02:00"
    timezone: Europe/Berlin
    localized_content:
      en:
        title: OpenMates for teams - Collaborate on projects, AI chats and workflows
        summary: Learn how freelancers and small teams can collaborate on projects, chats, workflows, and tasks with privacy-focused encryption.
        description: This presentation and Q&A introduces the OpenMates teams feature, separation of work and personal data, shared usage credits, and practical recommendations for setting up a small team's workspace.
      de:
        title: OpenMates für Teams - Gemeinsam an Projekten, KI Chats und Workflows arbeiten
        summary: Lerne, wie Freelancer und kleine Teams mit datenschutzorientierter Verschlüsselung an Projekten, Chats, Workflows und Aufgaben zusammenarbeiten können.
        description: Diese Präsentation mit Q&A stellt OpenMates Teams vor, die Trennung von Arbeits- und persönlichen Daten, gemeinsame Nutzungsguthaben und praktische Empfehlungen für einen kleinen Team-Workspace.
    online_url: https://meet.openmates.org
    luma_url: https://luma.com/brp682ie
