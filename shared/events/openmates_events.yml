  - id: cli-sdk-webinar-2026-11-11
    slug: cli-sdk-webinar-2026-11-11
    status: published
    event_type: webinar
    starts_at: "2026-11-11T19:00:00+01:00"
    ends_at: "2026-11-11T19:50:00+01:00"
    timezone: Europe/Berlin
    localized_content:
      en:
        title: OpenMates CLI and SDK for developers - All chats and features included
        summary: Learn to use OpenMates chats, app skills, projects, tasks, workflows, memories, teams, and settings through the CLI and SDKs.
        description: This presentation and Q&A introduces the official OpenMates CLI plus npm and pip SDKs, cross-device access, broad feature parity, and practical recommendations for integrating OpenMates into software workflows.
      de:
        title: OpenMates CLI und SDK für Entwickler - Alle Chats und Features inklusive
        summary: Lerne OpenMates Chats, App Skills, Projekte, Aufgaben, Workflows, Erinnerungen, Teams und Einstellungen per CLI und SDKs zu nutzen.
        description: Diese Präsentation mit Q&A stellt die offizielle OpenMates CLI sowie npm und pip SDKs, Cross-Device-Zugriff, breite Feature-Parität und praktische Empfehlungen zur Integration von OpenMates in Software-Workflows vor.
