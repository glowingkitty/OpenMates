# OpenMates Rust workspace: one lockfile, one build cache, one dependency patch.
# Published package: `openmates` (frontend/packages/openmates-tui-native) - CLI/TUI binary
# plus the SDK re-exported as `openmates::sdk`. The other members are internal.
[workspace]
resolver = "3"
members = [
    "packages/openmates-rust",
    "frontend/packages/openmates-tui-native",
    "packages/openmates-session-bindings",
    "packages/openmates-browser-bindings",
]
exclude = ["packages/third_party"]

[profile.release]
strip = true
lto = "thin"

# Functional CI unit coverage only; never used for release or performance proof.
[profile.ci-unit]
inherits = "release"
lto = false
opt-level = 1

# RUSTSEC-2026-0387: Ristretto255-only voprf/opaque-ke without elliptic-curve/crypto-bigint 0.5.
# See packages/third_party/README.md. Remove once upstream drops elliptic-curve 0.13.
[patch.crates-io]
opaque-ke = { path = "packages/third_party/opaque-ke" }
voprf = { path = "packages/third_party/voprf" }
