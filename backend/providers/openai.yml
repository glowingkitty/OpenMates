# backend/providers/openai.yml
#
# Configuration for OpenAI models via OpenRouter gateway.

provider_id: "openai"
name: "OpenAI"
description: "AI models and services from OpenAI."
logo_svg: "logos/openai.svg" # Path for UI, relative to a common logos directory
privacy_policy: "https://openai.com/policies/privacy-policy/"

required_keys:
  - env_key: "SECRET__OPENAI__API_KEY"
    vault_path: "kv/data/providers/openai"
    vault_key: "api_key"
    description: "OpenAI API key for OpenAI-hosted text and image models."
    setup_url: "https://platform.openai.com/api-keys"
    docs_url: "https://platform.openai.com/docs/quickstart"
optional_keys:
  - env_key: "OPENAI_BASE_URL"
    vault_path: "kv/data/providers/openai"
    vault_key: "base_url"
    description: "Optional OpenAI-compatible base URL override."

models:
  - id: "gpt-image-2"
    name: "GPT Image 2"
    description: "OpenAI's state-of-the-art image generation and editing model with strong prompt adherence, typography, and flexible image sizes."
    country_origin: "US"
    for_app_skill: "images.generate"
    release_date: "2026-04-21"
    allow_auto_select: false
    input_types:
      - text
      - image
    output_types:
      - image
    default_server: "openai"
    servers:
      - id: "openai"
        name: "OpenAI API"
        model_id: "gpt-image-2"
        region: "US"
        country: "US"
    pricing:
      per_unit:
        credits: 320
        unit_name: "image"
    costs:
      text_input_per_million_token:
        price: 5.00
        currency: USD
      image_input_per_million_token:
        price: 8.00
        currency: USD
      cached_text_input_per_million_token:
        price: 1.25
        currency: USD
      cached_image_input_per_million_token:
        price: 2.00
        currency: USD
      image_output_per_million_token:
        price: 30.00
        currency: USD
      per_image:
        price: 0.211
        currency: USD
        source_url: https://platform.openai.com/docs/pricing
        note: High quality 1024x1024 output estimate
  - id: "gpt-6-astra"
    name: "GPT-6 Astra"
    description: "OpenAI's most capable model for complex reasoning, coding, computer use, research, and document creation."
    country_origin: "US"
    for_app_skill: "ai.ask"
    release_date: "2026-09-04"
    capability_level: "max"
    allow_auto_select: true
    reasoning: true
    reasoning_effort: "xhigh"
    search_aliases:
      - "astra"
      - "gpt-6 astra"
      - "gpt-6-astra"
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "openai"
    servers:
      - id: "openai"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "low", MEDIUM: "medium", HIGH: "high", EXTRA_HIGH: "xhigh"}
          source_url: https://developers.openai.com/api/docs/models/gpt-6-astra
        name: "OpenAI API"
        model_id: "gpt-6-astra"
        region: "US"
        country: "US"
