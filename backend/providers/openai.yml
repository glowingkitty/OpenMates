      tokens:
        input:
          per_credit_unit: 66.6666
        cache_read:
          per_credit_unit: 666.6666
        cache_write:
          per_credit_unit: 53.3333
        output:
          per_credit_unit: 13.3333
      context_bands:
        over_272k:
          min_input_tokens: 272001
          eligible_hosts: [openai]
          tokens:
            input: { per_credit_unit: 33.3333 }
            cache_read: { per_credit_unit: 333.3333 }
            cache_write: { per_credit_unit: 26.6666 }
            output: { per_credit_unit: 8.8888 }
    cache_pricing:
      enabled: true
      write_billing: separate
      eligible_hosts: [openai]
      source_url: https://developers.openai.com/api/docs/guides/prompt-caching
      reviewed_on: "2026-11-09"
      status: verified_for_activation
      expires_on: "2026-12-09"
      requires_cache_write_metric: true
    costs:
      input_per_million_token:
        price: 10.00
        currency: USD
        max_context: 1050000
      cached_input_per_million_token:
        price: 1.00
        currency: USD
        max_context: 1050000
      cache_write_per_million_token:
        price: 12.50
        currency: USD
        max_context: 1050000
      output_per_million_token:
        price: 50.00
        currency: USD
        max_context: 1050000
    supplier_cost_profiles:
      openai:
        context_bands:
          over_272k:
            input: 2
            cache_read: 2
            cache_write: 2
            output: 1.5
    features:
      max_output_tokens: 128000
      reasoning_token_support: true
      tool_use: true
      streaming: true

