# backend/providers/mistral.yml
#
# Configuration for Mistral AI services.

provider_id: "mistral"
name: "Mistral AI"
description: "AI models and services from Mistral AI."
logo_svg: "logos/mistral.svg" # Path for UI, relative to logos directory
privacy_policy: "https://legal.mistral.ai/terms/privacy-policy" # verified 2026-05-24

required_keys:
  - env_key: "SECRET__MISTRAL_AI__API_KEY"
    vault_path: "kv/data/providers/mistral_ai"
    vault_key: "api_key"
    description: "Mistral AI API key for Mistral-hosted models."
    setup_url: "https://console.mistral.ai/api-keys/"
    docs_url: "https://docs.mistral.ai/getting-started/quickstart/"

models:
  - id: "mistral-large-4"
    name: "Mistral Large 4"
    description: >-
      Mistral AI's public-preview flagship for reasoning, coding, agentic
      workflows, and multimodal understanding, with a one-million-token context.
    country_origin: "FR"
    for_app_skill: "ai.ask"
    release_date: "2026-10-06"
    capability_level: "high"
    allow_auto_select: true
    reasoning: true
    reasoning_effort: "high"
    search_aliases:
      - "mistral large 4"
      - "ml4"
      - "le chonk"
    input_types: [text, image]
    output_types: [text]
    default_server: "mistral"
    servers:
      - id: "mistral"
        reasoning_control:
          parameter: reasoning_effort
          levels: {HIGH: "high"}
          source_url: https://docs.mistral.ai/studio/conversations/reasoning
        name: "Mistral"
        model_id: "mistral-large-4"
        region: "EU"
        country: "FR"
    # Direct-API supplier rates, verified 2026-11-09:
    # https://docs.mistral.ai/models/mistral-large
    # The page now lists one price ($0.70 / $0.07 cached / $2.10) with no sale
    # label. The earlier $1.36 regular rate and its half-price sale are gone;
    # the sale entry below is kept, closed, for historical receipts.
    pricing:
      tokens:
        input:
          per_credit_unit: 952.3809
        cache_read:
          per_credit_unit: 9523.8095
        output:
          per_credit_unit: 317.4603
    cache_pricing:
      enabled: true
      write_billing: included_in_input
      eligible_hosts: [mistral]
      source_url: https://docs.mistral.ai/models/mistral-large
      reviewed_on: "2026-11-09"
      status: verified_for_activation
      expires_on: "2026-12-09"
    costs:
      input_per_million_token:
        price: 0.70
        currency: USD
        max_context: 1000000
      cached_input_per_million_token:
        price: 0.07
        currency: USD
      output_per_million_token:
        price: 2.10
        currency: USD
        max_context: 1000000
    temporary_prices:
      - id: half-price-sale-2026
        effective_from: '2026-10-14'
        expires_on: '2026-11-08'
        source_url: https://docs.mistral.ai/models/mistral-large
        reviewed_on: '2026-10-14'
        eligible_hosts:
        - mistral
        processing_tier: standard
        pricing:
          tokens:
            input:
              per_credit_unit: 980.3921
            cache_read:
              per_credit_unit: 9523.8095
            output:
              per_credit_unit: 318.9792
        costs:
          input_per_million_token:
            price: 0.68
            currency: USD
            max_context: 1000000
          cached_input_per_million_token:
            price: 0.07
            currency: USD
          output_per_million_token:
            price: 2.09
            currency: USD
            max_context: 1000000
    features:
      tool_use: true
      streaming: true
      agents: true

  - id: "mistral-small-latest" # Official model ID — now points to Mistral Small 4
    name: "Mistral Small 4"
    description: >-
      Mistral AI's efficient hybrid model for everyday chat, coding, vision,
      and tool use. The direct latest alias currently resolves to Small 4.
    country_origin: "FR" # ISO 3166-1 alpha-2 country code for model origin (France)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-03-16" # Mistral Small 4 release date
    capability_level: "low"
    reasoning: true
    reasoning_effort: "none" # Preserve fast utility calls without a thinking phase.
    allow_auto_select: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      lmarena: "mistral-small-latest"
      openrouter: "mistralai/mistral-small-2603"
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "mistral" # Default to direct Mistral API
    servers:
      - id: "mistral"
        reasoning_control:
          parameter: reasoning_effort
          levels: {HIGH: "high"}
          source_url: https://docs.mistral.ai/studio/conversations/reasoning
        name: "Mistral"
        model_id: "mistral-small-latest" # Direct Mistral API model ID
        region: "EU" # Server region for UI display (Mistral is EU-based)
        country: "FR"
      # Google Vertex AI removed — Mistral on Vertex AI requires rawPredict/streamRawPredict
      # endpoint, but our google client uses the Gemini SDK (genai.Client) which only supports
      # Google's own models. This caused 404 NOT_FOUND errors. A dedicated Vertex AI Mistral
      # client (using mistralai[gcp] SDK) would be needed to re-enable this.
      - id: "openrouter"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "high", MEDIUM: "high", HIGH: "high"}
          source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#discovering-per-model-reasoning-options
        name: "OpenRouter"
        # OpenRouter model identifier
        model_id: "mistralai/mistral-small-2603"
        region: "EU" # Server region for UI display
        country: "FR"
    # Full reference for API calls would be "mistral/mistral-small-latest"
    # (or similar based on client)
    pricing: # Current Small 4 API rates: $0.15 input / $0.60 output per million tokens.
      tokens:
        input:
          per_credit_unit: 4444.4444
        cache_read:
          per_credit_unit: 40000
        output:
          per_credit_unit: 1111.1111
    cache_pricing:
      enabled: true
      write_billing: included_in_input
      eligible_hosts: [mistral]
      source_url: https://docs.mistral.ai/studio/conversations/advanced/prompt-caching
      reviewed_on: "2026-11-09"
      status: verified_for_activation
      expires_on: "2026-12-09"
    costs:
      input_per_million_token:
        price: 0.15
        currency: USD
        max_context: 262144 # Max context window.
      cached_input_per_million_token:
        price: 0.015
        currency: USD
      output_per_million_token:
        price: 0.60
        currency: USD
        max_context: 262144

  - id: "mistral-medium-latest" # Official alias — currently Mistral Medium 3.5
    name: "Mistral Medium 3.5"
    description: >-
      Mistral AI's frontier-class multimodal model optimized for agentic and
      coding use cases. Released as open weights under a Modified MIT license.
    country_origin: "FR" # ISO 3166-1 alpha-2 country code for model origin (France)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-04-28" # Mistral Medium 3.5 release date
    capability_level: "medium"
    allow_auto_select: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      lmarena: "mistral-medium-3.5"
      openrouter: "mistralai/mistral-medium-3-5"
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "mistral" # Default to direct Mistral API
    servers:
      - id: "mistral"
        name: "Mistral"
        model_id: "mistral-medium-latest" # Direct Mistral API alias
        region: "EU" # Server region for UI display (Mistral is EU-based)
        country: "FR"
      - id: "openrouter"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "high", MEDIUM: "high", HIGH: "high"}
          source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#discovering-per-model-reasoning-options
        name: "OpenRouter"
        model_id: "mistralai/mistral-medium-3-5" # OpenRouter model identifier
        region: "EU" # Server region for UI display
        country: "FR"
    pricing:
      tokens:
        input:
          per_credit_unit: 444.4444
        cache_read:
          per_credit_unit: 4444.4444
        output:
          per_credit_unit: 88.8888
    cache_pricing:
      enabled: false
      write_billing: included_in_input
      eligible_hosts: [mistral]
      source_url: https://docs.mistral.ai/studio/conversations/advanced/prompt-caching
      reviewed_on: "2026-10-06"
      status: proposed_pending_provider_evidence
    costs:
      input_per_million_token:
        price: 1.50
        currency: USD
        max_context: 256000
      cached_input_per_million_token:
        price: 0.15
        currency: USD
      output_per_million_token:
        price: 7.50
        currency: USD
        max_context: 256000
    features:
      max_output_tokens: 128000
      tool_use: true
      streaming: true
      agents: true

  - id: "voxtral-mini-2602" # Official model ID — Mistral Voxtral Mini audio transcription model
    name: "Voxtral Mini"
    description: >-
      Mistral AI's compact audio transcription model. Converts speech to text
      with high accuracy across multiple languages. Optimised for short voice
      notes and recordings at the lowest cost.
    country_origin: "FR" # ISO 3166-1 alpha-2 country code for model origin (France)
    for_app_skill: "audio.transcribe" # Used by the audio transcription skill
    release_date: "2026-02-26" # voxtral-mini-2602 release date (Feb 2026)
    allow_auto_select: false # Audio model — not for text auto-selection
    input_types:
      - audio
    output_types:
      - text
    default_server: "mistral"
    servers:
      - id: "mistral"
        name: "Mistral"
        model_id: "voxtral-mini-2602"
        region: "EU"
        country: "FR"
    pricing:
      per_minute: 5
    costs:
      per_minute:
        price: 0.003
        currency: USD

  - id: "voxtral-mini-transcribe-realtime-2602"
    name: "Voxtral Mini Realtime"
    description: >-
      Mistral AI's low-latency streaming speech transcription model. Produces
      incremental text while an audio recording is still in progress.
    country_origin: "FR"
    for_app_skill: "audio.transcribe"
    release_date: "2026-02-04"
    allow_auto_select: false
    input_types:
      - audio
    output_types:
      - text
    default_server: "mistral"
    servers:
      - id: "mistral"
        name: "Mistral"
        model_id: "voxtral-mini-transcribe-realtime-2602"
        region: "EU"
        country: "FR"
    pricing:
      per_minute: 10
    costs:
      per_minute:
        price: 0.006
        currency: USD

  - id: "voxtral-mini-transcribe-realtime-3-0"
    name: "Voxtral Realtime Transcribe 3"
    description: "Voxtral 3 streaming speech transcription for message input."
    country_origin: "FR"
    for_app_skill: "audio.transcribe"
    release_date: "2026-10-20"
    allow_auto_select: false
    input_types: [audio]
    output_types: [text]
    default_server: "mistral"
    servers:
      - {id: "mistral", name: "Mistral", model_id: "voxtral-mini-transcribe-realtime-3-0", region: "EU", country: "FR"}
    pricing: {per_minute: 15}
    costs:
      per_minute: {price: 0.008, currency: USD}

  - id: "voxtral-mini-tts-3-0"
    name: "Voxtral TTS 3"
    description: "Mistral speech synthesis for private assistant-message playback."
    country_origin: "FR"
    for_app_skill: "assistant_response_speech.segment"
    release_date: "2026-10-20"
    allow_auto_select: false
    input_types: [text]
    output_types: [audio]
    default_server: "mistral"
    servers:
      - {id: "mistral", name: "Mistral", model_id: "voxtral-mini-tts-3-0", region: "EU", country: "FR"}
    pricing: {per_million_characters: 19500}
    costs:
      per_million_characters: {price: 13, currency: USD}

# Customer pricing: every `pricing` value is derived from `costs` (supplier USD)
# as cost x (1 + pricing.margin_percent in backend/config/backend_config.yml),
# rounded up to 5-credit steps (1 credit = $0.001). Regenerate with
# `python3 scripts/derive_customer_prices.py --write`; tests fail on drift.
