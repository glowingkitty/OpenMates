# backend/providers/elevenlabs.yml
#
# ElevenLabs provider metadata for OpenMates audio generation skills.

provider_id: "elevenlabs"
name: "ElevenLabs"
description: "AI audio generation and text-to-speech provider used for short OpenMates audio app skills."
logo_svg: "logos/elevenlabs.svg"
privacy_policy: "https://elevenlabs.io/privacy-policy"

required_keys:
  - env_key: "SECRET__ELEVENLABS__API_KEY"
    vault_path: "kv/data/providers/elevenlabs"
    vault_key: "api_key"
    description: "ElevenLabs API key for sound-effect and text-to-speech generation."
    setup_url: "https://elevenlabs.io/app/settings/api-keys"
    docs_url: "https://elevenlabs.io/docs/api-reference/introduction"

models:
  - id: "eleven_text_to_sound_v2"
    name: "ElevenLabs Text to Sound v2"
    description: "Short sound-effect generation model used by audio.generate."
    country_origin: "US"
    for_app_skill: "audio.generate"
    input_types:
      - text
    output_types:
      - audio
    default_server: "elevenlabs"
    servers:
      - id: "elevenlabs"
        name: "ElevenLabs"
        model_id: "eleven_text_to_sound_v2"
        region: "US"
    pricing:
      per_second: 20
    costs:
      output_per_second:
        price: 0.00727
        currency: USD
        source: "ElevenLabs Creator plan: $22 for 121,000 credits; duration-specified sound effects cost 40 ElevenLabs credits/second."
    features:
      min_duration_seconds: 0.5
      max_duration_seconds: 30

  - id: "eleven_flash_v2_5"
    name: "ElevenLabs Flash v2.5"
    description: "Low-latency, lower-cost text-to-speech model available when explicitly selected by audio.speak."
    country_origin: "US"
    for_app_skill: "audio.speak"
    input_types:
      - text
    output_types:
      - audio
    default_server: "elevenlabs"
    servers:
      - id: "elevenlabs"
        name: "ElevenLabs"
        model_id: "eleven_flash_v2_5"
        region: "US"
    pricing:
      per_second: 2
    costs:
      output_per_second:
        price: 0.000833
        currency: USD
        source: "ElevenLabs API pricing lists Flash/Turbo TTS at roughly $0.05/minute."
    features:
      max_input_characters: 2000

  - id: "eleven_multilingual_v2"
    name: "ElevenLabs Multilingual v2"
    description: "Stable multilingual text-to-speech model available when explicitly selected by audio.speak."
    country_origin: "US"
    for_app_skill: "audio.speak"
    input_types:
      - text
    output_types:
      - audio
    default_server: "elevenlabs"
    servers:
      - id: "elevenlabs"
        name: "ElevenLabs"
        model_id: "eleven_multilingual_v2"
        region: "US"
    pricing:
      per_second: 4
    costs:
      output_per_second:
        price: 0.001667
        currency: USD
        source: "ElevenLabs API pricing lists Multilingual v2/v3 TTS at roughly $0.10/minute."
    features:
      max_input_characters: 2000

  - id: "eleven_v3"
    name: "Eleven v3"
    description: "Highest-quality expressive multilingual text-to-speech model used as the default by audio.speak."
    country_origin: "US"
    for_app_skill: "audio.speak"
    input_types:
      - text
    output_types:
      - audio
    default_server: "elevenlabs"
    servers:
      - id: "elevenlabs"
        name: "ElevenLabs"
        model_id: "eleven_v3"
        region: "US"
    pricing:
      per_second: 4
    costs:
      output_per_second:
        price: 0.001667
        currency: USD
        source: "ElevenLabs API pricing lists v3 TTS at roughly $0.10/minute."
    features:
      max_input_characters: 2000

  - id: "eleven_v3_conversational"
    name: "Eleven v3 Conversational"
    description: "Lower-latency Eleven v3 variant used only for progressive assistant-response speech."
    country_origin: "US"
    for_app_skill: "assistant_response_speech.segment"
    input_types:
      - text
    output_types:
      - audio
    default_server: "elevenlabs"
    servers:
      - id: "elevenlabs"
        name: "ElevenLabs"
        model_id: "eleven_v3_conversational"
        region: "US"
    pricing:
      per_second: 2
    costs:
      output_per_second:
        price: 0.000833
        currency: USD
        source: "ElevenLabs API pricing lists Eleven v3 Conversational at $0.05 per 1,000 characters; this duration value is approximate metadata only."
    features:
      max_input_characters: 2000
