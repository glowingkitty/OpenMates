# backend/providers/alibaba.yml
# Alibaba provider config (Qwen models).
# Qwen models can be accessed directly via Cerebras API or via OpenRouter (as fallback).

provider_id: "alibaba"
name: "Alibaba"
description: "Alibaba Cloud AI - Qwen models"
logo_svg: "logos/alibaba.svg"
privacy_policy: "https://www.alibabacloud.com/help/en/legal/latest/alibaba-cloud-international-website-privacy-policy"

optional_keys:
  - env_key: "SECRET__CEREBRAS__API_KEY"
    vault_path: "kv/data/providers/cerebras"
    vault_key: "api_key"
    description: "Optional Cerebras gateway key for Qwen model hosting."
  - env_key: "SECRET__OPENROUTER__API_KEY"
    vault_path: "kv/data/providers/openrouter"
    vault_key: "api_key"
    description: "Optional OpenRouter fallback key for Qwen model hosting."

models:
  - id: "qwen-3.8-27b"
    name: "Qwen 3.8 27B"
    description: "Qwen 3.8 27B dense multimodal model served through Cerebras for fast everyday chat, coding, research, and tool use."
    country_origin: "CN"
    for_app_skill: "ai.ask"
    release_date: "2026-08-14"
    capability_level: "low"
    allow_auto_select: false
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "cerebras"
    servers:
      - id: "cerebras"
        name: "Cerebras"
        model_id: "qwen-3.8-27b"
        region: "US"
        country: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 675
        output:
          per_credit_unit: 450
    costs:
      input_per_million_token:
        price: 0.99
        currency: USD
        max_context: 131000
      output_per_million_token:
        price: 1.49
        currency: USD
        max_context: 131000
    features:
      max_output_tokens: 40000
      tool_use: true
      streaming: true
