# Jev is a bounded decision model used for workflow authoring, not chat generation.
provider_id: "typesafe"
name: "TypeSafe"
description: "Bounded decision models served directly by TypeSafe with OpenRouter fallback."
privacy_policy: "https://typesafe.ai/legal/privacy-policy" # verified 2026-10-06

models:
  - id: "jev-1.13"
    name: "Jev 1.13"
    description: "Workflow authoring capability and target selection."
    for_app_skill: "workflows.create-or-modify"
    allow_auto_select: false
    input_types:
      - text
    output_types:
      - text
    default_server: "typesafe"
    servers:
      - id: "typesafe"
        name: "TypeSafe"
        model_id: "jev-1.13.0"
        region: "US"
      - id: "openrouter"
        name: "OpenRouter"
        model_id: "typesafe/jev-1.13"
        region: "global"
    pricing:
      tokens:
        input:
          per_credit_unit: 7900 # $0.042/M input using the standard 3x markup and rounding.
        output:
          per_credit_unit: 0 # Provider output is free.
    costs:
      input_per_million_token:
        price: 0.042
        currency: USD
      output_per_million_token:
        price: 0
        currency: USD
