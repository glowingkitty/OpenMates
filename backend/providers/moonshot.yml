# backend/providers/moonshot.yml
# Moonshot AI provider configuration (Kimi models).
# Kimi models can be accessed via Together AI API; older K2 models keep OpenRouter fallback.

provider_id: "moonshot"
name: "Moonshot AI"
description: "Moonshot AI - Kimi multimodal thinking and agent models"
logo_svg: "logos/moonshot.svg"
privacy_policy: "https://platform.kimi.ai/docs/agreement/userprivacy"

optional_keys:
  - env_key: "SECRET__TOGETHER__API_KEY"
    vault_path: "kv/data/providers/together"
    vault_key: "api_key"
    description: "Optional Together AI gateway key for Kimi model hosting."
  - env_key: "SECRET__OPENROUTER__API_KEY"
    vault_path: "kv/data/providers/openrouter"
    vault_key: "api_key"
    description: "Optional OpenRouter fallback key for Kimi model hosting."

models:
  - id: "kimi-k2.6"
    name: "Kimi K2.6"
    description: "Kimi K2.6 is Moonshot AI's next-generation multimodal model, designed for long-horizon coding, coding-driven UI/UX generation, and multi-agent orchestration. Features improved reasoning, 262K context window, and enhanced tool-calling capabilities over K2.5. Primary: Together AI; Fallback: OpenRouter."
    country_origin: "CN" # ISO 3166-1 alpha-2 country code for model origin (China)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-04-28" # Model release date (Kimi K2.6)
    capability_level: "medium"
    allow_auto_select: true
    reasoning: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      lmarena: "kimi-k2.6"
      openrouter: "moonshotai/kimi-k2.6"
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "together" # Default to Together AI for serverless inference
    servers:
      - id: "together"
        name: "Together AI"
        model_id: "moonshotai/Kimi-K2.6" # Together AI model identifier (primary)
        region: "US" # Server region for UI display
        country: "US"
      - id: "openrouter"
        name: "OpenRouter"
        model_id: "moonshotai/kimi-k2.6" # OpenRouter's model identifier (fallback)
        region: "US" # Server region for UI display
        country: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 555.5555
        output:
          per_credit_unit: 148.1481
    costs:
      input_per_million_token:
        price: 1.20
        currency: USD
        max_context: 262144
      output_per_million_token:
        price: 4.50
        currency: USD
        max_context: 262144
      cached_input_per_million_token:
        price: 0.2
        currency: USD
        # Supplier-only cost; no customer cache policy is activated.
        # Reviewed 2026-10-14: https://www.together.ai/models/kimi-k26
    features:
      knowledge_cutoff: "2026-03"
      max_output_tokens: 262144
      tool_use: true
      streaming: true

  - id: "kimi-k2.7-code"
    name: "Kimi K2.7 Code"
    description: "Kimi K2.7 Code is Moonshot AI's coding-focused agent model for long-horizon software engineering tasks. Features a 1T-parameter MoE architecture with 32B activated parameters, 256K context window, tool use, and improved token efficiency over K2.6. Primary: Together AI; Fallback: OpenRouter."
    country_origin: "CN" # ISO 3166-1 alpha-2 country code for model origin (China)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-06-12" # Model release date from OpenRouter/Hugging Face listing
    capability_level: "high"
    allow_auto_select: true
    reasoning: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      together: "moonshotai/Kimi-K2.7-Code"
      openrouter: "moonshotai/kimi-k2.7-code"
    input_types:
      - text
    output_types:
      - text
    default_server: "together" # Default to Together AI for serverless inference
    servers:
      - id: "together"
        name: "Together AI"
        model_id: "moonshotai/Kimi-K2.7-Code"
        region: "US" # Server region for UI display
        country: "US"
      - id: "openrouter"
        name: "OpenRouter"
        model_id: "moonshotai/kimi-k2.7-code"
        region: "US" # Server region for UI display (fallback)
        country: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 701.7543
        output:
          per_credit_unit: 166.6666
    costs:
      input_per_million_token:
        price: 0.95
        currency: USD
        max_context: 262144
      output_per_million_token:
        price: 4.00
        currency: USD
        max_context: 262144
      cached_input_per_million_token:
        price: 0.19
        currency: USD
        # Supplier-only cost; no customer cache policy is activated.
        # Reviewed 2026-10-14: https://www.together.ai/models/kimi-k27-code
    features:
      knowledge_cutoff: "2026-06"
      max_output_tokens: 262144
      tool_use: true
      streaming: true

  - id: "kimi-k3"
    name: "Kimi K3"
    description: "Kimi K3 is Moonshot AI's 2.8T-parameter open-weights MoE model with native vision, a 1M-token context window, and reasoning for long-horizon coding and knowledge work. Primary: Together AI."
    country_origin: "CN" # ISO 3166-1 alpha-2 country code for model origin (China)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-07-27" # Together AI serverless availability / open-weights release
    capability_level: "high"
    allow_auto_select: true
    reasoning: true
    external_ids: # Mapping to external leaderboard/provider IDs for cross-referencing
      together: "moonshotai/Kimi-K3"
    input_types:
      - text
      - image
    output_types:
      - text
    default_server: "together" # Default to Together AI for serverless inference
    servers:
      - id: "together"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "low", MEDIUM: "high", HIGH: "high", EXTRA_HIGH: "max"}
          source_url: https://www.together.ai/blog/kimi-k3-guide
        name: "Together AI"
        model_id: "moonshotai/Kimi-K3"
        region: "US" # Server region for UI display
        country: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 222.2222
        output:
          per_credit_unit: 44.4444
    costs:
      input_per_million_token:
        price: 3.00
        currency: USD
        max_context: 1000000
      cached_input_per_million_token:
        price: 0.30
        currency: USD
        max_context: 1000000
      output_per_million_token:
        price: 15.00
        currency: USD
        max_context: 1000000
    features:
      knowledge_cutoff: "2026-07"
      max_output_tokens: 1000000
      tool_use: true
      streaming: true

# Customer pricing: every `pricing` value is derived from `costs` (supplier USD)
# as cost x (1 + pricing.margin_percent in backend/config/backend_config.yml),
# rounded up to 5-credit steps (1 credit = $0.001). Regenerate with
# `python3 scripts/derive_customer_prices.py --write`; tests fail on drift.
