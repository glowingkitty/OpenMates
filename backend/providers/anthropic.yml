# backend/providers/anthropic.yml
#
# Configuration for Anthropic AI services.

provider_id: "anthropic"
name: "Anthropic"
description: "AI models and services from Anthropic, including Claude family models."
logo_svg: "logos/anthropic.svg" # Path for UI, relative to a common logos directory
privacy_policy: "https://www.anthropic.com/legal/privacy"

required_keys:
  - env_key: "SECRET__ANTHROPIC__API_KEY"
    vault_path: "kv/data/providers/anthropic"
    vault_key: "api_key"
    description: "Anthropic API key for Claude-family model access."
    setup_url: "https://console.anthropic.com/settings/keys"
    docs_url: "https://docs.anthropic.com/en/api/getting-started"

models:
  - id: "claude-fable-5-1" # Official Claude API model ID
    name: "Claude Fable 5.1"
    description: "Anthropic's latest max-capability model for demanding reasoning and long-horizon agentic work."
    country_origin: "US"
    for_app_skill: "ai.ask"
    release_date: "2026-09-01"
    capability_level: "max"
    allow_auto_select: true
    external_ids:
      lmarena: "claude-fable-5-1"
      openrouter: "anthropic/claude-fable-5-1"
    search_aliases:
      - "fable 5.1"
      - "claude 5.1 fable"
      - "claude-fable-5-1"
      - "best claude"
    input_types:
      - text
      - image
    output_types:
      - text
    reasoning: true
    default_server: "anthropic"
    servers:
      - id: "anthropic"
        name: "Anthropic API"
        model_id: "claude-fable-5-1"
        region: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 35
        cache_read:
          per_credit_unit: 1400
        cache_write:
          per_credit_unit: 28
        cache_write_1h:
          per_credit_unit: 17
        output:
          per_credit_unit: 7
    cache_pricing:
      enabled: false
      write_billing: separate
      eligible_hosts: [anthropic]
      source_url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
      reviewed_on: "2026-10-06"
      status: proposed_pending_provider_evidence
      requires_cache_write_metric: true
      requires_cache_retention_metric: true
    costs:
      input_per_million_token:
        price: 10.00
        currency: USD
        max_context: 1000000
      output_per_million_token:
        price: 50.00
        currency: USD
        max_context: 1000000
      cache_write_per_million_token:
        price: 12.50
        currency: USD
      cache_write_1h_per_million_token:
        price: 20.0
        currency: USD
      cache_read_per_million_token:
        price: 0.25
        currency: USD
    features:
      max_output_tokens: 128000
      reasoning_token_support: true
      tool_use: true
      streaming: true

  - id: "claude-opus-5-5" # Official Claude API model ID
    name: "Claude Opus 5.5"
    description: "Anthropic's high-capability model for long-running agentic coding and knowledge work."
    country_origin: "US"
    for_app_skill: "ai.ask"
    release_date: "2026-09-22"
    capability_level: "high"
    allow_auto_select: true
    search_aliases:
      - "opus 5.5"
      - "claude 5.5 opus"
      - "claude-opus-5-5"
    input_types:
      - text
      - image
    output_types:
      - text
    reasoning: true
    default_server: "anthropic"
    servers:
      - id: "anthropic"
        name: "Anthropic API"
        model_id: "claude-opus-5-5"
        region: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 80 # 333.33 / 4.00 = 83.33 -> 80 (conservative round-down)
        cache_read:
          per_credit_unit: 1600
        cache_write:
          per_credit_unit: 64
        cache_write_1h:
          per_credit_unit: 40
        output:
          per_credit_unit: 15 # 333.33 / 20.00 = 16.67 -> 15 (conservative round-down)
    cache_pricing:
      enabled: false
      write_billing: separate
      eligible_hosts: [anthropic]
      source_url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
      reviewed_on: "2026-10-06"
      status: proposed_pending_provider_evidence
      requires_cache_write_metric: true
      requires_cache_retention_metric: true
    costs:
      input_per_million_token:
        price: 4.00
        currency: USD
        max_context: 1000000
      output_per_million_token:
        price: 20.00
        currency: USD
        max_context: 1000000
      cache_write_per_million_token:
        price: 5.00
        currency: USD
      cache_write_1h_per_million_token:
        price: 8.0
        currency: USD
      cache_read_per_million_token:
        price: 0.20
        currency: USD
    features:
      max_output_tokens: 128000
      reasoning_token_support: true
      tool_use: true
      streaming: true

  - id: "claude-sonnet-5-5" # Official Claude API model ID
    name: "Claude Sonnet 5.5"
    description: "The best combination of speed and intelligence, with adaptive thinking and 1M-token context."
    country_origin: "US"
    for_app_skill: "ai.ask"
    release_date: "2026-09-28"
    capability_level: "medium"
    allow_auto_select: true
    external_ids:
      lmarena: "claude-sonnet-5-5"
      openrouter: "anthropic/claude-sonnet-5-5"
    search_aliases:
      - "sonnet 5.5"
      - "claude 5.5 sonnet"
      - "claude-sonnet-5-5"
    input_types:
      - text
      - image
    output_types:
      - text
    reasoning: true
    default_server: "anthropic"
    servers:
      - id: "anthropic"
        name: "Anthropic API"
        model_id: "claude-sonnet-5-5"
        region: "US"
    pricing:
      tokens:
        input:
          per_credit_unit: 170
        cache_read:
          per_credit_unit: 3400
        cache_write:
          per_credit_unit: 136
        cache_write_1h:
          per_credit_unit: 85
        output:
          per_credit_unit: 35
    # Pricing verified 2026-10-08 against the official Sonnet 5.5 model card.
    cache_pricing:
      enabled: true
      write_billing: separate
      eligible_hosts: [anthropic]
      source_url: https://platform.claude.com/docs/en/models/sonnet-5-5/overview
      reviewed_on: "2026-10-08"
      status: verified_for_activation
      expires_on: "2026-11-08"
      requires_cache_write_metric: true
      requires_cache_retention_metric: true
      cache_write_1h_hosts: [] # Current direct-API controls create only 5m entries.
    costs:
      input_per_million_token:
        price: 2.00
        currency: USD
        max_context: 1000000
      output_per_million_token:
        price: 10.00
        currency: USD
        max_context: 1000000
      cache_write_per_million_token:
        price: 2.50
        currency: USD
      cache_write_1h_per_million_token:
        price: 4.0
        currency: USD
      cache_read_per_million_token:
        price: 0.10
        currency: USD
    features:
      max_output_tokens: 128000
      reasoning_token_support: true
      tool_use: true
      streaming: true

