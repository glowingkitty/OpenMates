# backend/providers/zai.yml
# Z.ai provider config (GLM models).
# GLM models use Mistral, OpenRouter, or AWS Bedrock according to their version.
---
provider_id: "zai"
name: "Z.ai"
description: "Z.ai - GLM large language models"
logo_svg: "logos/zai.svg"
privacy_policy: "https://docs.z.ai/legal-agreement/privacy-policy"

optional_keys:
  - env_key: "SECRET__MISTRAL_AI__API_KEY"
    vault_path: "kv/data/providers/mistral_ai"
    vault_key: "api_key"
    description: "Mistral API key for the default GLM 5.3 host."
  - env_key: "SECRET__OPENROUTER__API_KEY"
    vault_path: "kv/data/providers/openrouter"
    vault_key: "api_key"
    description: "Optional OpenRouter fallback key for GLM model hosting."

models:
  - id: "zai-glm-5.3"
    name: "GLM 5.3"
    description: >-
      Z.ai's long-context reasoning model for coding and agentic workflows,
      hosted by Mistral in the EU with a one-million-token context.
    country_origin: "CN"
    for_app_skill: "ai.ask"
    release_date: "2026-09-15"
    capability_level: "high"
    allow_auto_select: true
    reasoning: true
    reasoning_effort: "high"
    input_types: [text]
    output_types: [text]
    default_server: "mistral"
    servers:
      - id: "mistral"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "low", MEDIUM: "high", HIGH: "high", EXTRA_HIGH: "max"}
          source_url: https://docs.mistral.ai/studio/conversations/reasoning
        name: "Mistral"
        model_id: "zai-glm-5-3"
        region: "EU"
    # Mistral direct-API rates, verified 2026-10-10:
    # https://docs.mistral.ai/models/zai-glm-5-3
    pricing:
      tokens:
        input:
          per_credit_unit: 238 # About 3x $1.40/M at $0.001 per credit.
        cache_read:
          per_credit_unit: 2380 # About 3x $0.14/M.
        output:
          per_credit_unit: 75 # About 3x $4.40/M, including reasoning tokens.
    cache_pricing:
      enabled: true
      write_billing: included_in_input
      eligible_hosts: [mistral]
      source_url: https://docs.mistral.ai/models/zai-glm-5-3
      reviewed_on: "2026-10-10"
      status: verified_for_activation
      expires_on: "2026-11-10"
    costs:
      input_per_million_token:
        price: 1.40
        currency: USD
        max_context: 1048576 # Confirmed by Mistral's authenticated /v1/models catalog.
      cached_input_per_million_token:
        price: 0.14
        currency: USD
      output_per_million_token:
        price: 4.40
        currency: USD
        max_context: 1048576
    features:
      max_output_tokens: 128000
      tool_use: true
      streaming: true

  - id: "zai-glm-5.2"
    name: "GLM 5.2"
    description: "Z.ai GLM 5.2 - large-scale reasoning model with a 1M-token context window for long-horizon agent workflows and project-level software engineering. Served via OpenRouter."
    country_origin: "CN" # ISO 3166-1 alpha-2 country code for model origin (China)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-06-16" # OpenRouter catalog created date
    capability_level: "high"
    allow_auto_select: true
    reasoning: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      openrouter: "z-ai/glm-5.2"
    input_types:
      - text
    output_types:
      - text
    default_server: "openrouter"
    servers:
      - id: "openrouter"
        reasoning_control:
          parameter: reasoning_effort
          levels: {LOW: "high", MEDIUM: "high", HIGH: "high", EXTRA_HIGH: "xhigh"}
          source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#discovering-per-model-reasoning-options
        name: "OpenRouter"
        model_id: "z-ai/glm-5.2"
        region: "US" # Server region for UI display
    pricing:
      tokens:
        input:
          per_credit_unit: 275 # Based on $1.20/M input (OpenRouter): 333.33 / 1.20 = 277.8, rounded down
        output:
          per_credit_unit: 80 # Based on $4.10/M output (OpenRouter): 333.33 / 4.10 = 81.3, rounded down
    costs:
      input_per_million_token:
        price: 1.20
        currency: USD
        max_context: 1048576
      output_per_million_token:
        price: 4.10
        currency: USD
        max_context: 1048576
      cache_read_per_million_token:
        price: 0.20
        currency: USD
    features:
      max_output_tokens: 131072
      tool_use: true
      streaming: true

  - id: "zai-glm-4.7"
    name: "GLM 4.7"
    description: "Z.ai GLM 4.7 - reasoning and general-purpose text generation."
    country_origin: "CN" # ISO 3166-1 alpha-2 country code for model origin (China)
    for_app_skill: "ai.ask" # This model is for the AI ask skill (text generation)
    release_date: "2026-01-06" # Cerebras public preview availability date
    capability_level: "medium"
    allow_auto_select: true
    external_ids: # Mapping to external leaderboard IDs for cross-referencing
      lmarena: "glm-4.7"
      openrouter: "z-ai/glm-4.7"
    input_types:
      - text
    output_types:
      - text
    # Cerebras retired this route on 2026-08-17; production received archived-model 404s.
    # https://inference-docs.cerebras.ai/support/deprecation
    default_server: "aws_bedrock"
    servers:
      - id: "aws_bedrock"
        name: "AWS Bedrock"
        model_id: "zai.glm-4.7-flash" # Bedrock model ID
        aws_region: "eu-central-1"
        region: "EU"
      - id: "openrouter"
        name: "OpenRouter"
        model_id: "z-ai/glm-4.7" # OpenRouter fallback
        region: "US" # Server region for UI display
    pricing:
      tokens:
        input:
          per_credit_unit: 150
        output:
          per_credit_unit: 120
    costs:
      input_per_million_token:
        price: 2.25
        currency: USD
        max_context: 131000
      output_per_million_token:
        price: 2.75
        currency: USD
        max_context: 131000
    features:
      max_output_tokens: 40000
      tool_use: true
      streaming: true
