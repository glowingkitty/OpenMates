landing:
  enabled: false

name_translation_key: jobs
description_translation_key: jobs.description
icon_image: jobs.svg
category: work
last_updated: "2026-10-13"
embed_types:
  - id: search
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: job_result
    child_frontend_type: jobs-job-result
    groupable: true
    preview_component: jobs/JobsSearchEmbedPreview.svelte
    fullscreen_component: jobs/JobsSearchEmbedFullscreen.svelte
    child_preview_component: jobs/JobsResultEmbedPreview.svelte
    child_fullscreen_component: jobs/JobsResultEmbedFullscreen.svelte
    icon: search
    gradient_var: "--color-app-jobs"
    i18n_namespace: embeds.jobs.search
    content_fields:
      - {name: query, type: string}
      - {name: country, type: string}
      - {name: countries, type: object}
      - {name: provider, type: string}
      - {name: providers, type: object}
      - {name: result_count, type: number}
      - {name: embed_ids, type: object}
      - {name: preview_results, type: object}
  - id: job_result
    authoring:
      kind: jobs.job_result
      schema_id: jobs.job_result
    category: direct
    frontend_type: jobs-job-result
    backend_type: job_result
    has_children: false
    preview_component: jobs/JobsResultEmbedPreview.svelte
    fullscreen_component: jobs/JobsResultEmbedFullscreen.svelte
    icon: jobs
    gradient_var: "--color-app-jobs"
    i18n_namespace: embeds.jobs.search.result
    content_fields:
      - {name: id, type: string, required: true}
      - {name: title, type: string, required: true}
      - {name: company, type: string}
      - {name: url, type: string, required: true}
      - {name: apply_url, type: string}
      - {name: location, type: string}
      - {name: country, type: string}
      - {name: remote, type: boolean}
      - {name: employment_type, type: string}
      - {name: published_at, type: string}
      - {name: description, type: string}
      - {name: sector, type: string}
      - {name: role, type: string}
      - {name: seniority, type: string}
      - {name: organization_type, type: string}
      - {name: work_arrangement, type: string}
      - {name: salary_text, type: string}
      - {name: valid_through, type: string}
      - {name: impact, type: string}
      - {name: detail_status, type: string}
      - {name: salary_min, type: number}
      - {name: salary_max, type: number}
      - {name: salary_currency, type: string}
      - {name: salary_period, type: string}
      - {name: provider, type: string, required: true}
skills:
  - id: search
    anonymous_access: inline
    name_translation_key: app_skills.jobs.search
    description_translation_key: app_skills.jobs.search.description
    icon_image: search.svg
    api_config:
      expose_get: false
      expose_post: true
    external_data: true
    preprocessor_hint: >
      Search current Swedish job listings using JobTech. Germany is unavailable.
      Preserve country, remote, employment and age filters. Radius
      search is unavailable. Use relevance_criteria only for an explicit user goal.
      Never invent listing facts or broaden filters after empty results.
    class_path: backend.apps.jobs.skills.search_skill.SearchSkill
    pricing:
      per_unit:
        credits: 1
        unit_name: search
    providers:
      - {name: JobTech, no_api_key: true}
    tool_schema:
      type: object
      properties:
        countries:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          default: [DE]
          items: {type: string, enum: [DE, SE]}
          x-ui: {basic: true}
          description: Select SE for the available source. DE remains accepted but returns an explicit coverage gap.
        requests:
          type: array
          minItems: 1
          maxItems: 5
          x-ui: {basic: true}
          description: Independent job searches; each retains its own filters and result group.
          items:
            type: object
            properties:
              id:
                type: string
                x-ui: {basic: false}
                description: Optional request ID for matching batch results.
              query:
                type: string
                minLength: 1
                maxLength: 400
                x-ui: {basic: true}
                description: Job role or topic, such as "climate policy analyst".
              country:
                type: string
                enum: [DE, SE]
                x-ui: {basic: false}
                description: Legacy singleton country override; DE is unavailable. Do not combine with countries.
              countries:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items: {type: string, enum: [DE, SE]}
                x-ui: {basic: false}
                description: Override top-level countries for this request; do not combine with country.
              location:
                type: string
                x-ui: {basic: true, control: location}
                description: Optional city or place named by the user.
              radius_km:
                type: integer
                minimum: 1
                maximum: 200
                x-ui: {basic: false}
                description: >
                  Radius in km around location. Requires location and is currently
                  unavailable from the configured providers.
              remote:
                type: boolean
                x-ui: {basic: true}
                description: >
                  Omit unless the user asks for remote or on-site work. A true
                  result requires explicit full-remote evidence, not just possible home office.
              employment_type:
                type: string
                enum: [full_time, part_time, internship, contract, apprenticeship]
                x-ui: {basic: false}
                description: Optional employment type explicitly requested by the user.
              max_days_old:
                type: integer
                minimum: 1
                maximum: 3650
                x-ui: {basic: false}
                description: Maximum age in days; undated listings are excluded.
              limit:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
                x-ui: {basic: true}
                description: Maximum final results for this request.
              provider:
                type: string
                enum: [auto, JobTech]
                x-ui: {basic: false}
                description: One explicit source, overriding auto country routing.
              providers:
                type: array
                items: {type: string, enum: [JobTech]}
                x-ui: {basic: false}
                description: Explicit source list; do not mix with provider or auto.
              relevance_criteria:
                type: string
                maxLength: 1000
                x-ui: {basic: true}
                description: >
                  Optional user-stated career or impact goal that should change ranking.
                  Use only explicit listing evidence; omit for a neutral search.
            required: [query]
      required: [requests]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        countries: [DE]
        requests:
          - {query: software engineer, limit: 3}
      output_schema:
        type: object
        properties:
          summary: {type: string, x-ui: {basic: false}}
          success: {type: boolean, x-ui: {basic: false}}
          partial: {type: boolean, x-ui: {basic: false}}
          result_count: {type: integer, x-ui: {basic: true}}
          provider: {type: string, x-ui: {basic: false}}
          providers: {type: array, items: {type: string}, x-ui: {basic: false}}
          error: {type: string, x-ui: {basic: false}}
          warnings:
            type: array
            x-ui: {basic: false}
            items:
              type: object
              properties:
                request_id: {type: string}
                provider: {type: string}
                country: {type: string}
                code: {type: string}
                message: {type: string}
          results:
            type: array
            x-ui: {basic: true}
            description: Flat, deduplicated job listings for downstream workflow nodes.
            items: &jobs_listing_schema
              type: object
              properties:
                id: {type: string, x-ui: {basic: false}}
                title: {type: string, x-ui: {basic: true}}
                company: {type: [string, 'null'], x-ui: {basic: true}}
                url: {type: string, format: uri, x-ui: {basic: true}}
                apply_url: {type: [string, 'null'], format: uri, x-ui: {basic: false}}
                location: {type: [string, 'null'], x-ui: {basic: true}}
                country: {type: string, x-ui: {basic: false}}
                remote: {type: [boolean, 'null'], x-ui: {basic: true}}
                employment_type: {type: [string, 'null'], x-ui: {basic: false}}
                published_at: {type: [string, 'null'], x-ui: {basic: false}}
                description: {type: [string, 'null'], x-ui: {basic: false}}
                sector: {type: [string, 'null'], x-ui: {basic: false}}
                role: {type: [string, 'null'], x-ui: {basic: false}}
                seniority: {type: [string, 'null'], x-ui: {basic: false}}
                organization_type: {type: [string, 'null'], x-ui: {basic: false}}
                work_arrangement: {type: [string, 'null'], x-ui: {basic: false}}
                salary_text: {type: [string, 'null'], x-ui: {basic: false}}
                valid_through: {type: [string, 'null'], x-ui: {basic: false}}
                impact: {type: [string, 'null'], x-ui: {basic: false}}
                detail_status: {type: [string, 'null'], x-ui: {basic: false}}
                salary_min: {type: [number, 'null'], x-ui: {basic: false}}
                salary_max: {type: [number, 'null'], x-ui: {basic: false}}
                salary_currency: {type: [string, 'null'], x-ui: {basic: false}}
                salary_period: {type: [string, 'null'], x-ui: {basic: false}}
                provider: {type: string, x-ui: {basic: false}}
    sdk_output_schema:
      type: object
      description: Jobs search response with one result group per input request.
      properties:
        app_id: {type: string}
        skill_id: {type: string}
        status: {type: string}
        success: {type: boolean}
        partial: {type: boolean}
        provider: {type: string}
        providers: {type: array, items: {type: string}}
        result_count: {type: integer}
        error: {type: [string, 'null']}
        warnings:
          type: array
          items:
            type: object
            properties:
              request_id: {type: string}
              provider: {type: string}
              country: {type: string}
              code: {type: string}
              message: {type: string}
        results:
          type: array
          description: Request groups; each group contains its own listings and errors.
          items:
            type: object
            properties:
              id: {oneOf: [{type: string}, {type: integer}]}
              query: {type: string}
              country: {type: [string, 'null']}
              countries: {type: array, items: {type: string}}
              providers: {type: array, items: {type: string}}
              result_count: {type: integer}
              error: {type: string}
              warnings:
                type: array
                items:
                  type: object
                  properties:
                    request_id: {type: string}
                    provider: {type: string}
                    country: {type: string}
                    code: {type: string}
                    message: {type: string}
              results:
                type: array
                items: *jobs_listing_schema
focuses:
  - id: career_insights
    name_translation_key: jobs.career_insights
    description_translation_key: jobs.career_insights.description
    process_translation_key: focus_modes.jobs_career_insights.process
    systemprompt_translation_key: focus_modes.jobs_career_insights.systemprompt
    icon_image: insight.svg
    preprocessor_hint: >
      Select when the user expresses career frustration, feels stuck in
      their job, is considering a career change, wants career direction
      or guidance, asks about career paths, or needs help figuring out
      what to do next professionally. Do not select for routine job-search
      result lookup, resume editing, workplace legal disputes, immigration
      advice, or financial planning unless the user is primarily asking for
      career direction.
