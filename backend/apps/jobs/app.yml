    i18n_namespace: embeds.jobs.search.result
    content_fields:
      - {name: id, type: string, required: true}
      - {name: title, type: string, required: true}
      - {name: company, type: string}
      - {name: url, type: string, required: true}
      - {name: apply_url, type: string}
      - {name: location, type: string}
      - {name: country, type: string}
      - {name: remote, type: boolean}
      - {name: employment_type, type: string}
      - {name: published_at, type: string}
      - {name: description, type: string}
      - {name: sector, type: string}
      - {name: role, type: string}
      - {name: seniority, type: string}
      - {name: organization_type, type: string}
      - {name: work_arrangement, type: string}
      - {name: salary_text, type: string}
      - {name: valid_through, type: string}
      - {name: impact, type: string}
      - {name: detail_status, type: string}
      - {name: salary_min, type: number}
      - {name: salary_max, type: number}
      - {name: salary_currency, type: string}
      - {name: salary_period, type: string}
      - {name: start_date, type: string}
      - {name: contract_duration_months, type: number}
      - {name: visa_sponsorship, type: boolean}
      - {name: education_level, type: string}
      - {name: experience_level, type: string}
      - {name: experience_years_min, type: number}
      - {name: impact_area, type: string}
      - {name: languages, type: object}
      - {name: provider, type: string, required: true}
skills:
  - id: search
    anonymous_access: inline
    name_translation_key: app_skills.jobs.search
    description_translation_key: app_skills.jobs.search.description
    icon_image: search.svg
    api_config:
      expose_get: false
      expose_post: true
    external_data: true
    preprocessor_hint: >
      Search current Swedish job listings using JobTech. Germany is unavailable.
      Preserve country, remote, employment and age filters. Radius
      search is unavailable. Use relevance_criteria only for an explicit user goal.
      Set listing filters (visa, experience, education, start, contract length,
      deadline, salary, languages) only when the user asks; they drop listings
      that do not state the value.
      Never invent listing facts or broaden filters after empty results.
    class_path: backend.apps.jobs.skills.search_skill.SearchSkill
    # Operator-installed app package providers may serve searches next to the
    # built-in source (docs/architecture/apps/instance-app-packages.md).
    provider_contract: jobs.search@1
    pricing:
      per_unit:
        credits: 1
        unit_name: search
    supplier_costs:
      per_unit:
        none: true
        note: JobTech public API
    providers:
      - {name: JobTech, no_api_key: true}
    tool_schema:
      type: object
      properties:
        countries:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          default: [DE]
          items: {type: string, pattern: '^[A-Z]{2}$'}
          x-ui: {basic: true}
          description: >
            ISO 3166-1 alpha-2 country codes. The built-in source covers SE; other countries
            return an explicit coverage gap unless an installed provider answers them.
        requests:
          type: array
          minItems: 1
          maxItems: 5
          x-ui: {basic: true}
          description: Independent job searches; each retains its own filters and result group.
          items:
            type: object
            properties:
              id:
                type: string
                x-ui: {basic: false}
                description: Optional request ID for matching batch results.
              query:
                type: string
                minLength: 1
                maxLength: 400
                x-ui: {basic: true}
                description: Job role or topic, such as "climate policy analyst".
              country:
                type: string
                pattern: '^[A-Z]{2}$'
                x-ui: {basic: false}
                description: Legacy singleton ISO 3166-1 alpha-2 country override. Do not combine with countries.
              countries:
                type: array
                minItems: 1
                maxItems: 10
                uniqueItems: true
                items: {type: string, pattern: '^[A-Z]{2}$'}
                x-ui: {basic: false}
                description: Override top-level countries for this request; do not combine with country.
              location:
                type: string
                x-ui: {basic: true, control: location}
                description: Optional city or place named by the user.
              radius_km:
                type: integer
                minimum: 1
                maximum: 200
                x-ui: {basic: false}
                description: >
                  Radius in km around location. Requires location and is currently
                  unavailable from the configured providers.
              remote:
                type: boolean
                x-ui: {basic: true}
                description: >
                  Omit unless the user asks for remote or on-site work. A true
                  result requires explicit full-remote evidence, not just possible home office.
              employment_type:
                type: string
                enum: [full_time, part_time, internship, contract, apprenticeship]
                x-ui: {basic: false}
                description: Optional employment type explicitly requested by the user.
              max_days_old:
                type: integer
                minimum: 1
                maximum: 3650
                x-ui: {basic: false}
                description: Maximum age in days; undated listings are excluded.
              limit:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
                x-ui: {basic: true}
                description: Maximum final results for this request.
              provider:
                type: string
                enum: [auto, JobTech]
                x-ui: {basic: false}
                description: One explicit source, overriding auto country routing.
              providers:
                type: array
                items: {type: string, enum: [JobTech]}
                x-ui: {basic: false}
                description: Explicit source list; do not mix with provider or auto.
              relevance_criteria:
                type: string
                maxLength: 1000
                x-ui: {basic: true}
                description: >
                  Optional user-stated career or impact goal that should change ranking.
                  Use only explicit listing evidence; omit for a neutral search.
              visa_sponsorship:
                type: boolean
                x-ui: {basic: false}
                description: >
                  Keep only listings that state this visa sponsorship value. Listings that
                  do not state it are excluded, as for every listing filter below.
              experience_levels:
                type: array
                maxItems: 5
                uniqueItems: true
                items: {type: string, enum: [internship, entry, mid, senior, lead]}
                x-ui: {basic: false}
                description: Keep listings whose stated experience level is one of these; unstated levels are excluded.
              education_levels:
                type: array
                maxItems: 5
                uniqueItems: true
                items: {type: string, enum: [none, vocational, bachelor, master, doctorate]}
                x-ui: {basic: false}
                description: >
                  Keep listings whose required education level is one of these (include the
                  user's level and every lower one); unstated levels are excluded.
              start_after:
                type: string
                format: date
                x-ui: {basic: false}
                description: Keep listings whose stated start date is on or after this ISO date; unstated start dates are excluded.
              start_before:
                type: string
                format: date
                x-ui: {basic: false}
                description: Keep listings whose stated start date is on or before this ISO date; unstated start dates are excluded.
              min_contract_duration_months:
                type: integer
                minimum: 1
                maximum: 600
                x-ui: {basic: false}
                description: >
                  Minimum stated contract duration in months. Permanent or unstated
                  durations are excluded.
              max_contract_duration_months:
                type: integer
                minimum: 1
                maximum: 600
                x-ui: {basic: false}
                description: >
                  Maximum stated contract duration in months, for fixed-term roles.
                  Permanent or unstated durations are excluded.
              deadline_after:
                type: string
                format: date
                x-ui: {basic: false}
                description: >
                  Keep listings whose application deadline is on or after this ISO date;
                  listings without a stated deadline are excluded.
              min_salary:
                type: number
                exclusiveMinimum: 0
                x-ui: {basic: false}
                description: >
                  Minimum salary; requires salary_currency and salary_period. A listing passes
                  when its highest stated salary in that currency reaches it (month and year
                  convert, other periods must match). Listings without a comparable salary are excluded.
              salary_currency:
                type: string
                pattern: '^[A-Z]{3}$'
                x-ui: {basic: false}
                description: ISO 4217 currency of min_salary, such as EUR. No conversion between currencies.
              salary_period:
                type: string
                enum: [hour, day, week, month, year]
                x-ui: {basic: false}
                description: Period of min_salary.
              languages:
                type: array
                maxItems: 10
                uniqueItems: true
                items: {type: string, pattern: '^[a-z]{2}$'}
                x-ui: {basic: false}
                description: >
                  ISO 639-1 codes of languages the user can work in. Keep listings whose
                  stated working languages include at least one; unstated languages are excluded.
            required: [query]
      required: [requests]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        countries: [DE]
        requests:
          - {query: software engineer, limit: 3}
      output_schema:
        type: object
        properties:
          summary: {type: string, x-ui: {basic: false}}
          success: {type: boolean, x-ui: {basic: false}}
          partial: {type: boolean, x-ui: {basic: false}}
          result_count: {type: integer, x-ui: {basic: true}}
          provider: {type: string, x-ui: {basic: false}}
          providers: {type: array, items: {type: string}, x-ui: {basic: false}}
          error: {type: string, x-ui: {basic: false}}
          warnings:
            type: array
            x-ui: {basic: false}
            items:
              type: object
              properties:
                request_id: {type: string}
                provider: {type: string}
                country: {type: string}
                code: {type: string}
                message: {type: string}
          results:
            type: array
            x-ui: {basic: true}
            description: Flat, deduplicated job listings for downstream workflow nodes.
            items: &jobs_listing_schema
              type: object
              properties:
                id: {type: string, x-ui: {basic: false}}
                title: {type: string, x-ui: {basic: true}}
                company: {type: [string, 'null'], x-ui: {basic: true}}
                url: {type: string, format: uri, x-ui: {basic: true}}
                apply_url: {type: [string, 'null'], format: uri, x-ui: {basic: false}}
                location: {type: [string, 'null'], x-ui: {basic: true}}
                country:
                  type: [string, 'null']
                  x-ui: {basic: false}
                  description: ISO 3166-1 alpha-2 country of the listing; null for global or remote listings without one.
                remote: {type: [boolean, 'null'], x-ui: {basic: true}}
                employment_type: {type: [string, 'null'], x-ui: {basic: false}}
                published_at: {type: [string, 'null'], x-ui: {basic: false}}
                description: {type: [string, 'null'], x-ui: {basic: false}}
                sector: {type: [string, 'null'], x-ui: {basic: false}}
                role: {type: [string, 'null'], x-ui: {basic: false}}
                seniority: {type: [string, 'null'], x-ui: {basic: false}}
                organization_type: {type: [string, 'null'], x-ui: {basic: false}}
                work_arrangement: {type: [string, 'null'], x-ui: {basic: false}}
                salary_text: {type: [string, 'null'], x-ui: {basic: false}}
                valid_through:
                  type: [string, 'null']
                  x-ui: {basic: false}
                  description: Application deadline (ISO 8601).
                impact: {type: [string, 'null'], x-ui: {basic: false}, description: Why the work matters, in the source's words.}
                impact_area: {type: [string, 'null'], x-ui: {basic: false}, description: Cause or problem area label, such as climate.}
                start_date: {type: [string, 'null'], format: date, x-ui: {basic: false}}
                contract_duration_months: {type: [integer, 'null'], x-ui: {basic: false}, description: Fixed-term length; null when permanent or unstated.}
                visa_sponsorship: {type: [boolean, 'null'], x-ui: {basic: false}}
                education_level:
                  type: [string, 'null']
                  enum: [none, vocational, bachelor, master, doctorate, null]
                  x-ui: {basic: false}
                  description: Minimum required education.
                experience_level:
                  type: [string, 'null']
                  enum: [internship, entry, mid, senior, lead, null]
                  x-ui: {basic: false}
                  description: Normalized level; seniority keeps the source's wording.
                experience_years_min: {type: [integer, 'null'], x-ui: {basic: false}}
                languages:
                  type: [array, 'null']
                  items: {type: string}
                  x-ui: {basic: false}
                  description: ISO 639-1 working languages.
                detail_status: {type: [string, 'null'], x-ui: {basic: false}}
                salary_min: {type: [number, 'null'], x-ui: {basic: false}}
                salary_max: {type: [number, 'null'], x-ui: {basic: false}}
                salary_currency: {type: [string, 'null'], x-ui: {basic: false}}
                salary_period: {type: [string, 'null'], x-ui: {basic: false}}
                provider: {type: string, x-ui: {basic: false}}
    sdk_output_schema:
      type: object
      description: Jobs search response with one result group per input request.
      properties:
        app_id: {type: string}
        skill_id: {type: string}
        status: {type: string}
        success: {type: boolean}
        partial: {type: boolean}
        provider: {type: string}
        providers: {type: array, items: {type: string}}
        result_count: {type: integer}
        error: {type: [string, 'null']}
        warnings:
          type: array
          items:
            type: object
            properties:
              request_id: {type: string}
              provider: {type: string}
              country: {type: string}
              code: {type: string}
              message: {type: string}
        results:
          type: array
          description: Request groups; each group contains its own listings and errors.
          items:
            type: object
            properties:
              id: {oneOf: [{type: string}, {type: integer}]}
              query: {type: string}
              country: {type: [string, 'null']}
              countries: {type: array, items: {type: string}}
              providers: {type: array, items: {type: string}}
              result_count: {type: integer}
              error: {type: string}
              warnings:
                type: array
                items:
                  type: object
                  properties:
                    request_id: {type: string}
                    provider: {type: string}
                    country: {type: string}
                    code: {type: string}
                    message: {type: string}
              results:
                type: array
                items: *jobs_listing_schema
focuses:
  - id: career_insights
    name_translation_key: jobs.career_insights
    description_translation_key: jobs.career_insights.description
    process_translation_key: focus_modes.jobs_career_insights.process
    systemprompt_translation_key: focus_modes.jobs_career_insights.systemprompt
    icon_image: insight.svg
    preprocessor_hint: >
      Select when the user expresses career frustration, feels stuck in
      their job, is considering a career change, wants career direction
      or guidance, asks about career paths, or needs help figuring out
      what to do next professionally. Do not select for routine job-search
      result lookup, resume editing, workplace legal disputes, immigration
      advice, or financial planning unless the user is primarily asking for
      career direction.
  - id: create_cv
    auto_activate_when_relevant: true
    icon_image: jobs.svg
    name_translation_key: jobs.create_cv
    description_translation_key: jobs.create_cv.description
    process_translation_key: focus_modes.jobs_create_cv.process
    systemprompt_translation_key: focus_modes.jobs_create_cv.systemprompt
    how_to_use:
      - Here is my current CV as a PDF. Update it for product manager roles in Germany
      - I have no CV yet. Ask me what you need and create one
      - Is my CV readable by applicant tracking systems? Check it and fix what is not
    preprocessor_hint: >
      Select when the user wants to create, write, update, improve, review,
      translate or reformat a CV, resume or Lebenslauf, uploads a CV and
      asks for feedback or a new version, or asks whether their CV is
      readable by applicant tracking software. Do not select for writing a
      cover letter or application for one specific job, interview
      preparation, deciding on a career direction, or only searching for job
      listings.
  - id: write_application
    auto_activate_when_relevant: true
    icon_image: jobs.svg
    name_translation_key: jobs.write_application
    description_translation_key: jobs.write_application.description
    process_translation_key: focus_modes.jobs_write_application.process
    systemprompt_translation_key: focus_modes.jobs_write_application.systemprompt
    how_to_use:
      - 'Write a cover letter for this job posting: [link]'
      - Help me apply for the data analyst role at this company. My CV is attached
      - Tailor my CV to this job and tell me what is missing
    preprocessor_hint: >
      Select when the user wants to apply to one specific job or employer
      and asks for a cover letter, application letter, Anschreiben,
      motivation letter, personal letter, answers to application form
      questions, or to tailor their CV to that job posting. Do not select
      for creating a general CV without a target job, interview preparation,
      choosing a career direction, or only searching for job listings.
  - id: prepare_interview
    auto_activate_when_relevant: true
    icon_image: jobs.svg
    name_translation_key: jobs.prepare_interview
    description_translation_key: jobs.prepare_interview.description
    process_translation_key: focus_modes.jobs_prepare_interview.process
    systemprompt_translation_key: focus_modes.jobs_prepare_interview.systemprompt
    how_to_use:
      - I have an interview on Thursday for this role. Help me prepare
      - Run a mock interview for a junior UX designer position and give me feedback
      - How do I answer "what is your biggest weakness" with my background?
    preprocessor_hint: >
      Select when the user has or expects a job interview and wants to
      prepare: likely questions, how to answer, a practice or mock
      interview, feedback on answers, questions to ask the employer, or
      preparing for a recorded or AI-assisted video interview. Do not select
      for writing a CV or an application, choosing a career direction,
      salary negotiation after an offer, or only searching for job listings.
