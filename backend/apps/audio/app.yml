    gradient_var: "--color-app-audio"
    i18n_namespace: embeds.audio.generate
    content_fields:
      - name: prompt
        type: string
        required: true
      - name: generation_type
        type: string
        required: true
      - name: provider
        type: string
        required: true
      - name: model
        type: string
        required: true
      - name: duration_seconds
        type: number
      - name: s3_base_url
        type: string
      - name: files
        type: object
      - name: aes_key
        type: string
      - name: aes_nonce
        type: string
      - name: vault_wrapped_aes_key
        type: string
  - id: speak
    category: app-skill-use
    skill_id: speak
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: false
    preview_component: audio/AudioGenerateEmbedPreview.svelte
    fullscreen_component: audio/AudioGenerateEmbedFullscreen.svelte
    icon: audio
    gradient_var: "--color-app-audio"
    i18n_namespace: embeds.audio.speak
    content_fields:
      - name: text_preview
        type: string
        required: true
      - name: generation_type
        type: string
        required: true
      - name: voice
        type: string
        required: true
      - name: provider
        type: string
        required: true
      - name: model
        type: string
        required: true
      - name: duration_seconds
        type: number
      - name: s3_base_url
        type: string
      - name: files
        type: object
      - name: aes_key
        type: string
      - name: aes_nonce
        type: string
      - name: vault_wrapped_aes_key
        type: string
skills:
  - id: transcribe
    name_translation_key: app_skills.audio.transcribe
    description_translation_key: app_skills.audio.transcribe.description
    preprocessor_hint: >
      Transcribe an audio recording uploaded by the user to text using Mistral Voxtral.
      Use this skill only for manually uploaded audio files or failed/missing transcripts.
      Do not use it for web app voice recordings that already include transcript text.
    class_path: |
      backend.apps.audio.skills.transcribe_skill.TranscribeSkill
    providers:
      - Mistral
    full_model_reference: mistral/voxtral-mini-2602
    pricing:
      per_minute: 3 # $0.003/min Mistral cost; 1-minute minimum enforced in skill (~3x markup)
    api_config:
      expose_get: true # Expose GET so REST API callers can query skill metadata + use for uploaded audio
      expose_post: false # Custom POST registered by _register_audio_custom_routes() — uses session+API key auth
    tool_schema:
      type: object
      properties:
        requests:
          type: array
          description: |
            Array of transcription request objects. Each object must contain
            's3_base_url', 's3_key', 'aes_key', 'aes_nonce', and 'vault_wrapped_aes_key'
            to fetch and decrypt the audio from S3, plus optional 'language' hint.
          items:
            type: object
            properties:
              s3_base_url:
                type: string
                description: "S3 base URL for the encrypted audio file."
              s3_key:
                type: string
                description: "S3 object key for the encrypted audio file."
              aes_key:
                type: string
                description: "Base64-encoded plaintext AES-256 key for decryption."
              aes_nonce:
                type: string
                description: "Base64-encoded AES-GCM nonce."
              vault_wrapped_aes_key:
                type: string
                description: "Vault Transit-wrapped AES key (server-side decryption)."
              language:
                type: string
                description: "Optional ISO 639-1 language hint (e.g. 'en', 'de')."
              transcription_contract_version:
                type: integer
                enum: [1]
                description: "Optional contract marker. Version 1 defaults omitted timestamps to word; unversioned omission remains none."
              timestamps:
                type: string
                enum: [none, segment, word]
                description: "Optional timestamp detail. Explicit selection overrides the contract default; segment and word cannot be combined with language."
              filename:
                type: string
                description: "Original filename of the audio recording."
            required:
              - s3_base_url
              - s3_key
              - aes_key
              - aes_nonce
      required:
        - requests
  - id: generate
    name_translation_key: app_skills.audio.generate
    description_translation_key: app_skills.audio.generate.description
    icon_image: audio.svg
    api_config:
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Generate short, non-speech sound effects from text prompts, such as UI
      confirmation ticks, gentle alerts, transitions, and product sounds. Do not
      use this for spoken words, narration, vocals, voice cloning, scams, public
      figures, or deceptive media; use audio.speak for explicit speech generation.
    class_path: backend.apps.audio.skills.generate_skill.GenerateSkill
    providers:
      - name: ElevenLabs
    full_model_reference: elevenlabs/eleven_text_to_sound_v2
    pricing:
      per_second: 20
    tool_schema:
      type: object
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 5
          description: "REQUIRED: Array of short sound-effect generation request objects."
          items:
            type: object
            properties:
              id:
                description: Optional caller-supplied ID preserved in the result.
              prompt:
                type: string
                minLength: 1
                maxLength: 400
                description: Non-speech sound effect prompt.
              provider:
                type: string
                enum: [elevenlabs]
                default: elevenlabs
                description: Audio provider. v1 supports ElevenLabs only; keep explicit for future provider expansion.
              duration_seconds:
                type: number
                minimum: 0.5
                maximum: 2.0
                default: 1.0
              prompt_influence:
                type: number
                minimum: 0
                maximum: 1
                default: 0.3
              loop:
                type: boolean
                default: false
              output_format:
                type: string
                enum: [mp3_22050_32, mp3_24000_48, mp3_44100_32, mp3_44100_64, mp3_44100_96, mp3_44100_128, mp3_44100_192]
                default: mp3_44100_128
              model:
                type: string
                enum: [eleven_text_to_sound_v2]
                default: eleven_text_to_sound_v2
            required:
              - prompt
              - provider
      required:
        - requests
    exclude_fields_for_llm:
      - audio_base64
      - aes_key
      - aes_nonce
      - vault_wrapped_aes_key
      - raw_provider_diagnostics
  - id: speak
    name_translation_key: app_skills.audio.speak
    description_translation_key: app_skills.audio.speak.description
    icon_image: audio.svg
    api_config:
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Convert explicit user-provided text into short speech audio using an
      OpenMates voice preset after a required GPT OSS safeguard approval. Do not
      use this for automatic assistant voice replies, long narration, voice
      cloning, raw provider voice IDs, impersonation, scams, or deceptive speech.
    class_path: backend.apps.audio.skills.speak_skill.SpeakSkill
    providers:
      - name: ElevenLabs
    full_model_reference: elevenlabs/eleven_v3
    pricing:
      per_second: 2
    tool_schema:
      type: object
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 3
          description: "REQUIRED: Array of explicit text-to-speech request objects."
          items:
            type: object
            properties:
              id:
                description: Optional caller-supplied ID preserved in the result.
              text:
                type: string
                minLength: 1
                maxLength: 2000
                description: Text to synthesize after safety approval.
              provider:
                type: string
                enum: [elevenlabs]
                default: elevenlabs
                description: Audio provider. v1 supports ElevenLabs only; keep explicit for future provider expansion.
              voice:
                type: string
                enum: [warm_neutral, bright_neutral, calm_narrator]
                default: warm_neutral
                description: OpenMates voice preset; raw provider voice IDs are not accepted.
              accent:
                type: string
                enum: [en_us, en_gb, de_de, es_es, fr_fr]
                default: en_us
              style:
                type: string
                enum: [natural, calm, friendly, energetic]
                default: natural
              speed:
                type: number
                minimum: 0.7
                maximum: 1.2
                default: 1.0
              output_format:
                type: string
                enum: [mp3_22050_32, mp3_24000_48, mp3_44100_32, mp3_44100_64, mp3_44100_96, mp3_44100_128, mp3_44100_192]
                default: mp3_44100_128
              model:
                type: string
                enum: [eleven_v3, eleven_multilingual_v2, eleven_flash_v2_5]
                default: eleven_v3
                description: ElevenLabs TTS model. Eleven v3 is the highest-quality default; Multilingual v2 provides stable long-form speech and Flash v2.5 is the lower-cost option.
            required:
              - text
              - provider
      required:
        - requests
    exclude_fields_for_llm:
      - audio_base64
      - aes_key
      - aes_nonce
      - vault_wrapped_aes_key
      - raw_provider_diagnostics
      - safeguard_reasoning

marketing_discovery:
  skills:
    transcribe:
      enabled: true
      keywords:
        - audio transcription AI
        - voice note transcript cleanup
        - meeting recording transcript
      pain_points:
        - manual transcription is slow
        - raw transcripts need correction
      demo_angles:
        - show audio transcription with corrected transcript
