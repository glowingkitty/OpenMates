instructions:
  - instruction: |
      **Project Skills**
      - Use Projects create when the user asks to start or organize a durable workspace project.
      - Project content is client-side encrypted. Use authorized Project Focus file tools for file work.
skills:
  - id: create
    anonymous_access: authenticated
    name_translation_key: projects.skills.create
    description_translation_key: projects.skills.create.description
    icon_image: project.svg
    preprocessor_hint: >
      Request creation of a user-visible project. Durable project content is
      client-side encrypted, so a capable connected client must apply the change.
    providers:
      - name: OpenMates
        no_api_key: true
    pricing:
      fixed: 1
    supplier_costs:
      fixed:
        none: true
        note: Internal
    class_path: backend.apps.projects.skills.create_skill.CreateSkill
    tool_schema:
      type: object
      properties:
        name:
          type: string
          description: Short user-facing project name.
        description:
          type: string
          description: One short sentence (at most 120 characters) saying what the project is for; shown on its tile.
        icon:
          type: string
          description: One Lucide icon name in kebab case that fits the project (for example chef-hat, gamepad-2, wallet).
        category:
          type: string
          description: The single category the project mainly belongs to; for a mixed project the category of its main deliverable.
          enum: [software_development, business_development, medical_health, legal_law, maker_prototyping, marketing_sales, finance, design, electrical_engineering, movies_tv, history, science, life_coach_psychology, cooking_food, activism, general_knowledge]
      required:
        - name
