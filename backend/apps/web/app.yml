# Embed type definitions — single source of truth for frontend embed routing.
# Read by generate-embed-registry.js to auto-generate TypeScript routing files.
embed_types:
  # Web search results — composite embed with child website embeds
  - id: search
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: website
    child_frontend_type: web-website
    groupable: true
    preview_component: web/WebSearchEmbedPreview.svelte
    fullscreen_component: web/WebSearchEmbedFullscreen.svelte
    child_preview_component: web/WebsiteEmbedPreview.svelte
    child_fullscreen_component: web/WebsiteEmbedFullscreen.svelte
    icon: search
    gradient_var: "--color-app-web"
    i18n_namespace: embeds.web.search
    content_catalog:
      enabled: true
      source: child
      content_type_id: website
      name: Website
      description: Saved website result cards with title, URL, favicon, snippet, and page metadata.
      icon: web
      example_key: web.website
      order: 10
    # Content fields for the parent app_skill_use embed (finished state)
    content_fields:
      - name: query
        type: string
        required: true
      - name: provider
        type: string
      - name: result_count
        type: number
        required: true
      - name: embed_ids
        type: string
        description: "Pipe-delimited child embed IDs (TOON tabular format)"
    # Content fields for child website embeds
    child_content_fields:
      - name: url
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: description
        type: string
        required: true
      - name: age
        type: string
      - name: page_age
        type: string
      - name: meta_url_favicon
        type: string
        description: "Favicon URL (flattened from meta_url.favicon)"
      - name: thumbnail_original
        type: string
        description: "Thumbnail URL (flattened from thumbnail.original)"
      - name: extra_snippets
        type: string
        description: "Pipe-delimited additional context snippets"
      - name: language
        type: string
  # Web read — single-page content extraction
  - id: read
    category: app-skill-use
    skill_id: read
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: false
    preview_component: web/WebReadEmbedPreview.svelte
    fullscreen_component: web/WebReadEmbedFullscreen.svelte
    icon: web
    gradient_var: "--color-app-web"
    i18n_namespace: embeds.web.read
    content_fields:
      - name: url
        type: string
        required: true
      - name: results
        type: array
        required: true
      - name: result_count
        type: number
        required: true
instructions:
  # This instruction is ALWAYS loaded when web app is available (no category filter)
  # It provides guidance on using web-search and web-read skills
  - tool_phase_only: true
    instruction: |
      **Web Skills**

      - **web-search**: Search for current info. For a simple lookup, start with one focused query. For complex comparative research with competing explanations, activate the Deep research focus when it is offered, then investigate multiple independent angles through research subchats and read important sources.
      - **web-read**: Read content from URLs the user provides. Prefer this over searching when a URL is given.

      **Important:** Prefer specialized tools (`code-get_docs`, `news-search`, `videos-search`, `maps-search`) over web-search when they match the query type.

  # This instruction is only loaded when the conversation category is software_development
  - tool_phase_only: true
    instruction: |
      For API/library documentation, prefer `code-get_docs` over web search.
    categories:
      - software_development
skills:
  - id: search
    anonymous_access: inline
    name_translation_key: app_skills.web.search
    description_translation_key: app_skills.web.search.description
    # Brave search is read-only and has no account, workspace, or payment state.
    parallel_safe: true
    icon_image: search.svg
    preprocessor_hint: >
      General web search for current information, prices, weather, facts, stocks, sports scores, etc.
      Use as a fallback when no specialized skill applies. Keep query focused on the subject being
      retrieved. Whenever the user states a purpose, intended use, audience, decision need, or
      preference that should change result ordering, put that goal in relevance_criteria even if
      related words could also be added to query. For example, query "laptop-friendly cafes Berlin"
      with relevance_criteria "Places suitable for working several hours and taking a client call."
      Omit relevance_criteria only for a neutral search whose goal is fully expressed by query and
      structured fields. Copy the user's goal faithfully and never invent preferences.
    class_path: |
      backend.apps.web.skills.search_skill.SearchSkill
    providers:
      - Brave
    # Follow-up suggestions shown to users after search results
    suggestions_follow_up_requests:
      - "Search more in depth"
      - "Create a PDF report"
      - "Get more recent results"
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # These fields are removed before adding to message history for LLM processing
    # but remain in the full response stored in chat history for proper UI rendering
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "meta_url.favicon"
      - "thumbnail.original"
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: |
            REQUIRED: Array of search request objects for parallel processing (up to 5 requests). 
            This parameter is MANDATORY - you MUST always provide a 'requests' array, even for a single search.
            Example for single search: {"requests": [{"query": "Python async"}]}
            Example for multiple searches: {"requests": [{"query": "Python async"}, {"query": "FastAPI best practices"}]}
            Each object must contain 'query' (search query string), and can include optional parameters (count, relevance_criteria, country, search_lang, safesearch).
            Note: The 'id' field is auto-generated if not provided - you don't need to include it.
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: Search query string
              count:
                x-ui:
                  basic: true
                type: integer
                description: Number of final results for this request (default 10, max 20).
                minimum: 1
                maximum: 20
                default: 10
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language ranking goal, separate from the retrieval query.
                  Set it whenever the user states a purpose, intended use, audience, decision need,
                  or preference that should change ordering, even if related terms also appear in
                  query. Example: "Research useful for deciding which framework to adopt." Omit only
                  for a neutral search fully expressed by query and structured fields; never invent
                  preferences. When present, up to 40 candidates are ranked and only count are returned.
              country:
                x-ui:
                  basic: true
                type: string
                description: "Country code for localized results. Must be one of: AR, AU, AT, BE, BR, CA, CL, DK, FI, FR, DE, GR, HK, IN, ID, IT, JP, KR, MY, MX, NL, NZ, NO, CN, PL, PT, PH, RU, SA, ZA, ES, SE, CH, TW, TR, GB, US, or ALL (case-insensitive). Defaults to 'us' if invalid."
                enum:
                  [
                    "AR",
                    "AU",
                    "AT",
                    "BE",
                    "BR",
                    "CA",
                    "CL",
                    "DK",
                    "FI",
                    "FR",
                    "DE",
                    "GR",
                    "HK",
                    "IN",
                    "ID",
                    "IT",
                    "JP",
                    "KR",
                    "MY",
                    "MX",
                    "NL",
                    "NZ",
                    "NO",
                    "CN",
                    "PL",
                    "PT",
                    "PH",
                    "RU",
                    "SA",
                    "ZA",
                    "ES",
                    "SE",
                    "CH",
                    "TW",
                    "TR",
                    "GB",
                    "US",
                    "ALL",
                    "ar",
                    "au",
                    "at",
                    "be",
                    "br",
                    "ca",
                    "cl",
                    "dk",
                    "fi",
                    "fr",
                    "de",
                    "gr",
                    "hk",
                    "in",
                    "id",
                    "it",
                    "jp",
                    "kr",
                    "my",
                    "mx",
                    "nl",
                    "nz",
                    "no",
                    "cn",
                    "pl",
