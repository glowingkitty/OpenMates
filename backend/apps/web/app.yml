                source_id:
                  x-ui:
                    basic: false
                  type: string
  - id: read
    anonymous_access: authenticated
    name_translation_key: web.read
    description_translation_key: web.read.description
    icon_image: web.svg
    preprocessor_hint: >
      Read public HTTPS pages directly when the user provides a URL or asks to read a source.
      Respect robots.txt and page crawler exclusions. Authentication, paywalls, CAPTCHA, blocked
      pages, private addresses and unsupported content fail visibly without proxies or bypasses.
      Returns complete extracted markdown for saved embeds and history. This is not a replacement
      for unavailable specialized connectors. Use at most five URLs per call.
    class_path: |
      backend.apps.web.skills.read_skill.ReadSkill
    provider_required: false
    providers: []
    pricing:
      per_unit:
        credits: 20
        unit_name: page
    # Follow-up suggestions shown to users after read results
    suggestions_follow_up_requests:
      - "Summarize this page"
      - "Extract key points"
      - "Read related pages"
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # These fields are removed before adding to message history for LLM processing
    # but remain in the full response stored in chat history for proper UI rendering
    # Note: HTML and summary are completely removed from output.
    # Metadata object is removed - specific fields (language, favicon, og_image, og_sitename)
    # are moved to root level of each result for easier access.
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "favicon" # Favicon URL not needed for LLM inference
      - "og_image" # OG image URL not needed for LLM inference
      - "og_sitename" # OG site name not needed for LLM inference
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          minItems: 1
          maxItems: 5
          description: |
            REQUIRED: Array of read request objects for parallel processing (up to 5 requests). 
            This parameter is MANDATORY - you MUST always provide a 'requests' array, even for a single URL.
            Example for single URL: {"requests": [{"id": 1, "url": "https://example.com/article"}]}
            Example for multiple URLs: {"requests": [{"id": 1, "url": "https://example.com/article1"}, {"id": 2, "url": "https://example.com/article2"}]}
            Each object must contain 'url' (webpage URL); caller 'id' is optional and generated when omitted, and can include optional parameters (formats, only_main_content, max_age, timeout).
          items:
            type: object
            properties:
              url:
                x-ui:
                  basic: true
                type: string
                format: uri
                description: Public HTTPS webpage URL to read (default port 443 only)
              formats:
                x-ui:
                  basic: true
                type: array
                description: Markdown is the only supported output format; full extracted text is retained.
                minItems: 1
                maxItems: 1
                items:
                  type: string
                  enum: ["markdown"]
                default: ["markdown"]
              only_main_content:
                x-ui:
                  basic: true
                type: boolean
                description: Whether to return only main content (excluding headers, navs, footers, etc.)
                default: true
              max_age:
                x-ui:
                  basic: true
                type: integer
                minimum: 0
                description: "Legacy compatibility field; ignored. Source reads are always fresh. Full saved embed/history text remains available."
              timeout:
                x-ui:
                  basic: false
                type: integer
                minimum: 1000
                maximum: 30000
                default: 20000
                description: Complete source-read timeout in milliseconds; the network batch is bounded to 30 seconds.
            required:
              - url
      required:
        - requests
focuses:
  - id: check_reputation
    name_translation_key: web.check_reputation
    description_translation_key: web.check_reputation.description
    process_translation_key: focus_modes.web_check_reputation.process
    systemprompt_translation_key: focus_modes.web_check_reputation.systemprompt
    preprocessor_hint: >
      Select when the user asks whether a business, seller, marketplace listing,
      website, online shop, or service is legitimate, trustworthy, reliable, or
      likely to be a scam before buying, signing up, or sharing information.
      Do not select for general company background research unless the user is
      explicitly asking about trust, reputation, fraud, or purchase risk.
  - id: analyze_privacy
    name_translation_key: web.analyze_privacy
    description_translation_key: web.analyze_privacy.description
  - id: research
    auto_activate_when_relevant: true
    name_translation_key: web.research
    description_translation_key: web.research.description
    process_translation_key: focus_modes.web_research.process
    systemprompt_translation_key: focus_modes.web_research.systemprompt
    preprocessor_hint: >
      Select for a complex political, economic, market, geopolitical, policy, or news question that asks for multiple causes, competing explanations, incentives, counterarguments, or a distinction between confirmed facts and inference. The user need not name this focus or use the word research; select it for a comparative evidence-seeking request rather than treating the first web search as the full answer.
      It is also appropriate when surface explanations may be incomplete and deeper causal investigation or source comparison would materially improve the answer.
      For filing-derived financial facts about explicit public companies, tickers, or CIKs, route revenue, net income, cash flow, balance sheet, filing, and SEC EDGAR requests to business.company_financials.
      Use business.company_financials only for explicit public company inputs; do not use it for private companies, company discovery, category discovery, investment advice, stock-price forecasts, or buy/sell recommendations.
      Do not select for quick facts, simple current-info lookups, or single-page summaries where normal web search or web read is enough.

marketing_discovery:
  skills:
    search:
      enabled: true
      keywords:
        - web search with AI answer quality
        - AI search results better than chatbot
        - current web research assistant
      pain_points:
        - plain chatbot answers lack sources
      demo_angles:
        - show web search-supported answer
    read:
      enabled: true
      keywords:
        - read webpage with AI
        - summarize article from URL
        - web page analysis assistant
      pain_points:
        - long web pages are hard to process
      demo_angles:
        - show web-read summary
