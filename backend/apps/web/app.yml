                    "es",
                    "se",
                    "ch",
                    "tw",
                    "tr",
                    "gb",
                    "us",
                    "all",
                  ]
                default: "us"
              search_lang:
                x-ui:
                  basic: false
                type: string
                description: Language code for search (ISO 639-1, e.g., 'en', 'es', 'fr')
                default: "en"
              safesearch:
                x-ui:
                  basic: false
                type: string
                description: Safe search level
                enum: ["off", "moderate", "strict"]
                default: "moderate"
              filter_tabloids:
                x-ui:
                  basic: false
                type: boolean
                description: "Filter out tabloid/boulevard media sources (e.g., BILD, Daily Mail, TMZ, The Sun) from results. Enabled by default for quality results. Set to false ONLY if the user explicitly asks for tabloid sources."
                default: true
            required:
              - query
      required:
        - requests
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        requests:
          - query: OpenMates
            count: 3
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
              basic: false
            type: string
          result_count:
            x-ui:
              basic: true
            type: integer
          results:
            x-ui:
              basic: true
            type: array
            items:
              type: object
              properties:
                title:
                  x-ui:
                    basic: true
                  type: string
                url:
                  x-ui:
                    basic: true
                  type: string
                description:
                  x-ui:
                    basic: true
                  type: string
                page_age:
                  x-ui:
                    basic: true
                  type: string
                provider:
