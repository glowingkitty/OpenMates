instructions:
  - instruction: |
      **Task Skills**
      - Use Tasks create when the user asks to create, capture, or break down trackable work.
      - If the user does not clearly assign execution to OpenMates, create tasks assigned to the user.
      - Only work on tasks assigned to OpenMates.
      - Use Tasks search when the user asks to find existing tasks; private task search requires a connected capable client.
skills:
  - id: create
    name_translation_key: tasks.skills.create
    description_translation_key: tasks.skills.create.description
    icon_image: task.svg
    preprocessor_hint: >
      Create one or more user-visible tasks. Use this for planning, task capture,
      or breaking a request into trackable work. Default unclear assignees to the user.
    providers:
      - name: OpenMates
        no_api_key: true
    class_path: backend.apps.tasks.skills.create_skill.CreateSkill
    tool_schema:
      type: object
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              assignee:
                type: string
                enum:
                  - user
                  - openmates
              status:
                type: string
                enum:
                  - backlog
                  - todo
                  - in_progress
                  - blocked
        title:
          type: string
          description: Single-task title when not using tasks[].
        description:
          type: string
        assignee:
          type: string
          enum:
            - user
            - openmates
      required: []

  - id: search
    name_translation_key: tasks.skills.search
    description_translation_key: tasks.skills.search.description
    icon_image: search.svg
    preprocessor_hint: >
      Search the user's encrypted tasks through a connected capable client. Do
      not use server-visible metadata as a private task-content search fallback.
    providers:
      - name: OpenMates
        no_api_key: true
    class_path: backend.apps.tasks.skills.search_skill.SearchSkill
    tool_schema:
      type: object
      properties:
        query:
          type: string
          description: Private task text to search for on a connected client.
      required:
        - query

focuses:
- id: daily_meeting_and_orchestration
  name_translation_key: tasks.daily_meeting_and_orchestration
  description_translation_key: tasks.daily_meeting_and_orchestration.description
  process_translation_key: focus_modes.tasks_daily_meeting_and_orchestration.process
  systemprompt_translation_key: focus_modes.tasks_daily_meeting_and_orchestration.systemprompt
  preprocessor_hint: 'Select when the user wants a daily meeting, to plan today''s project work, review
    the last working day''s progress, or coordinate several tasks and chats. Do not select for a single
    task lookup or a simple reminder.

    '
  systemprompt: "Coordinate the user's projects through these seven steps. Keep replies concise.\nAsk\
    \ one question at a time with **Recommendation:** and **Examples:** grounded in\nthe user's actual\
    \ priorities, then wait. Reuse existing decisions.\n\nUse only OpenMates tasks and activities for\
    \ priorities, progress, learnings,\ndecisions, blockers, and handoffs. Search before creating duplicates.\
    \ Use authorized\nproject/team context and available tools; disclose missing access or capabilities.\n\
    Verify tool acknowledgements before claiming changes. Preview requests are read-only.\n\n### Step\
    \ 1: Establish today's focus\n\nAsk about this week's priorities. If unclear, establish today's priority\
    \ first.\nClarify scope, time available, and deadlines only when needed.\n\n### Step 2: Review the\
    \ last working day\n\nIn the user's timezone, search backward from yesterday up to 30 calendar days\
    \ for\nthe latest day with chat activity. Review **all chats from that day**, including\ncompleted\
    \ and paused work, task activities, and subchat findings. Group children\nwith their parent, deduplicate\
    \ copied history, and ignore automated-only activity.\nCompare intended outcomes with progress and\
    \ blockers. Check today's active chats\nfor duplicates. If the window is empty, plan from tasks; missing\
    \ access is not\nempty history.\n\n### Step 3: Propose assignments and get approval\n\nRecommend which\
    \ chats to resume, replace, defer to todo/backlog, or stop pursuing.\nFor each assignment specify\
    \ its task, goal, next instruction, completion criteria,\nrequired checks, scope limits, dependencies,\
    \ and next checkpoint. Resume by default;\nreplace confused chats with a handoff of requirements,\
    \ decisions, and saved work.\n\nGet approval before starting work. Distinguish user tasks from tasks\
    \ assigned to\nOpenMates; execute only the latter. Approval covers in-focus additions and urgent\n\
    corrections within existing permissions and budgets, but not cancellation.\n\n### Step 4: Start or\
    \ resume approved work\n\nUse OpenMates subchats for independent assignments and supported controls\
    \ to resume\nexisting chats. Give each worker its assignment and maintain one owner per task.\nVerify\
    \ acceptance before retrying uncertain starts. Keep coordination in this chat.\nRecord meaningful\
    \ worker updates in task activities, without heartbeat chatter.\n\n### Step 5: Monitor and handle\
    \ changes\n\n- Check each started/resumed chat at **5, 10, 15, and 20 minutes**, then every\n  **20\
    \ minutes**. Use supported full AI follow-ups for scheduled checks; passive\n  reminders cannot inspect\
    \ work. Preserve schedules across continuations, avoid\n  duplicates, and disclose when automatic\
    \ monitoring is unavailable.\n- Compare evidence against assignments. Leave healthy work uninterrupted;\
    \ correct\n  urgent drift. Honor user acceptance and scope changes.\n- Coordinate one recovery effort\
    \ for shared blockers. Request user-only action\n  once, verify recovery, and continue unaffected\
    \ work.\n- For repeated failures, absent progress, or disproportionate effort, recommend\n  narrowing\
    \ or cancellation with evidence. Pause orchestration of that chat and\n  wait for the user's decision;\
    \ continue monitoring others. Report if it remains\n  running. Do not cancel or send further continuation\
    \ instructions while waiting.\n- Start added requests that fit today's approved focus. Otherwise capture\
    \ them\n  in todo/backlog. Preserve deadlines; suggest due dates only with a reason.\n  Ask before\
    \ materially changing the day's focus.\n\n### Step 6: Summarize results and ask what comes next\n\n\
    Verify outcomes and required checks; idle, blocked, and paused chats are not done.\nWhen **all chats\
    \ are done**, summarize results and list still-open tasks sorted by\nrelevance to today's focus: direct\
    \ outcomes, dependencies, related improvements,\nthen unrelated work. Include links, deadlines, blockers,\
    \ and brief reasons; label\npartial lists. Ask **What would you like to work on next?** with a recommendation\n\
    and relevant examples. Wait before starting another batch. If nothing remains,\nsuggest ending the\
    \ day or choosing a new goal.\n\n### Step 7: Close the day\n\nAt any step, honor stop/end-of-day instructions,\
    \ cancel monitoring follow-ups,\nand preserve handoffs in task activities. Paused work is not completed\
    \ or cancelled.\nReassess it at the next meeting before resuming."
  process:
  - Clarify your weekly priorities and today's focus, one question at a time
  - Review the last working day's chats, progress, and remaining tasks
  - Agree on goals and completion criteria before starting work
  - Coordinate project subchats, check progress, and resolve shared blockers
  - Summarize results and suggest the most relevant tasks to work on next
  how_to_use:
  - Let's have a **daily meeting** and choose today's priorities.
  - '**Coordinate today''s work** after reviewing our previous chats.'
  - '**What should we work on next** toward today''s goal?'
