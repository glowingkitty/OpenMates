landing:
  enabled: false

# Home app — German apartment and housing search
#
# houses, and WG rooms across Germany. All three providers use public
# endpoints (no API keys required). Results are merged and sorted by
# price, then returned as parent search embeds with child listing embeds.
#
# No API keys needed.

name_translation_key: home
description_translation_key: home.description
icon_image: |
  home.svg
category: lifestyle
last_updated: "2026-10-21"
settings_and_memories:
  - id: saved_listings
    name_translation_key: home.saved_listings
    description_translation_key: home.saved_listings.description
    icon_image: home.svg
    type: list
    schema:
      type: object
      properties:
        embed_id:
          type: string
          description: Referenced embed id for preview/fullscreen reopen
        title:
          type: string
          description: Listing title
          is_title: true
        url:
          type: string
          description: Listing URL
        provider:
          type: string
          description: Source provider
        price_label:
          type: string
          description: Price
          is_subtitle: true
        address:
          type: string
          description: Address
        available_from:
          type: string
          description: Available from
        notes:
          type: string
          description: Optional notes
          multiline: true
      required:
        - title
# Embed type definitions — single source of truth for frontend embed routing.
# Read by generate-embed-registry.js to auto-generate TypeScript routing files.
embed_types:
  - id: search
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: listing
    child_frontend_type: home-listing
    groupable: true
    preview_component: home/HomeSearchEmbedPreview.svelte
    fullscreen_component: home/HomeSearchEmbedFullscreen.svelte
    child_preview_component: home/HomeListingEmbedPreview.svelte
    child_fullscreen_component: home/HomeListingEmbedFullscreen.svelte
    icon: home
    gradient_var: "--color-app-home"
    i18n_namespace: embeds.home.search
    # Content fields for the parent app_skill_use embed (finished state)
    content_fields:
      - name: query
        type: string
        required: true
      - name: provider
        type: string
      - name: result_count
        type: number
        required: true
      - name: embed_ids
        type: string
        description: "Pipe-delimited child embed IDs (TOON tabular format)"
    # Content fields for child listing embeds
    child_content_fields:
      - name: url
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: price_label
        type: string
      - name: size_sqm
        type: number
      - name: rooms
        type: number
      - name: address
        type: string
      - name: image_url
        type: string
      - name: provider
        type: string
      - name: listing_type
        type: string
      - name: available_from
        type: string
        description: "Search is currently unavailable without a permitted provider."
      - name: deposit
        type: number
        description: "Search is currently unavailable without a permitted provider."
      - name: furnished
        type: boolean
        description: "Search is currently unavailable without a permitted provider."
      - name: image_urls
        type: string
      - name: description
        type: string
      - name: gallery_status
        type: string
      - name: detail_status
        type: string
      - name: price
        type: number
      - name: price_type
        type: string
      - name: cold_rent_eur
        type: number
      - name: warm_rent_eur
        type: number
      - name: utilities_eur
        type: number
      - name: heating_costs_eur
        type: number
      - name: floor
        type: string
      - name: available_to
        type: string
      - name: latitude
        type: number
      - name: longitude
        type: number
      - name: location_precision
        type: string
      - name: location_approximate
        type: boolean
      - name: location_source
        type: string
      - name: location
        type: object
        description: "Exact-address eligibility, source provenance and approximate area center/radius. An area center
          is never an apartment address."
      - name: street
        type: string
      - name: house_number
        type: string
      - name: city
        type: string
      - name: district
        type: string
      - name: amenities
        type: object
      - name: amenity_conflicts
        type: object
      - name: match_evidence
        type: object
      - name: visual_assessment
        type: object
      - name: neighborhood
        type: object
instructions:
  - instruction: |-
      Housing search is currently unavailable because no permitted provider is configured.
skills:
  # -----------------------------------------------------------------------
  # Search — search German housing platforms for apartments and rooms
  # -----------------------------------------------------------------------
  - id: search
    anonymous_access: inline
    name_translation_key: app_skills.home.search
    description_translation_key: app_skills.home.search.description
    icon_image: home.svg
    preprocessor_hint: >-
      Housing search is currently unavailable because no permitted provider is configured. Report this limitation;
      do not attempt alternate provider access.
    class_path: backend.apps.home.skills.search_skill.SearchSkill
    pricing:
      per_unit:
        credits: 10
    providers: []
    exclude_fields_for_llm:
      - type
      - image_url
      - image_urls
      - id
    suggestions_follow_up_requests:
      - Show only apartments under 1000 EUR
      - Search in a different city
      - Show larger apartments (3+ rooms)
      - Compare prices across providers
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: >
            Array of housing search requests. Each request searches for
            apartments and rooms in a German city across multiple platforms.
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: >
                  City or location name to search in, e.g. "Berlin", "Munich", "Hamburg".
              listing_type:
                x-ui:
                  basic: true
                type: string
                description: >-
                  Search is currently unavailable without a permitted provider.
                enum:
                  - rent
                  - buy
                default: rent
              providers:
                x-ui:
                  basic: false
                type: array
                description: >-
                  Optional source identifier; search is currently unavailable.
                items:
                  type: string
              property_type:
                x-ui:
                  basic: true
                type: string
                enum:
                  - apartment
                  - shared_room
                default: apartment
                description: Search is currently unavailable without a permitted provider.
              sort:
                x-ui:
                  basic: false
                type: string
                enum:
                  - price_asc
                  - newest
                default: price_asc
                description: Search is currently unavailable without a permitted provider.
              max_price_eur:
                x-ui:
                  basic: true
                type: number
                minimum: 0
                description: Maximum advertised monthly rent or purchase price in EUR. Price basis varies by
                  provider.
              min_rooms:
                x-ui:
                  basic: false
                type: number
                minimum: 0
                description: Minimum advertised rooms. Results with unknown rooms are excluded when set.
              min_size_sqm:
                x-ui:
                  basic: false
                type: number
                minimum: 0
                description: Minimum advertised area in square metres. Unknown area is excluded when set.
              min_price_eur:
                type: number
                minimum: 0
                description: Minimum advertised price in EUR.
              max_rooms:
                type: number
                minimum: 0
              max_size_sqm:
                type: number
                minimum: 0
              max_warm_rent_eur:
                type: number
                minimum: 0
                description: Maximum explicitly advertised total monthly rent, including service costs.
                  Unknown total rent is unconfirmed.
              max_cold_rent_eur:
                type: number
                minimum: 0
                description: Maximum explicitly advertised cold monthly rent, excluding service costs.
              available_by:
                type: string
                format: date
                description: Must be available on or before this ISO date.
              required_amenities:
                type: array
                default: []
                maxItems: 7
                description: Explicit hard amenity requirements; unknown evidence is not a confirmed match.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              excluded_amenities:
                type: array
                default: []
                maxItems: 7
                description: Amenities the user explicitly excludes. Missing evidence does not prove absence.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              preferred_amenities:
                type: array
                default: []
                maxItems: 7
                description: Soft amenity preferences; these rank results without excluding unknowns.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              include_unconfirmed:
                type: boolean
                default: false
                description: Include clearly labelled listings with missing evidence for requirements;
                  explicit conflicts remain excluded.
              visual_analysis:
                type: boolean
                default: true
                description: Assess a bounded subset of supplied photos for requested features, preserving the
                  complete gallery.
              neighborhood_categories:
                type: array
                default: []
                maxItems: 5
                items:
                  type: string
                  enum: [water, park, transit, groceries, school]
              neighborhood_radius_m:
                type: integer
                minimum: 100
                maximum: 5000
                default: 1500
              max_water_distance_m:
                type: number
                minimum: 0
                maximum: 5000
                description: Maximum supported distance to a shoreline, not to a water feature's
                  representative point.
              max_water_walk_minutes:
                type: number
                minimum: 0
                maximum: 120
                description: Maximum supported walk to a public waterfront; a straight-line estimate cannot
                  satisfy this.
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language housing-ranking goal, separate from the location
                  query. Set it whenever the user states an intended use, household need, desired
                  quality, or preference not represented by structured filters. Example: "Prioritize
                  explicit balcony and quiet-setting evidence." Omit only for a neutral search fully
                  expressed by query and structured fields. Rank only explicit listing facts and
                  never infer unstated qualities. Only max_results listings are returned.
              max_results:
                x-ui:
                  basic: false
                type: integer
                description: Maximum number of listings to return (1-20, default 10).
                default: 10
                minimum: 1
                maximum: 20
            required:
              - query
      required:
        - requests

    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements:
        - location
      test_allowed: true
      test_example_input:
        requests:
          - query: Berlin
            property_type: apartment
            providers:
              - source
            sort: newest
            max_results: 3
