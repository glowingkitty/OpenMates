instructions:
  - instruction: |
      **Home Search Skill**

      - **home-search**: Search for apartments, houses, and WG rooms in German cities.
        Searches ImmoScout24, Kleinanzeigen, and WG-Gesucht simultaneously.
        Returns listings with prices, sizes, addresses, and direct links.
        Costs 10 credits per search.
      - Use when the user asks to find housing, apartments, rooms, or real estate in Germany.
      - Always specify only the city name as query; put other needs in structured filters and relevance_criteria.
      - Distinguish required_amenities ("with a balcony", "must have"), excluded_amenities ("without"),
        and preferred_amenities ("ideally", "prefer"). Keep every material preference in relevance_criteria.
      - A warm-rent budget uses max_warm_rent_eur, not generic advertised price. Unknown costs or amenities
        are not confirmed. include_unconfirmed explicitly allows labelled uncertain listings.
      - Use neighborhood_categories and explicit max_water_distance_m/max_water_walk_minutes when supplied.
        Report sourced shoreline distance separately from actual walking access. Approximate locations,
        representative water points and missing routes cannot establish a precise proximity requirement.
      - Explain match_evidence, visual_assessment coverage and provider/gallery limitations. Never claim all
        photos were analyzed or infer amenity absence from unseen photos. The UI gallery retains all supplied photos.
      - Ground both qualitative and numerical water proximity, walking time and geocoding claims in returned evidence.
        A street name or general knowledge about a neighborhood cannot establish proximity. If enrichment
        is unavailable, timed out or candidate-limited, state that water proximity is unverified. A city
        fallback coordinate is only an approximate area marker, never a street or building match.
        If no water feature was returned and the listing text does not mention water, report unknown;
        do not describe the apartment as near a river or lake. Explain geocode failure only from its status.
      - A visible balcony in a sampled photo does not establish that it belongs to this apartment.
        Separate photo visibility from advertised/text confirmation and retain conflicts or uncertainty.
      - Report a fixed or open-ended lease only when the listing explicitly states it. A missing end date
        does not establish an open-ended lease. Explicitly surface conflicts between description dates and
        structured available_from/available_to (including the year), and whole-flat versus room ambiguity.
        Do not present rent components as a complete breakdown unless they reconcile with the stated total;
        label any unitemized amount and unknown heating inclusion explicitly.
      - WG-Gesucht only has rental listings — it is automatically skipped for "buy" searches.
skills:
  # -----------------------------------------------------------------------
  # Search — search German housing platforms for apartments and rooms
  # -----------------------------------------------------------------------
  - id: search
    anonymous_access: inline
    name_translation_key: app_skills.home.search
    description_translation_key: app_skills.home.search.description
    icon_image: home.svg
    preprocessor_hint: >
      Search for apartments, houses, and WG rooms in German cities.
      Searches ImmoScout24, Kleinanzeigen, and WG-Gesucht simultaneously.
      Returns listings with prices, sizes, rooms, addresses, and direct links.
      Costs 10 credits per search. Use when user asks about finding housing in Germany.
      Keep query focused on the location. Whenever the user states an intended use, household need,
      desired quality, or preference not fully captured by price, room, size, property-type, or sort
      fields, put it in relevance_criteria even if related words could also be added to query. Example:
      "Prioritize listings with explicit balcony and quiet-setting evidence." Omit relevance_criteria
      only for a neutral housing search fully expressed by query and structured fields. Never invent
      amenities, commute, lease, accessibility, or neighborhood qualities. Use required_amenities for
      explicit must-have features and preferred_amenities for soft preferences. Preserve warm versus cold
      rent using the corresponding budget field. For requests near water/parks/transit/groceries/schools,
      select neighborhood_categories and retain the natural language criteria. Numerical water distance
      and walking limits must use their structured fields; unknown or approximate evidence cannot confirm them.
    class_path: backend.apps.home.skills.search_skill.SearchSkill
    pricing:
      per_unit:
        credits: 10
    providers:
      - name: ImmoScout24
        no_api_key: true
      - name: Kleinanzeigen
        no_api_key: true
      - name: WG-Gesucht
        no_api_key: true
    exclude_fields_for_llm:
      - type
      - image_url
      - image_urls
      - id
    suggestions_follow_up_requests:
      - Show only apartments under 1000 EUR
      - Search in a different city
      - Show larger apartments (3+ rooms)
      - Compare prices across providers
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: >
            Array of housing search requests. Each request searches for
            apartments and rooms in a German city across multiple platforms.
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: >
                  City or location name to search in, e.g. "Berlin", "Munich", "Hamburg".
              listing_type:
                x-ui:
                  basic: true
                type: string
                description: >
                  Type of listing. "rent" for rentals (default), "buy" for purchases.
                  Note: WG-Gesucht only has rentals and is skipped for "buy".
                enum:
                  - rent
                  - buy
                default: rent
              providers:
                x-ui:
                  basic: false
                type: array
                description: >
                  Optional list of providers to search. Defaults to all three.
                items:
                  type: string
                  enum:
                    - ImmoScout24
                    - Kleinanzeigen
                    - WG-Gesucht
              property_type:
                x-ui:
                  basic: true
                type: string
                enum:
                - apartment
                - shared_room
                default: apartment
                description: Entire apartments or shared rooms. Shared rooms use WG-Gesucht.
              sort:
                x-ui:
                  basic: false
                type: string
                enum:
                - price_asc
                - newest
                default: price_asc
                description: Price ascending, or discovery order for monitoring. Newest order is
                  supported by Kleinanzeigen; other providers retain their source order.
              max_price_eur:
                x-ui:
                  basic: true
                type: number
                minimum: 0
                description: Maximum advertised monthly rent or purchase price in EUR. Price basis
                  varies by provider.
              min_rooms:
                x-ui:
                  basic: false
                type: number
                minimum: 0
                description: Minimum advertised rooms. Results with unknown rooms are excluded when
                  set.
              min_size_sqm:
                x-ui:
                  basic: false
                type: number
                minimum: 0
                description: Minimum advertised area in square metres. Unknown area is excluded
                  when set.
              min_price_eur:
                type: number
                minimum: 0
                description: Minimum advertised price in EUR.
              max_rooms:
                type: number
                minimum: 0
              max_size_sqm:
                type: number
                minimum: 0
              max_warm_rent_eur:
                type: number
                minimum: 0
                description: Maximum explicitly advertised total monthly rent, including service costs. Unknown total rent is unconfirmed.
              max_cold_rent_eur:
                type: number
                minimum: 0
                description: Maximum explicitly advertised cold monthly rent, excluding service costs.
              available_by:
                type: string
                format: date
                description: Must be available on or before this ISO date.
              required_amenities:
                type: array
                default: []
                maxItems: 7
                description: Explicit hard amenity requirements; unknown evidence is not a confirmed match.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              excluded_amenities:
                type: array
                default: []
                maxItems: 7
                description: Amenities the user explicitly excludes. Missing evidence does not prove absence.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              preferred_amenities:
                type: array
                default: []
                maxItems: 7
                description: Soft amenity preferences; these rank results without excluding unknowns.
                items:
                  type: string
                  enum: [balcony, terrace, garden, elevator, furnished, parking, pets_allowed]
              include_unconfirmed:
                type: boolean
                default: false
                description: Include clearly labelled listings with missing evidence for requirements; explicit conflicts remain excluded.
              visual_analysis:
                type: boolean
                default: true
                description: Assess a bounded subset of supplied photos for requested features, preserving the complete gallery.
              neighborhood_categories:
                type: array
                default: []
                maxItems: 5
                items:
                  type: string
                  enum: [water, park, transit, groceries, school]
              neighborhood_radius_m:
                type: integer
                minimum: 100
                maximum: 5000
                default: 1500
              max_water_distance_m:
                type: number
                minimum: 0
                maximum: 5000
                description: Maximum supported distance to a shoreline, not to a water feature's representative point.
              max_water_walk_minutes:
                type: number
                minimum: 0
                maximum: 120
                description: Maximum supported walk to a public waterfront; a straight-line estimate cannot satisfy this.
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language housing-ranking goal, separate from the location
                  query. Set it whenever the user states an intended use, household need, desired
                  quality, or preference not represented by structured filters. Example: "Prioritize
                  explicit balcony and quiet-setting evidence." Omit only for a neutral search fully
                  expressed by query and structured fields. Rank only explicit listing facts and
                  never infer unstated qualities. Only max_results listings are returned.
              max_results:
                x-ui:
                  basic: false
                type: integer
                description: Maximum number of listings to return (1-20, default 10).
                default: 10
                minimum: 1
                maximum: 20
            required:
              - query
      required:
        - requests

    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements:
      - location
      test_allowed: true
      test_example_input:
        requests:
        - query: Berlin
          property_type: apartment
          providers:
          - Kleinanzeigen
          sort: newest
          max_results: 3
