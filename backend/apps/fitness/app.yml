name_translation_key: fitness
description_translation_key: fitness.description
icon_image: |
  fitness.svg
category: personal
last_updated: '2025-11-12'
embed_types:
  - id: search_locations
    category: app-skill-use
    skill_id: search_locations
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: location
    child_frontend_type: fitness-location
    groupable: false
    preview_component: fitness/FitnessSearchEmbedPreview.svelte
    fullscreen_component: fitness/FitnessSearchEmbedFullscreen.svelte
    child_preview_component: fitness/FitnessResultEmbedPreview.svelte
    child_fullscreen_component: fitness/FitnessResultEmbedFullscreen.svelte
    icon: fitness
    gradient_var: "--color-app-fitness"
    i18n_namespace: embeds.fitness.search_locations
  - id: search_classes
    category: app-skill-use
    skill_id: search_classes
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: class
    child_frontend_type: fitness-class
    groupable: false
    preview_component: fitness/FitnessSearchEmbedPreview.svelte
    fullscreen_component: fitness/FitnessSearchEmbedFullscreen.svelte
    child_preview_component: fitness/FitnessResultEmbedPreview.svelte
    child_fullscreen_component: fitness/FitnessResultEmbedFullscreen.svelte
    icon: fitness
    gradient_var: "--color-app-fitness"
    i18n_namespace: embeds.fitness.search_classes
skills:
  - id: search_locations
    anonymous_access: inline
    name_translation_key: fitness.search_locations
    description_translation_key: fitness.search_locations.description
    preprocessor_hint: >
      Search Urban Sports Club public fitness locations. Use this when the user
      asks for gyms, studios, pools, or Urban Sports locations near a city,
      address, or radius. Do not use it for class availability; use
      fitness.search_classes for dated class searches. Keep query focused on the activity or
      venue type. Whenever the user states a fitness purpose, intended activity, accessibility
      need, desired quality, or preference that should change venue ordering, put it in
      relevance_criteria even if related words could also be added to query. Example: "Prioritize
      broad yoga variety with explicit central-Berlin evidence." Keep city, radius, plan, and
      category structured. Omit relevance_criteria only for a neutral venue search; never invent
      beginner level, intensity, accessibility, equipment, atmosphere, or schedule preferences.
    tool_schema:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              query:
                type: string
              city:
                type: string
              address:
                type: string
              lat:
                type: number
              lon:
                type: number
              radius_km:
                type: number
              plan:
                type: string
              category:
                type: string
              limit:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
              relevance_criteria:
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language venue-ranking goal, separate from the activity
                  query. Set it whenever the user states a fitness purpose, intended activity,
                  accessibility need, desired quality, or preference that should change ordering.
                  Example: "Broad yoga variety with explicit central-Berlin evidence." Omit only for
                  a neutral search fully expressed by query and structured fields.
          description: Location search requests.
    class_path: |
      backend.apps.fitness.skills.search_locations.SearchLocationsSkill
    pricing:
      fixed: 5
    providers:
      - name: Urban Sports Club
        id: urban_sports_club
        scope: city
        region: Europe
        no_api_key: true
  - id: search_classes
    anonymous_access: inline
    name_translation_key: fitness.search_classes
    description_translation_key: fitness.search_classes.description
    preprocessor_hint: >
      Search available Urban Sports Club public fitness classes. Use this when
      the user asks for dated fitness classes, course availability, free spots,
      on-site classes, online classes, or plan-filtered Urban Sports classes.
      Omit plan unless the user explicitly asks for Essential, Classic,
      Premium, or Max. Keep query focused on the activity. Whenever the user states a fitness
      purpose, intended activity, audience level, desired quality, or preference that should change
      class ordering, put it in relevance_criteria even if related words could also be added to query.
      Example: "Prioritize evening on-site yoga classes with explicit remaining spots." Keep date,
      location, radius, plan, attendance mode, minimum spots, category, and venue structured. Omit
      relevance_criteria only for a neutral class search; never invent preferences.
    tool_schema:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              query:
                type: string
              city:
                type: string
              address:
                type: string
              lat:
                type: number
              lon:
                type: number
              radius_km:
                type: number
              start_date:
                type: string
              end_date:
                type: string
              days:
                type: number
              plan:
                type: string
              attendance_mode:
                type: string
              min_spots:
                type: number
              category:
                type: string
              venue_id:
                type: string
              limit:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
              relevance_criteria:
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language class-ranking goal, separate from the activity
                  query. Set it whenever the user states a fitness purpose, intended activity,
                  audience level, desired quality, or preference that should change ordering. Example:
                  "Evening on-site yoga classes with explicit remaining spots." Omit only for a neutral
                  search fully expressed by query and structured fields.
          description: Class search requests.
    class_path: |
      backend.apps.fitness.skills.search_classes.SearchClassesSkill
    pricing:
      fixed: 5
    providers:
      - name: Urban Sports Club
        id: urban_sports_club
        scope: city
        region: Europe
        no_api_key: true
