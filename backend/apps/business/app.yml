skills:
  - id: company_financials
    anonymous_access: inline
    name_translation_key: app_skills.business.company_financials
    description_translation_key: app_skills.business.company_financials.description
    icon_image: business.svg
    api_config:
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Get official SEC EDGAR financial filing facts for explicit public company
      tickers, CIKs, or exact company names, including revenue, profit, cash flow,
      and balance sheet data. Use for company performance research and comparisons;
      do not use for private companies, investment advice, stock-price forecasts,
      portfolio decisions, or discovering companies by broad category.
    class_path: backend.apps.business.skills.company_financials.CompanyFinancialsSkill
    providers:
      - name: SEC EDGAR
        no_api_key: true
    suggestions_follow_up_requests:
      - "Compare with another public company"
      - "Show annual history"
      - "Open the source filing"
    exclude_fields_for_llm:
      - source_url
      - accession_number
      - history.source_url
      - history.accession_number
    tool_schema:
      type: object
      properties:
        companies:
          x-ui:
            basic: true
          type: array
          description: Explicit public companies to look up by ticker, CIK, or exact company name. Do not pass broad categories such as "egg producers".
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: Ticker, CIK, or exact public company name, e.g. CALM, 0000016160, or Cal-Maine Foods Inc.
              identifier_type:
                x-ui:
                  basic: false
                type: string
                enum: [auto, ticker, cik, company_name]
                default: auto
              display_name:
                x-ui:
                  basic: false
                type: string
                description: Optional user-facing label from the original request.
            required:
              - query
        period:
          x-ui:
            basic: true
          type: string
          enum: [latest_annual, latest_quarter, annual_history, quarterly_history]
          default: latest_annual
        metric_group:
          x-ui:
            basic: true
          type: string
          enum: [summary, income, balance_sheet, cash_flow, all]
          default: summary
        years:
          x-ui:
            basic: true
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        include_sources:
          x-ui:
            basic: false
          type: boolean
          default: true
      required:
        - companies
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        companies:
          - query: CALM
        period: latest_annual
        metric_group: summary
        years: 1
        include_sources: true
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
              basic: false
            type: string
          result_count:
            x-ui:
              basic: false
            type: integer
          provider:
            x-ui:
              basic: false
            type: string
          results:
            x-ui:
              basic: true
            type: array
            items:
              type: object
              properties:
                company:
                  x-ui:
                    basic: true
                  type: string
                ticker:
                  x-ui:
                    basic: true
                  type: string
                period_type:
                  x-ui:
                    basic: true
                  type: string
                fiscal_year:
                  x-ui:
                    basic: true
                  type: integer
                revenue:
                  x-ui:
                    basic: true
                  type: number
                net_income:
                  x-ui:
                    basic: true
                  type: number
                source_url:
                  x-ui:
                    basic: true
                  type: string
                cik:
                  x-ui:
                    basic: false
                  type: string
                country:
                  x-ui:
                    basic: false
                  type: string
                exchange:
                  x-ui:
                    basic: false
                  type: string
                fiscal_quarter:
                  x-ui:
                    basic: false
                  type: string
                period_start:
                  x-ui:
                    basic: false
                  type: string
                period_end:
                  x-ui:
