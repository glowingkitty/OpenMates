skills:
  - id: search_trademarks
    name_translation_key: app_skills.business.search_trademarks
    description_translation_key: app_skills.business.search_trademarks.description
    icon_image: business.svg
    api_config: {expose_get: true, expose_post: true}
    preprocessor_hint: >
      This capability is currently unavailable because no permitted provider is configured.
    class_path: backend.apps.business.skills.search_trademarks.SearchTrademarksSkill
    pricing: {fixed: 1}
    external_data: true
    provider_required: true
    providers: []
    suggestions_follow_up_requests:
      - "Compare another name"
      - "Search similar spellings"
      - "Review the matching goods and services"
    exclude_fields_for_llm: [source_url]
    tool_schema:
      type: object
      additionalProperties: false
      properties:
        queries:
          x-ui: {basic: true}
          type: array
          minItems: 1
          maxItems: 3
          description: Up to three explicit candidate brand or product names; search finalists rather than entire brainstorming lists.
          items: {type: string, minLength: 1, maxLength: 120}
        regions:
          x-ui: {basic: true}
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: Target territories to search. US is automated; EU, DE and WORLDWIDE currently return unsupported coverage with manual sources. Never substitute US results for another territory.
          items: {type: string, enum: [US, EU, DE, WORLDWIDE]}
        nice_classes:
          x-ui: {basic: false}
          type: array
          maxItems: 10
          description: Optional Nice classes based on actual goods/services; omitting searches all classes. Classes alone do not determine legal conflict.
          items: {type: integer, minimum: 1, maximum: 45}
        status:
          x-ui: {basic: true}
          type: string
          enum: [active, all]
          default: active
          description: Active includes pending applications and live registrations; all also includes ended records.
        match:
          x-ui: {basic: true}
          type: string
          enum: [exact, similar]
          default: similar
          description: Exact wordmark or spelling similarity. Similar is an edit-distance name search, not comprehensive phonetic or legal clearance.
        max_results:
          x-ui: {basic: false}
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      required: [queries, regions]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input: {queries: [ADIDAS], regions: [US], match: exact, max_results: 3}
      output_schema:
        type: object
        properties:
          result_count: {type: integer, x-ui: {basic: true}}
          matches: {type: array, items: {type: object}, x-ui: {basic: true}}
          regions: {type: array, items: {type: string}, x-ui: {basic: true}}
          nice_classes: {type: array, items: {type: integer}, x-ui: {basic: false}}
          status_filter: {type: string, x-ui: {basic: false}}
          match: {type: string, x-ui: {basic: false}}
          coverage: {type: array, items: {type: object}, x-ui: {basic: true}}
          partial: {type: boolean, x-ui: {basic: true}}
          limitation: {type: string, x-ui: {basic: true}}
          summary: {type: string, x-ui: {basic: false}}
          error: {type: string, x-ui: {basic: false}}
  - id: search_investors
    name_translation_key: app_skills.business.search_investors
    description_translation_key: app_skills.business.search_investors.description
    icon_image: business.svg
    api_config: {expose_get: true, expose_post: true}
    preprocessor_hint: >
      This capability is currently unavailable because no permitted provider is configured.
    class_path: backend.apps.business.skills.search_investors.SearchInvestorsSkill
    pricing: {fixed: 1}
    external_data: true
    provider_required: true
    providers: []
    suggestions_follow_up_requests:
      - "Narrow to another stage"
      - "Search another region"
      - "Draft an outreach note"
    exclude_fields_for_llm: [profile_url, website_url]
    tool_schema:
      type: object
      additionalProperties: false
      properties:
        query:
          x-ui: {basic: true}
          type: string
          minLength: 1
          maxLength: 200
          description: Topic, sector or investment thesis keywords describing the company, for example "climate software seed". Do not include confidential company details.
        regions:
          x-ui: {basic: true}
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: Countries the user wants investors from, as upper-case ISO 3166-1 alpha-2 codes. Pass exactly the countries the user named; never widen silently to other countries. Use WORLDWIDE only when the user asks for it.
          items: {type: string, pattern: "^([A-Z]{2}|WORLDWIDE)$"}
        investor_types:
          x-ui: {basic: false}
          type: array
          maxItems: 6
          uniqueItems: true
          description: Optional investor kinds; omit to search all kinds.
          items: {type: string, enum: [angel, angel_network, vc, family_office, accelerator, public_funding]}
        stages:
          x-ui: {basic: false}
          type: array
          maxItems: 4
          uniqueItems: true
          description: Optional financing stages the company is at; omit when unknown.
          items: {type: string, enum: [pre_seed, seed, series_a, later]}
        ticket_min:
          x-ui: {basic: false}
          type: number
          minimum: 0
          description: Optional minimum investment size per investor, in the given currency.
        ticket_max:
          x-ui: {basic: false}
          type: number
          minimum: 0
          description: Optional maximum investment size per investor, in the given currency.
        currency:
          x-ui: {basic: false}
          type: string
          pattern: "^[A-Z]{3}$"
          default: EUR
          description: ISO 4217 currency of ticket_min and ticket_max.
        max_results:
          x-ui: {basic: false}
          type: integer
          minimum: 1
          maximum: 30
          default: 15
      required: [query, regions]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input: {query: climate software, regions: [DE], stages: [seed], max_results: 3}
      output_schema:
        type: object
        properties:
          result_count: {type: integer, x-ui: {basic: true}}
          investors: {type: array, items: {type: object}, x-ui: {basic: true}}
          regions: {type: array, items: {type: string}, x-ui: {basic: true}}
          provider: {type: string, x-ui: {basic: false}}
          warnings: {type: array, items: {type: string}, x-ui: {basic: true}}
          partial: {type: boolean, x-ui: {basic: true}}
          limitation: {type: string, x-ui: {basic: true}}
          error: {type: string, x-ui: {basic: false}}
  - id: company_ownership
    name_translation_key: app_skills.business.company_ownership
    description_translation_key: app_skills.business.company_ownership.description
    icon_image: business.svg
    api_config: {expose_get: true, expose_post: true}
    preprocessor_hint: >
      Look up who owns or runs a named company, or which companies a named person
      holds or directs, in the official company register of Germany (DE), the United
      Kingdom (GB) or France (FR). Use to research investors, shareholders and
      directors; not for other countries, credit checks, private contact details or
      legal advice.
    class_path: backend.apps.business.skills.company_ownership.CompanyOwnershipSkill
    pricing: {fixed: 1}
    external_data: true
    providers:
      - name: openregister
        display_name: OpenRegister
      - name: companies_house
        display_name: Companies House
      - name: recherche_entreprises
        display_name: Annuaire des Entreprises
        no_api_key: true
    suggestions_follow_up_requests:
      - "Show the companies this person holds"
      - "List the directors"
      - "Look up the parent company"
    exclude_fields_for_llm: [records.subject.source_url, records.holdings.source_url]
    tool_schema:
      type: object
      additionalProperties: false
      properties:
        requests:
          x-ui: {basic: true}
          type: array
          minItems: 1
          maxItems: 5
          description: One entry per company or person to look up. Each runs only in the register of its own country.
          items:
            type: object
            additionalProperties: false
            properties:
              query:
                x-ui: {basic: true}
                type: string
                minLength: 1
                maxLength: 160
                description: Exact company name or register number (for example "Example GmbH", "12345678", a 9-digit SIREN), or a person's full name.
              subject:
                x-ui: {basic: true}
                type: string
                enum: [company, person]
                default: company
                description: company to see owners and officers; person to see which companies they hold or direct.
              country:
                x-ui: {basic: true}
                type: string
                pattern: "^[A-Z]{2}$"
                description: Upper-case ISO 3166-1 alpha-2 code of the register to search (DE, GB or FR). Never guess a different country.
              include:
                x-ui: {basic: false}
                type: array
                uniqueItems: true
                maxItems: 3
                default: [owners]
                description: Which facts to fetch. Ask only for what the user needs; each extra value costs a separate register call.
                items: {type: string, enum: [owners, holdings, officers]}
            required: [query, country]
      required: [requests]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        requests:
          - {query: Mistral AI, country: FR, include: [officers]}
      output_schema:
        type: object
        properties:
          result_count: {type: integer, x-ui: {basic: true}}
          records: {type: array, items: {type: object}, x-ui: {basic: true}}
          providers: {type: array, items: {type: string}, x-ui: {basic: false}}
          warnings: {type: array, items: {type: string}, x-ui: {basic: true}}
          errors: {type: array, items: {type: object}, x-ui: {basic: false}}
  - id: company_financials
    pricing: {fixed: 1} # Preserves the existing minimum-credit fallback.
    anonymous_access: inline
    name_translation_key: app_skills.business.company_financials
    description_translation_key: app_skills.business.company_financials.description
    icon_image: business.svg
    api_config:
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Get official SEC EDGAR financial filing facts for explicit public company
      tickers, CIKs, or exact company names, including revenue, profit, cash flow,
      and balance sheet data. Use for company performance research and comparisons;
      do not use for private companies, investment advice, stock-price forecasts,
      portfolio decisions, or discovering companies by broad category.
    class_path: backend.apps.business.skills.company_financials.CompanyFinancialsSkill
    providers:
      - name: SEC EDGAR
        no_api_key: true
    suggestions_follow_up_requests:
      - "Compare with another public company"
      - "Show annual history"
      - "Open the source filing"
    exclude_fields_for_llm:
      - source_url
      - accession_number
      - history.source_url
      - history.accession_number
    tool_schema:
      type: object
      properties:
        companies:
          x-ui:
            basic: true
          type: array
          description: Explicit public companies to look up by ticker, CIK, or exact company name. Do not pass broad categories such as "egg producers".
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: Ticker, CIK, or exact public company name, e.g. CALM, 0000016160, or Cal-Maine Foods Inc.
              identifier_type:
                x-ui:
                  basic: false
                type: string
                enum: [auto, ticker, cik, company_name]
                default: auto
              display_name:
                x-ui:
                  basic: false
                type: string
                description: Optional user-facing label from the original request.
            required:
              - query
        period:
          x-ui:
            basic: true
          type: string
          enum: [latest_annual, latest_quarter, annual_history, quarterly_history]
          default: latest_annual
        metric_group:
          x-ui:
            basic: true
          type: string
          enum: [summary, income, balance_sheet, cash_flow, all]
          default: summary
        years:
          x-ui:
            basic: true
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        include_sources:
          x-ui:
