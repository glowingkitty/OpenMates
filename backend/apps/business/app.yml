focuses:
  - id: find_brand_name
    icon_image: business.svg
    name_translation_key: business.find_brand_name
    description_translation_key: business.find_brand_name.description
    process_translation_key: focus_modes.business_find_brand_name.process
    systemprompt_translation_key: focus_modes.business_find_brand_name.systemprompt
    how_to_use:
      - Help me find a name for my new product.
      - I need a calm, memorable brand name for a budgeting app for US freelancers.
      - Compare these two finalists and their .com domains before I choose.
    preprocessor_hint: >
      Select when the user wants help creating or choosing a brand, business or
      product name and its domain, including Help me find a name for my new product.
      For a standalone trademark or domain lookup, use the relevant search skill.
  - id: price_products
    icon_image: business.svg
    name_translation_key: business.price_products
    description_translation_key: business.price_products.description
    process_translation_key: focus_modes.business_price_products.process
    systemprompt_translation_key: focus_modes.business_price_products.systemprompt
    how_to_use:
      - Help me price the outfits I sew.
      - What should I charge for my handmade candles? How many do I need to sell to break even?
      - I'm a freelance photographer. Work out a fair day rate.
    preprocessor_hint: >
      Select when the user wants to set, check or justify prices for
      products or services they make or sell: price my products, outfits
      or candles, what should I charge, fair day rate, costs, margins or
      break-even. Do not select for company valuation,
      taxes or accounting, stock-market questions, or comparing shop
      prices when buying.
  - id: find_business_angels
    icon_image: business.svg
    name_translation_key: business.find_business_angels
    description_translation_key: business.find_business_angels.description
    process_translation_key: focus_modes.business_find_business_angels.process
    systemprompt_translation_key: focus_modes.business_find_business_angels.systemprompt
    how_to_use:
      - Find business angels in Germany for my B2B software startup. We seek 500k EUR pre-seed.
      - Who invested in comparable rounds to mine in the UK? I build tools for dentists.
      - I need angels who know climate hardware, in France and Germany only.
    preprocessor_hint: >
      Select when a founder wants to find business angels or early investors for their company: find angels for my round, who could invest in my startup, angel investors in specific countries, comparable rounds and who backed them. Do not select for researching one named investor, writing outreach, pitch preparation, planning the round itself, researching a company as a customer or employer, stock investing, or personal finance.
  - id: research_investor
    icon_image: business.svg
    name_translation_key: business.research_investor
    description_translation_key: business.research_investor.description
    process_translation_key: focus_modes.business_research_investor.process
    systemprompt_translation_key: focus_modes.business_research_investor.systemprompt
    how_to_use:
      - Research this investor before I email them.
      - Is this angel still active? What did they back, and do they conflict with my space?
      - Find out how I could get a warm introduction to this firm.
    preprocessor_hint: >
      Select when a founder wants background on one named investor, angel or investment firm before approaching them: what they invested in, their thesis, whether they are active, red flags, likely questions and warm-intro paths. Do not select for finding a list of investors, writing outreach, pitch preparation, planning a round, researching a company as a customer or employer, stock investing, or personal finance.
  - id: write_investor_outreach
    icon_image: business.svg
    name_translation_key: business.write_investor_outreach
    description_translation_key: business.write_investor_outreach.description
    process_translation_key: focus_modes.business_write_investor_outreach.process
    systemprompt_translation_key: focus_modes.business_write_investor_outreach.systemprompt
    how_to_use:
      - Write a cold email to this investor for my seed round.
      - A friend knows her. Write a forwardable intro I can send to my friend.
      - I got no reply. Write two follow-ups to the investor.
    preprocessor_hint: >
      Select when a founder wants to write messages to an investor or angel: a cold email, an intro blurb a mutual contact can forward, or follow-ups after no reply. Do not select for finding investors, researching an investor in depth, pitch rehearsal, planning the round, job applications, newsletters or mass email campaigns, stock investing, or personal finance.
  - id: prepare_investor_pitch
    icon_image: business.svg
    name_translation_key: business.prepare_investor_pitch
    description_translation_key: business.prepare_investor_pitch.description
    process_translation_key: focus_modes.business_prepare_investor_pitch.process
    systemprompt_translation_key: focus_modes.business_prepare_investor_pitch.systemprompt
    how_to_use:
      - Build the pitch storyline for my seed round. I attach my current deck.
      - What is missing or weak in my pitch? Here are my numbers.
