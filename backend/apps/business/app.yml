    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        companies:
          - query: CALM
        period: latest_annual
        metric_group: summary
        years: 1
        include_sources: true
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
