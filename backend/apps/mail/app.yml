  capability:
    type: artifact
    id: email
  caption:
    en: Create an email draft
    de: Entwirf eine E-Mail
  example_chat_id: example-private-plumber-email

name_translation_key: mail
description_translation_key: mail.description
icon_image: |
  mail.svg
category: work
last_updated: "2026-03-04"
embed_types:
  - id: email
    category: direct
    frontend_type: mail-email
    backend_type: mail
    has_children: false
    groupable: true
    preview_component: mail/MailEmbedPreview.svelte
    fullscreen_component: mail/MailEmbedFullscreen.svelte
    icon: mail
    gradient_var: "--color-app-mail"
    i18n_namespace: embeds.mail.email
    content_catalog:
      enabled: true
      diff_editable: true
      content_type_id: email
      name: Email draft
      description: Drafted email messages with recipients, subject, body, and optional signature/footer.
      icon: mail
      example_key: mail.email
      order: 10
    content_fields:
      - name: receiver
        type: string
        required: true
      - name: subject
        type: string
      - name: content
        type: string
        required: true
      - name: footer
        type: string
  - id: search
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: email
    child_frontend_type: mail-email
    groupable: true
    preview_component: mail/MailSearchEmbedPreview.svelte
    fullscreen_component: mail/MailSearchEmbedFullscreen.svelte
    child_preview_component: mail/MailEmbedPreview.svelte
    child_fullscreen_component: mail/MailEmbedFullscreen.svelte
    icon: mail
    gradient_var: "--color-app-mail"
    i18n_namespace: embeds.mail.email
    content_fields:
      - name: query
        type: string
      - name: provider
        type: string
      - name: start_date
        type: string
      - name: end_date
        type: string
