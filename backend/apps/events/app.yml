                    - 38C3
                    - 37C3
                  description: Official conference schedule provider; general event discovery is unavailable.
                description:
                  x-ui:
                    basic: false
                  type: string
                  example: An example community gathering for people working with AI.
                date_start:
                  x-ui:
                    basic: true
                  type: string
                  example: '2026-09-23T18:00:00+02:00'
                date_end:
                  x-ui:
                    basic: false
