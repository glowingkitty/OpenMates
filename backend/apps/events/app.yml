focuses:
  - id: plan_conference_talk
    auto_activate_when_relevant: true
    icon_image: event.svg
    name_translation_key: events.plan_conference_talk
    description_translation_key: events.plan_conference_talk.description
    process_translation_key: focus_modes.events_plan_conference_talk.process
    systemprompt_translation_key: focus_modes.events_plan_conference_talk.systemprompt
    how_to_use:
      - I work on a large open source project and want to submit a talk, so what should I consider first?
      - Help me pick a talk idea for FOSDEM from what I've built this year.
      - Polish my talk proposal abstract for the CFP.
    preprocessor_hint: >
      Select when the user wants to submit, propose, plan or give a talk,
      session, workshop or presentation at a conference or meetup, including
      asking for tips or advice before submitting a talk or planning talk
      ideas, answering a CFP (call for papers or proposals), or choosing a
      talk topic, title or abstract. Do not select for only finding or listing
      conferences, travel planning, or general public-speaking coaching.
