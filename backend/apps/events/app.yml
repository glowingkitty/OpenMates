            type: string
            example: Events search completed
          result_count:
            x-ui:
              basic: false
            type: integer
            example: 1
          provider:
            x-ui:
              basic: false
            type: string
            example: Example events provider
            enum:
              - auto
              - pretalx
              - GPN24
              - 39C3
              - 38C3
              - 37C3
            description: Official conference schedule provider; general event discovery is unavailable.
          results:
            x-ui:
              basic: true
            type: array
            items:
              type: object
              properties:
                id:
                  x-ui:
