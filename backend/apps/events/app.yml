landing:
  enabled: false
name_translation_key: events
description_translation_key: events.description
icon_image: |
  event.svg
category: personal
last_updated: "2026-03-08"
instructions: []
# Embed type definitions — single source of truth for frontend embed routing.
embed_types:
  - id: search
    authoring:
      kind: events.event
      schema_id: events.event
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: event
    child_content_type: event_result
    child_frontend_type: events-event
    groupable: false
    preview_component: events/EventsSearchEmbedPreview.svelte
    fullscreen_component: events/EventsSearchEmbedFullscreen.svelte
    child_preview_component: events/EventEmbedPreview.svelte
    child_fullscreen_component: events/EventEmbedFullscreen.svelte
    icon: search
    gradient_var: "--color-app-events"
    i18n_namespace: embeds.events.search
skills:
  - id: search
    default_enabled: false
    anonymous_access: inline
    name_translation_key: events.search
    description_translation_key: events.search.description
    icon_image: search.svg
    preprocessor_hint: >-
      Prefer this over web search for any question about upcoming events or conferences, anywhere: in a city, a
      country, a region such as Europe, or worldwide. Results come from public web pages and, for GPN24, 39C3, 38C3
      and 37C3, from their official schedules (set conference only for those). Without a city give only a topic
      query. Include past_events only when requested. Never retry another source or fall back to web search.
    class_path: |
      backend.apps.events.skills.search_skill.SearchSkill
    # Operator-installed app packages may add providers implementing this contract;
    # the overlay then shows the model these provider-aware descriptions instead.
    installed_provider_descriptions:
      properties.provider: >-
        Event provider id to limit the search to; omit or use auto to search every available provider.
      properties.requests: >-
        Array of event searches. Use for upcoming events and conferences anywhere: in a city (set location), or in a
        country, a region such as Europe or worldwide (omit location; results also come from public web pages). Set
        conference only for the listed official schedules. IDs are generated when omitted.
      properties.requests.items.properties.location: >-
        City or place to search in. Omit for a country, a region such as Europe, or worldwide and give only the topic
        in query.
    provider_contract: events.search@1
    pricing:
      per_unit:
        credits: 15
    supplier_costs:
      per_unit:
        price: 0.0085
        currency: USD
        source_url: https://brave.com/search/api/
        note: >-
          Public web pages per request item: one Brave Search API request (USD 0.005) plus Mercury 3 extraction of
          up to five pages (about USD 0.0035). Official schedule exports and installed providers have no cost.
    providers:
      - name: GPN24
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 39C3
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 38C3
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 37C3
        id: pretalx
        scope: conference
        no_api_key: true
    suggestions_follow_up_requests:
      - "Find more events this week"
      - "Search events in another city"
      - "Find online events"
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # Description can be long (1-5 KB) - exclude from LLM context to save tokens
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "description"
      - "image_url"
    tool_schema:
      type: object
      properties:
        provider:
          x-ui:
            basic: false
          type: string
          description: >-
            Source to limit the search to; omit or use auto to search public web pages and the official schedules.
            pretalx or a conference id searches only that official schedule.
          enum:
            - auto
            - pretalx
            - GPN24
            - 39C3
            - 38C3
            - 37C3
        requests:
          x-ui:
            basic: true
          type: array
          description: >-
            Array of event searches. Use for upcoming events and conferences anywhere: in a city (set location), or in a
            country, a region such as Europe or worldwide (omit location; results come from public web pages). Set
            conference only for GPN24, 39C3, 38C3 or 37C3. IDs are generated when omitted.
          items:
            type: object
            x-ui:
              control: date-range
              start_field: start_date
              end_field: end_date
              max_offset_days: 365
              basic: false
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: >-
                  Event topic to search for (e.g. 'AI', 'security'). Required for every request unless conference is set to a known conference; then omit it for the full schedule. Location or dates alone are not a query.
              location:
                x-ui:
                  basic: true
                type: string
                description: >-
                  City or place to search in. Omit for a country, a region such as Europe, or worldwide and give only
                  the topic in query. A location alone is not a query.
              lat:
                x-ui:
                  basic: false
                type: number
                description: "Latitude of search center (decimal degrees). Overrides location string if provided."
              lon:
                x-ui:
                  basic: false
                type: number
                description: "Longitude of search center (decimal degrees). Overrides location string if provided."
              start_date:
                x-ui:
                  basic: false
                type: string
                description: "Start of date range in ISO 8601 format. Include UTC offset if known (e.g. '2026-03-01T00:00:00+01:00').
                  An optional matching IANA annotation such as [Europe/Berlin] is accepted. Preserve the user's
                  requested date range. If omitted, defaults to now."
              end_date:
                x-ui:
                  basic: false
                type: string
                description: "End of date range in ISO 8601 format (same format as start_date). If omitted, no upper
                  bound is applied."
              event_type:
                type: string
                description: "Filter by event type. Use 'PHYSICAL' when user searches for events in a city (default
                  for location-based searches). Use 'ONLINE' when user explicitly asks for virtual/online/remote
                  events. Omit only when user wants both types."
                x-ui:
                  basic: false
                enum:
                  - "PHYSICAL"
                  - "ONLINE"
              radius_miles:
                x-ui:
                  basic: false
                type: number
                description: "Search radius in miles from the center coordinates (default: 25, ~40 km). Only applies
                  to PHYSICAL events."
                default: 25
              count:
                x-ui:
                  basic: false
                type: integer
                description: "Maximum number of events to return (default: 10, max: 50). Use 10 unless the user
                  asks for more results."
                minimum: 1
                maximum: 50
                default: 10
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language event-ranking goal, separate from the event
                  query. Set it whenever the user states a purpose, intended audience, networking
                  goal, desired activity, or preference such as promoting a product or finding a
                  future speaking opportunity. Omit only for a neutral event search fully expressed
                  by query and structured fields; never invent preferences. When present, up to 40
                  candidates (or the larger requested count) are scored against both the event topic
                  and this goal. Results with no credible relationship are omitted, so fewer than
                  count can be returned rather than padding the response with irrelevant events.
                  When omitted, the query topic is still checked without expanding provider
                  retrieval or changing the order of retained events.
              provider:
                x-ui:
                  basic: false
                type: string
                description: "Source of the results (an official conference schedule, web for public web pages, or an installed provider)."
                enum:
                  - auto
                  - pretalx
                  - GPN24
                  - 39C3
                  - 38C3
                  - 37C3
              providers:
                x-ui:
                  basic: false
                type: array
                items:
                  type: string
                  enum:
                    - pretalx
                description: "Official conference schedule sources only."
              conference:
                x-ui:
                  basic: false
                type: string
                description: "Known GPN/Congress schedule to search. Supported values: GPN24, 39C3, 38C3, 37C3."
                enum:
                  - "GPN24"
                  - "39C3"
                  - "38C3"
                  - "37C3"
              past_events:
                x-ui:
                  basic: false
                type: boolean
                description: "Default false. Set true only when the user explicitly asks to include past/completed
                  conference sessions."
                default: false
              concert_tags:
                x-ui:
                  basic: false
                type: array
                items:
                  type: string
                description: >-
                  Reserved tags; no concert source is configured.
      required:
        - requests
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        requests:
          - query: security
            location: Berlin
            count: 3
            conference: 39C3
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
              basic: false
            type: string
            example: Events search completed
          result_count:
            x-ui:
              basic: false
            type: integer
            example: 1
          provider:
            x-ui:
              basic: false
            type: string
            example: Example events provider
            enum:
              - auto
              - pretalx
              - GPN24
              - 39C3
              - 38C3
              - 37C3
            description: Source of the results (an official conference schedule, web for public web pages, or an installed provider).
          results:
            x-ui:
              basic: true
            type: array
            items:
              type: object
              properties:
                id:
                  x-ui:
                    basic: false
                  type: string
                  example: example-event
                source_id:
                  x-ui:
                    basic: false
                  type: string
                  example: example-event
                title:
                  x-ui:
