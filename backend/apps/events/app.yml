landing:
  enabled: false
name_translation_key: events
description_translation_key: events.description
icon_image: |
  event.svg
category: personal
last_updated: "2026-03-08"
settings_and_memories:
  - id: saved_events
    name_translation_key: events.saved_events
    description_translation_key: events.saved_events.description
    icon_image: event.svg
    type: list
    schema:
      type: object
      properties:
        embed_id:
          type: string
          description: Referenced embed id for preview/fullscreen reopen
        title:
          type: string
          description: Event title
          is_title: true
        provider:
          type: string
          description: Source provider
        url:
          type: string
          description: Event URL
        date_start:
          type: string
          description: Event start datetime
          is_subtitle: true
        date_end:
          type: string
          description: Event end datetime
        location:
          type: string
          description: Venue or online location
        notes:
          type: string
          description: Optional notes
          multiline: true
      required:
        - title
instructions: []
# Embed type definitions — single source of truth for frontend embed routing.
embed_types:
  - id: search
    category: app-skill-use
    skill_id: search
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: event
    child_content_type: event_result
    child_frontend_type: events-event
    groupable: false
    preview_component: events/EventsSearchEmbedPreview.svelte
    fullscreen_component: events/EventsSearchEmbedFullscreen.svelte
    child_preview_component: events/EventEmbedPreview.svelte
    child_fullscreen_component: events/EventEmbedFullscreen.svelte
    icon: search
    gradient_var: "--color-app-events"
    i18n_namespace: embeds.events.search
skills:
  - id: search
    anonymous_access: inline
    name_translation_key: events.search
    description_translation_key: events.search.description
    icon_image: search.svg
    preprocessor_hint: >-
      Search only official conference schedules for GPN24, 39C3, 38C3 and 37C3. Set conference to the requested
      event. General city, concert and online event discovery are unavailable. Include past_events only when requested.
      Never retry another source or fall back to web search.
    class_path: |
      backend.apps.events.skills.search_skill.SearchSkill
    pricing:
      per_unit:
        credits: 30
    providers:
      - name: GPN24
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 39C3
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 38C3
        id: pretalx
        scope: conference
        no_api_key: true
      - name: 37C3
        id: pretalx
        scope: conference
        no_api_key: true
    suggestions_follow_up_requests:
      - "Find more events this week"
      - "Search events in another city"
      - "Find online events"
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # Description can be long (1-5 KB) - exclude from LLM context to save tokens
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "description"
      - "image_url"
    tool_schema:
      type: object
      properties:
        provider:
          x-ui:
            basic: false
          type: string
          description: >-
            Official conference schedule provider; general event discovery is unavailable.
          enum:
            - auto
            - pretalx
            - GPN24
            - 39C3
            - 38C3
            - 37C3
        requests:
          x-ui:
            basic: true
          type: array
          description: >-
            Array of official conference schedule searches. Set conference to GPN24, 39C3, 38C3 or 37C3, or name
            the conference in query. General city and online discovery are unavailable. IDs are generated when omitted.
          items:
            type: object
            x-ui:
              control: date-range
              start_field: start_date
              end_field: end_date
              max_offset_days: 365
              basic: false
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: >-
                  Optional session topic within the requested known conference. Omit for the full schedule.
              location:
                x-ui:
                  basic: true
                type: string
                description: >-
                  Optional location text retained for compatibility. A location alone does not enable event discovery;
                  a known conference is required.
              lat:
                x-ui:
                  basic: false
                type: number
                description: "Latitude of search center (decimal degrees). Overrides location string if provided."
              lon:
                x-ui:
                  basic: false
                type: number
                description: "Longitude of search center (decimal degrees). Overrides location string if provided."
              start_date:
                x-ui:
                  basic: false
                type: string
                description: "Start of date range in ISO 8601 format. Include UTC offset if known (e.g. '2026-03-01T00:00:00+01:00').
                  An optional matching IANA annotation such as [Europe/Berlin] is accepted. Preserve the user's
                  requested date range. If omitted, defaults to now."
              end_date:
                x-ui:
                  basic: false
                type: string
                description: "End of date range in ISO 8601 format (same format as start_date). If omitted, no upper
                  bound is applied."
              event_type:
                type: string
                description: "Filter by event type. Use 'PHYSICAL' when user searches for events in a city (default
                  for location-based searches). Use 'ONLINE' when user explicitly asks for virtual/online/remote
                  events. Omit only when user wants both types."
                x-ui:
                  basic: false
                enum:
                  - "PHYSICAL"
                  - "ONLINE"
              radius_miles:
                x-ui:
                  basic: false
                type: number
                description: "Search radius in miles from the center coordinates (default: 25, ~40 km). Only applies
                  to PHYSICAL events."
                default: 25
              count:
                x-ui:
                  basic: false
                type: integer
                description: "Maximum number of events to return (default: 10, max: 50). Use 10 unless the user
                  asks for more results."
                minimum: 1
                maximum: 50
                default: 10
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language event-ranking goal, separate from the event
                  query. Set it whenever the user states a purpose, intended audience, networking
                  goal, desired activity, or preference such as promoting a product or finding a
                  future speaking opportunity. Omit only for a neutral event search fully expressed
                  by query and structured fields; never invent preferences. When present, up to 40
                  candidates (or the larger requested count) are scored against both the event topic
                  and this goal. Results with no credible relationship are omitted, so fewer than
                  count can be returned rather than padding the response with irrelevant events.
                  When omitted, the query topic is still checked without expanding provider
                  retrieval or changing the order of retained events.
              provider:
                x-ui:
                  basic: false
                type: string
                description: "Official conference schedule provider; general event discovery is unavailable."
                enum:
                  - auto
                  - pretalx
                  - GPN24
                  - 39C3
                  - 38C3
                  - 37C3
              providers:
                x-ui:
                  basic: false
                type: array
                items:
                  type: string
                  enum:
                    - pretalx
                description: "Official conference schedule sources only."
              conference:
                x-ui:
                  basic: false
                type: string
                description: "Known GPN/Congress schedule to search. Supported values: GPN24, 39C3, 38C3, 37C3."
                enum:
                  - "GPN24"
                  - "39C3"
                  - "38C3"
                  - "37C3"
              past_events:
                x-ui:
                  basic: false
                type: boolean
                description: "Default false. Set true only when the user explicitly asks to include past/completed
                  conference sessions."
                default: false
              concert_tags:
                x-ui:
                  basic: false
                type: array
                items:
                  type: string
                description: >-
                  Reserved tags; no concert source is configured.
      required:
        - requests
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        requests:
          - query: security
            location: Berlin
            count: 3
            conference: 39C3
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
