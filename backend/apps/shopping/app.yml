name_translation_key: shopping
description_translation_key: shopping.description
icon_image: |
  shopping.svg
category: lifestyle
last_updated: "2026-02-22"
instructions:
  - tool_phase_only: false
    instruction: |
      **Shopping answer grounding**
      User reference photos, search criteria and similarity scores are not product-photo observations.
      When results provide only catalogue titles/facts and scores, attribute descriptions to the catalogue
      title and report facts/scores. Do not invent a "Design Match" narrative or unreturned stripe
      orientation, motif placement, texture, or presence/absence of stripes. Explain rejection using
      returned reasons only; otherwise report threshold counts. Label lower-fit or partial alternatives
      separately from products meeting every stated requirement. A brand establishes only the brand;
      identify a seller or manufacturer only when explicitly returned. Do not infer exact identity or
      fibre percentages from titles or scores.
# Embed type definitions — single source of truth for frontend embed routing.
embed_types:
  - id: search_products
    authoring:
      kind: shopping.product
      schema_id: shopping.product
    category: app-skill-use
    skill_id: search_products
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: product
    child_frontend_type: shopping-product
    groupable: false
    preview_component: shopping/ShoppingSearchEmbedPreview.svelte
    fullscreen_component: shopping/ShoppingSearchEmbedFullscreen.svelte
    child_preview_component: shopping/ShoppingResultEmbedPreview.svelte
    child_fullscreen_component: shopping/ShoppingResultEmbedFullscreen.svelte
    icon: shopping
    gradient_var: "--color-app-shopping"
    i18n_namespace: embeds.shopping.search_products
skills:
  # -----------------------------------------------------------------------
  # -----------------------------------------------------------------------
  - id: search_products
    anonymous_access: inline
    name_translation_key: app_skills.shopping.search_products
    description_translation_key: app_skills.shopping.search_products.description
    icon_image: shopping.svg
    preprocessor_hint: 'Currently unavailable: no authorized provider is configured. Do not promise live
      search results.'
    class_path: backend.apps.shopping.skills.search_products.SearchProductsSkill
    providers: []
    provider_required: true
    exclude_fields_for_llm:
      - type
      - product_id
      - image_url
      - image_urls
      - category_ids
      - order_limit
      - search_rank
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: >
            Array of product search requests. Each request searches for
            products matching a query on a compatible shopping provider. Use separate entries
            for distinct user requirements, not alternative sorts of one visual requirement.
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: >
                  Search query, e.g. "bio joghurt", "coffee grinder", "wireless mouse".
              category:
                x-ui:
                  basic: true
                type: string
                description: Optional product category.
                enum:
                  - grocery
                  - fabrics
                  - sewing_supplies
                  - patterns
                  - general_marketplace
                  - electronics
                  - home
                  - fashion
                  - beauty
                  - books
                  - sports
                  - toys
                  - automotive
                  - health
                  - music
                  - movies
                  - tools
                  - office
                  - pet_supplies
                  - video_games
                  - baby
              max_results:
                x-ui:
                  basic: true
                type: integer
                description: >
                  Final product cap (1-20, default 10). Honor the user's requested maximum,
                  e.g. 5 for "at most five". Relevance/reference searches already discover up to
                  40 candidates internally; a larger final cap does not increase discovery.
                minimum: 1
                maximum: 20
                default: 10
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language product-ranking goal, separate from the product
                  query. Set it whenever the user states an intended use, audience, compatibility
                  need, desired quality, or preference that should change ordering. Example: "Good
                  for travel, with explicit quiet-click, long-battery, and multi-device evidence."
                  Omit only for a neutral search fully expressed by query and structured fields.
              reference_images:
                x-ui:
                  basic: true
                type: array
                maxItems: 3
                items:
                  type: string
                  minLength: 1
                  maxLength: 512
                description: >
                  Up to three exact image embed_refs from the conversation, including uploaded
                  and generated images. Authenticated API/CLI callers can supply their uploaded
                  image embed UUIDs. Uses available product photos AND descriptions to rank and
                  filter visual matches; preserves structured product and price results. An empty
                  array leaves normal search behavior unchanged. No raw image URLs or base64.
                  Inspect visual_evaluation and visual_match for unavailable comparisons.
              sort:
                x-ui:
                  basic: false
                type: string
                description: Requested result ordering when product search becomes available.
                enum:
                  - relevance
                  - price_asc
                  - price_desc
                  - new
                  - review_rank
                  - newest
                  - best_sellers
                default: relevance
              country:
                x-ui:
                  basic: false
                type: string
                description: Optional destination country code.
              min_price:
                x-ui:
                  basic: false
                type: number
                description: Optional minimum price in the requested currency.
              max_price:
                x-ui:
                  basic: false
                type: number
                description: Optional maximum price in the requested currency.
            required:
              - query
      required:
        - requests
