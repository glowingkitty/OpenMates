# Diagram Design generates editable, self-contained HTML/SVG diagrams.
app_id: diagrams
name_translation_key: diagrams
description_translation_key: diagrams.description
icon_image: diagram.svg
category: work
last_updated: "2026-10-11"
settings_and_memories: []
instructions:
  - instruction: |
      When the user asks for a diagram and the Diagrams app is selected, create a
      self-contained HTML document with inline CSS and an accessible inline SVG.
      Output the complete document in one ```openmates_diagram fenced block.
      Set integer data-om-render-width and data-om-render-height on the root
      html element to fit the whole document at that viewport, including the
      heading, SVG, padding, and footer; mark the primary SVG with
      data-om-diagram for its selected type. Set data-om-background on the root
      html element to the resolved opaque six-digit #RRGGBB body/artboard
      background color, so the preview surround matches the diagram page.
      Do not use a CSS variable, named color, currentColor, or transparency there.
      Use the selected Diagram Design type guidance when present. Keep SVG nodes,
      labels, and attached connectors editable with the data-om-* metadata contract
      in the loaded guide. Use local Lexend and system font fallbacks. Do not add
      scripts, external assets, network font links, or imported source directives.
