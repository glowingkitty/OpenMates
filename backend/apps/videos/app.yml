    preview_component: videos/VideoTranscriptEmbedPreview.svelte
    fullscreen_component: videos/VideoTranscriptEmbedFullscreen.svelte
    icon: transcript
    gradient_var: "--color-app-videos"
    i18n_namespace: embeds.videos.get_transcript
  - id: generate
    category: app-skill-use
    skill_id: generate
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: generated_video
    child_frontend_type: videos-generated-video
    child_preview_component: videos/VideoGenerateEmbedPreview.svelte
    child_fullscreen_component: videos/VideoGenerateEmbedFullscreen.svelte
    preview_component: GeneratedMediaGroupEmbedPreview.svelte
    fullscreen_component: GeneratedMediaGroupEmbedFullscreen.svelte
    icon: videos
    gradient_var: "--color-app-videos"
    i18n_namespace: embeds.videos.generate
    content_fields:
      - {name: status, type: string, required: true}
      - {name: embed_ref, type: string}
      - {name: result_count, type: number, required: true}
      - {name: embed_ids, type: array, required: true}
      - {name: input_embed_ids, type: array}
      - {name: output_embed_refs, type: array}
      - {name: failed_results, type: array}
    child_content_fields:
      - {name: input_embed_ids, type: array}
      - {name: prompt, type: string, required: true}
      - {name: model, type: string, required: true}
      - {name: files, type: object, required: true}
      - {name: s3_base_url, type: string, required: true}
      - {name: aes_key, type: string, required: true}
      - {name: made_by, type: string}
      - {name: routing_decided_by, type: string}
      - {name: timeline, type: object}
      - {name: fps, type: number}
      - {name: width, type: number}
      - {name: height, type: number}
      - {name: duration_seconds, type: number}
      - {name: version, type: number}
      - {name: source_titles, type: array}
      - {name: remotion_source, type: string}
      - {name: filename, type: string}
      - {name: attempts, type: number}
      - {name: author_model, type: string}
      - {name: can_extend_end, type: boolean}
      - {name: can_extend_start, type: boolean}
  - id: generated_video
    category: direct
    frontend_type: videos-generated-video
    backend_type: generated_video
    has_children: false
    preview_component: videos/VideoGenerateEmbedPreview.svelte
    fullscreen_component: videos/VideoGenerateEmbedFullscreen.svelte
    icon: videos
    gradient_var: "--color-app-videos"
    i18n_namespace: embeds.videos.generate
  - id: create
    category: app-skill-use
    skill_id: create
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: generated_video
    child_frontend_type: videos-generated-video
    child_preview_component: videos/VideoGenerateEmbedPreview.svelte
    child_fullscreen_component: videos/VideoGenerateEmbedFullscreen.svelte
    preview_component: videos/VideoCreateEmbedPreview.svelte
    fullscreen_component: videos/VideoCreateEmbedFullscreen.svelte
    icon: videos
    gradient_var: "--color-app-videos"
    i18n_namespace: embeds.videos.create
    content_catalog:
      enabled: true
      content_type_id: rendered_video
      name: Rendered video
      description: Deterministic Remotion videos rendered from durable editable source code.
      icon: videos
      example_key: videos.rendered_video
      order: 20
focuses:
  - id: analyze_video
    name_translation_key: videos.analyze_video
    description_translation_key: videos.analyze_video.description
    process_translation_key: focus_modes.videos_analyze_video.process
    systemprompt_translation_key: focus_modes.videos_analyze_video.systemprompt
    icon_image: videos.svg
    preprocessor_hint: >
      Select when the user shares a YouTube video URL and asks to analyze,
      summarize, fact-check, assess credibility, detect bias, or verify claims made
      in the video. Do not select for general video search, video generation, or
      broad web research that is not centered on a specific video.
instructions:
  - instruction: |
      After videos-generate finishes, include every successful video with its
      inline child embed_ref in the final answer, in request order. Say whether
      it is a generative clip or a composed video (made_by). Describe failed
      outputs honestly with their reason; nothing was charged for them.
  - instruction: |
      When the user asks to change an earlier video, call videos-generate with
      that video's embed_ref as source_video. "Extend this video at the end: …"
      maps to change extend_end, "Extend this video at the start: …" to change
      extend_start, and "Apply these edits to this video: …" to change edit;
      the text after the colon is the instructions.
      A video is changed only by that call, also when it is a composed,
      code-rendered video: never answer with a code diff, code snippet or file
      edit of its composition instead.
  - instruction: |
      When a video is about search results (web, news, image or video search),
      pass in images the exact embed_ref of every result it is about, in the
      order they should appear, also for results where you see no picture:
      the skill gives the video author each result's picture (when it has one)
      together with its title, description, source and date. When the user
      means a whole earlier search ("from these news", "make a video of these
      results"), pass that search's own embed_ref (for example news-search-…)
      instead of listing every result. At most 12 references per video.
skills:
  - id: generate
    anonymous_access: authenticated
    name_translation_key: app_skills.videos.generate
    description_translation_key: app_skills.videos.generate.description
    icon_image: ai.svg
    api_config:
      # REST offers text-only generative clips; pictures, composed videos and changes need the chat's embed context.
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Make any short video from a natural-language instruction, optionally with up to 12 references from
      this chat (uploads, generated images, vector graphics, image/web/news/video search results with or
      without a picture, or a whole search). Each request is made either as a generative clip (invented realistic or stylized footage,
      camera movement, animating one picture) or as a composed, code-rendered video (exact texts and
      titles, lists, numbers, charts, diagrams, slideshows or recaps of the given pictures, anything
      based on search results, two or more pictures, any voice-over, sound effects or music). The skill decides the kind itself from
      the instructions and pictures. Pass the user's request in instructions without turning it into
      a cinematic prompt, and name the exact texts to show. When the video is based on search
      results or other pictures in this chat, pass each one's exact embed_ref in images (results
      without a visible picture too; the skill reads their pictures and texts itself). To change an earlier result pass
      its embed_ref as source_video with change edit, extend_start or extend_end.
      The skill makes the video's sound itself: put a wanted voice-over (with its exact words), sound
      effects and music in instructions and do not call audio or music skills for the same video.
      Do not use this for fake real-world footage, fake endorsements, public-figure
      likeness/persona/voice imitation, scams, spam, or watermark/detection evasion.
    class_path: backend.apps.videos.skills.generate_skill.GenerateSkill
    providers:
      - Google
      - fal.ai
      - E2B
      - OpenAI
      - Anthropic
    full_model_reference: google/gemini-omni-1.2-flash
    # Generative clips: per measured second of the delivered clip at the model's per-resolution price
    # (Gemini Omni 720p: 105 credits; 360p 35, 1080p 156, 4k 314).
    # A change is charged once for what it used (added clip seconds, opening still, author tokens, render).
    # Composed videos: author model tokens at the model's price plus the per_minute price per started render minute.
    # A request without a delivered video is never charged.
    pricing:
      per_second: 105
      per_minute: 10
    supplier_costs:
      per_second:
        model: google/gemini-omni-1.2-flash
      per_minute:
        price: 0.00444
        currency: USD
        source_url: https://e2b.dev/pricing
        note: E2B 4 vCPU, 4 GiB composed render
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: REQUIRED array of video request objects, one per video.
          items:
            type: object
            properties:
              instructions:
                x-ui:
                  basic: true
                type: string
                maxLength: 4000
                description: >
                  What the user asked for, kept close to their own words: what the video shows, order,
                  style, mood and pacing. Say so when it is based on search results or given pictures,
                  and include the exact texts to show (headlines, titles, numbers) word for word.
              user_request:
                type: string
                maxLength: 2000
                description: >
                  The user's latest message about this video, copied word for word. Always pass it.
              images:
                x-ui:
                  basic: true
                type: array
                maxItems: 12
                items:
                  type: string
                description: >
                  Exact embed_refs of what the video shows or is about, in the order they should appear:
                  uploads, generated images, vector graphics, and search results of image, web, news or
                  video search. Pass every search result the video is based on, also when you see no
                  picture for it: the skill reads each result's picture (when it has one) together with its
                  title, description, source and date. The embed_ref of a whole search (e.g. a news search
                  shown earlier) stands for all of its results. A generative clip can start from one picture only.
              mode:
                # Not offered to the assistant: the routing model decides from the request itself.
                x-assistant: false
                x-ui:
                  basic: true
                type: string
                enum: ["auto", "generative", "composed"]
                default: "auto"
                description: >
                  auto decides per request. generative = invented footage from a video model.
                  composed = exact, code-rendered video (texts, charts, slideshows, several pictures).
              aspect_ratio:
                x-ui:
                  basic: true
                type: string
                enum: ["16:9", "9:16", "1:1"]
                default: "16:9"
                description: 1:1 is available for composed videos only.
              duration_seconds:
                x-ui:
                  basic: true
                type: integer
                minimum: 2
                maximum: 60
                description: Optional length. Generative clips last 3 to 15 seconds (default 8); composed videos 2 to 60; a clip added by extend_start or extend_end 3 to 10.
              resolution:
                x-ui:
                  basic: false
                type: string
                enum: ["360p", "480p", "720p", "1080p", "4k"]
                description: Generative Gemini Omni clips 360p, 720p, 1080p or 4k (default 720p); H3 is fixed 480p.
              model:
                # Not offered to the assistant: naming it would skip the routing model.
                x-assistant: false
                x-ui:
                  basic: false
                type: string
                enum: ["gemini-omni-1.2-flash", "minimax/h3-max-turbo/image-to-video"]
                description: >
                  Only for generative clips; naming a model makes the request generative. H3 (fixed
                  5-second 480p clips from one picture) is available in authenticated chats; REST supports Gemini Omni only.
              seed:
                x-ui:
                  basic: false
                type: integer
                description: Optional seed for more reproducible generative output when supported.
              source_video:
                x-ui:
                  basic: false
                type: string
                description: >
                  Exact embed_ref of an earlier videos-generate result to change. Use with change.
              change:
                x-ui:
                  basic: false
                type: string
                enum: ["edit", "extend_start", "extend_end"]
                description: >
                  How source_video changes (it becomes the next version of the same video): edit applies
                  the instructions to it, extend_start adds a new generated clip before it, extend_end
                  adds one after it (only for videos made of generated clips).
              input_embed_ids:
                # Not offered to the assistant: naming it would skip the routing model.
                x-assistant: false
                x-ui:
                  basic: false
                type: array
                maxItems: 1
                items:
                  type: string
                  format: uuid
                description: Former first-frame field (one image embed UUID, H3 only). Prefer images.
            required:
              - instructions
      required:
        - requests
    exclude_fields_for_llm:
      - s3_base_url
      - files
      - aes_key
      - aes_nonce
      - vault_wrapped_aes_key
      - timeline
      - remotion_source
      - filename
      - attempts
  - id: get_transcript
    anonymous_access: authenticated
    name_translation_key: videos.get_transcript
    description_translation_key: videos.get_transcript.description
    icon_image: transcript.svg
    preprocessor_hint: >
      Get published captions/transcript content for a media.ccc.de talk URL.
      YouTube transcript retrieval is unavailable. Use this for summaries of media.ccc.de talks.
      Some talks have no published captions; report that limitation honestly
      instead of treating the page description as a transcript.
    class_path: |
      backend.apps.videos.skills.transcript_skill.TranscriptSkill
    providers:
      - name: media.ccc.de
        id: media_ccc
        no_api_key: true
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # These fields are removed before adding to message history for LLM processing
    # but remain in the full response stored in chat history for proper UI rendering
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "metadata"
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: |
            REQUIRED: Array of transcript request objects for parallel processing. 
            This parameter is MANDATORY - you MUST always provide a 'requests' array, even for a single transcript.
            Example for single transcript: {"requests": [{"url": "https://media.ccc.de/v/talk-one"}]}
            Example for multiple transcripts: {"requests": [{"url": "https://media.ccc.de/v/talk-one"}, {"url": "https://media.ccc.de/v/talk-two"}]}
            Each object must contain 'url' (media.ccc.de talk URL), and can include optional parameters (languages).
            media.ccc.de example: {"requests": [{"url": "https://media.ccc.de/v/39c3-a-post-american-enshittification-resistant-internet"}]}
            Note: The 'id' field is auto-generated if not provided - you don't need to include it.
          items:
            type: object
            properties:
              url:
                x-ui:
                  basic: true
                type: string
                format: uri
                description: Canonical https://media.ccc.de/v/<slug> URL. Retrieves published captions only; some talks have none.
              languages:
                x-ui:
                  basic: true
                type: array
                description: List of language codes to try for transcript (ISO 639-1, e.g., 'en', 'de', 'es', 'fr'). The API will use the first available language.
                items:
                  type: string
                default: ["en", "de", "es", "fr"]
            required:
              - url
      required:
        - requests
  - id: search
    anonymous_access: inline
    name_translation_key: videos.search
    description_translation_key: videos.search.description
    icon_image: search.svg
    preprocessor_hint: >
      Search for videos, documentaries, tutorials, and clips on the web. Also select it
      proactively for how-to, repair, technique, exercise, or other procedure questions where
      seeing the process materially helps, instead of writing long step lists; skip it for
      abstract, data-only, or simple answers. Keep query focused on the topic. Whenever the user states a viewing or learning purpose, audience level, desired depth,
      format, authority, or other preference that should change ordering, put it in
      relevance_criteria even if related words could also be added to query. Example: query "RAG
      tutorial" with relevance_criteria "Advanced, hands-on production guidance with deployment and
      evaluation details." Keep country, language, safe-search, freshness, and count structured.
      Omit relevance_criteria only for a neutral video search; never invent preferences.
    class_path: |
      backend.apps.videos.skills.search_skill.SearchSkill
    providers:
      - Brave
    # Follow-up suggestions shown to users after search results
    suggestions_follow_up_requests:
      - "Get transcript for this video"
      - "Search more videos"
      - "Watch related videos"
    # Fields to exclude from LLM inference (but keep in full results for UI rendering)
    # These fields are removed before adding to message history for LLM processing
    # but remain in the full response stored in chat history for proper UI rendering
    exclude_fields_for_llm:
      - "type"
      - "hash"
      - "meta_url.favicon"
      - "thumbnail.original"
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          description: |
            REQUIRED: Array of search request objects for parallel processing (up to 5 requests). 
            This parameter is MANDATORY - you MUST always provide a 'requests' array, even for a single search.
            Example for single search: {"requests": [{"query": "Python tutorial"}]}
            Example for multiple searches: {"requests": [{"query": "Python tutorial"}, {"query": "FastAPI tutorial"}]}
            Each object must contain 'query' (search query string), and can include optional parameters (count, relevance_criteria, country, search_lang, safesearch, freshness).
            Note: The 'id' field is auto-generated if not provided - you don't need to include it.
          items:
            type: object
            properties:
              query:
                x-ui:
                  basic: true
                type: string
                description: Search query string
              count:
                x-ui:
                  basic: true
                type: integer
                description: Number of results for this request (max 20)
                minimum: 1
                maximum: 20
                default: 6
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional concise natural-language video-ranking goal, separate from the topic query.
                  Set it whenever the user states a viewing or learning purpose, audience level,
                  desired depth, format, authority, or preference that should change ordering. Example:
                  "Advanced, hands-on production guidance with deployment and evaluation details."
                  Omit only for a neutral search fully expressed by query and structured fields.
              country:
                x-ui:
                  basic: true
                type: string
                description: "Country code for localized results. Must be one of: AR, AU, AT, BE, BR, CA, CL, DK, FI, FR, DE, GR, HK, IN, ID, IT, JP, KR, MY, MX, NL, NZ, NO, CN, PL, PT, PH, RU, SA, ZA, ES, SE, CH, TW, TR, GB, US, or ALL (case-insensitive). Defaults to 'us' if invalid."
                enum:
                  [
