settings_and_memories: []
instructions:
  - instruction: |
      When you use the weather-forecast tool, the tool returns compact daily summaries for inference and creates one detailed weather day embed per requested day. Use the summaries for normal answers. If the user asks for exact hourly details, refer to or inspect the relevant day embed instead of guessing.
  - instruction: |
      When you use the weather-rain-radar tool, the tool returns deterministic rain summaries and compact timeline metadata for German DWD radar. Use those summaries for inference. Do not describe raw radar pixels or storage fields; the fullscreen embed renders the radar timeline separately.
skills:
  - id: forecast
    anonymous_access: inline
    name_translation_key: apps.weather.forecast
    description_translation_key: apps.weather.forecast.description
    icon_image: search.svg
    preprocessor_hint: >
      Get current and upcoming weather forecasts for a place, including daily weather, temperatures,
      rain likelihood, and hourly details stored in day embeds. Use start_date and end_date for an
      inclusive date range. Use this for weather questions, forecast requests, and trip/day planning
      involving weather.
    class_path: |
      backend.apps.weather.skills.forecast_skill.ForecastSkill
    pricing:
      fixed: 1
    providers:
      - name: deutscher_wetterdienst
        display_name: Deutscher Wetterdienst (DWD)
        no_api_key: true
      - name: open_meteo
        display_name: Open-Meteo
        no_api_key: true
    suggestions_follow_up_requests:
      - "When will it rain exactly?"
      - "Show the hourly forecast for one day"
      - "Compare the next few days"
    exclude_fields_for_llm:
      - type
      - hourly
      - source
      - provider_raw
      - fallback_source_ids
      - data_quality
    tool_schema:
      type: object
      x-ui:
        control: date-range
        start_field: start_date
        end_field: end_date
        min: today
        max_offset_days: 13
        default: today
      properties:
        location:
          type: string
          description: "Place name for the forecast, e.g. Berlin, Karlsruhe, Tokyo. Required unless latitude and longitude are provided."
        days:
          type: integer
          description: "Compatibility input for older clients. Number of days from today; defaults to 7 and cannot be combined with start_date/end_date."
          minimum: 1
          maximum: 14
          default: 7
          x-ui:
            hidden: true
        start_date:
          type: string
          format: date
          description: "First forecast date, inclusive, in the location timezone. Must be today or later and supplied with end_date."
        end_date:
          type: string
          format: date
          description: "Last forecast date, inclusive, in the location timezone. Must be within the 14-day forecast window and supplied with start_date."
        latitude:
          type: number
          description: "Optional latitude in decimal degrees. Use with longitude for exact coordinates."
        longitude:
          type: number
          description: "Optional longitude in decimal degrees. Use with latitude for exact coordinates."
        timezone:
          type: string
          description: "Optional IANA timezone. Defaults to provider/location timezone."
        units:
          type: string
          description: "Unit system. Only metric is currently supported."
          enum: ["metric"]
          default: "metric"
      required:
        - location
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [location]
      test_allowed: true
      test_example_input:
        location: Berlin
        start_date:
          $date: today
          format: date
        end_date:
          $date: today
          format: date
      output_schema:
        type: object
        properties:
          summary:
            type: string
            example: Weather forecast for Berlin
          result_count:
            type: integer
            example: 1
          start_date:
            type: string
            format: date
            example: '2026-09-21'
          end_date:
            type: string
            format: date
            example: '2026-09-21'
          rain_probability:
            type:
            - number
            - 'null'
            example: 60
          max_temperature_c:
            type:
            - number
            - 'null'
            example: 20
          rain_expected:
            type:
            - boolean
            - 'null'
            example: true
          rain_summary:
            type: string
            example: 'Rain is forecast today: 12:00–14:00 (Europe/Berlin).'
          forecast_day:
            type: object
            properties:
              date:
                type: string
                example: '2026-09-21'
              title:
                type: string
                example: Berlin weather
              timezone:
                type: string
                example: Europe/Berlin
              condition:
                type:
                - string
                - 'null'
                example: rain
              temperature_min_c:
                type:
                - number
                - 'null'
                example: 12
              temperature_max_c:
                type:
                - number
                - 'null'
                example: 20
              precipitation_total_mm:
                type:
                - number
                - 'null'
                example: 1.2
              precipitation_probability_max_pct:
                type:
                - number
                - 'null'
                example: 60
              hourly:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      example: '2026-09-21T12:00:00+02:00'
                    time:
                      type: string
                      example: '12:00'
                    precipitation_mm:
                      type:
                      - number
                      - 'null'
                      example: 0.4
                    precipitation_probability_pct:
                      type:
                      - number
                      - 'null'
                      example: 60
                    condition:
                      type:
                      - string
                      - 'null'
                      example: rain
                    temperature_c:
                      type:
                      - number
                      - 'null'
                      example: 18
                  example:
                    timestamp: '2026-09-21T12:00:00+02:00'
                    time: '12:00'
                    precipitation_mm: 0.4
                    precipitation_probability_pct: 60
                    condition: rain
                    temperature_c: 18
                example:
                - timestamp: '2026-09-21T12:00:00+02:00'
                  time: '12:00'
                  precipitation_mm: 0.4
                  precipitation_probability_pct: 60
                  condition: rain
                  temperature_c: 18
            example:
              date: '2026-09-21'
              title: Berlin weather
              timezone: Europe/Berlin
              condition: rain
              temperature_min_c: 12
              temperature_max_c: 20
              precipitation_total_mm: 1.2
              precipitation_probability_max_pct: 60
              hourly:
              - timestamp: '2026-09-21T12:00:00+02:00'
                time: '12:00'
                precipitation_mm: 0.4
                precipitation_probability_pct: 60
                condition: rain
                temperature_c: 18
          forecast_days:
            type: array
            items:
              type: object
              properties:
                date:
                  type: string
                  example: '2026-09-21'
                title:
                  type: string
                  example: Berlin weather
                timezone:
                  type: string
                  example: Europe/Berlin
                condition:
                  type:
                  - string
                  - 'null'
                  example: rain
                temperature_min_c:
                  type:
                  - number
                  - 'null'
                  example: 12
                temperature_max_c:
                  type:
                  - number
                  - 'null'
                  example: 20
                precipitation_total_mm:
                  type:
                  - number
                  - 'null'
                  example: 1.2
                precipitation_probability_max_pct:
                  type:
                  - number
                  - 'null'
                  example: 60
                hourly:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-09-21T12:00:00+02:00'
                      time:
                        type: string
                        example: '12:00'
                      precipitation_mm:
                        type:
                        - number
                        - 'null'
                        example: 0.4
                      precipitation_probability_pct:
                        type:
                        - number
                        - 'null'
                        example: 60
                      condition:
                        type:
                        - string
                        - 'null'
                        example: rain
                      temperature_c:
                        type:
                        - number
                        - 'null'
                        example: 18
                    example:
                      timestamp: '2026-09-21T12:00:00+02:00'
                      time: '12:00'
                      precipitation_mm: 0.4
                      precipitation_probability_pct: 60
                      condition: rain
                      temperature_c: 18
                  example:
                  - timestamp: '2026-09-21T12:00:00+02:00'
                    time: '12:00'
                    precipitation_mm: 0.4
                    precipitation_probability_pct: 60
                    condition: rain
                    temperature_c: 18
              example:
                date: '2026-09-21'
                title: Berlin weather
                timezone: Europe/Berlin
                condition: rain
                temperature_min_c: 12
                temperature_max_c: 20
                precipitation_total_mm: 1.2
                precipitation_probability_max_pct: 60
                hourly:
                - timestamp: '2026-09-21T12:00:00+02:00'
                  time: '12:00'
                  precipitation_mm: 0.4
                  precipitation_probability_pct: 60
                  condition: rain
                  temperature_c: 18
            example:
            - date: '2026-09-21'
              title: Berlin weather
              timezone: Europe/Berlin
              condition: rain
              temperature_min_c: 12
              temperature_max_c: 20
              precipitation_total_mm: 1.2
              precipitation_probability_max_pct: 60
              hourly:
              - timestamp: '2026-09-21T12:00:00+02:00'
                time: '12:00'
                precipitation_mm: 0.4
                precipitation_probability_pct: 60
                condition: rain
                temperature_c: 18
          hourly:
            type: array
            items:
              type: object
              properties:
                timestamp:
                  type: string
                  example: '2026-09-21T12:00:00+02:00'
                time:
                  type: string
                  example: '12:00'
                precipitation_mm:
                  type:
                  - number
                  - 'null'
                  example: 0.4
                precipitation_probability_pct:
                  type:
                  - number
                  - 'null'
                  example: 60
                condition:
                  type:
                  - string
                  - 'null'
                  example: rain
                temperature_c:
                  type:
                  - number
                  - 'null'
                  example: 18
              example:
                timestamp: '2026-09-21T12:00:00+02:00'
                time: '12:00'
                precipitation_mm: 0.4
                precipitation_probability_pct: 60
                condition: rain
                temperature_c: 18
            example:
            - timestamp: '2026-09-21T12:00:00+02:00'
              time: '12:00'
              precipitation_mm: 0.4
              precipitation_probability_pct: 60
              condition: rain
              temperature_c: 18
          rain_periods:
            type: array
            items:
              type: object
              properties:
                start:
                  type: string
                  example: '2026-09-21T12:00:00+02:00'
                end:
                  type: string
                  example: '2026-09-21T14:00:00+02:00'
