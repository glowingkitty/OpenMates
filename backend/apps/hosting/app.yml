id: hosting
name_translation_key: hosting
description_translation_key: hosting.description
icon_image: server.svg
category: work
last_updated: "2026-10-01"
# Parent search and independently openable checked-domain children.
embed_types:
  - id: search_domains
    category: app-skill-use
    skill_id: search_domains
    frontend_type: app-skill-use
    backend_type: app_skill_use
    has_children: true
    child_type: hosting_domain
    child_frontend_type: hosting-domain
    groupable: false
    preview_component: hosting/HostingSearchEmbedPreview.svelte
    fullscreen_component: hosting/HostingSearchEmbedFullscreen.svelte
    child_preview_component: hosting/HostingDomainEmbedPreview.svelte
    child_fullscreen_component: hosting/HostingDomainEmbedFullscreen.svelte
    icon: server
    gradient_var: "--color-app-hosting"
    i18n_namespace: embeds.hosting.search_domains
skills:
  - id: search_domains
    anonymous_access: authenticated
    parallel_safe: true
    name_translation_key: app_skills.hosting.search_domains
    description_translation_key: app_skills.hosting.search_domains.description
    icon_image: search.svg
    api_config:
      expose_get: true
      expose_post: true
    preprocessor_hint: >
      Check an exact domain name or discover available domain names through Gandi.
      Use one grouped request per independent name or idea. A fully qualified domain
      is checked exactly. Put explicitly requested suffixes in tlds and explicit
      tax country and currency in country and currency; defaults are DE and EUR.
      Use availability=prefer_available by default: show confirmed available names
      first and checked in-use names only to fill remaining result slots.
      Use available_only only when the user wants no in-use names, and all when the
      user asks to inspect all checked statuses. Unknown checks never mean in-use.
      Copy a stated branding, price, renewal, term, premium, or restriction goal
      into relevance_criteria when it should affect ordering. Keep query focused
      on the requested name or topic and do not invent preferences. Omit criteria
      for neutral checks. Never claim availability is guaranteed or buy a domain.
    class_path: backend.apps.hosting.skills.search_domains.SearchDomainsSkill
    pricing:
      fixed: 1
    providers:
      - name: Gandi
        no_api_key: true
    example_translation_keys:
      - settings.app_store_examples.hosting.search_domains.1
      - settings.app_store_examples.hosting.search_domains.2
    external_data: true
    exclude_fields_for_llm: [checked_results, registration, renewal]
    output_safety:
      external_data: true
      prompt_injection: default_on
    tool_schema:
      type: object
      properties:
        requests:
          x-ui:
            basic: true
          type: array
          minItems: 1
          maxItems: 5
          description: One to five independent domain checks or name searches.
          items:
            type: object
            properties:
              id:
                x-ui:
                  basic: false
                description: Optional caller ID echoed in this group's result.
                anyOf:
                  - type: string
                  - type: integer
              query:
                x-ui:
                  basic: true
                type: string
                description: An exact fully qualified domain (up to 253 characters), a short name, or a keyword idea (up to 100 characters).
                minLength: 1
                maxLength: 253
              tlds:
                x-ui:
                  basic: true
                type: array
                maxItems: 5
                items:
                  type: string
                description: >
                  Optional suffixes such as .com or .net. For a short single-label
                  name, check each exact name plus suffix before suggestions.
              country:
                x-ui:
                  basic: false
                type: string
                default: DE
                description: Two-letter tax country code; returned explicitly with prices.
              currency:
                x-ui:
                  basic: false
                type: string
                default: EUR
                enum: [EUR, USD]
                description: Supported quote currency. Unsupported currencies are rejected.
              max_results:
                x-ui:
                  basic: false
                type: integer
                minimum: 1
                maximum: 20
                default: 10
                description: Maximum selected results per group. Checked pool remains at most 40.
              availability:
                x-ui:
                  basic: true
                type: string
                enum: [prefer_available, available_only, all]
                default: prefer_available
                description: >
                  prefer_available selects confirmed available first, then checked
                  unavailable names only to fill a shortfall. available_only never
                  fills with unavailable. all preserves ranked checked available and
                  unavailable order. Unknown checks remain diagnostic only.
              relevance_criteria:
                x-ui:
                  basic: true
                type: string
                maxLength: 1000
                description: >
                  Optional natural-language goal for ranking checked candidates.
                  Set when the user states a material brand, name-fit, renewal-price,
                  term, premium, or restriction preference that should change order.
                  Copy the goal faithfully; omit for neutral lookup or discovery.
                  Ranking uses only evidenced provider facts and drops scores below 1.
            required: [query]
      required: [requests]
    workflow:
      available: true
      execution_mode: sync
      effect: read
      unattended: true
      approval: never
      binding_requirements: [none]
      test_allowed: true
      test_example_input:
        requests:
          - query: example.com
            max_results: 1
      output_schema:
        type: object
        properties:
          summary:
            x-ui:
              basic: false
            type: string
          result_count:
            x-ui:
              basic: true
            type: integer
          provider:
            x-ui:
              basic: false
            type: string
          error:
            x-ui:
              basic: false
            type: string
          results:
            x-ui:
              basic: true
            type: array
            description: Selected checked domains, flattened across request groups.
            items: &hosting_domain_workflow_result
              type: object
              properties:
                domain_ascii:
                  x-ui:
                    basic: true
                  type: string
                domain_unicode:
                  x-ui:
                    basic: true
                  type: string
                availability:
                  x-ui:
                    basic: true
                  type: string
                  enum: [available, unavailable, unknown]
                url:
                  x-ui:
                    basic: true
                  type: string
                canonical_url:
                  x-ui:
                    basic: false
                  type: string
                source_id:
                  x-ui:
                    basic: false
                  type: string
                currency:
                  x-ui:
                    basic: true
                  type: string
                country:
                  x-ui:
                    basic: false
                  type: string
                provider:
                  x-ui:
                    basic: false
                  type: string
                taxes:
                  x-ui:
                    basic: false
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        x-ui:
                          basic: false
                        type: string
                      name_label:
                        x-ui:
                          basic: false
                        type: string
                      type:
                        x-ui:
                          basic: false
                        type: string
                      rate:
                        x-ui:
                          basic: false
                        type: number
                premium:
                  x-ui:
                    basic: false
                  type: boolean
                reserved:
                  x-ui:
                    basic: false
                  type: boolean
                restrictions:
                  x-ui:
                    basic: false
                  type: array
                  items:
                    type: string
                registration_phase:
                  x-ui:
                    basic: false
                  type: string
                registration_tiers:
                  x-ui:
                    basic: true
                  type: array
                  items: &hosting_domain_price_tier
                    type: object
                    properties:
                      unit:
                        x-ui:
                          basic: false
                        type: string
                      duration_range:
                        x-ui:
                          basic: false
                        type: object
                        properties:
                          minimum:
                            x-ui:
                              basic: false
                            type: integer
                          maximum:
                            x-ui:
                              basic: false
                            type: integer
                      minimum_term:
                        x-ui:
                          basic: false
                        type: string
                      price_excluding_tax:
                        x-ui:
                          basic: false
                        type: number
                      price_including_tax:
                        x-ui:
                          basic: true
                        type: number
                      normal_price:
                        x-ui:
                          basic: false
                        type: number
                      discount:
                        x-ui:
                          basic: false
                        type: boolean
                      product_taxes:
                        x-ui:
                          basic: false
                        type: array
                        items:
                          type: object
                renewal_tiers:
                  x-ui:
                    basic: true
                  type: array
                  items: *hosting_domain_price_tier
                checked_at:
                  x-ui:
                    basic: false
                  type: string
                provider_url:
                  x-ui:
                    basic: false
                  type: string
          raw:
            x-ui:
              basic: false
            type: object
            description: Full grouped response, including bounded checked candidates and partial context.
            properties:
              results:
                x-ui:
                  basic: false
                type: array
                items:
                  type: object
                  properties:
                    id:
                      x-ui:
                        basic: false
                      anyOf:
                        - type: string
                        - type: integer
                    query:
                      x-ui:
                        basic: false
                      type: string
                    country:
                      x-ui:
                        basic: false
                      type: string
                    currency:
                      x-ui:
                        basic: false
                      type: string
                    checked_at:
                      x-ui:
                        basic: false
                      type: string
                    partial:
                      x-ui:
                        basic: false
                      type: boolean
                    relevance_applied:
                      x-ui:
                        basic: false
                      type: boolean
                    warnings:
                      x-ui:
                        basic: false
                      type: array
                      items:
                        type: string
                    error:
                      x-ui:
                        basic: false
                      type: string
                    results:
                      x-ui:
                        basic: false
                      type: array
                      items: *hosting_domain_workflow_result
                    checked_results:
                      x-ui:
                        basic: false
                      type: array
                      items: *hosting_domain_workflow_result
