# Content-free authorization for authenticated direct skill tasks without a chat turn.
chat_recovery_authorized_direct_skills:
  type: collection
  meta:
    accountability: null
  fields:
    id:
      type: uuid
      primary: true
    task_name:
      type: string
      length: 160
      required: true
    kwargs_binding:
      type: string
      length: 64
      required: true
    actor_user_id:
      type: uuid
      required: true
    hashed_user_id:
      type: string
      length: 64
      required: true
    hashed_team_id:
      type: string
      length: 64
      nullable: true
    target_chat_id:
      type: uuid
      nullable: true
    primary_message_id:
      type: string
      length: 255
      nullable: true
    primary_embed_id:
      type: uuid
      required: true
    state:
      type: string
      length: 16
      required: true
    registered_at:
      type: datetime
      required: true
    started_at:
      type: datetime
      nullable: true
    completed_at:
      type: datetime
      nullable: true
    invalidated_at:
      type: datetime
      nullable: true
