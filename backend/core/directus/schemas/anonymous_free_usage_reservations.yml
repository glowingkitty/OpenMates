# backend/core/directus/schemas/anonymous_free_usage_reservations.yml
# Short-lived reservation rows for anonymous free usage. Reservations prevent
# concurrent anonymous requests from overspending shared daily/weekly budgets.
anonymous_free_usage_reservations:
  type: collection
  fields:
    id:
      type: uuid
      primary: true
      note: "Primary key for the reservation row."

    request_id:
      type: string
      length: 255
      unique: true
      note: "Idempotency key for one anonymous request."

    parent_request_id:
      type: string
      length: 255
      nullable: true
      note: "Zero-cost public request ledger that owns this billable operation."

    charge_id:
      type: string
      length: 256
      nullable: true
      note: "Idempotent charge group used to settle one or more conservatively quoted operations."

    local_id_hash:
      type: string
      length: 128
      nullable: true
      note: "Server-secret HMAC of the first-party anonymous local ID."

    ip_hash:
      type: string
      length: 128
      nullable: true
      note: "Server-secret HMAC of request IP; pseudonymous personal data."

    reserved_credits:
      type: integer
      default: 0
      note: "Credits reserved before provider execution."

    finalized_credits:
      type: integer
      default: 0
      note: "Actual credits charged after execution completes."

    status:
      type: string
      length: 32
      note: "request_open, reserved, finalized, released, or expired."

    release_reason:
      type: string
      length: 128
      nullable: true
      note: "Reason unused credits were released."

    daily_window_date:
      type: string
      length: 16
      nullable: true
      note: "UTC day key that owned this reservation when it was created."

    weekly_window_start:
      type: string
      length: 16
      nullable: true
      note: "UTC Monday key that owned this reservation when it was created."

    monthly_window_month:
      type: string
      length: 16
      nullable: true
      note: "UTC month key that owned this reservation when it was created."

    created_at:
      type: datetime
      nullable: true
      note: "ISO timestamp when the reservation was created."

    updated_at:
      type: datetime
      nullable: true
      note: "ISO timestamp when the reservation was last changed."

    expires_at:
      type: datetime
      nullable: true
      note: "When an unused reservation may be released."
