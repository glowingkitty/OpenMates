# backend/core/directus/schemas/live_item_updates.yml
# Append-only log of sealed live-collaboration packets (plan live-collaboration-crdt).
# The server stores opaque ciphertext only: `payload` is the base64 of the sealed packet
# exactly as received. No plaintext item content, no item id, no user id is stored.
live_item_updates:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus"
    hashed_item_id:
      type: string
      note: "[Indexed] SHA256 of the live item (embed) id."
    seq:
      type: integer
      note: "Per-item monotonic sequence assigned by the server (Redis INCR)."
    sender_hash:
      type: string
      note: "Opaque per-user hash set from the authenticated connection."
    epoch:
      type: integer
      note: "Item key epoch the packet was sealed under."
    payload:
      type: text
      note: "[Encrypted] Base64 of the sealed packet. Opaque to the server."
    created_at:
      type: integer
      note: "Unix timestamp (seconds)."
  indexes:
    - fields: [hashed_item_id, seq]
      unique: true
