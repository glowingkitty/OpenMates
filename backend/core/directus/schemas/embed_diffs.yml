# backend/core/directus/schemas/embed_diffs.yml
# Stores version history for diffable embeds (code, document, sheet).
# Append-only: v=1 stores full original snapshot, v>1 stores unified diffs.
# Encrypted with the same embed_key as the parent embed (zero-knowledge).
embed_diffs:
  type: collection
  meta:
    accountability: null
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."

    embed_id:
      type: string
      note: "[Indexed] References embeds.embed_id — the parent embed this diff belongs to."
      options:
        indexed: true

    version_number:
      type: integer
      note: "Version number (1 = original snapshot, 2+ = diff from previous version)."

    encrypted_snapshot:
      type: textfield
      note: "[Encrypted] Client-created full content snapshot; v=1 is required, later periodic snapshots use the same embed key. Nullable after verified archive promotion."

    encrypted_patch:
      type: textfield
      note: "[Encrypted] Unified diff patch for v>1. Nullable after verified archive promotion."

    has_snapshot:
      type: boolean
      note: "Metadata-only snapshot presence, retained after ciphertext is archived. Legacy v=1 is treated as a snapshot."

    has_patch:
      type: boolean
      note: "Metadata-only patch presence, retained after ciphertext is archived. Legacy v>1 is treated as a patch."

    snapshot_operation_id:
      type: string
      nullable: true
      note: "Idempotency key for a later client snapshot at this immutable version."

    snapshot_digest:
      type: string
      nullable: true
      note: "SHA-256 of the exact encrypted snapshot for idempotent replay."

    archive_state:
      type: string
      nullable: true
      note: "null/hot, stale, copied, or ready; never implies PostgreSQL payload removal without a verified copy and compatible readers."

    archive_object_key:
      type: string
      nullable: true
      note: "Private immutable S3 key for archived ciphertext envelope; never returned to clients."

    archive_pending_object_key:
      type: string
      nullable: true
      note: "Durable proposed immutable S3 key, inventoried before the copy writer uploads any bytes."

    archive_pending_checksum:
      type: string
      nullable: true
      note: "Source ciphertext envelope SHA-256 fenced to the pending copy intent."

    archive_copy_lease_until:
      type: integer
      nullable: true
      note: "UTC seconds when the bounded pending copy writer lease ends; deletion waits an additional 90 seconds."

    archive_superseded_object_key:
      type: string
      nullable: true
      note: "Prior immutable S3 locator retained for regional deletion after a client adds a snapshot."

    archive_checksum:
      type: string
      nullable: true
      note: "SHA-256 of the exact archived ciphertext envelope."

    archive_regions:
      type: json
      nullable: true
      note: "Configured regions with verified durable copies."

    archive_copied_at:
      type: integer
      nullable: true
      note: "UTC seconds when the current ciphertext envelope was copied and fenced."

    archive_reader_activated_at:
      type: integer
      nullable: true
      note: "UTC seconds when a verified S3 read became authoritative for this version."

    archive_source_copy_until:
      type: integer
      nullable: true
      note: "Minimum UTC second before PostgreSQL ciphertext may be pruned."

    archive_pruned_at:
      type: integer
      nullable: true
      note: "UTC seconds when PostgreSQL ciphertext was removed after all gates."

    hashed_user_id:
      type: string
      note: "[Indexed] Hashed user ID of embed owner (for access control)."

    created_at:
      type: integer
      note: "Unix timestamp (seconds) when this version was created."

  # Compound index for efficient timeline queries
  indexes:
    - fields: [embed_id, version_number]
      unique: true
    - fields: [embed_id, hashed_user_id, version_number]
    - fields: [archive_state, version_number]

embed_version_archive_rollout:
  type: collection
  note: "Internal version reader/prune receipts; disabled until reviewed evidence is recorded."
  fields:
    id: {type: string, primary: true}
    read_enabled: {type: boolean, default: false}
    pruning_enabled: {type: boolean, default: false}
    initial_cohort: {type: boolean, default: true}
    compatibility_verified: {type: boolean, default: false}
    reader_receipt: {type: text}
    validation_receipt: {type: text}
    failure_code: {type: string}

# Idempotency receipts for atomic Project file publications. These records contain
# opaque commitments/digests and scope hashes only; no plaintext file hash/content.
embed_version_commits:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - generated by the transaction extension."
    operation_id:
      type: string
      note: "Client-generated idempotency identity, scoped to an embed."
    commit_identity:
      type: string
      unique: true
      note: "[Unique] Server SHA256(embed_id + operation_id) idempotency identity."
    embed_id:
      type: string
      note: "[Indexed] Embed whose encrypted revision was published."
    hashed_project_id:
      type: string
      note: "[Indexed] SHA256(project_id) authorization scope."
    hashed_team_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(team_id) for Team Project commits."
    actor_user_hash:
      type: string
      note: "[Indexed] SHA256(user_id) of the authenticated writer."
    hashed_chat_id:
      type: string
      note: "[Indexed] SHA256(chat_id) whose approved proposal produced the commit."
    proposal_digest:
      type: string
      note: "Opaque client HMAC commitment to the approved plaintext proposal."
    payload_digest:
      type: string
      note: "Server SHA256 digest of the exact ciphertext transaction payload."
    expected_revision:
      type: integer
      note: "Revision supplied by the client for compare-and-swap."
    committed_revision:
      type: integer
      note: "Revision atomically published by this operation."
    created_at:
      type: integer
      note: "Unix timestamp when the receipt was committed."
  indexes:
    - fields: [embed_id, operation_id]
      unique: true
    - fields: [hashed_project_id, created_at]
