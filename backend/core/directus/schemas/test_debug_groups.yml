# backend/core/directus/schemas/test_debug_groups.yml
# Durable acceptance, attempts, evidence, and blockers for one root cause.
test_debug_groups:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."
    group_key:
      type: string
      length: 255
      unique: true
      note: "[Indexed, Unique] Stable durable debug-group identifier."
    campaign_key:
      type: string
      length: 255
      note: "Owning debug campaign."
    triage_group_id:
      type: string
      length: 255
      note: "Deterministic source triage signature."
    parent_group_key:
      type: string
      length: 255
      note: "Nullable group whose verification exposed this child."
    status:
      type: string
      length: 80
      note: "selected, ready, investigating, verifying, blocked, or green."
    member_test_keys:
      type: json
      note: "Complete canonical test membership."
    observed_failure:
      type: text
      note: "Sanitized observed failure summary."
    expected_behavior:
      type: text
      note: "Expected behavior established before source edits."
    acceptance_criteria:
      type: json
      note: "Concrete observable criteria derived from tests or an approved spec."
    root_cause:
      type: json
      note: "Current root-cause hypothesis, status, confidence, and suspect files."
    attempts:
      type: json
      note: "Ordered redacted investigation and verification attempts."
    red_evidence:
      type: json
      note: "Source run/result references proving the selected failure."
    green_evidence:
      type: json
      note: "Passing run/result/commit references for every member."
    blocker:
      type: json
      note: "Nullable structured group blocker."
    metadata:
      type: json
      note: "Redacted discovery and scope-amendment context."
    verification_command:
      type: text
      note: "Exact campaign/group verification command."
    fixing_commit:
      type: string
      length: 80
      note: "Nullable commit recorded when the group becomes green."
    selected_at:
      type: string
      length: 80
      note: "ISO selection timestamp."
    selected_at_unix:
      type: integer
      note: "Selection timestamp used to reject stale green evidence."
    updated_at:
      type: string
      length: 80
      note: "ISO latest update timestamp."
