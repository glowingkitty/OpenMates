# Permanent, content-free deletion fence for a globally unique chat identity.
# Only the internal recovery transaction may write this collection.
chat_recovery_chat_deletion_fences:
  type: collection
  meta:
    accountability: null
  fields:
    id:
      type: uuid
      primary: true
    hashed_user_id:
      type: string
      length: 64
      required: true
      note: "Personal owner or Team deletion actor; not a permission grant"
    hashed_team_id:
      type: string
      length: 64
      nullable: true
    chat_id:
      type: uuid
      required: true
    scope:
      type: string
      length: 16
      nullable: true
      note: "Null is a legacy whole-chat fence; message scope fences only its exact hash."
    hashed_message_id:
      type: string
      length: 64
      nullable: true
    fenced_at:
      type: datetime
      required: true
