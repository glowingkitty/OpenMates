# backend/core/directus/schemas/test_debug_campaigns.yml
# Durable scope and lifecycle for one failed-test debugging campaign.
test_debug_campaigns:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."
    campaign_key:
      type: string
      length: 255
      unique: true
      note: "[Indexed, Unique] Stable campaign identifier."
    title:
      type: string
      length: 255
      note: "Human-readable campaign title."
    status:
      type: string
      length: 80
      note: "active, blocked, or completed."
    session_id:
      type: string
      length: 255
      note: "Session that created or most recently resumed the campaign."
    source_run_keys:
      type: json
      note: "Run keys that supplied the initial selected failures."
    selected_test_keys:
      type: json
      note: "Initial and explicitly amended canonical test membership."
    selected_group_keys:
      type: json
      note: "Durable root-cause groups in this campaign."
    current_group_key:
      type: string
      length: 255
      note: "Nullable group currently being investigated."
    completion_policy:
      type: json
      note: "Campaign completion and transient-stability rules."
    blocker:
      type: json
      note: "Nullable structured campaign blocker."
    metadata:
      type: json
      note: "Redacted scope amendments and completion summary."
    created_at:
      type: string
      length: 80
      note: "ISO campaign creation timestamp."
    updated_at:
      type: string
      length: 80
      note: "ISO latest update timestamp."
    completed_at:
      type: string
      length: 80
      note: "Nullable campaign completion timestamp."
