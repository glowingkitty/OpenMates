# Immutable account public keys. The private key is already encrypted on the
# client under the account master key; the server treats its ciphertext as opaque.
# The hashed user ID is the only account lookup key exposed to this collection.
# A database uniqueness index fences two devices racing to enroll an identity.
# Account deletion removes the backup in a PostgreSQL user-delete trigger.
account_chat_keys:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."
    hashed_user_id:
      type: string
      length: 64
      required: true
      note: "SHA256(account user ID); database uniqueness fences registration races."
    key_id:
      type: string
      length: 64
      required: true
      note: "Lowercase SHA256 of decoded 32-byte public key."
    public_key:
      type: string
      length: 43
      required: true
      note: "Canonical unpadded base64url X25519 public key."
    encrypted_private_key:
      type: text
      required: true
      note: "Opaque client AES combined ciphertext under account master key. Never decrypted server-side."
    algorithm:
      type: string
      required: true
    version:
      type: integer
      required: true
