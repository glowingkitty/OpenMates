# backend/core/directus/schemas/project_settings.yml
# Encrypted per-Project assistant action and remote write preferences.
# Plaintext write_mode and focus binding hash are intentionally sparse so the
# backend can enforce authorization without decrypting Project-private details.
project_settings:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."

    hashed_project_id:
      type: string
      note: "[Indexed] SHA256(project_id)."

    hashed_user_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(user_id) for Personal ownership."

    hashed_team_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(team_id) for Team ownership."

    updated_by_user_hash:
      type: string
      nullable: true
      note: "[Indexed] SHA256(user_id) of the member who last changed settings."

    write_mode:
      type: string
      nullable: true
      note: "Explicit Project write policy: apply_and_show or always_ask. Null/missing never authorizes writes."

    default_focus_id_hash:
      type: string
      nullable: true
      note: "SHA256 of the opaque Project-owned default focus UUID. The focus name and instructions remain encrypted."

    encrypted_settings:
      type: text
      note: "[Encrypted] Project focus content, permission settings, protected paths, and automated check overrides encrypted with the project key."

    updated_at:
      type: integer
      note: "Unix timestamp (seconds) when settings changed."

  indexes:
    - fields: [hashed_project_id, hashed_user_id]
      unique: true
    - fields: [hashed_project_id, hashed_team_id]
      unique: true
