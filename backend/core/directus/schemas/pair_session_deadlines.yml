# Pair-only absolute expiry. The hash rotates with the Directus refresh token.
# Rows remain durable until the underlying Directus session is gone; do not TTL
# delete them at the selected deadline, since their presence blocks cache-miss
# refresh from silently becoming an ordinary 30-day session.
pair_session_deadlines:
  type: collection
  fields:
    id:
      type: uuid
      primary: true
      note: "Primary key."
    token_hash:
      type: string
      length: 64
      required: true
      unique: true
      note: "SHA256 of current Directus refresh token, never the token itself."
    user_id:
      type: uuid
      required: true
      note: "Owning account for session identity checks."
    expires_at:
      type: integer
      nullable: true
      note: "Absolute pair expiry Unix seconds, null for ordinary session policy."
    pending_ack:
      type: boolean
      required: true
      default: true
      note: "Session cannot authenticate until receiver confirms durable local storage."
    relay_acknowledged:
      type: boolean
      required: true
      default: false
      note: "Durable completion of the receiver ACK; partial cross-store transitions remain denied."
    retired:
      type: boolean
      required: true
      default: false
      note: "Immutable old token marker; old refresh tokens never become ordinary sessions."
