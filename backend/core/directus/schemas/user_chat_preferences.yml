# backend/core/directus/schemas/user_chat_preferences.yml
# Versioned, client-encrypted AI model preferences scoped to one user/chat pair.
# The backend stores only hashed ownership and opaque Format D master-key
# ciphertext. Decrypted model IDs are allowed only transiently in first-party
# inference requests and must not be persisted in this collection.
user_chat_preferences:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus"

    hashed_user_id:
      type: string
      length: 128
      note: "[Indexed] SHA256 hash of the authenticated user ID. Used for owner-scoped preference lookup."

    chat_id:
      type: string
      length: 64
      note: "[Indexed] Chat ID that this owner-specific model preference applies to."

    encrypted_selected_ai_model:
      type: textfield
      note: "Client-side Format D master-key ciphertext of {'mode':'auto'} or {'mode':'exact','model':'provider/model-id'}. Durable plaintext model selection is forbidden."

    preference_v:
      type: integer
      default: 1
      note: "Compare-and-set version for cross-device preference convergence."

    updated_at:
      type: integer
      note: "Unix timestamp (seconds) of the latest accepted preference mutation."
