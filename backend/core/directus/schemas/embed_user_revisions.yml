# backend/core/directus/schemas/embed_user_revisions.yml
# Server records of user-made embed versions (Specification feature.embed-user-edits,
# Plan docs/plans/embed-user-edit-versions). Written only by the
# embed-version-transaction extension (commitUserEmbedRevision). Both collections
# hold scope hashes, opaque digests and plaintext non-content metadata; no
# embed content, no chat content and no plaintext identifiers of chats or Projects.

# Idempotency receipts of user revision commits, one per (embed_id, operation_id).
# Separate from the Project and chat-diagram receipts so a user edit can never
# satisfy an assistant-approval Project commit.
embed_user_revision_commits:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - generated by the transaction extension."}
    operation_id: {type: string, note: "Client retry identity, scoped to the embed."}
    commit_identity: {type: string, unique: true, note: "[Unique] SHA256(embed_id + NUL + operation_id)."}
    embed_id: {type: string, note: "[Indexed] Embed that received the user version."}
    scope_kind: {type: string, note: "chat or project: the scope the commit was authorized in."}
    hashed_scope_id: {type: string, note: "[Indexed] SHA256(chat_id) or SHA256(project_id) of that scope."}
    hashed_team_id: {type: string, nullable: true, note: "SHA256(team_id) for Team scopes, else null."}
    actor_user_hash: {type: string, note: "[Indexed] SHA256(user_id) of the authenticated writer."}
    revision_origin: {type: string, note: "Always user."}
    revision_action: {type: string, note: "edit, enhance, restore or crop."}
    payload_digest: {type: string, note: "Server SHA256 digest of the exact validated request (idempotent replay check)."}
    expected_revision: {type: integer, note: "Compare-and-swap base version."}
    committed_revision: {type: integer, note: "Version published by this commit."}
    content_hash: {type: string, note: "SHA256 of the committed head ciphertext (the next expected_content_hash)."}
    restored_from: {type: integer, nullable: true, note: "Version a restore copied, else null."}
    is_image: {type: boolean, note: "Whether the embed is an image (media index repoint after commit)."}
    owner_is_actor: {type: boolean, note: "Whether the writer owns the embed (only then the media index is repointed)."}
    head_file_keys: {type: json, nullable: true, note: "S3 file references of the new image head; null when unchanged. Not privacy-sensitive (files are AES-256-GCM encrypted)."}
    pending_notice: {type: boolean, note: "Whether a pending chat notice was written."}
    created_at: {type: integer, note: "Unix timestamp (seconds)."}
  indexes:
    - fields: [embed_id, operation_id]
      unique: true
    - fields: [hashed_scope_id, created_at]

# Content-free markers that a user version of a chat embed still needs its
# chat-key encrypted "embed updated" system message. The client core of any
# device of the chat writes that message with the id
# embed-updated-<embed_id>-v<version>; storing it deletes the marker.
pending_embed_notices:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - generated by the transaction extension."}
    notice_identity: {type: string, unique: true, note: "[Unique] SHA256(embed_id + NUL + version)."}
    hashed_chat_id: {type: string, note: "[Indexed] SHA256(chat_id) of the embed's own chat."}
    embed_id: {type: string, note: "[Indexed] Embed that received the user version."}
    version: {type: integer, note: "The user-made version the event announces."}
    action: {type: string, note: "edit, enhance, restore or crop."}
    surface: {type: string, note: "chat or project: the scope the commit was made in."}
    restored_from: {type: integer, nullable: true, note: "Version a restore copied (action restore only), else null."}
    created_at: {type: integer, note: "Unix timestamp (seconds) of the commit."}
  indexes:
    - fields: [hashed_chat_id, created_at]
    - fields: [embed_id, version]
      unique: true
