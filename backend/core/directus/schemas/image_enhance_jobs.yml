# backend/core/directus/schemas/image_enhance_jobs.yml
# One row per image Enhance request (Specification feature.embed-user-edits,
# assertions embed-user-edits.enhance.*; Plan docs/plans/embed-user-edit-versions).
# Written by POST /v1/images/enhance and the apps.images.tasks.enhance worker;
# the user revision commit reads operation_id, embed_id, hashed_user_id, state,
# result_file_keys, target_version, scope_kind and scope_id_hash and moves a
# ready row to committed.
# Rows hold hashes, the encrypted (AES-GCM) S3 object keys of the result and the
# result's file metadata Vault-encrypted for the requester only. The source
# file's AES key is never stored. Rows live 24 hours (expires_at); the files of
# a result that was never committed are deleted then, and its charge is
# refunded only if the result never reached the requester (result_delivered_at).
# The commit also requires the job's scope_kind and scope_id_hash to match.
image_enhance_jobs:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."

    operation_id:
      type: string
      note: "[Unique] Client retry identity of one Enhance action (UUID)."
      options:
        unique: true

    embed_id:
      type: string
      note: "[Indexed] Image embed the result becomes the next version of."

    hashed_user_id:
      type: string
      note: "[Indexed] SHA256(user_id) of the requester, who is billed and the only reader of the result."

    user_id:
      type: string
      note: "Requester's user id, needed by the expiry sweep to refund an uncommitted charge (like upload_files.user_id)."

    scope_kind:
      type: string
      note: "chat or project: where the Enhance was started."

    scope_id_hash:
      type: string
      note: "SHA256(chat_id) or SHA256(project_id) of the scope."

    state:
      type: string
      note: "pending | ready | committed | failed | expired."

    base_version:
      type: integer
      note: "Head version of the embed when the request was accepted."

    target_version:
      type: integer
      note: "Version the result becomes when committed (base_version + 1)."

    version:
      type: integer
      nullable: false
      default: 1
      note: "Row version for compare-and-set state changes; every writer increments it. Never null, so every compare-and-set has a value to match."

    credits:
      type: integer
      note: "Price quoted from the provider pricing entry at request time; charged once after the provider succeeded."

    billing_event_id:
      type: string
      note: "image_revision.billing_event_id(embed_id, target_version, operation_id)."

    billing_state:
      type: string
      note: "none | charging | charged | refunded. charging means a charge may have been recorded and must be reconciled."

    charged_credits:
      type: integer
      nullable: true
      note: "Credits the ledger confirmed for this job; null until charged."

    result_file_keys:
      type: json
      nullable: true
      note: 'Uploaded result objects, [{"bucket": "chatfiles", "key": "..."}]; the commit merges them into embeds.s3_file_keys.'

    encrypted_result:
      type: text
      nullable: true
      note: "[Encrypted] Vault-encrypted JSON (requester's key): file metadata, AES key and nonce the client needs for the next version's content."

    error_code:
      type: string
      nullable: true
      note: "Machine-readable failure reason when state is failed (never content)."

    worker_claim:
      type: string
      nullable: true
      note: "Random id of the one worker run that owns a pending job, set by compare-and-set before the provider call; a duplicate task delivery that cannot claim the row leaves it alone."

    result_delivered_at:
      type: integer
      nullable: true
      note: "Unix timestamp (seconds) when a route response first carried the result payload (file keys and the result's AES key) to the requester. An uncommitted job is refunded on expiry only while this is null."

    created_at:
      type: integer
      note: "Unix timestamp (seconds)."

    updated_at:
      type: integer
      note: "Unix timestamp (seconds)."

    expires_at:
      type: integer
      note: "[Indexed] Unix timestamp (seconds); the commit must refuse a job at or after this time."

  indexes:
    - fields: [hashed_user_id, created_at]
    - fields: [state, expires_at]
    - fields: [embed_id]
