# Private Specification documents are opaque client ciphertext. Revisions are
# published with their head in one internal database transaction.
user_specifications:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    specification_id: {type: string, unique: true, note: "[Indexed, Unique] Stable client-generated Specification UUID."}
    hashed_user_id: {type: string, nullable: true, note: "[Indexed] SHA256 personal owner; null for a Team record."}
    hashed_team_id: {type: string, nullable: true, note: "[Indexed] SHA256 Team scope; null for personal records."}
    home_project_hash: {type: string, note: "[Indexed] SHA256 of the owning Project ID."}
    linked_project_hashes: {type: json, note: "Safe Project relationship hashes."}
    current_revision_id: {type: string, note: "Exact current immutable revision."}
    current_revision_number: {type: integer, note: "Monotonically increasing content revision number."}
    version: {type: integer, default: 1, note: "Server-authoritative metadata version."}
    status: {type: string, note: "draft, approved, superseded or archived."}
    encrypted_title: {type: text, note: "Client-encrypted title for the current revision."}
    encrypted_summary: {type: text, note: "Client-encrypted summary for the current revision."}
    key_wrappers: {type: json, note: "Context-bound wrapped Specification keys; never raw keys."}
    created_at: {type: integer, note: "Server creation timestamp."}
    updated_at: {type: integer, note: "Server last-change timestamp."}

user_specification_revisions:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    revision_id: {type: string, unique: true, note: "[Indexed, Unique] Client-generated revision UUID and retry identity."}
    specification_id: {type: string, note: "[Indexed] Owning Specification UUID."}
    hashed_user_id: {type: string, nullable: true, note: "Personal owner scope, inherited from the Specification."}
    hashed_team_id: {type: string, nullable: true, note: "Team owner scope, inherited from the Specification."}
    home_project_hash: {type: string, note: "Owning Project hash for bounded export and deletion."}
    revision_number: {type: integer, note: "Assigned under the owning Specification row lock."}
    supersedes_revision_id: {type: string, nullable: true, note: "Exact base revision; null only for the first revision."}
    content_hash: {type: string, note: "Client-supplied SHA256 commitment to the authored content."}
    project_surface_catalog_revision_id: {type: string, note: "Exact applicability catalog reference."}
    encrypted_title: {type: text, note: "Immutable client-encrypted revision title."}
    encrypted_summary: {type: text, note: "Immutable client-encrypted revision summary."}
    encrypted_specification_document: {type: text, note: "Immutable client-encrypted structured document; backend cannot decrypt it."}
    approval_state: {type: string, note: "draft, approved, rejected or superseded; content never changes."}
    approved_by_hash: {type: string, nullable: true, note: "Server-derived SHA256 of the approving actor."}
    approved_at: {type: integer, nullable: true, note: "Server approval timestamp bound to this revision and content hash."}
    created_at: {type: integer, note: "Server revision creation timestamp."}
