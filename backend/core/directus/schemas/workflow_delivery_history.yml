# Run-owned result membership; only keyed opaque identity metadata is stored here.
workflow_delivery_history:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."
    workflow_id:
      type: uuid
      note: "[Indexed] Owning workflow."
    hashed_user_id:
      type: string
      note: "[Indexed] Hashed owner ID."
    run_id:
      type: uuid
      note: "[Indexed] Owning visible run; deletion removes this membership."
    node_id:
      type: string
      note: "Stable Send message step."
    delivery_id:
      type: uuid
      note: "[Indexed] Delivery reservation and acknowledgement owner."
    destination_hash:
      type: string
      note: "[Indexed] Workflow-keyed HMAC of message-step destination; new chat targets share one slot."
    fingerprint:
      type: string
      note: "[Indexed] Workflow-keyed HMAC of stable result identity; no raw URL, title, provider ID or payload."
    candidate_index:
      type: integer
      note: "Selected result position within the encrypted delivery."
    status:
      type: string
      note: "reserved or delivered."
    created_at:
      type: integer
      note: "Reservation creation time."
    expires_at:
      type: integer
      note: "Pending reservation expiry; null after acknowledgement."
    delivered_at:
      type: integer
      note: "Successful client acknowledgement time."
