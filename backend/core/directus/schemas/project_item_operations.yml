# backend/core/directus/schemas/project_item_operations.yml
# Idempotency receipts for atomic Project link operations (adopt an existing
# chat embed, rename a file link, delete a file link). Written only by the
# embed-version-transaction extension. Rows carry hashes and client-derived
# item ids, never paths or content, so Project commits and the timeline can
# show renames and deletes without the server learning file names.
project_item_operations:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - generated by the transaction extension."

    operation_id:
      type: string
      note: "Client retry identity."

    operation_identity:
      type: string
      note: "[Unique] SHA256(hashed_project_id + operation kind + operation_id)."
      options:
        unique: true

    operation_kind:
      type: string
      note: "adopt, rename or delete."

    hashed_project_id:
      type: string
      note: "[Indexed] SHA256(project_id)."

    hashed_user_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(user_id) for Personal ownership."

    hashed_team_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(team_id) for Team ownership."

    actor_user_hash:
      type: string
      note: "SHA256(user_id) of the member who ran the operation."

    target_id_hash:
      type: string
      note: "SHA256(embed_id) of the linked embed."

    project_item_id:
      type: string
      note: "Client-derived item id after the operation (the removed id for delete)."

    previous_project_item_id:
      type: string
      nullable: true
      note: "[Nullable] Item id before a rename or delete."

    link_kind:
      type: string
      note: "file, application or test_result."

    payload_digest:
      type: string
      note: "Digest of the validated request; a replay must match it."

    result:
      type: text
      note: "JSON result returned to the first caller; no ciphertext or paths."

    created_at:
      type: integer
      note: "Unix timestamp (seconds)."

  indexes:
    - fields: [hashed_project_id, hashed_user_id, created_at]
    - fields: [hashed_project_id, hashed_team_id, created_at]
