# backend/core/directus/schemas/project_commits.yml
# Native Project commits: a named snapshot over the existing per-file revision
# history of hosted Project files. A commit stores no file content, only
# pointers (hashed Project item id + embed version). The message and the
# affected paths are client-encrypted with the Project key. Rows are append-only:
# restoring a commit creates new file revisions plus a new commit row.
project_commits:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus."

    commit_id:
      type: string
      note: "[Indexed, Unique] Client-generated UUID v4 for this commit."
      options:
        unique: true

    hashed_project_id:
      type: string
      note: "[Indexed] SHA256(project_id)."

    hashed_user_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(user_id) for Personal ownership."

    hashed_team_id:
      type: string
      nullable: true
      note: "[Indexed, Nullable] SHA256(team_id) for Team ownership."

    created_by_user_hash:
      type: string
      nullable: true
      note: "[Indexed] SHA256(user_id) of the member who recorded the commit."

    author_kind:
      type: string
      note: "Who made the change: user or assistant."

    hashed_chat_id:
      type: string
      nullable: true
      note: "[Nullable] SHA256(chat_id) of the chat that produced the commit."

    encrypted_message:
      type: text
      note: "[Encrypted] Commit message encrypted with the project key."

    encrypted_paths:
      type: text
      nullable: true
      note: "[Encrypted] JSON map target_id_hash -> file path, encrypted with the project key, for the timeline."

    entries:
      type: json
      note: "Snapshot pointers: list of {target_id_hash, embed_version}. No content."

    entry_count:
      type: integer
      note: "Number of entries in the snapshot."

    restored_from_commit_id:
      type: string
      nullable: true
      note: "Set when this commit records a whole-commit restore of an earlier commit."

    created_at:
      type: integer
      note: "Unix timestamp (seconds) when the commit was recorded."

  indexes:
    - fields: [hashed_project_id, hashed_user_id, created_at]
    - fields: [hashed_project_id, hashed_team_id, created_at]
