# Reusable mixed-source Checks. Titles, definitions and results are opaque
# client ciphertext; routing/gating metadata (source kinds, roles, statuses) is
# plaintext so the server can aggregate run status without decrypting.
user_checks:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    check_id: {type: string, unique: true, note: "[Indexed, Unique] Client-generated Check UUID."}
    hashed_user_id: {type: string, nullable: true, note: "[Indexed] SHA256 personal owner; null for a Team record."}
    hashed_team_id: {type: string, nullable: true, note: "[Indexed] SHA256 Team scope; null for personal records."}
    home_project_hash: {type: string, note: "[Indexed] SHA256 of the owning Project ID."}
    linked_project_hashes: {type: json, note: "Safe Project relationship hashes."}
    status: {type: string, note: "draft, ready or archived."}
    current_revision_id: {type: string, note: "Exact current immutable revision."}
    current_revision_number: {type: integer, note: "Monotonic revision number of the current revision."}
    encrypted_title: {type: text, note: "Client-encrypted title."}
    encrypted_description: {type: text, nullable: true, note: "Client-encrypted description."}
    key_wrappers: {type: json, note: "Context-bound wrapped Check keys; never raw keys."}
    created_at: {type: integer, note: "Server creation timestamp."}
    updated_at: {type: integer, note: "Server last-change timestamp."}

user_check_revisions:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    revision_id: {type: string, unique: true, note: "[Indexed, Unique] Client-generated revision UUID."}
    check_id: {type: string, note: "[Indexed] Owning Check UUID."}
    hashed_user_id: {type: string, nullable: true, note: "Personal owner scope, inherited."}
    hashed_team_id: {type: string, nullable: true, note: "Team scope, inherited."}
    revision_number: {type: integer, note: "Monotonic per Check."}
    base_revision_id: {type: string, nullable: true, note: "Exact base revision; null only for the first."}
    definition_hash: {type: string, note: "Client SHA256 commitment to the authored definition."}
    requires_deterministic: {type: boolean, default: false, note: "Security/privacy/encryption/permission/migration/exact-API claims."}
    sources: {type: json, note: "Plaintext list of {source_binding_id, source_kind, role required|supporting}."}
    encrypted_definition: {type: text, note: "Client-encrypted source refs, AI questions, human instructions, covered claims."}
    created_at: {type: integer, note: "Server timestamp."}

user_check_runs:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    run_id: {type: string, unique: true, note: "[Indexed, Unique] Server-generated run UUID."}
    check_id: {type: string, note: "[Indexed] Owning Check UUID."}
    check_revision_id: {type: string, note: "Exact revision this run evaluates."}
    hashed_user_id: {type: string, nullable: true, note: "Personal owner scope, inherited."}
    hashed_team_id: {type: string, nullable: true, note: "Team scope, inherited."}
    subject_revision: {type: string, nullable: true, note: "Opaque subject revision (git sha or file-revision hash)."}
    status: {type: string, note: "queued, running, passed, failed, error, blocked, waiting_for_confirmation or cancelled."}
    created_at: {type: integer, note: "Server timestamp."}
    finished_at: {type: integer, nullable: true, note: "Set when status becomes terminal."}
    encrypted_summary: {type: text, nullable: true, note: "Client-encrypted run summary."}

user_check_source_results:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    run_id: {type: string, note: "[Indexed] Owning run UUID."}
    check_id: {type: string, note: "[Indexed] Owning Check UUID."}
    source_binding_id: {type: string, note: "Binding id from the run's revision."}
    source_kind: {type: string, note: "Must equal the binding kind."}
    status: {type: string, note: "pending, running, passed, failed, error, blocked, skipped, cancelled or waived."}
    test_result_embed_id: {type: string, nullable: true, note: "Optional test_result embed reused as source result."}
    ai_score: {type: float, nullable: true, note: "AI evaluation score."}
    ai_threshold: {type: float, nullable: true, note: "AI evaluation threshold."}
    human_decision: {type: string, nullable: true, note: "confirmed, rejected, blocked or waived."}
    confirmer_hash: {type: string, nullable: true, note: "Server-derived SHA256 of the confirming actor."}
    confirmed_at: {type: integer, nullable: true, note: "Server confirmation timestamp."}
    encrypted_result: {type: text, nullable: true, note: "Client-encrypted result detail."}
    updated_at: {type: integer, note: "Server timestamp."}

user_plan_check_links:
  type: collection
  fields:
    id: {type: uuid, note: "Primary Key - auto-generated by Directus."}
    plan_id: {type: string, note: "[Indexed] Linked Plan id."}
    check_id: {type: string, note: "[Indexed] Linked Check UUID."}
    hashed_user_id: {type: string, nullable: true, note: "Personal owner scope."}
    hashed_team_id: {type: string, nullable: true, note: "Team scope."}
    required: {type: boolean, default: true, note: "Required Checks gate the Plan."}
    criterion_id: {type: string, nullable: true, note: "Optional success criterion the Check proves."}
    created_at: {type: integer, note: "Server timestamp."}
