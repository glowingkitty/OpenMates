# backend/core/directus/schemas/live_item_snapshots.yml
# Sealed snapshots of live items. Opaque ciphertext only (plan live-collaboration-crdt).
# Updates with seq <= covers_seq are compacted away only after `confirmed` is true,
# which happens when a second client reports it loaded the snapshot successfully.
live_item_snapshots:
  type: collection
  fields:
    id:
      type: uuid
      note: "Primary Key - auto-generated by Directus"
    hashed_item_id:
      type: string
      note: "[Indexed] SHA256 of the live item (embed) id."
    covers_seq:
      type: integer
      note: "Highest update seq folded into this snapshot."
    epoch:
      type: integer
      note: "Item key epoch the snapshot was sealed under."
    sender_hash:
      type: string
      note: "Opaque per-user hash of the client that sealed it; it cannot confirm its own snapshot."
    payload:
      type: text
      note: "[Encrypted] Base64 of the sealed snapshot. Opaque to the server."
    confirmed:
      type: boolean
      default: false
      note: "True once a different client loaded the snapshot successfully."
    created_at:
      type: integer
      note: "Unix timestamp (seconds)."
  indexes:
    - fields: [hashed_item_id, covers_seq, epoch]
      unique: true
