# backend/core/docker-compose.override.yml
# Overrides for development/local access via SSH port forwarding

services:
  # Workers build the same skill registry as the API. Keep development feature
  # gates consistent, including services inherited from task-worker.
  task-worker:
    environment: &development-worker-environment
      BACKEND_CONFIG_FILE: "/app/backend/config/backend_config.dev.yml"

  core-worker:
    environment: *development-worker-environment
  user-init-worker:
    environment: *development-worker-environment
  user-tasks-worker:
    environment: *development-worker-environment
  reminder-worker:
    environment: *development-worker-environment
  workflow-worker:
    environment: *development-worker-environment
  task-scheduler:
    environment: *development-worker-environment
  app-ai-worker:
    environment: *development-worker-environment
  app-images-worker:
    environment: *development-worker-environment
  app-music-worker:
    environment: *development-worker-environment
  app-videos-worker:
    environment: *development-worker-environment
  app-pdf-worker:
    environment: *development-worker-environment
  app-docs-worker:
    environment: *development-worker-environment
  app-code-worker:
    environment: *development-worker-environment
  app-social-media-worker:
    environment: *development-worker-environment

  api:
    environment:
      # Enable pre-release platform gates only on the local development stack.
      BACKEND_CONFIG_FILE: "/app/backend/config/backend_config.dev.yml"
    volumes:
      # Host cron and the CI coordinator publish canonical daily aggregates here.
      # The product runtime checkout has its own test-results directory.
      - /home/superdev/projects/OpenMates/test-results:/app/control-plane-test-results:ro
      # Read-only access to the openmates-marketing sibling repo so
      # send_newsletter.py can render issues authored outside this repo.
      # Only used on the dev machine; prod never runs send_newsletter.py.
      - ../../../openmates-marketing:/openmates-marketing:ro
      # Read/write access to the frontend UI package so
      # publish_newsletter.py can emit demo_chats/data/*.ts + register in
      # newsletterChatStore.ts. Prod never runs the publisher.
      - ../../frontend/packages/ui/src:/app/frontend/packages/ui/src
      # Read-only access to the intro frames so send_newsletter.py can
      # build the video thumbnail (play button overlay + rounded corners)
      # from the same frame-00 image the for-everyone chat header uses.
      - ../../frontend/apps/web_app/static/intro-frames:/app/frontend/apps/web_app/static/intro-frames:ro

  cms:
    ports:
      # Expose Directus only on localhost for SSH forwarding
      - "127.0.0.1:8055:8055"

  # Grafana removed — see docker-compose.yml for details.
  # grafana:
  #   ports:
  #     - "127.0.0.1:3000:3000"
