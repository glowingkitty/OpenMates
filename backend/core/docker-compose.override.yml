# backend/core/docker-compose.override.yml
# Overrides for development/local access via SSH port forwarding

services:
  # Workers build the same skill registry as the API. Keep development feature
  # gates consistent, including services inherited from task-worker.
  task-worker:
    image: &development-celery-image openmates-dev-celery-worker:local
    group_add: &development-runtime-groups ["1001"]
    environment: &development-worker-environment
      BACKEND_CONFIG_FILE: "/app/backend/config/backend_config.dev.yml"
      # Send recipient-held newsletter confirmations to the standalone dev website.
      NEWSLETTER_PUBLIC_WEBSITE_ORIGIN: "${NEWSLETTER_PUBLIC_WEBSITE_ORIGIN:-https://landing.dev.openmates.org}"
      # Discord notifications are handed to the host's private notification log.
      NOTIFICATION_SPOOL_DIR: "/app/notification-spool"
    volumes: &development-notification-spool
      - &notification-spool-mount
        type: bind
        source: /home/superdev/.openmates/notifications/spool
        target: /app/notification-spool

  core-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  user-init-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  user-tasks-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  reminder-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  workflow-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  task-scheduler:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-ai-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-ai-routing-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-images-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-music-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-videos-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-pdf-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-docs-worker:
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-code-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool
  app-social-media-worker:
    image: *development-celery-image
    group_add: *development-runtime-groups
    environment: *development-worker-environment
    volumes: *development-notification-spool

  api:
    user: "1000:1000"
    group_add:
      # The runtime checkout and host-owned dev queues use this group.
      - "1001"
    environment:
      # The cached development image may lack a passwd entry for UID 1000.
      HOME: /tmp
      # Enable pre-release platform gates only on the local development stack.
      BACKEND_CONFIG_FILE: "/app/backend/config/backend_config.dev.yml"
      # Send recipient-held newsletter confirmations to the standalone dev website.
      NEWSLETTER_PUBLIC_WEBSITE_ORIGIN: "${NEWSLETTER_PUBLIC_WEBSITE_ORIGIN:-https://landing.dev.openmates.org}"
      # Admin "Send to Claude chat" issue handoff (dev only). The host cron
      # dispatcher scripts/claude_dispatch.py consumes this queue.
      CLAUDE_DISPATCH_QUEUE_DIR: "/app/claude-dispatch-queue"
      NOTIFICATION_SPOOL_DIR: "/app/notification-spool"
    volumes:
      - *notification-spool-mount
      # Identifier-only Claude chat requests for admin issue reports.
      - /home/superdev/projects/OpenMates/logs/claude-dispatch/queue:/app/claude-dispatch-queue
      # Host cron and the CI coordinator publish canonical daily aggregates here.
      # The product runtime checkout has its own test-results directory.
      - /home/superdev/projects/OpenMates/test-results:/app/control-plane-test-results:ro
      # Read-only access to the openmates-marketing sibling repo so
      # send_newsletter.py can render issues authored outside this repo.
      # Only used on the dev machine; prod never runs send_newsletter.py.
      - ../../../openmates-marketing:/openmates-marketing:ro
      # Read/write access to the frontend UI package so
      # publish_newsletter.py can emit demo_chats/data/*.ts + register in
      # newsletterChatStore.ts. Prod never runs the publisher.
      - ../../frontend/packages/ui/src:/app/frontend/packages/ui/src
      # Read-only access to the intro frames so send_newsletter.py can
      # build the video thumbnail (play button overlay + rounded corners)
      # from the same frame-00 image the for-everyone chat header uses.
      - ../../frontend/apps/web_app/static/intro-frames:/app/frontend/apps/web_app/static/intro-frames:ro

  admin-sidecar:
    # This dev bind mount is owned by the operator's workspace account.
    user: "1001:1001"

  cms:
    environment:
      # Reuse immutable schema metadata; normal schema/permission invalidation stays active.
      CACHE_SCHEMA_FREEZE_ENABLED: "true"
    ports:
      # Expose Directus only on localhost for SSH forwarding
      - "127.0.0.1:8055:8055"

  # Grafana removed — see docker-compose.yml for details.
  # grafana:
  #   ports:
  #     - "127.0.0.1:3000:3000"
