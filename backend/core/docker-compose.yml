      start_period: 10s
    build:
      context: ../../
      dockerfile: frontend/apps/web_app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ENV: ${VITE_ENV:-self_hosted}
        VITE_UPLOAD_URL: ${VITE_UPLOAD_URL:-}
  app-packages-runner:
    image: python:3.13-slim
    container_name: app-packages-runner
    restart: unless-stopped
    user: 65534:65534
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      APP_PACKAGES_ROOT: /app-packages
      APP_PACKAGES_RUNNER_SOCKET: /run/app-packages-runner/runner.sock
    command:
      - python3
      - /runner/runner.py
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    volumes:
      - ../../backend/core/app_packages_runner:/runner:ro
      - ${OPENMATES_APP_PACKAGES_DIR:-../../.openmates/app-packages}:/app-packages:ro
      - app-packages-runner-socket:/run/app-packages-runner
    networks:
      - app-packages-egress
    healthcheck:
      test:
        - CMD
        - python3
        - /runner/runner.py
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  openmates:
    external: true
    name: openmates
  app-packages-egress:
    name: openmates-app-packages-egress
    driver: bridge
    ipam:
      config:
        - subnet: ${OPENMATES_APP_PACKAGES_EGRESS_SUBNET:-10.250.71.0/24}
volumes:
  app-packages-runner-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65534,gid=65534,mode=0755,size=1m,nosuid,nodev,noexec
  apps-recommendations-data:
    labels:
      openmates.backup.exclude: 'true'
      openmates.data.retention: temporary-recommendations-24h
  openmates-postgres-data:
    name: openmates-postgres-data
  cache-data:
    name: openmates-cache-data
  openobserve-data:
    name: openmates-openobserve-data
  prometheus-data:
    name: openmates-prometheus-data
  vault-data:
    name: openmates-vault-data
  vault-setup-data:
    name: openmates-vault-setup-data
  celerybeat-schedule-data:
    name: openmates-celerybeat-schedule-data
  preview-cache:
    name: openmates-preview-cache
