        \ in\n  production) urgent_webhook=\"$${DISCORD_WEBHOOK_URGENT_PRODUCTION:-$${OPENMATES_RUNTIME_HEALTH_DISCORD_WEBHOOK_URL_PRODUCTION:-}}\"\
        \ ;;\n  self_host) urgent_webhook=\"$${DISCORD_WEBHOOK_URGENT_SELF_HOST:-$${OPENMATES_RUNTIME_HEALTH_DISCORD_WEBHOOK_URL_SELF_HOST:-$${OPENMATES_RUNTIME_HEALTH_DISCORD_WEBHOOK_URL:-}}}\"\
        \ ;;\n  *) urgent_webhook=\"$${DISCORD_WEBHOOK_URGENT_DEVELOPMENT:-$${OPENMATES_RUNTIME_HEALTH_DISCORD_WEBHOOK_URL_DEVELOPMENT:-}}\"\
        \ ;;\nesac\nsed \"s|\\$${INTERNAL_API_SHARED_TOKEN}|$$INTERNAL_API_SHARED_TOKEN|g\" /etc/alertmanager/alertmanager.yml\
        \ > /tmp/alertmanager.runtime.yml\nif [ -n \"$$urgent_webhook\" ]; then\n  sed -i \"s|\\$${DISCORD_WEBHOOK_URGENT_SCOPED}|$$urgent_webhook|g\"\
        \ /tmp/alertmanager.runtime.yml\nelse\n  sed -i '/URGENT_DISCORD_ROUTE_START/,/URGENT_DISCORD_ROUTE_END/d; /URGENT_DISCORD_RECEIVER_START/,/URGENT_DISCORD_RECEIVER_END/d'\
        \ /tmp/alertmanager.runtime.yml\nfi\nif grep -q '\\$${' /tmp/alertmanager.runtime.yml; then\n  echo \"FATAL: unresolved\
