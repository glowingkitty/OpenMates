# Generated by scripts/sync_core_compose.py. Edit backend/core/docker-compose.selfhost.yml and backend/core/core-compose.dev-overrides.yml.
name: openmates-core
services:
  api:
    container_name: api
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: ../../.env
    environment:
      APPS_RECOMMENDATIONS_DIR: /app/data/apps-recommendations
      PYTHONPATH: /app
      REST_API_PORT: 8000
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      VAULT_URL: http://vault:8200
      MONITORING_URL: http://openobserve:5080
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      INTERNAL_API_SHARED_TOKEN: ${INTERNAL_API_SHARED_TOKEN}
      TUNNEL_TRIGGER_SECRET: ${TUNNEL_TRIGGER_SECRET}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      OPENMATES_CLOUD_OVERLAY_ENABLED: ${OPENMATES_CLOUD_OVERLAY_ENABLED:-false}
      OPENMATES_CLOUD_OVERLAY_PACKAGE: ${OPENMATES_CLOUD_OVERLAY_PACKAGE:-}
      OPENMATES_DEPLOYMENT_MODE: ${OPENMATES_DEPLOYMENT_MODE:-self_host}
      MOCK_EXTERNAL_APIS: 'true'
      APPLICATION_PREVIEW_ORIGIN: ${APPLICATION_PREVIEW_ORIGIN}
      TRANSLATIONS_DIR: /translations
    command: sh /app/backend/core/api/wait-for-vault.sh
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - apps-recommendations-data:/app/data/apps-recommendations
      - ../../backend:/app/backend
      - ${OPENMATES_APP_PACKAGES_DIR:-../../.openmates/app-packages}:/app-packages:ro
      - app-packages-runner-socket:/run/app-packages-runner:ro
      - ./api/logs:/app/logs
      - ../../frontend/packages/ui/src/i18n/locales:/translations
      - ../../frontend/packages/ui/src/i18n:/app/frontend/packages/ui/src/i18n
      - ../../frontend/apps/web_app/static/newsletter-assets:/app/frontend/apps/web_app/static/newsletter-assets:ro
      - ../../docs:/app/docs:ro
      - ../../shared:/shared
      - vault-setup-data:/vault-data
      - ../../backend/config:/config
      - ../../.cursor:/app/.cursor
      - ../../test-results:/app/test-results
      - /home/superdev/.local/bin/cloudflared:/usr/local/bin/cloudflared:ro
    networks:
      - openmates
    depends_on:
      cache:
        condition: service_healthy
      cms:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully
      cms-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
    build:
      context: ../../
      dockerfile: backend/core/api/Dockerfile
  cms:
    container_name: cms
    image: openmates-directus:dev
    restart: unless-stopped
    env_file: ../../.env
    environment:
      KEY: ${DIRECTUS_SECRET}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DATABASE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: cms-database
      DB_PORT: '5432'
      DB_DATABASE: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USERNAME}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      INTERNAL_API_SHARED_TOKEN: ${INTERNAL_API_SHARED_TOKEN}
      PUBLIC_URL: http://localhost:8055
      LOG_LEVEL: info
      WEBSOCKETS_ENABLED: 'false'
      WEBSOCKETS_REST_ENABLED: 'false'
      WEBSOCKETS_GRAPHQL_ENABLED: 'false'
      WEBSOCKETS_LOGS_ENABLED: 'false'
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS_HOST: cache
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${DRAGONFLY_PASSWORD}
      REDIS_USERNAME: default
      REFRESH_TOKEN_TTL: 30d
      CACHE_SKIP_ALLOWED: 'true'
      CACHE_AUTO_PURGE: 'true'
    volumes:
      - ./directus/uploads:/directus/uploads
    networks:
      - openmates
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/openmates-directus-health
      interval: 10s
      timeout: 8s
      start_period: 10m
      retries: 12
    depends_on:
      cms-database:
        condition: service_healthy
      cache:
        condition: service_healthy
    build:
      context: ./directus
      dockerfile: Dockerfile
    user: node
    command:
      - /usr/local/bin/openmates-directus-start
  cms-database:
    container_name: cms-database
    image: postgres:13-alpine
    user: postgres
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - openmates-postgres-data:/var/lib/postgresql/data
    networks:
      - openmates
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${DATABASE_USERNAME}" -d "${DATABASE_NAME}"
      interval: 10s
      timeout: 5s
      retries: 5
  cms-setup:
    container_name: cms-setup
    env_file: ../../.env
    environment:
      ADMIN_EMAIL: ${DATABASE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      INTERNAL_API_SHARED_TOKEN: ${INTERNAL_API_SHARED_TOKEN}
      SCHEMAS_DIR: /usr/src/app/schemas
      CHAT_RECOVERY_MIGRATION_PATH: /usr/src/app/migrations/migrate_chat_recovery_unique_indexes.sql
      STORAGE_REPLICATION_MIGRATION_PATH: /usr/src/app/migrations/migrate_storage_replication_indexes.sql
      WORKFLOW_RUNTIME_MIGRATION_PATH: /usr/src/app/migrations/migrate_workflow_runtime_indexes.sql
      USER_CHAT_PREFERENCE_MIGRATION_PATH: /usr/src/app/migrations/migrate_user_chat_preferences_indexes.sql
      ACCOUNT_CHAT_KEYS_MIGRATION_PATH: /usr/src/app/migrations/migrate_account_chat_keys.sql
      NOTIFICATION_EMAIL_MIGRATION_PATH: /usr/src/app/migrations/migrate_notification_email_preferences.sql
      USER_TASK_MIGRATION_PATH: /usr/src/app/migrations/migrate_user_task_indexes.sql
      CHAT_SYNC_FEED_MIGRATION_PATH: /usr/src/app/migrations/migrate_chat_sync_feed.sql
      USER_WORK_CONTROL_MIGRATION_PATH: /usr/src/app/migrations/migrate_user_work_control_indexes.sql
      USAGE_OVERVIEW_MIGRATION_PATH: /usr/src/app/migrations/migrate_usage_overview_indexes.sql
      PROJECT_OWNER_CONTEXT_MIGRATION_PATH: /usr/src/app/migrations/migrate_project_owner_context.sql
      ENCRYPTED_SLUG_MIGRATION_PATH: /usr/src/app/migrations/migrate_encrypted_slug_indexes.sql
      SUB_CHAT_ORCHESTRATION_MIGRATION_PATH: /usr/src/app/migrations/migrate_sub_chat_orchestration_indexes.sql
      AI_MEMORY_REMOVAL_MIGRATION_PATH: /usr/src/app/migrations/migrate_remove_ai_memories.sql
      QUICK_TIPS_REMOVAL_MIGRATION_PATH: /usr/src/app/migrations/migrate_remove_quick_tips.sql
      STORAGE_QUERY_MIGRATION_PATH: /usr/src/app/migrations/migrate_storage_query_indexes.sql
      STORAGE_BILLING_MIGRATION_PATH: /usr/src/app/migrations/migrate_storage_billing_indexes.sql
      STORAGE_USAGE_METERING_MIGRATION_PATH: /usr/src/app/migrations/migrate_storage_usage_metering_indexes.sql
      APPS_WORKSPACE_RESULT_MIGRATION_PATH: /usr/src/app/migrations/migrate_apps_workspace_result_indexes.sql
    networks:
      - openmates
    depends_on:
      - cms
    restart: 'no'
    build:
      context: ./directus/setup
      dockerfile: Dockerfile
    user: 10002:10002
    volumes:
      - ./directus/schemas:/usr/src/app/schemas:ro
      - ./directus/setup/migrate_personal_privacy_generation.sql:/usr/src/app/migrations/migrate_personal_privacy_generation.sql:ro
      - ./directus/setup/migrate_chat_recovery_unique_indexes.sql:/usr/src/app/migrations/migrate_chat_recovery_unique_indexes.sql:ro
      - ./directus/setup/migrate_chat_recovery_outputs_indexes.sql:/usr/src/app/migrations/migrate_chat_recovery_outputs_indexes.sql:ro
      - ./directus/setup/migrate_storage_replication_indexes.sql:/usr/src/app/migrations/migrate_storage_replication_indexes.sql:ro
      - ./directus/setup/migrate_storage_query_indexes.sql:/usr/src/app/migrations/migrate_storage_query_indexes.sql:ro
      - ./directus/setup/migrate_storage_billing_indexes.sql:/usr/src/app/migrations/migrate_storage_billing_indexes.sql:ro
      - ./directus/setup/migrate_storage_usage_metering_indexes.sql:/usr/src/app/migrations/migrate_storage_usage_metering_indexes.sql:ro
      - ./directus/setup/migrate_chat_message_archive_indexes.sql:/usr/src/app/migrations/migrate_chat_message_archive_indexes.sql:ro
      - ./directus/setup/migrate_workflow_runtime_indexes.sql:/usr/src/app/migrations/migrate_workflow_runtime_indexes.sql:ro
      - ./directus/setup/migrate_user_chat_preferences_indexes.sql:/usr/src/app/migrations/migrate_user_chat_preferences_indexes.sql:ro
      - ./directus/setup/migrate_account_chat_keys.sql:/usr/src/app/migrations/migrate_account_chat_keys.sql:ro
      - ./directus/setup/migrate_notification_email_preferences.sql:/usr/src/app/migrations/migrate_notification_email_preferences.sql:ro
      - ./directus/setup/migrate_apps_workspace_result_indexes.sql:/usr/src/app/migrations/migrate_apps_workspace_result_indexes.sql:ro
      - ./directus/setup/migrate_user_task_indexes.sql:/usr/src/app/migrations/migrate_user_task_indexes.sql:ro
      - ./directus/setup/migrate_chat_sync_feed.sql:/usr/src/app/migrations/migrate_chat_sync_feed.sql:ro
      - ./directus/setup/migrate_user_work_control_indexes.sql:/usr/src/app/migrations/migrate_user_work_control_indexes.sql:ro
      - ./directus/setup/migrate_user_specification_indexes.sql:/usr/src/app/migrations/migrate_user_specification_indexes.sql:ro
      - ./directus/setup/migrate_usage_overview_indexes.sql:/usr/src/app/migrations/migrate_usage_overview_indexes.sql:ro
      - ./directus/setup/migrate_project_owner_context.sql:/usr/src/app/migrations/migrate_project_owner_context.sql:ro
      - ./directus/setup/migrate_encrypted_slug_indexes.sql:/usr/src/app/migrations/migrate_encrypted_slug_indexes.sql:ro
      - ./directus/setup/migrate_sub_chat_orchestration_indexes.sql:/usr/src/app/migrations/migrate_sub_chat_orchestration_indexes.sql:ro
      - ./directus/setup/migrate_remove_ai_memories.sql:/usr/src/app/migrations/migrate_remove_ai_memories.sql:ro
      - ./directus/setup/migrate_remove_quick_tips.sql:/usr/src/app/migrations/migrate_remove_quick_tips.sql:ro
    deploy:
      restart_policy:
        condition: none
  task-worker:
    restart: unless-stopped
    user: celeryuser
    env_file: ../../.env
    environment:
      PYTHONPATH: /app
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      VAULT_URL: http://vault:8200
      OPENMATES_CLOUD_OVERLAY_ENABLED: ${OPENMATES_CLOUD_OVERLAY_ENABLED:-false}
      OPENMATES_CLOUD_OVERLAY_PACKAGE: ${OPENMATES_CLOUD_OVERLAY_PACKAGE:-}
      OPENMATES_DEPLOYMENT_MODE: ${OPENMATES_DEPLOYMENT_MODE:-self_host}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      MOCK_EXTERNAL_APIS: 'true'
      APPS_RECOMMENDATIONS_DIR: /app/data/apps-recommendations
      CELERY_QUEUES: email
      CELERY_AUTOSCALE_MAX: ${CELERY_AUTOSCALE_MAX:-10}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-3}
      CELERY_METRICS_PORT: '9101'
      TRANSLATIONS_DIR: /translations
      E2E_TEST_DEV_ENABLED: ${E2E_TEST_DEV_ENABLED:-true}
      E2E_TEST_DEV_BASE_URL: ${E2E_TEST_DEV_BASE_URL:-https://app.dev.openmates.org}
      E2E_TEST_PROD_ENABLED: ${E2E_TEST_PROD_ENABLED:-false}
      E2E_TEST_PROD_BASE_URL: ${E2E_TEST_PROD_BASE_URL:-https://openmates.org}
    volumes:
      - apps-recommendations-data:/app/data/apps-recommendations
      - ../../backend:/app/backend
      - ${OPENMATES_APP_PACKAGES_DIR:-../../.openmates/app-packages}:/app-packages:ro
      - ./api/logs:/app/logs
      - vault-setup-data:/vault-data
      - ../../frontend/packages/ui/src/i18n/locales:/translations
      - ../../frontend/packages/ui/src/i18n:/app/frontend/packages/ui/src/i18n
      - ../../shared:/shared
    networks: &id002
      - openmates
    depends_on: &id003
      cache:
        condition: service_healthy
      cms:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully
      cms-setup:
        condition: service_completed_successfully
    container_name: task-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=email \
        --concurrency=${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    build: &id004
      context: ../../
      dockerfile: backend/core/api/Dockerfile.celery
  user-init-worker:
    environment:
      CELERY_QUEUES: user_init
      CELERY_AUTOSCALE_MAX: ${USER_INIT_WORKER_CONCURRENCY:-${CELERY_AUTOSCALE_MAX:-2}}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-1}
      CELERY_METRICS_PORT: '9110'
    container_name: user-init-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=user_init \
        --concurrency=$${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    extends: &id001
      service: task-worker
  core-worker:
    environment:
      CELERY_QUEUES: persistence,health_check,server_stats,demo,e2e_tests,push,leaderboard
      CELERY_AUTOSCALE_MAX: ${CELERY_AUTOSCALE_MAX:-10}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-3}
      CELERY_METRICS_PORT: '9109'
    container_name: core-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=persistence,health_check,server_stats,demo,e2e_tests,push,leaderboard \
        --concurrency=${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    extends: *id001
  user-tasks-worker:
    environment:
      CELERY_QUEUES: user_tasks
      CELERY_AUTOSCALE_MAX: ${USER_TASKS_WORKER_CONCURRENCY:-2}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-1}
      CELERY_METRICS_PORT: '9112'
    container_name: user-tasks-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=user_tasks \
        --concurrency=$${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    extends: *id001
  reminder-worker:
    environment:
      CELERY_QUEUES: reminder
      CELERY_AUTOSCALE_MAX: ${REMINDER_WORKER_CONCURRENCY:-2}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-1}
      CELERY_METRICS_PORT: '9111'
    container_name: reminder-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=reminder \
        --concurrency=$${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    extends: *id001
  workflow-worker:
    restart: unless-stopped
    user: celeryuser
    env_file: ../../.env
    environment:
      PYTHONPATH: /app
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      VAULT_URL: http://vault:8200
      OPENMATES_CLOUD_OVERLAY_ENABLED: ${OPENMATES_CLOUD_OVERLAY_ENABLED:-false}
      OPENMATES_CLOUD_OVERLAY_PACKAGE: ${OPENMATES_CLOUD_OVERLAY_PACKAGE:-}
      OPENMATES_DEPLOYMENT_MODE: ${OPENMATES_DEPLOYMENT_MODE:-self_host}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      MOCK_EXTERNAL_APIS: 'true'
      CELERY_QUEUES: workflow
      CELERY_AUTOSCALE_MAX: ${WORKFLOW_WORKER_CONCURRENCY:-2}
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-1}
      CELERY_METRICS_PORT: '9108'
      TRANSLATIONS_DIR: /translations
    volumes:
      - ../../backend:/app/backend
      - ${OPENMATES_APP_PACKAGES_DIR:-../../.openmates/app-packages}:/app-packages:ro
      - app-packages-runner-socket:/run/app-packages-runner:ro
      - ./api/logs:/app/logs
      - vault-setup-data:/vault-data
      - ../../frontend/packages/ui/src/i18n/locales:/translations
      - ../../frontend/packages/ui/src/i18n:/app/frontend/packages/ui/src/i18n
      - ../../shared:/shared
    networks: *id002
    depends_on: *id003
    container_name: workflow-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=workflow \
        --concurrency=$${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    build: *id004
  task-scheduler:
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PYTHONPATH: /app
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      OPENMATES_CLOUD_OVERLAY_ENABLED: ${OPENMATES_CLOUD_OVERLAY_ENABLED:-false}
      OPENMATES_CLOUD_OVERLAY_PACKAGE: ${OPENMATES_CLOUD_OVERLAY_PACKAGE:-}
      OPENMATES_DEPLOYMENT_MODE: ${OPENMATES_DEPLOYMENT_MODE:-self_host}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      MOCK_EXTERNAL_APIS: 'true'
      TRANSLATIONS_DIR: /translations
    volumes:
      - ../../backend:/app/backend
      - ./api/logs:/app/logs
      - celerybeat-schedule-data:/celerybeat-data
      - vault-setup-data:/vault-data
      - ../../frontend/packages/ui/src/i18n/locales:/translations
      - ../../frontend/packages/ui/src/i18n:/app/frontend/packages/ui/src/i18n
      - ../../shared:/shared
    networks: *id002
    depends_on: *id003
    container_name: task-scheduler
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config beat --loglevel=info --schedule=/celerybeat-data/celerybeat-schedule
    build: *id004
  app-ai-worker:
    restart: unless-stopped
    user: celeryuser
    env_file: ../../.env
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: '1'
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      VAULT_URL: http://vault:8200
      PROVIDER_CONFIG_DIR: /app_config/providers
      BACKEND_CONFIG_FILE: /app_config/backend_config.yml
      OPENMATES_CLOUD_OVERLAY_ENABLED: ${OPENMATES_CLOUD_OVERLAY_ENABLED:-false}
      OPENMATES_CLOUD_OVERLAY_PACKAGE: ${OPENMATES_CLOUD_OVERLAY_PACKAGE:-}
      OPENMATES_DEPLOYMENT_MODE: ${OPENMATES_DEPLOYMENT_MODE:-self_host}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      MOCK_EXTERNAL_APIS: 'true'
      CELERY_QUEUES: app_ai
      CELERY_AUTOSCALE_MAX: ${CELERY_AUTOSCALE_MAX:-10}
      CELERY_METRICS_PORT: '9102'
      TRANSLATIONS_DIR: /translations
      CELERY_AUTOSCALE_MIN: ${CELERY_AUTOSCALE_MIN:-3}
    volumes:
      - ../../backend:/app/backend
      - ${OPENMATES_APP_PACKAGES_DIR:-../../.openmates/app-packages}:/app-packages:ro
      - app-packages-runner-socket:/run/app-packages-runner:ro
      - ../../backend/apps:/app/apps
      - ./api/logs:/app/logs
      - vault-setup-data:/vault-data
      - ../../frontend/packages/ui/src/i18n/locales:/translations
      - ../../frontend/packages/ui/src/i18n:/app/frontend/packages/ui/src/i18n
      - ../../shared:/shared
    networks: *id002
    depends_on: *id003
    container_name: app-ai-worker
    command:
      - sh
      - -c
      - |
        exec python -m celery -A backend.core.api.app.tasks.celery_config worker \
        --loglevel=info \
        --queues=app_ai \
        --concurrency=${CELERY_AUTOSCALE_MAX} \
        --max-tasks-per-child=50 \
        --max-memory-per-child=600000 \
        --prefetch-multiplier=1
    build: *id004
  app-ai-routing-worker:
    restart: unless-stopped
    user: celeryuser
    env_file: ../../.env
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: '1'
      CMS_URL: http://cms:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DRAGONFLY_URL: cache:6379
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      VAULT_URL: http://vault:8200
      PROVIDER_CONFIG_DIR: /app_config/providers
      BACKEND_CONFIG_FILE: /app_config/backend_config.yml
