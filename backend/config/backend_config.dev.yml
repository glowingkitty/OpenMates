# Development-only backend configuration.
#
# This file is selected only by backend/core/docker-compose.override.yml on the
# OpenMates dev machine. Production and self-hosted deployments continue using
# backend_config.yml, where unreleased product surfaces remain disabled.

feature_overrides:
  enabled:
    - "platform:projects"
    - "platform:plans"
    - "platform:tasks"
    - "platform:workflows"
    - "platform:teams"
  disabled:
    # Life coaching is on for dev with its Life compass focus; Crisis support is still
    # a placeholder without instructions, so it stays off.
    - "focus:life_coaching:crisis_support"
    - "app:plants"

logging:
  level: "INFO"
  format: "json"

feature_flags:
  new_dashboard_feature: true
  experimental_analytics: false
  live_collaboration: true

# Keep in sync with backend_config.yml; see the pricing comment there.
pricing:
  margin_percent: 50
  rounding_step_credits: 5
  zero_cost_minimum_credits: 1
