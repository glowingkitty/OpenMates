# backend/config/backend_config.yml
# Main configuration for the OpenMates backend API.

# Apps, skills, embeds, focus modes, memories, and platform sections are enabled
# by default unless their metadata declares default_enabled: false or an admin
# override below changes the effective state. Changes require a server restart.
#
# Feature ID formats:
#   app:<app_id>
#   skill:<app_id>:<skill_id>
#   embed:<app_id>:<embed_id>
#   focus:<app_id>:<focus_id>
#   memory:<app_id>:<memory_id>
#   platform:<feature_id>
#
# Admin overrides. `enabled` is only needed to opt into features that ship with
# default_enabled: false. `disabled` can disable default-on features.
feature_overrides:
  enabled:
    - "platform:workflows"
    # Event search: official schedules plus public web pages (web search and page
    # extraction). No operator-installed providers are part of this deployment.
    - "skill:events:search"
  disabled:
    # Browse is still in development; search and public page reading remain enabled.
    - "skill:web:browse"
    - "embed:web:browse"
    # Unreleased product surfaces remain available through backend_config.dev.yml.
    - "platform:teams"
    - "platform:projects"
    - "platform:tasks"
    - "platform:plans"
    - "app:projects"
    - "app:tasks"
    - "app:plans"
    # Placeholder app folders without implemented runtime behavior yet
    - "app:life_coaching"
    - "app:plants"

# Other backend-wide configurations can be added below.
# For example:
# global_settings:
#   default_language: "en"
#   max_request_size: "10mb"

# Logging configuration (can be overridden by environment variables)
logging:
  level: "INFO" # Default logging level (e.g., DEBUG, INFO, WARNING, ERROR, CRITICAL)
  format: "json"  # Logging format (e.g., "json", "text") - handled by setup_logging.py

# Feature flags
feature_flags:
  new_dashboard_feature: true
  experimental_analytics: false

# Customer pricing (cost-plus). Every customer credit price is derived from the
# supplier cost (USD per billed unit) as cost x (1 + margin_percent / 100), at
# 1 credit = $0.001, rounded up to rounding_step_credits. Prices under one step
# keep their value (whole credits per call, 0.01 credits for continuous units).
# Items without an external supplier cost charge zero_cost_minimum_credits per
# billed unit. After changing a value run `python3 scripts/derive_customer_prices.py
# --write` and deploy; OPENMATES_PRICING_MARGIN_PERCENT overrides the margin there.
pricing:
  margin_percent: 50
  rounding_step_credits: 5
  zero_cost_minimum_credits: 1
