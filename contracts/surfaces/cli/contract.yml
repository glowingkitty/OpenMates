schema_version: 1
id: surface.cli
version: 1
status: draft
title: CLI Surface
summary: >
  The OpenMates CLI is a first-party terminal client that resolves stable,
  encrypted human slugs for user-owned encrypted objects locally, sends only
  canonical object ids to server/API operations, and renders actionable
  human-readable output without exposing private plaintext in durable backend
  state.

scope:
  includes:
    - Human-readable CLI handling for workflows, projects, plans, tasks, and saved chats.
    - Client-generated encrypted_slug fields and keyed slug_lookup_hash metadata for object create, update, list, show, and command resolution where each object surface supports the operation.
    - Local CLI decryption, slug display, slug-to-id resolution, duplicate detection, ambiguity handling, and canonical-id transport to REST/WebSocket/SDK-backed server calls.
    - Human output summaries that show titles/names, stable slugs, lifecycle state, relevant next/last activity, and next useful commands while preserving --json machine output.
  excludes:
    - Public example chat slugs, which are intentionally cleartext public catalog identifiers.
    - Server-side plaintext slug search, plaintext slug indexes, or server-side decryption of encrypted_slug values.
    - Slugs for provider-owned objects, external URLs, app-skill provider records, or transient CLI-only proof artifacts.
    - GUI visual layout, Apple terminal-equivalent UX, and SDK method naming beyond parity rules that call the same underlying object ids.

models:
  EncryptedObjectSlug:
    encrypted_slug:
      type: client_ciphertext
      required: true
      constraints: {decrypts_to_slug: true, plaintext_slug_backend_storage: forbidden}
    slug_lookup_hash:
      type: keyed_hash
      required: true
      constraints: {computed_client_side: true, plaintext_slug_recoverable: false, owner_or_context_scoped: true}
    slug_state:
      type: enum
      values: [stable, explicitly_renamed]
      required: true
      constraints: {does_not_auto_follow_title: true}

  CliSlugResolution:
    user_input:
      type: string
      required: true
      constraints: {may_be_full_id_short_id_slug_or_supported_title_query: true}
    resolved_object_id:
      type: stable_id
      required: true
      constraints: {sent_to_server_instead_of_slug: true}
    server_request_payload:
      type: object
      required: true
      constraints: {plaintext_slug: forbidden, encrypted_slug_optional_only_for_slug_mutations: true}
    ambiguity:
      type: enum_or_null
      values: [not_found, duplicate_slug, duplicate_title, context_required]

  CliHumanOutput:
    primary_handle:
      type: slug
      required: true
    title_or_name:
      type: transient_plaintext
      required: true
      constraints: {from_local_decryption: true, durable_backend_plaintext: forbidden}
    lifecycle_summary:
      type: string
      required: true
      constraints: {actionable: true}
    next_commands:
      type: array
      required: true
      constraints: {prefer_slug_handles: true, avoid_opaque_ids_by_default: true}

assertions:
  - id: cli.slugs.encrypted-stable
    type: privacy
    must: Workflows, Projects, Plans, Tasks, and saved Chats expose stable user-facing slugs as encrypted_slug plus owner/context-scoped slug_lookup_hash metadata; slugs are generated on create, remain stable across title/name changes, and change only through explicit slug mutation.
    depends_on: [models.EncryptedObjectSlug, examples.encrypted_slugs]
  - id: cli.slugs.local-resolution-id-transport
    type: security
    must: CLI commands may accept full ids, short ids, encrypted slugs after local decryption, or supported title/name queries, but every server request for show, run, list-runs, edit, delete, link, or chat operations sends the canonical object id and never sends the plaintext slug except when the client submits encrypted_slug plus slug_lookup_hash during an explicit create/update slug mutation.
    depends_on: [models.CliSlugResolution, examples.local_resolution]
  - id: cli.output.actionable-readable
    type: behavior
    must: Human-readable CLI output for workflows, workflow runs, projects, plans, tasks, and chats leads with title/name and slug, includes relevant lifecycle/activity context, and shows next commands using slugs; opaque UUIDs are reserved for detail/debug lines and --json output.
    depends_on: [models.CliHumanOutput, examples.human_output]
  - id: cli.surface.semantic-parity
    type: parity
    must: CLI slug generation, lookup-hash privacy, local resolution, ambiguity errors, id transport, destructive confirmations, and JSON/human output boundaries preserve the object contracts for Workflows, Projects, Plans, Tasks, and Chats without weakening encrypted-content or owner/team scoping semantics.
    depends_on: [models, examples, surfaces]
  - id: cli.work-structure.complete
    type: parity
    must: CLI Plan and Task commands expose the same dependency, assumption-evidence, revision, and lifecycle structure as the first-party REST and SDK surfaces without creating a second planning model.
    depends_on: [surfaces]
  - id: cli.plan-approval.web-only
    type: security
    must: The CLI may submit and inspect encrypted Plan revisions but cannot approve them; approval remains bound to an authenticated trusted browser session.
    depends_on: [surfaces]
  - id: cli.recovery.yaml-explicit
    type: behavior
    must: Project-scoped Plan and Task recovery YAML is written only by an explicit CLI command or configured external recovery root, contains decrypted typed work data without ciphertext fields, and requires validation plus explicit confirmation before restore.
    depends_on: [surfaces]

surfaces:
  rest_api:
    required: true
    role: Existing object APIs store encrypted_slug and slug_lookup_hash metadata, enforce owner/team scoping and duplicate slug_lookup_hash rejection, and receive canonical ids for object operations.
  cli:
    required: true
    parity: source_of_truth
    role: First-party terminal UX decrypts object slugs locally, resolves user inputs to ids, and renders actionable human output.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
    role: SDKs preserve encrypted slug fields and slug lookup hashes for SDK-created or SDK-mutated objects where those namespaces expose the object surface; terminal rendering remains CLI-only.
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false}
    exceptions:
      - id: apple-slug-ui-not-launch-gated
        implementation: apple
        reason: This contract changes CLI-first object handles and shared encrypted object metadata; Apple must preserve encrypted_slug when it later creates or edits these object types, but native slug UI is not launch-gated by this CLI surface change.
        equivalent_outcome: Apple-created or Apple-edited workflows, projects, plans, tasks, and saved chats must not create plaintext slug backend state and must interoperate with CLI slug resolution once native support exists.

examples:
  file: examples.yml
  required_groups: [encrypted_slugs, local_resolution, human_output]
