schema_version: 1
contract: feature.workflows@1

lifecycle:
  - id: action-completes-at-pending-delivery
    input: {workflow_action: send_chat_message, delivery_created: true}
    expect: {workflow_step_status: completed, output_status: delivery_pending, persisted_regular_chat_message_reported: false}
  - id: terminal-undelivered-remains-visible
    input: {delivery_status: expired}
    expect: {run_detail_status: expired, workflow_run_reopened: false}
  - id: failed-step-stops-later-steps
    input: {step_status: failed, later_steps_configured: true}
    expect: {later_steps_executed: false, final_run_status: failed}

encrypted_retained_content:
  - id: retained-run-content-vault-encrypted
    durable_state:
      contains: [run_id, step_id, status, encrypted_content]
      forbidden: [plaintext_prompt, plaintext_mapped_input, plaintext_output, plaintext_wait_response]
  - id: notification-content-free
    input: {notification_kind: workflow_chat_delivery_available, owner_offline: true}
    expect: {links_to_run_or_delivery: true, contains_private_content: false}

chat_delivery_private:
  - id: pending-delivery-vault-only
    durable_state:
      contains: [delivery_id, chat_id, message_id, encrypted_payload, status]
      forbidden: [plaintext_title, plaintext_message, raw_regular_chat_key, normal_chat_ciphertext_before_client_persist]
  - id: availability-frame-content-free
    input: {delivery_status: delivery_pending, active_owner_client: true}
    expect: {frame_contains_delivery_id: true, frame_contains_private_content: false}

chat_delivery_fencing:
  - id: claims-only-pending
    input:
      deliveries:
        - {delivery_id: pending-delivery, status: delivery_pending}
        - {delivery_id: claimed-delivery, status: claimed}
        - {delivery_id: acknowledged-delivery, status: acknowledged}
    expect: {claimed_delivery_ids: [pending-delivery]}
  - id: stale-token-rejected
    input: {delivery_status: claimed, current_generation: 2, client_generation: 1, operation: persist}
    expect_error: {code: stale_or_superseded_claim, ciphertext_written: false}

chat_delivery_encrypted_persistence:
  - id: existing-chat-uses-immutable-key
    input: {delivery_kind: existing_chat, immutable_chat_key_available: true}
    expect: {new_chat_key_generated: false, encrypted_message_written: true, stable_ids_preserved: true}
  - id: new-chat-single-winner-generates-key
    input: {delivery_kind: new_chat, concurrent_owner_devices: 2}
    expect: {winning_clients: 1, generated_chat_keys: 1, duplicate_messages: 0}
