schema_version: 1
contract: feature.contracts@1

contract_boundaries:
  - id: contract-is-not-a-plan
    input: {record: feature.teams, contains: [outcome, requirements, flows, project_surface_refs]}
    expect: {tasks: absent, execution_progress: absent, check_run_logs: absent}
  - id: plan-references-contract
    input: {plan: add_team_invites, contract_requirement: teams.invites.fragment-key-web-flow}
    expect: {requirement_text_copied_into_plan: false, exact_requirement_reference_present: true}

contract_revisions:
  - id: approve-exact-revision
    input: {contract: feature.teams, revision: 4, content_hash: hash-4}
    expect: {revision_4_approved: true, editable_in_place: false}
  - id: edit-approved-contract
    input: {contract: feature.teams, approved_revision: 4, edit: add_viewer_permission}
    expect: {new_revision: 5, revision_5_state: draft, revision_4_unchanged: true}

contract_composition:
  - id: teams-ui-stays-in-teams
    input: {capability: teams, flows: [create_team, invite_member, switch_context, team_chat]}
    expect: {primary_contract: feature.teams, one_contract_per_screen: false}
  - id: shared-auth-remains-linked
    input: {capability: teams, dependency: authentication}
    expect: {linked_contract: feature.auth, copied_auth_contract: false}
  - id: split-independent-subsystem
    input: {capability: teams, subsystem: enterprise_sso, independent_release_and_approval: true}
    expect: {subcontract_allowed: true, parent_contract_link_required: true}

contract_ui_requirements:
  - id: ui-without-artboard
    input:
      rule: contracts.ui.structured-interactions
      elements: [plan_header, approve_button, undo_button]
      interactions: [edit_plan, undo_edit, approve_revision]
      states: [unchanged_draft, edited_draft, saving, approved, error]
      design_reference: omitted
    expect: {implementable_without_artboard: true, missing_design_reference_error: false}
  - id: ui-with-figma
    input: {same_requirements_as: ui-without-artboard, design_reference: 'figma://<PLACEHOLDER>/frame/<FRAME_ID>'}
    expect: {logical_requirements_unchanged: true, visual_reference_available: true}
  - id: project-surfaces-resolve-per-requirement
    input: {home_project: openmates, project_surface_ids: [rest_api, cli, sdk_npm, sdk_pip, web, apple], requirement: teams.membership.role-gated}
    expect: {surface_definitions_copied_into_contract: false, resolved_surfaces_visible_with_requirement: true, standalone_surfaces_chapter_required: false}

contract_flows:
  - id: rich-flow-with-ordinary-embeds
    input:
      flow_id: create-team
      kind: user_flow
      rich_content: [text_steps, image_embed_ref, diagram_embed_ref, text_outcome]
      checks: [team-create-web, team-create-apple]
    expect: {independent_flow_record_created: false, nested_fullscreen_available: true, share_action_available: false, referenced_embeds_open_fullscreen: true}
  - id: edge-case-reuses-flow-renderer
    input: {flow_id: max-team-limit, kind: edge_case, parent_flow_id: create-team, rich_content: [text, mind_map_embed_ref]}
    expect: {scenario_record_created: false, same_renderer_as_user_flow: true, parent_flow_visible: true}
  - id: approved-flow-pins-embedded-content
    input: {contract_revision: contract-rev-4, flow_id: create-team, referenced_embed_id: wireframe-1, referenced_embed_version: 3}
    expect: {later_embed_version_changes_contract_rev_4: false, contract_rev_4_opens_embed_version_3: true}

contract_model_placement:
  - id: global-model-used-in-several-chapters
    input: {model_definition: TeamMembership, chapters: [team_creation, invitations, roles]}
    expect: {canonical_model_definitions: 1, contextual_placements: 3, copied_model_definitions: 0}
  - id: stable-fastapi-boundary-is-model
    input: {model_kind: api_request, public_boundary: true, implementation_helper_signature: false}
    expect: {contract_model_allowed: true, private_helper_arguments_required: false}

contract_human_presentation:
  - id: readable-contract-default
    input: {contract: feature.teams, revision: 4, viewer: product_user, viewport: laptop}
    expect:
      sections: [outcome, scope_and_boundaries, custom_capability_chapters, requirements, user_flows, edge_cases, relevant_models, checks, history]
      canonical_settings_headings: true
      readable_text: true
      raw_yaml_visible_by_default: false
      diagram_source_visible_by_default: false
  - id: authorized-technical-disclosure
    input: {contract: feature.teams, revision: 4, viewer: contract_author, action: show_technical_source}
    expect: {source_available: true, default_reading_surface_replaced: false, disclosure_on_demand: true}

contract_diagrams:
  - id: architecture-selects-c4
    input: {purpose: trust_boundary, content: first_party_api_and_external_provider}
    expect: {source_format: c4_plantuml, required_fields: [title, scope, responsibilities, technologies, directional_relationships, protocols, legend]}
  - id: sequence-selects-mermaid
    input: {purpose: sequence, content: speak_assistant_message_success_failure_and_stop}
    expect: {source_format: mermaid, ordered_interactions: true, explicit_alternatives: true}
  - id: ui-flow-selects-drawio
    input: {purpose: ui_flow, states: [idle, preparing, playing, error], includes_wireframes: true}
    expect: {source_format: drawio, screen_state_metadata: true, linked_requirement_ids: [SPEAK-01, SPEAK-02, SPEAK-03, SPEAK-04]}
  - id: high-fidelity-ui-stays-linked
    input: {purpose: exact_visual_reference, source: 'figma://<PLACEHOLDER>/frame/<FRAME_ID>'}
    expect: {diagram_source_replacement: false, design_reference_linked: true}
  - id: source-matched-preview
    input: {diagram_embed: diagram-1, embed_version: 3, source_hash: hash-3, preview_source_hash: hash-3, preview_format: svg}
    expect: {inline_preview_visible: true, source_downloadable: true, approval_blocked: false}
  - id: stale-preview-is-visible
    input: {diagram_embed: diagram-1, embed_version: 4, source_hash: hash-4, preview_source_hash: hash-3}
    expect: {stale_status_visible: true, old_preview_presented_as_current: false, regenerate_action_available: true, approval_blocked: true}
  - id: edit-approved-diagram
    input: {contract_revision: 4, approval_state: approved, diagram_embed_version: 3, action: edit_diagram}
    expect: {diagram_embed_version: 4, new_contract_revision: 5, new_contract_revision_state: draft, revision_4_unchanged: true}
  - id: private-rendering-boundary
    input: {contract_visibility: private, source_format: drawio, editor: self_hosted_diagrams_net}
    expect: {public_renderer_called: false, diagrams_net_mcp_required: false, plaintext_leaves_authorized_client_or_first_party_boundary: false}

contract_project_embed:
  - id: contract-preview-in-project
    input: {project: project-1, item: feature.teams, viewport: laptop}
    expect: {preview_visible: true, title_visible: true, approval_state_visible: true, opens_fullscreen: true}
  - id: compact-contract-detail
    input: {project: project-1, item: feature.teams, viewport: phone}
    expect: {fullscreen_overlay: true, all_primary_actions_reachable: true, horizontal_overflow: false}

contract_links:
  - id: check-links-requirement-and-revision
    input: {check: teams-viewer-read-only, contract: feature.teams, revision: 4, requirement: teams.membership.role-gated}
    expect: {stale_when_requirement_changes: true, copied_requirement_text_required: false}
  - id: documentation-links-requirement
    input: {guide: teams-user-guide, requirement: teams.context.full-switch-local}
    expect: {claim_traceable: true, tutorial_prose_owned_by_contract: false}

contract_surface_parity:
  - id: same-approval-semantics
    input: {operation: approve_revision, surfaces: [rest_api, cli, sdk_npm, sdk_pip, gui_web]}
    expect: {exact_hash_required: true, stale_revision_rejected: true, visible_failure: true}
