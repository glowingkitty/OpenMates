schema_version: 1
id: feature.chats
version: 1
status: approved
title: Chats
summary: >
  OpenMates chats preserve client-side encryption boundaries, stable message
  identities, visible local message states, and cross-device completion recovery
  while synchronizing chat content across first-party clients.

scope:
  includes:
    - Authenticated saved private-chat turns submitted from web, Apple, or OpenMates CLI.
    - Client-encrypted chat metadata and message persistence.
    - WebSocket chat sync, pending assistant completion delivery, and sealed recovery job handling.
    - Stable chat, turn, message, recovery job, lease, and chat-version identities.
    - Local message status precedence for visible user gates and provisional assistant states.
    - Chat-key readiness and missing local chat-shell hydration before encrypted writes.
  excludes:
    - Anonymous or incognito chats that never enter authenticated server persistence.
    - Automatic paid inference replay after recovery job expiry.
    - Team-owned, shared, or ownership-transferred chats beyond existing private-chat semantics.
    - SDKs as user-facing cross-device recovery takeover clients.

models:
  ChatMessage:
    message_id:
      type: message_id
      required: true
      constraints: {stable_per_turn: true}
    chat_id:
      type: chat_id
      required: true
    role:
      type: enum
      values: [user, assistant, system]
    status:
      type: enum
      values: [draft, sending, streaming, processing, synced, delivered, waiting_for_user, failed]
    encrypted_content:
      type: encrypted_string
      nullable: true
      constraints: {required_for_durable_private_rows: true}
    encrypted_sender_name:
      type: encrypted_string
      nullable: true
    encrypted_category:
      type: encrypted_string
      nullable: true
    encrypted_model_name:
      type: encrypted_string
      nullable: true

  ChatPersistenceVersion:
    messages_v:
      type: integer
      required: true
      constraints: {authoritative_version_fenced: true, monotonic: true}

  ChatKeyReadiness:
    chat_shell:
      type: local_chat_record
      required: true
    user_id:
      type: user_id
      required: true
      constraints: {owner_scope: true}
    chat_key:
      type: client_secret
      required: true
      constraints: {server_plaintext: forbidden, required_before_encrypted_write: true}

  CompletionRecoveryJob:
    job_id:
      type: stable_id
      required: true
      constraints: {unique_per_turn: true}
    turn_id:
      type: stable_id
      required: true
    assistant_message_id:
      type: message_id
      required: true
    chat_key_version:
      type: integer
      required: true
    sealed_payload:
      type: encrypted_blob
      constraints: {backend_decryptable_after_erasure: false, plaintext: forbidden}
    lease_generation:
      type: integer
      required: true
      constraints: {monotonic: true, fencing_token: true}
    request_id:
      type: stable_id
      required: true
      constraints: {correlates_response_to_current_attempt: true}

  PendingCompletionDelivery:
    message_id:
      type: message_id
      required: true
    content:
      type: plaintext_transient_client_delivery
      required: true
      constraints: {durable_backend_plaintext: forbidden}
    fired_at:
      type: timestamp
      required: true

assertions:
  - id: chats.persistence.client-encrypted
    type: privacy
    must: Durable authenticated private-chat rows store client ciphertext and non-sensitive routing metadata only; backend durable stores and logs never contain plaintext private chat content, raw chat keys, master keys, recovery private keys, or unwrapped key material.
    depends_on: [models.ChatMessage, models.ChatKeyReadiness, models.CompletionRecoveryJob.sealed_payload, examples.encryption_boundary]
  - id: chats.message.identity-idempotent
    type: invariant
    must: Stable chat, turn, message, job, and version identities make chat sync, pending completion delivery, recovery persistence, retries, and duplicate clients idempotent without creating duplicate terminal messages.
    depends_on: [models.ChatMessage.message_id, models.ChatPersistenceVersion, models.CompletionRecoveryJob, examples.identity_idempotency]
  - id: chats.completion.recovery-takeover
    type: behavior
    must: Any authenticated, non-revoked, recovery-capable owner client that can unlock the chat key can claim a recovery job, decrypt the sealed payload locally, encrypt the assistant row with the chat key, persist it durably, and acknowledge exactly one terminal completion after the origin device disconnects.
    depends_on: [models.ChatKeyReadiness, models.CompletionRecoveryJob, examples.recovery_takeover]
  - id: chats.completion.lease-fenced
    type: invariant
    must: Recovery request ids, lease generations, stable message ids, and authoritative chat versions fence stale claim frames, stale persist frames, stale leases, concurrent jobs, and version conflicts; retryable jobs remain available until a current terminal acknowledgement succeeds.
    depends_on: [models.CompletionRecoveryJob, models.ChatPersistenceVersion, examples.lease_fencing]
  - id: chats.completion.pending-delivery
    type: behavior
    must: Bounded pending completion delivery may replace provisional streaming, processing, synced, or delivered assistant rows with the completed response and acknowledge completion only after the local terminal row is accepted.
    depends_on: [models.PendingCompletionDelivery, models.ChatMessage.status, examples.pending_completion]
  - id: chats.local-state.precedence
    type: behavior
    must: Incoming sync, pending completion, or recovery data must not overwrite an explicit waiting_for_user local state or silently hide a visible user gate; provisional assistant states may be replaced by terminal persisted content.
    depends_on: [models.ChatMessage.status, examples.local_state_precedence]
  - id: chats.sync.key-gated-recovery
    type: invariant
    must: A client waits for the local chat shell, owner user id, and usable chat key before claiming or persisting encrypted recovered content; early availability frames stay retryable instead of being dropped or claimed keylessly.
    depends_on: [models.ChatKeyReadiness, models.CompletionRecoveryJob, examples.key_gated_recovery]
  - id: chats.surface.semantic-parity
    type: parity
    must: Web, Apple, and CLI preserve the same encryption-boundary, identity-idempotency, recovery-takeover, lease-fencing, pending-delivery, local-state, key-gating, and visible-failure semantics; npm and pip SDKs cannot bypass server-authoritative recovery safety but are not user-facing takeover surfaces.
    depends_on: [models, examples, surfaces]

surfaces:
  rest_api:
    required: false
    role: Existing REST helpers and SDK saved-chat routes are safety-gated surfaces, not the primary first-party chat recovery client flow.
  cli:
    required: true
    parity: semantic
  sdks:
    required: false
    role: SDK saved-chat routes must not bypass chat recovery safety, but SDK takeover is outside this user-facing contract.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [encryption_boundary, identity_idempotency, recovery_takeover, lease_fencing, pending_completion, local_state_precedence, key_gated_recovery]
