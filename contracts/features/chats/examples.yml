schema_version: 1
contract: feature.chats@2

encryption_boundary:
  - id: private-chat-durable-row
    durable_state:
      contains: [chat_id, message_id, role, status, encrypted_content, encrypted_sender_name]
      forbidden: [plaintext_content, raw_chat_key, master_key, recovery_private_key, unwrapped_key_material]
  - id: sealed-recovery-job
    durable_state:
      contains: [job_id, chat_id, turn_id, assistant_message_id, chat_key_version, sealed_payload, lease_generation]
      forbidden: [plaintext_content, raw_chat_key, recovery_private_key, master_key]

identity_idempotency:
  - id: same-assistant-id-replaces-provisional
    input: {local_status: streaming, assistant_message_id: assistant-1, incoming_message_id: assistant-1}
    expect: {terminal_messages: 1, duplicate_messages: 0, final_message_id: assistant-1}
  - id: already-terminal-recovery-is-handled
    input: {recovery_job_state: TERMINAL, assistant_message_id: assistant-1}
    expect: {treated_as_handled: true, duplicate_messages: 0}

recovery_takeover:
  - id: secondary-client-persists-completion
    input: {origin_disconnected: true, eligible_secondary_device: true, chat_key_available: true}
    expect: {encrypted_assistant_rows_written: 1, terminal_acknowledgements: 1, duplicate_messages: 0}
  - id: synced-local-row-still-acks-job
    input: {local_status: synced, recovery_job_available: true, assistant_message_id: assistant-1}
    expect: {terminal_acknowledgements: 1, duplicate_messages: 0}

lease_fencing:
  - id: delayed-claim-frame-ignored
    input: {current_request_id: claim-2, delayed_request_id: claim-1, event: recovery_job_claimed}
    expect: {persist_started_from_delayed_claim: false, current_attempt_continues: true}
  - id: delayed-persist-frame-ignored
    input: {current_request_id: persist-2, delayed_request_id: persist-1, event: recovery_job_persisted}
    expect: {settled_from_delayed_persist: false, current_attempt_continues: true}
  - id: version-conflict-refreshes-and-retries
    input: {persist_result: version_conflict, authoritative_messages_v: 3}
    expect: {job_retained_for_retry: true, next_persist_uses_messages_v: 3}
  - id: independent-job-progress
    input: {jobs: [job-blocked, job-available], first_job_waiting: true}
    expect: {second_job_can_claim_and_persist: true}

pending_completion:
  - id: provisional-completion-accepted
    input: {local_status: streaming, message_id: assistant-1, pending_completion: present}
    expect: {final_status: synced, completion_ack_sent: true, duplicate_messages: 0}
  - id: already-delivered-completion-reconciled
    input: {local_status: delivered, message_id: assistant-1, pending_completion: present}
    expect: {final_status: synced, completion_ack_sent: true, duplicate_messages: 0}

local_state_precedence:
  - id: waiting-for-user-preserved
    input: {local_status: waiting_for_user, message_id: assistant-1, incoming_completion: present}
    expect: {row_replaced: false, completion_ack_sent: false, visible_user_gate_preserved: true}
  - id: provisional-state-can-complete
    input: {local_status: processing, message_id: assistant-1, incoming_completion: present}
    expect: {row_replaced: true, final_status: synced}

key_gated_recovery:
  - id: wait-for-chat-shell-and-key
    input: {recovery_job_available: true, chat_shell_present: false, chat_key_available: false}
    expect: {claim_sent_before_ready: false, job_retryable: true}
  - id: hydrate-owner-before-claim
    input: {recovery_job_available: true, chat_shell_user_id_missing: true, chat_key_available: true}
    expect: {owner_hydrated_before_claim: true, claim_sent_after_ready: true}
  - id: cold-boot-initial-sync-wins-readiness
    input: {recovery_job_available_early: true, initial_sync_complete: false}
    expect: {job_dropped: false, claim_sent_after_sync_ready: true}

conversation_fork:
  - id: fork-through-first-assistant-message
    input: {source_messages: [user-1, assistant-1, user-2, assistant-2], boundary_message_id: assistant-1}
    expect: {fork_messages: [user-1, assistant-1], source_messages_unchanged: true, active_chat_replaced_automatically: false, open_action_available: true}
