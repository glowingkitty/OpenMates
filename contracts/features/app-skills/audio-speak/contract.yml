schema_version: 1
id: feature.app-skill.audio-speak
version: 1
status: approved
title: Audio Speak Text To Speech
summary: >
  Convert user-supplied text into short speech audio using stable OpenMates voice
  presets, with safe provider-backed billing and playable generated-audio output
  across OpenMates platforms.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
    - Explicit user-invoked text-to-speech generation
    - OpenMates voice preset, accent, and style fields mapped internally to provider voice IDs
    - Low-cost default and premium high-quality ElevenLabs text-to-speech model selection
    - Direct synchronous responses only when live provider latency remains suitable
    - Playable generated-audio app-skill embeds with binary fields excluded from model inference
  excludes:
    - Automatic assistant voice replies or chat-wide voice playback settings
    - Voice cloning, user-uploaded voice samples, or raw provider voice IDs
    - Impersonating real people, public figures, living artists, or private individuals
    - Long-form narration, podcasts, audio books, or streaming TTS
    - Unauthenticated or public anonymous speech generation

models:
  AudioSpeakRequest:
    requests:
      type: array
      required: true
      items: AudioSpeakRequestItem
      constraints: {min_items: 1, max_items: 3}

  AudioSpeakRequestItem:
    id:
      type: string_or_integer
      nullable: true
      constraints: {auto_generate_when_missing: sequential_integer}
    text:
      type: string
      required: true
      constraints: {trim: true, blank: false, min_length: 1, max_length: 2000}
    provider:
      type: enum
      default: elevenlabs
      values: [elevenlabs]
      constraints: {future_expandable_provider_selection: true}
    voice:
      type: enum
      default: warm_neutral
      values: [warm_neutral, bright_neutral, calm_narrator]
      constraints: {raw_provider_voice_id: forbidden}
    accent:
      type: enum
      default: en_us
      values: [en_us, en_gb, de_de, es_es, fr_fr]
    style:
      type: enum
      default: natural
      values: [natural, calm, friendly, energetic]
    speed:
      type: number
      default: 1.0
      constraints: {minimum: 0.7, maximum: 1.2}
    output_format:
      type: enum
      default: mp3_44100_128
      values: [mp3_22050_32, mp3_24000_48, mp3_44100_32, mp3_44100_64, mp3_44100_96, mp3_44100_128, mp3_44100_192]
    model:
      type: enum
      default: eleven_flash_v2_5
      values: [eleven_flash_v2_5, eleven_multilingual_v2]

  AudioSpeakResult:
    id:
      type: string_or_integer
      required: true
    status:
      type: enum
      required: true
      values: [finished, error]
    text_preview:
      type: string
      required: true
      constraints: {max_length: 160}
    generation_type:
      type: enum
      required: true
      values: [speech]
    voice:
      type: string
      required: true
      constraints: {openmates_preset: true}
    accent:
      type: string
      required: true
    style:
      type: string
      required: true
    provider:
      type: string
      required: true
      default: ElevenLabs
    model:
      type: string
      required: true
    mime_type:
      type: string
      required: true
      constraints: {audio_only: true}
    duration_seconds:
      type: number
      nullable: true
      constraints: {maximum: 90.0}
    byte_length:
      type: integer
      required: true
      constraints: {minimum: 1}
    audio_base64:
      type: string
      nullable: true
      constraints: {direct_response_only: true, exclude_from_llm_inference: true}
    files:
      type: object
      nullable: true
      constraints: {encrypted_generated_asset_metadata_when_persisted: true}
    s3_base_url:
      type: string
      nullable: true
      constraints: {required_when_files_present: true}
    aes_key:
      type: string
      nullable: true
      constraints: {required_when_files_present: true, exclude_from_llm_inference: true}
    aes_nonce:
      type: string
      nullable: true
      constraints: {required_when_files_present: true, exclude_from_llm_inference: true}
    vault_wrapped_aes_key:
      type: string
      nullable: true
      constraints: {required_when_files_present: true, exclude_from_llm_inference: true}
    credits_charged:
      type: integer
      nullable: true
      constraints: {minimum: 1}
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}

  AudioSpeakResponse:
    results:
      type: array
      required: true
      items: AudioSpeakResult
      constraints: {min_items: 0, max_items: 3, unique_by: id}
    provider:
      type: string
      required: true
      default: ElevenLabs
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}
    ignore_fields_for_inference:
      type: array
      required: true
      items: string
      constraints: {must_include: [audio_base64, aes_key, aes_nonce, vault_wrapped_aes_key]}

assertions:
  - id: audio-speak.request.validated
    type: validation
    must: Invalid request shape, blank text, excessive batch size, text above 2000 characters, unsupported provider, unsupported preset/accent/style, raw provider voice ID, or unsupported output format is rejected before provider execution.
    depends_on: [models.AudioSpeakRequest, models.AudioSpeakRequestItem, examples.invalid_inputs, examples.boundary_cases]
  - id: audio-speak.provider.explicit-selection
    type: invariant
    must: The request contract includes an explicit provider enum, defaulting to elevenlabs in v1, so future providers can extend the enum without changing the skill surface shape.
    depends_on: [models.AudioSpeakRequestItem.provider, examples.valid_inputs, examples.invalid_inputs]
  - id: audio-speak.request.ids-correlated
    type: invariant
    must: Each result preserves its caller ID or receives a unique sequential ID when none was supplied.
    depends_on: [models.AudioSpeakRequestItem.id, models.AudioSpeakResult.id, examples.valid_inputs]
  - id: audio-speak.voice.presets-only
    type: security
    must: Public REST, CLI, SDK, and GUI inputs accept only OpenMates voice presets, accents, and styles; raw ElevenLabs voice IDs never appear in public request contracts.
    depends_on: [models.AudioSpeakRequestItem.voice, examples.invalid_inputs]
  - id: audio-speak.safety.blocks-impersonation
    type: security
    must: Requests to imitate, clone, or sound like a real person, public figure, living artist, or private individual are rejected before provider execution.
    depends_on: [models.AudioSpeakRequestItem.voice, examples.safety_rejections]
  - id: audio-speak.safety.semantic-safeguard-required
    type: security
    must: Every valid text-to-speech request is classified before provider execution by deterministic rules first and then by the Groq-hosted openai/gpt-oss-safeguard-20b model using an OpenMates optimized audio-speech safety prompt. The safeguard returns an explicit approve or reject decision and hard-blocks malicious speech, fraud, impersonation, coercion, credential-harvesting, and deceptive synthetic-audio intent; safe deterministic allowlists do not bypass the semantic safeguard.
    depends_on: [models.AudioSpeakRequestItem.text, models.AudioSpeakRequestItem.voice, examples.safety_rejections, examples.boundary_cases]
  - id: audio-speak.safety.provider-call-after-approval
    type: security
    must: ElevenLabs speech generation starts only after the GPT OSS safeguard approves the request; rejected or safeguard-error requests produce a visible safe error, call no speech provider, and charge no generation credits.
    depends_on: [models.AudioSpeakRequestItem.text, models.AudioSpeakResult.credits_charged, examples.safety_rejections, examples.error_outputs]
  - id: audio-speak.safety.minimal-classifier-payload
    type: privacy
    must: The semantic safeguard receives only the minimal request text and safety context needed for classification, never audio bytes, provider credentials, encryption material, raw provider diagnostics, or unrelated chat state.
    depends_on: [models.AudioSpeakRequestItem.text, examples.successful_outputs, examples.error_outputs]
  - id: audio-speak.output.playable-audio
    type: behavior
    must: Successful outputs expose audio/mpeg-compatible playable speech through direct responses and generated-audio embeds without requiring provider credentials on clients.
    depends_on: [models.AudioSpeakResult, examples.successful_outputs]
  - id: audio-speak.output.binary-excluded-from-inference
    type: privacy
    must: Audio bytes, safeguard reasoning, full source text when not needed for assistant reasoning, encryption keys, nonces, wrapped keys, and raw provider diagnostics are excluded from LLM inference, logs, committed examples, and assistant prose.
    depends_on: [models.AudioSpeakResponse.ignore_fields_for_inference, examples.successful_outputs, examples.error_outputs]
  - id: audio-speak.billing.success-only
    type: invariant
    must: Credits are charged only for successful generated speech, using result-declared duration billing at 2 OpenMates credits per Flash/Turbo second or 4 OpenMates credits per Multilingual v2/v3 second with a one-credit successful-output floor and idempotent billing.
    depends_on: [models.AudioSpeakResult.credits_charged, examples.successful_outputs, examples.error_outputs]
  - id: audio-speak.provider-error.visible
    type: failure
    must: Provider key, timeout, quota, voice mapping, and generation failures produce safe visible errors and are never represented as successful empty audio.
    depends_on: [models.AudioSpeakResponse.error, examples.error_outputs]
  - id: audio-speak.latency.direct-suitable
    type: invariant
    must: Direct synchronous execution remains enabled only when low-cost live probes show representative short speech requests complete within the 5-6 second target; otherwise the implementation must switch to a task-based generated-asset flow before release.
    depends_on: [examples.boundary_cases]
  - id: audio-speak.surface-parity
    type: parity
    must: REST API, CLI, npm/pip SDKs, web embed rendering, and Apple rendering preserve the same request, response, safety, billing, privacy, and error semantics or record explicit approved exceptions.
    depends_on: [models, examples, surfaces]

surfaces:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [valid_inputs, invalid_inputs, successful_outputs, error_outputs, boundary_cases, safety_rejections]
