schema_version: 1
contract: feature.plans@1

plan_private_content:
  - id: durable-plan-row-ciphertext-only
    input: {title: Launch website, goal: Ship public site, primary_chat_id: chat-1}
    durable_state:
      contains: [plan_id, status, version, hashed_primary_chat_id, encrypted_title, encrypted_goal]
      forbidden: [title, goal, plaintext_scope, raw_plan_key]
  - id: encrypted-child-records
    durable_state:
      contains: [criterion_id, verification_id, learning_id, encrypted_text, encrypted_command, encrypted_task_draft]
      forbidden: [criterion_text, command_text, learning_title, task_draft_plaintext]
  - id: verification-run-output-encrypted
    durable_state:
      contains: [run_id, runner_kind, status, encrypted_stdout, encrypted_environment]
      forbidden: [stdout_plaintext, environment_plaintext, private_artifact_url]

plan_lifecycle:
  - id: active-requires-primary-chat
    input: {status: active, primary_chat_id: null}
    expect_error: {code: active_plan_requires_primary_chat, plan_status_changed: false}
  - id: stale-version-rejected
    input: {stored_version: 3, patch_version: 2, operation: update}
    expect_error: {code: plan_version_conflict, overwritten: false}
  - id: completion-returns-blockers
    input: {status: running_checks, required_check_status: pending, operation: complete}
    expect: {completed: false, blocked_by: [{kind: verification, status: pending}]}
  - id: owner-scoped-rest-detail
    input: {operation: get_detail, plan_id: plan-1, actor_user_id: user-1, owner_user_id: user-1}
    expect: {response_shape: {plan: encrypted_plan_record}, plaintext_private_content: false}
  - id: cross-owner-rest-detail-hidden
    input: {operation: get_detail, plan_id: plan-1, actor_user_id: user-2, owner_user_id: user-1}
    expect_error: {http_status: 404, private_metadata_leaked: false}
  - id: public-start-resume-facades
    input: {facade: start_then_resume, initial_status: active}
    expect: {start_status: executing, resume_status: active, stable_plan_id: true}

plan_context_wrappers:
  - id: create-with-chat-and-project-wrappers
    input: {primary_chat_id: chat-1, linked_project_ids: [project-1]}
    expect:
      wrapper_types: [master, chat, project]
      wrapper_hashes_match_context: true
      raw_plan_key_persisted: false
  - id: replacement-adds-before-delete
    input: {operation: relink_project, old_project_id: project-1, new_project_id: project-2}
    expect: {new_project_wrapper_created_before_old_deleted: true, old_access_removed_after_update: true}
  - id: team-wrapper-requires-epoch
    input: {key_type: team, hashed_team_id: team-hash, team_key_epoch: null}
    expect_error: {code: invalid_team_wrapper, wrapper_created: false}

plan_project_links:
  - id: project-link-metadata-boundary
    input: {linked_project_ids: [project-1], encrypted_linked_project_ids: cipher-projects}
    durable_state:
      contains: [linked_project_hashes, encrypted_linked_project_ids]
      forbidden: [linked_project_ids, project_title, project_plaintext]
  - id: relink-requires-encrypted-list-and-wrappers
    input: {operation: update, linked_project_ids: [project-2], encrypted_linked_project_ids: null, key_wrappers: [master]}
    expect_error: {code: invalid_project_relink, project_hashes_changed: false, wrappers_replaced: false}

plan_completion_gates:
  - id: uncovered-criterion-blocks-completion
    input: {criterion_status: satisfied, coverage_status: uncovered, operation: complete}
    expect: {completed: false, blocked_by: [{kind: criterion_coverage, status: uncovered}]}
  - id: required-assumption-blocks-implementation
    input: {required_before: implementation, assumption_status: unchecked}
    expect: {implementation_allowed: false, blocker_kind: assumption}
  - id: reference-pattern-must-be-inspected-or-matched
    input: {required_before: completion, pattern_status: drift_detected}
    expect: {completed: false, blocker_kind: reference_pattern}
  - id: failed-check-loops-back-to-blocked
    input: {plan_status: running_checks, required_check_status: failed}
    expect: {plan_status: blocked, continuation_state: blocked}
  - id: learnings-count-gate-and-provenance
    input: {finalized_learning_count: 0, operation: complete}
    expect: {completed: false, blocker_kind: missing_learnings, create_tasks_preserves_source_learning_id: true}

plan_active_context:
  - id: save-context-vault-only
    input: {primary_chat_id: chat-1, vault_encrypted_context: vault-cipher}
    durable_state:
      contains: [plan_id, hashed_user_id, hashed_primary_chat_id, expires_at, vault_encrypted_context]
      forbidden: [plaintext_context, encrypted_title_decrypted_by_backend]
  - id: missing-active-context-visible-blocker
    input: {chat_id: chat-1, active_context_row: null}
    expect: {active_plan: null, blocker: {kind: execution_context, status: missing_or_expired}}

plan_surface_parity:
  - id: cli-sdk-local-decrypt-output
    surfaces: [cli, sdks.npm, sdks.pip]
    input: {operation: list_create_update_complete_and_children, private_text: Plain AC}
    expect: {request_payload_contains_plaintext_private_text: false, public_result_decrypts_locally: true}
  - id: web-board-and-detail-use-same-records
    surfaces: [gui.web]
    input: {statuses: [draft, active, executing, blocked, completed, archived]}
    expect: {done_column_contains_completed: true, archived_hidden_by_default: true, endpoint_semantics_unchanged: true}
