schema_version: 1
id: feature.plans
version: 1
status: draft
title: Plans
summary: >
  OpenMates Plans persist encrypted multi-step user goals with explicit lifecycle
  state, contextual key wrappers, Project/chat links, verification gates,
  active-plan context, and CLI/SDK/web semantic parity.

scope:
  includes:
    - Authenticated /v1/user-plans list, get/detail, create, update, activate, complete, active-context, execution-context, key-wrapper, criteria, verification, assumption, reference-pattern, learning, and evidence routes.
    - CLI and SDK plan facades for list, show, create, edit/update, attach, start, resume, complete, ask, Success Criteria, Checks, assumptions, reference patterns, learnings, and Project link helpers.
    - Client-encrypted durable Plan titles, goals, scope, focus, questions, criteria, assumptions, reference patterns, learnings, evidence, run details, and private metadata.
    - Primary-chat, linked-Project, and owner/master key-wrapper semantics for per-plan keys, plus implemented plan/team wrapper context fields where used.
    - Short-lived Vault-encrypted active-plan execution context and missing-context blockers for assistant continuation.
    - Web, chat, and Project plan surfaces that render and mutate the same encrypted records.
  excludes:
    - Task execution scheduling beyond Plan-created task references and verification task records.
    - Project CRUD outside Plan-to-Project linking, filtering, and wrapper replacement.
    - GUI layout, visual design, and board geometry details for /plans.
    - Durable public share grants or server-readable share wrappers; share decrypt authority stays URL-fragment scoped.
    - Server-side decryption, full-text search, or plaintext indexing of private Plan content.

models:
  PlanRecord:
    plan_id:
      type: stable_id
      required: true
    status:
      type: enum
      values: [draft, checking_assumptions, awaiting_confirmation, active, executing, running_checks, blocked, completed, archived]
      required: true
    version:
      type: integer
      required: true
      constraints: {monotonic_server_authoritative: true, conflict_checked: true}
    primary_chat_id:
      type: chat_id
      nullable: true
      constraints: {required_for_active_or_executable: true}
    linked_project_hashes:
      type: hashed_id_list
      nullable: true

  PlanPrivateContent:
    encrypted_title:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    encrypted_goal:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    encrypted_scope_in:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_user_flows:
      type: encrypted_json_array
      nullable: true
      constraints: {flow_shape: "flow_id,title,actor?,steps[step_id,text,references?],expected_outcome,linked_task_ids?,linked_criterion_ids?", plaintext: forbidden}
    encrypted_open_questions:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_assumptions:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_reference_patterns:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}

  PlanProjectLink:
    linked_project_ids:
      type: request_only_raw_ids
      nullable: true
      constraints: {durable_plaintext: forbidden}
    encrypted_linked_project_ids:
      type: encrypted_string
      nullable: true
      constraints: {owner_decryptable_raw_ids: true}
    linked_project_hashes:
      type: hashed_id_list
      nullable: true
      constraints: {filter_metadata_only: true}

  PlanKeyWrapper:
    key_type:
      type: enum
      values: [master, chat, project, plan, team]
      required: true
    encrypted_plan_key:
      type: wrapped_content_key
      required: true
      constraints: {raw_key: forbidden}
    hashed_plan_id:
      type: hashed_id
      required: true
    hashed_chat_id:
      type: hashed_id
      nullable: true
    hashed_project_id:
      type: hashed_id
      nullable: true
    hashed_context_plan_id:
      type: hashed_id
      nullable: true
    hashed_team_id:
      type: hashed_id
      nullable: true
    team_key_epoch:
      type: integer
      nullable: true
      constraints: {required_when_key_type_team: true}

  PlanCriterion:
    criterion_id:
      type: stable_id
      required: true
    encrypted_text:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    status:
      type: enum
      values: [pending, satisfied, failed, waived]
    coverage_status:
      type: enum
      values: [uncovered, covered, ambiguous, blocked, waived]
    verification_ids:
      type: stable_id_list
      nullable: true

  PlanVerification:
    verification_id:
      type: stable_id
      required: true
    kind:
      type: enum_or_string
      constraints: {supports_ai_manual_deterministic_and_runner_checks: true}
    status:
      type: enum
      values: [proposed, pending, passed, failed, passed_unexpectedly, skipped, skipped_with_reason, not_applicable, waived]
    required_for_done:
      type: boolean
      default: true
    linked_task_id:
      type: stable_id
      nullable: true
    linked_sub_chat_id:
      type: chat_id
      nullable: true
    encrypted_command:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_result_summary:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}

  PlanVerificationRun:
    run_id:
      type: stable_id
      required: true
    runner_kind:
      type: string
      required: true
    status:
      type: enum_or_string
      required: true
    encrypted_stdout:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_environment:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}

  PlanExecutionContext:
    vault_encrypted_context:
      type: vault_ciphertext
      required: true
      constraints: {durable_directus_plaintext: forbidden}
    hashed_primary_chat_id:
      type: hashed_id
      required: true
    expires_at:
      type: timestamp
      required: true

  PlanLearning:
    learning_id:
      type: stable_id
      required: true
    type:
      type: enum
      values: [workflow_improvement, agent_instruction_improvement]
    status:
      type: enum
      values: [draft, proposed, accepted, applied, rejected, duplicate, merged]
    encrypted_title:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    encrypted_task_draft:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden, one_suggested_task_draft: true}

assertions:
  - id: plans.content.client-encrypted
    type: privacy
    must: >
      Durable Plan rows and child records store private titles, goals, scope,
      focus, questions, criteria, assumptions, reference patterns, learnings,
      evidence, run output, and private metadata only as client ciphertext or
      Vault ciphertext; server-visible fields stay limited to safe IDs, hashes,
      status, routing, coverage, version, and timestamps.
    depends_on: [models.PlanPrivateContent, models.PlanCriterion.encrypted_text, models.PlanVerification, models.PlanVerificationRun, models.PlanLearning, examples.plan_private_content]
  - id: plans.lifecycle.visible
    type: behavior
    must: >
      Plan list, owner-scoped REST get/detail, show/detail facades, create, update, activate/attach, start,
      resume, complete, and active-context flows preserve stable IDs, explicit
      lifecycle state, primary-chat requirements for active/executable Plans,
      visible completion blockers, and optimistic version conflict metadata.
    depends_on: [models.PlanRecord, examples.plan_lifecycle]
  - id: plans.key-wrappers.contextual
    type: invariant
    must: >
      A per-plan key is wrapped for exactly the valid owner/context set: master
      is required; primary-chat and linked-Project wrappers match hashed context
      metadata; plan/team wrappers follow the unified wrapper rules when used;
      replacement wrappers are created and validated before obsolete wrappers
      are deleted; raw keys and durable share wrappers are forbidden.
    depends_on: [models.PlanKeyWrapper, examples.plan_context_wrappers]
  - id: plans.project-links.encrypted
    type: privacy
    must: >
      Project link mutations treat raw linked_project_ids as request-only input,
      persist linked_project_hashes for filtering, persist
      encrypted_linked_project_ids for owner-side client use, and replace
      Project Plan wrappers in the same accepted mutation.
    depends_on: [models.PlanProjectLink, models.PlanKeyWrapper, examples.plan_project_links]
  - id: plans.execution.gates-evidence
    type: invariant
    must: >
      Required criteria coverage, required checks/evidence, required
      assumptions, required reference patterns, and 1-5 finalized learnings gate
      implementation and completion; failed required checks move the Plan back
      to a visible blocked/work loop; verification task, AI-evaluator, run,
      artifact, and learning-task provenance stays explicit.
    depends_on: [models.PlanCriterion, models.PlanVerification, models.PlanVerificationRun, models.PlanLearning, examples.plan_completion_gates]
  - id: plans.dependencies.done-only
    type: invariant
    must: Mixed Plan/Task blocked_by edges are owner- and shared-Project-scoped, reject self, duplicate, and cyclic edges, and satisfy only when their target is done or completed.
    depends_on: [models.PlanRecord]
  - id: plans.assumptions.investigated-before-work
    type: security
    must: Confirmed or corrected required assumptions include encrypted typed source/evidence proofs before dependent work can proceed.
    depends_on: [models.PlanPrivateContent]
  - id: plans.approval.human-web-revision-bound
    type: security
    must: Immutable encrypted Plan revisions are approved only through an authenticated trusted browser session, and material edits invalidate approval.
    depends_on: [models.PlanRecord]
  - id: plans.active-context.vault-boundary
    type: privacy
    must: >
      Active assistant context for a primary-chat Plan comes from short-lived
      Vault-encrypted execution context or fresh client-supplied context, never
      backend decryption of durable Directus Plan fields; missing or expired
      context returns a visible blocker instead of fabricated Plan state.
    depends_on: [models.PlanExecutionContext, examples.plan_active_context]
  - id: plans.surface.semantic-parity
    type: parity
    must: >
      REST, CLI, npm SDK, pip SDK, and web preserve the same encrypted-content,
      lifecycle, key-wrapper, Project-link, completion-gate, evidence,
      active-context, and learning-provenance semantics where each surface
      implements Plans.
    depends_on: [models, examples, surfaces]

surfaces:
  rest_api:
    required: true
    role: Authenticated /v1/user-plans routes own persistence, owner-scoped detail lookup, lifecycle, child records, active context, and authorization boundaries without plaintext private content.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [plan_private_content, plan_lifecycle, plan_context_wrappers, plan_project_links, plan_completion_gates, plan_active_context, plan_surface_parity]
