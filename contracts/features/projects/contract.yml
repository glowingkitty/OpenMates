schema_version: 1
id: feature.projects
version: 1
status: draft
title: Projects
summary: >
  Authenticated OpenMates Projects group encrypted workspace metadata and links
  to OpenMates-owned objects in an explicit Personal or Team context while
  keeping Project keys and item metadata client-side encrypted.

scope:
  includes:
    - Authenticated Project create, list, show, update, archive, unarchive, delete, history, restore, and ask-apply semantics.
    - Explicit Personal or Team Project context selection, Team role gates, and exact confirmation for destructive Project mutations.
    - Project key wrappers for Personal master-key wrapping and Team-key wrapping scoped by hashed Team id plus team key epoch.
    - Project folders, Project item links for chats/workflows/embeds/uploads, and encrypted task/plan Project associations.
    - Project-key-encrypted item metadata, target ids, folder labels, settings, and client-side helper plaintext outputs.
    - REST, CLI, npm SDK, pip SDK, and web semantic parity where those surfaces implement Projects.
  excludes:
    - Remote-access source registration, live filesystem bridge requests, foreground bridge lifecycle, and remote file previews.
    - GUI layout, visual design, drag-and-drop behavior, and platform-specific Project page presentation.
    - Future storage migrations after the unified key-wrapper migration is complete.
    - Public developer APIs for raw Project ciphertext, raw Project keys, source files, or server-side plaintext Project search.

models:
  ProjectRecord:
    project_id:
      type: stable_id
      required: true
    owner_context:
      type: enum
      values: [personal, team]
      required: true
      constraints: {exactly_one_of_hashed_user_or_team: true}
    encrypted_project_key:
      type: wrapped_object_key
      nullable: true
      constraints: {migration_only_master_wrapper: true, plaintext_project_key: forbidden}
    encrypted_name:
      type: project_ciphertext
      required: true
      constraints: {plaintext_private_content: forbidden}
    archived:
      type: boolean
      default: false
    version:
      type: integer
      required: true
      constraints: {monotonic_on_update: true}

  ProjectKeyWrapper:
    hashed_project_id:
      type: sha256_hex
      required: true
    key_type:
      type: enum
      values: [master, chat, project, plan, team]
      required: true
    hashed_team_id:
      type: sha256_hex
      nullable: true
      constraints: {required_when_key_type_team: true}
    team_key_epoch:
      type: integer
      nullable: true
      constraints: {required_when_key_type_team: true, minimum: 1}
    encrypted_project_key:
      type: wrapped_object_key
      required: true
      constraints: {plaintext_project_key: forbidden}
    wrapper_version:
      type: integer
      default: 1

  ProjectItemLink:
    project_item_id:
      type: stable_id
      required: true
    item_type:
      type: enum
      values: [embed, chat, upload, workflow]
      required: true
    target_id_hash:
      type: sha256_hex
      required: true
    target_id_encrypted:
      type: project_ciphertext
      required: true
      constraints: {plaintext_target_id: forbidden}
    encrypted_metadata:
      type: project_ciphertext
      nullable: true
      constraints: {remote_source_creation: forbidden, plaintext_private_content: forbidden}
    attached_by_user_hash:
      type: sha256_hex
      nullable: true

  ProjectObjectAssociation:
    object_type:
      type: enum
      values: [task, plan]
      required: true
    linked_project_hashes:
      type: json_array
      nullable: true
      constraints: {contains_only_hashed_project_ids: true}
    encrypted_linked_project_ids:
      type: project_or_object_ciphertext
      nullable: true
      constraints: {raw_project_ids_client_encrypted: true}
    project_key_wrapper:
      type: wrapped_object_key
      nullable: true
      constraints: {required_for_project_decrypt_context_when_linked: true}

  ProjectUploadEmbed:
    embed_id:
      type: stable_id
      required: true
    encrypted_content:
      type: embed_ciphertext
      required: true
      constraints: {plaintext_upload_content: forbidden}
    embed_key_wrappers:
      type: collection
      required: true
      constraints: {requires_master_and_project_wrappers: true}
    project_item_link:
      type: ProjectItemLink
      required: true

assertions:
  - id: projects.access.explicit-context
    type: security
    must: Project operations resolve to exactly one authenticated Personal or Team context; SDK helpers and live file requests require caller-selected context, and ambiguous Personal/Team selection, unknown Team, or insufficient Team role fails closed before returning Project rows, wrappers, or item metadata.
    depends_on: [models.ProjectRecord.owner_context, examples.project_contexts, surfaces]
  - id: projects.lifecycle.encrypted-crud
    type: behavior
    must: Project create, list, show, update, archive, unarchive, delete, history, restore, and ask-apply preserve client-encrypted Project fields, advance server-visible versions on accepted updates, and require exact confirmation for destructive mutations.
    depends_on: [models.ProjectRecord, examples.project_contexts]
  - id: projects.keys.client-wrapped
    type: privacy
    must: Project keys remain client-side encrypted using a master wrapper for Personal Projects and Team wrapper rows for Team Projects; Team wrappers are scoped by hashed Team id plus key epoch, and REST, CLI, SDK, and web helpers never expose plaintext Project keys.
    depends_on: [models.ProjectKeyWrapper, examples.project_key_wrappers, surfaces]
  - id: projects.links.openmates-only-encrypted
    type: privacy
    must: >
      Project links store only OpenMates-owned object associations: chat, embed,
      upload, and workflow links use Project item rows with hashed target ids plus
      Project-key-encrypted ids and metadata, while task and plan associations
      keep encrypted linked Project ids and Project-scoped key wrappers on their
      own records; none of these helpers create remote-access source rows or
      remote-copy proposals.
    depends_on: [models.ProjectItemLink, models.ProjectObjectAssociation, examples.project_item_links]
  - id: projects.association.safe-metadata-encrypted-authority
    type: invariant
    must: Plan and Task Project associations expose only hashed Project routing metadata to the server while encrypted linked Project ids and Project-scoped key wrappers remain the client-authoritative private association data.
    depends_on: [models.ProjectObjectAssociation, examples.project_item_links]
  - id: projects.uploads.project-wrapped
    type: privacy
    must: Files imported into a Project are represented as client-encrypted embeds with both master and Project embed-key wrappers before the Project item link is accepted, and the Project item itself stores only encrypted display metadata and hashed target ids.
    depends_on: [models.ProjectUploadEmbed, examples.project_item_links]
  - id: projects.surface.semantic-parity
    type: parity
    must: REST, CLI, npm SDK, pip SDK, and web preserve the same explicit-context, encrypted CRUD, Project-key wrapper, plaintext-helper, destructive-confirmation, and OpenMates-only item-link semantics where that surface implements Projects; remote filesystem bridge helpers remain intentionally outside SDK Project CRUD/link parity.
    depends_on: [models, examples, surfaces]

surfaces:
  rest_api:
    required: true
    role: Authenticated first-party or approved SDK/CLI Project routes own canonical storage, owner/team authorization, encrypted item links, wrapper rows, history, and destructive confirmations.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false}
    exceptions:
      - id: apple-projects-not-launch-gated
        implementation: apple
        reason: Current verified Project CRUD/link implementation and tests are REST, CLI, npm SDK, pip SDK, and web; Apple parity is deferred unless native Project code is explicitly touched.
        equivalent_outcome: Apple must follow the same encrypted Project and wrapper contract when native Project CRUD/link surfaces are implemented.

examples:
  file: examples.yml
  required_groups: [project_contexts, project_key_wrappers, project_item_links]
