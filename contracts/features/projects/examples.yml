schema_version: 1
contract: feature.projects@1

project_contexts:
  - id: personal-list-requires-personal-context
    input: {operation: list, personal: true, team_id: null}
    expect: {owner_filter: hashed_user_id, hashed_team_id_null: true, project_rows_returned: true}
  - id: team-list-requires-team-context
    input: {operation: list, personal: false, team_id: team-1, requester_role: member}
    expect: {owner_filter: hashed_team_id, mutation_permissions_include_manage_own_items: true, delete_allowed: false}
  - id: ambiguous-context-rejected
    input: {operation: list, personal: false, team_id: null}
    expect_error: {code: explicit_context_required, rows_returned: false, wrappers_returned: false}
  - id: delete-requires-exact-project-confirmation
    input: {operation: delete, project_id: project-1, confirmation_project_id: project-2}
    expect_error: {code: confirmation_mismatch, deleted: false}

project_key_wrappers:
  - id: personal-master-wrapper
    durable_state:
      contains: [project_id, encrypted_project_key, encrypted_name]
      forbidden: [plaintext_project_key, plaintext_name]
    expect: {client_unwraps_with_master_key: true, api_returns_plaintext_project_key: false}
  - id: team-wrapper-scoped-by-hash-and-epoch
    input: {team_id: team-1, key_type: team, team_key_epoch: 1}
    durable_state:
      contains: [hashed_project_id, hashed_team_id, team_key_epoch, encrypted_project_key]
      forbidden: [raw_team_id, plaintext_project_key]
    expect: {hashed_team_id_matches_team: true, team_epoch_required: true}
  - id: mismatched-team-wrapper-rejected
    input: {team_id: team-1, wrapper_hashed_team_id: hash-of-team-2, team_key_epoch: 1}
    expect_error: {code: team_project_key_wrapper_required, project_created: false}

project_item_links:
  - id: chat-link-is-openmates-only
    input: {item_type: chat, target_id: chat-1, source: sdk_add_to_project}
    durable_state:
      contains: [project_item_id, target_id_hash, target_id_encrypted, encrypted_metadata]
      forbidden: [plaintext_target_id, remote_source_id, remote_copy_proposal]
    expect: {metadata_storage: save_only_in_openmates, source_rows_created: 0}
  - id: workflow-link-is-openmates-only
    input: {item_type: workflow, target_id: workflow-1, source: sdk_add_to_project}
    expect: {project_item_created: true, source_rows_created: 0, remote_copy_proposal: false}
  - id: task-project-association-stays-on-task-record
    input: {object_type: task, linked_project_ids: [project-1]}
    durable_state:
      contains: [linked_project_hashes, encrypted_linked_project_ids, project_key_wrapper]
      forbidden: [project_items_task_row, remote_source_id, plaintext_task_title]
  - id: plan-project-association-stays-on-plan-record
    input: {object_type: plan, linked_project_ids: [project-1]}
    durable_state:
      contains: [linked_project_hashes, encrypted_linked_project_ids, project_key_wrapper]
      forbidden: [project_items_plan_row, remote_source_id, plaintext_plan_goal]
  - id: upload-embed-requires-master-and-project-wrappers
    input: {operation: upload_embed, embed_id: embed-1, project_id: project-1}
    durable_state:
      contains: [encrypted_content, master_embed_key_wrapper, project_embed_key_wrapper, target_id_hash, target_id_encrypted]
      forbidden: [plaintext_embed_key, plaintext_upload_content]
