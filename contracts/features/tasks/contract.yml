schema_version: 1
id: feature.tasks
version: 1
status: approved
title: Tasks
summary: >
  OpenMates Tasks are authenticated, user-owned work items with client-encrypted
  private content, fixed lifecycle and queue metadata, project/chat/plan routing
  metadata, read-only Workflow projections, and semantic REST, CLI, npm SDK, and
  pip SDK task-management parity where each surface is implemented.

scope:
  includes:
    - Authenticated /v1/user-tasks create, list, show-through-list/short-id resolution, update, reorder, block, unblock, skip, complete, delete, start-ai, ask, history, restore, extraction, and key-wrapper routes.
    - Durable user_tasks rows, user_task_activity rows, user_task_key_wrappers, short-lived user_task_execution_contexts, task history change sets, and encrypted share-bundle task records.
    - Fixed task statuses backlog, todo, in_progress, blocked, and done plus queue_state, ai_execution_state, blocked_reason_code, due_at, priority, position, and version metadata.
    - Client-encrypted titles, descriptions, labels/tags, activity summaries, latest instructions, linked Project id lists, and per-task key material.
    - Server-visible safe routing and filter metadata, including primary_chat_id, hashed_primary_chat_id, linked_project_hashes, plan_id, task_type, verification_id, label_hashes, priority, assignee_type, assignee_hash, and team routing metadata.
    - Workflow run projection items returned by the Tasks view as read-only task-shaped cards without creating user_tasks rows.
    - Task-to-Project link mutations that keep safe Project hashes, encrypted raw Project ids, and authorized Task key wrappers in sync.
    - Task key wrappers for owner/master, chat, Project, Plan, and Team contexts where currently supported by backend storage and validation; client surfaces may still use row-level master-wrapped encrypted_task_key while wrapper parity is completed.
    - REST, CLI, npm SDK, and pip SDK semantics for encrypted task content, lifecycle actions, labels/priority metadata, Project links, and workflow projection handling where those surfaces expose the operation.
  excludes:
    - /v1/tasks Celery/background task polling.
    - Plan subresource behavior except Plan-created task references, plan_id, task_type=verification, verification_id, and Plan key-wrapper contexts for connected tasks.
    - Workflow run execution semantics beyond read-only task projections and scheduled-run skip/delete behavior exposed through Tasks.
    - GUI layout, Figma visual parity, drag/drop mechanics, and Apple-native task UI.
    - Public task sharing, team collaboration semantics, or durable share-specific task wrappers.
    - Server-side full-text search or decryption over private task title, description, labels, activity, latest instruction, or encrypted linked Project ids.

models:
  TaskRecord:
    task_id:
      type: stable_id
      required: true
    status:
      type: enum
      values: [backlog, todo, in_progress, blocked, done]
      required: true
    encrypted_title:
      type: client_ciphertext
      required: true
      constraints: {plaintext_private_content: forbidden}
    encrypted_description:
      type: client_ciphertext
      nullable: true
      constraints: {plaintext_private_content: forbidden}
    encrypted_labels:
      type: client_ciphertext
      nullable: true
      constraints: {official_field: true, plaintext_label_names: forbidden}
    encrypted_tags:
      type: client_ciphertext
      nullable: true
      constraints: {compatibility_alias_for_labels: true, plaintext_label_names: forbidden}
    encrypted_linked_project_ids:
      type: client_ciphertext
      nullable: true
      constraints: {raw_project_ids_plaintext: forbidden}
    linked_project_hashes:
      type: blind_or_sha256_hash_array
      nullable: true
      constraints: {server_visible_filter_metadata: true}
    label_hashes:
      type: blind_index_array
      nullable: true
      constraints: {hmac_sha256_with_master_key_derived_index_key: true, and_filter_semantics: true}
    priority:
      type: integer
      values: [0, 1, 2, 3, 4]
      required: true
      constraints: {labels: [none, low, medium, high, urgent], server_visible_sort_metadata: true}
    version:
      type: integer
      required: true
      constraints: {monotonic: true, stale_mutations_rejected: true}

  TaskLifecycleState:
    queue_state:
      type: enum_or_null
      values: [none, waiting, active, skipped, waiting_for_user]
    ai_execution_state:
      type: enum_or_string_or_null
      constraints: {safe_routing_metadata: true}
    blocked_reason_code:
      type: enum_or_string_or_null
      constraints: {plaintext_private_content: forbidden, safe_reason_code: true}
    started_at:
      type: unix_timestamp_or_null
    completed_at:
      type: unix_timestamp_or_null

  TaskKeyWrapper:
    key_type:
      type: enum
      values: [master, chat, project, plan, team]
      required: true
    encrypted_task_key:
      type: wrapped_key_ciphertext
      required: true
      constraints: {raw_task_key: forbidden}
    hashed_task_id:
      type: sha256_hex
      required: true
    hashed_chat_id:
      type: sha256_hex_or_null
    hashed_project_id:
      type: sha256_hex_or_null
    hashed_plan_id:
      type: sha256_hex_or_null
    hashed_team_id:
      type: sha256_hex_or_null
    team_key_epoch:
      type: integer_or_null
      constraints: {required_when_key_type_team: true}

  WorkflowTaskProjection:
    task_id:
      type: stable_projection_id
      required: true
    source:
      type: enum
      values: [workflow_run]
      required: true
    projection_kind:
      type: enum
      values: [last_run, current_run, next_run]
      required: true
    status:
      type: enum
      values: [todo, in_progress, blocked, done]
      required: true
    read_only:
      type: boolean
      required: true
      constraints: {must_be_true: true, not_user_task_row: true}
    can_cancel:
      type: boolean
      required: true
    can_delete:
      type: boolean
      required: true

assertions:
  - id: tasks.content.client-encrypted
    type: privacy
    must: Task titles, descriptions, labels/tags, activity summaries, latest instructions, raw linked Project ids, and task keys are encrypted before durable persistence; server-visible status, priority, queue, assignee, chat/project/plan routing metadata, and label_hashes remain limited safe metadata for authorization, filtering, sorting, and execution.
    depends_on: [models.TaskRecord, examples.task_private_content]
  - id: tasks.lifecycle.visible
    type: behavior
    must: Create, update, reorder, block, unblock, skip, complete, delete, start-ai, ask, restore, and scheduler/queue transitions preserve explicit status, version, position, queue_state, blocked_reason_code, ai_execution_state, started_at, and completed_at semantics; assistant prose alone is never a task completion, blocker, skip, or unblock signal.
    depends_on: [models.TaskRecord.status, models.TaskLifecycleState, examples.task_lifecycle]
  - id: tasks.project-links.encrypted
    type: invariant
    must: Task Project-link mutations update server-filterable linked_project_hashes, client-encrypted linked Project id lists, and replacement Task key wrappers together, rejecting relinks that would leave Project metadata, encrypted owner-visible ids, or access wrappers out of sync.
    depends_on: [models.TaskRecord.encrypted_linked_project_ids, models.TaskRecord.linked_project_hashes, models.TaskKeyWrapper, examples.task_project_links]
  - id: tasks.key-wrappers.context-scoped
    type: security
    must: Task keys are never stored raw; wrapper rows are scoped to exactly one authorized master, chat, Project, Plan, or Team context, team wrappers include a valid team_key_epoch, and share/export task access uses URL-fragment bundle wrapping rather than persistent share-specific server wrappers.
    depends_on: [models.TaskKeyWrapper, examples.task_private_content, examples.task_project_links]
  - id: tasks.workflow-projections.read-only
    type: invariant
    must: Workflow run items in the Tasks view are owner-scoped, metadata-only, read-only projections derived from Workflow state; they do not create user_tasks rows, do not expose encrypted Workflow content, and only expose Workflow-owned open, cancel, or scheduled-skip actions.
    depends_on: [models.WorkflowTaskProjection, examples.task_workflow_projections]
  - id: tasks.surface.semantic-parity
    type: parity
    must: REST, CLI, npm SDK, and pip SDK surfaces preserve the same encrypted-content, label/priority metadata, lifecycle, Project-link, workflow-projection, version-conflict, and local-decryption semantics for every Task operation that surface implements; unsupported contexts must fail visibly or remain explicitly out of scope.
    depends_on: [models, examples, surfaces]

surfaces:
  rest_api:
    required: true
    role: Authenticated /v1/user-tasks routes own persistence, metadata filtering, lifecycle actions, history, wrapper validation, and workflow projection reads without decrypting private task content.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: false
    role: Web task UI consumes the same encrypted task service, but GUI layout and visual parity are outside this contract bundle.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [task_private_content, task_lifecycle, task_project_links, task_workflow_projections, task_surface_parity]
