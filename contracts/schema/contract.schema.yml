$schema: https://json-schema.org/draft/2020-12/schema
title: OpenMates compact contract
type: object
required: [schema_version, id, version, status, title, summary, scope, models, assertions, surfaces, examples]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^[a-z][a-z0-9]*(?:[.-][a-z0-9][a-z0-9-]*)+$"}
  version: {type: integer, minimum: 1}
  status: {enum: [draft, approved, superseded]}
  title: {type: string, minLength: 1}
  summary: {type: string, minLength: 1}
  scope:
    type: object
    required: [includes, excludes]
  models: {type: object}
  assertions:
    type: array
    minItems: 1
  surfaces:
    type: object
    required: [rest_api, cli, sdks, gui]
  examples:
    type: object
    required: [file, required_groups]
