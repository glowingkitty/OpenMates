schema_version: 1
id: architecture.daily-ai-test-inference
version: 2
status: draft
title: Cost-Safe Daily AI Inference Testing
summary: >
  OpenMates daily tests provide broad deterministic full-pipeline coverage with
  zero paid calls, plus one fixed and one rotating real-inference canary under a
  shared EUR 0.25 hard cap that cannot affect ordinary inference traffic.

inherits:
  - architecture.ai-request-observability@1

scope:
  includes:
    - Replay-only daily coverage of preprocessing, main inference orchestration,
      tools, postprocessing, translation, safety, compression, delivery, and persistence.
    - One fixed and one deterministic rotating full-pipeline real-inference canary per UTC day.
    - Test-only identity, paid-call isolation, distributed budget enforcement, and content-free reporting.
    - Manual candidate recording and one bounded scheduled backfill candidate per UTC day, with pass-gated atomic cache promotion and immediate replay verification.
    - Conditional real validation after changes that affect AI request or response contracts.
  excludes:
    - Any cost limit, throttling, marker, or cache behavior applied to ordinary user or manual inference.
    - Implicit cache recording after a replay miss or more than one scheduled backfill candidate per UTC day.
    - Daily deep-research, generated-media, or other explicitly expensive inference scenarios.
    - Exact-text assertions for nondeterministic real model output.
    - Public or developer access to test controls, cache management, or test-run budgets.

models:
  DailyAITestRun:
    run_id:
      type: short_lived_signed_identifier
      required: true
      constraints: {non_production_only: true, content_free: true}
    mode:
      type: enum
      values: [replay, real_canary, record_candidate]
      required: true
    test_account:
      type: dedicated_account_identity
      required: true
      constraints: {allowlisted: true, ordinary_account_forbidden: true}
    real_budget_eur:
      type: decimal
      required: true
      constraints: {daily_shared_maximum: 0.25, replay_value: 0}

  ReplayProviderBoundary:
    phases:
      type: enum_set
      required: true
      values: [preprocess, main, tool, postprocess, translation, safety, compression]
    cache_policy:
      type: enum
      required: true
      values: [replay_only]
    cache_miss_policy:
      type: enum
      required: true
      values: [fail_before_provider]
    real_provider_calls:
      type: integer
      required: true
      constraints: {value: 0}

  RealCanarySet:
    fixed:
      type: full_pipeline_scenario
      required: true
      constraints: {count_per_utc_day: 1, short_bounded_prompt: true}
    rotating:
      type: curated_full_pipeline_scenario
      required: true
      constraints: {count_per_utc_day: 1, deterministic_utc_selection: true}
    assertions:
      type: semantic_assertion_set
      required: true
      constraints: {exact_generated_text_forbidden: true, schema_and_terminal_state_required: true}

  TestInferenceBudget:
    scope:
      type: signed_daily_test_run
      required: true
      constraints: {shared_across_workers: true, ordinary_traffic_excluded: true}
    reservation:
      type: conservative_atomic_cost_reservation
      required: true
      constraints: {before_provider_dispatch: true, prevents_overspend: true}
    reconciliation:
      type: actual_usage_reconciliation
      required: true
      constraints: {calls_tokens_estimated_eur: true, content_free: true}
    exhaustion:
      type: terminal_test_failure
      required: true
      constraints: {fallback_provider_forbidden: true, further_paid_calls_forbidden: true}

  CacheCandidate:
    storage:
      type: isolated_temporary_cache
      required: true
      constraints: {known_good_unchanged_until_promotion: true}
    promotion:
      type: atomic_operation
      required: true
      constraints: {real_spec_pass_required: true, hash_bound_receipt_required: true, known_good_rollback_required: true}
    replay_verification:
      type: immediate_required_check
      required: true
      constraints: {same_scenario: true, zero_paid_calls: true}

assertions:
  - id: daily-ai-tests.replay.zero-paid-calls
    type: invariant
    must: Daily replay tests execute local full-pipeline behavior while every external AI and skill-provider call is served from reviewed cache data, and the completed replay run reports exactly zero real provider calls.
    depends_on: [models.ReplayProviderBoundary, examples.replay_runs]
  - id: daily-ai-tests.replay.cache-miss-fails-closed
    type: failure
    must: A missing, ambiguous, exhausted, or request-shape-mismatched replay entry fails before provider dispatch with its phase and sanitized cache identity; it never falls through to a real provider.
    depends_on: [models.ReplayProviderBoundary, examples.replay_runs]
  - id: daily-ai-tests.real.fixed-plus-rotating
    type: behavior
    must: Each daily run schedules exactly one short fixed full-pipeline canary and one scenario selected deterministically by UTC date from a reviewed rotating allowlist; expensive scenarios remain manual unless separately approved.
    depends_on: [models.RealCanarySet, examples.real_canaries]
  - id: daily-ai-tests.real.semantic-signal
    type: invariant
    must: Real canaries validate required pipeline phases, terminal completion, usable content, structured postprocessing, expected tool schemas when applicable, and absence of user-visible protocol errors without requiring exact generated wording.
    depends_on: [models.RealCanarySet.assertions, examples.real_canaries]
  - id: daily-ai-tests.budget.shared-hard-cap
    type: invariant
    must: The two daily real canaries share a EUR 0.25 maximum enforced through atomic conservative reservation before each provider dispatch and actual usage reconciliation; exhaustion blocks retries, fallback providers, and all further paid calls in that run.
    depends_on: [models.TestInferenceBudget, examples.budget_enforcement]
  - id: daily-ai-tests.isolation.ordinary-inference-unchanged
    type: security
    must: Test replay, recording, and budget behavior requires a valid non-production signed run identity and a dedicated allowlisted test account; ordinary user traffic, manual inference, and production traffic cannot enter or be restricted by the daily-test control path.
    depends_on: [models.DailyAITestRun, examples.isolation]
  - id: daily-ai-tests.cache.manual-transactional-promotion
    type: invariant
    must: Cache recording is manual-only, writes to an isolated candidate, preserves known-good entries on failure, promotes atomically only after the real spec passes, and becomes valid only after the promoted scenario immediately passes replay with zero paid calls.
    depends_on: [models.CacheCandidate, examples.cache_lifecycle]
  - id: daily-ai-tests.cache.bounded-automatic-backfill
    type: invariant
    must: Each scheduled daily run may record at most one manifest-allowlisted missing-cache scenario into persistent isolated candidate storage, promote it only after a passing real run and zero-call candidate replay, and persist the exact verified group through the scoped dev deployment lock; any failure leaves known-good cache data and ordinary inference unchanged.
    depends_on: [models.CacheCandidate, models.TestInferenceBudget, examples.cache_lifecycle]
  - id: daily-ai-tests.validation.conditional-real-gate
    type: behavior
    must: Changes to prompts, models, routing, processing phases, external tool contracts, or AI semantic assertions require passing real validation followed by candidate promotion and replay verification; UI-only, selector, timing, or account-state repairs may use existing replay data.
    depends_on: [examples.change_classification]
  - id: daily-ai-tests.reporting.content-free
    type: privacy
    must: Daily results report mode, phase, provider, model, cache hit or miss totals, calls, tokens, estimated EUR cost, budget state, and normalized failure classes without prompts, responses, tool payloads, private identifiers, credentials, or raw provider errors.
    depends_on: [examples.reporting]

surfaces:
  rest_api:
    required: false
    role: No public or developer endpoint is added; any test control remains internal-only and non-production.
  cli:
    required: true
    parity: semantic
    role: Test orchestration exposes explicit replay, canary, candidate-recording, promotion, and content-free summary operations.
  sdks:
    required: false
    role: No npm or pip SDK surface is introduced.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: false
    role: Existing web specs consume the test modes, but no user-facing web or Apple UI changes are required.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [replay_runs, real_canaries, budget_enforcement, isolation, cache_lifecycle, change_classification, reporting]
