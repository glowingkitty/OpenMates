# Choose a supported official conference and topic before enabling.
# Sunday 09:00 is an editable example time.
title: Conference sessions each week
description: Search the selected official conference schedule every Sunday.
start_when:
  schedule:
    type: weekly
    weekdays: [sunday]
    time: "09:00"
    timezone: Europe/Berlin
run_content_retention: last_5
steps:
  - id: events
    use_app_skill: events.search
    input:
      requests:
        - query: security
          conference: 39C3
          count: 10
  - id: report
    send_chat_message:
      title: Conference sessions
      blocks:
        - id: events
          label: Newly found conference sessions
          source: $nodes.events.output.results
          only_new_results: true
