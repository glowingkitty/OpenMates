schema_version: 1
specification: feature.chat-navigation@3
sidebar_header_order:
- id: selected-chat-navigates-older-and-newer
  given:
    sidebar_order:
    - newer-chat
    - selected-chat
    - older-chat
    active_chat_id: selected-chat
  actions:
  - control: previous
    expect_chat_id: older-chat
  - control: next
    expect_chat_id: selected-chat
  - control: swipe_previous
    expect_chat_id: older-chat
  - control: swipe_next
    expect_chat_id: selected-chat
- id: selected-chat-can-navigate-to-newer-neighbor
  given:
    sidebar_order:
    - newest-chat
    - selected-chat
    - older-chat
    active_chat_id: selected-chat
  actions:
  - control: next
    expect_chat_id: newest-chat
draft_only_targets:
- id: draft-only-chat-addressable-with-sidebar-closed
  given:
    draft_chat:
      chat_id: draft-chat-1
      messages: []
      title: null
      draft_preview: Header navigation draft
    sidebar_order:
    - draft-chat-1
    - regular-chat-1
    active_chat_id: regular-chat-1
    sidebar_visible: false
  action:
    control: next
  expect:
    active_chat_id: draft-chat-1
    url_hash_contains: chat-id=draft-chat-1
    header_badge: draft
    header_title_contains: Header navigation draft
- id: draft-only-chat-survives-resume-and-viewport-change
  given:
    draft_chat:
      chat_id: draft-chat-1
      draft_preview: Header navigation draft
    transitions:
    - new_chat_screen
    - resume_draft_card_click
    - mobile_viewport
    - desktop_viewport
  expect:
    active_chat_id: draft-chat-1
    draft_badge_visible: true
    draft_preview_preserved: true
empty_shells:
- id: empty-new-chat-shell-not-in-navigation
  given:
    url_hash: ''
    message_editor_text: ''
    message_count: 0
  expect:
    persisted_chat_id: absent
    sidebar_row: absent
    header_navigation_target: false
- id: typed-unsent-content-creates-draft-target
  given:
    url_hash: ''
    message_editor_text: Header navigation draft
    message_count: 0
  expect:
    persisted_chat_id: present
    sidebar_row: present
    header_navigation_target: true
local_first_chat_open:
- id: warm-short-chat-repairs-after-local-paint
  given:
    target_chat_id: chat-b
    previous_surface: workspace_welcome
    local_header_metadata: decrypted
    local_encrypted_message_count: 4
    local_key_available: true
    remote_window_response: delayed
  expect:
    immediate_surface: target_chat_shell
    welcome_surface_visible: false
    previous_chat_content_visible: false
    local_messages_visible_before_remote_response: true
    remote_repair_background: true
- id: cold-window-keeps-target-shell
  given:
    target_chat_id: chat-b
    local_header_metadata: decrypted
    local_encrypted_message_count: 0
    remote_window_response: pending
  expect:
    immediate_surface: target_chat_shell
    header_visible: true
    transcript_state: loading
    welcome_surface_visible: false
- id: stale-repair-cannot-overwrite-new-selection
  given:
    initial_target_chat_id: chat-a
    current_target_chat_id: chat-b
    delayed_repair_chat_id: chat-a
  expect:
    visible_chat_id: chat-b
    delayed_repair_committed_to_ui: false
    duplicate_messages: 0
- id: unavailable-key-or-decrypt-failure-is-explicit
  given:
    target_chat_id: chat-b
    local_ciphertext_present: true
    usable_chat_key: false
  expect:
    immediate_surface: target_chat_shell
    transcript_state: error_or_retry
    welcome_surface_visible: false
    ciphertext_visible: false
    previous_chat_plaintext_visible: false
nested_projects:
- id: deep-path
  assertion_ids:
  - chat-navigation.projects.nested-readable
  given: Website launch contains Marketing, then Campaigns, then Launch copy.
  when: The user enters Launch copy in a narrow sidebar.
  then: The breadcrumb shows Website launch, a middle overflow, and Launch copy. Opening
    the overflow lists all four names; child rows retain their full width.
- id: direct-child
  assertion_ids:
  - chat-navigation.projects.nested-readable
  given: Marketing is directly inside Website launch.
  when: The user opens Marketing.
  then: The breadcrumb shows Website launch and Marketing with no middle overflow.
running_chats:
- id: parent-count
  assertion_ids:
  - chat-navigation.activity.global-running
  given: Trip planning is idle while its Hotels and Flights subchats are processing
    inside nested folders.
  when: The user browses another folder or the landing page.
  then: Trip planning stays at the sidebar top with a wheel and two running subchats.
    Containing folders show wheels. The landing link says one chat active and opens
    the sidebar.
- id: independent-completion
  assertion_ids:
  - chat-navigation.activity.global-running
  given: Launch copy and Travel budget run concurrently.
  when: Launch copy completes while Travel budget continues.
  then: Only Travel budget retains its wheel and top entry; a delayed completion from
    an earlier Travel budget turn cannot clear the newer turn.
chat_organization:
- id: drag-group
  assertion_ids:
  - chat-navigation.projects.organize
  given: The user owns Launch headlines and Launch schedule in the same workspace.
  when: They drag Launch headlines onto Launch schedule.
  then: AI names a new shared-topic Project, both chats move into it, and its Project
    screen opens.
- id: choose-nested-destination
  assertion_ids:
  - chat-navigation.projects.organize
  given: A saved chat belongs to Website launch and Marketing has a Launch copy subfolder.
  when: The user chooses Move to project from a sidebar or continuation-card menu
    and selects Launch copy in another Project.
  then: The destination link is saved before the old Project link is removed. Add
    to project would instead retain both links; a destination failure preserves the
    old link and shows an error.
