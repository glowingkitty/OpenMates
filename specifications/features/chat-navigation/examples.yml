schema_version: 1
specification: feature.chat-navigation@2

sidebar_header_order:
  - id: selected-chat-navigates-older-and-newer
    given:
      sidebar_order: [newer-chat, selected-chat, older-chat]
      active_chat_id: selected-chat
    actions:
      - control: previous
        expect_chat_id: older-chat
      - control: next
        expect_chat_id: selected-chat
      - control: swipe_previous
        expect_chat_id: older-chat
      - control: swipe_next
        expect_chat_id: selected-chat
  - id: selected-chat-can-navigate-to-newer-neighbor
    given:
      sidebar_order: [newest-chat, selected-chat, older-chat]
      active_chat_id: selected-chat
    actions:
      - control: next
        expect_chat_id: newest-chat

draft_only_targets:
  - id: draft-only-chat-addressable-with-sidebar-closed
    given:
      draft_chat:
        chat_id: draft-chat-1
        messages: []
        title: null
        draft_preview: Header navigation draft
      sidebar_order: [draft-chat-1, regular-chat-1]
      active_chat_id: regular-chat-1
      sidebar_visible: false
    action:
      control: next
    expect:
      active_chat_id: draft-chat-1
      url_hash_contains: chat-id=draft-chat-1
      header_badge: draft
      header_title_contains: Header navigation draft
  - id: draft-only-chat-survives-resume-and-viewport-change
    given:
      draft_chat:
        chat_id: draft-chat-1
        draft_preview: Header navigation draft
      transitions: [new_chat_screen, resume_draft_card_click, mobile_viewport, desktop_viewport]
    expect:
      active_chat_id: draft-chat-1
      draft_badge_visible: true
      draft_preview_preserved: true

empty_shells:
  - id: empty-new-chat-shell-not-in-navigation
    given:
      url_hash: ''
      message_editor_text: ''
      message_count: 0
    expect:
      persisted_chat_id: absent
      sidebar_row: absent
      header_navigation_target: false
  - id: typed-unsent-content-creates-draft-target
    given:
      url_hash: ''
      message_editor_text: Header navigation draft
      message_count: 0
    expect:
      persisted_chat_id: present
      sidebar_row: present
      header_navigation_target: true

local_first_chat_open:
  - id: warm-short-chat-repairs-after-local-paint
    given:
      target_chat_id: chat-b
      previous_surface: workspace_welcome
      local_header_metadata: decrypted
      local_encrypted_message_count: 4
      local_key_available: true
      remote_window_response: delayed
    expect:
      immediate_surface: target_chat_shell
      welcome_surface_visible: false
      previous_chat_content_visible: false
      local_messages_visible_before_remote_response: true
      remote_repair_background: true
  - id: cold-window-keeps-target-shell
    given:
      target_chat_id: chat-b
      local_header_metadata: decrypted
      local_encrypted_message_count: 0
      remote_window_response: pending
    expect:
      immediate_surface: target_chat_shell
      header_visible: true
      transcript_state: loading
      welcome_surface_visible: false
  - id: stale-repair-cannot-overwrite-new-selection
    given:
      initial_target_chat_id: chat-a
      current_target_chat_id: chat-b
      delayed_repair_chat_id: chat-a
    expect:
      visible_chat_id: chat-b
      delayed_repair_committed_to_ui: false
      duplicate_messages: 0
  - id: unavailable-key-or-decrypt-failure-is-explicit
    given:
      target_chat_id: chat-b
      local_ciphertext_present: true
      usable_chat_key: false
    expect:
      immediate_surface: target_chat_shell
      transcript_state: error_or_retry
      welcome_surface_visible: false
      ciphertext_visible: false
      previous_chat_plaintext_visible: false
