schema_version: 1
specification: feature.message-input@7
parent_state:
- id: focus-and-text-update-parent
  given:
    surface: gui.web
    context: new_chat_welcome
    authenticated: false
  actions:
  - focus_message_editor
  - type_text: Explain how OpenMates works
  expect:
    parent_isFocused: true
    parent_hasContent: true
    parent_live_text: Explain how OpenMates works
    message_input_mounted: true
- id: maps-open-state-hides-parent-suggestions
  given:
    surface: gui.web
    composer_recently_focused: true
  action: open_maps_selector
  expect:
    parent_isMapsOpen: true
    new_chat_suggestions_visible: false
focus_visibility:
- id: logged-out-focus-hides-welcome
  given: A logged-out user sees the welcome cards, Daily Inspiration and example links in the web app on a desktop or phone.
  when: The user focuses the message editor to write a text draft.
  then: The welcome content fades completely out without changing its layout measurements, its controls are inert, and the editor remains mounted and usable. Dismissing focus restores the welcome content.
  assertion_ids:
  - message-input.focus.guest-welcome-suppression
- id: recording-overlay-hides-welcome-ui
  given: A logged-out user has granted microphone permission while the welcome composer is visible.
  when: The user presses and holds Record until the recording overlay opens.
  then: The recording preview is visible, the welcome content and example links are hidden and inert, and the message input remains mounted.
  assertion_ids:
  - message-input.focus.guest-welcome-suppression
workspace_focus_visibility:
- id: focused-existing-content-has-no-gray-overlay
  given: A user can see an existing chat transcript, Task board or Workflow editor in the web app on a desktop or phone.
  when: The user focuses or expands the message input.
  then: Existing content stays visible at full opacity, no gray or translucent backdrop appears, background controls are disabled, and the composer remains usable.
  assertion_ids:
  - message-input.focus.workspace-suppression
- id: outside-dismissal-preserves-draft-without-backdrop
  given: The focused web composer contains an unsent text draft in a new chat whose welcome cards and Daily Inspiration have faded out.
  when: The user taps outside the composer or presses Cancel.
  then: The composer releases focus and restores the welcome content without losing the draft; a minimized sendable draft retains its round orange up-arrow Send control.
  assertion_ids:
  - message-input.focus.workspace-suppression
action_controls:
- id: empty-unfocused-inline-actions-hidden
  given:
    inlineCompact: true
    isFocused: false
    hasContent: false
    hasEmbedContent: false
  expect:
    expanded_action_buttons_visible: false
    base_empty_affordances_visible: true
- id: recording-keeps-actions-mounted
  given:
    isFocused: false
    hasContent: false
    recording_button_pressed: true
  expect:
    record_button_mounted_until_pointer_end: true
    action_buttons_visible: true
drafts:
- id: text-draft-preview-after-blur
  given:
    currentChatId: draft-chat-1
    text: Remember to compare flights
    embeds: []
  actions:
  - save_draft
  - blur_message_editor
  expect:
    draft_saved_for_chat_id: draft-chat-1
    draft_preview_summary_contains: Remember to compare flights
    editor_can_collapse_to_preview: true
- id: long-inactive-draft-preview-shortens-with-ellipsis
  given:
    currentChatId: draft-chat-1
    text: Keep this draft while I open a different saved chat
    embeds: []
    available_inline_width: narrow
  actions:
  - save_draft
  - blur_message_editor
  expect:
    draft_preview_single_line: true
    overflowing_text_shortened_with_ellipsis: true
    full_draft_content_retained: true
    selecting_draft_restores_full_editor_content: true
- id: embed-draft-stays-editable
  given:
    currentChatId: draft-chat-2
    embeds:
    - type: file
    text: ''
  actions:
  - save_draft
  - blur_message_editor
  expect:
    draft_saved_for_chat_id: draft-chat-2
    editor_can_collapse_to_preview: false
    embed_controls_reachable: true
attachments:
- id: paste-code-defers-send-until-embed-ready
  given:
    paste_kind: multiline_code
    send_pressed_before_embed_registered: true
  expect:
    pending_paste_embed_count_blocks_send: true
    send_resumes_after_embed_registered: true
    embed_metadata_preserved: true
- id: anonymous-private-file-requires-signup
  given:
    authenticated: false
    attachment: private_file
    embed_needsSignup: true
  expect:
    anonymousFileAttachmentPending: true
    suggestions_visible: false
    signup_required_before_send: true
recording:
- id: pointer-hold-starts-focused-overlay
  given:
    mic_permission: granted
    input_empty: true
  action: press_and_hold_record_button
  expect:
    recording_preview_visible: true
    overlay_owns_focus: true
    recordingStateChange_active: true
    cancel_and_finish_controls_visible: true
- id: cancel-cleans-recording-state
  given:
    recording_preview_visible: true
  action: cancel_recording
  expect:
    recording_preview_visible: false
    recording_store_reset: true
    stale_focus_state: false
suggestions:
- id: welcome-suggestions-bound-to-recent-focus
  given:
    showWelcome: true
    messageInputRecentlyFocused: true
    mapsOpen: false
    anonymousFileAttachmentPending: false
  expect:
    new_chat_suggestions_visible: true
- id: open-chat-search-suggestions-bound-to-focus
  given:
    showWelcome: false
    currentChatId: chat-1
    messageInputRecentlyFocused: true
    liveInputText: budget
  expect:
    chat_search_suggestions_query: budget
    hidden_when_no_results: true
send_ownership:
- id: start-new-chat-dispatches-parent-event
  given:
    startNewChatOnClick: true
    currentChatId: null
  action: click_composer_or_cta
  expect:
    event: startNewChat
    composer_creates_chat_directly: false
- id: send-message-handoff
  given:
    currentChatId: chat-1
    sanitized_text: Find events in Berlin
    embeds_ready: true
  action: send_message
  expect:
    event: sendMessage
    parent_owns_message_persistence: true
    composer_owns_ai_processing: false
privacy_context:
- id: pii-warning-respects-settings
  given:
    pii_detection_enabled: true
    text_contains_enabled_personal_data: true
  expect:
    pii_warning_visible: true
    undo_all_available: true
    durable_plaintext_private_content_written_by_composer: false
- id: context-pills-route-or-deactivate
  given:
    activeFocusId: jobs-career_insights
    incognitoMode: true
  expect:
    focus_pill_deep_link_available: true
    focus_pill_deactivate_has_undo_window: true
    incognito_toggle_deactivates_incognito: true
responsive_layout:
- id: compact-phone-composer
  given:
    surface: gui.web
    viewport:
    - 390
    - 844
    composer_state: focused_with_text
  expect:
    inside_active_chat_bounds: true
    horizontal_clipping: false
    actions_reachable: true
    latest_message_obscured: false
- id: regular-wide-composer
  given:
    surface: gui.web
    viewport:
    - 1440
    - 900
    composer_state: streaming_with_stop_control
  expect:
    inside_active_chat_bounds: true
    horizontal_clipping: false
    stop_control_reachable: true
    latest_message_obscured: false
- id: apple-corresponding-layouts
  given:
    surface: gui.apple
    profiles:
    - iphone_portrait
    - ipad_landscape
    - macos_regular
  expect:
    web_hierarchy_preserved: true
    relative_geometry_preserved: true
    controls_reachable: true
    latest_message_obscured: false
- id: apple-expand-only-after-inline-overflow
  assertion_ids:
  - message-input.layout.responsive-parity
  given: An Apple chat or workspace composer is focused and its three short lines fit without scrolling.
  when: The user adds enough lines or attachment content to exceed the visible inline height.
  then: Expand was absent while all content fit and now appears beside the text without covering it; opening fullscreen
    keeps Collapse reachable and preserves the same draft.
- id: apple-clear-removes-inline-expand
  assertion_ids:
  - message-input.layout.responsive-parity
  given: An Apple inline composer contains a long draft and shows Expand.
  when: The user clears or shortens the draft until all content fits without scrolling.
  then: Expand disappears while the composer remains focused and Cancel stays available.
immediate_submission:
- id: pending-network-does-not-hold-composer
  assertion_ids:
  - message-input.send.ownership
  given: Alice has a sendable message in the web composer and server preflight has not responded.
  when: Alice presses Send and starts typing her next message while the submitted turn is still pending.
  then: The submitted text immediately appears once in history as sending and disappears from the composer. Her
    new text survives acceptance or rejection, and an offline submission resumes through the existing reconnect
    path.
- id: minimized-draft-keeps-send
  assertion_ids:
  - message-input.actions.visibility
  given: Alice has a nonempty text draft in the focused web composer.
  when: Alice presses outside the composer and then focuses it again.
  then: The minimized single-line draft has a round orange up-arrow Send button without visible Send text. Focusing
    restores the labeled Send button, and focus adds no gray translucent backdrop.
editable_transcript:
- id: transcript-among-existing-notes
  given: Alice has typed meeting notes and places the caret where she wants her recording’s words.
  when: She finishes recording and receives the corrected transcript.
  then: The transcript appears as editable normal text at that position, preserving her notes, without a recording
    embed, permanent audio upload or automatic Send.
- id: stale-recording-result
  given: Alice starts a recording in chat A, then cancels or switches to chat B and starts another draft.
  when: The old correction result arrives.
  then: It does not alter chat B or the newer draft; temporary recording resources are released.
gated_attachments:
- id: pending-file-keeps-send-gated
  given: Alice attaches a private file and its upload is still pending.
  when: She attempts Send before the upload finishes.
  then: The composer keeps the attachment metadata and waits; anonymous users must sign up before private-file sending.
- id: recording-correction-pending
  assertion_ids:
  - message-input.embeds.gated-send
  given: Alice finishes a web microphone recording and correction is still in progress.
  when: She attempts Send.
  then: Send waits for correction without creating an audio attachment; she can review the corrected normal text
    before sending.
composer_ghost:
- id: accept-contextual-next-message
  assertion_ids:
  - message-input.suggestion.editable-acceptance
  - message-input.suggestion.keyboard-ownership
  - message-input.suggestion.touch-acceptance
  given: Alice receives a completed comparison and her empty web composer offers a relevant next question as faint ghost text.
  when: Alice focuses the composer and presses Tab, or taps Use suggestion on her phone.
  then: The suggestion becomes ordinary editable text without sending; Alice can change it before pressing Send, and separate followup chips remain available.
- id: user-draft-and-context-own-composer
  assertion_ids:
  - message-input.suggestion.dismissal
  - message-input.suggestion.draft-priority
  given: Alice has a contextual ghost for chat A and begins typing, attaching a file, recording or editing a queued message.
  when: She dismisses it with Escape or opens chat B, and an old completion or synchronized suggestion arrives.
  then: Her own draft and current chat remain unchanged; no stale ghost appears. Reduced motion shows an eligible new ghost without a fade.
october_apple_recording:
  - id: explicit-local-off-and-automatic-selection
    assertion_ids: [message-input.recording.lifecycle, message-input.privacy-context]
    given: An Apple composer has a prior draft and supports Automatic, installed Whisper, included Whistle and Off transcription choices.
    when: The user selects an unavailable explicit local engine, changes selection while a transcript is pending, or selects Off and finishes a recording.
    then: Explicit local failure stays local, stale text never enters the draft, and Off preserves the waveform and audio attachment without a hidden transcription request; Automatic alone retains its disclosed existing online fallback.
  - id: call-audio-prevents-composer-capture
    assertion_ids: [message-input.recording.lifecycle]
    given: A connecting or active call owns native audio while an unsent composer draft exists.
    when: The user attempts any composer recording entry point.
    then: Capture cannot start, the draft is preserved and no microphone-permission denial is invented for an audio-ownership rejection.
october_apple_privacy:
  - id: prepared-privacy-is-not-send-permission
    assertion_ids: [message-input.privacy-context, message-input.send.ownership]
    given: Focusing an Apple composer warmed a locally decrypted Personal snapshot before the user's privacy settings changed.
    when: The user sends while a privacy write is pending, uncertain or contradicted by the fresh complete server snapshot.
    then: The send waits for current persisted policy or fails visibly with the draft retained; warm cache alone cannot authorize admission and no private draft is sent for preparation.
  - id: immutable-retry-and-owner-switch
    assertion_ids: [message-input.privacy-context, message-input.send.ownership]
    given: An immutable saved turn has an explicit current-turn privacy exclusion and transport reconnects before admission completes.
    when: The exact turn retries within its original account and workspace, or account, key, server or Team ownership changes.
    then: A valid retry keeps the same protected payload and deliberate exclusion only after a fresh scoped receipt; replacement ownership cannot consume the turn, draft or prepared privacy.
