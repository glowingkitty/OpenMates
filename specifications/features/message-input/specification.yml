schema_version: 1
id: feature.message-input
version: 1
status: draft
title: Message Input
summary: >
  The OpenMates chat composer owns user text, embeds, draft state, focus-driven
  surrounding UI suppression, recording controls, contextual suggestions, and
  send/start-new-chat handoff while preserving privacy, accessibility, and
  first-party GUI parity.

scope:
  includes:
    - First-party chat composer behavior in the web ActiveChat and MessageInput surfaces.
    - Focus, blur, content, map-open, height, and anonymous-file pending state propagated from MessageInput to its parent shell.
    - Logged-out welcome composer behavior, including suppression of guest welcome cards/prompts while the composer or recording overlay is active.
    - Text, mention, paste, file, camera, sketch, map, audio-recording, draft-preview, and send handoff behavior owned by the composer.
    - Focus-mode, incognito, IdeaBucket, PII warning, anonymous terms, and credit/signup UI context rendered inside or next to the composer.
    - Responsive composer hierarchy, chat-container bounds, transcript clearance, and control reachability across compact and regular first-party GUI layouts.
  excludes:
    - Backend AI inference, WebSocket delivery, chat encryption, and durable message-sync semantics after a send leaves the composer.
    - Exact pixel dimensions, animation easing, and browser-owned permission dialogs or native file/camera/microphone pickers.
    - Public read-only legal/newsletter chat CTA buttons that intentionally replace the composer.
    - CLI and SDK text entry surfaces, which do not render the web composer.

models:
  ComposerState:
    focus:
      type: boolean
      required: true
      constraints: {binds_parent_isFocused: true, sticky_recent_focus_ms: 150}
    has_content:
      type: boolean
      required: true
      constraints: {counts_text: true, counts_embeds: true, ignores_empty_mention_only_text: true}
    live_text:
      type: sanitized_plaintext
      required: true
      constraints: {drives_contextual_suggestion_search: true, never_stores_private_plaintext_server_side: true}
    height:
      type: pixels
      required: true
      constraints: {dispatches_heightchange: true, updates_parent_input_reserve: true}

  WelcomeSuppressionState:
    context:
      type: enum
      values: [logged_out_new_chat_welcome]
      required: true
    active_causes:
      type: array
      required: true
      constraints: {values: [composer_focus, recording_button_pressed, recording_overlay_active, map_overlay_active]}
    suppressed_regions:
      type: array
      required: true
      constraints: {values: [daily_inspiration_area, top_buttons, welcome_content, guest_interest_tags, guest_example_cards, guest_example_links]}
    suppression_effect:
      type: visual_and_interaction_state
      required: true
      constraints: {opacity_zero: true, inert_or_pointer_disabled: true, message_input_remains_mounted: true}

  ActionControlState:
    visible:
      type: boolean
      required: true
      constraints: {true_when_focused_or_fullscreen_or_has_content_or_has_embed_or_recording_active: true}
    hidden_base_state:
      type: boolean
      required: true
      constraints: {empty_unfocused_inline_composer_hides_expanded_actions: true}
    record_hold_stability:
      type: boolean
      required: true
      constraints: {record_controls_stay_mounted_until_mouse_or_touch_end: true}

  DraftState:
    draft_preview_summary:
      type: localized_summary
      required: true
      constraints: {summarizes_text_and_embed_counts: true, text_only_blur_preview_allowed: true, inactive_text_draft_is_single_line: true, overflow_shortens_with_ellipsis: true, full_draft_content_is_retained: true, embed_only_editor_stays_visible: true}
    persistence_target:
      type: chat_id
      required: true
      constraints: {uses_current_chat_or_temporary_new_chat_id: true, preserves_existing_draft_shell_when_configured: true}
    empty_content:
      type: invariant
      required: true
      constraints: {does_not_create_sendable_draft: true}

  EmbedInputState:
    supported_sources:
      type: array
      required: true
      constraints: {values: [paste, drag_drop, file_picker, camera, sketch, maps, audio_recording, code_run_followup]}
    in_flight_statuses:
      type: array
      required: true
      constraints: {values: [uploading, transcribing], defer_send_until_finished: true}
    anonymous_signup_required:
      type: boolean
      required: true
      constraints: {sets_parent_pending_state: true, suppresses_suggestions: true, requires_signup_for_private_files: true}

  RecordingState:
    start_inputs:
      type: array
      required: true
      constraints: {values: [press_and_hold_pointer, press_and_hold_touch, keyboard_shortcut]}
    overlay:
      type: modal_composer_overlay
      required: true
      constraints: {testid: recording-preview, owns_focus: true, cancel_and_finish_available: true, dispatches_active_state: true}
    cleanup:
      type: event_sequence
      required: true
      constraints: {stop_or_cancel_resets_recording_store: true, releases_focus_state: true, records_audio_embed_on_success: true}

  ContextualSuggestionState:
    new_chat:
      type: suggestion_surface
      required: true
      constraints: {shown_when_welcome_recently_focused: true, hidden_while_maps_open: true, hidden_for_anonymous_file_attachment_pending: true}
    open_chat:
      type: suggestion_surface
      required: true
      constraints: {shown_when_chat_recently_focused: true, searches_existing_chats: true, hidden_when_no_results: true}

  ComposerContextPills:
    focus_mode:
      type: pill
      required: false
      constraints: {deep_links_to_focus_settings: true, one_second_deactivation_undo: true}
    incognito:
      type: pill
      required: false
      constraints: {visible_for_incognito_context: true, toggle_deactivates_incognito: true}
    ideabucket:
      type: provenance_pill
      required: false
      constraints: {read_only_marker_when_no_focus_or_incognito_pill: true}
    pii_warning:
      type: privacy_banner
      required: false
      constraints: {shows_detected_categories: true, supports_undo_all: true, respects_user_pii_settings: true}

  ResponsiveComposerLayout:
    container_bounds:
      type: layout_invariant
      required: true
      constraints: {contained_by_active_chat: true, horizontal_overflow_forbidden: true}
    transcript_clearance:
      type: layout_invariant
      required: true
      constraints: {latest_visible_message_unobstructed: true}
    state_preservation:
      type: responsive_state
      required: true
      constraints: {preserves_text_embeds_actions_focus_and_stop_control: true}

assertions:
  - id: message-input.focus.parent-state
    type: behavior
    must: MessageInput focus, blur, meaningful content, live text, maps-open, height, and anonymous-file pending state are propagated to ActiveChat through bindable props or explicit events before the parent renders suggestions, buttons, draft controls, or layout reserves.
    depends_on: [models.ComposerState, models.EmbedInputState.anonymous_signup_required, examples.parent_state]
  - id: message-input.focus.guest-welcome-suppression
    type: behavior
    must: In the logged-out new-chat welcome surface, focusing the composer, pressing/holding record, or showing the recording overlay hides and disables the surrounding active-chat welcome UI, including Daily Inspiration, top buttons, welcome prompts, guest interest tags, example cards, and example links, while keeping the message input mounted and usable.
    depends_on: [models.WelcomeSuppressionState, models.RecordingState.overlay, examples.focus_visibility]
  - id: message-input.actions.visibility
    type: behavior
    must: Expanded composer action controls remain hidden in the empty unfocused inline state, become visible for focus/content/fullscreen/embed/recording states, and stay mounted throughout record-button press and release so pointer/touch completion events cannot be lost.
    depends_on: [models.ActionControlState, models.RecordingState.start_inputs, examples.action_controls]
  - id: message-input.drafts.preview-persistence
    type: behavior
    must: Meaningful text or embed content updates draft state against the current or temporary chat id; after blur, an inactive text-only draft may collapse into a single-line localized preview that shortens overflow with an ellipsis without discarding the full draft; embed drafts keep controls visible; and empty composer content does not create a sendable draft.
    depends_on: [models.DraftState, models.ComposerState.has_content, examples.drafts]
  - id: message-input.embeds.gated-send
    type: invariant
    must: Composer embed inputs from paste, drag/drop, picker, camera, sketch, maps, audio recording, or code follow-up preserve their embed metadata, defer send while upload/transcription is in flight, and mark anonymous private-file attachments as signup-required before suggestions or sends proceed.
    depends_on: [models.EmbedInputState, examples.attachments]
  - id: message-input.recording.lifecycle
    type: behavior
    must: Audio recording can start through press-and-hold pointer, touch, or keyboard shortcut paths, shows a focused recording overlay with cancel/finish affordances, reports active layout state, and on stop or cancel resets recording state without leaving hidden controls or stale focus behind.
    depends_on: [models.RecordingState, examples.recording]
  - id: message-input.suggestions.contextual
    type: behavior
    must: New-chat suggestions are tied to the recently focused welcome composer and hidden while maps or anonymous-file signup gates are active, while open-chat search suggestions are tied to recently focused chat composers and hidden when no matching results exist.
    depends_on: [models.ContextualSuggestionState, models.ComposerState.live_text, examples.suggestions]
  - id: message-input.send.ownership
    type: behavior
    must: The composer never owns post-send AI processing; it dispatches start-new-chat, send-message, cancellation, fullscreen, and embed events to the parent with sanitized current content and lets ActiveChat own chat creation, message persistence, and AI task lifecycle.
    depends_on: [models.ComposerState, models.DraftState.persistence_target, examples.send_ownership]
  - id: message-input.privacy-context
    type: privacy
    must: Focus-mode, incognito, IdeaBucket, PII warning, anonymous free-text terms, credits, and signup-required states are visible at the composer boundary without leaking durable plaintext private content or bypassing the user's privacy settings.
    depends_on: [models.ComposerContextPills, models.EmbedInputState.anonymous_signup_required, examples.privacy_context]
  - id: message-input.layout.responsive-parity
    type: parity
    must: The rendered web composer is the visual source of truth across compact and regular widths; the input remains within the active-chat container, preserves text, embeds, focus, action buttons, recording, expansion, and stop controls through responsive transitions, avoids horizontal clipping, and reserves enough transcript clearance that the latest visible message is not covered. Apple preserves the same hierarchy, relative geometry, state, control reachability, and clearance at corresponding iPhone, iPad, and macOS sizes.
    depends_on: [models.ResponsiveComposerLayout, models.ComposerState, models.ActionControlState, examples.responsive_layout, applies_to.gui]

applies_to:
  rest_api:
    required: false
    role: REST APIs receive sanitized send payloads after the composer hands off to ActiveChat and do not render composer UI.
  cli:
    required: false
    role: CLI has its own terminal prompt and does not render the web/Apple composer.
  sdks:
    required: false
    role: SDKs expose chat and embed operations but not first-party GUI composer interaction.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true, role: native composer preserves semantic focus, draft, attachment, recording, and privacy-context outcomes}
    exceptions:
      - id: native-owned-pickers
        implementation: gui.apple
        reason: File, camera, microphone, and permission pickers are OS-owned on Apple platforms.
        equivalent_outcome: Apple may use native picker chrome if the composer returns equivalent pending embed, recording, cancellation, and privacy-gate states.

examples:
  file: examples.yml
  required_groups: [parent_state, focus_visibility, action_controls, drafts, attachments, recording, suggestions, send_ownership, privacy_context, responsive_layout]
