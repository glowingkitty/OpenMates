schema_version: 1
id: feature.billing
version: 4
status: approved
title: Billing And Payments
summary: >
  Authenticated OpenMates Cloud users can buy and spend credits, inspect usage,
  view billing documents, and request supported refunds while self-hosted builds
  keep cloud payment collection unavailable.

scope:
  includes:
    - Personal and team credit balance charging for paid work.
    - Stripe card payments, Stripe managed payments, and SEPA bank-transfer orders.
    - Gift-card redemption and free-testing-credit grants.
    - Invoice, payment-confirmation, credit-note, and refund document visibility.
    - Billing usage overview, detail, export, and receipt-style token breakdowns.
    - First-party REST, CLI, SDK, web, and Apple semantic parity for billing usage surfaces.
    - Official-cloud anonymous virtual-budget admission and provider-operation settlement.
  excludes:
    - Provider-specific accounting outside persisted OpenMates usage rows.
    - External processor dashboard workflows not exposed through OpenMates.
    - Self-hosted cloud payment collection.

models:
  CreditBalance:
    subject:
      type: enum
      values: [personal, team]
      required: true
    encrypted_balance_before:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    encrypted_balance_after:
      type: encrypted_string
      required: true
      constraints: {plaintext: forbidden}
    charge_id:
      type: string
      required: true
      constraints: {idempotent: true, unique_per_committed_charge: true}

  CreditSettlement:
    charge_id:
      type: string
      required: true
      constraints: {immutable: true, globally_unique: true}
    state:
      type: enum
      values: [pending, committed, retry_scheduled, manual_review]
      required: true
    attempts:
      type: integer
      required: true
      constraints: {minimum: 0}
    durable_outbox_id:
      type: string
      nullable: true
    retryable_error_code:
      type: string
      nullable: true

  CreditPurchase:
    payment_source:
      type: enum
      values: [stripe_card, stripe_managed, bank_transfer, gift_card, free_testing_credit]
      required: true
    order_reference:
      type: string
      nullable: true
      constraints: {single_use_when_bank_transfer: true}
    status:
      type: enum
      values: [pending, completed, refunded, failed]
      required: true

  BillingDocument:
    document_type:
      type: enum
      values: [invoice, payment_confirmation, credit_note, refund_confirmation, pending_bank_transfer]
      required: true
    visible_in_billing_history:
      type: boolean
      required: true
    download_ready:
      type: boolean
      default: false
    encrypted_pdf_ciphertext:
      type: encrypted_string
      nullable: true
      constraints: {plaintext_pdf: forbidden}

  UsageTokenBreakdown:
    input_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    output_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    system_prompt_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    user_input_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    app_skill_tokens:
      type: integer
      default: 0
      constraints: {minimum: 0, computed_as_input_remainder_when_visible: true}

assertions:
  - id: billing.access.authenticated-first-party
    type: security
    must: Billing balances, payment orders, invoices, refunds, and detailed usage are available only to authenticated first-party or approved SDK/CLI clients for the authorized billing subject.
    depends_on: [models.CreditBalance, models.CreditPurchase, models.BillingDocument, applies_to]
  - id: billing.credits.idempotent-charge
    type: invariant
    must: Paid work serializes balance mutations per personal or team billing subject, charges exactly once per immutable stable charge id under concurrent calls and retries, preserves the approved personal credit floor of -500, and never changes the balance when reservation or settlement fails.
    depends_on: [models.CreditBalance, models.CreditSettlement, examples.credit_charges, examples.settlement_concurrency]
  - id: billing.credits.encrypted-authority-cache-projection
    type: invariant
    must: The Vault-encrypted Directus balance and transactional charge ledger remain the durable billing authority; Dragonfly is the primary operational read, distributed-lock, deduplication-hint, and post-commit projection target, but cache loss or restart cannot lose or invent credits, charges, usage, or retry work.
    depends_on: [models.CreditBalance, models.CreditSettlement, examples.settlement_concurrency, examples.settlement_recovery]
  - id: billing.credits.retryable-completion-safe
    type: failure
    must: A retryable settlement conflict after paid work completes creates or reuses one durable pending settlement tied to the original charge id, retries asynchronously without duplicate deduction, and never regresses an already persisted or client-finalized assistant response to failed; exhausted retries become observable manual review.
    depends_on: [models.CreditSettlement, examples.settlement_recovery]
  - id: billing.credits.minimal-durable-io
    type: invariant
    must: A normal personal settlement uses cached plaintext balance state and one distributed subject lock, performs no pre-commit Directus balance read when the cache projection is valid, and commits encrypted balance, charge identity, and raw usage in one durable transaction; cache misses and conflict recovery may perform bounded durable reads.
    depends_on: [models.CreditBalance, models.CreditSettlement, examples.settlement_concurrency]
  - id: billing.anonymous.hard-capped-provider-metering
    type: security
    must: Unauthenticated official-cloud text chat and eligible non-connected-account app skills reserve a conservative per-operation quote before provider work, atomically enforce absolute per-identity and shared UTC daily, weekly, and monthly caps, settle actual usage without exceeding the quote, retain ambiguous provider attempts, use only server-HMAC identity counters, and reject file, connected-account, or unpriced work before provider dispatch.
    depends_on: [examples.credit_charges, applies_to]
  - id: billing.purchase.provider-routing
    type: behavior
    must: Credit purchases route to the configured Stripe card, Stripe managed payment, bank transfer, gift-card, or free-testing-credit path and only completed payment evidence grants credits.
    depends_on: [models.CreditPurchase, examples.credit_purchases]
  - id: billing.documents.visible-downloadable
    type: behavior
    must: Completed purchases and supported refunds create visible billing history rows, and generated PDF documents become downloadable only after encrypted document storage is ready.
    depends_on: [models.BillingDocument, examples.billing_documents]
  - id: billing.documents.storage-degradation-resilient
    type: behavior
    must: A completed purchase and its granted credits remain final when Hetzner Object Storage is transiently degraded; invoice storage retries every 10 minutes for up to 24 hours without repeating payment settlement, identifies Hetzner and the retry state in sanitized admin alerts, and sends a final actionable alert when retries are exhausted. Authentication, permission, bucket-configuration, and malformed-request failures remain classified as internal storage configuration errors and do not enter the degradation retry loop.
    depends_on: [models.CreditPurchase, models.BillingDocument, examples.storage_failures]
  - id: billing.bank-transfer.pending-visible
    type: behavior
    must: Pending bank-transfer references remain visible in billing history without requiring invoice-vault keys and settle only when processor evidence matches an active order reference.
    depends_on: [models.CreditPurchase, models.BillingDocument, examples.bank_transfers]
  - id: billing.usage.receipt-token-breakdown
    type: behavior
    must: Billing usage details show receipt-style token rows where system prompt, user input, and optional app-skill token sub-items reconcile with the total input token row for a chat usage entry.
    depends_on: [models.UsageTokenBreakdown, examples.usage_receipts]
  - id: billing.self-host.cloud-guard
    type: invariant
    must: Self-hosted builds do not expose cloud payment collection routes, workers, provider dependencies, or payment UI while preserving non-charging usage accounting.
    depends_on: [examples.self_host_guards, applies_to]
  - id: billing.surface.semantic-parity
    type: parity
    must: REST, CLI, npm SDK, pip SDK, web, and Apple billing usage surfaces preserve the same authorization, summary, detail, export, invoice, and usage semantics where that surface is implemented.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: true
    role: Authenticated settings, billing, and internal charge routes own the canonical server-side contract.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [credit_charges, settlement_concurrency, settlement_recovery, credit_purchases, billing_documents, storage_failures, bank_transfers, usage_receipts, self_host_guards]
