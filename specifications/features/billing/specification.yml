schema_version: 1
id: feature.billing
version: 9
status: draft
title: Billing And Payments
summary: >
  Authenticated OpenMates Cloud users can buy and spend credits, inspect usage,
  view billing documents, and request supported refunds while self-hosted builds
  keep cloud payment collection unavailable.

scope:
  includes:
    - Personal and team credit balance charging for paid work.
    - Weekly excess-storage quotes, exact settlement, unpaid-storage notices, and scoped expiration.
    - Accurate storage-price and retention disclosures matching enabled behavior.
    - Stripe card payments, Stripe managed payments, and SEPA bank-transfer orders.
    - Gift-card redemption and free-testing-credit grants.
    - Invoice, payment-confirmation, credit-note, and refund document visibility.
    - Billing usage overview, detail, export, and receipt-style token breakdowns.
    - Prospective cache-aware model tariffs and provider-reported token receipts.
    - First-party REST, CLI, SDK, web, and Apple semantic parity for billing usage surfaces.
    - Official-cloud anonymous virtual-budget admission and provider-operation settlement.
    - Public percentage of an identified guest's remaining daily anonymous allowance.
  excludes:
    - Provider-specific accounting outside persisted OpenMates usage rows.
    - External processor dashboard workflows not exposed through OpenMates.
    - Self-hosted cloud payment collection.

models:
  CreditBalance:
    subject:
      type: enum
      values: [personal, team]
      required: true
    encrypted_balance_before:
      type: encrypted_string
      required: false
      constraints: {plaintext: forbidden, required_for: personal}
    encrypted_balance_after:
      type: encrypted_string
      required: false
      constraints: {plaintext: forbidden, required_for: personal}
    charge_id:
      type: string
      required: true
      constraints: {idempotent: true, unique_per_committed_charge: true}

  CreditSettlement:
    charge_id:
      type: string
      required: true
      constraints: {immutable: true, globally_unique: true}
    state:
      type: enum
      values: [pending, committed, retry_scheduled, manual_review]
      required: true
    attempts:
      type: integer
      required: true
      constraints: {minimum: 0}
    durable_outbox_id:
      type: string
      nullable: true
    retryable_error_code:
      type: string
      nullable: true

  CreditPurchase:
    payment_source:
      type: enum
      values: [stripe_card, stripe_managed, bank_transfer, gift_card, free_testing_credit]
      required: true
    order_reference:
      type: string
      nullable: true
      constraints: {single_use_when_bank_transfer: true}
    status:
      type: enum
      values: [pending, completed, refunded, failed]
      required: true

  BillingDocument:
    document_type:
      type: enum
      values: [invoice, payment_confirmation, credit_note, refund_confirmation, pending_bank_transfer]
      required: true
    visible_in_billing_history:
      type: boolean
      required: true
    download_ready:
      type: boolean
      default: false
    encrypted_pdf_ciphertext:
      type: encrypted_string
      nullable: true
      constraints: {plaintext_pdf: forbidden}

  UsageTokenBreakdown:
    input_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    output_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    system_prompt_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    user_input_tokens:
      type: integer
      required: true
      constraints: {minimum: 1}
    app_skill_tokens:
      type: integer
      default: 0
      constraints: {minimum: 0, computed_as_input_remainder_when_visible: true}

  UsageLandingItem:
    origin:
      type: enum
      values: [chat, app, api_key, device, workflow, workflow_test, benchmark, incognito, unattributed]
      required: true
    description:
      type: localized_short_text
      required: true
      constraints: {identifies_billable_activity: true, identifies_context_without_fabricating_chat: true}
    total_credits:
      type: integer
      required: true
      constraints: {minimum: 0}
    entry_count:
      type: integer
      required: true
      constraints: {minimum: 1}
    navigation_target:
      type: enum
      values: [chat, app_usage, api_key_or_device_usage, workflow_usage, none]
      required: true
      constraints: {only_when_target_exists: true}

  AnonymousDailyAllowanceStatus:
    daily_remaining_percent:
      type: integer
      required: false
      nullable: true
      constraints: {minimum: 0, maximum: 100, exposes_credit_counts: false}

  TeamStorageWallet:
    hashed_team_id: {type: string, required: true}
    balance_credits: {type: integer, required: true, constraints: {minimum: 0, authoritative: true, financial_metadata: true}}
    balance_version: {type: integer, required: true, constraints: {minimum: 0, compare_and_swap: true}}
    encrypted_balance_snapshot: {type: encrypted_string, nullable: true, constraints: {client_managed: true, authoritative: false, may_lag_after_system_charge: true}}

assertions:
  - id: billing.access.authenticated-first-party
    type: security
    must: Billing balances, payment orders, invoices, refunds, and detailed usage are available only to authenticated first-party or approved SDK/CLI clients for the authorized billing subject.
    depends_on: [models.CreditBalance, models.CreditPurchase, models.BillingDocument, applies_to]
  - id: billing.credits.idempotent-charge
    type: invariant
    must: Paid work serializes balance mutations per personal or team billing subject, charges exactly once per immutable stable charge id under concurrent calls and retries, preserves the approved personal credit floor of -500, and never changes the balance when reservation or settlement fails.
    depends_on: [models.CreditBalance, models.CreditSettlement, examples.credit_charges, examples.settlement_concurrency]
  - id: billing.credits.personal-chat-admission
    type: behavior
    must: A normal first-party personal chat request checks a verified positive credit balance before paid processing, without reserving credits for its main model call. The admitted request may continue into personal overdraft down to -500 under the existing settlement rules. A new request at zero or a negative balance requires added credits before it can run. Missing or unreadable balance information is recovered from the encrypted billing authority or rejects paid processing without guessing available credits. Separate anonymous, Team, workflow and subchat budget rules remain in force.
    depends_on: [models.CreditBalance, examples.personal_chat_admission]
  - id: billing.credits.encrypted-authority-cache-projection
    type: invariant
    must: For personal wallets, the Vault-encrypted Directus balance and transactional charge ledger remain the durable billing authority. Team wallets retain their existing server-authoritative numeric balance, version and atomic credit ledger; an optional client-encrypted snapshot may lag after a system charge and cannot authorize spending or overwrite a concurrent debit. Dragonfly is the primary operational read, distributed-lock, deduplication-hint and post-commit projection target, but cache loss or restart cannot lose or invent credits, charges, usage or retry work.
    depends_on: [models.CreditBalance, models.CreditSettlement, models.TeamStorageWallet, examples.team_wallet]
  - id: billing.credits.retryable-completion-safe
    type: failure
    must: A retryable settlement conflict after paid work completes creates or reuses one durable pending settlement tied to the original charge id, retries asynchronously without duplicate deduction, and never regresses an already persisted or client-finalized assistant response to failed; exhausted retries become observable manual review.
    depends_on: [models.CreditSettlement, examples.settlement_recovery]
  - id: billing.credits.minimal-durable-io
    type: invariant
    must: A normal personal settlement uses cached plaintext balance state and one distributed subject lock, performs no pre-commit Directus balance read when the cache projection is valid, and commits encrypted balance, charge identity, and raw usage in one durable transaction; cache misses and conflict recovery may perform bounded durable reads.
    depends_on: [models.CreditBalance, models.CreditSettlement, examples.settlement_concurrency]
  - id: billing.anonymous.hard-capped-provider-metering
    type: security
    must: Unauthenticated official-cloud web chat, CLI chat, and app skills called from anonymous chat or the CLI may run while both the per-identity limit and shared server-wide UTC daily, weekly, and monthly credit limits have room. Eligible skills must be explicitly classified as account-free, return a final result within the request, and create no file or durable side effect. Every provider operation reserves a conservative quote atomically before work, settles no more than that quote, and retains ambiguous attempts; connected-account actions, account-owned data mutations, file uploads, file-generating skills, background jobs, and work without a safe cost quote are rejected before provider dispatch. Identity counters contain only server-HMAC values.
    depends_on: [examples.anonymous_free_use, applies_to]
  - id: billing.anonymous.paid-users-unaffected
    type: behavior
    must: Exhausting any shared anonymous daily, weekly, or monthly limit rejects further unauthenticated paid work, while an authenticated user with sufficient account credits may continue through normal account billing.
    depends_on: [examples.anonymous_paid]
  - id: billing.anonymous.daily-remaining-percent
    type: behavior
    must: The public anonymous free-usage status for an identified guest reports a whole-number daily_remaining_percent from 0 to 100, calculated from the smaller of that guest's remaining local-identity allowance, IP-identity allowance, and the server's remaining shared daily allowance, divided by the configured per-identity daily cap and rounded down. An absent guest identity yields no per-user percentage. The response exposes no credit counts, identity hashes, or other guests' usage.
    depends_on: [models.AnonymousDailyAllowanceStatus, examples.anonymous_remaining_percentage]
  - id: billing.anonymous.local-only-content
    type: privacy
    must: Before signup, anonymous chat and eligible app-skill content and result embeds remain transient on the server and may be stored only in the client's anonymous scope. File-generating skills require authentication. Directus receives no permanent chat, message, embed, or upload-file records for anonymous requests. Anonymous budget counters and operation reservations may be stored without content.
    depends_on: [examples.anonymous_storage]
  - id: billing.purchase.provider-routing
    type: behavior
    must: Credit purchases route to the configured Stripe card, Stripe managed payment, bank transfer, gift-card, or free-testing-credit path and only completed payment evidence grants credits.
    depends_on: [models.CreditPurchase, examples.credit_purchases]
  - id: billing.documents.visible-downloadable
    type: behavior
    must: Completed purchases and supported refunds create visible billing history rows, and generated PDF documents become downloadable only after encrypted document storage is ready.
    depends_on: [models.BillingDocument, examples.billing_documents]
  - id: billing.documents.storage-degradation-resilient
    type: behavior
    must: A completed purchase and its granted credits remain final when Hetzner Object Storage is transiently degraded; invoice storage retries every 10 minutes for up to 24 hours without repeating payment settlement, identifies Hetzner and the retry state in sanitized admin alerts, and sends a final actionable alert when retries are exhausted. Authentication, permission, bucket-configuration, and malformed-request failures remain classified as internal storage configuration errors and do not enter the degradation retry loop.
    depends_on: [models.CreditPurchase, models.BillingDocument, examples.storage_failures]
  - id: billing.bank-transfer.pending-visible
    type: behavior
    must: Pending bank-transfer references remain visible in billing history without requiring invoice-vault keys and settle only when processor evidence matches an active order reference.
    depends_on: [models.CreditPurchase, models.BillingDocument, examples.bank_transfers]
  - id: billing.usage.receipt-token-breakdown
    type: behavior
    must: Billing usage details show receipt-style token rows where system prompt, user input, and optional app-skill token sub-items reconcile with total input. For an enabled and verified cache tariff, a separate saved receipt partitions input into ordinary input, cache reads and cache writes, prices output including provider-reported billable thinking, and records the actual debit using the rates frozen for each incurred provider attempt. Absent cache counters remain unavailable, never guessed; cumulative events for one attempt are billed once. Category credits plus the displayed rounding or cap adjustment reconcile to the committed debit. Deferred settlements show pending and zero debited until commitment. Composition rows remain a separate view and do not add another charge; older usage and inactive tariffs preserve their existing debit.
    depends_on: [models.UsageTokenBreakdown, examples.cache_usage_receipts]
  - id: billing.usage.landing-complete
    type: invariant
    must: The Usage landing page represents every committed usage entry for the authorized billing subject exactly once, either individually or in a clearly labeled non-overlapping group; shows a concise localized description, entry count, and credits for chat, standalone app, API-key, device, workflow, workflow-test, benchmark, incognito, and otherwise unattributed usage; links only to contexts that actually exist; and makes each displayed day total equal the sum of its displayed items without double-counting app work already attributed to a chat or another context.
    depends_on: [models.UsageLandingItem, examples.usage_landing]
  - id: billing.self-host.cloud-guard
    type: invariant
    must: Self-hosted builds do not expose cloud payment collection routes, workers, provider dependencies, or payment UI while preserving non-charging usage accounting.
    depends_on: [examples.self_host_guards, applies_to]
  - id: billing.surface.semantic-parity
    type: parity
    must: REST, CLI, npm SDK, pip SDK, web, and Apple billing usage surfaces preserve the same authorization, summary, detail, export, invoice, and usage semantics where that surface is implemented.
    depends_on: [models, examples, applies_to]

  - id: billing.storage.logical-usage
    type: invariant
    must: Additional customer S3 archive pages, large payloads, old artifact versions and snapshots, and sole durable sealed recovery outputs are measured from complete authoritative owner and size metadata once per logical object. Regional replicas, repeated references, temporary migration or rollback copies, and system records do not multiply the customer bill. Missing or conflicting size or ownership pauses billing. Existing uploaded-file measurement and payer remain compatible during the initial migration; operational physical-byte accounting remains separate.
    depends_on: [examples.storage_usage]
  - id: billing.storage.weekly-quote
    type: behavior
    must: Each personal account and each Team has its own separate free allowance of 1 GiB (1073741824 bytes), then costs 3 credits for each started additional GiB per weekly period scheduled Sunday at 03:00 UTC. Team storage uses its Team credit wallet and cannot consume a member's personal allowance or credits. Settings and settlement use the same authoritative usage categories and policy, with the measurement time visible; retries may settle later without changing the frozen period quote.
    depends_on: [examples.storage_weekly]
  - id: billing.storage.exact-settlement
    type: invariant
    must: Each weekly period freezes payer, measured bytes and categories, allowance and rate policy, amount, measurement time, and immutable charge identity. Concurrent calls and retries commit at most one complete debit under the existing credit-floor rules. Only authoritative full settlement marks the period paid; partial results, scheduled retries, and operational failures do not clear outstanding debt or advance nonpayment notices. Billing-disabled editions neither charge nor warn nor expire unpaid storage.
    depends_on: [models.CreditSettlement, examples.storage_settlement]
  - id: billing.storage.four-warning-expiry
    type: security
    must: Unpaid-storage expiration requires four provider-confirmed delivered payer-level weekly email warnings at least seven days apart, a notified deadline no earlier than 28 days after the first delivery and seven days after the fourth, and a final authoritative payment and eligibility check. Each email identifies the frozen affected-data list through an authenticated account link, states the earliest deletion date, and explains how to pay, reduce storage, or export it; submission acceptance or an email open alone is not proof of delivery. A successful payment cancels expiration; outages, uncertain delivery, active writers, or protected references defer it. Only notified chargeable data under that payer's deletion authority may expire; free account metadata and another owner or Team's content are preserved. Automatic expiry remains disabled until the approved selection policy, immutable notice membership, final payment and reference fences, and disposable integrated evidence are implemented.
    depends_on: [examples.storage_warning]
  - id: billing.storage.legacy-cutover-safe
    type: invariant
    must: Transitioning from uploaded-file billing to immutable weekly periods must not charge the same storage twice for an overlapping legacy billing period. Authoritative committed, pending, or uncertain legacy attempts defer the new period without falsely marking it paid, changing existing debt, or sending a nonpayment warning. Legacy workers are drained before the new task is activated, and incomplete ledger checks defer billing.
    depends_on: [examples.storage_cutover]
  - id: billing.storage.personal-expiry-selection
    type: security
    must: Personal automatic expiry considers only complete independently removable units frozen in a warned unpaid period, in stable oldest-completed-first order, and stops once logical storage is at or below the 1 GiB allowance. A unit is an independently removable upload, an old artifact history dependency unit, or a complete archived chat graph; no page or dependent history fragment is removed alone. Team or shared data, active writers, sole sealed recovery copies, changed or ambiguous ownership or references, and units covered by a later paid period stay protected. If no safe selection can reach the allowance, expiry holds without deleting a partial graph. Notices name the fixed eligible units before their four-delivery clock starts.
    depends_on: [examples.storage_expiry_selection]
  - id: billing.storage.expiry-invoice-closure
    type: invariant
    must: After verified safe expiry removes the selected last customer references and current measured storage is at or below the free allowance, only the warned unpaid episode is closed as waived_on_expiry with an immutable audit of units and periods. It is never reported paid and does not debit credits; already paid periods and later unnotified debt remain unchanged. Debt remains unchanged when no eligible unit was removed, removal or final measurement is incomplete, or the affected units are protected by later payment. Later excess storage starts a new billing episode.
    depends_on: [examples.storage_expiry_closure]
  - id: billing.storage.disclosures
    type: behavior
    must: Rendered terms and privacy disclosures accurately state enabled storage categories, measurement, price, allowance, schedule, warning and deletion criteria, and encryption boundaries. They distinguish server-readable Vault-encrypted AI context from client-encrypted durable storage and client-public-key-sealed recovery, do not promise immediate physical regional purge or an unsupported backup service, and do not describe inactive expanded billing or recovery retention as already enabled. Canonical privacy text and rendered translation sources agree.
    depends_on: [examples.storage_disclosures]
  - id: billing.storage.team-policy-gate
    type: security
    must: Team-owned storage is measured once under its Team ownership and settles only from that Team's existing wallet through an authenticated trusted system transaction tied to an immutable weekly invoice. Its separate 1 GiB allowance and 3-credit-per-started-excess-GiB weekly policy remain independent of every member and other Team. Team credit balances cannot become negative, and failed or partial settlement never marks an invoice paid. Existing uploaded-file payer attribution is preserved during the initial migration; membership, imported financial fields and repeated references cannot reassign charges or charge the same new logical object to multiple subjects. Team charging and expiry activate only after their scoped integrated verification passes.
    depends_on: [examples.storage_team]

  - id: billing.storage.team-warning-expiry
    type: security
    must: Team unpaid-storage warnings reach the current owner and all current admins. Each complete warning round requires provider-confirmed delivery to every required recipient, with four weekly rounds at least seven days apart and deletion no earlier than the notified deadline, 28 days after the first complete round and seven days after the fourth. Unresolved contacts, failed deliveries or a changed recipient set without the required notice history hold expiry. Only specifically warned complete independently removable Team units may expire, oldest first and only enough to reduce current logical usage to the Team's 1 GiB allowance. Active work, sole recovery copies, required references outside the selected unit, including personal or other-Team references, ambiguous ownership or generations, and later-paid units remain protected. A final authoritative Team-wallet/payment, membership, complete-usage and reference check is required; when no safe selection can reach the allowance, nothing is deleted or waived. Only verified expiry may waive the exact warned unpaid episode; personal data, paid periods and later unnotified Team debt remain unaffected.
    depends_on: [models.TeamStorageWallet, examples.team_storage_warning]

applies_to:
  rest_api:
    required: true
    role: Authenticated settings, billing, and internal charge routes own the canonical server-side contract.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [credit_charges, settlement_concurrency, settlement_recovery, credit_purchases, billing_documents, storage_failures, bank_transfers, usage_receipts, usage_landing, self_host_guards, storage_usage, storage_weekly, storage_settlement, storage_warning, storage_disclosures, storage_team, storage_cutover, storage_expiry_selection, storage_expiry_closure]
