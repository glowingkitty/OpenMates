schema_version: 1
specification: feature.billing@9

anonymous_free_use:
  - id: web-and-cli-share-the-same-allowance
    given: A guest has room under their identity limit and the server's daily, weekly, and monthly free credit limits.
    when: They ask the web chat to search for events, send a CLI chat, and use the CLI to search the web directly.
    then: Each request may run after its provider cost is reserved from the same anonymous allowance, and only settled cost remains consumed.
  - id: any-limit-stops-provider-work
    given: A guest has used their identity allowance or the server has exhausted its daily, weekly, or monthly free credit limit.
    when: They request another chat or an account-free CLI search skill.
    then: The server rejects it before any provider call and offers account signup.

anonymous_paid:
  - id: account-credits-work-after-free-pool-is-empty
    given: The server's anonymous monthly allowance is exhausted and a signed-in user has enough account credits.
    when: A guest and that signed-in user each request a chat.
    then: The guest request is rejected, and the signed-in user's request can run against their own account credits.

anonymous_remaining_percentage:
  - id: remaining-allowance-follows-tightest-daily-limit
    given: A guest has a daily allowance of 100 credits, has used 25 on this device and 40 from this IP, while 70 remain in the server's shared daily pool.
    when: The guest checks their anonymous free-usage status.
    then: The public response reports 60% remaining, without reporting credit counts or identity hashes.
  - id: no-guest-identity-has-no-personal-percentage
    given: A visitor has not supplied a guest identity.
    when: They check the public anonymous free-usage status.
    then: The response gives no personal daily remaining percentage.

anonymous_storage:
  - id: guest-chat-and-skill-results-stay-local
    given: A guest has not signed up and can use chat and account-free search skills.
    when: They receive a chat skill result displayed as an embed, search the web through the CLI, and attempt to generate an image.
    then: The image request requires authentication before provider work; Directus holds only anonymous budget and operation records, with no permanent chat, message, embed, or upload-file record for the guest.

credit_charges:
  - id: personal-ai-charge
    given: A signed-in user has 20 personal credits and sends an ordinary chat request.
    when: The provider reports usage costing 17 credits and settlement is retried for the same request.
    then: The main model call uses no credit hold, exactly 17 credits are deducted once, and the balance is 3 credits.
  - id: team-member-charge
    subject: team
    charge_id: team-chat-turn-1
    settled_credits: 9
    expect: {team_balance_charged: true, personal_balance_untouched: true}
  - id: approved-personal-overdraft
    given: A signed-in user has 5 personal credits when their ordinary chat request starts.
    when: That request's completed model and tool usage costs 12 credits.
    then: The request is charged once and the balance becomes -7 credits, with the existing -500 credit floor preserved.

personal_chat_admission:
  - id: admitted-request-can-overdraw-next-request-cannot
    given: A signed-in user has 5 personal credits.
    when: They send a chat request that costs 12 credits and then send a follow-up before buying more credits.
    then: The first request runs without a main-model credit hold and leaves -7 credits; the follow-up is rejected before paid processing until credits are added.
  - id: missing-cache-balance-requires-encrypted-recovery
    given: The user's cached credit balance is missing and their encrypted billing record holds zero credits.
    when: They send a new personal chat request.
    then: The server recovers the encrypted balance and rejects paid processing; it never assumes a positive balance or creates a main-model credit hold.

settlement_concurrency:
  - id: distinct-parallel-tool-charges
    subject: personal
    concurrent_charge_ids: [turn-1-web-1, turn-1-web-2, turn-1-images-1]
    expect: {serialized_per_subject: true, every_charge_committed_once: true, user_visible_conflict: false}
  - id: concurrent-identical-replay
    subject: personal
    concurrent_charge_ids: [turn-1-main, turn-1-main, turn-1-main]
    expect: {one_deduction: true, one_raw_usage_row: true, identical_result_returned: true}
  - id: valid-cache-projection
    subject: personal
    cache_state: valid
    expect: {directus_balance_read_before_commit: false, durable_commit_transactions: 1}
  - id: cache-miss-recovery
    subject: personal
    cache_state: missing
    expect: {directus_balance_reads: 1, cache_rebuilt: true, durable_commit_transactions: 1}

settlement_recovery:
  - id: conflict-after-response-persistence
    charge_id: turn-1-main
    settlement_error: stale_credit_balance
    response_state: persisted
    expect: {durable_retry_scheduled: true, response_failed: false, original_charge_id_reused: true}
  - id: worker-crash-after-commit
    charge_id: turn-2-main
    failure_point: after_commit_before_ack
    expect: {replay_returns_original: true, duplicate_deduction: false, duplicate_usage: false}
  - id: retry-budget-exhausted
    charge_id: turn-3-main
    settlement_state: retry_scheduled
    expect: {manual_review_visible: true, response_failed: false, charge_identity_preserved: true}

credit_purchases:
  - id: stripe-card-credits
    payment_source: stripe_card
    status: completed
    expect: {credits_granted: true, invoice_created: true}
  - id: stripe-managed-credits
    payment_source: stripe_managed
    status: completed
    expect: {credits_granted: true, payment_confirmation_created: true}
  - id: gift-card-redemption
    payment_source: gift_card
    status: completed
    expect: {credits_granted: true, card_single_use_when_configured: true}
  - id: free-testing-credit-grant
    payment_source: free_testing_credit
    status: completed
    expect: {budget_decremented: true, not_counted_as_sold_credits: true}

billing_documents:
  - id: invoice-ready
    document_type: invoice
    visible_in_billing_history: true
    download_ready: true
    expect: {download_content_type: application/pdf}
  - id: managed-payment-confirmation
    document_type: payment_confirmation
    visible_in_billing_history: true
    download_ready: true
    expect: {refund_action_available_when_unused: true}
  - id: refund-confirmation
    document_type: refund_confirmation
    visible_in_billing_history: true
    download_ready: true
    expect: {email_pdf_attachment: true}

storage_failures:
  - id: hetzner-transient-degradation
    payment_status: completed
    credits_granted: true
    storage_provider: hetzner_object_storage
    failure: timeout_or_429_or_5xx
    expect:
      payment_settlement_repeated: false
      retry_interval_minutes: 10
      retry_window_hours: 24
      admin_alert_classification: external_provider_degraded
      final_alert_after_exhaustion: true
  - id: storage-configuration-failure
    payment_status: completed
    credits_granted: true
    storage_provider: hetzner_object_storage
    failure: authentication_or_permission_or_bucket_or_malformed_request
    expect:
      payment_settlement_repeated: false
      degradation_retry_scheduled: false
      admin_alert_classification: internal_storage_configuration

bank_transfers:
  - id: pending-credit-transfer
    payment_source: bank_transfer
    status: pending
    order_reference: OM-ABCD-1234
    expect: {visible_without_invoice_vault_key: true, grants_credits: false}
  - id: confirmed-team-transfer
    payment_source: bank_transfer
    status: completed
    order_reference: OM-TEAM-1234
    expect: {team_credits_granted: true, personal_credits_untouched: true}

usage_receipts:
  - id: simple-chat-turn
    input_tokens: 1200
    output_tokens: 180
    system_prompt_tokens: 1150
    user_input_tokens: 50
    app_skill_tokens: 0
    expect: {sub_items_sum_to_input: true}
  - id: app-skill-chat-turn
    input_tokens: 15000
    output_tokens: 900
    system_prompt_tokens: 1200
    user_input_tokens: 80
    app_skill_tokens: 13720
    expect: {sub_items_sum_to_input: true, app_skill_hint_visible: true}

cache_usage_receipts:
  - id: verified-cache-read-with-frozen-price
    given: A Mistral chat request reports 5,740 input tokens, including 4,760 cache reads, and 155 output tokens. Its active saved prices are 490 ordinary input tokens, 4,760 cache-read tokens, and 155 output tokens per credit.
    when: The request settles and the user opens its usage receipt after model prices have changed.
    then: The receipt still shows two credits for 980 ordinary input tokens, one credit for 4,760 cache-read tokens, and one credit for output, totaling four debited credits. Cache writes are included in ordinary input, and the separate input-composition view adds no charge. Missing write counters are shown as unavailable rather than invented.
  - id: deferred-charge-is-not-a-debit
    given: A completed chat has a saved category calculation of 40.5 credits and a 40-credit settlement request, but a temporary transaction conflict defers the charge.
    when: The client receives the final answer and the durable retry later commits.
    then: The initial receipt shows pending, zero debited credits and 40 requested credits. The committed receipt shows 40 debited credits and a minus 0.5-credit adjustment, and replay never deducts those credits again.

usage_landing:
  - id: interrupted-recording-without-chat
    given: A user records eleven seconds of audio, the provider accepts the stream, and the user cancels before any chat is created.
    when: The user opens the Usage landing page after the eight-credit charge commits.
    then: Today's list includes one Audio — Get Transcript item described as an interrupted recording billed for one started minute, shows eight credits, contributes eight credits to the day total, and offers no chat link.
  - id: mixed-context-day-reconciles-once
    given: One day contains paid chat and incognito turns, a standalone app call, API-key and device calls, a workflow run and test, a benchmark, and one legacy charge whose original context no longer exists.
    when: The user opens the Usage landing page.
    then: Every committed charge is represented exactly once in a concise context-labeled row or group, the visible rows sum to the displayed day total, app work already included in a chat is not repeated as standalone app usage, and only rows with real destinations are navigable.

self_host_guards:
  - id: self-host-no-cloud-payments
    deployment: self_hosted
    expect: {payment_routes_registered: false, cloud_billing_workers_started: false, usage_accounting_available: true}

storage_usage:
  - id: regional-copies-and-references-count-once
    given: A customer's encrypted archive page is 256 KiB and has two regional copies and three authorized references.
    when: Their authoritative storage quote is calculated.
    then: That page contributes 256 KiB once, while provider capacity metrics separately include the regional copies.
  - id: unknown-owner-does-not-become-a-guessed-bill
    given: An archived version has no reliable stored size or has conflicting owner metadata.
    when: A weekly charge is attempted.
    then: The affected quote is incomplete and no guessed charge or unpaid-storage warning is issued.

storage_weekly:
  - id: free-tier-and-started-gib-rounding
    given: A personal account and each of two separate Teams have eligible storage measured independently at 1 GiB, 1.1 GiB or 2.5 GiB.
    when: Their weekly storage quotes are viewed and settled.
    then: Each subject independently receives its own 1 GiB free allowance and a quote of 0, 3 or 6 credits; Team charges use only that Team wallet.
  - id: later-retry-preserves-first-period-measurement
    given: A personal or Team weekly invoice is frozen on Sunday at 2.5 GiB and 6 credits, and the payer deletes some files while settlement is pending.
    when: That same invoice is retried on Monday.
    then: Its original measurement and stable 6-credit charge remain unchanged; the next period reflects the new usage.
storage_settlement:
  - id: concurrent-complete-debit-and-pending-retry
    given: Two jobs attempt the same frozen 6-credit weekly storage charge and one returns a scheduled retry before confirmation.
    when: Authoritative settlement eventually succeeds.
    then: Exactly 6 credits are deducted once, and the period becomes paid only after that complete committed result.
  - id: incomplete-or-disabled-charge-cannot-start-dunning
    given: A settlement service returns only 2 of the required 6 credits, or the deployment has paid billing disabled.
    when: The weekly storage job examines that outcome.
    then: A partial result is not reported as paid and creates no nonpayment warning; the billing-disabled deployment performs no charge, warning, or expiration.

storage_warning:
  - id: four-notices-and-final-payment
    given: An unpaid payer receives four emails naming the same eligible storage units, confirmed delivered on days 0, 7, 14, and 21, with a deletion deadline on day 28.
    when: They add enough credits before the final day-28 payment check.
    then: The outstanding charges settle and expiration is canceled; no fifth-day or fourth-warning immediate deletion occurs.
  - id: delayed-notice-or-protected-data-stays-safe
    given: The fourth warning is delivered late on day 24, or the final check finds a storage outage or content still required by another authorized owner.
    when: Expiration is evaluated on day 28.
    then: Late delivery postpones the deadline to at least day 31, and operational errors or protected references leave the affected data intact.

storage_disclosures:
  - id: public-copy-matches-active-storage-policy
    given: Only uploaded-file billing is enabled and recovery outputs still have the active protocol's limited retention.
    when: A customer reads the public terms and privacy policy.
    then: They see the actual allowance and weekly storage price, applicable file-retention notices, distinct Vault and client encryption, and no promise that inactive archive billing or indefinite recovery is enabled.
  - id: supported-retention-and-regional-erasure
    given: There is no user-retrievable 60-day export-backup service and regional object deletion completes asynchronously.
    when: The policy is updated.
    then: It removes the unsupported backup promise and explains authorized references and verified regional deletion without promising instant physical purge.

storage_team:
  - id: team-wallet-and-independent-allowance
    given: Team A stores 2.5 GiB, Team B stores 1 GiB, and a member also has personal storage.
    when: Complete weekly quotes are settled through the trusted system invoice path.
    then: Team A pays 6 credits from its own wallet and Team B pays zero; neither Team consumes the member's personal allowance or credits, and an insufficient Team balance leaves its invoice unpaid without becoming negative.
  - id: existing-upload-payer-does-not-silently-migrate
    given: A Team member previously uploaded a file billed under their personal account.
    when: Additional Team archive metering is introduced.
    then: That upload retains its existing payer during the initial migration and is never billed to both the personal account and the Team.
storage_cutover:
  - id: already-charged-upload-is-not-charged-again
    given: The old weekly job charged an uploaded file on Sunday, and the new storage billing job is installed on Monday.
    when: The new job examines that overlapping billing period.
    then: It finds the durable legacy charge and defers the new period; no second debit, false paid invoice, or warning is created.
  - id: uncertain-ledger-defers-new-billing
    given: A legacy storage settlement is still pending, or its authoritative ledger cannot be read.
    when: The new weekly job starts.
    then: The new period is deferred until a future clear billing boundary rather than guessing that no earlier charge exists.

storage_expiry_selection:
  - id: expire-only-the-old-safe-unit
    given: A personal account uses 1 GiB in an active chat and 0.4 GiB in a completed unshared old artifact history unit named in four delivered notices; no later paid period covers that unit.
    when: The notified deadline arrives and the final payment, ownership, and reference checks still permit expiry.
    then: Only the old 0.4 GiB unit expires, bringing usage to the free allowance; the active chat and account metadata remain available.
  - id: protected-unit-or-fragment-does-not-expire
    given: An old unit is still used by a Team or a later paid period, or reaching the allowance would require deleting only part of a dependent chat graph.
    when: Automatic expiry selects data.
    then: Those units remain intact and expiry holds when no complete safe selection can reach the allowance.

storage_expiry_closure:
  - id: verified-removal-closes-only-warned-debt
    given: A warned unpaid episode contains two weekly invoices, and verified safe removal has reduced current storage to 1 GiB.
    when: The expiry operation completes.
    then: Those warned unpaid invoices are recorded as waived_on_expiry with their removed-unit audit; no credits are deducted and paid or later unnotified invoices are unchanged.
  - id: failed-removal-cannot-forgive-debt
    given: Removal is interrupted, final usage cannot be measured, or no eligible unit was removed.
    when: The expiry job retries.
    then: It resumes the same immutable operation and leaves debt unchanged until verified removal and the allowance check complete.

team_wallet:
  - id: system-debit-uses-current-team-ledger
    given: A Team wallet has an authoritative balance of 20 credits at version 4 and an older optional client-encrypted balance snapshot.
    when: A trusted weekly storage transaction commits its immutable 3-credit invoice.
    then: The Team wallet becomes 17 credits at version 5 with one credit and usage event; the old encrypted snapshot cannot replace that balance, and no member is invented as the actor.
  - id: stale-client-update-cannot-undo-storage-charge
    given: A client prepared a wallet update at version 4 while a storage charge committed version 5.
    when: The stale client update or the same storage charge is retried.
    then: The stale update conflicts and must refresh, the storage retry returns the prior settlement without another debit, and personal wallet balances remain unchanged.

team_storage_warning:
  - id: complete-manager-notices-and-safe-subset
    given: A Team owner and all current admins receive provider-confirmed warnings for the same safe affected units on days 0, 7, 14 and 21, with the notified deadline on day 28.
    when: The Team is still unpaid on day 28 and final payment, membership, usage and reference checks pass.
    then: Only enough oldest complete warned Team units expire to reach its 1 GiB allowance; other owners' data and later paid or unnotified periods remain intact, and only the exact warned episode is waived after verified removal.
  - id: unresolved-manager-or-new-admin-holds-expiry
    given: An admin's warning delivery is unconfirmed, or a newly appointed admin has not received the required warning history, or a warned unit is still needed by active work or another owner.
    when: Team expiry is evaluated at the apparent deadline.
    then: The incomplete notice or reference proof holds expiry; no partial unit is deleted, no personal credit is debited, and no debt is falsely marked paid or waived.
