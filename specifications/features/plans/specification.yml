schema_version: 1
id: feature.plans
version: 1
status: draft
title: Plans
summary: >
  Plans are encrypted, approval-bound coordination records that propose and
  execute bounded changes through assumptions, success criteria, linked Tasks,
  and linked reusable Checks while guarding against scope drift.

purpose:
  outcomes:
    - Turn complex requests into reviewable and resumable work without duplicating Specification truth.
    - Give users one stable editable Plan URL and explicit control over material scope.
    - Keep agents working until required assumptions, Tasks, and Checks are honestly resolved.

scope:
  includes:
    - Draft creation after bounded research and clarification for bug fixes, features, and non-code projects.
    - Goal is required. Assumptions, Tasks, and Checks are recommended; scope, references, decisions, risks, context, activity, and other planning sections are optional.
    - Optional Specification links for ordinary user Plans and required Specification discovery/linking for governed implementation work when a matching Specification exists.
    - Exact revision approval through a stable Plan URL, browser editing, undo, save-and-approve, and automatic waiting-agent continuation.
    - Separate approval and execution state so approval remains understandable throughout assumption checking, execution, and reapproval.
    - Tasks as the only executable work units; optional phases are presentation groups and never duplicate Task status or create recursive Plan steps.
    - Completion gates only for present fields explicitly marked required or required by a governing Specification; failed required Checks create or propose follow-up Tasks.
    - Client-encrypted content, contextual key wrappers, Project/chat links, short-lived active execution context, and REST/CLI/SDK/web parity.
  excludes:
    - Copying complete Specification Requirements, user flows, or models into a Plan when exact references are available.
    - Recursive subtasks, a second Plan-step execution engine, or embedded task status owned by the Plan.
    - Owning reusable Check definitions, Check Run history, or raw test artifacts inside Plan records.
    - Owning canonical product user-flow or edge-case definitions when a governing Specification exists; Plans reference exact Specification flow ids and the reusable Checks that must pass.
    - Reapproval for non-material implementation detail, Task splitting, equivalent refactoring, stronger proof, or follow-up debugging within approved scope.
    - Automatic production, payment, destructive, credential, or external-account authority from ordinary Plan approval.

relationships:
  related_specifications: [feature.specifications, feature.checks, feature.tasks, feature.projects]
  specification_link_policy: >
    Specification linking is optional for general user Plans. Agents implementing a
    governed product or Project must search for applicable Specifications and link
    exact revisions, Requirements, and flows when found; a new or amended Specification is required when
    the Plan intentionally changes durable product truth.

actors:
  - id: plan_author
    role: User or agent that drafts and refines the Plan before approval.
  - id: plan_approver
    role: User who approves an exact Plan revision or requests more refinement.
  - id: task_executor
    role: Human or agent that performs linked Tasks under the approved scope.
  - id: check_runner
    role: Automated, AI, or human actor that produces a linked Check Run.

models:
  PlanRecord:
    plan_id: {type: stable_id, required: true}
    current_revision_id: {type: stable_id, required: true}
    approval_state: {type: enum, values: [draft, approved, reapproval_required, rejected], required: true}
    execution_state: {type: enum, values: [not_started, checking_assumptions, ready, executing, running_checks, blocked, completed, cancelled], required: true}
    primary_chat_id: {type: chat_id_or_null, nullable: true, constraints: {required_when_execution_state: [checking_assumptions, ready, executing, running_checks, blocked]}}
    linked_project_hashes: {type: hashed_id_list, nullable: true}
    encrypted_linked_project_ids: {type: client_ciphertext_or_null, nullable: true, constraints: {raw_project_ids_plaintext: forbidden}}
    version: {type: integer, required: true, constraints: {monotonic_server_authoritative: true}}

  PlanRevision:
    revision_id: {type: stable_id, required: true}
    revision_number: {type: integer, required: true, constraints: {monotonic: true}}
    content_hash: {type: sha256_hex, required: true}
    change_class: {type: enum, values: [initial, non_material, material], required: true}
    encrypted_plan_document: {type: client_ciphertext, required: true}

  PlanPrivateContent:
    encrypted_title: {type: client_ciphertext_or_null, nullable: true}
    encrypted_goal: {type: client_ciphertext, required: true}
    encrypted_scope_in: {type: client_ciphertext_or_null, nullable: true}
    encrypted_scope_out: {type: client_ciphertext_or_null, nullable: true}
    encrypted_open_questions: {type: client_ciphertext_or_null, nullable: true}
    encrypted_decisions: {type: client_ciphertext_or_null, nullable: true}
    encrypted_risks: {type: client_ciphertext_or_null, nullable: true}

  PlanSpecificationLink:
    specification_id: {type: semantic_specification_id, required: true, constraints: {format_example: feature.plans}}
    specification_revision: {type: exact_specification_version_or_hash, required: true, constraints: {immutable: true}}
    requirement_ids: {type: stable_id_list, nullable: true}
    flow_ids: {type: stable_id_list, nullable: true, constraints: {references_specification_owned_user_flows_or_edge_cases: true}}
    relation: {type: enum, values: [implements, restores, changes, depends_on], required: true}

  PlanAssumption:
    assumption_id: {type: stable_id, required: true}
    status: {type: enum, values: [unchecked, checking, confirmed, corrected, contradicted, blocked, waived], required: true}
    required_before: {type: enum, values: [implementation, task_execution, completion, never], required: true}
    encrypted_statement: {type: client_ciphertext, required: true}
    encrypted_correction: {type: client_ciphertext_or_null, nullable: true}
    encrypted_sources: {type: client_ciphertext_or_null, nullable: true}
    source_proof_count: {type: integer, required: true}

  PlanCriterion:
    criterion_id: {type: stable_id, required: true}
    required: {type: boolean, required: true, constraints: {completion_gate_only_when_true: true}}
    status: {type: enum, values: [pending, satisfied, failed, waived], required: true}
    coverage_status: {type: enum, values: [uncovered, covered, ambiguous, blocked, waived], required: true}
    encrypted_statement: {type: client_ciphertext, required: true}

  PlanTaskLink:
    task_id: {type: stable_id, required: true}
    phase_id: {type: stable_id_or_null, nullable: true, constraints: {presentation_group_only: true}}
    position: {type: integer, required: true}
    dependency_task_ids: {type: stable_id_list, nullable: true, constraints: {recursive_children: forbidden}}
    head_selection: {type: derived_order, required: true, constraints: {precedence: [position, created_at, task_id], persisted_current_task_pointer: forbidden}}

  PlanCheckLink:
    check_id: {type: stable_id, required: true}
    check_revision_id: {type: stable_id, required: true}
    subject_revision: {type: immutable_revision_reference, required: true}
    criterion_ids: {type: stable_id_list, required: true}
    required_for_completion: {type: boolean, required: true, constraints: {completion_gate_only_when_true: true}}
    latest_run_id: {type: stable_id_or_null, nullable: true}
    latest_run_check_revision_id: {type: stable_id_or_null, nullable: true, constraints: {must_equal_referenced_latest_run_check_revision: true}}
    latest_run_subject_revision: {type: immutable_revision_reference_or_null, nullable: true, constraints: {must_equal_referenced_latest_run_subject_revision: true}}
    latest_run_status: {type: enum_or_null, values: [passed, failed, error, cancelled, skipped, waived], nullable: true, constraints: {must_equal_referenced_latest_run_status: true}}
    freshness: {type: enum, values: [missing, current, stale], required: true, constraints: {derived_from_referenced_latest_run: true, current_requires_latest_run_check_revision_equals_check_revision: true, current_requires_latest_run_subject_revision_equals_subject_revision: true}}

  PlanReferencePattern:
    pattern_id: {type: stable_id, required: true}
    status: {type: enum, values: [proposed, required, inspected, matched, drift_detected, waived, blocked], required: true}
    required_before: {type: enum, values: [implementation, task_execution, completion, never], required: true}
    encrypted_sources: {type: client_ciphertext_or_null, nullable: true}
    encrypted_match_rules: {type: client_ciphertext_or_null, nullable: true}

  PlanLearning:
    learning_id: {type: stable_id, required: true}
    status: {type: enum, values: [draft, proposed, accepted, applied, rejected, duplicate, merged], required: true}
    encrypted_title: {type: client_ciphertext, required: true}
    encrypted_task_draft: {type: client_ciphertext_or_null, nullable: true, constraints: {one_suggested_task_draft: true}}

  PlanKeyWrapper:
    key_type: {type: enum, values: [master, chat, project, plan, team], required: true}
    encrypted_plan_key: {type: wrapped_content_key, required: true, constraints: {raw_key: forbidden}}
    hashed_context_id: {type: hashed_id_or_null, nullable: true}

  PlanExecutionContext:
    vault_encrypted_context: {type: vault_ciphertext, required: true, constraints: {durable_directus_plaintext: forbidden}}
    hashed_primary_chat_id: {type: hashed_id, required: true}
    expires_at: {type: timestamp, required: true}

assertions:
  - id: plans.content.client-encrypted
    type: privacy
    must: Durable Plan revisions, assumptions, criteria, links, decisions, risks, references, and private metadata remain client-encrypted; server-visible fields are limited to safe ids, hashes, state, routing, version, and timestamps.
    depends_on: [models.PlanRevision, models.PlanPrivateContent, models.PlanAssumption, models.PlanCriterion, examples.plan_private_content]
  - id: plans.lifecycle.visible
    type: behavior
    must: Plan creation, refinement, approval, assumption checking, readiness, execution, Check loops, blocking, completion, cancellation, and resumption preserve separate visible approval and execution state with explicit blockers and optimistic conflicts.
    depends_on: [models.PlanRecord, examples.plan_lifecycle]
  - id: plans.approval.revision-bound
    type: invariant
    must: Approval binds an exact immutable Plan revision; material changes require reapproval while non-material implementation detail, Task decomposition, and stronger in-scope Checks may continue without repeated approval.
    depends_on: [models.PlanRevision, examples.plan_approval]
  - id: plans.approval.human-web-revision-bound
    type: security
    must: Immutable encrypted Plan revisions are approved only through an authenticated trusted browser session, and every material edit invalidates approval until the new exact revision is approved.
    depends_on: [models.PlanRecord, models.PlanRevision, examples.plan_approval]
  - id: plans.contract-links.contextual
    type: behavior
    must: General user Plans may exist without a Specification, but governed implementation work must discover and link applicable Specification revisions, Requirements, flows, and edge cases when present; intentional durable behavior changes require an approved Specification amendment rather than copied Plan text.
    depends_on: [models.PlanSpecificationLink, examples.plan_specification_links]
  - id: plans.tasks.only-execution-units
    type: invariant
    must: Linked Tasks are the only executable work units; phases may group Tasks for presentation, but Plans contain no recursive subtasks or independently executable step records and never duplicate Task lifecycle state.
    depends_on: [models.PlanTaskLink, examples.plan_tasks]
  - id: plans.dependencies.done-only
    type: invariant
    must: Mixed Plan/Task blocked-by edges are owner- and shared-Project-scoped, reject self, duplicate, and cyclic edges, and satisfy only when their target Task is done or target Plan is completed.
    depends_on: [models.PlanTaskLink, examples.plan_tasks]
  - id: plans.assumptions.investigated-before-work
    type: security
    must: Confirmed or corrected required assumptions include encrypted typed source/evidence proofs before dependent work can proceed; unsupported status text alone cannot satisfy the gate.
    depends_on: [models.PlanAssumption, examples.plan_completion_gates]
  - id: plans.key-wrappers.contextual
    type: invariant
    must: A per-Plan key is wrapped only for authorized owner, chat, Project, Plan, or Team contexts; replacement wrappers are accepted before obsolete wrappers are removed and raw keys are never durable.
    depends_on: [models.PlanKeyWrapper, examples.plan_context_wrappers]
  - id: plans.project-links.encrypted
    type: privacy
    must: Raw linked Project ids remain request-only or client-encrypted while server-visible hashes support filtering and Project-scoped wrappers preserve authorized decryption.
    depends_on: [models.PlanRecord.linked_project_hashes, models.PlanRecord.encrypted_linked_project_ids, models.PlanKeyWrapper, examples.plan_project_links]
  - id: plans.execution.gates-evidence
    type: invariant
    must: Only present fields explicitly marked required, plus fields required by a governing Specification, gate Plan execution or completion. Assumptions, Tasks, Checks, criteria, references, and learnings are otherwise recommended; failed required Checks create or propose follow-up Tasks and return the Plan to the visible work loop until passed, waived, or explicitly blocked.
    depends_on: [models.PlanAssumption, models.PlanCriterion, models.PlanTaskLink, models.PlanCheckLink, models.PlanReferencePattern, models.PlanLearning, examples.plan_completion_gates]
  - id: plans.active-context.vault-boundary
    type: privacy
    must: Active assistant context comes from short-lived Vault-encrypted execution context or fresh client-supplied context, never backend decryption of durable Plan content; missing context is a visible blocker.
    depends_on: [models.PlanExecutionContext, examples.plan_active_context]
  - id: plans.ui.edit-approve-resume
    type: behavior
    must: The fullscreen Plan editor uses one stable URL, readable sections, draft editing, undo, Approve Plan or Save and Approve actions, immutable revision identity, and automatic continuation of an authorized waiting agent after approval.
    depends_on: [examples.plan_ui_review, applies_to.gui]
  - id: plans.surface.semantic-parity
    type: parity
    must: REST, CLI, SDK, and web preserve the same encrypted content, revision approval, Specification links, explicitly required gates, Task links, Check links, completion blockers, and visible failures wherever Plan operations are exposed.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: true
    role: First-party authenticated routes persist encrypted Plans, revisions, links, gates, and execution context without decrypting private content.
  cli:
    required: true
    parity: semantic
    requirements:
      - Create, refine, link, wait for approval, attach, start, resume, inspect blockers, and complete Plans through stable human-facing commands.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
        requirements:
          - id: plans.gui.preview
            elements: [title, approval_state, execution_state, progress, current_task, blocked_summary]
            interactions: [open_fullscreen, open_current_task]
          - id: plans.gui.fullscreen-editor
            elements: [header, goal, specification_links, referenced_specification_flows, scope, assumptions, success_criteria, tasks, checks, decisions, risks, references, activity, approve_action]
            interactions: [edit_sections, undo_unsaved_changes, approve_plan, save_and_approve, request_more_refinement, open_specification, open_task, open_check]
            states: [draft_unchanged, draft_edited, saving, awaiting_approval, approved, reapproval_required, executing, running_checks, blocked, completed, error]
            accessibility: [semantic_section_headings, keyboard_editing, announced_unsaved_state, announced_approval_revision, status_not_color_only]
            responsive_behavior: [split_detail_when_space_allows, fullscreen_overlay_on_compact_viewports, sticky_primary_approval_action]
            design_references: optional
      apple: {required: false}
    exceptions:
      - id: apple-plan-authoring-deferred
        implementation: apple
        reason: Rich Plan authoring starts with shared Specifications and web review.
        equivalent_outcome: Apple must preserve readable Plan state, Task/Check links, approval revision, and user confirmation when implemented.

examples:
  file: examples.yml
  required_groups: [plan_private_content, plan_lifecycle, plan_approval, plan_specification_links, plan_tasks, plan_context_wrappers, plan_project_links, plan_completion_gates, plan_active_context, plan_ui_review, plan_surface_parity]
