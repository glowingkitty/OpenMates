schema_version: 1
specification: feature.apple-local-model-lab@7
downloads:
- id: verified-download-and-offline-reopen
  given: No laboratory models are installed.
  when: The user downloads Whisper, then reopens the lab with network access disabled.
  then: Only Whisper becomes ready after its files verify; the other models remain optional and Whisper restores
    from disk without a network request.
- id: corrupt-or-cancelled-download
  given: A model download is in progress.
  when: A file fails its checksum or the user cancels.
  then: The lab never offers a ready model from partial files, removes partial assets and offers a fresh retry.
- id: download-verification-during-inference
  given: Whisper is ready and another model is still downloading or verifying files.
  when: The user runs a Whisper test and cancels the other download.
  then: Transfer and verification have distinct progress, cancellation remains usable and partial files never become
    ready; the active test keeps its own cancellation and cleanup ownership.
- id: background-download-interruption
  given: An optional model transfer is active on iPhone.
  when: The app is suspended, connectivity is interrupted, then restored and the app relaunches.
  then: The operating-system background transfer is associated with its original pinned operation; verified work
    is retained and only a fully size/checksum-verified installation becomes ready. Cancellation suppresses later
    completion.
- id: background-download-interruption
  given: An optional model transfer is active on iPhone.
  when: The app is suspended, connectivity is interrupted, then restored and the app relaunches.
  then: The operating-system background transfer is associated with its original pinned operation; verified work
    is retained and only a fully size/checksum-verified installation becomes ready. Cancellation suppresses later
    completion.
execution:
- id: offline-disposable-audio-and-text
  given: Whisper and Privacy Filter are installed on a supported device and laboratory tests are enabled before
    disconnecting the network.
  when: The user tests a disposable recording and name/address example in turn.
  then: The lab shows local transcription and personal-data spans with device measurements, without server submission
    or credits.
- id: visible-loading-and-per-run-memory
  given: A verified Whisper model is installed and no laboratory test is active.
  when: The user tests the same disposable recording twice.
  then: Preparation, model loading, transcription and cleanup are visible, and each run reports its own sampled
    memory baseline and peak. A long phase remains active with diagnostic status until it finishes or cancellation
    drains.
spans:
- id: unicode-and-window-seam
  given: Disposable text contains a German name after an emoji and an entity crossing a model window boundary.
  when: Privacy Filter decodes the token windows.
  then: The name and crossing entity are highlighted coherently without splitting an emoji or Unicode character.
- id: failure-is-not-clean
  given: Privacy Filter receives invalid model output or its run is cancelled.
  when: The operation finishes.
  then: The lab shows a sanitized failure or cancellation and never presents that operation as a successful no-entity
    scan.
scope:
- id: lab-switch-only
  given: The account uses its existing chat speech and personal-data provider settings.
  when: The user opens Developers Local models lab and toggles its local-model switch.
  then: Only laboratory tests are enabled; the production chat settings and provider/billing behavior retain their
    existing values.
cancellation:
- id: cancel-during-native-operation
  given: Whisper is transcribing a disposable recording.
  when: The user cancels and tries to start another laboratory model test before Whisper finishes unloading.
  then: No result is retained and no second test starts until the active operation and unload finish.
ephemeral:
- id: exit-with-active-import
  given: A lab test is reading its own copy of an imported recording and private test text is entered.
  when: The user leaves the laboratory before the native operation returns.
  then: Visible inputs and results clear immediately, late results remain absent, and the copy is removed after
    the operation finishes; the original recording and installed models remain.
availability:
- id: unsupported-intel
  given: The user opens the laboratory on an Intel Mac.
  when: The model controls are displayed.
  then: Whisper and Privacy Filter inference remain unavailable, and no removed speech adapter is offered.
- id: removed-adapter-absent
  given: The user opens the laboratory on a supported Apple device.
  when: The user inspects available models.
  then: Only current supported adapters are offered; KittenTTS Mini0.8, Pocket TTS, Kokoro and Apple system voice testing have no controls or runtime, catalog or build
    dependencies. No automatic replacement or system-voice fallback appears.
watch_tiny:
- id: watch-foreground-tiny
  given: The user opens Watch Settings, Developers, the tiny Whisper lab; its separate pinned model assets are absent.
  when: They explicitly enable the experiment, download assets, record a short English or German clip and run the
    local test.
  then: No download occurs before opt-in, verified ready state precedes execution, foreground local cold-load/transcribe/unload
    durations and sampled memory are shown, and production chat settings stay unchanged.
- id: watch-cancel-or-exit
  given: The Watch tiny experiment is transcribing its temporary recording.
  when: The user cancels, leaves the page or backgrounds the app before the native operation and unload finish.
  then: Private results are suppressed, visible inputs clear on exit, temporary input remains owned until native
    work drains, and no second test or model removal occurs before unload finishes.
- id: watch-invalid-and-offline-reopen
  given: A tiny asset transfer is interrupted or an asset hash/installation revision is invalid.
  when: The user retries explicitly, then reopens the verified experiment with network unavailable.
  then: Incomplete or invalid installations never become ready; only fully verified retry assets become ready, and
    verified reopening reads local assets without a network fetch.

neural_tts:
- id: exact-models-explicit-offline-test
  given: Developers opts into the laboratory with verified pinned Supertonic3 assets.
  when: A short private text is submitted with a selected stock voice and supported language.
  then: Local CPU synthesis reports model-load/speech-synthesis/audio-preparation/cleanup timing with accurate labels, sampled memory, duration and real-time factor. Explicit playback uses a temporary mono WAV. No runtime download or provider/system fallback is possible. Speech timing never says personal data is being detected.
- id: cancel-owner-change-after-native-return
  given: A native operation returns a WAV immediately before Cancel or an account/server/scope change.
  when: Cancellation or ownership validation rejects publication.
  then: The request destination remains owned until drain/unload, then is removed even if the result handle was cleared. Private text/playback/results cannot cross the new owner boundary.
