schema_version: 1
id: feature.safety-strikes
version: 1
status: draft
title: Safety Strikes, Suspension, Appeal and Policy Account Deletion
summary: >
  When OpenMates' own safety checks reject a user's image or video request or
  an uploaded image, the user gets one strike and a clear warning in their
  language. An account is never deleted automatically for safety strikes. The
  first strike is a warning, the second suspends the account for 7 days (it is
  active again afterwards), the third suspends it until an admin has reviewed
  it; the review ends in a restore or, only by the admin's decision, a deletion
  with refunds. Every suspension alerts the admin with the category, the
  deciding check, its scores, account age, plan and earlier strikes, never the
  image or the request text. Strikes expire after 90 days. A safety check that
  fails for technical reasons never counts as a strike. Deletion never removes
  records the law requires us to keep.

scope:
  includes:
    - Strikes from image generation, image editing, video generation and uploaded-image safety rejections.
    - The warning shown with a rejected request (strike 1) and the suspension notices at strike 2 and 3.
    - Refused requests when a safety check is technically unavailable.
    - Suspension (7 days, then pending admin review), appeal with consent to share the flagged requests, the admin decision (restore or delete) and the admin alert.
    - Admin-decided deletion, the full credit refund, the deletion email and the login message that follows.
    - Records kept after deletion because the law requires them.
    - The localized reason and allowed alternative shown with every refused image or video request, firm hard limits, and the minors rule (photorealistic refused, clearly stylized non-sexual allowed).
  excludes:
    - Text chat refusals by the AI provider's own content filter (feature.ai-model-routing; they record no strike).
    - Request-level chat safety screening (feature.chat-request-safety).
    - User-requested account deletion (feature.auth).
    - Reporting flagged content to authorities (pending the owner's decision after legal review).

models:
  StrikeState:
    count:
      type: integer
      required: true
      constraints: {minimum: 0, maximum: 3}
      description: Strikes in the current 90-day counting window, shared by generation, editing, video and upload rejections.
    counted_response_ids:
      type: list
      required: true
      description: Assistant responses that already produced a strike, so one response counts at most once.
  Suspension:
    started_at:
      type: datetime
      required: true
    state:
      type: enum
      required: true
      values: [temporary, pending_review]
      description: temporary lasts 7 days and ends by itself; pending_review lasts until an admin restores or deletes the account.
    until:
      type: datetime
      required: false
      description: End of a temporary suspension; absent for pending_review.
    appeal_state:
      type: enum
      required: true
      values: [none, appealed, lifted, confirmed]
      description: An appeal asks the admin to lift the suspension; the admin decides between restore and deletion.
    flagged_request_ids:
      type: list
      required: true
      description: The rejected requests behind the strikes; only these are shared with the admin, and only after the user's consent.
  DeletionMarker:
    hashed_login_identifier:
      type: string
      required: true
      description: Hash of the login identifier only; no other personal data.
    category:
      type: string
      required: true
    expires_after_days:
      type: integer
      required: true
      constraints: {minimum: 14, maximum: 14}

assertions:
  - id: safety-strikes.screening-rejects
    type: behavior
    must: Image and video requests, their reference images and generated outputs, and uploaded images pass the safety checks before anything is generated, stored or shown; a block from any check rejects the request and only a rejection from a check that reached a decision can lead to a strike.
    depends_on: [examples.strikes, examples.technical]
  - id: safety-strikes.one-strike-per-violation
    type: invariant
    must: Every rejected request that is a policy violation counts as exactly one strike, whatever its category or severity, and one assistant response or upload never counts more than once; no single request suspends or deletes an account.
    depends_on: [models.StrikeState]
  - id: safety-strikes.technical-failure-no-strike
    type: invariant
    must: When a safety check cannot reach a decision for technical reasons, the request is refused with a "safety check temporarily unavailable, please try again" message in the user's language; no strike is recorded, no violation is logged and no suspension or deletion is started.
    depends_on: [examples.technical]
  - id: safety-strikes.suggestive-upload-no-strike
    type: invariant
    must: An uploaded image rejected only for a suggestive score (no explicit sexual score over its threshold) is not a policy violation; it records no strike and never starts a suspension or deletion, while explicit sexual scores keep counting as one strike.
    depends_on: [models.StrikeState]
  - id: safety-strikes.warning-localized
    type: behavior
    must: A rejection that records strike 1 or 2 tells the user, in their language, what was rejected, the reason at category level (never the exact trigger, classifier or threshold) and "this is strike N of 3".
    depends_on: [examples.strikes]
  - id: safety-strikes.second-strike-suspends-7-days
    type: behavior
    must: The second strike suspends the account for 7 days, ends all of its sessions, alerts the admin and tells the user in their language why and until when; login and every authenticated API or WebSocket use is refused with that message, never "wrong login data"; after the 7 days the account is active again without any action.
    depends_on: [models.Suspension, examples.suspension]
  - id: safety-strikes.third-strike-pending-review
    type: behavior
    must: The third strike suspends the account until an admin review, ends all of its sessions, alerts the admin and tells the user in their language that the account is suspended pending a review and that they can appeal; the review ends in a restore (suspension lifted, strikes cleared, apology email) or an admin deletion.
    depends_on: [models.Suspension, examples.suspension]
  - id: safety-strikes.never-auto-delete
    type: invariant
    must: No safety strike, whatever its source or number, deletes or queues the deletion of an account automatically; only an admin decision does.
    depends_on: [examples.suspension]
  - id: safety-strikes.strikes-expire-90-days
    type: invariant
    must: A strike stops counting 90 days after the first strike of its window.
    depends_on: [models.StrikeState, examples.strikes]
  - id: safety-strikes.appeal-consented-review
    type: invariant
    must: An appeal requires the user's explicit consent to share only the flagged requests, decrypted, with the admin; the full chat history is never shared; the admin lifts the suspension (strikes reset, account active) or decides on the deletion.
    depends_on: [models.Suspension, examples.suspension]
  - id: safety-strikes.review-deadlines-retention
    type: behavior
    must: A suspended user has 14 days to appeal (explanation up to 1,000 characters), the admin decides within 7 days of an appeal and is reminded after 48 hours of an undecided review; an unclear case (pending review) with no appeal after 14 days is restored automatically. The admin can restore, delete with confirmation, or ask the user for more information by email. The strike and suspension record is purged 90 days after the case closes and an appeal 6 months after its decision; an attached photo is deleted at the decision. No charges happen while an account is suspended, and the user is emailed (in their language) with the reason and the appeal link when suspended.
    depends_on: [models.Suspension, examples.suspension]
  - id: safety-strikes.admin-deletion-refunds
    type: behavior
    must: Only when an admin decides to delete a suspended account is it deleted, through the standard account deletion, and all remaining credits are refunded automatically.
    depends_on: [examples.deletion]
  - id: safety-strikes.legal-retention
    type: invariant
    must: A policy deletion never removes records the law requires us to keep (invoices and financial records, the compliance deletion log, required security and audit logs); only what is required is kept, minimised, and removed when its legal retention period ends.
    depends_on: [examples.deletion]
  - id: safety-strikes.deletion-email
    type: behavior
    must: After a policy deletion the user receives an email in their language saying that the account was deleted, the category-level reason and that all remaining credits were refunded.
    depends_on: [examples.deletion]
  - id: safety-strikes.deletion-marker-login-message
    type: behavior
    must: A policy deletion keeps only a deletion marker of the hashed login identifier, the category and the date; a login attempt with that identifier shows, in the user's language, that the account was deleted for a policy violation and the remaining credits were refunded; the marker is removed automatically after 14 days.
    depends_on: [models.DeletionMarker, examples.login]
  - id: safety-strikes.never-wrong-login-data
    type: invariant
    must: A suspended account or an account with a deletion marker never shows the "wrong login data" message; it shows its own message in the user's language.
    depends_on: [examples.login]
  - id: safety-strikes.rejection-explained
    type: behavior
    must: An image or video request refused by the safety checks shows, in the user's language, a category-level reason and, where one fits, the alternative that is allowed, in the result card, in the strike warning and in the assistant's reply. The assistant explains the reason plainly, offers the alternative and does not retry or reformulate the request in the same response. No reason names the check, classifier, score or threshold that made the decision.
    depends_on: [examples.explanations]
  - id: safety-strikes.hard-limits-firm
    type: invariant
    must: A request refused as a sexual or suggestive depiction of a minor, an intimate or sexual image of a real person, or an attempt to get around the safety rules gets a short, firm reason only, with no alternative and no hint how to change the request so it passes.
    depends_on: [examples.explanations]
  - id: safety-strikes.minors-stylized-only
    type: behavior
    must: A photorealistic or photo-like picture of a minor is refused with the reason that realistic images of minors could be misused, for example for fake profiles pretending to be a minor, and the alternative of a clearly stylized version. A clearly stylized, non-photorealistic picture of a minor in a non-sexual scene, such as a 3D render, an illustration or a cartoon, is generated. Any sexual or suggestive depiction of a minor stays refused in every style.
    depends_on: [examples.explanations]

  - id: safety-strikes.upload-agreed-lines
    type: behavior
    must: An uploaded image is refused with a strike only for a high-confidence sexual depiction of a minor; explicit sexual content and extreme gore without context are refused without a strike; news and war images, weapons, medical images, ordinary nudity in art or medicine and suggestive images are allowed. Scores near a threshold get a second opinion from the decision model; when the image classifier is unavailable the decision model allows only images it is clearly sure are harmless; when both are unavailable the upload is refused without a strike. No purpose is judged at upload.
    depends_on: [examples.uploads]
  - id: safety-strikes.harmful-purpose-strikes
    type: behavior
    must: A chat request whose purpose is propaganda, hate, disinformation or manipulative tabloid content, or that falls in one of the four illegal categories, is declined with a localized reason and counts one strike per assistant turn on the same ladder. Explaining, analysing, fact-checking, history and labelled satire about such topics are allowed and never strike.
    depends_on: [examples.purpose]
  - id: safety-strikes.live-site-line
    type: behavior
    must: OpenMates never takes mass or abusive actions against a live website for a user (bulk or rapid form submissions, repeated submissions on the same control). Such a request is declined politely, assumes good faith, offers testing against a local or staging environment and gives no strike; only clear repeated abuse across unrelated sites counts one strike. Writing code that the user runs themselves is allowed, and a single normal form fill is allowed.
    depends_on: [examples.purpose]
applies_to:
  rest_api:
    required: true
    role: Login and upload responses carry the account-state and strike messages; image and video skills return them in their rejection result; the appeal and the admin decision are API actions.
  cli:
    required: true
    parity: semantic
    role: The CLI login shows the same account-state messages and the appeal option.
  sdks:
    required: false
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}

examples:
  file: examples.yml
  required_groups: [strikes, technical, explanations, suspension, deletion, login, uploads, purpose]
