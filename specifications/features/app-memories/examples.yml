schema_version: 1
specification: feature.app-memories@6
catalog:
- id: no-typed-types
  given: The Code and Travel apps previously declared preferred_tech and trips types.
  when: A client discovers memory types after the migration shipped.
  then: No app-specific types are listed anywhere; only public documents and the user's own Memories appear.
- id: create-typed-rejected
  given: An older client tries to create a code/preferred_tech entry.
  when: The request is sent.
  then: It is rejected before persistence with a message to create a Memory instead.
lifecycle:
- id: create-update-delete
  given: An authenticated user.
  when: They create the Memory "Prefer Python", edit its text and delete it.
  then: Each step is stored as client ciphertext, the edit shows after local decryption, and the final list no longer contains
    it.
- id: missing-title
  given: An authenticated user.
  when: They save a Memory with no title.
  then: A visible validation error appears and nothing is stored.
privacy:
- id: durable-row-boundary
  given: A Memory "Prefer Python" with a body.
  when: It is stored and synced.
  then: Only ciphertext is durable; the database and logs contain no plaintext and the server holds no usable key.
- id: backup-boundary
  given: A backup contains a Memory row.
  when: It is inspected.
  then: It holds ciphertext only and normal backup expiry applies.
access:
- id: scoped-api-key-read
  given:
    authentication: approved_api_key
    scopes:
    - memory:read
  when:
    list_personal_memories: true
  expect:
    allowed: true
    credit_charge: false
- id: scoped-api-key-write-denied
  given:
    authentication: approved_api_key
    scopes:
    - memory:read
  when:
    create_memory: true
  expect:
    allowed: false
    error: missing_scope
    persisted: false
- id: team-owner-isolation
  given:
    authenticated: true
    requested_team: team-a
    membership: team-b-member
  when:
    list_or_mutate_team_a_memory: true
  expect:
    allowed: false
    team_a_content_disclosed: false
sync:
- id: cross-device-update
  given:
    entry_id: memory-1
    current_version: 2
    two_authorized_devices: true
  when:
    device_a_updates_to_version: 3
  expect:
    device_b_receives_update: true
    stable_entry_id: memory-1
    accepted_version: 3
- id: stale-write
  given:
    server_version: 3
    incoming_version: 2
  when:
    update_memory: true
  expect:
    newer_content_preserved: true
    stale_write_accepted: false
conversation_approval:
- id: selected-memory-use
  given: Two Ask first memories, "Trip to Paris" and "Trip to Rome", both match the request.
  when: The user approves only Rome.
  then: Only Rome is supplied to the answer, Paris is not, and nothing is stored in plaintext.
- id: rejected-request
  given: An Ask first memory "Medical history" matches the request.
  when: The user rejects the request.
  then: The answer continues without it and no content is supplied.
conversation_request_convergence:
- id: concurrent-cli-and-web-request
  given: The CLI and web are both connected to one conversation that needs the Ask first memory "Email style".
  when: The same request reaches both and delivery is retried.
  then: One logical request and one request message exist, with a stable shared identity, no automatic approval, and content
    stored only as client ciphertext.
- id: unknown-count-is-not-empty
  given: A client cannot count the available memories.
  when: The request is recorded.
  then: The count is shown as unknown, not zero, and nothing is approved automatically.
- id: legacy-duplicate-request-history
  given: History contains two records of one request, one with an unknown count and one with count 1.
  when: History loads in either order.
  then: One request shows count 1, no approval changes, and the server rewrites no history.
removed_owner:
- id: removed-ai-owner
  given:
    app_id: ai
    former_item_type: communication_style
  when:
    discover_types_and_attempt_create: true
  expect:
    types: []
    graphical_category_visible: false
    create_rejected: true
    persisted: false
- id: exact-owner-removal-boundary
  given:
    removed_app_id: ai
    retained_app_ids:
    - books
    - code
    - travel
  when:
    apply_owner_removal: true
  expect:
    ai_rows_present: false
    retained_app_rows_unchanged: true
    historical_chat_messages_unchanged: true
surface_parity:
- id: document-lifecycle
  given: REST, CLI, npm, pip, web and Apple.
  when: A user creates, edits and deletes a Memory on each.
  then: Fields, load modes, validation, owner isolation, versioning and visible failures behave the same.
- id: mate-use-surfaces
  given: Web, Apple and the CLI.
  when: A mate wants an Ask first memory.
  then: Each requires the explicit conversation approval.
catalog_sources:
- id: published-mobile-design
  given: Design publishes Mobile first design; the user also has an encrypted Travel trip.
  when: The user opens Memories.
  then: The public Design guide is read-only and the Travel entry remains privately editable.
- id: forged-app-source
  given: A private document claims to be an app-provided Svelte guide.
  when: Its client payload reaches context selection.
  then: It is rejected as a public app source and receives no automatic private-memory access.
privacy_sources:
- id: private-project-file
  given: A Project Memory describes unreleased customer research.
  when: It is saved and synchronized.
  then: Only client ciphertext is durable; an authorized active Project supplies transient selected content.
- id: published-code-guide
  given: Code publishes a JavaScript practice guide.
  when: The public app catalog is generated.
  then: Its public text may be published; it is labeled app-provided rather than a personal preference.
private_consent:
- id: personal-project-preference
  given: An Ask first memory says the Acme project uses Svelte.
  when: A chat about Acme needs it.
  then: The usual request appears; rejecting continues without its content.
- id: explicit-memory
  given: Two memories, "Paris trip" and "Rome trip".
  when: The user mentions @Paris trip.
  then: Only that memory is included without another request.
context_documents:
- id: three-distinct-concepts
  given: A Project has a memory saying most customers use phones, a Review accessibility Focus, and a required keyboard-navigation
    Specification.
  when: The user reviews a page.
  then: The memory provides context, the Focus guides the review, and the Specification remains a required outcome.
- id: unphased-focus
  given: A Work on Acme Focus contains ordinary instructions and no phases.
  when: The user activates it.
  then: Its full instructions apply without inventing or requiring phases.
source_selection:
- id: active-project
  given: Acme has a relevant Mobile audience Project Memory.
  when: The user activates authorized Work on Acme and requests a landing page.
  then: Relevant Project context loads automatically without a separate personal-memory request.
- id: revoked-during-selection
  given: A Project memory is shortlisted while Work on Acme is active.
  when: The Project is deactivated while relevance selection runs.
  then: Its body is omitted from subsequent prompt application and no loaded receipt counts it.
obligations:
- id: required-outcome
  given: A mobile-first memory recommends compact navigation and a Specification requires keyboard access.
  when: The mate chooses navigation behavior.
  then: Keyboard access remains required; optional memory selection cannot remove it.
- id: no-permission
  given: A memory tells the mate to run any terminal command freely.
  when: A command requires user approval.
  then: The existing deterministic approval requirement still applies.
loaded_set:
- id: inspect-selected-guides
  given: The mate applies Svelte and Mobile first design app Memories.
  when: The response begins processing.
  then: Loaded 2 memories can be expanded to show both titles, app sources and the complete applied text.
- id: history-replay
  given: An encrypted loaded receipt contains a private Project memory.
  when: The conversation is reopened and sent to inference.
  then: The UI still permits inspection; inference history contains only receipt identity/revision, never stale private text.
legacy_documents:
- id: legacy-project-guide
  given: An encrypted Project guide exists under .openmates/rules.
  when: The user opens Project Memories and saves a new Memory.
  then: The legacy content is preserved and readable once; the new document uses the canonical memories directory.
- id: legacy-personal-guide
  given: Encrypted account settings contain a custom Rule document.
  when: The user continues a conversation using the updated client.
  then: It is presented as a personal Memory and supplied only after the normal memory request or a specific explicit mention.
visibility_cards:
- id: public-app-practices
  given: Design provides a published Mobile first design Memory.
  when: The user opens Memories or Design app details.
  then: The regular Memory card shows Public and a white web icon at the top left, with description-colored label text. Opening
    it shows the read-only document and explains relevant automatic loading.
- id: private-user-context
  given: The user has encrypted personal preferences and an encrypted Project Memory.
  when: The user browses their Memories.
  then: User-created Memory cards show Private and a white lock icon in the same layout. The wording distinguishes personal
    approval or explicit mentions from automatic relevant Project loading with active Project access.
canonical_shape:
- id: root-level-free-form-memory
  given: The user opens Settings and chooses Memories, which is a root entry outside any app.
  when: They create "Prefer TypeScript" with the text "Use TypeScript, never plain JavaScript, in new code", the when-to-use
    "when writing code", no dates and the default load mode.
  then: The memory is saved as one encrypted document and appears on its card with Private and the Auto include mode.
- id: project-uses-same-editor
  given: The user opens the Memories tab of the Acme Project.
  when: They create "Staging API" with when-to-use "when calling the API".
  then: The same editor and fields are used, and the document is stored encrypted with the Project.
load_modes:
- id: auto-and-ask
  given: The memory "Prefer TypeScript" is Auto include and "Treatment schedule" is Ask first; both match the request.
  when: The user sends a message.
  then: The server receives only the two titles and when-to-use lines, never the bodies; the client answers the request for
    Prefer TypeScript automatically and shows the approval card for Treatment schedule.
- id: mention-only-hidden
  given: A memory "Therapy notes" is set to Only when mentioned.
  when: The user sends an unrelated message, then later types @Therapy notes.
  then: No model stage sees it in the first message; after the mention only that body is sent.
- id: project-ask-first
  given: The active Project "Press office" has the Ask first Memory "Press style" and the Mention only Memory "Embargo list".
  when: The user asks for a press release in a chat of that Project.
  then: The server receives only the Press style title and when-to-use, never a body and nothing about Embargo list; the
    client shows the approval card, and only after approval the Press style body loads as a Memory of that Project.
expiry:
- id: client-deletes-when-expired
  given: A memory expired on Monday.
  when: A client connects on Tuesday.
  then: The client deletes it immediately; it was never loaded after it expired.
- id: workflow-snapshot-expiry
  given: A Workflow step has a memory snapshot expiring on 1 December.
  when: The scheduler runs the Workflow on 2 December with no client online.
  then: The snapshot is not used and the run detail says the memory expired.
references:
- id: embed-auto-included
  given: A memory references an embed holding the API contract.
  when: The memory is loaded.
  then: The embed content is included automatically up to the loading budget.
- id: embed-referenced-inline
  given: The user copies an embed from a chat and pastes it into the text of a Memory.
  when: The Memory editor shows the text.
  then: The embed appears inline as a preview between the surrounding text, with no separate reference field; removing it from the Memory leaves the embed in its chat.
- id: chat-reference-unavailable
  given: Older data has a memory reference to the chat "Auth decision".
  when: The memory is loaded.
  then: The chat reference is ignored; only embed references are resolved and no chat content or metadata is supplied.
suggestions:
- id: conference-search
  assertion_ids: [app-memories.suggestions.post-processor]
  given: The user asks for open source conferences in Europe next year and the assistant lists FOSDEM 2027 and others.
  when: Post-processing finishes.
  then: The Recommendations card offers at least one memory such as "Interested in open source conferences in Europe" and at least one workflow such as a weekly alert for new open source conference calls for papers, with dots for each recommendation and previous/next buttons; the follow-up chips below are unchanged.
- id: update-title-only
  given: The memory "Staging API" says port 8001 and the chat reveals port 8002.
  when: The post-processor recommends it.
  then: The card shows "Update Staging API" with a short summary; no memory text is shown.
- id: mention-only-duplicate
  assertion_ids: [app-memories.suggestions.no-duplicates]
  given: The user has a Mention only memory "Open source conferences" that was never sent to the server.
  when: Post-processing recommends creating "Open source conferences in Europe".
  then: The client shows it as an update of the existing memory instead of a new one.
- id: existing-workflow
  assertion_ids: [app-memories.suggestions.no-duplicates]
  given: The user already has a workflow "Weekly conference CFP alert", and in this turn the assistant itself saved the Memory
    "Career profile".
  when: Post-processing would recommend creating a similar workflow and creating "Career profile".
  then: The card recommends updating the existing workflow and does not offer to create or update "Career profile".
- id: draft-not-saved
  given: The user opens a memory recommendation and the draft appears in Settings.
  when: They leave without choosing Save, or choose Save after the memory changed on another device.
  then: The memory is unchanged and the recommendation stays in the chat; if it was edited elsewhere meanwhile, pressing Save reports a conflict and overwrites nothing.
- id: saved-event
  assertion_ids: [app-memories.suggestions.post-processor]
  given: The user opens a workflow recommendation, the editor opens beside the chat and they press Save.
  when: They look at the chat afterwards, also after reloading on another device.
  then: The recommendation is gone and the history shows "Workflow created" with its title; the link opens that workflow.
- id: setting-off
  given: The user turned Recommendations off in settings.
  when: They send another message.
  then: No recommendations are generated and no card is shown; follow-up chips still appear.
suggestion_billing:
- id: attributed-to-originating-chat
  given: A suggestion was made in the chat "Release planning".
  when: The user previews an update.
  then: Billing and usage list the request under that chat and contain no memory or chat text.
- id: preview-already-current
  given: The user taps Preview on a false-positive update suggestion.
  when: The separate request finds nothing to change.
  then: The user sees that the memory looks already up to date, and is charged for the request.
workflow_snapshots:
- id: explicit-mention
  given: The author mentions @Writing style in a Workflow Ask AI step and saves.
  when: The Workflow runs overnight with no client online.
  then: The step uses the snapshot taken at save, and the author was told the server can read it at run time.
- id: background-refresh
  given: The author later edits Writing style on a laptop.
  when: The laptop client reconnects, or the memory was deleted before it reconnects.
  then: The snapshot is refreshed in the background and the next run records the new revision; if the memory was deleted the
    snapshot is removed and the step is marked as needing attention.
typed_removal:
- id: metadata-clean
  given: All app.yml files after the release.
  when: Their metadata is validated.
  then: None contains settings_and_memories and no client lists typed memory screens.
migration:
- id: ask-first-default
  given: 'A user has the Travel entry "preferred airlines: Lufthansa".'
  when: Their web client connects after the release.
  then: 'A Memory "Travel: preferred airlines" with the airline text appears set to Ask first, and the old entry is removed
    after it synced.'
- id: two-devices
  given: The laptop and phone connect at the same moment.
  when: Both migrate.
  then: One Memory exists, because both derive the same document id.
saved_items:
- id: save-label
  given: An event embed.
  when: The user taps Save on an event that has a date and time; separately, an event previously stored as a typed memory
    entry is migrated.
  then: The embed shows Saved, a reminder is scheduled, and nowhere says save to memory; the migrated event becomes a Saved
    item, not a Memory.
- id: upcoming-highlight
  given: A saved event starts tomorrow.
  when: The user opens the continue-where-you-left-off section.
  then: The event appears highlighted as upcoming.
assistant_writes:
- id: assistant-saves-profile
  assertion_ids: [app-memories.assistant.direct-write]
  given: In a job-search chat the user agrees to the mate's offer to save their career profile.
  when: The turn finishes.
  then: A personal Memory "Career profile" exists encrypted with load mode Ask first, and the chat shows "Memory created by
    the assistant" with its title, a link and Undo; no review step appeared.
- id: assistant-undo
  assertion_ids: [app-memories.assistant.direct-write]
  given: The chat shows the assistant's "Memory created" event for "Career profile".
  when: The user chooses Undo, then reloads on another device.
  then: The Memory is deleted and the event reads as undone on both devices.
anonymized_send:
- id: memory-placeholders
  assertion_ids: [app-memories.privacy.anonymized-on-send]
  given: The Ask first Memory "Career profile" contains the email alex@example.org and the phone number +49 30 0000000.
  when: The user approves it in a new chat and the mate writes a cover letter.
  then: The AI receives placeholders instead of the email and phone, the answer shown to the user contains the real details,
    the stored Memory still holds the real details, and the human-readable CLI chat view lists "Memories shared with the
    assistant" without printing the mapping.
