schema_version: 1
specification: feature.app-memories@1

catalog:
  - id: declared-code-memory
    given: {app_id: code, item_type: preferred_tech, declared_in_app_metadata: true}
    when: {discover_memory_types: true}
    expect: {type_visible: true, field_schema_visible: true}
  - id: app-without-memory-types
    given: {app_id: projects, declared_memory_types: []}
    when: {discover_memory_types: true}
    expect: {types: []}

lifecycle:
  - id: personal-create-update-delete
    given: {authenticated: true, owner_context: personal, type: code/preferred_tech}
    when: {create: {name: Python, proficiency: advanced}, update: {proficiency: expert}, delete: true}
    expect: {created_encrypted: true, update_visible_after_local_decryption: true, final_list_contains_entry: false}
  - id: invalid-declared-value
    given: {authenticated: true, type: code/preferred_tech, proficiency: unsupported}
    when: {create: true}
    expect: {rejected_before_persistence: true, visible_validation_error: true}

privacy:
  - id: durable-row-boundary
    given: {memory_data: {name: Python, proficiency: expert}}
    when: {persist_and_sync: true}
    expect: {encrypted_item_json: ciphertext, plaintext_in_database: false, plaintext_in_logs: false, usable_key_on_server: false}
  - id: backup-boundary
    given: {encrypted_memory_row_in_backup: true}
    expect: {plaintext_content_present: false, normal_backup_expiry_applies: true}

access:
  - id: scoped-api-key-read
    given: {authentication: approved_api_key, scopes: [memory:read]}
    when: {list_personal_memories: true}
    expect: {allowed: true, credit_charge: false}
  - id: scoped-api-key-write-denied
    given: {authentication: approved_api_key, scopes: [memory:read]}
    when: {create_memory: true}
    expect: {allowed: false, error: missing_scope, persisted: false}
  - id: team-owner-isolation
    given: {authenticated: true, requested_team: team-a, membership: team-b-member}
    when: {list_or_mutate_team_a_memory: true}
    expect: {allowed: false, team_a_content_disclosed: false}

sync:
  - id: cross-device-update
    given: {entry_id: memory-1, current_version: 2, two_authorized_devices: true}
    when: {device_a_updates_to_version: 3}
    expect: {device_b_receives_update: true, stable_entry_id: memory-1, accepted_version: 3}
  - id: stale-write
    given: {server_version: 3, incoming_version: 2}
    when: {update_memory: true}
    expect: {newer_content_preserved: true, stale_write_accepted: false}

conversation_approval:
  - id: selected-entry-use
    given: {requested_types: [travel/trips], saved_entries: [trip-a, trip-b]}
    when: {user_approves: [trip-b]}
    expect: {supplied_to_conversation: [trip-b], trip_a_supplied: false, plaintext_durably_stored: false}
  - id: rejected-request
    given: {requested_types: [health/medical_history]}
    when: {user_rejects: true}
    expect: {memory_plaintext_supplied: false, conversation_continues_without_memory: true}

conversation_request_convergence:
  - id: concurrent-cli-and-web-request
    given: {conversation: chat-a, request_id: request-a, authorized_clients: [cli, web], requested_types: [mail/writing_styles], available_entries: 1}
    when: {same_request_delivered_to_both_clients: true, delivery_retried: true}
    expect: {logical_request_count: 1, durable_request_message_count: 1, shared_stable_message_identity: true, known_entry_count: 1, approval_automatic: false, request_content_persisted_as: client_ciphertext}
  - id: unknown-count-is-not-empty
    given: {request_id: request-a, requested_types: [mail/writing_styles], local_entry_count_unavailable: true}
    when: {request_metadata_recorded: true}
    expect: {entry_count: explicitly_unknown, falsely_reported_zero: false, approval_automatic: false}
  - id: legacy-duplicate-request-history
    given: {conversation: chat-a, same_request_id: request-a, historical_request_message_count: 2, counts: [unknown, 1]}
    when: {history_loaded_in_either_order: true}
    expect: {presented_request_count: 1, displayed_known_entry_count: 1, approval_decision_changed: false, approved_entries_expanded: false, history_rewritten_on_server: false}

removed_owner:
  - id: removed-ai-owner
    given: {app_id: ai, former_item_type: communication_style}
    when: {discover_types_and_attempt_create: true}
    expect: {types: [], graphical_category_visible: false, create_rejected: true, persisted: false}
  - id: exact-owner-removal-boundary
    given: {removed_app_id: ai, retained_app_ids: [books, code, travel]}
    when: {apply_owner_removal: true}
    expect: {ai_rows_present: false, retained_app_rows_unchanged: true, historical_chat_messages_unchanged: true}

surface_parity:
  - id: declared-type-lifecycle
    given: {type: travel/trips, surfaces: [rest_api, cli, sdks.npm, sdks.pip, gui.web, gui.apple]}
    expect: {discovery_semantics_match: true, encrypted_crud_semantics_match: true, owner_isolation_matches: true, visible_failures_match: true}
  - id: mate-use-surfaces
    given: {surfaces: [gui.web, gui.apple, cli], mate_requests_memory: true}
    expect: {explicit_conversation_approval_required: true}
