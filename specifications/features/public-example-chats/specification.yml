schema_version: 1
id: feature.public-example-chats
version: 2
status: approved
title: Public Example Chats
summary: >
  OpenMates public example chats are static, unauthenticated-safe transcripts
  that are discoverable from logged-out and authenticated web entry points,
  render their public messages and embeds without private payload leakage, and
  expose crawlable SEO pages for public browsing.

scope:
  includes:
    - Static public example-chat fixtures shipped with the first-party web app.
    - Logged-out intro, all-examples, search, hash navigation, settings-card, and authenticated sidebar discovery of public examples.
    - Public transcript, embed-preview, compressed-history, share-link, SSR page, JSON-LD, and sitemap behavior for example chats.
    - Public-safety sanitization for checked-in example fixtures and rendered public HTML.
  excludes:
    - Private authenticated chats, user-owned shares, and editable share-policy generation.
    - Live app-skill execution semantics beyond verifying committed example output renders safely.
    - Exact visual styling beyond the stable selected-row, hover, and panel-layer navigation states; animation timing, example copy punctuation, and example ranking weights.
    - Apple native example browsing and CLI TUI example browsing, which have separate parity specs.

models:
  PublicExampleChat:
    chat_id:
      type: chat_id
      required: true
      constraints: {prefix: example-, stable_hash_target: true}
    slug:
      type: route_slug
      required: true
      constraints: {route_prefix: /example/}
    title:
      type: localized_string
      required: true
    messages:
      type: public_transcript
      required: true
      constraints: {roles: [user, assistant, system], public_cleartext_only: true}
    embeds:
      type: public_embed_fixtures
      required: false
      constraints: {renderable_without_provider_credentials: true, raw_tool_payload_visible: forbidden}

  PublicExampleCatalog:
    source:
      type: enum
      values: [static_example_registry]
      required: true
    entries:
      type: ordered_example_array
      required: true
      constraints: {deduplicated_by_chat_id: true, removed_examples_absent: true}
    discovery_surfaces:
      type: array
      required: true
      constraints: {includes: [guest_intro, guest_all_examples, global_search, authenticated_sidebar, settings_example_card]}

  PublicExampleChrome:
    route_hash:
      type: stable_hash
      required: true
      constraints: {format: "#chat-id=<example_chat_id>"}
    share_url:
      type: public_static_url
      required: true
      constraints: {same_origin_hash_link: true, no_generated_share_token: true}
    editable_share_controls:
      type: ui_controls
      required: true
      constraints: {password: absent, community: absent, expiry: absent, generate_link: absent}

  PublicExampleNavigationState:
    selected_row_background:
      type: design_token
      required: true
      constraints: {value: color-grey-0}
    hover_row_background:
      type: design_token
      required: true
      constraints: {value: color-grey-10, applies_to_non_selected_rows: true}
    active_chat_layer:
      type: stacking_context
      required: true
      constraints: {above_sidebar: true, outer_shadow_visible: true}

  PublicCompressedHistory:
    summary:
      type: rendered_markdown_summary
      required: true
      constraints: {raw_markdown_markers_visible: forbidden}
    initial_window:
      type: public_message_window
      required: true
      constraints: {forgotten_messages_hidden_until_explicit_reveal: true}
    remember_action:
      type: composer_prefill_action
      required: true
      constraints: {quotes_public_forgotten_message: true, does_not_mutate_example: true}

  PublicExampleSeoPage:
    route:
      type: public_ssr_route
      required: true
      constraints: {status: 200, includes: [main, article, h1, user_text, assistant_text]}
    metadata:
      type: seo_metadata
      required: true
      constraints: {unique: [title, description, canonical, robots, og_title, og_description, og_image, twitter_title, twitter_description, twitter_image]}
    structured_data:
      type: json_ld
      required: true
      constraints: {contains_type: QAPage, canonical_url_matches_slug: true, has_question_answer_entries: true}
    sitemap_entry:
      type: sitemap_url
      required: true
      constraints: {contains_lastmod: true, production_required: true}

  PublicSafetyMarkers:
    forbidden_public_markers:
      type: string_array
      required: true
      constraints:
        includes:
          - vault_wrapped_aes_key
          - vault:v1:
          - audio_base64
          - aes_key
          - aes_nonce
          - presigned_url_failure
          - private_bucket_or_object_path
          - unresolved_i18n_key
          - raw_focus_mode_activation
          - raw_app_settings_memory_payload

assertions:
  - id: public-example-chats.catalog.discoverable
    type: behavior
    must: Logged-out intro, expanded all-examples, global search, authenticated sidebar, and settings example-card entry points expose deduplicated static public examples without removed fixtures.
    depends_on: [models.PublicExampleCatalog, examples.catalog_discovery]
  - id: public-example-chats.navigation.static-public-link
    type: behavior
    must: Opening a public example selects a stable example chat hash and exposes a same-origin static public link while hiding editable private-share controls.
    depends_on: [models.PublicExampleChrome, examples.static_navigation]
  - id: public-example-chats.navigation.selected-state-visible
    type: behavior
    must: In light mode, an opened public example row uses color-grey-0 as its persistent selected background, non-selected rows retain color-grey-10 hover feedback, and the active chat surface remains layered above the sidebar so its outer shadow is visible at their shared edge.
    depends_on: [models.PublicExampleNavigationState, examples.navigation_state]
  - id: public-example-chats.transcript.safe-rendering
    type: privacy
    must: Public examples render readable transcript messages and committed embed previews without raw tool payloads, unresolved i18n keys, private storage markers, generated-audio binary/key material, or broken public-fetch placeholders.
    depends_on: [models.PublicExampleChat, models.PublicSafetyMarkers, examples.renderable_transcripts]
  - id: public-example-chats.history.explicit-forgotten-reveal
    type: behavior
    must: Public examples with compressed history show a rendered summary and current message window first, reveal forgotten public messages only after the explicit toggle, and can quote a forgotten message into the composer without mutating the static example.
    depends_on: [models.PublicCompressedHistory, examples.compressed_history]
  - id: public-example-chats.seo.crawlable
    type: behavior
    must: The public example listing links to every public example route, each route renders crawlable SSR transcript HTML with unique metadata and QAPage JSON-LD, and production sitemap output includes example routes with lastmod values.
    depends_on: [models.PublicExampleSeoPage, models.PublicSafetyMarkers, examples.seo_public_pages]
  - id: public-example-chats.surface.semantic-parity
    type: parity
    must: First-party web discovery, static route navigation, public transcript rendering, compressed-history gates, and crawlable SEO output preserve the same public-safe example semantics across logged-out and authenticated web states.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: false
    role: Public example chats are static web fixtures and SSR content, not mutable REST resources.
  cli:
    required: false
    role: CLI TUI example browsing has a separate spec and may consume the same fixtures without owning this web contract.
  sdks:
    required: false
    role: SDKs do not expose public example-chat browsing in v1.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false, role: Native example browsing is tracked by separate Apple parity specs.}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [catalog_discovery, static_navigation, navigation_state, renderable_transcripts, compressed_history, seo_public_pages]
