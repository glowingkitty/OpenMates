schema_version: 1
specification: feature.public-example-chats@3

catalog_discovery:
  - id: guest-intro-example-cards
    input: {surface: guest_intro, route: "/#chat-id=demo-for-everyone", user_state: logged_out}
    expected: {example_cards_visible: true, titles_non_empty: true}
  - id: guest-all-examples-search
    input: {surface: guest_all_examples, selected_query: screenshot}
    expected: {full_catalog_visible: true, result_id_visible: example-screenshot-to-html-pricing, legacy_custom_cards_absent: true}
  - id: authenticated-sidebar-show-more
    input: {surface: authenticated_sidebar, action: show_more_examples}
    expected: {initial_batch_non_empty: true, appends_older_rows: true, no_duplicate_chat_ids: true, removed_habit_garden_absent: true}

static_navigation:
  - id: static-example-share-link
    input: {chat_id: example-ai-workshops-meetups-berlin, action: open_chat_details_share}
    expected: {static_same_origin_hash_link: true, password_control_absent: true, community_control_absent: true, expiry_control_absent: true, generate_link_absent: true}
  - id: settings-memory-card-hash
    input: {settings_route: apps/books/settings_memories/currently_reading, clicked_chat_id: example-memory-books-currently-reading}
    expected: {hash_contains_chat_id: true, reload_preserves_example: true, transcript_visible_after_reload: true}

navigation_state:
  - id: logged-out-selected-example
    input: {surface: guest_sidebar, route: "/#chat-id=demo-for-everyone", theme: light}
    expected: {selected_row_background: color-grey-0, non_selected_hover_background: color-grey-10, active_chat_layer_above_sidebar: true, active_chat_outer_shadow_visible: true}

renderable_transcripts:
  - id: deep-research-sub-chats
    input: {chat_id: example-us-egg-prices-deep}
    expected: {sub_chat_cards: 3, deep_research_label_visible: true, raw_focus_mode_activation_absent: true, forced_focus_mention_absent: true}
  - id: memory-examples-current-text
    input: {chat_ids: [example-memory-books-currently-reading, example-memory-mail-writing-styles]}
    expected: {memory_summary_visible: true, invalid_interactive_question_absent: true, raw_memory_payload_absent: true}
  - id: app-skill-embed-previews
    input: {chat_ids: [example-chickpea-spinach-protein-dinners, example-deutschlandticket-train-fare-breakdown, example-ai-workshops-meetups-berlin, example-berlin-mitte-work-friendly]}
    expected: {finished_embed_previews_visible: true, known_result_counts_visible: true, raw_tool_payload_absent: true, map_routes_visible_when_applicable: true, maps_search_parent_fullscreen_map_view: true}
  - id: generated-audio-public-safety
    input: {chat_ids: [example-audio-generate-confirmation-tick, example-audio-speak-welcome-message]}
    expected: {generated_audio_embed_visible: true, audio_base64_absent: true, aes_key_absent: true, aes_nonce_absent: true, vault_wrapped_aes_key_absent: true}

compressed_history:
  - id: privacy-first-local-ai-forgotten-gate
    input: {chat_id: example-privacy-first-local-ai, action: reveal_forgotten_messages}
    expected: {summary_rendered_as_html: true, raw_markdown_markers_absent: true, initial_forgotten_prompt_hidden: true, reveal_increases_message_count: true, toggle_changes_to_hide: true}
  - id: remember-forgotten-public-message
    input: {chat_id: example-privacy-first-local-ai, action: remember_forgotten_message}
    expected: {composer_prefilled_with_public_quote: true, example_summary_not_visible_after_new_chat: true, settings_open_does_not_restore_example_summary: true}

seo_public_pages:
  - id: example-ssr-route
    input: {route: /example/gigantic-airplanes-transporting-rocket-parts}
    expected: {status: 200, main_visible_in_html: true, article_visible_in_html: true, h1_visible_in_html: true}
  - id: all-example-pages-crawlable
    input: {route: /example, action: crawl_linked_example_slugs}
    expected: {each_status_200: true, transcript_text_visible_without_js: true, unresolved_example_i18n_absent: true, broken_public_markers_absent: true, unique_seo_metadata: true, qa_page_json_ld_valid: true}
  - id: production-sitemap-lastmod
    input: {route: /sitemap.xml, environment: production}
    expected: {example_routes_present_when_sitemap_exposes_examples: true, each_example_route_has_lastmod: true}

public_speech:
  - id: logged-out-reviewed-speech-fixture
    input: {authenticated: false, chat_id: example-landing-featured, action: play_assistant_message_speech}
    expected: {public_audio_plays: true, generation_request_absent: true, login_prompt_absent: true, private_storage_markers_absent: true, credits_charged: 0}
  - id: conversion-requires-explicit-publication
    input: {source: real_cli_chat, private_speech_segments_ready: true, publication_reviewed: false}
    expected: {public_fixture_created: false, private_segment_reference_written: false}
