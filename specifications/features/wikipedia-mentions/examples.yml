schema_version: 1
specification: feature.wikipedia-mentions@1

syntax:
  - id: locale-default-name
    given: {openmates_language: de, input: "@wiki:AlbertEinstein erzähle mir mehr"}
    expect: {wikipedia_language: de, search_query: AlbertEinstein}
  - id: explicit-language-name
    given: {openmates_language: de, input: "@wiki:en:AlbertEinstein tell me more"}
    expect: {wikipedia_language: en, search_query: AlbertEinstein}
  - id: ordinary-mention-remains-local
    given: {input: "@AlbertEinstein"}
    expect: {wikipedia_request_count: 0}

web_discovery:
  - id: static-wiki-option
    given: {surface: gui.web, composer_text: "@"}
    expect: {wiki_option_visible: true, wikipedia_request_count: 0}
  - id: explicit-wiki-preview
    given: {surface: gui.web, composer_text: "@wiki:AlbertEin"}
    expect: {results_visible: true, first_title: Albert Einstein, description_visible: true, proxied_thumbnail_allowed: true}

resolution:
  - id: concatenated-proper-name
    input: "@wiki:AlbertEinstein"
    provider_results: [Albert Einstein, Albert Einstein College of Medicine]
    expect: {canonical_title: Albert Einstein, selected_index: 0}
  - id: corrected-proper-name
    input: "@wiki:AlberEinsten"
    provider_results: [Albert Einstein, Albert Einstein College of Medicine]
    expect: {canonical_title: Albert Einstein, selected_index: 0}
  - id: explicit-canonical-title
    input: "@wiki:en:Mercury_(planet)"
    expect: {canonical_title: "Mercury (planet)", wikipedia_language: en}

disambiguation:
  - id: mercury-requires-choice
    input: "@wiki:Mercury tell me more"
    first_result: {title: Mercury, disambiguation: true}
    alternatives: [Freddie Mercury, "Mercury (planet)", "Mercury (element)"]
    expect: {message_sent: false, ai_inference_started: false, alternatives_visible: true}
  - id: python-requires-choice
    input: "@wiki:Python explain it"
    first_result: {title: Python, disambiguation: true}
    alternatives: ["Python (programming language)", Pythonidae, "Python (missile)"]
    expect: {message_sent: false, explicit_choice_required: true}

reference_limit:
  - id: three-references-allowed
    input_references: [Albert Einstein, Ada Lovelace, Alan Turing]
    expect: {accepted: true, preserved_order: true}
  - id: fourth-reference-rejected
    input_references: [Albert Einstein, Ada Lovelace, Alan Turing, Grace Hopper]
    expect: {accepted: false, message_sent: false, visible_limit: 3, silently_dropped: []}

context_boundary:
  - id: selected-summary-context
    provider_payload:
      title: Albert Einstein
      lang: en
      pageid: 736
      revision: 1370002284
      extract: Albert Einstein was a German-born theoretical physicist.
      extract_html: "<p><b>Albert Einstein</b> was a physicist.</p>"
      thumbnail: {source: "https://upload.wikimedia.org/example.jpg"}
      wikibase_item: Q937
    expect_model_context:
      includes: [title, lang, pageid, revision, sanitized_extract, canonical_source_url]
      excludes: [extract_html, thumbnail_bytes, wikibase_item, wikidata_claims]

safety:
  - id: safe-summary-passes
    given: {ascii_smuggling_detected: false, groq_safety_result: passed}
    expect: {message_sent: true, sanitized_reference_in_context: true}
  - id: groq-unavailable-fails-message
    given: {groq_safety_result: unavailable}
    expect: {message_sent: false, ai_inference_started: false, wikipedia_context_included: false, visible_error: true}
  - id: injection-blocked-fails-message
    given: {groq_safety_result: blocked}
    expect: {message_sent: false, ai_inference_started: false, wikipedia_context_included: false, visible_error: true}

ai_behavior:
  - id: reference-only-explains-topic
    input: "@wiki:AlbertEinstein"
    expect: {model_task: explain_referenced_topic, source_identified_as: Wikipedia}
  - id: user-instruction-remains-authoritative
    input: "Compare @wiki:AlbertEinstein and @wiki:AdaLovelace in a table"
    expect: {model_task: compare_in_table, references_used: [Albert Einstein, Ada Lovelace], external_text_treated_as_instruction: false}

provider_limits:
  - id: shared-outbound-budget
    given: {documented_wikimedia_limit_per_minute: 200}
    expect: {openmates_budget_at_most: 150, concurrent_upstream_requests_at_most: 3}
  - id: upstream-throttle
    given: {provider_status: 429, retry_after_seconds: 12}
    expect: {retry_before_seconds: false, retry_at_or_after_seconds: 12, alternate_identity_bypass: false}
  - id: repeated-query-cache
    given: {language: en, queries: [AlbertEinstein, albert_einstein]}
    expect: {normalized_cache_key_shared: true, raw_query_persisted_in_logs: false}

query_privacy:
  - id: explicit-query-through-proxy
    given: {client_ip: private, input: "@wiki:AlbertEinstein"}
    expect: {wikimedia_receives: AlbertEinstein, wikimedia_receives_client_ip: false}
  - id: generic-query-never-forwarded
    given: {input: "@Sophia"}
    expect: {wikimedia_request_count: 0, third_party_query_disclosure: false}

surface_parity:
  - id: cli-first-real-chat-gate
    sequence: [rest_api_real_dev, cli_real_dev, npm_sdk_real_dev, pip_sdk_real_dev, five_real_cli_ai_chats, cli_proof_video, web_implementation, deployed_web_playwright, reviewed_web_visual_smoke, web_proof_videos]
    expect: {later_phase_before_green_predecessor: false}
  - id: five-real-cli-chat-cases
    real_ai_chats:
      - default-locale exact proper name
      - explicit-language proper name
      - explicit canonical formerly ambiguous topic
      - two-reference comparison with user instruction
      - three-reference synthesis with source-aware response
    supplemental_negative_cases: [disambiguation_blocks_inference, fourth_reference_blocks_inference, groq_unavailable_blocks_inference]
