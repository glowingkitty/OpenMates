schema_version: 1
id: feature.wikipedia-mentions
version: 1
status: draft
title: Wikipedia Mentions
summary: >
  Explicit @wiki mentions let users resolve up to three language-aware Wikipedia
  articles, preview their public metadata, and provide bounded, sanitized lead
  summaries as untrusted reference context for an AI response without exposing
  ordinary OpenMates mention searches to Wikimedia.

scope:
  includes:
    - Explicit @wiki query, language override, canonical title, and multi-reference syntax.
    - Wikipedia title autocomplete, first-result resolution, disambiguation handling, and no-result behavior.
    - Backend-proxied search, summary retrieval, preview thumbnails, caching, throttling, and retry behavior.
    - ASCII-smuggling removal and Groq prompt-injection detection before Wikipedia prose enters AI context.
    - CLI-first delivery, npm and pip SDK parity, and later web composer discovery and autocomplete.
    - Source-aware AI behavior for standalone and instruction-bearing Wikipedia references.
  excludes:
    - Direct Wikidata API requests, Wikidata claims, Wikidata entity rendering, or Wikidata-derived model context.
    - Full Wikipedia article bodies, HTML, image bytes, captions, references, revision history, or talk pages in AI context.
    - Automatic Wikimedia requests for ordinary @ mentions that do not use the @wiki trigger.
    - Automatic semantic reranking of ambiguous terms using an LLM.
    - Apple composer implementation in this version; native parity is a follow-up after web confirmation.

models:
  WikipediaMention:
    prefix:
      type: literal
      required: true
      constraints: {value: "@wiki:", case_insensitive: true}
    language:
      type: wikipedia_language_code
      required: false
      constraints: {explicit_form: "@wiki:<language>:<query>", default_from_openmates_locale: true, fallback: en}
    query:
      type: user_supplied_topic
      required: true
      constraints: {minimum_characters: 1, canonical_underscores_supported: true}

  WikipediaSearchResult:
    page_id:
      type: integer
      required: true
    key:
      type: canonical_wikipedia_title
      required: true
    title:
      type: display_text
      required: true
    description:
      type: short_public_metadata
      required: false
    thumbnail:
      type: proxied_image_reference
      required: false
      constraints: {ui_only: true, never_model_context: true, direct_client_wikimedia_fetch: false}
    disambiguation:
      type: boolean
      required: true

  WikipediaReferenceContext:
    language:
      type: wikipedia_language_code
      required: true
    page_id:
      type: integer
      required: true
    canonical_title:
      type: canonical_wikipedia_title
      required: true
    source_url:
      type: canonical_https_url
      required: true
    revision:
      type: wikipedia_revision_id
      required: false
    description:
      type: sanitized_plaintext
      required: false
    lead_extract:
      type: sanitized_plaintext
      required: true
      constraints: {bounded: true, html_forbidden: true, treated_as_instructions: false}
    safety_state:
      type: enum
      values: [pending, passed, blocked, unavailable]
      required: true

  WikipediaRequestBudget:
    documented_upstream_limit_per_minute:
      type: integer
      required: true
      constraints: {current_value: 200, configurable_when_wikimedia_policy_changes: true}
    openmates_outbound_budget_per_minute:
      type: integer
      required: true
      constraints: {maximum: 150, shared_across_instances: true}
    maximum_concurrency:
      type: integer
      required: true
      constraints: {value: 3}
    cache:
      type: normalized_query_cache
      required: true
      constraints: {key_fields: [language, normalized_query], persistent_user_text_logging: false}

assertions:
  - id: wikipedia-mentions.syntax.explicit-trigger
    type: behavior
    must: Wikipedia lookup occurs only for an explicit case-insensitive @wiki prefix; @wiki:<query> uses the current supported OpenMates language with English fallback, @wiki:<language>:<query> overrides it, and ordinary @ mention searches never contact Wikimedia.
    depends_on: [models.WikipediaMention, examples.syntax]
  - id: wikipedia-mentions.discovery.web-menu
    type: behavior
    must: The generic web @ menu visibly offers a static Wiki option that inserts or activates @wiki without contacting Wikimedia, after which a sufficiently specific @wiki query displays Wikipedia results with title, description, and an OpenMates-proxied thumbnail.
    depends_on: [models.WikipediaMention, models.WikipediaSearchResult, examples.web_discovery]
  - id: wikipedia-mentions.resolution.first-result
    type: behavior
    must: A non-canonical @wiki query resolves deterministically to the first Wikipedia title-search result, including concatenated names and supported spelling correction, while an explicit canonical article title resolves that article.
    depends_on: [models.WikipediaMention, models.WikipediaSearchResult, examples.resolution]
  - id: wikipedia-mentions.resolution.disambiguation-visible
    type: behavior
    must: If the first result is a disambiguation page, OpenMates does not infer a preferred meaning or start AI inference; it presents specific non-disambiguation alternatives in the selected language and requires an explicit choice.
    depends_on: [models.WikipediaSearchResult.disambiguation, examples.disambiguation]
  - id: wikipedia-mentions.references.maximum-three
    type: invariant
    must: A message may contain at most three resolved Wikipedia references; a fourth reference produces a visible pre-inference validation failure without silently dropping or reordering references.
    depends_on: [models.WikipediaReferenceContext, examples.reference_limit]
  - id: wikipedia-mentions.context.summary-only
    type: privacy
    must: AI context contains only bounded plain-text title, language, canonical source URL, optional revision and description, and lead extract for each selected article; HTML, full article bodies, images, direct Wikidata responses, Wikidata claims, and the wikibase item identifier are excluded.
    depends_on: [models.WikipediaReferenceContext, examples.context_boundary]
  - id: wikipedia-mentions.safety.fail-closed
    type: security
    must: Every selected Wikipedia description and lead extract passes deterministic ASCII-smuggling removal and the configured Groq prompt-injection detector before AI inference; blocked content, unavailable Groq safety processing, or safety errors fail the entire message visibly and no Wikipedia prose or model-knowledge fallback is submitted.
    depends_on: [models.WikipediaReferenceContext.safety_state, examples.safety]
  - id: wikipedia-mentions.ai.source-aware-intent
    type: behavior
    must: Sanitized Wikipedia reference material is delimited as untrusted source context and never as instructions; a message containing only references asks the model to explain those topics, while a message containing user instructions follows those instructions using the references and identifies Wikipedia as the source.
    depends_on: [models.WikipediaReferenceContext, examples.ai_behavior]
  - id: wikipedia-mentions.provider.bounded-access
    type: invariant
    must: OpenMates identifies itself with a compliant Wikimedia User-Agent, caches normalized language and query results, uses no more than three concurrent upstream requests, keeps its configured shared outbound budget below Wikimedia's documented client limit, respects Retry-After on 429 or 503 responses, and exposes visible retryable failures rather than bypassing throttles.
    depends_on: [models.WikipediaRequestBudget, examples.provider_limits]
  - id: wikipedia-mentions.privacy.explicit-third-party-query
    type: privacy
    must: Only the text following an explicit @wiki trigger and its selected language are sent through the OpenMates backend to Wikipedia; the user's IP is not disclosed to Wikimedia, raw query text is not persisted in application logs, and generic mention text is never forwarded.
    depends_on: [models.WikipediaMention, models.WikipediaRequestBudget.cache, examples.query_privacy]
  - id: wikipedia-mentions.surfaces.semantic-parity
    type: parity
    must: The direct API contract, OpenMates CLI, npm SDK, pip SDK, and web composer preserve the same syntax, locale, first-result, disambiguation, three-reference, sanitized-context, source-aware, throttling, and visible-failure semantics where applicable; CLI proof precedes web implementation.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: true
    role: >
      The Wikipedia search and resolution contract is a developer API-key REST
      surface that also accepts approved first-party session or device
      authentication. First-party use is free; successful developer API-key
      calls use the existing one-credit Wikipedia proxy policy. It handles public
      topic text only and no encrypted chat, memory, file, key, sync, or share data.
  cli:
    required: true
    parity: semantic
    role: Resolves explicit @wiki mentions through the real dev API before sending a real AI chat.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true, role: exposes typed Wikipedia search and selected-reference chat options}
      pip: {required: true, role: exposes typed Wikipedia search and selected-reference chat options}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true, role: provides Wiki discovery, autocomplete previews, explicit selection, and visible failures}
      apple: {required: false, role: deferred follow-up after deployed web confirmation}
    exceptions:
      - id: apple-deferred-v1
        implementation: gui.apple
        reason: The approved delivery sequence ends with CLI and web proof for this version.
        equivalent_outcome: A follow-up must add native @wiki discovery and resolution using the same backend contract.

examples:
  file: examples.yml
  required_groups: [syntax, web_discovery, resolution, disambiguation, reference_limit, context_boundary, safety, ai_behavior, provider_limits, query_privacy, surface_parity]
