schema_version: 1
specification: feature.specifications@1

specification_boundaries:
  - id: specification-is-not-a-plan
    input: {record: feature.teams, contains: [goal, requirements, flows, applies_to]}
    expect: {tasks: absent, execution_progress: absent, check_run_logs: absent}

specification_revisions:
  - id: approval-binds-exact-revision
    input: {specification: feature.teams, revision: 4, content_hash: hash-4}
    expect: {revision_4_approved: true, editable_in_place: false}

specification_authoring:
  - id: chat-created-specification-can-be-edited-directly
    given: A user discusses a recipe app in an OpenMates chat linked to a cloud Project.
    when: The assistant creates its Specification and the user edits a requirement in the readable Specification detail view.
    then: The edit creates a saved revision of that same Specification. Reopening the chat or Project shows the saved requirement and its revision state.
  - id: chat-edit-and-failed-save-remain-truthful
    given: The user has a saved recipe app Specification and asks in chat to add JSON export.
    when: The assistant proposes the edit but saving the new revision fails.
    then: The existing saved revision remains available, the proposed change is preserved for retry, and the chat and detail view report the failed save without claiming JSON export has been saved or approved.

specification_edit_conflicts:
  - id: concurrent-edit-preserves-both-versions
    given: Two authorized views have opened revision four of a Specification.
    when: One view saves revision five and the other attempts to save different changes based on revision four.
    then: The second save reports a conflict. Revision five remains saved, the second proposal stays available for review or rebasing, and no approval is transferred to the stale proposal.
  - id: current-base-saves-new-draft
    given: Revision five is the current approved Specification and an authorized editor has loaded it.
    when: The editor saves a material requirement change based on revision five.
    then: A new draft revision is saved without changing revision five or inheriting its approval, and the editor sees the new saved revision.

specification_composition:
  - id: reusable-ui-specification
    input: {behavior: shared_checkout, substantial: true, reusable: true, independent_owner: payments}
    expect: {ui_specification_allowed: true}
  - id: small-ui-detail-stays-governed
    input: {behavior: rename_button_label, reusable: false, independently_versioned: false}
    expect: {separate_ui_specification_required: false}

specification_ui_requirements:
  - id: ux-applicability
    input: {category: accessibility, applies_to: {channels: [gui], devices: [phone], audiences: [screen_reader_users]}}
    expect: {requirement_applicability_visible: true}

specification_flows:
  - id: marketing-campaign-flow
    input: {category: marketing_claim, flow_id: launch-campaign, applies_to: {markets: [de], channels: [gui, cli]}}
    expect: {flow_is_versioned: true}

specification_model_placement:
  - id: finance-ledger-model
    input: {model_kind: financial_ledger, applies_to: {systems: [billing], teams: [finance]}}
    expect: {extensible_model_kind_allowed: true}

specification_human_presentation:
  - id: research-protocol-readable
    input: {category: research_method, viewer: researcher}
    expect: {readable_text: true, raw_yaml_visible_by_default: false}

specification_diagrams:
  - id: operations-event-runbook
    input: {model_kind: runbook, applies_to: {locations: [berlin], artifacts: [event_brief]}}
    expect: {diagram_source_replacement: false, operational_context_visible: true}

specification_project_embed:
  - id: specification-preview-in-project
    input: {project: project-1, item: feature.teams, viewport: laptop}
    expect: {preview_visible: true, approval_state_visible: true}

specification_links:
  - id: plan-links-specification-revision
    input: {plan: launch-event, specification: feature.specifications, revision: 1}
    expect: {exact_revision_reference_present: true}

specification_surface_parity:
  - id: canonical-channels-remain-stable
    input: {applies_to: {channels: [rest_api, cli, sdks, gui]}}
    expect: {canonical_machine_identifiers_preserved: true}
