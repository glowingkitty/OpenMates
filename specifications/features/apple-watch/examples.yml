guest_inference:
  - id: public-budget-and-local-conversation
    assertion_ids: [apple-watch.guest.public-inference]
    given: A signed-out Watch has public free text admission and no paired account runtime.
    when: The user starts a guest conversation, sends a question, and later reopens it.
    then: The current public budget admits only the selected local guest history; the validated answer and draft are encrypted locally, the available daily percentage is shown, and examples and Login remain available without private account credentials or caches.
  - id: offline-draft-and-unconfirmed-post
    assertion_ids: [apple-watch.guest.public-inference]
    given: A guest has an edited draft, or a public POST whose response is lost.
    when: Connectivity returns, status refreshes, or the app reopens after process loss.
    then: The encrypted draft remains recoverable without automatic submission; an ambiguous dispatched request remains unconfirmed and cannot replay, while a new conversation is an explicit separate choice.
schema_version: 1
specification: feature.apple-watch@6

guest_workspace:
  - id: signed-out-watch-opens-public-chats
    given: A Watch has no authenticated account and is offline.
    when: The user launches OpenMates.
    then: Chats opens with create, search, and settings above Login, followed by bundled public examples; the controls and rows fit the Watch viewport, and no pairing attempt or main-app inspiration or topic carousel starts.
  - id: search-read-and-return-to-examples
    given: The signed-out Watch displays its bundled public examples.
    when: The user searches for Artemis, opens the matching example, reads its transcript and available previews, returns with Back, and clears the search.
    then: The selected public conversation is readable, Back returns to the guest workspace, and clearing search restores the full allowed example list with Login and workspace controls reachable.
guest_pairing:
  - id: enter-and-complete-current-login
    given: A signed-out Watch shows public examples beside a matching authenticated iPhone.
    when: The user taps Login and completes the current pairing attempt.
    then: The existing iPhone-first approval and short-URL fallback remain available, and successful pairing opens the authenticated Watch workspace.
  - id: leave-pairing-and-ignore-late-approval
    given: The user has entered Login from the guest workspace and a pairing attempt is waiting for approval.
    when: The user taps Back and an approval or completion for that departed attempt arrives, then the user opens Login again.
    then: Back restores the public workspace and cancels the departed attempt; its late response cannot change the screen or identity, and the next Login uses a new current attempt.
guest_isolation:
  - id: public-reading-never-opens-private-state
    given: A signed-out Watch has public examples and retained private records from an earlier authenticated scope.
    when: The user searches for a private chat title and opens a public example.
    then: Only allowed public examples are searchable and readable, retired introductions and private records remain absent, authenticated sync and private handoffs do not start, and public navigation does not change private last-opened state or enqueue an authenticated send.
  - id: cached-account-survives-transient-network-failure
    given: A Watch has a valid cached authenticated account and its keys and private offline content.
    when: The app launches during a temporary network failure that prevents session refresh.
    then: Existing authentication restoration preserves the account and permitted private offline workspace; guest entry does not replace it or erase keys, cookies, or caches, while explicit server revocation still follows existing authentication cleanup.
pairing:
  - id: iphone-offer-and-short-url
    given: A new Watch is next to an authenticated iPhone on the same OpenMates server.
    when: The Watch begins pairing and no iPhone approval starts within four seconds.
    then: The Watch first asks for iPhone approval, then prominently reveals the short pairing URL and code with manual code entry and no QR button; the user can reveal the URL earlier.
pairing_privacy:
  - id: old-pair-response-is-ignored
    given: A Watch pairing attempt is replaced after the user selects a self-hosted server.
    when: An approval response for the old token arrives.
    then: The Watch ignores the stale response and unlocks only after a successful pair-login response for the current server and token.
hub:
  - id: switch-watch-sections
    given: A signed-in Watch shows the compact selector.
    when: The user switches from Chats to Tasks and then Workflows.
    then: Each section is readable on the Watch display and its visible controls can be activated.
lists:
  - id: private-read-only-rows
    given: The account has encrypted Tasks and Workflow runs.
    when: The Watch loads the Task and Workflow sections.
    then: The owner sees readable Tasks in the iPhone kanban section order and readable Workflow rows; opening a row shows its private details, and the lists contain no mutation controls.
  - id: kanban-crown-and-task-read-view
    given: The Watch has Tasks in Backlog, To do, In progress, Blocked, and Done, and To do contains more Tasks than fit on screen.
    when: The user swipes to To do, turns the Digital Crown to scroll down, and taps a Task.
    then: Only the current column scrolls vertically, and the selected Task opens its private readable details with an explicit Open on iPhone action.
task_editing:
  - id: save-personal-task-on-watch
    given: An editable personal Task called Prepare meetup notes is in To do on the signed-in Watch.
    when: The user edits its title and description, selects In progress and High priority, and saves.
    then: The existing versioned update saves encrypted private text; only the accepted response updates the detail and moves the Task to In progress. Cancel would leave the Task unchanged.
  - id: failed-or-stale-task-edit
    given: The user has an unsaved Task edit on Watch.
    when: Saving fails, or the account or server changes before the response arrives.
    then: An ordinary failure retains the edit for retry without showing success; an account or server change prevents the old response from changing credentials or displaying private content. Team, read-only, and workflow-run Tasks have no Edit control.
workflow_details:
  - id: inspect-workflow-nodes-on-watch
    given: A personal Workflow has a time trigger, an app-skill action, an Ask AI action, a Check with true and false branches, and a Send message action.
    when: The user opens the Workflow, expands the nodes, and scrolls with the Digital Crown.
    then: The compact view shows configuration, input references, and real connections; existing editable personal nodes offer an editor, Back returns to the list, and Open on iPhone is available, with no run controls.
  - id: edit-and-guard-workflow-save
    given: A personal Workflow detail is open on Watch with a Send message node.
    when: The user edits its message and saves, cancels, or encounters a failure or intervening Workflow change.
    then: An accepted save updates that node while preserving other graph fields and activation; Cancel makes no changes, failure retains the edit for retry, and a detected conflict requires reload. Changed identity or selection discards late responses, empty graphs are explained, and unsupported Team context is unavailable.
handoff:
  - id: exact-task-on-matching-phone
    given: A Watch and iPhone use the same self-hosted OpenMates server and a Task with an opaque id is visible.
    when: The user opens the Task read view and chooses Open on iPhone.
    then: A generic iPhone notification opens that exact Task on the server's HTTPS website; the Watch message contains no title, private text, or URL.
chats:
  - id: find-older-chat-offline
    given: A signed-in Watch has more than twenty saved chats and a cached conversation.
    when: The user searches for an older chat during a brief network outage and opens it.
    then: The matching saved chat is findable and readable from available local content without showing a different or private incognito chat.
replies:
  - id: new-chat-and-encrypted-text
    given: A signed-in Watch is showing Chats.
    when: The user starts a new chat and sends a text question.
    then: The selected chat shows the client-encrypted user turn and receives a normal inference response; a failed preflight leaves the turn available to retry.
audio:
  - id: one-send-audio-embed
    given: A conversation is open on the Watch and microphone permission is granted.
    when: The user records audio and taps Send once.
    then: Finishing prepares editable local words without sending; explicit Send keeps the original conversation and attaches one normal encrypted audio embed when selected, readable on Watch, iPhone and web without a duplicate transcription turn.
chat_layout:
  - id: small-watch-conversation
    assertion_ids: [apple-watch.chats.compact-layout]
    given: A conversation with a website embed is open on a small Watch.
    when: The user views the transcript and reply area.
    then: The embed fits the viewport and the text and audio reply controls remain reachable.
  - id: mobile-preview-hierarchy-and-readable-text
    assertion_ids: [apple-watch.chats.compact-layout]
    given: A Watch conversation contains a hydrated sheet with a declared 58 cells and previews from the other supported embed families.
    when: The user reads the transcript, views the previews, and increases Dynamic Type.
    then: Transcript text starts at a scalable 15 points; long-press Zoom in and Zoom out resize it and retain only the preference; every preview is 156 points wide with its bounded payload visual above the full-width gradient app-icon bar and its centered title and metadata below. The sheet shows bounded real cells and reports 58 cells.
  - id: markers-with-incomplete-or-missing-payload
    assertion_ids: [apple-watch.embeds.read-only-fullscreen]
    given: A message contains actual embed markers while its supplied embed-reference list is empty or partial, and one referenced embed has no decrypted payload.
    when: The Watch renders the message and the user opens the unavailable preview's continuation action.
    then: Actual marker references are merged without duplicating or discarding richer supplied data; the missing payload is visibly unavailable with no invented preview content, and continuation remains usable.
  - id: inline-group-and-read-only-detail
    assertion_ids: [apple-watch.embeds.read-only-fullscreen]
    given: A Watch message contains text before and after two consecutive sheet previews, with available real cells, and another message has image thumbnails and valid map coordinates.
    when: The user scrolls the previews horizontally and opens the selected sheet, image, or map.
    then: The group stays between the original text blocks in iPhone ordering; fullscreen reads the selected hydrated content including full cells, thumbnails, and the coordinate map with Back and explicit iPhone continuation, and exposes no edit control. Unavailable content remains explicit.
offline_cohort:
  - id: unopened-recent-chat-after-network-loss
    given: Twenty-one ordinary chats include an old pinned chat; the most recently active unpinned chat has 101 encrypted messages and an encrypted sheet embed with wrapped keys.
    when: Watch completes serial maintenance while active, loses network access, and the user opens the recent chat for the first time and pages backward and forward.
    then: Exactly the latest twenty chats have complete encrypted receipts, excluding the old pinned chat; the recent chat opens with its cached sheet preview, all 101 messages are reachable in pages of at most fifty, and bulk binary assets have not been downloaded.
  - id: interrupted-or-wrong-scope-maintenance
    given: A Watch maintenance request is in progress or returns a partial response or a mismatched full message count.
    when: The user opens a foreground detail, the app backgrounds, or the account or server changes before completion.
    then: Maintenance stops and late responses cannot commit a receipt or alter visible content; valid receipts remain usable in their original scope, another account or server cannot open them, maintenance can resume when eligible, and logout removes the encrypted cohort files.
input_actions:
  - id: three-controls-with-existing-text
    given: The user opens either a new Watch chat or an existing chat and types an unsent question.
    when: The user operates keyboard, microphone and phone from the fixed bottom action row.
    then: All three actions remain reachable, typing never hides the microphone or clears the draft, and a call opens only through a qualified physical route with explicit consent and exclusive audio ownership.
  - id: call-blocks-recording-and-retains-typed-input
    given: A verified Watch call owns audio in chat A while chat B also has an unsent draft.
    when: The user tries to record, submits text to A, opens B, or receives a rejection for A's typed submission.
    then: Competing recording is unavailable, A's text uses its existing call exactly once, B keeps ordinary text behavior, and a rejected A submission is retained without being restored into B.
local_transcription:
  - id: finish-locally-edit-then-send
    given: A supported Watch has the included Whistle assets, an existing draft and a new microphone recording.
    when: The user finishes recording offline, edits the appended words, chooses whether to attach audio and later explicitly sends.
    then: Finishing performs local transcription only, preserves the prior draft, and retains the draft through encrypted scoped storage; explicit Send uses one original chat turn and at most one selected audio embed.
  - id: cancellation-or-unsupported-runtime
    given: Local transcription is pending or the current Watch build lacks a supported native runtime.
    when: The user cancels, leaves the foreground or changes account, or attempts transcription on the unsupported build.
    then: No late text enters another draft, existing owned text remains available, unsupported execution is truthful, and no network transcription fallback or duplicate live-call transcript starts.
