schema_version: 1
specification: feature.marketing-landing@8
scrolling:
- id: visitor-controls-reading-time
  given: Alex opens the standalone website while signed out and JavaScript is unavailable.
  when: Alex reads the privacy section and scrolls to Workflows at their own pace.
  then: All sections and public links remain readable without login, automatic slides or a chat shell.
- id: website-client-boundary
  given: The standalone website is built for deployment separately from the web app.
  when: Its emitted browser modules and transferred JavaScript are inspected.
  then: The build contains public-site UI and content only; it contains no app authentication, chat sync,
    account database or message editor, and its compressed client size is reported.
layout:
- id: phone-reduced-motion
  given: Sam opens the website on a phone with reduced motion enabled.
  when: Sam explores the hero, features and publication rows.
  then: Readable static copy and device images stack without horizontal page overflow; links remain reachable
    and scrolling controls the reading pace. As each section enters view, its heading, copy and imagery
    appear in a gentle stagger while Alex keeps control of scrolling; reduced motion shows them immediately.
- id: six-full-screen-sections
  given: Alex scrolls the six website feature sections on a laptop, then opens the page on a phone.
  when: Alex reaches No ecosystem lock in and compares its device images.
  then: The six sections appear actionable, privacy, model choice, workflows, devices and open source;
    each occupies a viewport. Large desktop devices may crop intentionally, phones show only phone imagery,
    and the model selector captures are real with multiple providers, export and ownership explained.
    As each section enters view, its heading, copy and imagery appear in a gentle stagger while Alex keeps
    control of scrolling; reduced motion shows them immediately.
destinations:
- id: website-app-links
  given: Alex visits landing.dev.openmates.org while signed out.
  when: Alex selects Open Web App, Explore Apps, Explore Workflows, an official social
    icon or the TestFlight testing link.
  then: Open Web App reaches the configured dev app root; Explore and social links open new tabs; the TestFlight
    link scrolls to newsletter signup. The full wordmark returns to the website home, with no workspace tabs.
- id: shared-compact-header
  given: Sam visits the website home, news, blog or legal pages on a 320-pixel phone or a wide desktop.
  when: Sam reads the landing browser tab, then uses the header and opens language selection.
  then: The complete OpenMates wordmark remains visible, the orange Open Web App pill sits at the right,
    and the language icon immediately before it has an accessible current-language name without visible
    EN or DE text. The language panel stays within the screen. GitHub appears when space permits.
    Blog links stay on the website and non-HTTP origin overrides are rejected. The landing tab and social
    previews say OpenMates — Your privacy first AI team mates.
catalog_alignment:
- id: matching-default-examples
  given: Alex sees Events, Travel and Code first on the landing page and has not selected interests in the web app.
  when: Alex opens the web-app welcome screen and browses its default example cards.
  then: The same Events, Travel and Code conversations lead the complete landing example set in the same
    order. Alex's own local conversation remains ahead of the examples, and selecting interests or Show all
    still works.
- id: retain-capability-coverage
  given: Two older chats demonstrate image search, neither is linked on the landing page, and one separate
    chat is the only demonstration of speech generation.
  when: The public example catalog is cleaned up.
  then: One successful image-search example and the sole speech-generation example remain. The redundant
    image-search chat disappears from discovery, direct example pages and interest mappings. Landing-linked
    examples and their child conversations remain available.
hero_entrance:
- id: staged-first-impression
  given: Sam opens the landing page in a fresh tab with normal motion enabled.
  when: The hero first appears.
  then: The AI icon and heading fade and settle into view first, followed by the user message, app row and
    In seconds text, then the scroll cue. The message input appears after its availability check, and the finished
    layout is fully visible without shifted or overlapping elements.
- id: reduced-motion-and-return
  given: Alex either requests reduced motion or returns to the landing tab after opening an example chat.
  when: Alex reads the hero and scrolls to the next section.
  then: Reduced motion shows the complete hero immediately. Returning to the tab leaves the completed
    entrance visible and does not restart it or interfere with scrolling.
composer:
- id: available-testing-focus
  given: Free testing is enabled with available server capacity, and Alex has an unsent app draft.
  when: Alex visits the landing page and then activates the message-input link after the status check.
  then: The initially hidden input fades and rises into view with Test for free, or Kostenlos testen in
    German. It opens the real composer focused, preserves the draft and sends no message.
- id: unavailable-testing-signup
  given: Free testing is disabled, its global budget is exhausted, or the availability check cannot finish.
  when: Alex visits the landing page and the check settles or reaches its timeout.
  then: The input appears with Try out now, or Jetzt ausprobieren in German, and opens the existing signup
    entry. Reduced motion shows the input without a fade or movement, and no free testing is advertised.
screenshots:
- id: real-safe-device-images
  given: The personal dev account displays events, privacy and Workflows, and the same chat on desktop
    and mobile web.
  when: These views and the public OpenMates repository are prepared as website images.
  then: Large phone/laptop SVG frames contain matching real captures, including cross-device and open-source
    sections; images have useful alternative text, omit private account details and label mobile web truthfully.
    Phone frames have a neutral bezel with no orange border.
public_content:
- id: all-upcoming-events-and-human-detail
  given: Published events include an ongoing free workshop, a future paid meetup and a finished event.
  when: Alex scrolls the events row and opens a card; Jo opens its public SEO page in a normal browser.
  then: Both unfinished events appear, the finished event does not, no Browse link appears, and both visitors
    reach the real app event detail while the SEO document remains readable to crawlers.
- id: public-website-content-and-empty-events
  given: News releases and blog posts are published, and all events have finished.
  when: Sam visits the website news, blog and privacy/terms pages and scrolls to events.
  then: News and blog retain their published content, legal pages show the full readable documents without
    a chat shell, and events show an honest empty state.
hero:
- id: one-seamless-capability-rail
  given: Alex opens the hero on a phone, short landscape screen, tall portrait tablet or large desktop
    and leaves it running for several complete cycles.
  when: The ordered capability icons, including Docs and Mindmaps, pass through the rail.
  then: One icon row moves without a visible reset, uses faded edges and a matching natural request. Internal
    workspaces, OpenMates and Plants are absent; only apps with admitted successful capability examples
    appear. Resizing the page and resuming after a background tab preserve continuous movement and matching
    highlighting. The hero shows the existing AI icon with a soft gradient glow and gentle vertical
    hover; no phone or laptop appears there. Its heading, bubble and icons fill a proportionate amount
    of space without excessive gaps, oversized elements, clipping or overlap, including German prompts.
    Each app begins and ends its highlight at equal distances
    to either side of In seconds.
- id: ordered-capability-rail
  given: Alex opens the German landing hero.
  when: The rail passes Events, Travel, Code, Home, Health, Social Media, Fitness, Mail, Jobs, Docs and
    Mindmaps.
  then: The headline reads “Deine KI-Teamkollegen\nmit Privatsphäre” with the app highlight centered beneath
    In seconds; prompts are short generic capability requests each linked to a matching existing example
    chat, without an added link icon. The icon corners have the same proportional shape as the signup
    background. OpenMates, Projects, Tasks, Plans, Reminders, Workflows and Plants are absent. The responsive
    bubble keeps its position while fading, and the aligned scroll cue remains readable. Every shown app
    has a real successful capability example; unpublished entries are absent. Selecting an icon centers
    it under In seconds. With reduced motion, the AI icon, glow and section content are static.
manual_rail:
- id: select-and-resume
  assertion_ids:
  - marketing-landing.interactive-rail
  given: Alex watches the moving app row on a laptop, with Events highlighted.
  when: Alex clicks Travel, waits two seconds and then scrolls horizontally through the icons.
  then: Travel moves into focus and shows Find train connections without opening another tab. It stays
    in focus for two seconds, then movement continues from Travel. Manual scrolling updates the selected
    app and message without a jump when automatic movement resumes.
- id: touch-and-keyboard-selection
  assertion_ids:
  - marketing-landing.interactive-rail
  given: Sam uses a phone, while Jo uses a keyboard with reduced motion enabled.
  when: Sam swipes the app row horizontally and scrolls the page vertically; Jo selects another app.
  then: Sam can explore apps without blocking page scrolling. Jo can select and read every app's request
    without automatic movement, and neither interaction opens an app page.
metadata_defaults:
- id: app-owned-defaults
  assertion_ids:
  - marketing-landing.app-metadata-defaults
  given: Travel metadata declares its available train-search capability, Find train connections caption
    and a real chat showing a natural train-search request.
  when: The public website is built and a visitor selects Travel.
  then: The compiled app catalogue supplies that caption and example destination without a runtime app
    metadata request or a separate landing mapping. The message opens the real train example.
- id: reject-unrelated-or-unsuccessful-defaults
  assertion_ids:
  - marketing-landing.app-metadata-defaults
  given: A Calendar example summarizes only pasted events, while a Finance example invokes Math rather
    than a Finance capability and a Maps example finds no restaurants meeting its required amenities.
  when: The public landing examples are reviewed and the website catalogue is built.
  then: Those entries stay unpublished; the supplied-events Calendar example is removed. The build rejects
    any published default missing a successful matching capability instead of promoting a generic or failed
    response.
preferences:
- id: dark-startup-without-flash
  given: Alex previously chose dark theme and opens the website or /landing on a cold start.
  when: The initial page appears and client startup completes.
  then: The page stays dark throughout with no light flash.
- id: language-only-selection
  given: Sam opens the current-language control in the public header.
  when: Sam selects Deutsch and later reloads the page.
  then: The panel offers supported-language names only, the preference persists and available public translations
    apply; there are no account, payment, chat or synchronization settings.
