schema_version: 1
id: feature.marketing-landing
version: 1
status: draft
title: Scrollable Marketing Landing Page
summary: >
  A standalone public landing page explains OpenMates through the updated Figma
  design, with visitor-controlled scrolling and links into the web app.
scope:
  includes:
    - The temporary /landing route, independently rendered from the app shell.
    - The hero, five feature sections, and public events, news, and blog rows.
    - Responsive layout, category icons, screenshots, and accessible navigation.
    - Web-app workspace, account, example-chat, and composer deep links.
    - Configurable app and website destinations for the later domain split.
  excludes:
    - Changing the existing root app or its guest onboarding carousel.
    - Production DNS, authentication, cookie, passkey, or OAuth migration.
    - Writing the future feature blog posts or changing native Apple UI.
    - Pixel-for-pixel matching of wireframe placeholders or sidebar draft data.
assertions:
  - id: marketing-landing.independent-scroll
    type: behavior
    must: >
      /landing renders public content without requiring app authentication or
      the chat shell. Visitors explore the complete page through normal
      scrolling; automatic story transitions do not determine reading time.
    depends_on: [examples.scrolling]
  - id: marketing-landing.feature-layout
    type: behavior
    must: >
      The page follows the referenced Figma hierarchy: hero, actionable chats,
      privacy and safety, workflow automation, cross-device experience, open
      source and resilience, then events, news, and blog. Each feature has an
      appropriate distinct icon. Desktop copy and screenshots sit side by side;
      narrow screens stack them without hiding links or overflowing the page.
    depends_on: [examples.layout]
  - id: marketing-landing.destinations
    type: behavior
    must: >
      Explore Apps and Explore Workflows open their web-app workspaces in new
      tabs. Login/Signup opens the web app's account interface. Example links
      open the corresponding real shared chats. Learn-more links lead to the
      OpenMates blog index until dedicated feature posts are available. App and
      website destinations can be configured independently; the temporary page
      uses its current deployment and the dev landing host targets the dev app.
      Configured destinations use HTTP or HTTPS.
    depends_on: [examples.destinations]
  - id: marketing-landing.composer-focus
    type: behavior
    must: >
      Activating the hero's message-input affordance opens the web app with its
      real message composer focused. This explicit focus request survives a
      cold start and does not send a message, replace an existing draft, or
      require the user to click the composer again.
    depends_on: [examples.composer]
  - id: marketing-landing.real-screenshots
    type: behavior
    must: >
      Wireframe screenshot areas display real rendered product screenshots
      collected within the authenticated personal dev test account, showing
      actionable event results, privacy placeholders, and Workflows. Screenshots
      exclude private identity and unrelated account content, provide meaningful
      alternative text, and identify mobile web captures as web rather than
      implying that they are native iPhone captures.
    depends_on: [examples.screenshots]
  - id: marketing-landing.public-content
    type: behavior
    must: >
      Events, news, and blog rows reuse published OpenMates content and working
      public destinations. The upcoming free-events row excludes paid and
      finished events. When no matching records exist, the row offers an honest
      empty state and browse link instead of fabricated cards.
    depends_on: [examples.public_content]
applies_to:
  rest_api: {required: false}
  cli: {required: false}
  sdks:
    required: false
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    implementations:
      web: {required: true}
      apple: {required: false}
examples:
  file: examples.yml
  required_groups: [scrolling, layout, destinations, composer, screenshots, public_content]
