schema_version: 1
specification: feature.checks@1

check_reuse:
  - id: one-check-used-by-several-plans
    input: {check: plans-web-lifecycle, plans: [plan-a, plan-b], check_revision: 3}
    expect: {check_records_created: 1, independent_runs_allowed: true}
  - id: edit-check-creates-revision
    input: {check: plans-web-lifecycle, current_revision: 3, change: add_mobile_assertion}
    expect: {new_revision: 4, revision_3_unchanged: true, old_runs_rewritten: false}

grouped_check_sources:
  - id: one-flow-proven-across-platforms
    input:
      check: user-can-create-team
      covered_flow: {contract_id: contract-1, contract_revision_id: contract-rev-4, flow_id: create-team}
      sources:
        - {kind: e2e, surface: web, source: teams-flow.spec.ts, role: required}
        - {kind: e2e, surface: apple, source: TeamsFlowUITests.swift, role: required}
        - {kind: unit_suite, source: test_team_key_generation.py, test_count: 42, role: supporting}
    expect: {check_records: 1, required_platform_runs_distinct: true, unit_test_check_records: 0, combined_status_visible: true}
  - id: grouped-unit-check-without-e2e
    input:
      check: team-keys-are-isolated
      sources:
        - {kind: unit_suite, source: test_team_keys.py, test_count: 38, role: required}
        - {kind: deterministic_audit, source: audit_team_key_boundaries.py, role: required}
    expect: {e2e_required: false, check_materialized: true, all_required_sources_gate_pass: true}
  - id: required-source-failure-blocks-aggregate-pass
    input: {check: user-can-create-team, source_results: [{source: web-e2e, role: required, status: passed}, {source: apple-e2e, role: required, status: failed}, {source: unit-suite, role: supporting, status: passed}]}
    expect: {aggregate_status: failed, passing_web_result_retained: true, failed_apple_result_visible: true}
  - id: source-opens-stable-code-location
    input: {source_ref: {project_source_id: opencode-dev, path: backend/tests/test_teams.py, test_selector: test_unique_team_key, revision: git-abc}}
    expect: {raw_path_only: false, exact_revision_openable: true, code_embed_optional: true}

mixed_sources:
  - id: signup-with-passkey-mixed
    input:
      check: signup-works-passkey
      requires_deterministic: false
      sources:
        - {kind: e2e, source: signup-flow-passkey.spec.ts, role: required}
        - {kind: unit, source: test_signup_passkey_registration.py, role: required}
        - {kind: ai_evaluation, question: "Is the passkey step explained in plain language without jargon?", role: supporting}
        - {kind: human_confirmation, instruction: "Create a passkey on a real iPhone", role: required}
      source_results: [{source: e2e, status: passed}, {source: unit, status: passed}, {source: ai_evaluation, status: failed}, {source: human_confirmation, status: pending}]
    expect: {aggregate_status: waiting_for_confirmation, reported_as_failed: false, ai_result_visible: true, ai_result_gates: false, each_source_keeps_own_type: true}
  - id: human-confirms-then-green
    input: {check: signup-works-passkey, previous_status: waiting_for_confirmation, human_decision: confirmed}
    expect: {aggregate_status: passed}
  - id: human-rejects
    input: {check: signup-works-passkey, previous_status: waiting_for_confirmation, human_decision: rejected}
    expect: {aggregate_status: failed}
  - id: required-ai-question-fails
    input:
      check: plan-detail-readable
      sources:
        - {kind: e2e, source: plan-detail-preview.spec.ts, role: required}
        - {kind: ai_evaluation, question: "Can a non-technical reader tell which assumptions are still open?", role: required}
      source_results: [{source: e2e, status: passed}, {source: ai_evaluation, status: failed, verdict: failed}]
    expect: {aggregate_status: failed, feedback_present: true}
  - id: security-claim-without-deterministic-source
    input:
      check: viewer-cannot-mutate-team
      requires_deterministic: true
      sources:
        - {kind: ai_evaluation, question: "Does the code prevent viewers from editing?", role: required}
        - {kind: human_confirmation, instruction: "Try to edit as a viewer", role: required}
    expect_error: {code: CHECK_DETERMINISTIC_SOURCE_REQUIRED, revision_accepted: false}
  - id: security-claim-with-deterministic-and-ai
    input:
      check: viewer-cannot-mutate-team
      requires_deterministic: true
      sources:
        - {kind: integration, source: test_team_permissions.py, role: required}
        - {kind: ai_evaluation, question: "Is the permission error message understandable?", role: supporting}
    expect: {revision_accepted: true}
  - id: result-type-must-match-binding
    input: {binding_kind: unit, reported_result_kind: human_confirmation}
    expect_error: {code: CHECK_RESULT_MISMATCH, result_accepted: false}

test_catalog:
  - id: index-large-repository
    input: {repository_test_count: 5000}
    expect: {catalog_entries_searchable: true, project_check_cards_created: 0}
  - id: promote-relevant-test
    input: {catalog_entry: plans-flow.spec.ts, requested_by: plan-1}
    expect: {materialized_checks: 1, unrelated_test_checks_created: 0}
  - id: group-test-cases
    input: {file: plans-flow.spec.ts, test_cases: 12, claim_group: encrypted_plan_lifecycle}
    expect: {one_check_may_cover_group: true, one_card_per_test_case_required: false}

check_runs:
  - id: exact-revision-pass
    input: {check_revision: 4, subject_revision: git-abc, result: passed}
    expect: {current_for_git_abc: true, previous_runs_retained: true}
  - id: subject-changed
    input: {latest_pass_subject: git-abc, current_subject: git-def}
    expect: {status: stale, reported_as_current_pass: false}
  - id: definition-changed
    input: {latest_pass_check_revision: 3, current_check_revision: 4}
    expect: {status: stale, rerun_required: true}
  - id: result-kind-and-status-must-match
    input: {binding_kind: ai_evaluation, result_kind: human_confirmation, ai_verdict: failed, source_status: passed}
    expect_error: {code: CHECK_RESULT_MISMATCH, result_accepted: false}

check_types:
  - id: deterministic-playwright
    input: {source_kind: e2e, source: plans-flow.spec.ts}
    expect: {runner_required: true, human_decision_required: false, deterministic: true}
  - id: qualitative-design-review
    input: {source_kind: ai_evaluation, question: "Is the plan detail hierarchy clear?", subject: plan_detail_screenshots}
    expect: {question_required: true, verdict_and_feedback_required: true, deterministic: false}
  - id: physical-device-confirmation
    input: {source_kind: human_confirmation, subject: hardware_button_works}
    expect: {named_confirmation_required: true, fake_automated_pass: false, pending_shows: waiting_for_confirmation}

ai_evaluation:
  - id: below-threshold
    input:
      model: evaluator-model-v1
      input_revision: artifact-hash-1
      threshold: 85
      scores: {clarity: 92, completeness: 61, accessibility: 80}
      total: 78
    expect: {verdict: failed, feedback_present: true, required_fixes_present: true}
  - id: security-claim-needs-deterministic-proof
    input: {claim: viewer_cannot_mutate_team, proposed_sources: [ai_evaluation]}
    expect: {accepted_as_only_source: false, deterministic_source_required: true}

human_confirmation:
  - id: user-approves-subjective-ui
    input: {subject: intended_visual_hierarchy, confirmer: user-1, decision: confirmed}
    expect: {timestamp_present: true, plan_may_continue: true}
  - id: pending-confirmation-is-not-failure
    input: {required_sources: [{kind: e2e, status: passed}, {kind: human_confirmation, status: pending}]}
    expect: {check_status: waiting_for_confirmation, failed_visible: false}
  - id: inaccessible-external-system
    input: {subject: partner_portal_configuration, confirmer: user-1, decision: blocked}
    expect: {check_status: blocked, silent_pass: false}

check_artifacts:
  - id: browser-failure-artifacts
    input: {run: run-1, artifacts: [screenshot, video, trace, html_report]}
    expect: {all_hash_bound: true, storage_refs_encrypted: true, preview_authorized: true}
  - id: unit-test-output
    input: {run: run-2, artifacts: [stdout, junit_report]}
    expect: {video_required: false, structured_summary_visible: true}

check_project_embed:
  - id: preview-shows-latest-state
    input: {project: project-1, check: plans-web-lifecycle, latest_run: failed}
    expect: {type_visible: true, failed_visible: true, covered_claims_summary_visible: true}
  - id: fullscreen-run-history
    input: {check: plans-web-lifecycle, runs: [run-1, run-2, run-3]}
    expect: {history_ordered: true, stale_runs_distinguished: true, artifacts_openable: true}

check_surface_parity:
  - id: same-run-provenance
    input: {surfaces: [rest_api, cli, sdk_npm, sdk_pip, gui_web], run: run-1}
    expect: {same_check_revision: true, same_subject_revision: true, same_status: true}
