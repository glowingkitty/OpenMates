schema_version: 1
specification: feature.terminal-ui@1
visible_actions:
- id: click-workspace-card-and-project-tab
  assertion_ids:
  - terminal-pointer.visible-action-parity
  given: OpenMates is running over SSH in a terminal with mouse reporting, with the Chats workspace visible.
  when: I click Projects in the header, click the OpenMates project card, then click its Tasks tab.
  then: The Projects workspace opens, the selected project opens once, and its existing Tasks section
    becomes active, just as with keyboard navigation.
- id: click-embed-question-and-composer
  assertion_ids:
  - terminal-pointer.visible-action-parity
  given: An open chat shows a fitness class embed, a wiki link and an unanswered choice question.
  when: I click the embed or wiki link, return to the chat, choose an answer in the question editor, then
    click Send. Later I click the message input.
  then: Each link opens its existing view. Choosing an answer only changes the draft; Send validates and
    submits it once. The input gains focus without sending a message.
viewport_targets:
- id: resized-and-scrolled-carousel-target
  assertion_ids:
  - terminal-pointer.viewport-coherent
  given: The recent-chat carousel shows Berlin trip planning next to Dance classes, and the terminal is
    resized before I scroll to another card.
  when: I click the visible part of the Dance classes card at its new position.
  then: Dance classes opens. The old card positions and blank space do not activate another chat.
- id: dialog-prevents-click-through
  assertion_ids:
  - terminal-pointer.viewport-coherent
  given: A project editing dialog is open above the project content, with the existing project name still
    visible behind it.
  when: I click outside the dialog where a background project tab would otherwise be.
  then: The background tab does not activate, the dialog stays open, and its unsaved fields are preserved.
terminal_lifecycle:
- id: native-selection-and-keyboard-fallback
  assertion_ids:
  - terminal-pointer.lifecycle-selection-safe
  given: A chat is open in a desktop terminal, and I enable the existing Ctrl+Y text-selection mode.
  when: I drag across chat text, leave selection mode, and use the keyboard to navigate. I also open OpenMates
    in a terminal that sends no mouse events.
  then: The drag selects text without opening links or cards, and keyboard navigation works in both terminals.
    Mouse report bytes never appear as typed messages.
- id: release-and-external-command-cleanup
  assertion_ids:
  - terminal-pointer.lifecycle-selection-safe
  given: Mouse reporting is active while OpenMates runs in a terminal.
  when: I click and release a card, use a right or modified click, then leave the TUI or temporarily run
    an external command.
  then: The normal click activates once; release and the other clicks do not activate anything. The shell
    receives ordinary terminal input while OpenMates is inactive, and resuming restores the correct mouse
    or text-selection mode.
fullscreen_navigation:
- id: embed-back-to-project-chat
  assertion_ids:
  - terminal-chrome.navigation.origin-preserved
  given: I opened a chat from the Berlin trip project, scrolled its history, and left a follow-up draft
    before opening an event embed.
  when: I click Back or the chat breadcrumb in the embed header, then close the chat.
  then: The embed returns to that chat with its draft and usable history position; closing the chat returns
    to its project without deleting anything.
- id: escape-closes-menu-before-view
  assertion_ids:
  - terminal-chrome.navigation.origin-preserved
  given: A fullscreen embed is open and its More menu is expanded.
  when: I press Escape, then press Escape again.
  then: The first Escape closes only More; the second returns to the view that opened the embed.
header_actions:
- id: copy-code-and-download
  assertion_ids:
  - terminal-chrome.actions.contextual-and-functional
  given: I opened a saved Python code embed in a wide terminal.
  when: I use Copy, then Download and choose a local destination with an existing filename; I return to
    the chat and open Chat settings to browse Plan, Tasks, Files, Usage and Share.
  then: Copy provides a selectable clipboard fallback, and Download identifies the CLI machine and confirms
    before overwriting. Chat settings show existing data and supported controls with readable loading,
    empty and failure states; closing restores my chat and unsent draft.
- id: narrow-and-unsupported-actions
  assertion_ids:
  - terminal-chrome.actions.contextual-and-functional
  given: A fitness search result has no original file to download, and I narrow the terminal.
  when: I inspect the header and open More using the keyboard.
  then: The breadcrumb and Close remain usable; supported secondary actions remain reachable in More,
    and a nonfunctional Download button is absent.
sharing:
- id: configure-private-share-before-generating
  assertion_ids:
  - terminal-chrome.share.explicit-and-private
  given: I opened a private chat containing an email address and an attached event result.
  when: I click Share, choose an expiration, click Generate Link, explicitly choose Show QR code, then
    resize and return to sharing.
  then: Share alone creates no link or QR. Generate Link applies privacy defaults and expiration. The
    complete locally generated QR encodes the same URL including its encryption fragment; small viewports
    offer resize/copy instead of clipping. Back preserves configuration; owner changes clear the private
    link and QR. Copy or Show URL remain explicit.
- id: existing-public-link-and-failed-generation
  assertion_ids:
  - terminal-chrome.share.explicit-and-private
  given: A public example already has a share URL, while a different private embed is open offline.
  when: I open sharing for the public example, then try generating a share link for the private embed.
  then: The public link can be reused; the offline attempt shows a recoverable failure without inventing
    a URL or exposing private keys or passwords in status text.
settings_layout:
- id: wide-left-panel-preserves-chat
  assertion_ids:
  - terminal-settings.shell.responsive-and-restorable
  given: A 160-column terminal shows an open chat with an unsent draft and the chat sidebar open.
  when: I click Settings at the top right, browse a page, and close settings.
  then: Settings occupies the left panel with the chat beside it, replaces the overlapping chat sidebar,
    and closing restores the chat context and draft. The input keeps its current maximum width.
- id: narrow-settings-and-live-resize
  assertion_ids:
  - terminal-settings.shell.responsive-and-restorable
  given: An 80-column terminal shows a settings form with an unfinished edit.
  when: I click where the underlying chat used to be, resize to 160 columns, then resize back and close
    settings.
  then: Obscured chat controls do not activate; the settings route and edit survive both layout changes,
    and closing returns to the prior view.
settings_navigation:
- id: nested-interface-page-and-browser-flow
  assertion_ids:
  - terminal-settings.navigation.web-hierarchy-and-capabilities
  given: I am signed in and the settings root is open.
  when: I open Interface and its Language page, go back, then open a browser-only security flow.
  then: Language opens a native page with clear parent navigation and identifies the affected web preference;
    the security flow explains that it needs the web app and provides its destination without pretending
    to run a browser dialog in the terminal.
- id: unavailable-route-and-account-context
  assertion_ids:
  - terminal-settings.navigation.web-hierarchy-and-capabilities
  given: I am logged out or using a restricted paired session, and a settings shortcut points to an unavailable
    account page.
  when: I follow that shortcut and return to settings root.
  then: The shell shows a usable recovery destination and only context-appropriate operations; private
    account controls and dynamic chat or embed share routes are not listed as ordinary root entries.
settings_operations:
- id: validated-setting-save-and-retry
  assertion_ids:
  - terminal-settings.operations.validated-and-owner-scoped
  given: A supported account setting is open as readable fields in the terminal.
  when: I enter an invalid value, correct it, and save twice while the first request is pending; the request
    then fails offline.
  then: Invalid input is rejected before submission, only one valid request runs, and the error remains
    visible with the edit available for retry instead of falsely claiming a saved value.
- id: context-switch-and-destructive-confirmation
  assertion_ids:
  - terminal-settings.operations.validated-and-owner-scoped
  given: A settings read is pending for one account or team, and a destructive settings operation is available.
  when: I change the active context before the read finishes, then activate the destructive operation
    and cancel its confirmation.
  then: The old context's values do not appear in the new context, and cancelling prevents the destructive
    operation from running.
workspace_parity:
- id: wide-workspace-with-fixed-composer
  assertion_ids:
  - terminal-ui.workspaces.web-aligned
  given: I use a large terminal and open Projects, Workflows and Tasks.
  when: I navigate cards and project tabs, inspect workflow runs, and move between task columns.
  then: The workspaces use the available width, status and focus are visible, and the centered composer
    remains within its existing maximum width.
offline_workspaces:
- id: offline-return-to-recent-work
  assertion_ids:
  - terminal-ui.offline.cache-first
  given: My own recent chats, project and task board have already been synchronized.
  when: I disconnect, open a recent chat and switch back to Projects and Tasks.
  then: Available cached content appears without waiting for the network, and a retry remains available
    without exposing another account’s data.
rich_chat:
- id: styled-chat-with-actionable-embeds
  assertion_ids:
  - terminal-ui.chat.rich-content
  given: An assistant message contains headings, bold words, wiki links, an audio embed and a question.
  when: I read it, browse the message’s embed carousel, switch a results view to Calendar and answer the
    question.
  then: Formatting is styled, the links show their commands, the preview has its app-colored information
    bar and transcript excerpt, and choosing an answer does not submit until I explicitly send.
upcoming_embeds:
- id: event-highlight-expires
  assertion_ids:
  - terminal-ui.home.upcoming-only
  given: A saved event has a start and end time.
  when: I visit Chats before it starts, while it runs and after it ends.
  then: It is highlighted before and during the event, disappears from the priority cards after its end,
    and remains accessible in its chat.
