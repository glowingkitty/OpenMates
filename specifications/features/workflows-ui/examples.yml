schema_version: 1
specification: feature.workflows-ui@2
visual_language:
- id: all-workflow-views-share-one-visual-family
  given:
    states:
    - workspace
    - new_draft
    - dirty_template
    - historical_version
    - runs
    themes:
    - light
    - dark
  expect:
    layered_color_grey_token_surfaces: true
    raw_grey_values: false
    category_gradient_identity: true
    rounded_soft_elevated_panels: true
    compact_pill_controls: true
    harsh_outlines: false
    surface_hierarchy_preserved_in_dark_mode: true
workflow_identity:
- id: generated-software-workflow-identity
  given:
    generated_category: software_development
    generated_icon: code
  expect:
    gradient_source: existing_category_gradients.software_development
    header_uses_software_blue_gradient: true
    header_icon: code
    cards_match_header_identity: true
- id: generated-weather-workflow-icon
  given:
    generated_category: general_knowledge
    generated_icon: cloud-rain
  expect:
    gradient_source: existing_category_gradients.general_knowledge
    header_icon: cloud-rain
    cards_match_header_identity: true
- id: missing-identity-uses-stable-fallbacks
  given:
    generated_category: null
    generated_icon: null
  expect:
    resolved_category: general_knowledge
    gradient_source: existing_category_gradients.general_knowledge
    resolved_icon: help-circle
    ad_hoc_gradient_created: false
- id: unknown-category-uses-general-knowledge-gradient
  given:
    generated_category: unknown_category
    generated_icon: calendar
  expect:
    resolved_category: general_knowledge
    gradient_source: existing_category_gradients.general_knowledge
    resolved_icon: calendar
workspace_start:
- id: desktop-recommendation-led-layout
  given:
    route: /workflows
    viewport: 1440x900
    authenticated: true
    recent_workflows:
    - weather
    - invoices
    starter_examples:
    - rain
    - news
  expect:
    vertical_regions:
    - recommendation_banner
    - workflow_identity_space
    - workflow_card_carousel
    - browse_controls
    - bottom_composer
    ordered_cards:
    - weather
    - invoices
    - rain
    - news
    faint_centered_workflow_icon: true
    horizontal_cards: true
    show_all_and_search_centered: true
    composer_floating_at_bottom: true
- id: mobile-retains-start-hierarchy
  given:
    route: /workflows
    viewport: 390x844
    authenticated: true
  expect:
    recommendation_banner_compact: true
    identity_and_greeting_centered: true
    workflow_cards_horizontally_reachable: true
    composer_above_safe_area: true
- id: valid-title-creates-disabled-draft
  given:
    composer_text: Daily weather check
    submit: true
  expect:
    workflow_created: true
    enabled: false
    opened_tab: template
    graph_auto_saved_after_later_edits: false
- id: deferred-inputs-do-not-pretend-to-work
  given:
    composer_text: ''
    voice_authoring_available: false
    ai_planner_available: false
  expect:
    workflow_created: false
    voice_success_implied: false
    ai_success_implied: false
detail_header:
- id: scheduled-header
  given: Alice opens a scheduled weather Workflow.
  when: She switches between Template and Runs.
  then: The identity header remains stable with its normal actions and schedule toggle; disabling the schedule
    leaves manual execution available for its complete graph.
- id: manual-header
  given: Bob opens a complete Workflow with no schedule.
  when: He inspects its header.
  then: It indicates manual execution and offers contextual Run now without a fabricated time trigger or a
    misleading schedule toggle.
detail_tabs:
- id: compact-tab-pill-at-header-boundary
  given:
    tabs:
    - template
    - runs
    active_tab: template
  expect:
    centered_over_header_boundary: true
    white_pill_track: true
    active_blue_pill: true
    template_icon_light: true
    runs_icon_neutral: true
    soft_shadow: true
- id: template-and-runs-switch-in-place
  given:
    workflow_id: workflow-1
    current_tab: template
    input_method: keyboard
  when:
    select_tab: runs
  expect:
    hash: '#workflow-id=workflow-1&workflow-tab=runs'
    selected_workflow_preserved: true
    header_remounted: false
    active_pill_slides: true
    accessible_name: Workflow runs
template_editing:
- id: compact-vertical-graph-composition
  given:
    nodes:
    - time_trigger
    - weather_skill
    - rain_decision
    - notification
    false_branch: do_nothing
  expect:
    centered_single_graph: true
    neutral_cards_subtle_grey: true
    weather_card_uses_app_gradient: true
    connector_labels:
    - then
    - if_true
    - if_false
    add_controls:
    - add_action
    - add_decision
- id: node-expands-in-place
  given:
    tab: template
    node: weather_skill
    dirty: false
  when:
    activate_node: weather_skill
  expect:
    same_card_expanded: true
    summary_header_preserved: true
    input_output_groups_visible: true
    sibling_editor_panel: false
- id: graph-change-shows-contextual-save-panel
  given:
    tab: template
    expanded_node: weather_skill
  when:
    change_location: Paris
  expect:
    dirty: true
    unsaved_message_visible: true
    undo_visible: true
    orange_save_visible: true
    server_graph_changed_before_save: false
- id: share-management-does-not-displace-canvas
  given:
    tab: template
    action: share
  expect:
    share_management_opened_contextually: true
    permanent_share_panel_above_canvas: false
    top_level_tabs:
    - template
    - runs
unsaved_navigation:
- id: dirty-template-to-runs-is-guarded
  given:
    tab: template
    dirty: true
  when:
    select_tab: runs
  expect:
    decision_required:
    - save
    - discard
    - stay
    silent_discard: false
    transition_before_decision: false
- id: stay-preserves-editing-state
  given:
    tab: template
    dirty: true
    pending_transition: another_workflow
  when:
    decision: stay
  expect:
    current_workflow_preserved: true
    local_edits_preserved: true
    transition_completed: false
version_history:
- id: version-selector-and-timeline-composition
  given:
    versions:
    - current
    - today_1439
    - today_1438
    - jul_1_1304
    selected: today_1439
  expect:
    centered_timestamp_selector: true
    horizontal_ticked_timeline: true
    selected_marker_blue: true
    current_marker_has_active_pill: true
- id: historical-version-is-read-only
  given:
    tab: template
    current_version: version-3
    selected_version: version-2
  expect:
    canvas_uses_version: version-2
    graph_geometry_matches_current_template: true
    editing_enabled: false
    restore_action_contextual: true
- id: restore-creates-new-current
  given:
    current_version: version-3
    selected_historical_version: version-1
  when:
    restore_confirmed: true
  expect:
    new_current_version: version-4
    version_1_mutated: false
    version_3_deleted: false
run_history:
- id: pending-is-not-persisted
  given: A completed run has pending chat delivery while its owner is offline.
  when: Alice opens its timeline and execution detail.
  then: The run and pending delivery states are distinct, grouped retained inputs and outputs remain inspectable,
    and the UI does not claim that the chat message has been persisted.
- id: history-and-cancel
  given: Alice inspects an upcoming occurrence, a running execution and an older run whose payload expired.
  when: She selects each timeline marker.
  then: The upcoming occurrence has no fabricated execution detail, the running execution offers confirmed
    cancellation, and the older run explains unavailable payload while preserving its visible status.
responsive_accessibility:
- id: desktop-and-mobile-primary-flow-reachable
  given:
    viewports:
    - 1440x900
    - 390x844
    states:
    - workspace
    - template
    - expanded_node
    - version_history
    - runs
  expect:
    primary_controls_clipped: false
    unintended_page_overflow: false
    mobile_graph_single_column: true
    mobile_forms_single_column: true
    timelines_horizontally_reachable: true
    safe_area_clear: true
- id: non-pointer-and-theme-support
  given:
    input_methods:
    - keyboard
    - touch
    themes:
    - light
    - dark
    reduced_motion: true
  expect:
    tabs_operable: true
    nodes_operable: true
    focus_visible: true
    statuses_not_color_only: true
    reduced_motion_respected: true
mvp_authoring:
- id: mvp_authoring-example
  given: A forecast step exists before any live run, and an Events step declares a list.
  when: Alice adds Check for rain probability and Filter for event descriptions.
  then: The matching typed fields are offered immediately; Check reads If true / If false and Filter selects
    items. A complete workflow without a schedule still offers Run now; AI and user-input pauses are absent.
schedule_preview:
- id: schedule_preview-example
  given: Alice chooses every 15 minutes, 08:00 to 20:00, Europe/Berlin.
  when: She opens the time preview, then switches to the second Tuesday each month.
  then: The first preview lists times through 19:45 and explains the excluded end; the second highlights matching
    dates on a calendar. Both use the same next executions as scheduling.
message_budget:
- id: message_budget-example
  given: An apartment workflow selects two results and costs 10 search credits per quarter-hour check during
    a 12-hour window.
  when: Alice configures Send message and enables automatic execution.
  then: She previews introductory text, two result embeds and a run link; the estimate shows 480 search credits
    per full day plus unknown components, and she either sets a cap or acknowledges no cap.
run_deletion:
- id: run_deletion-example
  given: Run 1 delivered an apartment and is its only remembered delivery; its chat message remains.
  when: Alice confirms deleting Run 1.
  then: The dialog explains forgetting and retained chat output; after deletion the apartment is eligible again
    and the old message run link shows unavailable. Pending deletion is shown until any pending write is fenced.
