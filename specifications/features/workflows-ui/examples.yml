schema_version: 1
specification: feature.workflows-ui@3
visual_language:
- id: all-workflow-views-share-one-visual-family
  given:
    states:
    - workspace
    - new_draft
    - dirty_template
    - historical_version
    - runs
    themes:
    - light
    - dark
  expect:
    layered_color_grey_token_surfaces: true
    raw_grey_values: false
    category_gradient_identity: true
    rounded_soft_elevated_panels: true
    compact_pill_controls: true
    harsh_outlines: false
    surface_hierarchy_preserved_in_dark_mode: true
    default_body_text_px: 16
    minimum_visible_text_px: 14
    canonical_icons:
      add_action: app.svg
      workflow_tab: workflow.svg
      runs_tab: projectmanagement.svg
      time_trigger: calendar.svg
      send_message: chat.svg
      add_check: exact_filled_split_arrow_from_supplied_design
    unrelated_icon_substitutions: false
- id: workflow-values-are-readable-on-every-screen
  given:
    surfaces: [template, skill_test, message_preview, version_history, run_detail]
    output:
      rain_expected: true
      rain_periods: [{start_time: '12:00', end_time: '14:00'}]
      results: [{title: Example apartment, price_label: 1000 EUR/month}]
  expect:
    boolean_shown_as_labeled_readable_value: true
    rain_times_shown_as_labeled_interval: true
    result_collection_uses_shared_cards_or_readable_list: true
    raw_json_or_object_dump_visible: false
    raw_debug_schema_visible: false
    expandable_debug_dump_available: false
route_motion_contract:
- id: workflow-route-matches-fullscreen-embed-motion
  given: Alice opens a Workflow and then returns to the Workflows workspace.
  when: Her system allows motion.
  then: Opening moves the Workflow upward from the bottom with a fade and closing reverses it, using the fullscreen embed timing of 320ms cubic-bezier(0.32, 0, 0.2, 1); reduced-motion mode removes the nonessential movement.
workflow_identity:
- id: generated-software-workflow-identity
  given:
    generated_category: software_development
    generated_icon: code
  expect:
    gradient_source: existing_category_gradients.software_development
    header_uses_software_blue_gradient: true
    header_icon: code
    cards_match_header_identity: true
- id: generated-weather-workflow-icon
  given:
    generated_category: general_knowledge
    generated_icon: cloud-rain
  expect:
    gradient_source: existing_category_gradients.general_knowledge
    header_icon: cloud-rain
    cards_match_header_identity: true
- id: missing-identity-uses-stable-fallbacks
  given:
    generated_category: null
    generated_icon: null
  expect:
    resolved_category: general_knowledge
    gradient_source: existing_category_gradients.general_knowledge
    resolved_icon: help-circle
    ad_hoc_gradient_created: false
- id: unknown-category-uses-general-knowledge-gradient
  given:
    generated_category: unknown_category
    generated_icon: calendar
  expect:
    resolved_category: general_knowledge
    gradient_source: existing_category_gradients.general_knowledge
    resolved_icon: calendar
workspace_start:
- id: desktop-recommendation-led-layout
  given:
    route: /workflows
    viewport: 1440x900
    authenticated: true
    recent_workflows:
    - weather
    - invoices
    starter_examples:
    - rain
    - news
  expect:
    vertical_regions:
    - recommendation_banner
    - workflow_identity_space
    - workflow_card_carousel
    - browse_controls
    - bottom_composer
    ordered_cards:
    - weather
    - invoices
    - rain
    - news
    faint_centered_workflow_icon: true
    horizontal_cards: true
    show_all_and_search_centered: true
    composer_floating_at_bottom: true
    composer_placeholder: Enter a name for a new workflow
    placeholder_centered_horizontally_and_vertically: true
    extra_top_right_blank_workflow_button: false
- id: mobile-retains-start-hierarchy
  given:
    route: /workflows
    viewport: 390x844
    authenticated: true
  expect:
    recommendation_banner_compact: true
    identity_and_greeting_centered: true
    workflow_cards_horizontally_reachable: true
    composer_above_safe_area: true
- id: valid-title-creates-disabled-draft
  given:
    composer_text: Daily weather check
    submit: true
  expect:
    workflow_created: true
    enabled: false
    opened_tab: template
    graph_auto_saved_after_later_edits: false
- id: deferred-inputs-do-not-pretend-to-work
  given:
    composer_text: ''
    voice_authoring_available: false
    ai_planner_available: false
  expect:
    workflow_created: false
    voice_success_implied: false
    ai_success_implied: false
detail_header:
- id: scheduled-header
  given: Alice opens a scheduled weather Workflow.
  when: She switches between Template and Runs.
  then: The identity header remains stable with its normal actions and schedule toggle; disabling the schedule
    leaves manual execution available for its complete graph.
- id: manual-header
  given: Bob opens a complete Workflow with no schedule.
  when: He inspects its header.
  then: It indicates manual execution and offers contextual Run now without a fabricated time trigger or a
    misleading schedule toggle.
- id: shared-chat-header-toolbar-and-overflow
  given: Alice opens a scheduled workflow on desktop or mobile.
  when: She inspects the header and opens Show more.
  then: The actual ChatHeader toolbar and its Show more behavior are reused; workflow actions appear contextually in that menu. There are no standalone history/play/delete icons or corner Ready badge, and the workflow on/off control remains centered as in the supplied design.
detail_header_contract:
- id: web-v1-share-is-coming-soon-only
  given: Alice activates Share in a Workflow header in web v1.
  when: The Share action responds.
  then: A notification says that sharing will be possible soon; no sharing controls open and no sharing state changes. Future Workflow sharing management belongs in the regular settings Share menu, and no permanent sharing panel displaces the Template canvas or definition history.
- id: run-now-runs-the-saved-definition
  given: Alice has a valid executable saved Workflow and an expanded node with unsaved edits.
  when: She activates the prominent Run now control centered at the header bottom above the tabs.
  then: The run uses the saved definition and does not include the unsaved node edits.
detail_tabs:
- id: compact-tab-pill-at-header-boundary
  given:
    tabs:
    - template
    - runs
    active_tab: template
  expect:
    centered_over_header_boundary: true
    white_pill_track: true
    active_blue_pill: true
    template_icon_light: true
    runs_icon_neutral: true
    template_icon_asset: workflow.svg
    runs_icon_asset: projectmanagement.svg
    soft_shadow: true
- id: template-and-runs-switch-in-place
  given:
    workflow_id: workflow-1
    current_tab: template
    input_method: keyboard
  when:
    select_tab: runs
  expect:
    hash: '#workflow-id=workflow-1&workflow-tab=runs'
    selected_workflow_preserved: true
    header_remounted: false
    active_pill_slides: true
    accessible_name: Workflow runs
template_editing:
- id: compact-vertical-graph-composition
  given:
    nodes:
    - time_trigger
    - weather_skill
    - rain_decision
    - notification
    false_branch: do_nothing
  expect:
    centered_single_graph: true
    neutral_cards_subtle_grey: true
    weather_card_uses_app_gradient: true
    connector_labels:
    - then
    - if_true
    - if_false
    continuation_placeholder: "Do nothing.\nOr click here to add a step."
    duplicate_separate_add_buttons: false
- id: one-selector-for-continuation-and-empty-branches
  given:
    editable_entry_points: [continuation, empty_true_branch, empty_false_branch]
    upstream_output_available: true
  when:
    click_placeholder: "Do nothing.\nOr click here to add a step."
  expect:
    single_selector_heading: What should happen next?
    valid_choices: [Use App, Send message, Add check]
    separate_duplicate_add_action_button: false
    separate_duplicate_add_check_button: false
    add_action_icon: app.svg
    add_check_icon: exact_filled_split_arrow_from_supplied_design
- id: node-expands-in-place
  given:
    tab: template
    node: weather_skill
    dirty: false
  when:
    activate_node: weather_skill
  expect:
    same_card_expanded: true
    summary_header_preserved: true
    input_output_groups_visible: true
    sibling_editor_panel: false
- id: expanded-editors-reuse-one-header
  given: Alice opens a Weather node and then a step picker.
  when: She uses back, collapse or close.
  then: Both expanded surfaces use the shared Workflow editor header with consistent title, app identity and
    navigation behavior.
- id: graph-change-keeps-local-node-save
  given:
    tab: template
    expanded_node: weather_skill
  when:
    change_location: Paris
  expect:
    dirty: true
    global_unsaved_message_visible: false
    node_discard_visible: true
    orange_node_save_visible: true
    server_graph_changed_before_save: false
- id: app-skill-identity-matches-editor-and-history
  given:
    app_display_name: Weather
    skill_display_name: Forecast
    views: [template, expanded_node, skill_test, historical_version, run_detail]
  expect:
    app_skill_label: Weather | Forecast
    icon_source: actual_weather_app_icon_from_shared_catalog
    generic_workflow_or_placeholder_icon: false
node_card_contract:
- id: editable-node-scale-and-affordance
  given: Alice views expandable nodes in the Workflow graph.
  when: The nodes are collapsed or expanded.
  then: Each node is slightly larger than a compact preview card and keeps a clearly visible expand chevron at its bottom.
unsaved_navigation:
- id: dirty-template-to-runs-is-guarded
  given:
    tab: template
    dirty: true
  when:
    select_tab: runs
  expect:
    decision_required:
    - save
    - discard
    - stay
    silent_discard: false
    transition_before_decision: false
- id: stay-preserves-editing-state
  given:
    tab: template
    dirty: true
    pending_transition: another_workflow
  when:
    decision: stay
  expect:
    current_workflow_preserved: true
    local_edits_preserved: true
    transition_completed: false
version_history:
- id: version-selector-and-timeline-composition
  given: Alice opens Template for a Workflow with multiple saved definition versions.
  when: She activates the version selector below the tabs and above the first node.
  then: The edit-history bar toggles in the same tab with explicit selected and current states; no bottom version-history or sharing panel appears.
- id: historical-version-is-read-only
  given:
    tab: template
    current_version: version-3
    selected_version: version-2
  expect:
    canvas_uses_version: version-2
    graph_geometry_matches_current_template: true
    editing_enabled: false
    restore_action_contextual: true
- id: restore-creates-new-current
  given:
    current_version: version-3
    selected_historical_version: version-1
  when:
    restore_confirmed: true
  expect:
    new_current_version: version-4
    version_1_mutated: false
    version_3_deleted: false
version_selector_contract:
- id: top-version-selector-toggles-history
  given: Alice opens Template for a Workflow with multiple saved definition versions.
  when: She activates the version selector below the tabs and above the first node.
  then: The edit-history bar toggles in the same tab with explicit selected and current states; no bottom version-history or sharing panel appears.
run_history:
- id: run-layout-follows-supplied-runs-pdf
  given:
    design_reference: runs.pdf
    selected_run: completed_weather_and_news_run
    retained_payload_available: true
  expect:
    compact_timestamp_selector: true
    horizontally_reachable_ruler_baseline_and_ticks: true
    selected_run_marker_visible: true
    uses_shared_template_node_cards: true
    node_status_badges_overlay_cards: true
    app_skill_label_format: "{app name} | {skill name}"
    actual_app_icons: true
    expanded_inputs_and_outputs_are_labeled_readable_values: true
    result_collections_use_shared_cards_or_readable_lists: true
    debug_dashboard_visible: false
    dashboard_summary_tiles_visible: false
    raw_json_or_debug_schema_visible: false
- id: pending-is-not-persisted
  given: A completed run has pending chat delivery while its owner is offline.
  when: Alice opens its timeline and execution detail.
  then: The run and pending delivery states are distinct, grouped retained inputs and outputs remain inspectable,
    and the UI does not claim that the chat message has been persisted.
- id: history-and-cancel
  given: Alice inspects an upcoming occurrence, a running execution and an older run whose payload expired.
  when: She selects each timeline marker.
  then: The upcoming occurrence has no fabricated execution detail, the running execution offers confirmed
    cancellation, and the older run explains unavailable payload while preserving its visible status.
responsive_accessibility:
- id: desktop-and-mobile-primary-flow-reachable
  given:
    viewports:
    - 1440x900
    - 390x844
    states:
    - workspace
    - template
    - expanded_node
    - version_history
    - runs
  expect:
    primary_controls_clipped: false
    unintended_page_overflow: false
    mobile_graph_single_column: true
    mobile_forms_single_column: true
    timelines_horizontally_reachable: true
    safe_area_clear: true
- id: non-pointer-and-theme-support
  given:
    input_methods:
    - keyboard
    - touch
    themes:
    - light
    - dark
    reduced_motion: true
  expect:
    tabs_operable: true
    nodes_operable: true
    focus_visible: true
    statuses_not_color_only: true
    reduced_motion_respected: true
mvp_authoring:
- id: mvp_authoring-example
  given: A forecast step exists before any live run and an Events step declares a result list.
  when: Alice adds Check for rain and a Send message result block for events.
  then: Typed fields are offered immediately and unsaved Test results use labeled readable values/cards, never raw JSON/debug schemas; Check shows true and false branches with Do nothing when empty. A complete unscheduled workflow offers Run now. General Filter is absent.
- id: weather-range-and-shared-field-controls
  given: Alice adds a Weather forecast step before the Workflow has run.
  when: The typed skill form opens.
  then: Location and the shared date-range calendar are basic fields, both inclusive endpoints default to the
    Today runtime value, dates outside Today through Today plus 13 are disabled, legacy days is hidden, advanced
    fields are behind Show all fields, and typed choices reuse SettingsDropdown.
- id: map-city-semantics-across-launch-skills
  given: Alice searches for and selects Berlin in the shared map picker.
  when: She uses it in Weather, Events and Home skill forms.
  then: Weather stores location with latitude and longitude, Events stores request location with lat and lon,
    Home stores the city in request query, and selection remains disabled until a city resolves.
- id: removing-check-protects-dependent-fields
  given: A later step consumes the selected Check's matched boolean.
  when: Alice removes the Check.
  then: The builder rewrites the dependency only for an equivalent equality-to-true earlier boolean; otherwise it
    names the dependent steps, keeps the Check and leaves the saved graph valid.
schedule_preview:
- id: schedule_preview-example
  given: Alice chooses hourly apartment search at minute zero in Europe/Berlin.
  when: She saves the time/date node.
  then: A readable hourly schedule is saved; daily 09:00 and weekly Sunday are also available without code.
message_budget:
- id: message_budget-example
  given: An apartment workflow has selected result output and known skill pricing.
  when: Alice configures Send message.
  then: She edits deterministic text with references, chooses Only new results and previews readable message text and result cards without sending or saving; raw JSON/debug schemas are absent. Known skill cost is shown; deferred budget caps are not claimed.
run_deletion:
- id: run_deletion-example
  given: Run 1 delivered an apartment and is its only remembered delivery; its chat message remains.
  when: Alice confirms deleting Run 1.
  then: The dialog explains forgetting and retained chat output; after deletion the apartment is eligible again
    and the old message run link shows unavailable. Pending deletion is shown until any pending write is fenced.
