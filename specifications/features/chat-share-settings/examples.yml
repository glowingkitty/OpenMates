schema_version: 1
specification: feature.chat-share-settings@1

shell_navigation:
  - id: dynamic-chat-settings-root-back
    given: {surface: web_settings, route: "chats/{chat_id}", authenticated: false}
    action: click_banner_back
    expect: {active_settings_view: main, unavailable_chats_page_absent: true}
  - id: centered-header-and-collapsed-title
    given: {surface: web_settings, route: "chats/{chat_id}", title_length: long, credits_known: true}
    action: scroll_settings_content
    expect: {expanded_title_and_credits_centered: true, collapsed_title_single_line_ellipsis: true, scroll_top_restores_expanded_title: true}

generated_controls:
  - id: generated-private-share-controls
    given: {chat_type: private_owned, state: share_link_generated}
    expect: {copy_button_visible: true, url_under_copy_absent: true, qr_toggle_visible: true, show_url_visible: true, revealed_url_selectable: true}
  - id: public-example-share-controls
    given: {chat_type: public_example, state: static_share_link_available}
    expect: {static_notice_card_absent: true, copy_button_visible: true, url_under_copy_absent: true, owner_only_controls_absent: true, revealed_url_selectable: true}
  - id: qr-focus-scroll
    given: {chat_type: private_owned, action: show_qr_code}
    expect: {qr_region_focused: true, qr_region_near_viewport_center: true}

shared_viewer:
  - id: read-only-shared-viewer-share-tab
    given: {chat_type: shared_by_other_user, original_link_available: true}
    expect: {readonly_notice_visible: true, owner_only_controls_absent: true, url_under_copy_absent: true, revealed_original_url_selectable: true}

shared_link_open:
  - id: stale-shared-link-error
    given: {shared_link_state: stale_or_missing_chat}
    expect: {invalid_link_error_visible: true, dummy_decrypted_content_absent: true}
  - id: valid-shared-link-readable-content
    given: {shared_link_state: valid, viewer: logged_out}
    expect: {shared_badge_visible: true, transcript_visible: true, read_only_settings_available: true}
  - id: shared-application-preview-handoff
    given: {shared_link_state: valid, content: application_preview, viewer: authenticated_recipient}
    expect: {recipient_preview_session_isolated: true, preview_iframe_visible: true}
