schema_version: 1
specification: feature.chat-processing-feedback@4
selection:
- id: accepted-turn-before-model-resolution
  given: Alice’s message is sending and the server accepts its processing.
  when: Stage one has not selected a model yet.
  then: Her submitted message remains visible as sending or accepted, but there is no generic Assistant Thinking
    container, guessed Mate or empty durable assistant row. When stage one selects Sophia, one transient response
    container immediately shows Sophia and Thinking… beside the AI icon without waiting for detailed skill selection.
- id: unaccepted-offline-send
  given: Alice has pressed Send while offline.
  when: The server has not accepted the turn.
  then: Her message keeps its sending state without an assistant processing container.
identity:
- id: first-stage-identity-arrives
  given: Alice sees her accepted user message while stage one is selecting the Mate.
  when: Stage one resolves Sophia and the permitted Gemini model while detailed skill selection continues.
  then: One response container appears with Sophia’s navigable identity, Thinking… and the actual model with its known region flag below;
    it does not wait for stage two or create another response.
- id: unknown-region
  given: The current model is known but its region is unavailable.
  when: The model line renders.
  then: The actual model name appears without a guessed flag or previous-turn metadata. Processing text is centered;
    after completion the Generated by… model attribution aligns left.
lifecycle:
- id: terminal-state-ends-activity
  given: Alice sees an active response with a bottom glow.
  when: The turn finishes, fails, is cancelled or waits for her approval.
  then: Animation and processing wording end; existing response content and any error or approval stay visible.
- id: inactive-turn-event
  given: Alice has switched from chat A to chat B.
  when: A delayed processing event from chat A arrives.
  then: Chat B does not show chat A’s Mate, model, placeholder or glow.
skill_activity:
- id: researching-searches
  given: Sophia has started an accepted response and is calling Web Search and News Search.
  when: Those app skills are processing.
  then: The response status says Researching… beside the AI icon, instead of Thinking….
- id: working-on-actions
  given: Sophia calls a search skill and an action skill that creates a document in the same processing group.
  when: The app skills are processing.
  then: The response status says Working… beside the AI icon because the group includes an action. An unrecognized
    skill without a known action identity uses Researching…. When authored answer text streams, the centered status
    says Working….
glow:
- id: internal-bottom-glow
  given: An accepted assistant turn is processing.
  when: Alice views the response on a phone or laptop.
  then: The left bubble joins the response container as one continuous filled shape. The rainbow glow stays inside
    the response’s bottom edge and animates from left to right, with no external rainbow or obstruction of content
    and controls.
- id: reduced-motion
  given: Alice has requested reduced motion.
  when: The assistant processes a request.
  then: A static bottom glow communicates activity without rainbow animation.
summary:
- id: completed-group-expands-in-place
  given: The assistant visibly thinks, uses Web and News, writes a paragraph and then uses another app.
  when: The first group completes and Alice opens its right-side disclosure.
  then: Its summary stays above that paragraph and expands its skill cards. If thinking is only a response-wide
    aggregate, it is disclosed once as Thinking for this response, with the AI app icon followed by circular, partially
    overlapping Web and News icons, without pretending it belongs to that tool cycle.
    The paragraph and later group remain in place.
- id: no-invented-duration
  given: A completed search group has app identities but no measured thinking duration.
  when: Its summary appears.
  then: The apps are summarized without invented elapsed time or hidden model reasoning. A completed thinking-only
    response uses the same expandable summary style and shows the AI app icon for its available thinking.
responsive:
- id: phone-laptop-keyboard
  given: Alice views the response at phone and laptop widths.
  when: She focuses the Mate name or activates a group disclosure with the keyboard.
  then: The correct action opens, disclosure state is accessible, all content fits and updates do not steal composer
    focus.
