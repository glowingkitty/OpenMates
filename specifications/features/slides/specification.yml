schema_version: 1
id: feature.slides
version: 2
status: draft
title: Slides
summary: >
  Slides are presentation decks built with web technology. A deck is a list of
  slides on a fixed-ratio canvas; every slide is a set of positioned elements
  styled by a reusable template. The assistant creates and changes decks, the
  user edits them directly, and decks can be presented with a presenter view,
  followed live through a share link, imported from PowerPoint and exported to
  PDF and PowerPoint. Free HTML, CSS and JavaScript is allowed only inside
  isolated interactive blocks.

related_contracts:
  - specification: feature.interactive-html-visuals@2
    relationship: Interactive blocks inside a slide reuse the isolation of interactive HTML visuals unchanged; this contract adds no network or app access for author code.
  - specification: feature.focus-modes@2
    relationship: The template designer and presentation planner focus modes use the shared phased focus-mode activation, countdown, cancel and phase lifecycle.
  - specification: feature.chats@7
    relationship: Decks reuse embed streaming, storage, version history, diff editing and sharing; this contract adds the slides content type.
  - specification: feature.projects@2
    relationship: Decks can be Project items in folders; creation from a Project is owned by projects.items.create-documents.
  - specification: feature.live-collaboration@1
    relationship: Simultaneous editing of a deck by several members is owned by the live collaboration contract.

scope:
  includes:
    - The deck format with fixed 16:9, 16:10 and 4:3 canvases, positioned elements, speaker notes and preset animations.
    - Safe rendering of decks from the assistant, uploads, imports and shared links.
    - Images, SVGs and videos in slides, including media from other embeds and allow-listed video platforms.
    - Notepad and to-do elements that are filled in during a presentation.
    - Templates in an account or Team library with built-in designs, applying a template to a deck, and the focus modes that design a template and plan a presentation.
    - Creating and changing decks by the assistant and direct editing by the user.
    - Presenter view, live following through a share link, PowerPoint import, and PDF and PowerPoint export.
    - A presentation remote, where the user's phone (web or Apple app) steers a deck presented on another of their own devices.
  excludes:
    - Layouts that reflow to a different arrangement on small screens; a slide only scales.
    - Video export of a deck.
    - Audience members typing into a deck from their own devices.
    - A Google Drive connection; Google Slides decks are imported from their PowerPoint export.
    - Apple editing and presenting a deck on the Apple device itself, which follow in a separate contract version; the Apple app can be the remote.
    - Templates saved into Project folders and a pinned Project default template, which follow in a later version.

assertions:
  - id: slides.format.positioned-elements
    type: behavior
    must: >
      A deck has one aspect ratio, 16:9 by default or 16:10 or 4:3, and an
      ordered list of slides. Each slide names a template layout and holds
      elements with a position and size on the canvas: text, image, video,
      shape, notepad, to-do list and interactive block. Each slide can carry
      speaker notes. A slide is shown by scaling the whole canvas uniformly to
      the available space, so the arrangement is identical on every screen and
      nothing reflows.
    depends_on: [examples.format]
  - id: slides.render.preview-and-fullscreen
    type: behavior
    must: >
      A deck appears in the chat as a card showing its first slide, title and
      slide count. Fullscreen shows the current slide with a strip of all
      slides and the version timeline. While the assistant is still writing a
      deck, finished slides appear one after another instead of source text.
    depends_on: [examples.render]
  - id: slides.security.host-rendered-and-isolated
    type: security
    must: >
      Text, image, video, shape, notepad and to-do elements are drawn by the
      app from validated properties only. Scripts, event handlers, external
      addresses, and unknown elements or properties in a deck are discarded
      and never executed or requested. Author HTML, CSS and JavaScript exists
      only inside interactive blocks, and every block runs with the isolation
      of interactive HTML visuals: no access to the app, the account, other
      slides or the network. The same rules apply to decks from the assistant,
      uploads, PowerPoint imports and shared links.
    depends_on: [examples.security]
  - id: slides.media.images-from-files-and-embeds
    type: behavior
    must: >
      A user adds an image or SVG to a slide by dropping a file onto it or by
      picking an image or SVG from existing embeds of the chat or Project. The
      assistant can generate an image or SVG and place it in a slide in the
      same answer. SVGs are displayed as images, so nothing inside them runs
      or loads; their declarative animation still plays (see
      slides.media.svg-declarative-animation). Uploaded and generated videos play inside the slide. Media
      placed in a deck is stored with the deck as its own encrypted item, so a
      shared or exported deck is complete without the original chat.
    depends_on: [examples.media]
  - id: slides.media.svg-declarative-animation
    type: security
    must: >
      An animated SVG image in a slide plays its declarative animation (SVG
      animate, animateTransform, animateMotion and set, and CSS keyframes
      inside the SVG) in the deck's fullscreen view, editor and presentation.
      Before an uploaded or generated SVG is stored it is cleaned: scripts,
      event handlers, foreign objects, embedded frames and every reference
      outside the SVG itself (links, external images, url() other than local
      fragments, imports, fonts) are removed, and the SVG is still shown only
      as an image, so nothing in it runs or loads. An SVG stored before this
      cleaning existed is shown as its still picture. With reduced motion,
      and in chat cards and slide thumbnails, every SVG shows its still
      picture instead of moving.
    depends_on: [examples.svg_animation]
  - id: slides.media.video-platform-allowlist
    type: privacy
    must: >
      A slide can show a video from YouTube or Vimeo. The app itself displays
      the player over the element's area; author code never gains network
      access. No request reaches the video platform until a person presses
      play on that element. A video address from any other site is shown as a
      plain link card and is never embedded.
    depends_on: [examples.video_platforms]
  - id: slides.interactive.notepad-and-todo
    type: behavior
    must: >
      Notepad and to-do elements accept typing and checking in the editor and
      during a presentation, and what is entered is visible to the audience
      and saved into the deck as a new version. Each such element has a Clear
      action, the deck has one action that clears all of them at once, and
      each can be hidden without deleting its text. Cleared text can be
      brought back from the version timeline. State inside an interactive
      block is not saved.
    depends_on: [examples.interactive]
  - id: slides.animations.preset-set
    type: behavior
    must: >
      Elements can fade in, slide in or appear on a click as ordered build
      steps, and slides can use a transition from a fixed set. Animations do
      not play for people who asked their device to reduce motion; all content
      is then shown at once. More elaborate motion is possible only inside an
      interactive block.
    depends_on: [examples.animations]
  - id: slides.templates.library
    type: behavior
    must: >
      A template is a presentation template item with a name, an aspect
      ratio, colours (background, foreground, accent, accent-2, muted,
      surface), a heading and a body font from the safe font set, and one
      sample slide for each layout it offers: at least title, section,
      content, image, quote and closing. Its card and fullscreen show these
      sample slides as the design preview. Pressing Save on a template card
      or fullscreen puts it in the library of the active Personal or Team
      account; every template picker lists that library beside the built-in
      templates and never mixes in another account's items. Changing a saved
      template does not alter existing decks until a user applies it to a
      deck.
    depends_on: [examples.templates]
  - id: slides.templates.built-in-set
    type: behavior
    must: >
      Every account has the same built-in templates without saving anything:
      Plain and four designs for common uses, Bold pitch, Clean business,
      Friendly classroom and Calm talk, each with the title, section,
      content, image, quote and closing layouts. Built-in templates are
      read-only; a user who wants changes designs their own template from
      one. Plain follows the app's light and dark colours; the other
      built-ins have fixed colours and fonts.
    depends_on: [examples.templates]
  - id: slides.templates.apply-to-deck
    type: behavior
    must: >
      The deck fullscreen has a Template action that lists the built-in
      templates and the active account's library with a preview of each.
      Applying one changes the deck's colours and fonts to the template's and
      saves the result as the next version; text, positions, images and
      speaker notes stay as they were, and the change can be undone from the
      version timeline. A deck keeps its own copy of the applied colours and
      fonts, so it looks the same when shared or opened without access to the
      library. When the applied library template was changed later, the
      action marks it as updated and applying it again brings the change to
      this deck only.
    depends_on: [examples.apply_template]
  - id: slides.focus.template-designer
    type: behavior
    must: >
      The Slides focus mode Design a template uses the shared phased focus
      lifecycle with the phases purpose and brand, design choice, refine and
      save. It asks about purpose, audience and existing brand colours or
      logo, then shows three clearly different designs as template cards with
      real slide previews; the user picks one with the card's Use this design
      action or by naming it. The chosen design is refined with the user
      (colours, fonts and the title, section, content, image, quote and
      closing layouts), each change shown as an updated template card. The
      finished template is saved when the user presses Save on its card;
      afterwards the assistant offers to create a deck with it. Each turn
      asks one to three questions with a recommendation, and each phase ends
      with a short summary the user confirms or corrects.
    depends_on: [examples.template_designer]
  - id: slides.focus.presentation-planner
    type: behavior
    must: >
      The Slides focus mode Plan a presentation uses the shared phased focus
      lifecycle with the phases goal and audience, story, outline, template,
      slides and review, for any use case such as a project or hackathon
      pitch, a business update, sales, teaching, school or a talk. Goal and
      audience settles the goal, audience, length and setting. Story picks a
      story arc that fits the use case and says why. Outline lists one
      message per slide and advances only after the user confirms or
      corrects it. Template shows the built-in templates as template cards,
      accepts a saved template the user names or references, or designs a
      new one with the template designer's steps inside the planner. Slides
      creates the deck with one slide per outline message, speaker notes on
      every slide and a slide count that fits the length. Review reports
      concrete best-practice findings on text density, readability, visuals
      over bullet lists, timing, the opening and the close, and applies the
      ones the user accepts as targeted edits. Each turn asks one to three
      questions with a recommendation or example, and each phase ends with a
      short summary the user confirms. A user who gives everything at once or
      asks to go fast is not asked what the message already answers and gets
      the outline for confirmation in the first reply.
    depends_on: [examples.presentation_planner]
  - id: slides.assistant.create-and-diff-edit
    type: behavior
    must: >
      The assistant creates a deck from the available template and its
      layouts, and changes an existing deck with targeted edits that leave
      untouched slides and elements as they were. Every assistant change is a
      new version in the deck's timeline. Positions and styling that a user
      set by hand are preserved by later assistant edits unless the user asks
      to change them.
    depends_on: [examples.assistant]
  - id: slides.editor.direct-manipulation
    type: behavior
    must: >
      In edit mode a user can change the text of any text element and its
      font, size and colour; move and resize any element by dragging,
      including elements the assistant created and interactive blocks; add,
      duplicate, reorder and delete slides; change a slide's layout; insert
      and replace images; edit speaker notes; and undo and redo. Saved edits
      become versions. The inside of an interactive block is changed through
      the assistant.
    depends_on: [examples.editor]
  - id: slides.editor.save-checked-version
    type: behavior
    must: >
      Saving a manual edit of a deck in a chat stores it on the server as the
      next version, but only if the deck is still at the version and content
      the edit started from. If the deck changed in the meantime, for example
      on another device or by the assistant, the save is refused instead of
      overwriting the newer version, the edit stays open with a retry, and the
      device keeps nothing as saved that the server did not confirm.
    depends_on: [examples.editor]
  - id: slides.present.presenter-view
    type: behavior
    must: >
      Present opens the deck in a second window that shows only the slide, for
      the audience screen. The original view becomes the presenter view with
      the current slide, the next slide, the speaker notes, a timer and the
      slide list. Both stay in step from either window and with the keyboard.
      Speaker notes never appear in the audience window. Closing either window
      ends the presentation.
    depends_on: [examples.present]
  - id: slides.present.follow-live
    type: privacy
    must: >
      While a shared deck is being presented, people who open its share link
      see that it is live and can follow the presenter's current slide, build
      step and notepad content. They can browse on their own and rejoin, and
      cannot change anything. The live state is encrypted with the share
      link's key, relayed by the server without being readable or stored, and
      stops when the presentation ends. Speaker notes are never sent.
    depends_on: [examples.follow_live]
  - id: slides.present.remote-control
    type: behavior
    must: >
      While a deck is shown in the full-screen presentation on one device, the
      same user who opens that deck on another signed-in device, such as the
      web app or the Apple app on a phone, sees that it is being presented and
      can turn that device into a remote: next and previous, jump to any slide
      from the slide list, and the current slide's speaker notes, which stay
      hidden until the user shows them. The presenting device follows within
      about a second, and a change made on the presenting device, for example
      with the keyboard, also moves the remote. Ending the presentation ends
      the remote, which then shows that nothing is being presented. Only the
      deck owner's own devices can steer; people with a share link cannot.
    depends_on: [examples.remote]
  - id: slides.present.remote-relay-private
    type: privacy
    must: >
      The remote and the presenting device exchange only the current slide,
      build step, whether notes are shown and an ordering number. This state
      is encrypted on the device with the deck's own key, and the server
      passes it to the same user's other devices without being able to read
      it and without storing it. Speaker notes never travel: the remote reads
      them from its own copy of the deck. The server forwards updates only for
      decks the user can access and limits their size and rate, and a device
      ignores updates that are older than the state it already shows.
    depends_on: [examples.remote]
  - id: slides.present.remote-one-core
    type: invariant
    must: >
      The remote's state format, its encryption and the ordering rule live
      once in the shared client core and are used unchanged by the web app and
      the Apple app, so both read and write the same encrypted state.
    depends_on: [examples.remote]
  - id: slides.import.powerpoint
    type: behavior
    must: >
      An uploaded PowerPoint file (.pptx, .pptm, .ppsx, .potx) is converted on
      the user's device into an editable deck. The user is told what could not
      be carried over, and the original file stays downloadable from the deck.
      Macros are never run or kept. Legacy .ppt and .pps files are not
      attached, with a notice to save them as .pptx first.
    depends_on: [examples.import]
  - id: slides.export.pdf-and-powerpoint-with-loss-notice
    type: behavior
    must: >
      A deck can be downloaded as PDF and as PowerPoint, both produced on the
      user's device. Before the download, the user sees which features of this
      particular deck the chosen format cannot keep. In PowerPoint, text stays
      editable text, images and uploaded videos are kept, preset transitions
      are mapped where an equivalent exists, an interactive block becomes a
      picture of its current state, and a platform video becomes a thumbnail
      with a link. A PDF has one static page per slide, with speaker notes
      optional.
    depends_on: [examples.export]
  - id: slides.surface.text-rendering
    type: parity
    must: >
      Where a surface cannot draw slides, such as the terminal and the SDKs, a
      deck is presented as its title and, per slide, its number, text content
      and speaker notes, with images, videos and interactive blocks named by
      kind. Creating and changing decks through the assistant works the same
      on every surface.
    depends_on: [examples.surfaces]

applies_to:
  rest_api: {required: true, role: Deck embeds, versions, child media and the relayed live presentation state.}
  cli: {required: true, parity: semantic}
  sdks:
    required: true
    implementations:
      rust: {required: true}
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    implementations:
      web: {required: true}
      apple: {required: false}

examples:
  file: examples.yml
  required_groups: [format, render, security, media, video_platforms, interactive, animations, templates, apply_template, template_designer, presentation_planner, assistant, editor, present, remote, follow_live, import, export, surfaces]
