schema_version: 1
specification: feature.slides@2

format:
  - id: same-arrangement-on-every-screen
    given: A 16:9 deck has a slide with a title at the top left, a chart image on the right and a notepad at the bottom.
    when: Alice views it on a laptop, a phone held upright and a projector.
    then: On all three the whole slide is scaled to fit and the title, chart and notepad keep the same relative places; nothing wraps or moves to another position.
  - id: four-by-three-deck
    given: Bob asks for a deck for an old 4:3 projector.
    when: The assistant creates it.
    then: Every slide of the deck uses the 4:3 canvas, and presenting fills a 4:3 screen without bars.

render:
  - id: card-and-fullscreen
    given: The assistant finished a ten-slide deck called "Q3 results".
    when: Alice looks at the chat and clicks the card.
    then: The card shows the first slide with the title and "10 slides"; fullscreen shows the first slide large, a strip of all ten slides and the version timeline.
  - id: slides-arrive-while-streaming
    given: The assistant is still writing a six-slide deck.
    when: Alice watches the card.
    then: Slides one, two and three are shown as finished slides as soon as each is complete, and the remaining ones follow, without source text ever being displayed.

security:
  - id: hostile-deck-stays-inert
    given: A shared deck has a text element with an onclick handler, an image pointing to an external tracking address, and a script element placed between two slides.
    when: Carol opens the share link.
    then: The text is shown as plain text, the external image is not requested, the script does not run, and Carol's app and account are unaffected.
  - id: block-cannot-reach-the-app
    given: A slide has an interactive block whose code reads cookies and storage, calls an external server and tries to change the text of the slide title.
    when: The slide is shown.
    then: The block sees only its own empty storage, the request is blocked, the title is unchanged, and the rest of the slide works normally.

media:
  - id: drop-a-file-and-pick-from-embeds
    given: Alice edits a deck in a chat that also contains a generated logo SVG and a chart image.
    when: She drops a photo from her computer onto a slide, then uses "Add image" and picks the logo SVG from the chat's embeds.
    then: Both appear on the slide as movable images; the SVG is shown as a picture, and a script inside it does not run.
  - id: assistant-generates-then-places
    given: Bob asks for a title slide with a newly drawn mountain illustration.
    when: The assistant answers.
    then: It generates the illustration and places it on the title slide in the same answer, and when Bob shares only the deck the illustration is still shown to the recipient.

svg_animation:
  - id: animated-svg-plays
    given: Alice places a generated SVG of slowly drifting waves (SVG animate and CSS keyframes) on her title slide.
    when: She opens the deck fullscreen and presents it.
    then: The waves move on the slide in fullscreen and while presenting, and the chat card and the slide strip show the waves standing still.
  - id: hostile-svg-cleaned
    given: Bob uploads an SVG that contains an animated circle, a script, an onload handler, a foreignObject and an external image link.
    when: He places it on a slide and opens the deck.
    then: The circle animates; nothing from the script, handler or foreignObject runs or appears, and no request leaves the browser for the external image.
  - id: svg-reduced-motion
    given: Carol's device is set to reduce motion and her deck contains Alice's animated waves SVG.
    when: She views the slide.
    then: The waves are shown as a still picture.
  - id: old-svg-stays-still
    given: Dave's deck contains an SVG uploaded before SVG cleaning existed.
    when: He opens the deck.
    then: The SVG is shown as its still picture and nothing in it animates, runs or loads.

video_platforms:
  - id: youtube-plays-only-after-click
    given: A slide contains a YouTube video element.
    when: Alice opens the slide and later presses play.
    then: Opening the slide shows a placeholder with a play button and sends nothing to YouTube; after she presses play, the YouTube player appears in that area and plays.
  - id: other-site-is-a-link
    given: The assistant is asked to put a video from an unknown video site on a slide.
    when: The slide is shown.
    then: The slide shows a link card with the address instead of a player, and nothing is loaded from that site.

interactive:
  - id: audience-ideas-are-kept
    given: Alice presents a slide with a notepad titled "Ideas from the audience" and a to-do list.
    when: She types three ideas, ticks one to-do item and ends the presentation.
    then: The audience saw the ideas and the tick as she entered them, and when she reopens the deck the next day they are still there as a new version.
  - id: clear-before-the-next-talk
    given: The same deck still contains last week's ideas in two notepads.
    when: Alice chooses "Clear all audience notes" before presenting to another group, and later looks at the version timeline.
    then: Both notepads and the to-do ticks are empty with one click, and the version with last week's ideas can still be opened and restored.

animations:
  - id: bullets-appear-on-click
    given: A slide has three text elements set to appear on click and a fade transition.
    when: Bob presents and presses the right arrow four times.
    then: The three elements appear one per press and the fourth press fades to the next slide.
  - id: reduced-motion
    given: Carol's device is set to reduce motion.
    when: She views the same slide.
    then: All three elements are visible at once and the next slide appears without a fade.

templates:
  - id: saved-template-in-library
    given: Alice pressed Save on her template card "Studio Blue".
    when: She opens the Template action of one of her decks.
    then: The picker lists "Studio Blue" under her library beside the built-in templates, with a preview of its title slide.
  - id: team-library-stays-separate
    given: Bob saved "Sports Club" while working in his Team and "Private Notes" in his Personal account.
    when: He opens the template picker of a deck, first in the Team and then in his Personal account.
    then: The Team picker shows "Sports Club" and the built-in templates but not "Private Notes"; the Personal picker shows the reverse.
  - id: built-ins-without-saving
    given: Carol has a new account and never saved a template.
    when: She opens the template picker of a deck.
    then: Plain, Bold pitch, Clean business, Friendly classroom and Calm talk are listed, each with a preview of its title slide.
  - id: template-change-does-not-touch-old-decks
    given: Three decks were made with "Studio Blue", and Alice changes its heading font.
    when: She opens one of the three decks.
    then: The deck still has the old heading font and its template picker marks "Studio Blue" as updated; after she applies it, only that deck changes.

apply_template:
  - id: apply-keeps-content
    given: Bob's eight-slide deck uses Plain, and he moved the logo on slide 2 by hand.
    when: He opens Template in the deck fullscreen and applies "Bold pitch".
    then: All slides use the Bold pitch colours and fonts, the text, logo position and speaker notes are unchanged, and the timeline shows one new version that he can go back from.
  - id: shared-deck-keeps-look
    given: Alice applied her library template "Studio Blue" to a deck and shared it.
    when: Dave, who has no access to her library, opens the share link.
    then: The deck shows the Studio Blue colours and fonts.

template_designer:
  - id: three-designs-then-refine
    given: Emma runs a youth sports club and has no template; she asks "Design a slide template for our club, our colours are green and white".
    when: The Template designer focus mode is active and she answers the purpose questions.
    then: The assistant shows three clearly different green-and-white designs as template cards with slide previews; Emma presses Use this design on the second card, asks for a rounder, friendlier heading font, sees an updated preview of all six layouts, confirms, and presses Save on the final template card.
  - id: deck-after-save
    given: Emma just saved "Club Green" to her library in the designer.
    when: She accepts the offer to make a first deck with it about the summer camp.
    then: A deck about the summer camp is created that uses the Club Green colours, fonts and layouts.
  - id: team-save
    given: Frank works in his company Team and finishes a template in the designer.
    when: He presses Save on the template card.
    then: The template is in the Team library, not in his Personal one.

presentation_planner:
  - id: beginner-project-pitch
    given: Mia, sixteen, has to present her hackathon project, a plant-watering sensor, in five minutes tomorrow and has never made slides.
    when: She writes "I need slides for my hackathon project but I don't know how to start" and the Plan a presentation focus mode is active.
    then: The assistant asks at most three simple questions per turn with examples, proposes a problem, solution, demo, impact and ask story for a five-minute pitch, lists six slides with one message each, waits for her confirmation, lets her pick a built-in design from template cards, creates six slides with speaker notes, and reviews them with concrete fixes such as shortening a slide with too much text.
  - id: business-update-arc
    given: Noah needs a fifteen-minute quarterly update for his management team.
    when: He describes the goal in the planner.
    then: The story phase proposes situation, key numbers, what it means, recommendation and next steps, and explains why this order suits a decision-making audience.
  - id: expert-fast-path
    given: Olivia writes "Teaching deck, 45 min, year 9 biology, photosynthesis, 12 slides, Friendly classroom, go".
    when: The planner starts.
    then: It asks no questions that the message already answers, shows a twelve-slide outline for confirmation in its first reply, and after "yes" creates the deck in Friendly classroom with speaker notes.
  - id: outline-needs-confirmation
    given: The planner showed Mia's six-slide outline.
    when: Mia replies "can the demo come before the solution?"
    then: The outline is shown again with the demo moved, and no deck is created until she confirms.
  - id: quick-request-without-focus
    given: Carol cancels the focus mode offer for "make me three slides about our office move".
    when: The assistant continues.
    then: It creates the three slides in a built-in template without design or planning questions.

assistant:
  - id: targeted-change
    given: A twelve-slide deck exists, and Alice moved the logo on slide 2 to the bottom right by hand.
    when: She asks "Shorten the text on slide 5 and add a closing slide".
    then: Slide 5 has shorter text, a thirteenth slide is added, the logo on slide 2 stays at the bottom right, and the timeline shows one new version.
  - id: uses-template-layouts
    given: Bob saved a template "Interview" with the layouts title, section, content, image, quote and closing.
    when: He references it and asks for a deck about a customer interview.
    then: The deck uses that template's colours and fonts, including a quote layout for the customer's statement.

editor:
  - id: text-and-drag
    given: Alice opens a deck the assistant made and switches to edit mode.
    when: She rewrites a heading, sets it to a larger size and another colour, drags the chart to the left half and makes it bigger, then presses undo once.
    then: The heading shows her text, size and colour, the chart is back at its size before the last step, and saving creates a new version.
  - id: slide-management
    given: A deck has five slides.
    when: Bob duplicates slide 2, drags the copy to the end, deletes slide 4 and changes slide 1 to the section layout.
    then: The strip shows five slides in the new order, and slide 1 is arranged by the section layout with its text kept.
  - id: saved-edit-survives-reload
    given: The assistant made a deck "Plan" that is at version 1.
    when: Alice renames the deck to "Launch plan" in edit mode, presses Done and reloads the page.
    then: The deck shows "Launch plan", and its timeline lists version 1 and a new version 2.
  - id: stale-edit-is-refused
    given: Bob opened the deck on his laptop at version 2, and meanwhile saved version 3 from his phone.
    when: He finishes an edit on the laptop and presses Done.
    then: The laptop shows that saving failed and offers a retry; version 3 from the phone is kept unchanged, and no version is created from the laptop edit.

present:
  - id: two-windows
    given: Alice's laptop is connected to a projector and she presses Present.
    when: She moves the new window to the projector and presses the right arrow in the presenter view.
    then: The projector shows only the slides and advances with her; her laptop shows the current slide, the next slide, her notes, a timer and the slide list.
  - id: notes-stay-private
    given: Slide 3 has the speaker note "Mention the discount only if asked".
    when: Slide 3 is shown.
    then: The note is visible in the presenter view and nowhere in the audience window.

remote:
  - id: phone-steers-the-laptop
    given: Mia's laptop shows her deck "Hackathon pitch" (8 slides) in the full-screen presentation on the projector, and she opens the same chat on her phone.
    when: She opens the deck on the phone, taps "Remote" and then "Next".
    then: Within about a second the projector shows slide 2, and the phone shows "2 / 8" with Previous, Next and the slide list.
  - id: jump-and-notes-on-demand
    given: Mia's phone is the remote for the presentation from the previous example; slide 5 has the speaker note "Mention the demo video".
    when: She picks slide 5 from the list on the phone and taps "Show notes".
    then: The projector jumps to slide 5 and shows no note; only the phone shows "Mention the demo video"; tapping "Hide notes" hides it again.
  - id: laptop-keyboard-moves-the-phone
    given: Mia's phone is the remote and the projector shows slide 5.
    when: She presses the right arrow key on the laptop.
    then: The projector shows slide 6 and the phone updates to "6 / 8" without a tap.
  - id: remote-ends-with-the-presentation
    given: Mia's phone is the remote.
    when: She presses Escape on the laptop to leave the presentation.
    then: The phone's remote shows that nothing is being presented and offers no slide controls until she presents again.
  - id: server-learns-nothing
    given: Mia steers 8 slides from her phone.
    when: The operator inspects what the server received and stored.
    then: Each relayed update is unreadable ciphertext with a size of under 1 KB, nothing about the presentation is stored, and no speaker note was ever sent.
  - id: only-own-devices
    given: Mia shared the deck with Ben through a share link, and Ben opens it while she presents.
    when: Ben looks for a remote.
    then: Ben sees no Remote control and cannot change the slide on Mia's laptop.

follow_live:
  - id: remote-audience-follows
    given: Alice shared her deck with a link and is presenting it; Bob opens the link on his phone.
    when: Alice moves to slide 4 and types an idea into a notepad.
    then: Bob sees a live indicator, his view moves to slide 4 and shows the idea as it is typed; he can look back at slide 2 and tap to rejoin, and he cannot type or edit.
  - id: nothing-kept-after-the-talk
    given: The presentation from the previous example has ended.
    when: Bob keeps the link open.
    then: The live indicator disappears and the deck stays viewable as a normal shared deck; the server holds no record of which slides were shown.

import:
  - id: powerpoint-becomes-editable
    given: Alice uploads "Sales kickoff.pptx" with 20 slides, a chart, a morph transition and an embedded font.
    when: The upload finishes.
    then: A 20-slide editable deck appears; a note lists that the morph transition was replaced by a fade and the embedded font by a similar one, and the original .pptx can be downloaded from the deck.
  - id: legacy-format
    given: Bob uploads "Old talk.ppt".
    when: The file is checked.
    then: It is not attached and a notice asks him to save it as .pptx and upload again.

export:
  - id: powerpoint-with-notice
    given: A deck has an interactive counter block, a YouTube video and a notepad with text.
    when: Alice chooses "Download as PowerPoint".
    then: Before the download she reads that the counter becomes a static picture and the YouTube video a thumbnail with a link; the downloaded file opens in PowerPoint with editable headings and the notepad text as normal text.
  - id: pdf
    given: The same deck has twelve slides with speaker notes.
    when: Bob chooses "Download as PDF" with notes included.
    then: He is told that animations, videos and interactive blocks become still images, and gets a twelve-page PDF with each slide and its notes.

surfaces:
  - id: deck-in-the-terminal
    given: Alice asks for a three-slide deck in the terminal app.
    when: The assistant finishes.
    then: The terminal shows the deck title and, for each slide, its number, its text and its notes, with lines such as "[image]" and "[interactive block]" for the other elements.
