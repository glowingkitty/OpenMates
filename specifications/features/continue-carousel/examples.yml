schema_version: 1
specification: feature.continue-carousel@1

saved_item_window:
  - id: early-reminder-does-not-promote-appointment
    given: A saved health appointment starts in 46 hours and its linked reminder triggers in 22 hours.
    when: The Continue carousel evaluates priority placement.
    then: The appointment has no priority card because its own start remains outside the 24-hour window.
  - id: appointment-enters-own-window
    given: A saved health appointment starts in 23 hours and its linked reminder triggers in 2 hours.
    when: The Continue carousel evaluates priority placement.
    then: The appointment has a priority card for the upcoming saved item with the label Appointment in 23h.
  - id: event-reminder-cannot-override-event-window
    given: A saved event starts in 30 hours and its linked reminder triggers in 6 hours.
    when: The Continue carousel evaluates priority placement.
    then: The event has no priority card because its own start remains outside the 24-hour window.

chat_reminder_window:
  - id: chat-reminder-promotes-chat
    given: A chat has a linked reminder that triggers in 22 hours.
    when: The Continue carousel evaluates priority placement.
    then: The chat has a priority card for the approaching reminder with the label Reminder in 22h.
