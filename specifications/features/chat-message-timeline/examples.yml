schema_version: 1
specification: feature.chat-message-timeline@1
visibility_and_spacing:
- id: first-answer-and-follow-up
  given: Alice has one question and one assistant answer containing several tool and activity steps.
  when: She reads that first answer, then sends a follow-up and receives another assistant response.
  then: The first exchange has no timeline or timeline toggle. After the second response appears, two evenly spaced marks fade in as a roughly 24-pixel stack on a wide layout. On a phone the toolbar toggle appears, with the marks hidden until Alice opens it.
- id: grow-to-a-scrollable-stack
  given: Alice has a conversation with many answered follow-up questions.
  when: More exchanges arrive and she scrolls the marks toward the earlier questions.
  then: Mark spacing stays constant. The stack grows to a compact cap around 240 pixels, then scrolls internally through the remaining marks instead of stretching them apart or dropping older exchanges.
preview_and_activate:
- id: hover-an-earlier-exchange
  given: Alice is reading the latest answer in a saved trip-planning chat with several earlier questions and answers.
  when: She hovers the mark for her question about train tickets, then clicks it.
  then: Hover smoothly widens that neutral mark and increases its opacity without scaling the rail or adding an orange highlight. The preview shows her question as one highlighted, ellipsis-truncated line above at most three muted answer lines, without speaker or exchange-count labels and without moving the transcript. Clicking scrolls to the train-ticket question.
- id: pending-answer-and-empty-chat
  given: Alice's chat has two answered exchanges and a newest question still waiting for an answer; she can also open a new empty chat.
  when: She previews the newest question, then opens the empty chat.
  then: The preview identifies the pending answer rather than showing the previous answer. The empty chat has no timeline or leftover preview.
touch_scrubbing:
- id: hold-slide-and-release-on-phone
  given: Alice opens a long conversation on a phone, reveals the timeline with its toolbar toggle and holds a finger on the marks.
  when: She slides upward and holds near the stack edge to continue through older marks, then releases on the question about the project budget.
  then: The preview follows the selected exchange beside and clear of her finger. Release loads and scrolls to the budget question once, while the timeline pill remains open.
- id: cancel-and-scroll-normally
  given: Alice is previewing an exchange with a held finger and the operating system cancels that pointer gesture.
  when: She returns to the chat and swipes in the ordinary transcript area.
  then: Cancellation dismissed the preview without jumping. Her later swipe scrolls the transcript normally and does not activate the timeline.
full_history_loading:
- id: target-outside-cache-and-dom
  given: A conversation contains ten thousand exchanges, while Alice's browser has loaded only its newest message window and renders only part of that window.
  when: Alice finds an exchange near the start through the timeline and activates it.
  then: The evenly spaced stack scrolls to reveal the older mark without grouping or removing exchanges. The browser loads only the needed bounded section, displays the matching question and answer and aligns that exact question in the viewport. The existing latest-message control returns Alice to the recent transcript.
- id: unavailable-history-can-retry
  given: Alice has scrolled through long answers in a cached recent section while an older exchange is not cached and the network is unavailable.
  when: She selects that older exchange, then retries after reconnecting.
  then: The first attempt clearly reports that the content is unavailable and preserves her readable section. Retry loads and opens the exact selected exchange rather than an adjacent question.
compression_history:
- id: browse-original-pre-compression-messages
  given: Alice's conversation has been compressed twice and the oldest original messages are retained outside the current AI message context.
  when: She previews and selects a question from before the first compression.
  then: Its original chronological mark is dimmer, its readable preview says Before compression and selection loads the original question and answer. No checkpoint or AI context changes and no inference starts.
- id: distinguish-current-exchanges-from-summaries
  given: Alice's chat contains a compression summary, internal system events and user questions after the most recent compression boundary.
  when: She browses the timeline around that boundary.
  then: Current original-message exchanges use normal marks, earlier exchanges use the compression treatment and neither the summary nor system events appears as an invented user question.
access_and_lifecycle:
- id: switch-workspaces-during-a-preview-read
  given: Alice requests an uncached preview in her personal workspace while PII originals are hidden.
  when: She switches to a Team workspace before the old request completes, then previews a permitted Team exchange.
  then: The delayed personal result cannot populate the Team preview or cause a jump. The Team preview follows its reading permission and PII visibility setting, and an unauthorized history request reveals no transcript.
- id: shared-access-and-new-answer
  given: Alice is reading an earlier exchange in a permitted shared transcript or browsing her own chat while a newer answer streams.
  when: The shared history loads or the newer answer updates.
  then: The shared timeline exposes only the permitted shared transcript; newer content does not change the selected earlier exchange or pull the transcript away. Preview text is never sent for AI inference or added to plaintext server storage or content logs.
accessible_layout:
- id: keyboard-with-sidebar-closed
  given: Alice uses a desktop keyboard with the sidebar closed and reduced motion enabled.
  when: She focuses the timeline, moves with arrow keys and Home or End, dismisses a preview with Escape and activates another exchange with Enter or Space.
  then: The compact rail sits immediately outside the message column while the full-width header and centered column keep their normal alignment. Focus and exchange labels identify each selection; dismissal does not navigate, activation reaches the exact question and reduced motion keeps the transitions immediate.
- id: narrow-touch-preview-in-both-themes
  given: Alice opens a chat on a narrow phone and also uses the chat beside another panel on a laptop, in light or dark theme.
  when: She opens the timeline from the toolbar, scrolls until the header appears, then holds near the bottom of the marks and previews a long question and answer.
  then: The gray pill overlays the left side of the full-width transcript without narrowing or rewrapping it. The marks stay below the visible header and above the composer while remaining centered when space permits. The preview stays beside the stack, inside the chat and clear of her finger. The pill contains only marks, without extra buttons or a visible scrollbar; the page has no horizontal overflow.
narrow_layout_disclosure:
- id: phone-toggle-and-persistent-overlay
  given: Alice reads a phone chat with several answered exchanges. The full-width transcript has no visible timeline marks and its three-line toolbar button is fully opaque.
  when: She taps that button, scrubs to an old exchange, releases to navigate, scrolls the transcript and taps outside the timeline. She then taps the same button again.
  then: The first tap fades in a gray shadowed vertical pill over the left side of the chat and reduces the button opacity. The pill stays open during navigation, scrolling and outside taps. The second tap fades it out and restores full button opacity. Neither toggle changes the transcript width, line wrapping or scroll position.
- id: wide-layout-and-accessible-toggle
  given: Alice reads the same conversation in a wide chat pane, then in a narrow pane with reduced motion enabled.
  when: She uses the timeline controls with the keyboard and dismisses a preview with Escape.
  then: The wide pane keeps its existing rail beside the message column, without a disclosure button or pill. The narrow pane offers an accessibly labelled toolbar toggle whose expanded state matches the overlay. Its opacity changes are immediate with reduced motion, and Escape dismisses only the preview while the open pill remains visible.
bookmarks:
- id: retain-an-old-bookmark-through-the-assistant-response
  given: Alice previously bookmarked her project-budget question in the earlier UI; its assistant answer is retained before two compression points in a long chat.
  when: She opens that exchange in the corrected UI and later removes its bookmark from the assistant action row or response preview.
  then: The saved selection is represented by a yellow assistant bookmark and exchange mark, with no user-message bookmark button. Removal clears the legacy selection and yellow state without moving the transcript or changing AI memory. Her private saved choice also remains available after reopening on another signed-in device.
- id: bookmark-a-response-and-remove-the-last-bookmark
  given: Alice has bookmarked an assistant response in a Team chat and no other message in that exchange is bookmarked.
  when: She removes the bookmark using that response's bookmark control, or retries after a failed save.
  then: A failed save keeps the previous yellow saved state until retry succeeds. Successful removal clears the control's yellow glow and the exchange's yellow timeline mark. Other Team members' bookmark choices and the shared transcript remain unchanged.
assistant_message_actions:
- id: fixed-action-row-and-delayed-tooltips
  given: Alice reads an assistant answer with copy, bookmark and report-bad-answer icons in its action row.
  when: She briefly hovers each icon in turn, or focuses it with the keyboard.
  then: The icon dimensions and neighboring text stay in place. After the normal delay, the same tooltip UI used by Share chat and More identifies the action; no label expands sideways in the row. Copy and report retain their existing actions.
- id: assistant-only-filled-bookmark
  given: Alice can see her own message and an assistant response on a phone or laptop.
  when: She finds the filled gray bookmark beside the assistant's copy and report icons, hovers it on the laptop and activates it.
  then: Only the assistant has a bookmark control. Hover changes the icon color; a saved bookmark glows yellow and colors the associated timeline mark yellow. There is no separate bookmark row beneath either message.
