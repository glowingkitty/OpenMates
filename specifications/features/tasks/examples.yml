schema_version: 1
specification: feature.tasks@4

task_private_content:
  - id: encrypted-task
    input: {title: Fix hydrated Plan response, description: Return key wrappers after mutation}
    expect: {durable_plaintext_title: false, durable_plaintext_description: false, raw_task_key: absent}

task_lifecycle:
  - id: explicit-block
    input: {task: task-1, status: in_progress, blocker: waiting_for_user}
    expect: {status_after: blocked, blocked_reason_visible: true}
  - id: prose-does-not-complete
    input: {assistant_message: The task is done, task_status: in_progress}
    expect: {task_status_after_message: in_progress}

task_assignment_identity:
  - id: codex-created-task
    assertion_ids: [tasks.assignment.identity-separated]
    given: A trusted Codex session creates a software Task assigned to itself.
    when: The Task is stored.
    then: It is created atomically as an external-AI Task attributed to Codex and does not enter the native OpenMates queue.
  - id: native-and-real-world-tasks
    assertion_ids: [tasks.assignment.identity-separated]
    given: OpenMates creates one Task for itself while Codex creates a reminder for the user to connect a physical device.
    when: Both Tasks are stored with their requested assignees.
    then: The OpenMates Task is eligible for its native queue; the user Task has no AI identity, retains the hashed human assignee, and does not enter that queue.

task_blocked_reason:
  - id: encrypted-user-input-blocker
    input: {task: task-1, reason_code: missing_credentials, reason_text: A repository write token is required.}
    expect: {status_after: blocked, queue_state: waiting_for_user, durable_plaintext_reason: false, authorized_web_reason: A repository write token is required.}
  - id: code-fallback
    input: {task: task-2, reason_code: waiting_for_approval, reason_text: null}
    expect: {status_after: blocked, web_reason_source: localized_reason_code}

task_external_chat_context:
  - id: codex-chat-task
    given: A Codex chat creates a Task linked to its external thread and supplies a private thread title.
    when: The Task is stored.
    then: Codex is the provider, the lookup hash is present, and neither the external ID nor title is stored as plaintext.
  - id: native-and-external-rejected
    given: A client supplies both a native OpenMates chat and a Codex thread for one Task.
    when: It tries to create the Task.
    then: Creation fails with TASK_CONTEXT_CONFLICT and nothing is mutated.

task_dependencies:
  - id: flat-blocked-by
    input: {task_2_blocked_by: task-1, task_1_status: todo}
    expect: {task_2_eligible: false, child_task_collection_created: false}
  - id: reject-cycle
    input: {dependencies: [task-1->task-2, task-2->task-1]}
    expect_error: {code: TASK_DEPENDENCY_CYCLE, mutation: false}

task_plan_links:
  - id: phase-is-presentation-only
    input: {plan: plan-1, phase: implementation, task: task-1}
    expect: {task_owns_status: true, phase_owns_status: false, executable_step_created: false}

task_check_links:
  - id: failed-check-creates-fix-task
    input: {check: check-1, failed_run: run-1, task: fix-check-1}
    expect: {task_source_check_id: check-1, check_status_after_task_done: failed}
  - id: human-check-work-task
    input: {check: physical-device-check, task: inspect-device, assignee: user}
    expect: {task_is_normal_task: true, human_confirmation_still_required: true}

task_project_links:
  - id: encrypted-project-link
    input: {task: task-1, project: project-1}
    expect: {raw_project_id_plaintext: false, project_hash_present: true, project_wrapper_present: true}

task_workflow_projections:
  - id: workflow-run-card
    input: {workflow_run: run-1, projection: current_run}
    expect: {user_task_row_created: false, read_only: true, nodes_inside_run_detail: true}

task_detail_presentation:
  - id: laptop-split-detail
    input: {viewport: laptop, selected_task: task-1}
    expect: {workspace_visible: true, detail_beside_workspace: true}
  - id: phone-fullscreen-detail
    input: {viewport: phone, selected_task: task-1}
    expect: {fullscreen_overlay: true, close_restores_board: true}

task_activity_layout:
  - id: one-final-activity-section
    given: {task_detail: fullscreen, sections: [description, metadata, dependencies, links, activity]}
    expect: {final_section: activity, updates_section_visible: false, comments_section_visible: false, composer_position: top}
  - id: comments-and-updates-share-stream
    given: {entries: [lifecycle_update, comment, tombstone]}
    expect: {rendered_sections: [activity], stable_chronological_order: true, restore_history_rendered_by_default: false}

task_activity_composer:
  - id: multiline-comment
    given: {text: "First line\nSecond line", task_key_available: true}
    action: send_activity_comment
    expect: {line_breaks_preserved: true, composer_cleared_after_send: true}
  - id: voice-reuses-message-processing
    given: {mic_permission: granted, task_key_available: true}
    action: record_voice_activity_comment
    expect: {message_transcription_path_used: true, send_deferred_until_ready: true, durable_plaintext_transcript: false}
  - id: file-reuses-message-embed
    given: {file: private_pdf, task_key_available: true}
    action: attach_file_and_send_activity_comment
    expect: {message_embed_path_used: true, send_deferred_until_upload_ready: true, failed_upload_visible: true}

task_activity_encryption:
  - id: encrypted-comment-entry
    input: {comment: Waiting for approval, task_key: available, entry_id: activity-1}
    expect: {encrypted_directly_with_task_key: true, unique_nonce: true, aad_binds: [task_id, entry_id, content_type, schema_version], durable_plaintext_comment: false, encrypted_entry_key_present: false}
  - id: uploaded-embed-key-through-task-key
    input: {embed: private_upload, task_key: available, entry_id: activity-1}
    expect: {embed_key_encrypted_directly_with_task_key: true, unique_nonce: true, aad_binds: [task_id, entry_id, embed_ref, schema_version], raw_embed_key_backend_storage: false, durable_plaintext_file: false}

task_activity_attribution:
  - id: personal-mate-is-openmates
    assertion_ids: [tasks.activity.context-attribution]
    given: A personal mate named Kai comments, while Team member Sam comments through the web, CLI, and SDK.
    when: Those Activity entries are displayed.
    then: Kai appears as OpenMates; Sam keeps their name and profile image, with the CLI or SDK suffix shown only on those terminal surfaces.
  - id: codex-comment
    assertion_ids: [tasks.activity.context-attribution]
    given: Codex adds a normal Activity comment through the CLI.
    when: The comment is displayed.
    then: It is attributed to Codex and the client cannot replace that name with an arbitrary label.

task_activity_lifecycle:
  - id: automatic-start-status-entry
    assertion_ids: [tasks.activity.lifecycle-system-generated]
    given: A Todo Task is started through the CLI and an in-progress Task is later blocked through the web.
    when: Each status transition succeeds.
    then: Each transition atomically appends a system-authored lifecycle update containing the previous and next status.
  - id: ordinary-codex-milestone-comment
    assertion_ids: [tasks.activity.lifecycle-system-generated]
    given: Codex posts the summary "Backend contract verified" to a Task.
    when: The activity is stored.
    then: It is an ordinary comment_added entry rather than a custom milestone event.

task_activity_tombstones:
  - id: openmates-deleted-by-sam
    given: {comment_author: openmates, deleting_user: Sam}
    expect: {tombstone: Comment by OpenMates deleted by Sam, original_content_visible: false}
  - id: sam-deletes-own-comment
    given: {comment_author: Sam, deleting_user: Sam}
    expect: {tombstone: Comment by Sam deleted by Sam, original_content_visible: false}
  - id: taylor-deletes-sams-comment
    given: {comment_author: Sam, deleting_user: Taylor, deleting_user_role: admin}
    expect: {tombstone: Comment by Sam deleted by Taylor, original_embeds_visible: false, original_attachments_visible: false}

task_activity_authorization:
  - id: team-viewer-cannot-comment
    given: {context: team, role: viewer, task_readable: true}
    action: send_activity_comment
    expect_error: {code: TASK_ACTIVITY_PERMISSION_DENIED, mutation: false, visible_failure: true}
  - id: author-can-delete-own-comment
    given: {context: team, actor: Sam, comment_author: Sam, role: member}
    action: delete_activity_comment
    expect: {tombstone_written: true}
  - id: unauthorized-delete-fails-before-mutation
    given: {context: team, actor: Lee, role: viewer, comment_author: Sam}
    action: delete_activity_comment
    expect_error: {code: TASK_ACTIVITY_PERMISSION_DENIED, mutation: false}

task_execution_capacity:
  - id: capacity-wait
    input: {scope: personal, capacity_available: false, task: task-1}
    expect: {status: todo, waiting_state: waiting_for_capacity, auto_reconsider: true}

task_execution_order:
  - id: dependency-before-priority
    input: {task_1_priority: low, task_2_priority: urgent, task_2_blocked_by: task-1}
    expect: {next_task: task-1, urgent_bypass: false}

task_surface_parity:
  - id: same-dependency-blocker
    input: {surfaces: [rest_api, cli, sdk_npm, sdk_pip, gui_web], task: task-2}
    expect: {same_status: blocked, same_dependency: task-1, visible_failure: true}
  - id: same-activity-contract
    input: {surfaces: [rest_api, cli, sdk_npm, sdk_pip, gui_web], task: task-1, comment: Waiting on staging}
    expect: {same_encryption_boundary: true, same_tombstone_semantics: true, durable_plaintext_comment: false}


codex_connection_compatibility:
  - id: codex-verified-creator
    input: {provider: codex, external_chat_id: 00000000-0000-4000-8000-000000000001, cli_actor: assignee, paired_session: true, installed_thread_read: matched}
    expect: {creator_identity: codex, eligible_external_ai: [codex], encrypted_external_id: true, automatic_turn_start: false}
  - id: status-does-not-resume
    input: {command: tasks_connection, provider: codex, linked_thread_exists: true}
    expect: {method: thread/read, includeTurns: false, resume_called: false, turn_started: false}

task_owner_claim:
  - id: native-and-cli-defaults
    given: A native OpenMates chat creates a Task using its Task tool. A person also creates a Task from an ordinary terminal.
    when: The native tool explicitly sets link_to_chat to false; the terminal command omits a chat link. A Codex worker instead passes its own chat ID during creation.
    then: The first two Tasks remain unlinked. The Codex Task is linked to that worker in the same create request; no second claim request is needed.
  - id: competing-chat
    given: The Task "Repair header navigation" belongs to the Codex chat "Landing - Header".
    when: A different chat tries to claim that Task.
    then: The claim is rejected. The error quotes "Landing - Header" and shows its Codex chat ID. Another worker cannot claim the Task until its current link is released.

task_chat_deletion:
  - id: confirmed-delete-preserves-work
    given: A chat owns one in-progress Task, one Done Task and one Task blocked while waiting for approval.
    when: The chat is actually deleted, rather than archived or temporarily offline.
    then: Its Task links are removed. The in-progress Task becomes Todo, the Done Task stays Done, and the approval blocker remains. The Tasks, their history and their readable non-chat keys survive.

task_delivery_recovery:
  - id: accepted-write-lost-reply
    given: OpenMates accepts a Task creation, but the response is lost before the CLI receives it.
    when: The foreground connection recovers after a restart.
    then: Delivery checks the original operation before retrying and finds the existing Task instead of creating a duplicate. Until confirmed, the operation is shown as pending; a permanent conflict remains visible for review.

task_dependency_readiness:
  - id: last-task-dependency-done
    given: "The Task 'Implement the signup email smoke' is Blocked only on explicit Task dependencies. Its blocker code is external_dependency; it has no private blocker explanation or linked Plan."
    when: The final dependency becomes Done.
    then: The Task becomes Todo. No new chat is created. An explicitly paused owner remains paused even though its Task is ready.
  - id: preserve-independent-blocker
    given: A Task has completed dependencies but also has an encrypted explanation saying that user approval is still needed.
    when: Dependency readiness is checked.
    then: The Task stays Blocked and keeps that explanation. Completing dependencies does not override the separate human blocker.

task_cached_context:
  - id: all-tasks-bounded-text
    given: An orchestrator manages twelve Tasks in the configured OpenMates Project, and each Task has twenty activity entries.
    when: Codex loads its cached Task overview.
    then: All twelve Tasks appear with full titles and current states. Descriptions are shortened and only the latest activity per Task is shown. An unchanged tool boundary repeats no Task rows and makes no Task inventory request.
  - id: event-delivery-is-not-ownership
    given: A Task belongs to a paused Codex chat on the dev server, and a laptop can see the same Task.
    when: The Task's dependencies become Done.
    then: The paused chat is not resumed automatically, the laptop cannot claim the already owned Task for another chat, and routine activity does not wake the orchestrator.

task_execution_boundary:
  - id: pending-is-not-ownership
    given: A worker's claim is queued as pending while the server is unavailable. A related CI run has passed.
    when: The worker decides whether to begin the Task.
    then: It waits for the confirmed claim. The CI result does not grant ownership or automatically mark the Task Done.
  - id: another-device-is-not-another-owner
    given: A Task is owned by a chat registered to execute on the dev server.
    when: The same Task is opened on a laptop.
    then: Viewing it starts no new chat and transfers no execution lease. Moving execution requires an explicit handoff that first stops the source adapter.
