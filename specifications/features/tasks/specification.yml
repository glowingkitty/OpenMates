schema_version: 1
id: feature.tasks
version: 4
status: draft
title: Tasks
summary: >
  Tasks are encrypted, independently trackable units of human or agent work.
  They own execution status, ordering, dependencies, assignment, and activity
  while Plans explain why the work exists and Checks prove its outcomes.

purpose:
  outcomes:
    - Provide one canonical execution unit across standalone, chat, Plan, Project, and Team work.
    - Keep work status independent from Plan presentation and Check results.
    - Scale through flat Tasks and explicit dependencies instead of recursive subtask trees.

scope:
  includes:
    - Create, list, show, update, reorder, assign, block, unblock, skip, complete, delete, start-AI, ask, history, and restore behavior.
    - Backlog, todo, in-progress, blocked, and done lifecycle with explicit queue and AI execution state.
    - Human, OpenMates, and named external-AI assignment, priority, due dates, labels, Project/Plan/native-chat/external-chat links, and optimistic versions.
    - One user-facing Activity section at the end of Task detail, combining lifecycle updates, comments, and deletion tombstones in a stable chronological stream.
    - A top-of-Activity composer that reuses normal message processing for multiline text, voice, files/uploads, and message embeds.
    - Client-encrypted Activity comment text and uploaded embed keys encrypted directly with the Task key, with context-aware personal, Team, CLI, SDK, OpenMates, and named external-AI attribution.
    - Server-authored lifecycle Activity entries for successful Task creation and status transitions, independent of the client or assignee that initiated the mutation.
    - Typed external-chat contexts whose private identifiers and display titles remain client-encrypted while provider and keyed lookup metadata remain server-visible.
    - Safe blocked reason codes plus client-encrypted user-facing blocker explanations.
    - Flat Tasks with optional dependency links and Plan phase grouping; no recursive child Task ownership.
    - Verification work created from a Check or failed Check as normal Tasks while the linked Check remains the source of proof status.
    - Workflow run projections as read-only task-shaped items without creating Task records.
    - Responsive Project/Tasks workspace detail behavior and encrypted content/key wrappers.
  excludes:
    - Plan goals, scope, approval, assumptions, Success Criteria, or Plan execution state.
    - Check definitions, Check Runs, evaluator results, human confirmation decisions, or proof artifact history.
    - Recursive subtasks or a second status model embedded in Plan steps.
    - Workflow node execution records represented as independent Tasks.
    - Server-side plaintext search over private Task or Activity content.
    - A separate user-facing Updates section, a separate Comments section, public unauthenticated Task Activity APIs, or standalone Activity discussion threads.
    - Exact Activity styling, OS-owned picker chrome, notifications, or cryptographic erasure of deleted content already synchronized to authorized clients.

relationships:
  related_specifications: [feature.plans, feature.checks, feature.projects, feature.message-input, feature.chats, feature.teams, surface.cli, surface.sdk]

actors:
  - id: task_owner
    role: Owns or shares the workspace containing the Task.
  - id: human_assignee
    role: Performs or confirms work outside automated execution.
  - id: ai_assignee
    role: Executes authorized work through either OpenMates or an identified external-AI runtime.

models:
  TaskRecord:
    task_id: {type: stable_id, required: true}
    status: {type: enum, values: [backlog, todo, in_progress, blocked, done], required: true}
    assignee_type: {type: enum, values: [user, openmates, external_ai, unassigned], required: true}
    assignee_identity: {type: allowlisted_identity_or_null, values: [openmates, opencode], nullable: true, constraints: {required_for: [openmates, external_ai], forbidden_for: [user, unassigned], display_name_derived_from_registry: true}}
    assignee_hash: {type: hashed_user_id_or_null, nullable: true, constraints: {required_for: [user], forbidden_for: [openmates, external_ai, unassigned]}}
    priority: {type: integer, values: [0, 1, 2, 3, 4], required: true}
    position: {type: integer, required: true}
    due_at: {type: timestamp_or_null, nullable: true}
    primary_chat_id: {type: chat_id_or_null, nullable: true}
    hashed_primary_chat_id: {type: hashed_id_or_null, nullable: true}
    external_chat_provider: {type: enum_or_null, values: [opencode], nullable: true, constraints: {allowlisted: true}}
    external_chat_lookup_hash: {type: blind_index_or_null, nullable: true, constraints: {computed_client_side: true, raw_external_id_recoverable: false}}
    encrypted_external_chat_id: {type: client_ciphertext_or_null, nullable: true, constraints: {plaintext_external_id_backend_storage: forbidden}}
    encrypted_external_chat_title: {type: client_ciphertext_or_null, nullable: true}
    plan_id: {type: stable_id_or_null, nullable: true}
    plan_phase_id: {type: stable_id_or_null, nullable: true, constraints: {presentation_group_only: true}}
    source_check_id: {type: stable_id_or_null, nullable: true}
    encrypted_labels: {type: client_ciphertext_or_null, nullable: true, constraints: {plaintext_label_names: forbidden}}
    encrypted_activity_summary: {type: client_ciphertext_or_null, nullable: true}
    encrypted_latest_instruction: {type: client_ciphertext_or_null, nullable: true}
    encrypted_linked_project_ids: {type: client_ciphertext_or_null, nullable: true, constraints: {raw_project_ids_plaintext: forbidden}}
    linked_project_hashes: {type: hashed_id_list, nullable: true, constraints: {server_visible_filter_metadata: true}}
    label_hashes: {type: blind_index_array, nullable: true, constraints: {and_filter_semantics: true}}
    hashed_team_id: {type: hashed_id_or_null, nullable: true}
    encrypted_title: {type: client_ciphertext, required: true}
    encrypted_description: {type: client_ciphertext_or_null, nullable: true}
    version: {type: integer, required: true, constraints: {monotonic: true, stale_mutations_rejected: true}}

  TaskDependency:
    task_id: {type: stable_id, required: true}
    blocked_by_task_id: {type: stable_id, required: true}
    relation: {type: enum, values: [finish_before_start], required: true}
    constraints: {type: dependency_constraints, required: true, constraints: {cycles: forbidden, recursive_ownership: forbidden}}

  TaskLifecycleState:
    queue_state: {type: enum_or_null, values: [none, waiting, active, skipped, waiting_for_user]}
    ai_execution_state: {type: enum_or_string_or_null, constraints: {safe_routing_metadata: true}}
    blocked_reason_code: {type: enum_or_null, values: [needs_user_input, waiting_for_approval, missing_credentials, ambiguous_requirement, external_dependency, environment_unavailable, verification_failed, other], constraints: {plaintext_private_content: forbidden}}
    encrypted_blocked_reason: {type: client_ciphertext_or_null, nullable: true, constraints: {plaintext_blocked_reason_backend_storage: forbidden}}
    started_at: {type: timestamp_or_null, nullable: true}
    completed_at: {type: timestamp_or_null, nullable: true}

  TaskExecutionAdmission:
    capacity_scope: {type: enum, values: [personal, team], required: true}
    execution_lane: {type: derived_identifier, required: true, constraints: {precedence: [plan_id, primary_chat_id, standalone_task_id]}}
    waiting_state: {type: enum, values: [waiting_for_previous_task, waiting_for_plan_dependency, waiting_for_capacity], required: true}
    executable_assignee: {type: invariant, required: true, constraints: {openmates_queue_accepts_only: openmates, external_ai_never_admitted: true}}

  TaskAssigneeIdentity:
    identity: {type: allowlisted_identifier, values: [openmates, opencode], required: true}
    assignee_type: {type: enum, values: [openmates, external_ai], required: true}
    display_name: {type: safe_display_name, values: [OpenMates, OpenCode], required: true, constraints: {client_supplied_override: forbidden}}

  TaskExternalChatContext:
    provider: {type: enum, values: [opencode], required: true}
    lookup_hash: {type: blind_index, required: true, constraints: {domain_separated: true, owner_scoped: true}}
    encrypted_external_id: {type: client_ciphertext, required: true}
    encrypted_display_title: {type: client_ciphertext_or_null, nullable: true}
    native_chat_exclusivity: {type: invariant, required: true, constraints: {primary_chat_id_and_external_context_mutually_exclusive: true}}
    task_key_source: {type: enum, values: [owner_master_wrapper], required: true, constraints: {synthetic_chat_key: forbidden}}

  TaskKeyWrapper:
    key_type: {type: enum, values: [master, chat, project, plan, team], required: true}
    encrypted_task_key: {type: wrapped_key_ciphertext, required: true, constraints: {raw_task_key: forbidden}}
    hashed_task_id: {type: hashed_id, required: true}
    hashed_chat_id: {type: hashed_id_or_null, nullable: true}
    hashed_project_id: {type: hashed_id_or_null, nullable: true}
    hashed_plan_id: {type: hashed_id_or_null, nullable: true}
    hashed_team_id: {type: hashed_id_or_null, nullable: true}
    team_key_epoch: {type: integer_or_null, nullable: true, constraints: {required_when_key_type_team: true}}

  WorkflowTaskProjection:
    task_id: {type: stable_projection_id, required: true}
    source: {type: literal, value: workflow_run, required: true}
    projection_kind: {type: enum, values: [last_run, current_run, next_run], required: true}
    status: {type: enum, values: [todo, in_progress, blocked, done], required: true}
    read_only: {type: boolean, required: true, constraints: {must_be_true: true}}

  TaskDetailPresentation:
    responsive_surface: {type: embed_style_detail_surface, required: true}
    workspace_continuity: {type: preserved_workspace_state, required: true}

  TaskActivityEntry:
    entry_id: {type: stable_id, required: true, constraints: {idempotent_create: true}}
    task_id: {type: stable_id, required: true}
    kind: {type: enum, values: [comment, lifecycle_update, tombstone], required: true}
    actor_kind: {type: enum, values: [user, openmates, external_ai, system], required: true}
    actor_identity: {type: allowlisted_identity_or_null, values: [openmates, opencode], nullable: true, constraints: {display_name_derived_from_registry: true}}
    source_surface: {type: enum, values: [web, apple, cli, sdk_npm, sdk_pip, system], required: true}
    event_type: {type: enum, values: [created, updated, moved, status, comment_added, comment_deleted], required: true}
    previous_status: {type: task_status_or_null, nullable: true, constraints: {allowed_for_event_type: status}}
    next_status: {type: task_status_or_null, nullable: true, constraints: {allowed_for_event_type: status}}
    created_at: {type: timestamp, required: true}
    deleted_at: {type: timestamp_or_null, nullable: true}
    ordering: {type: chronological_stable_order, required: true}

  TaskActivityComposer:
    placement: {type: layout_position, required: true, constraints: {top_of_final_activity_section: true}}
    supported_inputs: {type: array, required: true, constraints: {values: [multiline_text, voice, files, uploads, message_embeds], reuses_message_processing_logic: true}}
    send_gating: {type: invariant, required: true, constraints: {defer_while_uploading_or_transcribing: true, empty_comment_forbidden: true, failed_embed_visible: true}}

  TaskActivityEncryption:
    encrypted_comment_text: {type: client_ciphertext_or_null, nullable: true, constraints: {encrypted_directly_with_task_key: true, unique_nonce_per_entry: true, aad_binds_task_and_entry: true, durable_plaintext_comment: forbidden}}
    encrypted_embed_key_material: {type: client_ciphertext_or_null, nullable: true, constraints: {encrypted_directly_with_task_key: true, unique_nonce_per_embed_key_payload: true, aad_binds_task_entry_and_embed: true, raw_embed_key_backend_storage: forbidden}}
    server_visible_metadata: {type: safe_metadata, required: true, constraints: {plaintext_private_content: forbidden}}

  TaskActivityAttribution:
    personal_openmates: {type: display_identity, required: true, constraints: {label: OpenMates, actual_mate_name_visible: forbidden}}
    team_app_user: {type: display_identity, required: true, constraints: {surfaces: [web, apple], shows_user_name: true, shows_profile_image: true, via_suffix: forbidden}}
    team_cli_user: {type: display_identity, required: true, constraints: {shows_user_name: true, shows_profile_image: true, via_suffix: "via OpenMates CLI"}}
    team_sdk_user: {type: display_identity, required: true, constraints: {shows_user_name: true, shows_profile_image: true, via_suffix: "via OpenMates SDK"}}
    mate_authored: {type: display_identity, required: true, constraints: {label: OpenMates, actual_mate_name_visible: forbidden}}
    external_ai_authored: {type: display_identity, required: true, constraints: {label_from_allowlisted_identity_registry: true, opencode_label: OpenCode, arbitrary_client_label: forbidden}}

  TaskActivityLifecycle:
    generation: {type: server_behavior, required: true, constraints: {successful_task_creation_and_status_transition_append_system_entry: true, client_specific_implementation: forbidden}}
    status_event: {type: safe_metadata, required: true, constraints: {event_type: status, previous_and_next_status_required: true, comment_ciphertext: forbidden}}
    mutation_consistency: {type: invariant, required: true, constraints: {task_mutation_and_lifecycle_entry_commit_together: true, duplicate_transition_entry: forbidden}}

  TaskActivityTombstone:
    hidden_content: {type: invariant, required: true, constraints: {comment_text: hidden, embed_previews: hidden, attachments: hidden}}
    author_label: {type: display_identity, required: true, constraints: {original_author: true, mate_author_becomes_openmates: true}}
    deleter_label: {type: display_identity, required: true, constraints: {deleting_user: true}}
    rendered_text: {type: localized_template, required: true, constraints: {template: "Comment by {author} deleted by {deleter}"}}

  TaskActivityAuthorization:
    read_scope: {type: authorization, required: true, constraints: {same_as_task_read_access: true}}
    write_scope: {type: authorization, required: true, constraints: {same_as_task_mutation_access: true, team_viewer_writes_forbidden: true}}
    delete_scope: {type: authorization, required: true, constraints: {author_or_task_mutation_role_required: true, visible_failure_on_forbidden: true}}

assertions:
  - id: tasks.content.client-encrypted
    type: privacy
    must: Task title, description, labels, activity, instructions, raw Project links, and key material remain client-encrypted while server-visible fields contain only safe lifecycle, assignment, ordering, routing, filtering, and version metadata.
    depends_on: [models.TaskRecord, models.TaskKeyWrapper, examples.task_private_content]
  - id: tasks.lifecycle.visible
    type: behavior
    must: Task creation, update, reorder, assignment, blocking, skipping, completion, deletion, OpenMates start, restoration, and queue transitions preserve explicit status, timestamps, conflict versions, and visible blockers; every successful creation or status transition atomically appends one server-authored lifecycle Activity entry, and assistant prose never changes Task state by itself.
    depends_on: [models.TaskRecord, models.TaskLifecycleState, models.TaskActivityLifecycle, examples.task_lifecycle]
  - id: tasks.assignment.identity-separated
    type: invariant
    must: Assignment distinguishes a human user, native OpenMates, a named external-AI identity, and unassigned work; OpenCode Tasks are created atomically as external_ai with the allowlisted opencode identity, human or real-world Tasks remain user-assigned when requested, and only openmates-assigned Tasks enter the native OpenMates execution queue.
    depends_on: [models.TaskRecord.assignee_type, models.TaskRecord.assignee_identity, models.TaskRecord.assignee_hash, models.TaskAssigneeIdentity, models.TaskExecutionAdmission.executable_assignee, examples.task_assignment_identity]
  - id: tasks.blocking.encrypted-reason
    type: privacy
    must: Blocking a Task stores one allowlisted server-visible blocked_reason_code and an optional client-encrypted user-facing blocked explanation; REST, CLI, SDK, and web decrypt and display the explanation only in authorized client memory, with a localized code fallback when no explanation exists.
    depends_on: [models.TaskLifecycleState, examples.task_blocked_reason]
  - id: tasks.external-chat.encrypted-context
    type: security
    must: A Task may belong to either one native OpenMates primary Chat or one allowlisted external Chat context; external provider is safe metadata, external id and title remain client-encrypted, equality filtering uses a domain-separated owner-scoped blind index, and synthetic native Chat ids or keys are forbidden.
    depends_on: [models.TaskRecord, models.TaskExternalChatContext, examples.task_external_chat_context]
  - id: tasks.structure.flat-dependencies
    type: invariant
    must: Tasks are flat independently addressable records; ordering and acyclic blocked-by links express execution relationships, while recursive subtasks and Plan-owned duplicate task status are forbidden.
    depends_on: [models.TaskDependency, examples.task_dependencies]
  - id: tasks.plan.execution-unit
    type: invariant
    must: A Plan executes through linked Tasks only; optional Plan phases group Tasks for presentation but do not become executable steps or own lifecycle state.
    depends_on: [models.TaskRecord.plan_id, models.TaskRecord.plan_phase_id, examples.task_plan_links]
  - id: tasks.check-work.not-proof
    type: behavior
    must: A Check may create or link a normal human/AI Task for required work, but completing that Task does not mark the Check passed; only a valid Check Run or explicit waiver changes proof state.
    depends_on: [models.TaskRecord.source_check_id, examples.task_check_links]
  - id: tasks.project-links.encrypted
    type: invariant
    must: Project-link mutations update safe Project hashes, encrypted raw Project ids, and authorized Task key wrappers together or fail without partial relinking.
    depends_on: [models.TaskRecord.encrypted_linked_project_ids, models.TaskRecord.linked_project_hashes, models.TaskKeyWrapper.hashed_project_id, examples.task_project_links]
  - id: tasks.key-wrappers.context-scoped
    type: security
    must: Task keys are never stored raw and wrappers are scoped to exactly one authorized owner, chat, Project, Plan, or Team context.
    depends_on: [models.TaskKeyWrapper, examples.task_private_content]
  - id: tasks.workflow-projections.read-only
    type: invariant
    must: Workflow run items are read-only projections keyed by run, never Task rows; Workflow nodes stay inside run detail and projections expose only Workflow-owned actions.
    depends_on: [models.WorkflowTaskProjection, examples.task_workflow_projections]
  - id: tasks.detail.embed-responsive
    type: behavior
    must: Selecting a Task opens embed-style detail beside the workspace when space allows and as a fullscreen overlay on compact viewports; closing restores board position, filters, and column state.
    depends_on: [models.TaskDetailPresentation, examples.task_detail_presentation]
  - id: tasks.activity.single-final-section
    type: behavior
    must: Task detail renders one Activity section as its final section, never separate user-facing Updates and Comments sections; a composer appears at the top and comments, OpenMates entries, lifecycle updates, and tombstones follow in one stable chronological stream.
    depends_on: [models.TaskActivityEntry, models.TaskActivityComposer.placement, examples.task_activity_layout]
  - id: tasks.activity.composer-message-parity
    type: behavior
    must: The Activity composer supports multiline text, voice, files/uploads, and normal message embeds by reusing message-processing upload, transcription, embed registration, pending/error, and send-gating behavior rather than creating a weaker Task-only attachment path.
    depends_on: [models.TaskActivityComposer, examples.task_activity_composer]
  - id: tasks.activity.client-encrypted
    type: privacy
    must: Activity comment text and uploaded embed-key material are encrypted directly with the Task key using unique nonces and Task/entry/content-bound authenticated context; durable backend stores, logs, history, and indexes contain no plaintext comments, voice transcripts, file content, raw Task keys, or raw embed keys, and the unreleased per-entry wrapped-key format is not retained.
    depends_on: [models.TaskActivityEncryption, models.TaskKeyWrapper, examples.task_activity_encryption]
  - id: tasks.activity.context-attribution
    type: behavior
    must: Personal OpenMates and mate-authored entries show the generic OpenMates identity; allowlisted external-AI comments show their registered identity such as OpenCode; Team web and Apple comments show user name plus profile image without via text, Team CLI comments add via OpenMates CLI, and Team npm or pip SDK comments add via OpenMates SDK.
    depends_on: [models.TaskActivityAttribution, examples.task_activity_attribution]
  - id: tasks.activity.lifecycle-system-generated
    type: behavior
    must: The Task backend appends lifecycle_update entries with system attribution for successful Task creation and status transitions on every client surface, reuses the canonical created and status event types, stores previous and next status as safe metadata, and never requires OpenCode-specific lifecycle logic.
    depends_on: [models.TaskActivityEntry, models.TaskActivityLifecycle, examples.task_activity_lifecycle]
  - id: tasks.activity.deletion-tombstone
    type: behavior
    must: Deleting a comment hides its text, embed previews, and attachments from normal Activity rendering but preserves a tombstone naming the original author and deleting user; mate-authored comments use OpenMates instead of the mate's actual name.
    depends_on: [models.TaskActivityTombstone, examples.task_activity_tombstones]
  - id: tasks.activity.task-scoped-authorization
    type: security
    must: Activity reads follow Task read access, creates follow Task mutation access, Team viewers cannot comment, and deletion requires the comment author or a Task-mutation-authorized role; forbidden attempts fail visibly before mutation.
    depends_on: [models.TaskActivityAuthorization, examples.task_activity_authorization]
  - id: tasks.execution.capacity-scoped
    type: behavior
    must: OpenMates-assigned Tasks use independent owner-scoped personal or Team capacity pools; capacity-full Tasks wait visibly and are reconsidered automatically, while external-AI Tasks and Workflow projections do not consume native OpenMates Task capacity.
    depends_on: [models.TaskExecutionAdmission, examples.task_execution_capacity]
  - id: tasks.execution.order-preserved
    type: invariant
    must: Dependency and lane eligibility are resolved before priority or capacity; no urgent or free-capacity Task may bypass an unfinished required predecessor or run concurrently in a single-task lane.
    depends_on: [models.TaskDependency, models.TaskExecutionAdmission, examples.task_execution_order]
  - id: tasks.dependencies.done-only
    type: invariant
    must: Task dependency edges use the shared normalized Plan/Task graph, reject self, duplicate, and cyclic edges, and unblock only when every target Task is done or target Plan is completed.
    depends_on: [models.TaskDependency, examples.task_dependencies]
  - id: tasks.surface.semantic-parity
    type: parity
    must: REST, CLI, SDK, and web preserve encrypted content, native/external Chat context, encrypted blocked explanations, named assignment identities, lifecycle, Activity comments and system entries, tombstones, Plan/Check/Project links, version conflicts, workflow projections, and visible failures wherever Task operations are exposed.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: true
    role: First-party authenticated routes own Task persistence, lifecycle, dependency validation, assignment, queue admission, encrypted links, Activity transport, history, and wrapper authorization. Activity routes accept and return client ciphertext without server-side decryption, use normal Task read/mutation authorization, consume no credits, and use standard Task read/mutation rate limits.
    access_model: first-party client surface only
  cli:
    required: true
    parity: semantic
    requirements:
      - List, show, create, edit, assign, reorder, depend, block, skip, start, complete, and inspect Task blockers with user, OpenMates, external-AI identity, and unassigned semantics.
      - Create and filter external-chat Tasks through provider:id input while encrypting the external id locally and sending only safe provider plus blind-index metadata.
      - Preserve --reason as the legacy blocked-reason-code alias while supporting explicit --reason-code and encrypted --reason-text input.
      - List, add, and delete Activity comments after local Task-key unlock; Team-created comments use via OpenMates CLI attribution.
      - Trusted OpenCode commands create external_ai Tasks with the opencode identity and post ordinary comment_added Activity entries attributed as OpenCode.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true, requirements: [list_activity, add_activity_comment, delete_activity_comment, via_openmates_sdk_attribution]}
      pip: {required: true, requirements: [list_activity, add_activity_comment, delete_activity_comment, via_openmates_sdk_attribution]}
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
        requirements:
          - id: tasks.gui.card
            elements: [title, status, assignee_name, priority, due_state, plan_or_check_or_external_chat_context, blocked_indicator]
            interactions: [open_detail, move_status, reorder_when_allowed]
          - id: tasks.gui.detail
            elements: [header, description, status, assignee_name, dependencies, project_links, plan_link, source_check_link, external_chat_source, blocked_reason, activity, activity_composer, activity_attribution, activity_lifecycle, activity_tombstones]
            interactions: [edit, assign, block, unblock, skip, complete, open_plan, open_check, add_activity_comment, attach_activity_file, record_activity_voice, open_activity_embed, delete_authorized_activity_comment]
            states: [backlog, todo, in_progress, blocked, done, waiting_for_capacity, waiting_for_dependency, error]
            accessibility: [keyboard_board_alternative, semantic_status, dependency_labels, non_color_priority]
            responsive_behavior: [split_detail_when_space_allows, fullscreen_overlay_on_compact_viewports]
            design_references: optional
      apple: {required: false, role: Native Task Activity must preserve web attribution, encryption, composer capabilities, and tombstone outcomes when implemented.}
    exceptions:
      - id: apple-task-board-deferred
        implementation: apple
        reason: Rich board and dependency authoring starts on web.
        equivalent_outcome: Apple must preserve Task lifecycle, assignment, dependency blockers, links, and Activity semantics when implemented; Team app comments show user name plus profile image without via text.

examples:
  file: examples.yml
  required_groups: [task_private_content, task_lifecycle, task_assignment_identity, task_blocked_reason, task_external_chat_context, task_dependencies, task_plan_links, task_check_links, task_project_links, task_workflow_projections, task_detail_presentation, task_activity_layout, task_activity_composer, task_activity_encryption, task_activity_attribution, task_activity_lifecycle, task_activity_tombstones, task_activity_authorization, task_execution_capacity, task_execution_order, task_surface_parity]
