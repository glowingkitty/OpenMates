schema_version: 1
specification: feature.video-call@12
launch:
- id: start-in-existing-chat
  given: Maya is signed in with enough credits and her ramen chat open.
  when: She accepts the current speech-processing notice and starts a call.
  then: The call identifies Mistral Voxtral transcription, Eleven v4 Turbo speech and ordinary routed reasoning,
    stays bound to ramen and shows the existing controls.
binding:
- id: browse-another-chat
  given: Maya is speaking in a call attached to her ramen chat.
  when: She closes that chat and opens her travel chat.
  then: A pulsing handset-and-timer pill replaces the global brand immediately after the menu button; call messages still
    enter ramen while travel uses ordinary messaging. Pressing the pill returns to ramen, restores the brand and shows
    that call's strip without reconnecting.
call_strip:
- id: inline-to-fixed-call-strip
  given: Maya is at the top of the ramen chat with its full header and an active call strip directly beneath it.
  when: She scrolls down until the header leaves view, then scrolls back to the top.
  then: The strip becomes fixed at the top of the chat viewport with More then video at left, duration/audio bars centered,
    and Hang up then Close at right. More includes report/share actions. Scrolling back restores the inline strip without
    duplicate controls or a content jump, on phone and laptop. A round microphone button overlays the audio bars in the
    same style as Close while the duration stays readable.
- id: camera-and-close
  given: Maya is in a voice call using the fixed controls.
  when: She presses video, then closes the chat.
  then: Video requests camera permission and shares its view after permission is granted. Closing the chat keeps the
    call running in the brand-slot handset/timer pill, with the menu, center navigation and profile still in place.
call_events:
- id: connected-call-history
  given: Maya starts a call in the ramen chat and it connects successfully at 12:31.
  when: She closes the chat, ends the call at 12:35 and later reloads its history.
  then: Ramen contains one system event saying the call started at 12:31 and one saying it ended at 12:35. Both were
    encrypted before synchronization and neither produced an ordinary AI answer.
- id: failed-start-and-repeat-end
  given: One call attempt is refused before connection, then a later attempt connects successfully.
  when: Maya ends the connected call and a late close callback also arrives.
  then: The refused attempt creates no started-call event; the successful call has exactly one start and one end event
    in its original chat, with stable identities after retry or reload.
skills:
- id: ordinary-skills
  given: Maya is calling about a trip and has authorized travel access.
  when: She asks OpenMates to find hotels and show relevant images.
  then: The ordinary preprocessor routes the request, the selected main model uses the normal skills, and one rich assistant
    message shows hotel cards and image groups while its prose is spoken.
ethics:
- id: truthful-voice-answer
  given: Maya is in a voice call and makes a confidently incorrect factual claim.
  when: She asks OpenMates to agree with her.
  then: The shared ethics guide a respectful correction rather than agreement, delivered conversationally; neither the
    request nor a tool result overrides the ethics.
compressed_context:
- id: shared-context
  given: Maya has a valid encrypted trip checkpoint and newer messages specifying her budget.
  when: She starts a call and asks for an alternative itinerary.
  then: The ordinary context and compression path preserves her budget and dates; no parallel voice-model context is
    created.
project_context:
- id: shared-project-access
  given: Maya asks about a private cookbook Project that is not authorized for this chat.
  when: The ordinary processing path requests access and she approves it.
  then: Only the bound request resumes with authorized documents; choosing the Project alone never grants access.
memories_and_focus:
- id: shared-memory-permission
  given: Maya asks the call to use her saved dietary preferences and cooking focus.
  when: She approves the normal memory-sharing request.
  then: The existing permission flow resumes one request, persists the accepted focus and shows memory use in normal
    chat UI.
assistant_identity:
- id: voice-message-fallback
  given: A voice assistant transcript has no Mate category.
  when: Maya reads it in chat on a phone or laptop in either theme.
  then: Its identity shows OpenMates and the OpenMates favicon instead of Assistant and a generic Mate icon.
- id: preserve-attribution
  given: The chat also contains a named Mate response, an imported provider response and another human's message.
  when: Maya reads those messages alongside the voice transcript.
  then: Each retains its original identity and appropriate icon; only the uncategorized assistant uses the brand fallback.
recording:
- id: save-mixed-call
  given: Maya's future full-mode call switches from audio to generated video and back to audio.
  when: She ends the call.
  then: One encrypted video recording covers the entire conversation; audio-only intervals show the mate portrait and
    gently animated AI icon, with both voices preserved.
- id: save-audio-only-call
  given: Maya's future full-mode call never contains video.
  when: She ends the call.
  then: One encrypted audio file contains the complete conversation; no video file is created.
replay:
- id: open-ended-call
  given: Maya's completed mixed audio/video call has finished its encrypted upload.
  when: She activates Video call ended in its originating chat.
  then: Authorized playback opens beside chat on a wide screen or fullscreen on a phone, with a playable download and
    no new inference charge.
privacy:
- id: unauthorized-call
  given: A caller lacks a valid first-party session or permitted origin.
  when: They connect to the experimental live endpoint.
  then: The connection is refused before a paid provider session opens.
- id: admission-unavailable
  given: Authoritative credit admission or the concurrent-call lock is unavailable.
  when: Maya tries to start a paid experimental call.
  then: The call is refused visibly without spending provider credit or exposing keys or private media.
first_call_privacy:
- id: new-processing-consent
  given: Maya previously accepted the Google-only notice or the version-2 Mistral-only notice.
  when: She starts a call and chooses Continue on the notice naming Mistral transcription, ElevenLabs speech
    and ordinary routed reasoning.
  then: The server confirms her version-3 profile acknowledgement before microphone capture or paid speech
    access; later sessions on her account reuse it.
- id: consent-write-failure
  given: Maya has no version-3 acknowledgement and saving it fails.
  when: She chooses Continue.
  then: The notice remains actionable, an error is shown and neither microphone capture nor a paid speech
    session starts.
transcripts:
- id: speech-survives-reload
  given: Maya asks a question by voice and Gemini responds, with user transcription arriving after the first assistant
    fragment.
  when: Both turns finish and encrypted storage is acknowledged, then Maya reloads.
  then: The question precedes its answer, each appears once as an ordinary message, and no plaintext transcript was sent
    to durable storage. Neither spoken message shows a generic Sending or processing footer.
- id: interrupt-and-continue
  given: Gemini is explaining ramen and Maya sees the response growing in chat.
  when: Maya interrupts, then ends the call and sends a typed follow-up.
  then: Queued speech stops, the interrupted response text remains visibly incomplete and encrypted, and ordinary text
    conversation can refer to it.
typed:
- id: paste-during-call
  given: Maya is in a live call in her ramen chat and pastes a recipe into its composer.
  when: She presses Send and asks OpenMates to explain it.
  then: The pasted text appears once as an encrypted user message, reaches the live model, and produces one voice response
    without a separate text inference.
- id: preserve-draft-attachment
  given: Phase 1 is active and Maya has an unsupported file attachment in the bound composer.
  when: She attempts to submit the attachment.
  then: The UI explains that file processing is unavailable in this phase and preserves her draft instead of silently
    omitting it.
audio:
- id: one-microphone-owner
  given: Maya has started a voice call.
  when: She checks the composer, mutes the call, then presses Hangup.
  then: Composer recording is unavailable during the call, mute stops microphone transmission, and Hangup releases audio
    resources and restores recording controls.
confirmation_sounds:
- id: four-confirmed-transitions
  given: Maya connects a voice call, then manually mutes and unmutes its microphone.
  when: She ends the connected call and a duplicate close callback arrives.
  then: She hears one short connected sound, a distinct muted sound, a distinct unmuted sound and one ended sound. Each
    follows its actual state change; the connection stays open while muted and assistant playback is unaffected by either
    microphone sound.
- id: silent-idle-and-unavailable-audio
  given: A connected call automatically idles after silence and later resumes; local sound playback is blocked.
  when: Maya uses the call controls, or a separate call attempt is refused before connecting.
  then: Idle and automatic resume never beep, blocked sounds do not delay controls, and the refused attempt produces
    neither a connected nor an ended confirmation. Sound resources do not remain active afterward.
background_detection:
- id: cold-first-call
  given: Maya has never used calling on this phone, so the local speech-detector assets are not cached.
  when: She starts a call and speaks while the assets download in the background.
  then: The call connects and accepts her words without waiting for the detector. Input streams normally until detection
    is ready; it then uses the same microphone and connection, and later calls can reuse the assets.
- id: detector-fails-during-call
  given: A connected call is using local speech detection.
  when: The detector fails or stops returning fresh results.
  then: The call continues with ordinary unmuted audio streaming and visible pricing. It does not claim to be idle, reopen
    the microphone, start another paid call or let a late result change a later call.
automatic_idle:
- id: quiet-pause-and-short-resume
  given: Healthy local detection is ready in Maya's unmuted call.
  when: She is silent for five seconds, then says a short Yes.
  then: Microphone uploads pause once while the connection remains open. Yes resumes uploads with its first syllable
    preserved, exactly once, followed by subsequent audio in order; idle audio is never saved on disk.
- id: manual-mute-wins
  given: The call is automatically idle and still detecting speech locally.
  when: Maya presses Mute, speaks, then ends the call.
  then: Buffered audio is discarded, speech sends no microphone input, and only an explicit Unmute could resume input.
    Hangup stops capture and detector resources; late callbacks cannot restart them.
startup_audio:
- id: speech-during-connection
  given: Maya has granted microphone permission, but the call is still connecting.
  when: She starts a short question before the provider is ready.
  then: Her question stays in a bounded local buffer until readiness, then reaches the authorized call once in capture
    order. Muting or ending before readiness discards it without transmission.
- id: slow-start-bound
  given: Microphone permission is granted, but connection setup is unusually slow.
  when: Captured startup audio reaches the allowed buffer bound.
  then: The call attempt visibly fails and clears the buffer; it never drops the beginning of the question silently,
    sends audio to an unready provider or grows memory without a bound.
call_activity:
- id: working-and-speaking-before-idle
  given: Maya's microphone uploads have automatically paused after silence, but OpenMates is preparing a response.
  when: OpenMates finishes processing, plays its queued reply and finally waits for input.
  then: The counter continues while processing is active. Once input and processing are confirmed idle it stops and fades,
    even if generated audio is still playing; the waveform follows that real playback. No credits, resume hint or working/speaking
    text occupies the strip. Speaking again resumes counting.
- id: manual-mute-is-not-automatic-idle
  given: Maya has manually muted a connected call, and OpenMates has finished its reply.
  when: She checks the call controls and speaks without pressing Unmute.
  then: The round control over the waveform shows a red microphone-off icon with an accessible Unmute label and pressed
    state. The same call remains connected and assistant playback continues. No microphone audio or background noise
    is transmitted until she explicitly unmutes; once processing is idle the counter is stopped and faded. Real speech
    cannot automatically unmute her call.
lifecycle:
- id: rollover-and-disconnect
  given: A call has saved several turns and has accrued usage.
  when: Gemini rolls over its connection, then the browser connection fails.
  then: Planned rollover retains the timer, ledger and message identities; terminal loss visibly ends capture and preserves
    transcript recovery without automatically opening another paid call.
billing:
- id: quiet-open-microphone
  given: Local speech detection is unavailable, so Maya keeps a call connected for five minutes with the unmuted microphone
    streaming, but speaks for only part of it.
  when: She stays silent between requests and checks the call's counter and billing information.
  then: Streamed silence remains billable microphone input, so the counter keeps advancing at normal opacity. The strip
    has no credit count. Charged credits follow Gemini's reported usage, including assistant output and repeated context,
    rather than a five-minute connection fee or a two-minute speech-only estimate.
- id: muted-idle-and-response
  given: Maya mutes a connected call after asking a question.
  when: Gemini finishes generating its reply and queued audio continues playing, then she unmutes.
  then: Muting pauses microphone transmission. The counter continues during processing, stops and fades when processing
    finishes even if queued audio is still playing, then resumes when uploads resume. Call information explains usage-based
    charges; idle connection time adds no separate charge.
video:
- id: share-and-generate
  given: Maya is in an audio call on her phone and is holding a fabric sample.
  when: She presses Video, grants camera permission, switches cameras and later turns the camera off.
  then: The rear camera is preferred initially; its expanded preview becomes smaller after two seconds and remains visible.
    Switching changes the shared view, and turning it off leaves voice and transcripts active.
- id: camera-refusal
  given: Maya is speaking in an audio call.
  when: She presses Video but refuses camera permission.
  then: An accessible camera error appears while the original audio call remains connected.
source_frames:
- id: fabric-search-source
  given: Maya shows a blue fabric sample during a call and asks to find it online.
  when: OpenMates saves the selected frame and starts the search, then Maya moves the camera to a different fabric.
  then: Her message retains the first fabric image, and the search card shows that same image as its input while processing
    and after completion. Hanging up and reloading preserves the image and search results.
- id: source-cannot-save
  given: Maya asks to edit a camera image, but saving the selected source frame fails.
  when: The image-dependent skill would start.
  then: That skill reports the source-save failure without using a different frame; the audio call continues.
generated_media:
- id: generated-image-stage
  given: Maya's camera is active while an image-generation skill runs.
  when: The result becomes available and she later presses the bottom-right upward-arrow button.
  then: The call expands to show the plain generated image with a top-right AI icon, while the camera keeps sharing.
    The upward arrow collapses the stage; the ordinary progress/result card remains in chat.
- id: video-and-next-result
  given: Maya is viewing generated media while another video is being generated.
  when: The next result finishes and she uses the next/previous and video playback controls.
  then: The old visual stays visible until completion, the new video starts muted once, and each output is available
    through the controls and normal saved chat embeds without replacing the transcript.
call_video_default:
- id: fast-call-video
  given: Maya asks for a short explanatory video during a call.
  when: The normal video-generation skill starts.
  then: It uses H3 Max Turbo with a five-second 480p request and disabled prompt expansion; progress is visible while
    waiting, and measured or reported duration determines the charge.
- id: call-video-failure
  given: A call-video job has been accepted, but the provider fails to deliver its clip.
  when: The job reports failure.
  then: The failure remains visible without automatically submitting another paid request or switching provider, and
    voice continues. Ordinary video generation outside calls keeps its existing default.
providers:
- id: replace-live-provider
  given: The replacement call implementation is deployed.
  when: Maya starts a call and the normal router chooses a Google reasoning model.
  then: Transcription uses Voxtral and speech uses Eleven v4 Turbo; reasoning uses the ordinary selected model.
    No Gemini Live socket, legacy calling fallback, separate voice answer broker or automatic paid speech
    retry opens.
chat_metadata:
- id: new-call-topic
  given: Maya starts a new voice chat and asks how to make vegetarian ramen.
  when: Her first substantive exchange is finalized and saved.
  then: The chat receives a ramen title and a short summary in her UI language while the call stays connected.
- id: continue-existing-chat
  given: Maya continues her trip-planning chat by voice; earlier turns established her budget and dates.
  when: She discusses another itinerary.
  then: The summary includes the call in the existing trip context, a fitting trip title stays stable, and a greeting-only
    call invents no new topic.
metadata_lifecycle:
- id: periodic-and-final
  given: Maya continues a long call after its first metadata update.
  when: New turns complete during the next minute and she then hangs up after one more finalized user utterance.
  then: Background refreshes combine new content and the dirty final utterance is included even without a completed assistant
    reply; audio never waits for metadata.
- id: recover-with-manual-title
  given: A metadata update was accepted before Maya disconnects, and she explicitly renames the chat before its result
    is applied.
  when: She reconnects after the call has ended.
  then: The accepted encrypted result is recovered without repeating inference; her manual title and any newer summary
    or transcript revision win, and normal history remains usable.
october_apple_call:
- id: native-typed-recovery-and-unsupported-watch-route
  assertion_ids:
  - video-call.chat.transcripts
  - video-call.chat.typed-input
  - video-call.lifecycle.recovery-and-billing
  - video-call.chat.fixed-binding
  given: A supported Apple call is bound to one chat with a typed draft and progressive speech, while another Watch lacks
    verified physical call networking.
  when: The user submits text, navigates to another chat, or the connection ends; the unqualified Watch user selects
    the phone control.
  then: Typed acceptance and transcript revisions retain exact encrypted identities in the original chat without second
    text inference or automatic paid reconnect; rejected typing remains recoverable, and the Watch reports unavailable
    rather than starting a simulated or silent-audio route.
interruption_intent:
- id: listener-cue
  given: The assistant is explaining a search result.
  when: Maya briefly says hmm and okay, then later says wait, use Berlin instead.
  then: The brief cues leave the response speaking; the deliberate correction interrupts, cancels stale speech and enters
    one normal revised request.
- id: stop-during-tool
  given: A call has an unfinished tool-assisted answer and queued speech.
  when: Maya clearly asks it to stop.
  then: Playback and further response work stop; late packets cannot resume it, and an action already committed is not
    undone or repeated.
spoken_rich_response:
- id: images-and-video
  given: A long normal main response is still streaming prose with three grouped images and a video preview.
  when: The assistant releases an approved city-images sentence, then a history-video sentence while Eleven
    v4 Turbo is already returning audio.
  then: Maya hears useful speech before the final response and input finish, on one continuous ordered turn
    track. Chat preserves the image group, video, links and full shared reasoning and permissions; no call
    audio history or replay file is created.
- id: conservative-heard-interruption
  given: Two immutable clauses belong to a call response; the audio track has started, but reliable clause
    timing is unavailable.
  when: Maya interrupts before the track ends, then later allows a different response with sealed membership
    to finish at the provider and native player.
  then: The interrupted response records an explicit empty heard boundary, never full completion, and late
    audio is rejected. Only the cleanly completed response marks all its sealed clauses heard; validated conservative
    timing may establish partial heard clauses when available.
localized_waiting:
- id: slow-german-mercury
  given: Maya asks a German question routed to Mercury with a slow search skill.
  when: The answer has not produced useful speech after the waiting threshold.
  then: One brief German acknowledgement in the Mate voice plays; it is cancelled if the answer is already ready and
    never talks over the useful response.
complete_turn:
- id: trailing-negation
  given: Voxtral signals a likely end while Maya is saying book the expensive option, actually do not book it.
  when: The final negation arrives in trailing transcript deltas.
  then: No booking is dispatched from the eager signal; the complete corrected request is admitted once after final-word
    collection.
migration_future_recording:
- id: future-recording
  given: A future separately approved full recording mode captures a call.
  when: The call ends.
  then: One encrypted recording contains microphone and audible assistant narration across the complete timeline; the
    present migration does not introduce recording delivery.
migration_canonical_rich_history:
- id: canonical-rich-history
  given: Maya speaks a substantive request during a call.
  when: The transcript is finalized and the ordinary response includes prose and image previews.
  then: One encrypted user turn and one canonical rich assistant response are saved; speech-only text and duplicate transcript
    events cannot overwrite or duplicate them.
migration_typed_normal_turn:
- id: typed-normal-turn
  given: Maya has a typed draft in the bound call chat.
  when: She submits it once, then a later submission fails admission.
  then: The accepted text uses ordinary processing once; the failed draft remains available for retry.
migration_one_call_player:
- id: one-call-player
  given: Maya is listening to an assistant message when she starts a call.
  when: The call begins, speaks an ordinary response, then ends.
  then: Independent playback stops, only the call response plays through the shared player, and hangup releases microphone
    and queued speech.
migration_disconnect_settlement:
- id: disconnect-settlement
  given: Maya sends microphone audio and receives a normal spoken response.
  when: The call disconnects unexpectedly.
  then: Received STT usage is settled once, completed reasoning/TTS retain their existing charges, saved chat survives
    and no new paid call starts.
migration_distinct_usage:
- id: distinct-usage
  given: Maya sends 20 seconds of microphone audio and receives an Eleven v4 Turbo response whose incremental
    text appends contain 120 then 280 exact characters for one assistant message.
  when: The 400-character synthesis completes successfully, then duplicate settlement packets arrive.
  then: The STT started-minute charge and ordinary model and skill charges settle separately. Call speech
    charges sixteen credits once for all 400 submitted characters, attributed to ElevenLabs and Eleven v4
    Turbo; appends and duplicate settlement add no separate charge, with no connected-time fee.
- id: call-failure-and-manual-speak
  given: A call response is interrupted before successful synthesis completion and its encrypted rich text
    remains after hangup.
  when: Maya later presses manual Speak for 400 characters and replays the ready file.
  then: Failed call synthesis adds no speech charge and creates no audio history. Manual Speak uses Mistral
    at 0.013 credits per character, six credits cumulatively, and its encrypted cached replay adds no generation
    or charge.
migration_camera_ordinary_input:
- id: camera-ordinary-input
  given: Maya enables her camera in a web call.
  when: She asks about the item she is showing and then disables sharing.
  then: The selected frame becomes an owner-encrypted ordinary image attachment for normal multimodal routing; no frame
    enters STT, and disabling camera preserves voice.
migration_shared_title:
- id: shared-title
  given: Maya starts a new chat by asking a substantive question in a voice call.
  when: The ordinary response finishes.
  then: The normal postprocessor supplies the title and summary without a second voice-specific metadata request.
migration_metadata_recovery:
- id: metadata-recovery
  given: An ordinary call turn has completed and metadata is still being saved.
  when: Maya hangs up and reloads.
  then: Normal encrypted recovery retains the response and applies only current metadata; there is no duplicate paid
    generation.
