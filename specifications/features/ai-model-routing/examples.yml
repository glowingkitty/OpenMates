schema_version: 1
specification: feature.ai-model-routing@8

required_instructions:
  - id: incomplete-cache-does-not-start-inference
    assertion_ids: [ai-model-routing.instructions.required-safety]
    given: A nonempty cached instruction bundle lacks ethics or mandatory privacy instructions.
    when: An initial or follow-up request is prepared for the answer model.
    then: The required bundle is reloaded and validated; if either section remains unavailable, inference does not start. Successful provider requests include the actual complete production sections.

prepared_privacy:
  - id: warm-unchanged-with-fresh-receipt
    assertion_ids: [ai-model-routing.preprocessing.prepared-privacy]
    given: The device has a correctly scoped prepared privacy snapshot and its durable aggregate generation.
    when: Send validates current authority and the same generation.
    then: The device reuses local decrypted detection options without fetching source bodies, and admission consumes a fresh expiring socket-and-turn-bound receipt once.
  - id: changed-or-uncertain-source-reloads
    assertion_ids: [ai-model-routing.preprocessing.prepared-privacy]
    given: A Memory was created, changed or deleted, settings changed, a mutation event was lost, or account, Team, key, session or connection scope changed.
    when: The device attempts to send using a prepared snapshot.
    then: A mismatch or uncertain proof prevents stale reuse and requires the complete authorized snapshot before privacy-filtered content is transmitted.
  - id: concurrent-write-cannot-certify-stale-snapshot
    assertion_ids: [ai-model-routing.preprocessing.prepared-privacy]
    given: A Memory or relevant settings write occurs concurrently with snapshot creation.
    when: The server returns a certified snapshot and generation.
    then: The returned generation covers exactly the returned consistent snapshot; missing or reset state cannot certify unchanged content.

contextual_compact_assembly:
  - id: factual-phrasing-and-followup-parity
    assertion_ids: [ai-model-routing.preprocessing.contextual-compact-assembly]
    given: Authoritative routing and context establish an ordinary factual answer without selected capabilities or active private context.
    when: The request is What is the capital of Spain?, capital of france?, or And Germany? after the previous capital discussion.
    then: The eligible compact prompt retains ethics, privacy, required behavior and the conversation needed to resolve references without optional unused format or tool guidance, and uses the configured default model and thinking policy.
  - id: uncertainty-retains-required-context
    assertion_ids: [ai-model-routing.preprocessing.contextual-compact-assembly]
    given: The request has selected tools, private context, an active Focus, learning behavior, explicit overrides or incomplete authoritative context.
    when: The latest user text is short or resembles a factual question.
    then: Short wording cannot discard required context or instructions, and the complete relevant path remains available.

tier_classification:
  - id: minimum-reasoning-depth
    assertion_ids: [ai-model-routing.tiers.conservative-three-way]
    given: Alice asks for today's Berlin weather, a comparison of two short proposals, a proof involving several interacting constraints, and a zero-downtime encrypted-data migration across incompatible clients. Separately she asks for beige striped lemon fabric matching three photos, with Shopping performing the forty-candidate visual comparison.
    when: Automatic routing evaluates the reasoning each request needs.
    then: It selects low, medium, high and max respectively; the migration qualifies for max because of sustained cross-system reasoning and exceptional correctness constraints. The delegated known-query Shopping request qualifies for low because the assistant forwards references and summarizes grounded results; substantive cross-product synthesis can qualify for medium. Exact chat and saved tier preferences retain precedence.
  - id: avoid-unnecessary-max
    given: Alice says a short summary is extremely important, or asks a difficult debugging question for which the classifier is uncertain between high and max.
    when: Automatic routing classifies her request, or receives a malformed classification.
    then: Importance alone keeps the summary at low, high-versus-max uncertainty chooses high, and malformed output uses medium instead of inventing a tier.

tier_preferences:
  - id: independent-compatible-defaults
    given: Alice has Simple on Auto, Complex on Gemini 3.7 Flash, and Most demanding on Gemini 3.7 Flash (High).
    when: She replaces the Complex preference with Claude Opus.
    then: Both medium and high requests use Claude Opus, low remains automatic, and max keeps her Most demanding choice. Existing settings and clients keep the same three saved fields.
  - id: recommendation-change-does-not-mutate
    given: Alice saved GPT-5.6 Luna for Simple requests.
    when: The recommended model changes.
    then: Her low requests still use her saved model until she changes the preference herself.

default_profiles:
  - id: automatic-tier-defaults
    assertion_ids:
      - ai-model-routing.defaults.google-tier-profiles
    given: An authenticated user leaves all three saved model preference buckets on Auto and has not selected an exact model for this chat.
    when: The preprocessor classifies requests as low, medium, high and max.
    then: Low text requests use direct Mercury 3 with low reasoning; medium and high use Gemini 3.8 Flash with MEDIUM and HIGH thinking, and max uses Gemini 4 Argon HIGH. An exact chat or matching bucket choice overrides the default without receiving its automatic reasoning level.
  - id: mercury-low-unavailable-or-ineligible
    assertion_ids: [ai-model-routing.defaults.google-tier-profiles]
    given: Alice leaves Simple requests on Auto, and a low-complexity request either contains an image or encounters an unavailable Mercury service.
    when: Routing checks the actual input and model restrictions, or Mercury provides no substantive answer or tool output within five seconds.
    then: An eligible Gemini 3.8 Flash LOW route serves the request with its actual model attribution. Metadata-only events do not keep Mercury waiting, and a response already shown to Alice is never silently restarted with duplicate text.

answer_recovery:
  - id: gemini-protocol-retry-stays-on-gemini
    assertion_ids: [ai-model-routing.recovery.affordable-current-models]
    given: Alice uses Auto for a medium request, Gemini 3.8 Flash has completed web research, and its answer contains an internal tool-result envelope.
    when: The guard suppresses that envelope and the first answer-only retry runs.
    then: Gemini 3.8 receives the verified research and already published text with tools and tool-selection instructions removed. Its successful continuation completes the same answer without repeating text or calling Mercury, Gemini 3.7 or Sonnet.
  - id: affordable-recovery-or-explicit-exhaustion
    assertion_ids: [ai-model-routing.recovery.affordable-current-models]
    given: Gemini 3.8 cannot complete its clean retry and Alice has not explicitly selected another model.
    when: Recovery checks the remaining permitted routes.
    then: Eligible text requests may use Mercury 3 LOW as the inexpensive last resort. If Mercury is disabled or the request requires an image or document, the response preserves published text and reports failure; it never removes media, retries an exhausted model, or escalates to Sonnet or Gemini 3.7. A max request may first recover from Argon through current Gemini 3.8.

catalog:
  - id: public-read-only-model-discovery
    given: {session: absent, api_key: absent}
    when: {get: [/v1/models, /v1/models/anthropic/claude-fable-5-1]}
    expect: {status: 200, model_metadata_visible: true, inference_available: false, user_or_secret_data_visible: false}
  - id: provider-recommendations-by-tier
    given: {provider: Google, visible_tiers: [simple, complex, most_demanding]}
    expect:
      recommendations:
        simple: google/gemini-3.8-flash
        complex: google/gemini-3.8-flash
        most_demanding: google/gemini-3.8-flash
      every_visible_model_has_capability: true
  - id: gemini-reasoning-variants
    given: {underlying_provider_model: gemini-3.7-flash}
    expect:
      selectable_variants:
        - {id: google/gemini-3.7-flash, display: Gemini 3.7 Flash, thinking_level: MEDIUM, capability: high}
        - {id: google/gemini-3.7-flash-high, display: Gemini 3.7 Flash (High), thinking_level: HIGH, capability: max}
      generic_reasoning_control_visible: false
  - id: unsupported-image-pricing
    given: {model_has_authoritative_image_input_price: false}
    expect: {invented_image_price_visible: false}

chat_selection:
  - id: same-user-cross-device-restore
    given: {user: alice, chat: chat-1, device_a_selection: google/gemini-3.7-flash}
    when: {open_chat_on_device_b: true}
    expect: {device_b_selection: google/gemini-3.7-flash, durable_plaintext_selection: false}
  - id: participant-isolation
    given: {chat: shared-chat, alice_selection: anthropic/claude-sonnet-5, bob_selection: auto}
    when: {alice_changes_selection: google/gemini-3.7-flash}
    expect: {bob_selection: auto}
  - id: selection-survives-send
    given: {chat_selection: google/gemini-3.7-flash, message_sent_successfully: true}
    expect: {chat_selection_after_send: google/gemini-3.7-flash}

routing:
  - id: exact-chat-model-bypasses-tier
    given: Alice selects an exact Claude model in this chat, while her saved Simple preference selects a different model.
    when: She asks a low-complexity factual question.
    then: Her exact chat choice wins, while safety and skill preprocessing still run.
  - id: auto-applies-classified-tier
    given: Alice uses Auto in the chat and has saved Gemini 3.7 Flash in her Complex preference bucket.
    when: Jev classifies a request as medium or high, or an older preprocessing fixture returns complex.
    then: The saved Complex model wins in every case; old simple and most_demanding labels similarly map to low and max without changing saved fields.

mentions:
  - id: exact-model-mention
    given: {chat_selection: auto, composer_text: '@Claude-5-Sonnet review this design'}
    when: {mention_resolved: true}
    expect: {chat_selection: anthropic/claude-sonnet-5, composer_text: review this design, selector_shows: Claude 5 Sonnet}
  - id: best-resolves-once
    given: {chat_selection: auto, composer_text: '@best solve this proof', best_model_now: google/gemini-3.7-flash-high}
    when: {mention_resolved: true}
    expect: {chat_selection: google/gemini-3.7-flash-high, persisted_alias: false, composer_contains_best_mention: false}
  - id: fast-resolves-once
    given: {chat_selection: auto, composer_text: '@fast summarize this', fast_model_now: google/gemini-3.5-flash-lite}
    expect: {chat_selection: google/gemini-3.5-flash-lite, selector_shows_exact_model: true}

unavailable:
  - id: saved-chat-model-unavailable-on-load
    given: Alice saved an exact Claude model that now has no usable route.
    when: She loads the chat.
    then: She sees a notification, the chat resets and synchronizes to Auto, and normal automatic routing resumes.
  - id: tier-default-unavailable-on-send
    given: Alice uses Auto in her chat but her saved Complex model has no usable route.
    when: She sends a medium or high request.
    then: She sees a notification, the unavailable Complex preference resets to Auto, and normal automatic fallback resumes.

settings_hierarchy:
  - id: overview-with-canonical-groups
    given: {route: settings/ai, authenticated: true}
    expect:
      canonical_heading_groups: [Default models, Models and Accounts, Settings]
      default_rows: [Simple requests, Complex requests, Most demanding requests]
      response_rows: [Followup suggestions, Quick tips]
  - id: tier-to-provider-to-model-detail
    given: {route: settings/ai/tier/simple}
    when: {open_provider: ChatGPT, open_model: GPT-5.6-Luna}
    expect:
      provider_page_context: simple
      recommendation_visible: true
      model_capabilities_visible: true
      model_detail_sections: [use_case, capability, pricing, provider_region_availability, example_chats]
  - id: response-feature-explainer
    given: {route: settings/ai, row: Quick tips}
    when: {open_row_details: true}
    expect: {explainer_visible: true, feature_visual_visible: true, toggle_state_accessible: true}

composer_layout:
  - id: regular-composer
    given: {viewport: [1440, 900], selection: auto, text: "How do I make ramen?"}
    expect: {model_control_visible: true, model_label_visible: true, camera_visible: true, audio_visible: true, send_visible: true, clipping: false}
  - id: compact-composer
    given: {viewport: [390, 844], selection: anthropic/claude-sonnet-5}
    expect: {model_icon_visible: true, model_accessible_name: Claude 5 Sonnet, model_label_may_hide: true, clipping: false}
  - id: attachment-menu
    given: {composer_focused: true}
    when: {open_attachment_menu: true}
    expect: {options: [Drawing, Location, Files], keyboard_operable: true, camera_still_direct: true, audio_still_direct: true}

preprocessing_recovery_policy:
  - id: jev-unavailable-mercury-output-recovery
    assertion_ids: [ai-model-routing.preprocessing.missing-output-recovery]
    given: Alice sends a request whose answer model is already selected, but Jev cannot complete the preprocessing decisions.
    when: Direct Mercury 3 low returns no required tool output, and Gemini 3.5 Flash-Lite returns valid routing properties within the remaining deadline.
    then: Preprocessing succeeds through Flash-Lite without retrying Mercury, inventing properties or changing Alice's selected answer model. A healthy Jev result would have skipped both generative providers.
  - id: recovery-disabled-does-not-call-lite
    assertion_ids: [ai-model-routing.preprocessing.missing-output-recovery]
    given: An output-safety scan explicitly disables retries and its Mercury attempt cannot produce the required result.
    when: The attempt fails or its deadline expires.
    then: The operation fails without calling Flash-Lite or fabricating a successful classification.

preprocessing_recovery:
  - id: missing-required-output-uses-configured-fallback
    given: {answer_model: anthropic/claude-sonnet-5, preprocessing_retries: true, deadline_remaining: true, configured_fallback: available}
    when: {primary_response: success_without_tool_calls, fallback_response: valid_required_tool_call}
    expect: {preprocessing: successful, next_configured_provider_called: true, same_primary_retry: false, answer_model: anthropic/claude-sonnet-5}
  - id: retry-disabled-missing-output-fails
    given: {preprocessing_retries: false, configured_fallback: available}
    when: {primary_response: success_without_tool_calls}
    expect: {preprocessing: failed, next_configured_provider_called: false}
  - id: missing-output-fallback-exhausted
    given: {preprocessing_retries: true, deadline_remaining: true}
    when: {all_configured_providers: success_without_tool_calls}
    expect: {preprocessing: failed, fabricated_routing_properties: false, unconfigured_provider_called: false}
  - id: missing-output-deadline-exhausted
    given: {preprocessing_retries: true, configured_fallback: available}
    when: {primary_response: success_without_tool_calls, total_deadline: exhausted}
    expect: {preprocessing: failed, next_configured_provider_called: false}

early_resolution:
  - id: slow-detail-selection
    assertion_ids: [ai-model-routing.preprocessing.early-resolution]
    given: Alice submits a request whose detailed Workflow or skill selection is slow, and she has an exact chat model override.
    when: The first decision has selected complexity, Mate, apps and relevant Projects but the detailed second decision is still pending.
    then: The exact chat model is already resolved and the selected Mate typing event has reached the client. Main inference starts only after detailed selection and all consent, safety and billing gates succeed.
  - id: later-gate-clears-early-typing
    assertion_ids: [ai-model-routing.preprocessing.early-resolution]
    given: The current turn has already announced its selected Mate before detailed processing completes.
    when: Detailed processing fails or requires a user approval.
    then: The client clears that turn's typing indicator and shows the existing failure or user gate without beginning main inference.
conditional_context:
  - id: ordinary-factual-question-with-unrelated-projects
    assertion_ids: [ai-model-routing.preprocessing.conditional-context]
    given: Alice has unrelated Projects and Tasks but no active Focus, accepted Plan or explicit dependencies in a new chat.
    when: She asks what the capital of Spain is and compact routing confidently needs no apps or additional context.
    then: She sees the selected Mate immediately after model resolution; no detailed catalogue or related-work inference delays the answer.
  - id: selected-events-capability
    assertion_ids: [ai-model-routing.preprocessing.conditional-context]
    given: Alice asks to find AI events in Berlin.
    when: Compact routing selects Events and stage two selects its search capability.
    then: The Mate appears before detailed selection, only relevant context is assembled, and the authorized events skill remains available to main processing.
warm_catalogues:
  - id: focused-preparation-with-cold-fallback
    assertion_ids: [ai-model-routing.preprocessing.warm-catalogues]
    given: Alice focuses the empty web composer, starts the TUI or begins a microphone transcript in her current account and Team.
    when: Preparation warms discovery and she sends before it completes, or changes account before the next send.
    then: No inference or draft text is sent by preparation; send reaches admission immediately, missing context loads safely, and another account cannot reuse her discovery or keys.
