schema_version: 1
id: feature.focus-modes
version: 4
status: approved
title: Focus Modes — Shared Operation and Display
summary: Shared lifecycle, full system instruction application, system history, controls, restoration and historical display
  for all focus modes.
scope:
  includes:
  - Shared focus activation, cancellation, deactivation, per-request system prompts and historical events.
  - Current-state restoration and historical rendering across supported first-party surfaces.
  - Web focus activation display, details/off interactions and active focus banner placement for all focus modes.
  - Retirement of the Welcome focus mode and its dedicated Suki mate from new selection and routing.
  - Composition with individual focus-mode specifications.
  - Project base/specialist display, Focus/phase context refresh and Project-only recommendation/background authoring lifecycle.
  - Layering of a more specific focus over an always-active Project base, its end, and precedence, detection and display of
    colliding instructions between the layers.
  - Project-owned focus activation as a necessary deterministic condition for chat file writes, and preservation of read access
    to files already shown in the chat after deactivation.
  - Learning follow-ups and phased Learn topic and Test knowledge tutoring that use learner attempts as evidence.
  excludes:
  - Exact authored focus prompt wording and conversational tactics; these belong to app instruction implementation.
  - Changes to individual focus instruction content, career guidance/disclaimer policy, or selection of remaining models and
    mates.
  - New public access to private Focus content, bypassed authentication, altered rate/credit policy, and changes to encryption
    protocol.
assertions:
- id: focus-modes.project-write-gate
  type: security
  must: Every chat-initiated Project file mutation must deterministically check that this chat currently has an active focus
    stored in the target Project. Prompt text, preprocessor recommendations, past activation events, another chat's state,
    and a matching display name cannot substitute for that active Project-bound state. The requirement applies equally to
    OpenMates-stored and remote Project files; all other write permissions and guards still apply.
  depends_on:
  - examples.project_write_gate
- id: focus-modes.project-off-read-preserved
  type: behavior
  must: After a Project focus is deactivated, new chat file-write requests to that Project are denied and its active instruction
    is excluded from subsequent system prompts. Files already shown in the chat remain readable within their existing authorized
    access; deactivation does not erase chat content or grant broader Project reads. Re-reading a historical focus event or
    displayed file cannot restore write authority.
  depends_on:
  - examples.project_off_read
- id: focus-modes.activation
  type: behavior
  must: A suggested focus activates automatically after a short visible countdown unless the user cancels it; it needs no
    acceptance. It counts as active only once that activation has really completed, never because it was discovered, an
    activation card rendered or old history shows it. Cancelling a genuinely pending request resumes without applying its
    instructions.
  depends_on:
  - examples.activation
- id: focus-modes.activation-authority
  type: invariant
  must: A focus activation pause and its continuation keep the original chat and source-turn authority. Cancelling, expiring
    or completing it releases only its own turn and never clears accepted queued follow-ups, a newer owner or a newer pause.
  depends_on:
  - examples.activation_authority
- id: focus-modes.explicit-activation
  type: behavior
  must: When the user explicitly names a focus mode, by an @focus mention or a direct request such as "turn on Deep research",
    it activates immediately with no countdown, no cancellation window and no waiting, including over an active Project base
    focus.
  depends_on:
  - examples.explicit_activation
- id: focus-modes.full-instruction
  type: invariant
  must: Every request while a focus is active includes its full global instruction. For an unphased focus this is the full
    configured instruction. A phased focus additionally includes only the current phase with its full instructions and transition
    requirements; all previous and future phases are represented by IDs and titles. A Project base remains active when a specialist
    focus adds its instructions. Activation continuations and resumed chats follow the same rule.
  depends_on:
  - examples.full_instruction
- id: focus-modes.off-instruction
  type: invariant
  must: After a focus is switched off, its focus instruction must be excluded from all subsequent inference system prompts,
    including any continuation after AI-initiated deactivation. Clear effective prompt state as well as active metadata; historical
    activation events must not reintroduce the instruction.
  depends_on:
  - examples.off_instruction
- id: focus-modes.history-events
  type: invariant
  must: Activation, deactivation and phase changes remain as persisted system history facts identifying the focus and transition
    without full instructions or private requirement evidence. A phase title links to that focus detail page. Rendering or
    opening a historical event never changes phase or restores authority.
  depends_on:
  - examples.history_events
- id: focus-modes.countdown
  type: behavior
  must: Show countdown and cancellation controls only for a positively established live pending cancellable activation in
    the current conversation. Completed, shared, example, unknown, and historical records must not start or replay a countdown
    on render, remount, or reload. Render completion alone does not establish activation completion.
  depends_on:
  - examples.countdown
- id: focus-modes.history-side-effects
  type: invariant
  must: Rendering historical focus content must not activate or reject a focus, write current chat focus metadata, or dispatch
    cancellation. Asynchronous live activation callbacks must remain bound to their originating chat and request rather than
    whichever chat is currently displayed.
  depends_on:
  - examples.history_side_effects
- id: focus-modes.controls
  type: behavior
  must: Current active focus state drives the named active banner and off control. Details show focus information without
    activating it. Deactivation by the existing banner or context-menu interaction updates current state and removes active-only
    controls; historical records remain distinguishable from a currently active focus.
  depends_on:
  - examples.controls
- id: focus-modes.restoration
  type: privacy
  must: Current focus state belongs to its chat and uses existing first-party authenticated and client-encrypted persistence/sync
    boundaries. Reopening an active chat restores its active focus for subsequent requests; reopening an off chat keeps it
    off. Reading shared/example history cannot assign active focus to another conversation. No new public endpoint or plaintext
    durable focus storage is authorized.
  depends_on:
  - examples.restoration
- id: focus-modes.banner-placement
  type: behavior
  must: On web, the active focus banner of every focus mode sits directly above the composer with no overlap, a readable
    label and usable controls on phone and laptop. Placing it does not shift unrelated incognito or IdeaBucket pills.
  depends_on:
  - examples.banner_placement
- id: focus-modes.specializations
  type: invariant
  must: Individual focus specifications coexist with and reference feature.focus-modes@1 for shared operation, prompt inclusion/exclusion,
    history, display, and interactions. They define observable focus-specific agent/product guarantees with concrete examples,
    without duplicating or weakening the shared lifecycle contract. Exact prompt wording and tactics remain in app instruction
    implementation. This shared contract does not change career guidance, disclaimer wording, or model/mate selection policies.
  depends_on:
  - examples.specializations
- id: focus-modes.retired-welcome-and-suki
  type: behavior
  must: The Welcome focus mode and its dedicated Suki mate are absent from selectable web and Apple catalogs, and signup does
    not create a Welcome chat. New requests cannot route to Suki or activate Welcome; an OpenMates platform question uses
    General Knowledge when no specialized mate applies. Existing chats that used Suki remain readable.
  depends_on:
  - examples.retirement
- id: focus-modes.phases
  type: behavior
  must: Focus text may define ordered versioned phases with stable IDs, titles, instructions and requirements. Jev evaluates
    all current requirements after an actual user response, a completed tool batch and a completed assistant response; uncertainty
    or provider failure retains the phase. All requirements must be met to automatically advance one phase; user-confirmation
    requirements depend on actual user input, never assistant or tool self-approval. An explicit user request can return to
    an earlier phase, without immediately advancing again in the same turn. Current encrypted phase state restores progress
    independently of historical rendering. Web and Apple focus details show phases and requirements; active chat chrome retains
    the existing focus display. Each focus defines its own intake and pacing, waiting for actual user answers and considering
    further research as needed. Users can skip remaining questions or ask them together; no shared question-count minimum
    is enforced.
  depends_on:
  - examples.phases
- id: focus-modes.guided-spec-authoring
  type: behavior
  must: Code Write specification uses the shared phased lifecycle in the order idea and scope, requirements, design, Specification
    and Checks, Plan and Tasks. Each turn asks at most three questions, each with a recommendation; each phase ends with a
    summary that keeps an explicit Open assumptions list and advances only after the user confirms or corrects it. One Specification
    is the default; linked product, design and technical Specifications are drafted only after the user agreed to a proposed
    split. No Plan, Task or implementation starts before the user approved the drafted Specification and its acceptance Checks;
    a request to move on is not approval, so the assistant asks plainly once. After approval the hand-off creates a Plan with
    the Plans create skill, carrying the Specification's open assumptions, and then works through sub-chats. One sub-chat per
    open assumption checks it, and after the results the Plan's Tasks are created and each Task is implemented in its own
    sub-chat. The main chat only coordinates - it summarises sub-chat results and asks the user's decisions - and does not
    check assumptions or implement Tasks itself; automatic continuation works through the open Tasks. While the focus is active,
    the Plans specification, check and create skills and the Tasks create skill stay offered on every turn unless the user
    explicitly selected other skills.
  depends_on:
  - examples.guided_spec_authoring
- id: focus-modes.learning.progress-and-suggestions
  type: behavior
  must: Study Learn topic and Test knowledge use the shared phased lifecycle with a brief goal intake, teaching or assessment,
    learner practice, a fresh independent check and review as appropriate. Progress requires learner evidence rather than
    assistant claims or merely saying I understand; skipped stages remain unassessed. Learning-mode follow-ups prefer hints,
    learner attempts and retrieval practice, never expose the answer to an unanswered exercise or bypass the teaching policy.
    Each focus controls its own intake length; there is no shared five-round intake requirement.
  depends_on:
  - examples.learning_progress
- id: focus-modes.project-specialist-composition
  type: behavior
  must: An active Project base remains effective when one specialist Focus is activated or switched. Apply both instruction
    layers, showing only the specialist as Project name | Focus name; shorten visually when space requires while retaining
    full identity. Switching specialists retains Project authority. An explicit @focus or @plan request in a chat whose
    only active focus is the Project base activates that specialist over the base; the base never silently suppresses
    it. Turning off the Project clears its specialist and future Project-only instructions/context; shared deactivation
    guards still apply.
  depends_on:
  - examples.project_specialist
- id: focus-modes.project-layering
  type: behavior
  must: In a Project chat the Project base focus stays active for the whole chat. A more specific focus, either a built-in
    focus such as Write specification or the planner, or a Focus stored in that Project, is layered on top of the base
    when the user names it or when the request uniquely matches it, for example a request for a new feature matching Write
    specification or a request matching a Project Focus such as Add a new provider. Explicit naming activates at once;
    a match uses the normal countdown proposal. Both instruction layers apply together. At most two focus modes are active
    at once, the Project base plus one specific focus on top. Activating another focus keeps the Project base, switches
    the current specific focus off and layers the new one in its place.
  depends_on:
  - examples.project_layering
- id: focus-modes.layer-end
  type: behavior
  must: When the layered focus ends, because the user switches it off or the assistant ends it once its task is done, the
    chat continues with only the Project base, with its instructions and write authority unchanged. The assistant never
    switches the Project base off on its own initiative; the base goes off only through the user's off control or when
    the user explicitly moves the conversation away from the Project, after which the shared off rules apply. Both ways
    stay available.
  depends_on:
  - examples.layer_end
- id: focus-modes.layer-precedence
  type: invariant
  must: When the instructions of a layered focus and the Project base collide, the layered focus wins within its own task
    scope (its process, phases, questions and output format). The Project base's safety rules, constraints, permissions,
    data boundaries and write gates are never overridden by a layered focus, and platform safety policy overrides both.
    Every request with two active layers states this precedence in its system prompt.
  depends_on:
  - examples.layer_precedence
- id: focus-modes.conflict-detection
  type: behavior
  must: When a Project Focus is created or updated through the Create or Update authoring job, the authoring model compares
    it with the Project base focus and lists concrete collisions, each with its topic, the winning layer under the precedence
    rule and whether it touches a Project constraint; the result shows them before Save without blocking it. When a focus
    is layered over a Project base, the first request after layering asks the answering model to check both layers for
    collisions. A missing base instruction or an unusable list reports that the check did not run; it never reports no
    collisions. Collision text stays transient or inside existing protected content.
  depends_on:
  - examples.conflict_detection
- id: focus-modes.override-note
  type: behavior
  must: When a layered focus overrides a Project base instruction, or a Project constraint keeps a layered instruction from
    applying, the first answer after layering shows one short visible note in the user's language naming the layered
    focus and each overridden or refused instruction. No note appears when there is no collision, and later answers do
    not repeat it unless the layering changes.
  depends_on:
  - examples.override_note
- id: focus-modes.context-reselection
  type: behavior
  must: After any authoritative Focus activation or active-phase change, reselect relevant permitted app skills, saved Workflows,
    Rule guides and available context before main processing continues. Use the effective instructions and current phase.
    Rejected, stale or revoked activation cannot trigger Project-private loading; unchanged-phase tool results do not add
    a phase-transition reselection. Selection never runs a Workflow or grants access.
  depends_on:
  - examples.context_reselection
- id: focus-modes.project-recommendation-catalog
  type: behavior
  must: After a completed assistant response in an authorized Project, Jev assesses chat context against the eligible Project
    Focus catalog of titles and summaries, including inactive Focuses. It may select existing IDs for full inspection or recommend
    a useful non-overlapping new Project Focus and expose Create directly. A new Project Focus is not recommended for a goal a
    built-in focus mode already serves (the assessment also receives the names and descriptions of the built-in focus modes);
    a Project-specific style for such a goal belongs in a Project Memory. An explicit user request to create a Focus is a
    reusable goal that a Memory never covers; the assistant does not save it as a Memory or Project file but points to the
    Create Focus suggestion, and the assessment recommends Create unless a catalog Focus covers it. Improvement proposals for public/app Focuses or
    personal/global Focuses outside Projects are excluded. Catalog assessment performs no generative authoring. Where the
    chat Recommendations card is shown, Project Focus Create/Update suggestions appear in it next to Memory
    recommendations (Workflow suggestions never appear in the open chat view) instead of a separate "Suggested Project improvements" block; the started job's progress and Save step
    stay in the chat history.
  depends_on:
  - examples.recommendation_catalog
- id: focus-modes.project-recommendation-full-assessment
  type: behavior
  must: For selected existing Project Focus candidates, authorized loading supplies their full instructions to a second Jev
    assessment against chat context. Show Update only when that assessment confirms a useful improvement. Unselected, inaccessible,
    unavailable, no-change or uncertain candidates cannot produce an Update recommendation. Inspecting a Focus neither activates
    it nor starts authoring.
  depends_on:
  - examples.recommendation_full
- id: focus-modes.project-authoring-click
  type: behavior
  must: Only pressing a validated Create or Update recommendation button starts the scoped background LLM authoring request.
    Provide authorized chat history and dedicated Focus creation/update instructions, plus the full target and expected revision
    for updates. Chat continues independently, and no separate regular chat is created. Repeated delivery of the same click
    starts one job. A new Focus is not implicitly activated.
  depends_on:
  - examples.authoring_click
- id: focus-modes.project-authoring-persistence
  type: privacy
  must: Background authoring validates the Focus document and current Project authority, preserves client-encrypted durable
    content, and respects existing file-write and base-revision guards. Private chat/instruction text cannot appear in plaintext
    durable job metadata or notifications. A result is ready only after saved content is reachable in the Project workspace
    and Focus embed; revocation, failure or concurrent edits cannot produce silent overwrite or false success.
  depends_on:
  - examples.authoring_persistence
- id: focus-modes.updated-followup-revision
  type: invariant
  must: The next follow-up with an updated Focus active resolves and uses its saved revision, refreshing effective instructions,
    phase compatibility and selected context. Already-running responses retain their original instruction snapshot. Cache
    entries or historical activation events cannot restore an older definition.
  depends_on:
  - examples.updated_followup
- id: focus-modes.natural-request
  type: behavior
  must: When a natural request that does not name a focus mode uniquely matches an opted-in public focus mode, propose its
    normal countdown activation before beginning the substantive answer. Simple lookups, ambiguous matches, an existing layered
    or non-Project focus, exact user skill selections and continuation or rejection turns retain their normal path; an active
    Project base alone never blocks the proposal. The proposal alone never applies focus instructions, grants
    private access or starts research child chats; those require completed activation.
  depends_on:
  - examples.natural_request
applies_to:
  rest_api:
    required: true
    role: Existing first-party authenticated inference and WebSocket paths only, retaining current rate/credit/budget limits
      and encrypted durable material; decrypted instructions are transient inference context. No new access surface.
  cli:
    required: true
    parity: semantic
    role: Verify active/off prompts and history through supported real chat commands; browser countdown and banner geometry
      are not a terminal UI requirement.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm:
        required: true
      pip:
        required: true
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
      apple:
        required: true
        role: Shared operation, prompt, history and state semantics; web banner geometry is excluded.
examples:
  file: examples.yml
  required_groups:
  - project_write_gate
  - project_off_read
  - activation
  - activation_authority
  - explicit_activation
  - full_instruction
  - off_instruction
  - history_events
  - countdown
  - history_side_effects
  - controls
  - restoration
  - banner_placement
  - specializations
  - retirement
  - learning_progress
  - guided_spec_authoring
  - project_specialist
  - project_layering
  - layer_end
  - layer_precedence
  - conflict_detection
  - override_note
  - context_reselection
  - recommendation_catalog
  - recommendation_full
  - authoring_click
  - authoring_persistence
  - updated_followup
