schema_version: 1
id: feature.focus-modes
version: 1
status: draft
title: Focus Modes — Shared Operation and Display
summary: Shared lifecycle, full system instruction application, system history, controls, restoration and historical
  display for all focus modes.
scope:
  includes:
  - Shared focus activation, cancellation, deactivation, per-request system prompts and historical events.
  - Current-state restoration and historical rendering across supported first-party surfaces.
  - Web focus activation display, details/off interactions and Career insights banner placement.
  - Retirement of the Welcome focus mode and its dedicated Suki mate from new selection and routing.
  - Composition with individual focus-mode specifications.
  - Project-owned focus activation as a necessary deterministic condition for chat file writes, and preservation
    of read access to files already shown in the chat after deactivation.
  - Learning follow-ups and phased Learn topic and Test knowledge tutoring that use learner attempts as evidence.
  excludes:
  - Exact focus prompt wording, conversational tactics, and instruction authoring; these belong to app instruction
    implementation.
  - Changes to individual focus instruction content, career guidance/disclaimer policy, or selection of remaining
    models and mates.
  - New endpoints, altered authentication, rate or credit limits, and changes to encryption protocol.
assertions:
- id: focus-modes.project-write-gate
  type: security
  must: Every chat-initiated Project file mutation must deterministically check that this chat currently has an
    active focus stored in the target Project. Prompt text, preprocessor recommendations, past activation events,
    another chat's state, and a matching display name cannot substitute for that active Project-bound state. The
    requirement applies equally to OpenMates-stored and remote Project files; all other write permissions and guards
    still apply.
  depends_on:
  - examples.project_write_gate
- id: focus-modes.project-off-read-preserved
  type: behavior
  must: After a Project focus is deactivated, new chat file-write requests to that Project are denied and its active
    instruction is excluded from subsequent system prompts. Files already shown in the chat remain readable within
    their existing authorized access; deactivation does not erase chat content or grant broader Project reads. Re-reading
    a historical focus event or displayed file cannot restore write authority.
  depends_on:
  - examples.project_off_read
- id: focus-modes.activation
  type: behavior
  must: A suggested or relevant focus is not active merely because it was discovered or an activation embed finished
    rendering. A pending activation becomes active only through its accepted activation transition; rejecting a
    genuinely pending request resumes without applying its instructions.
  depends_on:
  - examples.activation
- id: focus-modes.full-instruction
  type: invariant
  must: Every request while a focus is active includes its full global instruction. For an unphased focus this is
    the full configured instruction. A phased focus additionally includes only the current phase with its full instructions
    and transition requirements; all previous and future phases are represented by IDs and titles. A Project base
    remains active when a specialist focus adds its instructions. Activation continuations and resumed chats follow
    the same rule.
  depends_on:
  - examples.full_instruction
- id: focus-modes.off-instruction
  type: invariant
  must: After a focus is switched off, its focus instruction must be excluded from all subsequent inference system
    prompts, including any continuation after AI-initiated deactivation. Clear effective prompt state as well as
    active metadata; historical activation events must not reintroduce the instruction.
  depends_on:
  - examples.off_instruction
- id: focus-modes.history-events
  type: invariant
  must: Activation, deactivation and phase changes remain as persisted system history facts identifying the focus
    and transition without full instructions or private requirement evidence. A phase title links to that focus
    detail page. Rendering or opening a historical event never changes phase or restores authority.
  depends_on:
  - examples.history_events
- id: focus-modes.countdown
  type: behavior
  must: Show countdown and cancellation controls only for a positively established live pending cancellable activation
    in the current conversation. Completed, shared, example, unknown, and historical records must not start or replay
    a countdown on render, remount, or reload. Render completion alone does not establish activation completion.
  depends_on:
  - examples.countdown
- id: focus-modes.history-side-effects
  type: invariant
  must: Rendering historical focus content must not activate or reject a focus, write current chat focus metadata,
    or dispatch cancellation. Asynchronous live activation callbacks must remain bound to their originating chat
    and request rather than whichever chat is currently displayed.
  depends_on:
  - examples.history_side_effects
- id: focus-modes.controls
  type: behavior
  must: Current active focus state drives the named active banner and off control. Details show focus information
    without activating it. Deactivation by the existing banner or context-menu interaction updates current state
    and removes active-only controls; historical records remain distinguishable from a currently active focus.
  depends_on:
  - examples.controls
- id: focus-modes.restoration
  type: privacy
  must: Current focus state belongs to its chat and uses existing first-party authenticated and client-encrypted
    persistence/sync boundaries. Reopening an active chat restores its active focus for subsequent requests; reopening
    an off chat keeps it off. Reading shared/example history cannot assign active focus to another conversation.
    No new public endpoint or plaintext durable focus storage is authorized.
  depends_on:
  - examples.restoration
- id: focus-modes.banner-placement
  type: behavior
  must: On web, position the Career insights active banner approximately 10 CSS pixels above its pre-fix composer
    position, with readable label and usable controls and no overlap on phone and laptop. Apply the lift to the
    active focus banner without shifting unrelated incognito or IdeaBucket pills.
  depends_on:
  - examples.banner_placement
- id: focus-modes.specializations
  type: invariant
  must: Individual focus specifications coexist with and reference feature.focus-modes@1 for shared operation, prompt
    inclusion/exclusion, history, display, and interactions. They define observable focus-specific agent/product
    guarantees with concrete examples, without duplicating or weakening the shared lifecycle contract. Exact prompt
    wording and tactics remain in app instruction implementation. This shared contract does not change career guidance,
    disclaimer wording, or model/mate selection policies.
  depends_on:
  - examples.specializations
- id: focus-modes.retired-welcome-and-suki
  type: behavior
  must: The Welcome focus mode and its dedicated Suki mate are absent from selectable web and Apple catalogs, and
    signup does not create a Welcome chat. New requests cannot route to Suki or activate Welcome; an OpenMates platform
    question uses General Knowledge when no specialized mate applies. Existing chats that used Suki remain readable.
  depends_on:
  - examples.retirement
- id: focus-modes.phases
  type: behavior
  must: Focus text may define ordered versioned phases with stable IDs, titles, instructions and requirements. Jev
    evaluates all current requirements after an actual user response, a completed tool batch and a completed assistant
    response; uncertainty or provider failure retains the phase. All requirements must be met to automatically advance
    one phase; user-confirmation requirements depend on actual user input, never assistant or tool self-approval.
    An explicit user request can return to an earlier phase, without immediately advancing again in the same turn.
    Current encrypted phase state restores progress independently of historical rendering. Web and Apple focus details
    show phases and requirements; active chat chrome retains the existing focus display. Each focus defines its
    own intake and pacing, waiting for actual user answers and considering further research as needed. Users can
    skip remaining questions or ask them together; no shared question-count minimum is enforced.
  depends_on:
  - examples.phases
- id: focus-modes.learning.progress-and-suggestions
  type: behavior
  must: Study Learn topic and Test knowledge use the shared phased lifecycle with a brief goal intake, teaching
    or assessment, learner practice, a fresh independent check and review as appropriate. Progress requires learner
    evidence rather than assistant claims or merely saying I understand; skipped stages remain unassessed. Learning-mode
    follow-ups prefer hints, learner attempts and retrieval practice, never expose the answer to an unanswered exercise
    or bypass the teaching policy. Each focus controls its own intake length; there is no shared five-round intake
    requirement.
  depends_on:
  - examples.learning_progress
applies_to:
  rest_api:
    required: true
    role: Existing first-party authenticated inference and WebSocket paths only, retaining current rate/credit/budget
      limits and encrypted durable material; decrypted instructions are transient inference context. No new access
      surface.
  cli:
    required: true
    parity: semantic
    role: Verify active/off prompts and history through supported real chat commands; browser countdown/pixel geometry
      is not a terminal UI requirement.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm:
        required: true
      pip:
        required: true
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
      apple:
        required: true
        role: Shared operation, prompt, history and state semantics; web-specific 10px banner offset is excluded.
examples:
  file: examples.yml
  required_groups:
  - project_write_gate
  - project_off_read
  - activation
  - full_instruction
  - off_instruction
  - history_events
  - countdown
  - history_side_effects
  - controls
  - restoration
  - banner_placement
  - specializations
  - retirement
  - learning_progress
