schema_version: 1
specification: feature.settings-ui@1

shell_navigation:
  - id: root-to-nested-and-back
    given: {surface: web, settings_open: true, active_route: main}
    when: {open_destination: interface/language, then_return: true}
    expect: {nested_route_visible: true, parent_return_available: true, final_route: interface}
  - id: unknown-or-disabled-route-recovers
    given: {surface: web, settings_open: true, requested_route: unavailable/example}
    expect: {unusable_blank_state: false, recoverable_destination_visible: true, close_available: true}

visibility:
  - id: guest-root
    given: {authenticated: false, admin: false, self_hosted: false}
    expect: {pricing_available: true, authenticated_account_actions_visible: false, admin_server_visible: false}
  - id: authenticated-root
    given: {authenticated: true, admin: false, self_hosted: false}
    expect: {pricing_available: false, logout_available: true, quick_modes_available: true, admin_server_visible: false}
  - id: admin-root
    given: {authenticated: true, admin: true}
    expect: {admin_server_visible: true}
  - id: dynamic-destination
    given: {destination: app-or-personal-data-detail, owner_feature_visible: true}
    expect: {reachable_from_owner: true, static_root_item: false}

composition:
  - id: settings-form-states
    given: {page: any-settings-subpage}
    expect: {canonical_page_container: true, canonical_header: true, canonical_controls: true, canonical_feedback_states: true}
  - id: disabled-action
    given: {control: disabled-settings-action}
    when: {activate_by_pointer_or_keyboard: true}
    expect: {action_triggered: false, disabled_state_exposed: true}
  - id: actionable-row
    given: {control: settings-navigation-row, enabled: true}
    expect: {keyboard_operable: true, destination_identifiable: true}

localization:
  - id: traversable-catalog
    given: {surface: web, locale: supported-locale, authenticated: true}
    when: {traverse_visible_root_and_nested_settings: true}
    expect: {missing_translation_markers: false, empty_required_labels: false}
  - id: generated-locales-are-derived
    given: {translation_change: settings-label}
    expect: {authoritative_source: i18n-source-yaml, generated_locale_json_requires_regeneration: true}

footer:
  - id: web-footer-after-root-content
    given: {surface: web, active_route: main, viewport: laptop}
    expect: {gap_after_active_content_px: 50, active_controls_clickable: true, footer_overlap: false}
  - id: web-footer-after-nested-content
    given: {surface: web, active_route: interface/language, viewport: mobile}
    expect: {gap_after_active_content_px: 50, footer_reachable_by_scroll: true, footer_overlap: false}
  - id: events-links
    given: {surface: web, footer_group: events}
    expect:
      links:
        Luma: https://luma.com/openmates
        Eventbrite: https://www.eventbrite.com/o/121655417243
        Meetup: https://www.meetup.com/openmates-meetup-group/
      safe_new_context: true
      localized_labels: true
  - id: no-stale-web-version
    given: {surface: web, footer_visible: true}
    expect: {static_web_app_version_label: false}
  - id: cloud-legal-normal-use
    given: {surface: web, self_hosted: false, login_or_signup_active: false}
    when: {select_legal_link: privacy}
    expect: {legal_group_visible: true, first_party_legal_chat_opened: true}
  - id: cloud-legal-auth-flow
    given: {surface: web, self_hosted: false, login_or_signup_active: true}
    when: {select_legal_link: terms}
    expect: {external_legal_page_opened_safely: true}
  - id: self-hosted-footer
    given: {surface: web, self_hosted: true}
    expect: {legal_group_visible: false, events_group_visible: true, contact_group_visible: true}

apple_parity:
  - id: native-route-inventory
    given: {web_base_routes: current, apple_native_routes: current}
    expect: {missing_reachable_apple_routes: [], stale_apple_routes: []}
  - id: native-shell-controls
    given: {surface: apple, settings_open: true}
    expect: {forward_and_back_navigation: true, openmates_primitives: true, stock_form_or_list_shell: false, browser_fallback_for_native_operations: false}
  - id: native-footer-version-exception
    given: {surface: apple, footer_visible: true}
    expect: {installed_bundle_version_allowed: true, hardcoded_build_version_allowed: false, content_footer_separated: true}
