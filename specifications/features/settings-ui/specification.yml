schema_version: 1
id: feature.settings-ui
version: 1
status: draft
title: Settings UI
summary: >
  First-party web and Apple settings provide a localized, accessible, role-aware
  navigation shell for feature-owned configuration, using canonical OpenMates
  settings primitives and a stable informational footer.

scope:
  includes:
    - Opening, closing, deep-linking, and parent navigation within the settings shell.
    - Role-, authentication-, feature-, and hosting-aware settings route visibility.
    - Canonical settings page composition, interaction states, and accessibility semantics.
    - Localization coverage for visible settings labels, headings, controls, and footer content.
    - Semantic web and Apple parity for the settings shell and reachable base-route inventory.
    - Settings footer placement, sections, public links, legal behavior, and version-label policy.
  excludes:
    - Auth, billing, teams, notifications, privacy, data, app, mate, project, and chat operation semantics owned by their feature Specifications.
    - REST, CLI, or SDK settings command behavior that does not render the graphical settings shell.
    - Component filenames, framework state, DOM structure, test identifiers, animation timing, and visual token values.
    - Exact subpage business copy or route ordering unless another approved feature Specification requires it.

models:
  SettingsShell:
    active_route:
      type: hierarchical_route
      required: true
      constraints: {deep_linkable: true, parent_resolvable: true, unknown_route_safe: true}
    lifecycle:
      type: panel_lifecycle
      required: true
      constraints: {openable: true, closeable: true, active_route_visible: true}
    availability_context:
      type: visibility_context
      required: true
      constraints: {inputs: [authentication, role, feature_flags, hosting_mode, restricted_session]}

  SettingsNavigation:
    root_destinations:
      type: conditional_navigation
      required: true
      constraints: {only_available_destinations_visible: true, deep_link_only_routes_excluded: true}
    nested_destinations:
      type: hierarchical_navigation
      required: true
      constraints: {clear_parent_return: true, active_destination_identifiable: true}
    dynamic_destinations:
      type: owning_feature_navigation
      required: true
      constraints: {reachable_from_owner: true, excluded_from_static_root: true}

  SettingsComposition:
    page_structure:
      type: canonical_component_system
      required: true
      constraints: {shared_page_container: true, shared_headers: true, shared_controls: true, shared_feedback_states: true}
    interactions:
      type: accessible_controls
      required: true
      constraints: {keyboard_operable: true, disabled_non_actionable: true, state_programmatically_exposed: true}
    localization:
      type: translated_content
      required: true
      constraints: {visible_strings_resolved: true, missing_placeholders_forbidden: true, source_keys_authoritative: true}

  SettingsFooter:
    web_spacing_after_content:
      type: fixed_spacing
      required: true
      constraints: {pixels: 50}
    sections:
      type: ordered_groups
      required: true
      constraints: {values: [events, for_everyone, for_developers, contact, legal], legal_cloud_only: true}
    event_links:
      type: external_links
      required: true
      constraints: {labels: [Luma, Eventbrite, Meetup], localized: true, safe_new_context: true}
    web_version_label:
      type: forbidden_content
      required: true
      constraints: {static_or_stale_build_label_absent: true}
    legal_links:
      type: context_aware_links
      required: true
      constraints: {cloud_only: true, legal_chats_during_normal_use: true, external_during_login_or_signup: true}

  SettingsPlatformParity:
    base_routes:
      type: reachable_route_inventory
      required: true
      constraints: {web_source_of_truth: true, apple_reachable_equivalent: true}
    native_presentation:
      type: openmates_native_ui
      required: true
      constraints: {custom_settings_primitives: true, stock_form_or_list_shell_forbidden: true, browser_fallback_for_native_settings_forbidden: true}

assertions:
  - id: settings-ui.shell.lifecycle-and-routing
    type: behavior
    must: The settings UI opens and closes as a first-party shell, exposes the active settings destination, supports valid deep links, and resolves unknown or unavailable destinations without trapping the user in an unusable state.
    depends_on: [models.SettingsShell, examples.shell_navigation]
  - id: settings-ui.navigation.contextual-availability
    type: behavior
    must: Root and nested settings navigation expose only destinations available for the current authentication state, role, enabled features, hosting mode, and restricted-session state; deep-link-only and dynamic feature-owned destinations do not appear as static root items.
    depends_on: [models.SettingsShell, models.SettingsNavigation, examples.visibility]
  - id: settings-ui.navigation.parent-return
    type: behavior
    must: Every reachable nested settings destination provides a clear return to its logical parent or the settings root while preserving a usable active destination.
    depends_on: [models.SettingsNavigation, examples.shell_navigation]
  - id: settings-ui.composition.canonical-and-accessible
    type: behavior
    must: Settings pages use the shared OpenMates settings component system for page structure, controls, feedback, loading, empty, and error states; actionable rows and controls are keyboard operable, and disabled controls do not trigger actions.
    depends_on: [models.SettingsComposition, examples.composition]
  - id: settings-ui.localization.visible-content-resolves
    type: behavior
    must: Visible settings labels, headings, controls, and footer content resolve from authoritative localization sources without missing-key or placeholder text across traversable settings pages.
    depends_on: [models.SettingsComposition, examples.localization]
  - id: settings-ui.footer.structure-and-spacing
    type: behavior
    must: On web, the settings footer begins exactly 50 pixels after the active page content and presents localized Events, For everyone, For developers, Contact, and, on cloud deployments only, Legal groups without overlapping or intercepting active settings controls.
    depends_on: [models.SettingsFooter, examples.footer]
  - id: settings-ui.footer.events-and-version-policy
    type: behavior
    must: The Events group exposes safe external links for Luma, Eventbrite, and Meetup, and the web settings footer does not render a static or stale web-app build/version label.
    depends_on: [models.SettingsFooter, examples.footer]
  - id: settings-ui.footer.contextual-legal-navigation
    type: behavior
    must: Cloud settings expose Imprint, Privacy, and Terms; normal app use opens their first-party legal chats, login or signup opens their external legal pages safely, and self-hosted settings omit the Legal group.
    depends_on: [models.SettingsFooter, examples.footer]
  - id: settings-ui.parity.web-apple-shell
    type: parity
    must: Apple exposes reachable native equivalents for the web base settings route inventory and preserves equivalent shell navigation and canonical OpenMates presentation without stock Form/List chrome or browser fallback for native settings operations.
    depends_on: [models.SettingsPlatformParity, examples.apple_parity]

applies_to:
  rest_api:
    required: false
    role: Feature-owned APIs provide settings data and actions; this Specification owns graphical shell behavior only.
  cli:
    required: false
    role: CLI settings commands use terminal navigation and are governed by their feature or CLI Specifications.
  sdks:
    required: false
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions:
      - id: apple-installed-app-version-allowed
        implementation: apple
        reason: Apple may show the installed native app version from bundle metadata; the stale-version prohibition applies to the web footer.
        equivalent_outcome: Neither platform presents a hardcoded build value as current runtime truth.
      - id: web-footer-spacing-specific
        implementation: apple
        reason: The exact 50-pixel footer spacing belongs to the web layout; Apple uses native spacing tokens.
        equivalent_outcome: Apple visually separates active settings content from footer groups without overlap.

examples:
  file: examples.yml
  required_groups: [shell_navigation, visibility, composition, localization, footer, apple_parity]
