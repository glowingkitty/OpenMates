schema_version: 1
specification: feature.workspace-shell@5

released_navigation:
  - id: released-desktop-tabs-visible
    given: A signed-in user has Chats, Apps, Projects, Workflows, and Tasks available on desktop.
    when: The user opens the workspace header.
    then: The header offers those five workspaces and does not offer a separate Plans, Teams, or iOS tab.
  - id: mobile-navigation-equivalent
    given: The same user opens OpenMates on a narrow screen.
    when: The user opens the workspace selector.
    then: Chats, Apps, Projects, Workflows, and Tasks are selectable, and Plans remain within Tasks.

compact_picker:
  - id: coloured-workspace-picker
    given: A signed-in user opens the web app on a phone or in a narrow desktop window.
    when: They open the workspace picker in light or dark mode.
    then: The blue panel shows the Apple app's white icons and labels for the available workspaces, with a checkmark next to the active workspace.

compact_picker_dismissal:
  - id: tap-or-click-dismisses-compact-picker
    given: A user opens the compact picker on a phone or in a narrow desktop window.
    when: They tap or click a dimmed area over the sidebar or sign-up button.
    then: The picker and backdrop fade away without opening the sidebar or sign-up screen, and focus returns to the workspace picker button.
  - id: compact-picker-reduced-motion
    given: A user has reduced motion enabled.
    when: They open the compact picker and dismiss it using the backdrop.
    then: The picker opens and closes without a fade, and the workspace behind it stays in place.

start_shells:
  - id: projects-and-workflows-start-shells
    given: A signed-in user opens the Apps, Projects, or Workflows start screen.
    when: The screen finishes loading.
    then: Each shows its identity icon, Report Issue control, and bottom composer within the shared workspace shell. Projects also shows its own Daily Inspiration content; Apps and Workflows show no banner and centre their row in the freed space.
  - id: tasks-start-shell
    given: A signed-in user opens the Tasks workspace.
    when: The screen finishes loading.
    then: It shows Task and Plan content with Tasks-specific inspiration, identity icon, and bottom composer; there is no separate Plans start screen.

visual_parity:
  - id: desktop-workspaces-match-chats
    assertion_ids: [workspace-shell.start.chat-visual-parity]
    given: "Alice views Chats, Apps, Projects, Workflows and Tasks on desktop."
    when: "She switches their start screens, then opens and closes a chat detail and a Workflow."
    then: >-
      Container, inspiration, Report Issue and composer match the Chats start geometry; Apps has equal
      inline gutters. Chat and Workflow details open with the same bottom-up slide and fade, close in
      reverse, and use 320ms cubic-bezier(0.32, 0, 0.2, 1) without scale.
  - id: mobile-workspaces-match-chats
    assertion_ids: [workspace-shell.start.chat-visual-parity]
    given: "Bob views the same workspaces on a narrow screen with reduced motion enabled."
    when: "He switches start screens and opens and closes chat and Workflow details."
    then: >-
      The regions remain aligned to the mobile Chats shell with equal Apps inline gutters and each workspace
      content preserved. Chat and Workflow detail omit nonessential movement.
figma_board_controls:
  - id: tasks-desktop-controls
    given: A user opens the Tasks board on desktop.
    when: The board renders Task and Plan cards.
    then: Compact Search and tags sit beside the circular filter at the upper inline end, and no dashboard summary appears.
  - id: mobile-board-controls
    given: A user opens the Tasks board on a narrow screen.
    when: The user reaches the board controls.
    then: Search and tags are hidden, the filter remains visible, and the Kanban columns can scroll horizontally.

kanban_scroll:
  - id: tasks-board-scrolls-under-composer
    given: A Tasks board with Task and Plan cards is taller than the desktop workspace shell.
    when: The user scrolls the board.
    then: Backlog, Todo, In Progress, Blocked, and Done remain reachable beneath a mounted bottom composer.
  - id: narrow-boards-remain-horizontal-kanban
    given: A Tasks board with Task and Plan cards is wider than a phone screen.
    when: The user swipes across the board.
    then: Every Kanban status column remains reachable without replacing the board with a list.

plan_in_tasks:
  - id: plan-on-tasks-board
    given: A user has a Plan linked to several Tasks.
    when: The user opens the Tasks workspace and opens the Plan preview.
    then: The Plan appears with Tasks and opens its detail without a separate Plans workspace tab.
  - id: plan-in-project-tasks
    given: A Project links a Plan and its Tasks.
    when: The user opens that Project's Tasks tab.
    then: The linked Plan appears beside the Tasks and opens its Plan detail within the Tasks context.

available_space_cards:
  - id: short-content-area-keeps-controls-visible
    assertion_ids: [workspace-shell.start.available-space-cards]
    given: Alice opens Projects on a laptop where a tall Daily Inspiration banner leaves only a short area above the composer, then opens the signed-in Chats and Workflows start screens on the same laptop.
    when: Each continuation section appears.
    then: Projects uses the Chats-relative geometry and compact-card fit threshold, renders compact cards, and keeps its browsing controls visible between the cards and composer, without overlap or page overflow. Chats and Workflows have no banner and show large cards, with their browse actions as the last item of the row.
  - id: signed-out-start-screens-match
    assertion_ids: [workspace-shell.start.available-space-cards]
    given: Sam is signed out and opens Chats, Apps and Workflows on a phone, a tablet and a laptop.
    when: Each start screen appears.
    then: None shows a banner; each shows "Hey there", one call to action and a row of equally sized large cards with the first card centred and the browse actions at the end of the row, followed by suggestions below it.
  - id: container-change-updates-card-size
    assertion_ids: [workspace-shell.start.available-space-cards]
    given: Bob views the Projects workspace with enough content space for large cards, then narrows its container or increases the inspiration banner height.
    when: The available area can no longer fit the large-card layout.
    then: The cards become compact even if the overall browser window height stays unchanged; expanding the available area restores large cards when they fit.
