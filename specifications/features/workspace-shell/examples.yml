schema_version: 1
specification: feature.workspace-shell@3

released_navigation:
  - id: released-desktop-tabs-visible
    given: A signed-in user has Chats, Apps, Projects, Workflows, and Tasks available on desktop.
    when: The user opens the workspace header.
    then: The header offers those five workspaces and does not offer a separate Plans, Teams, or iOS tab.
  - id: mobile-navigation-equivalent
    given: The same user opens OpenMates on a narrow screen.
    when: The user opens the workspace selector.
    then: Chats, Apps, Projects, Workflows, and Tasks are selectable, and Plans remain within Tasks.

start_shells:
  - id: projects-and-workflows-start-shells
    given: A signed-in user opens the Apps, Projects, or Workflows start screen.
    when: The screen finishes loading.
    then: It shows its own Daily Inspiration content, identity icon, Report Issue control, and bottom composer within the shared workspace shell.
  - id: tasks-start-shell
    given: A signed-in user opens the Tasks workspace.
    when: The screen finishes loading.
    then: It shows Task and Plan content with Tasks-specific inspiration, identity icon, and bottom composer; there is no separate Plans start screen.

visual_parity:
  - id: desktop-workspaces-match-chats
    given: A signed-in user views Chats, Apps, Projects, Workflows, and Tasks on desktop.
    when: The user switches between their start screens.
    then: Container, inspiration, Report Issue, and composer regions keep the Chats start screen geometry while each workspace shows its own content.
  - id: mobile-workspaces-match-chats
    given: A signed-in user views the same five workspaces on a narrow screen.
    when: The user switches between their start screens.
    then: The same regions remain aligned to the mobile Chats shell without hiding each workspace's own content.

figma_board_controls:
  - id: tasks-desktop-controls
    given: A user opens the Tasks board on desktop.
    when: The board renders Task and Plan cards.
    then: Compact Search and tags sit beside the circular filter at the upper inline end, and no dashboard summary appears.
  - id: mobile-board-controls
    given: A user opens the Tasks board on a narrow screen.
    when: The user reaches the board controls.
    then: Search and tags are hidden, the filter remains visible, and the Kanban columns can scroll horizontally.

kanban_scroll:
  - id: tasks-board-scrolls-under-composer
    given: A Tasks board with Task and Plan cards is taller than the desktop workspace shell.
    when: The user scrolls the board.
    then: Backlog, Todo, In Progress, Blocked, and Done remain reachable beneath a mounted bottom composer.
  - id: narrow-boards-remain-horizontal-kanban
    given: A Tasks board with Task and Plan cards is wider than a phone screen.
    when: The user swipes across the board.
    then: Every Kanban status column remains reachable without replacing the board with a list.

plan_in_tasks:
  - id: plan-on-tasks-board
    given: A user has a Plan linked to several Tasks.
    when: The user opens the Tasks workspace and opens the Plan preview.
    then: The Plan appears with Tasks and opens its detail without a separate Plans workspace tab.
  - id: plan-in-project-tasks
    given: A Project links a Plan and its Tasks.
    when: The user opens that Project's Tasks tab.
    then: The linked Plan appears beside the Tasks and opens its Plan detail within the Tasks context.

available_space_cards:
  - id: short-content-area-keeps-controls-visible
    assertion_ids: [workspace-shell.start.available-space-cards]
    given: Alice opens Chats, Projects, and Workflows on a laptop where a tall Daily Inspiration banner leaves only a short area above the composer.
    when: Each continuation section appears.
    then: All three use compact cards and keep their browsing controls visible between the cards and composer, without overlap or page overflow.
  - id: container-change-updates-card-size
    assertion_ids: [workspace-shell.start.available-space-cards]
    given: Bob views a workspace with enough content space for large cards, then narrows its container or increases the inspiration banner height.
    when: The available area can no longer fit the large-card layout.
    then: The cards become compact even if the overall browser window height stays unchanged; expanding the available area restores large cards when they fit.
