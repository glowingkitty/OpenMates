schema_version: 1
specification: feature.chats@7
independent_metadata:
- id: delayed-header-and-suggestions
  assertion_ids: [chats.completion.independent-metadata]
  given: Authored response streaming ends and required encrypted reply persistence succeeds before postprocessor metadata arrives.
  when: The title, summary and follow-up suggestions arrive later, including while a subsequent same-chat turn is running.
  then: Active response processing has already ended and the next Send is ready; matching metadata updates the chat header and suggestions without reviving processing or replacing newer turn metadata.
- id: completion-and-navigation-fences
  assertion_ids: [chats.completion.independent-metadata]
  given: A tool cycle may continue, or the user navigates or changes account and Team before late metadata arrives.
  when: A terminal, continuation or metadata event is delivered, duplicated or delayed.
  then: Continuation remains active, terminal processing clears promptly, stale visible scope is untouched and owned listeners and transports remain bounded and are eventually released.
encryption_boundary:
- id: private-chat-durable-row
  durable_state:
    contains:
    - chat_id
    - message_id
    - role
    - status
    - encrypted_content
    - encrypted_sender_name
    forbidden:
    - plaintext_content
    - raw_chat_key
    - master_key
    - recovery_private_key
    - unwrapped_key_material
- id: sealed-recovery-job
  durable_state:
    contains:
    - job_id
    - chat_id
    - turn_id
    - assistant_message_id
    - chat_key_version
    - sealed_payload
    - lease_generation
    forbidden:
    - plaintext_content
    - raw_chat_key
    - recovery_private_key
    - master_key
identity_idempotency:
- id: same-assistant-id-replaces-provisional
  input:
    local_status: streaming
    assistant_message_id: assistant-1
    incoming_message_id: assistant-1
  expect:
    terminal_messages: 1
    duplicate_messages: 0
    final_message_id: assistant-1
- id: already-terminal-recovery-is-handled
  input:
    recovery_job_state: TERMINAL
    assistant_message_id: assistant-1
  expect:
    treated_as_handled: true
    duplicate_messages: 0
- id: confirmed-local-message-haptic-in-either-receipt-order
  assertion_ids: [chats.message.confirmed-haptic]
  given: Alice sends a saved message on a supported active Apple device in the current account, server, team and transport generation.
  when: Authoritative encrypted user-message durability is acknowledged before matching server processing admission, or matching admission arrives before the authoritative durability acknowledgement.
  then: The first receipt alone is silent. Exactly one native haptic occurs when both proofs match that locally initiated message, and duplicate receipts do not repeat the cue.
- id: unproven-replayed-and-invalidated-message-receipts-stay-silent
  assertion_ids: [chats.message.confirmed-haptic]
  given: Alice has a locally initiated message awaiting confirmation, or the client is retrying, recovering or synchronizing a message.
  when: The client only sends locally, writes to the socket, receives typing or a legacy queued-persistence acknowledgement without durability proof, receives failed or stale receipts, or receives duplicates, recovery or synchronization replay. Alternatively, account, server, team or transport generation changes before the two matching proofs arrive.
  then: These events emit no haptic; scope or generation changes invalidate the pending cue and late receipts cannot revive it. Confirmation adds no polling, inference or background network work.
recovery_takeover:
- id: secondary-client-persists-completion
  input:
    origin_disconnected: true
    eligible_secondary_device: true
    chat_key_available: true
  expect:
    encrypted_assistant_rows_written: 1
    terminal_acknowledgements: 1
    duplicate_messages: 0
- id: synced-local-row-still-acks-job
  input:
    local_status: synced
    recovery_job_available: true
    assistant_message_id: assistant-1
  expect:
    terminal_acknowledgements: 1
    duplicate_messages: 0
lease_fencing:
- id: completed-saved-followup-keeps-canonical-predecessor
  input:
    previous_turn_settled: true
    local_optimistic_messages_v: 1
    acknowledged_canonical_messages_v: 3
    event: send_saved_personal_followup
  expect:
    expected_messages_v: 3
    creation_metadata_included: false
    full_saved_history_preserved: true
    backend_immutable_metadata_guard_preserved: true
- id: completion-version-refresh-preserves-archive-capability
  assertion_ids: [chats.completion.lease-fenced, chats.message.identity-idempotent]
  input:
    local_optimistic_messages_v: 5
    authoritative_messages_v: 3
    event: completion_persist_version_conflict
  expect:
    refresh_uses_existing_archive_aware_fetch: true
    required_storage_capability_sent: agentic-storage-v2
    owner_and_team_scope_preserved: true
    credentials_preserved: true
    invalid_or_mismatched_revision_rejected: true
    original_conflict_preserved_on_refresh_failure: true
- id: delayed-claim-frame-ignored
  input:
    current_request_id: claim-2
    delayed_request_id: claim-1
    event: recovery_job_claimed
  expect:
    persist_started_from_delayed_claim: false
    current_attempt_continues: true
- id: delayed-persist-frame-ignored
  input:
    current_request_id: persist-2
    delayed_request_id: persist-1
    event: recovery_job_persisted
  expect:
    settled_from_delayed_persist: false
    current_attempt_continues: true
- id: version-conflict-refreshes-and-retries
  input:
    persist_result: version_conflict
    authoritative_messages_v: 3
  expect:
    job_retained_for_retry: true
    next_persist_uses_messages_v: 3
- id: independent-job-progress
  input:
    jobs:
    - job-blocked
    - job-available
    first_job_waiting: true
  expect:
    second_job_can_claim_and_persist: true
pending_completion:
- id: provisional-completion-accepted
  input:
    local_status: streaming
    message_id: assistant-1
    pending_completion: present
  expect:
    final_status: synced
    completion_ack_sent: true
    duplicate_messages: 0
- id: already-delivered-completion-reconciled
  input:
    local_status: delivered
    message_id: assistant-1
    pending_completion: present
  expect:
    final_status: synced
    completion_ack_sent: true
    duplicate_messages: 0
local_state_precedence:
- id: waiting-for-user-preserved
  input:
    local_status: waiting_for_user
    message_id: assistant-1
    incoming_completion: present
  expect:
    row_replaced: false
    completion_ack_sent: false
    visible_user_gate_preserved: true
- id: provisional-state-can-complete
  input:
    local_status: processing
    message_id: assistant-1
    incoming_completion: present
  expect:
    row_replaced: true
    final_status: synced
key_gated_recovery:
- id: wait-for-chat-shell-and-key
  input:
    recovery_job_available: true
    chat_shell_present: false
    chat_key_available: false
  expect:
    claim_sent_before_ready: false
    job_retryable: true
- id: hydrate-owner-before-claim
  input:
    recovery_job_available: true
    chat_shell_user_id_missing: true
    chat_key_available: true
  expect:
    owner_hydrated_before_claim: true
    claim_sent_after_ready: true
- id: cold-boot-initial-sync-wins-readiness
  input:
    recovery_job_available_early: true
    initial_sync_complete: false
  expect:
    job_dropped: false
    claim_sent_after_sync_ready: true
conversation_fork:
- id: fork-through-first-assistant-message
  input:
    source_messages:
    - user-1
    - assistant-1
    - user-2
    - assistant-2
    boundary_message_id: assistant-1
  expect:
    fork_messages:
    - user-1
    - assistant-1
    source_messages_unchanged: true
    active_chat_replaced_automatically: false
    open_action_available: true
streaming_delivery:
- id: bounded-content-coalescing
  given:
    provider_chunks_arrive_faster_than_delivery: true
  expect:
    maximum_coalescing_ms: 50
    chunk_order_preserved: true
    exact_final_content: true
    final_flush: true
- id: structural-event-flush
  given:
    pending_content: true
    next_event: tool_or_embed_or_error_or_cancellation_or_final_marker
  expect:
    pending_content_flushed_first: true
    structural_event_immediate: true
    original_order_preserved: true
streaming_presentation:
- id: successive-content-snapshots-are-visible
  given: Alice sees one assistant response as its first paragraph streams.
  when: The next content snapshot extends that paragraph and the terminal snapshot completes it.
  then: Each accepted snapshot appears in order on the same response, and the final text equals the terminal snapshot.
- id: web-accepted-thinking-container
  given: Alice’s web turn is accepted before answer, thinking text or embeds exist.
  when: First-stage routing selects Sophia, processing continues and later emits the first answer content.
  then: One transient Thinking container becomes the same response slot containing that answer; no empty assistant
    row is durably persisted.
follow_up_retention:
- id: sync-does-not-clear-accepted-follow-ups
  input:
    accepted_suggestions:
    - Question-one
    - Question-two
    incoming_message_sync_suggestions: []
  expect:
    visible_suggestions:
    - Question-one
    - Question-two
- id: later-turn-without-follow-ups-does-not-clear-accepted-follow-ups
  input:
    accepted_suggestions:
    - Question-one
    - Question-two
    later_turn_completed: true
    newer_post_processing_suggestions: []
  expect:
    visible_suggestions:
    - Question-one
    - Question-two
- id: newer-non-empty-follow-ups-replace-older-set
  input:
    accepted_suggestions:
    - Question-one
    newer_post_processing_suggestions:
    - Question-two
  expect:
    visible_suggestions:
    - Question-two
assistant_rendering:
- id: two-source-ordered-tool-cycles
  given: The assistant calls Web, writes a paragraph, calls News and writes its conclusion.
  when: The message streams, completes and is reopened after synchronization.
  then: Each adjacent skill group stays at its original position before its following paragraph; News completion
    cannot move Web or the earlier paragraph. The live and reopened documents match without remounting unaffected
    blocks.
- id: incomplete-protocol-stays-hidden
  given: Alice can already read a complete response paragraph.
  when: The stream ends temporarily inside an internal tool or embed marker.
  then: That partial protocol stays hidden and the complete paragraph remains visible.
inline_entities:
- id: embed-inline-link-opens-authored-target
  input:
    markdown: Read [the source](embed:source-ref#L10-L20).
    embed_resolved: true
  expect:
    display_text: the-source
    markdown_position_preserved: true
    target_opened: source-ref
    focus_lines:
    - 10
    - 20
- id: wiki-inline-link-opens-wiki-target
  input:
    markdown: Compare [Kyoto](wiki:Kyoto) and [Osaka](wiki:Osaka).
  expect:
    readable_links:
    - Kyoto
    - Osaka
    wiki_targets:
    - Kyoto
    - Osaka
    raw_protocol_visible: false
- id: unresolved-inline-link-keeps-readable-fallback
  input:
    markdown: Read [the source](embed:missing-ref).
    embed_resolved: false
  expect:
    display_text: the-source
    raw_protocol_visible: false
    broken_empty_control_visible: false
responsive_history:
- id: compact-phone-history
  given:
    web_viewport:
    - 390
    - 844
    chat_container_width_at_most: 500
  expect:
    assistant_identity_stacked: true
    content_max_width: 1000
    horizontal_clipping: false
    composer_obscures_latest_content: false
- id: regular-wide-history
  given:
    web_viewport:
    - 1440
    - 900
    chat_container_width_above: 500
  expect:
    assistant_identity_beside_content: true
    content_centered: true
    content_max_width: 1000
    horizontal_clipping: false
memory_only_summary:
- id: summary-expiry-keeps-old-chat-private
  assertion_ids:
  - chats.context.memory-only-summary
  given: A SocialHub response completes at 10:00 and produces a transient summary; the chat is no longer active.
  when: Another chat selects context at 10:20, then tries again after the thirty-minute window and after a cache
    restart.
  then: Only the eligible Vault-encrypted memory copy can be used at 10:20. Reads do not extend eligibility; expired/restarted
    copies stay unavailable and cannot be recovered from server-readable disk or old client-encrypted chats.
related_work_selection:
- id: relevant-cross-project-work
  assertion_ids:
  - chats.context.related-work-selection
  given: SocialHub debugging has a same-Project retry Task, a relevant shared-queue chat in another authorized Project
    that finished ten minutes ago, and unrelated active design work.
  when: Jev selects related summaries for the retry investigation.
  then: Useful retry/queue context is included with status and freshness; unrelated work is excluded. The other
    Project is not activated and its files/Tasks are not claimed.
direction_assessment:
- id: causal-discovery-versus-redesign
  assertion_ids:
  - chats.direction.context-assessment
  given: The user goal and linked Plan are to fix duplicate scheduled posts.
  when: The chat discovers a causal retry race, or creates Tasks for an unrelated dashboard redesign without user
    direction.
  then: The causal discovery can remain on track. Unrelated redesign can be material drift even if new Tasks describe
    it; no custom Check definitions are authored.
reviewed_correction:
- id: truthful-expandable-correction
  assertion_ids:
  - chats.direction.reviewed-correction
  given: Jev flags disconnected redesign work while the scheduling goal is unchanged.
  when: The LLM chooses to correct course and its internal instruction is accepted by the current chat.
  then: The exact sent notice appears and expands to the delivered instruction. If the LLM declines or delivery
    fails, no notice claims that an instruction was sent.
preview_info_top:
- id: header-across-states
  given: Alice views a shared search or historical file preview on phone and laptop.
  when: It progresses from processing to finished or error, and she expands it.
  then: Exactly one existing information bar remains above the details; status, stop and fullscreen actions stay
    visible and usable.
web_chunk_fade:
- id: appended-text-fades-with-stable-prefix
  given: Sophia's streamed response already shows a sentence and then begins a formatted paragraph with a link.
  when: More text arrives in successive chunks and the response finishes.
  then: Only newly arriving text briefly fades from transparent to fully visible. Earlier words stay visible and
    stable, the link and formatting work, copy returns the exact final text and embedded app results stay in source order.
- id: reduced-motion-stream-is-immediate
  given: Alice has enabled reduced motion and is receiving an assistant response.
  when: A new content chunk arrives.
  then: Its text immediately appears at full opacity without a fade or additional streaming delay.
web_history_entrance:
- id: existing-history-fades-once
  given: Alice opens a saved chat with existing user messages, assistant text and app results.
  when: Its history becomes available, followed by synchronization, pagination and a new streamed response.
  then: The loaded history briefly fades from transparent to fully visible once, preserving its layout and scroll.
    Later updates and composer focus do not replay that fade, and a newly sent optimistic user message appears immediately.
- id: reduced-motion-history-is-immediate
  given: Alice has enabled reduced motion and opens a saved chat.
  when: Its history loads.
  then: The history immediately appears at full opacity with its message interactions available.
immediate_admission:
- id: cold-context-does-not-delay-send
  assertion_ids: [chats.send.immediate-admission]
  given: Alice submits a personal web or TUI message while account discovery or private Project context is still loading.
  when: The network accepts her admission and later context arrives, or the device reconnects and retries the same turn.
  then: The user row appeared once and the composer cleared immediately; processing uses correlated authorized context without duplicate inference or billing and missing context cannot be mistaken for empty context.
- id: personal-memory-precedes-admission-projects-overlap
  assertion_ids: [chats.send.immediate-admission, chats.persistence.client-encrypted]
  given: Alice sends a newly prepared first Personal AI turn on a server supporting phased context while Project discovery is slow.
  when: The client obtains its fresh same-socket one-use Memory privacy snapshot and submits the encrypted turn.
  then: Admission does not wait for Project discovery; only fresh authorized Project candidates reach routing, disabled or caller-supplied stale candidates do not substitute, and failed discovery remains a failure rather than an empty catalogue.
- id: personal-routing-directory-batches-fresh-project-discovery
  assertion_ids: [chats.send.immediate-admission, chats.persistence.client-encrypted]
  given: Alice submits a newly prepared first Personal AI turn and the server advertises the batched Personal Project routing directory.
  when: Project discovery runs beside durable admission after fresh Memory privacy preparation.
  then: A single freshly authenticated owner-scoped request supplies enabled Project ciphertext and settings without a per-Project settings request chain; Team and cross-owner rows are rejected, discovery failures remain failures, and older APIs retain the established fallback.
- id: bound-context-arrives-during-admission-continuation
  assertion_ids: [chats.send.immediate-admission, chats.message.identity-idempotent]
  given: Durable admission has acknowledged and sealed the exact owner, device, chat, turn, message and request binding while broker dispatch is still finishing.
  when: Matching context-ready or context-failed frames arrive on that same authenticated socket.
  then: Existing session and scope checks accept the bound phase before dispatch finishes; unrelated frames cannot overtake the admission, buffering is bounded, and disconnect or failure preserves the durable recovery identity.
- id: atomic-first-text-reuses-sanitized-history
  assertion_ids: [chats.persistence.client-encrypted, chats.message.identity-idempotent]
  given: Locked atomic admission proves a new Personal chat contains exactly the ordinary text message that was just sanitized and saved to encrypted AI cache.
  when: The server constructs the first model history.
  then: It may reuse that sanitized text without rereading and decrypting the same row; the encrypted cache write, canonical digest, turn identity and normal attachment, embed, supplied-history and uncertain-admission paths remain intact.
main_composer_suggestion:
- id: private-next-question-after-success
  assertion_ids: [chats.followups.main-generated-composer]
  given: An eligible main response includes a useful next question in its trailing suggestion metadata, possibly split across stream chunks.
  when: The response completes successfully and Alice's client stores or synchronizes the suggestion.
  then: The visible and stored answer excludes the metadata; only the current turn can offer the separate ghost, backend durable storage contains ciphertext, and postprocessed chips remain separate.
october_apple_response:
- id: apple-authored-order-and-settled-activity
  assertion_ids: [chats.streaming.progressive-presentation, chats.rendering.assistant-document-convergence]
  given: An Apple response contains thinking, a completed search, an authored paragraph and a later running child-chat batch.
  when: The user opens the completed group's disclosure while the later batch continues, then a delayed foreign progress event arrives.
  then: The paragraph and original group positions remain stable, completed work stays settled, matching live work remains visible and foreign progress changes no batch.
- id: apple-responsive-canonical-history
  assertion_ids: [chats.rendering.preview-info-top, chats.streaming.web-chunk-fade, chats.rendering.web-history-entrance]
  given: A saved conversation is opened on an Apple phone, tablet or Mac using the current rendered web response as its reference.
  when: History appears, later text streams and the workspace width changes, including with reduced motion enabled.
  then: Canonical content, preview actions and existing paragraph identities remain usable; initial-history and new-chunk presentation do not repeatedly animate earlier content, and reduced motion shows content immediately.
