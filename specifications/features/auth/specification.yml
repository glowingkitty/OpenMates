schema_version: 1
id: feature.auth
version: 1
status: draft
title: Account Access
summary: >
  OpenMates account access lets first-party web and CLI clients create accounts,
  unlock sessions, and validate existing sessions through hashed-email lookup,
  client-wrapped account keys, anti-enumeration responses, and converged session
  finalization across password, passkey, recovery-key, and pair-login flows.

scope:
  includes:
    - Email-code signup preflight, invite and domain gates, username uniqueness, and current web and CLI signup semantics.
    - Password and passkey account creation with client-encrypted identity data and client-wrapped master keys.
    - Login lookup, password plus 2FA, backup-code, recovery-key, passkey PRF, and pair-login session completion.
    - Session cookie, WebSocket token, cache-miss recovery, stay-logged-in TTL, and re-authentication semantics.
    - First-party web, native Apple, and CLI client access boundaries for auth routes.
  excludes:
    - Destructive account reset after all credentials are lost.
    - Billing setup, credit purchase, payment method setup, and auto-top-up onboarding.
    - Provider-specific WebAuthn authenticator UX beyond PRF, challenge, origin, and relying-party semantics.
    - Public developer API-key authentication and magic-link login, which are not implemented account-access paths.
    - SDK-owned consumer signup; SDKs may use existing auth or developer credentials but do not own account creation.

models:
  SignupIdentity:
    hashed_email:
      type: base64_sha256_email
      required: true
      constraints: {server_lookup_key: true}
    encrypted_email:
      type: encrypted_string
      required: true
      constraints: {plaintext_email_persisted: forbidden}
    username:
      type: string
      required: true
      constraints: {unique_case_insensitive_hash: true, min_length: 3, max_length: 20}
    invite_code:
      type: string
      nullable: true
      constraints: {required_when_signup_mode_requires_invite: true, grants_admin: false}

  SignupStepSequence:
    password:
      type: ordered_array
      required: true
      constraints: {value: [alpha_disclaimer, basics, confirm_email, secure_account, password, completion]}
    passkey:
      type: ordered_array
      required: true
      constraints: {value: [alpha_disclaimer, basics, confirm_email, secure_account, completion]}
    self_hosted_adjustment:
      type: string
      required: true
      constraints: {value: remove_confirm_email_only_when_email_verification_not_required}
    forbidden_steps:
      type: ordered_array
      required: true
      constraints: {value: [credits, payment, auto_top_up]}

  SignupClientSurface:
    first_party_clients:
      type: ordered_array
      required: true
      constraints: {value: [web, cli]}
    sdk_signup:
      type: string
      required: true
      constraints: {value: forbidden}

  WrappedAccountKey:
    login_method:
      type: enum
      values: [password, passkey, security_key, recovery_key, pair]
      required: true
    lookup_hash:
      type: string
      required: true
      constraints: {proves_client_secret: true}
    encrypted_master_key:
      type: encrypted_blob
      nullable: true
      constraints: {server_plaintext_master_key: forbidden}
    key_iv:
      type: base64
      nullable: true
    salt:
      type: string
      nullable: true

  LoginLookupResponse:
    login_method:
      type: string
      required: true
      constraints: {generic_public_value: password}
    available_login_methods:
      type: array
      required: true
      constraints: {generic_public_value: [password, recovery_key]}
    user_email_salt:
      type: string
      required: true
      constraints: {real_for_existing_user_stable_decoy_for_missing_user: true}
    tfa_enabled:
      type: boolean
      required: true
      constraints: {generic_public_value: true}
    stay_logged_in:
      type: boolean
      required: true

  PasskeyCredential:
    credential_id:
      type: string
      required: true
      constraints: {unique: true, account_bound: true}
    rp_id:
      type: origin_host
      required: true
      constraints: {matches_request_origin: true}
    prf_enabled:
      type: boolean
      required: true
      constraints: {must_be_true_for_registration: true}
    prf_eval_first:
      type: domain_hash_salt
      required: true
      constraints: {deterministic_from_rp_id: true}

  PairLoginGrant:
    token:
      type: string
      required: true
      constraints: {length: 6, ttl_seconds: 300, single_use: true}
    encrypted_bundle:
      type: encrypted_blob
      nullable: true
      constraints: {server_plaintext_bundle: forbidden, ttl_seconds: 120}
    pin:
      type: string
      required: true
      constraints: {length: 6, max_attempts: 5}

  AuthSession:
    session_id:
      type: uuid
      required: true
      constraints: {required_for_login_and_session_validation: true}
    auth_refresh_token_cookie:
      type: httponly_cookie
      required: true
      constraints: {secure: true, same_site: lax, max_age_false_seconds: 86400, max_age_true_seconds: 2592000}
    ws_token:
      type: hmac_token
      nullable: true
      constraints: {json_response_raw_refresh_token: forbidden}
    re_auth_required:
      type: enum
      nullable: true
      values: [2fa, passkey]

assertions:
  - id: auth.signup.current-flow
    type: behavior
    must: First-party signup is available through web and CLI, not SDK-owned account creation; web signup uses the current short account-creation flow, with password signup ending after alpha disclaimer, basics, email confirmation when required, secure-account selection, password setup, and completion; passkey signup skips only the password step; self-hosted mode may remove only the email confirmation step; CLI signup creates web-compatible account material through the same auth routes and access gates; legacy credits, payment, and auto-top-up steps are not part of signup.
    depends_on: [models.SignupStepSequence, models.SignupClientSurface, examples.signup_flows, examples.signup_client_surfaces]
  - id: auth.signup.access-gates
    type: security
    must: Account creation requires the active invite-code and domain policy, rejects invalid usernames and duplicate username/email hashes, stores new users as non-admin regardless of invite-code metadata, and creates the user only after required email verification is represented by the hashed-email verification cache.
    depends_on: [models.SignupIdentity, examples.signup_access_gates]
  - id: auth.keys.client-wrapped
    type: privacy
    must: Account access stores hashed email, encrypted email, lookup hashes, salts, key IVs, WebAuthn public keys, and client-wrapped master keys only; plaintext passwords, raw master keys, PRF outputs, recovery keys, pair-login bundle plaintext, and raw refresh tokens are not persisted or returned in JSON responses.
    depends_on: [models.SignupIdentity, models.WrappedAccountKey, models.PasskeyCredential, models.PairLoginGrant, models.AuthSession, examples.crypto_boundaries]
  - id: auth.lookup.anti-enumeration
    type: security
    must: Login lookup never exposes account existence, configured login methods, or 2FA app posture; missing users receive the same generic public method shape with a stable decoy salt, existing users receive the same generic public shape with their real salt, and backend lookup outages return a visible temporary-unavailable error instead of a random salt.
    depends_on: [models.LoginLookupResponse, examples.lookup_enumeration]
  - id: auth.login.method-convergence
    type: behavior
    must: Password plus OTP, password plus backup code, recovery-key, passkey PRF, and pair-login paths all converge on the same session finalization contract; password accounts with configured OTP require a valid OTP or unused backup code, while recovery-key, passkey, and pair-login are standalone strong login methods that do not add an extra OTP challenge.
    depends_on: [models.WrappedAccountKey, models.AuthSession, examples.login_methods]
  - id: auth.login.passkey-alternative-methods
    type: behavior
    must: While a passkey login request is pending, the web login screen keeps email/password and phone/PC login controls visible; the email/password control includes its email icon, and choosing either alternative cancels the pending passkey request before switching methods.
    depends_on: [examples.login_methods]
  - id: auth.passkey.origin-prf-bound
    type: security
    must: Passkey registration and assertion challenges are bound to the request origin relying-party ID, require user verification, require or request the deterministic PRF extension, reject credentials selected for a different hashed-email account, and use the credential-specific wrapped key for account unlocking.
    depends_on: [models.PasskeyCredential, models.WrappedAccountKey, examples.passkey_flows]
  - id: auth.pair-login.single-use-zk
    type: security
    must: Pair login issues a short-lived token for the initiating device, lets an authenticated device upload only an opaque PIN-encrypted credentials bundle, limits PIN attempts, returns the bundle once to the initiating device, deletes all pair keys on success or lockout, and then completes through the normal /auth/login session path with login_method pair.
    depends_on: [models.PairLoginGrant, models.AuthSession, examples.pair_login]
  - id: auth.session.lifecycle
    type: behavior
    must: Session finalization normalizes Directus refresh cookies into OpenMates auth cookies, uses 24-hour default and 30-day stay-logged-in TTLs for cookies and cache, returns a short-lived ws_token instead of the raw refresh token in JSON, refreshes expiring tokens, and falls back from cache miss to Directus token refresh without downgrading stay-logged-in sessions.
    depends_on: [models.AuthSession, examples.session_lifecycle]
  - id: auth.session.risk-reauth
    type: security
    must: Session validation requires a client session_id, updates known-device state only after successful checks, and asks for 2FA or passkey re-authentication on new device hashes or real country changes instead of silently accepting the session.
    depends_on: [models.AuthSession, examples.session_risk]
  - id: auth.surface.first-party-boundary
    type: security
    must: >
      Auth routes remain first-party client surfaces: browser callers need an
      allowed Origin, native Apple callers without Origin need the expected
      OpenMates client headers, and CLI pair login must authenticate through
      the pair-login flow without weakening web Origin checks.
    depends_on: [examples.client_access, applies_to]

applies_to:
  rest_api:
    required: true
    role: Canonical first-party auth routes for signup, lookup, login, passkey, pair login, session, recovery-key setup, and 2FA setup.
  cli:
    required: true
    parity: semantic
    role: CLI account access supports signup plus pair login and uses the same auth route, client-wrapped key, session cookie, and ws_token semantics after /auth/login.
  sdks:
    required: false
    role: SDKs may reuse authenticated sessions or developer auth where implemented, but do not own consumer signup and cannot bypass account-access security boundaries.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true, role: preserves implemented login/session semantics; web owns the current signup UI flow}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [signup_flows, signup_client_surfaces, signup_access_gates, crypto_boundaries, lookup_enumeration, login_methods, passkey_flows, pair_login, session_lifecycle, session_risk, client_access]
