schema_version: 1
specification: feature.auth@1

signup_flows:
  - id: cloud-password-signup-current-steps
    input: {deployment: cloud, login_method: password}
    expect:
      steps: [alpha_disclaimer, basics, confirm_email, secure_account, password, completion]
      forbidden_steps: [credits, payment, auto_top_up]
  - id: cloud-passkey-signup-current-steps
    input: {deployment: cloud, login_method: passkey}
    expect:
      steps: [alpha_disclaimer, basics, confirm_email, secure_account, completion]
      forbidden_steps: [password, credits, payment, auto_top_up]
  - id: self-host-removes-email-confirmation-only
    input: {deployment: self_hosted, login_method: password, email_verification_required: false}
    expect:
      steps: [alpha_disclaimer, basics, secure_account, password, completion]
      removed_steps: [confirm_email]
      forbidden_steps: [credits, payment, auto_top_up]

signup_client_surfaces:
  - id: web-signup-supported
    input: {client: web, operation: signup}
    expect: {first_party_signup: true, uses_auth_routes: true, sdk_signup_path: false}
  - id: cli-signup-supported
    input: {client: cli, operation: signup}
    expect: {first_party_signup: true, web_compatible_crypto_material: true, uses_auth_routes: true, sdk_signup_path: false}
  - id: sdk-signup-not-owned
    input: {client: sdk, operation: signup}
    expect: {first_party_signup: false, sdk_owned_account_creation: false, use_web_or_cli_signup: true}

signup_access_gates:
  - id: invite-required-missing
    input: {signup_mode: invite_only, invite_code: null}
    expect: {account_created: false, error_code: MISSING_INVITE_CODE}
  - id: domain-allowlist-rejects-other-domain
    input: {signup_mode: domain_allowlist, email_domain: blocked.example, allowed_domains: [example.org]}
    expect: {account_created: false, message_key: signup.domain_not_allowed}
  - id: duplicate-email-uses-login-path
    input: {hashed_email_exists: true}
    expect: {account_created: false, message: This email is already registered. Please log in instead.}
  - id: first-invite-does-not-grant-admin
    input: {invite_code_valid: true, invite_code_is_admin: true}
    expect: {account_created: true, is_admin: false}
  - id: username-hash-unique
    input: {username: Test.User, hashed_username_exists: true}
    expect: {account_created: false, username_available: false}

crypto_boundaries:
  - id: password-account-storage
    durable_state:
      contains: [hashed_email, encrypted_email, user_email_salt, lookup_hash, encrypted_master_key, key_iv, salt]
      forbidden: [plaintext_password, plaintext_master_key, raw_recovery_key]
  - id: passkey-account-storage
    durable_state:
      contains: [credential_id, public_key_cose, hashed_user_id, encrypted_master_key, key_iv, salt]
      forbidden: [prf_output, plaintext_master_key, plaintext_email]
  - id: pair-login-bundle-storage
    durable_state:
      contains: [pair_token, encrypted_bundle, iv, pin_attempt_counter]
      forbidden: [lookup_hash_plaintext_from_bundle, master_key_plaintext_from_bundle]
  - id: login-json-token-boundary
    response:
      contains: [success, message, user, ws_token]
      forbidden: [raw_refresh_token]

lookup_enumeration:
  - id: missing-user-lookup-generic
    input: {hashed_email_exists: false, stay_logged_in: true}
    expect:
      login_method: password
      available_login_methods: [password, recovery_key]
      tfa_enabled: true
      stay_logged_in: true
      user_email_salt: stable_decoy
  - id: existing-user-lookup-generic
    input: {hashed_email_exists: true, configured_methods: [passkey, password], tfa_app_name: Authenticator}
    expect:
      login_method: password
      available_login_methods: [password, recovery_key]
      tfa_enabled: true
      tfa_app_name_exposed: false
      user_email_salt: real_salt
  - id: lookup-backend-error-visible
    input: {directus_lookup_error: true}
    expect: {status: 503, random_salt_returned: false, background_cache_warmup_started: false}

login_methods:
  - id: password-first-step-requires-otp-when-configured
    input: {login_method: password, tfa_enabled: true, tfa_code: null}
    expect: {success: true, tfa_required: true, session_finalized: false}
  - id: password-otp-success-finalizes-session
    input: {login_method: password, code_type: otp, otp_valid: true}
    expect: {session_finalized: true, response_message: Login successful}
  - id: password-backup-code-one-time
    input: {login_method: password, code_type: backup, backup_code_valid: true}
    expect: {session_finalized: true, backup_code_removed: true, recently_used_cache_written: true}
  - id: recovery-key-bypasses-otp
    input: {login_method: recovery_key, lookup_hash_valid: true, tfa_enabled: true}
    expect: {session_finalized: true, tfa_required: false}
  - id: invalid-recovery-key-generic
    input: {login_method: recovery_key, lookup_hash_valid: false, hashed_email_exists: false}
    expect: {success: false, message_key: login.recovery_key_wrong, account_existence_revealed: false}
  - id: accepted-method-values
    input: {login_methods: [password, passkey, security_key, recovery_key, pair]}
    expect: {schema_accepts_all: true}

passkey_flows:
  - id: registration-requires-prf
    input: {prf_enabled: false}
    expect: {registered: false, message_contains: PRF extension is required}
  - id: registration-uses-origin-rp-id
    input: {origin: https://app.dev.openmates.org}
    expect: {rp_id: app.dev.openmates.org, prf_eval_first: sha256_rp_id_first_32_bytes}
  - id: assertion-rejects-wrong-account
    input: {selected_credential_user_id: user-a, provided_hashed_email_user_id: user-b}
    expect: {success: false, message: wrong_account_passkey, session_finalized: false}
  - id: assertion-verify-then-login
    input: {passkey_signature_valid: true, lookup_hash_valid: true}
    expect: {encrypted_master_key_available_to_client: true, subsequent_login_method: passkey, session_finalized: true}

pair_login:
  - id: initiate-pair-token
    input: {client: cli, device_hint: Work laptop}
    expect: {token_length: 6, request_ttl_seconds: 300, status: waiting}
  - id: authorize-uploads-opaque-bundle
    input: {authorizing_device_authenticated: true, encrypted_bundle: present, pin: ABC123}
    expect: {status: ready, server_can_decrypt_bundle: false, bundle_ttl_seconds: 120}
  - id: invalid-pin-counts-down
    input: {attempts_before: 0, pin_matches: false}
    expect: {success: false, remaining_attempts: 4, bundle_returned: false}
  - id: correct-pin-single-use-login
    input: {pin_matches: true, bundle_decrypts_client_side: true}
    expect: {bundle_returned_once: true, pair_keys_deleted: true, subsequent_login_method: pair, stay_logged_in: true}

session_lifecycle:
  - id: default-session-ttl
    input: {stay_logged_in: false}
    expect: {cookie_max_age_seconds: 86400, cache_ttl_seconds: 86400}
  - id: extended-session-ttl
    input: {stay_logged_in: true}
    expect: {cookie_max_age_seconds: 2592000, cache_ttl_seconds: 2592000}
  - id: directus-cookie-normalized
    input: {directus_cookie_name: directus_refresh_token}
    expect: {openmates_cookie_name: auth_refresh_token, http_only: true, secure: true, same_site: lax}
  - id: cache-miss-rotates-preserves-extended-ttl
    input: {cache_user_missing: true, directus_refresh_succeeds: true, old_token_stay_logged_in: true}
    expect: {session_valid: true, browser_cookie_rotated: true, logical_session_preserved: true, session_security_state_preserved: true, stay_logged_in: true, cache_ttl_seconds: 2592000}
  - id: ws-token-not-refresh-token
    input: {session_finalized: true}
    expect: {ws_token_returned: true, raw_refresh_token_in_json: false}

session_isolation:
  - id: simultaneous-countries-remain-independent
    input:
      sessions:
        browser: {country_baseline: DE, current_country: DE, authenticated: true}
        cli: {country_baseline: FI, current_country: FI, authenticated: true}
    expect:
      browser: {authenticated: true, re_auth_required: null, country_baseline: DE}
      cli: {authenticated: true, re_auth_required: null, country_baseline: FI}
  - id: location-change-challenges-only-affected-session
    input:
      sessions:
        browser: {country_baseline: DE, current_country: DE, authenticated: true}
        cli: {country_baseline: FI, current_country: US, authenticated: true}
    expect:
      browser: {authenticated: true, re_auth_required: null, country_baseline: DE}
      cli: {authenticated: false, re_auth_required: passkey, re_auth_reason: location_change, country_baseline: FI}
  - id: targeted-session-revocation
    input: {action: revoke_session, target: cli, sibling: browser}
    expect: {cli_authenticated: false, browser_authenticated: true, account_wide_logout: false}
  - id: explicit-logout-all
    input: {action: logout_all_other_sessions, current: browser, sibling: cli}
    expect: {browser_authenticated: true, cli_authenticated: false, account_wide_action_explicit: true}
  - id: legacy-session-initializes-own-baseline
    input: {logical_session: legacy, country_baseline: null, current_country: FI, sibling_country: DE}
    expect: {re_auth_reason: null, country_baseline_after_success: FI, sibling_country_unchanged: DE}

session_risk:
  - id: session-id-required
    input: {auth_refresh_cookie_valid: true, session_id: null}
    expect: {success: false, message: Internal server error - session_id is missing}
  - id: new-device-with-otp-requires-reauth
    input: {device_hash_known: false, tfa_enabled: true}
    expect: {success: false, re_auth_required: 2fa, re_auth_reason: new_device}
  - id: new-device-with-passkey-requires-passkey
    input: {device_hash_known: false, tfa_enabled: false, passkeys_configured: true}
    expect: {success: false, re_auth_required: passkey, re_auth_reason: new_device}
  - id: country-change-requires-reauth
    input: {logical_session: browser, session_country_baseline: DE, current_country: US, tfa_enabled: true}
    expect: {success: false, re_auth_required: 2fa, re_auth_reason: location_change, affected_session: browser, sibling_sessions_affected: false}
  - id: refresh-rotation-preserves-country-baseline
    input: {logical_session: cli, refresh_token_rotated: true, country_baseline_before: FI, current_country: FI}
    expect: {logical_session_preserved: true, country_baseline_after: FI, re_auth_required: null}
  - id: location-does-not-define-device-identity
    input: {same_device_credential: true, previous_country: FI, current_country: US}
    expect: {same_device_identity: true, location_risk_evaluated_separately: true}

client_access:
  - id: allowed-web-origin
    input: {origin: https://app.dev.openmates.org, path: /v1/auth/login}
    expect: {accepted: true}
  - id: invalid-web-origin-rejected
    input: {origin: https://evil.example, path: /v1/auth/login}
    expect: {accepted: false, status: 403}
  - id: missing-origin-without-native-headers-rejected
    input: {origin: null, user_agent: OpenMates-Apple/1.0, x_openmates_client: null}
    expect: {accepted: false, status: 403}
  - id: native-ios-headers-accepted
    input: {origin: null, user_agent: OpenMates-Apple/1.0, x_openmates_client: ios}
    expect: {accepted: true}
  - id: cli-pair-login-keeps-origin-check
    input: {origin: https://app.dev.openmates.org, user_agent: OpenMates-CLI/0.1, path: /v1/auth/login}
    expect: {accepted: true, pair_login_required_for_cli_credentials: true}
