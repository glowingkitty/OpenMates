schema_version: 1
specification: feature.newsletter@1

double_opt_in:
  - id: subscribe-awaits-recipient-confirmation
    given: {email_valid: true, origin_allowed: true, already_confirmed: false}
    when: subscribe
    expect: {confirmation_message_dispatched: true, confirmed_subscription_created: false}
  - id: confirmation-activates-subscription
    given: {confirmation_token_valid: true, token_not_expired: true}
    when: confirm
    expect: {confirmed_subscription_created: true, welcome_message_dispatched: true}

unsubscribe_resubscribe:
  - id: recipient-unsubscribes-then-returns
    given: {confirmed_subscription: true, unsubscribe_token_valid: true}
    when: [unsubscribe, subscribe_again, confirm_again]
    expect: {first_subscription_removed: true, second_subscription_confirmed: true}

privacy_boundaries:
  - id: durable-subscriber-record
    given: {subscription_confirmed: true}
    expect: {hashed_email_present: true, encrypted_email_present: true, plaintext_email_present: false}
  - id: ignored-or-existing-email-is-not-enumerable
    given: {subscription_state: ignored_or_existing}
    when: subscribe
    expect: {public_response_reveals_private_state: false}
  - id: invalid-token-does-not-mutate
    given: {confirmation_or_unsubscribe_token_valid: false}
    expect: {subscription_state_changed: false}

surface_parity:
  - id: web-and-cli-use-canonical-lifecycle
    given: {surface: web_or_cli}
    expect: {canonical_rest_routes_used: true, token_semantics_preserved: true}
  - id: sdk-excludes-newsletter-management
    given: {surface: npm_or_pip_sdk}
    expect: {newsletter_management_exposed: false}
  - id: apple-subscription-settings
    given: {surface: apple}
    expect: {subscribe_and_categories_supported: true, token_link_web_handoff_allowed: true}

category_migration:
  - id: confirmed-subscriber-with-default-legacy-preferences
    given: {confirmed_subscription: true, categories: null}
    when: categories_are_normalized
    expect: {openmates_events: true, software_updates: true}
  - id: legacy-updates-opt-out-is-preserved
    given: {confirmed_subscription: true, categories: {updates_and_announcements: false}}
    when: categories_are_migrated
    expect: {openmates_events: false, software_updates: false}
  - id: explicit-new-preferences-win
    given: {categories: {updates_and_announcements: false, openmates_events: true, software_updates: false}}
    when: categories_are_normalized
    expect: {openmates_events: true, software_updates: false}
  - id: unknown-campaign-category-fails-closed
    given: {campaign_category: unrecognized_category}
    when: recipient_eligibility_is_checked
    expect: {eligible: false}
