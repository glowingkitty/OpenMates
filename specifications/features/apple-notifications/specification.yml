schema_version: 1
id: feature.apple-notifications
version: 1
status: draft
title: Apple Push Notifications
summary: >
  Apple push notifications register acknowledged APNs devices, deliver only
  privacy-safe alert content, and route open or reply actions through normal
  authenticated chat sync while preserving unread, badge, and idempotency state.

scope:
  includes:
    - iPhone, iPad, and macOS APNs permission, registration, rotation, revocation, and environment handling.
    - Generic APNs alert text and optional device-encrypted preview ciphertext.
    - Foreground, background, and terminated-state chat notification actions.
    - Inline reply persistence through the normal client-encrypted chat path.
    - Foreground duplicate suppression and per-chat unread plus application-badge coherence.
    - Provider rejection and retry behavior that never fabricates delivery success.
  excludes:
    - Web Push, email notifications, retained notification history, and SDK notification APIs.
    - Marketing notifications or server-visible private chat preview plaintext.
    - Operating-system notification center retention after OpenMates delivery.

models:
  ApplePushRegistration:
    device_id:
      type: stable_id
      required: true
      constraints: {account_scoped: true}
    token:
      type: provider_token
      required: true
      constraints: {logs: forbidden, supersedes_older_token_for_same_device: true}
    environment:
      type: enum
      values: [sandbox, production]
      required: true
    permission_state:
      type: enum
      values: [default, granted, denied]
      required: true
    acknowledged:
      type: boolean
      required: true
      constraints: {required_before_client_reports_registered: true}
    revoked:
      type: boolean
      required: true
      constraints: {true_after_logout_or_terminal_provider_rejection: true}

  ApplePushPayload:
    notification_id:
      type: stable_id
      required: true
      constraints: {idempotent: true}
    target_chat_id:
      type: chat_id
      required: true
      constraints: {authorized_target_only: true}
    alert_text:
      type: localized_safe_text
      required: true
      constraints: {chat_title_plaintext: forbidden, message_plaintext: forbidden}
    encrypted_preview:
      type: device_ciphertext
      nullable: true
      constraints: {server_plaintext_preview: forbidden, generic_fallback_on_failure: true}

  AppleNotificationAction:
    notification_id:
      type: stable_id
      required: true
    target_chat_id:
      type: chat_id
      required: true
      constraints: {authorized_target_only: true}
    action:
      type: enum
      values: [open, reply]
      required: true
    launch_state:
      type: enum
      values: [foreground, background, terminated]
      required: true
    reply_message_id:
      type: message_id
      nullable: true
      constraints: {required_for_reply: true, idempotent: true, client_encrypted_persistence: true}
    chat_unread_count_after_open:
      type: integer
      nullable: true
      constraints: {value_for_opened_chat: 0}
    app_badge_after_open:
      type: integer
      nullable: true
      constraints: {equals_remaining_total_unread: true}

assertions:
  - id: apple-notifications.registration.lifecycle
    type: behavior
    must: Apple reports push registration as active only after server acknowledgment; token rotation replaces the prior token for the same account-scoped device and environment, logout unregisters or revokes that registration, terminal APNs rejection marks it unusable, and denied, stale, or failed registrations never fabricate readiness or delivery success.
    depends_on: [models.ApplePushRegistration, examples.registration_lifecycle]
  - id: apple-notifications.payload.privacy-safe
    type: privacy
    must: APNs alert fields contain localized generic text without private chat titles or message plaintext; an optional preview is encrypted to the target device, decrypted only by the notification service extension, and falls back to generic text when absent or invalid.
    depends_on: [models.ApplePushPayload, examples.payload_privacy]
  - id: apple-notifications.action.routing-coherent
    type: behavior
    must: An authorized chat notification opened from foreground, background, or terminated state selects the target chat through normal authenticated sync and hydration; an inline reply persists at most one client-encrypted user message with a stable id in that chat; a client already visibly viewing the chat does not show duplicate system and in-app presentation; and opening the chat clears only its unread count while recomputing the application badge from remaining unread chats.
    depends_on: [models.AppleNotificationAction, examples.action_routing]
  - id: apple-notifications.delivery.idempotent-visible
    type: invariant
    must: Provider retries, duplicate worker execution, repeated notification actions, and reconnects preserve one logical Apple notification and at most one successful provider delivery or encrypted reply message, while terminal failure remains visible and retryable only where safe.
    depends_on: [models.ApplePushPayload.notification_id, models.AppleNotificationAction.reply_message_id, examples.delivery_idempotency]

applies_to:
  rest_api:
    required: true
    role: Authenticated first-party Apple registration and internal APNs dispatch own acknowledged device state, privacy-safe payloads, and provider outcomes.
  cli:
    required: false
    role: CLI does not register for or render Apple push notifications.
  sdks:
    required: false
    role: SDK notification history APIs do not own Apple APNs registration or native action behavior.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: false}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [registration_lifecycle, payload_privacy, action_routing, delivery_idempotency]
