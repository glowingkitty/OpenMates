schema_version: 1
specification: feature.apple-notifications@1

registration_lifecycle:
  - id: paired-phone-watch-targets-remain-independent
    given: {phone_device_id: phone-installation, watch_device_id: watch-installation, environment: sandbox, server_ack_received: true}
    expect: {phone_registration_active: true, watch_registration_active: true, watch_topic: org.openmates.app.watch}
  - id: acknowledged-sandbox-registration
    given: {device_id: apple-device-1, environment: sandbox, permission_state: granted, server_ack_received: true}
    expect: {registration_active: true, client_reports_registered: true}
  - id: token-rotation-supersedes-old-token
    given: {device_id: apple-device-1, environment: sandbox, old_token: token-old, new_token: token-new, server_ack_received: true}
    expect: {active_tokens_for_device_environment: [token-new], old_token_usable: false}
  - id: logout-revokes-device-registration
    given: {device_id: apple-device-1, action: logout, registration_active: true}
    expect: {registration_active: false, later_delivery_attempted: false}
  - id: terminal-provider-rejection-is-visible
    given: {device_id: apple-device-1, provider_result: bad_device_token}
    expect: {registration_active: false, delivery_state: failed, fabricated_success: false}

payload_privacy:
  - id: readable-encrypted-skill-and-response-start
    given: {first_app: web, first_skill: search, first_query: GPT6.1 Astra, additional_skill_uses: 3, inline_images: 3}
    expect: {encrypted_preview_start: "Web | Search: 'GPT6.1 Astra' & 3 other app skills", response_separator: "\n\n", inline_marker: "[3 Images]", raw_json_visible: false, internal_ids_visible: false, maximum_apns_payload_bytes: 4096}
  - id: watch-without-service-extension-keeps-generic-alert
    given: {platform: watchos, chat_title: Private chat, message_preview: Private response, service_extension_available: false}
    expect: {alert_contains_chat_title: false, alert_contains_message_preview: false, encrypted_preview_in_payload: false, generic_localized_text: true}
  - id: generic-fallback-excludes-private-content
    given: {chat_title: Private medical plan, message_preview: Private response, encrypted_preview: null}
    expect: {alert_contains_chat_title: false, alert_contains_message_preview: false, generic_localized_text: true}
  - id: encrypted-preview-decrypts-only-on-device
    given: {encrypted_preview: device-ciphertext, service_extension_key_available: true}
    expect: {server_plaintext_preview: false, device_preview_visible: true}
  - id: invalid-preview-falls-back-safely
    given: {encrypted_preview: invalid-ciphertext, service_extension_key_available: true}
    expect: {device_preview_visible: false, generic_localized_text: true, private_content_leaked: false}

action_routing:
  - id: terminated-app-tap-hydrates-target-chat
    given: {launch_state: terminated, notification_id: notif-apple-1, target_chat_id: chat-1, authorized: true}
    action: open
    expect: {selected_chat_id: chat-1, normal_sync_hydration_used: true, ciphertext_visible: false}
  - id: inline-reply-is-exactly-once
    given: {launch_state: background, notification_id: notif-apple-2, target_chat_id: chat-2, authorized: true}
    action: {type: reply, message_id: message-reply-1, retries: 2}
    expect: {durable_encrypted_user_messages: 1, stable_message_id: message-reply-1}
  - id: visible-chat-suppresses-duplicate-presentation
    given: {launch_state: foreground, target_chat_id: chat-3, visible_chat_id: chat-3}
    expect: {system_and_in_app_duplicates: 0, logical_notifications_presented: 1}
  - id: opening-chat-clears-only-target-unread
    given: {target_chat_id: chat-4, unread_by_chat: {chat-4: 2, chat-5: 3}, app_badge: 5}
    action: open
    expect: {unread_by_chat: {chat-4: 0, chat-5: 3}, app_badge: 3}

direct_reply:
  - id: expanded-message-opens-response-editor
    given: Alice is signed in on her unlocked iPhone and receives an eligible message notification for an accessible chat in her acknowledged account and workspace.
    when: She presses and holds the message notification, types a reply and presses Send.
    then: The expanded notification immediately focuses the response editor and offers only Send. Opening the editor sends nothing; pressing Send durably records her exact reply before handing it to the app, and an interrupted or repeated handoff produces at most one encrypted message in that same chat. If registration is later revoked, a reply already admitted to the app outbox still requires the same authenticated owner, server, exact workspace and accessible message before sending; revocation does not turn it into a new editor authorization.
  - id: changed-recipient-cannot-reply-to-another-scope
    given: Alice received a message notification before signing out, switching account or server, losing access to the target, or revoking that registration; alternatively the notification lacks a valid exact recipient and workspace binding.
    when: She expands the old notification or attempts to send from an editor whose binding is no longer valid.
    then: No reply is sent into the replacement account or workspace. An invalid or locked notification has no enabled reply editor, and the safe notification remains available without exposing another recipient's data. Workflow notifications do not acquire an inline reply action.

delivery_idempotency:
  - id: duplicate-provider-task-one-success
    given: {notification_id: notif-apple-5, worker_executions: 2, provider_acceptances: 1}
    expect: {logical_notifications: 1, successful_deliveries: 1}
  - id: repeated-reply-action-one-message
    given: {notification_id: notif-apple-6, reply_message_id: message-reply-2, action_deliveries: 2}
    expect: {durable_encrypted_user_messages: 1, stable_message_id: message-reply-2}
  - id: confirmed-actions-and-fresh-visible-notification
    assertion_ids: [apple-notifications.delivery.confirmed-action-haptics]
    given: Alice is using a supported active Apple device in the current account scope with native haptics enabled.
    when: A Task or Workflow creation or update is confirmed, Team creation completes, login or signup fully unlocks the account, an API key's one-time secret becomes available, or a fresh in-app notification becomes visible.
    then: Each confirmed operation provides native haptic confirmation; the newly visible notification emits exactly once for its notification identity. Native system settings apply, unsupported hardware does nothing, and OS notification vibration follows the operating system settings.
  - id: failed-stale-and-replayed-actions-stay-silent
    assertion_ids: [apple-notifications.delivery.confirmed-action-haptics]
    given: Alice has a pending Task, Workflow, Team, login, signup or API-key operation, or an in-app notification already presented once.
    when: An operation fails, its account scope becomes stale, its confirmation is duplicated or replayed, or the existing notification's content is updated or delivered again.
    then: No haptic cue is emitted for those failures, stale operations, duplicate or replayed confirmations, notification content updates or repeated notification identities.
