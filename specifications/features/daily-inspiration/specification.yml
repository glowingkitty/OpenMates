schema_version: 1
id: feature.daily-inspiration
version: 1
status: approved
title: Daily Inspiration
summary: >
  Daily Inspiration delivers a mixed daily carousel from personalized encrypted
  records, public defaults, static authenticated fallback, or logged-out guest
  onboarding while preserving source priority, privacy boundaries, and opened
  state across first-party clients.

scope:
  includes:
    - Chat-surface Daily Inspiration state, source priority, navigation, and visible fallback behavior.
    - Public default inspiration REST response semantics and fallback composition.
    - Authenticated encrypted persistence through IndexedDB, first-party REST, and WebSocket delivery.
    - Logged-out guest onboarding source isolation and exact logout restoration.
    - Static authenticated fallback content shape for local no-API recovery and slow personalized recovery.
    - Opened/viewed state handling that keeps cards visible while preferring unopened cards.
  excludes:
    - Exact LLM prompts, third-party provider ranking internals, or scheduled job timing changes.
    - Master-key derivation, chat encryption protocol design, or Directus schema migrations.
    - Guest onboarding copy, animation timing, or visual redesign.

models:
  DailyInspirationRecord:
    inspiration_id:
      type: string
      required: true
      constraints: {stable_within_set: true}
    phrase:
      type: string
      required: true
    title:
      type: string
      nullable: true
    assistant_response:
      type: string
      nullable: true
    category:
      type: string
      required: true
    content_type:
      type: enum
      required: true
      values: [video, wiki, feature]
    video:
      type: object
      nullable: true
    wiki:
      type: object
      nullable: true
    feature:
      type: object
      nullable: true
    generated_at:
      type: unix_seconds
      required: true
    follow_up_suggestions:
      type: array
      nullable: true
    surface:
      type: enum
      nullable: true
      values: [chats, projects, workflows, tasks, plans]
    is_opened:
      type: boolean
      nullable: true
    opened_chat_id:
      type: string
      nullable: true

  DailyInspirationState:
    source:
      type: enum
      values: [none, guest-onboarding, personalized, public-daily, authenticated-fallback]
      required: true
    inspirations:
      type: array
      required: true
      items: DailyInspirationRecord
    visible_count:
      type: integer
      required: true
      constraints: {minimum_authenticated: 1}
    current_index:
      type: integer
      required: true
    is_personalized:
      type: boolean
      required: true
    phase1_empty:
      type: boolean
      required: true

  AuthenticatedDailySet:
    items:
      type: daily_inspiration_array
      required: true
      constraints: {count: 10, excludes_guest_onboarding_ids: true}
    content_mix:
      type: map
      required: true
      constraints: {video: 3, wiki: 3, feature: 4}

  PublicDefaultResponse:
    route:
      type: string
      required: true
      constraints: {value: GET /v1/default-inspirations}
    auth:
      type: enum
      values: [none]
      required: true
    rate_limit:
      type: string
      required: true
      constraints: {value: 60/minute}
    lang:
      type: iso_639_1
      required: true
      constraints: {unsupported_fallback: en}
    inspirations:
      type: daily_inspiration_array
      required: true
      constraints: {max_count: 10, public_cleartext: true, excludes_guest_and_auth_only_features: true}

  EncryptedPersistenceRecord:
    daily_inspiration_id:
      type: string
      required: true
    encrypted_phrase:
      type: encrypted_blob
      required: true
    encrypted_assistant_response:
      type: encrypted_blob
      required: true
    encrypted_title:
      type: encrypted_blob
      required: true
    encrypted_category:
      type: encrypted_blob
      required: true
    encrypted_video_metadata:
      type: encrypted_json_blob
      nullable: true
    encrypted_wiki_metadata:
      type: encrypted_json_blob
      nullable: true
    encrypted_feature_metadata:
      type: encrypted_json_blob
      nullable: true
    encrypted_follow_up_suggestions:
      type: encrypted_json_blob
      nullable: true
    cleartext_metadata:
      type: object
      required: true
      constraints: {allowed_fields: [daily_inspiration_id, embed_id, generated_at, content_type, is_opened, opened_chat_id]}

  GuestOnboardingSet:
    items:
      type: ordered_daily_inspiration_array
      required: true
      constraints:
        ids:
          - openmates-intro
          - openmates-actionable-events
          - openmates-privacy-safety
          - openmates-mates-focus
          - openmates-provider-cross-platform
          - openmates-signup-cta

assertions:
  - id: daily-inspiration.authenticated-continuity
    type: behavior
    must: Authenticated web recovery writes an authenticated-compatible fallback synchronously whenever the chat-surface store is empty, guest-only, or invalid, and does not emit an empty visible set while IndexedDB, Phase 1, WebSocket, authenticated API, or public-default recovery is pending.
    depends_on: [models.DailyInspirationState, models.AuthenticatedDailySet, examples.source_transitions]
  - id: daily-inspiration.personalized-priority
    type: invariant
    must: Complete personalized records from IndexedDB, Phase 1, live WebSocket, or authenticated API outrank public daily and authenticated fallback records; public daily and authenticated fallback may replace only guest, empty, public, fallback, or invalid personalized state.
    depends_on: [models.DailyInspirationState, examples.personalized_priority]
  - id: daily-inspiration.guest-isolated
    type: invariant
    must: Guest onboarding records remain tagged as guest onboarding, restore exactly on logout, and cannot overwrite an authenticated-compatible source.
    depends_on: [models.GuestOnboardingSet, examples.guest_isolation]
  - id: daily-inspiration.authenticated-fallback-content
    type: behavior
    must: Static authenticated fallback content contains ten authenticated-safe records with a 3 video, 3 wiki, and 4 feature mix, excludes guest signup content, and uses actionable feature destinations where applicable.
    depends_on: [models.AuthenticatedDailySet, examples.fallback_sets]
  - id: daily-inspiration.public-defaults
    type: behavior
    must: The public default endpoint is unauthenticated, rate-limited, language-normalized, cached for one hour, public-cleartext only, returns no more than ten public-safe records, falls back from today's defaults to yesterday and then static wiki/public features, and targets the same 3 video, 3 wiki, 4 feature mix when inventory supports it.
    depends_on: [models.PublicDefaultResponse, examples.public_defaults]
  - id: daily-inspiration.encrypted-persistence
    type: privacy
    must: Personalized Daily Inspiration content is encrypted before IndexedDB or authenticated REST persistence; servers store opaque encrypted content plus bounded cleartext metadata, reject empty or over-ten batches, return only authenticated-user records, cap stored records at thirty, and ignore incomplete legacy sets during API recovery.
    depends_on: [models.EncryptedPersistenceRecord, examples.encrypted_persistence]
  - id: daily-inspiration.opened-state
    type: behavior
    must: Opening an inspiration keeps it visible, records opened state and optional opened chat ID locally and remotely, broadcasts the update across devices, prefers the first unopened card for default display, deduplicates viewed/opened side effects, and preserves opened/embed/current-index state across duplicate personalized deliveries.
    depends_on: [models.DailyInspirationState, examples.opened_state]

applies_to:
  rest_api:
    required: true
    role: Owns public defaults and authenticated encrypted persistence boundaries.
  cli:
    required: false
    role: CLI inspiration commands may consume daily records but do not render the web banner.
  sdks:
    required: false
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false, role: consumes daily records but is not required for web fallback continuity}

examples:
  file: examples.yml
  required_groups: [source_transitions, personalized_priority, guest_isolation, fallback_sets, public_defaults, encrypted_persistence, opened_state]
