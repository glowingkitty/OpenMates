schema_version: 1
specification: feature.daily-inspiration@3
source_transitions:
- id: authenticated-cold-boot-seeds-fallback
  given:
    source: none
    authenticated: true
    async_recovery: pending
  expect:
    immediate_source: authenticated-fallback
    visible_count: 10
    empty_visible_emission: false
- id: fallback-upgrades-to-public-or-personalized
  given:
    source: authenticated-fallback
    visible_count: 10
  actions:
  - recovery_source: IndexedDB
    incoming_source: personalized
    expect_source: personalized
  - recovery_source: public_defaults
    incoming_source: public-daily
    expect_source: public-daily
  expect:
    empty_visible_emission: false
    crossfade_when_visible_sets_differ: true
- id: guest-to-auth-seeds-fallback
  given: Sam signs in while ordinary guest inspirations are visible and personal recovery is pending.
  when: The authenticated chat surface initializes.
  then: Ten authenticated-safe fallback cards appear until public or personal records arrive, with no
    empty banner or guest overwrite.
personalized_priority:
- id: duplicate-personalized-preserves-state
  given:
    source: personalized
    current_index: 1
    opened_record: daily-2
  action: duplicate_personalized_delivery
  expect:
    source: personalized
    current_index: 1
    opened_record_preserved: true
- id: incomplete-personalized-can-fallback
  given:
    source: personalized
    valid_authenticated_set: false
  action: authenticated_fallback_available
  expect:
    source: authenticated-fallback
    valid_authenticated_set: true
- id: public-cannot-overwrite-complete-personalized
  given:
    source: personalized
    valid_authenticated_set: true
    incoming_source: public-daily
  expect:
    source: personalized
    personalized_opened_state_preserved: true
guest_isolation:
- id: guest-public-defaults-and-fallback
  given: Sam is signed out and opens a new chat.
  when: Public Daily Inspirations arrive, or the request fails.
  then: Sam sees regular public-safe inspirations as cards in the start row between the example chats;
    failure uses six static records with three videos and three wiki items. No promotional intro, signup slide or feature tip appears.
- id: guest-auth-transition
  given: Sam is viewing guest inspirations and signs in while a guest request is still pending.
  when: The late guest response arrives and Sam later signs out.
  then: The guest response does not replace authenticated inspirations; logout restores ordinary guest
    inspirations.
fallback_sets:
- id: authenticated-static-fallback-shape
  given:
    source: authenticated-fallback
  expect:
    count: 6
    content_mix:
      video: 3
      wiki: 3
    excludes_ids:
    - openmates-signup-cta
    feature_tips: none
public_defaults:
- id: public-defaults-contract
  given:
    request: GET /v1/default-inspirations?lang=unsupported
    authenticated: false
  expect:
    effective_lang: en
    rate_limit: 60/minute
    cache_ttl_seconds: 3600
    max_count: 6
    cleartext_public_content_only: true
    excludes_guest_onboarding_features: true
    excludes_feature_records: true
- id: public-defaults-fallback-order
  given:
    today_defaults: absent
    yesterday_defaults: absent
  expect:
    fallback_sources:
    - static_wiki
    deterministic_shuffle_seed: date_and_language
encrypted_persistence:
- id: indexeddb-encrypts-content
  given:
    personalized_record: present
  expect:
    encrypted_fields:
    - phrase
    - assistant_response
    - title
    - category
    - video_metadata
    - wiki_metadata
    - feature_metadata
    - follow_up_suggestions
    cleartext_metadata:
    - inspiration_id
    - embed_id
    - generated_at
    - content_type
    - is_opened
    - opened_chat_id
    local_ttl_hours: 72
- id: authenticated-api-bounds
  given:
    endpoint: /v1/daily-inspirations
    auth: session
  expect:
    post_batch_min: 1
    post_batch_max: 10
    retained_server_records_max: 30
    get_limit: 10
    incomplete_legacy_set_returns_empty: true
opened_state:
- id: opened-card-remains-visible
  given:
    source: personalized
    opened_record: daily-2
  expect:
    opened_record_visible: true
    preferred_index: first_unopened_or_zero
    opened_chat_id_preserved: true
- id: viewed-and-opened-side-effects-deduplicated
  given:
    visible_threshold: 0.5
    repeated_delivery: same_ordered_ids
  expect:
    viewed_event_sent_once_per_id: true
    opened_self_echo_ignored_when_already_opened: true
    duplicate_delivery_preserves_current_index: true
    duplicate_delivery_merges_embed_and_opened_state: true

apple_startup_offline:
- id: apple-launch-without-usable-cache
  assertion_ids: [daily-inspiration.apple-startup-offline]
  given: An authenticated Apple app has no usable inspiration cache for its current account, server and team, including when retained content has expired or belongs to another context.
  when: The user opens the welcome screen and inspirations subsequently finish loading.
  then: The banner immediately shows a noninteractive general-knowledge gradient without old personal content. Loaded inspirations appear smoothly in the same space; Reduce Motion disables the animation.
- id: apple-return-offline-with-yesterday-cache
  assertion_ids: [daily-inspiration.apple-startup-offline]
  given: The user previously loaded personalized inspirations on this device yesterday, remains in the same account, server and team, and is now offline.
  when: The user restarts the Apple app and opens its welcome screen.
  then: The gradient appears immediately while the encrypted cache unlocks, then the retained inspirations appear without needing a network connection or changing banner space. They remain available until 72 hours after generation and disappear on expiry or a context change.

start_row:
- id: start-row-returning-user
  assertion_ids: [daily-inspiration.start-row-rhythm, daily-inspiration.start-row-cards]
  given: Alex is signed in, has twelve chats and today's set holds three unopened videos and three unopened articles.
  when: Alex opens the Chats start screen on a laptop.
  then: No banner appears. The row shows ten large cards in the order chat, chat, inspiration, chat, chat,
    chat, inspiration, chat, chat, chat, then the "Show all chats" and "Search" actions as its last item;
    each inspiration card shows its image and a small "Daily inspiration" label. "Show all" opens only
    Alex's chats.
- id: start-row-signed-out
  assertion_ids: [daily-inspiration.start-row-rhythm, daily-inspiration.start-row-actions, daily-inspiration.start-row-suggestions]
  given: Sam is signed out and opens openmates.org on a tablet.
  when: The Chats start screen loads.
  then: There is no banner. "Hey there" and one short call to action sit above a row of example chats with
    inspirations interleaved, ending with "Select interests" and "Show all examples"; the next OpenMates
    event sits as one compact entry below the row, followed by three suggested prompts.
- id: start-row-suggestion-fills-composer
  assertion_ids: [daily-inspiration.start-row-suggestions]
  given: Alex is signed in and has synced new-chat suggestions.
  when: Alex taps the first suggestion below the row.
  then: The newest suggestion is placed in the composer, ready to send.
- id: start-row-new-user
  assertion_ids: [daily-inspiration.start-row-rhythm]
  given: Robin signed up a minute ago and has no chats.
  when: Robin opens the Chats start screen on a phone.
  then: The row shows the unopened inspirations as large cards, one card wide with the next one peeking.
- id: start-row-opens-inspiration
  assertion_ids: [daily-inspiration.start-row-cards]
  given: Alex sees the article card "The bridge that sings in the wind" in the row.
  when: Alex taps it.
  then: A new chat starts from that inspiration, the card counts as opened and no longer appears in the row.
- id: workflows-row-without-recommendations
  assertion_ids: [daily-inspiration.workflow-recommendation-hook]
  given: Alex has four workflows and no recommended-workflow records exist.
  when: Alex opens the Workflows start screen.
  then: No banner and no generic workflow tip appear; the row shows Alex's four workflows as large cards.
