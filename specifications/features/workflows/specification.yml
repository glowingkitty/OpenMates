schema_version: 1
id: feature.workflows
version: 4
status: approved
title: Workflows
summary: >
  OpenMates Workflows execute validated user-authored automation graphs with
  encrypted retained content, explicit lifecycle state, and fenced side effects
  through deterministic app-skill, Check, and Send message steps,
  with optional schedules and run-owned remembered deliveries.

scope:
  includes:
    - Workflow definitions, validation, runs, step tests, action lifecycle, and visible run detail.
    - Manual execution readiness, optional single-schedule activation, deterministic control flow, visible costs, and run deletion.
    - Encrypted retained Workflow inputs, outputs, pending chat delivery, and indexed run-owned delivery fingerprints.
    - Date/time recurrence, new-result filtering, selective embed creation, and deterministic chat templates.
    - Workflow send_chat_message delivery for existing or newly routed owner chats.
    - Owner-device claim, encrypted persistence, acknowledgement, retry, expiry, cancellation, and reconnect semantics for chat delivery.
  excludes:
    - General Filter nodes, advanced recurrence, and new day/week/month budget forecasts and caps (deferred beyond this delivery).
    - Non-Workflow chat sends and normal chat inference.
    - V1 AI evaluation, AI inference steps, AI authoring/editing, user-input pauses, general loops, Wait nodes, and custom code execution.
    - V1 event/chat/webhook triggers, direct project writes, cross-provider duplicate detection, and comparison with manually saved project content.
    - Separate report, push, or email action nodes; normal chat notifications remain available.
    - Automatic apartment applications and other external mutations.
    - Provider-specific app skill result semantics except as typed Workflow action outputs.
    - Team-owned Workflow chat delivery.
    - Server-side creation of normal chat keys or plaintext regular chat rows.

models:
  WorkflowActivationReadiness:
    draft_graph:
      type: incomplete_workflow_graph
      required: true
      constraints: {zero_triggers_allowed: true, maximum_automatic_triggers: 1, incomplete_graph_cannot_run: true}
    active_graph:
      type: executable_workflow_graph
      required: true
      constraints: {automatic_trigger_optional: true, maximum_automatic_triggers: 1, automatic_trigger_kind: schedule_trigger, complete_forward_graph_required: true, reachable_send_message_required: true}
    qualifying_side_effects:
      type: workflow_node_type_set
      values: [send_chat_message]
    non_qualifying_nodes:
      type: workflow_node_type_set
      values: [app_skill_action, check]

  WorkflowRun:
    run_id:
      type: stable_id
      required: true
    status:
      type: enum
      values: [accepted, running, completed, failed, cancelled]
    run_type:
      type: enum
      values: [full_run, step_test]
    version_id:
      type: stable_id
      required: true
      constraints: {immutable_for_run: true}

  WorkflowActionOutput:
    status:
      type: enum_or_string
      required: true
      constraints: {safe_plain_language: true, explicit_terminal_states: true}
    encrypted_content:
      type: vault_ciphertext
      nullable: true
      constraints: {plaintext_private_content: forbidden}

  WorkflowChatDelivery:
    delivery_id:
      type: stable_id
      required: true
    chat_id:
      type: chat_id
      required: true
    message_id:
      type: message_id
      required: true
    status:
      type: enum
      values: [delivery_pending, claimed, acknowledged, expired, cancelled, failed]
    encrypted_payload:
      type: vault_ciphertext
      required: true
      constraints: {normal_chat_ciphertext: false, plaintext: forbidden}
    claim_generation:
      type: integer
      required: true
      constraints: {monotonic: true, fencing_token: true}

  WorkflowChatPersistence:
    encrypted_chat_metadata:
      type: encrypted_object
      nullable: true
    encrypted_message:
      type: encrypted_object
      required: true
    stable_ids:
      type: object
      required: true
      constraints: {uses_delivery_chat_and_message_ids: true}

assertions:
  - id: workflows.activation.reachable-side-effect
    type: invariant
    must: A blank draft is saveable but not runnable. A complete forward graph with a reachable Send message step is runnable by its owner or an authorized assistant without an automatic trigger or enabled schedule. Enabling automatic execution additionally requires exactly one valid date/time schedule. Missing required inputs, invalid references, cycles, or a second automatic trigger prevent acceptance without creating a run or side effect; a branch may legitimately finish without sending.
    depends_on: [models.WorkflowActivationReadiness, examples.activation_readiness]
  - id: workflows.execution.lifecycle-visible
    type: behavior
    must: Each accepted run is pinned to an immutable definition version. Acceptance, step execution, side-effect dispatch, completion, failure, expiry, cancellation, and step-test outcomes remain explicit without claiming unacknowledged delivery; failed steps stop downstream execution, cancellation stops future steps, and retries preserve accepted side-effect identities.
    depends_on: [models.WorkflowRun, models.WorkflowActionOutput, examples.lifecycle]
  - id: workflows.content.encrypted-retained
    type: privacy
    must: Workflow definitions, mapped inputs, outputs, chat delivery payloads, and retained run content use Automation Vault encryption for private content; notifications and logs contain no private payload content. Duplicate lookup uses workflow-scoped keyed fingerprints rather than plaintext URLs or unkeyed URL hashes, with only necessary run, destination, status, and timing metadata retained alongside them.
    depends_on: [models.WorkflowActionOutput.encrypted_content, models.WorkflowChatDelivery.encrypted_payload, examples.encrypted_retained_content]
  - id: workflows.chat-delivery.pending-private
    type: privacy
    must: Workflow send_chat_message stores title and message content only as Automation Vault ciphertext until an owner client encrypts normal chat metadata and message rows; delivery availability and offline notifications contain no private content.
    depends_on: [models.WorkflowChatDelivery.encrypted_payload, examples.chat_delivery_private]
  - id: workflows.chat-delivery.claim-fenced
    type: invariant
    must: Only delivery_pending chat deliveries are claimed by clients, and claim, encrypted persistence, and acknowledgement compare the current token and generation so late, expired, superseded, or conflicting writes cannot create regular chat ciphertext.
    depends_on: [models.WorkflowChatDelivery.status, models.WorkflowChatDelivery.claim_generation, examples.chat_delivery_fencing]
  - id: workflows.chat-delivery.client-encrypted
    type: behavior
    must: The winning owner client uses stable delivery chat and message ids to write encrypted regular chat storage, generating a new chat key only for a new-chat delivery and using the immutable persisted chat key for existing-chat delivery.
    depends_on: [models.WorkflowChatPersistence, examples.chat_delivery_encrypted_persistence]
  - id: workflows.surface.semantic-parity
    type: parity
    must: Backend, CLI, npm SDK, Python SDK and web preserve identical manual/scheduled readiness, Check results, deterministic message templates, selected embeds, only-new-results memory, run deletion and existing encryption boundaries. Apple UI remains deferred.
    depends_on: [models, examples.surface_parity, applies_to]

  - id: workflows.mvp.steps
    type: behavior
    must: V1 authoring offers Use app skill, Check and Send message, plus an optional time/date trigger. General Filter, AI authoring/inference, code, pauses, loops, Wait and separate report/push/email actions are out of scope. Legacy definitions remain inspectable and are never silently rewritten; unsupported legacy actions require an explicit edit before new execution.
    depends_on:
    - examples.mvp_steps
  - id: workflows.schedule.recurrence
    type: behavior
    must: This delivery supports once, hourly, daily and weekly schedules with explicit IANA timezone and digital time or hourly minute. Preview and execution share the calculator. Minute intervals, calendar-month rules, windows, ordinal dates and broader recurrence are deferred.
    depends_on:
    - examples.schedule_recurrence
  - id: workflows.schedule.edge-cases
    type: behavior
    must: Calendar schedules preserve local wall time, skip nonexistent DST times, and run once for repeated local times. Automatic occurrences do not accumulate a replay backlog and overlapping execution is rejected or skipped visibly. Manual runs work while the schedule is disabled; pending delivery remains separately visible.
    depends_on:
    - examples.schedule_edges
  - id: workflows.actions.skill-contract
    type: behavior
    must: Use app skill exposes only explicitly workflow-supported, registered and runtime-verified skills with
      typed inputs/outputs, required authorization and known charging behavior. Weather, news, events and home
      search are V1 launch use cases; capability presence alone is not execution proof. Provider-specific filters
      stay in skill inputs where supported; unavailable fields are not invented, partial failure remains distinct
      from empty success, and provider output is validated untrusted data rather than executable instructions.
    depends_on:
    - examples.skill_contract
  - id: workflows.billing.skill-usage
    type: behavior
    must: Paid app skills in full Workflow runs and node Tests use the normal skill pricing, credit eligibility,
      credit deduction and usage-recording path. Billing and Usage shows each charged skill with its app and
      skill names and identifies Workflow run or Workflow test; the remaining balance updates through the
      normal account sync. Node and run credit totals reflect accepted charges rather than reporting zero. Insufficient credits prevent paid work and stop downstream execution. Repeated
      delivery or retry of the same accepted skill charge does not debit it twice. Deterministic checks,
      message Preview and chat-delivery acknowledgement do not introduce an additional provider charge.
      Billing attribution stores no plaintext Workflow titles, inputs, outputs or message contents. Existing
      prices and free-skill policies remain authoritative; fixing the charging bypass does not back-charge
      old unbilled executions.
    depends_on:
    - examples.skill_billing
  - id: workflows.control.filter
    type: behavior
    must: General Filter nodes are deferred. Provider criteria belong in supported app-skill inputs; only-new-results is a per-selected-list Send message option, not a general list-transform node.
    depends_on:
    - examples.filter
  - id: workflows.control.check
    type: behavior
    must: Check serializes as check and evaluates deterministic typed conditions on accessible earlier values or list counts. Equality, numeric comparisons, contains/starts-with, existence and all/any groups require no executable user code. Only the matching branch executes, an empty branch does nothing, and execution then resumes the continuation. Branch-local values stay scoped; legacy decision nodes are not silently renamed.
    depends_on:
    - examples.check
  - id: workflows.control.typed-data
    type: behavior
    must: Declared output schemas drive references to accessible earlier steps before any test run. Incompatible types, forward references, cycles and branch-local references outside their branch are rejected before charged work. App skill Test may execute unsaved inputs with supplied earlier test outputs, stores only temporary test evidence, and never commits the graph or requires a successful test before Save.
    depends_on:
    - examples.typed_data
  - id: workflows.message.standard
    type: behavior
    must: Send message selects an existing owner chat or a new chat title, uses deterministic text with typed upstream references and explicit result blocks, and can conditionally include a block using a Check boolean. Preview uses unsaved values without sending, reserving identities, creating permanent embeds or saving a graph. A full manual run exercises delivery. Eligible result blocks use the standard result layout and workflow-run link; no AI runs. With no eligible content the run succeeds as No new results and creates no empty chat.
    depends_on:
    - examples.standard_message
  - id: workflows.results.selective-embeds
    type: behavior
    must: Intermediate search/filter results are bounded-retention encrypted run data, not automatically permanent
      embeds. Permanent result embeds are created only for items actually handed to chat delivery; future project-save
      support must apply the same selected-only rule. Message and embed persistence are coordinated so no visible
      message contains unresolved references; idempotent retries reuse delivery, message and embed identities.
      Ordinary client-encryption and owner-device fencing remain mandatory; V1 does not introduce offline project
      write authority.
    depends_on:
    - examples.selective_embeds
  - id: workflows.history.delivered-membership
    type: behavior
    must: Only new results compares each selected list against acknowledged deliveries owned by retained runs, scoped to the stable workflow and Send message node so newly created chats share memory; explicitly selected existing-chat destinations remain distinct. Prefer provider plus stable result ID, otherwise normalized canonical URL; no cross-provider semantic matching. Use keyed workflow-scoped batch fingerprints without loading private historic payloads. Unverifiable old examples do not seed membership; reliable memory starts at cutover.
    depends_on:
    - examples.delivered_membership
  - id: workflows.history.delivery-reservations
    type: behavior
    must: Run-owned pending reservations atomically cover included result identities for the workflow and Send message node. Only durable acknowledged message and embed persistence commits membership. Failed, expired or cancelled undelivered reservations release; retry IDs stay stable. Fetched, excluded and unsuccessful results do not become permanently suppressed. Step tests do not evict retained full-run evidence.
    depends_on:
    - examples.delivery_reservations
  - id: workflows.history.delete-forgets
    type: privacy
    must: Deleting a run removes its retained private inputs/outputs and its duplicate-detection records/reservations
      from active workflow storage. Pending writes are fenced/cancelled before deletion succeeds; if an in-flight
      write cannot be safely resolved, deletion stays visibly pending rather than allowing a late delivery. Results
      remembered only by that run become eligible again, but another retained run may still remember them. Existing
      destination messages/embeds remain and show an unavailable run link; separately governed billing or backup
      retention is not represented as erased by run deletion. Automatic run deletion has the same forgetting
      effect; payload-only expiry may retain delivery records only while their owning visible run remains and
      this distinction is explained.
    depends_on:
    - examples.delete_forgets
  - id: workflows.budget.limits
    type: behavior
    must: Keep existing actual skill charging and credit protections and expose known costs and unknown components. New workflow day/week/month caps, forecasting and uncapped acknowledgement UI are deferred; clients must not claim those protections exist.
    depends_on:
    - examples.budgets
  - id: workflows.budget.notifications
    type: behavior
    must: New budget forecasting notifications are deferred. Existing normal notifications remain private and execution/delivery failures remain visible.
    depends_on:
    - examples.budget_notifications
  - id: workflows.access.boundaries
    type: privacy
    must: Workflow control and retained private data are owner-authenticated first-party client surfaces; scheduler/dispatcher
      work is internal-only. Developer API keys do not gain access to encrypted chat, embed, project, keys, or
      delivery material through this amendment. Existing explicitly approved narrower developer metadata surfaces
      remain unchanged. Control/read/delete routes are rate-limited, execution additionally obeys skill and budget
      limits, and authorization is rechecked before destination writes.
    depends_on:
    - examples.access_boundaries

  - id: workflows.chat-delivery.key-recovery
    type: privacy
    must: An existing-chat delivery recovers the canonical encrypted chat-key wrapper and decrypts it only on the owner client. A missing local cache never authorizes creating a replacement key for that chat. Persistence rejects a mismatched wrapper and requires resynchronization; the server never receives the unwrapped chat key.
    depends_on: [examples.delivery_recovery]
  - id: workflows.chat-delivery.sync-projection
    type: behavior
    must: After atomic permanent ciphertext persistence, refresh normal encrypted chat list, version and message projections and notify connected owner clients. Receivers decrypt content and selected embed fields locally. Retry or acknowledgement recovery repairs projections idempotently; no plaintext broadcast is a substitute for encrypted sync.
    depends_on: [examples.delivery_recovery]
  - id: workflows.history.persisted-recovery
    type: privacy
    must: A durable message with a lost acknowledgement is not an undelivered failure. Its run-owned selected-result reservations become non-expiring until acknowledgement recovery or explicit run deletion; ordinary delivery expiry and failed-run cleanup cannot forget already-persisted output. Recovery acknowledges existing ciphertext without generating a new chat or message key.
    depends_on: [examples.delivery_recovery]

applies_to:
  rest_api:
    required: true
    role: Owner-authenticated first-party workflow control and private data; internal scheduler execution; no newly authorized developer-key access to encrypted material.
  cli:
    required: true
    parity: semantic
  sdks:
    required: true
    role: Workflow authoring, draft test, message preview, run history and deletion use existing authorized SDK encryption boundaries.
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [activation_readiness, lifecycle, encrypted_retained_content, chat_delivery_private, chat_delivery_fencing, chat_delivery_encrypted_persistence, surface_parity, mvp_steps, schedule_recurrence, schedule_edges, skill_contract, filter, check, typed_data, standard_message, selective_embeds, delivered_membership, delivery_reservations, delete_forgets, budgets, budget_notifications, access_boundaries, delivery_recovery]

approval:
  source: user-approved workflow v1 implementation plan, Codex task 01a09f95-3e12-71d1-9243-6a3668c57d4b
  date: "2026-09-14"
  scope: Web, CLI, npm and Python SDK, required backend; privacy and encryption architecture preserved.

verification_order:
  - User explicitly authorized the connected global OpenMates CLI personal dev test account first; use its paired dev profile and dev API.
  - Verify workflow setup, execution and CLI-owned encrypted automatic chat creation before browser product verification.
  - Demo inputs are Berlin weather/events/apartments, Germany news, and maximum apartment price EUR 1200/month.
