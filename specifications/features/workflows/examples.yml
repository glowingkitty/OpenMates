schema_version: 1
specification: feature.workflows@8
portable_definition:
- id: cli-web-definition-roundtrip
  given: Alice has saved a Berlin weather Workflow whose Check reads the earlier weather result and whose Send message uses an input mapping and typed result references.
  when: She exports it from the CLI and imports the file in the web app, then exports the saved copy from the web app and imports it in the CLI.
  then: Each copy keeps the authored title, description, retention, inputs, branches, variables and layout. Every step reference still points to the corresponding imported step.
- id: manual-and-incomplete-draft-files
  given: Bob has a saved manual Workflow with no schedule, and a second Workflow with only a title and an incomplete graph.
  when: He exports and imports each saved Workflow while an unsubmitted node edit is open.
  then: Both saved definitions can be transferred. The unsubmitted edit is absent from the file, and the incomplete copy remains a disabled draft.
portable_privacy:
- id: destination-requires-recipient-selection
  given: Alice's scheduled Workflow sends Berlin event results to an existing private chat and has completed runs.
  when: She exports its file and Bob imports it into his account.
  then: The file keeps the authored event query and message template but contains no private chat ID, source ownership, keys, credentials, run results or delivery state. Bob must select his own destination and review the schedule before enabling the copy.
- id: imported-definition-retains-encryption
  given: Bob imports a Workflow containing an authored apartment-search query and message text.
  when: The imported definition is retained and clients receive its normal encrypted data.
  then: The existing Automation Vault and authenticated owner boundaries protect the saved content; plaintext file contents and encryption material do not appear in logs or a public export endpoint.
portable_import:
- id: import-creates-disabled-independent-copy
  given: Alice has an enabled hourly Workflow and already owns another Workflow with the same title.
  when: She imports an exported copy.
  then: A new disabled Workflow appears with an independent identity and no history or deliveries. Neither existing Workflow changes, and no schedule runs until Alice reviews the required bindings and explicitly enables the copy.
- id: invalid-import-creates-nothing
  given: Bob has a malformed Workflow YAML file, a file declaring an unsupported format version, and a file with a broken graph reference.
  when: He attempts to import each file through the CLI or web app.
  then: Each attempt explains the error and creates no Workflow, Project item, run or delivery.
portable_cli:
- id: export-and-import-command-help
  given: Alice owns a saved Berlin events Workflow.
  when: She runs openmates workflows export <workflow-id> --output berlin-events.workflow.yml, then openmates workflows import --file berlin-events.workflow.yml.
  then: Export reports the written path. Import reports a new disabled Workflow and any review requirements; help explains the shared YAML format, and --json returns structured command results.
- id: cli-import-project-attachment
  given: Bob selects an authorized Personal Project and folder for a Workflow file import.
  when: He imports the file with the Project and folder options; on another attempt his Project write access has been revoked.
  then: The authorized attempt links the new disabled Workflow in that folder using the encrypted Project item flow. The denied attempt does not claim attachment and reports any created disabled Workflow so Bob can still open it.
activation_readiness:
- id: activation_readiness-1
  given: A blank draft has no steps or schedule.
  when: Alice saves it and tries Run now.
  then: Saving succeeds but running explains the missing runnable steps and creates no run.
- id: activation_readiness-2
  given: A complete search-to-message workflow has no automatic trigger.
  when: Alice or her authorized assistant runs it manually; she later adds one schedule.
  then: The manual run succeeds without enabling a schedule; automatic enablement validates the single schedule
    and runnable graph.
lifecycle:
- id: lifecycle-1
  given: A run has accepted a pending chat delivery.
  when: Its definition is edited before a device reconnects.
  then: The run stays pinned to its original version and reports pending delivery without claiming a persisted
    message.
- id: lifecycle-2
  given: A search step fails before the message step.
  when: Execution reaches the failure.
  then: The run records the error and no downstream message executes.
encrypted_retained_content:
- id: encrypted_retained_content-1
  given: A run contains private search requirements and outputs.
  when: Its data and delivery fingerprints are retained.
  then: Private payloads are Vault-encrypted and lookup fingerprints are workflow-scoped and keyed; logs and
    notifications omit private contents.
chat_delivery_private:
- id: chat_delivery_private-1
  given: Alice is offline when a private message is ready.
  when: The workflow creates pending chat delivery.
  then: Only Vault ciphertext is stored for its title and message; the availability notice contains no private
    text or normal chat key.
chat_delivery_fencing:
- id: chat_delivery_fencing-1
  given: Two devices have different claim generations for the same delivery.
  when: The older device tries to persist after a newer claim wins.
  then: The stale write is rejected; already claimed or acknowledged deliveries cannot be claimed as new pending
    deliveries.
chat_delivery_encrypted_persistence:
- id: chat_delivery_encrypted_persistence-1
  given: A delivery targets an existing chat.
  when: The winning owner client persists it.
  then: It uses that chat's immutable key and the delivery's stable IDs.
- id: chat_delivery_encrypted_persistence-2
  given: Two owner devices receive a new-chat delivery.
  when: Both try to persist it.
  then: Only the winning client generates the new chat key and one message is created.
surface_parity:
- id: surface_parity-1
  given: Alice authors a no-schedule apartment workflow in the CLI.
  when: She opens it on the web and runs it through an authorized client.
  then: All surfaces show the same Check, costs, delivery states and run-deletion forgetting; exposed
    SDK methods do not change these semantics.
- id: surface_parity-ask-ai
  given: Alice creates an Events search followed by Ask AI in the Python SDK, then opens it on the web.
  when: The Workflow runs and she inspects it using the CLI and npm SDK.
  then: All surfaces use the same saved instruction, selected Events output, one text Answer, and server-side
    app-skill-request validation; only web authoring offers free local typing hints, with no provider request while typing.
mvp_steps:
- id: mvp_steps-1
  given: Alice opens a new Workflow.
  when: She adds a step.
  then: She can choose Use app, Ask AI, Add check, or Send message. Check starts with an exact rule and also offers
    Use AI judgment; Ask AI is not duplicated in Use app, and code, wait, or a separate notification action is not offered.
- id: mvp_steps-2
  given: An older Workflow contains an email action.
  when: Alice opens it and attempts to enable it.
  then: Its saved definition remains readable, but enablement explains that the action must be replaced; no
    email action is silently converted.
schedule_recurrence:
- id: schedule_recurrence-1
  given: Alice saves an hourly apartment search at minute zero in Europe/Berlin.
  when: Its current occurrence finishes and the next becomes due.
  then: The shared calculator selects the next hour without a replay backlog.
- id: schedule_recurrence-2
  given: Alice creates a daily 09:00 weather/news workflow and a Sunday AI-events workflow.
  when: She saves the time/date nodes.
  then: Both schedules retain their explicit timezone; the events input resolves the following calendar Monday through Sunday at each run.
schedule_edges:
- id: schedule_edges-1
  given: A local daily time falls in a DST gap or repeated hour.
  when: The next occurrence is calculated.
  then: The nonexistent occurrence is skipped and the repeated wall time runs once.
- id: schedule_edges-2
  given: An apartment workflow schedule is disabled.
  when: Alice runs the complete graph manually.
  then: A full run proceeds without enabling the schedule.
skill_contract:
- id: skill_contract-1
  given: Alice configures Home search and one provider is unavailable.
  when: The scheduled skill completes with other results.
  then: Run detail identifies incomplete provider coverage rather than claiming there are no new apartments;
    unsupported search parameters are not presented as working filters.
- id: skill_contract-2
  given: Bob opens the skill picker and code.run lacks supported workflow execution.
  when: He tries to add it.
  then: The capability is unavailable with an explanation; returned text from supported skills cannot execute
    code on the server.
- id: skill_contract-3
  given: Alice configures today's Weather forecast in a daily Workflow whose timezone is Europe/Berlin.
  when: She saves and later Tests or runs the Weather step on a different calendar day.
  then: Both inclusive range endpoints store the Today runtime value and resolve to that execution day's local
    date; dates before Today or after Today plus 13 are rejected with a readable forecast-window error.
- id: skill_contract-4
  given: Alice chooses Berlin from the shared map picker in Weather, Events and Home skill forms.
  when: Each selection is applied to its typed input.
  then: Weather receives location with latitude and longitude, Events receives request location with lat and lon,
    and Home receives Berlin as its request query; a coordinate without a resolved city cannot be selected.
filter:
- id: filter-1
  given: Alice configures this v1 delivery.
  when: She opens the corresponding controls.
  then: General Filter is deferred; she uses supported app-skill parameters, and identifiable results already delivered to this destination are omitted automatically without a separate toggle.
check:
- id: check-1
  given: A weather result reports a 70 percent rain probability and Alice configured greater than 60.
  when: The Check executes.
  then: Only If true sends the rain message; If false does nothing. At 60 percent the false branch is chosen. Saving uses node type check, not decision; converting a legacy decision creates a new version without changing historical runs.
- id: check-2
  given: An apartment search returns an empty result list.
  when: The Check checks whether its result count is greater than zero.
  then: The false branch does nothing and the run ends quietly, or continues to explicitly configured following
    steps; no empty recommendation is sent.
- id: check-3
  given: A later message depends on a Check's matched boolean.
  when: Alice removes the Check.
  then: An equality-to-true Check over an earlier boolean rewrites the message dependency to that same boolean;
    any dependency that cannot be preserved blocks removal and names the affected steps.
ai_check:
- id: ai_check-1
  given: A weather step exposes rain probability, wind, temperature and a short forecast summary, and Alice selects those four values for a Check.
  when: She chooses Use AI judgment, inserts the four visible Weather variables into her question about an outdoor lunch, previews those values, and tests the Check.
  then: One bounded Jev call validates and evaluates the question from only those selected values, returning If true, If false or Unsure. Text inside the forecast is treated as untrusted data, and the run shows the outcome without exposing a raw provider response.
- id: ai_check-2
  given: Bob's AI Check asks whether a newly found apartment is a strong fit for his stated preferences, and he has put Send message in its Unsure branch.
  when: Jev returns an uncertain decision or cannot deliver a reliable result, or the Workflow retries the accepted node execution.
  then: The Unsure branch sends Bob's configured message without running either true or false branch or calling a fallback. The run identifies uncertainty or evaluator failure, and a completed prior outcome is reused without another inference or charge.
ai_check_billing:
- id: ai-check-save-validation-charge
  assertion_ids: [workflows.ai-check.single-call-billing]
  given: Alice authors a new true/false AI judgment question, then changes it to an invalid question after an initial Save.
  when: She saves each new wording, retries the rejected Save and finally saves again without changing the question.
  then: Each distinct dispatched Jev validation costs one credit, including the rejection or provider failure after dispatch; the owner-scoped retry and unchanged Save add no charge, and the invalid question is not persisted. Missing credentials or structural errors before dispatch add no charge, and transient unavailability is not treated as a 24-hour accepted verdict.
- id: ai-check-test-one-decision-charge
  assertion_ids: [workflows.ai-check.single-call-billing]
  given: Bob has a valid AI judgment question and enough credits for its Test and later run.
  when: He Tests, then runs the saved Workflow and retries an accepted decision; Jev returns Unsure on one execution.
  then: Each new dispatched Test or run Jev call both validates and decides for one credit, including Unsure or provider failure after dispatch; no fallback or typing-time call occurs, and a distributed lock prevents the owner-scoped retry from being charged twice. With insufficient credits, provider work never starts or charges.
ask_ai_execution:
- id: ask-ai-summarizes-existing-events
  given: Alice has added an Events search whose typed output contains event results.
  when: She adds Ask AI with "Summarize [Events Search · Results] and explain what makes each event special", Tests it, then sends [Ask AI · Answer] to chat in a full run.
  then: Ask AI receives selected events with dates, locations and usable preview references. It may link events inline, show preview cards and include a results map or schedule when useful. The complete answer appears in chat with only valid selected-event references. Events presentation instructions come from the known Events action without another AI classification call; Ask AI cannot call an app skill or access unrelated chat history or memories. Test does not save the graph, and the full run uses normal AI charging and encrypted retained content.
- id: ask-ai-failure-stops-dependent-message
  given: A saved Workflow sends the Ask AI Answer in a later message.
  when: AI processing fails after the earlier app result succeeds, or a completed step is retried.
  then: Failure stops the dependent message without inventing an Answer or taking an AI Check Unsure branch;
    a completed Answer is reused on retry without a duplicate inference or charge.
ask_ai_validation:
- id: ask-ai-uses-existing-output-not-new-skill
  given: Alice's Workflow already has an Events search step, and her Ask AI instruction says "Use [Events Search · Results] to write a summary."
  when: She saves from the web or creates or updates the Workflow through REST, CLI, npm SDK or Python SDK.
  then: Server validation treats the reference as existing data, not a request to invoke an app skill, and accepts
    the instruction; CLI and SDK need no typing-time requests.
- id: ask-ai-rejects-new-app-call-or-errors-when-unverified
  given: Bob enters "Find new events for me using the Events app" in Ask AI without a preceding Events step.
  when: Jev recognizes the request during create or update, or Jev cannot return a valid verdict.
  then: Every authoring surface rejects the app-skill request with guidance to add Use app instead. A provider error is a validation failure without persistence or Gemini fallback, and Ask AI still has no runtime tools.
ask_ai_billing:
- id: ask-ai-save-validation-credit-including-rejection
  assertion_ids: [workflows.ai-ask.validation-billing]
  given: Alice edits an Ask AI instruction from "Summarize these events" to "Find events using the Events app".
  when: She saves the new wording, retries the rejected request and then saves again without an edit.
  then: Dispatched Jev validation costs one credit even though Save rejects the instruction or Jev fails after dispatch; the owner-scoped retry and unchanged instruction add no charge. Typing and field selection make no provider call; missing credentials or preparation failure before dispatch add no charge, and transient provider unavailability is not cached as a 24-hour accepted verdict.
- id: ask-ai-test-uses-normal-skill-charge
  assertion_ids: [workflows.ai-ask.validation-billing]
  given: Bob has a valid Ask AI instruction and enough credits.
  when: He Tests it and later runs the saved Workflow, then retries an accepted request.
  then: Test uses normal AI Ask Skill billing and the run uses normal inference billing without an extra Save-validation charge; accepted retries are not debited twice. With insufficient credits, provider work does not start, and Billing and Usage omits his private instruction text.
typed_data:
- id: typed_data-1
  given: Alice has added an Events search but never run it.
  when: She adds Check and inserts Events results into Send message.
  then: The declared list and count fields are selectable immediately; the Check can reference either the
    earlier result count.
- id: typed_data-2
  given: Bob references a value produced only on the other Check branch.
  when: He saves a complete runnable definition.
  then: Validation explains the unavailable input and prevents execution without spending credits.
earlier_action_reference:
- id: earlier-action-reference-required
  given: Alice has added Search events before Ask AI and Send message.
  when: She saves "Summarize upcoming events" in Ask AI or "Here are the events" in Send message without inserting an earlier action variable.
  then: Web, REST, CLI and SDK saves reject the relevant field with guidance to insert a visible earlier action variable; a hidden results section does not satisfy the requirement.
- id: static-message-without-earlier-action
  given: Bob has no earlier action before Ask AI, AI judgment or Send message.
  when: He saves a meaningful static instruction, question or message.
  then: No earlier-action variable is required. Once an earlier action is added, each affected field must visibly use at least one accessible earlier action output.
authoring_compact_plan:
- id: authoring-plan-weather-notification
  given: Alice asks to make a daily rain alert from Weather and a chat message.
  when: OpenMates plans the request.
  then: Jev selects the registered Weather forecast skill and supported control choices, either directly or by selecting the Weather app first and then its skill. Gemini receives that scoped context and proposes a compact draft with a title, schedule, Weather inputs, rain condition and notification text, without inventing a new Weather skill or per-skill recipe.
- id: authoring-plan-supported-edit
  given: Bob has an existing apartment Workflow and asks to change its search city; a separate request just says "Make it better."
  when: OpenMates plans the edit.
  then: The clear edit identifies the existing Workflow and supported Home search input while preserving its other steps and metadata. Jev routes the confusing second request to clarification chat before Gemini starts generating; a later model error in a clear request does not trigger clarification.
authoring_provisional_validation:
- id: authoring-stream-complete-step
  given: Alice asks for a Weather rain alert and watches the draft appear.
  when: Gemini completes a Weather node before the Check and message are ready, and Alice then selects Stop.
  then: The backend validates Weather's inputs and graph placement before showing it. Stop saves that valid prefix disabled with no automatic execution; Alice can continue editing it manually. Manual run availability still follows normal graph readiness.
- id: authoring-invalid-node-retry-and-save-prefix
  given: A validated Weather node is already visible, and Gemini next proposes a message with a reference to a future node.
  when: The backend rejects that message, asks Gemini once to correct it, and the corrected node still has an invalid reference.
  then: The invalid message is never shown as accepted. Generation stops, the valid Weather prefix is saved disabled with no automatic execution, and Alice sees the concrete error with options to request a specific update or edit the draft herself; no clarification chat opens.
authoring_atomic_update:
- id: authoring-single-create-disabled-edit-retained
  given: Alice asks for a new rain alert and an edit to her enabled apartment Workflow.
  when: Both changes validate and she accepts them.
  then: The rain alert is created disabled and the apartment Workflow remains enabled unless Alice asked to change that state.
- id: authoring-mixed-failure-and-guarded-undo
  given: Bob requests two Workflow edits, one with an invalid dependency after generation completes; he later asks AI to edit his enabled Weather Workflow and stops after one validated node.
  when: The full invalid batch is submitted, then the partial Weather edit is saved and Bob selects Undo before changing it again.
  then: The full invalid batch changes neither existing Workflow. The partial Weather edit is saved under the same Workflow ID with untouched later nodes retained, the Workflow disabled, and no copy created. Undo restores the entire prior Weather state including enabled state; a newer manual revision would instead cause a conflict.
standard_message:
- id: standard_message-1
  given: Alice schedules an AI-news search each weekday and chooses a new chat titled AI news.
  when: 'She writes "Here is today''s news: [News Search · Results]" and the run finds selected articles.'
  then: The sentence is followed at the inserted variable by a group of article previews, without a raw result dump or AI summarization charge. A run preview appears in the normal app skill embed area.
- id: standard_message-2
  given: Bob schedules an event search each Sunday at 19:00 and selects an existing chat.
  when: 'He writes "Here are the upcoming events: [Search events · Results]" and selected events are sent.'
  then: The message displays his introduction and grouped event previews at that position, with a run preview on this delivered message. An older saved results-section workflow remains readable and converts its section to an inline variable on edit without dropping a condition.
optional_message_condition:
- id: standard_message-nullable-condition
  assertion_ids: [workflows.control.check]
  given: A removed equality-to-true Check forwarded Weather's nullable rain flag to an optional message block.
  when: The source flag is true, false or unknown.
  then: The block is included only for true, preserving the previous condition; other dependent references still prevent removal.
selective_embeds:
- id: selective_embeds-1
  given: A search returns ten apartments and two are eligible for this destination.
  when: Ask AI cites one of the two and shows its preview; the delivery is prepared and persisted.
  then: Only the eligible apartments may become permanent result embeds, while the other eight remain temporary encrypted run data. An invented or excluded reference cannot appear as a broken link in the visible answer.
- id: selective_embeds-2
  given: All owner devices are offline when a message with two result references is ready.
  when: A device reconnects and retries persistence.
  then: The delivery remains visibly pending until the authorized client can persist the message and referenced
    embeds consistently; retry creates no duplicate message or embeds.
delivered_membership:
- id: delivered_membership-1
  given: Apartment A was sent two runs ago, disappeared last run, and returns with a new apartment B.
  when: The same Workflow prepares its new-chat destination before Ask AI runs.
  then: Only B is given to Ask AI and later delivered; A is recognized across retained runs using the batch identity lookup.
- id: delivered_membership-2
  given: Apartment C was fetched previously but excluded and never sent; the Workflow also sends to a second existing chat with its own history.
  when: Changed requirements now select C and a shared Ask AI step prepares both destinations.
  then: C remains eligible, and each destination's Ask AI answer uses its own previously unsent set. New chats created by one Send message node share memory; a different existing-chat destination stays distinct.
delivery_reservations:
- id: delivery_reservations-1
  given: A pending chat delivery contains apartment A while a later search also finds A.
  when: Both prepare results for Ask AI and delivery to the same destination.
  then: The reservation prevents A from reaching the later Ask AI or a duplicate message. With no new results, that Ask AI call is skipped without a charge or empty chat; a successful owner-client acknowledgement turns the first reservation into a delivered record.
- id: delivery_reservations-2
  given: The pending delivery expires without persistence.
  when: The next run finds the apartment again.
  then: Its reservation has been released and the result can be recommended; no failed delivery is counted
    as sent.
run_provenance:
- id: new-chat-run-preview
  given: A workflow creates a new chat containing upcoming event previews.
  when: Alice opens the delivered message on desktop and selects its run preview in the app skill embed area.
  then: The run detail opens beside the chat; on a narrow screen it opens in the normal fullscreen layout.
- id: existing-and-old-chat-run-preview
  given: An earlier workflow message contains an internal View workflow run link, and a newer run sends to an existing chat.
  when: Alice opens either message after its run content has expired or its run has been deleted.
  then: Each message still shows a run preview with a readable unavailable state, without rewriting the old encrypted message or exposing private run content.
delete_forgets:
- id: delete_forgets-1
  given: Run 1 sent apartment A, no other run sent it, and its chat message remains.
  when: Alice deletes Run 1 after reading the deletion explanation.
  then: Run data and delivery fingerprints are removed; A may be sent again, the original message remains,
    and its run link says the run is unavailable.
- id: delete_forgets-2
  given: Run 2 also recorded the same apartment, while Run 3 has a pending delivery.
  when: Alice deletes Run 1 and then requests deletion of Run 3.
  then: Run 2 still suppresses its delivered apartment; Run 3 pending writes are fenced before deletion completes
    and cannot later create a forgotten delivery.
budgets:
- id: budgets-1
  given: Alice configures this v1 delivery.
  when: She opens the corresponding controls.
  then: New period budgets are deferred; display actual skill costs without claiming caps.
budget_notifications:
- id: budget_notifications-1
  given: Alice configures this v1 delivery.
  when: She opens the corresponding controls.
  then: New forecast notifications are deferred; existing notifications remain content-private.
access_boundaries:
- id: access_boundaries-1
  given: Another user or an unrelated developer API key knows a run ID.
  when: They request its private outputs or attempt chat delivery.
  then: Access is denied without disclosing payloads or key material.
- id: access_boundaries-2
  given: An authorized owner schedules a message and destination authorization is later revoked.
  when: The delivery attempts persistence.
  then: The write is rejected visibly; cached access cannot override the revoked authorization.

delivery_recovery:
- id: delivery_recovery-1
  given: The CLI has no cached copy of a selected existing chat.
  when: It receives a workflow delivery claim.
  then: It unwraps the canonical owner-visible chat key; persistence rejects any conflicting key wrapper.
- id: delivery_recovery-2
  given: The CLI permanently stores an encrypted apartment message and selected embeds, then loses the acknowledgement connection.
  when: Ordinary delivery expiry passes before the client reconnects.
  then: Persisted results remain reserved; reconnect acknowledges the existing ciphertext without duplicate output. Explicit run deletion still forgets its membership.
- id: delivery_recovery-3
  given: The CLI creates a new encrypted workflow chat while the web app is connected.
  when: The atomic persistence commits and sync is projected.
  then: The web receives ciphertext metadata, decrypts locally, and displays the same chat and included result embeds.

skill_billing:
- id: skill_billing-1
  given: Alice has sufficient credits and a Workflow contains a paid app skill.
  when: The skill executes in a full run and Alice separately tests its draft inputs.
  then: Each successful paid invocation uses the existing skill price, reduces credits and appears in Billing and Usage as Workflow run or Workflow test with readable app and skill names.
- id: skill_billing-2
  given: A paid skill charge has already been accepted for a Workflow node execution.
  when: Its billing or delivery acknowledgement is retried.
  then: The original logical charge is not debited again and private Workflow inputs, results and messages are absent from billing attribution.
- id: skill_billing-3
  given: Alice has insufficient credits for a paid Workflow skill.
  when: A full run or node Test attempts that skill.
  then: Paid work is rejected, the failure is visible and downstream steps do not execute; deterministic Preview alone remains uncharged.

website_changes:
- id: website-changes-1
  assertion_ids: [workflows.website-change.baseline]
  given: "Alice watches events.ccc.de for Congress announcements."
  when: "The first read succeeds, the next is unchanged, and the third returns a browser challenge."
  then: "The first read initializes silently, the second makes no AI decision, and the blocked read reports its failure while keeping the usable baseline."
- id: website-changes-2
  assertion_ids: [workflows.website-change.diff-inputs]
  given: "A saved page gains a Congress article with a link while a large unrelated article is unchanged."
  when: "A Check asks whether the Changes output announces Congress news."
  then: "Jev receives the diff with the new article link, without the unchanged article or a full snapshot. A diff exceeding the limit reports a clear failure."
- id: website-changes-3
  assertion_ids: [workflows.website-change.retry]
  given: "A Congress update matches, but its summary delivery awaits an offline owner device."
  when: "The website remains unchanged on the next run, then the device reconnects and acknowledges the message."
  then: "The pending change survives without another decision or summary call; one message is persisted and later runs send nothing for that occurrence."
- id: website-changes-4
  assertion_ids: [workflows.website-change.lifecycle]
  given: "Alice and Bob watch the same URL in separate Workflows, and Alice has a pending update."
  when: "Alice tests a step, changes the watched URL, or deletes the run that owns its comparison state."
  then: "Bob is unaffected. The step test changes no baseline; a changed URL initializes silently; deletion forgets the owned state and prevents a late pending write."
