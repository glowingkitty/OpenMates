schema_version: 1
specification: feature.landing-onboarding@2

real_shell:
  - id: logged-out-welcome-uses-real-chat-shell
    given: {authenticated: false, route: /chat/new}
    expect:
      daily_inspiration_variant: guest-intro
      host_surface: new_chat_welcome
      separate_marketing_page: false
      welcome_content_mounted_under_intro: true
      active_public_chat: null
      chat_hash: null
  - id: intro-overlay-covers-active-chat-card
    given: {current_story_id: openmates-intro, intro_phase: expanded}
    expect:
      covers_active_chat_content: true
      message_input_reserved: true
      underlying_welcome_content_removed_from_dom: false

story_sequence:
  - id: durable-guest-story-order
    given: {source: guest-onboarding}
    expect:
      ordered_story_ids:
        - openmates-intro
        - openmates-actionable-events
        - openmates-privacy-safety
        - openmates-mates-focus
        - openmates-provider-cross-platform
        - openmates-signup-cta
      final_story_id: openmates-signup-cta
  - id: fresh-visit-starts-at-intro
    given: {authenticated: false, fresh_page_load: true}
    expect: {current_story_id: openmates-intro, intro_phase: expanded}

app_rails:
  - id: intro-highlighted-request-order
    given: {current_story_id: openmates-intro}
    expect:
      request_app_order: [health, events, code, news]
      request_meanings: [find_doctor_appointments, find_events, build_a_web_app, explain_the_news]
  - id: app-icons-from-active-metadata-only
    given: {web_app_metadata: current}
    expect:
      disallowed_app_sources: [inactive, future, non_existing, provider_only]
      excluded_app_ids: [ai]
      highlighted_icons_consecutive_in_primary_rail: true
      matching_app_visible_near_center_when_request_visible: true

story_progress:
  - id: intro-progress-collapses-to-actionable
    given: {current_story_id: openmates-intro, progress_complete: true}
    expect: {next_story_id: openmates-actionable-events, intro_phase: regular}
  - id: coordinated-story-advances-on-animation-and-progress
    given: {current_story_id: openmates-actionable-events, animation_complete: true, progress_complete: true}
    expect: {advances_once: true, next_story_id: openmates-privacy-safety}
  - id: reduced-motion-keeps-content-stable
    given: {prefers_reduced_motion: true, current_story_id: openmates-privacy-safety}
    expect: {requires_transient_frame_to_understand_story: false, progress_drift: false}
  - id: signup-slide-holds
    given: {current_story_id: openmates-signup-cta, progress_complete: true}
    expect: {advanced_past_signup: false}

navigation:
  - id: next-click-skips-expanded-intro
    given: {current_story_id: openmates-intro, intro_phase: expanded}
    action: click_next
    expect: {current_story_id: openmates-actionable-events, intro_dismissed: true}
  - id: banner-click-on-guest-slide-advances-not-chat
    given: {current_story_id: openmates-privacy-safety}
    action: click_banner_body
    expect: {starts_chat: false, advances_to_next_story: true}
  - id: horizontal-swipe-advances
    given: {delta_x: -70, delta_y: 10, current_story_id: openmates-mates-focus}
    expect: {advances_to_next_story: true, suppresses_next_click: true}
  - id: vertical-swipe-cancelled
    given: {delta_x: 10, delta_y: 60, current_story_id: openmates-mates-focus}
    expect: {advances_to_next_story: false}
  - id: previous-can-restore-intro
    given: {current_story_id: openmates-actionable-events, intro_dismissed: true}
    action: click_previous
    expect: {current_story_id: openmates-intro, intro_phase: expanded}

actionable_story:
  - id: event-demo-sequence
    given: {story_id: openmates-actionable-events}
    expect:
      stages: [user_request, assistant_response, event_preview, external_event_cta]
      request_meaning: find_language_learning_events
      event_example: DEPIN_DAY_BERLIN
      pointer_actions_visible: true
      wall_of_text_only: false

product_stories:
  - id: privacy-story-product-faithful
    given: {story_id: openmates-privacy-safety}
    expect:
      topics: [saved_chat_encryption, pii_detection, original_reveal_control, memory_permission]
      compact_heading_above_animation: true
      abstract_placeholder_only: false
  - id: mates-focus-story-product-faithful
    given: {story_id: openmates-mates-focus}
    expect:
      topics: [mates, focus_modes]
      compact_heading_above_animation: true
      abstract_placeholder_only: false
  - id: provider-platform-story-product-faithful
    given: {story_id: openmates-provider-cross-platform}
    expect:
      topics: [provider_independence, cross_platform_access]
      compact_heading_above_animation: true
      abstract_placeholder_only: false

signup_cta:
  - id: benefits-then-shared-signup-button
    given: {story_id: openmates-signup-cta}
    expect:
      initial_stage: benefits
      benefits: [no_ads, no_subscription, privacy_focus, pay_per_use]
      final_stage: cta
      button_test_id: landing-signup-cta-button
  - id: opens-shared-signup-interface
    given: {story_id: openmates-signup-cta}
    action: click_signup_button
    expect:
      dispatched_event: openSignupInterface
      starts_chat: false
      signup_hash_written: false

legacy_intro_retirement:
  - id: retired-intro-paths-return-to-welcome
    given: {route: /intro/for-everyone}
    expect: {redirect_destination: /, sitemap_entry: false}
  - id: retired-intro-fragments-return-to-welcome
    given: {route: "/#chat-id=demo-for-developers", authenticated: false}
    expect: {hash_cleared: true, host_surface: new_chat_welcome, missing_chat_error: false}
  - id: retired-intros-absent-from-discovery
    given: {surface: guest_or_authenticated_public_chat_discovery}
    expect: {absent_chat_ids: [demo-for-everyone, demo-for-developers], real_example_chats_visible: true}
  - id: auth-recovery-uses-neutral-chat-state
    given: {login_recovery_completed: true, previous_last_opened: /signup/verify}
    expect: {last_opened_not_in: [demo-for-everyone, demo-for-developers], neutral_new_chat_state: true}

primary_slogan:
  - id: english-positioning-is-consistent
    given: {locale: en}
    expect:
      slogan: Your AI team for getting things done
      surfaces: [landing_headline, seo_metadata, open_graph, social_preview, github_readme, npm_readme, pip_readme]
      package_registry_descriptions_remain_specific: true

apple_parity:
  - id: apple-preserves-web-story-contract
    given: {surface: gui.apple, reference: web_guest_landing_contract}
    expect:
      same_story_order: true
      same_terminal_signup_story: true
      same_intro_app_order: true
      same_navigation_semantics: true
      pixel_exact_animation_required: false
  - id: apple-e2e-links-contract-assertions
    given: {test_suite: apple_e2e_landing}
    expect:
      contract_test_metadata_present: true
      surface: gui.apple
      classification: direct
      linked_assertions:
        - landing-onboarding.uses-real-chat-shell
        - landing-onboarding.guest-sequence
        - landing-onboarding.intro-active-apps-only
        - landing-onboarding.coordinated-story-progress
        - landing-onboarding.manual-navigation
        - landing-onboarding.actionable-demo-faithful
        - landing-onboarding.privacy-mates-platform-stories
        - landing-onboarding.signup-cta
        - landing-onboarding.apple-web-parity
