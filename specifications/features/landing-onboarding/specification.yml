schema_version: 1
id: feature.landing-onboarding
version: 5
status: draft
title: Signed-out Web Welcome
summary: Signed-out web and Apple main-app visitors use the ordinary new-chat welcome with normal Daily
  Inspirations and real example discovery. The separate public website owns marketing stories.
scope:
  includes:
  - Signed-out web welcome inside the existing chat shell, with the normal Daily Inspiration presentation
    and composer.
  - Interest selection and all real example-chat discovery on the welcome surface.
  - Retired intro chat URL compatibility and existing English SEO description hierarchy.
  - Apple signed-out main-app welcome with synchronous public fallback, visible native topic selection
    and existing login/navigation controls.
  excludes:
  - Expanded web intro overlays, promotional story slides, slide-filtered examples and signup-story navigation.
  - Authenticated inspiration source priority or persistence, owned by feature.daily-inspiration.
  - Marketing website layout and copy, owned by feature.marketing-landing.
  - Signup form internals.
assertions:
- id: landing-onboarding.uses-real-chat-shell
  type: behavior
  must: The signed-out web root renders the ordinary new-chat welcome inside the existing chat shell.
    It retains the composer, normal Daily Inspiration banner, interest selection and all-example-chat
    discovery. Expanded landing header, timed marketing slides and slide-filtered examples are absent.
  depends_on:
  - examples.web_welcome
- id: landing-onboarding.guest-examples
  type: behavior
  must: The signed-out welcome offers Select interests and Show all example chats. Interest selection
    may rank the ordinary real examples, but no marketing slide controls their visibility. Selecting an
    example opens its actual shared chat without fabricating a chat or starting a request.
  depends_on:
  - examples.examples_discovery
- id: landing-onboarding.legacy-intros-retired
  type: behavior
  must: Logged-out onboarding and real-example discovery do not register, select, recommend, or render
    the retired For everyone, For developers, and Who develops OpenMates public chats; their old path
    URLs redirect to the root welcome surface, their old hash IDs are cleared client-side into the same
    welcome state without an error, and authentication recovery never persists any retired ID as last_opened.
  depends_on:
  - examples.legacy_intro_retirement
- id: landing-onboarding.primary-slogan-consistent
  type: invariant
  must: The existing English page title and social-preview positioning remain Your AI team for getting
    things done; descriptive English metadata and README introductions retain the approved longer product
    description. The web welcome may render its localized ordinary heading without an expanded marketing
    overlay.
  depends_on:
  - examples.primary_slogan
- id: landing-onboarding.apple-web-parity
  type: parity
  must: The signed-out Apple main app opens its existing new-chat welcome directly with normal Daily Inspirations,
    including synchronous public fallback while defaults load, and visible existing interest-topic controls
    in the Continue area, limited to topics with examples in the current native catalog and accepting
    a single selected topic. Selected topics filter the existing public example catalog; skipping restores
    the unfiltered catalog. Expanded marketing headers, intro overlays, and product-story/signup slides
    are absent from this app welcome. Existing login entry points and shell navigation remain visible
    and usable. This explicitly separates the Apple app from the website marketing landing flow.
  depends_on:
  - models.AppleLandingParity
  - examples.apple_parity
  - applies_to
- id: landing-onboarding.guest-sequence
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.intro-active-apps-only
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.coordinated-story-progress
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.manual-navigation
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.actionable-demo-faithful
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.privacy-mates-platform-stories
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
- id: landing-onboarding.signup-cta
  type: invariant
  must: This identifier is retained only so historical native onboarding test metadata remains traceable.
    Its former promotional-story behavior is retired. Current Apple signed-out welcome behavior is defined
    by landing-onboarding.apple-web-parity, and current web welcome behavior is defined by landing-onboarding.uses-real-chat-shell.
  depends_on:
  - examples.historical_native_references
applies_to:
  rest_api:
    required: false
    role: This welcome contract consumes public-safe Daily Inspiration records but defines no separate
      landing endpoint.
  cli:
    required: false
    role: CLI has no logged-out visual landing surface.
  sdks:
    required: false
    implementations:
      npm:
        required: false
      pip:
        required: false
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
      apple:
        required: true
        role: Signed-out main-app welcome follows AppleLandingParity after marketing landing separation;
          website guest-story assertions do not require native marketing slides.
examples:
  file: examples.yml
  required_groups:
  - web_welcome
  - examples_discovery
  - legacy_intro_retirement
  - primary_slogan
  - apple_parity
  - historical_native_references
approval_source:
  instruction: User directly requested implementation and relevant specification updates on 2026-10-09
    in this Codex thread and said not to ask for further confirmation today; no new exact-fingerprint
    approval is claimed.
models:
  AppleLandingParity:
    host_surface:
      type: enum
      values:
      - new_chat_welcome
      required: true
    inspiration_source:
      type: enum
      values:
      - normal_daily_inspiration
      required: true
      constraints:
        synchronous_public_fallback: true
        marketing_intro_or_product_story_slides: absent
    topics:
      type: behavior
      required: true
      constraints:
        initial_selection_visible: true
        offered_topics_have_native_catalog_matches: true
        minimum_topics_to_filter: 1
        existing_controls_and_state: preserved
        selected_topics_filter_existing_public_catalog: true
        skip_restores_unfiltered_catalog: true
    navigation:
      type: behavior
      required: true
      constraints:
        login_entry_point: preserved
        existing_shell_controls: preserved
