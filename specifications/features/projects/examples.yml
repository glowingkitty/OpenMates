schema_version: 1
specification: feature.projects@1

project_contexts:
  - id: personal-project
    input: {context: personal, operation: create, name: Specification system redesign}
    expect: {hashed_user_owner: true, hashed_team_owner: false, encrypted_name: true}
  - id: ambiguous-context
    input: {personal: true, team_id: team-1, operation: list}
    expect_error: {code: PROJECT_CONTEXT_AMBIGUOUS, rows_returned: false}
  - id: destructive-confirmation
    input: {operation: delete, project: project-1, confirmation: incorrect}
    expect_error: {code: CONFIRMATION_REQUIRED, deleted: false}

project_key_wrappers:
  - id: personal-master-wrapper
    input: {project: project-1, context: personal}
    expect: {master_wrapper: true, raw_project_key: absent}
  - id: team-wrapper
    input: {project: project-2, context: team-1, team_key_epoch: 3}
    expect: {team_wrapper: true, hashed_team_id: true, raw_project_key: absent}

project_item_links:
  - id: link-supported-objects
    input: {project: project-1, item_types: [chat, embed, upload, workflow, contract, plan, task, check]}
    expect: {all_supported: true, target_ids_encrypted: true, target_hashes_present: true}
  - id: unlink-does-not-delete-object
    input: {project: project-1, operation: unlink, target: plan-1}
    expect: {project_link_deleted: true, plan_deleted: false}

project_surface_catalog:
  - id: several-contracts-reuse-project-surfaces
    input: {project: openmates, surfaces: [rest_api, cli, sdk_npm, sdk_pip, web, apple], contracts: [teams, plans, projects]}
    expect: {surface_catalogs: 1, copied_surface_definitions_per_contract: false, stable_surface_refs: true}
  - id: deprecated-surface-remains-resolvable
    input: {project: openmates, surface_catalog_revision: surface-rev-3, surface_id: legacy_web, status: deprecated, approved_contract_revision: contract-rev-3}
    expect: {historical_label_visible: true, new_requirement_selection_default: false, approved_revision_broken: false}
  - id: linked-contract-keeps-home-catalog
    input: {contract_revision: contract-rev-4, home_project: openmates, additionally_linked_project: customer-rollout}
    expect: {surface_catalog_source: openmates, surface_meaning_reinterpreted: false}

project_work_chain:
  - id: contract-to-proof
    input:
      project: project-1
      contract: feature.plans@1
      plan: plan-1
      tasks: [task-1, task-2]
      checks: [check-1]
    expect: {objects_linked_not_copied: true, independent_lifecycles: true, navigation_traceable: true}

project_check_catalog:
  - id: large-repository-not-materialized
    input: {catalog_test_count: 5000, promoted_checks: 4}
    expect: {project_check_items: 4, project_test_items: 0, catalog_search_available: true}

project_item_presentation:
  - id: contract-preview
    input: {item_type: contract, item: feature.plans}
    expect: {shows: [title, version, approval_state, coverage_summary], opens_contract_fullscreen: true}
  - id: plan-preview
    input: {item_type: plan, item: plan-1}
    expect: {shows: [title, approval_state, execution_state, progress], opens_plan_fullscreen: true}
  - id: task-preview
    input: {item_type: task, item: task-1}
    expect: {shows: [title, status, assignee, blocker], opens_task_fullscreen: true}
  - id: check-preview
    input: {item_type: check, item: check-1}
    expect: {shows: [title, type, latest_result, stale_state], opens_check_fullscreen: true}
  - id: compact-detail-restores-project
    input: {viewport: phone, selected_item: check-1}
    expect: {fullscreen_overlay: true, close_restores_scroll_and_filters: true}

project_uploads:
  - id: encrypted-upload-embed
    input: {project: project-1, file: requirements.pdf}
    expect: {embed_ciphertext: true, owner_wrapper: true, project_wrapper: true, link_after_wrappers: true}

project_surface_parity:
  - id: same-linked-object
    input: {surfaces: [rest_api, cli, sdk_npm, sdk_pip, gui_web], project: project-1, item: plan-1}
    expect: {same_target_hash: true, same_object_lifecycle_owner: plan, raw_id_exposed: false}
