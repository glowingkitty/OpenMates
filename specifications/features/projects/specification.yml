schema_version: 1
id: feature.projects
version: 1
status: draft
title: Projects
summary: >
  Projects are encrypted Personal or Team workspaces that organize OpenMates
  artifacts and context, including Specifications, Plans, Tasks, and materialized
  Checks, through file-like previews and consistent fullscreen detail surfaces.

purpose:
  outcomes:
    - Keep durable project context organized without exposing private names, content, or keys to the server.
    - Let users navigate from product truth to planned change, executable work, and proof in one workspace.
    - Present different object types consistently while preserving each object's own lifecycle and authority.

scope:
  includes:
    - Personal or Team Project creation, listing, detail, update, archive, restore, delete, history, and exact destructive confirmation.
    - Project folders and encrypted links to chats, embeds, uploads, workflows, Specifications, Plans, Tasks, and materialized Checks.
    - One encrypted Project Surface Catalog with stable definitions such as REST API, CLI, npm SDK, pip SDK, web, Apple, or custom delivery surfaces, reused by every Specification and Check in that Project.
    - File-like preview cards and responsive fullscreen detail routing for linked object types.
    - Object-owned lifecycle: Projects organize links but do not copy or own Specification approval, Plan execution, Task status, or Check results.
    - Project key wrappers, encrypted item ids/metadata, encrypted Project associations, and explicit Personal/Team context.
    - Search, filtering, grouping, and recent activity over privacy-safe local/decrypted metadata.
    - REST, CLI, npm SDK, pip SDK, and web semantic parity where exposed.
  excludes:
    - Automatically materializing every repository test as a Project item.
    - Copying linked objects into Project-owned records or changing their canonical lifecycle state.
    - Remote filesystem bridge behavior and source-file mutation authority.
    - Public APIs for raw Project ciphertext, raw keys, or server-side plaintext Project search.
    - Requiring one visual layout for every linked object type when equivalent responsive outcomes are preserved.

relationships:
  related_specifications: [feature.specifications, feature.plans, feature.tasks, feature.checks]

actors:
  - id: project_owner
    role: Creates, organizes, and controls a Personal Project.
  - id: team_member
    role: Accesses a Team Project according to Team role permissions.
  - id: workspace_agent
    role: Uses explicitly approved Project context without receiving unrelated private Project content.

models:
  ProjectRecord:
    project_id: {type: stable_id, required: true}
    owner_context: {type: enum, values: [personal, team], required: true, constraints: {exactly_one_of_hashed_user_or_team: true}}
    encrypted_name: {type: client_ciphertext, required: true}
    archived: {type: boolean, required: true}
    version: {type: integer, required: true, constraints: {monotonic: true}}

  ProjectKeyWrapper:
    hashed_project_id: {type: sha256_hex, required: true}
    key_type: {type: enum, values: [master, team], required: true}
    hashed_team_id: {type: sha256_hex_or_null, nullable: true, constraints: {required_when_key_type_team: true}}
    team_key_epoch: {type: integer_or_null, nullable: true, constraints: {required_when_key_type_team: true, minimum: 1}}
    encrypted_project_key: {type: wrapped_object_key, required: true, constraints: {plaintext_project_key: forbidden}}

  ProjectItemLink:
    project_item_id: {type: stable_id, required: true}
    item_type: {type: enum, values: [chat, embed, upload, workflow, specification, plan, task, check], required: true}
    target_id_hash: {type: sha256_hex, required: true}
    target_id_encrypted: {type: project_ciphertext, required: true}
    encrypted_metadata: {type: project_ciphertext_or_null, nullable: true}
    folder_id: {type: stable_id_or_null, nullable: true}
    position: {type: integer, required: true}

  ProjectObjectAssociation:
    object_type: {type: enum, values: [specification, plan, task, check], required: true}
    linked_project_hashes: {type: hashed_id_list, required: true}
    encrypted_linked_project_ids: {type: client_ciphertext, required: true}
    project_key_wrapper: {type: wrapped_object_key, required: true}

  ProjectItemPresentation:
    preview_contract: {type: type_specific_preview_definition, required: true}
    fullscreen_route: {type: stable_nested_route, required: true}
    responsive_surface: {type: embed_style_detail_surface, required: true}
    object_lifecycle_owner: {type: enum, values: [specification, plan, task, check, chat, embed, workflow], required: true}

  ProjectSurfaceCatalog:
    catalog_id: {type: stable_id, required: true}
    project_id_hash: {type: sha256_hex, required: true}
    current_revision_id: {type: stable_id, required: true}

  ProjectSurfaceCatalogRevision:
    revision_id: {type: stable_id, required: true}
    catalog_id: {type: stable_id, required: true, constraints: {must_reference_parent_catalog: true}}
    revision_number: {type: integer, required: true, constraints: {monotonic: true}}
    content_hash: {type: sha256_hex, required: true}
    encrypted_surface_definitions: {type: project_ciphertext, required: true}
    constraints: {type: immutable_revision, required: true, constraints: {immutable: true, catalog_project_binding_preserved: true}}

  ProjectSurfaceDefinition:
    surface_id: {type: stable_semantic_id, required: true}
    kind: {type: enum, values: [api, cli, sdk, web, native, physical, channel, custom], required: true}
    parent_surface_id: {type: stable_semantic_id_or_null, nullable: true}
    encrypted_label: {type: project_ciphertext, required: true}
    status: {type: enum, values: [active, deferred, deprecated], required: true}
    position: {type: integer, required: true}

assertions:
  - id: projects.access.explicit-context
    type: security
    must: Every Project operation resolves to exactly one authenticated Personal or Team context; ambiguous context, unknown Team, or insufficient role fails before returning rows, wrappers, or item metadata.
    depends_on: [models.ProjectRecord.owner_context, examples.project_contexts]
  - id: projects.lifecycle.encrypted-crud
    type: behavior
    must: Project create, list, detail, update, archive, restore, delete, and history preserve encrypted private fields, monotonic versions, visible failures, and exact confirmation for destructive changes.
    depends_on: [models.ProjectRecord, examples.project_contexts]
  - id: projects.keys.client-wrapped
    type: privacy
    must: Project keys remain client-wrapped for the authorized Personal or Team context; Team wrappers include hashed Team identity and key epoch and no surface exposes raw Project keys.
    depends_on: [models.ProjectKeyWrapper, examples.project_key_wrappers]
  - id: projects.links.openmates-only-encrypted
    type: privacy
    must: Project item links and object associations store encrypted target ids and display metadata plus safe hashes; linking never copies private object content or silently creates remote-source authority.
    depends_on: [models.ProjectItemLink, models.ProjectObjectAssociation, examples.project_item_links]
  - id: projects.association.safe-metadata-encrypted-authority
    type: invariant
    must: Specification, Plan, Task, and Check Project associations expose only hashed Project routing metadata to the server while encrypted linked Project ids and Project-scoped key wrappers remain the client-authoritative private association data.
    depends_on: [models.ProjectObjectAssociation, examples.project_item_links]
  - id: projects.workspace.contract-plan-task-check-chain
    type: behavior
    must: Projects can organize Specifications, Plans, Tasks, and materialized Checks together while each linked object retains its own canonical revision, lifecycle, permissions, and history.
    depends_on: [models.ProjectItemLink.item_type, models.ProjectItemPresentation, examples.project_work_chain]
  - id: projects.surfaces.catalog-reused
    type: invariant
    must: A Project owns one encrypted versioned Surface Catalog with stable ids that Specifications, Requirements, flows, and Checks reference without copying definitions; approved revisions retain historical labels, deprecated surfaces remain resolvable, and a Specification linked into another Project keeps its home Project catalog semantics.
    depends_on: [models.ProjectSurfaceCatalog, models.ProjectSurfaceCatalogRevision, models.ProjectSurfaceDefinition, examples.project_surface_catalog]
  - id: projects.checks.lazy-materialization
    type: invariant
    must: Test catalog entries do not become Project items automatically; only explicitly created or promoted Checks can be linked and rendered in a Project.
    depends_on: [examples.project_check_catalog]
  - id: projects.items.responsive-embeds
    type: behavior
    must: Linked Specifications, Plans, Tasks, and Checks have type-appropriate previews and open stable nested fullscreen detail; larger viewports may use split detail and compact viewports use accessible fullscreen overlays without losing Project state.
    depends_on: [models.ProjectItemPresentation, examples.project_item_presentation, applies_to.gui]
  - id: projects.uploads.project-wrapped
    type: privacy
    must: Files imported into a Project remain client-encrypted embeds with owner and Project wrappers before their item link is accepted.
    depends_on: [models.ProjectItemLink, examples.project_uploads]
  - id: projects.surface.semantic-parity
    type: parity
    must: REST, CLI, SDK, and web preserve explicit context, encrypted CRUD, wrappers, item links, object ownership, destructive confirmation, and visible failures wherever Project operations are exposed.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api:
    required: true
    role: First-party authenticated routes own encrypted Project storage, context authorization, item links, history, wrappers, and destructive confirmations.
  cli:
    required: true
    parity: semantic
    requirements:
      - Create, list, inspect, organize, link, unlink, archive, restore, and delete Project items with explicit context.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
        requirements:
          - id: projects.gui.workspace
            elements: [project_header, folders, filters, search, item_grid_or_list, recent_activity]
            interactions: [create_item, link_existing_item, move_item, filter_by_type, open_item, archive_project]
            states: [loading, empty, populated, archived, permission_denied, error]
          - id: projects.gui.object-previews
            elements: [type_icon, title, object_status, relationship_summary, updated_time]
            interactions: [open_fullscreen, open_related_object]
          - id: projects.gui.object-detail
            elements: [object_owned_header, object_sections, related_links, history]
            interactions: [object_owned_actions, close_to_same_project_state]
            accessibility: [semantic_item_types, keyboard_list_navigation, non_color_status, focus_restored_on_close]
            responsive_behavior: [split_detail_when_space_allows, fullscreen_overlay_on_compact_viewports]
            design_references: optional
      apple: {required: false}
    exceptions:
      - id: apple-project-authoring-deferred
        implementation: apple
        reason: Full mixed-object Project organization starts on web.
        equivalent_outcome: Apple must preserve encrypted Project context, object identity, lifecycle ownership, and accessible detail when implemented.

examples:
  file: examples.yml
  required_groups: [project_contexts, project_key_wrappers, project_item_links, project_surface_catalog, project_work_chain, project_check_catalog, project_item_presentation, project_uploads, project_surface_parity]
