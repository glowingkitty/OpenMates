schema_version: 1
specification: feature.app-skill.design-embroidery@1

convert:
  - id: generated-logo-to-machine-files
    given: The assistant drew a three-colour fox logo as a vector graphic earlier in the chat.
    when: The user asks "make this ready for our embroidery machine, 9 cm wide" and the assistant calls design.embroidery with that graphic and width_mm 90.
    then: >
      One result appears with a stitch preview of the fox, the size 90 x 74 mm, the stitch count, three threads in
      sewing order, an estimated sewing time, and downloads for DST, PES, EXP, JEF and VP3. No model was called for
      the preparation because the graphic had no findings. The same result content arrives in a CLI chat.
  - id: svg-code-embed-as-source
    given: The assistant wrote a simple star as an SVG code block in the chat a minute ago.
    when: The assistant calls design.embroidery with the reference of that code embed and no width.
    then: The star is converted at the default width of 100 mm and the result lists all five machine files.
  - id: drawn-and-prepared-in-one-reply
    given: A user uploaded a photo of an embroidered cat face.
    when: >
      The user asks in one message to redraw it as a mirrored single-colour vector graphic and to prepare it for the
      embroidery machine, 9 cm wide. The assistant creates the graphic and then calls design.embroidery with the
      reference of that new graphic in the same reply.
    then: The graphic created a moment ago is accepted as source and one embroidery result 90 mm wide appears in that reply.

uploaded_svg:
  - id: own-svg-file-is-sewn-as-uploaded
    given: The user attaches their own file fire-tail.svg and asks for a sew-on patch with a 3 mm black border, as large as the 200 × 300 hoop allows.
    when: The assistant calls design.embroidery with that file as the source.
    then: The uploaded drawing itself is converted, with its own shapes and colours. No new graphic is generated in between, and the result names the border and the hoop fit.

invalid_source:
  - id: photo-is-not-a-vector
    given: The user uploaded a photo "dog.jpg".
    when: The assistant calls design.embroidery with dog.jpg as source.
    then: >
      The call fails with the message that embroidery needs a vector graphic and that the image must first be turned
      into one. No sandbox is started, no result with downloads appears and no credits are charged.

prepare:
  - id: overlap-background-and-colour-order
    given: >
      A graphic with a cream square covering the whole canvas, a yellow circle, a red heart lying fully on the
      circle, and 24 small stars in 6 colours that do not touch each other.
    when: It is converted with default settings.
    then: >
      The cream square is not sewn and the notes say "Background left out". The yellow circle has no stitches under
      the heart. The 24 stars are sewn in 6 thread changes, one per colour, instead of 24. Converting the same
      graphic again gives the same stitch count and thread order.
  - id: lines-by-width
    given: A graphic with a 2.5 mm wide blue wave and a 0.4 mm dark frame.
    when: It is converted.
    then: The wave is sewn as a satin band about 2.5 mm wide and the frame as a single running-stitch line.

sewn_width:
  - id: line-drawing-sews-at-the-width-asked-for
    given: A cat face drawn only with 2 mm wide lines that have rounded ends, requested 90 mm wide. Sewn as satin bands it first comes out 88.0 mm wide.
    when: The conversion runs; the first pass takes about four seconds.
    then: The graphic is prepared again slightly larger and converted a second time. The delivered files and the result say 90.0 mm wide.
  - id: filled-design-is-not-converted-twice
    given: A filled cat face requested 90 mm wide that sews 90.4 mm wide.
    when: The conversion runs.
    then: It is converted once; the result says 90.4 mm wide.

separate_shapes:
  - id: whiskers-are-not-joined-by-a-stitch
    given: A black cat face 90 mm wide whose three whiskers on each side are separate filled bands about 2 mm wide and 1 to 2 mm apart, drawn as one element.
    when: It is converted.
    then: Each whisker is sewn on its own with a trim after it, so no thread runs from one whisker to the next.
  - id: touching-shapes-need-no-trim
    given: A nose and a mouth of the same colour that touch each other.
    when: They are converted.
    then: They are sewn as one area without a trim between them.

drawn_lines:
  - id: cat-face-lines-are-sewn-across
    given: A pink cat face 90 mm wide made of filled outlines - two arched closed eyes and six straight whiskers, each about 4 mm wide, and a triangular nose with two mouth curves hanging on it.
    when: It is converted.
    then: >-
      The eyes, the whiskers and the two mouth curves are sewn as satin bands: every stitch lies straight across the line and
      turns with the arch. The nose triangle stays a filled area. The design needs about 1,900 stitches instead of about 2,400.
  - id: ring-and-wedge-stay-filled
    given: A dark ring 2 mm wide around a pink spot, and a flame tip that narrows from 5 mm to a point.
    when: They are converted.
    then: Both are sewn as filled areas exactly as before; nothing shifts and no fabric shows beside the spot.

border:
  - id: flame-patch-with-black-border
    given: >
      An orange flame ornament with dark spots, with curled ends whose inner openings are 4 to 9 mm wide at the
      sewn size.
    when: The assistant calls design.embroidery with width_mm 120 and border_mm 3.
    then: >
      A black band exactly 3 mm wide runs around the whole flame and is sewn first; the flame overlaps it slightly.
      The openings narrower than 6 mm are filled black, the wider ones stay open. The result is 126 mm wide, lists
      black as the first thread and its notes say "Border of 3 mm added for sewing on". The transparent stitch
      preview shows the flame with its border and nothing around it.
  - id: no-border-by-default
    given: The same flame ornament.
    when: The assistant calls design.embroidery with width_mm 120 and no border_mm.
    then: The result is 120 mm wide, has no black thread for a border and its notes do not mention a border.

fit_hoop:
  - id: tall-ornament-fills-the-200x300-hoop
    given: >
      A tall flame ornament, about 90 mm wide and 170 mm high as drawn, and a user who owns a 200 x 300 mm hoop
      and wants the piece as large as possible with a thin black border.
    when: The assistant calls design.embroidery with hoop "200x300", fit_hoop true and border_mm 3.
    then: >
      The result is about 298 mm high and about 160 mm wide including the border, which is still 3 mm wide. It
      fits the hoop and its notes say "Sized to fill the hoop" and "Border of 3 mm added for sewing on".
  - id: fit-without-a-hoop-is-rejected
    given: The same ornament.
    when: The assistant calls design.embroidery with fit_hoop true and no hoop.
    then: Nothing is converted or charged; the assistant is told that fit_hoop needs a hoop.

rework:
  - id: gradient-and-tiny-text
    given: A badge graphic with a blue-to-green gradient and a line of live text 0.8 mm high.
    when: It is converted at 60 mm width.
    then: >
      The fixed check reports the gradient, the live text and the small detail. One model rework returns a graphic
      with flat colours and the text either drawn as shapes or left out. The result notes say "Gradients and filters
      replaced by flat colours" and "Text redrawn as shapes or left out". The charge includes that model call.
  - id: instructions-trigger-rework
    given: A clean two-colour leaf graphic without findings.
    when: The assistant calls design.embroidery with instructions "sew the outline as a thick satin border".
    then: One model rework applies the wish before the fixed rules run, and the notes mention the changed outline.

failure:
  - id: too-many-stitches
    given: A dense full-area illustration requested at 400 mm width.
    when: The stitch plan would exceed 150000 stitches.
    then: >
      The result shows that the design is too large to sew in one piece and suggests a smaller width. No machine
      files are offered and nothing is charged.
  - id: nothing-to-sew
    given: A graphic that contains only a full-canvas background rectangle.
    when: It is converted.
    then: The result fails with "Nothing to sew after leaving out the background" and offers no downloads.

view:
  - id: open-result-and-download-pes
    given: A finished fox result in a web chat.
    when: The user opens it and presses the PES download.
    then: >
      The opened view shows the large stitch preview, a switch to the prepared graphic, three thread rows with colour
      swatch, name, thread length and minutes, the numbers, "Fits hoop 130 x 180 mm", a large "Download all formats (ZIP)"
      button directly under the preview and five single-format downloads. The browser saves a file ending in ".pes";
      pressing the large button saves one ".zip" file holding all five machine files.
  - id: change-size-starts-new-conversion
    given: The same opened fox result at 90 mm.
    when: The user changes the width to 60 mm, picks the fabric "stretchy", sets the border to 3 mm and applies.
    then: >
      A follow-up request for a new conversion of the same graphic at 60 mm for stretchy fabric with a 3 mm border is sent to the
      assistant. The 90 mm result stays in the chat unchanged and a second result appears when the new conversion ends.
  - id: failed-result
    given: A conversion that failed because the design had too many stitches.
    when: The user looks at the result card and opens it.
    then: The card and the opened view show the reason in plain words and no download buttons.
  - id: sewing-times-are-marked-as-estimates
    given: A finished result with 47,067 stitches in four threads (14,301, 22,046, 8,783 and 1,937 stitches).
    when: The user opens the result.
    then: >
      The card in the chat reads "160 × 298 mm · ~1 h 42 min" followed by the thread length in metres, and no stitch
      count. Opened, the estimated sewing time reads ~1 h 42 min, the thread list shows the metres of thread and
      about 30, 46, 19 and 5 minutes beside the four threads, and a short remark below the list says that sewing
      time and thread length are estimates which vary with the machine and its settings.

billing:
  - id: plain-conversion-one-minute
    given: A conversion without model rework that keeps the sandbox running for 21 seconds.
    when: The result is delivered.
    then: The user is charged 5 credits.
  - id: long-conversion-charged-in-full
    given: >
      A user with 20 credits and a large detailed design that keeps the sandbox running for 7 minutes and
      10 seconds.
    when: The result is delivered.
    then: >
      The conversion started because 20 credits cover the three reserved minutes. The user is charged 40 credits
      for 8 started minutes and the balance is 20 credits below zero until credits are bought again.
  - id: rework-adds-tokens
    given: A conversion with one model rework and 48 seconds of sandbox time.
    when: The result is delivered.
    then: The user is charged 5 credits plus the credits for that model call's reported input and output tokens.
