schema_version: 1
id: feature.app-skill.events-search
version: 1
status: draft
title: Events Search
summary: Conference schedule search retains supported licensed schedules; general event discovery is unavailable.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
  - Known supported conference schedules, optional topics, dates and past-session filtering.
  - Generic saved event cards, grouped results, source safety and cross-surface parity.
  - Explicit unavailable general discovery and unsupported-provider requests without fallback.
  excludes:
  - Ticket purchasing or RSVP mutation
  - Private attendee data or authenticated organizer management
  - General web search fallback after an events provider error

models:
  EventsSearchRequest:
    requests: {type: array, required: true, items: EventsSearchRequestItem, constraints: {min_items: 1}}
    provider: {type: string, nullable: true, default: auto}
    providers: {type: array, nullable: true, items: string}

  EventsSearchRequestItem:
    id: {type: string_or_integer, nullable: true}
    query: {type: string, nullable: true}
    location: {type: string, nullable: true}
    lat: {type: number, nullable: true}
    lon: {type: number, nullable: true}
    start_date: {type: iso_8601_datetime, nullable: true}
    end_date: {type: iso_8601_datetime, nullable: true}
    event_type: {type: enum, nullable: true, values: [PHYSICAL, ONLINE]}
    count: {type: integer, default: 10, constraints: {minimum: 1, maximum: 50}}
    provider: {type: string, nullable: true}
    providers: {type: array, nullable: true, items: string}
    conference: {type: string, nullable: true, constraints: {supported_values: [GPN24, 39C3, 38C3, 37C3]}}
    past_events: {type: boolean, default: false}
    relevance_criteria: {type: string, nullable: true, constraints: {trim: true, blank: treat_as_omitted, max_length: 1000}}

  EventResult:
    title: {type: string, required: true, constraints: {blank: false}}
    url: {type: absolute_http_or_https_url, required: true}
    provider: {type: string, required: true}
    date_start: {type: iso_8601_datetime, required: true}
    date_end: {type: iso_8601_datetime, nullable: true}
    description: {type: external_text, nullable: true, constraints: {semantic_scan_before_ai_context: true}}
    venue: {type: object, nullable: true}

  EventsSearchResponse:
    results: {type: array, required: true, items: grouped_event_results}
    provider: {type: string, required: true}
    providers: {type: array, required: true, items: string, constraints: {lists_queried_providers: true}}
    suggestions_follow_up_requests: {type: array, nullable: true, items: string}
    error: {type: string, nullable: true, constraints: {safe: true, secrets: forbidden}}

  EventsSearchRelevanceRanking:
    candidate_retrieval:
      type: bounded_merged_provider_pool
      required: true
      constraints: {when_criteria_present_target: max_40_or_requested_count, hard_filters_before_ranking: true, cross_provider_deduplication: true, provider_shortfall: return_smaller_pool, when_criteria_absent: existing_provider_fetch_behavior}
    decision:
      type: typesafe_jev_scores
      required: true
      constraints: {event_goal_evidence: required, query_topic_fit: required, title_keyword_overlap_alone: insufficient, missing_organizer_or_format_facts: unknown, minimum_retained_score: weak_related_fit, below_minimum_omitted: true, candidate_text: untrusted_data}
    fallback:
      type: deterministic
      required: true
      constraints: {ranking_failure: existing_event_order, final_count: requested_count, output_safety_after_selection: required}

  EventsSearchAutoProviderRouting:
    eligibility:
      type: deterministic
      required: true
      constraints: {explicit_selection_bypasses_semantic_routing: true, region_and_capability_gates_first: true, known_conference_routing: deterministic, location_free_online_compatibility: required}
    specialist_selection:
      type: deterministic_or_typesafe_jev
      required: true
      constraints: {auto_only: true, candidates: eligible_specialists_only, obvious_intent: deterministic, ambiguous_intent: one_bounded_multi_select_decision}
    fallback:
      type: deterministic
      required: true
      constraints: {decision_failure: continue_general_search, raw_diagnostics: forbidden, explicit_selection_unchanged: true}

assertions:
- id: events-search.request.validated
  type: validation
  must: A current search needs a known supported conference schedule, with optional topic, date, type and count
    filters. Malformed independent items fail visibly without blocking valid conference requests. A general topic
    or location alone does not trigger a replacement event source.
  depends_on:
  - examples.boundary_and_history
- id: events-search.providers.explicit
  type: behavior
  must: Explicit providers never broaden to auto discovery. Current provider routing admits only supported conference
    schedule sources, reports unsupported choices visibly and lists only queried sources.
  depends_on:
  - examples.boundary_and_history
- id: events-search.results.actionable
  type: invariant
  must: Returned conference sessions and saved event cards retain nonblank titles, usable source links, dates and
    recorded venue facts. Invalid source items are omitted without inventing missing actionable URLs; groups remain
    count-bounded.
  depends_on:
  - examples.boundary_and_history
- id: events-search.relevance.activation
  type: behavior
  must: For a supported conference request, optional nonblank relevance criteria reflect an explicit user goal without
    invented preferences. Without criteria, schedule retrieval and deterministic order remain unchanged and no candidate-ranking
    decision occurs.
  depends_on:
  - examples.boundary_and_history
- id: events-search.relevance.bounded-candidates
  type: invariant
  must: Nonblank relevance criteria rank only a bounded pool from a supported conference schedule after hard topic,
    date, type and conference filters. Duplicates do not inflate the pool and final groups remain count-bounded
    without replacement discovery or fabricated sessions.
  depends_on:
  - examples.boundary_and_history
- id: events-search.relevance.evidence-ranking
  type: behavior
  must: Conference candidate ranking uses explicit topic and goal evidence only. Missing format or organizer facts
    remain unknown, structured exclusions cannot reenter, and unrelated sessions do not pad the final group.
  depends_on:
  - examples.boundary_and_history
- id: events-search.relevance.safe-fallback
  type: failure
  must: Conference candidate text is untrusted. Failed, rejected, incomplete or timed-out ranking retains safe deterministic
    schedule order and inherited output safety without exposing raw diagnostics.
  depends_on:
  - examples.boundary_and_history
- id: events-search.conference.supported
  type: behavior
  must: Supported GPN and Congress schedules accept conference-only requests, preserve supplied topics and dates
    and exclude past sessions by default. A known conference routes only to its permitted schedule source.
  depends_on:
  - examples.boundary_and_history
- id: events-search.output.sanitized
  type: security
  must: Conference titles, descriptions and selected external text receive inherited output safety before exposure
    or inference. Historical event result schemas remain readable without restoring retired discovery sources.
  depends_on:
  - examples.boundary_and_history
- id: events-search.surface-parity
  type: parity
  must: REST, CLI, npm/pip SDKs and web/Apple preserve the same supported-conference filters, grouped sessions,
    safe errors and historical event schemas. General discovery is unavailable consistently across these surfaces.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups:
  - boundary_and_history

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in the current Codex task
    on 2026-10-24. This records scope authorization, not exact-fingerprint approval.
  review_status: Changed fingerprint has not been separately approved; approval artifact gate remains for the coordinator.
