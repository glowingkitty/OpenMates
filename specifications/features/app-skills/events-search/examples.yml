schema_version: 1
specification: feature.app-skill.events-search@1
boundary_and_history:
- id: events-search-request-validated
  given: Alice requests a known conference schedule and separately a general event near her city.
  when: The batch is validated and routed.
  then: The known schedule runs from its official source and the general request is answered from public web pages,
    each group listing only the sources it queried.
  assertion_ids:
  - events-search.request.validated
  - events-search.discovery.web-pages
- id: events-search-providers-explicit
  given: Alice explicitly selects an unavailable event provider.
  when: Events search processes that request.
  then: It returns an error without invoking another source or pretending that zero events matched.
  assertion_ids:
  - events-search.providers.explicit
- id: events-search-results-actionable
  given: A conference schedule contains one valid session and one entry without an actionable URL.
  when: The sessions are normalized.
  then: The valid session remains and the invalid entry is omitted without fabricating a link.
  assertion_ids:
  - events-search.results.actionable
- id: events-search-relevance-activation
  given: Alice asks for sessions on a topic without any ranking goal.
  when: The supported conference is searched.
  then: The request preserves schedule ordering and makes no relevance-ranking decision.
  assertion_ids:
  - events-search.relevance.activation
- id: events-search-relevance-bounded-candidates
  given: A supported conference offers fewer sessions than the requested result count.
  when: The bounded candidates are filtered and ranked.
  then: The result stays smaller rather than adding unrelated events or fetching another platform.
  assertion_ids:
  - events-search.relevance.bounded-candidates
- id: events-search-relevance-evidence-ranking
  given: A robotics goal yields a hands-on robotics session and an unrelated general talk.
  when: The supported conference candidates are ranked.
  then: The relevant session can remain while unrelated material is omitted without invented format evidence.
  assertion_ids:
  - events-search.relevance.evidence-ranking
- id: events-search-relevance-safe-fallback
  given: A valid schedule is available but its ranking decision times out.
  when: The request finalizes.
  then: The supported sessions remain in deterministic order with no raw model error.
  assertion_ids:
  - events-search.relevance.safe-fallback
- id: events-search-conference-supported
  given: Alice selects a supported Congress schedule and leaves topic blank.
  when: The schedule is searched with past_events omitted.
  then: Current or future sessions can return in the requested group and past sessions remain excluded.
  assertion_ids:
  - events-search.conference.supported
- id: events-search-output-sanitized
  given: A conference description contains an instruction to disclose private chat data.
  when: The result is prepared for display and the assistant.
  then: The external text cannot authorize an action and required safety processing remains active.
  assertion_ids:
  - events-search.output.sanitized
- id: events-search-surface-parity
  given: Alice requests the same supported schedule through REST and CLI and opens its saved cards on web.
  when: The request succeeds using the conference source.
  then: The filters, result groups and source evidence agree on every surface.
  assertion_ids:
  - events-search.surface-parity
billing:
- id: events-search-billing-web-usage
  given: Alice asks for open source conferences in Europe and the web source answers with one web search request and
    Mercury 3 reading five pages (24,868 input and 6,800 output tokens) at its regular price.
  when: The request item succeeds with results.
  then: The item costs 10 credits for the search plus 7.46 and 7.12 token credits, floored to 24 credits; a second
    item that failed costs nothing, and an item answered only by an official schedule costs 1 credit.
  assertion_ids:
  - events-search.billing.usage
- id: events-search-billing-prices-unavailable
  given: The pricing lookup fails.
  when: Alice runs a general event search.
  then: The web is not searched, the item reports that web results are unavailable, and nothing is charged for it.
  assertion_ids:
  - events-search.billing.usage
