schema_version: 1
specification: feature.app-skills.design-figma@2
connection:
  - id: default-connect
    given: {provider: figma, capabilities: [read]}
    expect: {scopes: [file_content:read, file_metadata:read, current_user:read], pkce: S256, state_single_use: true, token_in_browser_url: false}
  - id: enable-variables
    given: {provider: figma, granted_scopes: [file_content:read, file_metadata:read, current_user:read], enable: variables}
    action: reconnect
    expect: {scopes_added: [file_variables:read], labelled: Figma Enterprise only, silent_upgrade: false}
  - id: not-configured
    given: {provider: figma, vault_client_id: null}
    action: start_connect
    expect: {status: 503, error: figma_oauth_not_configured}
  - id: penpot-cloud-token
    given: {provider: penpot, instance_url: 'https://design.penpot.app', access_token: synthetic-penpot-token}
    action: connect
    expect: {verified_with: get-profile, stored: client_encrypted, server_copy: false, full_access_warning_shown: true}
  - id: penpot-self-hosted
    given: {provider: penpot, instance_url: 'https://penpot.example.org'}
    expect: {accepted: true, address_check: public_only}
  - id: penpot-private-address
    given: {provider: penpot, instance_url: 'https://10.0.0.5'}
    expect: {error: penpot_instance_not_allowed, request_sent: false}
lifecycle:
  - id: figma-revoked-refresh-token
    given: {provider: figma, refresh_response: {status: 400, error: invalid_grant}}
    action: get_design
    expect: {status: reconnect_required, provider_called: false}
  - id: figma-superseded-access-token
    given: {provider: figma, figma_response: {status: 403, message: Invalid token}}
    expect: {error: figma_token_superseded, retryable: true, reconnect_required: false}
  - id: penpot-token-expired
    given: {provider: penpot, penpot_response: {status: 401}}
    action: get_design
    expect: {status: reconnect_required}
  - id: disconnect
    action: disconnect
    expect: {connector_status: revoked, server_access_enabled: false, used_in_later_turns: false, user_told_to_remove_access_at_provider: true}
outline:
  - id: whole-file-link
    given: {url: 'https://www.figma.com/design/AbCdEf123/Shop'}
    action: get_design
    expect: {mode: outline, calls: ['GET /v1/files/AbCdEf123?depth=3'], styles: absent, text_content: absent}
  - id: large-file
    given: {pages: 4, frames: 420}
    expect: {frames_listed: 150, per_page_max: 60, remaining_counted_per_page: true}
  - id: request-too-large
    given: {figma_response: {status: 400, message: Request too large}}
    expect: {retried_once_at_depth: 2, reported: true}
  - id: penpot-file
    given: {url: 'https://design.penpot.app/#/workspace?team-id=T&file-id=F&page-id=P'}
    expect: {mode: outline, calls: [get-file], boards_listed_per_page: true}
reads:
  - id: url-with-node
    given: {url: 'https://www.figma.com/design/AbCdEf123/Landing?node-id=12-34'}
    expect: {mode: read, node_ids: ['12:34'], calls: ['GET /v1/files/AbCdEf123/nodes'], outline_call: false}
  - id: branch-url
    given: {url: 'https://www.figma.com/design/AbCdEf123/branch/BrAnCh9/Landing'}
    expect: {file_id: BrAnCh9}
  - id: chosen-frames
    given: {mode: read, node_ids: ['1:2', '1:3'], provider: figma}
    expect: {calls: 1, vector_geometry: false}
  - id: penpot-boards
    given: {mode: read, provider: penpot, node_ids: [B1, B2]}
    expect: {calls: ['get-page with objectId set']}
  - id: inaccessible-file
    given: {provider_response: {status: 404}}
    expect: {error: not_found, empty_design: false}
  - id: unknown-node
    given: {node_ids: ['1:2', '9:99'], provider_nodes: {'9:99': null}}
    expect: {nodes_returned_for: ['1:2'], reported_unknown: ['9:99']}
budget:
  - id: node-cap
    given: {node_count: 2000}
    expect: {nodes_returned: 800, truncated: {nodes_omitted: 1200, reason: node_budget}, how_to_continue: narrower node id}
  - id: repeated-instances
    given: {instances_of: {Card: 48}}
    expect: {shown_once: true, count: 48}
  - id: long-text
    given: {text_length: 4000}
    expect: {characters_returned: 500, cut_marked: true}
selection:
  - id: assistant-picks
    given: {outline_frames: 24, user: Build the checkout screens}
    expect: {jev_called: false, assistant_reads: ['frames named Checkout*'], max_node_ids: 10}
  - id: jev-ranking-large-file
    given: {outline_frames: 420, user: Build the checkout screens}
    expect: {jev_called: true, jev_input: ['frame names', 'page names', sizes], ranked_by: jev_relevance, checkout_frames_listed_first: true}
  - id: jev-unavailable
    given: {outline_frames: 420, jev: timeout}
    expect: {ranked_by: file_order, result_returned: true}
  - id: ambiguous-whole-file
    given: {outline_frames: 60, user: Build this file}
    expect: {assistant_asks_which_screens: true, reads_before_answer: 0}
tokens:
  - id: figma-variables-plan-limited
    given: {variables_capability: true, figma_variables_response: {status: 403, message: Limited by Figma plan}}
    expect: {tokens: {status: plan_limited}, frames_returned: true}
  - id: figma-variables-not-granted
    given: {variables_capability: false, include: [tokens]}
    expect: {tokens: {source: styles, variables_status: not_granted}}
  - id: penpot-design-tokens
    given: {provider: penpot, token_sets: [{name: brand, tokens: {primary: {$type: color, $value: '#3355ff'}}}]}
    expect: {tokens_css_contains: '--brand-primary: #3355ff;'}
assets:
  - id: figma-export-to-project
    given: {provider: figma, node_ids: ['1:2', '1:3'], format: png, scale: 2, destination: project_files}
    expect: {calls: ['GET /v1/images/AbCdEf123'], stored_as: project_files, provider_urls_in_result: false}
  - id: figma-null-render
    given: {figma_images: {'1:2': null}}
    expect: {reported_per_node: true}
  - id: penpot-thumbnails-only
    given: {provider: penpot, node_ids: [B1], format: png}
    expect: {source: get-file-object-thumbnails, marked: thumbnail, full_render: not_supported}
limits:
  - id: view-seat-rate-limit
    given: {figma_response: {status: 429, headers: {Retry-After: '86400', X-Figma-Plan-Tier: starter, X-Figma-Rate-Limit-Type: low}}}
    expect: {error: rate_limited, retry_after_seconds: 86400, rate_limit_type: low, automatic_retry: false}
  - id: unchanged-version-reused
    given: {earlier_read_in_chat: {file_version: '42'}, meta_version: '42'}
    expect: {calls: ['GET /v1/files/AbCdEf123/meta'], tier1_calls: 0, earlier_result_reused: true}
  - id: one-request-call-budget
    given: {mode: read, include: [structure, components, styles, tokens]}
    expect: {tier1_calls: 1, variables_calls: 1}
handoff:
  - id: tokens-from-styles
    given: {styles: [{name: Brand/Primary, type: FILL, color: '#3355FF'}]}
    expect: {tokens_css_contains: '--brand-primary: #3355ff;', tokens_dtcg: true, invented_values: false}
  - id: build-in-project
    given: {user: Implement this Figma design in my Project's web app, project_tokens: ['--color-primary']}
    expect: {outline_then_read: true, assets_exported_to_project_files: true, token_mapping: {'--brand-primary': '--color-primary'}, duplicates_added: false}
  - id: own-development
    given: {surface: cli, user: developer agent, url: 'https://www.figma.com/design/AbCdEf123/App-UI?node-id=5-6'}
    expect: {mode: read, structured_result: true}
neutral:
  - id: same-shape-both-providers
    given: {providers: [figma, penpot]}
    expect: {result_fields_identical: true, provider_only_in: ['file.provider', 'node.ref']}
  - id: edit-not-in-this-version
    given: {user: Change the button colour in my Figma file}
    expect: {skill_available: false, assistant_explains: true}
surfaces:
  - id: cli-get-design
    given: {account_connected_on_web: true}
    action: cli_chat_get_design
    expect: {structured_result: true, permission_prompt: true}
  - id: no-developer-api
    given: {api_key: developer}
    action: post_design_get_design
    expect: {status: 404}
