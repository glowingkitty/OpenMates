schema_version: 1
specification: feature.app-skill.trademark-search@1
boundary_and_history:
- id: trademarks-request
  given: Alice submits two candidate names for US and EU checks.
  when: No permitted trademark provider is configured.
  then: The skill reports unavailable and neither region is queried or silently substituted.
  assertion_ids:
  - trademarks.request
- id: trademarks-coverage
  given: Alice asks whether a name is clear in Germany.
  when: The check is unavailable.
  then: She receives an explicit coverage limitation and no legal-clearance claim.
  assertion_ids:
  - trademarks.coverage
- id: trademarks-evidence
  given: A saved result contains a registered name and its goods description.
  when: Alice reopens the result.
  then: The saved evidence and preliminary-search limitation remain visible without a new registry query.
  assertion_ids:
  - trademarks.evidence
- id: trademarks-parity
  given: Alice attempts a check through REST and opens a prior saved result on web.
  when: The source is unavailable.
  then: The new call fails visibly while the saved evidence remains readable.
  assertion_ids:
  - trademarks.parity
- id: brand-naming-activation
  given: Alice says she needs a calm name for a budgeting app for freelancers.
  when: The naming focus activates.
  then: The assistant uses those details without repeating a long intake.
  assertion_ids:
  - brand-naming.activation
- id: brand-naming-flow
  given: Alice selects two shortlisted names and asks which is legally available.
  when: Domain and trademark checks are unavailable.
  then: The assistant states the limits, may present sourced web conflicts, and never claims legal clearance.
  assertion_ids:
  - brand-naming.flow
