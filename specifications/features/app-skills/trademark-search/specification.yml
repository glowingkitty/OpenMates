schema_version: 1
id: feature.app-skill.trademark-search
version: 1
status: draft
title: Regional Trademark Search and Brand Naming
summary: Trademark and domain checks are unavailable; saved preliminary evidence and concise brand brainstorming
  remain usable.

inherits: [architecture.app-skill-execution@1, architecture.platform-parity@1, feature.focus-modes@3]
scope:
  includes:
  - Explicit unavailable trademark checks without any regional substitute or replacement source.
  - Generic saved trademark evidence and coverage rendering.
  - Concise brand-name brainstorming with honest limits on external verification.
  excludes:
  - Paid providers, access-challenge bypass, bulk crawling and legal clearance.
  - Automated EU, German or worldwide searches before a permitted provider is verified.

assertions:
- id: trademarks.request
  type: validation
  must: Preserve the typed candidate-name, region, Nice-class, status, matching and limit request schema. Current
    trademark requests return explicit unavailable errors without provider calls or claims of completed checks.
  depends_on:
  - examples.boundary_and_history
- id: trademarks.coverage
  type: invariant
  must: All current trademark regions are unavailable. Distinguish this from completed zero-match searches and preserve
    saved query, region, count, partial and error evidence without inventing regional coverage.
  depends_on:
  - examples.boundary_and_history
- id: trademarks.evidence
  type: security
  must: Saved names, numbers, owners, classes, goods, status, dates and source links remain tied to their original
    evidence. Unknown facts stay unknown and preliminary results or no matches never establish legal availability.
  depends_on:
  - examples.boundary_and_history
- id: trademarks.parity
  type: behavior
  must: REST, CLI, npm/pip SDKs and web preserve explicit unavailable checks and the generic saved matches, regional
    coverage, zero-result, partial and error schemas.
  depends_on:
  - examples.boundary_and_history
- id: brand-naming.activation
  type: behavior
  must: A request for help naming a product activates Business Find a brand name through the shared focus lifecycle.
    Reuse supplied facts and ask concise questions only for missing product, audience, market, language or naming
    preferences.
  depends_on:
  - examples.boundary_and_history
- id: brand-naming.flow
  type: behavior
  must: Offer a small varied shortlist and rationale, then let the user select finalists. Clearly disclose unavailable
    trademark and domain checks; permitted web search may supply sourced conflicts but cannot imply legal clearance
    or checked domain availability. Keep brainstorming separate from verified evidence.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false, reason: Native specialized trademark renderer is outside this requested CLI SDK and web slice.}
examples:
  file: examples.yml
  required_groups:
  - boundary_and_history

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in the current Codex task
    on 2026-10-24. This records scope authorization, not exact-fingerprint approval.
  review_status: Changed fingerprint has not been separately approved; approval artifact gate remains for the coordinator.
