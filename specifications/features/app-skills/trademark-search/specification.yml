schema_version: 1
id: feature.app-skill.trademark-search
version: 1
status: draft
title: Regional Trademark Search and Brand Naming
summary: Bounded free trademark searches with explicit regional coverage, followed by concise assisted brand naming.
inherits: [architecture.app-skill-execution@1, architecture.platform-parity@1, feature.focus-modes@3]
scope:
  includes:
    - Business trademark name search with explicit regions and optional Nice classes.
    - Free no-key USPTO website JSON reads and transparent unsupported-region results.
    - Authenticated REST, CLI, npm and pip SDKs, and web preview and fullscreen.
    - A concise Business Find a brand name focus mode and a real natural-language CLI conversation.
  excludes:
    - Paid providers, access-challenge bypass, bulk crawling and legal clearance.
    - Automated EU, German or worldwide searches before a permitted provider is verified.
assertions:
  - id: trademarks.request
    type: validation
    must: Accept one to three nonblank candidate names of at most 120 characters, explicit regions US/EU/DE/WORLDWIDE, up to ten integer Nice classes 1–45, active/all status, exact/similar matching, and one to twenty records per name and region. Reject invalid input without provider calls.
  - id: trademarks.coverage
    type: invariant
    must: Route each requested region to its configured source. US uses USPTO; unconfigured regions return unsupported with a manual official source. Never silently substitute US for another region. Preserve query, region, search time, count, truncation and partial/error status. A failed or unsupported search is distinct from a completed search with no matches.
  - id: trademarks.evidence
    type: security
    must: Return only provider-backed names, application and registration numbers, owners, classes, goods/services, status, dates and fixed-origin source links. Unknown facts remain unknown. Use inherited external-output safety. Display that results are preliminary and neither no matches nor spelling similarity proves legal availability.
  - id: trademarks.provider
    type: failure
    must: Use a free no-key HTTPS USPTO website endpoint with bounded pages, one request per second per worker and no retries or proxy fallback. Preserve readable records from partial responses, and report access restrictions, rate limits, invalid responses and outages safely. Send only submitted names and filters; do not log raw queries, records or owner addresses.
  - id: trademarks.parity
    type: behavior
    must: Authenticated REST, CLI and npm/pip SDKs preserve the same evidence and coverage. Build and verify these before web embed components; build preview and fullscreen before the naming focus mode. Web surfaces show saved matches, sources and region coverage, including zero results, partial and error states.
  - id: brand-naming.activation
    type: behavior
    must: Help me find a name for my new product activates Business Find a brand name through the shared focus lifecycle. Use concise instructions and reuse facts already supplied; ask a compact intake for missing product, audience, target markets, language and naming preferences without an extended questionnaire.
  - id: brand-naming.flow
    type: behavior
    must: Offer a small varied shortlist with brief rationale before external checks. Let the user choose two or three finalists, then check domain availability with Hosting, search relevant web conflicts and regional trademark records. Keep brainstorming and checked evidence distinguishable; compare finalists with evidence and coverage limits. Do not assert legal clearance, equate free domains with trademark availability, or run exhaustive checks on every brainstormed name.
applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: false, reason: Native specialized trademark renderer is outside this requested CLI SDK and web slice.}
examples:
  file: examples.yml
  required_groups: [request, coverage, evidence, provider, parity, naming]
approval_source:
  instruction: Direct user implementation request on 2026-10-11 authorizes these outcomes and ordering. No separate fingerprint approval is claimed.
