schema_version: 1
specification: feature.app-skill.travel-search@1

valid_inputs:
  - id: afternoon-db-train
    input:
      requests:
        - legs: [{origin: Rostock Hbf, destination: Berlin Südkreuz, date: "2026-08-14"}]
          transport_methods: [train]
          providers: [deutsche_bahn]
          min_departure_time: "16:20"
          max_departure_time: "16:45"
    expect: {provider_query_time: "16:20", result_window: "16:20-16:45"}
  - id: regional-transfer-optimization
    input:
      requests:
        - legs: [{origin: Berlin Hbf, destination: Hamburg Hbf, date: "2026-08-14"}]
          transport_methods: [train]
          providers: [deutsche_bahn]
          owned_passes: [deutschland_ticket]
          pass_only: true
          rail_products: [regional, regional_express]
          min_transfer_minutes: 15
    expect: {provider_result_preserved: true, optimized_result_additive: true}

invalid_inputs:
  - id: malformed-departure-time
    input: {requests: [{legs: [{origin: Berlin, destination: Hamburg, date: "2026-08-14"}], min_departure_time: afternoon}]}
    expect_error: {constraint: TravelSearchRequestItem.min_departure_time.format}

successful_outputs:
  - id: delayed-db-train
    output:
      source_provider: deutsche_bahn
      departure: "2026-08-14T16:34:00+02:00"
      arrival: "2026-08-14T19:23:00+02:00"
      legs:
        - departure: "2026-08-14T16:34:00+02:00"
          arrival: "2026-08-14T19:23:00+02:00"
          segments:
            - line: RE5
              departure_time: "2026-08-14T16:54:00+02:00"
              arrival_time: "2026-08-14T19:23:00+02:00"
              scheduled_departure_time: "2026-08-14T16:34:00+02:00"
              actual_departure_time: "2026-08-14T16:54:00+02:00"
              realtime_notes: [Technical disruption on the train]
    expect: {inside_requested_window: true, disruption_cause_specificity: source_only}
  - id: optimized-transfer-with-amenities
    output:
      source_provider: deutsche_bahn
      departure: "2026-08-14T08:00:00+02:00"
      arrival: "2026-08-14T12:00:00+02:00"
      legs:
        - departure: "2026-08-14T08:00:00+02:00"
          arrival: "2026-08-14T12:00:00+02:00"
          segments:
            - {line: RE1, departure_time: "2026-08-14T08:00:00+02:00", arrival_time: "2026-08-14T09:30:00+02:00"}
            - {line: RE2, departure_time: "2026-08-14T09:55:00+02:00", arrival_time: "2026-08-14T12:00:00+02:00"}
          layovers:
            - duration_minutes: 25
              overnight: false
              amenities:
                provider: Geoapify
                status: matched
                groups: {food_drink: {count: 2}, shops: {count: 1}, toilets: {count: 1}}
      transfer_quality: {min_transfer_minutes: 15, has_transfers: true, short_transfer_count: 0}
      optimization:
        optimized_by: openmates
        badge: Optimized by OpenMates
        original_transfer_station: Hannover Hbf
        optimized_transfer_station: Wolfsburg Hbf
        transfer_minutes: 25
        confidence: bounded_train_run_overlap
    expect: {normal_connection_shape: true, source_connection_also_present: true, amenities_used_for_route_selection: false}

error_outputs:
  - id: provider-unavailable
    output: {results: [], error: Deutsche Bahn search is temporarily unavailable.}
    forbidden: [successful_empty_state, invented_connections, raw_stack_trace]
  - id: amenity-provider-unavailable
    output:
      legs:
        - layovers:
            - amenities:
                provider: Geoapify
                status: provider_error
                groups: {food_drink: {count: 0}, shops: {count: 0}, toilets: {count: 0}}
    expect: {connection_preserved: true, fabricated_amenities: false}

boundary_cases:
  - id: inclusive-window-edges
    input: {min_departure_time: "16:20", max_departure_time: "16:45"}
    expect: {accepted_departures: ["16:20", "16:45"], rejected_departures: ["16:19", "16:46"]}
  - id: overnight-window
    input: {min_departure_time: "23:00", max_departure_time: "01:00"}
    expect: {accepted_departures: ["23:00", "00:30", "01:00"], rejected_departures: ["12:00"]}
  - id: no-minimum-time
    input: {min_departure_time: null, max_departure_time: null}
    expect: {provider_default_time_policy: allowed}
  - id: no-feasible-overlap
    input: {regional_train_runs_overlap: false}
    expect: {provider_result_preserved: true, optimized_result_added: false}
  - id: missing-transfer-coordinates
    input: {transfer_station: Unknown stop, latitude: null, longitude: null}
    expect: {connection_preserved: true, amenity_status: missing_coordinates}
