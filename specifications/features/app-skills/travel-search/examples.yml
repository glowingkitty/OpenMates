schema_version: 1
specification: feature.app-skill.travel-search@1
boundary_and_history:
- id: travel-search-realtime-source-faithful
  given: A saved connection records a delay and an uncertain platform.
  when: Alice opens the old itinerary.
  then: The stored delay is identifiable as historical and the platform remains uncertain.
  assertion_ids:
  - travel-search.realtime.source-faithful
- id: travel-search-transfer-amenities-source-labelled
  given: A saved layover includes a sourced cafe and an unresolved toilet lookup.
  when: Alice views its details.
  then: The cafe attribution and unresolved state remain separate without a new lookup.
  assertion_ids:
  - travel-search.transfer-amenities.source-labelled
- id: travel-search-no-results-explicit
  given: Alice searches for an evening train connection.
  when: Connection discovery has no permitted provider.
  then: The invocation reports unavailable with no provider request and no invented empty success.
  assertion_ids:
  - travel-search.no-results.explicit
- id: travel-search-surface-parity
  given: Alice submits a new route through CLI and REST, then opens a saved itinerary on web.
  when: No connection provider is configured.
  then: Both searches fail visibly and the historical itinerary remains readable.
  assertion_ids:
  - travel-search.surface-parity
