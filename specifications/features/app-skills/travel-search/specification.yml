schema_version: 1
id: feature.app-skill.travel-search
version: 1
status: draft
title: Travel Connection Search
summary: Connection discovery is unavailable; saved route, timing, source uncertainty and grouped itinerary history
  remain readable.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
  - Explicit unavailable behavior for connection and stay discovery through the shared provider boundary.
  - Generic saved connection, segment and layover schemas with source-faithful display.
  excludes:
  - Guaranteeing vehicle capacity, boarding, or provider uptime
  - Inventing a more specific disruption cause than the source supplies
  - Ticket issuance, refunds, or merchant-of-record responsibilities

models:
  TravelSearchRequestItem:
    legs:
      type: array
      required: true
      constraints: {min_items: 1}
    transport_methods:
      type: array
      constraints: {values: [airplane, train, bus, boat]}
    providers:
      type: array
      nullable: true
    min_departure_time:
      type: string
      nullable: true
      constraints: {format: local_HH_MM}
    max_departure_time:
      type: string
      nullable: true
      constraints: {format: local_HH_MM, inclusive: true}

  TravelSegmentResult:
    departure_time: {type: string, required: true}
    arrival_time: {type: string, required: true}
    scheduled_departure_time: {type: string, nullable: true}
    actual_departure_time: {type: string, nullable: true}
    scheduled_arrival_time: {type: string, nullable: true}
    actual_arrival_time: {type: string, nullable: true}
    departure_platform: {type: string, nullable: true}
    arrival_platform: {type: string, nullable: true}
    cancelled: {type: boolean, nullable: true}
    realtime_notes: {type: array, nullable: true, items: string}

  TravelLayoverResult:
    duration_minutes: {type: integer, nullable: true}
    overnight: {type: boolean, nullable: true}
    amenities: {type: object, nullable: true}

  TravelLegResult:
    departure: {type: string, required: true}
    arrival: {type: string, required: true}
    segments: {type: array, required: true, items: TravelSegmentResult}
    layovers: {type: array, nullable: true, items: TravelLayoverResult}

  TravelConnectionResult:
    source_provider: {type: string, required: true}
    departure: {type: string, required: true}
    arrival: {type: string, required: true}
    legs: {type: array, required: true, items: TravelLegResult}
    transfer_quality: {type: object, nullable: true}
    optimization: {type: object, nullable: true}

assertions:
- id: travel-search.realtime.source-faithful
  type: invariant
  must: Saved realtime times, platforms, cancellations and disruption notes retain their recorded source and uncertainty.
    Reopening history never presents these observations as freshly checked or invents a disruption cause.
  depends_on:
  - examples.boundary_and_history
- id: travel-search.transfer-amenities.source-labelled
  type: invariant
  must: Saved transfer amenities retain recorded attribution and matched, no-match, missing-coordinate or provider-error
    status. History does not refresh amenities, promise current opening hours or claim they drove route selection.
  depends_on:
  - examples.boundary_and_history
- id: travel-search.no-results.explicit
  type: failure
  must: New connection requests return an explicit unavailable error while no permitted provider exists. They never
    masquerade as successful zero-match searches, reuse historical routes as fresh results or broaden the requested
    transport mode.
  depends_on:
  - examples.boundary_and_history
- id: travel-search.surface-parity
  type: parity
  must: REST, CLI, npm/pip SDKs and web/Apple preserve the same unavailable behavior for new searches and generic
    saved route, segment, layover, timing, attribution and error schemas.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups:
  - boundary_and_history

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in the current Codex task
    on 2026-10-24. This records scope authorization, not exact-fingerprint approval.
  review_status: Changed fingerprint has not been separately approved; approval artifact gate remains for the coordinator.
