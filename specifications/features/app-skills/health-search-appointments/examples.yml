schema_version: 1
specification: feature.app-skill.health-search-appointments@1
boundary_and_history:
- id: health-search-appointments-input-validated
  given: Alice requests an initial consultation in her city.
  when: No permitted appointment provider is configured.
  then: The request returns unavailable without a provider request or substituted service.
  assertion_ids:
  - health-search-appointments.input.validated
- id: health-search-appointments-results-grouping
  given: A saved result contains two services at the same practice.
  when: Alice opens the saved appointment cards.
  then: Each service keeps its own identity and recorded slots.
  assertion_ids:
  - health-search-appointments.results.grouping
- id: health-search-appointments-results-booking-provenance
  given: A saved consultation has a practice-availability link rather than a direct slot link.
  when: Alice reopens it later.
  then: Its destination remains identified accurately and its old availability is not described as current.
  assertion_ids:
  - health-search-appointments.results.booking-provenance
- id: health-search-appointments-results-maps-enrichment
  given: A saved doctor card has no coordinates.
  when: Alice opens the map and details.
  then: The card remains readable without a fabricated pin or provider request.
  assertion_ids:
  - health-search-appointments.results.maps-enrichment
- id: health-search-appointments-outcomes-explicit
  given: Alice opens an old zero-slot result and submits a new appointment request.
  when: No appointment provider is configured.
  then: History remains an old empty result while the new invocation visibly reports unavailable.
  assertion_ids:
  - health-search-appointments.outcomes.explicit
- id: health-search-appointments-surface-parity
  given: Alice attempts the same appointment search through CLI and REST and opens history on web.
  when: The capability is unavailable.
  then: Both invocations fail consistently and saved service evidence remains readable.
  assertion_ids:
  - health-search-appointments.surface-parity
