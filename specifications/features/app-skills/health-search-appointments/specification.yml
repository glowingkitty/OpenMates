schema_version: 1
id: feature.app-skill.health-search-appointments
version: 1
status: draft
title: Health Appointment Search — App Skill
summary: Appointment discovery uses explicitly installed sources when available and preserves booking and eligibility evidence.

inherits:
- architecture.app-skill-execution@1
- architecture.platform-parity@1
scope:
  includes:
  - Bounded availability windows and optional relevance ranking for explicitly installed sources.
  - Explicit unavailable behavior when no source is installed.
  - Typed request/result schemas and previously saved appointment groups, provenance, maps and outcomes.
  excludes:
  - Diagnosis, treatment recommendations, emergency triage policy and selecting a medical speciality from symptoms.
  - Agent system-prompt wording, prompting tactics, tool-selection instructions and focus-mode behavior; coordinator
    owns that separate question.
  - Appointment booking/cancellation, health memories, medical report generation and medication lookup.
  - New providers, endpoints or supported procedures; changes to authentication, credits, rate limits and encryption.
  - Pixel-level layouts and the internal implementation of generic embed serialization.

models:
  HealthSearchRequest:
    requests:
      type: array
      required: true
      items: HealthSearchRequestItem
      constraints:
        min_items: 1
  HealthSearchRequestItem:
    id:
      type: string
      nullable: true
    speciality:
      type: string
      required: true
    city:
      type: string
      required: true
    provider_platform:
      type: string
      nullable: true
    visit_motive_category:
      type: enum
      nullable: true
      values:
      - general
      - checkup
      - vaccination
      - followup
    insurance_sector:
      type: enum
      nullable: true
      values:
      - public
      - private
    telehealth:
      type: boolean
      default: false
    language:
      type: string
      nullable: true
    days_ahead:
      type: integer
      default: 7
      constraints:
        values:
        - 1
        - 3
        - 7
        - 30
        - 60
    requires_prescribing_clinician:
      type: boolean
      default: false
    medication_visit:
      type: enum
      nullable: true
      values: [initiation, continuation]
    requires_external_diagnosis_acceptance:
      type: boolean
      default: false
    relevance_criteria:
      type: string
      nullable: true
    max_doctors:
      type: integer
      default: 10
      constraints:
        positive: true
        bounded: true
  HealthAppointmentResult:
    provider_platform:
      type: string
      required: true
    name:
      type: string
      required: true
    address:
      type: string
      required: true
    speciality:
      type: string
      nullable: true
    visit_motive:
      type: string
      required: true
    service_name:
      type: string
      nullable: true
    slot_datetime:
      type: timestamp
      required: true
    availability_checked_at:
      type: timestamp
      nullable: true
    prescribing_match:
      type: enum
      nullable: true
      values: [confirmed, unverified]
    insurance:
      type: enum
      values:
      - public
      - private
      - unknown
    allows_new_patients:
      type: boolean
      nullable: true
    telehealth:
      type: boolean
      nullable: true
    languages:
      type: array
      nullable: true
    practice_url:
      type: string
      nullable: true
    booking_url:
      type: string
      nullable: true
    gps_coordinates:
      type: object
      nullable: true
    additional_slot_datetimes:
      type: array
      items: timestamp
    additional_slot_count:
      type: integer
    rating:
      type: number
      nullable: true
    photo_url:
      type: string
      nullable: true
  HealthSearchResultGroup:
    id:
      type: string
      required: true
    results:
      type: array
      items: HealthAppointmentResult
    error:
      type: string
      nullable: true
    provider_outcomes:
      type: object
      constraints:
        observable_states:
        - success
        - no_match
        - filtered_out
        - unsupported
        - failed
        wire_representation: existing envelope or additive metadata
assertions:
- id: health-search-appointments.input.validated
  type: behavior
  must: Accept bounded windows of 1, 3, 7, 30 or 60 days for installed appointment sources, defaulting to 7.
    Without an installed source, report unavailable before provider work.
  depends_on:
  - examples.boundary_and_history
  - examples.live_search
- id: health-search-appointments.results.prescribing-evidence
  type: behavior
  must: When a prescribing visit is requested, exclude explicit conflicts and mark results without affirmative
    appointment-level evidence as unverified. Distinguish medication initiation from continuation and acceptance
    of an outside diagnosis when requested. Those facts use the appointment source data already returned by the
    installed integration. A calendar opening alone never confirms suitability.
  depends_on:
  - examples.live_search
- id: health-search-appointments.results.optional-relevance
  type: behavior
  must: A search with optional relevance criteria may reorder eligible results using supplied evidence.
    Ranking preserves original booking facts and leaves eligible results in their input order when unavailable.
  depends_on:
  - examples.live_search
- id: health-search-appointments.results.grouping
  type: invariant
  must: Saved appointment groups preserve the recorded doctor, service, location, provider and alternate slots.
    Distinct treatments, doctors or booking identities never merge during history rendering.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.results.booking-provenance
  type: invariant
  must: Saved service names, restrictions, availability observations and booking links remain tied to their original
    service and practice. History never manufactures booking confirmation or presents recorded availability as current
    or guaranteed.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.results.maps-enrichment
  type: invariant
  must: Saved appointment coordinates identify the same doctor or practice as their card. Missing coordinates preserve
    a usable detail card and explicit unmapped state without a new source lookup.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.outcomes.explicit
  type: failure
  must: Requests without an installed source report unavailable, distinctly from successful searches with no slots. Saved invalid,
    unsupported, empty, partial and failed outcomes retain their recorded distinctions without renewed provider
    execution.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.surface-parity
  type: parity
  must: REST, CLI, npm/pip SDKs and web/Apple preserve explicit errors for appointment searches without an installed source
    and generic saved doctor, service, slot, insurance, provenance, map and outcome fields.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api:
    required: true
  cli:
    required: true
  sdks:
    required: true
    parity: strict
    implementations:
      npm:
        required: true
      pip:
        required: true
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
      apple:
        required: true
    exceptions: []
examples:
  file: examples.yml
  required_groups:
  - boundary_and_history
  - live_search

approval_source:
  instruction: The owner asked to implement thirty-day and sixty-day searches, verify the medication intake flow and other specialties, and compare natural-language ranking on and off.
