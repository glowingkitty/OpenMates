schema_version: 1
id: feature.app-skill.health-search-appointments
version: 1
status: draft
title: Health Appointment Search — App Skill
summary: Appointment discovery is unavailable; generic saved doctor, service, slot, location and outcome history
  remains truthful.

inherits:
- architecture.app-skill-execution@1
- architecture.platform-parity@1
scope:
  includes:
  - Explicit unavailable behavior for new appointment discovery through the shared provider boundary.
  - Typed request/result schemas and previously saved appointment groups, provenance, maps and outcomes.
  excludes:
  - Diagnosis, treatment recommendations, emergency triage policy and selecting a medical speciality from symptoms.
  - Agent system-prompt wording, prompting tactics, tool-selection instructions and focus-mode behavior; coordinator
    owns that separate question.
  - Appointment booking/cancellation, health memories, medical report generation and medication lookup.
  - Jev relevance ranking, a relevance_criteria input, and preference-based reordering of appointment candidates.
  - New providers, endpoints or supported procedures; changes to authentication, credits, rate limits and encryption.
  - Pixel-level layouts and the internal implementation of generic embed serialization.

models:
  HealthSearchRequest:
    requests:
      type: array
      required: true
      items: HealthSearchRequestItem
      constraints:
        min_items: 1
  HealthSearchRequestItem:
    id:
      type: string
      nullable: true
    speciality:
      type: string
      required: true
    city:
      type: string
      required: true
    provider_platform:
      type: string
      nullable: true
      constraints: {live_sources_unavailable: true}
    visit_motive_category:
      type: enum
      nullable: true
      values:
      - general
      - checkup
      - vaccination
      - followup
    insurance_sector:
      type: enum
      nullable: true
      values:
      - public
      - private
    telehealth:
      type: boolean
      default: false
    language:
      type: string
      nullable: true
    days_ahead:
      type: integer
      default: 7
      constraints:
        values:
        - 1
        - 3
        - 7
    max_doctors:
      type: integer
      default: 10
      constraints:
        positive: true
        bounded: true
  HealthAppointmentResult:
    provider_platform:
      type: string
      required: true
    name:
      type: string
      required: true
    address:
      type: string
      required: true
    speciality:
      type: string
      nullable: true
    visit_motive:
      type: string
      required: true
    service_name:
      type: string
      nullable: true
    slot_datetime:
      type: timestamp
      required: true
    insurance:
      type: enum
      values:
      - public
      - private
      - unknown
    allows_new_patients:
      type: boolean
      nullable: true
    telehealth:
      type: boolean
      nullable: true
    languages:
      type: array
      nullable: true
    practice_url:
      type: string
      nullable: true
    booking_url:
      type: string
      nullable: true
    gps_coordinates:
      type: object
      nullable: true
    additional_slot_datetimes:
      type: array
      items: timestamp
    additional_slot_count:
      type: integer
    rating:
      type: number
      nullable: true
    photo_url:
      type: string
      nullable: true
  HealthSearchResultGroup:
    id:
      type: string
      required: true
    results:
      type: array
      items: HealthAppointmentResult
    error:
      type: string
      nullable: true
    provider_outcomes:
      type: object
      constraints:
        observable_states:
        - success
        - no_match
        - filtered_out
        - unsupported
        - failed
        wire_representation: existing envelope or additive metadata
assertions:
- id: health-search-appointments.input.validated
  type: behavior
  must: Retain typed batch, speciality, city, visit-purpose, eligibility, date and limit request fields. Current
    appointment invocations return explicit unavailable errors before provider work and do not imply that live eligibility
    or availability was checked.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.results.grouping
  type: invariant
  must: Saved appointment groups preserve the recorded doctor, service, location, provider and alternate slots.
    Distinct treatments, doctors or booking identities never merge during history rendering.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.results.booking-provenance
  type: invariant
  must: Saved service names, restrictions, availability observations and booking links remain tied to their original
    service and practice. History never manufactures booking confirmation or presents recorded availability as current
    or guaranteed.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.results.maps-enrichment
  type: invariant
  must: Saved appointment coordinates identify the same doctor or practice as their card. Missing coordinates preserve
    a usable detail card and explicit unmapped state without a new source lookup.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.outcomes.explicit
  type: failure
  must: New appointment requests report unavailable, distinctly from successful searches with no slots. Saved invalid,
    unsupported, empty, partial and failed outcomes retain their recorded distinctions without renewed provider
    execution.
  depends_on:
  - examples.boundary_and_history
- id: health-search-appointments.surface-parity
  type: parity
  must: REST, CLI, npm/pip SDKs and web/Apple preserve explicit unavailable errors for current appointment searches
    and generic saved doctor, service, slot, insurance, provenance, map and outcome fields.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api:
    required: true
  cli:
    required: true
  sdks:
    required: true
    parity: strict
    implementations:
      npm:
        required: true
      pip:
        required: true
  gui:
    required: true
    parity: semantic
    implementations:
      web:
        required: true
      apple:
        required: true
    exceptions: []
examples:
  file: examples.yml
  required_groups:
  - boundary_and_history

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in the current Codex task
    on 2026-10-24. This records scope authorization, not exact-fingerprint approval.
  review_status: Changed fingerprint has not been separately approved; approval artifact gate remains for the coordinator.
