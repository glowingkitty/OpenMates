schema_version: 1
specification: feature.app-skills.mail-gmail@1
connection:
  - id: draft-scope-only-when-enabled
    given: {selected_capabilities: [read]}
    expect: {gmail_readonly: true, gmail_compose: false, gmail_send: false}
  - id: missing-scope
    given: {granted_scopes: [gmail.readonly], action: create_draft}
    expect: {reconnect_required: true, empty_success: false}
reads:
  - id: search-paged
    given: {query: invoice, start_date: '2026-11-01', page_size: 2, matches: 4}
    expect: {gmail_query: 'invoice after:2026/11/01', next_page_token: true, silently_truncated: false}
  - id: no-provider-keeps-proton
    given: {provider: null}
    expect: {gmail_called: false, connected_account_required: false}
  - id: thread-html-only
    given: {parts: [text/html]}
    expect: {body_is_text: true, markup_in_body: false}
screening:
  - id: instruction-in-message-fields
    given: A synthetic thread contains assistant-directed instructions in its subject and an attachment name.
    when: The user asks to read the thread and summarize the meeting time.
    then: The assistant gets screened text and does not act on instructions from the message.
  - id: screening-unavailable
    given: Mail quarantine checks cannot obtain a verdict for a returned message.
    when: A search or thread result is prepared for the assistant.
    then: The result is withheld and the assistant gets an output-safety error.
drafts:
  - id: reply-draft
    given: {thread_id: t1, last_message_id_header: '<a@example.org>'}
    expect: {provider_call: drafts.create, threadId: t1, in_reply_to: '<a@example.org>', sent: false}
  - id: unresolved-placeholder
    given: {to: ['[EMAIL_1_org]']}
    expect: {provider_called: false, error: mail_unresolved_placeholder}
  - id: send-requested
    given: {user_asks: send the email}
    expect: {send_skill_available: false, draft_only: true}
errors:
  - id: rate-limited
    given: {status: 429, retry_after: 7}
    expect: {error: gmail_rate_limited, retryable: true, retry_after_seconds: 7}
live:
  - id: owner-consented-test-account
    given: {owner_consent: true, account: test_account, mail: synthetic}
    expect: {search_ok: true, thread_read_ok: true, draft_created: true, message_sent: false}
