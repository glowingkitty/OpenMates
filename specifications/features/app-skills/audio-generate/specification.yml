schema_version: 1
id: feature.app-skill.audio-generate
version: 1
status: approved
title: Audio Generate Sound Effects
summary: >
  Generate short non-speech sound effects from text prompts and expose them as
  safe, billable, playable generated-audio results consistently across
  OpenMates platforms.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
    - Short UI and product sound-effect generation from text prompts
    - Task-based generated-asset responses for every successful generated audio output
    - Encrypted private chatfiles S3 storage indexed in upload_files with short-lived generated-asset downloads
    - Playable generated-audio app-skill embeds and downloads with binary fields excluded from model inference
    - Real ElevenLabs provider use through OpenMates-managed credentials
  excludes:
    - Text-to-speech, narration, singing, vocals, or spoken words
    - Voice cloning, user-uploaded voice samples, or raw provider voice IDs
    - Long-form music generation, audio-book generation, or automatic assistant voice playback
    - Unauthenticated or public anonymous audio generation

models:
  AudioGenerateRequest:
    requests:
      type: array
      required: true
      items: AudioGenerateRequestItem
      constraints: {min_items: 1, max_items: 5}

  AudioGenerateDispatchResponse:
    task_id:
      type: stable_id
      nullable: true
      constraints: {required_for_single_request: true}
    embed_id:
      type: stable_id
      nullable: true
      constraints: {required_for_single_request: true, generated_asset_id: true}
    task_ids:
      type: array
      nullable: true
      items: stable_id
      constraints: {required_for_batch_request: true, max_items: 5}
    embed_ids:
      type: array
      nullable: true
      items: stable_id
      constraints: {required_for_batch_request: true, max_items: 5}
    status:
      type: enum
      required: true
      values: [processing]
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}

  AudioGenerateRequestItem:
    id:
      type: string_or_integer
      nullable: true
      constraints: {auto_generate_when_missing: sequential_integer}
    prompt:
      type: string
      required: true
      constraints: {trim: true, blank: false, min_length: 1, max_length: 400}
    provider:
      type: enum
      default: elevenlabs
      values: [elevenlabs]
      constraints: {future_expandable_provider_selection: true}
    duration_seconds:
      type: number
      default: 1.0
      constraints: {minimum: 0.5, maximum: 2.0}
    prompt_influence:
      type: number
      default: 0.3
      constraints: {minimum: 0.0, maximum: 1.0}
    loop:
      type: boolean
      default: false
    output_format:
      type: enum
      default: mp3_44100_128
      values: [mp3_22050_32, mp3_24000_48, mp3_44100_32, mp3_44100_64, mp3_44100_96, mp3_44100_128, mp3_44100_192]
    model:
      type: enum
      default: eleven_text_to_sound_v2
      values: [eleven_text_to_sound_v2]

  GeneratedAudioFileVariant:
    s3_key:
      type: string
      required: true
      constraints: {private_chatfiles_object: true, provider_url: forbidden}
    size_bytes:
      type: integer
      required: true
      constraints: {minimum: 1}
    format:
      type: enum
      required: true
      values: [mp3]
    mime_type:
      type: string
      required: true
      constraints: {audio_only: true}
    duration_seconds:
      type: number
      required: true
      constraints: {minimum: 0.5, maximum: 2.0}
    encryption:
      type: enum
      required: true
      values: [aes-gcm-nonce-prefixed-v1]
    download_url:
      type: string
      nullable: true
      constraints: {short_lived_generated_asset_url: true, required_for_rest_sdk_task_results: true}
    download_expires_at:
      type: integer
      nullable: true
      constraints: {required_when_download_url_present: true}

  AudioGenerateResult:
    id:
      type: string_or_integer
      required: true
    status:
      type: enum
      required: true
      values: [finished, error]
    prompt:
      type: string
      required: true
    generation_type:
      type: enum
      required: true
      values: [sound_effect]
    provider:
      type: string
      required: true
      default: ElevenLabs
    model:
      type: string
      required: true
    mime_type:
      type: string
      required: true
      constraints: {audio_only: true}
    duration_seconds:
      type: number
      required: true
      constraints: {minimum: 0.5, maximum: 2.0}
    byte_length:
      type: integer
      required: true
      constraints: {minimum: 1}
    files:
      type: object
      nullable: true
      constraints: {items: GeneratedAudioFileVariant, required_when_status_finished: true, encrypted_generated_asset_metadata: true}
    s3_base_url:
      type: string
      nullable: true
      constraints: {private_chatfiles_bucket_url: true, required_when_files_present: true}
    aes_key:
      type: string
      nullable: true
      constraints: {required_in_client_encrypted_embed_content: true, forbidden_in_rest_sdk_task_results: true, exclude_from_llm_inference: true}
    aes_nonce:
      type: string
      nullable: true
      constraints: {required_for_legacy_client_decryption_when_v2_marker_absent: true, forbidden_in_rest_sdk_task_results: true, exclude_from_llm_inference: true}
    vault_wrapped_aes_key:
      type: string
      nullable: true
      constraints: {required_in_upload_files_and_client_encrypted_embed_content: true, forbidden_in_rest_sdk_task_results: true, exclude_from_llm_inference: true}
    credits_charged:
      type: integer
      nullable: true
      constraints: {minimum: 1}
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}

  AudioGenerateResponse:
    results:
      type: array
      required: true
      items: AudioGenerateResult
      constraints: {min_items: 0, max_items: 5, unique_by: id}
    provider:
      type: string
      required: true
      default: ElevenLabs
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}
    ignore_fields_for_inference:
      type: array
      required: true
      items: string
      constraints: {must_include: [audio_base64, aes_key, aes_nonce, vault_wrapped_aes_key]}

assertions:
  - id: audio-generate.request.validated
    type: validation
    must: Invalid request shape, blank prompt, excessive batch size, unsupported provider, unsupported output format, or duration outside 0.5-2.0 seconds is rejected before provider execution.
    depends_on: [models.AudioGenerateRequest, models.AudioGenerateRequestItem, examples.invalid_inputs, examples.boundary_cases]
  - id: audio-generate.provider.explicit-selection
    type: invariant
    must: The request contract includes an explicit provider enum, defaulting to elevenlabs in v1, so future providers can extend the enum without changing the skill surface shape.
    depends_on: [models.AudioGenerateRequestItem.provider, examples.valid_inputs, examples.invalid_inputs]
  - id: audio-generate.request.ids-correlated
    type: invariant
    must: Each result preserves its caller ID or receives a unique sequential ID when none was supplied.
    depends_on: [models.AudioGenerateRequestItem.id, models.AudioGenerateResult.id, examples.valid_inputs]
  - id: audio-generate.speech.wrong-skill-rejected
    type: behavior
    must: Requests for spoken words, narration, vocals, or TTS through audio.generate are rejected with guidance to use audio.speak instead.
    depends_on: [models.AudioGenerateRequestItem.prompt, examples.invalid_inputs, examples.safety_rejections]
  - id: audio-generate.safety.blocks-abuse
    type: security
    must: Scam, deceptive media, public-figure voice/persona, or cloning-like prompts are rejected before provider execution.
    depends_on: [examples.invalid_inputs, examples.safety_rejections]
  - id: audio-generate.output.playable-audio
    type: behavior
    must: Successful outputs are dispatched asynchronously, persisted as encrypted private chatfiles generated assets, indexed in upload_files, and exposed as playable audio/mpeg generated-audio embeds or short-lived generated-asset download URLs without requiring provider credentials on clients.
    depends_on: [models.AudioGenerateResult, examples.successful_outputs]
  - id: audio-generate.output.binary-excluded-from-inference
    type: privacy
    must: New successful outputs never include inline audio_base64; audio bytes, encryption keys, nonces, wrapped keys, generated-asset bearer tokens, and raw provider diagnostics are excluded from LLM inference, logs, committed examples, public examples, and assistant prose.
    depends_on: [models.AudioGenerateResponse.ignore_fields_for_inference, examples.successful_outputs, examples.error_outputs]
  - id: audio-generate.billing.success-only
    type: invariant
    must: Credits are charged only for successful generated audio, using result-declared duration billing at 20 OpenMates credits per ElevenLabs sound-effect second with a one-credit successful-output floor and idempotent billing.
    depends_on: [models.AudioGenerateResult.credits_charged, examples.successful_outputs, examples.error_outputs]
  - id: audio-generate.provider-error.visible
    type: failure
    must: Provider key, timeout, quota, generated-asset storage/indexing, and generation failures produce safe visible errors, update the processing embed or task status, and are never represented as successful empty audio.
    depends_on: [models.AudioGenerateResponse.error, examples.error_outputs]
  - id: audio-generate.execution.async-generated-assets
    type: invariant
    must: audio.generate always uses the existing async app-skill task pattern for provider execution and returns processing task/embed IDs first; completed results are delivered through generated-asset metadata rather than inline binary data.
    depends_on: [examples.boundary_cases]
  - id: audio-generate.surface-parity
    type: parity
    must: REST API, CLI, npm/pip SDKs, web embed rendering, and Apple rendering preserve the same request, response, safety, billing, privacy, and error semantics or record explicit approved exceptions.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [valid_inputs, invalid_inputs, successful_outputs, error_outputs, boundary_cases, safety_rejections]
