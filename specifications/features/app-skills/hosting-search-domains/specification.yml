schema_version: 1
id: feature.app-skill.hosting-search-domains
version: 1
status: draft
title: Hosting Domain Search
summary: Domain discovery is unavailable without a permitted provider; saved domain results retain their generic
  quotes, state and navigation.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
  - Explicit unavailable behavior for new domain requests, inherited from the shared provider boundary.
  - Typed domain request/result schemas and previously saved grouped result and child rendering.
  excludes:
  - Domain purchase, reservation, or availability guarantee
  - Claims that an undocumented provider endpoint has published API permission

models:
  DomainSearchRequest:
    requests: {type: array, required: true, items: DomainSearchRequestItem, constraints: {min_items: 1, max_items: 5}}
  DomainSearchRequestItem:
    id: {type: string_or_integer, nullable: true}
    query: {type: string, required: true, constraints: {nonblank: true, domain_or_short_name_or_keyword: true}}
    tlds: {type: array, nullable: true, items: string, constraints: {max_items: 5}}
    country: {type: iso_3166_1_alpha_2, default: DE, constraints: {returned_explicitly: true}}
    currency: {type: iso_4217, default: EUR, constraints: {supported_value_required: true}}
    max_results: {type: integer, default: 10, constraints: {minimum: 1, maximum: 20}}
    availability: {type: enum, default: prefer_available, values: [prefer_available, available_only, all]}
    relevance_criteria: {type: string, nullable: true, constraints: {trim: true, blank: treat_as_omitted, max_length: 1000}}
  DomainSearchGroup:
    id: {type: string_or_integer, nullable: true}
    query: {type: string, required: true}
    provider: {type: string, required: true, constraints: {live_sources_unavailable: true}}
    country: {type: iso_3166_1_alpha_2, required: true}
    currency: {type: iso_4217, required: true}
    checked_at: {type: iso_8601_datetime, nullable: true}
    partial: {type: boolean, required: true}
    warnings: {type: array, items: safe_string}
    results: {type: array, items: DomainResult, constraints: {at_most_requested_count: true}}
    checked_results: {type: array, items: DomainResult, constraints: {max_items: 40, bounded_matching_checked_pool: true}}
    error: {type: safe_string, nullable: true}
  DomainResult:
    domain_ascii: {type: idna_domain, required: true}
    domain_unicode: {type: string, required: true}
    availability: {type: enum, required: true, values: [available, unavailable, unknown]}
    provider_status: {type: string, nullable: true}
    premium: {type: boolean, nullable: true}
    reserved: {type: boolean, nullable: true}
    corporate: {type: boolean, nullable: true}
    restrictions: {type: array, nullable: true, items: external_text}
    registration_phase: {type: string, nullable: true}
    registration_tiers: {type: array, items: DomainPriceTier}
    renewal_tiers: {type: array, items: DomainPriceTier}
    checked_at: {type: iso_8601_datetime, nullable: true}
    provider_url: {type: fixed_origin_https_url, required: true}
  DomainPriceTier:
    unit: {type: string, required: true}
    duration_range: {type: object, required: true}
    minimum_term: {type: string, nullable: true}
    price_excluding_tax: {type: decimal, nullable: true}
    price_including_tax: {type: decimal, nullable: true}
    tax_rate: {type: decimal, nullable: true}
    discount_price: {type: decimal, nullable: true}
    normal_price: {type: decimal, nullable: true}

assertions:
- id: hosting-domains.request.validated
  type: validation
  must: Keep the typed grouped domain request schema, including caller IDs, IDNA display, suffixes, country, currency
    and result limits. Current requests fail explicitly as unavailable before any provider work; preserving the
    schema does not advertise live checks.
  depends_on:
  - examples.boundary_and_history
- id: hosting-domains.availability.selection
  type: behavior
  must: Saved checked-domain pools preserve distinct available, unavailable and unknown evidence. Local availability
    views never relabel a failed check as an in-use domain or fabricate additional results.
  depends_on:
  - examples.boundary_and_history
- id: hosting-domains.quotes.truthful
  type: invariant
  must: Saved domain children preserve separate supplied registration and renewal tiers, currency, tax, discount,
    premium, minimum term and restrictions. Missing facts remain unknown and mixed terms are not collapsed into
    a false comparable minimum.
  depends_on:
  - examples.boundary_and_history
- id: hosting-domains.results.partial-and-safe
  type: security
  must: Saved domain groups preserve checked time, partial status, safe warnings, errors and confirmed facts under
    inherited encryption and external-output safety. New unavailable requests disclose no query, user context or
    credentials to providers or proxies.
  depends_on:
  - examples.boundary_and_history
- id: hosting-domains.embeds.parent-child
  type: behavior
  must: Previously saved domain parent and child embeds remain independently openable with encrypted references,
    truthful quote and status details, responsive layout, sibling navigation and return to results. Local filters
    use only the saved checked pool and never refetch.
  depends_on:
  - examples.boundary_and_history
- id: hosting-domains.surface-parity
  type: parity
  must: REST, CLI, npm/pip SDKs, Workflow and GUI preserve explicit unavailable errors for new searches and generic
    saved domain schemas, child references, quote details and history states.
  depends_on:
  - examples.boundary_and_history

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}

examples:
  file: examples.yml
  required_groups:
  - boundary_and_history

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in the current Codex task
    on 2026-10-24. This records scope authorization, not exact-fingerprint approval.
  review_status: Changed fingerprint has not been separately approved; approval artifact gate remains for the coordinator.
