schema_version: 1
specification: feature.app-skill.hosting-search-domains@1
boundary_and_history:
- id: hosting-domains-request-validated
  given: Alice submits an exact domain and a separate keyword request.
  when: She invokes domain search while no permitted provider is configured.
  then: She receives an unavailable error and no lookup or suggestion request occurs.
  assertion_ids:
  - hosting-domains.request.validated
- id: hosting-domains-availability-selection
  given: A saved result contains available, in-use and unknown checks.
  when: Alice changes its local availability filter.
  then: The cards retain their saved states and the filter performs no remote checks.
  assertion_ids:
  - hosting-domains.availability.selection
- id: hosting-domains-quotes-truthful
  given: A saved premium domain has a discounted first year, a higher renewal quote and a two-year minimum.
  when: Alice opens its saved child card.
  then: The original quote categories and term remain distinct; missing tax remains unknown.
  assertion_ids:
  - hosting-domains.quotes.truthful
- id: hosting-domains-results-partial-and-safe
  given: A saved result contains one checked child and one failed quote.
  when: Alice reopens it, then attempts a new search.
  then: History retains its partial evidence; the new search returns unavailable without network disclosure.
  assertion_ids:
  - hosting-domains.results.partial-and-safe
- id: hosting-domains-embeds-parent-child
  given: A saved parent has two domain children and one unknown check.
  when: Alice opens its fullscreen, applies a local filter and opens a child.
  then: The saved states and quote details remain visible, navigation works and no provider is called.
  assertion_ids:
  - hosting-domains.embeds.parent-child
- id: hosting-domains-surface-parity
  given: Alice attempts the same domain search through REST and CLI, then opens an existing saved result.
  when: The capability has no permitted provider.
  then: Both invocations fail visibly without requests while saved parent and child details remain usable.
  assertion_ids:
  - hosting-domains.surface-parity
