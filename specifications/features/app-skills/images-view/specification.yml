schema_version: 1
id: feature.app-skill.images-view
version: 1
status: draft
title: Images View Skill
summary: >
  Images View securely resolves an image embed reference, decrypts the referenced
  image server-side, and returns a validated multimodal tool result so the main
  inference model can answer questions about the image pixels.

inherits:
  - architecture.app-skill-execution@1

scope:
  includes:
    - Internal images.view calls made by the assistant for uploaded or generated image embeds in first-party chats originating from CLI, npm SDK, pip SDK, web, or Apple clients.
    - Exact file_path/embed_ref resolution to an internal embed ID through pipeline-injected context.
    - Vault Transit lookup and AES key unwrapping, private S3 download, transient media decryption, MIME detection, and multimodal tool-result construction.
    - Main-inference continuation after a successful image tool result and explicit failure handling when image access fails.
  excludes:
    - Public or developer REST access to images.view.
    - Image search, generation, editing, vectorization, moderation, or safety classification.
    - Guaranteed recognition of ambiguous, unreadable, or unsupported image content.
    - Treating filenames, captions, thumbnails, or embed metadata as evidence that the model received image pixels.

models:
  ImagesViewRequest:
    file_path:
      type: embed_ref
      required: true
      constraints: {exact_conversation_reference: true, internal_embed_id_hidden_from_model: true}
    file_path_index:
      type: server_injected_mapping
      required: true
      constraints: {not_model_supplied: true}
    user_vault_key_id:
      type: server_injected_key_reference
      required: true
      constraints: {not_model_supplied: true}

  ImagesViewSuccess:
    text_block:
      type: tool_content_block
      required: true
      constraints: {type: text, identifies_resolved_image: true}
    image_block:
      type: tool_content_block
      required: true
      constraints: {type: image_url, valid_data_url: true, detected_image_mime: true}
    plaintext_lifetime:
      type: transient_memory
      required: true
      constraints: {durable_plaintext_storage: forbidden}

  ImagesViewFailure:
    error_block:
      type: tool_content_block
      required: true
      constraints: {type: text, explicit_error: true, image_block_absent: true}
    embed_status:
      type: enum
      required: true
      values: [failed]

assertions:
  - id: images-view.request.exact-embed-ref
    type: behavior
    must: images.view accepts the exact file_path/embed_ref visible in conversation context and resolves it through the server-injected file-path index without exposing or requiring an internal embed UUID in the model tool call.
    depends_on: [models.ImagesViewRequest, examples.valid_view]
  - id: images-view.security.server-resolved-decryption
    type: privacy
    must: Embed lookup, Vault key use, private S3 location, AES key unwrapping, and media decryption remain server-side; plaintext image bytes exist only transiently and cryptographic or storage secrets are never returned to the model or persisted in the tool result.
    depends_on: [models.ImagesViewRequest.user_vault_key_id, models.ImagesViewSuccess.plaintext_lifetime, examples.valid_view]
  - id: images-view.output.valid-multimodal-result
    type: invariant
    must: A successful images.view result contains both a text block and at least one valid image_url data block built from decrypted image bytes and a detected image MIME type; metadata or text alone is never classified as successful multimodal output.
    depends_on: [models.ImagesViewSuccess, examples.valid_view]
  - id: images-view.errors.explicit-failed-result
    type: behavior
    must: Missing context, unresolved embed references, cache misses, Vault failures, S3 failures, decryption failures, and invalid image payloads return an explicit failed result without an image block and without a finished image-view embed state.
    depends_on: [models.ImagesViewFailure, examples.invalid_view]
  - id: images-view.response.post-tool-inference
    type: behavior
    must: A pre-tool acknowledgement is non-terminal; after successful images.view execution, the main inference loop consumes the image block and continues to an image-grounded assistant answer, while failed execution produces an explicit failure response.
    depends_on: [models.ImagesViewSuccess, models.ImagesViewFailure, examples.valid_view, examples.invalid_view]
  - id: images-view.surface.semantic-parity
    type: parity
    must: First-party chats originating from CLI, npm SDK, pip SDK, web, or Apple use the same images.view resolution, decryption, multimodal result, post-tool inference, and explicit failure semantics.
    depends_on: [models.ImagesViewRequest, models.ImagesViewSuccess, models.ImagesViewFailure, examples.valid_view, examples.invalid_view]

applies_to:
  rest_api:
    required: false
    role: images.view is not exposed as a standalone public or developer API because stateless requests lack the approved chat, embed-index, and Vault context.
  cli:
    required: true
    role: CLI-created chats may trigger images.view through the same first-party chat inference pipeline; the skill is not a standalone CLI command.
  sdks:
    required: true
    role: SDK-created chats may trigger images.view through the same first-party chat inference pipeline; the skill is not a standalone SDK method.
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}

examples:
  file: examples.yml
  required_groups: [valid_view, invalid_view]
