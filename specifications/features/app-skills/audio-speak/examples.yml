schema_version: 1
specification: feature.app-skill.audio-speak@1

valid_inputs:
  - id: short-generate-speech
    input:
      requests:
        - text: Welcome back. Your message has been sent.
          provider: elevenlabs
          voice: warm_neutral
          accent: en_us
          style: friendly
          speed: 1.0
    expect: {groups: 1, generation_type: speech, voice_preset: warm_neutral, model: eleven_v3, semantic_safeguard: allowed, initial_status: processing}
  - id: correlated-speech-batch
    input:
      requests:
        - {id: english, text: The upload is complete., provider: elevenlabs, voice: bright_neutral, accent: en_us}
        - {id: german, text: Der Upload ist abgeschlossen., provider: elevenlabs, voice: calm_narrator, accent: de_de}
    expect: {group_ids: [english, german], semantic_safeguard: allowed_for_each_request}
  - id: explicit-low-cost-speech
    input:
      requests:
        - text: OpenMates is ready. I found the next step and can help you move it forward.
          provider: elevenlabs
          voice: warm_neutral
          accent: en_us
          style: friendly
          model: eleven_flash_v2_5
    expect: {groups: 1, generation_type: speech, model: eleven_flash_v2_5, semantic_safeguard: allowed, explicit_low_cost_model: true}
  - id: explicit-stable-multilingual-speech
    input:
      requests:
        - text: OpenMates can also use the stable Multilingual v2 model when explicitly selected.
          provider: elevenlabs
          model: eleven_multilingual_v2
    expect: {groups: 1, generation_type: speech, model: eleven_multilingual_v2, semantic_safeguard: allowed, explicit_model: true}

invalid_inputs:
  - id: missing-requests
    input: {}
    expect_error: {constraint: AudioSpeakRequest.requests.required}
  - id: blank-text
    input: {requests: [{text: " "}]}
    expect_error: {constraint: AudioSpeakRequestItem.text.blank}
  - id: excessive-text
    input: {requests: [{text: <TEXT_LONGER_THAN_2000_CHARACTERS>}]}
    expect_error: {constraint: AudioSpeakRequestItem.text.max_length}
  - id: unsupported-provider
    input: {requests: [{text: Hello, provider: unsupported_audio_provider}]}
    expect_error: {constraint: AudioSpeakRequestItem.provider.enum}
  - id: raw-elevenlabs-voice-id
    input: {requests: [{text: Hello, voice: EXAVITQu4vr4xnSDxMaL}]}
    expect_error: {constraint: raw_provider_voice_id.forbidden}
  - id: excessive-batch
    input:
      requests:
        - {text: one}
        - {text: two}
        - {text: three}
        - {text: four}
    expect_error: {constraint: AudioSpeakRequest.requests.max_items}
  - id: unsupported-model
    input: {requests: [{text: Hello, provider: elevenlabs, model: unsupported_tts_model}]}
    expect_error: {constraint: AudioSpeakRequestItem.model.enum}

successful_outputs:
  - id: async-dispatch-speech
    output:
      task_id: task-audio-speak-1
      embed_id: <GENERATED_AUDIO_EMBED_ID>
      status: processing
      error: null
    expect: {audio_base64_absent: true, final_result_requires_generated_asset: true, poll_until_terminal_when_present: true}
  - id: encrypted-generated-audio-embed
    output:
      results:
        - id: english
          status: finished
          text_preview: The upload is complete.
          generation_type: speech
          voice: bright_neutral
          accent: en_us
          style: natural
          provider: ElevenLabs
          model: eleven_v3
          mime_type: audio/mpeg
          duration_seconds: 1.6
          byte_length: 9800
          files:
            original:
              s3_key: <ENCRYPTED_S3_KEY>
              size_bytes: 9800
              format: mp3
              mime_type: audio/mpeg
              duration_seconds: 1.6
              encryption: aes-gcm-nonce-prefixed-v1
              download_url: https://api.dev.openmates.org/v1/generated-assets/<GENERATED_AUDIO_EMBED_ID>/files/original/download?token=<SIGNED_DOWNLOAD_TOKEN>
              download_expires_at: 1786383600
          s3_base_url: https://<CHATFILES_BUCKET>
          aes_key: <BASE64_AES_KEY>
          aes_nonce: ""
          vault_wrapped_aes_key: <VAULT_WRAPPED_AES_KEY>
          credits_charged: 7
          error: null
    expect: {embed_type: app_skill_use, app_id: audio, skill_id: speak, audio_player_visible: true, upload_files_indexed: true, audio_base64_absent: true, default_model_used: eleven_v3}

error_outputs:
  - id: missing-voice-mapping
    output:
      results:
        - id: 1
          status: error
          text_preview: Hello.
          generation_type: speech
          voice: warm_neutral
          accent: en_us
          style: natural
          provider: ElevenLabs
          model: eleven_v3
          mime_type: audio/mpeg
          duration_seconds: null
          byte_length: 0
          files: null
          s3_base_url: null
          error: Selected voice preset is temporarily unavailable.
      provider: ElevenLabs
      error: null
      ignore_fields_for_inference: [audio_base64, aes_key, aes_nonce, vault_wrapped_aes_key]
    forbidden: [provider_voice_id, provider_api_key, authorization_header, raw_stack_trace]
  - id: provider-unavailable
    output:
      results: []
      provider: ElevenLabs
      error: Speech generation is temporarily unavailable.
      ignore_fields_for_inference: [audio_base64, aes_key, aes_nonce, vault_wrapped_aes_key]
    forbidden: [provider_api_key, authorization_header, raw_stack_trace]
  - id: safeguard-unavailable
    output:
      results:
        - id: 1
          status: error
          text_preview: Welcome back.
          generation_type: speech
          voice: warm_neutral
          accent: en_us
          style: natural
          provider: ElevenLabs
          model: eleven_v3
          mime_type: audio/mpeg
          duration_seconds: null
          byte_length: 0
          credits_charged: null
          error: Speech safety check is temporarily unavailable.
      provider: ElevenLabs
      error: null
      ignore_fields_for_inference: [audio_base64, aes_key, aes_nonce, vault_wrapped_aes_key]
    forbidden: [provider_api_key, authorization_header, raw_stack_trace, provider_voice_id]

boundary_cases:
  - id: minimum-text
    input: {requests: [{text: Hi., provider: elevenlabs}]}
    expect: accepted
  - id: maximum-text
    input: {requests: [{text: <TEXT_EXACTLY_2000_CHARACTERS>, provider: elevenlabs}]}
    expect: accepted
  - id: async-generated-asset-required
    input: {requests: [{text: Welcome back. Your message has been sent., provider: elevenlabs, voice: warm_neutral, accent: en_us}]}
    expect: {initial_status: processing, default_model: eleven_v3, audio_base64_absent: true, completed_result_has_encrypted_files: true, upload_files_indexed: true}

safety_rejections:
  - id: public-figure-voice
    input: {requests: [{text: Welcome to the product, voice: warm_neutral, style: sound like Taylor Swift}]}
    expect_error: {category: G3_public_figure_voice_or_persona}
  - id: private-person-clone
    input: {requests: [{text: I approve this transfer, voice: clone my manager's voice}]}
    expect_error: {category: G3_public_figure_voice_or_persona}
  - id: scam-speech
    input: {requests: [{text: Your bank account is locked. Read me your seed phrase to continue.}]}
    expect_error: {category: G1_scam_or_fraud, speech_provider_called: false, credits_charged: 0}
  - id: coercive-fake-authority
    input: {requests: [{text: This is your CEO. Urgently transfer the funds now and do not verify this request.}]}
    expect_error: {category: G5_deceptive_or_coercive_speech, speech_provider_called: false, credits_charged: 0}
