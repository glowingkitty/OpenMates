schema_version: 1
id: feature.app-skill.web-search
version: 1
status: approved
title: Web Search
summary: >
  Search the public web for current information and return sanitized,
  attributable result groups consistently across all OpenMates platforms.

inherits:
  - architecture.app-skill-execution@1
  - architecture.platform-parity@1

scope:
  includes:
    - Public web discovery for current general information
    - One to five independent search requests per invocation
    - Sanitized grouped website results and explicit empty/error behavior
  excludes:
    - Reading the complete contents of a known URL
    - Private or authenticated third-party pages
    - Specialized search when a dedicated OpenMates skill applies

models:
  WebSearchRequest:
    requests:
      type: array
      required: true
      items: WebSearchRequestItem
      constraints: {min_items: 1, max_items: 5}

  WebSearchRequestItem:
    id:
      type: string_or_integer
      nullable: true
      constraints: {auto_generate_when_missing: sequential_integer}
    query:
      type: string
      required: true
      constraints: {trim: true, blank: false, min_length: 1, max_length: 400}
    count:
      type: integer
      default: 6
      constraints: {minimum: 1, maximum: 20}
    country:
      type: string
      default: US
      constraints:
        case_insensitive: true
        invalid_value: fallback_to_US
        values: [ALL, AR, AT, AU, BE, BR, CA, CH, CL, CN, DE, DK, ES, FI, FR, GB, GR, HK, ID, IN, IT, JP, KR, MX, MY, NL, NO, NZ, PH, PL, PT, RU, SA, SE, TR, TW, US, ZA]
    search_lang:
      type: string
      default: en
      constraints: {format: iso_639_1}
    safesearch:
      type: enum
      default: moderate
      values: [off, moderate, strict]
      constraints: {invalid_value: fallback_to_moderate}
    filter_tabloids:
      type: boolean
      default: true

  WebSearchResult:
    title:
      type: string
      required: true
      constraints: {html: stripped, blank: false}
    url:
      type: string
      required: true
      constraints: {format: absolute_http_or_https_url}
    description:
      type: string
      required: true
      constraints: {html: stripped}
    age: {type: string, nullable: true}
    meta_url: {type: object, nullable: true}
    language: {type: string, nullable: true}
    family_friendly: {type: boolean, default: true}

  WebSearchResultGroup:
    id:
      type: string_or_integer
      required: true
    results:
      type: array
      required: true
      items: WebSearchResult
      constraints: {min_items: 0, max_items: 20}

  WebSearchResponse:
    results:
      type: array
      required: true
      items: WebSearchResultGroup
      constraints: {min_items: 0, max_items: 5, unique_by: id}
    provider:
      type: string
      required: true
      default: Brave Search
    suggestions_follow_up_requests:
      type: array
      nullable: true
      items: string
    error:
      type: string
      nullable: true
      constraints: {secrets: forbidden, raw_provider_diagnostics: forbidden}

assertions:
  - id: web-search.request.validated
    type: validation
    must: Invalid request shape, query, count, or batch size is rejected before provider execution.
    depends_on: [models.WebSearchRequest, models.WebSearchRequestItem, examples.invalid_inputs, examples.boundary_cases]
  - id: web-search.request.ids-correlated
    type: invariant
    must: Each result group preserves its caller ID or receives a unique sequential ID when none was supplied.
    depends_on: [models.WebSearchRequestItem.id, models.WebSearchResultGroup.id, examples.valid_inputs]
  - id: web-search.response.sanitized
    type: security
    must: Provider titles and descriptions are sanitized as untrusted external data before client exposure or persistence.
    depends_on: [models.WebSearchResult, examples.successful_outputs]
  - id: web-search.results.bounded
    type: invariant
    must: Each request returns no more than its requested count and never more than 20 results.
    depends_on: [models.WebSearchRequestItem.count, models.WebSearchResultGroup.results, examples.boundary_cases]
  - id: web-search.no-results.explicit
    type: behavior
    must: A successful zero-hit request returns an empty finished result group and never an app-skill processing error.
    depends_on: [models.WebSearchResultGroup, models.WebSearchResponse.error, examples.successful_outputs]
  - id: web-search.provider-error.visible
    type: failure
    must: Provider failures produce a safe visible error and are never represented as a successful zero-hit search.
    depends_on: [models.WebSearchResponse.error, examples.error_outputs]
  - id: web-search.secrets.never-exposed
    type: privacy
    must: Provider credentials, internal headers, raw diagnostics, and private logs never reach responses, embeds, clients, or committed examples.
    depends_on: [models.WebSearchResponse.error, examples.error_outputs]
  - id: web-search.surface-parity
    type: parity
    must: REST API, CLI, npm/pip SDKs, and web/Apple GUI preserve the same request, response, empty, error, privacy, and security semantics.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: strict
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [valid_inputs, invalid_inputs, successful_outputs, error_outputs, boundary_cases]
