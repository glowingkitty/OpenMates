schema_version: 1
id: feature.app-skill.code-run
version: 1
status: draft
title: Code Run Skill
summary: >
  Code Run executes bounded user-provided or assistant-created code in an
  isolated E2B sandbox or an explicitly authorized confined remote Project, streams terminal results, persists chat-bound output and
  intentional artifacts safely, and exposes equivalent direct-run semantics
  across REST, CLI, SDK, assistant, web, and Apple surfaces.

inherits:
  - architecture.app-skill-execution@1

scope:
  includes:
    - Direct and chat-bound Code Run app-skill requests
    - Web fullscreen Code Run, assistant tool use, CLI, npm SDK, pip SDK, and REST API access
    - File/path validation, dependency-manifest validation, language dispatch, internet controls, cancellation, rate limits, and credit billing
    - Live terminal streaming, status polling, visible failure states, and encrypted chat-bound terminal output sidecars
    - Explicit output artifact discovery inside E2B before teardown, encrypted artifact storage, generated-asset download metadata, typed child embeds, and same-path artifact version history
    - Assistant auto-run, debug, and rerun behavior for code created or edited in the current assistant turn
    - Explicit remote Project execution, exact command approvals and user-enabled command lists, scoped network/credentials, independent command explanations, and event-driven wait/continue behavior
    - Remote-command access to ignored dependencies and build outputs while deterministic Project private paths remain inaccessible
    - Required terminal-text safety coverage for live batches, completion results and later inference-cache hydration
  excludes:
    - Backend execution, importing, package installation, linting, formatting, cloning, or URL fetching of user code outside E2B
    - Persisting direct-run source code, terminal output, artifacts, messages, embeds, embed keys, or code_run_outputs unless the caller uses chat-bound mode
    - Blanket capture of all new, changed, or deleted sandbox workspace files
    - Exposing source code, terminal output, artifact bytes, encryption keys, nonces, signed tokens, provider diagnostics, sandbox internals, or private logs outside their approved encrypted/client-visible contexts
    - Private repository authentication or unbounded arbitrary binary project uploads in v1

models:
  RemoteCommandRequest:
    target: {type: enum, values: [remote_source], required: true}
    project_id: {type: string, required: true}
    source_id: {type: string, required: true}
    chat_id: {type: string, required: true}
    argv: {type: array, required: true, constraints: {exact_arguments: true, shell_expansion: forbidden}}
    cwd: {type: string, required: true, constraints: {project_relative: true}}
    wait_for_completion: {type: boolean, default: true}
    background: {type: boolean, default: false}
    timeout_seconds: {type: integer, required: true, constraints: {finite: true}}
    access_profiles: {type: array, constraints: {explicit_user_activation: true}}
  CodeRunRequest:
    mode:
      type: enum
      required: true
      values: [direct, chat_bound]
    files:
      type: array
      required: true
      items: CodeRunInputFile
      constraints: {min_items: 1, max_items_configured: true}
    entry_path:
      type: string
      nullable: true
      constraints: {relative: true, parent_traversal: forbidden, max_length: 255}
    chat_id:
      type: string
      nullable: true
      constraints: {required_for_chat_bound: true, forbidden_for_direct: true}
    target_embed_id:
      type: string
      nullable: true
      constraints: {required_for_chat_bound: true, forbidden_for_direct: true}
    enable_internet:
      type: boolean
      required: true
      default: true
    dependency_installs:
      type: array
      required: true
      items: CodeRunDependencyInstall
      constraints: {max_items_configured: true}

  CodeRunInputFile:
    path:
      type: string
      required: true
      constraints: {relative: true, parent_traversal: forbidden, absolute_path: forbidden, hidden_segments_default_forbidden: false, max_length: 255}
    content_base64:
      type: string
      required: true
      constraints: {valid_base64: true, utf8_required_for_code: true, max_file_chars_configured: true}
    language:
      type: string
      required: true
    mime_type:
      type: string
      default: text/plain
    is_target:
      type: boolean
      default: false

  CodeRunExecution:
    execution_id: {type: string, required: true}
    status:
      type: enum
      required: true
      values: [queued, preparing_sandbox, uploading_files, installing_dependencies, running, cancelling, finished, failed, timeout, cancelled]
    target_filename: {type: string, required: true}
    files:
      type: array
      required: true
      items: string
    events:
      type: array
      required: true
      items: CodeRunTerminalEvent
    exit_code: {type: integer, nullable: true}
    charged_credits: {type: integer, nullable: true}

  CodeRunTerminalEvent:
    kind:
      type: enum
      required: true
      values: [status, stdout, stderr]
    text:
      type: string
      required: true
      constraints: {secret_redacted: true, max_output_chars_configured: true}
    timestamp: {type: number, required: true}

  CodeRunOutputSidecar:
    encrypted_payload:
      type: string
      required: true
      constraints: {client_side_encrypted_with_embed_key: true}
    inference_payload:
      type: object
      nullable: true
      constraints: {vault_encrypted_cache_only: true, truncated: true, artifact_sensitive_fields_forbidden: true}
    persistence:
      type: enum
      required: true
      values: [none, encrypted_chat_bound_latest]

  CodeRunArtifactDiscovery:
    roots:
      type: array
      required: true
      items: string
      constraints: {default: [outputs], normalized_relative_paths_only: true}
    manifest:
      type: object
      nullable: true
      constraints: {filename: openmates_outputs.json, optional: true, schema_validated: true}
    capture_policy:
      type: enum
      required: true
      values: [explicit_outputs_only]
      constraints: {blanket_workspace_diff: forbidden}

  CodeRunArtifactFile:
    path:
      type: string
      required: true
      constraints: {relative: true, parent_traversal: forbidden, hidden_segments: forbidden, max_length: 255}
    normalized_path:
      type: string
      required: true
      constraints: {dedupe_key: chat_bound_artifact_history}
    mime_type:
      type: string
      required: true
      constraints: {allowlist_required: true}
    size_bytes:
      type: integer
      required: true
      constraints: {minimum: 1, maximum_per_file_configured: true}
    kind:
      type: enum
      required: true
      values: [image, data, document, archive, text]
    status:
      type: enum
      required: true
      values: [captured, skipped, rejected, storage_failed]

  CodeRunArtifactStorage:
    encrypted_private_s3: {type: boolean, required: true, constraints: {always_true: true}}
    upload_files_indexed: {type: boolean, required: true}
    download_url:
      type: string
      nullable: true
      constraints: {short_lived: true, server_side_decrypted: true, direct_runs_only_or_authorized_client: true}
    inference_excluded_fields:
      type: array
      required: true
      items: string
      constraints: {must_include: [bytes, aes_key, aes_nonce, vault_wrapped_aes_key, download_url, token, s3_key, sandbox_id]}

  CodeRunArtifactHistory:
    normalized_path: {type: string, required: true}
    child_embed_id:
      type: string
      required: true
      constraints: {stable_per_chat_parent_and_normalized_path: true}
    latest_version:
      type: integer
      required: true
      constraints: {monotonic_per_chat_and_path: true}
    previous_versions_retained: {type: boolean, required: true}
    visible_embed_count:
      type: integer
      required: true
      constraints: {same_path_chat_bound_runs: 1}

  CodeRunArtifactChild:
    embed_id: {type: string, required: true}
    parent_embed_id:
      type: string
      required: true
      constraints: {equals_target_embed_id: true, inherits_parent_embed_key: true}
    normalized_path: {type: string, required: true}
    source_execution_id: {type: string, required: true}
    artifact_version: {type: integer, required: true, constraints: {minimum: 1}}
    app_id: {type: string, required: true}
    frontend_type: {type: string, required: true}
    renderer:
      type: enum
      required: true
      values: [registered_native, generic_file]
    storage_ref:
      type: object
      required: true
      constraints: {authorized_encrypted_generated_asset_only: true, inference_safe: true}

  CodeRunArtifactRouting:
    native_match:
      type: object
      required: true
      constraints: {registered_embed_type_required: true, compatible_payload_required: true}
    fallback:
      type: object
      required: true
      constraints: {app_id: file, frontend_type: file-file, downloadable: true, executable_preview: forbidden}
    parent_child_order:
      type: array
      required: true
      items: string
      constraints: {source: normalized_output_path, deterministic: true, duplicate_ids: forbidden}

  AssistantCodeRunAutonomy:
    allowed_without_prompt:
      type: array
      required: true
      items: string
      constraints: {values: [current_turn_created_code, current_turn_edited_code]}
    requires_prompt:
      type: array
      required: true
      items: string
      constraints: {must_include: [unmodified_user_supplied_code, repeated_failures, unexpected_network_or_security_risk]}
    failure_limit:
      type: integer
      required: true
      constraints: {maximum_unprompted_reruns: 2}

assertions:
  - id: code-run.request.validated
    type: validation
    must: Direct and chat-bound Code Run requests validate mode, chat/embed ownership, paths, target selection, payload size, file count, base64/UTF-8 content, language support, dependency manifests, and internet flag shape before any sandbox is started.
    depends_on: [models.CodeRunRequest, models.CodeRunInputFile, examples.valid_requests, examples.invalid_requests]
  - id: code-run.execution.e2b-only
    type: security
    must: The default code/file execution target remains E2B. Remote Project execution is permitted only through an explicitly selected, authorized, OS-confined remote CLI executor governed by the remote-command assertions. OpenMates backend hosts treat source and generated files as inert data and never execute, import, clone, shell out, lint, format, package-install, or fetch user-supplied code themselves. A failed or unavailable remote executor never falls back to backend execution or unrestricted host access.
    depends_on: [models.CodeRunExecution]
  - id: code-run.remote.confinement
    type: security
    must: Remote commands require current access and the target Project's active focus in the originating chat. OS-enforced filesystem and process boundaries confine the command and descendants to declared Project/toolchain/cache access; cwd alone is insufficient. Unsupported isolation fails visibly without an unrestricted fallback. Background services have read-only source plus declared writable cache/output paths. Source-writing commands coordinate against overlapping Project edits during execution without holding reservations while explaining or awaiting permission.
    depends_on: [models.RemoteCommandRequest]
  - id: code-run.remote.ignored-project-files
    type: behavior
    must: Git-ignore rules do not remove files from an otherwise authorized confined command filesystem. An exact approved command may read ignored dependencies such as node_modules and may read or write ignored build outputs when its reviewed source mode and writable profiles allow them. This command-only access does not add ignored names or contents to Project list, search, direct read, model context, artifacts, or later commands, and it never overrides the Project private-path boundary.
    depends_on: [models.RemoteCommandRequest, examples.remote_commands]
  - id: code-run.remote.private-path-deny
    type: security
    must: On supported Linux remote executors, an AppArmor-first command adapter applies kernel-enforced per-access restrictions to the original live Project folder and every command descendant. Private filenames and ordinary metadata may remain visible, but opening, reading, mapping, executing, overwriting, renaming, linking, or otherwise obtaining or changing private content is denied. Pathname enforcement covers newly created matching private paths, symlinks resolving into denied paths, and known pre-existing hard-link aliases; the sandbox cannot create or rename a denied source into an allowed alias. Source-owning peers using the same policy retain that boundary. An external unconfined owner deliberately copying or hard-linking private data to a new allowed pathname republishes that data outside this path-based boundary, just as copying a secret into ordinary source would. Command approval, preset activation, read-write source mode, an exact ignored-file grant, shell composition, repository instructions, deleting or editing policy files, or reconnecting cannot weaken active policy. The adapter uses no copied source tree, overlay worktree, staging mirror, or post-command writeback. If current private rules cannot be represented and enforced for the execution lifetime, launch fails with a visible unsupported-confinement result rather than direct unconfined execution. Private bytes do not enter review, output, logs, artifacts, or model context; a visible filename alone is not treated as content disclosure.
    depends_on: [models.RemoteCommandRequest, examples.remote_commands]
  - id: code-run.remote.explicit-approval
    type: security
    must: Remote commands default to Ask first. Approval is bound to the exact command or script, arguments, target Project/source/device, cwd, requested resources and execution identity. A current explicitly user-enabled command list may preapprove an exact match; other eligible commands still ask and denied actions remain denied. Changed requests need a current matching grant or new approval. File Apply and show mode, model output, repository instructions and E2B rerun markers cannot authorize remote commands. Replayed delivery reconciles the original execution rather than executing twice.
  - id: code-run.remote.command-lists
    type: security
    must: Reviewable command-list definitions may be stored in .openmates/permissions.yml. The file is private from agent file and terminal access; loading, cloning, pulling or any attempted agent edit cannot activate or broaden permission grants or weaken file_access.private_paths. Only an explicit user action outside agent-controlled Project operations activates a scoped selection in trusted state outside the command-writable Project; changes cannot inherit a mismatched prior grant. Matching uses explicit argv/cwd/resource scope rather than broad shell prefixes, and never bypasses current Project authority, private paths, or isolation. Users can inspect and revoke their selections.
  - id: code-run.remote.explanation
    type: behavior
    must: Before each remote execution, a separate Gemini Flash-Lite call explains the exact command's expected effects and uncertainty using fixed review instructions and minimal authorized context. It does not inherit the coding conversation or Project agent instructions, treats code/comments as untrusted data, receives no credential values and has no execution or approval authority. The configured latest supported Flash-Lite version is explicit. A reassuring explanation never bypasses permissions; explanation failure is visible and cannot silently authorize execution.
  - id: code-run.remote.resource-profiles
    type: security
    must: Remote commands start without network or credentials and receive a minimal environment rather than inherited host secrets. Users may explicitly enable reusable Project profiles for named destinations and selected credentials; requested expansions are presented with the command approval. Command preapproval does not grant resource access. Every execution enforces current granted destinations and credential scope, including child processes. Credential values stay out of model review and durable server plaintext; resource enforcement failure does not justify unrestricted access.
  - id: code-run.remote.managed-jobs
    type: behavior
    must: A remote execution has stable identity, visible status/logs, finite approved lifetime and authenticated Stop control over its owned process tree. Explicit background mode lets authorized work continue while the chat performs independent work. Browser closure alone does not revoke a connected executor's grant. Cancellation, timeout and revoked authorization prevent new work and terminate owned processes when reachable; disconnected executors use a bounded local lease and uncertain outcomes remain visible until reconciled. No blind relaunch or indefinite detached daemon is permitted. Test/build results must not claim a coherent latest revision when inputs changed during execution.
  - id: code-run.execution.wait-or-continue
    type: behavior
    must: The agent can request waiting for a terminal result when subsequent work depends on it or continue independent work and receive a later completion through the shared app-skill async lifecycle. Waiting uses events rather than repeated model polling. Process background lifetime is a separate permission from chat waiting. Completion is scoped and deduplicated, incorporates current chat context, and cannot revive a canceled or expired run. A dev server's readiness is distinct from process completion and cannot be established solely by arbitrary stdout instructions.
    depends_on: [models.RemoteCommandRequest]
  - id: code-run.output.external-text-guard
    type: security
    must: Terminal stdout/stderr, errors and model-visible terminal metadata are untrusted external text even for assistant-authored commands. Apply bounded secret/control/ASCII cleanup and the shared semantic scanner before autonomous model consumption, with explicit coverage including short text. Exact verified injection spans are redacted; checked uncertainty remains untrusted text. Technical timeout, unavailable, malformed or oversized scans withhold that text from autonomous inference while preserving process status and an honest unreviewed user log. This stricter terminal consumption gate does not silently change unrelated app-skill fallback behavior or grant authority to output text.
  - id: code-run.output.cached-inference-guard
    type: security
    must: The same terminal safety boundary covers completed async results and subsequent code_run_outputs inference-cache hydration, including legacy unreviewed entries. A scan of the initial processing response is not coverage for later logs. Only server-controlled exact-content/policy coverage may authorize scan reuse; ciphertext or client-supplied flags cannot prove a separate inference copy was scanned. Preserve client-encrypted durable output and authorized transient AI context without giving the server independent stored-file decryption authority.
  - id: code-run.output.bounded-delivery
    type: invariant
    must: Short command output may be scanned once at completion; long output is delivered in bounded ordered batches with neighboring context and explicit truncation/coverage status. Status may update live without waking the coding model for every line. No model call per byte, unbounded queue, repeated scan of unchanged text or claim of whole-transcript coverage after scanning only a selected excerpt is permitted. UI logs render inert text without active terminal escape actions. Summaries and checkpoints cannot bypass input scanning.
  - id: code-run.execution.stream-status-visible
    type: behavior
    must: Every accepted run exposes an execution id, status path, stream path, target filename, file list, live status/stdout/stderr events, final status, exit code when available, duration, and safe visible errors for startup, dependency, runtime, timeout, cancellation, and capacity failures.
    depends_on: [models.CodeRunExecution, models.CodeRunTerminalEvent, examples.execution_outputs, examples.error_outputs]
  - id: code-run.billing.rate-limits
    type: invariant
    must: Code Run applies authenticated owner/device/API-key scoping, active-run and provider-capacity limits, configured rate limits, and minute-rounded credit billing only for runs that enter billable sandbox work, with visible not-enough-credit and capacity errors.
    depends_on: [models.CodeRunExecution, examples.billing_and_limits]
  - id: code-run.output.chat-bound-encrypted
    type: privacy
    must: Chat-bound terminal output persists only as the latest client-encrypted code_run_outputs sidecar for the target embed, with a truncated vault-encrypted inference cache that excludes artifact bytes, keys, signed URLs, tokens, s3 keys, sandbox ids, and raw diagnostics.
    depends_on: [models.CodeRunOutputSidecar, examples.chat_bound_outputs]
  - id: code-run.output.direct-transient
    type: behavior
    must: Direct CLI/API/SDK runs return run-scoped terminal output and artifact metadata for that execution without creating chat messages, embeds, embed keys, code_run_outputs, or artifact history unless the caller explicitly uses chat-bound mode.
    depends_on: [models.CodeRunRequest, models.CodeRunOutputSidecar, examples.direct_outputs]
  - id: code-run.artifacts.explicit-only
    type: security
    must: Code Run artifact collection captures only files under explicit output roots or valid openmates_outputs.json entries, after path normalization, allowlist checks, denylists, and configured size/count caps; it never captures arbitrary workspace diffs, hidden files, dependency caches, credentials, environment files, or temporary files.
    depends_on: [models.CodeRunArtifactDiscovery, models.CodeRunArtifactFile, examples.valid_artifacts, examples.rejected_artifacts]
  - id: code-run.artifacts.encrypted-indexed
    type: privacy
    must: Captured persisted artifacts are stored encrypted in private chatfiles storage, indexed in upload_files for ownership/storage accounting, and exposed only through authorized generated-asset metadata or short-lived download URLs without leaking keys, tokens, sandbox internals, or raw bytes to LLM inference, logs, committed examples, or public examples.
    depends_on: [models.CodeRunArtifactStorage, examples.successful_artifacts, examples.error_outputs]
  - id: code-run.artifacts.chat-bound-versioned
    type: behavior
    must: Each successfully captured chat-bound output file is represented by exactly one child embed of the target Code Run parent; later successful captures of the same normalized path preserve that child embed id, update its latest version, and retain prior versions in artifact history instead of adding a duplicate child.
    depends_on: [models.CodeRunArtifactHistory, models.CodeRunArtifactChild, examples.artifact_version_history]
  - id: code-run.artifacts.child-renderer-routing
    type: behavior
    must: Each output child uses a registered native file-capable embed only when its MIME type and stored payload satisfy that embed contract; every other accepted output uses the generic File app `file-file` embed, which exposes safe metadata and authorized download without executing or interpreting the file.
    depends_on: [models.CodeRunArtifactChild, models.CodeRunArtifactRouting, examples.artifact_child_routing]
  - id: code-run.artifacts.parent-child-navigation
    type: behavior
    must: The Code Run parent stores a deterministic ordered list of all current output child embed ids, its fullscreen lists every child, selecting a child opens that child's registered fullscreen renderer, and closing or navigating back restores the parent fullscreen without losing terminal or run state.
    depends_on: [models.CodeRunArtifactChild, models.CodeRunArtifactRouting, examples.artifact_child_navigation]
  - id: code-run.gui.split-layout-width
    type: behavior
    must: In split-screen Code Run mode, chat history and composer use the full width allocated to the chat column with container-relative padding rather than viewport-relative gutters, while the Code Run panel remains independently scrollable and does not overlap chat content or controls on supported laptop and phone viewports.
    depends_on: [examples.responsive_layout]
  - id: code-run.assistant.auto-debug-bounded
    type: behavior
    must: The assistant may auto-run Code Run, inspect terminal output and captured artifact metadata, patch, and rerun only for code it created or edited in the current turn, while applying existing credits/rate limits and visible status; it asks before running unmodified user-supplied code, before continuing after repeated failures, or when unexpected network/security risk appears.
    depends_on: [models.AssistantCodeRunAutonomy, examples.assistant_autonomy]
  - id: code-run.surface-parity
    type: parity
    must: REST API/WebSocket status, CLI, npm/pip SDKs, assistant, web GUI, and Apple GUI preserve the same request, execution-boundary, streaming, billing, cancellation, output persistence, artifact-child identity/routing, version-history, privacy, and visible-failure semantics or record explicit approved exceptions.
    depends_on: [models, examples, applies_to]

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [valid_requests, invalid_requests, execution_outputs, billing_and_limits, chat_bound_outputs, direct_outputs, valid_artifacts, rejected_artifacts, successful_artifacts, artifact_version_history, artifact_child_routing, artifact_child_navigation, responsive_layout, assistant_autonomy, error_outputs, boundary_cases, remote_commands, terminal_output_safety]
