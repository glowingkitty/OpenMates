schema_version: 1
specification: feature.app-skill.code-run@1

remote_commands:
  - id: isolated-explanation-has-no-authority
    assertion_ids: [code-run.remote.explanation]
    given: A reviewed command contains a comment asking the reviewer to approve all commands, while the coding chat contains private Project instructions.
    when: The separate Flash-Lite explanation call receives the exact command and fixed review instructions.
    then: It receives neither the chat instructions nor credential values, treats the comment as untrusted input, and cannot mint an approval. A failed explanation stops review with a visible failure.
  - id: remote-ask-first
    assertion_ids: [code-run.remote.explicit-approval, code-run.remote.explanation]
    given: Project focus is active and file writes use Apply and show; no command list is enabled.
    when: The agent proposes npm test on the connected machine.
    then: An independent Flash-Lite explanation and exact Run once approval precede execution. File policy and E2B markers do not authorize it.
  - id: remote-selected-checks
    assertion_ids: [code-run.remote.command-lists]
    given: The user explicitly enabled exact npm test and npm run lint commands at the Project root.
    when: The agent requests npm test, npm install, or npm test followed by a second shell command.
    then: Only the exact test match is preapproved. Other eligible requests ask; all retain explanations, scope and resource checks.
  - id: repo-policy-self-escalation
    assertion_ids: [code-run.remote.command-lists, code-run.remote.private-path-deny]
    given: An enabled list excludes package installation.
    when: An agent tries to read or edit .openmates/permissions.yml, or runs a shell command intended to add npm install, remove private_paths, or disable isolation.
    then: File and command access cannot expose or mutate the private policy file. Active grants and private masks remain unchanged; permission changes require an explicit user action outside agent-controlled Project operations.
  - id: approved-test-uses-ignored-dependencies-and-build-output
    assertion_ids: [code-run.remote.ignored-project-files]
    given: node_modules/ and dist/ are Git-ignored, private paths do not overlap them, and the user approves exact npm test with read-write source access for its declared build output.
    when: The confined command loads node_modules and writes dist/test-report.json.
    then: The command may use those ignored paths within its reviewed scope. Their names and contents do not become agent list/search/direct-read results or durable artifacts unless a separate authorized rule permits that surface.
  - id: approved-shell-cannot-open-private-source
    assertion_ids: [code-run.remote.private-path-deny]
    given: .env, .git/config, .openmates/permissions.yml, and private/customer.pem are covered by built-in or configured private rules.
    when: A user approves an exact shell command that attempts to cat them directly, through a symlink, or through a known pre-existing hard-link alias.
    then: The command may observe a filename or ordinary metadata but cannot open, read, map, execute, modify, rename, or link private content. If kernel enforcement cannot be established for the live folder, launch fails with unsupported confinement; approval does not turn a private path into command input or output.
  - id: private-file-created-after-command-launch
    assertion_ids: [code-run.remote.private-path-deny]
    given: An approved long-running command uses the original Project folder under the current private-path policy.
    when: Another local process creates a newly matching private file or a symlink resolving into a denied path after the command starts, and the command lists then opens it.
    then: Its filename may appear, but the kernel applies the same policy at access time and denies content access or mutation without stopping ordinary direct edits elsewhere. No copied tree or writeback phase is involved. An external unconfined owner copying or hard-linking the bytes to a new allowed pathname would instead republish them outside pathname enforcement and is not claimed as data-taint protection.
  - id: command-change-after-review
    assertion_ids: [code-run.remote.explicit-approval]
    given: A user reviewed a command for one source, cwd and resource profile.
    when: Its arguments, source, cwd or required access change before execution.
    then: The old exact approval does not authorize the changed request; current grants are checked again.
  - id: offline-minimal-environment
    assertion_ids: [code-run.remote.resource-profiles]
    given: The host has cloud credentials and SSH keys but the Project has no enabled resource profiles.
    when: An approved command runs.
    then: It receives neither those credentials nor network access; cwd, toolchain and cache access are enforced by the OS sandbox.
  - id: resource-profile-reuse
    assertion_ids: [code-run.remote.resource-profiles]
    given: The user enabled the npm registry profile without credentials.
    when: An approved package command requests that registry and then an unrelated destination or token.
    then: Existing registry access needs no repeat prompt; additional access is not silently granted.
  - id: sandbox-unavailable
    assertion_ids: [code-run.execution.e2b-only, code-run.remote.confinement]
    given: The remote host cannot establish the declared isolation.
    when: A user-approved command is dispatched.
    then: It fails with a capability error before execution, without host-wide or backend fallback.
  - id: wait-and-continue
    assertion_ids: [code-run.execution.wait-or-continue]
    given: Tests are running as an async skill job.
    when: The next action depends on their result, or the agent has independent documentation work.
    then: The first case waits for the result event; the second may continue and receive completion later. Neither uses model polling.
  - id: stop-and-reconnect
    assertion_ids: [code-run.remote.managed-jobs]
    given: A tracked background job has an approved lifetime and a connected executor.
    when: The user closes the browser, later stops the job, or the executor disappears.
    then: Browser closure alone does not revoke the grant. Stop targets owned descendants; an unreachable executor's outcome remains uncertain until reconciled and is never blindly rerun.
  - id: command-versus-chat-edit
    assertion_ids: [code-run.remote.confinement]
    given: A formatter may write src while another chat prepares a src edit.
    when: They reach execution or commit.
    then: Overlapping mutations coordinate. A source-read-only dev server with separate cache writes does not reserve src indefinitely.

terminal_output_safety:
  - id: terminal-injection-and-short-lines
    assertion_ids: [code-run.output.external-text-guard]
    given: A command emits a short assistant-directed instruction or an instruction spanning neighboring output units.
    when: Output is prepared for the coding model.
    then: Required terminal coverage and contextual scanning apply; verified attack spans become a marker and cannot grant permissions.
  - id: terminal-scan-technical-failure
    assertion_ids: [code-run.output.cached-inference-guard, code-run.output.bounded-delivery]
    given: Output scanning times out or returns incomplete results.
    when: The process finishes normally.
    then: Status and an honest unreviewed log remain available, but that text is withheld from autonomous inference. The command is not restarted and the scan is not called safe.
  - id: terminal-scan-uncertain
    assertion_ids: [code-run.output.external-text-guard]
    given: The completed scanner returns a valid uncertain decision for quoted documentation.
    when: The result is delivered.
    then: Preserve the cleaned text as untrusted data under the existing uncertain policy; uncertainty is distinct from a technical unscanned result.
  - id: terminal-cached-output-bypass
    assertion_ids: [code-run.output.cached-inference-guard]
    given: A later chat turn resolves a code embed with legacy cached output or a client-claimed scanned flag.
    when: Embed context is assembled.
    then: Missing server-controlled exact coverage prevents autonomous ingestion. A previously scanned processing response or separate ciphertext is insufficient.
  - id: terminal-bounded-stream
    assertion_ids: [code-run.output.bounded-delivery]
    given: A long command emits more output than the selected inference budget and includes terminal control sequences.
    when: Logs and model checkpoints are delivered.
    then: Neutralize terminal actions, bound batches/queues, preserve order and neighboring context, report truncation, and scan only new selected text. Do not claim full transcript coverage or wake the coding model per line.
  - id: terminal-late-result-after-stop
    assertion_ids: [code-run.remote.managed-jobs]
    given: A command's original chat run was canceled or expired.
    when: A delayed checked completion arrives twice.
    then: Record the original execution outcome once without reviving the stopped chat or launching duplicate effects.

valid_requests:
  - id: direct-inline-python
    input:
      mode: direct
      entry_path: main.py
      files:
        - {path: main.py, content_base64: cHJpbnQoJ29rJykK, language: python, is_target: true}
      enable_internet: true
    expect: {accepted: true, endpoint: /v1/apps/code/skills/run, chat_bound: false}
  - id: chat-bound-existing-embed
    input:
      mode: chat_bound
      chat_id: <CHAT_ID>
      target_embed_id: <CODE_EMBED_ID>
      selected_embed_ids: [<CODE_EMBED_ID>, <ATTACHMENT_EMBED_ID>]
    expect: {uses_chat_embed_access_checks: true, may_persist_output_sidecar: true}
  - id: no-internet-direct-run
    input:
      mode: direct
      entry_path: main.py
      files: [{path: main.py, content_base64: cHJpbnQoJ29rJykK, language: python}]
      enable_internet: false
    expect: {e2b_allow_internet_access: false, public_traffic: false}

invalid_requests:
  - id: direct-chat-fields-rejected
    input: {mode: direct, chat_id: <CHAT_ID>, target_embed_id: <CODE_EMBED_ID>, files: []}
    expect_error: {constraint: CodeRunRequest.chat_id.forbidden_for_direct}
  - id: chat-bound-missing-target
    input: {mode: chat_bound, chat_id: <CHAT_ID>}
    expect_error: {constraint: CodeRunRequest.target_embed_id.required_for_chat_bound}
  - id: unsafe-path
    input:
      mode: direct
      entry_path: ../main.py
      files: [{path: ../main.py, content_base64: cHJpbnQoJ3gnKQ==, language: python}]
    expect_error: {constraint: CodeRunInputFile.path.parent_traversal}
  - id: unsafe-requirements
    input:
      mode: direct
      entry_path: main.py
      files:
        - {path: main.py, content_base64: cHJpbnQoJ3gnKQ==, language: python}
        - {path: requirements.txt, content_base64: Z2l0K2h0dHBzOi8vZXhhbXBsZS5jb20vcmVwby5naXQK, language: text}
    expect_error: {constraint: dependency_manifest.safe_packages_only}

execution_outputs:
  - id: live-terminal-events
    output:
      execution_id: run-1
      status: finished
      target_filename: main.py
      files: [main.py]
      events:
        - {kind: status, text: "Queued code run...\n", timestamp: 1786383000}
        - {kind: status, text: "Starting sandbox...\n", timestamp: 1786383001}
        - {kind: stdout, text: "ok\n", timestamp: 1786383002}
      exit_code: 0
      duration_seconds: 1.2
    expect: {status_path: present, stream_path: present, stdout_streamed_live: true}
  - id: cancellation-visible
    output:
      execution_id: run-cancelled
      status: cancelled
      events: [{kind: status, text: "Cancelled at 10:15 after 2.1s. Charged 5 credits.\n", timestamp: 1786383003}]
    expect: {terminal_state: cancelled, final_status_visible: true}

billing_and_limits:
  - id: not-enough-credits
    input: {mode: direct, user_credits: 0}
    expect_error: {status: 402, message: Not enough credits to run code}
  - id: active-run-limit
    input: {mode: direct, already_active_runs: configured_maximum}
    expect_error: {status: 429, message: active_run_limit_visible}
  - id: completed-run-billed
    output: {duration_seconds: 61.0, credits_per_minute: 5, charged_minutes: 2, charged_credits: 10}
    expect: {billing_phase: completed, idempotent_charge: true}

chat_bound_outputs:
  - id: encrypted-output-sidecar
    output:
      chat_id: <CHAT_ID>
      embed_id: <CODE_EMBED_ID>
      encrypted_payload: <CLIENT_SIDE_CIPHERTEXT>
      inference_payload:
        type: code_run_output
        status: finished
        output: "ok\n"
        files: [main.py]
    expect: {code_run_outputs_row: latest_only, inference_cache_vault_encrypted: true}

direct_outputs:
  - id: no-chat-persistence
    input: {mode: direct, entry_path: main.py, files: [main.py]}
    output: {execution_id: run-direct-1, terminal_output: ok, artifacts: [outputs/chart.png]}
    forbidden_records: [messages, embeds, embed_keys, code_run_outputs, artifact_history]

valid_artifacts:
  - id: output-directory-image
    sandbox_files:
      - path: main.py
      - path: outputs/chart.png
    expect:
      captured: [{path: outputs/chart.png, kind: image, mime_type: image/png}]
      ignored: [main.py]
  - id: manifest-selected-data-file
    sandbox_files:
      - path: openmates_outputs.json
        content: '{"outputs":[{"path":"results/summary.csv","kind":"data"}]}'
      - path: results/summary.csv
    expect:
      captured: [{path: results/summary.csv, kind: data, mime_type: text/csv}]

rejected_artifacts:
  - id: hidden-env-file
    sandbox_files:
      - path: outputs/.env
    expect:
      captured: []
      skipped: [{path: outputs/.env, reason: hidden_or_secret_path}]
  - id: dependency-cache-ignored
    sandbox_files:
      - path: node_modules/cache.bin
      - path: __pycache__/main.pyc
    expect: {captured: [], skipped_reason: outside_explicit_outputs}
  - id: unsafe-manifest-path
    sandbox_files:
      - path: openmates_outputs.json
        content: '{"outputs":[{"path":"../secret.txt"}]}'
    expect_error: {constraint: CodeRunArtifactFile.path.parent_traversal}

successful_artifacts:
  - id: chat-bound-encrypted-image
    mode: chat_bound
    output:
      execution_id: run-1
      artifacts:
        - path: outputs/chart.png
          normalized_path: outputs/chart.png
          status: captured
          kind: image
          mime_type: image/png
          size_bytes: 4096
          storage:
            encrypted_private_s3: true
            upload_files_indexed: true
            files:
              original:
                s3_key: <ENCRYPTED_S3_KEY>
                encryption: aes-gcm-nonce-prefixed-v1
            aes_key: <BASE64_AES_KEY>
            aes_nonce: ""
            vault_wrapped_aes_key: <VAULT_WRAPPED_AES_KEY>
    expect: {child_embed_created: true, parent_embed_id: <CODE_EMBED_ID>, upload_files_indexed: true, raw_bytes_absent_from_inference: true}
  - id: direct-run-downloadable-csv
    mode: direct
    output:
      execution_id: run-2
      artifacts:
        - path: outputs/summary.csv
          normalized_path: outputs/summary.csv
          status: captured
          kind: data
          mime_type: text/csv
          size_bytes: 128
          download_url: https://api.dev.openmates.org/v1/generated-assets/<ASSET_ID>/files/original/download?token=<SIGNED_DOWNLOAD_TOKEN>
          download_expires_at: 1786383600
    expect: {chat_embed_created: false, code_run_output_sidecar_created: false, download_url_short_lived: true}

artifact_version_history:
  - id: same-path-updates-history
    given:
      chat_id: chat-1
      runs:
        - {execution_id: run-1, output_path: outputs/chart.png, content_hash: hash-v1}
        - {execution_id: run-2, output_path: outputs/chart.png, content_hash: hash-v2}
    expect:
      visible_embed_count_for_path: 1
      child_embed_id_stable: true
      latest_version: 2
      previous_versions_retained: true
  - id: different-path-adds-second-artifact
    given:
      chat_id: chat-1
      runs:
        - {execution_id: run-1, output_path: outputs/chart.png}
        - {execution_id: run-2, output_path: outputs/summary.csv}
    expect: {visible_artifact_paths: [outputs/chart.png, outputs/summary.csv]}

artifact_child_routing:
  - id: native-image-child
    given:
      parent_embed_id: <CODE_EMBED_ID>
      artifact: {path: outputs/chart.png, mime_type: image/png, storage_ref: <ENCRYPTED_GENERATED_ASSET_REF>}
      registered_native_embed: {app_id: images, frontend_type: image, accepts_mime_type: image/png}
    expect:
      child: {parent_embed_id: <CODE_EMBED_ID>, app_id: images, frontend_type: image, renderer: registered_native}
      generic_file_child_created: false
  - id: unsupported-type-uses-file-fallback
    given:
      parent_embed_id: <CODE_EMBED_ID>
      artifact: {path: outputs/model.bin, mime_type: application/octet-stream, storage_ref: <ENCRYPTED_GENERATED_ASSET_REF>}
      compatible_registered_native_embed: null
    expect:
      child: {parent_embed_id: <CODE_EMBED_ID>, app_id: file, frontend_type: file-file, renderer: generic_file}
      safe_metadata_visible: [filename, mime_type, size_bytes]
      authorized_download_available: true
      executable_preview: false
  - id: native-type-with-incompatible-payload-uses-file-fallback
    given:
      parent_embed_id: <CODE_EMBED_ID>
      artifact: {path: outputs/report.docx, mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document, storage_ref: <ENCRYPTED_GENERATED_ASSET_REF>}
      registered_embed: {app_id: docs, frontend_type: docs-doc, requires_payload_field: docx_model}
    expect:
      child: {app_id: file, frontend_type: file-file, renderer: generic_file}
      reason: stored artifact does not satisfy the native docs-doc payload contract

artifact_child_navigation:
  - id: parent-lists-all-current-children
    given:
      parent_embed_id: <CODE_EMBED_ID>
      captured_outputs:
        - {path: outputs/chart.png, child_embed_id: <IMAGE_CHILD_ID>}
        - {path: outputs/model.bin, child_embed_id: <FILE_CHILD_ID>}
    expect:
      parent_embed_ids: [<IMAGE_CHILD_ID>, <FILE_CHILD_ID>]
      parent_fullscreen_child_count: 2
      ordering: normalized_output_path
  - id: child-fullscreen-returns-to-parent
    given: {parent_fullscreen: <CODE_EMBED_ID>, selected_child: <IMAGE_CHILD_ID>}
    expect:
      opened_fullscreen: <IMAGE_CHILD_ID>
      renderer: image
      back_target: <CODE_EMBED_ID>
      parent_terminal_state_preserved: true
  - id: failed-capture-does-not-create-child
    given: {parent_embed_id: <CODE_EMBED_ID>, artifact: {path: outputs/too-large.zip, status: rejected}}
    expect: {child_embed_created: false, safe_failure_visible_on_parent: true}

responsive_layout:
  - id: laptop-split-chat-uses-allocated-column
    given: {viewport: 1440x900, code_run_panel_open: true, chat_column_width: 400}
    expect:
      chat_history_width_basis: chat_column
      viewport_relative_horizontal_gutters: false
      composer_and_history_aligned: true
      overlap: false
  - id: phone-code-run-controls-contained
    given: {viewport: 390x844, code_run_panel_open: true}
    expect: {horizontal_overflow: false, terminal_scroll_independent: true, primary_controls_visible: true}

assistant_autonomy:
  - id: current-turn-created-code-rerun
    given: assistant creates code that writes outputs/chart.png
    when: first run fails with ImportError
    expect: {assistant_may_patch_and_rerun_without_prompt: true, maximum_unprompted_reruns: 2, terminal_visible: true}
  - id: unmodified-user-code-asks-first
    given: user pasted an unmodified script that downloads unknown URLs
    expect: {assistant_requires_confirmation_before_run: true}
  - id: repeated-failures-ask-first
    given: assistant-created code failed three consecutive Code Run attempts
    expect: {assistant_requires_confirmation_before_next_rerun: true}

error_outputs:
  - id: runtime-failure-visible
    output:
      execution_id: run-failed
      status: failed
      exit_code: 1
      events: [{kind: stderr, text: "ModuleNotFoundError: No module named 'pandas'\n", timestamp: 1786383004}]
    forbidden: [raw_stack_trace_from_backend, provider_api_key]
  - id: storage-failed-visible
    output:
      execution_id: run-storage-failed
      status: finished
      artifacts: []
      skipped:
        - path: outputs/chart.png
          reason: generated_asset_storage_failed
          message: Artifact storage failed. The terminal output is still available.
    forbidden: [provider_api_key, raw_stack_trace, aes_key, signed_download_token]
  - id: unauthorized-download
    request: {asset_id: <ASSET_ID>, user: other-user}
    expect_error: {status: 404, message: artifact_not_found_or_expired}

boundary_cases:
  - id: e2b-only-execution
    expect:
      user_code_runs_in_e2b_only: true
      dependency_install_runs_in_e2b_only: true
      artifact_discovery_before_e2b_close: true
      openmates_host_executes_user_code: false
      backend_clones_user_repo: false
      backend_fetches_user_code_url: false
  - id: inference-excludes-sensitive-artifact-fields
    inference_payload:
      type: code_run_output
      output: terminal text
      artifacts:
        - {path: outputs/chart.png, kind: image, size_bytes: 4096}
    forbidden: [bytes, aes_key, aes_nonce, vault_wrapped_aes_key, download_url, token, s3_key, sandbox_id]
