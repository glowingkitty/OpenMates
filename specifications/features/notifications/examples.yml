schema_version: 1
specification: feature.notifications@2

settings_ack:
  - id: email-enable-awaits-ack
    input: {channel: email, enabled: true, websocket_send_completed: true, server_ack_received: false}
    expect: {delivery_configuration_reliable: false, client_waits_before_dependent_action: true}
  - id: push-enable-granted-ack
    input: {channel: push, permission_state: granted, subscription_registered: true, server_ack_received: true}
    expect: {delivery_configuration_reliable: true}

email_delivery:
  - id: offline-reminder-email
    notification_kind: reminder_fired
    input: {email_enabled: true, server_ack_received: true, browser_online: false, decrypted_email_available: true}
    expect: {email_delivery_dispatched: true, duplicate_email_deliveries: 0}
  - id: email-disabled-skips
    notification_kind: reminder_fired
    input: {email_enabled: false, server_ack_received: true, decrypted_email_available: true}
    expect: {email_delivery_dispatched: false, retained_history_item: true}

reminder_email_identity:
  - id: chat-title-and-note-with-default-email-settings
    assertion_ids: [notifications.reminder-email.identifiable-default]
    given: Alice enabled reminder emails and scheduled a reminder for her Plan the Berlin trip chat with the note Compare the train options. She has not chosen to hide email content.
    when: The reminder fires while her browser is closed, using the inherited email settings.
    then: The subject identifies Plan the Berlin trip and the body shows that title, her note, and Open chat. An older reminder without a captured title still shows its saved note. The scheduling flow explains that reminder details are emailed.
  - id: event-facts-and-explicit-content-opt-out
    assertion_ids: [notifications.reminder-email.identifiable-default]
    given: Bob saved Berlin design meetup for 30 October 2026 at 18:30 Europe/Berlin at Factory Berlin and scheduled a reminder one week earlier.
    when: The reminder fires with the default reminder content setting, or after Bob deliberately chose to hide email content.
    then: By default the subject and body identify the meetup and show its available description, 30 October at 18:30 CET, Factory Berlin, and the note, with the reminder delivery time separately labeled. Bob's explicit hide-content choice instead keeps the subject and body generic while preserving the action.

reminder_email_readability:
  - id: event-email-with-images-blocked
    assertion_ids: [notifications.reminder-email.readable-without-images]
    given: Alice reads her event reminder in a narrow mobile inbox that blocks images and external styles.
    when: She opens the email, including any optional preview image that cannot load.
    then: The email uses the established newsletter layout, shared header and footer, and notification bell. Its rendered embed card has the event title as alt text and shares the Open event button's destination. The title, description, date, timezone, venue, note, and action remain readable email text without horizontal scrolling or dependence on the image.
  - id: chat-reminder-in-plain-text-inbox
    assertion_ids: [notifications.reminder-email.readable-without-images]
    given: Bob's inbox displays only the plain-text alternative of his chat reminder.
    when: He reads the message.
    then: He can identify the saved chat title, reminder note, delivery time, and complete link to that chat without viewing the HTML version.

reminder_email_durability:
  - id: saved-event-reminder-after-server-cache-expiry
    assertion_ids: [notifications.reminder-email.durable-limited-context]
    given: Alice set an event reminder two months ago, its temporary embed cache has expired, and all of her clients are closed.
    when: The scheduled reminder fires.
    then: The email still identifies the saved event, time, timezone, venue, and note from its limited encrypted reminder context. The message describes saved details and does not claim the provider has reconfirmed the event.
  - id: minimal-context-retains-encryption-boundary
    assertion_ids: [notifications.reminder-email.durable-limited-context]
    given: Bob sets a reminder on an appointment embed in a private chat containing other medical notes, then later deletes the reminder.
    when: The reminder is stored, delivered if due, and deleted.
    then: Only its selected identifying details are retained as encrypted reminder context, without the full embed or surrounding chat. Logs, public image URLs, and history summaries expose none of those details; deletion removes the retained reminder context.

reminder_email_targets:
  - id: chat-and-child-embed-survive-cold-start-login
    assertion_ids: [notifications.reminder-email.exact-web-target]
    given: Alice has a chat reminder and a separate reminder for one event inside a multi-result search; she opens each email in a browser with empty local storage and no active login.
    when: She follows its action, signs in, and the application restores her encrypted data.
    then: The chat email opens the referenced chat. The event email opens that exact event detail with its source chat context after sync, including on reload, without selecting another event or the last-opened chat.
  - id: inaccessible-reminder-does-not-misdirect
    assertion_ids: [notifications.reminder-email.exact-web-target]
    given: Bob's reminder points to a deleted or inaccessible target, or the browser is signed into another account; public example and shared-chat links are also available.
    when: He opens the reminder email action and then checks the existing guest links.
    then: The reminder shows a visible target-unavailable state without private content or silent navigation to another chat. Public example and shared guest links retain their existing authorized behavior.

reminder_email_preview_access:
  - id: mail-client-fetches-only-recipient-card
    assertion_ids: [notifications.reminder-email.preview-access]
    given: Alice receives her reminder email and her mail client has no OpenMates login cookie or developer API key.
    when: It loads the reminder card using that email's private image URL.
    then: It receives only the bounded image for Alice's encrypted reminder, without a chat transcript or general embed access. The image URL exposes no title or description, image loading uses no inference, and logs do not retain its bearer token or private facts.
  - id: reminder-image-capability-is-revocable-and-bounded
    assertion_ids: [notifications.reminder-email.preview-access]
    given: Bob has an old reminder email whose token was changed, whose reminder was cancelled or deleted, or whose image is more than 90 days past its last delivery.
    when: The image is requested, including repeated or malicious image fetches.
    then: Invalid and revoked requests return the same unavailable response without private data, and excessive requests are rate-limited. The existing email text and button still identify its purpose and destination, without rendering arbitrary HTML or fetching caller-supplied remote URLs.

push_delivery:
  - id: web-push-chat-message
    notification_kind: chat_message_ready
    platform: web
    input: {push_enabled: true, permission_state: granted, subscription_registered: true}
    expect: {push_delivery_attempted: true, retained_history_item: true}
  - id: apple-push-reminder
    notification_kind: reminder_fired
    platform: apple
    input: {push_enabled: true, permission_state: granted, subscription_registered: true}
    expect: {push_delivery_attempted: true, retained_history_item: true}
  - id: denied-push-degrades
    notification_kind: workflow_chat_delivery_available
    platform: web
    input: {push_enabled: true, permission_state: denied, subscription_registered: false}
    expect: {push_delivery_attempted: false, retained_history_item: true, failure_visible_as_denied: true}

workflow_completion_delivery:
  - id: scheduled-run-completes-with-offline-apple
    assertion_ids: [notifications.workflow-run.completed-delivery]
    given: Alice has allowed Apple push and Workflow emails to her verified account address; her Apple app is closed.
    when: Her noon scheduled Workflow finishes successfully while its encrypted chat output is still awaiting a device.
    then: Both enabled channels promptly identify the completed run and its time. Apple privately decrypts the Workflow name on the device; email includes it only if Alice allowed content and otherwise identifies the run by reference. Neither channel waits for the daily digest or chat acknowledgement. Replaying completion or recovering an interrupted worker does not send either channel twice or rerun the Workflow.
  - id: completion-email-independent-of-push-and-presence
    assertion_ids: [notifications.workflow-run.completed-delivery]
    given: Bob has enabled Workflow email and is using the app, but Apple push is denied or its provider is unavailable.
    when: His scheduled Workflow completes and a worker retries its completion notification.
    then: The enabled email channel still dispatches once without private output unless Bob explicitly opted in. An email opt-out or unsubscribe prevents that email. Failed, cancelled, manual and test runs never send this scheduled-success event; the existing daily digest remains available.

workflow_completion_chat_route:
  - id: completed-workflow-created-chat-opens-after-login
    assertion_ids: [notifications.workflow-run.chat-target]
    given: Alice's scheduled Berlin weather Workflow completed and queued a message into a new chat while every client was closed.
    when: She opens its Apple push or email link and signs in if needed; another device reconnects at the same time.
    then: The authorized clients complete the fenced encrypted delivery exactly once and open the new weather chat containing that message. The notification never opens an unrelated chat or leaves Alice at the Workflow library.
  - id: completed-workflow-existing-chat-target
    assertion_ids: [notifications.workflow-run.chat-target]
    given: Bob's scheduled Workflow sent its first message to his existing Morning updates chat and later sent another message to a second chat.
    when: Bob opens either completion notification more than once.
    then: Both channels consistently open Morning updates without duplicating either message or executing the Workflow again.

workflow_completion_run_route:
  - id: completed-workflow-skipped-send-opens-exact-run
    assertion_ids: [notifications.workflow-run.run-target]
    given: Alice's scheduled rain check completed successfully, but its condition was false so no Send message step ran.
    when: She opens the completion push or email after another run has already started.
    then: The app opens the exact completed rain-check run, showing its completed state and skipped branch, without selecting the newer run or a chat.
  - id: completion-target-access-revoked
    assertion_ids: [notifications.workflow-run.run-target]
    given: Bob has a completion notification whose chat or Workflow run was deleted, or he is now signed in to another account.
    when: He opens the old notification or a link with mismatched run and chat identities.
    then: The client rechecks ownership and shows the target as unavailable; no private content from Bob's old account or another chat appears, and the notification offers no inline Reply action.

notification_history:
  - id: cli-lists-past-notifications
    surface: cli
    input: {authenticated: true, since: past_30_days}
    expect: {stable_ids_returned: true, safe_summaries_returned: true, read_state_returned: true}
  - id: sdk-marks-read
    surface: sdks.npm
    input: {authenticated: true, notification_id: notif-1, action: mark_read}
    expect: {read_at_set_once: true, visible_on_web: true, visible_on_apple: true}
  - id: unauthorized-history-hidden
    surface: rest_api
    input: {authenticated: true, notification_owner: another_user}
    expect: {history_item_returned: false, target_ref_returned: false}

privacy_boundaries:
  - id: private-chat-push-redacted
    notification_kind: chat_message_ready
    input: {chat_private: true, channel: push}
    expect: {plaintext_private_message_in_payload: false, safe_summary_or_generic_text: true}
  - id: reminder-email-user-addressed
    notification_kind: reminder_fired
    input: {channel: email, email_enabled: true, reminder_text_user_authored: true}
    expect: {sent_to_configured_address_only: true, logs_contain_private_text: false}
  - id: encrypted-subscription-endpoint
    input: {platform: web, push_subscription_registered: true}
    expect: {durable_plaintext_endpoint: false, endpoint_ciphertext_present: true}

delivery_idempotency:
  - id: duplicate-worker-same-notification
    input: {notification_id: notif-1, workers: 2, channel: email}
    expect: {history_items: 1, successful_email_deliveries: 1}
  - id: reconnect-replays-history-not-delivery
    input: {notification_id: notif-2, client_reconnected: true, delivery_state: dispatched}
    expect: {history_items: 1, delivery_replayed: false, read_state_preserved: true}

web_stacked_deck:
  - id: three-active-web-notifications
    surface: gui.web
    input: {active_in_app_notifications: 3, user_action: dismiss_front}
    expect: {front_interactive: true, back_items_inert: true, back_items_faded_scaled: true, smooth_transition: true, next_promoted: true}

focus_authoring_route:
- id: background-focus-ready-target
  assertion_ids:
  - notifications.project-authoring.result-route
  given: Alice continues chatting while a Project Focus update saves successfully.
  when: Its ready notification arrives and Alice opens it after reconnect.
  then: It opens the authorized saved Focus embed, also accessible in the Project workspace. Duplicate completion
    emits one result event; revoked access reveals no private content and failed save never claims ready.
- id: background-workflow-ready-target
  assertion_ids:
  - notifications.project-authoring.result-route
  given: A Project Workflow background update completes validation and its bound remote YAML has been saved.
  when: Alice receives and opens the completion notification.
  then: It routes to the authorized updated Workflow embed/Project workspace. Pending file persistence or a
    partial update is shown as pending/partial rather than complete success; private graph/chat text stays
    out of notification payloads.


foreground_chat_delivery:
  - id: open-human-client-suppresses-both-chat-channels
    assertion_ids: [notifications.delivery.foreground-chat-suppression]
    given: Alice is using an interactive TUI or a focused web app tab, with chat email and push enabled.
    when: A response completes in a new chat before active-chat selection, or in an existing chat after a follow-up.
    then: Neither chat email nor push is queued or delivered while her fresh human session remains active; her chat history still updates normally.
  - id: absent-or-headless-client-preserves-chat-delivery
    assertion_ids: [notifications.delivery.foreground-chat-suppression]
    given: Alice's web tab is in the background and her TUI is closed; only a headless CLI or another user's session is connected.
    when: Her chat response completes, or a previously queued notification reaches delivery after her presence lease expires.
    then: Her enabled chat email and push can deliver according to existing preferences and access checks. Other notification categories keep their existing rules.

web_duplicate_grouping:
  - id: repeated-error-shows-one-card-with-total-count
    assertion_ids: [notifications.web.duplicate-grouping]
    given: Alice is using OpenMates on desktop or mobile with no active notifications.
    when: The same Failed to save changes error is triggered five times without an explicit grouping key, through the basic and extended notification entrypoints with the same options.
    then: Alice sees one error card showing a total count of five, also readable by assistive technology. The first occurrence had no repeat badge; each later trigger increased the same card's count. Updating its display text alone does not increase the count.
  - id: similar-alerts-keep-distinct-targets-and-groups
    assertion_ids: [notifications.web.duplicate-grouping]
    given: Alice has two chat notification cards with the same preview text but different destination chats, and two error alerts with the same message but different explicit grouping keys.
    when: Each notification is triggered again for its original chat or grouping key; an unkeyed alert with the same error text is also triggered twice.
    then: Each chat and explicitly keyed alert keeps its own card and count of two, and the unkeyed alert forms a separate card with a count of two. Different notification types, content, actions, or dismissal options likewise remain separate during automatic grouping.

web_duplicate_lifecycle:
  - id: one-dismissal-clears-all-repeats-and-recurrence-starts-fresh
    assertion_ids: [notifications.web.duplicate-lifecycle]
    given: Alice's persistent connection error card has accumulated five occurrences behind a different notification in the deck.
    when: The same error triggers again, Alice dismisses the newer card to reveal the error, and then dismisses the error once. Another identical error triggers while that dismissal is animating.
    then: The sixth occurrence increases the original error's count without moving it ahead of the other card. One dismissal removes that whole group, and the new error gets a fresh card starting at one while the old card finishes exiting. Clearing all notifications removes every remaining group and count.
  - id: duplicates-preserve-the-existing-dismissal-timer
    assertion_ids: [notifications.web.duplicate-lifecycle]
    given: Alice has a notification configured to dismiss after ten seconds.
    when: The same notification triggers again four seconds after its first occurrence.
    then: Its count becomes two without restarting the progress indicator, and the single card still expires ten seconds after its first occurrence. If interaction had already paused dismissal, a duplicate leaves that timer paused; the card's existing actions retain their normal behavior.
