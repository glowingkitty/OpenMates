schema_version: 1
specification: feature.pii-protection@4

web_enhanced_preference:
  - id: production-default-and-persistent-off
    assertion_ids: [pii.web.enhanced-default-and-opt-out]
    given: An existing production user has no enhanced preference saved and has basic personal-data protection enabled.
    when: They open Privacy, turn Enhanced personal data protection off, and reload the app.
    then: Enhancement initially defaults on; after their change the switch stays off, emails and configured private values still receive placeholders, and no model worker or licensing request starts during reload.
  - id: opt-out-during-preparation
    assertion_ids: [pii.web.enhanced-default-and-opt-out]
    given: A user has a message being verified locally and begins typing a separate draft.
    when: They turn enhancement off before verification finishes.
    then: The obsolete enhanced result cannot be sent or published, the newer draft remains intact, and a fresh send uses the current basic-only preference.

web_bounded_inference:
  - id: short-message-and-transcript
    assertion_ids: [pii.web.local-bounded-inference]
    given: The local model is ready and a short message or recording transcript contains a detected name and address.
    when: The user sends the text and later reveals it in their own chat.
    then: Detected originals are replaced before chat-model transmission and restored exactly from the existing owner-only mappings; this does not change earlier audio transcription service calls.
  - id: large-or-stalled-input
    assertion_ids: [pii.web.local-bounded-inference]
    given: A user pastes more than 2,048 UTF-16 code units, or several recording fields exhaust one send's 2,500 ms enhancement budget.
    when: The text is checked before send.
    then: All text retains basic patterns and configured-value protection, no further enhanced work is awaited after the budget, and the existing one-time notification explains the fallback without another status element.

web_licensing_boundary:
  - id: ordinary-license-activation
    assertion_ids: [pii.web.licensing-egress-boundary]
    given: A production user enables enhancement and types a private name, address and email.
    when: The SDK requests and activates its genuine license.
    then: Trusted networking sends only the approved installation and fixed application/model metadata and the authentic returned license token; the private text and account identity do not appear in request URLs, bodies or headers.
  - id: new-field-or-destination-denied
    assertion_ids: [pii.web.licensing-egress-boundary]
    given: A licensing request adds a transcript field, changes an identifier to input-derived data, or targets an unapproved destination.
    when: Third-party code attempts the request.
    then: No such request reaches the network, enhancement falls back to basic protection, and a protocol change requires review rather than silently expanding the transmitted data.

web_provider_disclosure:
  - id: informed-privacy-choice
    assertion_ids: [pii.web.provider-disclosure]
    given: A user opens Privacy to understand enhanced protection before changing its switch.
    when: They see only the labelled switch in settings and read the published privacy policy.
    then: Settings show no explanatory text below the switch, and the policy shows that Redact processes text locally, Desert Ant Labs receives limited direct licensing metadata and connection information, and turning enhancement off retains basic detection.
  - id: policy-retains-real-boundaries
    assertion_ids: [pii.web.provider-disclosure]
    given: A reader checks the provider disclosure for retention and whether all audio or uploaded files stay on the device.
    when: They read the published privacy policy.
    then: The notice links the provider's policy, makes no unsupported retention promise, preserves the distinct existing audio/file-processing disclosures, and does not describe licensing as anonymous or data-free.

composer_detection:
  - id: active-email-phone-redacted
    input: {message: "Email alice@example.com or call +49 170 1234567", excluded_values: []}
    expect: {sent_contains_email_placeholder: true, sent_contains_phone_placeholder: true, sent_contains_original_email: false, sent_contains_original_phone: false}
  - id: excluded-email-preserved
    input: {message: "Email max@posteo.de and sarah@proton.com", excluded_values: ["max@posteo.de"]}
    expect: {sent_contains_original_excluded_value: true, sent_contains_active_email_placeholder: true}

city_names:
  - id: standalone-city-question
    assertion_ids: [pii.composer.city-not-personal]
    given: Enhanced protection is on and the on-device model recognizes "Berlin" as a city.
    when: A user types "Tell me about the history of Berlin" and sends it.
    then: Berlin is not highlighted and the message is sent with "Berlin" unchanged.
  - id: city-in-street-address
    assertion_ids: [pii.composer.city-not-personal]
    given: Enhanced protection is on and the model recognizes the street, number, postal code and city.
    when: A user types "Send it to Hauptstrasse 5, 10115 Berlin".
    then: The street, number, postal code and Berlin are highlighted and replaced with address placeholders when sent.

mention_labels:
  - id: project-name-with-number
    assertion_ids: [pii.composer.mention-labels-not-scanned]
    given: The user has a Project named "Supplier contract 0301 2345 678".
    when: The composer holds that Project's mention chip and nothing else.
    then: No sensitive-data highlight or banner appears.
  - id: phone-after-project-chip
    assertion_ids: [pii.composer.mention-labels-not-scanned]
    given: The composer holds that Project's mention chip.
    when: The user types "call me at +49 151 23456789" after the chip.
    then: Exactly the typed phone number is highlighted, not the chip.

embed_references:
  - id: upload-ref-with-phone-like-id
    assertion_ids: [pii.composer.embed-references-not-scanned]
    given: A message carries an upload whose reference contains a phone-like digit run, such as "[!](embed:x-81ede84d-0123-4567-91b3--2e1a33)".
    when: The user sends it together with the text "call +49 2123 21234".
    then: The phone number is replaced with a placeholder, the embed reference is unchanged and the upload preview renders.
  - id: json-reference-block-unchanged
    assertion_ids: [pii.composer.embed-references-not-scanned]
    given: A message contains a fenced json block with an embed_id whose value contains a phone-like digit run.
    when: The message is redacted before send.
    then: The block is unchanged; a phone number elsewhere in the message is still replaced.

message_reveal:
  - id: owner-message-hidden-by-default
    input: {viewer: owner, reveal_state: hidden, mapping_available: true}
    expect: {message_contains_placeholder: true, message_contains_original: false}
  - id: owner-message-revealed-locally
    input: {viewer: owner, reveal_state: revealed, mapping_available: true}
    expect: {message_contains_original: true, server_payload_changed: false}
  - id: non-owner-no-mapping
    input: {viewer: non_owner, reveal_state: revealed, mapping_available: false}
    expect: {message_contains_placeholder: true, message_contains_original: false}

embed_reveal_sync:
  - id: mail-embed-hidden-preview-fullscreen
    input: {embed_app_id: mail, reveal_state: hidden, owner_mapping_available: true}
    expect: {preview_contains_placeholder: true, fullscreen_contains_placeholder: true, originals_visible: false}
  - id: chat-header-reveals-fullscreen
    input: {embed_app_id: mail, toggled_from: chat_header, reveal_state: revealed}
    expect: {chat_message_contains_original: true, preview_contains_original: true, fullscreen_opens_revealed: true}
  - id: fullscreen-hide-syncs-chat-header
    input: {embed_app_id: mail, toggled_from: fullscreen, reveal_state: hidden}
    expect: {chat_header_state_hidden: true, chat_message_contains_placeholder: true, fullscreen_contains_placeholder: true}

followup_rewrite:
  - id: prior-message-original-rewritten
    input: {prior_mapping: {original: alice@example.com, placeholder: "[EMAIL_1_com]"}, followup: "Use alice@example.com for signup"}
    expect: {outbound_contains_placeholder: true, outbound_contains_original: false}
  - id: unknown-original-not-guessed
    input: {prior_mapping: null, followup: "Use unknown-merchant.example for signup"}
    expect: {placeholder_invented: false}

surface_parity:
  - id: web-cli-apple-placeholder-boundary
    input: {surfaces: [gui.web, cli, gui.apple], contains_supported_pii: true}
    expect: {server_receives_active_placeholders_only: true, local_owner_restoration_semantics_match: true}

apple_enhanced_detection:
  - id: debounced-latest-foreground
    input: {composer: existing_or_new_chat, edits_ms: [0, 100, 200], debounce_ms: 500, model_installed: true}
    expect: {regex_immediate: true, model_warm_on_open: true, queued_intermediate_edits: 0, latest_snapshot_only: true, main_actor_inference: false}
  - id: native-cancellation-drains
    input: {native_kernel_held: true, action: replace_text_then_leave}
    expect: {one_in_flight: true, stale_highlights: false, early_unload: false, plaintext_publication_after_leave: false}
  - id: optional-privacy-install-and-fallback
    input: {privacy_page_open: true, model_installed: false, composer_active: true}
    expect: {download_forced: false, developer_model_download_card: false, basic_patterns_and_personal_entries_active: true}
  - id: exact-send-preserves-new-typing
    input: {send_snapshot: 'Email alice@example.com about Project Orchid', later_input: 'A separate draft', excluded_values: ['Project Orchid']}
    expect: {send_snapshot_verified: true, active_email_redacted: true, excluded_original_preserved: true, later_input_cleared: false, mappings_encrypted_by_existing_pipeline: true}
  - id: pressure-or-unavailable-runtime
    input: {model_installed: true, action: memory_pressure_or_warm_failure}
    expect: {basic_detection_available: true, enhanced_coverage_claimed: false, per_keystroke_reload: false, private_diagnostics: false}
