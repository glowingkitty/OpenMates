schema_version: 1
id: feature.pii-protection
version: 3
status: draft
title: PII Placeholder Protection
summary: >
  OpenMates first-party clients detect configured personal data before chat send,
  replace active detections with placeholders before server or model exposure,
  and keep owner-only restoration controls local to the authenticated client.

scope:
  includes:
    - Web composer detection for supported PII patterns such as email addresses and phone numbers.
    - Default-on enhanced personal data protection in the official production web app, with a persistent Privacy setting that switches back to complete basic detection.
    - Local enhanced detection for message inputs and existing recording/transcript text fields, with bounded work, restricted licensing traffic and privacy-policy disclosure.
    - Optional Apple local enhanced detection using verified pinned assets, foreground warming, latest-only debounced snapshots and basic-pattern fallback.
    - Per-value manual exclusion before send, preserving the user's current-send visibility choice.
    - Message-level and embed-level placeholder mappings that default hidden in chat, previews, and fullscreen embeds.
    - Owner-local reveal/hide controls that synchronize between the chat header and embed fullscreen surfaces.
    - Follow-up send rewrite using previously decrypted owner-only mappings, as approved in docs/plans/pii-placeholder-rewrite-v1/plan.yml.
  excludes:
    - Redesigning detector categories, detector confidence, or placeholder token format.
    - Server-side restoration of original PII values.
    - Sharing owner-only originals with public or non-owner viewers.
    - SDK-owned consumer UI controls for PII reveal/hide.
    - Enhanced Linux document scanning or CLI/TUI model activation.
    - Changes to audio transcription/correction providers or a guarantee of complete anonymization.

models:
  PIIMapping:
    placeholder:
      type: string
      required: true
      constraints: {format: bracketed_type_token, stable_for_mapping: true}
    original:
      type: client_secret
      required: true
      constraints: {server_plaintext: forbidden, owner_only: true}
    type:
      type: string
      required: true
      constraints: {local_category_label: true, legacy_labels_preserved: true}

  WebEnhancedProtection:
    enabled:
      type: boolean
      required: true
      default: true
      constraints: {persistent_user_choice: true, missing_legacy_preference_defaults_on: true}
    licensing_metadata:
      type: object
      required: true
      constraints: {content_forbidden: true, installation_identifier_not_account_identifier: true, protocol_changes_require_review: true}

  ComposerDetection:
    detected_values:
      type: array
      required: true
      items: PIIMapping
    excluded_values:
      type: array
      required: true
      items: string
      constraints: {current_send_only: true, re_redaction_forbidden: true}

  RevealState:
    default:
      type: enum
      values: [hidden]
      required: true
    owner_toggle:
      type: boolean
      required: true
      constraints: {local_only: true, synchronized_across_chat_and_embed: true}

assertions:
  - id: pii.composer.detect-redact-exclude
    type: privacy
    must: The web composer detects supported PII before send, replaces active detections with placeholders in the sent chat content, and does not re-redact a value the user explicitly excluded for that current send.
    depends_on: [models.ComposerDetection, models.PIIMapping, examples.composer_detection]
  - id: pii.web.enhanced-default-and-opt-out
    type: privacy
    must: The official production web app enables Enhanced personal data protection by default, including for existing preferences without an enhanced flag. Its Privacy switch persists the user's choice. With the master protection switch on, turning enhancement off retains complete basic patterns, configured private entries and current-send exclusions. A restored off preference is respected before model initialization or licensing starts. Turning it off releases the worker and stops subsequent model downloads, scans and licensing requests; it cannot retract requests already sent. Changes invalidate obsolete previews and prepared sends without clearing newer typing. Existing master-off behavior remains unchanged.
    depends_on: [models.WebEnhancedProtection, models.ComposerDetection, examples.web_enhanced_preference]
  - id: pii.web.local-bounded-inference
    type: privacy
    must: Web enhancement processes message inputs and existing recording/transcript text locally, preserving encrypted owner mappings and exact restoration. Inputs above 2,048 UTF-16 code units use complete basic detection. Each send shares one lazy 2,500 ms enhancement budget across queueing, model readiness, exclusions and recording/message text. Slow asset loading can continue in the background; stalled inference releases its worker. Basic protection remains immediate and available on failure. Only current owner/document/settings results publish. The existing one-time fallback notification is used without adding a model status row. Audio services and document-upload protection retain their existing boundaries.
    depends_on: [models.WebEnhancedProtection, models.ComposerDetection, models.PIIMapping, examples.web_bounded_inference]
  - id: pii.web.licensing-egress-boundary
    type: privacy
    must: Web inference uses pinned, integrity-verified SDK, runtime and model assets. Third-party inference code cannot directly access the network. Trusted OpenMates code brokers only approved public asset reads and the published license/activation protocol, with exact endpoints, methods, fixed model/SDK/platform/application metadata, a browser installation identifier controlled independently of inference input, and authentic server-issued activation tokens. Requests cannot contain message text, transcripts, detections, mappings, account identifiers, arbitrary headers or additional fields. Unexpected requests or protocol changes are rejected before transmission and enhancement falls back to basic protection; valid required reporting remains intact. Browser connection metadata such as IP address and request timing remains visible to the recipient. This does not promise protection against arbitrary browser vulnerabilities, covert timing signals or the recipient's server-side retention.
    depends_on: [models.WebEnhancedProtection, examples.web_licensing_boundary]
  - id: pii.web.provider-disclosure
    type: privacy
    must: Privacy settings and the published privacy policy name Redact and Desert Ant Labs, explain local text inference and direct mandatory licensing traffic, describe the installation identifier and model/SDK/platform/application metadata plus unavoidable IP/header/timing exposure, and explain the enhanced-off basic-detection option. The policy links the provider's privacy notice, identifies its independent-controller role for licensing telemetry, and does not invent retention periods or imply that the provider receives no data. Required linked attribution remains discoverable. The notice distinguishes processed text from existing audio/file/provider flows.
    depends_on: [models.WebEnhancedProtection, examples.web_provider_disclosure]
  - id: pii.apple.enhanced-local-detection
    type: privacy
    must: Apple offers the optional enhanced anonymization model through Privacy settings. Opening an active foreground composer warms an already downloaded model without forcing a download or blocking input. Basic patterns and configured personal entries remain immediate; enhanced detection uses a 400-600 ms debounce, one in-flight native operation and only the latest pending snapshot. Highlights publish only for the exact current text, settings, account generation and route. Disable, removal, leaving, logout and memory pressure invalidate obsolete publication, drain native ownership and release the loaded model when no active composer remains. Final send verifies its immutable document, settings and exclusion snapshot before preserving the existing encrypted mapping pipeline; typing during verification cannot be cleared or overwritten by an older completion. Final verification waits for an installed model to finish restoration, cleanup and warming; previews use basic detection during warming. Missing, unsupported or failed inference uses clearly described basic detection; private input never persists in detector caches, logs or network inference.
    depends_on: [models.ComposerDetection, models.PIIMapping, examples.apple_enhanced_detection]

  - id: pii.message.owner-local-reveal
    type: privacy
    must: Message-level PII mappings default to placeholders in chat history, and only the owning authenticated client can locally reveal or hide originals without making the server, model providers, logs, traces, or shared viewers receive those originals.
    depends_on: [models.PIIMapping, models.RevealState, examples.message_reveal]
  - id: pii.embed.owner-local-reveal-sync
    type: privacy
    must: Embed previews and fullscreen embeds that render PII-backed fields default to placeholders, restore originals only through owner-local mappings, and keep chat-header and fullscreen reveal/hide state synchronized for the same chat.
    depends_on: [models.PIIMapping, models.RevealState, examples.embed_reveal_sync]
  - id: pii.outbound.known-original-rewrite
    type: privacy
    must: Follow-up outbound messages using an original value from a decrypted owner-only message or embed mapping are rewritten to the existing placeholder before inference payloads leave the browser, while unknown values are never assigned guessed placeholders.
    depends_on: [models.PIIMapping, examples.followup_rewrite]
  - id: pii.surface.semantic-parity
    type: parity
    must: First-party web, CLI, SDK-adjacent secret-scanner paths, and Apple preserve the same placeholder-boundary and owner-only restoration semantics where those surfaces handle chat send or PII mapping display; surfaces without a consumer PII UI cannot bypass the placeholder boundary.
    depends_on: [models.PIIMapping, examples.surface_parity, applies_to]

applies_to:
  rest_api:
    required: false
    role: REST and WebSocket routes carry encrypted chat payloads and placeholder-safe content; they do not own restoration UI or server-side original recovery.
  cli:
    required: true
    parity: semantic
    role: CLI file and chat send paths must redact supported local content before sending through the dev API.
  sdks:
    required: false
    role: SDKs may expose placeholder-safe chat/file payload helpers but do not own consumer reveal controls.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [apple_enhanced_detection, composer_detection, message_reveal, embed_reveal_sync, followup_rewrite, surface_parity, web_enhanced_preference, web_bounded_inference, web_licensing_boundary, web_provider_disclosure]
