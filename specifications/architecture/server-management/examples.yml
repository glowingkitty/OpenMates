schema_version: 1
specification: architecture.server-management@1

control_plane:
  - id: browser-cannot-mutate-host
    given: {surface: web_settings, action: update_server}
    expect: {host_mutation_available: false, read_only_version_status_allowed: true}
  - id: cli-manages-host
    given: {surface: cli, action: restart, operator_has_host_access: true}
    expect: {host_mutation_available: true}

roles_and_services:
  - id: core-service-filter
    given: {role: core, command: restart, services: [api, task-worker]}
    expect: {selection_valid: true, unrelated_services_restarted: false}
  - id: cross-role-service-rejected
    given: {role: preview, command: update, services: [upload-api]}
    expect: {selection_valid: false, docker_called: false}

installation_modes:
  - id: image-install-needs-no-git
    given: {install_mode: image, cli_package_installed: true}
    expect: {packaged_template_used: true, git_required: false, local_build_required: false}
  - id: registered-working-tree-is-not-pulled
    given: {install_mode: source, source_strategy: working_tree, command: update}
    expect: {git_state_changed: false, current_checkout_built: true}

update_sequence:
  - id: data-bearing-image-update
    given: {role: core, required_configuration: present, update_requested: true}
    expect: {order: [preflight, verified_backup, pull_or_build, restart, health_checks, runtime_verification, monitoring_setup, optional_quick_test, completion_email]}
  - id: runtime-check-failure
    given: {updated_containers_running: true, required_runtime_check: failed}
    expect: {status: degraded, automatic_rollback: false, failure_visible: true}

update_completion:
  - id: released-image-update-emails-admin
    given: {update_mode: image, image_tag: v0.17.0, required_checks: passed, monitoring_setup: passed, quick_test: not_requested, admin_email_configured: true, email_provider_receipt: {messageId: accepted}}
    expect: {email_subject: "Server update complete", email_contains: [v0.17.0, core, completed_at, release_url], status: success, exit_code: 0}
  - id: source-update-falls-back-to-commit
    given: {update_mode: source, installed_revision: abc123, release_url_available: false, pull_request_url_available: false, email_provider_receipt: {messageId: accepted}}
    expect: {installed_version: abc123, source_link_kind: commit, status: success}
  - id: missing-admin-email-degrades-update
    given: {required_checks: passed, updated_containers_running: true, admin_email_configured: false}
    expect: {completion_email_state: unavailable, status: degraded, exit_code: non_zero, containers_rolled_back: false}

delivery_recovery:
  - id: interrupted-delivery-reuses-budget
    given: {persisted_delivery_id: valid_uuid, persisted_attempts: 1, pending_age: 10m, next_send_result: accepted}
    expect: {same_delivery_id: true, next_attempt_number: 2, maximum_total_attempts: 3}
  - id: malformed-accepted-receipt-fails-closed
    given: {completion_email_state: accepted, delivery_id: malformed, attempts: 0, provider_receipt: missing}
    expect: {status: degraded, false_success: false, new_delivery_id_created: false}
  - id: expired-idempotency-window-fails-closed
    given: {completion_email_state: pending, pending_age: 31m, delivery_id: valid_uuid}
    expect: {automatic_resend: false, status: degraded, operator_action_required: true}

update_locking:
  - id: roles-share-one-installation-lock
    given: {core_update_running: true, upload_update_requested: true, installation: same}
    expect: {upload_update_started: false, concurrent_mutation: false}
  - id: stale-lock-is-not-stolen
    given: {lock_owner_process: absent, lock_file: present}
    expect: {automatic_takeover: false, explicit_operator_removal_required: true}

backup_restore:
  - id: pre-update-backup-rotates
    given: {role: core, existing_latest_pre_update: present, data_bearing_update: true}
    expect: {new_verified_backup_created_before_restart: true, latest_pre_update_count: 1, checksum_manifest: present}
  - id: incomplete-backup-fails
    given: {required_product_data_missing: true}
    expect: {backup_success_claimed: false, update_continues: false}

host_operations:
  - id: preflight-redacts-secrets
    given: {required_secret: missing, other_secret_values: available}
    expect: {missing_key_name_reported: true, secret_values_reported: false}
  - id: continuous-update-reuses-contract
    given: {trigger: systemd_timer, unchanged_artifact_already_notified: true}
    expect: {same_update_safety_sequence: true, duplicate_completion_email: false}

privacy_boundaries:
  - id: status-and-email-are-redacted
    given: {available_fields: [installed_version, role, source_link, destination, api_key, raw_provider_response, user_content]}
    expect: {included: [installed_version, role, source_link], excluded: [destination, api_key, raw_provider_response, user_content]}
