schema_version: 1
id: architecture.operational-monitoring
version: 2
status: approved
title: Operational Monitoring And Operator Alerts
summary: >
  OpenMates operators receive a compact, privacy-safe daily view of server and
  product health, provider availability, and official-cloud payment readiness
  plus prompt, independently delivered alerts for urgent failures across
  official dev, official production, and configured self-hosted servers.

scope:
  includes:
    - Twenty-four-hour operational snapshots for official dev and production servers.
    - Automatic self-hosted snapshots when an admin email and working email service are available.
    - Host and container CPU, memory, disk, availability, latency, errors, and monitoring freshness.
    - Aggregate chat, message, embed, usage-entry, and AI response recovery-job counts.
    - Exact rolling-24-hour official-cloud credit purchase and credits-sold totals, usage charging outcomes, and current open purchase issues.
    - Fresh configured-provider availability grouped as healthy, unavailable, or skipped.
    - Non-mutating official-cloud Stripe readiness for EU card and Managed Payments paths, including account access, expected active prices, webhook destination status, and required event subscriptions.
    - One canonical environment-specific operations destination shared by daily status, urgent transitions, payment readiness, and degraded-service reports, with an explicit legacy fallback.
    - Immediate deduplicated Discord and email alerts for urgent incidents, plus recovery notifications.
    - Real-data dev delivery tests for email and Discord before production rollout.
    - Delivery receipts and stale-report detection for the monitoring system itself.
  excludes:
    - Raw chat, message, embed, prompt, file, user, payment-method, or encrypted payload content.
    - Grafana as a required delivery or dashboard dependency.
    - Any billing fields, sections, checks, incidents, or payment-provider access on self-hosted servers.
    - Automatic remediation, server restart, rollback, payment mutation, or production deployment.
    - Creating, confirming, cancelling, expiring, refunding, or otherwise mutating synthetic production payments as a health check.
    - Browser, Apple, or user-facing notification behavior.

models:
  OperationalSnapshot:
    environment:
      type: enum
      values: [development, production, self_host]
      required: true
    window:
      type: duration
      required: true
      constraints: {value: 24h, real_observed_data: true}
    generated_at:
      type: timestamp
      required: true
    telemetry_freshness:
      type: object
      required: true
      constraints: {resource_metrics: required, application_metrics: required, report_scheduler: required}
    resource_series:
      type: object
      required: true
      constraints: {cpu: required, memory: required, disk_used: required, disk_free: required, time_series: true}
    activity_counts:
      type: object
      required: true
      constraints: {chats: required, messages: required, embeds: required, usage_entries: required}
    processing_transactions:
      type: object
      required: true
      constraints: {scope: ai_response_recovery_jobs, created: required, completed: required, invalidated: required, non_terminal_over_15m: required}
    billing:
      type: object
      required: false
      constraints: {official_cloud_dev_and_production: required, self_host: forbidden, durable_privacy_safe_settlement_ledger: required, pending_before_credit_mutation: required, rolling_24h_purchase_count: required, rolling_24h_credits_sold: required, incomplete_window_must_report_warming: true, unresolved_settlement_must_report_unavailable: true, usage_charging_outcomes: required, current_open_purchase_issues: required, non_mutating_readiness: required, eu_card_readiness: required, managed_payments_readiness: required, stripe_account_access: required, active_price_catalog: required, webhook_destination_enabled: required, required_webhook_events: required, readiness_freshness: required}
    provider_health:
      type: object
      required: true
      constraints: {configured_only: true, healthy_count: required, unavailable_names: required, skipped_names: required, stale_names: required, last_check_freshness: required, secret_or_error_detail: forbidden}
    prioritized_issues:
      type: array
      required: true
      constraints: {maximum: 3, ranked_by_severity_frequency_recency_and_active_state: true}

  OperatorNotificationConfig:
    admin_email:
      type: email
      nullable: true
    email_service_available:
      type: boolean
      required: true
    discord_webhook_configured:
      type: boolean
      required: true
    environment:
      type: enum
      values: [development, production, self_host]
      required: true

  AlertEvent:
    incident_id:
      type: stable_id
      required: true
      constraints: {idempotent: true}
    environment:
      type: enum
      values: [development, production, self_host]
      required: true
    severity:
      type: enum
      values: [critical, warning, digest]
      required: true
    state:
      type: enum
      values: [firing, resolved]
      required: true
    delivery_state:
      type: object
      required: true
      constraints: {per_channel: true, values: [queued, accepted, failed, unavailable]}

assertions:
  - id: operational-monitoring.digest.real-24h-snapshot
    type: behavior
    must: Each scheduled digest summarizes real observed data from the preceding 24 hours in one compact graph and a scan-first summary containing resource trends, aggregate activity, explicitly labeled AI response recovery-job outcomes, fresh provider availability, exact rolling-24-hour credit purchases and credits sold from a privacy-safe durable settlement ledger, non-mutating EU-card and Managed-Payments readiness, usage charging outcomes, current open purchase issues, monitoring freshness, and at most three prioritized issues; an incomplete ledger window reports warming and any unresolved settlement or required payment-readiness failure reports unavailable or degraded rather than healthy.
    depends_on: [models.OperationalSnapshot, examples.daily_snapshots]
  - id: operational-monitoring.self-host.auto-email
    type: behavior
    must: A self-hosted server automatically schedules and sends the daily operational digest when an admin email is defined and the configured email service passes its availability check; missing prerequisites are reported explicitly and never represented as successful delivery.
    depends_on: [models.OperatorNotificationConfig, examples.self_host_activation]
  - id: operational-monitoring.self-host.no-billing
    type: security
    must: Self-hosted snapshots entirely omit billing fields and sections and never read billing credentials, query a payment provider, or emit billing incidents.
    depends_on: [models.OperationalSnapshot.billing, examples.self_host_activation]
  - id: operational-monitoring.delivery.real-data-test
    type: behavior
    must: Before production rollout, a dev validation sends one clearly labeled email and one clearly labeled Discord notification containing the current dev server's privacy-safe 24-hour snapshot, and records success or failure independently for each channel.
    depends_on: [models.OperationalSnapshot, models.AlertEvent.delivery_state, examples.delivery_tests]
  - id: operational-monitoring.alerts.independent-urgent-path
    type: failure
    must: Critical API, host, disk, provider-availability, billing-readiness, and monitoring-staleness incidents can reach at least one configured operator channel without depending on the unhealthy API or application task scheduler; retries are deduplicated and recovery emits one resolved event.
    depends_on: [models.AlertEvent, examples.urgent_alerts]
  - id: operational-monitoring.alerts.actionable-low-noise
    type: behavior
    must: Critical incidents notify immediately, sustained warnings notify after their confirmation window, digest-only findings wait for the daily report, and invalid or missing metric denominators cannot create infinite or fabricated utilization alerts.
    depends_on: [models.AlertEvent.severity, examples.urgent_alerts]
  - id: operational-monitoring.delivery.observable
    type: invariant
    must: Daily report generation, per-channel acceptance, delivery failure, and report freshness are observable; a missing report or stale monitor becomes an incident rather than silent success.
    depends_on: [models.AlertEvent.delivery_state, models.OperationalSnapshot.telemetry_freshness, examples.delivery_tests]
  - id: operational-monitoring.content.privacy-boundary
    type: privacy
    must: Snapshots, graphs, logs, delivery records, email, and Discord contain aggregate operational metadata only and exclude user identifiers, raw content, ciphertext, secrets, webhook URLs, payment identifiers, and stack traces with sensitive values.
    depends_on: [models.OperationalSnapshot, examples.privacy_boundaries]
  - id: operational-monitoring.environments.isolated-labeled
    type: security
    must: Development, production, and self-hosted telemetry, destinations, incident state, thresholds, and report subjects are explicitly labeled and isolated so one environment cannot masquerade as or silently notify for another.
    depends_on: [models.OperatorNotificationConfig.environment, models.AlertEvent.environment, examples.environment_isolation]
  - id: operational-monitoring.providers.current-availability
    type: behavior
    must: Each official-cloud daily status reports a fresh healthy-provider count and explicitly names unavailable, skipped, and stale configured providers; missing or stale health data cannot be represented as healthy, and private credentials or raw provider errors are excluded.
    depends_on: [models.OperationalSnapshot.provider_health, examples.provider_and_billing_readiness]
  - id: operational-monitoring.billing.no-spend-readiness
    type: invariant
    must: Official-cloud billing readiness independently evaluates EU card and Managed Payments through read-only Stripe account, active-price, enabled-destination, required-event-subscription, route, worker, and settlement checks; it creates no payment object and cannot report healthy when any required path check is missing, stale, or failed.
    depends_on: [models.OperationalSnapshot.billing, examples.provider_and_billing_readiness]
  - id: operational-monitoring.notifications.canonical-operations-channel
    type: behavior
    must: Daily status, urgent transitions, payment-readiness incidents, degraded-service reports, and recovery notices resolve one canonical environment-specific operations destination first and use the legacy smoke destination only as an explicit fallback; production sends a daily all-clear even when no issue is active, and missing destination configuration is itself visible.
    depends_on: [models.OperatorNotificationConfig, models.AlertEvent, examples.canonical_operations_channel]

applies_to:
  rest_api:
    required: false
    role: No new public or developer API is required; operational collection stays internal or host-local.
  cli:
    required: true
    parity: semantic
    role: CLI-managed servers install, validate, and report host monitoring and notification configuration without exposing secrets.
  sdks:
    required: false
    role: Operator monitoring is not an npm or pip SDK surface.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: false
    role: Daily email and Discord artifacts are operator outputs, not web or Apple product UI.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [daily_snapshots, self_host_activation, delivery_tests, urgent_alerts, privacy_boundaries, environment_isolation]
