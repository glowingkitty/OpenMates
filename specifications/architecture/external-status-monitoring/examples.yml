schema_version: 1
specification: architecture.external-status-monitoring@1

confirmation:
  - id: missing-results-are-checker-errors
    given: The status checker stops receiving results while the API was healthy.
    when: The status monitor observes stale check data.
    expect: The checker problem is recorded and no API outage notice is sent.
  - id: three-minute-blip
    given: The API fails two real checks and recovers three minutes after the first observed failure.
    when: The monitor records the recovery.
    expect: One three-minute blip is stored and no notice is sent.

escalation:
  - id: prolonged-outage
    given: The web app fails repeated checks and remains down for more than two hours.
    when: The default cadence is in effect.
    expect: The first 🚨 notice is due at ten minutes, followed by reminders thirty minutes later and then hourly.

recovery:
  - id: recovery-resolves-once
    given: An outage notice was sent and all failing checks are healthy again.
    when: The service stays healthy through the recovery window.
    expect: One ✅ notice names the service and gives the start, end and duration.
  - id: nearby-failure-merges
    given: The API recovers and fails again two minutes later.
    when: The monitor records the new failure.
    expect: The previous incident stays open and the monitor sends no recovery notice.

history:
  - id: restart-keeps-state
    given: The API is down and the first notice has already been delivered.
    when: The monitor restarts and the incident later ends.
    expect: The initial notice is not repeated and the closed incident retains the failing check and error.
  - id: short-blips-in-briefing
    given: Two short outages lasting three and four minutes were recorded in the past day.
    when: The daily briefing is generated.
    expect: It reports two short blips totaling seven minutes.

checker_errors:
  - id: browser-runner-fails-before-tests
    given: Installing Playwright dependencies fails before the production smoke runs.
    when: The host processes the workflow result.
    expect: The host records a checker failure and retries once without opening a service incident.
  - id: statistics-timeout-with-working-sends
    given: Brevo accepts production sends while the statistics endpoint times out.
    when: The email monitor evaluates the evidence.
    expect: The statistics timeout is recorded separately and no email outage notice is sent.

public_page:
  - id: outage-shows-component-only
    given: {component: ai_chat, failing_checks: all}
    expect: {status: outage, error_text: absent, check_urls: absent}
  - id: no-data-is-not-operational
    given: {components: {web_app: operational, ai_chat: no_data}}
    expect: {overall: unknown}
  - id: everything-up
    given: {components: all_operational_with_data}
    expect: {overall: operational}

probe_traffic:
  - id: anonymous-probe-skips-allowance
    given: {route: anonymous_chat, monitor_token: valid}
    expect: {allowance_consumed: false, stats_recorded: false}
  - id: wrong-token-is-normal-traffic
    given: {route: anonymous_chat, monitor_token: wrong}
    expect: {allowance_consumed: true}
  - id: monitoring-account-not-charged
    given: {user: configured_monitoring_account, route: ai_ask}
    expect: {credits_charged: 0, usage_entry: absent, growth_metrics: excluded}

liveness:
  - id: worker-answers
    given: {worker_probe: completed_in_2s}
    expect: {status: ok, ai_worker: ok}
  - id: worker-silent
    given: {worker_probe: no_answer_in_8s}
    expect: {status: degraded, ai_worker: unavailable}

deploy:
  - id: setup-writes-config-from-vault
    given: {vault: {gatus_external_token: set, discord_webhook_url: set, unrelated_api_token: set}}
    expect: {status_env: [GATUS_EXTERNAL_TOKEN, DISCORD_WEBHOOK_URL], other_secrets_on_server: false, mode: "600"}
  - id: incomplete-config-stops
    given: {vault: {gatus_external_token: set, discord_webhook_url: missing}}
    expect: {server_started: false, message: run_publish_config}
  - id: update-is-pull-and-restart
    given: {command: openmates-status-setup, new_config: none}
    expect: {image: pulled, config: kept, server: restarted}
