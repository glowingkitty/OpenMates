schema_version: 1
id: architecture.app-skill-execution
version: 1
status: draft
title: App Skill Execution
summary: >
  OpenMates executes registered app skills through one validated, scoped contract
  and protects all external provider output before it reaches clients or AI context.

scope:
  includes:
    - Registered app-skill dispatch through assistant, Workflow, REST, CLI, and SDK surfaces
    - Request validation, external-output sanitization, and safe visible failures
    - Equivalent request, result, error, billing, and safety semantics across supported surfaces
    - Explicitly opted-in concurrent assistant execution for independent read-only skill calls
    - Single-pass structured external-text safety decisions with bounded failure latency
    - Optional Jev relevance ranking for explicitly supported read-only search skills
    - Truthful CLI app-skill status messages without session-save decryption notices
    - Owner-authorized asynchronous result polling without changing existing authentication, rate limits, budgets, or encryption boundaries.
    - Same-turn completion of assistant-requested skills, including long-running social collection and media generation.
    - Generated-media parent and child embeds, visible assistant results, and selected visual search results.
    - Image references forwarded directly to consuming skills without first exposing pixels to assistant inference.
  excludes:
    - Provider-specific request and result fields outside the declared shared relevance-ranking profiles
    - Client-specific visual layout
    - Internal provider wrapper implementation
    - Automatic parallelization of undeclared, dependent, or mutating calls
    - Live voice-call skill integration, which remains a separate delivery scope.
    - Jev relevance ranking for health appointment search or clinical suitability decisions

models:
  AppSkillInvocation:
    app_id: {type: string, required: true}
    skill_id: {type: string, required: true}
    input: {type: object, required: true}
    surface:
      type: enum
      required: true
      values: [assistant, workflow, rest_api, cli, sdks]

  AppSkillOutputSafety:
    ascii_smuggling_cleanup: {type: boolean, required: true, constraints: {always_enabled: true}}
    external_data:
      type: boolean
      required: true
      constraints: {semantic_scan_default_when_true: enabled}
    prompt_injection_protection:
      type: enum
      values: [enabled, disabled]
      default: enabled
      constraints: {disable_surfaces: [rest_api, cli, sdks], assistant_or_workflow_disable: forbidden}
    scan_failure:
      type: enum
      values: [none, blocked, unavailable, timeout, malformed, incomplete]
      constraints: {technical_failure: return_ascii_cleaned_content_and_log_unscanned, uncertainty: preserve_content, automatic_retry: forbidden, user_input: forbidden}
    coverage:
      type: server_owned
      required: true
      constraints: {before_exposure_or_persistence_or_inference: true, provider_claimed_scan_status: untrusted, unchanged_text_rescan: forbidden, changed_text_requires_scan: true}
    deadline:
      type: finite_per_skill_budget
      required: true
      constraints: {includes_queue_and_model_time: true, cancellation_propagates: true, fallback_status_logged: true}
    technical_error_codes:
      type: enum
      values: [OUTPUT_SAFETY_TIMEOUT, OUTPUT_SAFETY_UNAVAILABLE, OUTPUT_SAFETY_INVALID]
      constraints: {delivery: server_logs, raw_provider_error: forbidden, failed_scan_reported_as_safe: forbidden}

  SemanticScanBatch:
    fields:
      type: array
      required: true
      items: identified_external_text_unit
      constraints: {server_assigned_unique_ids: true, max_batch_text_chars: 50000, max_unit_chars: 4000, max_physical_batches: 8, max_estimated_jev_input_tokens_per_batch: 30000, max_parallel_batches: 3, max_model_calls_per_batch: 2, max_decision_gate_calls_per_batch: 1, max_exact_span_calls_per_batch: 1, partition_order: source_order, source_context_preserved: true, complete_partition_before_calls: required, silent_truncation: forbidden, oversized_input: return_cleaned_content_and_log_unscanned}
    decisions:
      type: array
      required: true
      constraints: {one_per_input_id: true, values: [safe, injection, uncertain], injection_evidence: exact_unique_source_quotes, unknown_duplicate_or_missing_ids: reject_scan, model_rewritten_text: forbidden}
    application:
      type: deterministic
      required: true
      constraints: {safe_and_uncertain_units: preserve_exactly_after_ascii_cleanup, injection_units: replace_verified_spans_with_fixed_warning, field_level_rescan: forbidden, serialized_structure_redaction: forbidden}
    partial_payload_mutation:
      type: boolean
      required: true
      constraints: {must_remain_false_on_failure: true}
    long_documents:
      type: bounded_contextual_sections
      constraints: {applicable_long_document_semantic_protection: retained, entire_coverage_required_for_valid_scan: true, partition_boundaries: paragraph_then_sentence_then_character, boundary_context: required_within_batch_budget, flagged_section: redact_verified_spans_only, cannot_cover_within_deadline: return_cleaned_content_and_log_unscanned}

  ParallelSafeSkillBatch:
    eligibility:
      type: static_opt_in
      required: true
      constraints: {parallel_safe_true_required: true, default_serial: true, same_model_batch_only: true}
    execution:
      type: bounded_concurrency
      required: true
      constraints: {maximum_parallel_calls: 3, original_result_order: true, cancellation_propagates: true}
    forbidden:
      type: serial_only
      required: true
      constraints: {undeclared_dependent_mutating_payment_account_workspace_calls: true}

  OptionalSearchRelevanceRanking:
    eligible_skills:
      type: enum_set
      required: true
      values:
        - web.search
        - news.search
        - events.search
        - maps.search
        - videos.search
        - code.search_repos
      constraints: {health.search_appointments: excluded}
    relevance_criteria:
      type: string
      nullable: true
      constraints: {trim: true, blank: treat_as_omitted, max_length: 1000}
    assistant_population:
      type: faithful_goal_extraction
      required: true
      constraints: {material_ranking_goal: populate, plain_search: may_omit, invented_preferences: forbidden}
    result_limit:
      type: existing_public_field
      required: true
      constraints:
        web_news_events_videos: count
        maps: pageSize
        code: count
        code_search_repos_default: 10
        other_existing_defaults_preserved: true
        existing_maxima_preserved: true
    candidate_pool:
      type: bounded_skill_profile
      required: true
      constraints:
        when_criteria_present_target: max_40_or_requested_result_limit
        when_criteria_absent: existing_provider_fetch_behavior
        web_search: two_Brave_pages_of_at_most_20_each
        news_search: one_Brave_News_call_of_up_to_40
        events_search: bounded_deduplicated_merged_provider_pool
        maps_search: one_Google_Places_request_of_up_to_20
        videos_search: one_Brave_Videos_request_of_up_to_40_with_batched_metadata
        code_search_repos: one_GitHub_request_of_up_to_40_before_license_and_normalization_filters
        extra_billable_page_for_ranking_only: forbidden
        provider_shortfall: return_smaller_pool
        fabricated_candidates: forbidden
        unbounded_retries: forbidden
    decision:
      type: typesafe_jev_ranking
      required: true
      constraints:
        candidate_text: untrusted_data
        structured_filters: authoritative
        unsupported_facts: unknown
        web_rubric: intent_fit_72_percent_and_source_evidence_quality_28_percent
        news_rubric: material_relevance_65_percent_and_source_quality_35_percent
        events_rubric: stated_event_goal_fit_after_hard_filters_and_deduplication
        maps_rubric: stated_place_goal_fit_from_explicit_place_fields_without_inferred_ambience_accessibility_or_suitability
        videos_rubric: stated_learning_or_viewing_goal_fit_plus_explicit_depth_authority_freshness_and_engagement_evidence
        code_repositories_rubric: stated_software_selection_goal_fit_from_explicit_repository_technology_license_popularity_issue_and_date_evidence
        user_or_chat_identifiers: forbidden
    finalization:
      type: deterministic
      required: true
      constraints: {successful_ranking: score_then_existing_tie_break, ranking_failure: existing_order, final_results: at_most_requested_limit, output_safety_after_selection: required}

assertions:
  - id: app-skills.images.reference-handoff
    type: privacy
    must: An available image-consuming skill may receive an exact authorized uploaded or generated image reference without a preceding images.view call. Main inference initially receives only references and necessary metadata; pixels enter its context through explicit viewing. Image editing can use direct references when inspection is unnecessary. Actual visual questions retain images.view; unrelated uploads never trigger inspection. Unavailable image searches fail before resolving or disclosing references.
    depends_on: [examples.image_reference_handoff]
  - id: app-skills.images.authorized-resolution
    type: security
    must: Image-consuming skills resolve exact references within the caller's authorized context before decryption, provider access or billing. Cache loss may recover owner-verified authoritative records or existing unexpired fresh-upload metadata without broadening access or extending expiry. Existing legacy and version-two encrypted image formats remain supported when authorized server-decryptable metadata is available. Foreign, expired, missing or client-only undecryptable references fail visibly without guessed URLs, exposed plaintext, key recovery or automatic viewing.
    depends_on: [examples.image_reference_resolution]
  - id: app-skills.assistant.same-turn-completion
    type: behavior
    must: In text chats, an assistant turn remains in progress while skills needed for its answer are running. Completion resumes the same turn with its selected model, mate, authorized context, original tool calls and completed results, without a synthetic user follow-up, a new conversation turn, or repeated routing. Live progress remains visible and the assistant does not present dispatch as completed work. Waiting releases scarce inference execution capacity rather than occupying it for the provider's full duration.
    depends_on: [examples.assistant_completion]
  - id: app-skills.assistant.complete-result-barrier
    type: invariant
    must: Every required job in a skill invocation or tool batch reaches success, failure, cancellation, or its bounded deadline before the final answer is synthesized. Results remain bound to their original tool-call identities and order. Independent operations run concurrently only under the existing explicit parallel-safety contract. The first completed child cannot prematurely finalize a multi-result request.
    depends_on: [models.ParallelSafeSkillBatch, examples.completion_barrier]
  - id: app-skills.assistant.idempotent-resume
    type: invariant
    must: Completion delivery, reconnects and eligible worker recovery resume an authorized turn at most once for each saved step. They do not regenerate successful media, repeat provider side effects or billing, duplicate response content, or finalize postprocessing and follow-up suggestions more than once. An explicit cancellation or newer user turn prevents an older job from resuming stale inference; already completed authorized outputs remain available under existing retention rules.
    depends_on: [examples.completion_recovery]
  - id: app-skills.assistant.bounded-private-failure
    type: privacy
    must: Skill waits have finite skill-appropriate deadlines. A failed, cancelled or timed-out job produces an honest answer using any available successful results, without claiming nonexistent output or automatically repeating paid generation. Resume state preserves owner, account, chat and turn authorization and existing encryption boundaries; decrypted chats, memories and private Project tool content do not become durable plaintext checkpoints. If authorized inference context has expired or cannot be restored, execution stops visibly without inventing the missing context. A delegated assistant response that reaches the provider output limit is an unsuccessful report, even when earlier tool outputs remain available. It cannot be counted as completed research or verification or trigger automatic paid regeneration; retained authorized outputs and incurred usage remain preserved.
    depends_on: [examples.completion_failure]
  - id: app-skills.media.parent-children-and-attribution
    type: behavior
    must: Each media-producing skill invocation has one skill-use parent and one distinct child embed for each successfully generated image, video, audio clip, music track, vector design or 3D asset. The parent exposes its processing and terminal state and its children; each child exposes the generation prompt and actual model used, with the complete prompt available in its fullscreen view. Existing output assets are reused, failed outputs are identified honestly, and neither reconnect nor resume duplicates the parent or children.
    depends_on: [examples.generated_media_graph]
  - id: app-skills.media.visible-assistant-results
    type: behavior
    must: A successful media-generation answer includes every generated output through the existing inline embed-preview and grouping system, so results remain visible when the skill-use section is collapsed. Skill instructions require this inclusion and final response handling enforces missing generated-output references without duplicating existing previews. When an assistant recommends selected visual search results such as icons, it includes previews for those selected results. Media previews, playback or display, fullscreen and download use the same authorized assets.
    depends_on: [examples.visible_media]
  - id: app-skills.media.application-screenshot
    type: behavior
    must: A runnable generated application's preview and fullscreen show an actually captured screenshot of that application rather than an empty frame. Capture runs in the existing isolated application sandbox, and its successful result is retained through the existing owner-authorized encrypted asset and embed update path. Missing or invalid captures produce a visible failure instead of a successful screenshot claim. A reviewed public example carries a separately published public screenshot, so logged-out viewing does not need private keys or start a paid preview session.
    depends_on: [examples.application_screenshots]
  - id: app-skills.execution.registered-validated
    type: security
    must: App-skill calls dispatch only registered enabled app and skill identifiers, validate request input before provider execution, and return safe visible errors rather than silently changing the requested skill or provider.
    depends_on: [models.AppSkillInvocation, examples.dispatch]
  - id: app-skills.output.ascii-always
    type: security
    must: Every app-skill output receives deterministic ASCII-smuggling cleanup, including when semantic prompt-injection protection is explicitly disabled for an eligible direct programmatic call.
    depends_on: [models.AppSkillOutputSafety.ascii_smuggling_cleanup, examples.output_safety]
  - id: app-skills.output.external-semantic
    type: security
    must: All existing policy-selected external provider text across app skills is routed through the shared semantic scanner by default after deterministic ASCII cleanup. Assistant and Workflow callers cannot explicitly disable it. Unavailable, timed-out, malformed, incomplete, or oversized scans return cleaned content and record an unscanned status; uncertainty preserves text. Valid injections require exact evidence and are redacted. Direct-programmatic opt-out eligibility is unchanged.
    depends_on: [models.AppSkillOutputSafety, examples.output_safety]
  - id: app-skills.output.batch-equivalent
    type: security
    must: One logical scan partitions every selected passage into at most eight physical batches before any model call, preserving source order, stable IDs and neighboring context across boundaries. Each batch stays below the estimated Jev input budget and receives one bounded Jev gate; a confident safe verdict requires no generative output. Otherwise that batch receives at most one bounded GPT exact-span call returning a safe, injection, or uncertain decision for every unit ID. At most three batches run concurrently within the existing overall deadline. Injection decisions require exact uniquely located quotes; deterministic application replaces only those spans with a fixed warning and preserves surrounding text and result structure. Safe and uncertain text remains unchanged after ASCII cleanup. Unknown, duplicate, missing, or invalid decisions in any batch invalidate the entire scan atomically and return cleaned input with an unscanned log. No model-authored replacement text, serialized-structure redaction, retry, silent truncation, or model call beyond the bounded partition is permitted.
    depends_on: [models.SemanticScanBatch, examples.jev_first_safety]
  - id: app-skills.output.single-boundary
    type: security
    must: Protected dispatch surfaces share one logical safety boundary with complete policy-selected field coverage; skill-local and outer dispatch layers must not scan the same unchanged text twice. Any scan reuse is request-local, server-controlled, and bound to the exact text and active policy; external payload flags or ignored-field claims cannot authorize a bypass. No unscanned text may be appended after validation.
    depends_on: [models.AppSkillOutputSafety.coverage, examples.output_safety]
  - id: app-skills.output.bounded-failure
    type: failure
    must: Semantic processing has a finite per-skill deadline. Scanner timeout or failure returns ASCII-cleaned content and records an unscanned reason without exposing provider diagnostics or treating failure as a safe verdict. No retries, confirmation scans, or user-input requests occur. Timeout cancels unfinished scanner work and caller cancellation propagates. These rules do not relax tool authorization or request validation.
    depends_on: [models.AppSkillOutputSafety.deadline, models.AppSkillOutputSafety.scan_failure, examples.batch_outcomes]
  - id: app-skills.cli.truthful-status
    type: behavior
    must: Saving or refreshing a CLI session must not emit Decrypting data or an equivalent decryption notice. App-skill progress describes only work actually being performed, never implies search-result decryption, and never pollutes JSON stdout; this changes messaging, not authentication or encryption behavior.
    depends_on: [examples.surface_parity]
  - id: app-skills.surface.semantic-parity
    type: parity
    must: REST API, CLI, npm/pip SDKs, assistant, Workflow, and GUI clients preserve the applicable validated request, structured result, visible error, billing, and output-safety semantics of each app skill.
    depends_on: [models, examples.surface_parity, applies_to]
  - id: app-skills.execution.parallel-safe
    type: security
    must: Assistant tool calls run concurrently only when every call in the same model-emitted batch has explicit static parallel_safe true metadata; concurrency is bounded to three, result messages retain original call order, cancellation reaches unfinished calls, per-call billing and normalized failures remain visible, and every undeclared, dependent, mutating, payment, account, or workspace batch remains serial.
    depends_on: [models.ParallelSafeSkillBatch, examples.parallel_execution]

  - id: app-skills.search-relevance.optional-and-inferred
    type: behavior
    must: Available web, news, supported conference events, maps, videos and public GitHub repository search accept optional relevance_criteria through assistant, REST, CLI and npm/pip SDKs. An explicit material ranking goal is faithfully populated without requiring the user to name the field. Plain requests may omit it and no preference is invented. An unavailable search never starts candidate retrieval or relevance inference.
    depends_on: [models.OptionalSearchRelevanceRanking]

  - id: app-skills.search-relevance.bounded-and-conditional
    type: invariant
    must: For an available search, nonblank relevance_criteria activates only its declared bounded retrieval and ranking profile. Web, news, supported conference events, videos and public repositories target forty candidates or the larger final limit; maps target twenty in the existing request. Repository filtering may leave fewer candidates. No extra billable page is fetched solely for ranking. Missing criteria retains existing ordering without ranking. Shortfalls do not fabricate results or trigger unbounded retries. Unavailable capabilities perform neither retrieval nor ranking.
    depends_on: [models.OptionalSearchRelevanceRanking.candidate_pool]

  - id: app-skills.search-relevance.safe-finalization
    type: security
    must: Jev receives only the bounded relevance goal, ranking-relevant search parameters, and minimized candidate projections labeled as untrusted data. Each skill applies its declared evidence rubric; structured filters run before ranking and cannot be reversed by a score, popularity alone cannot replace goal fit, and unsupported candidate facts remain unknown. Malformed, incomplete, unavailable, rejected, or timed-out ranking falls back to existing deterministic order without failing an otherwise successful search. Public repository search defaults to ten results; every other public result-limit default and every existing maximum remain unchanged. The final result count never exceeds the requested limit, and selected external output still passes the inherited output-safety boundary. Health appointment discovery is unavailable and does not use this Jev ranking path.
    depends_on: [models.OptionalSearchRelevanceRanking]

  - id: app-skills.execution.async-owner-bound
    type: security
    must: Completed asynchronous app-skill jobs, including image, video, music, audio, document, 3D, and code-generated file jobs, carry trusted owner metadata so the submitting authenticated session or authorized API key can retrieve its own result. Other users cannot retrieve results, and unverified ownership remains denied. Provider failures and safety rejections remain visible without leaking private result data or automatically resubmitting generation.
    depends_on:
    - examples.async_polling

  - id: app-skills.providers.permitted-only
    type: security
    must: Provider-specific data integrations use documented provider-supported APIs, explicitly licensed feeds or written
      authorization covering intended access and downstream use, respecting commercial-use, display, retention, attribution and rate-limit conditions. Current retained routes include official JobTech
      for Swedish jobs, supported conference schedules for events, media.ccc.de published captions, Bluesky and Mastodon
      social APIs and Brave text image search. Metadata and dispatch do not advertise or route retired sources, undocumented
      endpoints, browser automation or proxy/RSS substitutes. General on-demand public-page reading follows its
      separate crawler-exclusion and no-bypass contract and preserves full extracted text in saved history.
      Generic data models and crawler access do not establish source-content permission.
    depends_on:
    - examples.provider_boundary
  - id: app-skills.providers.unavailable-no-network
    type: failure
    must: When no permitted provider remains, health appointment, home, shopping product, fitness, electronic component,
      domain, trademark, 3D catalog, travel connection/stay and reverse-image discovery return explicit
      unavailable failures. Metadata requires a provider and lists none; assistant, REST, CLI, SDK and GUI do not
      expose an active discovery capability. Rejected requests make no upstream, proxy, browser or replacement-source
      request, do not perform inference enrichment and do not charge for successful work. Unsupported general events,
      nonpermitted captions and uncovered job countries also fail without broader fallback. Local-only search, retained
      official API capabilities and generic saved result/history schemas remain available.
    depends_on:
    - examples.provider_boundary
  - id: app-skills.history.renderable
    type: parity
    must: Removing a source preserves generic result and encrypted saved-history schemas, parent/child references
      and existing card/detail navigation. Saved prices, dates, uncertainty, provenance and error states remain readable
      without fresh source discovery, invented facts or claims that historical observations are current. Retired branding
      and discovery controls are removed while meaningful generic historical rendering and tests remain.
    depends_on:
    - examples.provider_history

applies_to:
  rest_api: {required: true}
  cli: {required: true}
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [dispatch, output_safety, batch_outcomes, surface_parity, parallel_execution, search_relevance, async_polling, assistant_completion, completion_barrier, completion_recovery, completion_failure, generated_media_graph, visible_media, application_screenshots, image_reference_handoff, image_reference_resolution, provider_boundary, provider_history]

approval_source:
  instruction: The user approved the provider-boundary plan and requested implementation in this Codex task on 2026-10-24. No exact-fingerprint approval is claimed.
  review_status: Changed fingerprint remains draft pending the coordinator approval-artifact gate.
