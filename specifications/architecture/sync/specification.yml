schema_version: 1
id: architecture.sync
version: 1
status: approved
title: Chat Sync Startup
summary: >
  Authenticated first-party clients synchronize encrypted chat metadata and
  bounded recent content during startup without treating partial cache state or
  paginated metadata windows as full deletion authority.

scope:
  includes:
    - Authenticated first-party chat startup sync over WebSocket.
    - Cache readiness reported by request_cache_status and sync_status_response.
    - Phase 1a shell metadata, Phase 1b recent parent-chat content, and Phase 2 recent metadata boundaries.
    - Phase 2 encrypted draft metadata and explicit deletion evidence semantics.
    - Personal and team-scoped persisted chat metadata; user draft discovery remains personal and author-private.
  excludes:
    - New unauthenticated, public, or developer API sync surfaces.
    - Full-history pagination, long-term reconciliation redesign, or SDK-owned offline queues.
    - Plaintext message, draft, or embed sync through the server.
    - Embed lifecycle changes unrelated to startup chat metadata and deletion evidence.

models:
  SyncStatusRequest:
    channel:
      type: websocket_event
      required: true
      constraints: {event: request_cache_status, authentication: session_or_approved_device, first_party_only: true}
    user_scope:
      type: hashed_user_id
      required: true
      constraints: {server_derived: true, client_supplied_user_id: forbidden}

  SyncStatusResponse:
    is_primed:
      type: boolean
      required: true
    chat_count:
      type: integer
      required: true
      constraints: {minimum: 0, source: Directus_when_cache_unprimed}
    timestamp:
      type: unix_seconds
      required: true

  StartupLimits:
    phase1b_parent_chat_limit:
      type: integer
      default: 10
      constraints: {maximum: 10, parent_chats_only: true}
    phase2_metadata_chat_limit:
      type: integer
      default: 100
      constraints: {maximum: 100, metadata_only: true}

  Phase2MetadataPayload:
    chats:
      type: array
      required: true
      items: EncryptedChatMetadata
      constraints: {maximum_recent_window: models.StartupLimits.phase2_metadata_chat_limit, messages: forbidden, embeds: forbidden, embed_keys: forbidden, chat_key_wrappers: forbidden, code_run_outputs: forbidden, compression_checkpoints: forbidden}
    chat_count:
      type: integer
      required: true
      constraints: {matches_sent_metadata_count: true}
    total_chat_count:
      type: integer
      required: true
      constraints: {minimum: 0, source: Directus}
    phase:
      type: string
      required: true
      constraints: {value: phase2}
    authoritative:
      type: boolean
      default: false
    deleted_chat_ids:
      type: array
      default: []
      items: chat_id
      constraints: {requires_complete_server_set_or_explicit_tombstone: true}

  DraftMetadata:
    draft_v:
      type: integer
      required: true
      constraints: {minimum: 0, source: authoritative_user_draft_version}
    encrypted_draft_md:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    encrypted_draft_preview:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    team_scope:
      type: enum
      values: [personal, team]
      constraints: {team_draft_only_discovery: forbidden}

  DeletionAuthority:
    authoritative:
      type: boolean
      required: true
    authoritative_chat_ids:
      type: array
      nullable: true
      items: chat_id
      constraints: {present_only_when_total_count_matches_server_set: true}
    deleted_chat_ids:
      type: array
      required: true
      items: chat_id
      constraints: {partial_window_deletions: forbidden_except_explicit_tombstone}

assertions:
  - id: sync.access.first-party-authenticated
    type: security
    must: Chat startup sync runs only on authenticated first-party session or approved-device WebSocket paths and never exposes decrypted chat, draft, message, or embed plaintext.
    depends_on: [models.SyncStatusRequest, models.Phase2MetadataPayload, examples.surface_scope]
  - id: sync.status.startup-window-ready
    type: behavior
    must: A missing primed flag may be restored when Redis contains at least min(Directus chat count, 100) startup chat IDs; the response still reports the full Directus chat count.
    depends_on: [models.SyncStatusResponse, models.StartupLimits.phase2_metadata_chat_limit, examples.startup_readiness]
  - id: sync.status.incomplete-window-rewarms
    type: failure
    must: If Redis contains fewer IDs than the required startup window while Directus has more chats, sync_status_response stays unprimed and rewarming is dispatched instead of completing startup sync.
    depends_on: [models.SyncStatusResponse, examples.startup_readiness]
  - id: sync.startup.bounded-phases
    type: invariant
    must: Default phase=all startup sync is limited to Phase 1a shell metadata, Phase 1b content for at most 10 parent chats, Phase 2 metadata for at most 100 recent chats, and app settings/memories.
    depends_on: [models.StartupLimits, examples.startup_payloads]
  - id: sync.phase2.metadata-only
    type: privacy
    must: Phase 2 sends encrypted metadata and encrypted draft metadata only; messages, embeds, embed keys, chat key wrappers, Code Run outputs, and compression checkpoints are absent.
    depends_on: [models.Phase2MetadataPayload, models.DraftMetadata, examples.startup_payloads, examples.draft_metadata]
  - id: sync.phase2.drafts.authoritative-encrypted
    type: behavior
    must: Phase 2 draft reconciliation uses authoritative per-user encrypted draft versions, preserves opaque ciphertext, emits explicit draft deletion fields when no authoritative draft remains, and does not discover draft-only user chats in team scope.
    depends_on: [models.DraftMetadata, examples.draft_metadata]
  - id: sync.deletion.partial-window-not-authoritative
    type: invariant
    must: A partial startup or metadata page is not deletion authority; local chats are pruned only from a complete server ID set or from explicit tombstone evidence.
    depends_on: [models.DeletionAuthority, models.Phase2MetadataPayload, examples.deletion_authority]
  - id: sync.surface.semantic-parity
    type: parity
    must: First-party web, Apple, and CLI clients preserve the same startup readiness, metadata-only, encrypted-draft, and deletion-authority semantics; npm and pip SDKs do not own startup or offline queue behavior under this contract.
    depends_on: [models, examples.surface_scope, applies_to]

applies_to:
  rest_api:
    required: false
    role: Existing REST helpers such as offline prefetch and load-more are outside this startup WebSocket contract.
  cli:
    required: true
    parity: semantic
  sdks:
    required: false
    role: SDKs may expose on-demand encrypted draft read/write but do not own startup sync or offline queues here.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [startup_readiness, startup_payloads, deletion_authority, draft_metadata, surface_scope]
