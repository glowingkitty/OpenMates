schema_version: 1
specification: architecture.sync@1

startup_readiness:
  - id: bounded-large-account-ready
    given:
      primed_flag: false
      directus_chat_count: 2368
      redis_cached_chat_ids: 100
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: true, chat_count: 2368}
      primed_flag_restored: true
      rewarm_dispatched: false
  - id: complete-small-account-ready
    given:
      primed_flag: false
      directus_chat_count: 2
      redis_cached_chat_ids: 2
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: true, chat_count: 2}
      primed_flag_restored: true
      rewarm_dispatched: false
  - id: incomplete-large-account-rewarms
    given:
      primed_flag: false
      directus_chat_count: 2368
      redis_cached_chat_ids: 99
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: false, chat_count: 2368}
      primed_flag_restored: false
      rewarm_dispatched: true

startup_payloads:
  - id: default-phase-all-boundary
    request: {type: phased_sync_request, phase: all}
    expect:
      phases: [phase1a_shell_metadata, phase1b_recent_parent_content, phase2_recent_metadata, app_settings_memories]
      maximum_phase1b_parent_chats: 10
      maximum_phase2_metadata_chats: 100
      forbidden_events: [phase_3_last_100_chats_ready, background_message_sync]
  - id: phase2-metadata-only
    payload:
      phase: phase2
      chat_count: 100
      total_chat_count: 2368
      chats:
        - chat_details:
            id: chat-1
            encrypted_title: cipher-title
            encrypted_chat_key: wrapped-chat-key
            messages_v: 7
            title_v: 3
            draft_v: 2
            encrypted_draft_md: cipher-draft
    forbidden_fields: [messages, embeds, embed_keys, chat_key_wrappers, code_run_outputs, compression_checkpoints, plaintext]

deletion_authority:
  - id: partial-window-retains-local-chats
    given:
      total_chat_count: 2368
      server_chat_ids_count: 100
      client_extra_chat_ids: [older-local-chat]
      explicit_tombstones: []
    expect:
      authoritative: false
      deleted_chat_ids: []
  - id: complete-server-set-prunes-missing-local-chat
    given:
      total_chat_count: 2
      server_chat_ids: [chat-1, chat-2]
      client_chat_ids: [chat-1, chat-2, stale-chat]
      explicit_tombstones: []
    expect:
      authoritative: true
      authoritative_chat_ids: [chat-1, chat-2]
      deleted_chat_ids: [stale-chat]
  - id: explicit-tombstone-prunes-without-complete-set
    given:
      total_chat_count: 2368
      server_chat_ids_count: 100
      client_chat_ids: [chat-1, tombstoned-chat]
      explicit_tombstones: [tombstoned-chat]
    expect:
      authoritative: false
      deleted_chat_ids: [tombstoned-chat]

draft_metadata:
  - id: personal-authoritative-draft-ciphertext
    given:
      team_scope: personal
      chat_id: chat-1
      cached_client_draft_v: 1
      authoritative_draft: {version: 2, encrypted_content: cipher-v2, encrypted_preview: cipher-preview-v2}
    expect:
      draft_v: 2
      encrypted_draft_md: cipher-v2
      encrypted_draft_preview: cipher-preview-v2
      plaintext: absent
  - id: personal-authoritative-draft-deletion
    given:
      team_scope: personal
      chat_id: chat-1
      cached_client_draft_v: 4
      authoritative_draft: null
    expect:
      draft_v: 0
      encrypted_draft_md: null
      encrypted_draft_preview: null
  - id: team-scope-draft-only-discovery-skipped
    given:
      team_scope: team
      persisted_team_chat_metadata: present
      user_private_draft_only_chat: draft-chat-1
    expect:
      team_chat_metadata_synced: true
      draft_only_user_chat_discovered: false

shared_client_sync:
  - id: same-reconnect-policy-existing-stores
    given: A browser using IndexedDB, an Apple app using SwiftData and the native CLI each reconnect with cached encrypted chats.
    when: The same authenticated startup response contains only the recent metadata window.
    then: Shared Rust applies bounded startup and recovery without pruning older chats from that partial window; thin adapters preserve each store and notify its UI without reimplementing sync policy.
  - id: late-old-owner-response-is-not-new-owner-data
    given: A first-party client switches account or Team while a reconnect or recovery response is pending.
    when: The previous context's response arrives.
    then: The shared Rust policy prevents it from entering the new context's cache or UI, preserves current authorization checks and does not advertise human interaction that did not occur.

surface_scope:
  - id: first-party-clients
    given: The web, Apple and CLI clients enter their authenticated first-party session or approved-device paths.
    when: Startup sync and reconnect recovery run through the shared Rust core.
    then: They preserve the same bounded encrypted metadata, draft and deletion-authority outcomes; anonymous callers and developer API-key startup remain excluded.
  - id: sdk-startup-queue-out-of-scope
    given: A developer constructs an npm or Python SDK and explicitly calls a supported encrypted draft operation.
    when: The direct library call completes.
    then: Public conformance and authorization still apply, but construction does not start first-party application sync or silently adopt an application offline queue.
