schema_version: 1
specification: architecture.sync@2

startup_readiness:
  - id: bounded-large-account-ready
    given:
      primed_flag: false
      directus_chat_count: 2368
      redis_cached_chat_ids: 100
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: true, chat_count: 2368}
      primed_flag_restored: true
      rewarm_dispatched: false
  - id: complete-small-account-ready
    given:
      primed_flag: false
      directus_chat_count: 2
      redis_cached_chat_ids: 2
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: true, chat_count: 2}
      primed_flag_restored: true
      rewarm_dispatched: false
  - id: incomplete-large-account-rewarms
    given:
      primed_flag: false
      directus_chat_count: 2368
      redis_cached_chat_ids: 99
      startup_metadata_chat_limit: 100
    expect:
      sync_status_response: {is_primed: false, chat_count: 2368}
      primed_flag_restored: false
      rewarm_dispatched: true
  - id: cold-start-large-account-ready
    assertion_ids: [sync.status.startup-window-ready]
    given: A device without a feed cursor cold-starts an account with 2,368 chats; the primed flag is missing but Redis already holds the 100 most recent chat IDs.
    when: The client asks for cache status before its cold start.
    then: The server restores the primed flag, reports is_primed true with the full count of 2,368 chats, and dispatches no rewarm.

startup_payloads:
  - id: default-phase-all-boundary
    given: An authenticated account has hundreds of saved parent chats and related sub-chats.
    when: The client requests normal startup synchronization.
    then: Recent message windows arrive for at most 20 parent chats, recent list metadata remains bounded to 100, and older transcript content is fetched on demand.
    request: {type: phased_sync_request, phase: all}
    expect:
      phases: [phase1a_shell_metadata, phase1b_recent_parent_content, phase2_recent_metadata, app_settings_memories]
      maximum_phase1b_parent_chats: 20
      maximum_phase2_metadata_chats: 100
      forbidden_events: [phase_3_last_100_chats_ready, background_message_sync]
  - id: phase2-metadata-only
    given: A recent parent chat has 40 sub-chats.
    when: Startup supplies their navigation metadata and the user later opens one sub-chat.
    then: Startup does not download the sub-chat messages; opening that sub-chat fetches its recent message window on demand.
    payload:
      phase: phase2
      chat_count: 100
      total_chat_count: 2368
      chats:
        - chat_details:
            id: chat-1
            encrypted_title: cipher-title
            encrypted_chat_key: wrapped-chat-key
            messages_v: 7
            title_v: 3
            draft_v: 2
            encrypted_draft_md: cipher-draft
    forbidden_fields: [messages, embeds, embed_keys, chat_key_wrappers, code_run_outputs, compression_checkpoints, plaintext]
  - id: warm-start-uses-feed-not-phases
    assertion_ids: [sync.startup.bounded-phases]
    given: A device has a cached overview and a valid feed cursor from its last session; while it was offline two chats received new messages on another device.
    when: The workspace opens and the client pulls the feed with its cursor.
    then: The page lists the two chats with kinds metadata and messages, their new versions and encrypted metadata; no transcript messages, embeds or Phase 1b content are sent, and the transcripts load only when the user opens those chats.
  - id: cold-start-cursor-read-before-snapshot
    assertion_ids: [sync.startup.bounded-phases]
    given: A new device has no cursor; while its cold start reads the 20-chat Phase 1a window, another device renames a chat in that window.
    when: phased_sync_complete arrives with sync_cursor and the client then pulls the feed.
    then: The cursor was read before the snapshot, so the rename is replayed by the first feed pull even if the snapshot already contained it; applying it twice changes nothing.

deletion_authority:
  - id: partial-window-retains-local-chats
    given:
      total_chat_count: 2368
      server_chat_ids_count: 100
      client_extra_chat_ids: [older-local-chat]
      explicit_tombstones: []
    expect:
      authoritative: false
      deleted_chat_ids: []
  - id: complete-server-set-prunes-missing-local-chat
    given:
      total_chat_count: 2
      server_chat_ids: [chat-1, chat-2]
      client_chat_ids: [chat-1, chat-2, stale-chat]
      explicit_tombstones: []
    expect:
      authoritative: true
      authoritative_chat_ids: [chat-1, chat-2]
      deleted_chat_ids: [stale-chat]
  - id: explicit-tombstone-prunes-without-complete-set
    given:
      total_chat_count: 2368
      server_chat_ids_count: 100
      client_chat_ids: [chat-1, tombstoned-chat]
      explicit_tombstones: [tombstoned-chat]
    expect:
      authoritative: false
      deleted_chat_ids: [tombstoned-chat]
  - id: gap-free-feed-deletion-prunes
    assertion_ids: [sync.deletion.partial-window-not-authoritative]
    given: A device's cursor is at revision 41 and a chat it has cached was deleted on another device at revision 42.
    when: The device pulls the feed from revision 41 and receives the entry with kind deleted for that chat's hashed ID.
    then: The device removes that chat locally, because the entry was replayed gap-free from its own cursor; older chats absent from the page stay cached.

draft_metadata:
  - id: personal-authoritative-draft-ciphertext
    given:
      team_scope: personal
      chat_id: chat-1
      cached_client_draft_v: 1
      authoritative_draft: {version: 2, encrypted_content: cipher-v2, encrypted_preview: cipher-preview-v2}
    expect:
      draft_v: 2
      encrypted_draft_md: cipher-v2
      encrypted_draft_preview: cipher-preview-v2
      plaintext: absent
  - id: personal-authoritative-draft-deletion
    given:
      team_scope: personal
      chat_id: chat-1
      cached_client_draft_v: 4
      authoritative_draft: null
    expect:
      draft_v: 0
      encrypted_draft_md: null
      encrypted_draft_preview: null
  - id: team-scope-draft-only-discovery-skipped
    given:
      team_scope: team
      persisted_team_chat_metadata: present
      user_private_draft_only_chat: draft-chat-1
    expect:
      team_chat_metadata_synced: true
      draft_only_user_chat_discovered: false

  - id: feed-draft-update-keeps-ciphertext
    assertion_ids: [sync.phase2.drafts.authoritative-encrypted]
    given: The user edits the draft of a personal chat on the laptop, then deletes the draft of another chat.
    when: The phone pulls its feed.
    then: It receives the edited chat with kind draft, the new draft version and the unchanged encrypted draft text, and the other chat with draft version 0 and empty draft fields; in a Team context, a draft for a chat outside that Team is not delivered.

shared_client_sync:
  - id: same-reconnect-policy-existing-stores
    given: A browser using IndexedDB, an Apple app using SwiftData and the native CLI each reconnect with cached encrypted chats.
    when: The same authenticated startup response contains only the recent metadata window.
    then: Shared Rust applies bounded startup and recovery without pruning older chats from that partial window; thin adapters preserve each store and notify its UI without reimplementing sync policy.
  - id: late-old-owner-response-is-not-new-owner-data
    given: A first-party client switches account or Team while a reconnect or recovery response is pending.
    when: The previous context's response arrives.
    then: The shared Rust policy prevents it from entering the new context's cache or UI, preserves current authorization checks and does not advertise human interaction that did not occur.

surface_scope:
  - id: first-party-clients
    given: The web, Apple and CLI clients enter their authenticated first-party session or approved-device paths.
    when: Startup sync and reconnect recovery run through the shared Rust core.
    then: They preserve the same bounded encrypted metadata, draft and deletion-authority outcomes; anonymous callers and developer API-key startup remain excluded.
  - id: sdk-startup-queue-out-of-scope
    given: A developer constructs an npm or Python SDK and explicitly calls a supported encrypted draft operation.
    when: The direct library call completes.
    then: Public conformance and authorization still apply, but construction does not start first-party application sync or silently adopt an application offline queue.

delta_feed:
  - id: page-replays-every-committed-change
    assertion_ids: [sync.delta.cursor-gap-free]
    given: Personal scope revisions 11 to 260 were committed while a device was offline with cursor revision 10.
    when: The device requests pages of 200 with chat_sync_delta_request.
    then: The first page covers revisions 11 to 210 with has_more true and the next page covers 211 to 260 with has_more false; no revision is skipped and each chat appears once per page with its combined kinds.
  - id: feed-page-is-metadata-only
    assertion_ids: [sync.delta.metadata-only]
    given: A new message with an embed was added to a cached chat.
    when: The next feed page describes that chat.
    then: It carries kinds messages and content, the new messages_v and the encrypted chat metadata, but no message text, no embed, no embed key and no plaintext; the message loads when the chat is opened.
  - id: live-hint-triggers-pull
    assertion_ids: [sync.delta.live-hint]
    given: A phone and a laptop are connected with the chat_sync_feed_v1 capability, and an older web client without it is also connected.
    when: The phone pins a chat.
    then: The laptop receives chat_sync_hint with the new revision, waits briefly, pulls the feed and moves the chat into the pinned position; the older web client receives no new event type.

delta_reset:
  - id: unknown-epoch-resets
    given: A device presents a cursor from before the scope's change log was re-created with a new epoch.
    when: It pulls the feed.
    then: The response has reset true and no changes; the device performs a cold start and keeps its cached chats until the cold start supplies deletion evidence.
  - id: expired-cursor-resets
    given: A laptop was offline for 45 days, longer than the 30-day change retention.
    when: It pulls the feed with its old cursor.
    then: The response has reset true; the laptop performs the bounded cold start and does not delete any chat just because the feed was reset.

delta_revocation:
  - id: team-membership-removed
    given: A user is removed from a Team while a device has that Team's chats cached and a personal cache too.
    when: The device pulls that Team's feed.
    then: The request is rejected as forbidden; the device clears only the Team's cached chats and cursor, and the personal chats stay untouched.
  - id: chat-moved-to-team
    given: A user moves a personal chat into a Team.
    when: Devices pull the personal feed and the Team feed.
    then: The personal feed shows the chat as moved, so it leaves the personal list; the Team feed shows it with metadata, so it appears in the Team list for members.

chat_open:
  - id: open-during-catch-up
    given: A device is still pulling feed pages after reconnecting.
    when: The user opens a cached chat and then an uncached chat.
    then: The cached chat renders from local data within 300 ms at p95 without waiting for the feed, and the uncached chat fetches its own recent message window and renders within 1 s at p95.
  - id: one-shot-cli-no-account-sync
    given: A user runs a one-shot CLI command such as sending one message to an existing chat.
    when: The command runs.
    then: It loads only the chat it needs and performs no startup sync or feed pull for the rest of the account.

overview_order:
  - id: due-item-then-last-opened-then-recent
    assertion_ids: [sync.overview.priority-order]
    given: A user has a saved concert starting in 3 hours, a reminder due in 30 minutes for chat A, last opened chat B, and chats C (pinned) and D (edited 5 minutes ago).
    when: Any of their devices shows the chat workspace overview.
    then: The order is reminder for chat A, the concert, chat B, chat C, chat D; a chat already shown as a due item is not repeated later.
  - id: last-opened-synced-across-devices
    assertion_ids: [sync.overview.cross-device]
    given: The phone and the laptop show the same overview with chat B as last opened.
    when: The user opens chat E on the phone.
    then: The laptop receives the user-lane change, shows chat E first among chats and moves chat B back into its last-change position, without a cold start.
  - id: due-item-completed-elsewhere
    assertion_ids: [sync.overview.cross-device]
    given: A reminder due in 10 minutes is the first overview item on both devices.
    when: The reminder fires and the user dismisses it on the laptop.
    then: The phone receives the change through the user lane and drops or reclassifies the item using the same 24-hour and 12-hour windows.

overview_ready:
  - id: warm-start-renders-cache-first
    given: A device has a cached overview and cursor.
    when: The workspace opens while the network is slow.
    then: The cached overview with its due-soon items appears immediately and later feed changes reorder it in place.
  - id: cold-start-overview-before-content
    given: A fresh device signs in to an account with 2,000 chats whose last opened chat is older than the 20 most recent chats.
    when: The cold start runs.
    then: The overview appears from Phase 1a metadata and the startup due-soon set, including the last opened chat, before any transcript content arrives.
