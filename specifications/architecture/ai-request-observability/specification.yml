schema_version: 1
id: architecture.ai-request-observability
version: 1
status: draft
title: AI Request Observability
summary: >
  OpenMates operators can measure AI request latency, token use, tool execution,
  and finalization cost through content-free, privacy-bounded metrics and traces
  that never expose prompts, responses, tool parameters, private identifiers, or
  encrypted payloads.

inherits:
  - architecture.operational-monitoring@1

scope:
  includes:
    - End-to-end browser, WebSocket, API, Celery, and AI-worker trace propagation
    - Content-free per-phase AI processing spans for preparation, preprocessing,
      main inference iterations, tool execution, streaming, validation, billing,
      persistence, final marker publication, and postprocessing
    - Identity-free aggregate metrics for all AI turns and bounded structural
      traces for sampled, slow, errored, or explicitly diagnosed turns
    - Token counts, message counts, prompt/history/system/tool size measures,
      tool request/result counts, cache hit rates, retries, and durations as
      reviewed numeric values or buckets only
    - Privacy-tiered attribute allowlisting, retention verification, audited
      operator access, dashboards, alerts, and a content-free debug CLI waterfall
    - Discord-first operator alert delivery with optional enabled server-admin
      email fallback when Discord is unavailable
    - Repeated-span aggregation, provider-purpose attribution, user-completion
      timing, worker-tail timing, named lifecycle gaps, and terminal-aware phase expectations
  excludes:
    - Any prompt, response, chat title, message body, tool parameter, tool output,
      URL, filename, ciphertext, key material, provider raw payload, or raw stack trace
    - Stable user, chat, message, task, device, session, provider request, or cache
      identifiers in default AI telemetry
    - Prompt, model, tool-planning, context-window, billing-authority, or processing
      behavior changes made solely to improve speed
    - Third-party analytics, hosted observability services outside OpenMates'
      existing self-hosted OpenObserve deployment, or public telemetry APIs

models:
  AIRequestTelemetryPolicy:
    default_metrics:
      type: aggregate_metric_set
      required: true
      constraints: {identity_free: true, low_cardinality_dimensions: true, all_ai_turns: true}
    structural_traces:
      type: sampled_trace_set
      required: true
      constraints: {content_free: true, request_scoped_trace_id_only: true, no_product_ids: true}
    diagnostic_mode:
      type: consent_or_operator_incident_scope
      required: true
      constraints: {time_bounded: true, audited: true, exact_counts_allowed: true, content_forbidden: true}
    retention:
      type: retention_policy
      required: true
      constraints: {verified_against_openobserve: true, maximum_days: 30, default_target_days: 14}

  AIPhaseWaterfall:
    turn:
      type: span
      required: true
      constraints: {root: true, one_per_ai_turn: true}
    queue:
      type: span
      required: true
      constraints: {measures_dispatch_to_worker_start: true}
    prepare:
      type: span_group
      required: true
      constraints: {history_config_cache_vault_and_optional_compression: true}
    preprocess:
      type: span_group
      required: true
      constraints: {local_work: true, provider_children: true, first_message_parallel_calls_visible: true}
    main_iterations:
      type: span_array
      required: true
      constraints: {one_per_model_iteration: true, ttft: true, stream_duration: true, token_usage: true}
    tools:
      type: span_array
      required: false
      constraints: {one_per_tool_call: true, capability_category: true, counts_and_durations_only: true}
    finalize:
      type: span_group
      required: true
      constraints: {validation_billing_persistence_final_marker_visible: true}
    postprocess:
      type: span_group
      required: false
      constraints: {after_final_marker_visible: true, provider_children: true, delivery_tail_visible: true}
    lifecycle_gaps:
      type: span_group
      required: true
      constraints: {setup_compression_pre_main_response_finalize_queue_handoff_visible_when_present: true}

  AIAlertRouting:
    discord:
      type: primary_operator_channel
      required: true
      constraints: {used_when_configured_and_connected: true, content_free: true}
    server_admin_email:
      type: fallback_operator_channel
      required: false
      constraints: {requires_email_notifications_enabled: true, discord_unavailable_only: true, content_free: true}
    delivery_receipt:
      type: redacted_delivery_state
      required: true
      constraints: {per_channel: true, destination_and_secret_forbidden: true}

  PrivacySafeAIMetadata:
    phase_duration_ms:
      type: number
      required: true
      constraints: {non_negative: true, exact_allowed: true}
    model_family:
      type: enum
      required: false
      constraints: {reviewed_values_only: true, exact_model_diagnostic_only: true}
    capability_category:
      type: enum
      required: false
      constraints: {reviewed_taxonomy: true, sensitive_values_collapsed_by_default: true}
    token_count:
      type: integer_or_bucket
      required: false
      constraints: {default_bucketed_or_metric_histogram: true, exact_diagnostic_only: true}
    character_count:
      type: integer_or_bucket
      required: false
      constraints: {default_bucketed: true, exact_diagnostic_only: true, content_not_stored: true}
    message_count:
      type: integer_or_bucket
      required: false
      constraints: {default_bucketed: true, no_role_sequence: true}
    request_count:
      type: integer_or_bucket
      required: false
      constraints: {default_safe_when_identity_free: true}
    result_count:
      type: integer_or_bucket
      required: false
      constraints: {default_safe_when_identity_free: true}
    retry_count:
      type: integer_or_bucket
      required: false
      constraints: {default_bucketed: true}
    status_class:
      type: enum
      required: true
      constraints: {normalized: true, raw_error_text_forbidden: true}
    provider_purpose:
      type: enum
      required: false
      constraints: {values: [preprocess, main, postprocess, translation, compression, safety, inspiration]}
    terminal_class:
      type: enum
      required: true
      constraints: {values: [completed, failed_before_main, failed_during_main, billing_failed, soft_limited, revoked, worker_interrupted]}
    completion_timing:
      type: numeric_duration_set
      required: true
      constraints: {first_token_final_marker_worker_tail_separate: true, non_negative: true}

  ForbiddenTelemetryFields:
    content:
      type: forbidden
      required: true
      constraints: {prompts_responses_messages_tool_payloads_urls_filenames_titles_forbidden: true}
    private_identifiers:
      type: forbidden
      required: true
      constraints: {user_chat_message_task_device_session_provider_cache_ids_forbidden_by_default: true}
    secrets:
      type: forbidden
      required: true
      constraints: {tokens_cookies_headers_keys_credentials_forbidden: true}
    raw_diagnostics:
      type: forbidden
      required: true
      constraints: {stack_traces_provider_payloads_exception_text_forbidden_by_default: true}

assertions:
  - id: ai-request-observability.propagation.complete
    type: invariant
    must: Each diagnosed AI turn has one trace tree that links the browser send span, WebSocket handler span, API dispatch, Celery producer, AI worker task, AI processing phase spans, and final marker publication without losing parent-child context.
    depends_on: [models.AIPhaseWaterfall, examples.trace_propagation]
  - id: ai-request-observability.waterfall.complete
    type: behavior
    must: The AI waterfall exposes queue delay, setup, optional compression, preparation, preprocessing and provider calls, pre-main work, every main iteration/provider/tool span, response finalization, validation, billing, encrypted persistence, final marker publication, postprocessing providers and delivery, queued-turn handoff, and separate first-token, final-marker, and worker-tail timing when present.
    depends_on: [models.AIPhaseWaterfall, examples.diagnostic_traces]
  - id: ai-request-observability.default-metrics.identity-free
    type: privacy
    must: Default AI metrics are aggregated before operator use and contain no user, chat, message, task, device, session, trace, provider request, cache key, exact timestamp, prompt, response, tool parameter, URL, filename, ciphertext, key, or secret.
    depends_on: [models.AIRequestTelemetryPolicy.default_metrics, models.ForbiddenTelemetryFields, examples.default_aggregate_metrics]
  - id: ai-request-observability.structural-traces.content-free
    type: privacy
    must: Per-request structural traces use only one request-scoped trace identifier plus reviewed phase, status, model-family, capability-category, duration, retry, token, size, message-count, request-count, and result-count metadata; raw content and stable product identifiers remain absent.
    depends_on: [models.AIRequestTelemetryPolicy.structural_traces, models.PrivacySafeAIMetadata, examples.diagnostic_traces, examples.privacy_boundaries]
  - id: ai-request-observability.diagnostic-mode.bounded
    type: security
    must: Exact numeric counts, exact non-sensitive model identifiers, exact non-sensitive app/skill identifiers, and task IDs are visible only in explicit diagnostic mode with an incident or opt-in scope, audited access, and bounded retention; prompts, responses, tool parameters, URLs, filenames, ciphertext, secrets, and raw error text remain forbidden.
    depends_on: [models.AIRequestTelemetryPolicy.diagnostic_mode, examples.diagnostic_traces, examples.retention_and_access]
  - id: ai-request-observability.exporter.allowlist
    type: security
    must: Production trace export uses tier-specific attribute allowlists so unknown attributes are dropped by default, and error-span escalation never exports raw user IDs or other stable private identifiers.
    depends_on: [models.ForbiddenTelemetryFields, examples.privacy_boundaries]
  - id: ai-request-observability.operator-debug.waterfall
    type: behavior
    must: Operator tooling renders repeated providers, iterations, and tools without overwriting them, showing count, total child time, critical-path maximum, parent, bounded metadata, terminal-aware missing-span diagnostics, and no raw span payloads or private content.
    depends_on: [models.AIPhaseWaterfall, examples.dashboards_and_cli]
  - id: ai-request-observability.retention.verified
    type: security
    must: The deployed OpenObserve version's effective retention and stream placement are verified before rollout; telemetry credentials are least-privilege where supported, query access is role-scoped and audited, and retained data stays on the existing self-hosted OpenMates observability infrastructure.
    depends_on: [models.AIRequestTelemetryPolicy.retention, examples.retention_and_access]
  - id: ai-request-observability.alerts.discord-email-fallback
    type: behavior
    must: AI observability alerts use configured and connected Discord as the primary operator channel; server-admin email is attempted only when Discord is unavailable and server-owner email notifications are enabled, and an accepted Discord delivery suppresses duplicate email for the same logical alert.
    depends_on: [models.AIAlertRouting, examples.notification_delivery]
  - id: ai-request-observability.no-behavior-change
    type: invariant
    must: Adding observability does not change prompts, model routing, context selection, tool planning, billing decisions, persistence ordering, or user-visible AI response content except for negligible timing overhead and diagnostic-only operator outputs.
    depends_on: [examples.no_behavior_change]

applies_to:
  rest_api:
    required: false
    role: Existing first-party telemetry proxy and internal/admin debug routes may be tightened, but no public or developer telemetry API is introduced.
  cli:
    required: true
    parity: semantic
    role: Operator CLI/debug tooling renders privacy-safe AI request waterfalls and validates observability health.
  sdks:
    required: false
    role: AI request observability is an internal/operator surface, not an npm or pip SDK feature.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: false
    role: Browser tracing propagation may be repaired, but no user-facing web or Apple UI is required for this observability feature.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [trace_propagation, default_aggregate_metrics, diagnostic_traces, privacy_boundaries, retention_and_access, dashboards_and_cli, notification_delivery, no_behavior_change]
