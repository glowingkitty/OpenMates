schema_version: 1
specification: architecture.test-orchestration@1

execution_order:
  - id: critical-failure-does-not-hide-broad-results
    given: {infrastructure_healthy: true, critical_total: 42, critical_failed: 2, broad_total: 216}
    expect: {critical_phase_first: true, broad_phase_runs: true, critical_status: failed, broad_results_preserved: true}
  - id: infrastructure-cannot-run-broad-suite
    given: {critical_phase_complete: true, github_dispatch_budget: exhausted}
    expect: {new_dispatches: 0, broad_dependants: blocked_by_parent, false_product_failures: 0}

critical_registry:
  - id: explicit-critical-membership
    given:
      registry:
        - {test: settings-buy-credits-stripe-managed.spec.ts, category: billing}
        - {test: signup-flow-passkey.spec.ts, category: signup_auth}
        - {test: chat-flow.spec.ts, category: core_chat}
    expect: {duplicates: 0, unclassified_entries: 0, execution_phase: critical}
  - id: likely-critical-test-requires-review
    given: {new_test: signup-new-provider.spec.ts, classification: absent}
    expect: {audit: failed, test_silently_broad_only: false}

dispatch_budget:
  - id: hard-rate-limit-opens-circuit
    given: {first_dispatch_response: 403, rate_limit_remaining: 0, pending_specs: 108}
    expect: {dispatch_retries: 0, additional_dispatch_requests: 0, parent_incidents: 1, blocked_dependants: 108}
  - id: low-budget-preserves-critical-capacity
    given: {rate_limit_state: low, critical_pending: 12, broad_pending: 200}
    expect: {critical_dispatched_first: true, broad_dispatch_requires_budget: true}
  - id: accepted-dispatch-uses-bounded-discovery
    given: {accepted_dispatches: 20, visible_run_ids: delayed}
    expect: {batch_discovery: true, duplicate_dispatches: 0, per_spec_six_poll_loops: false}

result_classification:
  - id: github-quota-is-infrastructure
    given: {executed_failed: 7, undispatched_rate_limited: 100}
    expect: {product_failed_count: 7, infrastructure_parent_incidents: 1, blocked_dependants: 100}
  - id: account-preflight-parent
    given: {unavailable_account: 14, dependent_specs: 3}
    expect: {parent_incidents: 1, blocked_dependants: 3, passed_dependants: 0}

notification_delivery:
  - id: email-failure-cannot-stop-tests
    given: {email_result: failed, discord_result: provider_accepted, tests_pending: 216}
    expect: {tests_continue: true, email_status: failed, discord_status: provider_accepted, notification_health: incomplete}
  - id: queue-acceptance-is-not-delivery
    given: {email_transport: internal_queue, queue_result: accepted}
    expect: {email_status: queued_unconfirmed, email_delivered: false}
  - id: both-provider-accepted
    given: {email_result: provider_accepted, discord_result: provider_accepted}
    expect: {notification_health: complete, test_results_unchanged: true}

recovery_milestone:
  - id: milestone-passes-at-fifty
    given: {infrastructure_incidents: 0, email: provider_accepted, discord: provider_accepted, critical_failed: 0, product_failed_count: 50, unowned_failures: 0}
    expect: {recovery_milestone: passed}
  - id: milestone-fails-at-fifty-one
    given: {infrastructure_incidents: 0, email: provider_accepted, discord: provider_accepted, critical_failed: 0, product_failed_count: 51, unowned_failures: 0}
    expect: {recovery_milestone: incomplete, reason: failure_threshold_exceeded}
  - id: milestone-fails-with-unowned-remainder
    given: {infrastructure_incidents: 0, email: provider_accepted, discord: provider_accepted, critical_failed: 0, product_failed_count: 20, unowned_failures: 1}
    expect: {recovery_milestone: incomplete, reason: unowned_failure}

privacy_boundaries:
  - id: operator-evidence-is-sanitized
    given:
      available_fields: [test_key, status, error_class, run_id, git_sha, recipient_email, webhook_url, cookie, raw_provider_response]
    expect:
      included: [test_key, status, error_class, run_id, git_sha]
      excluded: [recipient_email, webhook_url, cookie, raw_provider_response]
