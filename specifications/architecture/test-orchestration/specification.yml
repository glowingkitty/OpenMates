schema_version: 1
id: architecture.test-orchestration
version: 1
status: draft
title: Daily Test Orchestration And Recovery
summary: >
  Scheduled OpenMates test runs execute critical billing, signup/auth, and core
  chat coverage before the broad suite, preserve complete and truthful product
  and infrastructure outcomes under external failures, deliver independent
  operator notifications without blocking tests, and support a measurable
  recovery milestone.

scope:
  includes:
    - Scheduled daily execution through the internal test control plane.
    - Canonical critical-test classification for billing, signup/auth, and core chat.
    - GitHub Actions request budgeting, rate-limit handling, and dispatch outcomes.
    - Separate critical, broad-product, infrastructure, and notification health.
    - Independent provider-accepted email and Discord delivery receipts.
    - Durable campaign ownership for remaining product failures.
    - A recovery milestone requiring critical health and no more than fifty failed tests.
  excludes:
    - Changing billing, signup, authentication, chat, Apple, or provider product behavior merely to satisfy a test.
    - Hiding failures through quarantine, omission, suppression, or false-success retries.
    - Making notifications a prerequisite for starting or continuing test execution.
    - Replacing the dev-to-main release core-journeys gate.
    - Public REST APIs, developer APIs, npm SDKs, pip SDKs, or product UI.
    - Requiring global zero failures for the first recovery milestone.

models:
  DailyTestRun:
    subject_commit:
      type: git_sha
      required: true
    phases:
      type: array
      required: true
      constraints: {ordered: [preflight, critical, broad, notifications, publication]}
    critical_status:
      type: enum
      values: [passed, failed, blocked]
      required: true
    product_failed_count:
      type: integer
      required: true
      constraints: {minimum: 0}
    infrastructure_incidents:
      type: array
      required: true
      constraints: {parent_incidents: true, dependants_not_counted_as_product_failures: true}

  CriticalTestClassification:
    canonical_test_key:
      type: string
      required: true
    category:
      type: enum
      values: [billing, signup_auth, core_chat]
      required: true
    reason:
      type: string
      required: true
    active:
      type: boolean
      required: true

  DispatchBudget:
    remaining_requests:
      type: integer
      required: false
      constraints: {minimum: 0}
    reset_at:
      type: timestamp
      required: false
    state:
      type: enum
      values: [healthy, low, exhausted, unknown]
      required: true
    circuit_open:
      type: boolean
      required: true

  NotificationOutcome:
    channel:
      type: enum
      values: [email, discord]
      required: true
    configured:
      type: boolean
      required: true
    status:
      type: enum
      values: [provider_accepted, queued_unconfirmed, failed, unconfigured]
      required: true
    transport:
      type: string
      required: false

assertions:
  - id: test-orchestration.daily.critical-first-broad-continues
    type: invariant
    must: Scheduled daily runs execute the complete canonical critical registry before broad tests, preserve a separate critical result, and continue broad product execution after critical product failures whenever infrastructure remains capable of running tests.
    depends_on: [models.DailyTestRun, models.CriticalTestClassification, examples.execution_order]
  - id: test-orchestration.critical.registry-audited
    type: invariant
    must: Every active billing, signup/auth, and core-chat test has one explicit canonical classification, and a deterministic audit rejects likely-critical tests that are added, renamed, or left unclassified.
    depends_on: [models.CriticalTestClassification, examples.critical_registry]
  - id: test-orchestration.dispatch.quota-aware-circuit-breaker
    type: failure
    must: Dispatch observes the available GitHub request budget, avoids request-amplifying per-spec discovery where bounded batch discovery is possible, does not retry hard rate-limit responses, and opens one circuit-breaker incident that leaves undispatched dependants visible without issuing futile requests.
    depends_on: [models.DispatchBudget, models.DailyTestRun.infrastructure_incidents, examples.dispatch_budget]
  - id: test-orchestration.results.infrastructure-is-not-product-failure
    type: invariant
    must: Rate limits, unavailable accounts, unhealthy workers, deployment mismatch, notification failure, and artifact-control failures are reported independently from executed product-test failures; blocked or undispatched tests remain visible and are never counted as passed or as independent product regressions.
    depends_on: [models.DailyTestRun, examples.result_classification]
  - id: test-orchestration.notifications.non-blocking-receipts
    type: invariant
    must: Scheduled daily test execution starts and continues regardless of email or Discord success, then records an independent terminal outcome for both required channels; only provider acceptance counts as delivered, queue acceptance remains unconfirmed, and any missing or failed channel makes notification health incomplete without rewriting test results.
    depends_on: [models.NotificationOutcome, examples.notification_delivery]
  - id: test-orchestration.recovery.milestone
    type: behavior
    must: The first recovery milestone requires one complete commit-pinned daily run with no unresolved infrastructure incident, provider-accepted email and Discord outcomes, every classified critical test passing, no more than fifty executed product-test failures, and every remaining failure assigned to a durable campaign group.
    depends_on: [models.DailyTestRun, models.NotificationOutcome, examples.recovery_milestone]
  - id: test-orchestration.evidence.privacy-boundary
    type: privacy
    must: Test orchestration records, notifications, logs, and campaign links contain bounded operational metadata and sanitized error classes only, excluding credentials, webhook URLs, recipient addresses, cookies, user content, private identifiers, and raw provider responses.
    depends_on: [models.DailyTestRun, models.NotificationOutcome, examples.privacy_boundaries]

applies_to:
  rest_api:
    required: false
    role: No public or developer API changes are part of daily test orchestration.
  cli:
    required: true
    parity: canonical
    role: Internal operator commands in scripts/tests.py are the canonical execution and status surface.
  sdks:
    required: false
    role: Daily test orchestration is not an npm or pip SDK capability.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: false
    role: Email and Discord are operator outputs; no web or Apple product UI is introduced.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [execution_order, critical_registry, dispatch_budget, result_classification, notification_delivery, recovery_milestone, privacy_boundaries]
