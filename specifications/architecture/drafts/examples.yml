schema_version: 1
specification: architecture.drafts@1

access_boundaries:
  - id: authenticated-first-party-only
    given:
      client: web
      authentication: session_or_approved_device
      draft_payload: {encrypted_draft_md: cipher-md, encrypted_draft_preview: cipher-preview, draft_v: 3}
    expect:
      persistent_storage: encrypted_only
      plaintext_server_storage: absent
      public_or_developer_draft_mutation: forbidden
  - id: unauthenticated-session-draft
    given:
      authentication: none
      composer_text: temporary guest text
    expect:
      storage: sessionStorage
      authenticated_draft_record: absent
      migration_or_cleanup_on_auth_boundary: required
  - id: incognito-no-persistence
    given:
      incognito_mode: true
      composer_text: sensitive text
    expect:
      persistent_authenticated_draft: absent
      durable_unencrypted_storage: absent

persistence:
  - id: non-empty-authenticated-save
    given:
      authenticated_user: true
      composer_tiptap: {text: Plan a weekend cycling route, embeds: [image]}
      network: online
    expect:
      markdown_serializer: canonical
      preview_order: [text, image]
      local_write_before_network: true
      websocket_event: update_draft
      persisted_fields: {encrypted_draft_md: present, encrypted_draft_preview: present, draft_v: greater_than_or_equal_to_1}
      plaintext_durable_storage: absent
  - id: offline-save-queues-encrypted-update
    given:
      authenticated_user: true
      network: offline
      composer_text: Continue later
    expect:
      local_draft_saved: true
      offline_change_queued: true
      queued_payload_plaintext: absent

sync_reconciliation:
  - id: newer-remote-draft-applies
    given:
      local_draft_v: 2
      incoming_draft_v: 3
      active_editor_unsaved_changes: false
    expect:
      local_encrypted_draft_updated: true
      editor_updated_when_active: true
  - id: local-unsaved-draft-wins
    given:
      local_draft_v: 3
      incoming_draft_v: 3
      active_editor_unsaved_changes: true
      local_embed_reference: present
      incoming_embed_reference: absent
    expect:
      overwrite_active_editor: false
      local_embed_reference_preserved: true
  - id: authoritative-zero-clears-stale-local
    given:
      local_draft_v: 4
      draft_versions_response: {draft_v: 0}
      cache_error: false
    expect:
      encrypted_draft_md: null
      encrypted_draft_preview: null
      draft_v: 0
  - id: cache-error-is-not-deletion
    given:
      local_draft_v: 4
      get_draft_versions_result: cache_error
    expect:
      local_draft_cleared: false

draft_only_lifecycle:
  - id: first-save-creates-draft-route
    given:
      authenticated_user: true
      route: /
      composer_text: Plan a weekend cycling route around Berlin
      existing_chat_id: null
    when:
      first_non_empty_autosave: succeeds
    expect:
      active_route: "#chat-id=<draft-chat-id>"
      draft_only_chat: present
      messages_v: 0
      draft_v: 1
      draft_chrome_visible: true
  - id: send-promotes-same-id
    given:
      draft_only_chat: {chat_id: draft-chat-id, draft_v: 1, messages_v: 0}
    when:
      user_sends_saved_draft: true
    expect:
      active_route: "#chat-id=draft-chat-id"
      draft_badge: hidden
      messages_v: 1
      normal_processing: visible
  - id: clear-removes-unsent-shell
    given:
      draft_only_chat: {chat_id: draft-chat-id, draft_v: 1, messages_v: 0}
    when:
      user_clears_composer: true
    expect:
      route: /
      draft_only_chat: deleted
      draft_chrome_visible: false
      composer_focused: true
      late_save_recreates_shell: false

presentation:
  - id: draft-header-uses-last-saved-preview
    given:
      draft_only_chat:
        draft_v: 2
        encrypted_draft_preview: cipher-preview-v2
        messages_v: 0
    expect:
      draft_badge: visible
      title_source: last_successful_saved_preview
      category_icon_source: draft_defaults
      editable_generated_metadata: hidden
  - id: draft-visible-in-chat-surfaces
    given:
      draft_only_chat: {chat_id: draft-chat-id, draft_v: 1, messages_v: 0}
    expect:
      sidebar_row: visible
      resume_card: visible
      search_result: eligible
      header_navigation_target: eligible

navigation:
  - id: regular-chat-can-navigate-to-newer-draft
    given:
      header_navigation_order: [newer-draft-only-chat, selected-regular-chat, older-regular-chat]
      sidebar: closed
    when:
      user_clicks: chat-header-next
    expect:
      active_chat_id: newer-draft-only-chat
      draft_badge: visible
  - id: empty-hidden-and-private-drafts-excluded
    given:
      candidate_chats:
        - {chat_id: draft-only, draft_v: 1, messages_v: 0}
        - {chat_id: empty-shell, draft_v: 0, messages_v: 0}
        - {chat_id: hidden-draft, draft_v: 1, is_hidden_candidate: true}
        - {chat_id: anonymous-draft, draft_v: 1, is_anonymous: true}
        - {chat_id: incognito-draft, draft_v: 1, is_incognito: true}
    expect:
      included: [draft-only]
      excluded: [empty-shell, hidden-draft, anonymous-draft, incognito-draft]

established_chats:
  - id: established-chat-keeps-normal-header
    given:
      chat:
        messages_v: 1
        title: Kyoto and Osaka quick tip
        encrypted_chat_summary: cipher-summary
        draft_v: 1
    expect:
      draft_badge: hidden
      header_mode: normal
      title_source: existing_chat_metadata
      route_behavior: unchanged
