schema_version: 1
id: architecture.drafts
version: 1
status: approved
title: Chat Drafts
summary: >
  Authenticated first-party clients persist, synchronize, present, send, and clear
  chat drafts as encrypted per-user state. A persisted new-chat draft becomes a
  durable draft-only chat route and navigation target, while established chats
  with sent messages retain normal chat presentation.

inherits:
  - architecture.sync@1

scope:
  includes:
    - Authenticated first-party web and Apple chat composer drafts.
    - Client-side canonical serialization, encrypted draft markdown, encrypted preview, and per-user draft_v versioning.
    - Local-first save, offline queueing, WebSocket update/delete/version reconciliation, and stale deletion evidence.
    - Draft-only chat route identity, header/sidebar/resume/search presentation, chronological header navigation, send promotion, and clear deletion.
    - Established chats that contain unsent drafts while already having sent messages or generated metadata.
  excludes:
    - Changing Format-D encryption, chat-key wrapping, or the update_draft/delete_draft/get_draft_versions protocol shape.
    - Public unauthenticated REST APIs, developer API-key APIs, CLI commands, or SDK methods that expose or mutate private draft plaintext.
    - Incognito draft persistence beyond transient in-memory editor state.
    - Treating unauthenticated sessionStorage drafts as encrypted authenticated draft state before account migration.
    - Applying draft-only header presentation to chats that already contain sent messages or generated metadata.

models:
  AuthenticatedDraft:
    chat_id:
      type: uuid
      required: true
      constraints: {route_identity: stable, user_scoped: true}
    draft_v:
      type: integer
      required: true
      constraints: {minimum: 0, source: authoritative_user_draft_version}
    encrypted_draft_md:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden, format: account_master_key_encrypted_markdown}
    encrypted_draft_preview:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden, source: ordered_tiptap_preview_tokens}
    last_saved_plaintext:
      type: client_memory
      constraints: {server_storage: forbidden, durable_unencrypted_storage: forbidden}

  DraftOnlyChat:
    chat_id:
      type: uuid
      required: true
      constraints: {route: "#chat-id=<uuid>", stable_through_send: true}
    draft:
      type: AuthenticatedDraft
      required: true
      constraints: {draft_v_minimum: 1, encrypted_draft_required: true}
    messages_v:
      type: integer
      default: 0
      constraints: {must_equal: 0}
    generated_metadata:
      type: object
      constraints: {title: absent, summary: absent, icon: absent, category: absent, title_v: 0}
    excluded_flags:
      type: object
      constraints: {hidden_candidate: false, incognito: false, anonymous: false, ideabucket_triggered_at: absent}

  EstablishedChatDraft:
    chat_id:
      type: uuid
      required: true
    messages_v:
      type: integer
      constraints: {minimum: 1}
    generated_metadata:
      type: object
      constraints: {normal_chat_header_source: true}
    draft:
      type: AuthenticatedDraft
      required: false
    header_mode:
      type: enum
      values: [normal]

  DraftSyncUpdate:
    channel:
      type: websocket_event
      constraints: {events: [chat_draft_updated, draft_versions_response], authentication: session_or_approved_device, first_party_only: true}
    draft_v:
      type: integer
      required: true
      constraints: {newer_than_local_required_for_overwrite: true}
    encrypted_draft_md:
      type: encrypted_string
      nullable: true
      constraints: {plaintext: forbidden}
    deletion_evidence:
      type: object
      constraints: {draft_v_zero_clears_stale_local_draft: true, cache_errors_do_not_imply_deletion: true}

  DraftBoundary:
    unauthenticated_session_storage:
      type: cleartext_session_state
      constraints: {session_local: true, migrates_or_clears_on_auth: true, not_authenticated_draft_state: true}
    incognito:
      type: transient_editor_state
      constraints: {persistent_draft_storage: forbidden}

assertions:
  - id: drafts.access.first-party-encrypted
    type: security
    must: Persistent authenticated drafts are owned by first-party session or approved-device clients, stored and synchronized only as encrypted markdown/preview plus per-user draft_v, and never exposed through public, developer, CLI, or SDK plaintext draft mutation surfaces.
    depends_on: [models.AuthenticatedDraft, models.DraftSyncUpdate, models.DraftBoundary, examples.access_boundaries]
  - id: drafts.persistence.local-first-encrypted
    type: behavior
    must: Saving a non-empty authenticated draft serializes canonical composer content, builds an ordered preview, encrypts markdown and preview with the account master key, writes local state first, and sends or queues the encrypted update without durable plaintext storage.
    depends_on: [models.AuthenticatedDraft, examples.persistence]
  - id: drafts.sync.version-authoritative
    type: invariant
    must: Draft reconciliation applies only authoritative newer per-user draft versions, preserves active unsaved local editor content and local embed references, and treats draft_v=0 as deletion only when delivered as explicit authoritative draft evidence.
    depends_on: [models.DraftSyncUpdate, examples.sync_reconciliation]
  - id: drafts.draft-only.lifecycle
    type: behavior
    must: The first successful non-empty save for a blank authenticated composer creates one draft-only chat shell at #chat-id=<UUID>; send promotes the same ID to normal chat processing, and clear deletes an unsent shell and returns to the focused blank composer.
    depends_on: [models.DraftOnlyChat, examples.draft_only_lifecycle]
  - id: drafts.draft-only.presentation
    type: behavior
    must: Draft-only chats render explicit draft presentation from the last successful save, including a Draft badge and saved preview title, and remain visible in first-party chat list, resume, search, and header contexts.
    depends_on: [models.DraftOnlyChat, examples.presentation]
  - id: drafts.navigation.includes-draft-only
    type: behavior
    must: Draft-only chats are normal chronological ChatHeader previous/next targets while empty metadata-less shells, hidden candidates, anonymous drafts, and incognito drafts remain excluded, including when the sidebar is closed.
    depends_on: [models.DraftOnlyChat, examples.navigation]
  - id: drafts.established-chat.presentation-unchanged
    type: invariant
    must: Typing or saving a draft in a chat with sent messages or generated metadata does not switch that chat into draft-only header presentation or change its normal title, icon, category, summary, timestamp, or route behavior.
    depends_on: [models.EstablishedChatDraft, examples.established_chats]
  - id: drafts.boundaries.session-and-incognito
    type: privacy
    must: Unauthenticated drafts are temporary sessionStorage state until migration or cleanup, and incognito drafts remain transient editor state with no persistent authenticated draft record.
    depends_on: [models.DraftBoundary, examples.access_boundaries]

applies_to:
  rest_api:
    required: false
    role: Authenticated draft mutation and reconciliation are first-party WebSocket/client flows, not public or developer REST surfaces under this contract.
  cli:
    required: false
    role: CLI may create/send chats but does not own private interactive draft mutation or draft-only GUI presentation.
  sdks:
    required: false
    role: npm and pip SDKs do not own private interactive draft mutation or draft-only GUI presentation.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: true
    parity: semantic
    implementations:
      web: {required: true}
      apple: {required: true}
    exceptions:
      - id: native-header-formatting
        implementation: apple
        reason: Apple may use native header composition and relative-date formatting while preserving the same state transitions and visible hierarchy.
        equivalent_outcome: The user sees the same draft-only, established-chat, navigation, send-promotion, and clear-deletion states even though the native header layout and date formatting differ from web CSS.

examples:
  file: examples.yml
  required_groups: [access_boundaries, persistence, sync_reconciliation, draft_only_lifecycle, presentation, navigation, established_chats]
