schema_version: 1
id: architecture.storage-resilience
version: 1
status: draft
title: Object Storage Outage Resilience
summary: >
  OpenMates keeps its API, text AI, and non-storage capabilities available when
  configured S3-compatible object storage is temporarily unavailable, while
  storage-dependent work fails safely and operators receive low-noise alerts.

scope:
  includes:
    - API startup, liveness, and non-storage request handling during object-storage outages.
    - Fail-fast behavior for uploads, stored-file reads, generated media, and other storage-dependent work.
    - Credit and provider-work protection before unavailable storage operations begin.
    - Durable retry behavior for background archive, deletion, and cleanup jobs.
    - Environment-isolated outage, escalation, recovery, and daily-digest operator reporting.
  excludes:
    - Silent local-disk fallback for durable user objects.
    - Automatic migration, replication, or failover to a second object-storage provider.
    - Claiming storage-backed features are healthy while their configured storage is unavailable.
    - Browser, Apple, or end-user notification UI changes.

models:
  StorageCapability:
    configured:
      type: boolean
      required: true
    status:
      type: enum
      values: [available, unavailable, not_configured]
      required: true
    affects_core_liveness:
      type: boolean
      constraints: {value: false}
    last_probe_at:
      type: timestamp
      nullable: true

  StorageDependentOperation:
    requires_durable_storage:
      type: boolean
      required: true
    provider_work_started:
      type: boolean
      required: true
    credits_charged:
      type: boolean
      required: true
    failure_code:
      type: enum
      values: [storage_temporarily_unavailable]
      nullable: true
    retryable:
      type: boolean
      required: true

  StorageIncident:
    environment:
      type: enum
      values: [development, production, self_host]
      required: true
    consecutive_failed_probes:
      type: integer
      required: true
    state:
      type: enum
      values: [healthy, warning, critical, resolved]
      required: true
    warning_threshold:
      type: integer
      constraints: {consecutive_failed_probes: 2}
    critical_threshold:
      type: duration
      constraints: {continuous_outage: 1h}
    recovery_threshold:
      type: integer
      constraints: {successful_probes: 1}

assertions:
  - id: storage-resilience.core.s3-is-noncritical
    type: failure
    must: >
      A configured S3-compatible storage timeout, 5xx response, bucket-policy
      reconciliation failure, or CORS reconciliation failure cannot prevent the
      API from starting, keep liveness from responding, or block text AI and
      other operations that do not require durable object storage.
    depends_on: [models.StorageCapability, examples.core_availability]
  - id: storage-resilience.operations.fail-before-cost
    type: invariant
    must: >
      When durable object storage is unavailable, an operation that requires it
      fails before paid provider work or credit charging with the stable retryable
      code storage_temporarily_unavailable; no successful-persistence claim or
      silent local-disk fallback is allowed.
    depends_on: [models.StorageDependentOperation, examples.storage_operations]
  - id: storage-resilience.jobs.preserve-and-retry
    type: invariant
    must: >
      Background archive, deletion, and cleanup work retains authoritative source
      records and pending intent when object storage is unavailable, performs no
      destructive source cleanup before confirmed storage success, and retries
      through the task's bounded durable retry policy after recovery.
    depends_on: [examples.background_jobs]
  - id: storage-resilience.monitoring.transition-alerts
    type: behavior
    must: >
      Every deployment with configured object storage opens one environment-isolated
      warning after two consecutive failed probes, sends it through every configured
      host-owned operator channel, emits no duplicate warning while unchanged,
      escalates once to critical after one continuous hour, records the degradation
      in daily operational digests, and emits one resolved event after the first
      successful recovery probe.
    depends_on: [models.StorageIncident, examples.operator_alerts]
  - id: storage-resilience.monitoring.not-configured
    type: behavior
    must: >
      A deployment that intentionally has no object-storage configuration reports
      storage features as not_configured and unavailable without opening a false
      provider-outage incident.
    depends_on: [models.StorageCapability, examples.operator_alerts]
  - id: storage-resilience.content.privacy-boundary
    type: privacy
    must: >
      Storage health state, logs, metrics, incident records, and notifications contain
      only environment, stable check IDs, bounded timing/state, and sanitized failure
      classes; they exclude credentials, endpoints containing secrets, bucket/object
      keys, filenames, user identifiers, content, ciphertext, and provider responses.
    depends_on: [models.StorageIncident, examples.privacy_boundaries]

applies_to:
  rest_api:
    required: true
    role: >
      Existing unauthenticated public liveness and first-party storage-dependent
      routes expose availability without adding a new endpoint or broadening access.
  cli:
    required: true
    parity: semantic
    role: CLI-managed runtime monitoring delivers and displays storage incidents.
  sdks:
    required: false
    role: Existing npm and pip error propagation preserves the stable retryable storage code; no new method is added.
    implementations:
      npm: {required: false}
      pip: {required: false}
  gui:
    required: false
    role: No web or Apple UI changes are required for operator-only storage monitoring.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [core_availability, storage_operations, background_jobs, operator_alerts, privacy_boundaries]
