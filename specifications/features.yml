  - id: chats
    name: "Chats"
    kind: core
    description: "End-to-end encrypted chats that sync across devices and recover unfinished answers."
    specifications: [feature.chats]
    product_features: [trusted-quotes, chat-file-downloads]
    release: v0.5.0-alpha
    surfaces: {web: implemented, apple: implemented, watchos: implemented, cli: implemented, tui: implemented, rest_api: implemented, sdk_npm: implemented, sdk_pypi: implemented}
    subfeatures:
      - id: send-and-delivery
        name: "Sending and delivery"
        description: "Immediate send, idempotent messages, haptic confirmation, offline ordered replay"
        assertions: ["chats.send.*", "chats.message.*", "chats.offline-outbox.*"]
      - id: streaming-replies
        name: "Streaming replies"
        description: "Ordered progressive assistant streaming and final convergence"
        assertions: ["chats.streaming.*", "chats.rendering.assistant-document-convergence"]
      - id: completion-recovery
        name: "Completion and recovery"
        description: "Lease-fenced completion, pending delivery, takeover"
        assertions: ["chats.completion.*", "chats.sync.*"]
      - id: message-rendering
        name: "Message rendering"
        description: "Inline entities, preview info, skill failure banner, history entrance"
        assertions: ["chats.rendering.inline-entity-interaction", "chats.rendering.preview-info-top", "chats.rendering.skill-failure-banner", "chats.rendering.web-history-entrance"]
      - id: followups
        name: "Follow-up suggestions"
        description: "Main-generated composer follow-ups and reconciliation"
        assertions: ["chats.followups.*"]
      - id: forking
        name: "Forking chats"
        description: "Non-destructive fork boundary"
        assertions: ["chats.fork.*"]
      - id: context-and-direction
        name: "Context and direction"
        description: "Related-work context, direction assessment and correction"
        assertions: ["chats.context.*", "chats.direction.*"]
      - id: history-layout
        name: "History layout and hidden chats"
        description: "Responsive history layout, hidden chat section, local state precedence"
        assertions: ["chats.layout.*", "chats.hidden.*", "chats.local-state.*"]
      - id: privacy-and-parity
        name: "Encryption and surface parity"
        description: "Client-encrypted persistence and semantic parity"
        assertions: ["chats.persistence.*", "chats.surface.*"]
