# specifications/features.yml — unified feature overview (manual part).
#
# One entry per feature: what it is, which Specifications and backend apps own it,
# and the human judgement of its status on every surface. Everything the repository
# already knows is joined in by scripts/feature_overview.py and written to
#   specifications/generated/features.yml  (machine view: tests, Specification status, dev/prod flags)
#   specifications/generated/features.md   (table for people)
# Never copy test lists or flag states into this file; they are generated.
#
# Rule: a change that adds or changes a feature, a surface or an E2E test updates its
# entry here in the same commit. Check: python3 scripts/feature_overview.py --check
# (the deploy gate runs it). New Specification or app: feature_overview.py suggest <id>.
#
# Fields
#   id                kebab-case, stable.
#   name, description short, user-facing wording.
#   kind              core | app | apple | platform | internal | surface
#   specifications    Specification ids owned by this entry (each Specification belongs to exactly one entry).
#   apps              backend/apps/<id> owned by this entry (each app belongs to exactly one entry);
#                     their app:<id> feature flags are included automatically.
#   flags             extra feature-availability ids (platform:*, skill:*) that gate the feature.
#   product_features  ids in frontend/packages/ui/src/data/product_features.yml (marketing copy).
#   release           first release tag the feature shipped in (e.g. v0.14.0-alpha), untagged-main
#                     (on main/production, after the latest tag), unreleased (dev only or disabled
#                     on production) or unverified.
#   surfaces          web, apple (shared iOS/iPadOS/macOS app), watchos (only where relevant),
#                     cli, tui, rest_api, sdk_npm, sdk_pypi, each one of:
#                     not_planned | planned | in_progress | implemented | tested | live | unverified
#                     tested/live need at least one test on that surface (from a Specification
#                     test or key_tests); live also needs the feature enabled in production config.
#   apple_platforms   optional subset of [ios, ipados, macos] when not all three apply.
#   key_tests         optional {surface: [test paths]} for proof not mapped through a Specification.
#   notes             optional caveats.
#
# Initial fill (2026-11-14) was derived from evidence, not guessed: tested = an E2E test exists
# for that surface; implemented = only unit tests on that surface; live = tested on web or the
# REST API, its E2E test is on main and the feature is enabled in production config;
# not_planned = the owning Specification does not require that surface; unverified = no
# evidence either way. Release = first tag containing the entry's E2E tests or app folder
# (v1.0 tag ignored as an outlier). Raise or correct any value by hand once you know better.
schema_version: 1
