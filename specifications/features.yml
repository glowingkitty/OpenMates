    evidence:
      sdk_npm: "sdk.ts model option + default_ai_model_*; sdk.py ask(model=), AiModelDefaults"
      sdk_pypi: "sdk.ts model option + default_ai_model_*; sdk.py ask(model=), AiModelDefaults"
