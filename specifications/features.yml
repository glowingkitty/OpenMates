# specifications/features.yml — unified feature overview (manual part).
#
# One entry per feature: what it is, which Specifications and backend apps own it,
# its sub-features and the human intent per surface. Everything else is derived by
# scripts/feature_overview.py and written to
#   specifications/generated/features.yml  (machine view)
#   specifications/generated/features.md   (table for people)
#
# Ownership (deterministic chain, nothing copied by hand):
#   Specifications own assertions (and which surfaces each assertion applies to).
#   Tests declare the assertions they prove (contract-test metadata -> assertion index).
#   specifications/test-results.yml holds the latest CI result per test file
#     (refresh: python3 scripts/feature_overview.py refresh-results).
#   This file owns only the grouping (feature -> Specifications, apps, sub-features),
#   the intent per surface and human notes.
# A cell with tests on its surface is derived: live | tested | partial | failing | not_run.
# A cell without tests shows the intent written here.
#
# Rule: a change that adds or changes a feature, a surface or an E2E test updates its
# entry here in the same commit. Check: python3 scripts/feature_overview.py --check
# (the deploy gate runs it). New Specification or app: feature_overview.py suggest <id>.
# Parity work: python3 scripts/feature_overview.py gaps --surface apple
#
# Fields
#   id                kebab-case, stable.
#   name, description short, user-facing wording.
#   kind              core | app | apple | platform | internal | surface
#   specifications    Specification ids owned by this entry (each Specification belongs to exactly one entry).
#   apps              backend/apps/<id> owned by this entry (each app belongs to exactly one entry);
#                     their app:<id> feature flags are included automatically.
#   flags             extra feature-availability ids (platform:*, skill:*) that gate the feature.
#   product_features  ids in frontend/packages/ui/src/data/product_features.yml (marketing copy).
#   release           first release tag the feature shipped in (e.g. v0.14.0-alpha), untagged-main
#                     (on main/production, after the latest tag), unreleased (dev only or disabled
#                     on production) or unverified.
#   surfaces          intent per surface: web, apple (shared iOS/iPadOS/macOS app), watchos (only
#                     where relevant), cli, tui, rest_api, sdk_npm, sdk_pypi, each one of
#                     implemented | in_progress | planned | unverified | not_planned.
#                     Never write tested/live: they are derived from tests and CI results.
#   evidence          optional {surface: "file, command or route"} backing an implemented or
#                     in_progress intent that no test proves yet.
#   apple_platforms   optional subset of [ios, ipados, macos] when not all three apply.
#   key_tests         optional {surface: [test paths]} for proof not mapped through an assertion.
#   notes             optional caveats.
#   subfeatures       optional list of {id, name, description, assertions, surfaces?, notes?};
#                     assertions are assertion ids or fnmatch globs (e.g. message-input.audio.*);
#                     surfaces gives intents where no test exists (default: unverified, or
#                     not_planned when the parent is not planned there).
#
# Initial intents (2026-11-14) were checked against source per surface (Svelte routes and
# components, Swift views and the UniFFI bindings, the CLI command catalog, the Rust TUI,
# REST routes, SDK exports); Apple parity follows web, so user-facing web features without
# Apple code are "planned" on Apple.
schema_version: 1
features:
