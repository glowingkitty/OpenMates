    name: "Account Import"
    kind: core
    description: "Import chat exports from other assistants after a preview and confirmation; stored client-encrypted."
    specifications: [feature.account-import]
    release: v0.6.0-alpha
    surfaces: {web: implemented, apple: implemented, cli: implemented, tui: implemented, rest_api: implemented, sdk_npm: implemented, sdk_pypi: implemented}
    evidence:
      apple: "apple/OpenMates/Sources/Features/Chat/Views/ChatImportView.swift"
      cli: "openmates account import chatgpt|claude|generic|opencode|openmates"
      tui: "frontend/packages/openmates-tui-native/src/ui.rs settings route account/import"
      sdk_npm: "sdk.ts previewImport/confirmImport; sdk.py preview_import/confirm_import"
      sdk_pypi: "sdk.ts previewImport/confirmImport; sdk.py preview_import/confirm_import"
