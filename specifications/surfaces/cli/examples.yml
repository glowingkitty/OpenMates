schema_version: 1
specification: surface.cli@1

encrypted_slugs:
  - id: workflow-create-stores-encrypted-slug
    input: {surface: cli, object_type: workflow, title: Daily weather reminder, requested_slug: omitted}
    expect:
      generated_slug: daily-weather-reminder
      durable_state_contains: [workflow_id, encrypted_slug, slug_lookup_hash, encrypted_title]
      durable_state_forbidden: [daily-weather-reminder, plaintext_slug, plaintext_title]
      slug_stable_after_title_rename: true
  - id: project-explicit-slug-is-encrypted
    input: {surface: sdk_or_web, object_type: project, name: Tax Docs 2026, slug: tax-docs}
    expect:
      durable_state_contains: [project_id, encrypted_slug, slug_lookup_hash, encrypted_name]
      durable_state_forbidden: [tax-docs, plaintext_name, plaintext_slug]
      owner_or_team_scoped_hash: true
  - id: duplicate-slug-hash-rejected-in-context
    input: {object_type: task, owner_context: personal, existing_slug: renew-passport, new_slug: renew-passport}
    expect_error:
      code: slug_already_exists
      duplicate_scope: same_owner_or_team_context
      partial_object_created: false

local_resolution:
  - id: workflow-runs-resolves-slug-before-api-call
    command: openmates workflows runs daily-weather-reminder
    local_steps: [list_owner_workflows, decrypt_encrypted_slug, match_slug, resolve_workflow_id]
    expect:
      api_request_path: /v1/workflows/{workflow_id}/runs
      api_request_forbidden: [daily-weather-reminder]
      terminal_output_uses_slug: true
  - id: task-show-resolves-slug-and-preserves-short-id-compatibility
    commands:
      - openmates tasks show renew-passport
      - openmates tasks show abc12345
    expect:
      both_resolve_to_task_id_before_request: true
      ambiguous_duplicate_short_id_or_slug_fails_visible: true
      server_receives_plaintext_slug: false
  - id: chat-send-resolves-slug-locally
    command: openmates chats send --chat berlin-trip-planning "add packing list"
    expect:
      local_decrypts_chat_slug: true
      websocket_payload_contains_chat_id: true
      websocket_payload_forbidden: [berlin-trip-planning]

human_output:
  - id: workflows-list-prefers-slug-and-state
    command: openmates workflows list
    expect_output_contains:
      - "Alias"
      - "Daily weather reminder"
      - "daily-weather-reminder"
      - "openmates workflows show daily-weather-reminder"
    expect_output_forbidden:
      - uuid_as_primary_column
  - id: workflow-runs-output-explains-run
    command: openmates workflows runs daily-weather-reminder
    expect_output_contains:
      - "Workflow: Daily weather reminder (daily-weather-reminder)"
      - "Runs"
      - "completed"
      - "schedule"
      - "openmates workflows run-show daily-weather-reminder"
    expect_output_forbidden:
      - opaque_run_id_only_row
  - id: projects-plans-tasks-chats-show-next-commands-with-slugs
    commands:
      - openmates projects list
      - openmates plans list
      - openmates tasks list
      - openmates chats list
    expect:
      slug_column_present: true
      title_or_name_column_present: true
      next_commands_prefer_slugs: true
      full_ids_available_in_detail_or_json: true

generated_file_downloads:
- id: json-url-only
  command: openmates apps music generate "Warm instrumental loop" --json
  expect: {files_saved: 0, stdout: structured_result_with_download_urls_and_expiry}
- id: json-explicit-download
  command: openmates apps music generate "Warm instrumental loop" --json --output ./music/background.wav
  expect: {files_saved: 1, local_path: ./music/background.wav, existing_target: atomically_replaced_after_success, stdout: structured_result_with_urls_and_saved_absolute_paths}
- id: automatic-name-collision
  given: {automatic_target_exists: true}
  expect: {existing_file_unchanged: true, new_file_saved_under_unique_name: true}
- id: shared-download-behavior-across-skills
  variants: [images.generate, videos.generate, music.generate, audio.generate, audio.speak, docs.generate, models3d.generate, code.run]
  given: {result: structured_generated_files, download_options: omitted}
  expect: {directory: invocation_cwd, each_distinct_artifact_saved: true, redundant_previews_saved: false, shared_destination_and_help_contract: true}
- id: multiple-generated-artifacts
  given: {distinct_generated_artifacts: 3, output_dir: ./generated}
  expect: {files_saved: 3, directory: ./generated, filenames_unique: true}
- id: invocation-directory
  command: openmates apps music generate "Warm instrumental loop"
  expect:
    directory: invocation_cwd
    files_saved: 1
    output: saved_absolute_path
- id: directory-and-name
  command: openmates apps music generate "Warm instrumental loop" --output-dir ./music --filename warm.wav
  expect:
    local_path: ./music/warm.wav
    provider_receives_destination_flags: false
- id: full-path
  command: openmates apps audio speak --text "Hello" --output ./voice/greeting.mp3
  expect:
    local_path: ./voice/greeting.mp3
- id: result-only
  command: openmates apps music generate "Warm instrumental loop" --no-download --json
  expect:
    files_saved: 0
    stdout: structured_result_json
generated_file_failures:
- id: existing-explicit-name
  given:
    explicit_target_exists: true
  expect:
    existing_file_replaced_after_success: true
    visible_error: false
    automatic_regeneration: false
- id: download-interrupted
  given:
    download_stream: interrupted
  expect:
    exit_code: nonzero
    incomplete_final_file: false
    existing_target_preserved: true
    recovery_identifier_reported: true
- id: invalid-destination
  given:
    filename: ../escape.wav
  expect:
    rejected_before_generation: true
    destination_escape: false
- id: batch-with-one-name
  given:
    requested_artifacts: 2
    filename: track.wav
  expect:
    rejected_before_generation: true
