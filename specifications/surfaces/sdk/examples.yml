schema_version: 1
specification: surface.sdk@1

sdk_architecture:
  - id: explicit-headless-client
    assertion_ids: [sdk.library.explicit-headless]
    given: A Rust, npm or Python SDK is instantiated while a CLI user is logged in, and a first-party client supplies its platform storage adapter.
    when: The caller supplies explicit credentials and invokes an encrypted operation or resumes synchronization after disconnecting.
    then: Shared Rust performs the reusable operation, crypto, authentication, storage policy, sync and recovery directly. Only the supplied adapter accesses platform storage; the SDK never discovers the CLI login, launches a CLI or initializes a terminal.
  - id: three-language-conformance-release
    assertion_ids: [sdk.parity.executable-release-gate]
    given: A public capability or cryptographic format is added or changed in one SDK.
    when: Shared-schema, protocol-fixture and cryptographic-vector conformance and package publication checks run.
    then: Actual Rust, npm and Python libraries must demonstrate matching capability semantics and errors; missing implementations, mismatched results or untracked public additions block release. Migration gaps stay open and required breaking changes are documented and versioned.

client_platforms:
  - id: browser-ui-and-media-adapter
    given: The migrated web app displays a chat and offers microphone input and a WebRTC call.
    when: The user records audio and reconnects the chat after a network interruption.
    then: Svelte/TypeScript renders the UI and invokes browser media APIs; shared Rust performs reusable chat operations, encryption, authorization and reconnect/recovery without a second TypeScript implementation.
  - id: native-ui-existing-data
    given: An Apple client has existing SwiftData chat records and the browser has existing IndexedDB records.
    when: Their native or browser UI opens a cached chat through the shared Rust core.
    then: Thin platform adapters retain those stores and data while Rust applies the same reusable policy; no forced SQLite or OPFS conversion occurs.

client_rollout:
  - id: unfinished-essential-native-flow-blocks-browser
    given: The entirely Rust CLI/TUI still has an unresolved authentication, encrypted-chat, streaming/cancellation, persistence or sync/reconnect/recovery defect.
    when: The migration considers starting browser/WASM integration.
    then: The essential native flow is repaired and verified first; architecture approval or passing command-parser tests alone do not admit browser integration.
  - id: essential-native-proof-admits-browser-with-parity-open
    given: Essential native auth, encrypted chat, streaming/cancellation, persistence and sync/reconnect/recovery have exact-source evidence, while some app and CLI commands remain unported.
    when: The verified Rust CLI is made available alongside the installed npm CLI for daily testing.
    then: Browser/WASM integration begins immediately and exhaustive CLI parity continues as separate required work; the npm command and source stay available until explicit retirement acceptance.
client_retirement:
  - id: accepted-clients-before-backend
    given: CLI/TUI and the full web migration are verified, including the web before/after measurements.
    when: Apple is migrated through the coordinated Mac workflow and all clients later receive explicit agent and user acceptance.
    then: Verified superseded client code is removed after acceptance; only after every client and its cleanup is complete may a separately scoped backend Rust migration begin.

web_migration_performance:
  - id: compare-complete-cold-load
    given: The same account, chat and browser conditions are available before and after web migration, with caches cold.
    when: Performance is measured for the full application.
    then: The report compares JavaScript and WASM download sizes separately and together, actual compressed transfer, cold startup including WASM initialization, usable-chat latency, auth/encrypted-chat/stream-cancel/persistence/sync-recovery responsiveness, CPU and RAM, with reproducible inputs and visible regressions or failures.
  - id: smaller-javascript-is-insufficient
    given: The migrated JavaScript is smaller but its WASM transfer grows and only a warm renderer benchmark has run.
    when: Web migration completion is reviewed.
    then: Performance remains unverified until comparable download/transfer, WASM initialization, cold full-application startup and essential-flow measurements are available; the warm result is labeled separately and minimal overhead is not assumed.

sdk_distribution:
  - id: independent-library-development-release
    given: A Rust application needs encrypted OpenMates operations without a terminal, while a developer tests a new development release.
    when: It selects an explicit versioned prerelease of the reusable SDK crate from crates.io.
    then: It links the library independently of the CLI crate; npm and Python direct bindings remain covered by the same executable conformance, and no GitHub executable asset is required.

sdk_anonymous:
  - id: free-decision-and-chat
    given: A new developer uses either SDK without an API key while the existing anonymous allowance can cover the request.
    when: They inspect allowance status, call apps.ai.decide with a game state, and send a transient text chat.
    then: Both SDKs use the public anonymous routes with the same stable guest identity and return the supported results without requiring signup or a payment method.
  - id: account-boundary-and-explicit-free-mode
    given: An environment contains an API key but the developer explicitly selects anonymous mode.
    when: They call an eligible skill and then try to save a chat or access private account data.
    then: The skill uses the guest route without the environment key, while private account work is rejected; an explicitly supplied key conflicting with anonymous mode is also rejected, and authenticated errors never trigger guest fallback.
sdk_anonymous_failures:
  - id: allowance-refusal-is-actionable
    given: A guest has used their allowance or the shared server budget cannot cover a request.
    when: They call a skill or send a chat through either SDK.
    then: OpenMatesSignupRequiredError exposes the reason and a clear create-an-account message, without implying inference or skill processing failed.
  - id: processing-failure-stays-distinct
    given: The free allowance is available but a provider or the usage meter returns an unavailable error.
    when: Either SDK receives that response.
    then: It preserves the processing error as a distinct API failure and never presents it as an exhausted allowance or retries anonymously with a different identity.

sdk_auth:
  - id: stable-device-id-without-secret-material
    input:
      sdk_name: npm
      device_id_path: ~/.openmates/sdk-device-id
      api_keys_used: [first-key, second-key]
    expect:
      same_device_identity_reused: true
      device_id_file_contains_api_key: false
      device_id_file_mode: '0600'
  - id: approved-device-session
    assertion_ids: [sdk.auth.approved-api-key-device]
    given: An npm SDK credential has a current chats.read_existing scope and its stable device identity is approved.
    when: The SDK sends only its bearer component with SDK and device identity headers for a chat read.
    then: The backend permits that scoped operation and returns the permitted key wrapper without returning plaintext key material.
  - id: cli-owned-caller-uses-cli-sdk-identity
    request:
      headers:
        Authorization: Bearer sk-api-example
        X-OpenMates-SDK: cli
        X-OpenMates-Device-Identity: cli:linux:x64
    expect:
      allowed_for_cli_owned_api_key_callers: true
      npm_pip_required_surface_unchanged: true
  - id: pending-device-blocked
    assertion_ids: [sdk.auth.approved-api-key-device]
    given: A pip SDK credential belongs to a device whose approval is pending.
    when: The device requests an otherwise scoped paid operation.
    then: The backend rejects it before execution or charging credits, even if the bearer value itself is valid.
  - id: scope-and-budget-checked-before-work
    request:
      operation_scope: billing.usage_export
      granted_scopes: [billing.overview]
      credit_limit: {period: daily, remaining_credits: 0}
    expect_error:
      code: missing_scope_or_budget_exceeded
      operation_executed: false
      credits_charged: false
  - id: api-key-create-stores-only-derived-material
    assertion_ids: [sdk.auth.credential-separation]
    given: A user creates a full-access SDK credential named Local Script.
    when: The client creates and reveals its composite setup credential once.
    then: It sends only the bearer hash, encrypted display fields, and client-material-wrapped account key to the backend; the client-only decryption component and plaintext account key stay off the wire.
  - id: bearer-cannot-unwrap
    assertion_ids: [sdk.auth.credential-separation]
    given: A setup credential contains separately generated bearer authentication and client-only decryption components.
    when: Someone obtains only a bearer value from a request header or diagnostic.
    then: That value may identify the SDK request but cannot unwrap the account or resource key wrapper without the distinct client-only component.
  - id: legacy-key-migration
    assertion_ids: [sdk.auth.legacy-key-migration]
    given: An existing SDK key uses its bearer value to unwrap account-key material.
    when: The user migrates to separated SDK credentials.
    then: The old SDK key is revoked and a new separated credential is issued; cookie logout alone does not migrate it, and the account master key is not rotated automatically.

sdk_encryption:
  - id: session-wrapper-unwrapped-only-locally
    assertion_ids: [sdk.encryption.local-only]
    given: An SDK session receives a permitted encrypted key wrapper, salt, and IV.
    when: The SDK opens a private resource using its client-only decryption material.
    then: It unwraps the permitted key in local memory; the backend stores and returns neither the plaintext account key nor the raw resource key.
  - id: limited-grant-and-cached-revocation
    assertion_ids: [sdk.auth.limited-resource-keys]
    given: A limited SDK grant allows one project but its authorization is later revoked while a key wrapper remains cached.
    when: The SDK requests another server operation on that project after revocation.
    then: The backend rejects the new operation and never gave the grant the account master key; revocation does not erase the resource key or ciphertext the client already retained for offline decryption.
  - id: missing-wrapper-fails-before-saved-chat-send
    input:
      operation: chats.send
      save_to_account: true
      sdk_session: {key_wrapper: {}}
    expect_error:
      typed_config_error: true
      chat_send_request_started: false
  - id: loaded-chat-decrypts-from-ciphertext
    assertion_ids: [sdk.encryption.local-only]
    given: A saved chat has encrypted title, content, and chat-key wrappers in durable storage.
    when: An authorized SDK client loads and decrypts the chat.
    then: It may return transient plaintext fields locally while all persisted chat fields remain ciphertext and no raw chat key is written to backend storage.
  - id: wrapper-row-precedes-row-level-chat-key-fallback
    durable_state:
      encrypted_chat_key: stale-row-chat-key-ciphertext
      chat_key_wrappers:
        - {key_type: master, hashed_chat_id: hash-chat-1, encrypted_chat_key: wrapper-chat-key-ciphertext}
      encrypted_title_key: wrapper-chat-key
    expect:
      decrypted_with_wrapper_row: true
      stale_row_key_used: false
  - id: default-chat-send-is-not-persistent
    input:
      operation: chats.send
      options: {}
    expect:
      request_payload: {save_to_account: false}
      encrypted_account_chat_written: false
  - id: saved-chat-preflight-and-recovery-persist-are-encrypted
    input:
      operation: chats.send
      save_to_account: true
      title: Saved SDK chat
      assistant_recovery_content: saved reply
    expect:
      preflight_contains: [chat_id, turn_id, recovery_public_key, encrypted_chat_key]
      persist_contains: [encrypted_assistant_message, expected_messages_v]
      persist_forbidden: [saved reply, plaintext_private_key, raw_chat_key]
  - id: account-import-persists-encrypted-chat-batches
    input:
      source: claude
      plaintext_title: SDK import
      plaintext_message: SDK plaintext message
    expect:
      shared_import_endpoints_used: true
      persist_endpoint: /v1/account-imports/import-1/persist-encrypted
      persisted_payload_contains: [encrypted_title, encrypted_content, encrypted_chat_key]
      persisted_payload_forbidden: [SDK import, SDK plaintext message]
  - id: public-cleartext-input-builds-encrypted-payload
    input:
      namespace: plans
      method: create
      public_payload: {title: Launch plan, goal: Ship SDK parity}
    expect:
      public_signature_exposes_encrypted_storage_fields: false
      sdk_builds_ciphertext_payload: true
      server_receives_private_plaintext: false
  - id: connected-account-token-ref-transport-hides-access-token
    input:
      namespace: finance
      method: check_accounts
      connected_account_token_ref_inputs:
        - {connected_account_id: acct-1, provider_id: revolut_business, refresh_token_envelope: opaque-envelope}
    expect:
      endpoint: /v1/sdk/connected-account-skills/finance/check_accounts
      request_payload_forbidden: [access_token]
      prompt_injection_protection_opt_out_mapped: disabled

sdk_parity:
  - id: generated-app-skill-method-resolves-async-task
    given:
      npm_method: apps.code.imageToHtml
      pip_method: apps.code.image_to_html
      initial_response: {task_id: task-image-html, status: processing}
    expect:
      task_status_polled_until_completed: true
      result_wrapped_like_original_success_envelope: true
      generic_apps_run_exposed: false
  - id: mapped-cli-capability-has-npm-and-pip-methods
    given:
      cli_capability: openmates projects create
    expect:
      npm_method: projects.create
      pip_method: projects.create
      exclusion_reason: null
  - id: named-namespaces-use-concrete-sdk-endpoints
    given:
      calls: [account.info, chats.load, settings.setDarkMode, billing.listInvoices, docs.search, embeds.versions, notifications.list, reminders.list, learningMode.status]
    expect:
      uses_generic_passthrough: false
      endpoints_start_with: /v1/sdk/
      newsletter_namespace_exposed: false
      notification_streaming_exposed: false
  - id: previously-blocked-safe-surfaces-have-routes
    given:
      calls: [chats.followUps, chats.export, account.listInterests, memories.types, billing.usageOverview, billing.usageExport, embeds.show, feedback.assistantResponse, benchmark.estimate]
    expect:
      concrete_sdk_endpoints: true
      connected_account_import_rejects_invalid_prefix_locally: true
      debug_log_sharing_typed_unavailable: true
  - id: explicit-cli-only-exclusion
    given:
      cli_capability: openmates server restart
    expect:
      npm_method: null
      pip_method: null
      exclusion_reason: server-ops
      typed_unavailable_error: true
  - id: public-workflow-template-projection-is-unauthenticated-by-design
    given:
      pip_method: workflows.get_public_template_projection
      endpoint: /v1/workflows/template-projections/tpl-1
    expect:
      authorization_header_required: false
      encrypted_projection_returned: true
  - id: destructive-method-requires-explicit-confirmation
    input:
      namespace: projects
      method: delete
      confirmed: false
    expect_error:
      typed_config_error: true
      network_call_started: false
  - id: workflow-step-test-forwards-confirmed-flag
    input:
      namespace: workflows
      method: step_test
      confirmed: true
    expect:
      request_payload: {confirmed: true}
  - id: live-smoke-cleans-up-temporary-state
    input:
      sdks: [npm, pip]
      created_resources: [project]
      temporary_api_key: true
    expect:
      created_resources_removed_or_archived: true
      temporary_api_key_revoked: true
      api_key_or_ciphertext_printed: false
