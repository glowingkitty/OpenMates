schema_version: 1
id: surface.sdk
version: 1
status: draft
title: SDK Surface
summary: >
  The npm and pip SDKs are API-key programmatic OpenMates clients that preserve
  approved-device authorization, local client-side encryption, and semantic
  parity with each other and with safe CLI product/account capabilities.

scope:
  includes:
    - npm and pip public SDK facades, generated app-skill namespaces, and publish-gated packages.
    - API-key authentication with SDK name, stable device identity, device approval, scopes, expiration, and budget enforcement before work starts.
    - API-key creation material generated by the client with one-time plaintext reveal, hashed lookup, encrypted labels, encrypted key prefixes, and API-key-wrapped master keys.
    - API-key-wrapped master-key sessions and local encryption/decryption for encrypted chats, memories, embeds, projects, tasks, plans, workflows, API-key labels, and account imports.
    - Generated native app-skill methods, async task polling, prompt-injection opt-out metadata, and connected-account token-ref transport through SDK-only endpoints.
    - Chat send helpers that default to non-persistent mode, support focus-mode metadata, and preflight saved chats with local encrypted chat/recovery material before server submission.
    - Semantic parity between npm and pip SDK namespaces, method inputs, typed outputs, typed unavailable exclusions, explicit destructive confirmations, and public unauthenticated reads where intentionally exposed.
    - Live dev-server SDK smoke coverage that cleans up created resources and revokes temporary API keys.
  excludes:
    - Password, passkey, 2FA, recovery-key, active-session, browser checkout, or Apple login management through SDK API keys.
    - CLI terminal UI, self-hosted server operations, local remote-access filesystem bridges, local test-account artifact commands, and newsletter management.
    - SDK-owned startup sync queues, user-facing chat recovery takeover, or bypasses of feature-owned REST/WebSocket safety contracts.
    - Server-side plaintext storage of API keys, account master keys, chat keys, private chat content, encrypted memory content, or API-key display labels.
    - Generic app-skill passthrough namespaces that bypass generated app metadata, disabled skill visibility rules, or typed SDK method contracts.

models:
  SDKDeviceIdentity:
    sdk_name:
      type: enum
      values: [cli, npm, pip]
      required: true
      constraints: {cli_value_for_cli_owned_callers_only: true}
    device_identity:
      type: stable_device_id
      required: true
      constraints: {injectable: true, persisted_per_installation_path: true, contains_api_key_material: forbidden}
    device_id_file:
      type: local_file
      nullable: true
      constraints: {mode: '0600', parent_mode: '0700', plaintext_api_key: forbidden}

  SDKAuthRequest:
    authorization:
      type: bearer_api_key
      required: true
      constraints: {plaintext_persistence: forbidden, server_lookup: hash_only}
    sdk_name:
      type: enum
      values: [npm, pip]
      required: true
    device_identity:
      type: stable_device_id
      required: true
      constraints: {per_sdk_installation: true, approval_required: true}
    scopes:
      type: scope_set
      required: true
      constraints: {operation_checked_before_execution: true}
    credit_limit:
      type: optional_budget_cap
      nullable: true
      constraints: {checked_before_charge: true, one_period_only: true}

  SDKApiKeyCreateMaterial:
    plaintext_api_key:
      type: one_time_client_secret
      required: true
      constraints: {generated_with_csprng: true, returned_only_on_create: true, durable_storage: forbidden}
    api_key_hash:
      type: sha256_hex
      required: true
      constraints: {server_lookup_only: true}
    encrypted_name:
      type: encrypted_string
      required: true
      constraints: {encrypted_with_master_key: true, plaintext_label_server_storage: forbidden}
    encrypted_key_prefix:
      type: encrypted_string
      required: true
      constraints: {encrypted_with_master_key: true, plaintext_prefix_server_storage: forbidden}
    encrypted_master_key:
      type: api_key_wrapped_master_key
      required: true
      constraints: {unwraps_with_api_key_locally: true, backend_plaintext_master_key: forbidden}

  SDKSessionKeyWrapper:
    encrypted_key:
      type: api_key_wrapped_master_key
      required: true
      constraints: {unwraps_locally: true, backend_plaintext_master_key: forbidden}
    salt:
      type: base64_salt
      required: true
    key_iv:
      type: base64_iv
      required: true
    approval_state:
      type: enum
      values: [approved, pending, rejected]
      required: true

  SDKEncryptedOperation:
    private_resource_type:
      type: enum
      values: [chat, memory, embed, project, task, plan, workflow, api_key_label, account_import]
      required: true
    namespace:
      type: enum_or_string
      required: true
      constraints: {sdk_public_namespace: true}
    public_input_shape:
      type: cleartext_user_model
      required: true
      constraints: {encrypted_storage_fields_in_public_signature: forbidden}
    durable_payload:
      type: client_ciphertext
      required: true
      constraints: {plaintext_private_content: forbidden}
    local_plaintext_output:
      type: transient_in_memory_value
      nullable: true
      constraints: {durable_backend_storage: forbidden}
    key_source_precedence:
      type: enum
      values: [master_wrapper_row_before_row_fallback, resource_key_before_master_key, not_applicable]
      default: not_applicable

  SDKChatSend:
    save_to_account:
      type: boolean
      default: false
      constraints: {explicit_true_required_for_persistence: true}
    focus_mode:
      type: optional_object
      nullable: true
      constraints: {wire_keys: [app_id, focus_mode_id]}
    recovery_public_key:
      type: public_key
      nullable: true
      constraints: {required_for_saved_chat_preflight: true}
    encrypted_recovery_material:
      type: encrypted_object
      nullable: true
      constraints: {required_for_saved_chat_preflight: true, plaintext_private_key: forbidden}
    encrypted_persist_payload:
      type: client_ciphertext
      nullable: true
      constraints: {required_for_saved_recovery_persist: true, plaintext_assistant_content: forbidden}

  SDKAppSkillInvocation:
    generated_namespace:
      type: method_path
      required: true
      constraints: {generic_run_method_exposed: false, disabled_skills_hidden: true}
    endpoint:
      type: rest_path
      required: true
      constraints: {uses_app_and_skill_ids_from_metadata: true}
    async_task_id:
      type: stable_id
      nullable: true
      constraints: {poll_until_terminal_when_present: true}
    prompt_injection_protection:
      type: enum
      values: [enabled, disabled]
      default: enabled
    connected_account_token_refs:
      type: encrypted_or_ref_array
      default: []
      constraints: {access_tokens_in_payload: forbidden, sdk_only_endpoint: true}

  SDKParityMapping:
    cli_capability:
      type: string
      required: true
    npm_method:
      type: method_path
      nullable: true
    pip_method:
      type: method_path
      nullable: true
    exclusion_reason:
      type: enum_or_string
      nullable: true
      constraints: {required_when_methods_absent: true, high_risk_exclusions_explicit: true}
    destructive_confirmation:
      type: boolean
      default: false
      constraints: {required_for_destructive_methods: true}

  SDKLiveSmokeCleanup:
    temporary_api_key_id:
      type: stable_id
      nullable: true
      constraints: {revoked_in_finally: true}
    created_resource_ids:
      type: array
      default: []
      items: stable_id
      constraints: {removed_or_archived_in_finally: true}
    leaked_secret_output:
      type: boolean
      default: false
      constraints: {must_remain_false: true}

assertions:
  - id: sdk.auth.approved-api-key-device
    type: security
    must: npm and pip SDK operations authenticate with Bearer API keys, SDK identity, and stable device identity; the backend must reject missing, malformed, expired, revoked, over-budget, under-scoped, or unapproved-device requests before executing the operation or charging credits, and SDK API-key creation must store only hashes, ciphertext labels, ciphertext prefixes, and wrapped key material.
    depends_on: [models.SDKDeviceIdentity, models.SDKAuthRequest, models.SDKApiKeyCreateMaterial, models.SDKSessionKeyWrapper.approval_state, examples.sdk_auth]
  - id: sdk.encryption.local-only
    type: privacy
    must: SDKs may decrypt API-key-wrapped master-key material, chat keys, embed keys, project/task/plan keys, and private resource content only locally in memory, while durable server state and SDK-created persisted payloads remain ciphertext/wrapped-key material, wrapper rows take precedence over stale row-level chat-key fallback, saved-chat recovery persistence is client-encrypted, and public SDK signatures do not require callers to construct encrypted storage fields.
    depends_on: [models.SDKSessionKeyWrapper, models.SDKEncryptedOperation, models.SDKChatSend, examples.sdk_encryption]
  - id: sdk.surface.semantic-parity
    type: parity
    must: npm and pip SDKs preserve the same public namespaces, method semantics, typed outputs, generated app-skill behavior, async task resolution, cleartext input contracts, concrete SDK endpoints, typed unavailable exclusions, explicit destructive confirmations, and cleanup behavior for every SDK-accessible safe CLI product/account capability.
    depends_on: [models.SDKAppSkillInvocation, models.SDKParityMapping, models.SDKLiveSmokeCleanup, examples.sdk_parity, applies_to]

applies_to:
  rest_api:
    required: true
    role: API-key authorized /v1 and /v1/sdk routes own scope, budget, expiration, device approval, and ciphertext/wrapper transport enforcement.
  cli:
    required: true
    parity: semantic
    role: The CLI command registry and API-key management commands are the source for SDK-accessible capability parity and explicit exclusions.
  sdks:
    required: true
    parity: semantic
    implementations:
      npm: {required: true}
      pip: {required: true}
  gui:
    required: false
    role: Web and Apple developer settings may manage API keys and device approval, but this surface contract verifies SDK client behavior.
    implementations:
      web: {required: false}
      apple: {required: false}
    exceptions: []

examples:
  file: examples.yml
  required_groups: [sdk_auth, sdk_encryption, sdk_parity]
