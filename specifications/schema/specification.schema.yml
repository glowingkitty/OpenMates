$schema: https://json-schema.org/draft/2020-12/schema
title: OpenMates specification
type: object
required: [schema_version, id, version, status, title, summary, scope, assertions, applies_to, examples]
properties:
  schema_version: {const: 1}
  id: {type: string, pattern: "^[a-z][a-z0-9]*(?:[.-][a-z0-9][a-z0-9-]*)+$"}
  version: {type: integer, minimum: 1}
  status: {enum: [draft, approved, superseded]}
  title: {type: string, minLength: 1}
  summary: {type: string, minLength: 1}
  scope:
    type: object
    required: [includes, excludes]
  models:
    type: object
    description: Optional domain models with extensible model kinds.
  assertions:
    type: array
    minItems: 1
  applies_to:
    type: object
    description: Optional applicability dimensions. Canonical machine channels include rest_api, cli, sdks, and gui.
    properties:
      channels: {type: array, items: {type: string}}
      audiences: {type: array, items: {type: string}}
      locations: {type: array, items: {type: string}}
      systems: {type: array, items: {type: string}}
      devices: {type: array, items: {type: string}}
      markets: {type: array, items: {type: string}}
      teams: {type: array, items: {type: string}}
      artifacts: {type: array, items: {type: string}}
    additionalProperties: true
  examples:
    type: object
    required: [file, required_groups]
