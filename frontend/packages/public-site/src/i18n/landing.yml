    heroLine2: mit Privatsphäre
    inSeconds: In Sekunden
    scroll: Scrolle nach unten und erfahre mehr
    tryFree: Kostenlos testen
    tryNow: Jetzt ausprobieren
    actionableTitle1: Chats, die etwas bewegen.
    actionableTitle2: Nicht nur eine Wand aus Text.
    actionableBody: OpenMates findet in Sekunden Arzttermine für dich. Ebenso Veranstaltungen, Wohnungen, Reiseverbindungen
      und vieles mehr. Anders als andere KI-Chatbots durchsucht es nicht einfach nur das Web, sondern interagiert direkt mit
      externen Plattformen. So findet es Informationen, die dir keine Websuche liefern kann. Mit Workflows kannst du sogar
      regelmäßige Suchen automatisieren und hast mehr Zeit für die schönen Dinge im Leben.
    exploreApps: Apps in OpenMates entdecken
    openExample: Beispielchat öffnen
    privacyTitle1: Privatsphäre & Sicherheit
    privacyTitle2: von Anfang an
    privacyBody: Die nützlichste KI? Privatsphäre? Sicherheit? Souveränität? Mit OpenMates kannst du alles haben. Mit Funktionen
      wie der automatischen Anonymisierung sensibler Daten, verschlüsselten Chats, sparsamer Datenverarbeitung, mehreren Schutzebenen
      für KI und ohne KI-Modelltraining mit deinen Daten. Unterstützt von führenden KI-Modellen von Mistral, Anthropic, OpenAI,
      Google, Deepseek & weiteren Anbietern - ohne Bindung an ein Ökosystem.
    privacyLink: Mehr über Privatsphäre & Verschlüsselung
    safetyLink: Mehr über KI-Sicherheit
    modelChoiceTitle1: Ohne Bindung an ein
    modelChoiceTitle2: Ökosystem
    modelChoiceBody: Jedes KI-Modell hat seine Stärken und Vorteile. Ein Spitzenmodell eignet sich hervorragend für komplexe
      Aufgaben, ist für einfache Fragen aber überdimensioniert. OpenMates wählt je nach Anfrage automatisch das passende Modell.
      Du kannst diese Auswahl jedoch jederzeit überschreiben und ein Modell nutzen, das du bereits kennst. Von Modellen des
      datenschutzorientierten Anbieters Mistral bis hin zu Spitzenmodellen von Anthropic, OpenAI, Google, Deepseek & weiteren
      Anbietern.
    workflowTitle1: Automatisierte Workflows
    workflowTitle2: für alle
    workflowBody: Was wäre, wenn du nicht selbst nach Wohnungen suchen müsstest, sondern deine KI-Teamkollegen jede Stunde
      für dich suchen und dich informieren, sobald sie passende Angebote finden? Oder wenn du nicht jeden Monat Stunden damit
      verbringen müsstest, die interessantesten kommenden Veranstaltungen herauszusuchen? Und wenn du diese und andere Workflows
      ganz einfach in wenigen Sekunden einrichten könntest? Überzeuge dich selbst mit der Workflow-Funktion in OpenMates.
    exploreWorkflows: Workflows in OpenMates entdecken
    devicesTitle1: Ein einheitliches Erlebnis
    devicesTitle2: auf deinen Geräten
    devicesBody: Anders als andere Software für KI-Agenten legt OpenMates besonderen Wert auf ein einheitliches Design auf
      all deinen Geräten. So kannst du auf der Plattform deiner Wahl auf all deine Chats, App-Funktionen, Workflows und mehr
      zugreifen. Von der Web-App über native Apps für Mac, iPad, iPhone und Apple Watch bis hin zum Terminal und direkt aus
      deinem Code. Native Apps für Android-Geräte & weitere Plattformen folgen.
    startWebApp: Web-App starten
    testflight: Für App-Tests über Apple TestFlight anmelden
    developers: Mehr über OpenMates für Entwickler
    sourceTitle1: Open Source &
    sourceTitle2: beständig statt schlechter
    sourceBody: Wir sind so daran gewöhnt, dass Technikprodukte mit der Zeit aus Gier immer schlechter werden. Doch verschiedene
      Unternehmen haben gezeigt, dass es auch andere Wege gibt. OpenMates folgt ihrem Beispiel und stellt die Interessen seiner
      Nutzer von Anfang an an erste Stelle. Zum Beispiel durch offenen Quellcode - damit jeder prüfen kann, ob dieses Versprechen
      heute gilt und auch in Zukunft eingehalten wird. Und wer die volle Kontrolle über seine KI-Agenten bevorzugt, kann OpenMates
      sogar auf einem eigenen Server betreiben.
    ethics: Mehr über die ethischen Grundsätze von OpenMates
    selfHosting: Mehr über Self-Hosting
    eventsTitle: Kommende OpenMates-Veranstaltungen
    eventsBody: Lerne, wie du mit OpenMates mehr erledigst, und gestalte die Weiterentwicklung mit deinen Wünschen und Rückmeldungen
      mit.
    eventsEmpty: Derzeit sind keine Veranstaltungen angekündigt.
