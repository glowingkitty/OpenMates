    actionableTitle1: Actionable chats.
    actionableTitle2: Not just a wall of text.
    actionableBody: OpenMates finds you doctor appointments in seconds. As well as events, apartments, travel connections
      and much more. Unlike other AI chatbots, it doesn’t just rely on searching the web - but instead interacts directly
      with external platforms. To find the infos no web search can give you. And with the workflows feature you can even automate
      regular searches, freeing up your time for the more enjoyable things in life.
    exploreApps: Explore apps in OpenMates
    openExample: Open example chat
    privacyTitle1: Privacy & safety
    privacyTitle2: by design
    privacyBody: 'The most useful AI? Privacy? Safety? Sovereignty? You can have them all: using OpenMates. With features
      like automatic sensitive data anonymization, encrypted chats, minimal data processing, multiple layers of AI safety
      and no AI model training on your data. Powered by the leading AI models from Mistral, Anthropic, OpenAI, Google, Deepseek
      & more - without ecosystem lock in.'
    privacyLink: Learn more about privacy & encryption
    safetyLink: Learn more about AI safety
    modelChoiceTitle1: No ecosystem
    modelChoiceTitle2: lock-in
    modelChoiceBody: Each AI model has their strengths and advantages. A frontier model is great for complex tasks, but overkill
      for simple questions. OpenMates automatically selects the right model based on the request. But you can always overwrite
      that behavior and use whatever model you already know. From models by the privacy focused Mistral, to frontier models
      by Anthropic, OpenAI, Google, Deepseek & more.
    workflowTitle1: Workflow automation
    workflowTitle2: for everyone
    workflowBody: What if you wouldn’t have to search for apartments, but your AI team mates would search for them every hour
      & tell you when they find good fits? Or what if you wouldn’t have to spend hours every month to check out the most interesting
      upcoming events? And what, if setting up these and other workflows would be simple and only take seconds? See for yourself,
      with the workflows feature in OpenMates.
    exploreWorkflows: Explore workflows in OpenMates
    devicesTitle1: A consistent experience,
    devicesTitle2: across your devices
    devicesBody: Unlike any other AI agents software, OpenMates prioritizes a coherent design across your devices. This means
      you can access all your chats, app skills, workflows and more - on the platform of your choice. From the web app to
      the native apps for Mac, iPad, iPhone and Apple Watch - and even from your terminal and from inside your code. With
      native apps for Android devices & other platforms following.
    startWebApp: Start using the web app
    testflight: Sign up for testing the apps via Apple TestFlight
    developers: Learn more about OpenMates for developers
    sourceTitle1: Open source &
    sourceTitle2: enshittification resilient
    sourceBody: We are so used to tech products getting worse over time because of greed. But various companies have proven
      that there are other paths. OpenMates is following their footsteps & puts user interests first by design. For example
      by being open source - to ensure everyone can validate that this commitment is true now and remains so. And for those
      preferring maximum control over their AI agents - you can even run OpenMates on your own server.
    ethics: Learn more about OpenMates ethical stands
    selfHosting: Learn more about Self-Hosting
