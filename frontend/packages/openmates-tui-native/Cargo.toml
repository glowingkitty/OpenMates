[package]
name = "openmates-tui-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Native OpenMates command-line and terminal application"
license = "AGPL-3.0-only"
repository = "https://github.com/glowingkitty/OpenMates"
readme = "README.md"
autobins = false
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "src/**", "assets/**", "tests/**/*.rs", "tests/**/*.json", "examples/**/*.rs"]
publish = false

[[bin]]
name = "openmates"
path = "src/main.rs"

[[example]]
name = "tui-benchmark"
path = "src/bin/tui-benchmark.rs"

[dependencies]
openmates-sdk = { version = "=0.1.0", path = "../../../packages/openmates-rust", features = ["workflow-yaml"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util", "net", "process"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_box = { version = "0.9", features = ["std"] }
opaque-ke = { version = "=4.0.0", features = ["argon2"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
pulldown-cmark = "0.13"
unicode-width = "0.2"
unicode-segmentation = "1"
directories = "6"
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process", "termios"] }
generic-array = "0.14"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive", "string"] }
qrcode = { version = "0.14", default-features = false }
regex = "1"
arboard = { version = "3", default-features = false }
webbrowser = "1"
tar = "0.4"
flate2 = "1"
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

# Functional CI unit coverage only; never used for release or performance proof.
[profile.ci-unit]
inherits = "release"
lto = false
opt-level = 1
