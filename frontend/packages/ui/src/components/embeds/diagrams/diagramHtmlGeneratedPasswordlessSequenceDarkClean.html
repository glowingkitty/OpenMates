<!DOCTYPE html>
<html lang="en" data-om-render-width="1024" data-om-render-height="960" data-om-background="#2d3142">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwordless Login Sequence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* warm dark charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-soft:    #949eb2;   /* slate blue */
      --color-accent:  #f08a59;   /* burnt tangerine focal */
      --color-link:    #739fdf;   /* api blue */
      --font-sans:     'Lexend', system-ui, sans-serif;
      --font-mono:     ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame {
      max-width: 1024px;
      width: 100%;
      margin: 0 auto;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.4rem, 2vw + 0.6rem, 1.85rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      background: var(--color-paper);
    }

    svg {
      width: 100%;
      min-width: 980px;
      display: block;
    }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Authentication Flow</p>
    <h1>Passwordless Login with One-Time Code &amp; Expiry Retry</h1>

    <div class="diagram-container">
      <svg data-om-diagram="sequence" viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pwdless-seq-title pwdless-seq-desc">
        <title id="pwdless-seq-title">Passwordless Login Sequence with Expiry Retry</title>
        <desc id="pwdless-seq-desc">Sequence diagram showing a user requesting a passwordless code via the client application, the API generating and delivering it through an email service, code verification, and an alternate branch handling expired code resend.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- ===================================================================
             LIFELINES
             =================================================================== -->
        <!-- User Lifeline (CX=140) -->
        <line data-om-owner="user" x1="140" y1="84" x2="140" y2="640"
              stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- App Lifeline (CX=380) -->
        <line data-om-owner="app" x1="380" y1="84" x2="380" y2="640"
              stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- API Lifeline (CX=620) -->
        <line data-om-owner="api" x1="620" y1="84" x2="620" y2="640"
              stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Email Lifeline (CX=860) -->
        <line data-om-owner="email" x1="860" y1="84" x2="860" y2="640"
              stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ===================================================================
             ACTIVATION BARS
             =================================================================== -->
        <!-- App: initial request & verification -->
        <rect data-om-owner="app" x="376" y="112" width="8" height="84" rx="2"
              fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- API: initial dispatch -->
        <rect data-om-owner="api" x="616" y="148" width="8" height="48" rx="2"
              fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- Email: dispatching -->
        <rect data-om-owner="email" x="856" y="184" width="8" height="48" rx="2"
              fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- App: verification handling -->
        <rect data-om-owner="app" x="376" y="256" width="8" height="344" rx="2"
              fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- API: verification handling & retry -->
        <rect data-om-owner="api" x="616" y="292" width="8" height="308" rx="2"
              fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- ===================================================================
             COMBINED FRAGMENT: ALT (Valid vs Expired)
             =================================================================== -->
        <!-- Outer Box: spans lifelines user(140) to api(620) -->
        <rect x="92" y="328" width="576" height="280" rx="4"
              fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <!-- Tab -->
        <rect x="92" y="328" width="44" height="18" rx="2"
              fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="114" y="341" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.12em" font-weight="600">ALT</text>

        <!-- Guard 1: Valid Code -->
        <text x="146" y="342" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace"
              letter-spacing="0.04em">[code valid &amp; active]</text>

        <!-- Divider Line -->
        <line x1="96" y1="440" x2="664" y2="440"
              stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Guard 2: Code Expired -->
        <text x="106" y="456" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace"
              letter-spacing="0.04em">[code expired]</text>

        <!-- ===================================================================
             MESSAGES (TOP TO BOTTOM)
             =================================================================== -->

        <!-- 1. User -> App: Submit email -->
        <g data-om-edge="msg-1" data-om-from="user" data-om-to="app" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 140 116 L 376 116" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="200" y="98" width="116" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-1-label" data-om-editable="text" x="258" y="107" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENTER EMAIL</text>
        </g>

        <!-- 2. App -> API: POST /auth/otp -->
        <g data-om-edge="msg-2" data-om-from="app" data-om-to="api" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 384 152 L 616 152" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="424" y="134" width="152" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-2-label" data-om-editable="text" x="500" y="143" fill="#739fdf" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/MAGIC-CODE</text>
        </g>

        <!-- 3. API -> Email: Dispatch code email -->
        <g data-om-edge="msg-3" data-om-from="api" data-om-to="email" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 624 188 L 856 188" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="674" y="170" width="132" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-3-label" data-om-editable="text" x="740" y="179" fill="#739fdf" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEND OTP (TTL 10M)</text>
        </g>

        <!-- 4. Email -> User: Deliver 6-digit code -->
        <g data-om-edge="msg-4" data-om-from="email" data-om-to="user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 856 224 L 144 224" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="430" y="206" width="140" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-4-label" data-om-editable="text" x="500" y="215" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER 6-DIGIT OTP</text>
        </g>

        <!-- 5. User -> App: Input OTP -->
        <g data-om-edge="msg-5" data-om-from="user" data-om-to="app" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 140 260 L 376 260" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="204" y="242" width="108" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-5-label" data-om-editable="text" x="258" y="251" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT OTP CODE</text>
        </g>

        <!-- 6. App -> API: Verify OTP -->
        <g data-om-edge="msg-6" data-om-from="app" data-om-to="api" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 384 296 L 616 296" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="440" y="278" width="120" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-6-label" data-om-editable="text" x="500" y="287" fill="#739fdf" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/VERIFY</text>
        </g>

        <!-- ================= REGION 1: SUCCESS (CORAL FOCAL) ================= -->

        <!-- 7. API -> App: Return session token (Headline focal return) -->
        <g data-om-edge="msg-7" data-om-from="api" data-om-to="app" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 616 368 L 384 368" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
          <rect data-om-label-mask x="424" y="350" width="152" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-7-label" data-om-editable="text" x="500" y="359" fill="#f08a59" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 OK (SESSION JWT)</text>
        </g>

        <!-- 8. App -> User: Render authenticated dashboard -->
        <g data-om-edge="msg-8" data-om-from="app" data-om-to="user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 376 404 L 144 404" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="194" y="386" width="128" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-8-label" data-om-editable="text" x="258" y="395" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SESSION ESTABLISHED</text>
        </g>

        <!-- ================= REGION 2: EXPIRED CODE & RETRY ================= -->

        <!-- 9. API -> App: 401 Expired -->
        <g data-om-edge="msg-9" data-om-from="api" data-om-to="app" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 616 476 L 384 476" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="424" y="458" width="152" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-9-label" data-om-editable="text" x="500" y="467" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">401 OTP_EXPIRED</text>
        </g>

        <!-- 10. App -> User: Show expired prompt -->
        <g data-om-edge="msg-10" data-om-from="app" data-om-to="user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 376 512 L 144 512" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="190" y="494" width="136" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-10-label" data-om-editable="text" x="258" y="503" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT: CODE EXPIRED</text>
        </g>

        <!-- 11. User -> App: Click Resend Code -->
        <g data-om-edge="msg-11" data-om-from="user" data-om-to="app" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 140 548 L 376 548" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="198" y="530" width="120" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-11-label" data-om-editable="text" x="258" y="539" fill="#bfc0c0" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLICK "RESEND CODE"</text>
        </g>

        <!-- 12. App -> API: POST /auth/resend -->
        <g data-om-edge="msg-12" data-om-from="app" data-om-to="api" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 384 584 L 616 584" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="430" y="566" width="140" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-12-label" data-om-editable="text" x="500" y="575" fill="#739fdf" font-size="8"
                font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/RESEND-OTP</text>
        </g>

        <!-- ===================================================================
             ACTOR BOXES (Z-ORDER: DRAWN ON TOP OF CONNECTORS)
             =================================================================== -->

        <!-- 1. USER -->
        <g data-om-component="user" data-om-editable="true">
          <rect x="80" y="28" width="120" height="52" rx="6" fill="#2d3142"/>
          <rect x="80" y="28" width="120" height="52" rx="6" fill="#ffffff" stroke="#f5f5f5" stroke-width="1"/>
          <rect x="88" y="34" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="104" y="43" fill="#2d3142" font-size="7" font-family="ui-monospace, monospace"
                text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
          <text data-om-text="user-title" data-om-editable="text" x="140" y="56" fill="#2d3142"
                font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">User</text>
          <text data-om-text="user-sub" data-om-editable="text" x="140" y="70" fill="#4f5d75"
                font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">browser / client</text>
        </g>

        <!-- 2. APP (CLIENT) -->
        <g data-om-component="app" data-om-editable="true">
          <rect x="320" y="28" width="120" height="52" rx="6" fill="#2d3142"/>
          <rect x="320" y="28" width="120" height="52" rx="6" fill="#ffffff" stroke="#f5f5f5" stroke-width="1"/>
          <rect x="328" y="34" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="343" y="43" fill="#2d3142" font-size="7" font-family="ui-monospace, monospace"
                text-anchor="middle" letter-spacing="0.08em">APP</text>
          <text data-om-text="app-title" data-om-editable="text" x="380" y="56" fill="#2d3142"
                font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">Client App</text>
          <text data-om-text="app-sub" data-om-editable="text" x="380" y="70" fill="#4f5d75"
                font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">spa :443</text>
        </g>

        <!-- 3. API -->
        <g data-om-component="api" data-om-editable="true">
          <rect x="560" y="28" width="120" height="52" rx="6" fill="#2d3142"/>
          <rect x="560" y="28" width="120" height="52" rx="6" fill="#ffffff" stroke="#f5f5f5" stroke-width="1"/>
          <rect x="568" y="34" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="582" y="43" fill="#2d3142" font-size="7" font-family="ui-monospace, monospace"
                text-anchor="middle" letter-spacing="0.08em">API</text>
          <text data-om-text="api-title" data-om-editable="text" x="620" y="56" fill="#2d3142"
                font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">Auth API</text>
          <text data-om-text="api-sub" data-om-editable="text" x="620" y="70" fill="#4f5d75"
                font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">rest :8443</text>
        </g>

        <!-- 4. EMAIL SERVICE -->
        <g data-om-component="email" data-om-editable="true">
          <rect x="800" y="28" width="120" height="52" rx="6" fill="#2d3142"/>
          <rect x="800" y="28" width="120" height="52" rx="6" fill="#ffffff" stroke="#f5f5f5" stroke-width="1"/>
          <rect x="808" y="34" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="825" y="43" fill="#2d3142" font-size="7" font-family="ui-monospace, monospace"
                text-anchor="middle" letter-spacing="0.08em">SMTP</text>
          <text data-om-text="email-title" data-om-editable="text" x="860" y="56" fill="#2d3142"
                font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">Email Provider</text>
          <text data-om-text="email-sub" data-om-editable="text" x="860" y="70" fill="#4f5d75"
                font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">external :587</text>
        </g>

        <!-- ===================================================================
             LEGEND (BOTTOM HORIZONTAL STRIP)
             =================================================================== -->
        <line x1="40" y1="672" x2="940" y2="672" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="40" y="694" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace"
              letter-spacing="0.14em">LEGEND</text>

        <!-- Item 1: Internal/UI message -->
        <line x1="120" y1="691" x2="148" y2="691" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="156" y="694" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace">Client / UI Action</text>

        <!-- Item 2: API Request -->
        <line x1="290" y1="691" x2="318" y2="691" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
        <text x="326" y="694" fill="#739fdf" font-size="8" font-family="ui-monospace, monospace">API / Network Call</text>

        <!-- Item 3: Return Message -->
        <line x1="470" y1="691" x2="498" y2="691" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="506" y="694" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace">Return / Async Delivery</text>

        <!-- Item 4: Focal Session Issued -->
        <line x1="680" y1="691" x2="708" y2="691" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <text x="716" y="694" fill="#f08a59" font-size="8" font-family="ui-monospace, monospace">Authenticated Token (Focal)</text>

      </svg>
    </div>
  </div>
</body>
</html>
