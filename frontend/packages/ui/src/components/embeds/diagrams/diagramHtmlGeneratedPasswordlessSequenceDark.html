<!DOCTYPE html>
<html lang="en" data-om-render-width="1024" data-om-render-height="840" data-om-background="#2d3142">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwordless Login Flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-paper-2: #393e53;
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;   /* silver */
      --color-soft:    #949eb2;   /* slate */
      --color-accent:  #f08a59;   /* burnt-tangerine accent */
      --color-link:    #739fdf;   /* API blue */
      --color-rule:    rgba(245,245,245,0.12);
      --font-sans:     'Lexend', system-ui, sans-serif;
      --font-mono:     ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1024px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.4rem, 2.2vw + 0.6rem, 1.9rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Authentication Architecture · Sequence</p>
    <h1>Passwordless Login with OTP Verification &amp; Expiry Retry</h1>

    <div class="diagram-container">
      <svg data-om-diagram="sequence" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-pwdless-title seq-pwdless-desc">
        <title id="seq-pwdless-title">Passwordless Login Sequence Diagram</title>
        <desc id="seq-pwdless-desc">Sequence diagram showing a passwordless authentication exchange among user, client app, auth API, and email service, detailing one-time code delivery, expiry handling, and successful session issuance.</desc>
        
        <defs>
          <!-- Arrow Markers -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- =================== 1. LIFELINES =================== -->
        <!-- User Lifeline (CX=120) -->
        <line x1="120" y1="108" x2="120" y2="540" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- App Lifeline (CX=360) -->
        <line x1="360" y1="108" x2="360" y2="540" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- API Lifeline (CX=600) -->
        <line x1="600" y1="108" x2="600" y2="540" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Email Lifeline (CX=840) -->
        <line x1="840" y1="108" x2="840" y2="540" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================== 2. ACTIVATION BARS =================== -->
        <!-- App Initial Req Activation -->
        <rect x="356" y="136" width="8" height="44" rx="2" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- API Dispatch Activation -->
        <rect x="596" y="168" width="8" height="44" rx="2" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- Email Delivery Activation -->
        <rect x="836" y="200" width="8" height="44" rx="2" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- App Code Verify Activation -->
        <rect x="356" y="264" width="8" height="236" rx="2" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <!-- API Validation Activation -->
        <rect x="596" y="296" width="8" height="180" rx="2" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- =================== 3. COMBINED FRAGMENT (ALT) =================== -->
        <!-- ALT Boundary Frame spanning User, App, API (X: 60 to 660, Y: 326 to 516) -->
        <g id="fragment-alt">
          <rect x="60" y="326" width="600" height="190" rx="4" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
          <!-- Tab -->
          <rect x="60" y="326" width="44" height="18" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
          <text x="82" y="339" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

          <!-- Branch 1 Guard: Expired Token -->
          <text x="114" y="340" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.04em">[code expired · prompt retry]</text>

          <!-- Branch Separator Divider -->
          <line x1="68" y1="422" x2="652" y2="422" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

          <!-- Branch 2 Guard: Valid Token -->
          <text x="74" y="438" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.04em">[code valid / retried successfully]</text>
        </g>

        <!-- =================== 4. MESSAGE CONNECTORS =================== -->
        <!-- 1. User -> App: Enter email -->
        <g data-om-edge="msg-1" data-om-from="actor-user" data-om-to="actor-app" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 120 144 H 354" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="202" y="128" width="76" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-1-label" data-om-editable="text" x="240" y="137" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENTER EMAIL</text>
        </g>

        <!-- 2. App -> API: POST /auth/otp -->
        <g data-om-edge="msg-2" data-om-from="actor-app" data-om-to="actor-api" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 364 176 H 594" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="424" y="160" width="108" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-2-label" data-om-editable="text" x="478" y="169" fill="#739fdf" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/OTP</text>
        </g>

        <!-- 3. API -> Email Service: Queue code dispatch -->
        <g data-om-edge="msg-3" data-om-from="actor-api" data-om-to="actor-email" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 604 208 H 834" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
          <rect data-om-label-mask x="662" y="192" width="112" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-3-label" data-om-editable="text" x="718" y="201" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH OTP</text>
        </g>

        <!-- 4. Email Service -> User: Deliver 6-digit code -->
        <g data-om-edge="msg-4" data-om-from="actor-email" data-om-to="actor-user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 840 240 H 126" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="410" y="224" width="140" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-4-label" data-om-editable="text" x="480" y="233" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER 6-DIGIT CODE</text>
        </g>

        <!-- 5. User -> App: Submit code input -->
        <g data-om-edge="msg-5" data-om-from="actor-user" data-om-to="actor-app" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 120 272 H 354" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="202" y="256" width="76" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-5-label" data-om-editable="text" x="240" y="265" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT CODE</text>
        </g>

        <!-- 6. App -> API: POST /auth/verify -->
        <g data-om-edge="msg-6" data-om-from="actor-app" data-om-to="actor-api" data-om-from-side="right" data-om-to-side="left">
          <path data-om-path d="M 364 304 H 594" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <rect data-om-label-mask x="420" y="288" width="116" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-6-label" data-om-editable="text" x="478" y="297" fill="#739fdf" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /VERIFY</text>
        </g>

        <!-- [ALT REGION 1] 7. API -> App: 401 Code Expired -->
        <g data-om-edge="msg-7" data-om-from="actor-api" data-om-to="actor-app" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 596 368 H 366" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="414" y="352" width="128" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-7-label" data-om-editable="text" x="478" y="361" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">401 CODE EXPIRED</text>
        </g>

        <!-- [ALT REGION 1] 8. App -> User: Show expired error & prompt retry -->
        <g data-om-edge="msg-8" data-om-from="actor-app" data-om-to="actor-user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 356 398 H 126" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="180" y="382" width="124" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-8-label" data-om-editable="text" x="242" y="391" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT RESEND</text>
        </g>

        <!-- [ALT REGION 2] 9. API -> App: 200 Session Token (Accent Focal) -->
        <g data-om-edge="msg-9" data-om-from="actor-api" data-om-to="actor-app" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 596 462 H 366" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <rect data-om-label-mask x="410" y="446" width="136" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-9-label" data-om-editable="text" x="478" y="455" fill="#f08a59" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 SESSION JWT</text>
        </g>

        <!-- [ALT REGION 2] 10. App -> User: Active session established -->
        <g data-om-edge="msg-10" data-om-from="actor-app" data-om-to="actor-user" data-om-from-side="left" data-om-to-side="right">
          <path data-om-path d="M 356 492 H 126" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="178" y="476" width="128" height="12" rx="2" fill="#2d3142"/>
          <text data-om-text="msg-10-label" data-om-editable="text" x="242" y="485" fill="#bfc0c0" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SESSION ACTIVE</text>
        </g>

        <!-- =================== 5. ACTOR BOXES =================== -->
        <!-- Actor 1: User -->
        <g data-om-component="actor-user" data-om-editable="true">
          <rect x="50" y="60" width="140" height="48" rx="6" fill="#2d3142"/>
          <rect x="50" y="60" width="140" height="48" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="58" y="66" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
          <text x="76" y="75" fill="#949eb2" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
          <text data-om-text="actor-user-name" data-om-editable="text" x="120" y="94" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">User Client</text>
        </g>

        <!-- Actor 2: Web / Mobile App -->
        <g data-om-component="actor-app" data-om-editable="true">
          <rect x="290" y="60" width="140" height="48" rx="6" fill="#2d3142"/>
          <rect x="290" y="60" width="140" height="48" rx="6" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="298" y="66" width="34" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
          <text x="315" y="75" fill="#949eb2" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
          <text data-om-text="actor-app-name" data-om-editable="text" x="360" y="94" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">SPA / Mobile App</text>
        </g>

        <!-- Actor 3: Auth API Server -->
        <g data-om-component="actor-api" data-om-editable="true">
          <rect x="530" y="60" width="140" height="48" rx="6" fill="#2d3142"/>
          <rect x="530" y="60" width="140" height="48" rx="6" fill="rgba(115,159,223,0.06)" stroke="#739fdf" stroke-width="1"/>
          <rect x="538" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(115,159,223,0.50)" stroke-width="0.8"/>
          <text x="552" y="75" fill="#739fdf" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
          <text data-om-text="actor-api-name" data-om-editable="text" x="600" y="94" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">Auth API Gateway</text>
        </g>

        <!-- Actor 4: Email Delivery Service -->
        <g data-om-component="actor-email" data-om-editable="true">
          <rect x="770" y="60" width="140" height="48" rx="6" fill="#2d3142"/>
          <rect x="770" y="60" width="140" height="48" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
          <rect x="778" y="66" width="34" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
          <text x="795" y="75" fill="#949eb2" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EMAIL</text>
          <text data-om-text="actor-email-name" data-om-editable="text" x="840" y="94" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">Email Provider</text>
        </g>

        <!-- =================== 6. LEGEND STRIP =================== -->
        <g id="legend">
          <line x1="40" y1="562" x2="920" y2="562" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
          <text x="40" y="586" fill="#949eb2" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

          <!-- Sync Request -->
          <line x1="120" y1="583" x2="152" y2="583" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
          <text x="162" y="586" fill="#bfc0c0" font-size="9" font-family="ui-monospace, monospace">Sync Call</text>

          <!-- HTTP/API Call -->
          <line x1="250" y1="583" x2="282" y2="583" stroke="#739fdf" stroke-width="1" marker-end="url(#arrow-link)"/>
          <text x="292" y="586" fill="#bfc0c0" font-size="9" font-family="ui-monospace, monospace">REST / API</text>

          <!-- Return / Async -->
          <line x1="390" y1="583" x2="422" y2="583" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="432" y="586" fill="#bfc0c0" font-size="9" font-family="ui-monospace, monospace">Return / Async</text>

          <!-- Focal Headline Success -->
          <line x1="560" y1="583" x2="592" y2="583" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="602" y="586" fill="#f08a59" font-size="9" font-family="ui-monospace, monospace">Session Granted (Focal)</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
