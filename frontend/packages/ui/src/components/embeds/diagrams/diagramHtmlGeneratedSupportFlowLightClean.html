<!DOCTYPE html>
<html lang="en" data-om-render-width="1024" data-om-render-height="840" data-om-background="#f5f5f5">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Request Triage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Lexend', system-ui, sans-serif;
      --font-mono:     ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1024px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Customer Support Request Triage</h1>

    <div class="diagram-container">
      <svg data-om-diagram="flowchart" viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="support-flow-title support-flow-desc">
        <title id="support-flow-title">Customer Support Request Flowchart</title>
        <desc id="support-flow-desc">Decision logic flowchart illustrating intake, self-service help center search, specialist routing, urgent escalation, and customer confirmation before closure.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
        </defs>

        <!-- Base Canvas -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- CONNECTORS (Drawn first so boxes sit above) -->
        <!-- Start -> Check Help Center -->
        <g data-om-edge="edge-start-check" data-om-from="node-start" data-om-to="node-check-hc" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 72 L 480 100" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        </g>

        <!-- Check Help Center -> Decision Resolved in HC -->
        <g data-om-edge="edge-check-hc-dec" data-om-from="node-check-hc" data-om-to="node-dec-hc" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 152 L 480 180" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        </g>

        <!-- Decision HC -> (YES) Right branch to Auto Article Suggestion -->
        <g data-om-edge="edge-dec-hc-yes" data-om-from="node-dec-hc" data-om-to="node-auto-article" data-om-from-side="right" data-om-to-side="top">
          <path data-om-path d="M 548 220 L 740 220 Q 748 220 748 228 L 748 276" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="590" y="202" width="44" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-hc-yes" data-om-editable="text" x="612" y="212" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        </g>

        <!-- Decision HC -> (NO) Down branch to Decision Urgent -->
        <g data-om-edge="edge-dec-hc-no" data-om-from="node-dec-hc" data-om-to="node-dec-urgent" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 260 L 480 292" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="490" y="268" width="34" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-hc-no" data-om-editable="text" x="507" y="278" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        </g>

        <!-- Decision Urgent -> (YES) Left branch to Escalation -->
        <g data-om-edge="edge-urgent-yes" data-om-from="node-dec-urgent" data-om-to="node-oncall" data-om-from-side="left" data-om-to-side="top">
          <path data-om-path d="M 412 332 L 220 332 Q 212 332 212 340 L 212 388" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
          <rect data-om-label-mask x="290" y="314" width="60" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-urgent-yes" data-om-editable="text" x="320" y="324" fill="#bf4520" font-size="8" font-weight="600" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES (URGENT)</text>
        </g>

        <!-- Decision Urgent -> (NO) Down to Tier 1 Specialist -->
        <g data-om-edge="edge-urgent-no" data-om-from="node-dec-urgent" data-om-to="node-specialist" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 372 L 480 400" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="490" y="378" width="52" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-urgent-no" data-om-editable="text" x="516" y="388" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO (STD)</text>
        </g>

        <!-- On-Call Escalate -> Rejoin Merge Point -->
        <g data-om-edge="edge-oncall-merge" data-om-from="node-oncall" data-om-to="node-merge" data-om-from-side="bottom" data-om-to-side="left">
          <path data-om-path d="M 212 440 L 212 484 Q 212 492 220 492 L 472 492" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
        </g>

        <!-- Specialist -> Rejoin Merge Point -->
        <g data-om-edge="edge-spec-merge" data-om-from="node-specialist" data-om-to="node-merge" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 452 L 480 488" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
        </g>

        <!-- Auto Article -> Rejoin Merge Point -->
        <g data-om-edge="edge-article-merge" data-om-from="node-auto-article" data-om-to="node-merge" data-om-from-side="bottom" data-om-to-side="right">
          <path data-om-path d="M 748 328 L 748 484 Q 748 492 740 492 L 488 492" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
        </g>

        <!-- Merge Point -> Customer Confirmation -->
        <g data-om-edge="edge-merge-confirm" data-om-from="node-merge" data-om-to="node-confirm" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 496 L 480 520" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        </g>

        <!-- Customer Confirmation -> Resolved / Close Request -->
        <g data-om-edge="edge-confirm-close" data-om-from="node-confirm" data-om-to="node-close" data-om-from-side="bottom" data-om-to-side="top">
          <path data-om-path d="M 480 572 L 480 600" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="444" y="579" width="72" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-confirmed" data-om-editable="text" x="480" y="589" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMED</text>
        </g>

        <!-- Customer Re-open / Unresolved Loop -->
        <g data-om-edge="edge-loop-retry" data-om-from="node-confirm" data-om-to="node-specialist" data-om-from-side="right" data-om-to-side="right">
          <path data-om-path d="M 576 546 L 620 546 Q 628 546 628 538 L 628 434 Q 628 426 620 426 L 576 426" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
          <rect data-om-label-mask x="590" y="478" width="76" height="14" rx="2" fill="#f5f5f5"/>
          <text data-om-text="lbl-unresolved" data-om-editable="text" x="628" y="488" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOT RESOLVED</text>
        </g>

        <!-- MERGE DOT -->
        <g data-om-component="node-merge" data-om-editable="true">
          <circle cx="480" cy="492" r="4" fill="#2d3142"/>
        </g>

        <!-- NODES -->
        <!-- 1. START NODE -->
        <g data-om-component="node-start" data-om-editable="true">
          <rect x="390" y="32" width="180" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
          <text data-om-text="text-start" data-om-editable="text" x="480" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Incoming Question
          </text>
        </g>

        <!-- 2. ACTION: Check Help Center -->
        <g data-om-component="node-check-hc" data-om-editable="true">
          <rect x="384" y="100" width="192" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="392" y="106" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
          <text x="409" y="115" fill="#4f5d75" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
          <text data-om-text="text-check-hc" data-om-editable="text" x="480" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Query Help Center
          </text>
        </g>

        <!-- 3. DECISION: Found in HC? -->
        <g data-om-component="node-dec-hc" data-om-editable="true">
          <!-- Diamond center: 480, 220. Width: 136 (span 412 to 548), Height: 80 (span 180 to 260) -->
          <polygon points="480,180 548,220 480,260 412,220" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
          <text data-om-text="text-dec-hc" data-om-editable="text" x="480" y="218" fill="#2d3142" font-size="11" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Article Match?
          </text>
          <text x="480" y="232" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">
            KB threshold &gt; 85%
          </text>
        </g>

        <!-- 4. ACTION: Auto-Deliver Knowledge Article -->
        <g data-om-component="node-auto-article" data-om-editable="true">
          <rect x="652" y="276" width="192" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="660" y="282" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
          <text x="677" y="291" fill="#4f5d75" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTO</text>
          <text data-om-text="text-auto-article" data-om-editable="text" x="748" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Suggest Article
          </text>
        </g>

        <!-- 5. DECISION: Urgent Severity? (FOCAL BRANCH) -->
        <g data-om-component="node-dec-urgent" data-om-editable="true">
          <!-- Diamond center: 480, 332. Width: 136, Height: 80 -->
          <polygon points="480,292 548,332 480,372 412,332" fill="#ffffff" stroke="#bf4520" stroke-width="1.4"/>
          <text data-om-text="text-dec-urgent" data-om-editable="text" x="480" y="330" fill="#2d3142" font-size="11" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Urgent Outage?
          </text>
          <text x="480" y="344" fill="#bf4520" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">
            Sev-1 / Sev-2
          </text>
        </g>

        <!-- 6. ACTION: Escalate to On-Call (Focal Accent) -->
        <g data-om-component="node-oncall" data-om-editable="true">
          <rect x="116" y="388" width="192" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="124" y="394" width="46" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
          <text x="147" y="403" fill="#bf4520" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PAGER</text>
          <text data-om-text="text-oncall" data-om-editable="text" x="212" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Escalate to On-Call
          </text>
        </g>

        <!-- 7. ACTION: Specialist Takeover -->
        <g data-om-component="node-specialist" data-om-editable="true">
          <rect x="384" y="400" width="192" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="392" y="406" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
          <text x="410" y="415" fill="#4f5d75" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
          <text data-om-text="text-specialist" data-om-editable="text" x="480" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Specialist Review
          </text>
        </g>

        <!-- 8. ACTION: Customer Confirmation -->
        <g data-om-component="node-confirm" data-om-editable="true">
          <rect x="384" y="520" width="192" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="392" y="526" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
          <text x="414" y="535" fill="#4f5d75" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
          <text data-om-text="text-confirm" data-om-editable="text" x="480" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Customer Confirms
          </text>
        </g>

        <!-- 9. END NODE: Close Request -->
        <g data-om-component="node-close" data-om-editable="true">
          <rect x="390" y="600" width="180" height="40" rx="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
          <text data-om-text="text-close" data-om-editable="text" x="480" y="624" fill="#2d3142" font-size="12" font-weight="600" font-family="'Lexend', system-ui, sans-serif" text-anchor="middle">
            Close Request
          </text>
        </g>

        <!-- Hairline Legend Strip -->
        <line x1="60" y1="656" x2="900" y2="656" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="60" y="670" fill="#4f5d75" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="140" y="663" width="16" height="8" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="162" y="670" fill="#4f5d75" font-size="9" font-family="'Lexend', system-ui, sans-serif">Start / End</text>

        <rect x="250" y="662" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="270" y="670" fill="#4f5d75" font-size="9" font-family="'Lexend', system-ui, sans-serif">Action / Step</text>

        <polygon points="370,662 376,667 370,672 364,667" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="670" fill="#4f5d75" font-size="9" font-family="'Lexend', system-ui, sans-serif">Decision Point</text>

        <rect x="490" y="662" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="510" y="670" fill="#bf4520" font-size="9" font-family="'Lexend', system-ui, sans-serif">Priority Escalation</text>

      </svg>
    </div>
  </div>
</body>
</html>
