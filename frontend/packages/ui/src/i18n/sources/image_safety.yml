reason_minor:
  context: "Why realistic images of minors and edits to photos of minors are refused"
  en: "Realistic images of minors aren't created, and photos of minors only get background, lighting or color edits, because such images could be misused, for example for fake profiles pretending to be a minor."
  de: "Realistische Bilder von Minderjährigen werden nicht erstellt, und bei Fotos von Minderjährigen sind nur Änderungen an Hintergrund, Licht oder Farbe möglich, weil solche Bilder missbraucht werden könnten, zum Beispiel für gefälschte Profile, die sich als minderjährig ausgeben."
  zh: "不会创建逼真的未成年人图像，对未成年人的照片也只能编辑背景、光线或颜色，因为此类图像可能被滥用，例如用于冒充未成年人的虚假资料。"
  es: "No se crean imágenes realistas de menores, y las fotos de menores solo admiten cambios de fondo, iluminación o color, porque esas imágenes podrían usarse de forma indebida, por ejemplo para perfiles falsos que se hacen pasar por menores."
  fr: "Les images réalistes de mineurs ne sont pas créées, et les photos de mineurs ne peuvent être modifiées que pour l'arrière-plan, la lumière ou les couleurs, car de telles images pourraient être détournées, par exemple pour de faux profils se faisant passer pour des mineurs."
  pt: "Imagens realistas de menores não são criadas, e fotos de menores só permitem alterações de fundo, iluminação ou cor, porque essas imagens podem ser usadas indevidamente, por exemplo em perfis falsos que se passam por menores."
  ru: "Реалистичные изображения несовершеннолетних не создаются, а фотографии несовершеннолетних можно изменять только в части фона, освещения или цвета, потому что такие изображения могут использоваться во вред, например для фальшивых профилей, выдающих себя за несовершеннолетних."
  ja: "未成年者のリアルな画像は作成されず、未成年者の写真は背景・照明・色の編集のみ可能です。こうした画像は、未成年者を装った偽プロフィールなど、悪用される恐れがあるためです。"
  ko: "미성년자의 사실적인 이미지는 만들지 않으며, 미성년자 사진은 배경, 조명, 색상 편집만 가능합니다. 이런 이미지는 미성년자를 사칭하는 가짜 프로필 등에 악용될 수 있기 때문입니다."
  it: "Le immagini realistiche di minori non vengono create e le foto di minori ammettono solo modifiche a sfondo, illuminazione o colore, perché tali immagini potrebbero essere usate in modo improprio, ad esempio per profili falsi che si spacciano per minori."
  tr: "Reşit olmayanların gerçekçi görselleri oluşturulmaz ve reşit olmayanların fotoğraflarında yalnızca arka plan, ışık veya renk düzenlemesi yapılabilir; çünkü bu tür görseller kötüye kullanılabilir, örneğin reşit olmayan biri gibi davranan sahte profiller için."
  vi: "Hình ảnh chân thực của trẻ vị thành niên không được tạo, và ảnh của trẻ vị thành niên chỉ được chỉnh nền, ánh sáng hoặc màu sắc, vì những hình ảnh này có thể bị lạm dụng, ví dụ cho hồ sơ giả mạo là trẻ vị thành niên."
  id: "Gambar realistis anak di bawah umur tidak dibuat, dan foto anak di bawah umur hanya bisa diedit pada latar belakang, pencahayaan, atau warna, karena gambar semacam itu bisa disalahgunakan, misalnya untuk profil palsu yang berpura-pura sebagai anak di bawah umur."
  pl: "Realistyczne obrazy nieletnich nie są tworzone, a zdjęcia nieletnich można edytować tylko pod kątem tła, oświetlenia lub kolorów, ponieważ takie obrazy mogłyby zostać nadużyte, na przykład do fałszywych profili podszywających się pod nieletnich."
  nl: "Realistische beelden van minderjarigen worden niet gemaakt, en foto's van minderjarigen kunnen alleen worden bewerkt wat betreft achtergrond, licht of kleur, omdat zulke beelden misbruikt kunnen worden, bijvoorbeeld voor nepprofielen die zich voordoen als minderjarige."
  ar: "لا يتم إنشاء صور واقعية للقاصرين، ولا يُسمح في صورهم إلا بتعديل الخلفية أو الإضاءة أو الألوان، لأن مثل هذه الصور قد يُساء استخدامها، مثلًا في حسابات مزيفة تنتحل صفة قاصر."
  hi: "नाबालिगों की यथार्थवादी तस्वीरें नहीं बनाई जातीं, और नाबालिगों की फ़ोटो में केवल बैकग्राउंड, रोशनी या रंग बदले जा सकते हैं, क्योंकि ऐसी तस्वीरों का दुरुपयोग हो सकता है, जैसे नाबालिग बनकर फ़र्ज़ी प्रोफ़ाइल बनाने में।"
  th: "จะไม่สร้างภาพสมจริงของผู้เยาว์ และรูปถ่ายของผู้เยาว์แก้ไขได้เฉพาะพื้นหลัง แสง หรือสีเท่านั้น เพราะภาพเหล่านี้อาจถูกนำไปใช้ในทางที่ผิด เช่น โปรไฟล์ปลอมที่แอบอ้างเป็นผู้เยาว์"
  cs: "Realistické obrázky nezletilých se nevytvářejí a fotky nezletilých lze upravovat jen v pozadí, osvětlení nebo barvách, protože by takové obrázky mohly být zneužity, například pro falešné profily vydávající se za nezletilé."
  sv: "Realistiska bilder av minderåriga skapas inte, och foton av minderåriga får bara ändras i bakgrund, ljus eller färg, eftersom sådana bilder kan missbrukas, till exempel för falska profiler som utger sig för att vara minderåriga."
  he: "תמונות מציאותיות של קטינים אינן נוצרות, ובתמונות של קטינים ניתן לשנות רק רקע, תאורה או צבע, משום שתמונות כאלה עלולות לשמש לרעה, למשל לפרופילים מזויפים המתחזים לקטינים."
  verified_by_human: []

alternative_minor:
  context: "Allowed alternative for minors: clearly stylized, non-sexual depictions"
  en: "A clearly stylized version works, such as a 3D render, an illustration or a cartoon, as long as the scene is non-sexual."
  de: "Eine klar stilisierte Version ist möglich, zum Beispiel als 3D-Rendering, Illustration oder Cartoon, solange die Szene nicht sexuell ist."
  zh: "可以使用明显风格化的版本，例如 3D 渲染、插画或卡通，只要场景不涉及性内容。"
  es: "Se puede hacer una versión claramente estilizada, como un render 3D, una ilustración o un dibujo animado, siempre que la escena no sea sexual."
  fr: "Une version clairement stylisée est possible, par exemple en rendu 3D, en illustration ou en dessin animé, tant que la scène n'est pas sexuelle."
  pt: "É possível uma versão claramente estilizada, como um render 3D, uma ilustração ou um desenho animado, desde que a cena não seja sexual."
  ru: "Возможна явно стилизованная версия, например 3D-рендер, иллюстрация или мультфильм, если сцена не сексуальная."
  ja: "明らかに様式化されたバージョン（3Dレンダリング、イラスト、カートゥーンなど）であれば、シーンが性的でない限り可能です。"
  ko: "명확히 양식화된 버전은 가능합니다. 예를 들어 3D 렌더링, 일러스트, 만화 형태이며 장면이 성적이지 않아야 합니다."
  it: "È possibile una versione chiaramente stilizzata, ad esempio un render 3D, un'illustrazione o un cartone animato, purché la scena non sia sessuale."
  tr: "Sahnenin cinsel olmaması koşuluyla, 3D render, illüstrasyon veya çizgi film gibi açıkça stilize bir sürüm mümkündür."
  vi: "Có thể tạo phiên bản được cách điệu rõ ràng, chẳng hạn như ảnh dựng 3D, minh họa hoặc hoạt hình, miễn là cảnh không mang tính tình dục."
  id: "Versi yang jelas bergaya artistik dimungkinkan, misalnya render 3D, ilustrasi, atau kartun, selama adegannya tidak bersifat seksual."
  pl: "Możliwa jest wyraźnie stylizowana wersja, na przykład render 3D, ilustracja lub kreskówka, o ile scena nie jest seksualna."
  nl: "Een duidelijk gestileerde versie is mogelijk, zoals een 3D-render, een illustratie of een cartoon, zolang de scène niet seksueel is."
  ar: "يمكن إنشاء نسخة أسلوبية واضحة، مثل تصيير ثلاثي الأبعاد أو رسم توضيحي أو كرتون، ما دام المشهد غير جنسي."
  hi: "स्पष्ट रूप से शैलीबद्ध संस्करण संभव है, जैसे 3D रेंडर, इलस्ट्रेशन या कार्टून, बशर्ते दृश्य यौन न हो।"
  th: "สามารถทำเวอร์ชันที่มีสไตล์ชัดเจนได้ เช่น 3D เรนเดอร์ ภาพประกอบ หรือการ์ตูน ตราบใดที่ฉากนั้นไม่เกี่ยวกับเรื่องเพศ"
  cs: "Možná je zjevně stylizovaná verze, například 3D render, ilustrace nebo kreslená postava, pokud scéna není sexuální."
  sv: "En tydligt stiliserad version är möjlig, till exempel som 3D-rendering, illustration eller tecknad serie, så länge scenen inte är sexuell."
  he: "אפשר ליצור גרסה מסוגננת בבירור, למשל רינדור תלת־ממדי, איור או קריקטורה, כל עוד הסצנה אינה מינית."
  verified_by_human: []

