  en: "Images of real public figures aren't created at the moment, because they could be used as deepfakes or for false claims."
  de: "Bilder von echten Personen des öffentlichen Lebens werden derzeit nicht erstellt, weil sie als Deepfakes oder für falsche Behauptungen genutzt werden könnten."
  zh: "目前不会创建真实公众人物的图像，因为这些图像可能被用作深度伪造或用于虚假说法。"
  es: "Por ahora no se crean imágenes de personajes públicos reales, porque podrían usarse como deepfakes o para afirmaciones falsas."
  fr: "Les images de personnalités publiques réelles ne sont pas créées pour le moment, car elles pourraient servir de deepfakes ou à de fausses affirmations."
  pt: "Imagens de figuras públicas reais não são criadas no momento, porque poderiam ser usadas como deepfakes ou para afirmações falsas."
