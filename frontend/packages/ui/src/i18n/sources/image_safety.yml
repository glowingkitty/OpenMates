# frontend/packages/ui/src/i18n/sources/image_safety.yml
# Category-level reasons and allowed alternatives shown when an image or video
# request is refused by the image safety checks. Never name the check, score or
# threshold that fired. Read by backend/shared/python_utils/image_safety/explanations.py.

reason_child_sexual:
  context: "Hard limit (S1): sexualized depiction of a minor. Short and firm, no alternative."
  en: "This request was refused. Sexual or suggestive images involving minors are never created."
  de: "Diese Anfrage wurde abgelehnt. Sexuelle oder anzügliche Bilder mit Minderjährigen werden niemals erstellt."
  zh: "此请求已被拒绝。涉及未成年人的性相关或暗示性图像永远不会被创建。"
  es: "Esta solicitud fue rechazada. Nunca se crean imágenes sexuales o sugerentes con menores."
  fr: "Cette demande a été refusée. Les images sexuelles ou suggestives impliquant des mineurs ne sont jamais créées."
  pt: "Este pedido foi recusado. Imagens sexuais ou sugestivas envolvendo menores nunca são criadas."
  ru: "Этот запрос отклонён. Сексуальные или откровенные изображения с несовершеннолетними не создаются никогда."
  ja: "このリクエストは拒否されました。未成年者を含む性的または性的な示唆を含む画像は、いかなる場合も作成されません。"
  ko: "이 요청은 거부되었습니다. 미성년자가 등장하는 성적이거나 암시적인 이미지는 절대 만들지 않습니다."
  it: "Questa richiesta è stata rifiutata. Immagini sessuali o allusive che coinvolgono minori non vengono mai create."
  tr: "Bu istek reddedildi. Reşit olmayanları içeren cinsel veya müstehcen görseller asla oluşturulmaz."
  vi: "Yêu cầu này đã bị từ chối. Hình ảnh khiêu dâm hoặc gợi dục liên quan đến trẻ vị thành niên sẽ không bao giờ được tạo."
  id: "Permintaan ini ditolak. Gambar seksual atau sugestif yang melibatkan anak di bawah umur tidak pernah dibuat."
  pl: "Ta prośba została odrzucona. Obrazy seksualne lub sugestywne z udziałem nieletnich nigdy nie są tworzone."
  nl: "Dit verzoek is geweigerd. Seksuele of suggestieve beelden van minderjarigen worden nooit gemaakt."
  ar: "تم رفض هذا الطلب. لا يتم أبدًا إنشاء صور جنسية أو موحية تتضمن قاصرين."
  hi: "यह अनुरोध अस्वीकार कर दिया गया। नाबालिगों से जुड़ी यौन या अश्लील तस्वीरें कभी नहीं बनाई जातीं।"
  th: "คำขอนี้ถูกปฏิเสธ ภาพทางเพศหรือภาพเชิงยั่วยุที่เกี่ยวข้องกับผู้เยาว์จะไม่ถูกสร้างขึ้นโดยเด็ดขาด"
  cs: "Tento požadavek byl zamítnut. Sexuální nebo sugestivní obrázky s nezletilými se nikdy nevytvářejí."
  sv: "Den här begäran avslogs. Sexuella eller antydande bilder med minderåriga skapas aldrig."
  he: "הבקשה נדחתה. תמונות מיניות או מעוררות עם קטינים לעולם אינן נוצרות."
  verified_by_human: []

reason_intimate_real_person:
  context: "Hard limit (S2): intimate or sexual images of real people. Short and firm, no alternative."
  en: "This request was refused. Sexual or intimate images of real people are never created."
  de: "Diese Anfrage wurde abgelehnt. Sexuelle oder intime Bilder echter Personen werden niemals erstellt."
  zh: "此请求已被拒绝。涉及真实人物的性相关或私密图像永远不会被创建。"
  es: "Esta solicitud fue rechazada. Nunca se crean imágenes sexuales o íntimas de personas reales."
  fr: "Cette demande a été refusée. Les images sexuelles ou intimes de personnes réelles ne sont jamais créées."
  pt: "Este pedido foi recusado. Imagens sexuais ou íntimas de pessoas reais nunca são criadas."
  ru: "Этот запрос отклонён. Сексуальные или интимные изображения реальных людей не создаются никогда."
  ja: "このリクエストは拒否されました。実在の人物の性的または親密な画像は、いかなる場合も作成されません。"
  ko: "이 요청은 거부되었습니다. 실존 인물의 성적이거나 은밀한 이미지는 절대 만들지 않습니다."
  it: "Questa richiesta è stata rifiutata. Immagini sessuali o intime di persone reali non vengono mai create."
  tr: "Bu istek reddedildi. Gerçek kişilerin cinsel veya mahrem görselleri asla oluşturulmaz."
  vi: "Yêu cầu này đã bị từ chối. Hình ảnh khiêu dâm hoặc riêng tư của người thật sẽ không bao giờ được tạo."
  id: "Permintaan ini ditolak. Gambar seksual atau intim dari orang nyata tidak pernah dibuat."
  pl: "Ta prośba została odrzucona. Obrazy seksualne lub intymne prawdziwych osób nigdy nie są tworzone."
  nl: "Dit verzoek is geweigerd. Seksuele of intieme beelden van echte personen worden nooit gemaakt."
  ar: "تم رفض هذا الطلب. لا يتم أبدًا إنشاء صور جنسية أو حميمة لأشخاص حقيقيين."
  hi: "यह अनुरोध अस्वीकार कर दिया गया। असली लोगों की यौन या अंतरंग तस्वीरें कभी नहीं बनाई जातीं।"
  th: "คำขอนี้ถูกปฏิเสธ ภาพทางเพศหรือภาพส่วนตัวของบุคคลจริงจะไม่ถูกสร้างขึ้นโดยเด็ดขาด"
  cs: "Tento požadavek byl zamítnut. Sexuální nebo intimní obrázky skutečných osob se nikdy nevytvářejí."
  sv: "Den här begäran avslogs. Sexuella eller intima bilder av verkliga personer skapas aldrig."
  he: "הבקשה נדחתה. תמונות מיניות או אינטימיות של אנשים אמיתיים לעולם אינן נוצרות."
  verified_by_human: []

reason_bypass:
  context: "Hard limit (S12): an attempt to get around the safety rules. Short and firm, no alternative."
  en: "This request was refused because it tried to get around the safety rules."
  de: "Diese Anfrage wurde abgelehnt, weil sie versucht hat, die Sicherheitsregeln zu umgehen."
  zh: "此请求已被拒绝，因为它试图绕过安全规则。"
  es: "Esta solicitud fue rechazada porque intentó eludir las reglas de seguridad."
  fr: "Cette demande a été refusée parce qu'elle tentait de contourner les règles de sécurité."
  pt: "Este pedido foi recusado porque tentou contornar as regras de segurança."
  ru: "Этот запрос отклонён, потому что в нём была попытка обойти правила безопасности."
  ja: "このリクエストは、安全ルールを回避しようとしたため拒否されました。"
  ko: "이 요청은 안전 규칙을 우회하려고 했기 때문에 거부되었습니다."
  it: "Questa richiesta è stata rifiutata perché cercava di aggirare le regole di sicurezza."
  tr: "Bu istek, güvenlik kurallarını aşmaya çalıştığı için reddedildi."
  vi: "Yêu cầu này đã bị từ chối vì cố vượt qua các quy tắc an toàn."
  id: "Permintaan ini ditolak karena mencoba menghindari aturan keamanan."
  pl: "Ta prośba została odrzucona, ponieważ próbowała obejść zasady bezpieczeństwa."
  nl: "Dit verzoek is geweigerd omdat het probeerde de veiligheidsregels te omzeilen."
  ar: "تم رفض هذا الطلب لأنه حاول التحايل على قواعد الأمان."
  hi: "यह अनुरोध अस्वीकार कर दिया गया क्योंकि इसने सुरक्षा नियमों को दरकिनार करने की कोशिश की।"
  th: "คำขอนี้ถูกปฏิเสธเพราะพยายามหลีกเลี่ยงกฎความปลอดภัย"
  cs: "Tento požadavek byl zamítnut, protože se pokusil obejít bezpečnostní pravidla."
  sv: "Den här begäran avslogs eftersom den försökte kringgå säkerhetsreglerna."
  he: "הבקשה נדחתה מפני שניסתה לעקוף את כללי הבטיחות."
