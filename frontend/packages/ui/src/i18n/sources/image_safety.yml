reason_violent:
  context: "Why violent images of real people are refused"
  en: "Images showing real people hurt, attacked or at a crime scene aren't created, because they could be used to harm or defame them."
  de: "Bilder, die echte Personen verletzt, angegriffen oder an einem Tatort zeigen, werden nicht erstellt, weil sie ihnen schaden oder sie verleumden könnten."
  zh: "不会创建显示真实人物受伤、遭到攻击或身处犯罪现场的图像，因为这些图像可能被用来伤害或诽谤他们。"
  es: "No se crean imágenes que muestren a personas reales heridas, atacadas o en la escena de un crimen, porque podrían usarse para perjudicarlas o difamarlas."
  fr: "Les images montrant de vraies personnes blessées, agressées ou sur une scène de crime ne sont pas créées, car elles pourraient servir à leur nuire ou à les diffamer."
  pt: "Imagens que mostram pessoas reais feridas, atacadas ou em uma cena de crime não são criadas, porque poderiam ser usadas para prejudicá-las ou difamá-las."
  ru: "Изображения, на которых реальные люди ранены, подвергаются нападению или находятся на месте преступления, не создаются, потому что их могут использовать, чтобы навредить им или оклеветать их."
  ja: "実在の人物が傷ついている、襲われている、または犯罪現場にいる画像は、その人を傷つけたり中傷したりするのに使われる恐れがあるため、作成されません。"
  ko: "실존 인물이 다치거나 공격받거나 범죄 현장에 있는 이미지는 그 사람을 해치거나 명예를 훼손하는 데 쓰일 수 있어 만들지 않습니다."
  it: "Le immagini che mostrano persone reali ferite, aggredite o su una scena del crimine non vengono create, perché potrebbero essere usate per danneggiarle o diffamarle."
  tr: "Gerçek kişileri yaralı, saldırıya uğramış veya suç mahallinde gösteren görseller oluşturulmaz; çünkü bunlar onlara zarar vermek veya onları itibarsızlaştırmak için kullanılabilir."
  vi: "Hình ảnh cho thấy người thật bị thương, bị tấn công hoặc ở hiện trường vụ án không được tạo, vì chúng có thể bị dùng để gây hại hoặc bôi nhọ họ."
  id: "Gambar yang menunjukkan orang nyata terluka, diserang, atau berada di tempat kejadian kejahatan tidak dibuat, karena bisa digunakan untuk merugikan atau mencemarkan nama mereka."
  pl: "Obrazy przedstawiające prawdziwe osoby ranne, zaatakowane lub na miejscu zbrodni nie są tworzone, ponieważ mogłyby posłużyć do wyrządzenia im krzywdy lub zniesławienia."
  nl: "Beelden die echte personen gewond, aangevallen of op een plaats delict tonen worden niet gemaakt, omdat ze gebruikt kunnen worden om hen te schaden of te belasteren."
  ar: "لا يتم إنشاء صور تُظهر أشخاصًا حقيقيين مصابين أو معتدى عليهم أو في مسرح جريمة، لأنها قد تُستخدم لإيذائهم أو التشهير بهم."
  hi: "असली लोगों को घायल, हमले का शिकार या अपराध स्थल पर दिखाने वाली तस्वीरें नहीं बनाई जातीं, क्योंकि उनका उपयोग उन्हें नुकसान पहुँचाने या बदनाम करने के लिए हो सकता है।"
  th: "จะไม่สร้างภาพที่แสดงบุคคลจริงได้รับบาดเจ็บ ถูกทำร้าย หรืออยู่ในที่เกิดเหตุอาชญากรรม เพราะอาจถูกนำไปใช้ทำร้ายหรือใส่ร้ายพวกเขา"
  cs: "Obrázky zobrazující skutečné osoby zraněné, napadené nebo na místě činu se nevytvářejí, protože by mohly být použity k jejich poškození nebo pomluvě."
  sv: "Bilder som visar verkliga personer skadade, attackerade eller på en brottsplats skapas inte, eftersom de kan användas för att skada eller smäda dem."
  he: "תמונות המציגות אנשים אמיתיים פצועים, מותקפים או בזירת פשע אינן נוצרות, משום שהן עלולות לשמש כדי לפגוע בהם או להשמיץ אותם."
  verified_by_human: []

