  th: "จะไม่สร้างภาพที่มีสัญลักษณ์แห่งความเกลียดชัง หรือภาพที่โจมตีผู้คนเพราะตัวตนของพวกเขา"
  cs: "Obrázky se symboly nenávisti nebo obrázky, které cílí na lidi kvůli tomu, kým jsou, se nevytvářejí."
