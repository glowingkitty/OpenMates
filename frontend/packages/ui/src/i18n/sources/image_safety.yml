reason_identity:
  context: "Why face swaps and identity replacement are refused"
  en: "Face swaps and replacing someone's identity aren't done, because they could be used to impersonate a person."
  de: "Gesichtstausch und das Ersetzen der Identität einer Person werden nicht gemacht, weil sie genutzt werden könnten, um sich als diese Person auszugeben."
  zh: "不会进行换脸或替换他人身份，因为这可能被用来冒充他人。"
  es: "No se hacen intercambios de rostro ni se sustituye la identidad de una persona, porque podrían usarse para suplantarla."
  fr: "Les échanges de visage et le remplacement de l'identité d'une personne ne sont pas réalisés, car cela pourrait servir à usurper l'identité de quelqu'un."
  pt: "Trocas de rosto e a substituição da identidade de alguém não são feitas, porque poderiam ser usadas para se passar por uma pessoa."
  ru: "Замена лиц и подмена личности человека не выполняются, потому что это могут использовать, чтобы выдавать себя за другого человека."
  ja: "顔の入れ替えや他人の身元の置き換えは行いません。人物のなりすましに使われる恐れがあるためです。"
  ko: "얼굴 바꾸기나 다른 사람의 신원을 대체하는 작업은 사람을 사칭하는 데 쓰일 수 있어 하지 않습니다."
  it: "Lo scambio di volti e la sostituzione dell'identità di una persona non vengono eseguiti, perché potrebbero essere usati per impersonare qualcuno."
  tr: "Yüz değiştirme ve bir kişinin kimliğini değiştirme işlemleri yapılmaz; çünkü bir kişiyi taklit etmek için kullanılabilirler."
  vi: "Việc hoán đổi khuôn mặt và thay thế danh tính của ai đó không được thực hiện, vì chúng có thể bị dùng để mạo danh một người."
  id: "Penukaran wajah dan penggantian identitas seseorang tidak dilakukan, karena bisa digunakan untuk menyamar sebagai orang tersebut."
  pl: "Zamiana twarzy i podmiana tożsamości osoby nie są wykonywane, ponieważ mogłyby posłużyć do podszywania się pod kogoś."
  nl: "Gezichten verwisselen en iemands identiteit vervangen doen we niet, omdat dit gebruikt kan worden om je voor iemand anders voor te doen."
  ar: "لا يتم تبديل الوجوه أو استبدال هوية شخص ما، لأن ذلك قد يُستخدم لانتحال شخصية."
  hi: "चेहरा बदलने या किसी की पहचान बदलने का काम नहीं किया जाता, क्योंकि इसका उपयोग किसी का रूप धरने के लिए हो सकता है।"
  th: "จะไม่ทำการสลับใบหน้าหรือแทนที่ตัวตนของบุคคล เพราะอาจถูกนำไปใช้แอบอ้างเป็นบุคคลนั้น"
  cs: "Výměna obličejů a nahrazení identity osoby se neprovádějí, protože by mohly být použity k vydávání se za někoho jiného."
  sv: "Ansiktsbyten och utbyte av någons identitet görs inte, eftersom de kan användas för att utge sig för att vara en annan person."
  he: "החלפת פנים והחלפת זהותו של אדם אינן מבוצעות, משום שהן עלולות לשמש להתחזות לאדם."
  verified_by_human: []

alternative_identity:
  context: "Allowed alternative for identity edits"
  en: "Edits that keep the person's identity, such as a new background, lighting or art style, are possible."
  de: "Änderungen, bei denen die Person erkennbar sie selbst bleibt, etwa ein neuer Hintergrund, anderes Licht oder ein Kunststil, sind möglich."
  zh: "可以进行保留人物身份的编辑，例如更换背景、光线或艺术风格。"
  es: "Son posibles las ediciones que mantienen la identidad de la persona, como un fondo nuevo, otra iluminación o un estilo artístico."
  fr: "Les modifications qui conservent l'identité de la personne, comme un nouvel arrière-plan, un autre éclairage ou un style artistique, sont possibles."
  pt: "São possíveis edições que mantêm a identidade da pessoa, como um novo fundo, outra iluminação ou um estilo artístico."
  ru: "Возможны правки, сохраняющие личность человека, например новый фон, другое освещение или художественный стиль."
  ja: "人物の身元を保ったままの編集、たとえば新しい背景、照明の変更、アートスタイルの変更などは可能です。"
  ko: "사람의 정체성을 유지하는 편집은 가능합니다. 예를 들어 새 배경, 조명, 아트 스타일 변경 등이 있습니다."
  it: "Sono possibili modifiche che mantengono l'identità della persona, come un nuovo sfondo, un'illuminazione diversa o uno stile artistico."
  tr: "Yeni bir arka plan, farklı ışık veya sanat stili gibi kişinin kimliğini koruyan düzenlemeler mümkündür."
  vi: "Có thể chỉnh sửa mà vẫn giữ nguyên danh tính của người đó, chẳng hạn đổi nền, ánh sáng hoặc phong cách nghệ thuật."
  id: "Pengeditan yang mempertahankan identitas orang tersebut, seperti latar belakang baru, pencahayaan, atau gaya seni, dimungkinkan."
  pl: "Możliwe są edycje zachowujące tożsamość osoby, takie jak nowe tło, oświetlenie lub styl artystyczny."
  nl: "Bewerkingen die de identiteit van de persoon behouden, zoals een nieuwe achtergrond, ander licht of een kunststijl, zijn mogelijk."
  ar: "يمكن إجراء تعديلات تحافظ على هوية الشخص، مثل خلفية جديدة أو إضاءة مختلفة أو أسلوب فني."
  hi: "ऐसे बदलाव संभव हैं जिनमें व्यक्ति की पहचान बनी रहे, जैसे नया बैकग्राउंड, अलग रोशनी या कला शैली।"
  th: "สามารถแก้ไขโดยคงตัวตนของบุคคลไว้ได้ เช่น เปลี่ยนพื้นหลัง แสง หรือสไตล์ศิลปะ"
  cs: "Možné jsou úpravy, které zachovají identitu osoby, například nové pozadí, osvětlení nebo umělecký styl."
  sv: "Ändringar som bevarar personens identitet, till exempel en ny bakgrund, annat ljus eller en konststil, är möjliga."
  he: "אפשר לבצע עריכות ששומרות על זהות האדם, כמו רקע חדש, תאורה אחרת או סגנון אמנותי."
  verified_by_human: []

reason_id_document:
  context: "Why images of ID documents are refused"
  en: "Images of ID documents such as passports, ID cards or driver's licenses aren't created, because they could be used for fraud."
  de: "Bilder von Ausweisdokumenten wie Reisepässen, Personalausweisen oder Führerscheinen werden nicht erstellt, weil sie für Betrug genutzt werden könnten."
  zh: "不会创建护照、身份证或驾驶证等身份证件的图像，因为这些图像可能被用于欺诈。"
  es: "No se crean imágenes de documentos de identidad como pasaportes, DNI o carnés de conducir, porque podrían usarse para fraude."
  fr: "Les images de pièces d'identité comme les passeports, cartes d'identité ou permis de conduire ne sont pas créées, car elles pourraient servir à la fraude."
  pt: "Imagens de documentos de identificação, como passaportes, cartões de cidadão ou cartas de condução, não são criadas, porque poderiam ser usadas para fraude."
  ru: "Изображения документов, удостоверяющих личность, таких как паспорта, удостоверения личности или водительские права, не создаются, потому что их могут использовать для мошенничества."
