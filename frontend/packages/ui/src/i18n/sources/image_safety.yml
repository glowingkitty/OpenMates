  hi: "असली सार्वजनिक हस्तियों की तस्वीरें फ़िलहाल नहीं बनाई जातीं, क्योंकि उनका उपयोग डीपफ़ेक के रूप में या झूठे दावों के लिए हो सकता है।"
  th: "ขณะนี้จะไม่สร้างภาพของบุคคลสาธารณะตัวจริง เพราะอาจถูกนำไปใช้เป็นดีปเฟกหรือเพื่ออ้างข้อมูลเท็จ"
