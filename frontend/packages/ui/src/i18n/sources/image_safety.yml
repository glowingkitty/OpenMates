  ja: "実在の公人の画像は、ディープフェイクや虚偽の主張に使われる恐れがあるため、現時点では作成されません。"
  ko: "실존하는 공인의 이미지는 딥페이크나 허위 주장에 쓰일 수 있어 현재는 만들지 않습니다."
  it: "Al momento non vengono create immagini di personaggi pubblici reali, perché potrebbero essere usate come deepfake o per affermazioni false."
  tr: "Gerçek kamu figürlerinin görselleri şu an için oluşturulmaz; çünkü deepfake olarak veya yanlış iddialar için kullanılabilirler."
  vi: "Hiện tại hình ảnh của nhân vật của công chúng thật không được tạo, vì chúng có thể bị dùng làm deepfake hoặc cho các tuyên bố sai sự thật."
  id: "Saat ini gambar tokoh publik nyata tidak dibuat, karena bisa digunakan sebagai deepfake atau untuk klaim palsu."
