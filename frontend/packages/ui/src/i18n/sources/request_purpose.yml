# frontend/packages/ui/src/i18n/sources/request_purpose.yml
# Declines for purpose-based chat request safety (backend/apps/ai/processing/request_purpose_policy.py).

harmful_purpose:
  context: "Reason for declining a request to produce propaganda, hate, disinformation or manipulative tabloid content"
  en: "I can't create propaganda, hate content, disinformation or manipulative tabloid content. I'm happy to explain how these work, analyse examples, fact-check claims or help with clearly labelled satire."
  de: "Ich kann keine Propaganda, Hassinhalte, Desinformation oder manipulative Boulevardinhalte erstellen. Gern erkläre ich, wie sie funktionieren, analysiere Beispiele, prüfe Behauptungen oder helfe bei klar gekennzeichneter Satire."
  zh: "我不能创作宣传、仇恨内容、虚假信息或操纵性的小报内容。但我可以解释其运作方式、分析案例、核查说法，或协助创作明确标注的讽刺作品。"
  es: "No puedo crear propaganda, contenido de odio, desinformación ni contenido sensacionalista manipulador. Puedo explicar cómo funcionan, analizar ejemplos, verificar afirmaciones o ayudar con sátira claramente señalada."
  fr: "Je ne peux pas créer de propagande, de contenu haineux, de désinformation ou de contenu de presse à sensation manipulateur. Je peux expliquer leur fonctionnement, analyser des exemples, vérifier des affirmations ou aider pour une satire clairement signalée."
  pt: "Não posso criar propaganda, conteúdo de ódio, desinformação ou conteúdo sensacionalista manipulador. Posso explicar como funcionam, analisar exemplos, verificar afirmações ou ajudar com sátira claramente identificada."
  ru: "Я не могу создавать пропаганду, ненавистнический контент, дезинформацию или манипулятивный жёлтый контент. Могу объяснить, как это работает, разобрать примеры, проверить утверждения или помочь с явно обозначенной сатирой."
  ja: "プロパガンダ、ヘイト、偽情報、人を操るタブロイド的なコンテンツは作成できません。仕組みの解説、事例の分析、事実確認、明示された風刺のお手伝いはできます。"
  ko: "선전, 혐오 콘텐츠, 허위 정보, 조작적인 타블로이드 콘텐츠는 만들 수 없습니다. 작동 방식 설명, 사례 분석, 사실 확인, 명확히 표시된 풍자는 도와드릴 수 있습니다."
  it: "Non posso creare propaganda, contenuti d'odio, disinformazione o contenuti scandalistici manipolatori. Posso spiegare come funzionano, analizzare esempi, verificare affermazioni o aiutare con satira chiaramente dichiarata."
  tr: "Propaganda, nefret içeriği, dezenformasyon veya manipülatif magazin içeriği oluşturamam. Nasıl çalıştıklarını açıklayabilir, örnekleri analiz edebilir, iddiaları doğrulayabilir veya açıkça belirtilmiş hiciv için yardımcı olabilirim."
  vi: "Mình không thể tạo nội dung tuyên truyền, thù hận, thông tin sai lệch hay tin lá cải thao túng. Mình có thể giải thích cách chúng hoạt động, phân tích ví dụ, kiểm chứng thông tin hoặc giúp viết châm biếm được ghi rõ."
  id: "Saya tidak dapat membuat propaganda, konten kebencian, disinformasi, atau konten tabloid yang manipulatif. Saya bisa menjelaskan cara kerjanya, menganalisis contoh, memeriksa fakta, atau membantu satire yang diberi label jelas."
  pl: "Nie mogę tworzyć propagandy, treści nienawistnych, dezinformacji ani manipulacyjnych treści tabloidowych. Mogę wyjaśnić, jak działają, przeanalizować przykłady, sprawdzić twierdzenia lub pomóc w wyraźnie oznaczonej satyrze."
  nl: "Ik kan geen propaganda, haatzaaiende inhoud, desinformatie of manipulatieve roddelbladinhoud maken. Ik leg graag uit hoe het werkt, analyseer voorbeelden, controleer beweringen of help met duidelijk gelabelde satire."
  ar: "لا يمكنني إنشاء دعاية أو محتوى كراهية أو معلومات مضللة أو محتوى صحافة صفراء تلاعبي. يسعدني شرح كيفية عملها وتحليل أمثلة والتحقق من الادعاءات أو المساعدة في سخرية موسومة بوضوح."
  hi: "मैं प्रचार, नफ़रत वाली सामग्री, दुष्प्रचार या हेरफेर करने वाली सनसनीखेज़ सामग्री नहीं बना सकता। मैं समझा सकता हूँ कि ये कैसे काम करते हैं, उदाहरणों का विश्लेषण, दावों की जाँच, या स्पष्ट रूप से चिह्नित व्यंग्य में मदद कर सकता हूँ।"
  th: "ฉันสร้างเนื้อหาโฆษณาชวนเชื่อ เนื้อหาสร้างความเกลียดชัง ข้อมูลเท็จ หรือเนื้อหาแท็บลอยด์ที่ชักจูงไม่ได้ แต่อธิบายวิธีทำงาน วิเคราะห์ตัวอย่าง ตรวจสอบข้อเท็จจริง หรือช่วยเรื่องงานเสียดสีที่ระบุชัดเจนได้"
  cs: "Nemohu vytvářet propagandu, nenávistný obsah, dezinformace ani manipulativní bulvární obsah. Rád vysvětlím, jak fungují, rozeberu příklady, ověřím tvrzení nebo pomohu s jasně označenou satirou."
  sv: "Jag kan inte skapa propaganda, hatinnehåll, desinformation eller manipulativt skvallerpressinnehåll. Jag förklarar gärna hur det fungerar, analyserar exempel, faktagranskar eller hjälper till med tydligt märkt satir."
  he: "אני לא יכול ליצור תעמולה, תוכן שנאה, דיסאינפורמציה או תוכן צהוב מניפולטיבי. אשמח להסביר איך זה עובד, לנתח דוגמאות, לבדוק עובדות או לעזור בסאטירה מסומנת בבירור."
  verified_by_human: []

illegal_category:
  context: "Reason for declining a request in an illegal category (minors, intimate images without consent, sexual deepfakes, mass-harm weapons)"
  en: "I can't help with sexual content involving minors, intimate images without consent, sexual deepfakes of real people or weapons meant for mass harm."
  de: "Dabei kann ich nicht helfen: sexuelle Inhalte mit Minderjährigen, intime Bilder ohne Einwilligung, sexuelle Deepfakes echter Personen oder Waffen für Massenschäden."
  zh: "我无法协助涉及未成年人的性内容、未经同意的私密图像、真人的性深度伪造，或旨在造成大规模伤害的武器。"
  es: "No puedo ayudar con contenido sexual con menores, imágenes íntimas sin consentimiento, deepfakes sexuales de personas reales ni armas de daño masivo."
  fr: "Je ne peux pas aider pour du contenu sexuel impliquant des mineurs, des images intimes sans consentement, des deepfakes sexuels de personnes réelles ou des armes de destruction massive."
  pt: "Não posso ajudar com conteúdo sexual envolvendo menores, imagens íntimas sem consentimento, deepfakes sexuais de pessoas reais ou armas de dano em massa."
  ru: "Я не могу помогать с сексуальным контентом с участием несовершеннолетних, интимными изображениями без согласия, сексуальными дипфейками реальных людей или оружием массового поражения."
  ja: "未成年者を含む性的コンテンツ、同意のない私的な画像、実在の人物の性的ディープフェイク、大量殺傷を目的とした兵器についてはお手伝いできません。"
  ko: "미성년자가 관련된 성적 콘텐츠, 동의 없는 사적인 이미지, 실존 인물의 성적 딥페이크, 대량 살상 무기는 도와드릴 수 없습니다."
  it: "Non posso aiutare con contenuti sessuali che coinvolgono minori, immagini intime senza consenso, deepfake sessuali di persone reali o armi di distruzione di massa."
  tr: "Reşit olmayanları içeren cinsel içerik, rızasız mahrem görüntüler, gerçek kişilerin cinsel deepfake'leri veya kitlesel zarar silahları konusunda yardımcı olamam."
  vi: "Mình không thể giúp với nội dung tình dục liên quan đến trẻ vị thành niên, ảnh riêng tư không có sự đồng ý, deepfake tình dục về người thật hoặc vũ khí gây hại hàng loạt."
  id: "Saya tidak dapat membantu dengan konten seksual yang melibatkan anak di bawah umur, gambar intim tanpa persetujuan, deepfake seksual orang nyata, atau senjata pemusnah massal."
  pl: "Nie mogę pomóc w sprawie treści seksualnych z udziałem nieletnich, intymnych obrazów bez zgody, seksualnych deepfake'ów prawdziwych osób ani broni masowego rażenia."
  nl: "Hierbij kan ik niet helpen: seksuele inhoud met minderjarigen, intieme beelden zonder toestemming, seksuele deepfakes van echte mensen of wapens voor massale schade."
  ar: "لا يمكنني المساعدة في المحتوى الجنسي الذي يشمل قاصرين أو الصور الحميمة دون موافقة أو التزييف العميق الجنسي لأشخاص حقيقيين أو أسلحة الأذى الجماعي."
  hi: "मैं नाबालिगों से जुड़ी यौन सामग्री, बिना सहमति की निजी तस्वीरों, असली लोगों के यौन डीपफ़ेक या सामूहिक नुकसान वाले हथियारों में मदद नहीं कर सकता।"
  th: "ฉันช่วยเรื่องเนื้อหาทางเพศที่เกี่ยวกับผู้เยาว์ ภาพส่วนตัวที่ไม่ได้รับความยินยอม ดีปเฟกทางเพศของบุคคลจริง หรืออาวุธที่ก่อความเสียหายวงกว้างไม่ได้"
  cs: "S obsahem sexuálního charakteru s nezletilými, intimními snímky bez souhlasu, sexuálními deepfaky skutečných osob ani zbraněmi hromadného ničení pomoci nemohu."
  sv: "Jag kan inte hjälpa till med sexuellt innehåll med minderåriga, intima bilder utan samtycke, sexuella deepfakes av verkliga personer eller massförstörelsevapen."
  he: "אני לא יכול לעזור בתוכן מיני עם קטינים, תמונות אינטימיות ללא הסכמה, דיפפייק מיני של אנשים אמיתיים או נשק לפגיעה המונית."
  verified_by_human: []

live_site_abuse:
  context: "Polite decline when OpenMates itself is asked to take a mass or abusive action against a live website"
  en: "You probably do own that site, but I only do normal single-user actions at human speed on live websites, so I can't run mass or abusive actions like mass comments, sign-ups, password guessing or flooding. Such tests currently run only against localhost, a local dev environment or a locally run staging copy. I'm happy to help you set that up."
  de: "Du besitzt diese Seite vermutlich wirklich, aber auf Live-Websites führe ich nur normale Einzelnutzer-Aktionen in menschlichem Tempo aus und kann daher keine Massen- oder Missbrauchsaktionen wie Massenkommentare, Anmeldungen, Passwort-Raten oder Flooding ausführen. Solche Tests laufen derzeit nur gegen localhost, eine lokale Entwicklungsumgebung oder eine lokal betriebene Staging-Kopie. Ich helfe dir gern beim Einrichten."
  zh: "你很可能确实拥有该网站，但我在线上网站只执行普通的单用户、人类速度的操作，因此无法执行批量评论、批量注册、猜密码或洪泛等大规模或滥用性操作。这类测试目前只在 localhost、本地开发环境或本地运行的预发布副本上进行。我很乐意帮你搭建。"
  es: "Probablemente seas el dueño de ese sitio, pero en sitios en vivo solo hago acciones normales de un solo usuario a velocidad humana, así que no puedo ejecutar acciones masivas o abusivas como comentarios o registros en masa, adivinar contraseñas o saturar el sitio. Esas pruebas hoy solo se ejecutan contra localhost, un entorno de desarrollo local o una copia de staging local. Te ayudo a configurarlo."
  fr: "Vous êtes sans doute bien propriétaire de ce site, mais sur les sites en ligne je n'effectue que des actions normales d'un seul utilisateur à vitesse humaine ; je ne peux donc pas lancer d'actions massives ou abusives (commentaires ou inscriptions en masse, devinette de mots de passe, saturation). Ces tests ne tournent actuellement que sur localhost, un environnement de dev local ou une copie de staging locale. Je vous aide volontiers à le mettre en place."
  pt: "Provavelmente o site é mesmo seu, mas em sites ao vivo só faço ações normais de um único usuário em velocidade humana, então não posso executar ações em massa ou abusivas como comentários ou cadastros em massa, adivinhar senhas ou sobrecarregar. Esses testes hoje rodam apenas em localhost, num ambiente de desenvolvimento local ou numa cópia de staging local. Posso ajudar a configurar isso."
  ru: "Вероятно, этот сайт действительно ваш, но на действующих сайтах я выполняю только обычные действия одного пользователя с человеческой скоростью, поэтому не могу запускать массовые или злоупотребляющие действия: массовые комментарии, регистрации, подбор паролей, флуд. Такие тесты сейчас выполняются только на localhost, в локальной среде разработки или локально запущенной копии стейджинга. Помогу это настроить."
  ja: "そのサイトはおそらくあなたのものだと思いますが、公開中のサイトでは通常の一人分の操作を人の速度でしか行えないため、大量コメント、大量登録、パスワード推測、フラッドなどの大規模・乱用的な操作はできません。こうしたテストは現在 localhost、ローカル開発環境、ローカルで動かすステージングコピーでのみ実行されます。設定のお手伝いをします。"
  ko: "그 사이트는 아마 본인 소유일 것이지만, 실제 운영 중인 사이트에서는 사람 속도의 일반적인 단일 사용자 동작만 수행하므로 대량 댓글, 대량 가입, 비밀번호 추측, 플러딩 같은 대규모·남용 동작은 할 수 없습니다. 이러한 테스트는 현재 localhost, 로컬 개발 환경 또는 로컬에서 실행하는 스테이징 사본에서만 실행됩니다. 설정을 도와드릴게요."
  it: "Probabilmente il sito è davvero tuo, ma sui siti live eseguo solo azioni normali di un singolo utente a velocità umana, quindi non posso eseguire azioni di massa o abusive come commenti o iscrizioni in massa, tentativi di password o flooding. Questi test oggi girano solo su localhost, un ambiente di sviluppo locale o una copia di staging locale. Ti aiuto volentieri a configurarlo."
  tr: "Muhtemelen siteye gerçekten sahipsin, ancak canlı sitelerde yalnızca insan hızında normal tek kullanıcı eylemleri yapıyorum; bu yüzden toplu yorum, toplu kayıt, parola tahmini veya sel gibi toplu ya da kötüye kullanım eylemleri yapamam. Bu tür testler şu an yalnızca localhost, yerel geliştirme ortamı veya yerelde çalışan bir staging kopyasında yapılıyor. Kurmana yardımcı olurum."
  vi: "Có thể bạn đúng là chủ trang đó, nhưng trên các trang đang hoạt động mình chỉ thực hiện thao tác bình thường của một người dùng với tốc độ con người, nên không thể chạy hành động hàng loạt hoặc lạm dụng như bình luận, đăng ký hàng loạt, đoán mật khẩu hay làm quá tải. Các bài kiểm tra này hiện chỉ chạy trên localhost, môi trường dev cục bộ hoặc bản staging chạy cục bộ. Mình sẵn lòng giúp bạn thiết lập."
  id: "Anda mungkin memang pemilik situs itu, tetapi di situs live saya hanya melakukan tindakan normal satu pengguna dengan kecepatan manusia, jadi saya tidak dapat menjalankan tindakan massal atau abusif seperti komentar atau pendaftaran massal, menebak kata sandi, atau membanjiri. Pengujian semacam itu saat ini hanya berjalan di localhost, lingkungan dev lokal, atau salinan staging yang dijalankan secara lokal. Saya senang membantu menyiapkannya."
  pl: "Prawdopodobnie ta strona naprawdę jest Twoja, ale na działających stronach wykonuję tylko zwykłe działania jednego użytkownika w ludzkim tempie, więc nie mogę wykonywać działań masowych ani nadużyć, jak masowe komentarze, rejestracje, zgadywanie haseł czy zalewanie. Takie testy działają obecnie tylko na localhost, w lokalnym środowisku dev lub lokalnie uruchomionej kopii stagingowej. Chętnie pomogę to skonfigurować."
  nl: "Je bent waarschijnlijk echt de eigenaar van die site, maar op live websites doe ik alleen normale acties van één gebruiker op menselijk tempo, dus ik kan geen massale of misbruikende acties uitvoeren zoals massaal reageren, aanmelden, wachtwoorden raden of overspoelen. Zulke tests draaien nu alleen op localhost, een lokale ontwikkelomgeving of een lokaal draaiende staging-kopie. Ik help je graag met het opzetten."
  ar: "ربما تملك هذا الموقع فعلاً، لكنني على المواقع الحية أنفّذ فقط إجراءات عادية لمستخدم واحد بسرعة بشرية، لذلك لا أستطيع تنفيذ إجراءات جماعية أو مسيئة مثل التعليقات أو التسجيلات الجماعية أو تخمين كلمات المرور أو الإغراق. تُجرى هذه الاختبارات حالياً فقط على localhost أو بيئة تطوير محلية أو نسخة اختبار محلية. يسعدني مساعدتك في إعدادها."
  hi: "शायद वह साइट सच में आपकी है, लेकिन लाइव साइटों पर मैं केवल इंसानी गति से सामान्य एकल-उपयोगकर्ता काम करता हूँ, इसलिए मैं सामूहिक या दुरुपयोग वाले काम, जैसे बड़े पैमाने पर टिप्पणियाँ, साइन-अप, पासवर्ड अनुमान या फ़्लडिंग, नहीं कर सकता। ऐसे परीक्षण अभी केवल localhost, स्थानीय डेव वातावरण या स्थानीय स्टेजिंग कॉपी पर चलते हैं। इसे सेट अप करने में मैं मदद करूँगा।"
  th: "คุณน่าจะเป็นเจ้าของเว็บไซต์นั้นจริง แต่บนเว็บไซต์ที่ใช้งานจริงฉันทำเฉพาะการกระทำปกติของผู้ใช้คนเดียวด้วยความเร็วระดับมนุษย์ จึงทำการกระทำจำนวนมากหรือเข้าข่ายละเมิด เช่น คอมเมนต์หรือสมัครจำนวนมาก เดารหัสผ่าน หรือถล่มระบบไม่ได้ การทดสอบเช่นนี้ตอนนี้ทำได้เฉพาะบน localhost สภาพแวดล้อมพัฒนาในเครื่อง หรือสำเนา staging ที่รันในเครื่อง ยินดีช่วยตั้งค่าให้"
  cs: "Ten web pravděpodobně opravdu vlastníte, ale na živých webech provádím jen běžné akce jednoho uživatele lidským tempem, takže nemohu spouštět hromadné ani zneužívající akce jako hromadné komentáře, registrace, hádání hesel nebo zahlcení. Takové testy zatím běží jen proti localhostu, lokálnímu vývojovému prostředí nebo lokálně spuštěné staging kopii. Rád vám to pomohu nastavit."
  sv: "Du äger säkert den sajten, men på live-sajter gör jag bara normala handlingar för en enskild användare i mänskligt tempo, så jag kan inte köra massiva eller missbrukande handlingar som massor av kommentarer, registreringar, lösenordsgissning eller översvämning. Sådana tester körs för närvarande bara mot localhost, en lokal utvecklingsmiljö eller en lokalt körd staging-kopia. Jag hjälper dig gärna att sätta upp det."
  he: "כנראה שהאתר באמת שלך, אבל באתרים חיים אני מבצע רק פעולות רגילות של משתמש יחיד במהירות אנושית, ולכן לא אוכל לבצע פעולות המוניות או פוגעניות כמו תגובות או הרשמות המוניות, ניחוש סיסמאות או הצפה. בדיקות כאלה רצות כרגע רק מול localhost, סביבת פיתוח מקומית או עותק staging שרץ מקומית. אשמח לעזור לך להקים זאת."
  verified_by_human: []

