privacy_description:
  context: Attributed Google paid Gemini API processing disclosure shown before microphone capture
  en: Google processes your voice and the conversation context shared with this call. Google states that data sent through its paid Gemini API is not used to train its models.
  de: Google verarbeitet deine Stimme und den Gesprächskontext, der mit diesem Anruf geteilt wird. Google erklärt, dass Daten, die über seine kostenpflichtige Gemini API gesendet werden, nicht zum Trainieren seiner Modelle verwendet werden.
  verified_by_human: []
