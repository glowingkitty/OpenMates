  en: Attachments and app selections from the composer are not supported during calls yet. Ask to use an app in your message. Your draft is saved.
  de: Anhänge und App-Auswahlen im Eingabefeld werden während eines Anrufs noch nicht unterstützt. Bitte in deiner Nachricht darum, eine App zu nutzen. Dein Entwurf bleibt erhalten.
  verified_by_human: []
text_only_hint:
