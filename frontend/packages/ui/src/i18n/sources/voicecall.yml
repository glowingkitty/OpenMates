  en: 'Voice call: type a message or ask to use an app. Attachments are not available yet.'
  de: 'Sprachanruf: Schreibe eine Nachricht oder bitte darum, eine App zu nutzen. Anhänge sind noch nicht verfügbar.'
  verified_by_human: []
text_too_long:
  context: Bound call composer text exceeds live provider message limit
  en: Voice call messages can contain up to 8,000 characters. Your draft is preserved.
  de: Sprachnachrichten dürfen bis zu 8.000 Zeichen enthalten. Dein Entwurf bleibt erhalten.
  verified_by_human: []
recording_disabled:
