pricing_explanation:
  context: Accessible voice pricing explanation shown by expanding the pricing disclosure
  en: Charges depend on audio, replies and conversation context. Listening includes silence until automatic idle pauses audio input. Muting also pauses input charges; replies and processing can still cost credits. There is no flat fee for staying connected.
  de: Die Kosten hängen von Audio, Antworten und Gesprächskontext ab. Beim Zuhören zählt auch Stille, bis die automatische Ruhepause die Audioeingabe pausiert. Stummschalten pausiert ebenfalls die Eingabekosten; Antworten und Verarbeitung können weiterhin Credits kosten. Für die reine Verbindung gibt es keine Pauschalgebühr.
  verified_by_human: []
