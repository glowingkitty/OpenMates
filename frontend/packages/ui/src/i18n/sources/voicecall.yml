pricing_explanation:
  context: 'Accessible pricing disclosure: duration-based microphone transcription plus ordinary chat and generated speech
    usage'
  en: Microphone transcription is billed per started minute of streamed audio, plus normal AI chat and generated speech
    usage. Listening includes silence until automatic idle pauses audio input. Muting pauses microphone input charges;
    replies, skills and speech can still cost credits. There is no flat fee for staying connected.
  de: Die Mikrofon-Transkription wird pro angefangener Minute gestreamten Audios abgerechnet, zuzüglich der normalen KI-Chat-
    und Sprachausgabe-Nutzung. Beim Zuhören zählt auch Stille, bis die automatische Ruhepause die Audioeingabe pausiert.
    Stummschalten pausiert die Mikrofon-Eingabekosten; Antworten, Skills und Sprachausgabe können weiterhin Credits kosten.
    Für die reine Verbindung gibt es keine Pauschalgebühr.
