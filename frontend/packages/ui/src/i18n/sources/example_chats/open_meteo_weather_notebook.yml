  context: "user message 1 in example chat: Berlin Weekend Bike Weather Notebook. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Could you make me a Jupyter notebook for checking whether the next week in Berlin looks good for a weekend bike ride? I want it to use the free Open-Meteo forecast, pull hourly temperature, rain, wind, and cloud cover, turn that into a small pandas analysis with daily summaries, and include a couple of plots plus a short recommendation."
