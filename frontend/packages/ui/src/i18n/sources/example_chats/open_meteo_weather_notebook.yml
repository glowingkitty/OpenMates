message_1:
  context: "user message 1 in example chat: Open-Meteo weather notebook. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Create the actual Jupyter notebook file, not an outline. Emit exactly one fenced code artifact with this opening fence line: json:open_meteo_weather_analysis.ipynb. The artifact body must be valid nbformat 4 JSON with metadata, nbformat, nbformat_minor, and cells. Use markdown and Python code cells only. The notebook should pull the next 7 days of hourly weather data for Berlin from the free Open-Meteo API with no API key. Use Python requests and pandas to fetch temperature_2m, precipitation, wind_speed_10m, and cloud_cover, clean the JSON into a dataframe, calculate daily min/max temperature and total precipitation, plot the 7-day temperature trend and precipitation by day, and end with a short markdown explanation of what the forecast means for planning a weekend bike ride. Do not include prose outside the notebook artifact."
