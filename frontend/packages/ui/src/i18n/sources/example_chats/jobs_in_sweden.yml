message_1:
  context: 'user message 1 in example chat: Developer jobs in Sweden. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged.'
  en: Find two current software developer jobs in Stockholm and two in Malmö from Sweden’s public employment service. Show a short bullet for each with title, employer, workplace city and original listing link. Include a salary figure or working-from-home arrangement only if explicitly stated in that listing; otherwise say not stated. Keep the answer under 200 words.
  de: Finde zwei aktuelle Software-Entwickler-Jobs in Stockholm und zwei in Malmö beim schwedischen Arbeitsamt. Zeige für jeden Job einen kurzen Stichpunkt mit Titel, Arbeitgeber, Arbeitsort und Link zur Original-Ausschreibung. Gib Gehaltsangaben oder Homeoffice-Regelungen nur an, wenn sie explizit in der Ausschreibung stehen; andernfalls schreibe „nicht angegeben“. Halte die Antwort unter 200 Wörtern.
  zh: 从瑞典公共就业服务机构中查找两个斯德哥尔摩和两个马尔默的当前软件开发人员职位。为每个职位显示简短的列点，包括职位名称、雇主、工作城市和原始招聘链接。仅在招聘信息中明确说明的情况下包含薪资数据或居家办公安排；否则请说明未注明。请将回答控制在 200 字以内。
  es: Encuentra dos empleos actuales de desarrollador de software en Estocolmo y dos en Malmö del servicio público de empleo de Suecia. Muestra un breve punto para cada uno con el título, el empleador, la ciudad de trabajo y el enlace al anuncio original. Incluye una cifra salarial o la modalidad de teletrabajo solo si se indica explícitamente en ese anuncio; de lo contrario, di que no se especifica. Mantén la respuesta por debajo de las 200 palabras.
  fr: Trouve deux offres d'emploi actuelles de développeur logiciel à Stockholm et deux à Malmö via le service public de l'emploi suédois. Affiche une courte puce pour chacune avec le titre, l'employeur, la ville du lieu de travail et le lien vers l'annonce originale. Inclus un salaire ou une possibilité de télétravail uniquement si c'est explicitement mentionné dans l'annonce ; sinon, indique non précisé. Garde la réponse sous les 200 mots.
  pt: Encontra duas vagas atuais de desenvolvedor de software em Estocolmo e duas em Malmö no serviço público de emprego da Suécia. Mostra um tópico curto para cada uma com título, empregador, cidade do local de trabalho e link do anúncio original. Inclui um valor salarial ou regime de teletrabalho apenas se estiver explicitamente indicado nesse anúncio; caso contrário, diz não indicado. Mantém a resposta com menos de 200 palavras.
  ru: Найди две актуальные вакансии разработчика ПО в Стокгольме и две в Мальмё из государственной службы занятости Швеции. Составь краткий список с названием должности, работодателем, городом и ссылкой на оригинал. Указывай зарплату или возможность удаленной работы, только если это явно прописано в объявлении; в противном случае пиши «не указано». Ответ должен быть короче 200 слов.
  ja: スウェーデンの公共職業安定所から、ストックホルムのソフトウェア開発者の最新求人を2件、マルメの求人を2件探してください。それぞれについて、職種名、雇用主、勤務地、元の求人へのリンクを短い箇条書きで示してください。給与額や在宅勤務の取り決めについては、その求人に明記されている場合のみ含め、そうでない場合は「記載なし」としてください。回答は200語以内にまとめてください。
  ko: 스웨덴 공공 고용 서비스에서 스톡홀름의 최신 소프트웨어 개발자 일자리 2개와 말뫼의 일자리 2개를 찾아줘. 각 공고에 대해 직함, 고용주, 근무 도시, 원본 공고 링크를 포함한 짧은 불렛 포인트를 보여줘. 급여 수치나 재택근무 여부는 해당 공고에 명시된 경우에만 포함하고, 그렇지 않으면 '명시되지 않음'이라고 표시해줘. 답변은 200단어 이내로 작성해줘.
  it: Trova due attuali offerte di lavoro per sviluppatori software a Stoccolma e due a Malmö dal servizio pubblico per l'impiego svedese. Mostra un breve elenco puntato per ognuna con titolo, datore di lavoro, città della sede e link all'annuncio originale. Includi una cifra salariale o la possibilità di lavorare da casa solo se esplicitamente indicato nell'annuncio; altrimenti scrivi non specificato. Mantieni la risposta sotto le 200 parole.
  tr: İsveç kamu istihdam kurumundan Stokholm'de iki ve Malmö'de iki adet güncel yazılım geliştirici işi bul. Her biri için unvan, işveren, iş yeri şehri ve orijinal ilan bağlantısını içeren kısa bir madde göster. Maaş rakamını veya evden çalışma düzenini yalnızca o ilanda açıkça belirtilmişse dahil et; aksi takdirde belirtilmediğini söyle. Yanıtı 200 kelimenin altında tut.
  vi: Tìm hai công việc lập trình viên phần mềm hiện tại ở Stockholm và hai ở Malmö từ dịch vụ việc làm công của Thụy Điển. Hiển thị một gạch đầu dòng ngắn cho mỗi công việc với chức danh, nhà tuyển dụng, thành phố nơi làm việc và liên kết tin tuyển dụng gốc. Chỉ bao gồm con số tiền lương hoặc thỏa thuận làm việc tại nhà nếu được nêu rõ ràng trong tin tuyển dụng đó; nếu không, hãy ghi là không được nêu. Giữ câu trả lời dưới 200 từ.
  id: Temukan dua lowongan kerja pengembang perangkat lunak saat ini di Stockholm dan dua di Malmö dari layanan ketenagakerjaan publik Swedia. Tampilkan poin singkat untuk masing-masing lowongan yang berisi judul, pemberi kerja, kota tempat kerja, dan tautan iklan asli. Sertakan angka gaji atau pengaturan bekerja dari rumah hanya jika dinyatakan secara eksplisit dalam iklan tersebut; jika tidak, katakan tidak disebutkan. Pastikan jawaban kurang dari 200 kata.
  pl: Znajdź dwie aktualne oferty pracy dla programistów w Sztokholmie i dwie w Malmö ze szwedzkiego publicznego urzędu pracy. Przedstaw każdą w krótkim punkcie, podając stanowisko, pracodawcę, miasto i link do oryginalnego ogłoszenia. Podaj wysokość wynagrodzenia lub informację o pracy zdalnej tylko wtedy, gdy są wyraźnie określone w ogłoszeniu; w przeciwnym razie napisz „nie podano”. Odpowiedź powinna mieć mniej niż 200 słów.
  nl: Vind twee actuele software developer-banen in Stockholm en twee in Malmö via de Zweedse openbare arbeidsvoorziening. Toon voor elke baan een kort opsommingsteken met de titel, werkgever, stad van de werkplek en de link naar de originele vacature. Vermeld alleen een salarisindicatie of regeling voor thuiswerken als dit expliciet in die vacature staat; zeg anders 'niet vermeld'. Houd het antwoord onder de 200 woorden.
  ar: ابحث عن وظيفتين حاليتين لمطور برمجيات في ستوكهولم ووظيفتين في مالمو من خدمة التوظيف العامة في السويد. اعرض نقطة قصيرة لكل منها تتضمن المسمى الوظيفي، وصاحب العمل، ومدينة مكان العمل، ورابط القائمة الأصلي. قم بتضمين رقم الراتب أو ترتيبات العمل من المنزل فقط إذا تم ذكر ذلك صراحةً في تلك القائمة؛ وإلا فقل "غير محدد". اجعل الإجابة أقل من 200 كلمة.
  hi: स्वीडन की सार्वजनिक रोजगार सेवा से स्टॉकहोम में दो और माल्मो में दो वर्तमान सॉफ्टवेयर डेवलपर नौकरियां खोजें। प्रत्येक के लिए शीर्षक, नियोक्ता, कार्यस्थल शहर और मूल लिस्टिंग लिंक के साथ एक छोटा बुलेट दिखाएं। वेतन का आंकड़ा या घर से काम करने की व्यवस्था तभी शामिल करें जब उस लिस्टिंग में स्पष्ट रूप से बताया गया हो; अन्यथा 'उल्लेख नहीं है' कहें। उत्तर को 200 शब्दों से कम रखें।
  th: ค้นหางานนักพัฒนาซอฟต์แวร์ปัจจุบัน 2 ตำแหน่งในสตอกโฮล์ม และ 2 ตำแหน่งในมัลเมอ จากบริการจัดหางานสาธารณะของสวีเดน แสดงรายการแบบหัวข้อสั้นๆ สำหรับแต่ละงาน โดยระบุชื่อตำแหน่ง, นายจ้าง, เมืองที่ทำงาน และลิงก์ประกาศรับสมัครงานต้นฉบับ ระบุตัวเลขเงินเดือนหรือการทำงานจากที่บ้านเฉพาะในกรณีที่มีการระบุไว้อย่างชัดเจนในประกาศนั้นเท่านั้น มิฉะนั้นให้ระบุว่าไม่ได้ระบุไว้ ตอบให้มีความยาวไม่เกิน 200 คำ
  cs: Najdi dvě aktuální pracovní pozice pro softwarové vývojáře ve Stockholmu a dvě v Malmö ze švédských veřejných služeb zaměstnanosti. U každé uveď krátký bod s názvem, zaměstnavatelem, městem pracoviště a odkazem na původní inzerát. Údaj o platu nebo možnosti práce z domova uveď pouze tehdy, pokud je v daném inzerátu výslovně uveden; jinak uveď, že není uveden. Odpověď udrž pod 200 slov.
  sv: Hitta två aktuella jobb som mjukvaruutvecklare i Stockholm och två i Malmö från Arbetsförmedlingen. Visa en kort punktlista för varje med titel, arbetsgivare, arbetsort och länk till originalannonsen. Inkludera lön eller möjlighet till distansarbete endast om det uttryckligen anges i annonsen; annars skriv att det inte anges. Håll svaret under 200 ord.
  he: מצא שתי משרות פיתוח תוכנה עדכניות בסטוקהולם ושתיים במאלמה משירות התעסוקה הציבורי של שוודיה. הצג בולט קצר עבור כל אחת עם כותרת, מעסיק, עיר העבודה וקישור למודעה המקורית. כלול נתון שכר או הסדר עבודה מהבית רק אם הם צוינו במפורש באותה מודעה; אחרת ציין שלא צוין. שמור על תשובה קצרה מ-200 מילים.
  verified_by_human: []
