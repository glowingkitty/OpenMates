    ```json
    {"type":"app_skill_use","embed_id":"fdd36382-ab98-4922-b4a4-aeeb1ea1c67e","app_id":"social_media","skill_id":"get-posts"}
    ```

    Mastodon 官方 @Mastodon 账号近期在 [Mastodon](wiki:Mastodon_(social_network)) 上发布的公开帖子围绕几个核心主题展开：

    ---

    ### 1. 平台重新设计与即将推出的功能（Mastodon 5.0）
    一个主要重点是分享用户体验研究，并介绍即将到来的设计变化：
    - **Mastodon 5.0 抢先看：** 提前了解 5.0 版本，重点展示更简洁宁静的布局、新的视觉风格，以及更新后的帖子编辑器（[Mastodon 5.0 抢先看](embed:mastodon-after-publishing-WqJ)）。
    - **探索周成果：** 分享设计团队开展的用户工作坊和调查的成果，以更好地了解社区如何与平台互动（[探索周总结](embed:mastodon-we-re-5Ll)）。

    ### 2. 治理与商标政策的明确化
    Mastodon 着重回应社区对项目政策的关切：
    - **商标政策指南：** 根据社区反馈，发布更新后更明确的指南，以及用通俗语言撰写的 Mastodon 商标政策摘要（[商标指南公告](embed:mastodon-today-we-3Kb)）。

    ### 3. 社区亮点与生态系统支持
    重点介绍更广泛的 [联邦宇宙](wiki:Fediverse) 生态系统、服务器运营者和安全倡议：
    - **特色服务器介绍：** 推广 *Earth.Law* 等专门实例，这是一个为环境律师、科学家和行动者打造的环保服务器（[Earth.Law 服务器介绍](embed:mastodon-here-is-miz)）。
    - **生态系统调查：** 推广 IFTAS 社交网络运营调查等管理倡议，以支持内容版主和管理员（[IFTAS 调查帖子](embed:mastodon-re-https-wnD)）。

    ### 4. 组织与团队更新
    公开说明团队变动和领导层情况：
    - **领导成员告别：** 宣布社区总监兼董事会成员 Hannah Aubry 离任，并感谢她为社区发展作出的贡献（[Hannah Aubry 告别帖子](embed:mastodon-hannah-aubry-O6F)）。

    ### 5. 项目资金与周边商品
    支持网络的开源开发持续开展：
    - **Plushtodon 预订：** 宣布商店推出新配色的毛绒吉祥物，让支持者能够直接资助开发（[Plushtodon 预订帖子](embed:mastodon-new-plushtodon-7D2)）。

    ---

    ### 精选示例

    [@Mastodon：发布探索周的成果后，我们现在可以为大家带来首次抢先预览](embed:mastodon-after-publishing-WqJ)
    [@Mastodon：今天，我们分享有关商标政策的补充指南，依据的是……](embed:mastodon-today-we-3Kb)
    [@Mastodon：新配色的 #Plushtodon 现已可在我们的商店预订！这是一种方式](embed:mastodon-new-plushtodon-7D2)
