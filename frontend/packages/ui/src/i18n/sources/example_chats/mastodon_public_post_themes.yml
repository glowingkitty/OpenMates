    ### 1. Zásadní vývoj produktu a uživatelský průzkum
    Hlavním tématem byla příprava na **Mastodon 5.0**, která navazuje na celokomunitní výzkumnou iniciativu „Discovery Week“ vedenou jejich designovým týmem. Tým sdílel náhledy přepracovaného, klidnějšího rozhraní a aktualizovaného editoru příspěvků, jejichž cílem je učinit platformu přístupnější a uživatelsky přívětivější.

    ### 2. Správa komunity, zásady a personální novinky
    Mastodon pravidelně informuje o novinkách v oblasti správy a zásad, zejména o vydání upřesňujících pokynů k **ochranným známkám** v přímé reakci na zpětnou vazbu od správců a vývojářů fediversu. Oznámili také klíčové změny ve vedení a poděkovali odcházející komunitní ředitelce Hannah Aubry za její přínos.

    ### 3. Představení serverů a ekosystém fediversu
    Účet aktivně propaguje nezávislé instance fediversu a infrastrukturní iniciativy – například vyzdvihuje tematické servery (jako Earth.Law) a šíří oborové průzkumy, jako je provozní výzkum IFTAS.

    ### 4. Komunitní merch a financování projektu
    Na podporu probíhajícího vývoje open-source sdílejí novinky o oficiálním komunitním merchi, včetně vydání nových plyšových maskotů („Plushtodons“).

