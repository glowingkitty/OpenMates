    - **Hướng dẫn Chính sách Thương hiệu:** Phát hành các hướng dẫn được cập nhật, làm rõ và các bản tóm tắt bằng ngôn ngữ dễ hiểu liên quan đến chính sách thương hiệu của Mastodon sau khi tiếp nhận ý kiến đóng góp từ cộng đồng ([Trademark guidelines announcement](embed:mastodon-today-we-3Kb)).

    ### 3. Tiêu điểm Cộng đồng & Hỗ trợ Hệ sinh thái
    Làm nổi bật hệ sinh thái [Fediverse](wiki:Fediverse) rộng lớn hơn, các nhà vận hành máy chủ và các sáng kiến an toàn:
