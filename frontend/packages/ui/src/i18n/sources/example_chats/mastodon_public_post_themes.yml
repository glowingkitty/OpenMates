    `mastodon.social`의 공식 @Mastodon 계정은 최근 공개 게시물에서 몇 가지 핵심 테마를 강조하고 있습니다:

    ### 1. 주요 제품 진화 및 사용자 연구
    디자인 팀이 주도한 커뮤니티 전반의 "Discovery Week" 연구 이니셔티브에 이어, **Mastodon 5.0**을 위한 기초 작업이 주요 초점이 되었습니다. 팀은 플랫폼을 더 접근하기 쉽고 사용자 친화적으로 만들기 위해 재설계된 차분한 인터페이스와 업데이트된 작성기(composer)의 미리보기를 공유했습니다.

    ### 2. 커뮤니티 거버넌스, 정책 및 직원 업데이트
    Mastodon은 거버넌스 및 정책 업데이트를 정기적으로 소통하며, 특히 페디버스 관리자 및 개발자의 피드백에 직접 대응하여 **상표권 정책(Trademark Policy)**에 관한 명확한 가이드라인을 발표했습니다. 또한 주요 리더십 전환을 발표하며, 퇴임하는 커뮤니티 디렉터 Hannah Aubry의 공헌에 감사를 표했습니다.

    ### 3. 서버 스포트라이트 및 페디버스 생태계
    이 계정은 독립적인 페디버스 인스턴스 및 인프라 이니셔티브를 적극적으로 홍보합니다. 예를 들어 테마 서버(Earth.Law 등)를 강조하거나 IFTAS 운영 연구와 같은 업계 설문 조사를 널리 알립니다.

    ### 4. 커뮤니티 굿즈 및 프로젝트 자금 조달
    지속적인 오픈 소스 개발을 지원하기 위해 새로운 인형 마스코트 출시("Plushtodons")를 포함한 공식 커뮤니티 굿즈 업데이트를 공유합니다.

