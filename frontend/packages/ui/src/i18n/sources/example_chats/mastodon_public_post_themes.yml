    Akun resmi @Mastodon di `mastodon.social` menyoroti beberapa tema utama dalam postingan publik terbarunya:

    ### 1. Evolusi Produk Utama & Riset Pengguna
    Fokus utamanya adalah persiapan untuk **Mastodon 5.0**, menyusul inisiatif riset "Discovery Week" di seluruh komunitas yang dipimpin oleh tim desain mereka. Tim tersebut membagikan pratinjau antarmuka yang didesain ulang dan lebih tenang, serta komposer yang diperbarui yang bertujuan untuk membuat platform ini lebih mudah diakses dan ramah pengguna.

    ### 2. Tata Kelola Komunitas, Kebijakan & Pembaruan Staf
    Mastodon secara rutin mengomunikasikan pembaruan tata kelola dan kebijakan, terutama merilis panduan klarifikasi seputar **Kebijakan Merek Dagang** mereka sebagai tanggapan langsung terhadap masukan admin dan pengembang fediverse. Mereka juga mengumumkan transisi kepemimpinan utama, berterima kasih kepada direktur komunitas yang akan segera mengakhiri masa jabatannya, Hannah Aubry, atas kontribusinya.

    ### 3. Sorotan Server & Ekosistem Fediverse
    Akun tersebut secara aktif mempromosikan instansi fediverse independen dan inisiatif infrastruktur—seperti menyoroti server bertema (seperti Earth.Law) dan memperluas jangkauan survei industri seperti riset operasi IFTAS.

    ### 4. Merchandise Komunitas & Pendanaan Proyek
    Untuk mendukung pengembangan sumber terbuka yang sedang berlangsung, mereka membagikan pembaruan merchandise resmi komunitas, termasuk rilis maskot boneka baru ("Plushtodons").

