    ---

    ### 1. การออกแบบแพลตฟอร์มใหม่และฟีเจอร์ที่กำลังจะมาถึง (Mastodon 5.0)
    จุดเน้นสำคัญคือการแบ่งปันงานวิจัยเกี่ยวกับประสบการณ์ผู้ใช้และการเปิดตัวการเปลี่ยนแปลงการออกแบบที่กำลังจะเกิดขึ้น:
    - **ตัวอย่าง Mastodon 5.0:** การดูตัวอย่างเวอร์ชัน 5.0 ในช่วงแรก โดยเน้นที่เลย์เอาต์ที่ดูสบายตาขึ้น ความสวยงามแบบใหม่ และเครื่องมือเขียนโพสต์ที่อัปเดต ([ตัวอย่าง Mastodon 5.0](embed:mastodon-after-publishing-WqJ))
    - **ผลลัพธ์จาก Discovery Week:** การแบ่งปันผลลัพธ์จากเวิร์กช็อปและการสำรวจผู้ใช้ที่นำโดยทีมออกแบบ เพื่อทำความเข้าใจวิธีที่ชุมชนโต้ตอบกับแพลตฟอร์มได้ดียิ่งขึ้น ([สรุป Discovery Week](embed:mastodon-we-re-5Ll))

    ### 2. ธรรมาภิบาลและความชัดเจนของเครื่องหมายการค้า
    Mastodon ให้ความสำคัญกับการตอบสนองต่อข้อกังวลของชุมชนเกี่ยวกับนโยบายของโปรเจกต์:
    - **แนวทางนโยบายเครื่องหมายการค้า:** การเผยแพร่แนวทางที่อัปเดตและชัดเจน พร้อมสรุปด้วยภาษาที่เข้าใจง่ายเกี่ยวกับนโยบายเครื่องหมายการค้าของ Mastodon หลังจากได้รับความคิดเห็นจากชุมชน ([ประกาศแนวทางเครื่องหมายการค้า](embed:mastodon-today-we-3Kb))

