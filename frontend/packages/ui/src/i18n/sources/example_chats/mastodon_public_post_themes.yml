    Mastodon thường xuyên thông báo các cập nhật về quản trị và chính sách, đáng chú ý là việc phát hành các hướng dẫn làm rõ về **Chính sách Nhãn hiệu** để phản hồi trực tiếp các ý kiến đóng góp từ quản trị viên và nhà phát triển fediverse. Họ cũng thông báo về những chuyển đổi nhân sự chủ chốt, gửi lời cảm ơn đến giám đốc cộng đồng sắp mãn nhiệm Hannah Aubry vì những đóng góp của cô.

