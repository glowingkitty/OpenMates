    ---

    ### 1. Riprogettazione della piattaforma e funzionalità in arrivo (Mastodon 5.0)
    Un obiettivo principale è stato la condivisione della ricerca sull'esperienza utente e la presentazione delle imminenti modifiche al design:
    - **Anteprima di Mastodon 5.0:** Uno sguardo in anteprima alla versione 5.0, che mette in risalto un layout più calmo, una nuova estetica visiva e un compositore di post aggiornato ([Anteprima di Mastodon 5.0](embed:mastodon-after-publishing-WqJ)).
    - **Risultati della Discovery Week:** Condivisione dei risultati dei workshop e dei sondaggi tra gli utenti condotti dal team di design per comprendere meglio come la community interagisce con la piattaforma ([Riepilogo della Discovery Week](embed:mastodon-we-re-5Ll)).

    ### 2. Governance e chiarezza sui marchi registrati
    Mastodon si è concentrato sulla risposta alle preoccupazioni della community riguardanti le policy del progetto:
    - **Linee guida sulla policy dei marchi:** Pubblicazione di linee guida aggiornate e chiarite e riepiloghi in linguaggio semplice riguardanti le policy sui marchi di Mastodon a seguito dei feedback della community ([Annuncio delle linee guida sui marchi](embed:mastodon-today-we-3Kb)).

    ### 3. Riflettori sulla community e supporto all'ecosistema
    Valorizzazione del più ampio ecosistema del [Fediverse](wiki:Fediverse), dei gestori di server e delle iniziative per la sicurezza:
    - **Riflettori sui server in evidenza:** Promozione di istanze dedicate come *Earth.Law*, un server eco-friendly su misura per avvocati ambientalisti, scienziati e attivisti ([In evidenza: server Earth.Law](embed:mastodon-here-is-miz)).
    - **Sondaggi sull'ecosistema:** Promozione di iniziative amministrative come l'IFTAS Social Web Operations Survey per supportare moderatori e amministratori ([Post sul sondaggio IFTAS](embed:mastodon-re-https-wnD)).

    ### 4. Aggiornamenti organizzativi e del team
    Trasparenza sulle transizioni del team e sulla leadership:
    - **Addio alla leadership:** Riconoscimento della partenza della Community Director e membro del consiglio Hannah Aubry, ringraziandola per il suo contributo alla crescita della community ([Post di addio a Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Finanziamento del progetto e merchandise
    Sostegno allo sviluppo open source della rete:
    - **Pre-ordini di Plushtodon:** Annuncio di nuovi colori per la mascotte di peluche nel negozio per consentire ai sostenitori di aiutare a finanziare direttamente lo sviluppo ([Post sui pre-ordini di Plushtodon](embed:mastodon-new-plushtodon-7D2)).

