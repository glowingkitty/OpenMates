    Recent public posts from the official @Mastodon account on [Mastodon](wiki:Mastodon_(social_network)) revolve around several core themes:

    ---

    ### 1. Platform Redesign & Upcoming Features (Mastodon 5.0)
    A major focus has been sharing user experience research and unveiling upcoming design changes:
    - **Mastodon 5.0 Sneak Peek:** An early look into version 5.0, highlighting a calmer layout, a new visual aesthetic, and an updated post composer ([Mastodon 5.0 sneak peek](embed:mastodon-after-publishing-WqJ)).
    - **Discovery Week Findings:** Sharing outcomes from user workshops and surveys led by the design team to better understand how the community interacts with the platform ([Discovery Week summary](embed:mastodon-we-re-5Ll)).

    ### 2. Governance & Trademark Clarity
    Mastodon has focused on addressing community concerns regarding project policies:
    - **Trademark Policy Guidelines:** Releasing updated, clarified guidelines and plain-language summaries concerning Mastodon's trademark policies following community input ([Trademark guidelines announcement](embed:mastodon-today-we-3Kb)).

    ### 3. Community Spotlights & Ecosystem Support
    Highlighting the broader [Fediverse](wiki:Fediverse) ecosystem, server operators, and safety initiatives:
    - **Featured Server Spotlight:** Promoting dedicated instances such as *Earth.Law*, an eco-friendly server tailored to environmental lawyers, scientists, and activists ([Earth.Law server highlight](embed:mastodon-here-is-miz)).
    - **Ecosystem Surveys:** Boosting administrative initiatives like the IFTAS Social Web Operations Survey to support moderators and administrators ([IFTAS survey post](embed:mastodon-re-https-wnD)).

    ### 4. Organizational & Team Updates
    Transparency around team transitions and leadership:
    - **Farewell to Leadership:** Acknowledging the departure of Community Director and board member Hannah Aubry, thanking her for her contributions to community growth ([Hannah Aubry farewell post](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Project Funding & Merchandise
    Sustaining the open-source development of the network:
    - **Plushtodon Pre-Orders:** Announcing new plush mascot colors in the shop to allow supporters to help fund development directly ([Plushtodon pre-orders post](embed:mastodon-new-plushtodon-7D2)).

    ---

    ### Highlighted Examples

    [@Mastodon: After publishing the results of Discovery Week, we can now give you a first snea](embed:mastodon-after-publishing-WqJ)
    [@Mastodon: Today we're sharing additional guidelines about our Trade Mark Policy based on c](embed:mastodon-today-we-3Kb)
    [@Mastodon: New #Plushtodon colours now available for pre-orders on our shop! This is a way](embed:mastodon-new-plushtodon-7D2)
  de: |
    ```json
    {"type":"app_skill_use","embed_id":"fdd36382-ab98-4922-b4a4-aeeb1ea1c67e","app_id":"social_media","skill_id":"get-posts"}
    ```

    Aktuelle öffentliche Beiträge vom offiziellen @Mastodon-Account auf [Mastodon](wiki:Mastodon_(social_network)) drehen sich um mehrere Kernthemen:

    ---

    ### 1. Plattform-Redesign & kommende Funktionen (Mastodon 5.0)
    Ein Schwerpunkt lag auf dem Teilen von Nutzererfahrungsforschung und der Vorstellung kommender Designänderungen:
    - **Mastodon 5.0 Sneak Peek:** Ein erster Einblick in Version 5.0, der ein ruhigeres Layout, eine neue visuelle Ästhetik und einen aktualisierten Beitragseditor hervorhebt ([Mastodon 5.0 Sneak Peek](embed:mastodon-after-publishing-WqJ)).
    - **Ergebnisse der Discovery Week:** Teilen von Ergebnissen aus Nutzer-Workshops und Umfragen des Designteams, um besser zu verstehen, wie die Community mit der Plattform interagiert ([Zusammenfassung der Discovery Week](embed:mastodon-we-re-5Ll)).

    ### 2. Governance & Marken-Klarheit
    Mastodon hat sich darauf konzentriert, Bedenken der Community bezüglich der Projektrichtlinien anzusprechen:
    - **Markenrichtlinien:** Veröffentlichung aktualisierter, präzisierter Richtlinien und Zusammenfassungen in einfacher Sprache zu Mastodons Markenrichtlinien nach Rückmeldungen aus der Community ([Ankündigung der Markenrichtlinien](embed:mastodon-today-we-3Kb)).

    ### 3. Community-Spotlights & Unterstützung des Ökosystems
    Hervorhebung des breiteren [Fediverse](wiki:Fediverse)-Ökosystems, der Serverbetreiber und Sicherheitsinitiativen:
    - **Server-Spotlight:** Bewerbung spezieller Instanzen wie *Earth.Law*, ein umweltfreundlicher Server für Umweltanwälte, Wissenschaftler und Aktivisten ([Earth.Law Server-Highlight](embed:mastodon-here-is-miz)).
    - **Ökosystem-Umfragen:** Unterstützung administrativer Initiativen wie der IFTAS Social Web Operations Survey zur Unterstützung von Moderatoren und Administratoren ([IFTAS-Umfrage-Beitrag](embed:mastodon-re-https-wnD)).

    ### 4. Organisations- & Team-Updates
    Transparenz bei Team-Übergängen und Führung:
    - **Abschied aus der Führungsebene:** Anerkennung des Ausscheidens von Community Director und Vorstandsmitglied Hannah Aubry, mit Dank für ihre Beiträge zum Community-Wachstum ([Abschiedsbeitrag für Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Projektfinanzierung & Merchandise
    Sicherung der Open-Source-Entwicklung des Netzwerks:
    - **Plushtodon-Vorbestellungen:** Ankündigung neuer Farben für das Plüsch-Maskottchen im Shop, damit Unterstützer die Entwicklung direkt mitfinanzieren können ([Beitrag zu Plushtodon-Vorbestellungen](embed:mastodon-new-plushtodon-7D2)).

    ---

    ### Hervorgehobene Beispiele

    [@Mastodon: Nach der Veröffentlichung der Ergebnisse der Discovery Week können wir euch nun einen ersten Einbl](embed:mastodon-after-publishing-WqJ)
    [@Mastodon: Heute teilen wir zusätzliche Richtlinien zu unserer Markenrichtlinie basierend auf C](embed:mastodon-today-we-3Kb)
    [@Mastodon: Neue #Plushtodon-Farben jetzt zur Vorbestellung in unserem Shop verfügbar! Dies ist eine Mögl](embed:mastodon-new-plushtodon-7D2)
