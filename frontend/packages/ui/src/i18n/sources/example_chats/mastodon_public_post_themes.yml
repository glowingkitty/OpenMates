    Det officiella @Mastodon-kontot på `mastodon.social` lyfter fram flera centrala teman i sina senaste offentliga inlägg:

    ### 1. Större produktutveckling och användarundersökningar
    Ett huvudfokus har varit grundarbetet för **Mastodon 5.0**, efter deras gemenskapsövergripande forskningsinitiativ "Discovery Week" som leddes av deras designteam. Teamet delade förhandsvisningar av ett omdesignat, lugnare gränssnitt och en uppdaterad inläggsskapare som syftar till att göra plattformen mer tillgänglig och användarvänlig.

    ### 2. Gemenskapens styrning, policyer och personaluppdateringar
    Mastodon kommunicerar regelbundet uppdateringar kring styrning och policyer, och har bland annat släppt förtydligande riktlinjer kring sin **varumärkespolicy** som ett direkt svar på feedback från fediverse-administratörer och utvecklare. De meddelade också viktiga ledarskapsförändringar och tackade den avgående community-direktören Hannah Aubry för hennes insatser.

    ### 3. Serverfokus och fediverse-ekosystemet
    Kontot främjar aktivt oberoende fediverse-instanser och infrastrukturinitiativ – till exempel genom att lyfta fram servrar med specifika teman (som Earth.Law) och sprida branschundersökningar som IFTAS verksamhetsforskning.

    ### 4. Gemenskapens merchandise och projektfinansiering
    För att stödja den pågående utvecklingen av öppen källkod delar de uppdateringar om officiell merchandise, inklusive nya mjukdjursmaskotar ("Plushtodons").

