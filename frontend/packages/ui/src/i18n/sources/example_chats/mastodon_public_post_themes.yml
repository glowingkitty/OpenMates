    החשבון הרשמי של @Mastodon ב-`mastodon.social` מדגיש מספר נושאים מרכזיים בפוסטים הציבוריים האחרונים שלו:

    ### 1. אבולוציה משמעותית של המוצר ומחקר משתמשים
    מוקד מרכזי היה עבודת התשתית עבור **Mastodon 5.0**, בעקבות יוזמת המחקר הקהילתית "Discovery Week" בהובלת צוות העיצוב שלהם. הצוות שיתף תצוגות מקדימות של ממשק מעוצב מחדש ורגוע יותר ושל חלון כתיבת פוסטים מעודכן, במטרה להפוך את הפלטפורמה לנגישה וידידותית יותר למשתמש.

    ### 2. ממשל קהילתי, מדיניות ועדכוני צוות
    Mastodon מתקשרת באופן קבוע עדכוני ממשל ומדיניות, ובמיוחד פרסמה הנחיות הבהרה סביב **מדיניות סימני המסחר** שלה בתגובה ישירה למשוב ממנהלי פדיברס ומפתחים. הם גם הודיעו על מעברי מנהיגות מרכזיים, והודו למנהלת הקהילה היוצאת האנה אוברי על תרומתה.

    ### 3. זרקור על שרתים ואקוסיסטם הפדיברס
    החשבון מקדם באופן פעיל שרתי פדיברס עצמאיים ויוזמות תשתית — כגון הדגשת שרתים נושאיים (כמו Earth.Law) והפצת סקרי תעשייה כמו מחקר התפעול של IFTAS.

    ### 4. מרצ'נדייז קהילתי ומימון פרויקטים
    כדי לתמוך בפיתוח הקוד הפתוח המתמשך, הם משתפים עדכונים על מרצ'נדייז רשמי של הקהילה, כולל השקות חדשות של בובות קטיפה של הקמע ("Plushtodons").

    ---

    ### שלושה פוסטים מייצגים

    - **מפת דרכים של המוצר ורענון ויזואלי:** [הכרזה על הצצה ל-Mastodon 5.0](embed:mastodon-after-publishing-D8d) — משתף תצוגה מקדימה של פריסת 5.0 הקרובה וחלון כתיבת הפוסטים בהתבסס על ממצאי המחקר.
    - **מדיניות ומשוב קהילתי:** [עדכון הנחיות מדיניות סימני מסחר](embed:mastodon-today-we-YqD) — מפרט כללי סימני מסחר מעודכנים שהותאמו על סמך קלט מהקהילה.
    - **תמיכה בפרויקט ומרצ'נדייז:** [הכרזה על מכירה מוקדמת של Plushtodon](embed:mastodon-new-plushtodon-A57) — מכריז על קמעות קטיפה רשמיים חדשים כדרך לתומכים לממן את הפיתוח.

