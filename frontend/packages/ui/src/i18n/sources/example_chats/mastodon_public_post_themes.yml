    De senaste offentliga inläggen från det officiella @Mastodon-kontot på [Mastodon](wiki:Mastodon_(social_network)) kretsar kring flera centrala teman:

    ---

    ### 1. Ny plattformsdesign och kommande funktioner (Mastodon 5.0)
    Ett stort fokus har varit att dela forskning om användarupplevelser och presentera kommande designförändringar:
    - **Förhandstitt på Mastodon 5.0:** En tidig inblick i version 5.0, med fokus på en lugnare layout, ett nytt visuellt uttryck och en uppdaterad inläggsredigerare ([Förhandstitt på Mastodon 5.0](embed:mastodon-after-publishing-WqJ)).
    - **Resultat från Discovery Week:** Resultat från användarworkshoppar och enkäter som designteamet har genomfört för att bättre förstå hur gemenskapen använder plattformen ([Sammanfattning av Discovery Week](embed:mastodon-we-re-5Ll)).

    ### 2. Styrning och tydligare varumärkespolicy
    Mastodon har fokuserat på att bemöta gemenskapens farhågor kring projektets policyer:
    - **Riktlinjer för varumärkespolicyn:** Uppdaterade och förtydligade riktlinjer samt sammanfattningar på klarspråk om Mastodons varumärkespolicyer, framtagna efter synpunkter från gemenskapen ([Tillkännagivande om varumärkesriktlinjer](embed:mastodon-today-we-3Kb)).

    ### 3. Gemenskapen i fokus och stöd till ekosystemet
    Uppmärksamhet på det bredare [Fediverse](wiki:Fediverse)-ekosystemet, serveroperatörer och säkerhetsinitiativ:
    - **Utvald server i fokus:** Marknadsföring av specialiserade instanser som *Earth.Law*, en miljövänlig server anpassad för miljöjurister, forskare och aktivister ([Presentation av Earth.Law-servern](embed:mastodon-here-is-miz)).
    - **Enkäter om ekosystemet:** Spridning av administrativa initiativ som IFTAS enkät om drift av den sociala webben för att stödja moderatorer och administratörer ([Inlägg om IFTAS-enkäten](embed:mastodon-re-https-wnD)).

    ### 4. Organisations- och teamuppdateringar
    Öppenhet kring förändringar i teamet och ledningen:
    - **Avsked till en ledare:** Uppmärksammande av att gemenskapsansvariga chefen och styrelseledamoten Hannah Aubry lämnar, med tack för hennes bidrag till gemenskapens tillväxt ([Avskedsinlägg för Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Projektfinansiering och profilprodukter
    Stöd till fortsatt utveckling av nätverket med öppen källkod:
    - **Förbeställningar av Plushtodon:** Tillkännagivande av nya färger på den mjuka maskoten i butiken, så att supportrar kan bidra direkt till att finansiera utvecklingen ([Inlägg om förbeställningar av Plushtodon](embed:mastodon-new-plushtodon-7D2)).

    ---

    ### Utvalda exempel

    [@Mastodon: Efter att ha publicerat resultaten från Discovery Week kan vi nu ge er en första förhandstitt](embed:mastodon-after-publishing-WqJ)
    [@Mastodon: I dag delar vi ytterligare riktlinjer om vår varumärkespolicy baserat på …](embed:mastodon-today-we-3Kb)
    [@Mastodon: Nya #Plushtodon-färger kan nu förbeställas i vår butik! Det här är ett sätt](embed:mastodon-new-plushtodon-7D2)
  he: |-
    ```json
    {"type":"app_skill_use","embed_id":"fdd36382-ab98-4922-b4a4-aeeb1ea1c67e","app_id":"social_media","skill_id":"get-posts"}
    ```

    הפוסטים הציבוריים האחרונים מהחשבון הרשמי @Mastodon ב-[Mastodon](wiki:Mastodon_(social_network)) עוסקים בכמה נושאים מרכזיים:

    ---

    ### 1. עיצוב מחדש של הפלטפורמה ותכונות עתידיות (Mastodon 5.0)
    מוקד מרכזי היה שיתוף מחקרים על חוויית המשתמש וחשיפת שינויי עיצוב עתידיים:
    - **הצצה ל-Mastodon 5.0:** מבט מוקדם על גרסה 5.0, המדגיש פריסה רגועה יותר, מראה חזותי חדש ועורך פוסטים מעודכן ([הצצה ל-Mastodon 5.0](embed:mastodon-after-publishing-WqJ)).
    - **ממצאי שבוע הגילוי:** שיתוף תוצאות מסדנאות משתמשים ומסקרים בהובלת צוות העיצוב, כדי להבין טוב יותר כיצד הקהילה משתמשת בפלטפורמה ([סיכום שבוע הגילוי](embed:mastodon-we-re-5Ll)).

    ### 2. ממשל והבהרת מדיניות סימני המסחר
    Mastodon התמקד במתן מענה לחששות הקהילה בנוגע למדיניות הפרויקט:
    - **הנחיות למדיניות סימני המסחר:** פרסום הנחיות מעודכנות ומובהרות וסיכומים בשפה פשוטה בנוגע למדיניות סימני המסחר של Mastodon, בעקבות משוב מהקהילה ([הודעה על הנחיות סימני המסחר](embed:mastodon-today-we-3Kb)).

    ### 3. זרקור על הקהילה ותמיכה במערכת האקולוגית
    הדגשת המערכת האקולוגית הרחבה יותר של ה-[Fediverse](wiki:Fediverse), מפעילי שרתים ויוזמות בטיחות:
    - **זרקור על שרת נבחר:** קידום מופעים ייעודיים כגון *Earth.Law*, שרת ידידותי לסביבה המותאם לעורכי דין בתחום הסביבה, למדענים ולפעילים ([זרקור על שרת Earth.Law](embed:mastodon-here-is-miz)).
    - **סקרים במערכת האקולוגית:** הפצת יוזמות ניהול כגון סקר תפעול הרשת החברתית של IFTAS, כדי לתמוך במפקחי תוכן ובמנהלי מערכת ([פוסט על סקר IFTAS](embed:mastodon-re-https-wnD)).

    ### 4. עדכונים על הארגון והצוות
    שקיפות לגבי שינויים בצוות וההנהגה:
    - **פרידה מחברת הנהלה:** ציון עזיבתה של מנהלת הקהילה וחברת הדירקטוריון Hannah Aubry, והודיה לה על תרומתה לצמיחת הקהילה ([פוסט הפרידה מ-Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. מימון הפרויקט ומוצרי מרצ'נדייז
    תמיכה בהמשך פיתוח הרשת בקוד פתוח:
    - **הזמנות מוקדמות של Plushtodon:** הכרזה על צבעים חדשים של בובת הקמע הרכה בחנות, המאפשרת לתומכים לסייע ישירות במימון הפיתוח ([פוסט על הזמנות מוקדמות של Plushtodon](embed:mastodon-new-plushtodon-7D2)).

    ---

    ### דוגמאות נבחרות

    [@Mastodon: לאחר פרסום תוצאות שבוע הגילוי, נוכל כעת לתת לכם הצצה ראשונה](embed:mastodon-after-publishing-WqJ)
    [@Mastodon: היום אנו משתפים הנחיות נוספות לגבי מדיניות סימני המסחר שלנו על בסיס …](embed:mastodon-today-we-3Kb)
    [@Mastodon: צבעי #Plushtodon חדשים זמינים כעת להזמנה מוקדמת בחנות שלנו! זו דרך](embed:mastodon-new-plushtodon-7D2)
