    ```json
    {"type":"app_skill_use","embed_id":"fdd36382-ab98-4922-b4a4-aeeb1ea1c67e","app_id":"social_media","skill_id":"get-posts"}
    ```

    Las publicaciones públicas recientes de la cuenta oficial de @Mastodon en [Mastodon](wiki:Mastodon_(social_network)) giran en torno a varios temas centrales:

    ---

    ### 1. Rediseño de la plataforma y próximas funciones (Mastodon 5.0)
    Un enfoque principal ha sido compartir la investigación sobre la experiencia de usuario y revelar los próximos cambios de diseño:
    - **Adelanto de Mastodon 5.0:** Un primer vistazo a la versión 5.0, que destaca un diseño más tranquilo, una nueva estética visual y un editor de publicaciones actualizado ([Adelanto de Mastodon 5.0](embed:mastodon-after-publishing-WqJ)).
    - **Resultados de la Discovery Week:** Compartir los resultados de los talleres y encuestas de usuarios dirigidos por el equipo de diseño para comprender mejor cómo interactúa la comunidad con la plataforma ([Resumen de la Discovery Week](embed:mastodon-we-re-5Ll)).

    ### 2. Gobernanza y claridad en las marcas registradas
    Mastodon se ha centrado en abordar las preocupaciones de la comunidad con respecto a las políticas del proyecto:
    - **Directrices de la política de marcas registradas:** Publicación de directrices actualizadas y aclaradas, junto con resúmenes en lenguaje sencillo sobre las políticas de marcas registradas de Mastodon tras las aportaciones de la comunidad ([Anuncio de las directrices de marcas registradas](embed:mastodon-today-we-3Kb)).

    ### 3. Destacados de la comunidad y apoyo al ecosistema
    Destacar el ecosistema más amplio del [Fediverso](wiki:Fediverse), los operadores de servidores y las iniciativas de seguridad:
    - **Servidor destacado:** Promoción de instancias dedicadas como *Earth.Law*, un servidor ecológico adaptado a abogados, científicos y activistas ambientales ([Destacado del servidor Earth.Law](embed:mastodon-here-is-miz)).
    - **Encuestas del ecosistema:** Impulsar iniciativas administrativas como la Encuesta de Operaciones de la Web Social de IFTAS para apoyar a moderadores y administradores ([Publicación de la encuesta de IFTAS](embed:mastodon-re-https-wnD)).

    ### 4. Actualizaciones de la organización y del equipo
    Transparencia en torno a las transiciones del equipo y el liderazgo:
    - **Despedida del liderazgo:** Reconocimiento de la partida de la Directora de la Comunidad y miembro de la junta, Hannah Aubry, agradeciéndole sus contribuciones al crecimiento de la comunidad ([Publicación de despedida de Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Financiación del proyecto y merchandising
    Sostener el desarrollo de código abierto de la red:
