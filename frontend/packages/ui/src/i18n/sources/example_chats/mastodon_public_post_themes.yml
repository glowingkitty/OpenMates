    Het officiële @Mastodon-account op `mastodon.social` belicht verschillende kernthema's in zijn recente openbare berichten:

    ### 1. Belangrijke productevolutie & gebruikersonderzoek
    Een belangrijk aandachtspunt is de basis voor **Mastodon 5.0**, volgend op hun community-brede "Discovery Week"-onderzoeksinitiatief onder leiding van hun ontwerpteam. Het team deelde voorbeelden van een vernieuwde, rustigere interface en een bijgewerkte tekstverwerker die bedoeld zijn om het platform toegankelijker en gebruiksvriendelijker te maken.

    ### 2. Community-beheer, beleid & personeelsupdates
    Mastodon communiceert regelmatig over updates op het gebied van beheer en beleid, met name door verduidelijkende richtlijnen uit te brengen over hun **handelsmerkbeleid** als directe reactie op feedback van fediverse-beheerders en -ontwikkelaars. Ze kondigden ook belangrijke overgangen in het leiderschap aan en bedankten vertrekkend community-directeur Hannah Aubry voor haar bijdragen.

    ### 3. Server-spotlights & fediverse-ecosysteem
    Het account promoot actief onafhankelijke fediverse-instanties en infrastructuurinitiatieven — zoals het uitlichten van themaservers (zoals Earth.Law) en het versterken van sectoronderzoeken zoals het IFTAS-operationeel onderzoek.

    ### 4. Community-merchandise & projectfinanciering
    Ter ondersteuning van de voortdurende open-source ontwikkeling delen ze updates over officiële community-merchandise, waaronder de release van nieuwe pluchen mascottes ("Plushtodons").

