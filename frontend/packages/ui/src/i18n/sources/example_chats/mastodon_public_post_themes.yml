    ### 1. Główna ewolucja produktu i badania użytkowników
    Główny nacisk położono na fundamenty pod **Mastodon 5.0**, będące następstwem ogólnospołecznościowej inicjatywy badawczej „Discovery Week” prowadzonej przez zespół projektowy. Zespół udostępnił zapowiedzi przeprojektowanego, spokojniejszego interfejsu oraz zaktualizowanego edytora wpisów, mających na celu uczynienie platformy bardziej dostępną i przyjazną dla użytkownika.

    ### 2. Zarządzanie społecznością, polityki i aktualizacje kadrowe
    Mastodon regularnie komunikuje aktualizacje dotyczące zarządzania i polityk, w szczególności publikując wytyczne wyjaśniające **Politykę znaków towarowych** (Trademark Policy) w bezpośredniej odpowiedzi na opinie administratorów i deweloperów fediverse. Ogłoszono również kluczowe zmiany w kierownictwie, dziękując ustępującej dyrektorce ds. społeczności, Hannah Aubry, za jej wkład.

