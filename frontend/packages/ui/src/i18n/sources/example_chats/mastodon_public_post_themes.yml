    ### 2. Управление и ясность в вопросах товарных знаков
    Mastodon сосредоточился на решении вопросов сообщества, касающихся политики проекта:
    - **Руководство по политике в отношении товарных знаков:** Выпуск обновленных, уточненных рекомендаций и кратких изложений политики Mastodon в отношении товарных знаков на простом языке с учетом отзывов сообщества ([анонс руководства по товарным знакам](embed:mastodon-today-we-3Kb)).

    ### 3. В центре внимания — сообщество и поддержка экосистемы
    Освещение более широкой экосистемы [Fediverse](wiki:Fediverse), операторов серверов и инициатив по безопасности:
    - **Обзор серверов:** Продвижение специализированных инстансов, таких как *Earth.Law* — экологичного сервера, созданного для юристов-экологов, ученых и активистов ([обзор сервера Earth.Law](embed:mastodon-here-is-miz)).
    - **Опросы экосистемы:** Поддержка административных инициатив, таких как опрос IFTAS Social Web Operations Survey, для помощи модераторам и администраторам ([пост об опросе IFTAS](embed:mastodon-re-https-wnD)).

