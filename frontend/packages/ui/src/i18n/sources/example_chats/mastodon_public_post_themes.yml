    ### 5. プロジェクトの資金調達とグッズ
    ネットワークのオープンソース開発を維持するための取り組みです。
    - **Plushtodonの予約販売：** ショップで新しい色のマスコットぬいぐるみを発表し、サポーターが開発資金を直接支援できるようにしています（[Plushtodon予約販売の投稿](embed:mastodon-new-plushtodon-7D2)）。

