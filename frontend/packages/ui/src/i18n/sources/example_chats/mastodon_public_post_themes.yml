    Nedávné veřejné příspěvky oficiálního účtu @Mastodon na [Mastodonu](wiki:Mastodon_(social_network)) se točí kolem několika hlavních témat:

    ---

    ### 1. Nový design platformy a připravované funkce (Mastodon 5.0)
    Velký důraz byl kladen na sdílení výzkumu uživatelské zkušenosti a představování připravovaných změn designu:
    - **První pohled na Mastodon 5.0:** Předběžná ukázka verze 5.0, která zdůrazňuje klidnější rozvržení, novou vizuální estetiku a aktualizovaný editor příspěvků ([první pohled na Mastodon 5.0](embed:mastodon-after-publishing-WqJ)).
    - **Zjištění z Discovery Week:** Sdílení výsledků uživatelských workshopů a průzkumů vedených designovým týmem s cílem lépe porozumět tomu, jak komunita s platformou pracuje ([shrnutí Discovery Week](embed:mastodon-we-re-5Ll)).

    ### 2. Správa projektu a vyjasnění pravidel ochranných známek
    Mastodon se zaměřil na řešení obav komunity ohledně pravidel projektu:
    - **Pokyny k pravidlům ochranných známek:** Zveřejnění aktualizovaných a vyjasněných pokynů a srozumitelných shrnutí pravidel Mastodonu týkajících se ochranných známek na základě podnětů komunity ([oznámení pokynů k ochranným známkám](embed:mastodon-today-we-3Kb)).

    ### 3. Představení komunity a podpora ekosystému
    Přiblížení širšího ekosystému [Fediverse](wiki:Fediverse), provozovatelů serverů a bezpečnostních iniciativ:
    - **Představení vybraného serveru:** Propagace specializovaných instancí, jako je *Earth.Law*, ekologický server určený právníkům v oblasti životního prostředí, vědcům a aktivistům ([představení serveru Earth.Law](embed:mastodon-here-is-miz)).
    - **Průzkumy ekosystému:** Podpora administrativních iniciativ, jako je průzkum IFTAS Social Web Operations Survey, na pomoc moderátorům a administrátorům ([příspěvek o průzkumu IFTAS](embed:mastodon-re-https-wnD)).

    ### 4. Novinky z organizace a týmu
    Transparentnost ohledně změn v týmu a vedení:
    - **Rozloučení s členkou vedení:** Oznámení odchodu ředitelky komunity a členky správní rady Hannah Aubry a poděkování za její přínos k růstu komunity ([příspěvek na rozloučenou s Hannah Aubry](embed:mastodon-hannah-aubry-O6F)).

    ### 5. Financování projektu a propagační zboží
    Zajištění dalšího vývoje sítě s otevřeným zdrojovým kódem:
    - **Předobjednávky Plushtodonu:** Oznámení nových barev plyšového maskota v obchodě, aby podporovatelé mohli přímo přispět na financování vývoje ([příspěvek o předobjednávkách Plushtodonu](embed:mastodon-new-plushtodon-7D2)).

