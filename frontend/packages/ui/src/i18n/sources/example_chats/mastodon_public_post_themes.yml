    ---

    ### 1. プラットフォームの再設計と今後の機能（Mastodon 5.0）
    ユーザーエクスペリエンス調査の共有や、今後予定されているデザイン変更の公開に大きな焦点が当てられています。
    - **Mastodon 5.0の先行公開：** バージョン5.0の初期プレビュー。より落ち着いたレイアウト、新しいビジュアル、刷新された投稿作成画面などが特徴です（[Mastodon 5.0の先行公開](embed:mastodon-after-publishing-WqJ)）。
    - **Discovery Weekの調査結果：** コミュニティがプラットフォームをどのように利用しているかをより深く理解するため、デザインチームが主導したユーザーワークショップやアンケートの結果を共有しています（[Discovery Weekの概要](embed:mastodon-we-re-5Ll)）。

    ### 2. ガバナンスと商標の明確化
    プロジェクトのポリシーに関するコミュニティの懸念への対応に注力しています。
    - **商標ポリシーのガイドライン：** コミュニティからの意見を受け、Mastodonの商標ポリシーに関する更新・明確化されたガイドラインと、平易な言葉による要約を公開しました（[商標ガイドラインの発表](embed:mastodon-today-we-3Kb)）。

    ### 3. コミュニティスポットライトとエコシステムのサポート
    より広範な[Fediverse](wiki:Fediverse)エコシステム、サーバー運営者、および安全性の取り組みにスポットライトを当てています。
    - **注目のサーバー紹介：** 環境分野の弁護士、科学者、活動家向けに調整されたエコフレンドリーなサーバー「*Earth.Law*」など、特定の目的を持ったインスタンスを宣伝しています（[Earth.Lawサーバーの紹介](embed:mastodon-here-is-miz)）。
    - **エコシステム調査：** モデレーターや管理者を支援するため、IFTAS Social Web Operations Surveyなどの管理イニシアチブを後押ししています（[IFTAS調査の投稿](embed:mastodon-re-https-wnD)）。

    ### 4. 組織とチームの最新情報
    チームの交代やリーダーシップに関する透明性を確保しています。
