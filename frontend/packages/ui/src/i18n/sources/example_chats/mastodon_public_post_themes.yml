    يسلط الحساب الرسمي لـ @Mastodon على `mastodon.social` الضوء على عدة مواضيع أساسية في منشوراته العامة الأخيرة:

    ### 1. تطور المنتج الرئيسي وأبحاث المستخدمين
    انصب التركيز الأساسي على التمهيد لـ **Mastodon 5.0**، في أعقاب مبادرة البحث "أسبوع الاكتشاف" (Discovery Week) على مستوى المجتمع التي قادها فريق التصميم لديهم. شارك الفريق معاينات لواجهة مُعاد تصميمها وأكثر هدوءاً، وأداة إنشاء منشورات محدثة تهدف إلى جعل المنصة أكثر سهولة في الوصول والاستخدام.

    ### 2. حوكمة المجتمع والسياسات وتحديثات الموظفين
    تتواصل Mastodon بانتظام بشأن تحديثات الحوكمة والسياسات، ولا سيما إصدار إرشادات توضيحية حول **سياسة العلامة التجارية** استجابةً مباشرة لتعليقات مديري ومطوري الـ fediverse. كما أعلنوا عن انتقالات قيادية رئيسية، معربين عن شكرهم لمديرة المجتمع المغادرة هانا أوبري (Hannah Aubry) على مساهماتها.

    ### 3. تسليط الضوء على الخوادم ونظام الـ Fediverse البيئي
    يروج الحساب بنشاط لمثيلات (instances) الـ fediverse المستقلة ومبادرات البنية التحتية — مثل تسليط الضوء على الخوادم المتخصصة (مثل Earth.Law) ونشر استطلاعات الصناعة مثل أبحاث عمليات IFTAS.

    ### 4. سلع المجتمع وتمويل المشاريع
    لدعم التطوير المستمر مفتوح المصدر، يشاركون تحديثات سلع المجتمع الرسمية، بما في ذلك إصدارات دمى التميمة الجديدة ("Plushtodons").

    ---

    ### ثلاثة منشورات نموذجية

    - **خارطة طريق المنتج والتحديث البصري:** [إعلان نظرة خاطفة على Mastodon 5.0](embed:mastodon-after-publishing-D8d) — يشارك معاينة لتخطيط 5.0 القادم وأداة إنشاء المنشورات بناءً على نتائج الاكتشاف.
    - **السياسة وتعليقات المجتمع:** [تحديث إرشادات سياسة العلامة التجارية](embed:mastodon-today-we-YqD) — يوضح قواعد العلامة التجارية المنقحة والمكيفة بناءً على مدخلات المجتمع.
    - **دعم المشروع والسلع:** [إعلان الطلب المسبق لـ Plushtodon](embed:mastodon-new-plushtodon-A57) — يعلن عن دمى تميمة رسمية جديدة كوسيلة للمؤيدين لتمويل التطوير.

