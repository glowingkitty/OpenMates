    - **Policy och feedback från gemenskapen:** [Uppdatering av riktlinjer för varumärkespolicy](embed:mastodon-today-we-YqD) – beskriver reviderade varumärkesregler anpassade efter feedback från gemenskapen.
    - **Projektstöd och merchandise:** [Tillkännagivande av förbeställningar av Plushtodons](embed:mastodon-new-plushtodon-A57) – presenterar nya officiella mjukdjursmaskotar som ett sätt för supportrar att finansiera utvecklingen.

