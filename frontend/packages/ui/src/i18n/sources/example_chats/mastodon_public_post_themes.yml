    ### 2. الحوكمة ووضوح العلامة التجارية
    ركزت Mastodon على معالجة مخاوف المجتمع بشأن سياسات المشروع:
    - **إرشادات سياسة العلامة التجارية:** إصدار إرشادات محدثة وموضحة وملخصات بلغة مبسطة تتعلق بسياسات العلامة التجارية لـ Mastodon بناءً على مدخلات المجتمع ([إعلان إرشادات العلامة التجارية](embed:mastodon-today-we-3Kb)).

    ### 3. تسليط الضوء على المجتمع ودعم النظام البيئي
    تسليط الضوء على نظام [Fediverse](wiki:Fediverse) البيئي الأوسع، ومشغلي الخوادم، ومبادرات السلامة:
    - **تسليط الضوء على خادم مميز:** الترويج لنماذج مخصصة مثل *Earth.Law*، وهو خادم صديق للبيئة مصمم لمحامي البيئة والعلماء والنشطاء ([تسليط الضوء على خادم Earth.Law](embed:mastodon-here-is-miz)).
    - **استطلاعات النظام البيئي:** تعزيز المبادرات الإدارية مثل استطلاع IFTAS لعمليات الويب الاجتماعي لدعم المشرفين والإداريين ([منشور استطلاع IFTAS](embed:mastodon-re-https-wnD)).

    ### 4. تحديثات تنظيمية وتحديثات الفريق
    الشفافية حول انتقالات الفريق والقيادة:
    - **وداع القيادة:** الإقرار برحيل مديرة المجتمع وعضوة مجلس الإدارة هانا أوبري (Hannah Aubry)، مع شكرها على مساهماتها في نمو المجتمع ([منشور وداع هانا أوبري](embed:mastodon-hannah-aubry-O6F)).

    ### 5. تمويل المشروع والسلع
    استدامة تطوير الشبكة مفتوحة المصدر:
    - **الطلبات المسبقة لـ Plushtodon:** الإعلان عن ألوان جديدة للدمى الجالبة للحظ في المتجر للسماح للمؤيدين بالمساعدة في تمويل التطوير مباشرة ([منشور الطلبات المسبقة لـ Plushtodon](embed:mastodon-new-plushtodon-7D2)).

