    บัญชีทางการของ @Mastodon บน `mastodon.social` เน้นย้ำถึงธีมหลักหลายประการในโพสต์สาธารณะล่าสุด:

    ### 1. วิวัฒนาการหลักของผลิตภัณฑ์และการวิจัยผู้ใช้
    จุดเน้นหลักคือการวางรากฐานสำหรับ **Mastodon 5.0** หลังจากโครงการวิจัย "Discovery Week" ทั่วทั้งชุมชนซึ่งนำโดยทีมออกแบบ ทีมงานได้แชร์ตัวอย่างอินเทอร์เฟซที่ออกแบบใหม่ให้ดูสบายตาขึ้น และตัวสร้างโพสต์ที่อัปเดตเพื่อให้แพลตฟอร์มเข้าถึงได้ง่ายและเป็นมิตรกับผู้ใช้มากขึ้น

    ### 2. การกำกับดูแลชุมชน นโยบาย และการอัปเดตทีมงาน
    Mastodon สื่อสารการอัปเดตด้านการกำกับดูแลและนโยบายอย่างสม่ำเสมอ โดยเฉพาะการออกแนวทางปฏิบัติที่ชัดเจนเกี่ยวกับ **นโยบายเครื่องหมายการค้า (Trademark Policy)** เพื่อตอบสนองต่อข้อเสนอแนะจากผู้ดูแลระบบและนักพัฒนาใน Fediverse โดยตรง นอกจากนี้ยังมีการประกาศการเปลี่ยนผ่านผู้นำที่สำคัญ โดยขอบคุณ Hannah Aubry ผู้อำนวยการชุมชนที่กำลังจะพ้นจากตำแหน่งสำหรับผลงานของเธอ

    ### 3. การแนะนำเซิร์ฟเวอร์และระบบนิเวศของ Fediverse
    บัญชีนี้ส่งเสริมอินสแตนซ์ Fediverse ที่เป็นอิสระและโครงการริเริ่มด้านโครงสร้างพื้นฐานอย่างแข็งขัน เช่น การแนะนำเซิร์ฟเวอร์ตามธีม (เช่น Earth.Law) และการเผยแพร่ผลสำรวจในอุตสาหกรรม เช่น งานวิจัยด้านการดำเนินงานของ IFTAS

    ### 4. สินค้าที่ระลึกของชุมชนและการระดมทุนโครงการ
    เพื่อสนับสนุนการพัฒนาโอเพนซอร์สอย่างต่อเนื่อง พวกเขาได้แชร์การอัปเดตสินค้าที่ระลึกอย่างเป็นทางการของชุมชน รวมถึงการเปิดตัวตุ๊กตามาสคอตตัวใหม่ ("Plushtodons")

    ---

    ### โพสต์ตัวอย่าง 3 โพสต์

    - **แผนงานผลิตภัณฑ์และการปรับโฉมใหม่:** [ประกาศตัวอย่าง Mastodon 5.0](embed:mastodon-after-publishing-D8d) — แชร์ตัวอย่างเลย์เอาต์ 5.0 และตัวสร้างโพสต์ที่กำลังจะมาถึงตามผลการวิจัย
    - **นโยบายและข้อเสนอแนะจากชุมชน:** [อัปเดตแนวทางนโยบายเครื่องหมายการค้า](embed:mastodon-today-we-YqD) — สรุปกฎเครื่องหมายการค้าที่ปรับปรุงใหม่ตามข้อมูลจากชุมชน
    - **การสนับสนุนโครงการและสินค้า:** [ประกาศสั่งจอง Plushtodon ล่วงหน้า](embed:mastodon-new-plushtodon-A57) — ประกาศเปิดตัวตุ๊กตามาสคอตตัวใหม่เพื่อเป็นช่องทางให้ผู้สนับสนุนช่วยระดมทุนในการพัฒนา

