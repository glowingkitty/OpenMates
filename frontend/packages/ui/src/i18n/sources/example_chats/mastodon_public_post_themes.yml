    `mastodon.social` पर आधिकारिक @Mastodon अकाउंट अपने हालिया सार्वजनिक पोस्ट में कई मुख्य विषयों पर प्रकाश डालता है:

    ### 1. प्रमुख उत्पाद विकास और उपयोगकर्ता अनुसंधान
    मुख्य फोकस **Mastodon 5.0** के लिए आधार तैयार करना रहा है, जो उनकी डिजाइन टीम के नेतृत्व में समुदाय-व्यापी "डिस्कवरी वीक" अनुसंधान पहल के बाद किया गया है। टीम ने प्लेटफॉर्म को अधिक सुलभ और उपयोगकर्ता के अनुकूल बनाने के उद्देश्य से एक पुन: डिज़ाइन किए गए, शांत इंटरफ़ेस और एक अपडेटेड कंपोज़र के प्रीव्यू साझा किए।

    ### 2. सामुदायिक शासन, नीतियां और स्टाफ अपडेट
    Mastodon नियमित रूप से शासन और नीति अपडेट साझा करता है, विशेष रूप से फेडिवर्स एडमिन और डेवलपर फीडबैक के जवाब में अपनी **ट्रेडमार्क नीति** के बारे में स्पष्ट दिशानिर्देश जारी करता है। उन्होंने प्रमुख नेतृत्व परिवर्तनों की भी घोषणा की, जिसमें निवर्तमान सामुदायिक निदेशक हन्ना ऑब्री को उनके योगदान के लिए धन्यवाद दिया गया।

    ### 3. सर्वर स्पॉटलाइट और फेडिवर्स इकोसिस्टम
    यह अकाउंट स्वतंत्र फेडिवर्स इंस्टेंस और इंफ्रास्ट्रक्चर पहलों को सक्रिय रूप से बढ़ावा देता है—जैसे थीम वाले सर्वर (जैसे Earth.Law) को हाइलाइट करना और IFTAS संचालन अनुसंधान जैसे उद्योग सर्वेक्षणों को बढ़ावा देना।

    ### 4. सामुदायिक मर्चेंडाइज और प्रोजेक्ट फंडिंग
    चल रहे ओपन-सोर्स विकास का समर्थन करने के लिए, वे आधिकारिक सामुदायिक मर्चेंडाइज अपडेट साझा करते हैं, जिसमें नए प्लश मैस्कॉट रिलीज़ ("Plushtodons") शामिल हैं।

    ---

    ### तीन प्रतिनिधि पोस्ट

    - **उत्पाद रोडमैप और विजुअल रिफ्रेश:** [Mastodon 5.0 की पहली झलक की घोषणा](embed:mastodon-after-publishing-D8d) — डिस्कवरी निष्कर्षों के आधार पर आगामी 5.0 लेआउट और पोस्ट कंपोज़र का प्रीव्यू साझा करता है।
    - **नीति और सामुदायिक फीडबैक:** [ट्रेडमार्क नीति दिशानिर्देश अपडेट](embed:mastodon-today-we-YqD) — सामुदायिक इनपुट से अनुकूलित संशोधित ट्रेडमार्क नियमों की रूपरेखा तैयार करता है।
    - **प्रोजेक्ट सपोर्ट और मर्च:** [Plushtodon प्री-ऑर्डर की घोषणा](embed:mastodon-new-plushtodon-A57) — समर्थकों के लिए विकास को फंड करने के तरीके के रूप में नए आधिकारिक प्लश मैस्कॉट की घोषणा करता है।

