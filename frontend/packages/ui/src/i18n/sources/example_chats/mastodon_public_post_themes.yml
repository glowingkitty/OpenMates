    A primary focus has been the groundwork for **Mastodon 5.0**, following their community-wide "Discovery Week" research initiative led by their design team. The team shared previews of a redesigned, calmer interface and an updated composer aimed at making the platform more accessible and user-friendly.

    ### 2. Community Governance, Policies & Staff Updates
    Mastodon regularly communicates governance and policy updates, notably releasing clarifying guidelines around their **Trademark Policy** in direct response to fediverse admin and developer feedback. They also announced key leadership transitions, thanking outgoing community director Hannah Aubry for her contributions.

    ### 3. Server Spotlights & Fediverse Ecosystem
    The account actively promotes independent fediverse instances and infrastructure initiatives—such as highlighting themed servers (like Earth.Law) and amplifying industry surveys like IFTAS operations research.

    ### 4. Community Merchandise & Project Funding
    To support ongoing open-source development, they share official community merchandise updates, including new plush mascot releases ("Plushtodons").

