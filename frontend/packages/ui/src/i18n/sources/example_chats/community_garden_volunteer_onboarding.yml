summary:
  context: "Summary of example chat: Community Garden Volunteer Onboarding"
  en: "Create a shareable one-page volunteer guide with first-day tasks, safety basics, and help contacts."
  de: Erstelle einen teilbaren, einseitigen Leitfaden für Freiwillige mit Aufgaben für den ersten Tag, Sicherheitsgrundlagen und Kontaktdaten.
  zh: 创建一份可共享的一页志愿者指南，包含首日任务、安全基础知识和求助联系方式。
  es: Crea una guía de una página para voluntarios con tareas del primer día, nociones básicas de seguridad y contactos de ayuda.
  fr: "Crée un guide d'une page à partager pour les bénévoles avec les tâches du premier jour, les bases de la sécurité et les contacts d'urgence."
  pt: Cria um guia de voluntariado partilhável de uma página com tarefas do primeiro dia, noções básicas de segurança e contactos de ajuda.
  ru: Создай одностраничное руководство для волонтеров с задачами на первый день, основами безопасности и контактами для помощи.
  ja: 初日のタスク、安全の基本、連絡先をまとめた、共有可能な1ページのボランティアガイドを作成します。
  ko: 첫날 작업, 안전 기본 사항, 도움말 연락처가 포함된 공유 가능한 한 페이지 분량의 자원봉사 가이드를 만듭니다.
  it: "Crea una guida per i volontari di una pagina, condivisibile, con i compiti del primo giorno, le basi della sicurezza e i contatti per l'assistenza."
  tr: İlk gün görevlerini, temel güvenlik kurallarını ve yardım iletişim bilgilerini içeren paylaşılabilir, tek sayfalık bir gönüllü rehberi oluştur.
  vi: Tạo hướng dẫn tình nguyện viên một trang có thể chia sẻ với các nhiệm vụ ngày đầu, kiến thức an toàn cơ bản và thông tin liên hệ hỗ trợ.
  id: Buat panduan sukarelawan satu halaman yang dapat dibagikan dengan tugas hari pertama, dasar-dasar keselamatan, dan kontak bantuan.
  pl: Stwórz jednostronicowy przewodnik dla wolontariuszy z zadaniami na pierwszy dzień, podstawami bezpieczeństwa i kontaktami pomocowymi.
  nl: Maak een deelbare gids van één pagina voor vrijwilligers met taken voor de eerste dag, basisveiligheid en contactpersonen voor hulp.
  ar: أنشئ دليلاً للمتطوعين من صفحة واحدة قابلة للمشاركة، يتضمن مهام اليوم الأول، وأساسيات السلامة، وجهات الاتصال للمساعدة.
  hi: पहले दिन के कार्यों, सुरक्षा की बुनियादी बातों और सहायता संपर्कों के साथ एक साझा करने योग्य एक-पेज का स्वयंसेवक गाइड बनाएं।
  th: สร้างคู่มืออาสาสมัครแบบหน้าเดียวที่แชร์ได้ พร้อมภารกิจวันแรก พื้นฐานความปลอดภัย และช่องทางติดต่อขอความช่วยเหลือ
  cs: Vytvoř sdílenou jednostránkovou příručku pro dobrovolníky s úkoly pro první den, základy bezpečnosti a kontakty pro pomoc.
  sv: Skapa en delbar ensidig volontärguide med uppgifter för första dagen, grundläggande säkerhet och kontaktpersoner.
  he: יצירת מדריך למתנדב בעמוד אחד הניתן לשיתוף, הכולל משימות ליום הראשון, כללי בטיחות בסיסיים ואנשי קשר לעזרה.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Community Garden Volunteer Onboarding. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Please make a shareable, one-page volunteer onboarding document for a community garden. Keep it under 220 words. Cover arrival, first-day tasks, safety, and how to ask for help. This is a general template, so use placeholders where garden-specific contacts or locations are needed."
  de: Bitte erstelle ein teilbares, einseitiges Onboarding-Dokument für Freiwillige in einem Gemeinschaftsgarten. Halte es unter 220 Wörtern. Behandle die Ankunft, Aufgaben am ersten Tag, Sicherheit und wie man um Hilfe bittet. Dies ist eine allgemeine Vorlage, verwende also Platzhalter für gartenspezifische Kontakte oder Standorte.
  zh: 请为社区花园制作一份可共享的一页志愿者入职文档。字数控制在 220 字以内。内容涵盖到达、首日任务、安全以及如何寻求帮助。这是一个通用模板，因此在需要花园特定联系人或地点的地方请使用占位符。
  es: Por favor, crea un documento de incorporación para voluntarios de un huerto comunitario que se pueda compartir y ocupe una sola página. Que no supere las 220 palabras. Incluye la llegada, las tareas del primer día, la seguridad y cómo pedir ayuda. Es una plantilla general, así que usa marcadores de posición donde se necesiten contactos o ubicaciones específicos del huerto.
  fr: "S'il te plaît, crée un document d'intégration d'une page à partager pour les bénévoles d'un jardin communautaire. Limite-le à 220 mots. Aborde l'arrivée, les tâches du premier jour, la sécurité et comment demander de l'aide. C'est un modèle général, utilise donc des espaces réservés pour les contacts ou les lieux spécifiques au jardin."
  pt: Por favor, cria um documento de integração de voluntários partilhável de uma página para uma horta comunitária. Mantém-no com menos de 220 palavras. Aborda a chegada, as tarefas do primeiro dia, a segurança e como pedir ajuda. Este é um modelo geral, por isso usa marcadores de posição onde forem necessários contactos ou locais específicos da horta.
  ru: Пожалуйста, составь одностраничный документ для онбординга волонтеров в общественном саду, которым можно поделиться. Объем — не более 220 слов. Опиши прибытие, задачи на первый день, технику безопасности и способы обращения за помощью. Это общий шаблон, поэтому используй плейсхолдеры там, где нужны контакты или адреса конкретного сада.
  ja: コミュニティガーデンのボランティア向けオンボーディング資料を、共有可能な1ページのドキュメントで作成してください。220単語以内に収めてください。到着時の手順、初日のタスク、安全面、助けを求める方法を網羅してください。これは一般的なテンプレートなので、ガーデン固有の連絡先や場所が必要な箇所にはプレースホルダーを使用してください。
  ko: 커뮤니티 정원을 위한 공유 가능한 한 페이지 분량의 자원봉사 온보딩 문서를 만들어줘. 220단어 이내로 작성해줘. 도착 안내, 첫날 작업, 안전 수칙, 도움 요청 방법을 포함해줘. 일반적인 템플릿이므로 정원별 연락처나 위치가 필요한 곳에는 플레이스홀더를 사용해줘.
  it: "Per favore, crea un documento di onboarding per i volontari di un orto comunitario, condivisibile e di una sola pagina. Mantienilo sotto le 220 parole. Copri l'arrivo, i compiti del primo giorno, la sicurezza e come chiedere aiuto. Si tratta di un modello generale, quindi usa dei segnaposto dove sono necessari contatti o luoghi specifici dell'orto."
  tr: Lütfen bir topluluk bahçesi için paylaşılabilir, tek sayfalık bir gönüllü oryantasyon belgesi hazırla. 220 kelimenin altında tut. Varış, ilk gün görevleri, güvenlik ve nasıl yardım isteneceği konularını kapsasın. Bu genel bir şablondur, bu nedenle bahçeye özel kişilerin veya konumların gerektiği yerlerde yer tutucular kullan.
  vi: "Vui lòng tạo một tài liệu tiếp nhận tình nguyện viên dài một trang, có thể chia sẻ cho một vườn cộng đồng. Giữ nội dung dưới 220 từ. Bao gồm các phần: khi đến, nhiệm vụ ngày đầu tiên, an toàn và cách yêu cầu trợ giúp. Đây là một mẫu chung, vì vậy hãy sử dụng các trình giữ chỗ ở những nơi cần thông tin liên hệ hoặc địa điểm cụ thể của vườn."
  id: Tolong buatkan dokumen orientasi sukarelawan satu halaman yang dapat dibagikan untuk kebun komunitas. Jaga agar tetap di bawah 220 kata. Cakup kedatangan, tugas hari pertama, keselamatan, dan cara meminta bantuan. Ini adalah templat umum, jadi gunakan placeholder di bagian yang memerlukan kontak atau lokasi spesifik kebun.
  pl: Przygotuj jednostronicowy dokument wdrożeniowy dla wolontariuszy ogrodu społecznościowego, który można łatwo udostępnić. Tekst powinien mieć mniej niż 220 słów. Uwzględnij kwestie przybycia, zadań na pierwszy dzień, bezpieczeństwa oraz sposobu proszenia o pomoc. To ogólny szablon, więc użyj symboli zastępczych w miejscach na dane kontaktowe lub lokalizacje specyficzne dla danego ogrodu.
  nl: Maak een deelbaar onboarding-document van één pagina voor vrijwilligers van een gemeenschapstuin. Houd het onder de 220 woorden. Behandel aankomst, taken voor de eerste dag, veiligheid en hoe je om hulp kunt vragen. Dit is een algemeen sjabloon, dus gebruik placeholders waar tuin-specifieke contacten of locaties nodig zijn.
  ar: يرجى إنشاء مستند تهيئة للمتطوعين في حديقة مجتمعية، يكون قابلاً للمشاركة ومن صفحة واحدة. اجعله أقل من 220 كلمة. غطِّ فيه الوصول، ومهام اليوم الأول، والسلامة، وكيفية طلب المساعدة. هذا نموذج عام، لذا استخدم عناصر نائبة حيثما يلزم ذكر جهات اتصال أو مواقع خاصة بالحديقة.
  hi: कृपया सामुदायिक उद्यान के लिए एक साझा करने योग्य, एक-पेज का स्वयंसेवक ऑनबोर्डिंग दस्तावेज़ बनाएं। इसे 220 शब्दों से कम रखें। इसमें आगमन, पहले दिन के कार्य, सुरक्षा और मदद मांगने के तरीके को शामिल करें। यह एक सामान्य टेम्प्लेट है, इसलिए जहां उद्यान-विशिष्ट संपर्कों या स्थानों की आवश्यकता हो, वहां प्लेसहोल्डर्स का उपयोग करें।
  th: โปรดจัดทำเอกสารปฐมนิเทศอาสาสมัครสำหรับสวนชุมชนแบบหน้าเดียวที่แชร์ได้ โดยมีความยาวไม่เกิน 220 คำ ครอบคลุมเรื่องการมาถึง ภารกิจวันแรก ความปลอดภัย และวิธีขอความช่วยเหลือ นี่เป็นเทมเพลตทั่วไป ดังนั้นโปรดใช้ตัวยึดตำแหน่งในส่วนที่ต้องระบุชื่อผู้ติดต่อหรือสถานที่เฉพาะของสวน
  cs: Prosím, vytvoř sdílený jednostránkový dokument pro zaškolení dobrovolníků v komunitní zahradě. Rozsah udrž pod 220 slov. Zahrň příchod, úkoly pro první den, bezpečnost a způsob, jak požádat o pomoc. Jedná se o obecnou šablonu, takže tam, kde jsou potřeba kontakty nebo místa specifická pro konkrétní zahradu, použij zástupné symboly.
  sv: Skapa ett delbart introduktionsdokument på en sida för volontärer i en gemenskapsträdgård. Håll det under 220 ord. Täck ankomst, uppgifter för första dagen, säkerhet och hur man ber om hjälp. Detta är en allmän mall, så använd platshållare där trädgårdsspecifika kontakter eller platser behövs.
  he: אנא צור מסמך קליטת מתנדבים לגינה קהילתית בעמוד אחד הניתן לשיתוף. שמור עליו מתחת ל-220 מילים. המסמך צריך לכסות הגעה, משימות ליום הראשון, בטיחות ואיך לבקש עזרה. זוהי תבנית כללית, לכן השתמש בממלאי מקום היכן שנדרשים אנשי קשר או מיקומים ספציפיים לגינה.
  verified_by_human: []

