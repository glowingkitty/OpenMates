    {"type":"app_skill_use","embed_id":"fb6d0336-f734-4b14-8192-3ebe50d3638c","app_id":"hosting","skill_id":"search_domains"}
    ```

    ```json
    {"type":"app_skill_use","embed_id":"bee65385-095b-481f-9e63-8c93e692ada5","app_id":"hosting","skill_id":"search_domains"}
    ```

    Zde jsou dva osobité nápady na názvy šité na míru aplikaci zaměřené na pěstování osobních kontaktů a rozšiřování sociálních kruhů, spolu s aktuální kontrolou domén pro přesné koncovky `.com`, `.net` a `.app` u každého názvu.

    ---

    ### Nápad 1: Kinloop
    * **Koncept:** Kombinuje slova „kin“ (komunita, osobní spřízněnost, důvěryhodná pouta) a „loop“ (uzavření smyčky po prvním setkání a udržování kontaktů v neustálém kruhu).
    * **Aktuální ověření domény:**
      * **`kinloop.com`**: **Nedostupná** ([Gandi kontrola](embed:shop.gandi.net-uFu))
      * **`kinloop.net`**: **Nedostupná** ([Gandi kontrola](embed:shop.gandi.net-nTi))
      * **`kinloop.app`**: **Nedostupná** ([Gandi kontrola](embed:shop.gandi.net-XJX))
    * **Doporučení:** Žádné. Všechny tři přesné cílové domény jsou momentálně registrované/nedostupné, takže pro tento název nelze doporučit žádnou přesnou doménu.

    ---

    ### Nápad 2: Orbitfolk
    * **Koncept:** Vyvolává představu udržování známých z reálného života ve vaší osobní sféře (orbitu) a zároveň neustálého objevování a vítání nových lidí („folk“) do vašeho světa.
    * **Ověření domény v reálném čase:**
      * **`orbitfolk.com`**: **Nedostupná** ([Kontrola na Gandi](embed:shop.gandi.net-hBP))
      * **`orbitfolk.net`**: **Dostupná** ([Kontrola na Gandi](embed:shop.gandi.net-cex))
        * **Registrační cena:** $12.99 / 1. rok bez daně ($15.46 včetně 19% DPH; běžná sazba za 1 rok $18.78)
        * **Cena za obnovení:** $39.98 / rok bez daně ($47.58 včetně 19% DPH pro roční období; $35.98/rok před zdaněním pro období 2–9 let)
        * **Omezení:** Žádná nebyla nahlášena
      * **`orbitfolk.app`**: **Dostupná** ([Kontrola na Gandi](embed:shop.gandi.net-U3Z))
        * **Registrační cena:** $9.99 / 1. rok bez daně ($11.89 včetně 19% DPH; běžná sazba za 1 rok $23.29)
        * **Cena za obnovení:** $47.98 / rok bez daně ($57.10 včetně 19% DPH pro roční období; $43.18/rok před zdaněním pro období 2–9 let)
        * **Omezení:** Žádná nebyla nahlášena

    ---

    ### Srovnání a silnější výběr

    **Orbitfolk** je silnější volba:

    1. **Přímá dostupnost:** Zatímco `Kinloop` je obsazen ve všech třech koncovkách, `Orbitfolk` má své verze `.app` i `.net` okamžitě k dispozici k registraci.
    2. **Vhodnost pro produkt:** Protože se jedná o mobilní sociální produkt, **`orbitfolk.app`** nabízí čistou, účelovou doménovou koncovku, která uživatelům přímo sděluje typ produktu.

    ---

    ### Další kroky

    * [Prozkoumat další varianty jmen kolem sociálních orbitů](/#message=Suggest%20three%20more%20names%20similar%20to%20Orbitfolk%20and%20check%20their%20domains.)
    * [Navrhnout proces onboardingu pro osobní setkávání](/#message=Help%20me%20design%20the%20UX%20onboarding%20flow%20for%20connecting%20in%20person.)
