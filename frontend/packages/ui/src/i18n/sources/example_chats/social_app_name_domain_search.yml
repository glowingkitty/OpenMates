summary:
  context: "Summary of example chat: Social App Names with Checked Domains"
  en: "Compare social app names using checked domain availability, registration and renewal pricing, and registration terms."
  de: Vergleiche Social-App-Namen anhand der geprüften Domain-Verfügbarkeit, Registrierungs- und Verlängerungspreise sowie Registrierungsbedingungen.
  zh: 通过检查域名的可用性、注册和续费价格以及注册条款来比较社交应用名称。
  es: Compara nombres de aplicaciones sociales mediante la comprobación de disponibilidad de dominios, precios de registro y renovación, y condiciones de registro.
  fr: "Compare des noms d'applis sociales en fonction de la disponibilité réelle des domaines, des tarifs d'enregistrement et de renouvellement, ainsi que des conditions d'enregistrement."
  pt: Compare nomes de apps sociais usando disponibilidade de domínios verificada, preços de registro e renovação, e termos de registro.
  ru: Сравнивай названия соцсетей по доступности доменов, стоимости регистрации и продления, а также условиям регистрации.
  ja: ドメインの空き状況、登録・更新費用、登録条件を確認して、ソーシャルアプリ名を比較します。
  ko: 도메인 사용 가능 여부, 등록 및 갱신 비용, 등록 약관 확인을 통해 소셜 앱 이름을 비교해 보세요.
  it: Confronta i nomi per app social utilizzando la disponibilità dei domini verificata, i prezzi di registrazione e rinnovo e i termini di registrazione.
  tr: Sosyal uygulama isimlerini; kontrol edilmiş alan adı müsaitliği, kayıt ve yenileme fiyatlandırması ve kayıt şartlarını kullanarak karşılaştır.
  vi: So sánh tên ứng dụng mạng xã hội dựa trên tình trạng tên miền, giá đăng ký và gia hạn, cùng các điều khoản đăng ký.
  id: Bandingkan nama aplikasi sosial menggunakan ketersediaan domain yang diperiksa, harga pendaftaran dan perpanjangan, serta ketentuan pendaftaran.
  pl: Porównuj nazwy aplikacji społecznościowych, korzystając ze sprawdzonej dostępności domen, cen rejestracji i odnowienia oraz warunków rejestracji.
  nl: Vergelijk namen voor sociale apps op basis van gecontroleerde domeinbeschikbaarheid, registratie- en verlengingsprijzen en registratievoorwaarden.
  ar: قارن بين أسماء التطبيقات الاجتماعية بناءً على توفر النطاقات المفحوصة، وأسعار التسجيل والتجديد، وشروط التسجيل.
  hi: चेक की गई डोमेन उपलब्धता, रजिस्ट्रेशन और रिन्यूअल की कीमतों और रजिस्ट्रेशन की शर्तों के आधार पर सोशल ऐप के नामों की तुलना करें।
  th: เปรียบเทียบชื่อแอปโซเชียลโดยใช้ข้อมูลความว่างของโดเมนที่ตรวจสอบแล้ว ราคาจดทะเบียนและราคาต่ออายุ รวมถึงเงื่อนไขการจดทะเบียน
  cs: Porovnej názvy sociálních aplikací podle dostupnosti domén, cen za registraci a obnovení a podmínek registrace.
  sv: Jämför namn på sociala appar med hjälp av kontrollerad domäntillgänglighet, priser för registrering och förnyelse samt registreringsvillkor.
  he: השוואת שמות לאפליקציות חברתיות באמצעות זמינות דומיינים שנבדקה, מחירי רישום וחידוש ותנאי רישום.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Social App Names with Checked Domains. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I am naming a social app that helps people keep in touch after meeting in person and meet new people. Recommend two distinctive name ideas. For each idea, please check its exact .com, .net, and .app domains live, then recommend only exact domains whose availability, registration price, renewal price, and restrictions appear in those checks. Do not guess about unchecked domains. Pick the stronger name based on the checked results."
  de: Ich suche einen Namen für eine Social App, die Menschen hilft, nach einem persönlichen Treffen in Kontakt zu bleiben und neue Leute kennenzulernen. Empfiehl zwei markante Namensideen. Prüfe für jede Idee die exakten .com-, .net- und .app-Domains live und empfiehl dann nur exakte Domains, deren Verfügbarkeit, Registrierungspreis, Verlängerungspreis und Einschränkungen in diesen Prüfungen erscheinen. Rate nicht bei ungeprüften Domains. Wähle den stärkeren Namen basierend auf den geprüften Ergebnissen aus.
  zh: 我正在为一个社交应用命名，该应用旨在帮助人们在见面后保持联系并结识新朋友。请推荐两个独特的名称创意。对于每个创意，请实时检查其精确的 .com、.net 和 .app 域名，然后仅推荐那些在检查中显示了可用性、注册价格、续费价格和限制条件的精确域名。请勿对未检查的域名进行猜测。根据检查结果选出更好的名称。
  es: Estoy buscando un nombre para una aplicación social que ayude a las personas a mantenerse en contacto después de conocerse en persona y a conocer gente nueva. Recomienda dos ideas de nombres distintivos. Para cada idea, comprueba en tiempo real sus dominios exactos .com, .net y .app, y luego recomienda solo los dominios exactos cuya disponibilidad, precio de registro, precio de renovación y restricciones aparezcan en esas comprobaciones. No hagas suposiciones sobre dominios no comprobados. Elige el nombre más sólido basándote en los resultados comprobados.
  fr: "Je cherche un nom pour une appli sociale qui aide les gens à rester en contact après s'être rencontrés en personne et à faire de nouvelles rencontres. Recommande deux idées de noms originaux. Pour chaque idée, vérifie en direct les domaines exacts en .com, .net et .app, puis ne recommande que les domaines exacts dont la disponibilité, le prix d'enregistrement, le prix de renouvellement et les restrictions apparaissent dans ces vérifications. Ne fais pas de suppositions sur les domaines non vérifiés. Choisis le nom le plus convaincant en fonction des résultats vérifiés."
  pt: Estou escolhendo o nome para um app social que ajuda as pessoas a manterem contato após se conhecerem pessoalmente e a conhecerem novas pessoas. Recomende duas ideias de nomes distintos. Para cada ideia, verifique os domínios exatos .com, .net e .app em tempo real e, em seguida, recomende apenas domínios exatos cuja disponibilidade, preço de registro, preço de renovação e restrições apareçam nessas verificações. Não tente adivinhar sobre domínios não verificados. Escolha o nome mais forte com base nos resultados verificados.
  ru: Я придумываю название для соцсети, которая помогает людям поддерживать связь после личного знакомства и находить новых друзей. Предложи два оригинальных названия. Для каждого варианта проверь в реальном времени домены .com, .net и .app, а затем порекомендуй только те точные домены, доступность, стоимость регистрации, стоимость продления и ограничения которых подтверждены проверкой. Не делай предположений о непроверенных доменах. Выбери лучший вариант на основе результатов проверки.
  ja: 対面で会った後の連絡維持や、新しい出会いを支援するソーシャルアプリの命名を考えています。特徴的な名前のアイデアを2つ提案してください。それぞれのアイデアについて、.com、.net、.appドメインの空き状況をリアルタイムで確認し、空き状況、登録費用、更新費用、制限事項が確認できたドメインのみを提案してください。確認していないドメインについては推測しないでください。確認結果に基づいて、より優れた名前を選んでください。
  ko: 오프라인에서 만난 후에도 연락을 유지하고 새로운 사람들을 만날 수 있게 도와주는 소셜 앱의 이름을 지으려고 합니다. 독특한 이름 아이디어 두 가지를 추천해 주세요. 각 아이디어에 대해 .com, .net, .app 도메인의 실시간 상태를 확인한 후, 사용 가능 여부, 등록 비용, 갱신 비용 및 제한 사항이 확인된 도메인만 추천해 주세요. 확인되지 않은 도메인에 대해 추측하지 마세요. 확인된 결과를 바탕으로 더 나은 이름을 선택해 주세요.
  it: "Sto scegliendo il nome per un'app social che aiuta le persone a tenersi in contatto dopo essersi incontrate di persona e a conoscere nuove persone. Consigliami due idee di nomi distintivi. Per ogni idea, controlla in tempo reale i domini esatti .com, .net e .app, quindi consiglia solo i domini esatti la cui disponibilità, prezzo di registrazione, prezzo di rinnovo e restrizioni appaiono in tali controlli. Non fare supposizioni su domini non verificati. Scegli il nome migliore in base ai risultati verificati."
  tr: İnsanların yüz yüze tanıştıktan sonra iletişimde kalmalarına ve yeni insanlarla tanışmalarına yardımcı olan bir sosyal uygulama isimlendiriyorum. İki tane özgün isim fikri öner. Her fikir için lütfen tam .com, .net ve .app alan adlarını canlı olarak kontrol et, ardından yalnızca bu kontrollerde müsaitlik durumu, kayıt fiyatı, yenileme fiyatı ve kısıtlamaları görünen tam alan adlarını öner. Kontrol edilmemiş alan adları hakkında tahminde bulunma. Kontrol edilen sonuçlara göre daha güçlü olan ismi seç.
  vi: Tôi đang đặt tên cho một ứng dụng mạng xã hội giúp mọi người giữ liên lạc sau khi gặp mặt trực tiếp và làm quen với những người mới. Hãy đề xuất hai ý tưởng tên gọi độc đáo. Với mỗi ý tưởng, vui lòng kiểm tra trực tiếp các tên miền .com, .net và .app chính xác, sau đó chỉ đề xuất những tên miền chính xác có tình trạng sẵn có, giá đăng ký, giá gia hạn và các hạn chế xuất hiện trong các lần kiểm tra đó. Không đoán về các tên miền chưa được kiểm tra. Hãy chọn tên tốt hơn dựa trên kết quả đã kiểm tra.
  id: Saya sedang menamai aplikasi sosial yang membantu orang tetap terhubung setelah bertemu langsung dan bertemu orang baru. Rekomendasikan dua ide nama yang unik. Untuk setiap ide, harap periksa domain .com, .net, dan .app yang persis secara langsung, lalu rekomendasikan hanya domain persis yang ketersediaan, harga pendaftaran, harga perpanjangan, dan batasannya muncul dalam pemeriksaan tersebut. Jangan menebak tentang domain yang tidak diperiksa. Pilih nama yang lebih kuat berdasarkan hasil pemeriksaan.
  pl: Tworzę nazwę dla aplikacji społecznościowej, która pomaga ludziom utrzymywać kontakt po spotkaniu osobistym i poznawać nowe osoby. Zaproponuj dwa wyróżniające się pomysły na nazwę. Dla każdego pomysłu sprawdź na żywo dokładne domeny .com, .net i .app, a następnie poleć tylko te dokładne domeny, których dostępność, cena rejestracji, cena odnowienia i ograniczenia pojawiają się w tych sprawdzeniach. Nie zgaduj w przypadku niesprawdzonych domen. Wybierz lepszą nazwę na podstawie sprawdzonych wyników.
  nl: Ik zoek een naam voor een sociale app die mensen helpt contact te houden na een persoonlijke ontmoeting en nieuwe mensen te leren kennen. Beveel twee onderscheidende naamideeën aan. Controleer voor elk idee live de exacte .com-, .net- en .app-domeinen en beveel vervolgens alleen exacte domeinen aan waarvan de beschikbaarheid, registratieprijs, verlengingsprijs en beperkingen in die controles naar voren komen. Doe geen aannames over niet-gecontroleerde domeinen. Kies de sterkste naam op basis van de gecontroleerde resultaten.
  ar: أقوم بتسمية تطبيق اجتماعي يساعد الأشخاص على البقاء على تواصل بعد اللقاء شخصياً والتعرف على أشخاص جدد. اقترح فكرتين لاسمين مميزين. لكل فكرة، يرجى التحقق من نطاقات .com و .net و .app الخاصة بها مباشرة، ثم التوصية فقط بالنطاقات الدقيقة التي يظهر توفرها وسعر تسجيلها وسعر تجديدها وقيودها في تلك الفحوصات. لا تخمن بشأن النطاقات غير المفحوصة. اختر الاسم الأقوى بناءً على النتائج المفحوصة.
  hi: मैं एक सोशल ऐप का नाम रख रहा हूँ जो लोगों को व्यक्तिगत रूप से मिलने के बाद संपर्क में रहने और नए लोगों से मिलने में मदद करता है। दो विशिष्ट नाम सुझाव दें। प्रत्येक सुझाव के लिए, कृपया इसके सटीक .com, .net और .app डोमेन को लाइव चेक करें, फिर केवल वही सटीक डोमेन सुझाएं जिनकी उपलब्धता, रजिस्ट्रेशन की कीमत, रिन्यूअल की कीमत और प्रतिबंध उन चेक में दिखाई देते हैं। अनचेक किए गए डोमेन के बारे में अनुमान न लगाएं। चेक किए गए परिणामों के आधार पर बेहतर नाम चुनें।
  th: ฉันกำลังตั้งชื่อแอปโซเชียลที่ช่วยให้ผู้คนติดต่อกันได้หลังจากพบกันตัวจริงและช่วยให้ได้พบปะผู้คนใหม่ๆ ช่วยแนะนำไอเดียชื่อที่โดดเด่นมา 2 ชื่อ สำหรับแต่ละชื่อ โปรดตรวจสอบโดเมน .com, .net และ .app ที่ตรงกันแบบเรียลไทม์ จากนั้นแนะนำเฉพาะโดเมนที่ตรงกันซึ่งมีข้อมูลความว่าง ราคาจดทะเบียน ราคาต่ออายุ และข้อจำกัดปรากฏในการตรวจสอบเหล่านั้น ห้ามคาดเดาเกี่ยวกับโดเมนที่ไม่ได้ตรวจสอบ เลือกชื่อที่ดูดีกว่าโดยอิงจากผลการตรวจสอบ
  cs: Pojmenovávám sociální aplikaci, která lidem pomáhá zůstat v kontaktu po osobním setkání a poznávat nové lidi. Doporuč dva osobité nápady na název. U každého nápadu prosím naživo ověř přesné domény .com, .net a .app a poté doporuč pouze ty přesné domény, jejichž dostupnost, cena za registraci, cena za obnovení a omezení se v těchto kontrolách zobrazí. Nehádej u neověřených domén. Vyber silnější název na základě výsledků kontroly.
  sv: Jag ska namnge en social app som hjälper människor att hålla kontakten efter att ha träffats personligen och att träffa nya människor. Rekommendera två distinkta namnidéer. För varje idé, kontrollera dess exakta .com-, .net- och .app-domäner live, och rekommendera sedan endast exakta domäner vars tillgänglighet, registreringspris, förnyelsepris och begränsningar framgår av dessa kontroller. Gissa inte om okontrollerade domäner. Välj det starkare namnet baserat på de kontrollerade resultaten.
  he: אני מחפש שם לאפליקציה חברתית שעוזרת לאנשים לשמור על קשר אחרי פגישה פנים אל פנים ולהכיר אנשים חדשים. המלץ על שני רעיונות לשמות ייחודיים. עבור כל רעיון, בדוק בשידור חי את הדומיינים המדויקים בסיומות .com, .net ו-.app, ולאחר מכן המלץ רק על דומיינים מדויקים שהזמינות, מחיר הרישום, מחיר החידוש וההגבלות שלהם מופיעים בבדיקות אלו. אל תנחש לגבי דומיינים שלא נבדקו. בחר את השם החזק יותר על סמך התוצאות שנבדקו.
  verified_by_human: []

