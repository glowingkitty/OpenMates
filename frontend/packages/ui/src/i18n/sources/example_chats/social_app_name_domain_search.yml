        * **Prezzo di rinnovo:** 39,98 $ / anno tasse escluse (47,58 $ inclusa IVA al 19% per termini di 1 anno; 35,98 $/anno tasse escluse per termini di 2–9 anni)
        * **Restrizioni:** Nessuna segnalata
      * **`orbitfolk.app`**: **Disponibile** ([Controllo Gandi](embed:shop.gandi.net-U3Z))
