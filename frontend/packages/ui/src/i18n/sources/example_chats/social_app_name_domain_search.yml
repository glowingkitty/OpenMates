        * **Prezzo di rinnovo:** 47,98 $ / anno tasse escluse (57,10 $ inclusa IVA al 19% per termini di 1 anno; 43,18 $/anno tasse escluse per termini di 2–9 anni)
        * **Restrizioni:** Nessuna segnalata

