    Here are two distinctive name ideas tailored to an app focused on nurturing in-person connections and expanding social circles, along with the live domain checks for each name's exact `.com`, `.net`, and `.app` extensions.

    ---

    ### Idea 1: Kinloop
    * **Concept:** Combines "kin" (community, personal affinity, trusted bonds) with "loop" (closing the loop after an initial meeting and keeping connections alive in an ongoing circle).
    * **Live Domain Verification:**
      * **`kinloop.com`**: **Unavailable** ([Gandi check](embed:shop.gandi.net-uFu))
      * **`kinloop.net`**: **Unavailable** ([Gandi check](embed:shop.gandi.net-nTi))
      * **`kinloop.app`**: **Unavailable** ([Gandi check](embed:shop.gandi.net-XJX))
    * **Recommendation:** None. All three exact target domains are currently registered/unavailable, so no exact domain can be recommended for this name.

    ---

    ### Idea 2: Orbitfolk
    * **Concept:** Evokes the idea of keeping real-life acquaintances in your personal orbit while continuously discovering and welcoming new people ("folk") into your world.
    * **Live Domain Verification:**
      * **`orbitfolk.com`**: **Unavailable** ([Gandi check](embed:shop.gandi.net-hBP))
      * **`orbitfolk.net`**: **Available** ([Gandi check](embed:shop.gandi.net-cex))
        * **Registration Price:** $12.99 / 1st year excluding tax ($15.46 including 19% VAT; regular 1-year rate $18.78)
        * **Renewal Price:** $39.98 / year excluding tax ($47.58 including 19% VAT for 1-year terms; $35.98/yr before tax for 2–9 year terms)
        * **Restrictions:** None reported
      * **`orbitfolk.app`**: **Available** ([Gandi check](embed:shop.gandi.net-U3Z))
        * **Registration Price:** $9.99 / 1st year excluding tax ($11.89 including 19% VAT; regular 1-year rate $23.29)
        * **Renewal Price:** $47.98 / year excluding tax ($57.10 including 19% VAT for 1-year terms; $43.18/yr before tax for 2–9 year terms)
        * **Restrictions:** None reported

    ---

    ### Comparison & Stronger Pick

    **Orbitfolk** is the stronger choice:

