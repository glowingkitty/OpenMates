summary:
  context: "Summary of example chat: Generate a Spoken Welcome Message"
  en: "Turn a short welcome line into natural speech with the Audio Speak app skill."
  de: Verwandle eine kurze Willkommenszeile mit dem Audio-Speak-Skill in natürliche Sprache.
  zh: 使用 Audio Speak 应用技能，将简短的欢迎语转化为自然语音。
  es: Convierte una breve línea de bienvenida en voz natural con la función Audio Speak.
  fr: Transforme un court message de bienvenue en voix naturelle grâce à la compétence Audio Speak.
  pt: Transforma uma curta frase de boas-vindas em fala natural com a skill da app Audio Speak.
  ru: Преврати короткую приветственную фразу в естественную речь с помощью навыка Audio Speak.
  ja: Audio Speakアプリのスキルを使って、短いウェルカムメッセージを自然な音声に変換します。
  ko: Audio Speak 앱 기능을 사용하여 짧은 환영 인사를 자연스러운 음성으로 변환해 보세요.
  it: "Trasforma un breve messaggio di benvenuto in un discorso naturale con la skill dell'app Audio Speak."
  tr: Audio Speak uygulama yeteneğiyle kısa bir karşılama satırını doğal konuşmaya dönüştür.
  vi: Chuyển một dòng chào mừng ngắn thành giọng nói tự nhiên với kỹ năng ứng dụng Audio Speak.
  id: Ubah kalimat sambutan singkat menjadi ucapan alami dengan skill aplikasi Audio Speak.
  pl: Zmień krótkie powitanie w naturalną mowę dzięki umiejętności Audio Speak.
  nl: Zet een korte welkomstzin om in natuurlijk klinkende spraak met de Audio Speak-app-skill.
  ar: حوّل عبارة ترحيب قصيرة إلى كلام طبيعي باستخدام مهارة تطبيق Audio Speak.
  hi: Audio Speak ऐप स्किल के साथ एक छोटी स्वागत पंक्ति को स्वाभाविक आवाज़ में बदलें।
  th: เปลี่ยนข้อความต้อนรับสั้นๆ ให้เป็นเสียงพูดที่เป็นธรรมชาติด้วยสกิลแอป Audio Speak
  cs: Proměň krátký uvítací text na přirozenou řeč pomocí dovednosti Audio Speak.
  sv: Förvandla en kort välkomsthälsning till naturligt tal med app-funktionen Audio Speak.
  he: הפוך שורת פתיחה קצרה לדיבור טבעי בעזרת מיומנות האפליקציה Audio Speak.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Generate a Spoken Welcome Message. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "@skill:audio:speak Say this as warm, natural narration: Welcome back to OpenMates. Your morning briefing is ready."
  de: "@skill:audio:speak Sprich dies als warme, natürliche Erzählung: Willkommen zurück bei OpenMates. Deine morgendliche Zusammenfassung ist bereit."
  zh: "@skill:audio:speak 请用温暖、自然的旁白语调朗读：欢迎回到 OpenMates。你的早间简报已准备就绪。"
  es: "@skill:audio:speak Di esto con una narración cálida y natural: Bienvenido de nuevo a OpenMates. Tu resumen matutino está listo."
  fr: "@skill:audio:speak Dis ceci avec une narration chaleureuse et naturelle : Bienvenue sur OpenMates. Ton briefing du matin est prêt."
  pt: "@skill:audio:speak Diz isto como uma narração calorosa e natural: Bem-vindo de volta ao OpenMates. O teu resumo matinal está pronto."
  ru: "@skill:audio:speak Произнеси это как теплую, естественную закадровую речь: С возвращением в OpenMates. Твой утренний брифинг готов."
  ja: "@skill:audio:speak 温かみのある自然なナレーションでこう言って：OpenMatesへようこそ。モーニングブリーフィングの準備ができました。"
  ko: "@skill:audio:speak 이 문장을 따뜻하고 자연스러운 내레이션으로 말해 줘: OpenMates에 다시 오신 것을 환영합니다. 아침 브리핑이 준비되었습니다."
  it: "@skill:audio:speak Pronuncia questo con una narrazione calda e naturale: Bentornato su OpenMates. Il tuo briefing mattutino è pronto."
  tr: "@skill:audio:speak Bunu sıcak ve doğal bir anlatımla söyle: OpenMates'e tekrar hoş geldin. Sabah özetin hazır."
  vi: "@skill:audio:speak Hãy nói câu này bằng giọng kể ấm áp, tự nhiên: Chào mừng bạn quay trở lại với OpenMates. Bản tin sáng của bạn đã sẵn sàng."
  id: "@skill:audio:speak Ucapkan ini sebagai narasi yang hangat dan alami: Selamat datang kembali di OpenMates. Pengarahan pagi Anda sudah siap."
  pl: "@skill:audio:speak Powiedz to ciepłym, naturalnym głosem lektora: Witaj ponownie w OpenMates. Twój poranny briefing jest gotowy."
  nl: "@skill:audio:speak Zeg dit als een warme, natuurlijke vertelling: Welkom terug bij OpenMates. Je ochtendbriefing staat klaar."
  ar: "@skill:audio:speak قل هذه الجملة بسرد دافئ وطبيعي: أهلاً بك مجدداً في OpenMates. ملخصك الصباحي جاهز."
  hi: "@skill:audio:speak इसे गर्मजोशी भरी, स्वाभाविक आवाज़ में कहें: OpenMates में आपका स्वागत है। आपकी मॉर्निंग ब्रीफिंग तैयार है।"
  th: "@skill:audio:speak พูดข้อความนี้ด้วยน้ำเสียงบรรยายที่อบอุ่นและเป็นธรรมชาติ: ยินดีต้อนรับกลับสู่ OpenMates สรุปข่าวสารยามเช้าของคุณพร้อมแล้ว"
  cs: "@skill:audio:speak Řekni tohle vřelým, přirozeným hlasem: Vítej zpět v OpenMates. Tvůj ranní briefing je připraven."
  sv: "@skill:audio:speak Säg detta som en varm, naturlig berättarröst: Välkommen tillbaka till OpenMates. Din morgonbriefing är klar."
  he: "@skill:audio:speak אמור זאת כקריינות חמה וטבעית: ברוכים השבים ל-OpenMates. תדריך הבוקר שלך מוכן."
  verified_by_human: []

