    4. **ตัวอัปเดตจำนวนวันต่อเนื่อง**: ปุ่ม **"Water Plant & Increment Streak"** จะกระตุ้นการเพิ่มจำนวนในตัวนับวันต่อเนื่องของนิสัยที่เลือกทันที, ประเมินระยะการเจริญเติบโตใหม่ (เช่น *Seedling*, *Budding*, *Full Bloom*) และแสดงแอนิเมชันการบำรุงเลี้ยงที่สวยงาม
  cs: |
    Tady je kompletní interaktivní webová aplikace **Habit Garden** vytvořená v [Svelte](wiki:Svelte) 5. Obsahuje tři botanické karty návyků, filtr v reálném čase, klikatelný výběr pro detailní prohlížení a interaktivní akci zalévání, která posouvá sérii a fázi růstu rostliny.
    
    ```json
    {"type": "application", "embed_id": "facc28ea-07d0-4beb-870a-e2f77ba07f71", "app_id": "code", "skill_id": "application"}
    ```
    
    ### Hlavní prvky implementace
    1. **Svelte 5 Runes**: Vytvořeno pomocí `$state` pro reaktivní data (pole návyků, vyhledávaný výraz, aktivní výběr) a `$derived` výrazů bez vedlejších účinků pro dynamické filtrování a metriky celé zahrady.
    2. **Interaktivní filtrování**: Vyhledávání v reálném čase podle názvů, kategorií, štítků nebo jmen rostlin, včetně stavu při prázdném výsledku a tlačítka pro vymazání.
    3. **Výběr návyku**: Kliknutím na kteroukoli ze 3 karet ji označíš jako aktivní a synchronizuješ pravý panel pro detailní prohlížení.
    4. **Aktualizace série**: Tlačítko **"Water Plant & Increment Streak"** spustí okamžité zvýšení počítadla série u vybraného návyku, přehodnotí fázi růstu (např. *Seedling*, *Budding*, *Full Bloom*) a spustí vizuální animaci vyživujícího pulzu.
  sv: |
    Här är en komplett, interaktiv **Habit Garden**-webbapplikation byggd med [Svelte](wiki:Svelte) 5. Den innehåller tre botaniska vanekort, ett realtidsfilter, klickbara val för detaljerad granskning och en interaktiv bevattningsfunktion som ökar sviten och växtens tillväxtstadium.
    
    ```json
    {"type": "application", "embed_id": "facc28ea-07d0-4beb-870a-e2f77ba07f71", "app_id": "code", "skill_id": "application"}
    ```
    
    ### Höjdpunkter i implementeringen
    1. **Svelte 5 Runes**: Byggd med `$state` för reaktiv data (vanearray, sökterm, aktivt val) och sidoeffektsfria `$derived`-uttryck för dynamisk filtrering och mätvärden för hela trädgården.
    2. **Interaktiv filtrering**: Sökning i realtid som matchar titlar, kategorier, taggar eller växtnamn, med ett tomt läge och en rensningsknapp.
    3. **Val av vana**: Genom att klicka på något av de 3 korten markeras det som aktivt och synkroniserar den högra växthuspanelen för granskning.
    4. **Svit-uppdaterare**: Knappen **"Water Plant & Increment Streak"** utlöser en omedelbar ökning av den valda vanans sviträknare, omvärderar tillväxtfasen (t.ex. *Seedling*, *Budding*, *Full Bloom*) och startar en visuell närande pulsanimering.
  he: |
    הנה אפליקציית רשת של **Habit Garden** (Habit Garden) שלמה ואינטראקטיבית, שנבנתה עם [Svelte](wiki:Svelte) 5. היא כוללת שלושה כרטיסי הרגלים בוטניים, מסנן בזמן אמת, בחירה בלחיצה לבדיקה מפורטת, ופעולת השקיה אינטראקטיבית שמקדמת את רצף ההצלחות ואת שלב הצמיחה של הצמח.
    
    ```json
    {"type": "application", "embed_id": "facc28ea-07d0-4beb-870a-e2f77ba07f71", "app_id": "code", "skill_id": "application"}
    ```
    
    ### דגשים במימוש
    1. **Svelte 5 Runes**: נבנתה עם `$state` עבור נתונים ריאקטיביים (מערך הרגלים, מונח חיפוש, בחירה פעילה) וביטויי `$derived` ללא תופעות לוואי עבור סינון דינמי ומדדים לכל הגינה.
    2. **סינון אינטראקטיבי**: שאילתת חיפוש בזמן אמת המתאימה לכותרות, קטגוריות, תגיות או שמות צמחים, עם מצב ריק וכפתור ניקוי.
    3. **בחירת הרגל**: לחיצה על כל אחד מ-3 הכרטיסים מסמנת אותו כפעיל ומסנכרנת את פאנל התצוגה המפורט בצד ימין.
    4. **מעדכן רצף**: כפתור ה-**"Water Plant & Increment Streak"** מפעיל הגדלה מיידית של מונה הרצף של ההרגל הנבחר, מעריך מחדש את שלב הצמיחה (למשל: *Seedling*, *Budding*, *Full Bloom*), ומפעיל אנימציית דופק הזנה ויזואלית.
  verified_by_human: []

