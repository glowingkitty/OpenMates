summary:
  context: "Summary of example chat: Read a web page with Browse"
  en: "Use a browser to find a page heading and return the result with its source URL as JSON."
  de: Verwende einen Browser, um eine Seitenüberschrift zu finden und das Ergebnis mit der Quell-URL als JSON zurückzugeben.
  zh: 使用浏览器查找页面标题，并以 JSON 格式返回结果及其源 URL。
  es: Usa un navegador para encontrar el encabezado de una página y devuelve el resultado con su URL de origen en formato JSON.
  fr: "Utilise un navigateur pour trouver le titre d'une page et renvoie le résultat avec son URL source au format JSON."
  pt: Usa um navegador para encontrar o cabeçalho de uma página e devolve o resultado com o URL de origem em formato JSON.
  ru: Используй браузер, чтобы найти заголовок страницы и вернуть результат вместе с исходным URL в формате JSON.
  ja: ブラウザを使用してページの見出しを見つけ、その結果をソースURLとともにJSON形式で返します。
  ko: 브라우저를 사용하여 페이지 제목을 찾고 그 결과와 소스 URL을 JSON으로 반환합니다.
  it: "Usa un browser per trovare l'intestazione di una pagina e restituisci il risultato con il suo URL di origine in formato JSON."
  tr: "Bir sayfa başlığını bulmak için tarayıcı kullan ve sonucu kaynak URL'si ile birlikte JSON olarak döndür."
  vi: Sử dụng trình duyệt để tìm tiêu đề trang và trả về kết quả cùng với URL nguồn dưới dạng JSON.
  id: Gunakan browser untuk menemukan judul halaman dan mengembalikan hasilnya beserta URL sumbernya sebagai JSON.
  pl: Użyj przeglądarki, aby znaleźć nagłówek strony i zwróć wynik wraz z adresem URL źródła w formacie JSON.
  nl: Gebruik een browser om een paginakop te vinden en retourneer het resultaat met de bron-URL als JSON.
  ar: استخدم متصفحاً للعثور على عنوان صفحة وإرجاع النتيجة مع عنوان URL المصدر بتنسيق JSON.
  hi: पेज हेडिंग खोजने के लिए ब्राउज़र का उपयोग करें और परिणाम को उसके स्रोत URL के साथ JSON के रूप में वापस करें।
  th: ใช้เบราว์เซอร์เพื่อค้นหาหัวข้อของหน้าและส่งคืนผลลัพธ์พร้อม URL ต้นทางในรูปแบบ JSON
  cs: Použij prohlížeč k nalezení nadpisu stránky a vrať výsledek se zdrojovou URL adresou ve formátu JSON.
  sv: Använd en webbläsare för att hitta en sidrubrik och returnera resultatet med dess käll-URL som JSON.
  he: שימוש בדפדפן כדי למצוא כותרת של דף והחזרת התוצאה עם כתובת ה-URL של המקור כ-JSON.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Read a web page with Browse. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Use the Browse skill to open [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) and return the exact main heading and source URL as JSON. Use the browser session for this task."
  de: "Verwende den Browse-Skill, um [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) zu öffnen und die genaue Hauptüberschrift sowie die Quell-URL als JSON zurückzugeben. Nutze die Browser-Sitzung für diese Aufgabe."
  zh: "使用“浏览”技能打开 [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821)，并以 JSON 格式返回准确的主标题和源 URL。请在此任务中使用浏览器会话。"
  es: "Usa la función Navegar para abrir [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) y devuelve el encabezado principal exacto y la URL de origen en formato JSON. Usa la sesión del navegador para esta tarea."
  fr: "Utilise la compétence Browse pour ouvrir [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) et renvoie le titre principal exact et l'URL source au format JSON. Utilise la session du navigateur pour cette tâche."
  pt: "Usa a funcionalidade Browse para abrir [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) e devolve o cabeçalho principal exato e o URL de origem em formato JSON. Usa a sessão do navegador para esta tarefa."
  ru: "Используй навык Browse, чтобы открыть [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821), и верни точный главный заголовок и исходный URL в формате JSON. Используй сессию браузера для этой задачи."
  ja: "Browseスキルを使用して[!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821)を開き、正確なメイン見出しとソースURLをJSON形式で返してください。このタスクにはブラウザセッションを使用してください。"
  ko: "Browse 기능을 사용하여 [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821)을 열고 정확한 메인 제목과 소스 URL을 JSON으로 반환해 줘. 이 작업에는 브라우저 세션을 사용해."
  it: "Usa la funzione Sfoglia per aprire [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) e restituisci l'intestazione principale esatta e l'URL di origine in formato JSON. Usa la sessione del browser per questa attività."
  tr: "[!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) adresini açmak için Gözat yeteneğini kullan ve tam ana başlığı ve kaynak URL'yi JSON olarak döndür. Bu görev için tarayıcı oturumunu kullan."
  vi: "Sử dụng kỹ năng Duyệt web để mở [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) và trả về chính xác tiêu đề chính và URL nguồn dưới dạng JSON. Sử dụng phiên trình duyệt cho nhiệm vụ này."
  id: "Gunakan fitur Browse untuk membuka [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) dan mengembalikan judul utama yang tepat serta URL sumber sebagai JSON. Gunakan sesi browser untuk tugas ini."
  pl: "Użyj umiejętności Przeglądaj, aby otworzyć [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) i zwróć dokładny nagłówek główny oraz adres URL źródła jako JSON. Wykorzystaj do tego zadania sesję przeglądarki."
  nl: "Gebruik de Browse-vaardigheid om [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) te openen en de exacte hoofdkop en bron-URL als JSON te retourneren. Gebruik de browsersessie voor deze taak."
  ar: "استخدم مهارة التصفح لفتح [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) وإرجاع العنوان الرئيسي الدقيق وعنوان URL المصدر بتنسيق JSON. استخدم جلسة المتصفح لهذه المهمة."
  hi: "[!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) खोलने के लिए Browse स्किल का उपयोग करें और सटीक मुख्य हेडिंग और स्रोत URL को JSON के रूप में वापस करें। इस कार्य के लिए ब्राउज़र सेशन का उपयोग करें।"
  th: "ใช้ทักษะ Browse เพื่อเปิด [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) และส่งคืนหัวข้อหลักที่ถูกต้องและ URL ต้นทางในรูปแบบ JSON ใช้เซสชันเบราว์เซอร์สำหรับงานนี้"
  cs: "Použij dovednost Prohlížení k otevření [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) a vrať přesný hlavní nadpis a zdrojovou URL adresu jako JSON. Pro tento úkol použij relaci prohlížeče."
  sv: "Använd Browse-färdigheten för att öppna [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) och returnera den exakta huvudrubriken och käll-URL:en som JSON. Använd webbläsarsessionen för denna uppgift."
  he: "השתמש במיומנות ה-Browse כדי לפתוח את [!](embed:httpbin-org-html-d944b253-6f9c-4505-931c-93e821) ולהחזיר את הכותרת הראשית המדויקת ואת כתובת ה-URL של המקור כ-JSON. השתמש בסשן הדפדפן עבור משימה זו."
  verified_by_human: []

