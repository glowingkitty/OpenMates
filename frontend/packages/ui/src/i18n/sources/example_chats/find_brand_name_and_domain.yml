    - [ ] **Equafy**: يركز على موازنة دورات التدفق النقدي غير المنتظمة بين الوفرة والندرة.
    - [ ] **StillLedger**: يجمع بين هيكل المحاسبة الكلاسيكي والهدوء الواعي الخالي من التوتر.
    - [ ] **Cadenceo**: يشير إلى بناء إيقاع ثابت ويمكن التنبؤ به من مدفوعات العمل الحر.
