    - [ ] **Equafy**: Zaměřuje se na vyrovnávání nepravidelných cyklů cash flow (období hojnosti a nedostatku).
    - [ ] **StillLedger**: Spojuje klasickou účetní strukturu s vědomým klidem bez stresu.
    - [ ] **Cadenceo**: Naznačuje budování stabilního, předvídatelného rytmu z plateb za zakázky.
    - [ ] **HavenFin**: Rámcuje správu peněz jako bezpečný, uklidňující přístav.
