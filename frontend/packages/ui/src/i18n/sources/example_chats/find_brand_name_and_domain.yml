summary:
  context: "Summary of example chat: Find a brand name and domain"
  en: "A concise naming conversation: brainstorm seven candidates, then compare two finalists with domain, web and preliminary US trademark evidence."
  de: "Ein prägnanter Namensfindungsprozess: Brainstorming von sieben Kandidaten, gefolgt von einem Vergleich zweier Finalisten inklusive Domain-, Web- und vorläufiger US-Markenprüfung."
  zh: 一次简洁的命名对话：头脑风暴七个候选方案，然后根据域名、网络信息和初步的美国商标证据对比两个最终入围方案。
  es: "Una conversación concisa sobre nombres: lluvia de ideas de siete candidatos y comparación de dos finalistas con datos de dominio, web y marcas registradas preliminares en EE. UU."
  fr: "Une conversation concise sur le naming : brainstorme sept candidats, puis compare deux finalistes avec le domaine, le web et les preuves préliminaires de marques déposées aux États-Unis."
  pt: "Uma conversa concisa sobre nomes: brainstorm de sete candidatos e comparação de dois finalistas com evidências de domínio, web e marcas registadas preliminares nos EUA."
  ru: "Краткий диалог по неймингу: подбор семи вариантов, а затем сравнение двух финалистов с проверкой домена, упоминаний в сети и предварительными данными по товарным знакам США."
  ja: 簡潔なネーミングの対話：7つの候補を出し、ドメイン、ウェブ、米国の予備的な商標状況をもとに2つの最終候補を比較します。
  ko: "간결한 네이밍 대화: 7개의 후보를 브레인스토밍한 후, 도메인, 웹 및 미국 상표권 예비 조사를 바탕으로 최종 후보 2개를 비교합니다."
  it: "Una conversazione sintetica sul naming: fai brainstorming su sette candidati, poi confronta due finalisti con prove su dominio, web e marchi registrati preliminari negli Stati Uniti."
  tr: "Kısa bir isimlendirme sohbeti: yedi aday üzerinde beyin fırtınası yap, ardından alan adı, web ve ön ABD ticari marka kanıtlarıyla iki finalisti karşılaştır."
  vi: "Một cuộc hội thoại đặt tên súc tích: lên ý tưởng cho bảy ứng viên, sau đó so sánh hai cái tên cuối cùng với các bằng chứng về tên miền, web và nhãn hiệu sơ bộ tại Mỹ."
  id: "Percakapan penamaan yang ringkas: curah pendapat tujuh kandidat, lalu bandingkan dua finalis dengan bukti domain, web, dan merek dagang AS awal."
  pl: "Zwięzła rozmowa o nazewnictwie: burza mózgów nad siedmioma kandydatami, a następnie porównanie dwóch finalistów pod kątem domeny, obecności w sieci i wstępnych znaków towarowych w USA."
  nl: "Een beknopt gesprek over naamgeving: brainstorm over zeven kandidaten en vergelijk vervolgens twee finalisten op basis van domein, web en voorlopig bewijs van Amerikaanse handelsmerken."
  ar: "محادثة موجزة حول التسمية: عصف ذهني لسبعة مرشحين، ثم مقارنة بين اسمين نهائيين مع أدلة حول النطاق والويب والعلامات التجارية الأمريكية الأولية."
  hi: "नामकरण के लिए एक संक्षिप्त बातचीत: सात संभावित नामों पर विचार करें, फिर डोमेन, वेब और प्रारंभिक अमेरिकी ट्रेडमार्क साक्ष्यों के साथ दो फाइनलिस्टों की तुलना करें।"
  th: "บทสนทนาการตั้งชื่อที่กระชับ: ระดมสมองหา 7 ชื่อที่น่าสนใจ จากนั้นเปรียบเทียบ 2 ชื่อสุดท้ายด้วยข้อมูลโดเมน เว็บไซต์ และหลักฐานเครื่องหมายการค้าเบื้องต้นของสหรัฐฯ"
  cs: "Stručná konverzace o pojmenování: brainstorming sedmi kandidátů a následné porovnání dvou finalistů s údaji o doméně, webu a předběžných ochranných známkách v USA."
  sv: "En koncis namngivningskonversation: brainstorma sju kandidater och jämför sedan två finalister med domän-, webb- och preliminära amerikanska varumärkesbevis."
  he: "שיחת מיתוג תמציתית: סיעור מוחות לשבעה מועמדים, ולאחר מכן השוואה בין שני פיינליסטים עם נתונים על דומיין, נוכחות ברשת ומידע ראשוני על סימני מסחר בארה\"ב."
  verified_by_human: []

