    ### ตัวอย่างในชีวิตประจำวัน: การตรวจทางการแพทย์แบบรวดเร็ว

    สมมติว่าคุณเข้ารับการตรวจคัดกรองแบบรวดเร็วสำหรับสภาวะที่พบได้ยาก:

    1. **อัตราพื้นฐาน (Prior):** มีเพียง **$1\%$** ของประชากรเท่านั้นที่มีสภาวะนี้จริงๆ:
       $$P(\text{มีสภาวะ}) = 0.01, \quad P(\text{สุขภาพดี}) = 0.99$$
    2. **ความไวของการทดสอบ (Likelihood):** หากใครบางคนมีสภาวะนี้ ผลการทดสอบจะเป็นบวก $90\%$ ของจำนวนครั้งที่ตรวจ:
       $$P(\text{ผลเป็นบวก} \mid \text{มีสภาวะ}) = 0.90$$
    3. **อัตราผลบวกลวง:** หากใครบางคนไม่มีสภาวะนี้ ผลการทดสอบจะแสดงผลบวกผิดพลาด $10\%$ ของจำนวนครั้งที่ตรวจ:
       $$P(\text{ผลเป็นบวก} \mid \text{สุขภาพดี}) = 0.10$$

    คราวนี้สมมติว่า **ผลการทดสอบของคุณออกมาเป็นบวก** ความน่าจะเป็นที่คุณจะมีสภาวะนั้นจริงๆ คือเท่าใด?

    #### การใช้สูตร:
    ขั้นแรก คำนวณโอกาสทั้งหมดที่จะได้ผลการทดสอบเป็นบวก, $P(\text{ผลเป็นบวก})$:
    $$\begin{aligned}
    P(\text{ผลเป็นบวก}) &= P(\text{ผลเป็นบวก} \mid \text{มีสภาวะ}) \cdot P(\text{มีสภาวะ}) + P(\text{ผลเป็นบวก} \mid \text{สุขภาพดี}) \cdot P(\text{สุขภาพดี}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    ตอนนี้ คำนวณความน่าจะเป็นภายหลังของคุณ:
    $$P(\text{มีสภาวะ} \mid \text{ผลเป็นบวก}) = \frac{0.009}{0.108} \approx 8.3\%$$

    แม้จะใช้การทดสอบที่มีความแม่นยำถึง $90\%$ แต่โอกาสที่จะมีสภาวะนั้นจริงๆ มีเพียงประมาณ **$8.3\%$** เท่านั้น เนื่องจากสภาวะนี้พบได้ยาก ผลบวกลวงจากกลุ่มคนที่มีสุขภาพดีซึ่งเป็นคนส่วนใหญ่จึงมีจำนวนมากกว่าผลบวกจริงจากกลุ่มคนป่วยซึ่งเป็นคนส่วนน้อยได้อย่างง่ายดาย

