    ***

    **Föreslagna nästa steg:**
    * [Beräkna ett fullständigt numeriskt Bayes-problem steg för steg](/#message=Can%20we%20solve%20a%20full%20numerical%20Bayes%20theorem%20exam%20problem%20step%20by%20step%3F)
    * [Gå igenom kontinuerlig Bayes och konjugata priorer](/#message=Can%20you%20explain%20how%20Bayes%20theorem%20works%20with%20continuous%20random%20variables%20and%20priors%3F)
  he: |
    זה מדויק לגמרי. $P(A)$ היא ה**הסתברות המוקדמת** (prior probability) — האמונה הבסיסית או נקודת המוצא שלך לפני שמשקללים תצפיות חדשות או תוצאות בדיקה. בדוגמה של הבדיקה הרפואית, זה היה שיעור ה-$1\%$ באוכלוסייה הכללית.

