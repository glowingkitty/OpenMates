    ### 베이즈 정리란 무엇일까?

    [베이즈 정리](wiki:Bayes'_theorem)는 새로운 증거($B$)를 관찰했을 때 사건이나 가설($A$)의 확률을 업데이트하기 위한 수학적 규칙이야.

    기호로 나타내면 다음과 같아:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    각 구성 요소가 의미하는 바는 다음과 같아:
    * **$P(A)$ — [사전 확률](wiki:Prior_probability):** 새로운 데이터를 보기 전, $A$가 발생할 가능성에 대한 초기 추정치(기저율).
    * **$P(B|A)$ — 가능도(Likelihood):** 가설 $A$가 실제로 참일 때 증거 $B$가 관찰될 확률.
    * **$P(B)$ — [한계 가능도](wiki:Marginal_likelihood):** 가능한 모든 시나리오에서 증거 $B$가 관찰될 전체 확률.
    * **$P(A|B)$ — [사후 확률](wiki:Posterior_probability):** 증거 $B$가 발생했을 때 업데이트된 $A$의 확률.

    ---

    ### 일상적인 예시: 신속 의료 검사

    희귀 질환에 대한 신속 선별 검사를 받는다고 상상해 봐:

    1. **기저율 (사전 확률):** 인구 중 단 **$1\%$**만이 실제로 이 질환을 가지고 있어:
       $$P(\text{Condition}) = 0.01, \quad P(\text{Healthy}) = 0.99$$
    2. **검사 민감도 (가능도):** 어떤 사람이 질환을 가지고 있다면, 검사 결과가 양성으로 나올 확률은 $90\%$야:
       $$P(\text{Positive} \mid \text{Condition}) = 0.90$$
    3. **위양성률:** 질환이 없는 사람의 경우, 검사 결과가 잘못되어 양성으로 나올 확률이 $10\%$야:
       $$P(\text{Positive} \mid \text{Healthy}) = 0.10$$

    이제 **검사 결과가 양성으로 나왔다**고 가정해 보자. 실제로 질환이 있을 확률은 얼마일까?

    #### 공식 적용하기:
    우선, 양성 판정을 받을 전체 확률인 $P(\text{Positive})$를 계산해 보자:
    $$\begin{aligned}
    P(\text{Positive}) &= P(\text{Positive} \mid \text{Condition}) \cdot P(\text{Condition}) + P(\text{Positive} \mid \text{Healthy}) \cdot P(\text{Healthy}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    이제 사후 확률을 계산해 보자:
    $$P(\text{Condition} \mid \text{Positive}) = \frac{0.009}{0.108} \approx 8.3\%$$

    $90\%$의 정확도를 가진 검사임에도 불구하고, 실제로 질환을 가지고 있을 확률은 약 **$8.3\%$**에 불과해. 질환 자체가 희귀하기 때문에, 건강한 다수에게서 발생하는 위양성 결과가 질환이 있는 소수에게서 발생하는 진양성 결과보다 훨씬 많기 때문이야.

