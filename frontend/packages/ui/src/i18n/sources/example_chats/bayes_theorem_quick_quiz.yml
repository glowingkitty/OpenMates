    ### ما هي مبرهنة بايز؟

    [مبرهنة بايز](wiki:Bayes'_theorem) هي قاعدة رياضية لتحديث احتمالية وقوع حدث أو فرضية ($A$) عند ملاحظة دليل جديد ($B$).

    بالرموز:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    إليك ما يمثله كل مكون:
    * **$P(A)$ — [الاحتمال المسبق](wiki:Prior_probability):** تقديرك الأولي لمدى احتمالية $A$ قبل رؤية بيانات جديدة (المعدل الأساسي).
    * **$P(B|A)$ — الأرجحية (Likelihood):** احتمالية ملاحظة الدليل $B$ إذا كانت الفرضية $A$ صحيحة بالفعل.
    * **$P(B)$ — [الأرجحية الهامشية](wiki:Marginal_likelihood):** الاحتمال الإجمالي لملاحظة الدليل $B$ عبر جميع السيناريوهات الممكنة.
    * **$P(A|B)$ — [الاحتمال البعدي](wiki:Posterior_probability):** الاحتمال المحدث لـ $A$ بشرط حدوث الدليل $B$.

    ---

    ### مثال من الحياة اليومية: الفحص الطبي السريع

    تخيل أنك أجريت فحصاً سريعاً لحالة نادرة:

    1. **المعدل الأساسي (الاحتمال المسبق):** $1\%$ فقط من الناس في مجتمعك يعانون بالفعل من هذه الحالة:
       $$P(\text{الحالة}) = 0.01, \quad P(\text{سليم}) = 0.99$$
    2. **حساسية الفحص (الأرجحية):** إذا كان الشخص مصاباً بالحالة، تكون نتيجة الفحص إيجابية في $90\%$ من الحالات:
       $$P(\text{إيجابية} \mid \text{الحالة}) = 0.90$$
    3. **معدل الإيجابية الكاذبة:** إذا كان الشخص غير مصاب، يظهر الفحص نتيجة إيجابية كاذبة في $10\%$ من الحالات:
       $$P(\text{إيجابية} \mid \text{سليم}) = 0.10$$

    الآن لنفترض أن **نتيجتك جاءت إيجابية**. ما هو احتمال إصابتك بالحالة فعلياً؟

    #### تطبيق الصيغة:
    أولاً، احسب الاحتمال الإجمالي للحصول على نتيجة إيجابية، $P(\text{إيجابية})$:
    $$\begin{aligned}
    P(\text{إيجابية}) &= P(\text{إيجابية} \mid \text{الحالة}) \cdot P(\text{الحالة}) + P(\text{إيجابية} \mid \text{سليم}) \cdot P(\text{سليم}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    الآن، احسب الاحتمال البعدي الخاص بك:
    $$P(\text{الحالة} \mid \text{إيجابية}) = \frac{0.009}{0.108} \approx 8.3\%$$

    حتى مع فحص دقيق بنسبة $90\%$، فإن احتمال الإصابة الفعلية بالحالة هو حوالي **$8.3\%$** فقط. ولأن الحالة نادرة، فإن النتائج الإيجابية الكاذبة من الأغلبية السليمة تفوق بسهولة النتائج الإيجابية الحقيقية من الأقلية المريضة.

