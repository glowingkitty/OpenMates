    ### Apa itu Teorema Bayes?

    [Teorema Bayes](wiki:Bayes'_theorem) adalah aturan matematika untuk memperbarui probabilitas suatu peristiwa atau hipotesis ($A$) ketika kamu mengamati bukti baru ($B$).

    Dalam simbol:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Berikut adalah representasi dari setiap komponen:
    * **$P(A)$ — [Probabilitas prior](wiki:Prior_probability):** Estimasi awalmu tentang seberapa besar kemungkinan $A$ sebelum melihat data baru (garis dasar atau tingkat dasar).
    * **$P(B|A)$ — Likelihood:** Probabilitas mengamati bukti $B$ jika hipotesis $A$ benar-benar terjadi.
    * **$P(B)$ — [Likelihood marginal](wiki:Marginal_likelihood):** Probabilitas total mengamati bukti $B$ di semua skenario yang memungkinkan.
    * **$P(A|B)$ — [Probabilitas posterior](wiki:Posterior_probability):** Probabilitas $A$ yang telah diperbarui setelah bukti $B$ terjadi.

    ---

    ### Contoh Sehari-hari: Tes Medis Cepat

    Bayangkan kamu menjalani tes skrining cepat untuk suatu kondisi langka:

    1. **Tingkat Dasar (Prior):** Hanya **$1\%$** orang dalam populasimu yang benar-benar memiliki kondisi ini:
       $$P(\text{Kondisi}) = 0.01, \quad P(\text{Sehat}) = 0.99$$
    2. **Sensitivitas Tes (Likelihood):** Jika seseorang memiliki kondisi tersebut, tesnya positif $90\%$ dari waktu:
       $$P(\text{Positif} \mid \text{Kondisi}) = 0.90$$
    3. **Tingkat Positif Palsu:** Jika seseorang tidak memilikinya, tes tersebut secara salah menunjukkan hasil positif $10\%$ dari waktu:
       $$P(\text{Positif} \mid \text{Sehat}) = 0.10$$

    Sekarang andaikan **hasil tesmu positif**. Berapa probabilitas kamu benar-benar memiliki kondisi tersebut?

    #### Menerapkan Rumus:
    Pertama, hitung peluang total mendapatkan tes positif, $P(\text{Positif})$:
    $$\begin{aligned}
    P(\text{Positif}) &= P(\text{Positif} \mid \text{Kondisi}) \cdot P(\text{Kondisi}) + P(\text{Positif} \mid \text{Sehat}) \cdot P(\text{Sehat}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Sekarang, hitung probabilitas posteriormu:
    $$P(\text{Kondisi} \mid \text{Positif}) = \frac{0.009}{0.108} \approx 8.3\%$$

    Bahkan dengan tes yang akurasinya $90\%$, peluang benar-benar memiliki kondisi tersebut hanya sekitar **$8.3\%$**. Karena kondisi tersebut langka, positif palsu dari mayoritas yang sehat dengan mudah melebihi jumlah positif asli dari minoritas yang sakit.

