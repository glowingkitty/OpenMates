    * [ทบทวนเรื่องเบย์แบบต่อเนื่องและตัวร่วมการแจกแจงก่อนหน้า (conjugate priors)](/#message=Can%20you%20explain%20how%20Bayes%20theorem%20works%20with%20continuous%20random%20variables%20and%20priors%3F)
  cs: |
    To je naprosto přesné. $P(A)$ je **apriorní pravděpodobnost** – tvé výchozí přesvědčení před započtením jakýchkoli nových pozorování nebo výsledků testů. V našem příkladu s lékařským screeningem to byla $1\%$ míra v obecné populaci.

    ---

    ### Výzva: Kontrola intuice

    Zde je rychlý scénář pro otestování tvé intuice o tom, jak Bayesova věta funguje v praxi:

    ```interactive_question
    {
      "type": "choice",
      "id": "bayes_intuition_quiz_2",
      "multiple": false,
      "question": "Suppose a burglar alarm goes off in a neighborhood. If burglary is extremely rare in that area (a very tiny prior probability), what is typically true about the posterior probability that a break-in actually occurred, assuming the alarm has a non-zero false alarm rate?",
      "options": [
        {
          "id": "opt_very_high",
          "text": "The posterior probability is close to 100% because alarms are specifically built to detect break-ins."
        },
        {
          "id": "opt_counterintuitively_low",
          "text": "The posterior probability may remain surprisingly low because false alarms from normal events outnumber true break-ins."
        },
        {
          "id": "opt_equal_to_prior",
          "text": "The posterior probability remains completely unchanged regardless of whether the alarm sounds."
        },
        {
          "id": "opt_independent",
          "text": "The posterior probability depends only on alarm volume, not the baseline frequency of burglaries."
        }
      ]
    }
    ```

    ***

    **Navrhované další kroky:**
    * [Vypočítat krok za krokem kompletní numerický příklad na Bayesovu větu](/#message=Can%20we%20solve%20a%20full%20numerical%20Bayes%20theorem%20exam%20problem%20step%20by%20step%3F)
    * [Projít si spojitou Bayesovu větu a konjugovaná apriorní rozdělení](/#message=Can%20you%20explain%20how%20Bayes%20theorem%20works%20with%20continuous%20random%20variables%20and%20priors%3F)
  sv: |
    Helt rätt. $P(A)$ är **prior-sannolikheten** – din baslinje eller ursprungliga övertygelse innan du väger in några nya observationer eller testresultat. I vårt exempel med medicinsk screening var det den allmänna prevalensen på $1\%$.

    ---

    ### Utmaningsfråga: Intuitionstest

    Här är ett snabbt scenario för att testa din intuition om hur Bayes teorem fungerar i praktiken:

    ```interactive_question
