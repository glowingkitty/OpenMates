    ### Vad är Bayes sats?

    [Bayes sats](wiki:Bayes'_theorem) är en matematisk regel för att uppdatera sannolikheten för en händelse eller hypotes ($A$) när du observerar nya bevis ($B$).

    I symboler:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Här är vad varje komponent representerar:
    * **$P(A)$ — [Prior-sannolikhet](wiki:Prior_probability):** Din initiala uppskattning av hur troligt $A$ är innan du ser nya data (baslinjen eller basfrekvensen).
    * **$P(B|A)$ — Likelihood:** Sannolikheten att observera bevis $B$ om hypotes $A$ faktiskt är sann.
    * **$P(B)$ — [Marginal sannolikhet](wiki:Marginal_likelihood):** Den totala sannolikheten att observera bevis $B$ över alla möjliga scenarier.
    * **$P(A|B)$ — [Posterior-sannolikhet](wiki:Posterior_probability):** Den uppdaterade sannolikheten för $A$ givet att bevis $B$ har inträffat.

    ---

    ### Ett vardagligt exempel: Det snabba medicinska testet

    Tänk dig att du tar ett snabbtest för ett sällsynt tillstånd:

    1. **Basfrekvens (Prior):** Endast **$1\%$** av personerna i din population har faktiskt detta tillstånd:
       $$P(\text{Tillstånd}) = 0,01, \quad P(\text{Frisk}) = 0,99$$
    2. **Testets sensitivitet (Likelihood):** Om någon har tillståndet är testet positivt i $90\%$ av fallen:
       $$P(\text{Positivt} \mid \text{Tillstånd}) = 0,90$$
    3. **Falsk-positiv frekvens:** Om någon inte har det, visar testet felaktigt positivt i $10\%$ av fallen:
       $$P(\text{Positivt} \mid \text{Frisk}) = 0,10$$

    Anta nu att **ditt test kommer tillbaka positivt**. Vad är sannolikheten att du faktiskt har tillståndet?

    #### Tillämpning av formeln:
    Beräkna först den totala chansen att få ett positivt test, $P(\text{Positivt})$:
    $$\begin{aligned}
    P(\text{Positivt}) &= P(\text{Positivt} \mid \text{Tillstånd}) \cdot P(\text{Tillstånd}) + P(\text{Positivt} \mid \text{Frisk}) \cdot P(\text{Frisk}) \\
    &= (0,90 \cdot 0,01) + (0,10 \cdot 0,99) \\
    &= 0,009 + 0,099 = 0,108
    \end{aligned}$$

    Beräkna nu din posterior-sannolikhet:
    $$P(\text{Tillstånd} \mid \text{Positivt}) = \frac{0,009}{0,108} \approx 8,3\%$$

    Även med ett test som är $90\%$ korrekt är chansen att faktiskt ha tillståndet bara omkring **$8,3\%$**. Eftersom tillståndet är sällsynt, överväger falska positiva svar från den friska majoriteten enkelt de sanna positiva svaren från den sjuka minoriteten.

    ---

    ### Snabbkoll

    Låt oss testa din förståelse av termerna:

    ```interactive_question
    {
      "type": "choice",
      "id": "bayes_components_quiz_1",
      "multiple": false,
      "question": "In the formula P(A|B) = [P(B|A) * P(A)] / P(B), which term represents our initial belief or baseline rate before any new evidence is observed?",
      "options": [
        { "id": "opt_pa", "text": "P(A) — Prior probability" },
        { "id": "opt_pba", "text": "P(B|A) — Likelihood" },
        { "id": "opt_pab", "text": "P(A|B) — Posterior probability" },
        { "id": "opt_pb", "text": "P(B) — Marginal probability of evidence" }
      ]
    }
    ```
  he: |
    ### מהו משפט בייס?

    [משפט בייס](wiki:Bayes'_theorem) הוא כלל מתמטי לעדכון ההסתברות של אירוע או השערה ($A$) כאשר נצפות ראיות חדשות ($B$).

    בסימנים:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    להלן המשמעות של כל רכיב:
    * **$P(A)$ — [הסתברות פריורית](wiki:Prior_probability):** האומדן הראשוני שלך לגבי הסיכוי ש-$A$ נכון לפני שראית נתונים חדשים (קו הבסיס או שיעור הבסיס).
    * **$P(B|A)$ — נראות (Likelihood):** ההסתברות לצפות בראיה $B$ אם ההשערה $A$ אכן נכונה.
    * **$P(B)$ — [נראות שולית](wiki:Marginal_likelihood):** ההסתברות הכוללת לצפות בראיה $B$ בכל התרחישים האפשריים.
    * **$P(A|B)$ — [הסתברות פוסטריורית](wiki:Posterior_probability):** ההסתברות המעודכנת של $A$ בהינתן שהראיה $B$ התרחשה.

    ---

    ### דוגמה מחיי היומיום: הבדיקה הרפואית המהירה

    דמיין שאתה עובר בדיקת סקר מהירה למצב רפואי נדיר:

    1. **שיעור בסיס (פריור):** רק **$1\%$** מהאנשים באוכלוסייה שלך באמת סובלים מהמצב הזה:
       $$P(\text{Condition}) = 0.01, \quad P(\text{Healthy}) = 0.99$$
    2. **רגישות הבדיקה (נראות):** אם למישהו יש את המצב, הבדיקה חיובית ב-$90\%$ מהמקרים:
       $$P(\text{Positive} \mid \text{Condition}) = 0.90$$
    3. **שיעור חיובי כוזב:** אם למישהו אין את המצב, הבדיקה מראה בטעות תוצאה חיובית ב-$10\%$ מהמקרים:
       $$P(\text{Positive} \mid \text{Healthy}) = 0.10$$

    כעת נניח ש**הבדיקה שלך חזרה חיובית**. מה ההסתברות שבאמת יש לך את המצב הרפואי?

    #### יישום הנוסחה:
    ראשית, נחשב את הסיכוי הכולל לקבלת בדיקה חיובית, $P(\text{Positive})$:
    $$\begin{aligned}
    P(\text{Positive}) &= P(\text{Positive} \mid \text{Condition}) \cdot P(\text{Condition}) + P(\text{Positive} \mid \text{Healthy}) \cdot P(\text{Healthy}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    כעת, נחשב את ההסתברות הפוסטריורית שלך:
    $$P(\text{Condition} \mid \text{Positive}) = \frac{0.009}{0.108} \approx 8.3\%$$

    גם עם בדיקה שדייקנותה $90\%$, הסיכוי שבאמת יש לך את המצב הוא רק כ-**$8.3\%$**. מכיוון שהמצב נדיר, תוצאות חיוביות כוזבות מהרוב הבריא עולות בקלות במספרן על התוצאות החיוביות האמיתיות מהמיעוט החולה.

    ---

    ### בדיקה מהירה

    בוא נבחן את ההבנה שלך לגבי המונחים:

