    ### Czym jest twierdzenie Bayesa?

    [Twierdzenie Bayesa](wiki:Bayes'_theorem) to matematyczna reguła aktualizacji prawdopodobieństwa zdarzenia lub hipotezy ($A$) po zaobserwowaniu nowych dowodów ($B$).

    Zapis symboliczny:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Oto co reprezentuje każdy z elementów:
    * **$P(A)$ — [Prawdopodobieństwo a priori](wiki:Prior_probability):** Twoje wstępne oszacowanie prawdopodobieństwa $A$ przed zapoznaniem się z nowymi danymi (punkt odniesienia lub częstość bazowa).
    * **$P(B|A)$ — Wiarygodność:** Prawdopodobieństwo zaobserwowania dowodu $B$, jeśli hipoteza $A$ jest rzeczywiście prawdziwa.
    * **$P(B)$ — [Prawdopodobieństwo całkowite](wiki:Marginal_likelihood):** Całkowite prawdopodobieństwo zaobserwowania dowodu $B$ we wszystkich możliwych scenariuszach.
    * **$P(A|B)$ — [Prawdopodobieństwo a posteriori](wiki:Posterior_probability):** Zaktualizowane prawdopodobieństwo $A$ pod warunkiem, że wystąpił dowód $B$.

    ---

    ### Przykład z życia: Szybki test medyczny

    Wyobraź sobie, że wykonujesz szybki test przesiewowy na rzadkie schorzenie:

    1. **Częstość bazowa (a priori):** Tylko **$1\%$** osób w Twojej populacji rzeczywiście cierpi na to schorzenie:
       $$P(\text{Schorzenie}) = 0.01, \quad P(\text{Zdrowy}) = 0.99$$
    2. **Czułość testu (wiarygodność):** Jeśli ktoś jest chory, test daje wynik pozytywny w $90\%$ przypadków:
       $$P(\text{Pozytywny} \mid \text{Schorzenie}) = 0.90$$
    3. **Odsetek wyników fałszywie dodatnich:** Jeśli ktoś jest zdrowy, test błędnie wskazuje wynik pozytywny w $10\%$ przypadków:
       $$P(\text{Pozytywny} \mid \text{Zdrowy}) = 0.10$$

    Załóżmy teraz, że **Twój wynik testu jest pozytywny**. Jakie jest prawdopodobieństwo, że rzeczywiście masz to schorzenie?

    #### Zastosowanie wzoru:
    Najpierw oblicz całkowitą szansę na otrzymanie pozytywnego wyniku testu, $P(\text{Pozytywny})$:
    $$\begin{aligned}
    P(\text{Pozytywny}) &= P(\text{Pozytywny} \mid \text{Schorzenie}) \cdot P(\text{Schorzenie}) + P(\text{Pozytywny} \mid \text{Zdrowy}) \cdot P(\text{Zdrowy}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Teraz oblicz prawdopodobieństwo a posteriori:
    $$P(\text{Schorzenie} \mid \text{Pozytywny}) = \frac{0.009}{0.108} \approx 8.3\%$$

    Nawet przy teście o dokładności $90\%$, szansa na to, że rzeczywiście masz to schorzenie, wynosi tylko około **$8.3\%$**. Ponieważ schorzenie jest rzadkie, wyniki fałszywie dodatnie u zdrowej większości z łatwością przewyższają liczebnie wyniki prawdziwie dodatnie u chorej mniejszości.

