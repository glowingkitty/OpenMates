    ### Co je Bayesova věta?

    [Bayesova věta](wiki:Bayes'_theorem) je matematické pravidlo pro aktualizaci pravděpodobnosti jevu nebo hypotézy ($A$) na základě nového důkazu ($B$).

    V symbolech:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Zde je význam jednotlivých složek:
    * **$P(A)$ — [Apriorní pravděpodobnost](wiki:Prior_probability):** Tvůj počáteční odhad toho, jak pravděpodobný je jev $A$ předtím, než uvidíš nová data (základní míra nebo výchozí stav).
    * **$P(B|A)$ — Věrohodnost:** Pravděpodobnost, že nastane důkaz $B$, pokud je hypotéza $A$ skutečně pravdivá.
    * **$P(B)$ — [Marginální věrohodnost](wiki:Marginal_likelihood):** Celková pravděpodobnost výskytu důkazu $B$ napříč všemi možnými scénáři.
    * **$P(A|B)$ — [Aposteriorní pravděpodobnost](wiki:Posterior_probability):** Aktualizovaná pravděpodobnost jevu $A$ za předpokladu, že nastal důkaz $B$.

    ---

    ### Příklad z každodenního života: Rychlý lékařský test

    Představ si, že si uděláš rychlý screeningový test na vzácné onemocnění:

    1. **Základní míra (Apriorní pr.):** Pouze **$1\ \%$** lidí v populaci toto onemocnění skutečně má:
       $$P(\text{Onemocnění}) = 0,01, \quad P(\text{Zdravý}) = 0,99$$
    2. **Citlivost testu (Věrohodnost):** Pokud někdo onemocnění má, test je pozitivní v $90\ \%$ případů:
       $$P(\text{Pozitivní} \mid \text{Onemocnění}) = 0,90$$
    3. **Míra falešné pozitivity:** Pokud někdo onemocnění nemá, test ukáže falešně pozitivní výsledek v $10\ \%$ případů:
       $$P(\text{Pozitivní} \mid \text{Zdravý}) = 0,10$$

    Nyní předpokládejme, že **tvůj test vyjde pozitivní**. Jaká je pravděpodobnost, že onemocnění skutečně máš?

    #### Použití vzorce:
    Nejdříve vypočítej celkovou šanci na pozitivní výsledek testu, $P(\text{Pozitivní})$:
    $$\begin{aligned}
    P(\text{Pozitivní}) &= P(\text{Pozitivní} \mid \text{Onemocnění}) \cdot P(\text{Onemocnění}) + P(\text{Pozitivní} \mid \text{Zdravý}) \cdot P(\text{Zdravý}) \\
    &= (0,90 \cdot 0,01) + (0,10 \cdot 0,99) \\
    &= 0,009 + 0,099 = 0,108
    \end{aligned}$$

    Nyní vypočítej svou aposteriorní pravděpodobnost:
    $$P(\text{Onemocnění} \mid \text{Pozitivní}) = \frac{0,009}{0,108} \approx 8,3\ \%$$

    I s testem s $90\%$ přesností je šance, že skutečně máš dané onemocnění, pouze kolem **$8,3\ \%$**. Protože je onemocnění vzácné, falešně pozitivní výsledky u zdravé většiny snadno převýší skutečně pozitivní výsledky u nemocné menšiny.

