message_2:
  context: "assistant message 2 in example chat: Learn Bayes’ Theorem with a Quick Quiz. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: |
    ### What is Bayes’ Theorem?

    [Bayes' theorem](wiki:Bayes'_theorem) is a mathematical rule for updating the probability of an event or hypothesis ($A$) when you observe new evidence ($B$).

    In symbols:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Here is what each component represents:
    * **$P(A)$ — [Prior probability](wiki:Prior_probability):** Your initial estimate of how likely $A$ is before seeing new data (the baseline or base rate).
    * **$P(B|A)$ — Likelihood:** The probability of observing evidence $B$ if hypothesis $A$ is actually true.
    * **$P(B)$ — [Marginal likelihood](wiki:Marginal_likelihood):** The total probability of observing evidence $B$ across all possible scenarios.
    * **$P(A|B)$ — [Posterior probability](wiki:Posterior_probability):** The updated probability of $A$ given that evidence $B$ occurred.

    ---

    ### An Everyday Example: The Rapid Medical Test

    Imagine you take a rapid screening test for a rare condition:

    1. **Base Rate (Prior):** Only **$1\%$** of people in your population actually have this condition:
       $$P(\text{Condition}) = 0.01, \quad P(\text{Healthy}) = 0.99$$
    2. **Test Sensitivity (Likelihood):** If someone has the condition, the test is positive $90\%$ of the time:
       $$P(\text{Positive} \mid \text{Condition}) = 0.90$$
    3. **False Positive Rate:** If someone does not have it, the test falsely shows positive $10\%$ of the time:
       $$P(\text{Positive} \mid \text{Healthy}) = 0.10$$

    Now suppose **your test comes back positive**. What is the probability you actually have the condition?

    #### Applying the Formula:
    First, calculate the total chance of getting a positive test, $P(\text{Positive})$:
    $$\begin{aligned}
    P(\text{Positive}) &= P(\text{Positive} \mid \text{Condition}) \cdot P(\text{Condition}) + P(\text{Positive} \mid \text{Healthy}) \cdot P(\text{Healthy}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Now, calculate your posterior probability:
    $$P(\text{Condition} \mid \text{Positive}) = \frac{0.009}{0.108} \approx 8.3\%$$

    Even with a $90\%$ accurate test, the chance of actually having the condition is only around **$8.3\%$**. Because the condition is rare, false positives from the healthy majority easily outnumber true positives from the sick minority.

    ---

    ### Quick Check

    Let’s test your understanding of the terms:

    ```interactive_question
    {
      "type": "choice",
      "id": "bayes_components_quiz_1",
      "multiple": false,
      "question": "In the formula P(A|B) = [P(B|A) * P(A)] / P(B), which term represents our initial belief or baseline rate before any new evidence is observed?",
      "options": [
        { "id": "opt_pa", "text": "P(A) — Prior probability" },
        { "id": "opt_pba", "text": "P(B|A) — Likelihood" },
        { "id": "opt_pab", "text": "P(A|B) — Posterior probability" },
        { "id": "opt_pb", "text": "P(B) — Marginal probability of evidence" }
      ]
    }
    ```
  de: |
    ### Was ist der Satz von Bayes?

    [Der Satz von Bayes](wiki:Bayes'_theorem) ist eine mathematische Regel zur Aktualisierung der Wahrscheinlichkeit eines Ereignisses oder einer Hypothese ($A$), wenn du neue Belege ($B$) beobachtest.

    In Symbolen:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Hier ist die Bedeutung der einzelnen Komponenten:
    * **$P(A)$ — [A-priori-Wahrscheinlichkeit](wiki:Prior_probability):** Deine anfängliche Schätzung, wie wahrscheinlich $A$ ist, bevor du neue Daten siehst (die Basisrate).
    * **$P(B|A)$ — Likelihood:** Die Wahrscheinlichkeit, den Beleg $B$ zu beobachten, wenn die Hypothese $A$ tatsächlich wahr ist.
    * **$P(B)$ — [Marginale Likelihood](wiki:Marginal_likelihood):** Die Gesamtwahrscheinlichkeit, den Beleg $B$ über alle möglichen Szenarien hinweg zu beobachten.
    * **$P(A|B)$ — [A-posteriori-Wahrscheinlichkeit](wiki:Posterior_probability):** Die aktualisierte Wahrscheinlichkeit von $A$, gegeben dass der Beleg $B$ eingetreten ist.

    ---

    ### Ein Alltagsbeispiel: Der medizinische Schnelltest

    Stell dir vor, du machst einen Schnelltest auf eine seltene Erkrankung:

    1. **Basisrate (A-priori):** Nur **$1\,\%$** der Menschen in deiner Bevölkerung haben diese Erkrankung tatsächlich:
       $$P(\text{Erkrankung}) = 0,01, \quad P(\text{Gesund}) = 0,99$$
    2. **Test-Sensitivität (Likelihood):** Wenn jemand die Erkrankung hat, ist der Test in $90\,\%$ der Fälle positiv:
       $$P(\text{Positiv} \mid \text{Erkrankung}) = 0,90$$
    3. **Falsch-positiv-Rate:** Wenn jemand sie nicht hat, zeigt der Test in $10\,\%$ der Fälle fälschlicherweise ein positives Ergebnis:
       $$P(\text{Positiv} \mid \text{Gesund}) = 0,10$$

    Angenommen, **dein Test fällt positiv aus**. Wie hoch ist die Wahrscheinlichkeit, dass du die Erkrankung tatsächlich hast?

    #### Anwendung der Formel:
    Berechne zuerst die Gesamtwahrscheinlichkeit für einen positiven Test, $P(\text{Positiv})$:
    $$\begin{aligned}
    P(\text{Positiv}) &= P(\text{Positiv} \mid \text{Erkrankung}) \cdot P(\text{Erkrankung}) + P(\text{Positiv} \mid \text{Gesund}) \cdot P(\text{Gesund}) \\
    &= (0,90 \cdot 0,01) + (0,10 \cdot 0,99) \\
    &= 0,009 + 0,099 = 0,108
    \end{aligned}$$

    Berechne nun deine A-posteriori-Wahrscheinlichkeit:
    $$P(\text{Erkrankung} \mid \text{Positiv}) = \frac{0,009}{0,108} \approx 8,3\,\%$$

    Selbst bei einem zu $90\,\%$ genauen Test liegt die Wahrscheinlichkeit, die Erkrankung tatsächlich zu haben, nur bei etwa **$8,3\,\%$**. Da die Erkrankung selten ist, überwiegen die falsch-positiven Ergebnisse der gesunden Mehrheit die echt-positiven Ergebnisse der kranken Minderheit.

    ---

    ### Kurzer Check

    Testen wir dein Verständnis der Begriffe:

    ```interactive_question
    {
      "type": "choice",
      "id": "bayes_components_quiz_1",
      "multiple": false,
      "question": "In the formula P(A|B) = [P(B|A) * P(A)] / P(B), which term represents our initial belief or baseline rate before any new evidence is observed?",
      "options": [
        { "id": "opt_pa", "text": "P(A) — Prior probability" },
        { "id": "opt_pba", "text": "P(B|A) — Likelihood" },
        { "id": "opt_pab", "text": "P(A|B) — Posterior probability" },
        { "id": "opt_pb", "text": "P(B) — Marginal probability of evidence" }
      ]
    }
    ```
  zh: |
    ### 什么是贝叶斯定理？

    [贝叶斯定理](wiki:Bayes'_theorem)是一个数学法则，用于在观察到新证据 ($B$) 时更新事件或假设 ($A$) 的概率。

    用符号表示为：

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    每个组成部分代表的含义如下：
    * **$P(A)$ — [先验概率](wiki:Prior_probability)：** 在看到新数据之前，你对 $A$ 发生可能性的初始估计（基准率）。
    * **$P(B|A)$ — 似然度：** 如果假设 $A$ 确实成立，观察到证据 $B$ 的概率。
    * **$P(B)$ — [边际似然](wiki:Marginal_likelihood)：** 在所有可能的情况下观察到证据 $B$ 的总概率。
    * **$P(A|B)$ — [后验概率](wiki:Posterior_probability)：** 在证据 $B$ 发生的情况下，$A$ 更新后的概率。

    ---

    ### 日常示例：快速医疗检测

    假设你针对一种罕见病症进行了快速筛查检测：

    1. **基准率（先验）：** 在你所属的人群中，只有 **$1\%$** 的人确实患有此病：
       $$P(\text{患病}) = 0.01, \quad P(\text{健康}) = 0.99$$
    2. **检测灵敏度（似然度）：** 如果某人患病，检测结果呈阳性的概率为 $90\%$：
       $$P(\text{阳性} \mid \text{患病}) = 0.90$$
    3. **误报率：** 如果某人未患病，检测结果错误地呈阳性的概率为 $10\%$：
       $$P(\text{阳性} \mid \text{健康}) = 0.10$$

    现在假设**你的检测结果呈阳性**。你实际患病的概率是多少？

    #### 应用公式：
    首先，计算获得阳性检测结果的总概率 $P(\text{阳性})$：
    $$\begin{aligned}
    P(\text{阳性}) &= P(\text{阳性} \mid \text{患病}) \cdot P(\text{患病}) + P(\text{阳性} \mid \text{健康}) \cdot P(\text{健康}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    现在，计算你的后验概率：
    $$P(\text{患病} \mid \text{阳性}) = \frac{0.009}{0.108} \approx 8.3\%$$

    即使检测准确率高达 $90\%$，实际患病的概率也仅为 **$8.3\%$** 左右。因为这种病很罕见，来自健康大多数人的误报数量很容易超过来自患病少数人的真实阳性数量。

    ---

    ### 快速测试

    让我们测试一下你对这些术语的理解：

    ```interactive_question
    {
      "type": "choice",
      "id": "bayes_components_quiz_1",
      "multiple": false,
      "question": "In the formula P(A|B) = [P(B|A) * P(A)] / P(B), which term represents our initial belief or baseline rate before any new evidence is observed?",
      "options": [
        { "id": "opt_pa", "text": "P(A) — Prior probability" },
        { "id": "opt_pba", "text": "P(B|A) — Likelihood" },
        { "id": "opt_pab", "text": "P(A|B) — Posterior probability" },
        { "id": "opt_pb", "text": "P(B) — Marginal probability of evidence" }
      ]
    }
    ```
  es: |
    ### ¿Qué es el teorema de Bayes?

    El [teorema de Bayes](wiki:Bayes'_theorem) es una regla matemática para actualizar la probabilidad de un evento o hipótesis ($A$) cuando observas nueva evidencia ($B$).

    En símbolos:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Aquí está lo que representa cada componente:
    * **$P(A)$ — [Probabilidad a priori](wiki:Prior_probability):** Tu estimación inicial de qué tan probable es $A$ antes de ver nuevos datos (la línea de base o tasa base).
    * **$P(B|A)$ — Verosimilitud:** La probabilidad de observar la evidencia $B$ si la hipótesis $A$ es realmente cierta.
    * **$P(B)$ — [Verosimilitud marginal](wiki:Marginal_likelihood):** La probabilidad total de observar la evidencia $B$ en todos los escenarios posibles.
    * **$P(A|B)$ — [Probabilidad a posteriori](wiki:Posterior_probability):** La probabilidad actualizada de $A$ dado que ocurrió la evidencia $B$.

    ---

    ### Un ejemplo cotidiano: La prueba médica rápida

    Imagina que te haces una prueba de detección rápida para una condición poco común:

    1. **Tasa base (A priori):** Solo el **$1\%$** de las personas en tu población tienen realmente esta condición:
       $$P(\text{Condición}) = 0.01, \quad P(\text{Sano}) = 0.99$$
    2. **Sensibilidad de la prueba (Verosimilitud):** Si alguien tiene la condición, la prueba es positiva el $90\%$ de las veces:
       $$P(\text{Positivo} \mid \text{Condición}) = 0.90$$
    3. **Tasa de falsos positivos:** Si alguien no la tiene, la prueba da un falso positivo el $10\%$ de las veces:
       $$P(\text{Positivo} \mid \text{Sano}) = 0.10$$

    Ahora supón que **tu prueba da positivo**. ¿Cuál es la probabilidad de que realmente tengas la condición?

    #### Aplicando la fórmula:
    Primero, calcula la probabilidad total de obtener una prueba positiva, $P(\text{Positivo})$:
    $$\begin{aligned}
    P(\text{Positivo}) &= P(\text{Positivo} \mid \text{Condición}) \cdot P(\text{Condición}) + P(\text{Positivo} \mid \text{Sano}) \cdot P(\text{Sano}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Ahora, calcula tu probabilidad a posteriori:
    $$P(\text{Condición} \mid \text{Positivo}) = \frac{0.009}{0.108} \approx 8.3\%$$

    Incluso con una prueba con un $90\%$ de precisión, la probabilidad de tener realmente la condición es solo de alrededor del **$8.3\%$**. Debido a que la condición es poco común, los falsos positivos de la mayoría sana superan fácilmente a los positivos reales de la minoría enferma.

    ---

    ### Verificación rápida

    Pongamos a prueba tu comprensión de los términos:

    ```interactive_question
    {
