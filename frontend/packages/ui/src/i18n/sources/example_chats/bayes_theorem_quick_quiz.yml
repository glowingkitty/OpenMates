    ### ทฤษฎีบทของเบย์คืออะไร?

    [ทฤษฎีบทของเบย์](wiki:Bayes'_theorem) คือกฎทางคณิตศาสตร์สำหรับใช้ปรับปรุงความน่าจะเป็นของเหตุการณ์หรือสมมติฐาน ($A$) เมื่อคุณพบหลักฐานใหม่ ($B$)

    ในรูปสัญลักษณ์:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    นี่คือความหมายของแต่ละส่วนประกอบ:
    * **$P(A)$ — [ความน่าจะเป็นก่อนหน้า (Prior probability)](wiki:Prior_probability):** การประมาณการเบื้องต้นของคุณว่า $A$ มีโอกาสเกิดขึ้นมากน้อยเพียงใดก่อนที่จะเห็นข้อมูลใหม่ (ค่าพื้นฐานหรืออัตราพื้นฐาน)
    * **$P(B|A)$ — ความน่าจะเป็นของเหตุการณ์ (Likelihood):** ความน่าจะเป็นที่จะพบหลักฐาน $B$ หากสมมติฐาน $A$ เป็นจริง
    * **$P(B)$ — [ความน่าจะเป็นส่วนขอบ (Marginal likelihood)](wiki:Marginal_likelihood):** ความน่าจะเป็นรวมของการพบหลักฐาน $B$ ในทุกสถานการณ์ที่เป็นไปได้
    * **$P(A|B)$ — [ความน่าจะเป็นภายหลัง (Posterior probability)](wiki:Posterior_probability):** ความน่าจะเป็นที่ปรับปรุงแล้วของ $A$ หลังจากที่เกิดหลักฐาน $B$ ขึ้น

