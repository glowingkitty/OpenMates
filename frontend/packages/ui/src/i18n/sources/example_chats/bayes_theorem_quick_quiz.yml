    ### Định lý Bayes là gì?

    [Định lý Bayes](wiki:Bayes'_theorem) là một quy tắc toán học để cập nhật xác suất của một sự kiện hoặc giả thuyết ($A$) khi bạn quan sát thấy bằng chứng mới ($B$).

    Dưới dạng ký hiệu:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Dưới đây là ý nghĩa của từng thành phần:
    * **$P(A)$ — [Xác suất tiên nghiệm](wiki:Prior_probability):** Ước tính ban đầu của bạn về khả năng xảy ra của $A$ trước khi thấy dữ liệu mới (mức cơ sở hoặc tỷ lệ cơ bản).
    * **$P(B|A)$ — Khả năng (Likelihood):** Xác suất quan sát thấy bằng chứng $B$ nếu giả thuyết $A$ thực sự đúng.
    * **$P(B)$ — [Xác suất biên duyên](wiki:Marginal_likelihood):** Tổng xác suất quan sát thấy bằng chứng $B$ trên tất cả các kịch bản có thể xảy ra.
    * **$P(A|B)$ — [Xác suất hậu nghiệm](wiki:Posterior_probability):** Xác suất đã được cập nhật của $A$ sau khi bằng chứng $B$ xảy ra.

    ---

    ### Một ví dụ đời thường: Xét nghiệm y tế nhanh

    Hãy tưởng tượng bạn thực hiện một xét nghiệm sàng lọc nhanh cho một căn bệnh hiếm gặp:

    1. **Tỷ lệ cơ bản (Tiên nghiệm):** Chỉ **$1\%$** số người trong quần thể của bạn thực sự mắc bệnh này:
       $$P(\text{Bệnh}) = 0.01, \quad P(\text{Khỏe mạnh}) = 0.99$$
    2. **Độ nhạy của xét nghiệm (Khả năng):** Nếu ai đó mắc bệnh, xét nghiệm sẽ cho kết quả dương tính trong $90\%$ trường hợp:
       $$P(\text{Dương tính} \mid \text{Bệnh}) = 0.90$$
    3. **Tỷ lệ dương tính giả:** Nếu ai đó không mắc bệnh, xét nghiệm vẫn cho kết quả dương tính giả trong $10\%$ trường hợp:
       $$P(\text{Dương tính} \mid \text{Khỏe mạnh}) = 0.10$$

    Bây giờ, giả sử **kết quả xét nghiệm của bạn là dương tính**. Xác suất thực sự bạn mắc bệnh là bao nhiêu?

    #### Áp dụng công thức:
    Đầu tiên, tính tổng khả năng nhận được kết quả xét nghiệm dương tính, $P(\text{Dương tính})$:
    $$\begin{aligned}
    P(\text{Dương tính}) &= P(\text{Dương tính} \mid \text{Bệnh}) \cdot P(\text{Bệnh}) + P(\text{Dương tính} \mid \text{Khỏe mạnh}) \cdot P(\text{Khỏe mạnh}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Bây giờ, hãy tính xác suất hậu nghiệm của bạn:
    $$P(\text{Bệnh} \mid \text{Dương tính}) = \frac{0.009}{0.108} \approx 8.3\%$$

    Ngay cả với một xét nghiệm có độ chính xác $90\%$, khả năng thực sự mắc bệnh chỉ vào khoảng **$8.3\%$**. Bởi vì căn bệnh này hiếm gặp, nên số ca dương tính giả từ đa số những người khỏe mạnh dễ dàng vượt xa số ca dương tính thật từ thiểu số những người mắc bệnh.

