    ### Qu'est-ce que le théorème de Bayes ?

    Le [théorème de Bayes](wiki:Bayes'_theorem) est une règle mathématique permettant de mettre à jour la probabilité d'un événement ou d'une hypothèse ($A$) lorsque tu observes de nouvelles preuves ($B$).

    En symboles :

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Voici ce que représente chaque composante :
    * **$P(A)$ — [Probabilité a priori](wiki:Prior_probability) :** Ton estimation initiale de la probabilité de $A$ avant de voir de nouvelles données (la ligne de base ou le taux de base).
    * **$P(B|A)$ — Vraisemblance :** La probabilité d'observer la preuve $B$ si l'hypothèse $A$ est réellement vraie.
    * **$P(B)$ — [Vraisemblance marginale](wiki:Marginal_likelihood) :** La probabilité totale d'observer la preuve $B$ dans tous les scénarios possibles.
    * **$P(A|B)$ — [Probabilité a posteriori](wiki:Posterior_probability) :** La probabilité mise à jour de $A$ étant donné que la preuve $B$ s'est produite.

    ---

    ### Un exemple quotidien : le test médical rapide

    Imagine que tu passes un test de dépistage rapide pour une maladie rare :

    1. **Taux de base (A priori) :** Seulement **$1\ \%$** des personnes de ta population sont réellement atteintes de cette maladie :
       $$P(\text{Maladie}) = 0,01, \quad P(\text{Sain}) = 0,99$$
    2. **Sensibilité du test (Vraisemblance) :** Si quelqu'un a la maladie, le test est positif dans $90\ \%$ des cas :
       $$P(\text{Positif} \mid \text{Maladie}) = 0,90$$
    3. **Taux de faux positifs :** Si quelqu'un ne l'a pas, le test affiche faussement un résultat positif dans $10\ \%$ des cas :
       $$P(\text{Positif} \mid \text{Sain}) = 0,10$$

    Maintenant, suppose que **ton test soit positif**. Quelle est la probabilité que tu sois réellement atteint de la maladie ?

    #### Application de la formule :
    Tout d'abord, calcule la probabilité totale d'obtenir un test positif, $P(\text{Positif})$ :
    $$\begin{aligned}
    P(\text{Positif}) &= P(\text{Positif} \mid \text{Maladie}) \cdot P(\text{Maladie}) + P(\text{Positif} \mid \text{Sain}) \cdot P(\text{Sain}) \\
    &= (0,90 \cdot 0,01) + (0,10 \cdot 0,99) \\
    &= 0,009 + 0,099 = 0,108
    \end{aligned}$$

    Maintenant, calcule ta probabilité a posteriori :
    $$P(\text{Maladie} \mid \text{Positif}) = \frac{0,009}{0,108} \approx 8,3\ \%$$

    Même avec un test précis à $90\ \%$, la probabilité d'avoir réellement la maladie n'est que d'environ **$8,3\ \%$**. Comme la maladie est rare, les faux positifs de la majorité saine sont bien plus nombreux que les vrais positifs de la minorité malade.

