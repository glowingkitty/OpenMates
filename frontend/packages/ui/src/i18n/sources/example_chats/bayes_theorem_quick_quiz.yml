    ### बेयस प्रमेय (Bayes’ Theorem) क्या है?

    [बेयस प्रमेय](wiki:Bayes'_theorem) किसी घटना या परिकल्पना ($A$) की प्रायिकता (probability) को अपडेट करने का एक गणितीय नियम है, जब आप नया साक्ष्य ($B$) देखते हैं।

    चिह्नों में:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    यहाँ प्रत्येक घटक क्या दर्शाता है:
    * **$P(A)$ — [पूर्व प्रायिकता (Prior probability)](wiki:Prior_probability):** नया डेटा देखने से पहले $A$ के होने की संभावना का आपका शुरुआती अनुमान (बेसलाइन या बेस रेट)।
    * **$P(B|A)$ — संभावना (Likelihood):** यदि परिकल्पना $A$ वास्तव में सच है, तो साक्ष्य $B$ के दिखने की प्रायिकता।
    * **$P(B)$ — [सीमांत संभावना (Marginal likelihood)](wiki:Marginal_likelihood):** सभी संभावित परिदृश्यों में साक्ष्य $B$ के दिखने की कुल प्रायिकता।
    * **$P(A|B)$ — [उत्तर प्रायिकता (Posterior probability)](wiki:Posterior_probability):** साक्ष्य $B$ मिलने के बाद $A$ की अपडेट की गई प्रायिकता।

    ---

    ### एक रोज़मर्रा का उदाहरण: रैपिड मेडिकल टेस्ट

    कल्पना करें कि आप एक दुर्लभ स्थिति के लिए रैपिड स्क्रीनिंग टेस्ट करवाते हैं:

    1. **बेस रेट (पूर्व):** आपकी आबादी में केवल **$1\%$** लोगों को वास्तव में यह स्थिति है:
       $$P(\text{Condition}) = 0.01, \quad P(\text{Healthy}) = 0.99$$
    2. **टेस्ट संवेदनशीलता (संभावना):** यदि किसी को वह स्थिति है, तो टेस्ट $90\%$ बार पॉजिटिव आता है:
       $$P(\text{Positive} \mid \text{Condition}) = 0.90$$
    3. **फॉल्स पॉजिटिव रेट:** यदि किसी को वह स्थिति नहीं है, तो टेस्ट $10\%$ बार गलत तरीके से पॉजिटिव दिखाता है:
       $$P(\text{Positive} \mid \text{Healthy}) = 0.10$$

    अब मान लीजिए कि **आपका टेस्ट पॉजिटिव आता है**। क्या प्रायिकता है कि आपको वास्तव में वह स्थिति है?

    #### फॉर्मूला लागू करना:
    सबसे पहले, पॉजिटिव टेस्ट आने की कुल संभावना, $P(\text{Positive})$ की गणना करें:
    $$\begin{aligned}
    P(\text{Positive}) &= P(\text{Positive} \mid \text{Condition}) \cdot P(\text{Condition}) + P(\text{Positive} \mid \text{Healthy}) \cdot P(\text{Healthy}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    अब, अपनी उत्तर प्रायिकता (posterior probability) की गणना करें:
    $$P(\text{Condition} \mid \text{Positive}) = \frac{0.009}{0.108} \approx 8.3\%$$

    $90\%$ सटीक टेस्ट के बावजूद, वास्तव में वह स्थिति होने की संभावना केवल **$8.3\%$** के आसपास है। क्योंकि स्थिति दुर्लभ है, स्वस्थ बहुमत से मिलने वाले फॉल्स पॉजिटिव (गलत नतीजे) बीमार अल्पसंख्यकों से मिलने वाले ट्रू पॉजिटिव (सही नतीजे) से कहीं अधिक हो जाते हैं।

