    ### Wat is de stelling van Bayes?

    [De stelling van Bayes](wiki:Bayes'_theorem) is een wiskundige regel voor het bijwerken van de waarschijnlijkheid van een gebeurtenis of hypothese ($A$) wanneer je nieuw bewijs ($B$) waarneemt.

    In symbolen:

    $$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

    Dit is wat elk onderdeel vertegenwoordigt:
    * **$P(A)$ — [Prior-waarschijnlijkheid](wiki:Prior_probability):** Je initiële schatting van hoe waarschijnlijk $A$ is voordat je nieuwe gegevens ziet (de basislijn of het basispercentage).
    * **$P(B|A)$ — Likelihood:** De waarschijnlijkheid dat je bewijs $B$ waarneemt als hypothese $A$ daadwerkelijk waar is.
    * **$P(B)$ — [Marginale likelihood](wiki:Marginal_likelihood):** De totale waarschijnlijkheid van het waarnemen van bewijs $B$ over alle mogelijke scenario's.
    * **$P(A|B)$ — [Posterior-waarschijnlijkheid](wiki:Posterior_probability):** De bijgewerkte waarschijnlijkheid van $A$, gegeven dat bewijs $B$ heeft plaatsgevonden.

    ---

    ### Een alledaags voorbeeld: De medische sneltest

    Stel je voor dat je een sneltest doet voor een zeldzame aandoening:

    1. **Basispercentage (Prior):** Slechts **$1\%$** van de mensen in jouw populatie heeft deze aandoening daadwerkelijk:
       $$P(\text{Aandoening}) = 0.01, \quad P(\text{Gezond}) = 0.99$$
    2. **Testgevoeligheid (Likelihood):** Als iemand de aandoening heeft, is de test in $90\%$ van de gevallen positief:
       $$P(\text{Positief} \mid \text{Aandoening}) = 0.90$$
    3. **Vals-positiefpercentage:** Als iemand het niet heeft, geeft de test in $10\%$ van de gevallen onterecht een positieve uitslag:
       $$P(\text{Positief} \mid \text{Gezond}) = 0.10$$

    Stel nu dat **jouw test positief is**. Wat is de kans dat je de aandoening daadwerkelijk hebt?

    #### De formule toepassen:
    Bereken eerst de totale kans op een positieve test, $P(\text{Positief})$:
    $$\begin{aligned}
    P(\text{Positief}) &= P(\text{Positief} \mid \text{Aandoening}) \cdot P(\text{Aandoening}) + P(\text{Positief} \mid \text{Gezond}) \cdot P(\text{Gezond}) \\
    &= (0.90 \cdot 0.01) + (0.10 \cdot 0.99) \\
    &= 0.009 + 0.099 = 0.108
    \end{aligned}$$

    Bereken nu je posterior-waarschijnlijkheid:
    $$P(\text{Aandoening} \mid \text{Positief}) = \frac{0.009}{0.108} \approx 8,3\%$$

    Zelfs met een test die voor $90\%$ nauwkeurig is, is de kans dat je de aandoening daadwerkelijk hebt slechts ongeveer **$8,3\%$**. Omdat de aandoening zeldzaam is, overtreffen vals-positieven uit de gezonde meerderheid gemakkelijk de echt-positieven uit de zieke minderheid.

