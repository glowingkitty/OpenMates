summary:
  context: "Summary of example chat: Net Cash from Supplied Balances"
  en: "Calculate net cash from three balances provided by the user and explain checking, savings, and credit card debt."
  de: Berechne den Netto-Cash aus drei vom Nutzer angegebenen Salden und erkläre Girokonto, Sparkonto und Kreditkartenschulden.
  zh: 根据用户提供的三个余额计算净现金，并解释支票账户、储蓄账户和信用卡债务。
  es: Calcula el efectivo neto a partir de tres saldos proporcionados por el usuario y explica la cuenta corriente, los ahorros y la deuda de la tarjeta de crédito.
  fr: "Calcule la trésorerie nette à partir de trois soldes fournis par l'utilisateur et explique les comptes chèques, d'épargne et les dettes de carte de crédit."
  pt: Calcula o caixa líquido a partir de três saldos fornecidos pelo usuário e explica conta corrente, poupança e dívida de cartão de crédito.
  ru: Рассчитай чистый остаток на основе трех балансов, предоставленных пользователем, и объясни значения текущего счета, сбережений и задолженности по кредитной карте.
  ja: ユーザーから提供された3つの残高から純現金を計算し、当座預金、普通預金、クレジットカードの負債について説明します。
  ko: 사용자가 제공한 세 가지 잔액을 바탕으로 순현금을 계산하고 당좌 예금, 저축 예금, 신용카드 부채에 대해 설명합니다.
  it: "Calcola la liquidità netta da tre saldi forniti dall'utente e spiega il conto corrente, i risparmi e il debito della carta di credito."
  tr: Kullanıcı tarafından sağlanan üç bakiyeden net nakdi hesapla; vadesiz hesap, tasarruf hesabı ve kredi kartı borcunu açıkla.
  vi: Tính toán tiền mặt ròng từ ba số dư do người dùng cung cấp và giải thích về tài khoản thanh toán, tiết kiệm và nợ thẻ tín dụng.
  id: Hitung kas bersih dari tiga saldo yang diberikan oleh pengguna dan jelaskan tentang giro, tabungan, dan utang kartu kredit.
  pl: Oblicz gotówkę netto na podstawie trzech sald podanych przez użytkownika i wyjaśnij pojęcia konta osobistego, oszczędności oraz zadłużenia na karcie kredytowej.
  nl: Bereken de netto kasmiddelen op basis van drie door de gebruiker verstrekte saldi en geef uitleg over de betaalrekening, spaarrekening en creditcardschuld.
  ar: حساب صافي النقد من ثلاثة أرصدة قدمها المستخدم وشرح الحساب الجاري والادخار وديون بطاقة الائتمان.
  hi: उपयोगकर्ता द्वारा प्रदान किए गए तीन बैलेंस से नेट कैश की गणना करें और चेकिंग, बचत, और क्रेडिट कार्ड ऋण की व्याख्या करें।
  th: คำนวณเงินสดสุทธิจากยอดคงเหลือสามรายการที่ผู้ใช้ระบุ พร้อมอธิบายเกี่ยวกับบัญชีกระแสรายวัน บัญชีออมทรัพย์ และหนี้บัตรเครดิต
  cs: Vypočítej čistou hotovost ze tří zůstatků zadaných uživatelem a vysvětli běžný účet, spoření a dluh na kreditní kartě.
  sv: Beräkna nettokassa från tre saldon som användaren angett och förklara lönekonto, sparkonto och kreditkortsskuld.
  he: "חישוב מזומן נטו משלוש יתרות שסופקו על ידי המשתמש והסבר על עו\"ש, חיסכון וחוב בכרטיס אשראי."
