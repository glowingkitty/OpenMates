    ---

    ### Wat elk getal betekent

    1. **Betaalrekening (€1.850): Operationeel geld (werkkapitaal)**
       * Dit is je meest liquide [geldmiddelen](wiki:Cash)pool, bedoeld om regelmatige terugkerende kosten voor levensonderhoud te dekken (huur/hypotheek, nutsvoorzieningen, boodschappen, abonnementen).
       * Het hebben van €1.850 biedt een onmiddellijke buffer om roodstandkosten of gemiste betalingsdeadlines te voorkomen terwijl je wacht op binnenkomend inkomen.

    2. **Spaarrekening (€4.200): Veiligheidsmarge & reserves**
       * Dit vertegenwoordigt geparkeerd geld bedoeld voor een [noodfonds](wiki:Emergency_fund) of financiële doelen op de middellange termijn.
       * In tegenstelling tot de betaalrekening is dit geld apart gezet om dagelijkse uitgaven te ontmoedigen. Meestal levert het wat rente op, terwijl het gemakkelijk toegankelijk blijft als er onverwachte kosten zijn.

    3. **Creditcardsaldo (€640): Kortlopende [schuld](wiki:Debt)**
       * Dit is een schuld aan de kaartuitgever. Als deze volledig wordt betaald voordat de respijtperiode van het afschrift afloopt, is er geen rente verschuldigd.
       * Als het saldo echter na de vervaldatum blijft staan, rekenen creditcards over het algemeen een hoge rente (JKP), wat je netto kaspositie snel uitholt.

    4. **Netto kaspositie (€5.410): Werkelijke onmiddellijke liquiditeit**
       * Deze maatstaf meet wat er aan liquide middelen overblijft als je je huidige kortlopende creditcardschuld onmiddellijk zou aflossen.
       * Een positief cijfer geeft aan dat je volledig liquide en solvabel bent ten opzichte van de huidige kaartverplichtingen, met €5.410 resterend in reserve.

