    ### 你的净现金头寸

    你的**净现金头寸**为 **€5,410**。

    以下是明细：

    ```json
    {"type": "sheet", "embed_id": "3db1b137-abac-48a5-8c18-31ef7821ec04"}
    ```

    ---

    ### 各项指标的含义

    1. **支票账户 (€1,850)：运营现金（营运资金）**
       * 这是你流动性最强的[现金](wiki:Cash)池，用于支付定期的经常性生活开支（房租/房贷、水电费、杂货、订阅费）。
       * 拥有 €1,850 的资金可以提供即时缓冲，在等待收入到账期间防止产生透支费或错过付款期限。

    2. **储蓄账户 (€4,200)：安全边际与储备**
       * 这代表了预留用于[紧急备用金](wiki:Emergency_fund)或中期财务目标的资金。
       * 与支票账户不同，这部分现金是分开存放的，以减少日常支出，通常会产生一定的利息，同时在出现意外支出时仍可轻松提取。

    3. **信用卡余额 (€640)：短期[债务](wiki:Debt)**
       * 这是欠发卡机构的负债。如果在账单免息期结束前全额还清，则不会产生利息。
       * 然而，如果逾期未还，信用卡通常会收取高额利息 (APR)，这会迅速侵蚀你的净现金。

    4. **净现金头寸 (€5,410)：真实的即时流动性**
       * 该指标衡量如果你立即偿还当前的短期信用卡债务，剩余的流动现金是多少。
       * 正数表示你具有充分的流动性，能够偿还当前的信用卡债务，并留有 €5,410 的储备金。

    ---

    ### 建议的后续步骤

