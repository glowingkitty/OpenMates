    ### Co oznaczają poszczególne kwoty

    1. **Rachunek bieżący (1 850 €): Gotówka operacyjna (kapitał obrotowy)**
       * To Twoja najbardziej płynna pula [gotówki](wiki:Cash), przeznaczona na pokrycie regularnych, powtarzających się kosztów życia (czynsz/kredyt hipoteczny, media, zakupy spożywcze, subskrypcje).
       * Posiadanie 1 850 € zapewnia natychmiastowy bufor, który pozwala uniknąć opłat za debet lub przekroczenia terminów płatności podczas oczekiwania na wpływ dochodów.

    2. **Konto oszczędnościowe (4 200 €): Margines bezpieczeństwa i rezerwy**
       * Są to odłożone środki przeznaczone na [fundusz awaryjny](wiki:Emergency_fund) lub średnioterminowe cele finansowe.
       * W przeciwieństwie do rachunku bieżącego, ta gotówka jest oddzielona, aby zniechęcić do wydawania jej na co dzień; zazwyczaj generuje pewne odsetki, pozostając jednocześnie łatwo dostępną w razie wystąpienia nieoczekiwanych kosztów.

    3. **Saldo karty kredytowej (640 €): Krótkoterminowe [zadłużenie](wiki:Debt)**
       * Jest to zobowiązanie wobec wystawcy karty. Jeśli zostanie spłacone w całości przed upływem okresu bezodsetkowego, nie są naliczane żadne odsetki.
       * Jeśli jednak zadłużenie zostanie przeniesione poza termin płatności, karty kredytowe zazwyczaj wiążą się z wysokim oprocentowaniem (RRSO), które szybko uszczupla Twoją gotówkę netto.

    4. **Pozycja gotówkowa netto (5 410 €): Rzeczywista płynność natychmiastowa**
       * Ten wskaźnik określa, ile płynnej gotówki pozostałoby Ci po natychmiastowym uregulowaniu bieżącego, krótkoterminowego zadłużenia na karcie kredytowej.
       * Dodatni wynik wskazuje, że zachowujesz pełną płynność i wypłacalność wobec bieżących zobowiązań na karcie, a w rezerwie pozostaje Ci 5 410 €.
