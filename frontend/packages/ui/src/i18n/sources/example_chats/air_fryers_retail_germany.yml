    ### Top Recommendation for a 2-Person Household

    #### **Primary Pick: [Philips Airfryer 2000 Series 6.2L](embed:philips-airfryer-2000-fay)**

    * **Why it fits two people best:**
      * **Optimal Capacity (6.2 L):** Baskets smaller than 4.5–5 L require cooking in multiple batches even for two people. A 6.2 L basket allows you to lay two salmon fillets and a full side of vegetables or fries flat on one layer for even crisping.
      * **Kitchen Footprint:** Dual-zone machines (like Ninja or Russell Hobbs) take up significant counter space. A single 6 L basket provides ample volume while retaining a compact footprint suitable for typical German kitchen worktops.
      * **Transparent Window:** Allows checking browning without sliding the drawer open and losing heat.
      * **Value:** At €99.99, it offers reliable temperature consistency from [Philips](wiki:Philips) at a reasonable price point.

    #### **Alternative (If You Frequently Cook Two Dishes at Different Temps): [Philips Dual Basket 3000 Series (9.0L)](embed:philips-airfryer-dual-pjD)**
    If you and your partner prefer preparing proteins and side vegetables simultaneously at different temperatures and timing (e.g., chicken breasts at 180 °C and crispy potatoes at 200 °C), this model is currently discounted to €119.99 and features synchronized cooking times.

    ---

    ### Key Factors to Keep in Mind Before Buying
    1. **Drawer Shape:** Square baskets (like Cosori and Philips) accommodate flat items (steaks, baking tins, skewers) much better than round baskets of identical liter capacity.
    2. **Dishwasher Clearance:** Ensure your dishwasher has enough rack height for a 6 L single drawer or consider hand-washing non-stick coatings to prolong their lifespan.
