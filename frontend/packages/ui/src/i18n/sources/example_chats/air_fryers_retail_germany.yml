    Als jij en je partner liever proteïnen en bijgerechten tegelijkertijd bereiden op verschillende temperaturen en tijden (bijv. kipfilets op 180 °C en krokante aardappeltjes op 200 °C), dan is dit model momenteel afgeprijsd naar € 119,99 en beschikt het over gesynchroniseerde bereidingstijden.

