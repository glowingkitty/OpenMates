    #### **首选：[飞利浦 2000 系列空气炸锅 6.2L](embed:philips-airfryer-2000-fay)**

    * **为什么它最适合两人：**
      * **最佳容量 (6.2 L)：** 小于 4.5–5 L 的炸篮即使是两人份也需要分批烹饪。6.2 L 的炸篮可以让你平铺两块三文鱼排和一整份蔬菜或薯条，确保受热均匀、口感酥脆。
      * **厨房占用空间：** 双篮机型（如 Ninja 或 Russell Hobbs）会占用大量的台面空间。单篮 6 L 炸锅在提供充足容量的同时，保持了紧凑的外形，适合典型的德国厨房台面。
      * **透明视窗：** 无需拉开抽屉即可查看上色情况，避免热量流失。
