    ### Hlavní doporučení pro domácnost o 2 osobách

    #### **Hlavní volba: [Philips Airfryer 2000 Series 6,2 l](embed:philips-airfryer-2000-fay)**

    * **Proč se nejlépe hodí pro dva lidi:**
      * **Optimální kapacita (6,2 l):** Košíky menší než 4,5–5 l vyžadují vaření ve více dávkách i pro dvě osoby. Košík o objemu 6,2 l ti umožní položit dva filety z lososa a celou přílohu ze zeleniny nebo hranolek naplocho v jedné vrstvě pro rovnoměrné propečení.
      * **Prostorová náročnost:** Dvouzónové přístroje (jako Ninja nebo Russell Hobbs) zabírají na lince značné množství místa. Jeden 6l košík poskytuje dostatečný objem při zachování kompaktních rozměrů vhodných pro typické německé kuchyňské pracovní desky.
      * **Průhledné okénko:** Umožňuje kontrolovat míru opečení bez nutnosti vysouvat zásuvku a ztrácet teplo.
      * **Poměr cena/výkon:** Za 99,99 € nabízí spolehlivou konzistenci teploty od značky [Philips](wiki:Philips) za rozumnou cenu.

    #### **Alternativa (pokud často připravuješ dva pokrmy při různých teplotách): [Philips Dual Basket 3000 Series (9,0 l)](embed:philips-airfryer-dual-pjD)**
    Pokud s partnerem dáváte přednost přípravě bílkovin a zeleninových příloh současně při různých teplotách a časech (např. kuřecí prsa na 180 °C a křupavé brambory na 200 °C), je tento model aktuálně zlevněn na 119,99 € a disponuje funkcí synchronizovaného času vaření.

    ---

    ### Klíčové faktory, které je třeba zvážit před nákupem
    1. **Tvar zásuvky:** Čtvercové košíky (jako Cosori a Philips) pojmou ploché potraviny (steaky, pečicí formy, špízy) mnohem lépe než kulaté košíky o stejném objemu v litrech.
    2. **Místo v myčce:** Ujisti se, že tvoje myčka má dostatečnou výšku koše pro jednu 6l zásuvku, nebo zvaž ruční mytí nepřilnavých povrchů pro prodloužení jejich životnosti.
