message_2:
  context: "assistant message 2 in example chat: Transcribe a Short Voice Note. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: |
    Here is the transcription of your recording:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Does it contain an action item?
    **No.** The recording is simply an informational status update confirming that the transcription feature is functional. It does not mention any tasks, deadlines, or requested follow-up actions.

    ---

    **Next steps you might consider:**
    - If you'd like to test a recording that does contain tasks, feel free to share another voice note!
  de: |
    Hier ist die Transkription deiner Aufnahme:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Enthält sie ein Action Item?
    **Nein.** Die Aufnahme ist lediglich ein informatives Status-Update, das bestätigt, dass die Transkriptionsfunktion betriebsbereit ist. Es werden keine Aufgaben, Fristen oder gewünschten Folgemaßnahmen erwähnt.

    ---

    **Nächste Schritte, die du in Betracht ziehen könntest:**
    - Wenn du eine Aufnahme testen möchtest, die Aufgaben enthält, kannst du gerne eine weitere Sprachnotiz teilen!
  zh: |
    这是你录音的转录内容：

    > *"Real-time transcription is working correctly in OpenMates."*

    ### 是否包含操作项？
    **不包含。** 这段录音只是一个信息性的状态更新，确认转录功能可以正常使用。它没有提到任何任务、截止日期或要求的后续行动。

    ---

    **你可能考虑的后续步骤：**
    - 如果你想测试包含任务的录音，欢迎分享另一个语音备忘录！
  es: |
    Aquí tienes la transcripción de tu grabación:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### ¿Contiene alguna tarea pendiente?
    **No.** La grabación es simplemente una actualización de estado informativa que confirma que la función de transcripción es operativa. No menciona ninguna tarea, fecha límite ni acciones de seguimiento solicitadas.

    ---

    **Siguientes pasos que podrías considerar:**
    - Si quieres probar una grabación que sí contenga tareas, ¡no dudes en compartir otra nota de voz!
  fr: |
    Voici la transcription de ton enregistrement :

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Contient-il une tâche à effectuer ?
    **Non.** L'enregistrement est simplement une mise à jour informative confirmant que la fonctionnalité de transcription est opérationnelle. Il ne mentionne aucune tâche, échéance ou action de suivi demandée.

    ---

    **Prochaines étapes envisageables :**
    - Si tu souhaites tester un enregistrement qui contient des tâches, n'hésite pas à partager une autre note vocale !
  pt: |
    Aqui está a transcrição da tua gravação:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Contém um item de ação?
    **Não.** A gravação é apenas uma atualização de estado informativa que confirma que a funcionalidade de transcrição está operacional. Não menciona quaisquer tarefas, prazos ou ações de acompanhamento solicitadas.

    ---

    **Próximos passos que podes considerar:**
    - Se quiseres testar uma gravação que contenha tarefas, sente-te à vontade para partilhar outra nota de voz!
  ru: |
    Вот расшифровка твоей записи:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Содержит ли она задачу?
    **Нет.** Запись — это просто информационное обновление статуса, подтверждающее работоспособность функции транскрипции. В ней не упоминаются задачи, сроки или запрошенные действия.

    ---

    **Следующие шаги, которые можно рассмотреть:**
    - Если хочешь протестировать запись, содержащую задачи, присылай еще одну голосовую заметку!
  ja: |
    録音の文字起こしは以下の通りです：

    > *"Real-time transcription is working correctly in OpenMates."*

    ### アクションアイテムは含まれていますか？
    **いいえ。** この録音は、文字起こし機能が動作していることを確認する単なる情報共有のステータスアップデートです。タスク、期限、または依頼されたフォローアップアクションについては言及されていません。

    ---

    **検討できる次のステップ：**
    - タスクを含む録音をテストしたい場合は、別のボイスメモを共有してください！
  ko: |
    녹음 내용의 전사 결과는 다음과 같아:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### 작업 항목이 포함되어 있니?
    **아니.** 이 녹음은 전사 기능이 정상적으로 작동함을 확인하는 단순한 정보성 상태 업데이트야. 작업, 마감일 또는 요청된 후속 조치에 대해서는 언급되지 않았어.

    ---

    **고려해 볼 수 있는 다음 단계:**
    - 작업이 포함된 녹음을 테스트하고 싶다면 다른 음성 메모를 공유해 줘!
  it: |
    Ecco la trascrizione della tua registrazione:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Contiene un elemento d'azione?
    **No.** La registrazione è semplicemente un aggiornamento di stato informativo che conferma che la funzione di trascrizione è operativa. Non menziona compiti, scadenze o azioni di follow-up richieste.

    ---

    **Prossimi passi che potresti considerare:**
    - Se vuoi testare una registrazione che contiene dei compiti, sentiti libero di condividere un'altra nota vocale!
  tr: |
    Kaydının deşifresi burada:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Bir eylem öğesi içeriyor mu?
    **Hayır.** Kayıt, deşifre özelliğinin işlevsel olduğunu doğrulayan bilgilendirici bir durum güncellemesidir. Herhangi bir görev, son tarih veya talep edilen takip eyleminden bahsetmemektedir.

    ---

    **Düşünebileceğin sonraki adımlar:**
    - Görev içeren bir kaydı test etmek istersen, başka bir sesli not paylaşabilirsin!
  vi: |
    Đây là bản chuyển ngữ cho bản ghi âm của bạn:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Bản ghi có chứa mục hành động không?
    **Không.** Bản ghi âm chỉ đơn thuần là một cập nhật trạng thái thông tin xác nhận rằng tính năng chuyển ngữ đang hoạt động. Nó không đề cập đến bất kỳ tác vụ, thời hạn hoặc hành động theo dõi nào được yêu cầu.

    ---

    **Các bước tiếp theo bạn có thể cân nhắc:**
    - Nếu bạn muốn thử nghiệm một bản ghi có chứa các tác vụ, đừng ngần ngại chia sẻ một ghi chú thoại khác!
  id: |
    Berikut adalah transkripsi rekamanmu:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Apakah rekaman ini berisi item tindakan?
    **Tidak.** Rekaman tersebut hanyalah pembaruan status informatif yang mengonfirmasi bahwa fitur transkripsi berfungsi. Rekaman tersebut tidak menyebutkan tugas, tenggat waktu, atau tindakan tindak lanjut yang diminta.

    ---

    **Langkah selanjutnya yang mungkin ingin kamu pertimbangkan:**
    - Jika kamu ingin menguji rekaman yang berisi tugas, silakan bagikan catatan suara lainnya!
  pl: |
    Oto transkrypcja Twojego nagrania:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Czy zawiera ono zadanie do wykonania?
    **Nie.** Nagranie jest po prostu informacyjną aktualizacją statusu potwierdzającą, że funkcja transkrypcji działa. Nie wspomina o żadnych zadaniach, terminach ani prośbach o dalsze działania.

    ---

    **Dalsze kroki, które możesz rozważyć:**
    - Jeśli chcesz przetestować nagranie, które zawiera zadania, śmiało udostępnij kolejną notatkę głosową!
  nl: |
    Hier is de transcriptie van je opname:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Bevat het een actiepunt?
    **Nee.** De opname is simpelweg een informatieve statusupdate die bevestigt dat de transcriptiefunctie werkt. Er worden geen taken, deadlines of gevraagde vervolgacties genoemd.

    ---

    **Volgende stappen die je kunt overwegen:**
    - Als je een opname wilt testen die wel taken bevat, deel dan gerust nog een spraaknotitie!
  ar: |
    إليك تفريغ تسجيلك الصوتي:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### هل يحتوي على بند عمل؟
    **لا.** التسجيل هو مجرد تحديث معلوماتي للحالة يؤكد أن ميزة التفريغ الصوتي تعمل. ولا يذكر أي مهام أو مواعيد نهائية أو إجراءات متابعة مطلوبة.

    ---

    **الخطوات التالية التي قد تهمك:**
    - إذا كنت ترغب في اختبار تسجيل يحتوي على مهام، فلا تتردد في مشاركة ملاحظة صوتية أخرى!
  hi: |
    तुम्हारी रिकॉर्डिंग का ट्रांसक्रिप्शन यहाँ है:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### क्या इसमें कोई एक्शन आइटम है?
    **नहीं।** रिकॉर्डिंग केवल एक सूचनात्मक स्टेटस अपडेट है जो पुष्टि करती है कि ट्रांसक्रिप्शन फीचर काम कर रहा है। इसमें किसी भी टास्क, समय सीमा या अनुरोधित फॉलो-अप एक्शन का उल्लेख नहीं है।

    ---

    **अगले कदम जिन पर तुम विचार कर सकते हो:**
    - यदि तुम ऐसी रिकॉर्डिंग का परीक्षण करना चाहते हो जिसमें टास्क शामिल हों, तो बेझिझक एक और वॉयस नोट शेयर करें!
  th: |
    นี่คือข้อความที่ถอดจากบันทึกเสียงของคุณ:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### มีสิ่งที่ต้องทำ (action item) หรือไม่?
    **ไม่มี** บันทึกเสียงนี้เป็นเพียงการอัปเดตสถานะเพื่อให้ข้อมูลเพื่อยืนยันว่าฟีเจอร์การถอดความทำงานได้ปกติ โดยไม่ได้ระบุถึงงาน กำหนดการ หรือการดำเนินการที่ต้องทำต่อแต่อย่างใด

    ---

    **ขั้นตอนถัดไปที่คุณอาจพิจารณา:**
    - หากคุณต้องการทดสอบบันทึกเสียงที่มีงานที่ต้องทำ สามารถแชร์บันทึกเสียงอื่นมาได้เลย!
  cs: |
    Tady je přepis tvé nahrávky:

    > *"Real-time transcription is working correctly in OpenMates."*

    ### Obsahuje úkol?
    **Ne.** Nahrávka je pouze informativní aktualizace stavu potvrzující, že funkce přepisu je funkční. Neobsahuje žádné úkoly, termíny ani požadované následné kroky.

    ---

    **Další kroky, které můžeš zvážit:**
