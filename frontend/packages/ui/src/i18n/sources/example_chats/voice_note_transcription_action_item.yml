summary:
  context: "Summary of example chat: Transcribe a Short Voice Note"
  en: "Transcribe a short recording and check whether it contains a task to follow up."
  de: Transkribiere eine kurze Aufnahme und prüfe, ob sie eine zu erledigende Aufgabe enthält.
  zh: 转录一段短录音并检查其中是否包含需要跟进的任务。
  es: Transcribe una grabación corta y comprueba si contiene una tarea de seguimiento.
  fr: "Transcrire un court enregistrement et vérifier s'il contient une tâche à effectuer."
  pt: Transcreve uma gravação curta e verifica se contém uma tarefa para acompanhamento.
  ru: Расшифруй короткую запись и проверь, содержит ли она задачу для выполнения.
  ja: 短い録音を文字起こしし、フォローアップすべきタスクが含まれているかどうかを確認します。
  ko: 짧은 녹음을 전사하고 후속 작업이 필요한 작업이 포함되어 있는지 확인합니다.
  it: Trascrivi una breve registrazione e controlla se contiene un compito da seguire.
  tr: Kısa bir kaydı deşifre et ve takip edilecek bir görev içerip içermediğini kontrol et.
  vi: Chuyển một bản ghi âm ngắn thành văn bản và kiểm tra xem nó có chứa tác vụ cần theo dõi hay không.
  id: Transkripsikan rekaman pendek dan periksa apakah rekaman tersebut berisi tugas untuk ditindaklanjuti.
  pl: Przetranskrybuj krótkie nagranie i sprawdź, czy zawiera zadanie do wykonania.
  nl: Transcribeer een korte opname en controleer of deze een te volgen taak bevat.
  ar: فرّغ تسجيلاً قصيراً وتحقق مما إذا كان يحتوي على مهمة للمتابعة.
  hi: एक छोटी रिकॉर्डिंग को ट्रांसक्राइब करें और जांचें कि क्या इसमें फॉलो-अप करने के लिए कोई टास्क है।
  th: ถอดความบันทึกเสียงสั้นๆ และตรวจสอบว่ามีงานที่ต้องดำเนินการต่อหรือไม่
  cs: Přepiš krátkou nahrávku a zjisti, zda obsahuje úkol k vyřízení.
  sv: Transkribera en kort inspelning och kontrollera om den innehåller en uppgift att följa upp.
  he: תמלול הקלטה קצרה ובדיקה אם היא מכילה משימה להמשך טיפול.
  verified_by_human: []

