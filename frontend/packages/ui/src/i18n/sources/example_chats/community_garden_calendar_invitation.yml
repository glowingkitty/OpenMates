summary:
  context: "Summary of example chat: Community Garden Calendar Invitation"
  en: "Create an importable calendar invitation with a Berlin time zone, event agenda, and reminder for a volunteer planting session."
  de: Erstelle eine importierbare Kalendereinladung mit Berliner Zeitzone, Agenda und Erinnerung für eine ehrenamtliche Pflanzaktion.
  zh: 创建一个可导入的日历邀请，包含柏林时区、活动议程以及志愿者种植活动的提醒。
  es: Crea una invitación de calendario importable con la zona horaria de Berlín, el orden del día del evento y un recordatorio para una sesión de plantación de voluntarios.
  fr: Crée une invitation de calendrier importable avec le fuseau horaire de Berlin, un ordre du jour et un rappel pour une session de plantation bénévole.
  pt: Cria um convite de calendário importável com o fuso horário de Berlim, agenda do evento e lembrete para uma sessão de plantio voluntário.
  ru: Создай приглашение в календарь с часовым поясом Берлина, программой мероприятия и напоминанием для волонтерской сессии по посадке растений.
  ja: ベルリンのタイムゾーン、イベントのアジェンダ、リマインダーを含む、ボランティア植え付けセッション用のインポート可能なカレンダー招待状を作成します。
  ko: 베를린 시간대, 이벤트 안건, 자원봉사 식재 세션 알림이 포함된 가져오기 가능한 캘린더 초대장을 생성합니다.
  it: "Crea un invito a calendario importabile con fuso orario di Berlino, ordine del giorno dell'evento e promemoria per una sessione di piantumazione di volontari."
  tr: Berlin saat dilimi, etkinlik gündemi ve gönüllü dikim oturumu için hatırlatıcı içeren, içe aktarılabilir bir takvim davetiyesi oluştur.
  vi: Tạo lời mời lịch có thể nhập được với múi giờ Berlin, chương trình sự kiện và lời nhắc cho buổi trồng cây tình nguyện.
  id: Buat undangan kalender yang dapat diimpor dengan zona waktu Berlin, agenda acara, dan pengingat untuk sesi penanaman sukarelawan.
  pl: Utwórz zaproszenie do kalendarza do zaimportowania z berlińską strefą czasową, agendą i przypomnieniem o sesji sadzenia dla wolontariuszy.
  nl: Maak een importeerbare agenda-uitnodiging met een Berlijnse tijdzone, een agenda voor het evenement en een herinnering voor een plantsessie met vrijwilligers.
  ar: إنشاء دعوة تقويم قابلة للاستيراد بتوقيت برلين، مع جدول أعمال للحدث وتذكير لجلسة زراعة تطوعية.
  hi: बर्लिन समय क्षेत्र, कार्यक्रम एजेंडा और स्वयंसेवक रोपण सत्र के रिमाइंडर के साथ एक आयात करने योग्य कैलेंडर आमंत्रण बनाएं।
  th: สร้างคำเชิญปฏิทินที่สามารถนำเข้าได้ พร้อมเขตเวลาเบอร์ลิน กำหนดการกิจกรรม และการแจ้งเตือนสำหรับเซสชันอาสาสมัครปลูกต้นไม้
  cs: Vytvoř importovatelnou pozvánku do kalendáře s berlínským časovým pásmem, programem akce a připomenutím pro dobrovolnické sázení.
  sv: Skapa en importerbar kalenderinbjudan med tidszonen för Berlin, agenda och påminnelse för ett volontärpass för plantering.
  he: יצירת הזמנה ללוח שנה הניתנת לייבוא עם אזור זמן של ברלין, סדר יום לאירוע ותזכורת למפגש שתילה של מתנדבים.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Community Garden Calendar Invitation. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Could you make an importable calendar invitation for a fictional community garden volunteer planting session on Saturday, October 17, 2026, from 10:00 to 12:00 in Europe/Berlin? Use Gartenweg 12, Berlin as a fictional example location, include a short agenda and a 24-hour reminder, and give me the iCalendar text to save as an .ics file."
  de: "Könntest du eine importierbare Kalendereinladung für eine fiktive ehrenamtliche Pflanzaktion im Gemeinschaftsgarten am Samstag, den 17. Oktober 2026, von 10:00 bis 12:00 Uhr in Europe/Berlin erstellen? Nutze den Gartenweg 12, Berlin als fiktiven Beispielort, füge eine kurze Agenda sowie eine 24-Stunden-Erinnerung hinzu und gib mir den iCalendar-Text zum Speichern als .ics-Datei."
  zh: "你能为 2026 年 10 月 17 日星期六 10:00 到 12:00（欧洲/柏林时间）的一场虚构社区花园志愿者种植活动制作一个可导入的日历邀请吗？请使用“Gartenweg 12, Berlin”作为虚构的示例地点，包含简短的议程和 24 小时前的提醒，并提供可保存为 .ics 文件的 iCalendar 文本。"
  es: "¿Podrías crear una invitación de calendario importable para una sesión ficticia de plantación de voluntarios en un huerto comunitario el sábado 17 de octubre de 2026, de 10:00 a 12:00 en Europe/Berlin? Usa Gartenweg 12, Berlín como ubicación ficticia de ejemplo, incluye un breve orden del día y un recordatorio de 24 horas, y dame el texto iCalendar para guardarlo como un archivo .ics."
  fr: "Pourrais-tu créer une invitation de calendrier importable pour une session de plantation bénévole fictive dans un jardin communautaire le samedi 17 octobre 2026, de 10h00 à 12h00 en Europe/Berlin ? Utilise Gartenweg 12, Berlin comme lieu fictif, inclus un court ordre du jour et un rappel 24 heures à l'avance, et donne-moi le texte iCalendar à enregistrer sous forme de fichier .ics."
  pt: "Poderias criar um convite de calendário importável para uma sessão fictícia de plantio voluntário numa horta comunitária no sábado, 17 de outubro de 2026, das 10:00 às 12:00 em Europe/Berlin? Usa Gartenweg 12, Berlim como um exemplo fictício de localização, inclui uma agenda curta e um lembrete de 24 horas, e dá-me o texto iCalendar para guardar como um ficheiro .ics."
  ru: "Можешь создать приглашение в календарь для вымышленной волонтерской сессии по посадке растений в общественном саду в субботу, 17 октября 2026 года, с 10:00 до 12:00 (время Europe/Berlin)? Используй Gartenweg 12, Berlin в качестве примера местоположения, добавь краткую программу и напоминание за 24 часа, и предоставь мне текст iCalendar для сохранения в виде .ics-файла."
  ja: "2026年10月17日（土）10:00から12:00（ヨーロッパ/ベルリン時間）に開催される、架空のコミュニティガーデン・ボランティア植え付けセッションのインポート可能なカレンダー招待状を作成してくれますか？場所は架空の例として Gartenweg 12, Berlin を使用し、短いアジェンダと24時間前のリマインダーを含めてください。また、.icsファイルとして保存するためのiCalendarテキストを教えてください。"
  ko: "2026년 10월 17일 토요일 오전 10시부터 12시까지(Europe/Berlin 시간대) 진행되는 가상의 커뮤니티 정원 자원봉사 식재 세션을 위한 가져오기 가능한 캘린더 초대장을 만들어 줄래? 장소는 가상의 예시인 Gartenweg 12, Berlin으로 설정하고, 짧은 안건과 24시간 전 알림을 포함해 줘. .ics 파일로 저장할 수 있는 iCalendar 텍스트를 알려줘."
  it: "Potresti creare un invito a calendario importabile per una sessione fittizia di piantumazione di volontari in un orto comunitario per sabato 17 ottobre 2026, dalle 10:00 alle 12:00 in fuso orario Europe/Berlin? Usa Gartenweg 12, Berlino come esempio di posizione fittizia, includi un breve ordine del giorno e un promemoria 24 ore prima, e forniscimi il testo iCalendar da salvare come file .ics."
  tr: "17 Ekim 2026 Cumartesi günü, saat 10:00 ile 12:00 arasında Avrupa/Berlin saat diliminde gerçekleşecek kurgusal bir topluluk bahçesi gönüllü dikim etkinliği için içe aktarılabilir bir takvim davetiyesi oluşturabilir misin? Kurgusal örnek konum olarak Gartenweg 12, Berlin adresini kullan, kısa bir gündem ve 24 saat öncesi için bir hatırlatıcı ekle ve bana .ics dosyası olarak kaydedebileceğim iCalendar metnini ver."
  vi: "Bạn có thể tạo một lời mời lịch có thể nhập được cho một buổi trồng cây tình nguyện tại vườn cộng đồng giả định vào Thứ Bảy, ngày 17 tháng 10 năm 2026, từ 10:00 đến 12:00 theo múi giờ Europe/Berlin không? Sử dụng Gartenweg 12, Berlin làm địa điểm ví dụ giả định, bao gồm một chương trình nghị sự ngắn và lời nhắc trước 24 giờ, và cung cấp cho tôi văn bản iCalendar để lưu dưới dạng tệp .ics."
  id: "Bisakah kamu membuat undangan kalender yang dapat diimpor untuk sesi penanaman sukarelawan kebun komunitas fiktif pada hari Sabtu, 17 Oktober 2026, dari pukul 10:00 hingga 12:00 di Europe/Berlin? Gunakan Gartenweg 12, Berlin sebagai contoh lokasi fiktif, sertakan agenda singkat dan pengingat 24 jam, serta berikan teks iCalendar untuk disimpan sebagai file .ics."
  pl: "Czy możesz przygotować zaproszenie do kalendarza do zaimportowania na fikcyjną sesję sadzenia dla wolontariuszy w ogrodzie społecznościowym w sobotę, 17 października 2026 r., w godzinach 10:00–12:00 w strefie Europe/Berlin? Jako przykładową lokalizację podaj Gartenweg 12, Berlin, dołącz krótką agendę i przypomnienie na 24 godziny przed oraz prześlij mi tekst iCalendar do zapisania jako plik .ics."
  nl: "Zou je een importeerbare agenda-uitnodiging kunnen maken voor een fictieve plantsessie met vrijwilligers in een gemeenschapstuin op zaterdag 17 oktober 2026, van 10:00 tot 12:00 in Europe/Berlin? Gebruik Gartenweg 12, Berlijn als fictief voorbeeldadres, voeg een korte agenda en een herinnering van 24 uur toe, en geef me de iCalendar-tekst om op te slaan als een .ics-bestand."
  ar: "هل يمكنك إنشاء دعوة تقويم قابلة للاستيراد لجلسة زراعة تطوعية في حديقة مجتمعية خيالية يوم السبت 17 أكتوبر 2026، من الساعة 10:00 إلى 12:00 بتوقيت أوروبا/برلين؟ استخدم Gartenweg 12، برلين كموقع خيالي، وقم بتضمين جدول أعمال قصير وتذكير قبل 24 ساعة، وأعطني نص iCalendar لحفظه كملف .ics."
  hi: "क्या आप शनिवार, 17 अक्टूबर, 2026 को यूरोप/बर्लिन में 10:00 से 12:00 बजे तक एक काल्पनिक सामुदायिक उद्यान स्वयंसेवक रोपण सत्र के लिए एक आयात करने योग्य कैलेंडर आमंत्रण बना सकते हैं? काल्पनिक उदाहरण स्थान के रूप में Gartenweg 12, Berlin का उपयोग करें, इसमें एक संक्षिप्त एजेंडा और 24 घंटे का रिमाइंडर शामिल करें, और मुझे .ics फ़ाइल के रूप में सहेजने के लिए iCalendar टेक्स्ट दें।"
  th: "ช่วยสร้างคำเชิญปฏิทินที่สามารถนำเข้าได้สำหรับเซสชันอาสาสมัครปลูกต้นไม้ในสวนชุมชน (สมมติ) ในวันเสาร์ที่ 17 ตุลาคม 2026 เวลา 10:00 ถึง 12:00 น. ในเขตเวลา Europe/Berlin ได้ไหม? ใช้ Gartenweg 12, Berlin เป็นสถานที่ตัวอย่างสมมติ รวมกำหนดการสั้นๆ และการแจ้งเตือนล่วงหน้า 24 ชั่วโมง และขอข้อความ iCalendar เพื่อบันทึกเป็นไฟล์ .ics ด้วย"
  cs: "Mohl bys vytvořit importovatelnou pozvánku do kalendáře pro fiktivní dobrovolnické sázení v komunitní zahradě na sobotu 17. října 2026 od 10:00 do 12:00 v časovém pásmu Europe/Berlin? Jako fiktivní ukázkovou polohu použij Gartenweg 12, Berlín, zahrň krátký program a připomenutí 24 hodin předem a pošli mi text iCalendar, který si uložím jako soubor .ics."
  sv: "Kan du skapa en importerbar kalenderinbjudan för ett fiktivt volontärpass för plantering i en gemenskapsträdgård lördagen den 17 oktober 2026, från 10:00 till 12:00 i Europe/Berlin? Använd Gartenweg 12, Berlin som ett fiktivt exempel på plats, inkludera en kort agenda och en 24-timmarspåminnelse, och ge mig iCalendar-texten för att spara som en .ics-fil."
  he: "האם תוכל ליצור הזמנה ללוח שנה הניתנת לייבוא עבור מפגש שתילה דמיוני של מתנדבים בגינה קהילתית ביום שבת, 17 באוקטובר 2026, בין השעות 10:00 ל-12:00 ב-Europe/Berlin? השתמש ב-Gartenweg 12, Berlin כמיקום דמיוני לדוגמה, כלול סדר יום קצר ותזכורת של 24 שעות מראש, ותן לי את טקסט ה-iCalendar כדי לשמור אותו כקובץ .ics."
  verified_by_human: []

message_2:
  context: "assistant message 2 in example chat: Community Garden Calendar Invitation. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: |
    Here is the standard [iCalendar](wiki:ICalendar) (`.ics`) data for your community garden planting session. It includes the Europe/Berlin timezone definition, event details, an agenda, and a 24-hour display reminder (VALARM).

    Save the content below into a text file named `community_garden_planting.ics` and import it into your calendar client (such as Google Calendar, Apple Calendar, or Microsoft Outlook).

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### Event Summary
    * **Date & Time:** Saturday, October 17, 2026, 10:00 – 12:00 CEST
    * **Location:** Gartenweg 12, Berlin
    * **Reminder:** 1 day before (`TRIGGER:-P1D`)

    ***

    **Suggested Next Steps:**
    * [Draft an invitation email for volunteers](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
    * [Prepare a planting & tool checklist document](/#message=Create%20a%20volunteer%20checklist%20document%20for%20the%20community%20garden%20session.)
  de: |
    Hier sind die standardmäßigen [iCalendar](wiki:ICalendar) (`.ics`)-Daten für deine Pflanzaktion im Gemeinschaftsgarten. Sie enthalten die Zeitzonendefinition für Europe/Berlin, Veranstaltungsdetails, eine Agenda und eine 24-Stunden-Erinnerung (VALARM).

    Speichere den untenstehenden Inhalt in einer Textdatei namens `community_garden_planting.ics` und importiere sie in deinen Kalender-Client (wie Google Calendar, Apple Calendar oder Microsoft Outlook).

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### Zusammenfassung der Veranstaltung
    * **Datum & Uhrzeit:** Samstag, 17. Oktober 2026, 10:00 – 12:00 MESZ
    * **Ort:** Gartenweg 12, Berlin
    * **Erinnerung:** 1 Tag vorher (`TRIGGER:-P1D`)

    ***

    **Vorgeschlagene nächste Schritte:**
    * [Entwurf einer Einladungs-E-Mail für Freiwillige](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
    * [Erstellung einer Checkliste für Pflanzen und Werkzeuge](/#message=Create%20a%20volunteer%20checklist%20document%20for%20the%20community%20garden%20session.)
  zh: |
    这是为您社区花园种植活动准备的标准 [iCalendar](wiki:ICalendar) (`.ics`) 数据。它包含欧洲/柏林时区定义、活动详情、议程以及 24 小时显示提醒 (VALARM)。

    请将以下内容保存为名为 `community_garden_planting.ics` 的文本文件，并将其导入您的日历客户端（如 Google 日历、Apple 日历或 Microsoft Outlook）。

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### 活动摘要
    * **日期与时间：** 2026 年 10 月 17 日，星期六，10:00 – 12:00 CEST
    * **地点：** Gartenweg 12, Berlin
    * **提醒：** 1 天前 (`TRIGGER:-P1D`)

    ***

    **建议的后续步骤：**
    * [为志愿者起草一封邀请邮件](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
    * [准备一份种植和工具清单文档](/#message=Create%20a%20volunteer%20checklist%20document%20for%20the%20community%20garden%20session.)
  es: |
    Aquí tienes los datos estándar de [iCalendar](wiki:ICalendar) (`.ics`) para tu sesión de plantación en el huerto comunitario. Incluye la definición de la zona horaria Europe/Berlin, los detalles del evento, un orden del día y un recordatorio visual de 24 horas (VALARM).

    Guarda el contenido de abajo en un archivo de texto llamado `community_garden_planting.ics` e impórtalo en tu cliente de calendario (como Google Calendar, Apple Calendar o Microsoft Outlook).

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### Resumen del evento
    * **Fecha y hora:** Sábado, 17 de octubre de 2026, 10:00 – 12:00 CEST
    * **Ubicación:** Gartenweg 12, Berlín
    * **Recordatorio:** 1 día antes (`TRIGGER:-P1D`)

    ***

    **Próximos pasos sugeridos:**
    * [Redactar un correo de invitación para los voluntarios](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
    * [Preparar un documento con la lista de tareas y herramientas](/#message=Create%20a%20volunteer%20checklist%20document%20for%20the%20community%20garden%20session.)
  fr: |
    Voici les données standard [iCalendar](wiki:ICalendar) (`.ics`) pour ta session de plantation au jardin communautaire. Elles incluent la définition du fuseau horaire Europe/Berlin, les détails de l'événement, un ordre du jour et un rappel d'affichage de 24 heures (VALARM).

    Enregistre le contenu ci-dessous dans un fichier texte nommé `community_garden_planting.ics` et importe-le dans ton client de calendrier (comme Google Calendar, Apple Calendar ou Microsoft Outlook).

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### Résumé de l'événement
    * **Date et heure :** Samedi 17 octobre 2026, 10h00 – 12h00 CEST
    * **Lieu :** Gartenweg 12, Berlin
    * **Rappel :** 1 jour avant (`TRIGGER:-P1D`)

    ***

    **Prochaines étapes suggérées :**
    * [Rédiger un e-mail d'invitation pour les bénévoles](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
    * [Préparer un document de liste de contrôle pour la plantation et les outils](/#message=Create%20a%20volunteer%20checklist%20document%20for%20the%20community%20garden%20session.)
