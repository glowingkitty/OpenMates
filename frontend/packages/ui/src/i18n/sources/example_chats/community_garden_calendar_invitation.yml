    שמור את התוכן למטה בקובץ טקסט בשם `community_garden_planting.ics` וייבא אותו לתוכנת לוח השנה שלך (כגון Google Calendar, Apple Calendar או Microsoft Outlook).

    ```json
    {"type": "code", "embed_id": "6deff7cb-4e99-4dd3-9052-3985e09a9cc9"}
    ```

    ### סיכום האירוע
    * **תאריך ושעה:** יום שבת, 17 באוקטובר 2026, 10:00 – 12:00 CEST
    * **מיקום:** Gartenweg 12, Berlin
    * **תזכורת:** יום אחד לפני (`TRIGGER:-P1D`)

    ***

    **צעדים הבאים מומלצים:**
    * [ניסוח אימייל הזמנה למתנדבים](/#message=Draft%20a%20friendly%20email%20announcing%20the%20community%20garden%20planting%20session%20on%20October%2017%20with%20the%20attached%20calendar%20invite.)
