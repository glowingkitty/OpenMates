    \n* **Filled-Stil (Ideal für den aktiven oder ausgewählten Zustand):**\n  * **Home:** `tabler:home-filled`  \n    [!](embed:home-filled-DZ8)\n  * **Einstellungen:** `tabler:settings-filled`  \n    [!](embed:settings-filled-ZtD)\n\n---\n\n### 2. Material Symbols Light (Raffiniert, moderne Geometrie)\n\n**Lizenz:** Apache 2.0  \n**Autor:** Google  \n**Sammlung:** Material Symbols Light  \n\n* **Outline-Stil:**\n  * **Home:** `material-symbols-light:home-outline`  \n    [!](embed:home-outline-yJt)\n  * **Einstellungen:** `material-symbols-light:settings-outline`  \n    [!](embed:settings-outline-nOD)\n\n* **Rounded-Outline-Stil (Weichere Ecken):**\n  * **Home:** `material-symbols-light:home-outline-rounded`  \n    [!](embed:home-outline-rounded-joT)\n  * **Einstellungen:** `material-symbols-light:settings-outline-rounded`  \n    [!](embed:settings-outline-rounded-fX5)\n\n---\n\n### 3. Material Symbols (Standardstärke)\n\n**Lizenz:** Apache 2.0  \n**Autor:** Google  \n**Sammlung:** Material Symbols  \n\n* **Outline-Stil:**\n  * **Home:** `material-symbols:home-outline`  \n    [!](embed:home-outline-IoS)\n\
