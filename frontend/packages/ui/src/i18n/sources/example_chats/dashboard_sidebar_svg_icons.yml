    \ 2. Material Symbols Light (精致、现代几何风格)\n\n**许可协议：** Apache 2.0  \n**作者：** Google  \n**集合：** Material Symbols Light  \n\n* **轮廓风格：**\n  * **主页：** `material-symbols-light:home-outline`  \n    [!](embed:home-outline-yJt)\n  * **设置：** `material-symbols-light:settings-outline`  \n    [!](embed:settings-outline-nOD)\n\n* **圆角轮廓风格 (更柔和的边角)：**\n  * **主页：** `material-symbols-light:home-outline-rounded`  \n    [!](embed:home-outline-rounded-joT)\n  * **设置：** `material-symbols-light:settings-outline-rounded`  \n    [!](embed:settings-outline-rounded-fX5)\n\n---\n\n### 3. Material Symbols (标准字重)\n\n**许可协议：** Apache 2.0  \n**作者：** Google  \n**集合：** Material Symbols  \n\n* **轮廓风格：**\n  * **主页：** `material-symbols:home-outline`  \n    [!](embed:home-outline-IoS)\n  * **设置：** `material-symbols:settings-outline`  \n    [!](embed:settings-outline-t5y)\n\n* **填充风格：**\n  * **主页：** `material-symbols:home`  \n    [!](embed:home-99u)\n  * **设置：** `material-symbols:settings`  \n    [!](embed:settings-2Pu)\n\n---\n\n### 总结表\n\n```json\n{\"type\": \"sheet\", \"embed_id\": \"a332ffe9-78e3-437b-926d-8c432bb8df51\"\
