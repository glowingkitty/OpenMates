summary:
  context: 'Summary of example chat: Dashboard Sidebar SVG Icons'
  en: Find clean open-source SVG home and settings icons for a dashboard sidebar, with canonical names, collections, and licenses.
  de: Finde schlichte Open-Source-SVG-Icons für Home und Einstellungen für eine Dashboard-Seitenleiste, inklusive kanonischer Namen, Kollektionen und Lizenzen.
  zh: 为仪表板侧边栏寻找简洁的开源 SVG 主页和设置图标，包含规范名称、集合和许可协议。
  es: Encuentra iconos SVG de inicio y ajustes de código abierto para una barra lateral de panel, con nombres canónicos, colecciones y licencias.
  fr: Trouve des icônes SVG open-source épurées d'accueil et de paramètres pour une barre latérale de tableau de bord, avec noms canoniques, collections et licences.
  pt: Encontra ícones SVG de código aberto de início e configurações para uma barra lateral de dashboard, com nomes canônicos, coleções e licenças.
  ru: Найди лаконичные SVG-иконки «главная» и «настройки» с открытым исходным кодом для боковой панели дашборда, с каноническими названиями, коллекциями и лицензиями.
  ja: ダッシュボードのサイドバーに適した、クリーンなオープンソースのSVGホーム・設定アイコンを、正規名、コレクション、ライセンス情報と共に見つけます。
  ko: 대시보드 사이드바를 위한 깔끔한 오픈 소스 SVG 홈 및 설정 아이콘을 정식 명칭, 컬렉션, 라이선스와 함께 찾아보세요.
  it: Trova icone SVG open-source pulite per home e impostazioni per la barra laterale di una dashboard, con nomi canonici, collezioni e licenze.
  tr: Bir kontrol paneli yan menüsü için standart adları, koleksiyonları ve lisanslarıyla birlikte sade, açık kaynaklı SVG ana sayfa ve ayarlar simgeleri bul.
  vi: Tìm các biểu tượng SVG trang chủ và cài đặt mã nguồn mở, tinh tế cho thanh bên bảng điều khiển, kèm theo tên chuẩn, bộ sưu tập và giấy phép.
  id: Temukan ikon SVG beranda dan pengaturan sumber terbuka yang bersih untuk bilah samping dasbor, lengkap dengan nama kanonik, koleksi, dan lisensi.
  pl: Znajdź estetyczne ikony SVG open-source (strona główna i ustawienia) do paska bocznego dashboardu, wraz z nazwami kanonicznymi, kolekcjami i licencjami.
  nl: Vind strakke open-source SVG home- en instellingen-iconen voor een dashboard-zijbalk, inclusief canonieke namen, collecties en licenties.
  ar: اعثر على أيقونات SVG بسيطة ومفتوحة المصدر للمنزل والإعدادات للشريط الجانبي للوحة التحكم، مع الأسماء المعيارية والمجموعات والتراخيص.
  hi: डैशबोर्ड साइडबार के लिए क्लीन ओपन-सोर्स SVG होम और सेटिंग्स आइकन खोजें, उनके प्रामाणिक नामों, संग्रहों और लाइसेंसों के साथ।
  th: ค้นหาไอคอน SVG หน้าแรกและตั้งค่าแบบโอเพนซอร์สสำหรับแถบข้างแดชบอร์ด พร้อมระบุชื่อ คอลเลกชัน และใบอนุญาต
  cs: Najdi čisté open-source SVG ikony domů a nastavení pro postranní panel dashboardu, včetně kanonických názvů, kolekcí a licencí.
  sv: Hitta stilrena SVG-ikoner med öppen källkod för hem och inställningar till ett dashboard-sidofält, med kanoniska namn, samlingar och licenser.
  he: מציאת אייקוני SVG נקיים בקוד פתוח של "בית" ו"הגדרות" עבור סרגל צד של לוח בקרה, כולל שמות קנוניים, אוספים ורישיונות.
  verified_by_human: []
message_1:
