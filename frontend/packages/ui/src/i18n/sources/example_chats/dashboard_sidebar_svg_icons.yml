  ko: 대시보드 사이드바에 사용할 깔끔한 UI 아이콘 세트에서 오픈 소스 SVG 홈 및 설정 아이콘을 찾아줘. 아이콘 이름, 컬렉션, 라이선스를 포함해줘.
