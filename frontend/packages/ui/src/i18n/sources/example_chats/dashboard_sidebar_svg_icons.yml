  tr: Bir kontrol paneli yan menüsü için sade kullanıcı arayüzü simge setlerinden açık kaynaklı SVG ana sayfa ve ayarlar simgeleri bul. Simge adlarını, koleksiyonlarını ve lisanslarını dahil et.
  vi: Tìm các biểu tượng SVG trang chủ và cài đặt mã nguồn mở từ các bộ biểu tượng giao diện người dùng tinh tế cho thanh bên bảng điều khiển. Bao gồm tên biểu tượng, bộ sưu tập và giấy phép.
  id: Temukan ikon SVG beranda dan pengaturan sumber terbuka dari set ikon UI yang bersih untuk bilah samping dasbor. Sertakan nama ikon, koleksi, dan lisensi.
  pl: Znajdź ikony SVG open-source (strona główna i ustawienia) z przejrzystych zestawów ikon UI do paska bocznego dashboardu. Uwzględnij nazwy ikon, kolekcje i licencje.
  nl: Vind open-source SVG home- en instellingen-iconen uit strakke UI-iconensets voor een dashboard-zijbalk. Vermeld de iconennamen, collecties en licenties.
  ar: ابحث عن أيقونات SVG مفتوحة المصدر للمنزل والإعدادات من مجموعات أيقونات واجهة مستخدم بسيطة للشريط الجانبي للوحة التحكم. قم بتضمين أسماء الأيقونات والمجموعات والتراخيص.
  hi: डैशबोर्ड साइडबार के लिए क्लीन UI आइकन सेट से ओपन-सोर्स SVG होम और सेटिंग्स आइकन खोजें। आइकन के नाम, संग्रह और लाइसेंस शामिल करें।
  th: ค้นหาไอคอน SVG หน้าแรกและตั้งค่าแบบโอเพนซอร์สจากชุดไอคอน UI สำหรับแถบข้างแดชบอร์ด พร้อมระบุชื่อไอคอน คอลเลกชัน และใบอนุญาต
  cs: Najdi open-source SVG ikony domů a nastavení z čistých sad UI ikon pro postranní panel dashboardu. Uveď názvy ikon, kolekce a licence.
  sv: Hitta SVG-ikoner med öppen källkod för hem och inställningar från stilrena UI-ikonuppsättningar för ett dashboard-sidofält. Inkludera ikonnamn, samlingar och licenser.
  he: מצא אייקוני SVG בקוד פתוח של "בית" ו"הגדרות" מתוך ערכות אייקונים נקיות עבור סרגל צד של לוח בקרה. כלול את שמות האייקונים, האוספים והרישיונות.
