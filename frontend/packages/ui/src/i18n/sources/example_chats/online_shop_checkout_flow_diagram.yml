    ### フローの解説とUXの考慮事項

    1. **順次進行**: 顧客は、**カート**、**チェックアウト詳細**（配送/請求先）、**決済処理**へと直線的に進みます。
    2. **拒否とエラーからの復帰**:
       - 決済が拒否された際、顧客を空のセッションに戻すのではなく、**支払い方法の変更**という判断ステップに誘導します。
       - 点線の直交パスは**チェックアウト詳細**に直接戻るようになっており、顧客はカートの中身を失うことなく、支払い方法の切り替え、カード情報の入力ミスの修正、または別のデジタルウォレットの選択が可能です。
       - 再試行しないことを選択した場合、セッションは**カート保存済み**という終了状態でクリーンに終了し、その後のカゴ落ちフォローアップメールに繋げることができます。
    3. **編集可能な構造**: すべてのステップとパスには標準の `data-om-*` バインディングが含まれているため、ラベルのカスタマイズ、割引クーポンのステップの追加、ゲスト購入の分岐の統合などを直接行うことができます。

    ---

    **次のステップと改善案:**
    - 配送情報の前に、**ゲスト購入 vs. ログインアカウント**の分岐を導入しますか？
    - このフローのユーザーインターフェースやカスタムイラストをデザインしている場合は、ワイヤーフレームや手書き風のアイコンバッジを統合して、各ステップを補完することも可能です。
