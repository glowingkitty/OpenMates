    ### फ्लो ब्रेकडाउन और UX विचार

    1. **क्रमिक प्रगति**: ग्राहक **कार्ट**, **चेकआउट विवरण** (शिपिंग/बिलिंग), और **भुगतान प्रोसेसिंग** के माध्यम से रैखिक रूप से आगे बढ़ता है।
    2. **अस्वीकृति और त्रुटि सुधार**:
       - ग्राहक को खाली सत्र पर वापस भेजने के बजाय, अस्वीकृति उसे **तरीका बदलें** निर्णय चरण पर ले जाती है।
       - डैश्ड ऑर्थोगोनल पाथ सीधे **चेकआउट विवरण** पर वापस ले जाता है, जिससे ग्राहक अपनी कार्ट की वस्तुओं को खोए बिना भुगतान के तरीके बदल सकता है, कार्ड डेटा में टाइपो को ठीक कर सकता है, या वैकल्पिक डिजिटल वॉलेट चुन सकता है।
       - यदि वे पुनः प्रयास नहीं करना चुनते हैं, तो सत्र **कार्ट सेव्ड** टर्मिनल स्थिति में समाप्त हो जाता है, जिससे बाद में एबंडन्ड-कार्ट ईमेल भेजने का विकल्प खुला रहता है।
    3. **संपादन योग्य संरचना**: प्रत्येक चरण और पथ में मानक `data-om-*` बाइंडिंग शामिल हैं ताकि तुम लेबल कस्टमाइज़ कर सको, डिस्काउंट कूपन चरण जोड़ सको, या सीधे गेस्ट चेकआउट ब्रांच को एकीकृत कर सको।

