       - Il percorso ortogonale tratteggiato riporta direttamente ai **Dettagli del checkout**, consentendo al cliente di cambiare metodo di pagamento, correggere errori di battitura nei dati della carta o scegliere un portafoglio digitale alternativo senza perdere gli articoli nel carrello.
       - Se il cliente sceglie di non riprovare, la sessione termina in modo pulito in uno stato finale di **Carrello salvato**, lasciando aperta la possibilità di inviare email di follow-up per il carrello abbandonato.
