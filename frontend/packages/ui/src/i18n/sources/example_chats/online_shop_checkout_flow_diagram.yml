       - Przerywana ścieżka prostopadła prowadzi bezpośrednio z powrotem do **Danych do zamówienia**, umożliwiając klientowi zmianę metody płatności, poprawienie literówek w danych karty lub wybranie innego portfela cyfrowego bez utraty produktów w koszyku.
       - Jeśli klient zdecyduje się nie ponawiać próby, sesja kończy się stanem końcowym **Koszyk zapisany**, co otwiera drogę do e-maili przypominających o porzuconym koszyku.
    3. **Edytowalna struktura**: Każdy krok i ścieżka zawiera standardowe powiązania `data-om-*`, dzięki czemu możesz dostosować etykiety, dodać krok z kuponem rabatowym lub bezpośrednio zintegrować ścieżki dla gości.

