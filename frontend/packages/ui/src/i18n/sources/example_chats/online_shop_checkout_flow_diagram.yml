    ### Analiza przepływu i kwestie UX

    1. **Postęp sekwencyjny**: Klient przechodzi liniowo przez **Koszyk**, **Dane do zamówienia** (wysyłka/fakturowanie) i **Przetwarzanie płatności**.
    2. **Odrzucenie i przywracanie po błędzie**:
