    {"type": "diagram_html", "embed_id": "a80ba74c-c404-4b05-bcbb-fcb4bbc455b6"}
    ```

    ### รายละเอียดขั้นตอนและข้อควรพิจารณาด้าน UX

    1. **ลำดับขั้นตอนที่ต่อเนื่อง**: ลูกค้าจะดำเนินการตามลำดับเส้นตรงผ่าน **รถเข็น**, **รายละเอียดการชำระเงิน** (การจัดส่ง/การเรียกเก็บเงิน) และ **การประมวลผลการชำระเงิน**
    2. **การจัดการเมื่อถูกปฏิเสธและการกู้คืนข้อผิดพลาด**:
       - แทนที่จะปล่อยให้ลูกค้ากลับไปยังเซสชันที่ว่างเปล่า การปฏิเสธจะนำไปสู่ขั้นตอนการตัดสินใจ **เปลี่ยนวิธีชำระเงิน**
       - เส้นประแนวตั้งจะนำทางกลับไปยัง **รายละเอียดการชำระเงิน** โดยตรง ช่วยให้ลูกค้าสามารถเปลี่ยนวิธีชำระเงิน แก้ไขคำที่พิมพ์ผิดในข้อมูลบัตร หรือเลือกกระเป๋าเงินดิจิทัลอื่นได้โดยไม่สูญเสียสินค้าในรถเข็น
       - หากพวกเขาเลือกที่จะไม่ลองใหม่ เซสชันจะจบลงอย่างเรียบร้อยในสถานะปลายทาง **บันทึกรถเข็นแล้ว** ซึ่งช่วยให้สามารถส่งอีเมลติดตามผลสำหรับรถเข็นที่ถูกละทิ้งได้
    3. **โครงสร้างที่แก้ไขได้**: ทุกขั้นตอนและเส้นทางประกอบด้วยการเชื่อมโยง `data-om-*` มาตรฐาน เพื่อให้คุณสามารถปรับแต่งป้ายกำกับ เพิ่มขั้นตอนคูปองส่วนลด หรือรวมสาขาการชำระเงินแบบไม่ใช้บัญชีได้โดยตรง

    ---

    **ขั้นตอนถัดไปและการปรับปรุง:**
    - คุณต้องการเพิ่มสาขา **การชำระเงินแบบไม่ใช้บัญชี (Guest) เทียบกับบัญชีที่เข้าสู่ระบบ** ก่อนรายละเอียดการจัดส่งหรือไม่?
    - หากคุณกำลังออกแบบส่วนต่อประสานกับผู้ใช้ (UI) หรือภาพประกอบที่กำหนดเองสำหรับขั้นตอนนี้ เราสามารถสำรวจการรวมโครงร่าง (Wireframes) หรือไอคอนแบบวาดด้วยมือที่กำหนดเองเพื่อเสริมในแต่ละขั้นตอนได้
  cs: |
    ```json
    {"type": "diagram_html", "embed_id": "a80ba74c-c404-4b05-bcbb-fcb4bbc455b6"}
    ```

    ### Rozbor toku a UX aspekty

    1. **Sekvenční postup**: Zákazník postupuje lineárně přes **Košík**, **Údaje v pokladně** (doprava/fakturace) a **Zpracování platby**.
    2. **Zamítnutí a náprava chyb**:
       - Místo toho, aby byl zákazník vrácen do prázdné relace, zamítnutí vede k rozhodovacímu kroku **Změnit metodu**.
       - Přerušovaná kolmá cesta vede přímo zpět do **Údajů v pokladně**, což zákazníkovi umožňuje změnit platební metodu, opravit překlepy v údajích o kartě nebo vybrat jinou digitální peněženku, aniž by přišel o položky v košíku.
       - Pokud se rozhodnou pokus neopakovat, relace čistě končí v koncovém stavu **Košík uložen**, což otevírá dveře pro následné e-maily o opuštěném košíku.
    3. **Upravitelná struktura**: Každý krok a cesta obsahuje standardní vazby `data-om-*`, takže si můžeš přizpůsobit popisky, přidat krok se slevovým kupónem nebo přímo integrovat větve pro nákup bez registrace.

    ---

    **Další kroky a iterace:**
    - Chceš před dodací údaje vložit větev **Nákup bez registrace vs. Přihlášený účet**?
    - Pokud pro tento tok navrhuješ uživatelská rozhraní nebo vlastní ilustrace, můžeme prozkoumat integraci drátěných modelů (wireframes) nebo vlastních ručně kreslených ikon pro doplnění jednotlivých kroků.
  sv: |
    ```json
    {"type": "diagram_html", "embed_id": "a80ba74c-c404-4b05-bcbb-fcb4bbc455b6"}
    ```

    ### Genomgång av flödet och UX-överväganden

    1. **Sekventiellt förlopp**: Kunden rör sig linjärt genom **Varukorg**, **Utcheckningsuppgifter** (frakt/fakturering) och **Betalningshantering**.
    2. **Nekad betalning och felhantering**:
       - Istället för att kunden hamnar i en tom session igen, leder en nekad betalning till ett beslutsteg för att **Ändra metod**.
       - Den streckade ortogonala vägen leder direkt tillbaka till **Utcheckningsuppgifter**, vilket gör att kunden kan byta betalningsmetod, korrigera felskrivningar i kortuppgifter eller välja en annan digital plånbok utan att förlora sina varor i korgen.
       - Om de väljer att inte försöka igen, avslutas sessionen snyggt i sluttillståndet **Varukorg sparad**, vilket lämnar dörren öppen för uppföljande e-postmeddelanden om övergivna varukorgar.
    3. **Redigerbar struktur**: Varje steg och väg innehåller standardiserade `data-om-*`-bindningar så att du kan anpassa etiketter, lägga till ett steg för rabattkoder eller integrera grenar för gästutcheckning direkt.

    ---

    **Nästa steg och iterationer:**
    - Vill du införa en gren för **Gästutcheckning kontra inloggat konto** före leveransuppgifterna?
    - Om du designar användargränssnitt eller anpassade illustrationer för det här flödet, kan vi utforska att integrera trådskisser eller anpassade handritade ikonmärken för att komplettera stegen.
  he: |
    ```json
    {"type": "diagram_html", "embed_id": "a80ba74c-c404-4b05-bcbb-fcb4bbc455b6"}
    ```

    ### פירוט הזרימה ושיקולי UX

    1. **התקדמות רציפה**: הלקוח מתקדם באופן ליניארי דרך **עגלת הקניות**, **פרטי התשלום** (משלוח/חיוב) ו**עיבוד התשלום**.
    2. **דחייה ושחזור משגיאות**:
       - במקום להחזיר את הלקוח לסשן ריק, דחייה מובילה לשלב החלטה של **שינוי אמצעי תשלום**.
       - הנתיב המקווקו מוביל ישירות חזרה ל**פרטי התשלום**, מה שמאפשר ללקוח להחליף אמצעי תשלום, לתקן שגיאות הקלדה בנתוני הכרטיס או לבחור בארנק דיגיטלי חלופי מבלי לאבד את הפריטים בעגלה.
       - אם הם בוחרים שלא לנסות שוב, הסשן מסתיים בצורה נקייה במצב סופי של **העגלה נשמרה**, מה שמשאיר פתח למיילים של מעקב אחר עגלה נטושה.
    3. **מבנה ניתן לעריכה**: כל שלב ונתיב מכילים קישורי `data-om-*` סטנדרטיים כדי שתוכל להתאים אישית תוויות, להוסיף שלב של קופון הנחה או לשלב ענפים של תשלום כאורח באופן ישיר.

    ---

    **צעדים הבאים וסבבי עבודה:**
    - האם תרצה להוסיף ענף של **תשלום כאורח לעומת חשבון מחובר** לפני פרטי המשלוח?
    - אם אתה מעצב ממשקי משתמש או איורים מותאמים אישית לזרימה זו, נוכל לבחון שילוב של שרטוטים (wireframes) או סמלי אייקונים מצוירים ביד כדי להשלים את השלבים.
  verified_by_human: []

