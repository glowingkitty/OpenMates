    ### Analyse van de flow & UX-overwegingen

    1. **Sequentiële voortgang**: De klant doorloopt lineair het **Winkelmandje**, de **Checkout-gegevens** (verzending/facturering) en de **Betalingsverwerking**.
    2. **Geweigerde betalingen & foutherstel**:
       - In plaats van de klant terug te sturen naar een lege sessie, leidt een weigering naar een beslissingsstap **Methode wijzigen**.
       - Het gestippelde orthogonale pad leidt direct terug naar de **Checkout-gegevens**, zodat de klant van betaalmethode kan wisselen, typefouten in kaartgegevens kan corrigeren of een alternatieve digitale portemonnee kan kiezen zonder de items in het winkelmandje te verliezen.
       - Als ze besluiten het niet opnieuw te proberen, eindigt de sessie netjes in een eindstatus **Winkelmandje opgeslagen**, wat de deur openzet voor vervolg-e-mails over verlaten winkelmandjes.
    3. **Bewerkbare structuur**: Elke stap en elk pad bevat standaard `data-om-*` bindings, zodat je labels kunt aanpassen, een stap voor kortingsbonnen kunt toevoegen of direct vertakkingen voor gast-checkouts kunt integreren.

