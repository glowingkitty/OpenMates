    ### تحليل التدفق واعتبارات تجربة المستخدم

    1. **التقدم المتسلسل**: يتقدم العميل خطياً عبر **سلة التسوق**، و**تفاصيل إتمام الشراء** (الشحن/الفواتير)، و**معالجة الدفع**.
    2. **الرفض واستعادة الأخطاء**:
       - بدلاً من إعادة العميل إلى جلسة فارغة، يوجه الرفض العميل إلى خطوة قرار **تغيير الوسيلة**.
       - يوجه المسار المتعامد المتقطع العميل مباشرة إلى **تفاصيل إتمام الشراء**، مما يسمح له بتغيير وسيلة الدفع، أو تصحيح الأخطاء المطبعية في بيانات البطاقة، أو اختيار محفظة رقمية بديلة دون فقدان عناصر السلة.
       - إذا اختاروا عدم إعادة المحاولة، تنتهي الجلسة بشكل نظيف في حالة نهائية هي **حفظ السلة**، مما يترك الباب مفتوحاً لرسائل البريد الإلكتروني لمتابعة السلال المتروكة.
    3. **هيكل قابل للتعديل**: تحتوي كل خطوة ومسار على روابط `data-om-*` قياسية بحيث يمكنك تخصيص التسميات، أو إضافة خطوة كوبون خصم، أو دمج فروع إتمام الشراء كضيف مباشرة.

    ---

    **الخطوات التالية والتكرارات:**
    - هل ترغب في تقديم فرع **إتمام الشراء كضيف مقابل حساب مسجل** قبل تفاصيل الشحن؟
    - إذا كنت تصمم واجهات مستخدم أو رسوماً توضيحية مخصصة لهذا التدفق، يمكننا استكشاف دمج النماذج الأولية (wireframes) أو أيقونات مرسومة يدوياً لتكملة الخطوات.
