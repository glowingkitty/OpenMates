  id: |
    Berikut adalah panduan perawatan khusus musim gugur yang ringkas untuk selasih (*Ocimum basilicum*) milikmu di balkon yang menghadap ke timur di Berlin:

    ---

    ### 1. Cahaya (Balkon Menghadap ke Timur)
    * **Apa yang diharapkan:** Di musim gugur Berlin, matahari terbit lebih rendah dan durasi siang hari berkurang dengan cepat. Balkon yang menghadap ke timur memberikan sinar matahari pagi yang lembut selama sekitar 2–4 jam, yang tergolong rendah bagi selasih yang menyukai matahari.
    * **Penempatan:** Letakkan pot sedekat mungkin dengan pagar luar dengan aman, jauh dari bayangan dinding, untuk memaksimalkan paparan langit pagi tanpa penghalang.
    * **Trik reflektif:** Menempatkannya di depan dinding berwarna putih atau terang dapat memantulkan cahaya sekitar tambahan ke arah daun.

    ---

    ### 2. Rutinitas Penyiraman
    * **Aturan:** Kebutuhan air selasih turun drastis di cuaca dingin karena penguapan melambat dan pertumbuhan tanaman terhenti.
    * **Periksa dulu:** Siram **hanya** saat 2–3 cm bagian atas tanah (sekitar satu inci) terasa kering saat disentuh. Jangan menyiram berdasarkan jadwal kalender tetap.
    * **Waktu:** Selalu siram di pagi hari dengan air suhu ruangan. Hindari air keran dingin langsung dari pipa, yang dapat mengejutkan akar yang dingin.
    * **Drainage:** Jangan biarkan pot terendam di air dalam alas pot; tanah yang dingin dan tergenang air dengan cepat menyebabkan busuk akar (*Fusarium* atau jamur air).

    ---

    ### 3. Kapan Harus Membawanya Masuk
    * **Ambang batas kritis:** Selasih adalah herba tropis yang sensitif. Ia mengalami stres dingin fisiologis di bawah **10°C (50°F)** dan mengalami kerusakan jaringan parah atau mati di sekitar **0°C hingga 4°C**.
    * **Waktu untuk Berlin:** Suhu malam hari di Berlin sering turun di bawah 10°C pada akhir September atau awal Oktober.
    * **Tindakan:** **Bawa masuk sekarang** jika prakiraan suhu malam turun di bawah 10°C.

    ---

    ### 4. Tanda-tanda Stres Dingin & Cahaya
    * **Daun menghitam atau transparan:** Tanda jelas cedera dingin (kerusakan sel akibat suhu di bawah 8–10°C).
    * **Dedaunan memungu atau kusam:** Respons klasik terhadap stres dingin yang dikombinasikan dengan penyerapan nutrisi yang lambat.
    * **Layu saat tanah lembap:** Akar kedinginan atau busuk akar; akar terlalu dingin atau rusak untuk menyerap kelembapan meskipun ada air.
    * **Pertumbuhan memanjang / hijau pucat:** Kurang sinar matahari (etiolasi).

    ---

    ### 5. Pindah ke Dalam Ruangan: Tips Transisi Cepat
    1. **Jendela paling terang:** Letakkan di ambang jendela yang menghadap ke selatan jika tersedia; jika tidak, jendela yang menghadap ke timur atau barat yang paling terang.
    2. **Hindari aliran udara & radiator:** Jauhkan dari aliran udara jendela yang retak serta panas kering yang bertiup langsung dari radiator (*Heizung*).
    3. **Pemeriksaan hama:** Periksa bagian bawah daun untuk kutu daun atau tungau laba-laba sebelum meletakkannya di dekat tanaman hias dalam ruangan lainnya.
    4. **Panen dari atas:** Petik kuncup bunga dan pasangan daun teratas untuk mendorong pertumbuhan yang rimbun daripada berbunga yang kurus memanjang.

