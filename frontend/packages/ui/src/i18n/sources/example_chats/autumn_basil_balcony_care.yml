  vi: |
    Dưới đây là hướng dẫn chăm sóc húng tây (*Ocimum basilicum*) ngắn gọn dành riêng cho mùa thu trên ban công hướng Đông tại Berlin:

    ---

    ### 1. Ánh sáng (Ban công hướng Đông)
    * **Kỳ vọng:** Vào mùa thu ở Berlin, mặt trời mọc thấp hơn và thời gian ban ngày giảm nhanh. Ban công hướng Đông đón nắng sáng nhẹ trong khoảng 2–4 giờ, mức này hơi thấp đối với loại cây ưa nắng như húng tây.
    * **Vị trí:** Đặt chậu càng gần lan can bên ngoài càng tốt (đảm bảo an toàn), tránh bóng râm của tường để tối đa hóa việc tiếp xúc với bầu trời buổi sáng.
    * **Mẹo phản chiếu:** Đặt cây sát bức tường màu trắng hoặc màu sáng có thể giúp phản chiếu thêm ánh sáng xung quanh lên lá.

    ---

    ### 2. Chế độ tưới nước
    * **Quy tắc:** Nhu cầu nước của húng tây giảm đáng kể khi thời tiết mát mẻ vì sự bay hơi chậm lại và cây ngừng phát triển.
    * **Kiểm tra trước:** **Chỉ** tưới nước khi lớp đất mặt sâu 2–3 cm cảm thấy khô khi chạm vào. Không tưới theo lịch cố định.
    * **Thời điểm:** Luôn tưới vào buổi sáng bằng nước ở nhiệt độ phòng. Tránh dùng nước máy lạnh trực tiếp từ vòi vì sẽ làm rễ đang mát bị sốc.
    * **Thoát nước:** Đừng bao giờ để chậu ngâm trong nước đọng ở đĩa lót; đất mát và úng nước sẽ nhanh chóng dẫn đến thối rễ (nấm *Fusarium* hoặc nấm mốc nước).

    ---

    ### 3. Khi nào cần mang cây vào nhà
    * **Ngưỡng tới hạn:** Húng tây là loại thảo mộc nhiệt đới nhạy cảm. Cây sẽ bị sốc nhiệt khi nhiệt độ dưới **10°C (50°F)** và bị hư hại mô nghiêm trọng hoặc chết khi nhiệt độ gần **0°C đến 4°C**.
    * **Thời điểm tại Berlin:** Nhiệt độ ban đêm ở Berlin thường xuống dưới 10°C vào cuối tháng 9 hoặc đầu tháng 10.
    * **Hành động:** **Hãy mang cây vào nhà ngay** nếu dự báo thời tiết ban đêm xuống dưới 10°C.

    ---

    ### 4. Dấu hiệu sốc lạnh và thiếu sáng
    * **Lá bị đen hoặc trong suốt:** Dấu hiệu rõ rệt của tổn thương do lạnh (tế bào bị phá hủy do nhiệt độ dưới 8–10°C).
    * **Lá chuyển sang màu tím hoặc xỉn màu:** Phản ứng điển hình khi bị sốc lạnh kết hợp với việc hấp thụ dinh dưỡng chậm.
    * **Cây rũ xuống trong khi đất vẫn ẩm:** Rễ bị lạnh hoặc thối rễ; rễ quá lạnh hoặc bị hỏng nên không thể hút ẩm ngay cả khi có nước.
    * **Cây mọc vống / Lá xanh nhạt:** Thiếu ánh sáng mặt trời (hiện tượng vống hóa).

    ---

    ### 5. Chuyển cây vào nhà: Mẹo chuyển tiếp nhanh
    1. **Cửa sổ sáng nhất:** Đặt cây ở bậu cửa sổ hướng Nam nếu có; nếu không, hãy chọn cửa sổ hướng Đông hoặc hướng Tây sáng nhất.
    2. **Tránh gió lùa và bộ tản nhiệt:** Để cây tránh xa luồng gió lạnh từ khe cửa sổ cũng như hơi nóng khô thổi trực tiếp từ bộ tản nhiệt (*Heizung*).
    3. **Kiểm tra sâu bệnh:** Kiểm tra mặt dưới lá xem có rệp hoặc nhện đỏ không trước khi đặt gần các cây trồng trong nhà khác.
    4. **Thu hoạch từ ngọn:** Ngắt bỏ nụ hoa và các cặp lá trên cùng để khuyến khích cây mọc bụi thay vì mọc dài để ra hoa.

