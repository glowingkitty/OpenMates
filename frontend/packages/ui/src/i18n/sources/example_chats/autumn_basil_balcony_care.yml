  pl: |
    Oto zwięzły, jesienny poradnik pielęgnacji bazylii pospolitej (*Ocimum basilicum*) na balkonie o wystawie wschodniej w Berlinie:

    ---

    ### 1. Światło (Balkon wschodni)
    * **Czego się spodziewać:** Jesienią w Berlinie słońce jest niżej, a dni szybko stają się krótsze. Balkon wschodni zapewnia łagodne poranne słońce przez około 2–4 godziny, co jest dolną granicą dla światłolubnej bazylii.
    * **Ustawienie:** Postaw doniczkę tak blisko zewnętrznej barierki, jak to tylko bezpieczne, z dala od cienia rzucanego przez ściany, aby zmaksymalizować dostęp do porannego światła.
    * **Trik z odbiciem:** Ustawienie rośliny przy białej lub jasnej ścianie może pomóc odbić dodatkowe światło rozproszone w stronę liści.

    ---

    ### 2. Podlewanie
    * **Zasada:** Zapotrzebowanie bazylii na wodę znacznie spada w chłodne dni, ponieważ parowanie zwalnia, a wzrost rośliny zostaje zahamowany.
    * **Najpierw sprawdź:** Podlewaj **tylko** wtedy, gdy górne 2–3 cm ziemi są suche w dotyku. Nie podlewaj według sztywnego harmonogramu.
    * **Pora dnia:** Zawsze podlewaj rano wodą o temperaturze pokojowej. Unikaj zimnej wody prosto z kranu, która może wywołać szok u wychłodzonych korzeni.
    * **Drenaż:** Nigdy nie pozwól, aby doniczka stała w wodzie na podstawce; chłodna, przelana ziemia szybko prowadzi do gnicia korzeni (*Fusarium* lub pleśń wodna).

    ---

    ### 3. Kiedy zabrać ją do środka
    * **Krytyczny próg:** Bazylia to delikatne zioło tropikalne. Cierpi na fizjologiczny stres z powodu zimna poniżej **10°C**, a w temperaturach bliskich **0°C do 4°C** dochodzi do poważnych uszkodzeń tkanek lub obumarcia rośliny.
    * **Termin dla Berlina:** Nocne temperatury w Berlinie często spadają poniżej 10°C już pod koniec września lub na początku października.
    * **Działanie:** **Zabierz ją do środka już teraz**, jeśli prognozy na noc przewidują spadek poniżej 10°C.

    ---

    ### 4. Objawy stresu termicznego i świetlnego
    * **Czerniejące lub przezroczyste liście:** Wyraźny znak uszkodzeń spowodowanych zimnem (rozpad komórek w temperaturach poniżej 8–10°C).
    * **Fioletowienie lub matowienie liści:** Klasyczna reakcja na stres termiczny połączona ze spowolnionym pobieraniem składników odżywczych.
    * **Więdnięcie przy wilgotnej ziemi:** Wychłodzenie lub gnicie korzeni; korzenie są zbyt zimne lub uszkodzone, by pobierać wilgoć, nawet jeśli jest ona dostępna.
    * **Wyciąganie się / bladozielony wzrost:** Niewystarczająca ilość światła słonecznego (etiolacja).

    ---

    ### 5. Przenoszenie do domu: Szybkie wskazówki
    1. **Najjaśniejsze okno:** Postaw ją na parapecie o wystawie południowej, jeśli to możliwe; w przeciwnym razie wybierz najjaśniejsze okno wschodnie lub zachodnie.
    2. **Unikaj przeciągów i grzejników:** Trzymaj ją z dala od zimnych przeciągów z nieszczelnych okien oraz od suchego powietrza bijącego bezpośrednio z grzejnika (*Heizung*).
    3. **Kontrola szkodników:** Sprawdź spód liści pod kątem mszyc lub przędziorków, zanim postawisz ją obok innych roślin domowych.
    4. **Zbiory od góry:** Usuwaj pąki kwiatowe i górne pary liści, aby pobudzić roślinę do krzewienia się, zamiast pozwalać jej na wyciąganie się i kwitnienie.

    ---

