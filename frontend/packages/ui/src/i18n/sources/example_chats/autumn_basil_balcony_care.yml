    * [Få tips om hur du bevarar en stor basilikaskörd](/#message=How%20can%20I%20harvest%20and%20preserve%20my%20basil%20leaves%20before%20winter?)
  he: |
    הנה מדריך טיפול תמציתי המותאם לסתיו עבור הבזיליקום המתוק שלך (*Ocimum basilicum*) במרפסת הפונה למזרח בברלין:

    ---

    ### 1. אור (מרפסת פונה למזרח)
    * **למה לצפות:** בסתיו של ברלין, השמש נמוכה יותר ושעות האור מתמעטות במהירות. מרפסת הפונה למזרח מספקת שמש בוקר רכה למשך כ-2–4 שעות, שזה הגבול התחתון עבור בזיליקום חובב שמש.
    * **מיקום:** כדאי להציב את העציץ קרוב ככל האפשר למעקה החיצוני (בצורה בטיחותית), הרחק מצללים של קירות, כדי למקסם את החשיפה לשמי הבוקר.
    * **טריק החזרה:** הצבתו ליד קיר לבן או בהיר יכולה להחזיר אור סביבתי נוסף אל העלים.

    ---

    ### 2. שגרת השקיה
    * **הכלל:** צריכת המים של הבזיליקום יורדת משמעותית במזג אוויר קריר בגלל שהאידוי מואט וצמיחת הצמח נעצרת.
    * **בדיקה מקדימה:** יש להשקות **רק** כש-2–3 הס"מ העליונים של האדמה (בערך אינץ') מרגישים יבשים למגע. אין להשקות לפי לוח זמנים קבוע.
    * **תזמון:** תמיד כדאי להשקות בבוקר עם מים בטמפרטורת החדר. הימנע משימוש במי ברז קרים ישירות מהצינור, שעלולים לגרום להלם לשורשים הקרירים.
    * **ניקוז:** לעולם אל תשאיר את העציץ בתוך מים עומדים בתחתית; אדמה קרה ורוויה במים מובילה במהירות לריקבון שורשים (*Fusarium* או עובש מים).

    ---

    ### 3. מתי להכניס אותו הביתה
    * **סף קריטי:** בזיליקום הוא עשב טרופי עדין. הוא סובל מעקת קור פיזיולוגית מתחת ל-**10°C** וסופג נזק רקמות חמור או מת בטמפרטורות שבין **0°C ל-4°C**.
    * **תזמון בברלין:** טמפרטורות הלילה בברלין יורדות לעיתים קרובות מתחת ל-10°C כבר בסוף ספטמבר או תחילת אוקטובר.
    * **פעולה:** **הכנס אותו פנימה עכשיו** אם תחזית הלילה יורדת מתחת ל-10°C.

    ---

    ### 4. סימנים לעקת קור ואור
    * **עלים מושחרים או שקופים:** סימן ברור לנזקי קור (קריסה תאית מטמפרטורות מתחת ל-8–10°C).
    * **עלים סגולים או דהויים:** תגובה קלאסית לעקת קור בשילוב עם ספיגת חומרים מזינים איטית.
    * **נבילה כשהאדמה לחה:** קור בשורשים או ריקבון שורשים; השורשים קרים מדי או פגועים מכדי לספוג לחות גם אם יש מים.
    * **התארכות / צמיחה בירוק חיוור:** חוסר באור שמש (אטיולציה).

    ---

    ### 5. מעבר לתוך הבית: טיפים למעבר מהיר
    1. **החלון המואר ביותר:** הנח אותו על אדן חלון הפונה לדרום אם אפשר; אחרת, בחלון המואר ביותר הפונה למזרח או למערב.
    2. **הימנע מזרמי אוויר ורדיאטורים:** הרחק אותו מזרמי אוויר קרים מחלונות פתוחים וגם מחום מייבש שנושב ישירות מרדיאטור (*Heizung*).
    3. **בדיקת מזיקים:** בדוק את הצד התחתון של העלים לאיתור כנימות או אקריות לפני שתניח אותו ליד צמחי בית אחרים.
    4. **קטיף מלמעלה:** קטום ניצני פרחים וזוגות עלים עליונים כדי לעודד צמיחה שיחית במקום פריחה דלילה וגבוהה.

