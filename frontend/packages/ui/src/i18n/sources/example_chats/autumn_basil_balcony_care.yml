    * [Získej tipy na uchování velké sklizně bazalky](/#message=How%20can%20I%20harvest%20and%20preserve%20my%20basil%20leaves%20before%20winter?)
  sv: |
    Här är en kortfattad, höstspecifik skötselguide för din basilika (*Ocimum basilicum*) på en balkong i österläge i Berlin:
    ---
    ### 1. Ljus (balkong i österläge)
    * **Vad du kan förvänta dig:** Under hösten i Berlin står solen lägre och antalet ljustimmar minskar snabbt. En balkong i österläge ger mjuk morgonsol i ungefär 2–4 timmar, vilket är i minsta laget för solälskande basilika.
    * **Placering:** Placera krukan så nära det yttre räcket som det går på ett säkert sätt, bort från skuggor från väggar, för att maximera exponeringen mot den öppna morgonhimlen.
    * **Reflektionstrick:** Att placera den mot en vit eller ljus vägg kan reflektera extra omgivningsljus mot bladen.
    ---
    ### 2. Vattningsrutiner
    * **Regel:** Basilika behöver betydligt mindre vatten i svalt väder eftersom avdunstningen går långsammare och tillväxten avstannar.
    * **Kolla först:** Vattna **bara** när de översta 2–3 centimetrarna av jorden känns torra. Vattna inte efter ett fast schema.
    * **Tidpunkt:** Vattna alltid på morgonen med rumstempererat vatten. Undvik kallt kranvatten direkt från ledningen, då det ger de svala rötterna en chock.
    * **Dränering:** Låt aldrig krukan stå i vatten på fatet; sval, genomblöt jord leder snabbt till rotröta (*Fusarium* eller vattenmögel).
    ---
    ### 3. När den ska tas in
    * **Kritisk gräns:** Basilika är en tropisk, känslig ört. Den drabbas av fysiologisk köldstress under **10 °C (50 °F)** och får allvarliga vävnadsskador eller dör vid temperaturer nära **0 °C till 4 °C**.
    * **Timing för Berlin:** Nattemperaturerna i Berlin sjunker ofta under 10 °C i slutet av september eller början av oktober.
    * **Åtgärd:** **Ta in den nu** om nattprognosen visar temperaturer under 10 °C.
    ---
    ### 4. Tecken på köld- och ljusstress
    * **Svarta eller genomskinliga blad:** Tydligt tecken på köldskada (cellkollaps orsakad av temperaturer under 8–10 °C).
    * **Bladverk som blir lila eller matt:** En klassisk reaktion på köldstress i kombination med långsamt näringsupptag.
    * **Slokande trots att jorden är fuktig:** Rotkyla eller rotröta; rötterna är för kalla eller skadade för att ta upp fukt även om det finns vatten.
    * **Ranglig / Blekgrön tillväxt:** Otillräckligt solljus (etiolering).
    ---
    ### 5. Flytta inomhus: Snabba tips för omställningen
    1. **Ljusaste fönstret:** Placera den på en fönsterbräda i söderläge om det finns; annars i det ljusaste fönstret i öst- eller västläge.
    2. **Undvik drag och element:** Håll den borta från kallt drag från otäta fönster samt uttorkande värme som blåser direkt från ett element (*Heizung*).
    3. **Kontrollera skadedjur:** Titta på bladens undersidor efter bladlöss eller spinnkvalster innan du ställer den nära andra inomhusväxter.
    4. **Skörda från toppen:** Nyp av blomknoppar och de översta bladparen för att främja ett buskigare växtsätt istället för ranglig blomning.
    ---

