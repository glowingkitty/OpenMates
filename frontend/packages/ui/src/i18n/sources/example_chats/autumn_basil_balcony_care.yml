  ar: |
    إليك دليل رعاية موجز ومخصص لفصل الخريف لنبتة الريحان الحلو (*Ocimum basilicum*) على شرفة مواجهة للشرق في برلين:

    ---

    ### 1. الإضاءة (شرفة مواجهة للشرق)
    * **ماذا تتوقع:** في خريف برلين، يكون شروق الشمس منخفضاً وتنخفض ساعات النهار بسرعة. توفر الشرفة المواجهة للشرق شمس الصباح اللطيفة لمدة تتراوح بين 2 إلى 4 ساعات تقريباً، وهو الحد الأدنى للريحان المحب للشمس.
    * **المكان:** ضع الوعاء في أقرب مكان ممكن من السياج الخارجي بشكل آمن، بعيداً عن ظلال الجدران، لزيادة التعرض لضوء السماء الصباحي دون عوائق.
    * **خدعة الانعكاس:** وضعه مقابل جدار أبيض أو فاتح اللون يمكن أن يعكس ضوءاً محيطاً إضافياً نحو الأوراق.

    ---

    ### 2. روتين الري
    * **القاعدة:** تنخفض احتياجات الريحان للماء بشكل كبير في الطقس البارد لأن التبخر يتباطأ ويتوقف نمو النبات.
    * **افحص أولاً:** اسقِ **فقط** عندما تشعر أن الطبقة العلوية من التربة (2-3 سم تقريباً) جافة عند لمسها. لا تسقِ وفقاً لجدول زمني ثابت.
    * **التوقيت:** اسقِ دائماً في الصباح بماء بدرجة حرارة الغرفة. تجنب ماء الصنبور البارد مباشرة من الأنبوب، لأنه يصدم الجذور الباردة.
    * **التصريف:** لا تترك الوعاء أبداً في ماء راكد في الصحن؛ فالتربة الباردة والمشبعة بالماء تؤدي بسرعة إلى تعفن الجذور (*Fusarium* أو عفن الماء).

    ---

    ### 3. متى تنقله إلى الداخل
    * **العتبة الحرجة:** الريحان عشب استوائي رقيق. يعاني من إجهاد البرد الفسيولوجي تحت **10 درجات مئوية (50 فهرنهايت)** ويتعرض لتلف شديد في الأنسجة أو الموت عند اقتراب الحرارة من **0 إلى 4 درجات مئوية**.
    * **التوقيت في برلين:** غالباً ما تنخفض درجات الحرارة ليلاً في برلين إلى ما دون 10 درجات مئوية بحلول أواخر سبتمبر أو أوائل أكتوبر.
    * **الإجراء:** **أدخله إلى الداخل الآن** إذا كانت توقعات الطقس ليلاً تشير إلى انخفاض الحرارة عن 10 درجات مئوية.

    ---

    ### 4. علامات إجهاد البرد والضوء
    * **أوراق مسودة أو شفافة:** علامة واضحة على إصابة البرد (انهيار خلوي ناتج عن درجات حرارة أقل من 8-10 درجات مئوية).
    * **تحول الأوراق للون الأرجواني أو بهتانها:** استجابة كلاسيكية لإجهاد البرد مع بطء امتصاص العناصر الغذائية.
    * **الذبول رغم رطوبة التربة:** برد الجذور أو تعفنها؛ الجذور باردة جداً أو تالفة لدرجة تمنعها من امتصاص الرطوبة حتى مع وجود الماء.
    * **الاستطالة / نمو أخضر شاحب:** عدم كفاية ضوء الشمس (الاستطالة).

    ---

    ### 5. الانتقال للداخل: نصائح سريعة
    1. **النافذة الأكثر سطوعاً:** ضعه على حافة نافذة مواجهة للجنوب إذا توفرت؛ وإلا، فاستخدم النافذة الأكثر سطوعاً المواجهة للشرق أو الغرب.
    2. **تجنب تيارات الهواء والمدافئ:** ابعده عن تيارات الهواء الباردة من النوافذ، وكذلك عن الحرارة الجافة المنبعثة مباشرة من المدفأة (*Heizung*).
    3. **فحص الآفات:** افحص الجوانب السفلية للأوراق بحثاً عن المن أو العث العنكبوتي قبل وضعه بالقرب من النباتات المنزلية الأخرى.
    4. **الحصاد من الأعلى:** اقطف براعم الزهور وأزواج الأوراق العلوية لتشجيع النمو الكثيف بدلاً من الإزهار الطولي.

