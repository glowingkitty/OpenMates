  nl: |
    Hier is een beknopte verzorgingsgids speciaal voor de herfst voor je basilicum (*Ocimum basilicum*) op een balkon op het oosten in Berlijn:
    ---
    ### 1. Licht (balkon op het oosten)
    * **Wat je kunt verwachten:** In de Berlijnse herfst staat de zon lager en nemen de uren daglicht snel af. Een balkon op het oosten biedt ongeveer 2 tot 4 uur zachte ochtendzon, wat aan de lage kant is voor zonminnende basilicum.
    * **Plaatsing:** Zet de pot zo dicht mogelijk bij de buitenste reling (voor zover dat veilig kan), weg van de schaduw van muren, om zoveel mogelijk onbelemmerd licht van de ochtendhemel mee te pakken.
    * **Reflectietruc:** Door de plant tegen een witte of lichtgekleurde muur te zetten, kan er extra omgevingslicht naar de bladeren worden weerkaatst.
    ---
    ### 2. Water geven
    * **Regel:** De waterbehoefte van basilicum neemt aanzienlijk af bij koel weer, omdat de verdamping vertraagt en de groei van de plant stopt.
    * **Controleer eerst:** Geef **alleen** water als de bovenste 2–3 cm grond droog aanvoelt. Geef geen water volgens een vast schema.
    * **Timing:** Geef altijd 's ochtends water met water op kamertemperatuur. Vermijd koud kraanwater direct uit de leiding; dit geeft een schok aan de koele wortels.
    * **Afwatering:** Laat de pot nooit in stilstaand water op de schotel staan; koele, drassige grond leidt snel tot wortelrot (*Fusarium* of waterschimmel).
    ---
    ### 3. Wanneer je hem naar binnen moet halen
    * **Kritieke grens:** Basilicum is een tropisch, gevoelig kruid. De plant krijgt last van fysiologische koudestress onder de **10°C (50°F)** en loopt ernstige weefselbeschadiging op of gaat dood bij temperaturen nabij de **0°C tot 4°C**.
    * **Timing voor Berlijn:** In Berlijn zakt de nachttemperatuur vaak eind september of begin oktober al onder de 10°C.
    * **Actie:** **Haal hem nu naar binnen** als de voorspelling voor de nacht onder de 10°C duikt.
    ---
    ### 4. Tekenen van koude- en lichtstress
    * **Zwartgeblakerde of doorschijnende bladeren:** Duidelijk teken van kouschade (celafbraak door temperaturen onder de 8–10°C).
    * **Paarsverkleuring of dof blad:** Een klassieke reactie op koudestress in combinatie met een trage opname van voedingsstoffen.
    * **Slaphangen terwijl de grond vochtig is:** Koude wortels of wortelrot; de wortels zijn te koud of beschadigd om vocht op te nemen, zelfs als er water aanwezig is.
    * **Uitrekking / Lichtgroene groei:** Onvoldoende zonlicht (etiolering).
    ---
    ### 5. Naar binnen verhuizen: Snelle overgangstips
    1. **Lichtste raam:** Zet hem op een vensterbank op het zuiden als dat kan; anders voor het lichtste raam op het oosten of westen.
    2. **Vermijd tocht & radiatoren:** Houd hem uit de buurt van koude tocht door kieren in ramen en van uitdrogende hitte die direct van een radiator (*Heizung*) komt.
    3. **Controleer op ongedierte:** Check de onderkant van de bladeren op bladluizen of spintmijten voordat je hem bij andere kamerplanten zet.
    4. **Oogst van bovenaf:** Knijp bloemknoppen en de bovenste bladparen weg om een bossige groei te stimuleren in plaats van sprieterige bloei.
