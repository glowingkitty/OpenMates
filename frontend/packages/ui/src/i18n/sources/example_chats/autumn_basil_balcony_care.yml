  th: |
    นี่คือคู่มือการดูแลโหระพาฝรั่ง (*Ocimum basilicum*) บนระเบียงที่หันไปทางทิศตะวันออกในเบอร์ลินแบบกระชับสำหรับช่วงฤดูใบไม้ร่วงโดยเฉพาะ:

    ---

    ### 1. แสงแดด (ระเบียงทิศตะวันออก)
    * **สิ่งที่ควรคาดหวัง:** ในฤดูใบไม้ร่วงของเบอร์ลิน ดวงอาทิตย์จะขึ้นต่ำลงและชั่วโมงที่มีแสงแดดจะลดลงอย่างรวดเร็ว ระเบียงที่หันไปทางทิศตะวันออกจะได้รับแสงแดดยามเช้าที่อ่อนโยนประมาณ 2–4 ชั่วโมง ซึ่งถือว่าค่อนข้างน้อยสำหรับโหระพาที่ชอบแสงแดด
    * **การจัดวาง:** วางกระถางให้ใกล้กับราวระเบียงด้านนอกมากที่สุดเท่าที่จะทำได้อย่างปลอดภัย เพื่อให้พ้นจากเงาของผนัง และรับแสงจากท้องฟ้ายามเช้าให้ได้มากที่สุดโดยไม่มีสิ่งกีดขวาง
    * **เคล็ดลับการสะท้อนแสง:** การวางกระถางไว้หน้าผนังสีขาวหรือสีอ่อนสามารถช่วยสะท้อนแสงสว่างโดยรอบไปยังใบไม้ได้มากขึ้น

    ---

    ### 2. การรดน้ำ
    * **กฎ:** ความต้องการน้ำของโหระพาจะลดลงอย่างมากในสภาพอากาศเย็น เพราะการระเหยช้าลงและการเจริญเติบโตของพืชหยุดชะงัก
    * **ตรวจสอบก่อน:** รดน้ำ**เฉพาะ**เมื่อดินชั้นบนลึกประมาณ 2–3 ซม. (ประมาณหนึ่งนิ้ว) แห้งเมื่อสัมผัส อย่ารดน้ำตามตารางเวลาที่กำหนดไว้ตายตัว
    * **เวลา:** รดน้ำในตอนเช้าเสมอด้วยน้ำอุณหภูมิห้อง หลีกเลี่ยงน้ำประปาที่เย็นจัดจากท่อโดยตรง เพราะจะทำให้รากที่เย็นอยู่แล้วเกิดอาการช็อก
    * **การระบายน้ำ:** อย่าปล่อยให้กระถางแช่อยู่ในน้ำที่ขังในจานรอง ดินที่เย็นและแฉะเกินไปจะทำให้เกิดโรครากเน่า (*Fusarium* หรือเชื้อราในน้ำ) ได้อย่างรวดเร็ว

    ---

    ### 3. เมื่อไหร่ควรนำเข้ามาไว้ข้างใน
    * **เกณฑ์วิกฤต:** โหระพาเป็นสมุนไพรเมืองร้อนที่บอบบาง มันจะเกิดความเครียดจากความเย็นทางสรีรวิทยาเมื่ออุณหภูมิต่ำกว่า **10°C (50°F)** และเนื้อเยื่อจะเสียหายอย่างรุนแรงหรือตายเมื่ออุณหภูมิใกล้ **0°C ถึง 4°C**
    * **ช่วงเวลาสำหรับเบอร์ลิน:** อุณหภูมิข้ามคืนในเบอร์ลินมักจะลดลงต่ำกว่า 10°C ในช่วงปลายเดือนกันยายนหรือต้นเดือนตุลาคม
    * **การดำเนินการ:** **นำเข้ามาไว้ข้างในทันที** หากพยากรณ์อากาศตอนกลางคืนระบุว่าอุณหภูมิจะลดลงต่ำกว่า 10°C

    ---

    ### 4. สัญญาณของความเครียดจากความเย็นและแสงแดด
    * **ใบเปลี่ยนเป็นสีดำหรือโปร่งแสง:** สัญญาณที่ชัดเจนของอาการบาดเจ็บจากความเย็น (เซลล์ล้มเหลวจากอุณหภูมิต่ำกว่า 8–10°C)
    * **ใบเปลี่ยนเป็นสีม่วงหรือหม่นหมอง:** การตอบสนองตามปกติเมื่อเกิดความเครียดจากความเย็นร่วมกับการดูดซึมสารอาหารที่ช้าลง
    * **ใบเหี่ยวในขณะที่ดินยังชื้น:** รากเย็นจัดหรือรากเน่า รากเย็นเกินไปหรือเสียหายจนไม่สามารถดูดความชื้นได้แม้ว่าจะมีน้ำอยู่ก็ตาม
    * **ลำต้นยืด / ใบมีสีเขียวซีด:** แสงแดดไม่เพียงพอ (อาการลำต้นยืดผิดปกติ)

    ---

    ### 5. การย้ายเข้าในร่ม: เคล็ดลับการเปลี่ยนผ่านอย่างรวดเร็ว
    1. **หน้าต่างที่สว่างที่สุด:** วางไว้บนขอบหน้าต่างที่หันไปทางทิศใต้หากมี หรือหน้าต่างทิศตะวันออกหรือทิศตะวันตกที่สว่างที่สุด
    2. **หลีกเลี่ยงลมโกรกและหม้อน้ำ:** เก็บให้ห่างจากลมเย็นที่ลอดผ่านช่องหน้าต่าง รวมถึงลมร้อนที่เป่าโดยตรงจากหม้อน้ำทำความร้อน (*Heizung*)
    3. **การตรวจสอบศัตรูพืช:** ตรวจสอบใต้ใบเพื่อหาเพลี้ยอ่อนหรือไรแดงก่อนนำไปวางใกล้กับต้นไม้ในร่มต้นอื่นๆ
    4. **เก็บเกี่ยวจากส่วนยอด:** เด็ดดอกตูมและใบยอดคู่บนสุดออกเพื่อกระตุ้นให้แตกพุ่มแทนที่จะปล่อยให้ลำต้นยืดเพื่อออกดอก

