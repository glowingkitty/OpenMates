  de: |
    Hier ist ein kompakter, herbstspezifischer Pflegeleitfaden für dein Basilikum (*Ocimum basilicum*) auf einem Ostbalkon in Berlin:

    ---

    ### 1. Licht (Ostbalkon)
    * **Was dich erwartet:** Im Berliner Herbst steht die Sonne tiefer und die Tageslichtstunden nehmen rapide ab. Ein Ostbalkon bietet etwa 2–4 Stunden sanfte Morgensonne, was für das sonnenhungrige Basilikum eher wenig ist.
    * **Standort:** Stelle den Topf so nah wie möglich an das Außengeländer (sicher befestigt), weg vom Schatten der Hauswand, um die maximale Lichtausbeute des Morgenhimmels zu nutzen.
    * **Reflexions-Trick:** Wenn du die Pflanze vor eine weiße oder helle Wand stellst, kann zusätzliches Umgebungslicht auf die Blätter reflektiert werden.

    ---

    ### 2. Gießen
    * **Regel:** Der Wasserbedarf von Basilikum sinkt bei kühlem Wetter deutlich, da die Verdunstung langsamer ist und das Pflanzenwachstum stagniert.
    * **Erst prüfen:** Gieße **nur**, wenn sich die oberen 2–3 cm der Erde trocken anfühlen. Gieße nicht nach einem festen Zeitplan.
    * **Zeitpunkt:** Gieße immer morgens mit zimmertemperiertem Wasser. Vermeide eiskaltes Leitungswasser direkt aus der Leitung, da dies die kühlen Wurzeln schockt.
    * **Drainage:** Lass den Topf niemals in stehendem Wasser im Untersetzer stehen; kühle, nasse Erde führt schnell zu Wurzelfäule (*Fusarium* oder Wasserschimmel).

    ---

    ### 3. Wann es nach drinnen muss
    * **Kritische Grenze:** Basilikum ist ein empfindliches tropisches Kraut. Es leidet unter physiologischem Kältestress unter **10 °C** und erleidet schwere Gewebeschäden oder stirbt ab bei Temperaturen zwischen **0 °C und 4 °C**.
    * **Zeitpunkt für Berlin:** Die nächtlichen Temperaturen in Berlin fallen oft schon Ende September oder Anfang Oktober unter 10 °C.
    * **Maßnahme:** **Hol es jetzt rein**, wenn die Vorhersage für die Nacht unter 10 °C sinkt.

    ---

    ### 4. Anzeichen für Kälte- & Lichtstress
    * **Schwarze oder glasige Blätter:** Ein klares Zeichen für Kälteschäden (Zellkollaps durch Temperaturen unter 8–10 °C).
    * **Violette Verfärbung oder stumpfes Laub:** Eine klassische Reaktion auf Kältestress in Kombination mit verlangsamter Nährstoffaufnahme.
    * **Hängende Blätter trotz feuchter Erde:** Wurzelkälte oder Wurzelfäule; die Wurzeln sind zu kalt oder beschädigt, um Feuchtigkeit aufzunehmen, selbst wenn Wasser vorhanden ist.
    * **Vergeilung / blassgrüner Wuchs:** Zu wenig Sonnenlicht (Lichtmangel).

    ---

    ### 5. Umzug nach drinnen: Tipps für den Übergang
    1. **Hellstes Fenster:** Stelle es auf eine Fensterbank in Südausrichtung, falls vorhanden; ansonsten an das hellste Ost- oder Westfenster.
    2. **Zugluft & Heizkörper vermeiden:** Halte es fern von kalter Zugluft durch gekippte Fenster sowie von trockener Hitze direkt über einem Heizkörper (*Heizung*).
    3. **Schädlingskontrolle:** Überprüfe die Blattunterseiten auf Blattläuse oder Spinnmilben, bevor du es in die Nähe anderer Zimmerpflanzen stellst.
    4. **Von oben ernten:** Knipse Blütenknospen und die obersten Blattpaare ab, um einen buschigen Wuchs zu fördern, statt dass die Pflanze hochschießt und blüht.

    ---

