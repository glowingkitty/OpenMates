  ko: |
    베를린의 동향 발코니에서 키우는 스위트 바질(*Ocimum basilicum*)을 위한 가을철 맞춤 관리 가이드를 요약해 드릴게요:

    ---

    ### 1. 햇빛 (동향 발코니)
    * **예상 환경:** 베를린의 가을은 해가 낮게 뜨고 낮 시간이 급격히 짧아집니다. 동향 발코니는 약 2~4시간 동안 부드러운 아침 햇살을 제공하는데, 이는 햇빛을 좋아하는 바질에게는 다소 부족한 편입니다.
    * **배치:** 벽 그림자를 피해 난간 쪽으로 최대한 가깝고 안전하게 화분을 배치하여 아침 햇빛을 최대한 많이 받을 수 있게 하세요.
    * **반사 팁:** 흰색이나 밝은색 벽 앞에 두면 주변의 빛이 잎으로 반사되어 도움이 됩니다.

    ---

    ### 2. 물 주기
    * **원칙:** 날씨가 추워지면 증발이 느려지고 식물의 성장이 멈추기 때문에 바질의 물 필요량이 크게 줄어듭니다.
    * **먼저 확인하기:** 겉흙이 2~3cm 정도 말랐을 때**만** 물을 주세요. 정해진 날짜에 맞춰 기계적으로 물을 주지 마세요.
    * **시기:** 항상 아침에 실온의 물을 주세요. 수도에서 바로 나온 찬물은 차가워진 뿌리에 충격을 줄 수 있으니 피하세요.
    * **배수:** 화분 받침에 물이 고여 있게 하지 마세요. 차갑고 습한 흙은 뿌리 부패(*푸사리움* 또는 수생 곰팡이)를 유발하기 쉽습니다.

    ---

    ### 3. 실내로 옮기는 시기
    * **임계 온도:** 바질은 추위에 약한 열대 허브입니다. **10°C** 미만에서는 생리적 냉해를 입으며, **0°C~4°C** 근처에서는 조직이 심하게 손상되거나 죽을 수 있습니다.
    * **베를린의 시기:** 베를린의 밤 기온은 보통 9월 말이나 10월 초에 10°C 미만으로 떨어집니다.
    * **조치:** 밤 기온 예보가 10°C 미만으로 내려가면 **지금 바로 실내로 들여놓으세요.**

    ---

    ### 4. 냉해 및 일조량 부족 징후
    * **검게 변하거나 투명해진 잎:** 냉해의 확실한 징후입니다(8~10°C 미만의 온도에서 세포가 붕괴됨).
    * **보라색으로 변하거나 생기 없는 잎:** 냉해와 영양분 흡수 저하가 겹쳤을 때 나타나는 전형적인 반응입니다.
    * **흙이 젖어 있는데도 시듦:** 뿌리 냉해 또는 부패입니다. 뿌리가 너무 차갑거나 손상되어 물이 있어도 흡수하지 못하는 상태입니다.
    * **웃자람 / 연녹색 성장:** 햇빛 부족(웃자람 현상)입니다.

    ---

    ### 5. 실내 이동: 빠른 적응을 위한 팁
    1. **가장 밝은 창가:** 가능하다면 남향 창가에 두세요. 안 된다면 가장 밝은 동향이나 서향 창가에 둡니다.
    2. **외풍과 라디에이터 피하기:** 창문 틈새의 찬바람은 물론, 라디에이터(*Heizung*)에서 나오는 건조하고 뜨거운 바람이 직접 닿지 않게 하세요.
    3. **해충 점검:** 다른 실내 식물 근처에 두기 전에 잎 뒷면에 진딧물이나 응애가 있는지 확인하세요.
    4. **위쪽부터 수확:** 꽃봉오리와 위쪽 잎을 따주면 꽃이 피어 웃자라는 대신 잎이 풍성하게 자라도록 유도할 수 있습니다.

