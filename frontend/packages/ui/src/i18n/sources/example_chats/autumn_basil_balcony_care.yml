message_2:
  context: "assistant message 2 in example chat: Autumn Basil Care on a Berlin Balcony. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: |
    Here is a concise, autumn-specific care guide for your sweet basil (*Ocimum basilicum*) on an east-facing balcony in Berlin:

    ---

    ### 1. Light (East-Facing Balcony)
    * **What to expect:** In Berlin’s autumn, sunrise is lower and daylight hours drop quickly. An east-facing balcony provides soft morning sun for about 2–4 hours, which is on the lower side for sun-loving basil.
    * **Placement:** Place the pot as close to the outer railing as safely possible, away from wall shadows, to maximize unobstructed morning sky exposure.
    * **Reflective trick:** Positioning it against a white or light-colored wall can bounce extra ambient light toward the leaves.

    ---

    ### 2. Watering Routine
    * **Rule:** Basil’s water needs drop significantly in cool weather because evaporation slows down and plant growth halts.
    * **Check first:** Water **only** when the top 2–3 cm (about an inch) of soil feels dry to the touch. Do not water on a fixed calendar schedule.
    * **Timing:** Always water in the morning with room-temperature water. Avoid cold tap water straight from the pipe, which shocks cool roots.
    * **Drainage:** Never allow the pot to sit in standing saucer water; cool, waterlogged soil leads quickly to root rot (*Fusarium* or water mold).

    ---

    ### 3. When to Bring It Inside
    * **Critical threshold:** Basil is a tropical tender herb. It suffers physiological cold stress below **10°C (50°F)** and sustains severe tissue damage or death near **0°C to 4°C**.
    * **Timing for Berlin:** Berlin overnight temperatures often drop below 10°C by late September or early October.
    * **Action:** **Bring it inside now** if night forecasts dip below 10°C.

    ---

    ### 4. Signs of Cold & Light Stress
    * **Blackened or translucent leaves:** Clear sign of chilling injury (cellular collapse from temperatures below 8–10°C).
    * **Purpling or dulling foliage:** A classic response to cold stress combined with slow nutrient uptake.
    * **Drooping while soil is moist:** Root chill or root rot; the roots are too cold or damaged to take up moisture even if water is present.
    * **Stretching / Pale green growth:** Insufficient sunlight (etiolation).

    ---

    ### 5. Moving Indoors: Quick Transition Tips
    1. **Brightest window:** Place it on a south-facing windowsill if available; otherwise, the brightest east- or west-facing window.
    2. **Avoid drafts & radiators:** Keep it away from cold cracked window drafts as well as drying heat blowing directly from a radiator (*Heizung*).
    3. **Pest inspection:** Check leaf undersides for aphids or spider mites before placing it near other indoor houseplants.
    4. **Harvest from the top:** Pinch off flower buds and top leaf pairs to encourage bushiness rather than leggy flowering.

    ---

