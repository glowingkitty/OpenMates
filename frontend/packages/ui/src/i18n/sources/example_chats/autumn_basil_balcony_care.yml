  zh: |
    以下是针对你在柏林朝东阳台上的甜罗勒 (*Ocimum basilicum*) 的秋季专项养护指南：

    ---

    ### 1. 光照（朝东阳台）
    * **预期情况：** 柏林的秋季，日出位置较低，日照时间迅速缩短。朝东的阳台能提供约 2-4 小时的柔和晨光，对于喜阳的罗勒来说偏少。
    * **摆放位置：** 在安全的前提下，将花盆尽量靠近外栏杆，避开墙壁阴影，以最大限度地获取无遮挡的晨光。
    * **反光小技巧：** 将其靠在白色或浅色墙壁旁，可以利用反射光为叶片增加额外的环境光照。

    ---

    ### 2. 浇水习惯
    * **原则：** 天气转凉后，由于水分蒸发变慢且植物生长停滞，罗勒的需水量会大幅下降。
    * **先检查：** **仅**在土表下 2-3 厘米（约一英寸）摸起来干燥时才浇水。不要按固定的时间表浇水。
    * **时间：** 务必在早晨使用室温水浇灌。避免直接使用自来水管里的冷水，以免刺激凉爽的根系。
    * **排水：** 切勿让花盆长期泡在托盘的积水中；阴冷潮湿的土壤会迅速导致根腐病（*尖孢镰刀菌*或水霉菌）。

    ---

    ### 3. 何时搬入室内
    * **临界温度：** 罗勒是一种娇嫩的热带草本植物。低于 **10°C (50°F)** 时会产生生理性冷害，在 **0°C 至 4°C** 附近会遭受严重的组织损伤甚至死亡。
    * **柏林的时间点：** 柏林的夜间气温通常在 9 月底或 10 月初就会降至 10°C 以下。
    * **行动：** 如果天气预报显示夜间气温低于 10°C，请**立即搬入室内**。

    ---

    ### 4. 低温与光照压力迹象
    * **叶片发黑或呈半透明状：** 这是明显的冷害迹象（温度低于 8-10°C 导致的细胞崩溃）。
    * **叶片变紫或暗淡：** 这是对低温压力及养分吸收缓慢的典型反应。
    * **土壤潮湿但植株萎蔫：** 根部受冻或根腐；根系因太冷或受损而无法吸收水分，即使土壤中有水。
    * **徒长/生长物呈淡绿色：** 光照不足（黄化现象）。

    ---

    ### 5. 搬入室内：快速过渡技巧
    1. **最亮的窗台：** 如果有条件，请放在朝南的窗台上；否则，选择光线最充足的朝东或朝西窗台。
    2. **避开穿堂风和暖气：** 远离窗户缝隙的冷风，也要避开暖气片 (*Heizung*) 直接吹出的干燥热风。
    3. **检查害虫：** 在靠近其他室内盆栽之前，检查叶片背面是否有蚜虫或红蜘蛛。
    4. **从顶部采收：** 摘除花蕾和顶端叶对，以促进植株长得茂密，防止其因开花而变得细长。

