  fr: |
    Voici un guide d'entretien concis et spécifique à l'automne pour ton basilic commun (*Ocimum basilicum*) sur un balcon orienté à l'est à Berlin :

    ---

    ### 1. Lumière (balcon orienté à l'est)
    * **À quoi s'attendre :** En automne à Berlin, le soleil est plus bas et la durée du jour diminue rapidement. Un balcon orienté à l'est offre un soleil matinal doux pendant environ 2 à 4 heures, ce qui est un peu juste pour le basilic qui aime le soleil.
    * **Emplacement :** Place le pot aussi près que possible de la rambarde extérieure (en toute sécurité), loin de l'ombre des murs, pour maximiser l'exposition au ciel matinal.
    * **Astuce réfléchissante :** Le placer contre un mur blanc ou de couleur claire peut renvoyer de la lumière ambiante supplémentaire vers les feuilles.

    ---

    ### 2. Arrosage
    * **Règle :** Les besoins en eau du basilic diminuent considérablement par temps frais car l'évaporation ralentit et la croissance de la plante s'arrête.
    * **Vérifie d'abord :** Arrose **uniquement** quand les 2-3 premiers centimètres de terre sont secs au toucher. N'arrose pas selon un calendrier fixe.
    * **Moment idéal :** Arrose toujours le matin avec de l'eau à température ambiante. Évite l'eau froide du robinet qui choque les racines fraîches.
    * **Drainage :** Ne laisse jamais d'eau stagner dans la soucoupe ; un sol frais et détrempé mène rapidement au pourrissement des racines (*Fusarium* ou moisissure aquatique).

    ---

    ### 3. Quand le rentrer
    * **Seuil critique :** Le basilic est une herbe tropicale fragile. Il subit un stress physiologique dû au froid en dessous de **10 °C** et subit de graves dommages tissulaires ou meurt aux alentours de **0 °C à 4 °C**.
    * **Calendrier pour Berlin :** À Berlin, les températures nocturnes descendent souvent sous les 10 °C dès la fin septembre ou début octobre.
    * **Action :** **Rentre-le maintenant** si les prévisions nocturnes descendent sous les 10 °C.

    ---

    ### 4. Signes de stress dû au froid et au manque de lumière
    * **Feuilles noircies ou translucides :** Signe clair de blessure due au froid (effondrement cellulaire dû à des températures inférieures à 8-10 °C).
    * **Feuillage violacé ou terne :** Réponse classique au stress dû au froid combiné à une absorption lente des nutriments.
    * **Plante flétrie alors que le sol est humide :** Racines refroidies ou pourries ; les racines sont trop froides ou endommagées pour absorber l'humidité même si l'eau est présente.
    * **Croissance étirée / vert pâle :** Manque de soleil (étiolement).

    ---

    ### 5. Le rentrer à l'intérieur : conseils pour une transition rapide
    1. **Fenêtre la plus lumineuse :** Place-le sur un rebord de fenêtre orienté au sud si possible ; sinon, la fenêtre la plus lumineuse orientée à l'est ou à l'ouest.
    2. **Évite les courants d'air et les radiateurs :** Garde-le à l'écart des courants d'air des fenêtres mal isolées ainsi que de la chaleur sèche soufflant directement d'un radiateur (*Heizung*).
    3. **Inspection des nuisibles :** Vérifie le dessous des feuilles pour détecter les pucerons ou les tétranyques avant de le placer près d'autres plantes d'intérieur.
    4. **Récolte par le haut :** Pince les boutons floraux et les paires de feuilles supérieures pour favoriser une croissance buissonnante plutôt qu'une floraison tout en hauteur.

    ---

