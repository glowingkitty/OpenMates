  cs: |
    Zde je stručný průvodce podzimní péčí o tvou bazalku pravou (*Ocimum basilicum*) na balkoně orientovaném na východ v Berlíně:

    ---

    ### 1. Světlo (balkon orientovaný na východ)
    * **Co očekávat:** Na podzim je v Berlíně slunce níže a den se rychle zkracuje. Balkon orientovaný na východ poskytuje jemné ranní slunce po dobu asi 2–4 hodin, což je pro světlomilnou bazalku spíše málo.
    * **Umístění:** Květináč dej co nejblíže k vnějšímu zábradlí (pokud je to bezpečné) a mimo stíny zdí, abys zajistil/a co nejvíce ranního světla.
    * **Reflexní trik:** Umístění proti bílé nebo světlé stěně může k listům odrážet více okolního světla.

    ---

    ### 2. Pravidla zálivky
    * **Pravidlo:** Potřeba zálivky u bazalky v chladném počasí výrazně klesá, protože se zpomaluje odpařování a zastavuje se růst rostliny.
    * **Nejdříve zkontroluj:** Zalévej **pouze** tehdy, když jsou horní 2–3 cm (asi jeden palec) půdy na dotek suché. Nezalévej podle pevného kalendářního rozvrhu.
    * **Načasování:** Zalévej vždy ráno vodou o pokojové teplotě. Vyhni se studené vodě přímo z kohoutku, která způsobuje šok chladným kořenům.
    * **Drenáž:** Nikdy nenechávej květináč stát v misce s vodou; chladná, přemokřená půda vede rychle k hnilobě kořenů (*Fusarium* nebo vodní plísně).

    ---

    ### 3. Kdy ji vzít dovnitř
    * **Kritická hranice:** Bazalka je citlivá tropická bylinka. Při teplotách pod **10 °C** trpí fyziologickým chladovým stresem a při teplotách kolem **0 °C až 4 °C** dochází k vážnému poškození tkání nebo úhynu.
    * **Načasování pro Berlín:** Noční teploty v Berlíně často klesají pod 10 °C již koncem září nebo začátkem října.
    * **Akce:** **Dej ji dovnitř hned**, jakmile předpověď na noc klesne pod 10 °C.

    ---

    ### 4. Známky stresu z chladu a nedostatku světla
    * **Zčernalé nebo průsvitné listy:** Jasná známka poškození chladem (kolaps buněk při teplotách pod 8–10 °C).
    * **Fialovění nebo matnutí listů:** Klasická reakce na chladový stres v kombinaci s pomalým vstřebáváním živin.
    * **Povadlost při vlhké půdě:** Podchlazení nebo hniloba kořenů; kořeny jsou příliš studené nebo poškozené na to, aby přijímaly vlhkost, i když je voda přítomna.
    * **Vytahování / bledě zelený růst:** Nedostatek slunečního světla (etiolizace).

    ---

    ### 5. Přesun dovnitř: Tipy pro rychlý přechod
    1. **Nejsvětlejší okno:** Pokud je to možné, umísti ji na jižní parapet; jinak na nejsvětlejší okno orientované na východ nebo západ.
    2. **Vyhni se průvanu a radiátorům:** Udržuj ji mimo průvan z netěsnících oken i mimo suchý vzduch proudící přímo z radiátoru (*Heizung*).
    3. **Kontrola škůdců:** Před umístěním k ostatním pokojovým rostlinám zkontroluj spodní strany listů, zda na nich nejsou mšice nebo svilušky.
    4. **Sklízej shora:** Zaštipuj květní poupata a horní páry listů, abys podpořil/a košatění namísto vytahování do květu.

    ---

