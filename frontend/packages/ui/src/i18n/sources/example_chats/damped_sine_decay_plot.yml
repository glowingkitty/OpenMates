    ### 그래프 설명

    이 그래프는 물리 및 공학 분야(예: 진동하는 기타 줄, 충격 흡수 장치 또는 전기 [RLC 회로](wiki:RLC_circuit))에서 흔히 볼 수 있는 감쇠 조화 진동자(damped harmonic oscillator)의 전형적인 표현입니다.

    #### 1. 진동 성분: $\sin(3x)$
    * $\sin(3x)$ 항은 연속적인 주기적 파동 운동을 생성합니다.
    * 각진동수는 $\omega = 3\text{ rad/s}$이며, 이는 다음과 같은 주기에 해당합니다:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * 즉, 곡선은 $x$축을 따라 $\frac{\pi}{3} \approx 1.05$ 단위마다 0을 지납니다.

    #### 2. 감쇠 인자: $e^{-0.2x}$
    * 지수 인자 $e^{-0.2x}$는 감쇠율 파라미터가 $\alpha = 0.2$인 [지수 감쇠](wiki:Exponential_decay)를 나타냅니다.
    * $x$가 증가함에 따라 [감쇠](wiki:Damping)(마찰이나 전기 저항 등)로 인해 시스템에서 에너지가 손실되어 시간이 지남에 따라 진폭이 줄어듭니다.

    #### 3. 포락선: $\pm e^{-0.2x}$
    * 사인 함수는 $-1 \le \sin(3x) \le 1$의 범위를 가지므로, 양수 항인 $e^{-0.2x}$를 곱하면 다음과 같은 결과를 얻습니다:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **상한 포락선 ($g(x) = e^{-0.2x}$)**: 양의 정점을 제한하는 매끄러운 상단 경계를 형성합니다.
    * **하한 포락선 ($h(x) = -e^{-0.2x}$)**: 음의 골을 감싸는 대칭적인 경계를 형성합니다.
    * 진동하는 곡선은 $\sin(3x) = 1$일 때마다(즉, $x = \frac{\pi}{6} + \frac{2\pi k}{3}$에서) 상한 포락선에 닿고, $\sin(3x) = -1$일 때마다 하한 포락선에 닿습니다.

