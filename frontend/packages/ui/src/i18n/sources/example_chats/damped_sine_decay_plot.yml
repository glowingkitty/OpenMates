    ### สิ่งที่กราฟแสดง

    กราฟนี้เป็นการแสดงภาพคลาสสิกของตัวแกว่งกวัดฮาร์มอนิกแบบหน่วง (damped harmonic oscillator) ซึ่งพบได้ทั่วไปในทางฟิสิกส์และวิศวกรรม (เช่น สายกีตาร์ที่สั่นสะเทือน, โช้คอัพ หรือ[วงจร RLC](wiki:RLC_circuit) ทางไฟฟ้า)

    #### 1. ส่วนประกอบของการแกว่งกวัด: $\sin(3x)$
    * พจน์ $\sin(3x)$ สร้างการเคลื่อนที่แบบคลื่นเป็นคาบอย่างต่อเนื่อง
    * ความถี่เชิงมุมคือ $\omega = 3\text{ rad/s}$ ซึ่งสอดคล้องกับคาบเวลา:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * ซึ่งหมายความว่าเส้นกราฟจะตัดผ่านจุดศูนย์ทุกๆ $\frac{\pi}{3} \approx 1.05$ หน่วยตามแนวแกน $x$

    #### 2. ตัวประกอบการหน่วง: $e^{-0.2x}$
    * ตัวประกอบเอกซ์โพเนนเชียล $e^{-0.2x}$ อธิบายถึง[การสลายตัวแบบเอกซ์โพเนนเชียล](wiki:Exponential_decay) โดยมีพารามิเตอร์อัตราการสลายตัวคือ $\alpha = 0.2$
    * เมื่อ $x$ เพิ่มขึ้น พลังงานจะสูญเสียไปจากระบบเนื่องจากการ[หน่วง](wiki:Damping) (เช่น แรงเสียดทานหรือความต้านทานไฟฟ้า) ทำให้แอมพลิจูดลดลงตามกาลเวลา

    #### 3. เส้นขอบ (Envelopes): $\pm e^{-0.2x}$
    * เนื่องจากฟังก์ชันไซน์มีขอบเขตอยู่ที่ $-1 \le \sin(3x) \le 1$ เมื่อคูณด้วยพจน์ที่เป็นบวก $e^{-0.2x}$ จะได้:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **เส้นขอบบน ($g(x) = e^{-0.2x}$)**: สร้างขอบเขตบนที่ราบเรียบซึ่งครอบจุดยอดที่เป็นบวก
    * **เส้นขอบล่าง ($h(x) = -e^{-0.2x}$)**: สร้างขอบเขตที่สมมาตรซึ่งรองรับจุดต่ำสุดที่เป็นลบ
    * เส้นกราฟที่แกว่งกวัดจะสัมผัสกับเส้นขอบบนเมื่อใดก็ตามที่ $\sin(3x) = 1$ (ที่ $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) และสัมผัสเส้นขอบล่างเมื่อใดก็ตามที่ $\sin(3x) = -1$

