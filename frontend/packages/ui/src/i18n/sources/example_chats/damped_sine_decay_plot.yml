    ### Co przedstawia wykres

    Ten wykres to klasyczna reprezentacja tłumionego oscylatora harmonicznego, powszechnie spotykanego w fizyce i inżynierii (takiego jak drgająca struna gitary, amortyzator czy elektryczny [obwód RLC](wiki:RLC_circuit)).

    #### 1. Składowa oscylacyjna: $\sin(3x)$
    * Człon $\sin(3x)$ generuje ciągły, okresowy ruch falowy.
    * Częstość kołowa wynosi $\omega = 3\text{ rad/s}$, co odpowiada okresowi:
      $$T = \frac{2\pi}{3} \approx 2,094$$
    * Oznacza to, że krzywa przecina zero co $\frac{\pi}{3} \approx 1,05$ jednostki na osi $x$.

    #### 2. Współczynnik tłumienia: $e^{-0,2x}$
    * Czynnik wykładniczy $e^{-0,2x}$ opisuje [zanik wykładniczy](wiki:Exponential_decay) z parametrem szybkości zaniku $\alpha = 0,2$.
    * Wraz ze wzrostem $x$ system traci energię wskutek [tłumienia](wiki:Damping) (takiego jak tarcie lub opór elektryczny), co z czasem zmniejsza amplitudę.

    #### 3. Obwiednie: $\pm e^{-0,2x}$
    * Ponieważ funkcja sinus jest ograniczona przez $-1 \le \sin(3x) \le 1$, pomnożenie przez dodatni człon $e^{-0,2x}$ daje:
      $$-e^{-0,2x} \le e^{-0,2x}\sin(3x) \le e^{-0,2x}$$
    * **Górna obwiednia ($g(x) = e^{-0,2x}$)**: Tworzy gładką górną granicę ograniczającą dodatnie szczyty.
    * **Dolna obwiednia ($h(x) = -e^{-0,2x}$)**: Tworzy symetryczną granicę obejmującą ujemne minima.
    * Oscylująca krzywa styka się z górną obwiednią zawsze, gdy $\sin(3x) = 1$ (dla $x = \frac{\pi}{6} + \frac{2\pi k}{3}$), a z dolną obwiednią, gdy $\sin(3x) = -1$.

