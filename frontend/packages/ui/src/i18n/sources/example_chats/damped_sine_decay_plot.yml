    ### Wat de grafiek laat zien

    Deze grafiek is een klassieke weergave van een gedempte harmonische oscillator, die vaak voorkomt in de natuurkunde en techniek (zoals een trillende gitaarsnaar, een schokdemper of een elektrisch [RLC-circuit](wiki:RLC_circuit)).

    #### 1. De oscillerende component: $\sin(3x)$
    * De term $\sin(3x)$ genereert een continue periodieke golfbeweging.
    * De hoekfrequentie is $\omega = 3\text{ rad/s}$, wat overeenkomt met een periode van:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * Dit betekent dat de curve de nulas snijdt om de $\frac{\pi}{3} \approx 1.05$ eenheden langs de $x$-as.

    #### 2. De dempingsfactor: $e^{-0.2x}$
    * De exponentiële factor $e^{-0.2x}$ beschrijft [exponentieel verval](wiki:Exponential_decay) met een vervalsnelheidsparameter van $\alpha = 0.2$.
    * Naarmate $x$ toeneemt, verliest het systeem energie door [demping](wiki:Damping) (zoals wrijving of elektrische weerstand), waardoor de amplitude in de loop van de tijd afneemt.

    #### 3. De omhullenden: $\pm e^{-0.2x}$
    * Omdat de sinusfunctie begrensd is door $-1 \le \sin(3x) \le 1$, levert vermenigvuldiging met de positieve term $e^{-0.2x}$ het volgende op:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **Bovenste omhullende ($g(x) = e^{-0.2x}$)**: Vormt de vloeiende bovengrens die de positieve pieken begrenst.
    * **Onderste omhullende ($h(x) = -e^{-0.2x}$)**: Vormt de symmetrische grens die de negatieve dalen omsluit.
    * De oscillerende curve raakt de bovenste omhullende telkens wanneer $\sin(3x) = 1$ (bij $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) and de onderste omhullende telkens wanneer $\sin(3x) = -1$.

