    ---

    ### 图表说明

    此图表是阻尼谐振子的经典表示，常见于物理和工程领域（例如振动的吉他弦、减震器或 [RLC 电路](wiki:RLC_circuit)）。

    #### 1. 振荡分量：$\sin(3x)$
    * 项 $\sin(3x)$ 产生连续的周期性波动。
    * 角频率为 $\omega = 3\text{ rad/s}$，对应的周期为：
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * 这意味着曲线沿 $x$ 轴每隔 $\frac{\pi}{3} \approx 1.05$ 个单位穿过零点。

    #### 2. 阻尼因子：$e^{-0.2x}$
    * 指数因子 $e^{-0.2x}$ 描述了衰减率参数为 $\alpha = 0.2$ 的[指数衰减](wiki:Exponential_decay)。
    * 随着 $x$ 的增加，系统由于[阻尼](wiki:Damping)（如摩擦或电阻）而损失能量，振幅随时间缩小。

    #### 3. 包络线：$\pm e^{-0.2x}$
    * 由于正弦函数的范围被限制在 $-1 \le \sin(3x) \le 1$ 之间，乘以正项 $e^{-0.2x}$ 得到：
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **上包络线 ($g(x) = e^{-0.2x}$)**：形成平滑的上边界，限制正峰值。
    * **下包络线 ($h(x) = -e^{-0.2x}$)**：形成对称的边界，承托负波谷。
    * 每当 $\sin(3x) = 1$（在 $x = \frac{\pi}{6} + \frac{2\pi k}{3}$ 处）时，振荡曲线接触上包络线；每当 $\sin(3x) = -1$ 时，接触下包络线。

