      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **Đường bao trên ($g(x) = e^{-0.2x}$)**: Tạo thành ranh giới trên trơn tru bao phủ các đỉnh dương.
    * **Đường bao dưới ($h(x) = -e^{-0.2x}$)**: Tạo thành ranh giới đối xứng ôm lấy các đáy âm.
