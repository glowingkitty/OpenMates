    ### ما يظهره الرسم البياني

    هذا الرسم البياني هو تمثيل كلاسيكي لمذبذب توافقي مخمد، وهو ما يصادف عادةً في الفيزياء والهندسة (مثل وتر جيتار مهتز، أو ممتص صدمات، أو [دائرة RLC](wiki:RLC_circuit) كهربائية).

    #### 1. المكون التذبذبي: $\sin(3x)$
    * يولد المصطلح $\sin(3x)$ حركة موجية دورية مستمرة.
    * التردد الزاوي هو $\omega = 3\text{ rad/s}$، وهو ما يقابل دورة زمنية قدرها:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * هذا يعني أن المنحنى يقطع الصفر كل $\frac{\pi}{3} \approx 1.05$ وحدة على طول المحور $x$.

    #### 2. عامل التخميد: $e^{-0.2x}$
    * يصف العامل الأسي $e^{-0.2x}$ [الاضمحلال الأسي](wiki:Exponential_decay) بمعامل معدل اضمحلال $\alpha = 0.2$.
    * مع زيادة $x$، تُفقد الطاقة من النظام بسبب [التخميد](wiki:Damping) (مثل الاحتكاك أو المقاومة الكهربائية)، مما يؤدي إلى تقلص السعة بمرور الوقت.

    #### 3. الأغلفة: $\pm e^{-0.2x}$
    * بما أن دالة الجيب محصورة بين $-1 \le \sin(3x) \le 1$، فإن الضرب في المصطلح الموجب $e^{-0.2x}$ ينتج عنه:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **الغلاف العلوي ($g(x) = e^{-0.2x}$)**: يشكل الحد العلوي السلس الذي يغطي القمم الموجبة.
    * **الغلاف السفلي ($h(x) = -e^{-0.2x}$)**: يشكل الحد المتماثل الذي يحيط بالقيعان السالبة.
    * يلامس المنحنى المتذبذب الغلاف العلوي كلما كانت $\sin(3x) = 1$ (عند $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) والغلاف السفلي كلما كانت $\sin(3x) = -1$.

