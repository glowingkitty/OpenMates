    ### Ce que montre le graphique

    Ce graphique est une représentation classique d'un oscillateur harmonique amorti, couramment rencontré en physique et en ingénierie (comme une corde de guitare qui vibre, un amortisseur ou un [circuit RLC](wiki:RLC_circuit) électrique).

    #### 1. La composante oscillatoire : $\sin(3x)$
    * Le terme $\sin(3x)$ génère un mouvement ondulatoire périodique continu.
    * La fréquence angulaire est $\omega = 3\text{ rad/s}$, ce qui correspond à une période de :
      $$T = \frac{2\pi}{3} \approx 2,094$$
    * Cela signifie que la courbe croise le zéro toutes les $\frac{\pi}{3} \approx 1,05$ unités le long de l'axe $x$.

    #### 2. Le facteur d'amortissement : $e^{-0,2x}$
    * Le facteur exponentiel $e^{-0,2x}$ décrit une [décroissance exponentielle](wiki:Exponential_decay) avec un paramètre de taux de décroissance de $\alpha = 0,2$.
    * À mesure que $x$ augmente, de l'énergie est perdue par le système en raison de l'[amortissement](wiki:Damping) (comme la friction ou la résistance électrique), ce qui réduit l'amplitude au fil du temps.

    #### 3. Les enveloppes : $\pm e^{-0,2x}$
    * Comme la fonction sinus est bornée par $-1 \le \sin(3x) \le 1$, multiplier par le terme positif $e^{-0,2x}$ donne :
      $$-e^{-0,2x} \le e^{-0,2x}\sin(3x) \le e^{-0,2x}$$
    * **Enveloppe supérieure ($g(x) = e^{-0,2x}$)** : Forme la limite supérieure lisse qui coiffe les pics positifs.
    * **Enveloppe inférieure ($h(x) = -e^{-0,2x}$)** : Forme la limite symétrique qui soutient les creux négatifs.
    * La courbe oscillante touche l'enveloppe supérieure chaque fois que $\sin(3x) = 1$ (à $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) et l'enveloppe inférieure chaque fois que $\sin(3x) = -1$.

