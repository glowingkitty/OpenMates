    ### Co graf zobrazuje

    Tento graf je klasickým znázorněním tlumeného harmonického oscilátoru, se kterým se běžně setkáváme ve fyzice a inženýrství (například u vibrující struny kytary, tlumiče nárazů nebo elektrického [RLC obvodu](wiki:RLC_circuit)).

    #### 1. Oscilační složka: $\sin(3x)$
    * Člen $\sin(3x)$ generuje spojitý periodický vlnový pohyb.
    * Úhlová frekvence je $\omega = 3\text{ rad/s}$, což odpovídá periodě:
      $$T = \frac{2\pi}{3} \approx 2,094$$
    * To znamená, že křivka protíná nulu každých $\frac{\pi}{3} \approx 1,05$ jednotek na ose $x$.

    #### 2. Faktor tlumení: $e^{-0,2x}$
    * Exponenciální faktor $e^{-0,2x}$ popisuje [exponenciální pokles](wiki:Exponential_decay) s parametrem rychlosti poklesu $\alpha = 0,2$.
    * S rostoucím $x$ systém ztrácí energii v důsledku [tlumení](wiki:Damping) (jako je tření nebo elektrický odpor), což v průběhu času zmenšuje amplitudu.

    #### 3. Obálky: $\pm e^{-0,2x}$
    * Protože funkce sinus je omezena hodnotami $-1 \le \sin(3x) \le 1$, vynásobení kladným členem $e^{-0,2x}$ dává:
      $$-e^{-0,2x} \le e^{-0,2x}\sin(3x) \le e^{-0,2x}$$
    * **Horní obálka ($g(x) = e^{-0,2x}$)**: Tvoří hladkou horní hranici, která omezuje kladná maxima.
    * **Dolní obálka ($h(x) = -e^{-0,2x}$)**: Tvoří symetrickou hranici, která obepíná záporná minima.
    * Oscilující křivka se dotýká horní obálky vždy, když $\sin(3x) = 1$ (v bodě $x = \frac{\pi}{6} + \frac{2\pi k}{3}$), a dolní obálky vždy, když $\sin(3x) = -1$.

