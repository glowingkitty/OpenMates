    ### Vad grafen visar

    Grafen är ett klassiskt exempel på en dämpad harmonisk oscillator, som förekommer inom fysik och teknik (till exempel en vibrerande gitarrsträng, en stötdämpare eller en elektrisk [RLC-krets](wiki:RLC_circuit)).

    #### 1. Den oscillerande delen: $\sin(3x)$
    * Termen $\sin(3x)$ ger en kontinuerlig periodisk svängning.
    * Vinkelfrekvensen är $\omega = 3\text{ rad/s}$, vilket ger perioden:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * Kurvan skär därför nollinjen var $\frac{\pi}{3} \approx 1.05$:e enhet längs $x$-axeln.

    #### 2. Dämpningsfaktorn: $e^{-0.2x}$
    * Exponentialfaktorn $e^{-0.2x}$ beskriver [exponentiellt avtagande](wiki:Exponential_decay) med dämpningsparametern $\alpha = 0.2$.
    * När $x$ ökar förlorar systemet energi genom [dämpning](wiki:Damping) (till exempel friktion eller elektriskt motstånd), så amplituden minskar med tiden.

    #### 3. Höljeskurvorna: $\pm e^{-0.2x}$
    * Eftersom sinusfunktionen begränsas av $-1 \le \sin(3x) \le 1$ får vi, efter multiplikation med den positiva termen $e^{-0.2x}$:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **Övre höljeskurvan ($g(x) = e^{-0.2x}$)**: Den jämna övre gränsen för de positiva topparna.
    * **Nedre höljeskurvan ($h(x) = -e^{-0.2x}$)**: Den symmetriska nedre gränsen för de negativa dalarna.
    * Den oscillerande kurvan tangerar den övre höljeskurvan när $\sin(3x) = 1$ (vid $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) och den nedre när $\sin(3x) = -1$.

    ---

    ### Förslag på nästa steg

    - [Beräkna exakta lokala extrempunkter med derivata](/#message=Find%20the%20exact%20maxima%20and%20minima%20of%20y%20%3D%20exp(-0.2*x)*sin(3*x)%20using%20calculus)
    - [Jämför underdämpade och kritiskt dämpade system](/#message=Explain%20the%20difference%20between%20underdamped,%20critically%20damped,%20and%20overdamped%20oscillations)

  he: |
    להלן הגרף של הפונקציה יחד עם המעטפות החוסמות העליונה והתחתונה שלה:

    ```json
    {"type": "math-plot", "embed_id": "9ef899d2-4b73-4c4e-88bf-d4fd31d61e79"}
    ```

    ---

    ### מה הגרף מראה

    גרף זה הוא ייצוג קלאסי של מתנד הרמוני מרוסן, הנפוץ בפיזיקה ובהנדסה (כגון מיתר גיטרה רוטט, בולם זעזועים או [מעגל RLC](wiki:RLC_circuit) חשמלי).

    #### 1. הרכיב התנודתי: $\sin(3x)$
    * הביטוי $\sin(3x)$ יוצר תנועה גלית מחזורית רציפה.
    * התדירות הזוויתית היא $\omega = 3\text{ rad/s}$, המתאימה למחזור של:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * משמעות הדבר היא שהעקומה חוצה את האפס כל $\frac{\pi}{3} \approx 1.05$ יחידות לאורך ציר ה-$x$.

    #### 2. גורם הריסון: $e^{-0.2x}$
    * הגורם המעריכי $e^{-0.2x}$ מתאר [דעיכה מעריכית](wiki:Exponential_decay) עם פרמטר קצב דעיכה של $\alpha = 0.2$.
    * ככל ש-$x$ גדל, אנרגיה הולכת לאיבוד מהמערכת עקב [ריסון](wiki:Damping) (כגון חיכוך או התנגדות חשמלית), מה שמקטין את האמפליטודה לאורך זמן.

    #### 3. המעטפות: $\pm e^{-0.2x}$
    * מכיוון שפונקציית הסינוס חסומה על ידי $-1 \le \sin(3x) \le 1$, הכפלה בביטוי החיובי $e^{-0.2x}$ מניבה:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **מעטפת עליונה ($g(x) = e^{-0.2x}$)**: יוצרת את הגבול העליון החלק שחוסם את שיאי התנודה החיוביים.
    * **מעטפת תחתונה ($h(x) = -e^{-0.2x}$)**: יוצרת את הגבול הסימטרי שעוטף את נקודות השפל השליליות.
    * העקומה המתנודדת נוגעת במעטפת העליונה בכל פעם ש-$\sin(3x) = 1$ (ב-$x = \frac{\pi}{6} + \frac{2\pi k}{3}$) ובמעטפת התחתונה בכל פעם ש-$\sin(3x) = -1$.

    ---

    ### צעדים הבאים מוצעים

    - [חישוב נקודות הקיצון המקומיות המדויקות באמצעות הנגזרת](/#message=Find%20the%20exact%20maxima%20and%20minima%20of%20y%20%3D%20exp(-0.2*x)*sin(3*x)%20using%20calculus)
    - [השוואה בין מערכות בתת-ריסון לעומת ריסון קריטי](/#message=Explain%20the%20difference%20between%20underdamped,%20critically%20damped,%20and%20overdamped%20oscillations)
