    ### Apa yang Ditunjukkan oleh Grafik

    Grafik ini adalah representasi klasik dari osilator harmonik teredam, yang umum ditemukan dalam fisika dan teknik (seperti senar gitar yang bergetar, peredam kejut, atau [rangkaian RLC](wiki:RLC_circuit) listrik).

    #### 1. Komponen Osilasi: $\sin(3x)$
    * Istilah $\sin(3x)$ menghasilkan gerakan gelombang periodik yang kontinu.
    * Frekuensi sudutnya adalah $\omega = 3\text{ rad/s}$, yang sesuai dengan periode:
      $$T = \frac{2\pi}{3} \approx 2.094$$
    * Ini berarti kurva memotong titik nol setiap $\frac{\pi}{3} \approx 1.05$ unit di sepanjang sumbu $x$.

    #### 2. Faktor Redaman: $e^{-0.2x}$
    * Faktor eksponensial $e^{-0.2x}$ menjelaskan [peluruhan eksponensial](wiki:Exponential_decay) dengan parameter laju peluruhan $\alpha = 0.2$.
    * Seiring bertambahnya $x$, energi hilang dari sistem karena [redaman](wiki:Damping) (seperti gesekan atau hambatan listrik), sehingga memperkecil amplitudo seiring waktu.

    #### 3. Selubung: $\pm e^{-0.2x}$
    * Karena fungsi sinus dibatasi oleh $-1 \le \sin(3x) \le 1$, perkalian dengan suku positif $e^{-0.2x}$ menghasilkan:
      $$-e^{-0.2x} \le e^{-0.2x}\sin(3x) \le e^{-0.2x}$$
    * **Selubung Atas ($g(x) = e^{-0.2x}$)**: Membentuk batas atas halus yang membatasi puncak positif.
    * **Selubung Bawah ($h(x) = -e^{-0.2x}$)**: Membentuk batas simetris yang menampung lembah negatif.
    * Kurva yang berosilasi menyentuh selubung atas setiap kali $\sin(3x) = 1$ (pada $x = \frac{\pi}{6} + \frac{2\pi k}{3}$) dan selubung bawah setiap kali $\sin(3x) = -1$.

