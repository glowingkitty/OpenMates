    Opisuję teraz szczegółowo to konkretne ogłoszenie. Geokodowanie ulicy jest niejasne; zaznaczam, że wpływa to na weryfikację bliskości wody. Tekstowe twierdzenie o widoku na Landwehrkanal nie może zostać zweryfikowane geometrycznie. Potwierdzam obecność balkonu poprzez sprawdzenie tekstu i obrazu. Wyraźnie flaguję konflikt dat najmu między danymi strukturalnymi a tekstem opisowym.
    
    
    **Ocena danych ogłoszenia**
    
    Zagłębiam się teraz w najnowsze ogłoszenie. Oznaczyłem brak czynszu podstawowego (Kaltmiete) i nieprecyzyjne zestawienie opłat. Reklamowany czynsz jest punktem wyjścia, więc odnotowałem nieznane minimum. Zakres wielkości mieszkań w ramach projektu wymaga wyjaśnienia, ponieważ metraż ogłoszenia mieści się w tym przedziale. Oznaczyłem niepewną bliskość kanału ze względu na niezweryfikowaną precyzję lokalizacji.
    
    
    **Interpretacja szczegółów najmu**
    
    Skupiam się teraz na informacjach o najmie i weryfikacji balkonu w najnowszym ogłoszeniu. Potwierdziłem widoczność balkonu na podstawie tekstu i przykładowych zdjęć. Odnotowałem 12-miesięczny minimalny okres najmu oraz brak wyraźnych dat końcowych w danych. Ogłoszenie dotyczy umeblowanego pokoju z balkonem, ale tytuł mówi o mieszkaniu 2-pokojowym, więc badam potencjalną niejednoznaczność między pokojem a mieszkaniem. Zwracam dużą uwagę na wszystkie szczegóły.
    
    
    **Analiza szczegółów ogłoszenia**
    
    Uważnie analizuję teraz nowe ogłoszenie, w którym mowa o umeblowanym pokoju z balkonem. Fraza „vermieten unser schönes, ruhiges und möbliertes Zimmer mit Balkon” wprowadza istotną niejednoznaczność; na jedynym zdjęciu w ogłoszeniu brakuje potwierdzenia balkonu, co oznaczyłem. Adres i geokodowanie na poziomie dzielnicy sprawiają, że bliskość wody jest niejasna. Najem trwa od 1 listopada 2026 r. do 1 listopada 2027 r.
    
    
    **Porównywanie wzmianek o wodzie**
    
    Porównuję teraz ogłoszenia wspominające o obiektach wodnych, takich jak Maybachufer i inne, aby rozeznać precyzję ich twierdzeń i wszelkie nieodłączne różnice w danych. Przeglądam ich dowody i zakres. Skupiam się na precyzyjnych szczegółach, o które prosił użytkownik. Oznaczę wszelkie niepewności i ograniczenia w danych.
    
    
    **Weryfikacja zestawień czynszu**
    
    Skupiam się teraz na rozbieżnościach w kwotach czynszu. Priorytetowo traktuję uzgodnienie sprzecznych danych, raportowanie kosztów niewyszczególnionych i wyraźne zaznaczanie nieznanych składowych dotyczących ogrzewania. Badam również wstawione odwołania do osadzeń, aby upewnić się, że wyświetlany tekst nigdy nie jest identyfikatorem „embed_ref”. Ponadto będę używać tylko dużych lub małych kart dla odwołań do osadzeń, zgodnie ze składnią. Na samym końcu tej aktualizacji dołączę sugerowaną wiadomość uzupełniającą.
  nl: |
    **Zoekparameters voor appartementen definiëren**
    
    Ik richt me nu op het definiëren van de precieze zoekparameters voor huurwoningen in Berlijn. Ik heb Berlijn als stad opgegeven en het type aanbod beperkt tot "huur" en het type woning tot "appartement". Een balkon is een harde eis, die ik zeker in de zoekcriteria zal opnemen.
    
    
    **Zoekcriteria verfijnen**
    
    Ik heb de zoekparameters zojuist verder verfijnd. Ik heb "idealiter in de buurt van een rivier of meer" vertaald naar een voorkeur voor de nabijheid van water, gecategoriseerd als "neighborhood_categories: ['water']". Het budget van "maximaal 1.800 EUR per maand" is nu gespecificeerd als `max_warm_rent_eur: 1800`, omdat ik ervan uitga dat dit de warmhuur is. Omdat mij is verteld dat "duidelijk gelabelde mogelijkheden welkom zijn wanneer sommige details ontbreken", zal ik nu expliciet onbevestigde advertenties opnemen met `include_unconfirmed: true`.
    
    
    **Zoekvereisten analyseren**
    
    Ik analyseer nu zorgvuldig de richtlijnen van deze tool voor het zoeken naar woningen. Ik concentreer me op hoe ik mijn voorkeuren het beste kan vertalen naar de juiste gestructureerde filters en `relevance_criteria`. Ik moet ervoor zorgen dat mijn eisen voor de nabijheid van water, bewijs van een balkon en budgetbeperkingen allemaal correct zijn gecodeerd. Ik zorg er ook voor dat ik in mijn zoekopdracht onderscheid maak tussen wat "vereist", "uitgesloten" en "geprefereerd" is.
    
    
    **Integriteit van advertentiegegevens beoordelen**
    
    Ik houd me nu intensief bezig met de gegevensintegriteit. Ik moet voorkomen dat ik visueel bewijs overschat en moet de beperkingen van elke aanbieder specificeren. De nabijheid van water moet stevig onderbouwd zijn met bewijs, en als "niet geverifieerd" worden gerapporteerd wanneer verrijking niet beschikbaar is of een time-out heeft. Het moet duidelijk zijn dat een zichtbaar balkon niet garandeert dat het bij het appartement hoort, en ik kan huurspecificaties alleen rapporteren als ze expliciet worden vermeld.
    
    
    **Advertentiegegevens analyseren**
    
    Ik ben nu diep in de gevonden advertenties gedoken en controleer ze nauwgezet aan de hand van de verstrekte regels. Mijn focus ligt op het duidelijk afbakenen van bevestigde gegevenspunten ten opzichte van onzekerheden. Ik let goed op details zoals huur, huurdata en toegang tot water, en markeer eventuele onduidelijkheden. Het doel is uiterste precisie.
    
    
    **Nabijheidscriteria verduidelijken**
    
    Ik integreer nu de genuanceerde nabijheidseisen. Ik documenteer zorgvuldig alle beperkingen in het bewijsmateriaal. Ik richt me op het transparant scheiden van gevalideerde claims van niet-geverifieerde informatie. Ik geef prioriteit aan nauwkeurigheid in mijn documentatie. Ik ben duidelijk over wat telt als geverifieerde toegang tot water en wat niet. Ik benadruk de noodzaak van expliciete labeling van onzekere gegevens.
    
    
    **Regels voor ambiguïteit verfijnen**
    
    Ik richt me nu op het verfijnen van de regels rond onzekere gegevenspunten. Als er geen melding wordt gemaakt van water, rapporteer ik dit als onbekend; ik trek geen conclusies over de nabijheid. Ik scheid de zichtbaarheid van een balkon op foto's van tekstuele bevestiging. Huurvoorwaarden worden alleen expliciet gerapporteerd als ze worden vermeld. Tegenstrijdigheden in data en huurspecificaties krijgen prioriteit. Ik gebruik de embed-voorbeeldkaarten als weergave.
    ```embeds_results_view
    title: Rental apartments with balconies in Berlin
    embeds:
      - 2-room-loft-DBH
      - m-
    ```
    
    
    **Resultaatindeling interpreteren**
    
    Ik richt me nu op de structuur van de "embeds\_results\_view"-respons. Het viel me op dat een "source\_ref" ontbreekt, wat van invloed is op het juiste gebruik van "sources" of "embeds". Ik zal het veld "embeds" gebruiken wanneer er geen source\_ref beschikbaar is, waarbij ik specifiek verwijs naar de geretourneerde onderliggende embed\_ref-waarden. Ook let ik op het veld "title" als beschrijvend element.
    
    
    **Details van advertenties onderzoeken**
    
    Ik onderzoek nu individuele advertenties nauwgezet, met name de "2-kamer loft-appartement met balkon, nabij Ringbahn". Ik vergelijk deze advertentie met de embed-gegevens. Ik noteer de niet-geverifieerde nabijheid van water vanwege onbekende afstanden en toegang, ook al wordt er een uitzicht op het meer genoemd. Mijn focus ligt op het duidelijk noteren van wat bevestigd is versus wat niet geverifieerd is. Ik documenteer zorgvuldig alle onzekerheden.
    
    
    **Details van advertenties evalueren**
    
    Ik ben net klaar met het evalueren van een andere advertentie. Ik heb de aanwezigheid van een balkon bevestigd via fotoanalyse. De huurperiode biedt een vaste termijn gevolgd door flexibele verlengingen, wat ik heb gedocumenteerd. Ik richt me op de details. Nu werk ik eraan om alle relevante informatie uit de advertentie volledig te begrijpen.
    ```
    ```
    
    **Specifieke kenmerken detailleren**
    
    Ik specificeer nu deze specifieke advertentie. De geocode van de straat is vaag; ik merk op dat dit invloed heeft op de verificatie van de nabijheid van water. De tekstuele claim van uitzicht op het Landwehrkanal kan geometrisch niet worden gevalideerd. Ik bevestig de aanwezigheid van een balkon via tekstuele en visuele controles. Ik markeer expliciet het conflict in de huurdatum tussen de gestructureerde gegevens en de beschrijvende tekst.
    
    
    **Advertentiegegevens beoordelen**
    
    Ik duik nu in de nieuwste advertentie. Ik heb de ontbrekende kale huur en de onprecieze huurspecificatie gemarkeerd. De geadverteerde huur is een startpunt, dus ik heb de onbekende minimumhuur genoteerd. De variatie in appartementgroottes binnen het project vereist duidelijkheid, aangezien de grootte in de advertentie hierbinnen valt. Ik heb de onzekere nabijheid van het kanaal gemarkeerd vanwege de niet-geverifieerde precisie van de locatie.
    
    
    **Huurdetails interpreteren**
    
    Ik richt me nu op de huurinformatie en de balkonverificatie van de nieuwste advertentie. Ik heb de zichtbaarheid van het balkon bevestigd via tekst en steekproefsgewijze visuele controle. Ik heb een minimale huurperiode van 12 maanden genoteerd en de afwezigheid van duidelijke einddata in de gegevens. De advertentie betreft een gemeubileerde kamer met een balkon, maar de titel vermeldt een 2-kamerappartement, dus ik onderzoek de mogelijke ambiguïteit tussen kamer en appartement. Ik let goed op alle details.
    
    
    **Details van advertenties analyseren**
    
    Ik analyseer nu zorgvuldig een nieuwe advertentie, waarin een gemeubileerde kamer met balkon wordt vermeld. De zin "vermieten unser schönes, ruhiges und möbliertes Zimmer mit Balkon" voegt cruciale ambiguïteit toe; de enige foto bij de advertentie biedt geen bevestiging van het balkon, wat ik heb gemarkeerd. Het adres, een geocode op wijkniveau, maakt de nabijheid van water vaag. De huurperiode loopt van 1 november 2026 tot 1 november 2027.
    
    
    **Vermeldingen van water vergelijken**
    
    Ik vergelijk nu advertenties waarin waterkenmerken zoals de Maybachufer en andere worden genoemd, om de precisie van hun claims en eventuele inherente gegevensverschillen te onderscheiden. Ik beoordeel hun bewijsvoering en dekking. Ik richt me op de precieze details die de gebruiker heeft gevraagd. Ik zal eventuele onzekerheden en beperkingen in de gegevens markeren.
    
    
    **Huurspecificaties verifiëren**
    
    Ik richt me nu op discrepanties in de huurcijfers. Ik geef prioriteit aan het op één lijn brengen van tegenstrijdige cijfers, het rapporteren van niet-gespecificeerde kosten en het expliciet noteren van onbekende inbegrepen stookkosten. Ook controleer ik inline embed-verwijzingen om er zeker van te zijn dat de weergavetekst nooit de embed\_ref is. Bovendien zal ik alleen grote of kleine kaarten gebruiken voor embed-refs, op basis van de syntaxis. Tot slot voeg ik aan het einde van deze update een suggestie voor een vervolgbericht toe.
  ar: |
    **تحديد معايير البحث عن شقة**
    
    أقوم الآن بالتركيز على تحديد معايير البحث الدقيقة للإيجارات في برلين. لقد حددت برلين كمدينة، وقصرت نوع القائمة على "إيجار" ونوع العقار على "شقة". الشرفة هي مطلب أساسي، وسأحرص على تضمينها في معايير البحث.
    
    
    **تحسين معايير البحث**
    
    لقد قمت للتو بتحسين معايير البحث بشكل أكبر. لقد ترجمت "من الناحية المثالية بالقرب من نهر أو بحيرة" إلى تفضيل للقرب من المياه، وصنفتها كـ "neighborhood_categories: ['water']". الميزانية التي تصل إلى "1,800 يورو شهرياً" محددة الآن كـ `max_warm_rent_eur: 1800` ، حيث أفترض أن هذا هو الإيجار الشامل (warm rent). علاوة على ذلك، وبما أنه قيل لي "الاحتمالات المصنفة بوضوح مرحب بها عند فقدان بعض التفاصيل"، سأقوم الآن بتضمين القوائم غير المؤكدة صراحةً باستخدام `include_unconfirmed: true`.
    
    
    **تحليل متطلبات البحث**
    
    أقوم الآن بتحليل إرشادات أداة البحث عن المنازل هذه بعناية. أركز على أفضل السبل لترجمة تفضيلاتي إلى مرشحات منظمة صحيحة و `relevance_criteria`. أحتاج إلى التأكد من أن متطلباتي المتعلقة بالقرب من المياه، ووجود شرفة، وقيود الميزانية كلها مشفرة بشكل صحيح. كما أحرص على التمييز بين ما هو "مطلوب" و"مستبعد" و"مفضل" في بحثي.
    
    
    **تقييم سلامة بيانات القوائم**
    
    أنا الآن مهتم بشدة بسلامة البيانات. يجب أن أتجنب المبالغة في ادعاء الأدلة المرئية وتحديد القيود لكل مزود. يجب أن يكون القرب من المياه مبنياً بشكل قوي على الأدلة، مع الإبلاغ عنه كـ "غير مؤكد" عندما يكون الإثراء غير متاح أو انتهت مهلته. يجب أن يكون واضحاً أن الشرفة المرئية لا تضمن أنها تابعة للشقة، ولا يمكنني الإبلاغ عن تفاصيل عقد الإيجار إلا عندما يتم ذكرها صراحةً.
    
    
    **تحليل بيانات القوائم**
    
    أنا الآن غارق في القوائم المسترجعة، وأقوم بمطابقتها بدقة مع القواعد المقدمة. ينصب تركيزي على التمييز بوضوح بين نقاط البيانات المؤكدة والشكوك. أولي اهتماماً وثيقاً لتفاصيل مثل الإيجار وتواريخ الإيجار والوصول إلى المياه، مع وضع علامة على أي غموض. الهدف هو الدقة المتناهية.
    
    
    **توضيح معايير القرب**
    
    أقوم الآن بدمج متطلبات القرب الدقيقة. أقوم بتوثيق أي قيود في الأدلة بعناية. أركز على الفصل الشفاف بين الادعاءات الموثقة والمعلومات غير المؤكدة. أعطي الأولوية للدقة في توثيقي. أنا واضح بشأن ما يشكل وصولاً موثقاً للمياه وما لا يشكل ذلك. أؤكد على الحاجة إلى التصنيف الصريح للبيانات غير المؤكدة.
    
    
    **تحسين قواعد الغموض**
    
    أركز الآن على تحسين القواعد المتعلقة بنقاط البيانات غير المؤكدة. إذا لم يكن هناك ذكر لميزة مائية، فسأبلغ عنها كغير معروفة؛ ولن أستنتج القرب. سأفصل بين رؤية الشرفة في الصور والتأكيد النصي. يتم الإبلاغ عن شروط عقد الإيجار صراحةً فقط عند ذكرها. يتم إعطاء الأولوية للتناقضات في التواريخ وتفاصيل الإيجار. سأستخدم بطاقات معاينة التضمين كعرض.
    ```embeds_results_view
    title: Rental apartments with balconies in Berlin
    embeds:
      - 2-room-loft-DBH
      - m-
    ```
    
    
    **تفسير تنسيق النتائج**
    
    أركز الآن على هيكل استجابة "embeds\_results\_view". لاحظت غياب "source\_ref"، مما يؤثر على الاستخدام الصحيح لـ "sources" أو "embeds". سأحرص على استخدام حقل "embeds" عندما لا يتوفر source\_ref، مع الإشارة تحديداً إلى قيم embed\_ref الفرعية المسترجعة. أيضاً، سأهتم بحقل "title" كعنصر وصفي.
    
    
    **فحص تفاصيل القوائم**
    
    أقوم الآن بفحص القوائم الفردية عن كثب، مع التركيز بشكل خاص على "شقة لوفت من غرفتين مع شرفة، بالقرب من Ringbahn". أقوم بمطابقة هذه القائمة مع بيانات التضمين. ألاحظ القرب غير المؤكد من المياه بسبب المسافات والوصول غير المعروفين، على الرغم من ذكر إطلالة على البحيرة. ينصب تركيزي على تدوين ما هو مؤكد مقابل ما هو غير مؤكد بوضوح. أقوم بتوثيق جميع الشكوك بعناية.
    
    
    **تقييم تفاصيل القوائم**
    
    لقد انتهيت للتو من تقييم قائمة أخرى. أكدت رؤية الشرفة من خلال تحليل الصور. يقدم عقد الإيجار فترة ثابتة تليها تمديدات مرنة، وهو ما قمت بتوثيقه. أنا أركز على التفاصيل. الآن، أعمل على فهم جميع معلومات القائمة ذات الصلة بشكل كامل.
    ```
    ```
    
    **تفصيل سمات محددة**
    
    أقوم الآن بتفصيل هذه القائمة المحددة. الموقع الجغرافي للشارع غامض؛ ألاحظ أن هذا يؤثر على التحقق من القرب من المياه. الادعاء النصي بوجود إطلالة على قناة Landwehrkanal لا يمكن التحقق منه هندسياً. أؤكد وجود الشرفة عبر الفحوصات النصية والمرئية. أقوم صراحةً بالإشارة إلى تعارض تاريخ عقد الإيجار بين البيانات المنظمة والنص الوصفي.
    
    
    **تقييم بيانات القوائم**
    
    أغوص الآن في أحدث قائمة. لقد أشرت إلى فقدان الإيجار الأساسي (cold rent) وتفاصيل الإيجار غير الدقيقة. الإيجار المعلن هو نقطة بداية، لذا لاحظت الحد الأدنى غير المعروف. تتطلب مجموعة أحجام الشقق داخل المشروع وضوحاً، حيث يقع حجم القائمة ضمن هذا النطاق. لقد أشرت إلى القرب غير المؤكد من القناة بسبب دقة الموقع غير المؤكدة.
    
    
    **تفسير تفاصيل عقد الإيجار**
    
    أركز الآن على معلومات عقد الإيجار والتحقق من الشرفة في أحدث قائمة. أكدت رؤية الشرفة عبر النص والصور المختارة. لاحظت وجود حد أدنى لعقد الإيجار لمدة 12 شهراً وغياب تواريخ انتهاء واضحة في البيانات. القائمة لغرفة مفروشة مع شرفة، لكن العنوان يقول شقة من غرفتين، لذا أحقق في الغموض المحتمل بين كونها غرفة أو شقة. أولي اهتماماً وثيقاً لجميع التفاصيل.
    
    
    **تحليل تفاصيل القوائم**
    
    أقوم الآن بتحليل قائمة جديدة بعناية، والتي تنص على غرفة مفروشة مع شرفة. عبارة "vermieten unser schönes, ruhiges und möbliertes Zimmer mit Balkon" تضيف غموضاً حاسماً؛ تفتقر الصورة الوحيدة للقائمة المقدمة إلى تأكيد وجود الشرفة، وهو ما أشرت إليه. العنوان، والموقع الجغرافي على مستوى المنطقة يجعل القرب من المياه غامضاً. يمتد عقد الإيجار من 1 نوفمبر 2026 إلى 1 نوفمبر 2027.
    
    
    **مقارنة ذكر المياه**
    
    أقوم الآن بمقارنة القوائم التي تذكر ميزات مائية مثل Maybachufer وغيرها لتمييز دقة ادعاءاتهم وأي تمايزات متأصلة في البيانات. أراجع أدلتهم وتغطيتهم. أنا أركز على التفاصيل الدقيقة التي طلبها المستخدم. سأشير إلى أي شكوك وقيود في البيانات.
    
    
    **التحقق من تفاصيل الإيجار**
    
    أركز الآن على التناقضات في أرقام الإيجار. أعطي الأولوية لتسوية الأرقام المتناقضة، والإبلاغ عن التكاليف غير المفصلة، والإشارة صراحةً إلى شمولية التدفئة غير المعروفة. أيضاً، أقوم بفحص مراجع التضمين المضمنة للتأكد من أن نص العرض ليس هو embed\_ref أبداً. علاوة على ذلك، سأستخدم فقط البطاقات الكبيرة أو الصغيرة لمراجع التضمين، بناءً على الصيغة. أخيراً، سأقوم بإرفاق رسالة متابعة مقترحة في نهاية هذا التحديث مباشرةً.
