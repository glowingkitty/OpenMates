    ```
    
    *Poznámka: Karty inzerátů můžeš otevřít přímo a prohlédnout si všech 14–15 fotografií ve vysokém rozlišení ručně.*
    
    ---
    
    ### 3. Podrobnosti o balkonu a vodě: Potvrzené vs. neznámé
    
    #### Byt na Maybachufer
    * **Balkon**:
      * *Potvrzeno textem inzerátu*: Uvádí **dva balkony** – jeden údajně do vnitrobloku (*Innenhof*) a jeden směrem ke kanálu/ulici.
      * *Potvrzeno kontrolou fotek*: Viditelné konstrukce balkonů byly potvrzeny na kontrolovaných fotografiích s indexy 0 a 14.
      * *Neznámé*: Přesné rozměry balkonů, orientace/doba slunečního svitu a zda je k dispozici venkovní nábytek.
    * **Přístup k vodě**:
      * *Potvrzeno textem inzerátu*: Nachází se přímo na Maybachufer podél [Landwehrského kanálu](wiki:Landwehr_Canal) v [Neuköllnu](wiki:Neukölln). Popis výslovně uvádí výhled na vodu.
      * *Neznámé / Neověřené nástrojem*: Geokódovací systém označil dotaz na adresu za nejednoznačný a jako výchozí bod nastavil střed Berlína namísto přesného umístění parcely. V důsledku toho nebylo možné nezávisle na datech inzerátu změřit přesnou vzdálenost k přechodům přes kanál nebo k přístavišti.
    
    #### Loft na Anton-Saefkow-Platz
    * **Balkon**:
      * *Potvrzeno textem inzerátu*: Výslovně inzeruje „slunný balkon s výhledem na Fennpfuhlpark“.
      * *Potvrzeno kontrolou fotek*: Konstrukce balkonu byla potvrzena na kontrolované fotografii s indexem 0.
      * *Neznámé*: Plocha balkonu a podlaží (inzerát uvádí styl loftu v horních patrech, ale ne přesné podlaží).
    * **Přístup k vodě**:
      * *Potvrzeno textem inzerátu a OpenStreetMap*: Nachází se na Anton-Saefkow-Platz v Lichtenbergu, hned vedle parku Fennpfuhlpark, ve kterém leží **Fennpfuhl** (historické jezero).
      * *Neznámé / Neověřené nástrojem*: Inzerát **neleží** přímo na břehu řeky nebo kanálu; vodním prvkem je vnitrozemské parkové jezero. Navíc, i když je samotný park přes ulici, přesná doba chůze k vodě a to, zda je voda z balkonu skutečně vidět přes koruny stromů, zůstává neověřené.
    
    ---
    
    ### Otázky, které bys měl(a) položit hostitelům před prohlídkou
    
    1. **Pro Maybachufer**:
       * *„Pokrývá měsíční paušál 1 800 € v plné výši topení, elektřinu a internet, nebo probíhá na konci pobytu samostatné vyúčtování služeb (*Nebenkostenabrechnung*)?“*
       * *„Můžete potvrdit přesné termíny podnájmu (shrnutí uvádí 2 měsíce, ale anglický popis zmiňuje 4–6 měsíců)?“*
    2. **Pro loft**:
       * *„Je dodatečný poplatek 150 € pevný paušál (*Pauschale*) zahrnující topení a internet, nebo se jedná o zálohu (*Vorauszahlung*)?“*
       * *„Je ve smlouvě v případě potřeby garantováno prodloužení po 28. prosinci 2026?“*
