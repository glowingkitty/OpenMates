    यहाँ **Maybachufer flat** और **Anton-Saefkow-Platz loft** के लिए लिस्टिंग डेटा वास्तव में क्या पुष्टि करता है और क्या असत्यापित या अज्ञात रहता है, इसका सटीक विवरण दिया गया है।
    
    ---
    
    ### 1. Maybachufer का किराया: क्या €1,800 वास्तव में ऑल-इंक्लूसिव है?
    
    * **लिस्टिंग क्या निर्दिष्ट करती है**: कोल्ड रेंट (*Kaltmiete*) और कुल किराया (*Warmmiete*) दोनों ही फ्लैट **€1,800** के रूप में दर्ज किए गए हैं। सिक्योरिटी डिपॉजिट €1,000 निर्धारित है।
    * **क्या अज्ञात रहता है**:
      * **उपयोगिताओं का विवरण (Utilities Breakdown)**: लिस्टिंग में परिचालन लागत (*Betriebskosten/Nebenkosten*) या हीटिंग (*Heizkosten*) के लिए **कोई मदवार लागत विवरण (itemized cost breakdown)** नहीं दिया गया है।
      * **बिजली और इंटरनेट**: होस्ट ने संरचित फ़ील्ड (structured fields) में स्पष्ट रूप से पुष्टि नहीं की है कि घरेलू बिजली (*Haushaltsstrom*) या वाई-फाई €1,800 में शामिल हैं या उपयोग की कोई सीमा लागू है।
      * **ब्रॉडकास्टिंग शुल्क**: क्या अनिवार्य जर्मन ब्रॉडकास्टिंग शुल्क (*Rundfunkbeitrag*) शामिल है या इसे अलग से पंजीकृत किया जाना चाहिए, यह नहीं बताया गया है।
    * **निष्कर्ष**: हालांकि इसे सुसज्जित अल्पकालिक सबलेट्स के लिए विशिष्ट एकमुश्त मासिक राशि के रूप में विज्ञापित किया गया है, लेकिन जब तक होस्ट बिजली, हीटिंग की अतिरिक्त लागत और इंटरनेट कवरेज की पुष्टि करने वाला लिखित विवरण प्रदान नहीं करता, तब तक इसे **सख्ती से ऑल-इंक्लूसिव के रूप में सत्यापित नहीं किया जा सकता**।
    
    ---
    
    ### 2. फोटो गैलरी का दायरा: प्राप्त बनाम जाँच की गई
    
    सर्च टूल ने पूरी गैलरी संख्या के साथ लिस्टिंग मेटाडेटा प्राप्त किया, लेकिन स्वचालित विजुअल विश्लेषण ने मुख्य विशेषताओं की पहचान करने के लिए प्रति लिस्टिंग केवल तस्वीरों के एक लक्षित नमूने का मूल्यांकन किया:
    
    ```json
    {"type": "sheet", "embed_id": "c524ed20-2be0-4348-ae66-d63968a523de"}
    ```
    
    *नोट: आप सभी 14-15 हाई-रेजोल्यूशन तस्वीरों को मैन्युअल रूप से देखने के लिए सीधे लिस्टिंग कार्ड खोल सकते हैं।*
    
