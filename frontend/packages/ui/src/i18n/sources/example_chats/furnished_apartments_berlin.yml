      * **Prąd i internet**: Gospodarz nie potwierdza wyraźnie w ustrukturyzowanych polach, czy prąd domowy (*Haushaltsstrom*) lub Wi-Fi są wliczone w kwotę 1800 €, ani czy obowiązują limity zużycia.
      * **Abonament RTV**: Nie określono, czy obowiązkowa niemiecka opłata radiowo-telewizyjna (*Rundfunkbeitrag*) jest wliczona, czy też należy ją zarejestrować oddzielnie.
    * **Wniosek**: Choć oferta jest reklamowana jako ryczałtowa kwota miesięczna typowa dla umeblowanego podnajmu krótkoterminowego, **nie można jej uznać za ściśle all-inclusive**, dopóki gospodarz nie przedstawi pisemnego zestawienia potwierdzającego pokrycie kosztów prądu, nadwyżek za ogrzewanie i internetu.
    
