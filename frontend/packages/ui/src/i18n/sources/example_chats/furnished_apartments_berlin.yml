    ### पूछताछ करने से पहले मुख्य बातें
    1. **पानी का सत्यापन**: केवल मायबाखुफर फ्लैट ही अपार्टमेंट से सीधे खुले जलमार्ग की ओर देखता है, लेकिन इसका जियोकोड अनुमानित है और तारीखों में टकराव है। एंटोन-सेफको-प्लात्ज़ फ्लैट की फेनफुहल (Fennpfuhl) से पार्क की निकटता की पुष्टि हुई है, हालांकि तटरेखा की सटीक दूरी मापी नहीं गई है।
    2. **लीज के प्रकार**: WG-Gesucht लिस्टिंग में से कोई भी ओपन-एंडेड (*unbefristet*) लीज की पेशकश नहीं करता है; वे सभी निश्चित अवधि के सबलेट हैं। मोमेंटो बर्लिन (Momento Berlin) न्यूनतम 12 महीने से शुरू होने वाली लंबी अवधि की किरायेदारी की पेशकश करता है।
    3. **फोटो सैंपलिंग की सीमाएं**: विजुअल असेसमेंट में प्रति लिस्टिंग 1 से 3 छवियों के एक सीमित नमूने की जांच की गई। प्रत्येक लिस्टिंग कार्ड के माध्यम से सुलभ पूरी गैलरी में अतिरिक्त सुविधाएं दिखाई दे सकती हैं।
    
