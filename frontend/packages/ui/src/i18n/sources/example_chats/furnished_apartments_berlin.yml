    Här är en exakt sammanställning av vad annonsdatan faktiskt bekräftar jämfört med vad som förblir overifierat eller okänt för **lägenheten på Maybachufer** och **loftet på Anton-Saefkow-Platz**.
    
    ---
    
    ### 1. Hyra för Maybachufer: Är 1 800 € verkligen all-inclusive?
    
    * **Vad annonsen anger**: Både kallhyra (*Kaltmiete*) och totalhyra (*Warmmiete*) anges som ett fast belopp på **1 800 €**. Depositionen är satt till 1 000 €.
    * **Vad som förblir OKÄNT**:
      * **Specifikation av driftskostnader**: Annonsen innehåller **ingen specificerad kostnadsuppdelning** för driftskostnader (*Betriebskosten/Nebenkosten*) eller uppvärmning (*Heizkosten*).
      * **El och internet**: Värden bekräftar inte uttryckligen i de strukturerade fälten om hushållsel (*Haushaltsstrom*) eller Wi-Fi ingår i de 1 800 € eller om det finns förbrukningstak.
      * **Radio- och tv-avgift**: Det framgår inte om den obligatoriska tyska radio- och tv-avgiften (*Rundfunkbeitrag*) ingår eller måste registreras separat.
    * **Slutsats**: Även om den marknadsförs som ett månatligt schablonbelopp, vilket är typiskt för möblerad korttidsuthyrning i andra hand, **kan det inte verifieras som strikt all-inclusive** förrän värden tillhandahåller en skriftlig specifikation som bekräftar el, extra värmekostnader och internet.
    
    ---
    
    ### 2. Omfång av fotogalleri: Hämtade vs. granskade
    
    Sökverktyget hämtade metadata för annonsen med fullständigt antal bilder, men den automatiserade visuella analysen utvärderade endast ett urval av bilderna per annons för att identifiera kärnegenskaper:
    
    ```json
    {"type": "sheet", "embed_id": "c524ed20-2be0-4348-ae66-d63968a523de"}
    ```
    
    *Obs! Du kan öppna annonskorten direkt för att bläddra igenom alla 14–15 högupplösta bilder manuellt.*
    
    ---
    
    ### 3. Detaljer om balkong och vatten: Bekräftat vs. okänt
    
    #### Lägenheten på Maybachufer
    * **Balkong**:
      * *Bekräftat av annonstexten*: Har **två balkonger** – en som sägs vara vänd mot innergården (*Innenhof*) och en mot kanalen/gatan.
      * *Bekräftat genom fotogranskning*: Synliga balkongkonstruktioner bekräftades i de granskade bilderna med index 0 och 14.
      * *Okänt*: Exakta balkongmått, väderstreck/soltimmar och om utemöbler ingår.
    * **Tillgång till vatten**:
      * *Bekräftat av annonstexten*: Belägen direkt på Maybachufer längs [Landwehr Canal](wiki:Landwehr_Canal) i [Neukölln](wiki:Neukölln). Beskrivningen hävdar uttryckligen utsikt mot vattnet.
      * *Okänt / Ej verifierat av verktyget*: Geokodningssystemet flaggade sökningen på gatuadressen som tvetydig och valde en standardpunkt för hela Berlin snarare än en exakt position. Som ett resultat kunde annonsens exakta avstånd till gångvägar över kanalen eller tillgång till bryggor inte mätas oberoende av datapaketet.
    
    #### Loftet på Anton-Saefkow-Platz
    * **Balkong**:
      * *Bekräftat av annonstexten*: Marknadsför uttryckligen en "solig balkong med utsikt över Fennpfuhlpark".
      * *Bekräftat genom fotogranskning*: En balkongkonstruktion bekräftades i den granskade bilden med index 0.
      * *Okänt*: Balkongens kvadratmeter och våningsplan (annonsen anger loftstil på de övre våningarna, men inte exakt våning).
    * **Tillgång till vatten**:
      * *Bekräftat av annonstexten & OpenStreetMap*: Beläget vid Anton-Saefkow-Platz i Lichtenberg, intill Fennpfuhlpark, som innehåller **Fennpfuhl** (en historisk sjö).
      * *Okänt / Ej verifierat av verktyget*: Boendet ligger **inte** direkt vid en flod- eller kanalbank; vatteninslaget är en insjö i en park. Dessutom, även om själva parken ligger tvärs över gatan, förblir den exakta gångtiden till vattnet och huruvida vattnet är direkt synligt över trädtopparna från balkongen overifierat.
    
    ---
    
    ### Frågor att ställa till värdarna före visning
    
    1. **För Maybachufer**:
       * *"Täcker det månatliga schablonbeloppet på 1 800 € uppvärmning, el och internet fullt ut, eller sker en separat avräkning av driftskostnader (*Nebenkostenabrechnung*) vid slutet av vistelsen?"*
       * *"Kan du bekräfta de exakta datumen för andrahandsuthyrningen (sammanfattningen säger 2 månader, men den engelska beskrivningen nämner 4–6 månader)?"*
    2. **För loftet**:
