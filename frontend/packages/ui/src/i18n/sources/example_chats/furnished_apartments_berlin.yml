    **Doprecyzowanie kryteriów wyszukiwania**
    
    Właśnie jeszcze bardziej doprecyzowałem parametry wyszukiwania. Przetłumaczyłem frazę „najlepiej w pobliżu rzeki lub jeziora” na preferencję bliskości wody, skategoryzowaną jako „neighborhood_categories: ['water']”. Budżet „do 1800 EUR miesięcznie” został określony jako `max_warm_rent_eur: 1800`, zakładając, że jest to czynsz z opłatami (warm rent). Ponadto, ponieważ poinstruowano mnie, że „wyraźnie oznaczone możliwości są mile widziane, gdy brakuje niektórych szczegółów”, uwzględnię teraz jawnie niepotwierdzone ogłoszenia za pomocą `include_unconfirmed: true`.
    
    
    **Analiza wymogów wyszukiwania**
    
    Analizuję teraz uważnie wytyczne tego narzędzia do wyszukiwania domów. Skupiam się na tym, jak najlepiej przełożyć preferencje na poprawne filtry strukturalne i kryteria trafności (`relevance_criteria`). Muszę upewnić się, że wymagania dotyczące bliskości wody, dowodów na posiadanie balkonu i ograniczeń budżetowych są prawidłowo zakodowane. Dbam również o rozróżnienie między tym, co jest „wymagane”, „wykluczone” a „preferowane” w moim wyszukiwaniu.
    
    
    **Ocena integralności danych ogłoszeń**
    
    Jestem teraz głęboko zaangażowany w kwestię integralności danych. Muszę unikać nadmiarowych twierdzeń o dowodach wizualnych i określać ograniczenia każdego dostawcy. Bliskość wody musi być solidnie ugruntowana w dowodach, a w przypadku braku wzbogacenia danych lub przekroczenia czasu oczekiwania raportowana jako „niezweryfikowana”. Musi być jasne, że widoczny balkon nie gwarantuje, iż należy on do danego mieszkania, a szczegóły najmu mogę zgłaszać tylko wtedy, gdy są wyraźnie podane.
    
    
    **Analiza danych ogłoszeń**
    
    Analizuję teraz zwrócone ogłoszenia, skrupulatnie porównując je z podanymi zasadami. Skupiam się na wyraźnym oddzieleniu potwierdzonych punktów danych od niepewności. Zwracam szczególną uwagę na szczegóły, takie jak czynsz, daty najmu i dostęp do wody, flagując wszelkie niejasności. Celem jest najwyższa precyzja.
    
    
