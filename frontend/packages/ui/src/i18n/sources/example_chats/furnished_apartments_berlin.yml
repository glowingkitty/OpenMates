    ### 3. Details balkon & water: Bevestigd vs. Onbekend
    
    #### Appartement Maybachufer
    * **Balkon**:
      * *Bevestigd door advertentietekst*: Beschikt over **twee balkons** — één gericht op de binnenplaats (*Innenhof*) en één gericht op het kanaal/de straat.
      * *Bevestigd door fotocontrole*: Zichtbare balkonstructuren werden bevestigd in de gecontroleerde foto-indexen 0 en 14.
