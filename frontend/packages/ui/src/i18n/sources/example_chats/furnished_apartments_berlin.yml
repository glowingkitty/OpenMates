    * **תנאי שכירות וסתירות בהיקף**:
      * *סתירה בתאריכים*: השדות המובנים מראים זמינות מ-21.10.2026 עד 03.05.2027. עם זאת, הטקסט בגרמנית מציין במפורש זמינות החל מה-11 בנובמבר למשך חודשיים, בעוד שהתרגום לאנגלית בהמשך המודעה מציין "מ-6 בנובמבר, 4–6 חודשים".
      * *הגבלת חדרים*: המודעה מציינת כי חדר פנימי של בעל הבית (*Sperrraum*) נשאר נעול ואינו כלול בשכירות, אם כי השטח הנגיש הנותר מתואר כשני חדרים על פני 85 מ"ר.
    * **עדות למרפסת**: מאומת. מפורסמת עם שתי מרפסות (אחת פונה לחצר, אחת פונה למים). דגימת תמונות (3 מתוך 15) אישרה מרפסות בתמונות 0 ו-14.
    * **גישה למים ומיקום**: הכתובת רשומה כ-Maybachufer ב-[Neukölln](wiki:Neukölln). המיקום הגיאוגרפי החזיר תוצאה מעורפלת וחזר לקואורדינטות כלליות של העיר ברלין. למרות שטקסט המודעה טוען במפורש לנוף ישיר ל-[Landwehr Canal](wiki:Landwehr_Canal), לא ניתן היה לאמת גיאומטרית את המרחק מהשכונה ומסלולי ההליכה בשל היעדר קואורדינטות מדויקות.
    
    ---
    
    #### 3. [2-Zimmer Wohnungen mit exklusiven Gemeinschaftsflächen (Momento Berlin)](embed:2-zimmer-wohnungen-pAk)
    [!](embed:2-zimmer-wohnungen-pAk)
    * **שכירות ועלויות**: שכר הדירה הכולל (Warm rent) רשום החל מ-**1,372 אירו לחודש**, עם פירוט של 130 אירו עלויות תפעול ו-105 אירו עלויות חימום. שכירות הבסיס (Cold rent) הושמטה, והתיאור מציין כי מדובר בשכירות מינימום התחלתית למבצע. על השוכר להתקשר עצמאית מול חברת החשמל.
    * **תנאי שכירות**: מפורסם על ידי מפעיל מסחרי עבור רובע מגורים חדש (*Erstbezug* 2026). נדרשת **תקופת שכירות מינימלית של 12 חודשים** (*Mindestmietdauer*). תאריכי ההתחלה פתוחים (סיורים מתקיימים מדי ימי רביעי/חמישי).
    * **עדות למרפסת**: מאומת במפרט התיאור ("einen Balkon") ובמאפיינים המפורסמים. דגימה חזותית של 3 מתוך 27 תמונות אישרה מבנה מרפסת חיצוני בתמונה מספר 26.
    * **גישה למים ומיקום**: ממוקמת ב-Buschkrugallee 64 ב-Neukölln/[Britz](wiki:Britz). המיקום מבוסס על קואורדינטות שסיפק המפרסם ללא אימות רחוב עצמאי. התיאור מציין שהמתחם גובל בתעלה (Neukölln Ship Canal), אך המרחק המדויק לקו המים ונקודות הגישה להליכה לא חושבו גיאומטרית.
    
    ---
    
    #### 4. [2-Zimmer Wohnung in Charlottenburg zur Untermiete](embed:2-zimmer-wohnung-tXe)
    [!](embed:2-zimmer-wohnung-tXe)
    * **שכירות ועלויות**: שכר הדירה הכולל (Warm rent) מפורסם ב-**980 אירו לחודש**. התיאור מזכיר "Nebenkosten: 270 € pro Monat", אך לא ברור אם סכום זה כבר כלול ב-980 אירו או נגבה בנוסף. הפיקדון הוא 1,500 אירו.
    * **אי-בהירות קריטית: דירה שלמה לעומת חדר**: הכותרת מציינת "2-Zimmer Wohnung... zur Untermiete" (דירת 2 חדרים לסאב-לט), אך הטקסט מתחיל ב: *"אנחנו משכירים את החדר היפה, השקט והמרוהט שלנו עם מרפסת..."*. לא ברור אם כל הדירה בת 2 החדרים (50 מ"ר) מושכרת בסאב-לט או רק חדר בודד בתוכה.
    * **עדות למרפסת**: לא מאומת חזותית. למרות שהיא מפורסמת כבעלת מרפסת בכותרת ובטקסט, המפרסם סיפק רק תמונה אחת, ולא נראית בה מרפסת.
    * **גישה למים ומיקום**: ממוקמת ב-14057 [Charlottenburg](wiki:Charlottenburg). המפרסם לא ציין שם רחוב או מספר בית (דיוק ברמת מיקוד בלבד). התיאור מציין קרבת הליכה ל-Lietzenseepark (הכולל את אגם Lietzensee), אך לא ניתן לחשב זמן מסלול מדויק ומרחק לקו המים ללא כתובת רחוב.
    * **תנאי שכירות**: סאב-לט לתקופה קצובה מ-01.11.2026 עד לכל המאוחר 01.11.2027 (ניתן למשא ומתן על תקופות קצרות יותר).
    
    ---
    
    ### נקודות מרכזיות לפני פנייה למפרסמים
    1. **אימות קרבה למים**: רק הדירה ב-Maybachufer משקיפה במפורש על נתיב מים פתוח מהדירה עצמה, אך המיקום הגיאוגרפי שלה משוער והתאריכים סותרים. לדירה ב-Anton-Saefkow-Platz יש קרבה מאומתת לפארק עם אגם (Fennpfuhl), אם כי המרחק המדויק לקו המים לא נמדד.
    2. **סוגי חוזים**: אף אחת מהמודעות ב-WG-Gesucht אינה מציעה חוזה ללא הגבלת זמן (*unbefristet*); כולן סאב-לט לתקופה קצובה. Momento Berlin מציעה שכירות לטווח ארוך יותר המתחילה במינימום של 12 חודשים.
    3. **מגבלות דגימת התמונות**: ההערכה החזותית בחנה מדגם מוגבל של 1 עד 3 תמונות לכל מודעה. מאפיינים נוספים עשויים להופיע בגלריות המלאות הנגישות דרך כרטיסיית המודעה.
    
