    להלן פירוט מדויק של מה שנתוני המודעה מאשרים בפועל לעומת מה שנותר לא מאומת או לא ידוע עבור ה**דירה ב-Maybachufer** וה**לופט ב-Anton-Saefkow-Platz**.
    
    ---
    
    ### 1. שכר הדירה ב-Maybachufer: האם 1,800 אירו הם באמת "הכל כלול"?
    
    * **מה שהמודעה מציינת**: גם שכר הדירה הבסיסי (*Kaltmiete*) וגם שכר הדירה הכולל (*Warmmiete*) הוזנו כסכום קבוע של **1,800 אירו**. הפיקדון נקבע על 1,000 אירו.
    * **מה שנותר לא ידוע**:
      * **פירוט חשבונות**: המודעה **אינה מספקת פירוט עלויות** עבור הוצאות תפעול (*Betriebskosten/Nebenkosten*) או חימום (*Heizkosten*).
      * **חשמל ואינטרנט**: המארח אינו מאשר במפורש בשדות המובנים האם חשמל ביתי (*Haushaltsstrom*) או Wi-Fi כלולים ב-1,800 אירו או האם חלות מגבלות שימוש.
      * **אגרת שידור**: לא מצוין האם אגרת השידור הגרמנית המנדטורית (*Rundfunkbeitrag*) כלולה או שיש להירשם אליה בנפרד.
    * **סיכום**: למרות שהדירה משווקת בסכום חודשי גלובלי האופייני לסאב-לט מרוהט לטווח קצר, **לא ניתן לאמת שהיא אכן "הכל כלול"** עד שהמארח יספק פירוט בכתב המאשר את כיסוי החשמל, חריגות בחימום ואינטרנט.
    
    ---
    
    ### 2. היקף גלריית התמונות: מה שהתקבל לעומת מה שנבדק
    
    כלי החיפוש אחזר מטא-דאטה של המודעות עם ספירת תמונות מלאה, אך הניתוח הוויזואלי האוטומטי בדק רק מדגם ממוקד של תמונות לכל מודעה כדי לזהות מאפיינים עיקריים:
    
    ```json
    {"type": "sheet", "embed_id": "c524ed20-2be0-4348-ae66-d63968a523de"}
    ```
    
    *הערה: ניתן לפתוח את כרטיסי המודעות ישירות כדי לעיין ידנית בכל 14–15 התמונות ברזולוציה גבוהה.*
    
    ---
    
    ### 3. פרטי מרפסת וקרבה למים: מאומת לעומת לא ידוע
    
    #### הדירה ב-Maybachufer
    * **מרפסת**:
      * *מאומת לפי טקסט המודעה*: כוללת **שתי מרפסות** — אחת פונה לחצר הפנימית (*Innenhof*) ואחת פונה לתעלה/לרחוב.
      * *מאומת לפי בדיקת תמונות*: מבני מרפסת נראים לעין אומתו בתמונות מספר 0 ו-14 שנבדקו.
      * *לא ידוע*: מידות מדויקות של המרפסות, כיווני אוויר/שעות חשיפה לשמש, והאם מסופק ריהוט חוץ.
    * **גישה למים**:
      * *מאומת לפי טקסט המודעה*: ממוקמת ישירות על Maybachufer לאורך [תעלת לנדווהר](wiki:Landwehr_Canal) ב[נויקלן](wiki:Neukölln). התיאור מציין במפורש נוף למים.
      * *לא ידוע / לא מאומת על ידי הכלי*: מערכת המיקום (geocoding) סימנה את כתובת הרחוב כמעורפלת והגדירה כברירת מחדל נקודת מרכז כללית בברלין במקום מיקום מדויק. כתוצאה מכך, לא ניתן היה למדוד באופן עצמאי את המרחק המדויק של הדירה למעברי חצייה להולכי רגל מעל התעלה או לגישה למזח.
    
    #### הלופט ב-Anton-Saefkow-Platz
    * **מרפסת**:
      * *מאומת לפי טקסט המודעה*: מפרסם במפורש "מרפסת שטופת שמש עם נוף לפארק פנפול" (Fennpfuhlpark).
      * *מאומת לפי בדיקת תמונות*: מבנה מרפסת אומת בתמונה מספר 0 שנבדקה.
      * *לא ידוע*: שטח המרפסת וקומה מדויקת (המודעה מציינת סגנון לופט בקומות העליונות, אך לא את הקומה המדויקת).
    * **גישה למים**:
      * *מאומת לפי טקסט המודעה ו-OpenStreetMap*: ממוקם ב-Anton-Saefkow-Platz בליכטנברג, בסמוך לפארק פנפול, המכיל את ה-**Fennpfuhl** (אגם היסטורי).
      * *לא ידוע / לא מאומת על ידי הכלי*: המודעה **אינה** שוכנת ישירות על גדת נהר או תעלה; מקור המים הוא אגם בתוך פארק. יתרה מכך, בעוד שהפארק עצמו נמצא מעבר לרחוב, זמן ההליכה המדויק לקו המים והשאלה האם המים נראים ישירות מהמרפסת מעל צמרות העצים נותרו ללא אימות.
    
    ---
    
    ### שאלות שכדאי לשאול את המארחים לפני הביקור
    
    1. **עבור Maybachufer**:
       * *"האם המחיר החודשי הקבוע של 1,800 אירו מכסה חימום, חשמל ואינטרנט במלואם, או שישנו הסדר חשבונות נפרד (*Nebenkostenabrechnung*) בסוף השהות?"*
       * *"האם תוכלו לאשר את תאריכי הסאב-לט המדויקים (הסיכום אומר חודשיים, אך התיאור באנגלית מציין 4–6 חודשים)?"*
    2. **עבור הלופט**:
       * *"האם התשלום הנוסף של 150 אירו הוא סכום קבוע (*Pauschale*) הכולל חימום ואינטרנט, או שמדובר בתשלום מקדמה (*Vorauszahlung*)?"*
       * *"האם מובטחת בחוזה אפשרות להארכה מעבר ל-28 בדצמבר 2026 במידת הצורך?"*
