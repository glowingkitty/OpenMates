    Ich konzentriere mich nun darauf, die genauen Suchparameter für Mietobjekte in Berlin zu definieren. Ich habe Berlin als Stadt festgelegt und den Angebotstyp auf „Miete“ sowie den Immobilientyp auf „Wohnung“ beschränkt. Ein Balkon ist eine feste Voraussetzung, die ich sicher in die Suchkriterien aufnehmen werde.
    
    
    **Suchkriterien verfeinern**
    
    Ich habe die Suchparameter soeben weiter verfeinert. Den Wunsch „idealerweise in der Nähe eines Flusses oder Sees“ habe ich in eine Präferenz für die Nähe zum Wasser übersetzt, kategorisiert als `neighborhood_categories: ['water']`. Das Budget von „bis zu 1.800 EUR pro Monat“ ist nun als `max_warm_rent_eur: 1800` angegeben, da ich davon ausgehe, dass es sich um die Warmmiete handelt. Da mir zudem mitgeteilt wurde, dass „klar gekennzeichnete Möglichkeiten willkommen sind, wenn einige Details fehlen“, werde ich nun explizit unbestätigte Angebote mit `include_unconfirmed: true` einbeziehen.
    
    
    **Suchanforderungen analysieren**
    
    Ich analysiere nun sorgfältig die Richtlinien dieses Wohnungssuch-Tools. Ich konzentriere mich darauf, wie ich meine Präferenzen am besten in die richtigen strukturierten Filter und `relevance_criteria` übersetze. Ich muss sicherstellen, dass meine Anforderungen an die Wassernähe, den Nachweis eines Balkons und die Budgetbeschränkungen alle korrekt kodiert sind. Außerdem stelle ich sicher, dass ich bei meiner Suche zwischen „erforderlich“, „ausgeschlossen“ und „bevorzugt“ unterscheide.
    
    
    **Integrität der Angebotsdaten bewerten**
    
    Ich beschäftige mich nun intensiv mit der Datenintegrität. Ich muss vermeiden, visuelle Belege überzubewerten, und die Einschränkungen der jeweiligen Anbieter angeben. Die Nähe zum Wasser muss solide belegt sein; wenn keine Anreicherung verfügbar ist oder eine Zeitüberschreitung vorliegt, wird dies als „nicht verifiziert“ gemeldet. Es muss klar sein, dass ein sichtbarer Balkon keine Garantie dafür ist, dass er zur Wohnung gehört, und ich kann Mietvertragsdetails nur melden, wenn sie explizit angegeben sind.
    
    
    **Angebotsdaten analysieren**
    
    Ich vertiefe mich nun in die zurückgegebenen Angebote und gleiche sie akribisch mit den vorgegebenen Regeln ab. Mein Fokus liegt darauf, bestätigte Datenpunkte klar von Unsicherheiten abzugrenzen. Ich achte genau auf Details wie Miete, Mietdaten und Zugang zum Wasser und markiere etwaige Unklarheiten. Das Ziel ist punktgenaue Präzision.
    
    
