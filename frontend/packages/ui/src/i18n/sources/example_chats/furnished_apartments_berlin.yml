    **अपार्टमेंट खोज मापदंडों को परिभाषित करना**
    
    मैं अब बर्लिन में किराए के लिए सटीक खोज मापदंडों को परिभाषित करने पर ध्यान केंद्रित कर रहा हूँ। मैंने शहर के रूप में बर्लिन को निर्दिष्ट किया है, और लिस्टिंग के प्रकार को "किराया" (rent) और संपत्ति के प्रकार को "अपार्टमेंट" तक सीमित कर दिया है। बालकनी एक अनिवार्य आवश्यकता है, जिसे मैं खोज मापदंडों में शामिल करना सुनिश्चित करूँगा।
    
    
    **खोज मापदंडों को परिष्कृत करना**
    
    मैंने अभी खोज मापदंडों को और अधिक परिष्कृत किया है। मैंने "आदर्श रूप से नदी या झील के पास" को पानी के करीब होने की प्राथमिकता में अनुवादित किया है, जिसे "neighborhood_categories: ['water']" के रूप में वर्गीकृत किया गया है। "प्रति माह 1,800 EUR तक" के बजट को अब `max_warm_rent_eur: 1800` के रूप में निर्दिष्ट किया गया है, क्योंकि मैं मान रहा हूँ कि यह वार्म रेंट (warm rent) है। इसके अलावा, चूंकि मुझे बताया गया है कि "कुछ विवरण गायब होने पर स्पष्ट रूप से लेबल की गई संभावनाओं का स्वागत है", इसलिए मैं अब `include_unconfirmed: true` के साथ स्पष्ट रूप से अपुष्ट लिस्टिंग को शामिल करूँगा।
    
    
    **खोज आवश्यकताओं का विश्लेषण करना**
    
    मैं अब इस होम-सर्च टूल के दिशानिर्देशों का सावधानीपूर्वक विश्लेषण कर रहा हूँ। मैं इस बात पर ध्यान केंद्रित कर रहा हूँ कि अपनी प्राथमिकताओं को सही संरचित फिल्टर और `relevance_criteria` में कैसे बेहतर ढंग से अनुवादित किया जाए। मुझे यह सुनिश्चित करने की आवश्यकता है कि पानी की निकटता, बालकनी के प्रमाण और बजट की बाधाओं के लिए मेरी आवश्यकताएं ठीक से एन्कोड की गई हैं। मैं यह भी सुनिश्चित कर रहा हूँ कि मैं अपनी खोज में "आवश्यक," "वर्जित" और "पसंदीदा" के बीच अंतर करूँ।
    
    
    **लिस्टिंग डेटा अखंडता का आकलन करना**
    
    मैं अब डेटा अखंडता को लेकर गहराई से चिंतित हूँ। मुझे दृश्य साक्ष्यों के बारे में अति-दावा करने से बचना चाहिए और प्रत्येक प्रदाता की सीमाओं को निर्दिष्ट करना चाहिए। पानी की निकटता साक्ष्यों पर मजबूती से आधारित होनी चाहिए, और संवर्धन (enrichment) अनुपलब्ध होने या टाइम-आउट होने पर इसे "असत्यापित" (unverified) के रूप में रिपोर्ट किया जाना चाहिए। यह स्पष्ट होना चाहिए कि दिखाई देने वाली बालकनी इस बात की गारंटी नहीं देती है कि वह अपार्टमेंट की ही है, और मैं लीज विवरण केवल तभी रिपोर्ट कर सकता हूँ जब स्पष्ट रूप से बताया गया हो।
    
    
    **लिस्टिंग डेटा का विश्लेषण करना**
    
    मैं अब प्राप्त लिस्टिंग की गहराई से जांच कर रहा हूँ, और दिए गए नियमों के साथ उनका सावधानीपूर्वक मिलान कर रहा हूँ। मेरा ध्यान पुष्टि किए गए डेटा बिंदुओं को अनिश्चितताओं से स्पष्ट रूप से अलग करने पर है। मैं किराए, लीज की तारीखों और पानी तक पहुंच जैसे विवरणों पर पूरा ध्यान दे रहा हूँ, और किसी भी अस्पष्टता को चिह्नित कर रहा हूँ। लक्ष्य सटीक शुद्धता है।
    
    
    **निकटता मापदंडों को स्पष्ट करना**
    
    मैं अब सूक्ष्म निकटता आवश्यकताओं को एकीकृत कर रहा हूँ। मैं साक्ष्यों में किसी भी सीमा का सावधानीपूर्वक दस्तावेजीकरण कर रहा हूँ। मैं सत्यापित दावों को असत्यापित जानकारी से पारदर्शी रूप से अलग करने पर ध्यान केंद्रित कर रहा हूँ। मैं अपने दस्तावेजीकरण में सटीकता को प्राथमिकता दे रहा हूँ। मैं इस बारे में स्पष्ट हूँ कि पानी तक सत्यापित पहुंच क्या है और क्या नहीं। मैं अनिश्चित डेटा की स्पष्ट लेबलिंग की आवश्यकता पर जोर दे रहा हूँ।
    
    
    **अस्पष्टता नियमों को परिष्कृत करना**
    
    मैं अब अनिश्चित डेटा बिंदुओं के इर्द-गिर्द नियमों को परिष्कृत करने पर ध्यान केंद्रित कर रहा हूँ। यदि पानी की किसी विशेषता का कोई उल्लेख नहीं है, तो मैं इसे अज्ञात के रूप में रिपोर्ट करूँगा; मैं निकटता का अनुमान नहीं लगाऊँगा। मैं बालकनी की फोटो दृश्यता को टेक्स्ट पुष्टिकरण से अलग रखूँगा। लीज की शर्तें केवल तभी स्पष्ट रूप से रिपोर्ट की जाती हैं जब बताई गई हों। तारीखों और किराए के विवरण में विरोधाभासों को प्राथमिकता दी जाती है। मैं एम्बेड प्रीव्यू कार्ड्स का उपयोग एक दृश्य (view) के रूप में करूँगा।
    ```embeds_results_view
    title: Rental apartments with balconies in Berlin
    embeds:
      - 2-room-loft-DBH
      - m-
    ```
    
    
    **परिणाम प्रारूप की व्याख्या करना**
    
    मैं अब "embeds\_results\_view" प्रतिक्रिया की संरचना पर ध्यान केंद्रित कर रहा हूँ। मैंने "source\_ref" की अनुपस्थिति पर ध्यान दिया, जो "sources" या "embeds" के सही उपयोग को प्रभावित करता है। मैं "embeds" फ़ील्ड का उपयोग करना सुनिश्चित करूँगा जब कोई source\_ref उपलब्ध न हो, विशेष रूप से लौटाए गए चाइल्ड embed\_ref मानों का संदर्भ देते हुए। साथ ही, मैं एक वर्णनात्मक तत्व के रूप में "title" फ़ील्ड पर ध्यान दूँगा।
    
    
    **लिस्टिंग विवरणों की जांच करना**
    
    मैं अब व्यक्तिगत लिस्टिंग की बारीकी से जांच कर रहा हूँ, विशेष रूप से "रिंगबान के पास बालकनी वाला 2-कमरे का लॉफ्ट अपार्टमेंट" पर ध्यान केंद्रित कर रहा हूँ। मैं एम्बेड डेटा के साथ इस लिस्टिंग का मिलान कर रहा हूँ। मैं अज्ञात दूरी और पहुंच के कारण असत्यापित पानी की निकटता को नोट कर रहा हूँ, भले ही झील के दृश्य का उल्लेख किया गया हो। मेरा ध्यान इस बात पर है कि क्या पुष्टि की गई है बनाम क्या असत्यापित है, इसे स्पष्ट रूप से नोट किया जाए। मैं सभी अनिश्चितताओं का सावधानीपूर्वक दस्तावेजीकरण कर रहा हूँ।
    
    
    **लिस्टिंग विवरणों का मूल्यांकन करना**
    
    मैंने अभी एक और लिस्टिंग का मूल्यांकन पूरा किया है। मैंने फोटो विश्लेषण के माध्यम से बालकनी की दृश्यता की पुष्टि की। लीज की अवधि एक निश्चित अवधि और उसके बाद लचीले विस्तार की पेशकश करती है, जिसे मैंने प्रलेखित किया है। मैं विवरणों पर ध्यान केंद्रित कर रहा हूँ। अब, मैं सभी प्रासंगिक लिस्टिंग जानकारी को पूरी तरह से समझने के लिए काम कर रहा हूँ।
    ```
    ```
    
    **विशिष्ट विशेषताओं का विवरण देना**
    
    मैं अब इस विशिष्ट लिस्टिंग का विवरण दे रहा हूँ। सड़क का जियोकोड (geocode) अस्पष्ट है; मैं नोट करता हूँ कि यह पानी की निकटता के सत्यापन को प्रभावित करता है। लैंडवेहरकनाल (Landwehrkanal) दृश्य के टेक्स्ट दावे को ज्यामितीय रूप से सत्यापित नहीं किया जा सकता है। मैं टेक्स्ट और विजुअल जांच के माध्यम से बालकनी की उपस्थिति की पुष्टि करता हूँ। मैं संरचित डेटा और वर्णनात्मक टेक्स्ट के बीच लीज की तारीख के विरोधाभास को स्पष्ट रूप से चिह्नित कर रहा हूँ।
    
    
    **लिस्टिंग डेटा का आकलन करना**
    
    मैं अब नवीनतम लिस्टिंग की जांच कर रहा हूँ। मैंने गायब कोल्ड रेंट (cold rent) और अस्पष्ट रेंट ब्रेकडाउन को चिह्नित किया है। विज्ञापित किराया एक शुरुआती बिंदु है, इसलिए मैंने अज्ञात न्यूनतम राशि को नोट किया है। प्रोजेक्ट के भीतर अपार्टमेंट के आकार की सीमा स्पष्टता की मांग करती है, क्योंकि लिस्टिंग का आकार इसके अंतर्गत आता है। मैंने असत्यापित स्थान सटीकता के कारण अनिश्चित नहर निकटता को चिह्नित किया है।
    
    
    **लीज विवरण की व्याख्या करना**
    
    मैं अब नवीनतम लिस्टिंग की लीज जानकारी और बालकनी सत्यापन पर ध्यान केंद्रित कर रहा हूँ। मैंने टेक्स्ट और नमूना दृश्यों के माध्यम से बालकनी की दृश्यता की पुष्टि की। मैंने 12 महीने की न्यूनतम लीज और डेटा में स्पष्ट समाप्ति तिथियों की अनुपस्थिति को नोट किया है। लिस्टिंग बालकनी वाले एक सुसज्जित कमरे (furnished room) के लिए है, लेकिन शीर्षक में 2-कमरे का अपार्टमेंट कहा गया है, इसलिए मैं संभावित कमरे बनाम अपार्टमेंट की अस्पष्टता की जांच कर रहा हूँ। मैं सभी विवरणों पर पूरा ध्यान दे रहा हूँ।
    
    
    **लिस्टिंग विवरणों का विश्लेषण करना**
    
    मैं अब एक नई लिस्टिंग का सावधानीपूर्वक विश्लेषण कर रहा हूँ, जिसमें बालकनी के साथ एक सुसज्जित कमरे का उल्लेख है। वाक्यांश "vermieten unser schönes, ruhiges und möbliertes Zimmer mit Balkon" महत्वपूर्ण अस्पष्टता जोड़ता है; दी गई लिस्टिंग की एकमात्र फोटो में बालकनी की पुष्टि नहीं है, जिसे मैंने चिह्नित किया है। पता, जिला-स्तरीय जियोकोड पानी की निकटता को अस्पष्ट बनाता है। लीज 1 नवंबर, 2026 से 1 नवंबर, 2027 तक है।
    
    
    **पानी के उल्लेखों की तुलना करना**
    
    मैं अब मायबाखुफर (Maybachufer) और अन्य जैसी पानी की विशेषताओं का उल्लेख करने वाली लिस्टिंग की तुलना कर रहा हूँ ताकि उनके दावों की सटीकता और किसी भी अंतर्निहित डेटा अंतर को समझा जा सके। मैं उनके साक्ष्यों और कवरेज की समीक्षा कर रहा हूँ। मैं उपयोगकर्ता द्वारा मांगे गए सटीक विवरणों पर ध्यान केंद्रित कर रहा हूँ। मैं डेटा में किसी भी अनिश्चितता और सीमा को चिह्नित करूँगा।
    
    
    **रेंट ब्रेकडाउन का सत्यापन करना**
    
    मैं अब किराए के आंकड़ों में विसंगतियों पर ध्यान केंद्रित कर रहा हूँ। मैं विरोधाभासी आंकड़ों के समाधान, गैर-मदवार लागतों की रिपोर्टिंग और अज्ञात हीटिंग समावेशन को स्पष्ट रूप से नोट करने को प्राथमिकता दे रहा हूँ। साथ ही, मैं इनलाइन एम्बेड संदर्भों की जांच कर रहा हूँ ताकि यह सुनिश्चित हो सके कि डिस्प्ले टेक्स्ट कभी भी embed_ref न हो। इसके अलावा, मैं सिंटैक्स के आधार पर एम्बेड रेफ के लिए केवल बड़े या छोटे कार्ड का उपयोग करूँगा। अंत में, मैं इस अपडेट के बिल्कुल अंत में एक सुझाया गया अनुवर्ती संदेश (follow-up message) जोड़ूँगा।
