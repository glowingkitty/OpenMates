    ```json
    {"type": "sheet", "embed_id": "c524ed20-2be0-4348-ae66-d63968a523de"}
    ```
    
    *Uwaga: Możesz otworzyć karty ogłoszeń bezpośrednio, aby ręcznie przejrzeć wszystkie 14–15 zdjęć w wysokiej rozdzielczości.*
    
