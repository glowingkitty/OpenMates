    **การกำหนดพารามิเตอร์การค้นหาอพาร์ทเมนท์**
    
    ขณะนี้ฉันกำลังมุ่งเน้นไปที่การกำหนดพารามิเตอร์การค้นหาที่แม่นยำสำหรับที่พักให้เช่าในเบอร์ลิน ฉันได้ระบุเบอร์ลินเป็นเมือง และจำกัดประเภทรายการเป็น "เช่า" และประเภทอสังหาริมทรัพย์เป็น "อพาร์ทเมนท์" ระเบียงเป็นข้อกำหนดที่จำเป็น ซึ่งฉันจะตรวจสอบให้แน่ใจว่าได้รวมอยู่ในเกณฑ์การค้นหาแล้ว
    
    
    **การปรับปรุงเกณฑ์การค้นหา**
    
    ฉันเพิ่งปรับปรุงพารามิเตอร์การค้นหาเพิ่มเติม ฉันได้แปล "ตามอุดมคติคือใกล้แม่น้ำหรือทะเลสาบ" เป็นความต้องการความใกล้ชิดกับน้ำ โดยจัดหมวดหมู่เป็น "neighborhood_categories: ['water']" งบประมาณ "สูงสุด 1,800 ยูโรต่อเดือน" ถูกระบุเป็น `max_warm_rent_eur: 1800` เนื่องจากฉันสันนิษฐานว่าเป็นค่าเช่ารวม (warm rent) นอกจากนี้ เนื่องจากฉันได้รับแจ้งว่า "ยินดีรับความเป็นไปได้ที่มีการระบุไว้อย่างชัดเจนเมื่อรายละเอียดบางอย่างขาดหายไป" ตอนนี้ฉันจะรวมรายการที่ยังไม่ได้รับการยืนยันอย่างชัดเจนด้วย `include_unconfirmed: true`
    
    
    **การวิเคราะห์ข้อกำหนดการค้นหา**
    
    ขณะนี้ฉันกำลังวิเคราะห์แนวทางของเครื่องมือค้นหาบ้านนี้อย่างรอบคอบ ฉันกำลังมุ่งเน้นไปที่วิธีที่ดีที่สุดในการแปลความต้องการของฉันให้เป็นตัวกรองที่มีโครงสร้างถูกต้องและ `relevance_criteria` ฉันต้องตรวจสอบให้แน่ใจว่าข้อกำหนดของฉันสำหรับความใกล้ชิดกับน้ำ หลักฐานของระเบียง และข้อจำกัดด้านงบประมาณได้รับการเข้ารหัสอย่างถูกต้องทั้งหมด ฉันยังตรวจสอบให้แน่ใจว่าได้แยกแยะระหว่างสิ่งที่ "จำเป็น" "ไม่รวม" และ "ต้องการ" ในการค้นหาของฉัน
    
    
    **การประเมินความสมบูรณ์ของข้อมูลรายการ**
    
    ขณะนี้ฉันมีความกังวลอย่างมากเกี่ยวกับความสมบูรณ์ของข้อมูล ฉันต้องหลีกเลี่ยงการกล่าวอ้างเกินจริงเกี่ยวกับหลักฐานทางภาพ และระบุข้อจำกัดจากผู้ให้บริการแต่ละราย ความใกล้ชิดกับน้ำต้องมีหลักฐานรองรับอย่างแน่นหนา โดยรายงานว่า "ไม่ได้รับการตรวจสอบ" เมื่อไม่มีข้อมูลเพิ่มเติมหรือหมดเวลา ต้องมีความชัดเจนว่าระเบียงที่มองเห็นได้ไม่ได้รับประกันว่าเป็นของอพาร์ทเมนท์นั้น และฉันสามารถรายงานรายละเอียดการเช่าได้เฉพาะเมื่อมีการระบุไว้อย่างชัดเจนเท่านั้น
    
    
    **การวิเคราะห์ข้อมูลรายการ**
    
    ตอนนี้ฉันกำลังเจาะลึกรายการที่ส่งกลับมา โดยตรวจสอบข้ามกับกฎที่ให้ไว้อย่างละเอียดถี่ถ้วน จุดมุ่งหมายของฉันคือการแบ่งแยกจุดข้อมูลที่ได้รับการยืนยันออกจากความไม่แน่นอนอย่างชัดเจน ฉันกำลังให้ความสำคัญกับรายละเอียดเฉพาะ เช่น ค่าเช่า วันที่เช่า และการเข้าถึงแหล่งน้ำ โดยทำเครื่องหมายความคลุมเครือใดๆ เป้าหมายคือความแม่นยำในระดับสูงสุด
    
    
    **การชี้แจงเกณฑ์ความใกล้ชิด**
    
    ขณะนี้ฉันกำลังรวมข้อกำหนดความใกล้ชิดที่มีรายละเอียดปลีกย่อย ฉันกำลังบันทึกข้อจำกัดใดๆ ในหลักฐานอย่างระมัดระวัง ฉันกำลังมุ่งเน้นไปที่การแยกการกล่าวอ้างที่ผ่านการตรวจสอบแล้วออกจากข้อมูลที่ไม่ได้รับการตรวจสอบอย่างโปร่งใส ฉันให้ความสำคัญกับความถูกต้องในเอกสารของฉัน ฉันมีความชัดเจนเกี่ยวกับสิ่งที่ถือว่าเป็นการเข้าถึงแหล่งน้ำที่ได้รับการตรวจสอบแล้วและสิ่งที่ไม่ใช่ ฉันเน้นย้ำถึงความจำเป็นในการระบุข้อมูลที่ไม่แน่นอนอย่างชัดเจน
    
    
    **การปรับปรุงกฎความคลุมเครือ**
    
    ขณะนี้ฉันกำลังมุ่งเน้นไปที่การปรับปรุงกฎเกี่ยวกับจุดข้อมูลที่ไม่แน่นอน หากไม่มีการกล่าวถึงลักษณะของแหล่งน้ำ ฉันจะรายงานว่าไม่ทราบข้อมูล ฉันจะไม่สรุปเอาเองว่าอยู่ใกล้ ฉันจะแยกการมองเห็นระเบียงจากภาพถ่ายออกจากการยืนยันด้วยข้อความ เงื่อนไขการเช่าจะถูกรายงานอย่างชัดเจนเมื่อมีการระบุไว้เท่านั้น ความขัดแย้งในเรื่องวันที่และการแจกแจงค่าเช่าจะได้รับความสำคัญเป็นอันดับแรก ฉันจะใช้การ์ดแสดงตัวอย่างแบบฝังเป็นมุมมอง
    ```embeds_results_view
    title: Rental apartments with balconies in Berlin
    embeds:
      - 2-room-loft-DBH
      - m-
    ```
    
    
    **การตีความรูปแบบผลลัพธ์**
    
    ขณะนี้ฉันกำลังมุ่งเน้นไปที่โครงสร้างของการตอบกลับ "embeds\_results\_view" ฉันสังเกตเห็นว่าไม่มี "source\_ref" ซึ่งมีผลต่อการเลือกใช้ "sources" หรือ "embeds" ให้ถูกต้อง ฉันจะตรวจสอบให้แน่ใจว่าได้ใช้ฟิลด์ "embeds" เมื่อไม่มี source\_ref โดยอ้างอิงถึงค่า child embed\_ref ที่ส่งกลับมาโดยเฉพาะ นอกจากนี้ ฉันจะให้ความสำคัญกับฟิลด์ "title" ในฐานะองค์ประกอบเชิงพรรณนา
    
    
    **การตรวจสอบรายละเอียดรายการ**
    
    ขณะนี้ฉันกำลังตรวจสอบรายการแต่ละรายการอย่างใกล้ชิด โดยเฉพาะอย่างยิ่ง "อพาร์ทเมนท์ลอฟท์ 2 ห้องพร้อมระเบียง ใกล้ Ringbahn" ฉันกำลังตรวจสอบรายการนี้ข้ามกับข้อมูลแบบฝัง ฉันสังเกตเห็นความใกล้ชิดกับน้ำที่ไม่ได้รับการตรวจสอบเนื่องจากไม่ทราบระยะทางและการเข้าถึง แม้ว่าจะมีการกล่าวถึงวิวทะเลสาบก็ตาม จุดมุ่งหมายของฉันคือการระบุสิ่งที่ยืนยันแล้วเทียบกับสิ่งที่ไม่ได้รับการตรวจสอบอย่างชัดเจน ฉันกำลังบันทึกความไม่แน่นอนทั้งหมดอย่างระมัดระวัง
    
    
    **การประเมินรายละเอียดรายการ**
    
    ฉันเพิ่งประเมินรายการอื่นเสร็จสิ้น ฉันยืนยันการมองเห็นระเบียงผ่านการวิเคราะห์ภาพถ่าย เงื่อนไขการเช่าระบุระยะเวลาคงที่ตามด้วยการขยายเวลาที่ยืดหยุ่น ซึ่งฉันได้บันทึกไว้แล้ว ฉันมุ่งเน้นไปที่รายละเอียดเฉพาะ ตอนนี้ฉันกำลังพยายามทำความเข้าใจข้อมูลรายการที่เกี่ยวข้องทั้งหมดอย่างถ่องแท้
    ```
    ```
    
    **การให้รายละเอียดคุณลักษณะเฉพาะ**
    
    ขณะนี้ฉันกำลังให้รายละเอียดเกี่ยวกับรายการเฉพาะนี้ รหัสพิกัดถนนมีความคลุมเครือ ฉันบันทึกว่าสิ่งนี้ส่งผลต่อการตรวจสอบความใกล้ชิดกับน้ำ การกล่าวอ้างในข้อความเกี่ยวกับวิว Landwehrkanal ไม่สามารถตรวจสอบความถูกต้องทางภูมิศาสตร์ได้ ฉันยืนยันการมีอยู่ของระเบียงผ่านการตรวจสอบข้อความและภาพ ฉันกำลังทำเครื่องหมายความขัดแย้งของวันที่เช่าระหว่างข้อมูลที่มีโครงสร้างและข้อความบรรยายอย่างชัดเจน
    
    
    **การประเมินข้อมูลรายการ**
    
    ตอนนี้ฉันกำลังเจาะลึกรายการล่าสุด ฉันได้ทำเครื่องหมายค่าเช่าพื้นฐาน (cold rent) ที่ขาดหายไปและการแจกแจงค่าเช่าที่ไม่แม่นยำ ค่าเช่าที่โฆษณาเป็นจุดเริ่มต้น ดังนั้นฉันจึงบันทึกค่าเช่าขั้นต่ำที่ไม่ทราบข้อมูล ช่วงขนาดของอพาร์ทเมนท์ภายในโครงการต้องการความชัดเจน เนื่องจากขนาดของรายการอยู่ในช่วงนี้ ฉันได้ทำเครื่องหมายความใกล้ชิดกับคลองที่ไม่แน่นอนเนื่องจากความแม่นยำของตำแหน่งที่ไม่ได้รับการตรวจสอบ
    
    
    **การตีความรายละเอียดการเช่า**
    
    ขณะนี้ฉันกำลังมุ่งเน้นไปที่ข้อมูลการเช่าและการตรวจสอบระเบียงของรายการล่าสุด ฉันยืนยันการมองเห็นระเบียงผ่านข้อความและภาพตัวอย่าง ฉันบันทึกระยะเวลาเช่าขั้นต่ำ 12 เดือน และการไม่มีวันที่สิ้นสุดที่ชัดเจนในข้อมูล รายการนี้เป็นห้องพร้อมเฟอร์นิเจอร์ที่มีระเบียง แต่ชื่อเรื่องระบุว่าเป็นอพาร์ทเมนท์ 2 ห้อง ดังนั้นฉันจึงกำลังตรวจสอบความคลุมเครือที่อาจเกิดขึ้นระหว่างห้องกับอพาร์ทเมนท์ ฉันกำลังให้ความสำคัญกับรายละเอียดทั้งหมดอย่างใกล้ชิด
    
    
    **การวิเคราะห์รายละเอียดรายการ**
    
    ขณะนี้ฉันกำลังวิเคราะห์รายการใหม่อย่างระมัดระวัง ซึ่งระบุว่าเป็นห้องพร้อมเฟอร์นิเจอร์ที่มีระเบียง วลี "vermieten unser schönes, ruhiges und möbliertes Zimmer mit Balkon" เพิ่มความคลุมเครือที่สำคัญ ภาพถ่ายเพียงภาพเดียวของรายการที่ให้มาไม่มีการยืนยันระเบียง ซึ่งฉันได้ทำเครื่องหมายไว้แล้ว ที่อยู่และรหัสพิกัดระดับเขตทำให้ความใกล้ชิดกับน้ำมีความคลุมเครือ การเช่าครอบคลุมตั้งแต่วันที่ 1 พฤศจิกายน 2026 ถึง 1 พฤศจิกายน 2027
    
    
    **การเปรียบเทียบการกล่าวถึงแหล่งน้ำ**
    
    ขณะนี้ฉันกำลังเปรียบเทียบรายการที่กล่าวถึงลักษณะของแหล่งน้ำ เช่น Maybachufer และอื่นๆ เพื่อแยกแยะความแม่นยำของการกล่าวอ้างและความแตกต่างของข้อมูลที่มีอยู่ ฉันกำลังตรวจสอบหลักฐานและความครอบคลุมของข้อมูลเหล่านั้น ฉันมุ่งเน้นไปที่รายละเอียดที่แม่นยำตามที่ผู้ใช้ร้องขอ ฉันจะทำเครื่องหมายความไม่แน่นอนและข้อจำกัดใดๆ ในข้อมูล
    
    
    **การตรวจสอบการแจกแจงค่าเช่า**
    
    ขณะนี้ฉันกำลังมุ่งเน้นไปที่ความคลาดเคลื่อนในตัวเลขค่าเช่า ฉันให้ความสำคัญกับการปรับยอดตัวเลขที่ขัดแย้งกัน การรายงานต้นทุนที่ไม่ได้แยกรายการ และการระบุอย่างชัดเจนถึงการรวมค่าทำความร้อนที่ไม่ทราบข้อมูล นอกจากนี้ ฉันกำลังตรวจสอบการอ้างอิงแบบฝังในบรรทัดเพื่อให้แน่ใจว่าข้อความที่แสดงจะไม่ใช่ embed_ref นอกจากนี้ ฉันจะใช้เฉพาะการ์ดขนาดใหญ่หรือขนาดเล็กสำหรับการอ้างอิงแบบฝังตามไวยากรณ์ สุดท้าย ฉันจะแนบข้อความติดตามผลที่แนะนำไว้ที่ส่วนท้ายสุดของการอัปเดตนี้
  cs: |
    **Definování parametrů vyhledávání bytů**
    
    Nyní se zaměřuji na definování přesných parametrů vyhledávání pronájmů v Berlíně. Jako město jsem určil Berlín a omezil typ nabídky na „pronájem“ a typ nemovitosti na „byt“. Balkon je pevnou podmínkou, kterou zajistím v kritériích vyhledávání.
    
    
    **Upřesnění kritérií vyhledávání**
    
    Právě jsem dále upřesnil parametry vyhledávání. Požadavek „ideálně blízko řeky nebo jezera“ jsem přeložil jako preferenci blízkosti vody, kategorizovanou jako `neighborhood_categories: ['water']`. Rozpočet „do 1 800 EUR měsíčně“ je nyní specifikován jako `max_warm_rent_eur: 1800`, protože předpokládám, že jde o nájemné včetně poplatků (warm rent). Navíc, jelikož mi bylo řečeno, že „jasně označené možnosti jsou vítány, i když některé detaily chybí“, zahrnu nyní explicitně i nepotvrzené nabídky pomocí `include_unconfirmed: true`.
    
    
    **Analýza požadavků na vyhledávání**
    
    Nyní pečlivě analyzuji pokyny tohoto nástroje pro hledání domova. Zaměřuji se na to, jak nejlépe převést své preference do správných strukturovaných filtrů a `relevance_criteria`. Musím zajistit, aby mé požadavky na blízkost vody, doložení balkonu a rozpočtová omezení byly správně zakódovány. Také dbám na rozlišení mezi tím, co je ve vyhledávání „vyžadováno“, „vyloučeno“ a „preferováno“.
    
    
    **Posouzení integrity dat nabídek**
    
