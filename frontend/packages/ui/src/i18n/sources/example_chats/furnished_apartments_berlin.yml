    Ich konzentriere mich nun darauf, die Regeln für unsichere Datenpunkte zu verfeinern. Wenn ein Wassermerkmal nicht erwähnt wird, melde ich es als unbekannt; ich werde keine Nähe ableiten. Ich werde die Sichtbarkeit eines Balkons auf Fotos von einer Bestätigung im Text trennen. Mietbedingungen werden nur dann explizit gemeldet, wenn sie angegeben sind. Konflikte bei Daten und Mietaufschlüsselungen haben Priorität. Ich werde die eingebetteten Vorschaukarten als Ansicht verwenden.
