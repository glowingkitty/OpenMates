    ---
    
    ### 1. Huur Maybachufer: Is € 1.800 echt all-inclusive?
    
    * **Wat de advertentie vermeldt**: Zowel de kale huur (*Kaltmiete*) als de totale huur (*Warmmiete*) zijn ingevoerd als een vast bedrag van **€ 1.800**. De borg is vastgesteld op € 1.000.
    * **Wat ONBEKEND blijft**:
      * **Specificatie van de kosten**: De advertentie bevat **geen gespecificeerd kostenoverzicht** voor de bijkomende kosten (*Betriebskosten/Nebenkosten*) of verwarming (*Heizkosten*).
      * **Elektriciteit & internet**: De verhuurder bevestigt in de gestructureerde velden niet expliciet of huishoudelijke elektriciteit (*Haushaltsstrom*) of wifi zijn inbegrepen in de € 1.800, of dat er verbruikslimieten gelden.
      * **Omroepbijdrage**: Of de verplichte Duitse omroepbijdrage (*Rundfunkbeitrag*) is inbegrepen of apart moet worden geregistreerd, wordt niet vermeld.
    * **Conclusie**: Hoewel het wordt gepresenteerd als een maandelijks totaalbedrag dat typisch is voor gemeubileerde kortetermijnonderverhuur, **kan niet worden geverifieerd of het strikt all-inclusive is** totdat de verhuurder een schriftelijke specificatie verstrekt die elektriciteit, verwarmingsoverschrijdingen en internetdekking bevestigt.
    
