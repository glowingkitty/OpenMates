    ```json
    {"type": "sheet", "embed_id": "c524ed20-2be0-4348-ae66-d63968a523de"}
    ```
    
    *Let op: Je kunt de advertentiekaarten direct openen om alle 14–15 foto's in hoge resolutie handmatig te bekijken.*
    
