    Zde je přesný rozpis toho, co údaje v inzerátu skutečně potvrzují, a co naopak zůstává neověřené nebo neznámé pro **byt na Maybachufer** a **loft na Anton-Saefkow-Platz**.
    
    ---
    
    ### 1. Nájemné na Maybachufer: Je 1 800 € skutečně all-inclusive?
    
    * **Co inzerát uvádí**: Čisté nájemné (*Kaltmiete*) i celkové nájemné (*Warmmiete*) jsou zadány jako paušální částka **1 800 €**. Kauce je stanovena na 1 000 €.
    * **Co zůstává NEZNÁMÉ**:
      * **Rozpis poplatků**: Inzerát neobsahuje **žádný položkový rozpis nákladů** na provoz (*Betriebskosten/Nebenkosten*) ani na vytápění (*Heizkosten*).
      * **Elektřina a internet**: Host ve strukturovaných polích výslovně nepotvrzuje, zda je v částce 1 800 € zahrnuta elektřina pro domácnost (*Haushaltsstrom*) nebo Wi-Fi, ani zda platí limity spotřeby.
      * **Rozhlasový a televizní poplatek**: Není uvedeno, zda je zahrnut povinný německý poplatek (*Rundfunkbeitrag*), nebo zda je nutné se k němu registrovat samostatně.
    * **Závěr**: Přestože je byt nabízen za paušální měsíční částku typickou pro zařízené krátkodobé podnájmy, **nelze jej považovat za striktně all-inclusive**, dokud host neposkytne písemný rozpis potvrzující úhradu elektřiny, doplatků za topení a internetu.
    
    ---
    
    ### 2. Rozsah fotogalerie: Vrácené vs. zkontrolované
    
    Vyhledávací nástroj získal metadata inzerátů s celkovým počtem fotek, ale automatizovaná vizuální analýza vyhodnotila pouze cílený vzorek fotografií u každého inzerátu, aby identifikovala klíčové prvky:
    
    ```json
