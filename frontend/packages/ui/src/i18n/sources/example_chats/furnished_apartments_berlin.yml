summary:
  context: "Summary of example chat: Berlin apartments with balconies"
  en: "Compare real Berlin apartment listings, full photo galleries, balcony evidence and map locations, with unconfirmed costs and water access clearly labelled."
  de: Vergleiche echte Berliner Wohnungsanzeigen, vollständige Fotogalerien, Balkon-Nachweise und Kartenstandorte, mit klar gekennzeichneten unbestätigten Kosten und Wasserzugang.
  zh: 比较真实的柏林公寓房源、完整相册、阳台证明和地图位置，并清晰标注未确认的费用和临水情况。
  es: Compara anuncios reales de apartamentos en Berlín, galerías de fotos completas, pruebas de balcón y ubicaciones en el mapa, con costes no confirmados y acceso al agua claramente etiquetados.
  fr: "Compare de vraies annonces d'appartements à Berlin, avec galeries photos complètes, preuves de balcon et emplacements sur la carte, en précisant clairement les coûts non confirmés et l'accès à l'eau."
  pt: Compare anúncios reais de apartamentos em Berlim, galerias de fotos completas, evidência de varanda e localizações no mapa, com custos não confirmados e acesso à água claramente identificados.
  ru: "Сравнивай реальные объявления о квартирах в Берлине: полные фотогалереи, подтверждение наличия балкона и расположение на карте, с четко обозначенной неподтвержденной стоимостью и доступом к воде."
  ja: ベルリンの実際の賃貸物件を比較。フォトギャラリー、バルコニーの証拠、地図上の位置に加え、未確定の費用や水辺へのアクセスも明確に表示します。
  ko: 실제 베를린 아파트 매물, 전체 사진 갤러리, 발코니 확인 및 지도 위치를 비교해 보세요. 미확정 비용과 수변 접근성 여부도 명확하게 표시됩니다.
  it: "Confronta annunci reali di appartamenti a Berlino, gallerie fotografiche complete, prove della presenza del balcone e posizioni sulla mappa, con costi non confermati e accesso all'acqua chiaramente indicati."
  tr: Gerçek Berlin daire ilanlarını, tam fotoğraf galerilerini, balkon kanıtlarını ve harita konumlarını; net bir şekilde etiketlenmiş doğrulanmamış maliyetler ve su erişimi ile karşılaştırın.
  vi: So sánh các tin đăng căn hộ thực tế tại Berlin, thư viện ảnh đầy đủ, bằng chứng về ban công và vị trí trên bản đồ, cùng với các chi phí chưa xác nhận và khả năng tiếp cận mặt nước được dán nhãn rõ ràng.
  id: Bandingkan daftar apartemen Berlin asli, galeri foto lengkap, bukti balkon, dan lokasi peta, dengan biaya yang belum dikonfirmasi serta akses air yang diberi label dengan jelas.
  pl: Porównaj realne ogłoszenia mieszkań w Berlinie, pełne galerie zdjęć, potwierdzenia posiadania balkonu i lokalizacje na mapie, z wyraźnie oznaczonymi niepotwierdzonymi kosztami i dostępem do wody.
  nl: Vergelijk echte woningadvertenties in Berlijn, volledige fotogalerijen, bewijs van balkons en kaartlocaties, met onbevestigde kosten en toegang tot water duidelijk aangegeven.
  ar: قارن بين قوائم شقق حقيقية في برلين، مع معارض صور كاملة، وأدلة على وجود شرفات ومواقع على الخريطة، مع تمييز التكاليف غير المؤكدة والوصول إلى المياه بوضوح.
  hi: बर्लिन के असली अपार्टमेंट लिस्टिंग, पूरी फोटो गैलरी, बालकनी के प्रमाण और मैप लोकेशन की तुलना करें, जिसमें अनिश्चित लागत और पानी की सुविधा को स्पष्ट रूप से लेबल किया गया हो।
  th: เปรียบเทียบรายการประกาศเช่าอพาร์ตเมนต์จริงในเบอร์ลิน พร้อมแกลเลอรีรูปภาพฉบับเต็ม หลักฐานการมีระเบียง และตำแหน่งบนแผนที่ โดยมีการระบุค่าใช้จ่ายที่ยังไม่ยืนยันและการเข้าถึงแหล่งน้ำอย่างชัดเจน
  cs: Porovnej si reálné nabídky bytů v Berlíně, kompletní fotogalerie, důkazy o balkonech a polohy na mapě, s jasně označenými nepotvrzenými náklady a přístupem k vodě.
  sv: Jämför riktiga lägenhetsannonser i Berlin, kompletta fotogallerier, bevis på balkong och kartpositioner, med obekräftade kostnader och vattentillgång tydligt markerade.
  he: השוואת מודעות אמיתיות לדירות בברלין, גלריות תמונות מלאות, הוכחות לקיום מרפסת ומיקומים על המפה, עם סימון ברור של עלויות לא מאושרות וגישה למים.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Berlin apartments with balconies. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I am looking for an apartment to rent in Berlin with a balcony, ideally near a river or lake, for up to 1,800 EUR per month and at least two rooms. Can you compare a few listings with their photo galleries and map locations? Please distinguish what the listings actually confirm from what is unknown, including rent, lease dates and water access. If a provider only gives an approximate location or incomplete photos, say so. Clearly labelled possibilities are welcome when some details are missing."
  de: "Ich suche eine Mietwohnung in Berlin mit Balkon, idealerweise in der Nähe eines Flusses oder Sees, für bis zu 1.800 EUR pro Monat und mit mindestens zwei Zimmern. Kannst du ein paar Angebote mit ihren Fotogalerien und Kartenstandorten vergleichen? Bitte unterscheide, was in den Anzeigen tatsächlich bestätigt wird und was unbekannt ist, einschließlich Miete, Mietdaten und Wasserzugang. Wenn ein Anbieter nur einen ungefähren Standort oder unvollständige Fotos angibt, sag das bitte. Klar gekennzeichnete Möglichkeiten sind willkommen, wenn einige Details fehlen."
  zh: 我正在柏林寻找一套带阳台的待租公寓，最好靠近河流或湖泊，月租最高 1,800 欧元，且至少有两个房间。你能对比几个房源及其相册和地图位置吗？请区分房源中已确认的信息和未知信息，包括租金、租期和临水情况。如果房东只提供了大致位置或不完整的照片，请说明。在某些细节缺失的情况下，欢迎提供标注清晰的可能性。
  es: "Busco un apartamento de alquiler en Berlín con balcón, idealmente cerca de un río o lago, por hasta 1.800 EUR al mes y al menos dos habitaciones. ¿Puedes comparar algunos anuncios con sus galerías de fotos y ubicaciones en el mapa? Por favor, distingue lo que los anuncios confirman realmente de lo que se desconoce, incluyendo el alquiler, las fechas de arrendamiento y el acceso al agua. Si un proveedor solo ofrece una ubicación aproximada o fotos incompletas, dilo. Las posibilidades claramente etiquetadas son bienvenidas cuando faltan algunos detalles."
  fr: "Je cherche un appartement à louer à Berlin avec un balcon, idéalement près d'une rivière ou d'un lac, pour un maximum de 1 800 EUR par mois et au moins deux pièces. Peux-tu comparer quelques annonces avec leurs galeries photos et leurs emplacements sur la carte ? Merci de distinguer ce que les annonces confirment réellement de ce qui est inconnu, y compris le loyer, les dates de bail et l'accès à l'eau. Si un annonceur ne donne qu'un emplacement approximatif ou des photos incomplètes, précise-le. Les possibilités clairement identifiées sont les bienvenues lorsque certains détails manquent."
  pt: "Estou procurando um apartamento para alugar em Berlim com varanda, de preferência perto de um rio ou lago, por até 1.800 EUR por mês e pelo menos dois quartos. Você pode comparar alguns anúncios com suas galerias de fotos e localizações no mapa? Por favor, diferencie o que os anúncios realmente confirmam do que é desconhecido, incluindo aluguel, datas de contrato e acesso à água. Se um anunciante fornecer apenas uma localização aproximada ou fotos incompletas, informe. Possibilidades claramente identificadas são bem-vindas quando faltam alguns detalhes."
  ru: "Я ищу квартиру в аренду в Берлине с балконом, в идеале рядом с рекой или озером, до 1800 евро в месяц и минимум с двумя комнатами. Можешь сравнить несколько объявлений с их фотогалереями и расположением на карте? Пожалуйста, разграничь то, что в объявлениях подтверждено, и то, что неизвестно, включая арендную плату, сроки аренды и доступ к воде. Если арендодатель указывает только примерное местоположение или неполные фотографии, так и скажи. Четко обозначенные варианты приветствуются, даже если некоторые детали отсутствуют."
  ja: ベルリンでバルコニー付きの賃貸アパートを探しています。できれば川や湖の近くで、月額1,800ユーロ以下、2部屋以上の物件が理想です。いくつかの物件を、フォトギャラリーや地図上の位置を含めて比較できますか？賃料、契約期間、水辺へのアクセスなど、物件情報で確定していることと不明なことを区別してください。業者がおおよその位置しか提供していない場合や、写真が不完全な場合は、その旨を明記してください。詳細が欠けている場合でも、可能性として明確にラベル付けされていれば歓迎します。
  ko: "베를린에서 발코니가 있는 임대 아파트를 찾고 있어. 가급적 강이나 호수 근처였으면 좋겠고, 월세는 최대 1,800유로, 방은 최소 두 개여야 해. 사진 갤러리와 지도 위치가 포함된 매물 몇 군데를 비교해 줄 수 있어? 임대료, 임대 기간, 수변 접근성 등 매물에서 실제로 확인된 내용과 불확실한 내용을 구분해 줘. 제공업체가 대략적인 위치만 제공하거나 사진이 불충분한 경우에도 알려 줘. 일부 세부 정보가 누락되었더라도 가능성이 있는 매물이라면 명확하게 표시해서 추천해 줘."
  it: "Sto cercando un appartamento in affitto a Berlino con balcone, idealmente vicino a un fiume o a un lago, per un massimo di 1.800 EUR al mese e con almeno due stanze. Puoi confrontare alcuni annunci con le relative gallerie fotografiche e posizioni sulla mappa? Per favore, distingui ciò che gli annunci confermano effettivamente da ciò che è sconosciuto, inclusi affitto, date del contratto e accesso all'acqua. Se un fornitore fornisce solo una posizione approssimativa o foto incomplete, segnalalo. Le possibilità chiaramente etichettate sono benvenute quando mancano alcuni dettagli."
  tr: "Berlin'de balkonlu, ideal olarak bir nehir veya göl yakınında, aylık 1.800 EUR'ya kadar ve en az iki odalı kiralık bir daire arıyorum. Birkaç ilanı fotoğraf galerileri ve harita konumlarıyla karşılaştırabilir misin? Lütfen kira, kiralama tarihleri ve su erişimi dahil olmak üzere ilanların gerçekte neyi onayladığını bilinmeyenlerden ayırt et. Bir sağlayıcı yalnızca yaklaşık bir konum veya eksik fotoğraflar veriyorsa bunu belirt. Bazı ayrıntılar eksik olduğunda net bir şekilde etiketlenmiş olasılıklar kabulümdür."
  vi: "Tôi đang tìm một căn hộ cho thuê ở Berlin có ban công, lý tưởng nhất là gần sông hoặc hồ, giá tối đa 1.800 EUR mỗi tháng và có ít nhất hai phòng. Bạn có thể so sánh một vài tin đăng cùng với thư viện ảnh và vị trí trên bản đồ của chúng không? Vui lòng phân biệt những gì tin đăng thực sự xác nhận với những gì chưa biết, bao gồm tiền thuê nhà, ngày thuê và khả năng tiếp cận mặt nước. Nếu nhà cung cấp chỉ đưa ra vị trí xấp xỉ hoặc ảnh không đầy đủ, hãy nêu rõ. Các khả năng được dán nhãn rõ ràng luôn được hoan nghênh khi thiếu một số chi tiết."
  id: "Saya sedang mencari apartemen untuk disewa di Berlin dengan balkon, idealnya di dekat sungai atau danau, dengan harga hingga 1.800 EUR per bulan dan setidaknya dua kamar. Bisakah kamu membandingkan beberapa listing dengan galeri foto dan lokasi petanya? Tolong bedakan apa yang benar-benar dikonfirmasi oleh listing tersebut dari apa yang tidak diketahui, termasuk harga sewa, tanggal sewa, dan akses air. Jika penyedia hanya memberikan lokasi perkiraan atau foto yang tidak lengkap, sampaikan hal itu. Kemungkinan yang diberi label dengan jelas sangat diharapkan jika beberapa detail tidak ada."
  pl: "Szukam mieszkania do wynajęcia w Berlinie z balkonem, najlepiej nad rzeką lub jeziorem, do 1800 EUR miesięcznie i co najmniej dwoma pokojami. Czy możesz porównać kilka ogłoszeń wraz z ich galeriami zdjęć i lokalizacjami na mapie? Proszę, odróżnij to, co ogłoszenia faktycznie potwierdzają, od tego, co jest nieznane, w tym czynsz, daty najmu i dostęp do wody. Jeśli oferent podaje tylko przybliżoną lokalizację lub niepełne zdjęcia, zaznacz to. Wyraźnie oznaczone ewentualności są mile widziane, gdy brakuje niektórych szczegółów."
  nl: "Ik ben op zoek naar een huurappartement in Berlijn met een balkon, bij voorkeur in de buurt van een rivier of meer, voor maximaal 1.800 EUR per maand en met minstens twee kamers. Kun je een paar advertenties vergelijken met hun fotogalerijen en locaties op de kaart? Maak alsjeblieft onderscheid tussen wat de advertenties daadwerkelijk bevestigen en wat onbekend is, inclusief huurprijs, huurdata en toegang tot water. Als een aanbieder alleen een geschatte locatie of onvolledige foto's geeft, vermeld dat dan. Duidelijk gemarkeerde mogelijkheden zijn welkom wanneer sommige details ontbreken."
  ar: أبحث عن شقة للإيجار في برلين مع شرفة، ويفضل أن تكون بالقرب من نهر أو بحيرة، بسعر يصل إلى 1800 يورو شهرياً وغرفتين على الأقل. هل يمكنك مقارنة بعض القوائم مع معارض صورها ومواقعها على الخريطة؟ يرجى التمييز بين ما تؤكده القوائم فعلياً وما هو غير معروف، بما في ذلك الإيجار وتواريخ عقد الإيجار والوصول إلى المياه. إذا كان المزود يقدم فقط موقعاً تقريبياً أو صوراً غير مكتملة، فيرجى ذكر ذلك. نرحب بالاحتمالات الموضحة بوضوح عندما تكون بعض التفاصيل مفقودة.
  hi: "मैं बर्लिन में किराए पर बालकनी वाला एक अपार्टमेंट ढूंढ रहा हूँ, जो आदर्श रूप से किसी नदी या झील के पास हो, जिसका किराया 1,800 EUR प्रति माह तक हो और जिसमें कम से कम दो कमरे हों। क्या तुम उनकी फोटो गैलरी और मैप लोकेशन के साथ कुछ लिस्टिंग की तुलना कर सकते हो? कृपया स्पष्ट करें कि लिस्टिंग में वास्तव में क्या पक्का है और क्या अज्ञात है, जिसमें किराया, लीज की तारीखें और पानी की सुविधा शामिल है। अगर कोई प्रदाता केवल अनुमानित लोकेशन या अधूरी फोटो देता है, तो वैसा बताएं। जब कुछ विवरण गायब हों, तो स्पष्ट रूप से लेबल की गई संभावनाओं का स्वागत है।"
  th: "ฉันกำลังมองหาอพาร์ตเมนต์ให้เช่าในเบอร์ลินที่มีระเบียง ถ้าเป็นไปได้อยากให้อยู่ใกล้แม่น้ำหรือทะเลสาบ งบประมาณไม่เกิน 1,800 ยูโรต่อเดือน และมีอย่างน้อยสองห้อง คุณช่วยเปรียบเทียบรายการประกาศบางส่วนพร้อมแกลเลอรีรูปภาพและตำแหน่งบนแผนที่ให้หน่อยได้ไหม? โปรดแยกแยะข้อมูลที่ยืนยันแล้วออกจากข้อมูลที่ยังไม่แน่ชัด รวมถึงค่าเช่า วันที่เช่า และการเข้าถึงแหล่งน้ำ หากผู้ให้บริการระบุเพียงตำแหน่งโดยประมาณหรือมีรูปภาพไม่ครบถ้วน ให้แจ้งด้วย ยินดีรับข้อมูลที่เป็นไปได้หากมีการระบุไว้อย่างชัดเจนในกรณีที่รายละเอียดบางอย่างขาดหายไป"
  cs: "Hledám byt k pronájmu v Berlíně s balkonem, ideálně u řeky nebo jezera, do 1 800 EUR měsíčně a s alespoň dvěma pokoji. Můžeš porovnat několik nabídek včetně jejich fotogalerií a polohy na mapě? Rozliš prosím, co nabídky skutečně potvrzují a co je neznámé, včetně nájemného, termínů nájmu a přístupu k vodě. Pokud poskytovatel uvádí pouze přibližnou polohu nebo neúplné fotografie, uveď to. Jasně označené možnosti jsou vítány, i když některé detaily chybí."
  sv: "Jag letar efter en lägenhet att hyra i Berlin med balkong, helst nära en flod eller sjö, för upp till 1 800 EUR per månad och minst två rum. Kan du jämföra några annonser med deras fotogallerier och kartpositioner? Skilj gärna på vad annonserna faktiskt bekräftar och vad som är okänt, inklusive hyra, hyresdatum och tillgång till vatten. Om en uthyrare bara anger en ungefärlig plats eller ofullständiga bilder, säg det. Tydligt markerade möjligheter är välkomna när vissa detaljer saknas."
  he: "אני מחפש דירה להשכרה בברלין עם מרפסת, רצוי ליד נהר או אגם, עד 1,800 אירו לחודש ולפחות שני חדרים. האם תוכל להשוות בין כמה מודעות עם גלריות התמונות והמיקומים שלהן על המפה? אנא הבחן בין מה שהמודעות מאשרות בפועל לבין מה שלא ידוע, כולל שכר דירה, תאריכי שכירות וגישה למים. אם ספק נותן רק מיקום משוער או תמונות חלקיות, ציין זאת. אפשרויות המסומנות בבירור יתקבלו בברכה כאשר חלק מהפרטים חסרים."
  verified_by_human: []

message_2:
  context: "assistant message 2 in example chat: Berlin apartments with balconies. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
