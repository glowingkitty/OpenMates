      * *Onbekend / Niet geverifieerd door tool*: Het geocoderingssysteem markeerde de zoekopdracht voor het adres als dubbelzinnig en koos standaard voor een centraal punt in Berlijn in plaats van een exacte locatie. Hierdoor kon de exacte afstand van de woning tot voetgangersoversteekplaatsen over het kanaal of aanlegplaatsen niet onafhankelijk van de advertentiegegevens worden gemeten.
    
