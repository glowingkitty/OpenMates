summary:
  context: "Summary of example chat: A warm chime for a community garden"
  en: "Generate a short two-note notification sound for a fictional community garden app."
  de: Erstelle einen kurzen Zwei-Ton-Benachrichtigungssound für eine fiktive Gemeinschaftsgarten-App.
  zh: 为一个虚构的社区花园应用生成一段简短的双音节通知音。
  es: Genera un sonido de notificación corto de dos notas para una aplicación ficticia de un jardín comunitario.
  fr: Génère un court son de notification à deux notes pour une application fictive de jardin communautaire.
  pt: Gere um som de notificação curto de duas notas para um aplicativo fictício de horta comunitária.
  ru: Создай короткий двухнотный звук уведомления для вымышленного приложения общественного сада.
  ja: 架空のコミュニティガーデンアプリ向けの、短い2音の通知音を生成します。
  ko: 가상의 커뮤니티 정원 앱을 위한 짧은 두 음절 알림음을 생성해.
  it: "Genera un breve suono di notifica a due note per un'app fittizia di un orto comunitario."
  tr: Kurgusal bir topluluk bahçesi uygulaması için kısa, iki notalı bir bildirim sesi oluştur.
  vi: Tạo âm thanh thông báo hai nốt ngắn cho một ứng dụng vườn cộng đồng giả tưởng.
  id: Buat suara notifikasi dua nada singkat untuk aplikasi kebun komunitas fiktif.
  pl: Wygeneruj krótki, dwutonowy dźwięk powiadomienia dla fikcyjnej aplikacji ogrodu społecznościowego.
  nl: Genereer een kort tweekleurig meldingsgeluid voor een fictieve app voor een gemeenschapstuin.
  ar: أنشئ صوت إشعار قصير من نغمتين لتطبيق حديقة مجتمعية خيالي.
  hi: एक काल्पनिक कम्युनिटी गार्डन ऐप के लिए दो-नोट वाला एक छोटा नोटिफिकेशन साउंड जनरेट करें।
  th: สร้างเสียงแจ้งเตือนสั้นๆ สองตัวโน้ตสำหรับแอปสวนชุมชนสมมติ
  cs: Vygeneruj krátký dvoutónový zvuk oznámení pro fiktivní aplikaci pro komunitní zahradu.
  sv: Generera ett kort aviseringsljud med två toner för en fiktiv app för en gemenskapsträdgård.
  he: צור צליל התראה קצר בן שני תווים עבור אפליקציית גינה קהילתית בדיונית.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: A warm chime for a community garden. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Create a short, warm notification sound for a community garden app when a volunteer signs up. A gentle two-note chime, no speech, and under three seconds."
  de: Erstelle einen kurzen, warmen Benachrichtigungston für eine Gemeinschaftsgarten-App, wenn sich ein Freiwilliger anmeldet. Ein sanfter Zwei-Ton-Chime, ohne Sprache und unter drei Sekunden.
  zh: 为社区花园应用创建一个简短、温暖的通知音，用于志愿者报名时。要求是温和的双音节提示音，无语音，时长在三秒以内。
  es: Crea un sonido de notificación corto y cálido para una aplicación de un jardín comunitario cuando un voluntario se registra. Un timbre suave de dos notas, sin voz y de menos de tres segundos.
  fr: "Crée un son de notification court et chaleureux pour une application de jardin communautaire lorsqu'un bénévole s'inscrit. Un carillon doux à deux notes, sans paroles, et de moins de trois secondes."
  pt: Crie um som de notificação curto e acolhedor para um aplicativo de horta comunitária para quando um voluntário se inscrever. Um toque suave de duas notas, sem fala e com menos de três segundos.
  ru: Создай короткий, теплый звук уведомления для приложения общественного сада, который звучит при регистрации волонтера. Мягкий двухнотный сигнал, без речи, длительностью менее трех секунд.
  ja: コミュニティガーデンアプリでボランティアが登録した時のための、短くて温かみのある通知音を作成して。優しい2音のチャイムで、音声なし、3秒以内で。
  ko: 자원봉사자가 등록할 때 커뮤니티 정원 앱에서 사용할 짧고 따뜻한 알림음을 만들어줘. 부드러운 두 음절 차임벨이어야 하고, 음성은 없어야 하며, 3초 미만이어야 해.
  it: "Crea un suono di notifica breve e caldo per un'app di un orto comunitario quando un volontario si iscrive. Un rintocco delicato a due note, senza parlato e sotto i tre secondi."
  tr: Bir gönüllü kaydolduğunda topluluk bahçesi uygulaması için çalacak kısa ve sıcak bir bildirim sesi oluştur. Nazik, iki notalı bir çan sesi olsun, konuşma içermesin ve üç saniyenin altında olsun.
  vi: Tạo một âm thanh thông báo ngắn, ấm áp cho ứng dụng vườn cộng đồng khi có tình nguyện viên đăng ký. Một tiếng chuông hai nốt nhẹ nhàng, không có tiếng nói và dưới ba giây.
  id: Buat suara notifikasi yang singkat dan hangat untuk aplikasi kebun komunitas saat ada sukarelawan yang mendaftar. Denting dua nada yang lembut, tanpa ucapan, dan berdurasi kurang dari tiga detik.
  pl: Stwórz krótki, ciepły dźwięk powiadomienia dla aplikacji ogrodu społecznościowego, gdy zgłosi się wolontariusz. Delikatny dwutonowy sygnał, bez mowy, poniżej trzech sekund.
  nl: Maak een kort, warm meldingsgeluid voor een app voor een gemeenschapstuin voor wanneer een vrijwilliger zich aanmeldt. Een zachte tweekleurige chime, geen spraak en korter dan drie seconden.
  ar: أنشئ صوت إشعار قصير ودافئ لتطبيق حديقة مجتمعية عند تسجيل متطوع. رنين لطيف من نغمتين، بدون كلام، وأقل من ثلاث ثوانٍ.
  hi: एक कम्युनिटी गार्डन ऐप के लिए एक छोटा, वॉर्म नोटिफिकेशन साउंड बनाएं, जो तब बजे जब कोई वॉलंटियर साइन अप करे। एक सौम्य दो-नोट वाली चाइम, कोई आवाज़ नहीं, और तीन सेकंड से कम।
  th: สร้างเสียงแจ้งเตือนที่สั้นและอบอุ่นสำหรับแอปสวนชุมชนเมื่อมีอาสาสมัครลงทะเบียน ขอเป็นเสียงกริ่งสองตัวโน้ตที่นุ่มนวล ไม่มีเสียงพูด และความยาวไม่เกินสามวินาที
  cs: Vytvoř krátký, hřejivý zvuk oznámení pro aplikaci pro komunitní zahradu při přihlášení dobrovolníka. Jemná dvoutónová znělka, beze slov a pod tři sekundy.
  sv: Skapa ett kort, varmt aviseringsljud för en app för en gemenskapsträdgård när en volontär anmäler sig. En mild tvåtonssignal, inget tal och under tre sekunder.
  he: צור צליל התראה קצר וחם עבור אפליקציית גינה קהילתית כשמתנדב נרשם. צליל עדין של שני תווים, ללא דיבור, ובאורך של פחות משלוש שניות.
  verified_by_human: []

