    Här är nybörjarvänliga [yoga](wiki:Yoga)-klasser som äger rum runt om i Berlin nästa vecka:

    ```embeds_results_view
    title: Beginner Yoga Classes in Berlin (Next Week)
    embeds: yoga-for-grounding-TB2, mobility-yoga-optional-qv3, vinyasa-flow-in-a8l
    ```

    ---

    ### 1. [Yoga för grundning](embed:yoga-for-grounding-TB2) (Kreuzberg)
    - **Vad det är:** Ett medvetet pass som balanserar andningsstyrda rörelser med hållna positioner för att utforska linjering och stillhet. Speciellt utformat för att vara tillgängligt för nybörjare (hålls på engelska).
    - **Datum & tid:** Onsdag 14 oktober 2026, 18:00 – 19:00 CEST (kom 10 minuter tidigt)
    - **Plats:** Art OM, Wrangelstraße 54, 10997 Berlin ([Kreuzberg](wiki:Kreuzberg))
    - **Pris:** €11.83 – €22.49
    - **Bokning:** [Boka biljetter på Eventbrite](embed:yoga-for-grounding-TB2)

    ### 2. [Mobilitetsyoga & valfri bouldering](embed:mobility-yoga-optional-qv3) (Friedrichshain)
    - **Vad det är:** Ett informellt, avslappnat mobilitets- och yogapass för alla nivåer där flöden förklaras steg för steg i ett lugnt tempo. Ingen tidigare rörlighet eller erfarenhet krävs.
    - **Datum & tid:** Tisdag 13 oktober 2026, 19:00 – 19:45 CEST (kom 15 minuter tidigt)
    - **Plats:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([Friedrichshain](wiki:Friedrichshain))
    - **Pris:** €5 (gratis inträde med Urban Sports Club / Wellpass om du också bouldrar)
    - **Bokning:** [Visa detaljer och bokningslänk](embed:mobility-yoga-optional-qv3)

    ### 3. [Vinyasa Flow](embed:vinyasa-flow-in-a8l) (Wedding / Mitte)
    - **Vad det är:** Ett dynamiskt men ändå mjukt Vinyasa-pass som erbjuder modifieringar för nybörjare, med fokus på andningsmedvetenhet, kroppshållning och stresslindring.
    - **Datum & tid:** Onsdag 14 oktober 2026, 19:30 – 21:00 CEST
    - **Plats:** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [Mitte](wiki:Mitte))
    - **Pris:** €10 för ditt första provpass (startpaket: 3 pass för €20)
    - **Bokning:** [OSA via Berlin Yoga Club Meetup](embed:vinyasa-flow-in-a8l)

    ---

    ### Tips inför ditt första yogapass
    * **Klädsel:** Bekväma, stretchiga kläder som du lätt kan röra dig och böja dig i. Yoga utövas vanligtvis barfota.
    * **Vätska & måltider:** Undvik tunga måltider inom 1.5–2 timmar före passet.
    * **Lyssna på din kropp:** Berätta för läraren före passet att det är din första gång; de visar dig gärna justeringar och hjälpmedel (block, filtar eller remmar). Om du har befintliga led- eller ryggproblem, stäm av med en läkare eller fysioterapeut innan du provar dynamiska sekvenser.

    Vill du ha rekommendationer närmare en specifik stadsdel (t.ex. Neukölln, Prenzlauer Berg, Charlottenburg), eller fokuserade på en mjuk stil som [Hatha yoga](wiki:Hatha_yoga) eller [Yin yoga](wiki:Yin_yoga)?
    ---
    *⚠️ Detta är endast pedagogisk information och inte medicinsk rådgivning. Rådfråga din läkare för medicinska beslut.*
