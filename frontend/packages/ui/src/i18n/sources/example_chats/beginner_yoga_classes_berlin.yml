    ### İlk yoga dersiniz için ipuçları
    * **Kıyafet:** İçinde kolayca hareket edebileceğiniz ve eğilebileceğiniz rahat, esnek kıyafetler. Yoga genellikle çıplak ayakla yapılır.
    * **Sıvı Alımı ve Öğünler:** Dersten önceki 1,5–2 saat içinde ağır öğünlerden kaçının.
    * **Vücudunuzu dinleyin:** Dersten önce eğitmene ilk kez geldiğinizi bildirin; size düzeltmeleri ve yardımcı ekipmanları (bloklar, battaniyeler veya kemerler) memnuniyetle göstereceklerdir. Mevcut eklem veya sırt sorunlarınız varsa, dinamik sekansları denemeden önce bir doktora veya fizyoterapiste danışın.

