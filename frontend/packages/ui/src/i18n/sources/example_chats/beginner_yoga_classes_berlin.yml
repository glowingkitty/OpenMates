    * **복장:** 움직이기 편하고 잘 늘어나는 옷을 입어. 요가는 보통 맨발로 해.
    * **수분 섭취 및 식사:** 수업 시작 1.5~2시간 전에는 과식을 피하는 게 좋아.
    * **몸의 소리에 귀 기울이기:** 수업 시작 전에 강사에게 처음이라고 말해줘. 자세 수정이나 도구(블록, 담요, 스트랩 등) 사용법을 친절하게 알려줄 거야. 관절이나 허리에 지병이 있다면 역동적인 동작을 시도하기 전에 의사나 물리치료사에게 먼저 확인해 봐.

    특정 동네(예: 노이쾰른, 프렌츠라우어 베르크, 샬로텐부르크)와 더 가까운 곳을 추천해 줄까? 아니면 [하타 요가](wiki:Hatha_yoga)나 [인 요가](wiki:Yin_yoga)처럼 부드러운 스타일을 원해?
