    ---

    ### 1. [Yoga for Grounding](embed:yoga-for-grounding-TB2) (Kreuzberg)
    - **What it is:** A mindful class balancing breath-led movement with holding postures to explore alignment and stillness. Designed specifically to be accessible for beginners (held in English).
    - **Date & Time:** Wednesday, October 14, 2026, 18:00 – 19:00 CEST (arrive 10 mins early)
    - **Location:** Art OM, Wrangelstraße 54, 10997 Berlin ([Kreuzberg](wiki:Kreuzberg))
    - **Price:** €11.83 – €22.49
    - **Booking:** [Book tickets on Eventbrite](embed:yoga-for-grounding-TB2)

    ### 2. [Mobility Yoga & Optional Bouldering](embed:mobility-yoga-optional-qv3) (Friedrichshain)
    - **What it is:** An informal, relaxed all-levels mobility and yoga session where flows are explained step-by-step at a gentle pace. No prior flexibility or experience required.
    - **Date & Time:** Tuesday, October 13, 2026, 19:00 – 19:45 CEST (arrive 15 mins early)
    - **Location:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([Friedrichshain](wiki:Friedrichshain))
    - **Price:** €5 (free entry with Urban Sports Club / Wellpass if you also boulder)
    - **Booking:** [View details and booking link](embed:mobility-yoga-optional-qv3)

    ### 3. [Vinyasa Flow](embed:vinyasa-flow-in-a8l) (Wedding / Mitte)
    - **What it is:** A dynamic yet gentle Vinyasa session offering modifications for beginners, focusing on breath awareness, body alignment, and stress release.
    - **Date & Time:** Wednesday, October 14, 2026, 19:30 – 21:00 CEST
    - **Location:** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [Mitte](wiki:Mitte))
    - **Price:** €10 for your first trial class (starter pack: 3 classes for €20)
    - **Booking:** [RSVP via Berlin Yoga Club Meetup](embed:vinyasa-flow-in-a8l)

    ---

    ### Tips for your first yoga class
    * **Attire:** Comfortable, stretchy clothing you can move and bend in easily. Yoga is usually practiced barefoot.
    * **Hydration & Meals:** Avoid heavy meals within 1.5–2 hours before class.
    * **Listen to your body:** Let the teacher know before class that it's your first time; they will gladly show you adjustments and props (blocks, blankets, or straps). If you have pre-existing joint or back issues, check in with a doctor or physical therapist before trying dynamic sequences.

    Would you like recommendations closer to a specific neighborhood (e.g., Neukölln, Prenzlauer Berg, Charlottenburg), or focused on a gentle style like [Hatha yoga](wiki:Hatha_yoga) or [Yin yoga](wiki:Yin_yoga)?
