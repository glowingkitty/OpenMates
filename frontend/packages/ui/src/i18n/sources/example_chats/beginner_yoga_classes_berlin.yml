    ### 1. [Yoga zur Erdung](embed:yoga-for-grounding-TB2) (Kreuzberg)
    - **Was es ist:** Ein achtsamer Kurs, der atemgeführte Bewegungen mit dem Halten von Positionen kombiniert, um Ausrichtung und Stille zu erkunden. Speziell konzipiert, um für Anfänger zugänglich zu sein (auf Englisch).
