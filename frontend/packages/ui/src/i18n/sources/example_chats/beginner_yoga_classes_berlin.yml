    * **การแต่งกาย:** เสื้อผ้าที่ใส่สบายและยืดหยุ่นซึ่งคุณสามารถเคลื่อนไหวและก้มตัวได้ง่าย ปกติแล้วโยคะจะฝึกด้วยเท้าเปล่า
    * **การดื่มน้ำและอาหาร:** หลีกเลี่ยงการรับประทานอาหารมื้อหนักภายใน 1.5–2 ชั่วโมงก่อนเริ่มคลาส
    * **ฟังร่างกายของคุณ:** แจ้งให้ครูผู้สอนทราบก่อนเริ่มคลาสว่าเป็นครั้งแรกของคุณ พวกเขาจะยินดีแนะนำการปรับท่าและอุปกรณ์เสริม (บล็อก ผ้าห่ม หรือสายรัด) หากคุณมีปัญหาเรื่องข้อต่อหรือหลังอยู่ก่อนแล้ว ควรปรึกษาแพทย์หรือนักกายภาพบำบัดก่อนลองฝึกท่าที่ต้องเคลื่อนไหวต่อเนื่อง

    คุณต้องการคำแนะนำสำหรับย่านที่เฉพาะเจาะจงมากขึ้น (เช่น Neukölln, Prenzlauer Berg, Charlottenburg) หรือเน้นสไตล์ที่นุ่มนวลอย่าง [หฐโยคะ (Hatha yoga)](wiki:Hatha_yoga) หรือ [หยินโยคะ (Yin yoga)](wiki:Yin_yoga) หรือไม่?
