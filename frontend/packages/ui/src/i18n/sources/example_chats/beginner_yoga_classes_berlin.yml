    ### 2. [Mobility Yoga & optionales Bouldern](embed:mobility-yoga-optional-qv3) (Friedrichshain)
    - **Was es ist:** Eine informelle, entspannte Mobility- und Yoga-Session für alle Level, bei der die Flows Schritt für Schritt in einem angenehmen Tempo erklärt werden. Keine Vorkenntnisse in Flexibilität oder Erfahrung erforderlich.
    - **Datum & Uhrzeit:** Dienstag, 13. Oktober 2026, 19:00 – 19:45 CEST (15 Min. früher ankommen)
    - **Ort:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([Friedrichshain](wiki:Friedrichshain))
    - **Preis:** €5 (kostenloser Eintritt mit Urban Sports Club / Wellpass, wenn du auch boulderst)
    - **Buchung:** [Details und Buchungslink anzeigen](embed:mobility-yoga-optional-qv3)

    ### 3. [Vinyasa Flow](embed:vinyasa-flow-in-a8l) (Wedding / Mitte)
    - **Was es ist:** Eine dynamische und doch sanfte Vinyasa-Session, die Modifikationen für Anfänger bietet und sich auf Atembewusstsein, Körperausrichtung und Stressabbau konzentriert.
    - **Datum & Uhrzeit:** Mittwoch, 14. Oktober 2026, 19:30 – 21:00 CEST
    - **Ort:** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [Mitte](wiki:Mitte))
    - **Preis:** €10 für deine erste Probestunde (Starterpaket: 3 Stunden für €20)
    - **Buchung:** [Anmeldung via Berlin Yoga Club Meetup](embed:vinyasa-flow-in-a8l)

    ---

    ### Tipps für deine erste Yogastunde
    * **Kleidung:** Bequeme, dehnbare Kleidung, in der du dich gut bewegen und beugen kannst. Yoga wird normalerweise barfuß praktiziert.
    * **Flüssigkeitszufuhr & Mahlzeiten:** Vermeide schwere Mahlzeiten innerhalb von 1.5–2 Stunden vor der Stunde.
    * **Höre auf deinen Körper:** Lass die Lehrkraft vor der Stunde wissen, dass es dein erstes Mal ist; sie wird dir gerne Anpassungen und Hilfsmittel (Blöcke, Decken oder Gurte) zeigen. Wenn du bereits bestehende Gelenk- oder Rückenprobleme hast, sprich mit einem Arzt oder Physiotherapeuten, bevor du dynamische Sequenzen ausprobierst.

    Möchten Sie Empfehlungen in der Nähe eines bestimmten Stadtteils (z. B. Neukölln, Prenzlauer Berg, Charlottenburg) oder konzentriert auf einen sanften Stil wie [Hatha-Yoga](wiki:Hatha_yoga) oder [Yin-Yoga](wiki:Yin_yoga)?
