    ---

    ### 1. [Yoga for Grounding](embed:yoga-for-grounding-TB2) (Kreuzberg)
    - **O co jde:** Všímavá lekce vyvažující pohyb vedený dechem s výdržemi v pozicích pro zkoumání správného nastavení těla a klidu. Navrženo speciálně tak, aby byla lekce přístupná pro začátečníky (probíhá v angličtině).
    - **Datum a čas:** Středa 14. října 2026, 18:00 – 19:00 SELČ (přijď o 10 minut dříve)
    - **Místo:** Art OM, Wrangelstraße 54, 10997 Berlin ([Kreuzberg](wiki:Kreuzberg))
    - **Cena:** 11,83 € – 22,49 €
    - **Rezervace:** [Rezervovat vstupenky na Eventbrite](embed:yoga-for-grounding-TB2)

    ### 2. [Mobility Yoga & Optional Bouldering](embed:mobility-yoga-optional-qv3) (Friedrichshain)
    - **O co jde:** Neformální, uvolněná lekce mobility a jógy pro všechny úrovně, kde jsou sestavy vysvětlovány krok za krokem v mírném tempu. Není vyžadována předchozí flexibilita ani zkušenosti.
    - **Datum a čas:** Úterý 13. října 2026, 19:00 – 19:45 SELČ (přijď o 15 minut dříve)
    - **Místo:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([Friedrichshain](wiki:Friedrichshain))
    - **Cena:** 5 € (vstup zdarma s Urban Sports Club / Wellpass, pokud jdeš i na bouldering)
    - **Rezervace:** [Zobrazit podrobnosti a odkaz na rezervaci](embed:mobility-yoga-optional-qv3)

    ### 3. [Vinyasa Flow](embed:vinyasa-flow-in-a8l) (Wedding / Mitte)
    - **O co jde:** Dynamická, ale jemná lekce vinyasy nabízející modifikace pro začátečníky, zaměřená na uvědomění si dechu, držení těla a uvolnění stresu.
    - **Datum a čas:** Středa 14. října 2026, 19:30 – 21:00 SELČ
    - **Místo:** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [Mitte](wiki:Mitte))
    - **Cena:** 10 € za první zkušební lekci (startovací balíček: 3 lekce za 20 €)
    - **Rezervace:** [Potvrdit účast přes Berlin Yoga Club Meetup](embed:vinyasa-flow-in-a8l)

    ---

    ### Tipy pro tvou první lekci jógy
    * **Oblečení:** Pohodlné, pružné oblečení, ve kterém se můžeš snadno hýbat a ohýbat. Jóga se obvykle cvičí naboso.
    * **Hydratace a jídlo:** Vyhni se těžkým jídlům 1,5–2 hodiny před lekcí.
    * **Naslouchej svému tělu:** Před lekcí řekni lektorovi, že jsi tu poprvé; rádi ti ukážou úpravy a pomůcky (bloky, deky nebo popruhy). Pokud máš problémy s klouby nebo zády, poraď se před zkoušením dynamických sestav s lékařem nebo fyzioterapeutem.

    Chceš doporučení blíž ke konkrétní čtvrti (např. Neukölln, Prenzlauer Berg, Charlottenburg), nebo se zaměřením na jemný styl jako [Hatha jóga](wiki:Hatha_yoga) nebo [Yin jóga](wiki:Yin_yoga)?
