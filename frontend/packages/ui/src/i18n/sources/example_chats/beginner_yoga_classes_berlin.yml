    ### 1. [Yoga for Grounding](embed:yoga-for-grounding-TB2) (क्रुज़बर्ग)
    - **यह क्या है:** संरेखण और स्थिरता का पता लगाने के लिए सांस-आधारित गतिविधियों और मुद्राओं को संतुलित करने वाली एक सचेत कक्षा। विशेष रूप से शुरुआती लोगों के लिए सुलभ होने के लिए डिज़ाइन की गई (अंग्रेजी में आयोजित)।
    - **दिनांक और समय:** बुधवार, 14 अक्टूबर, 2026, 18:00 – 19:00 CEST (10 मिनट पहले पहुंचें)
    - **स्थान:** Art OM, Wrangelstraße 54, 10997 Berlin ([Kreuzberg](wiki:Kreuzberg))
    - **कीमत:** €11.83 – €22.49
    - **बुकिंग:** [Eventbrite पर टिकट बुक करें](embed:yoga-for-grounding-TB2)

    ### 2. [Mobility Yoga & Optional Bouldering](embed:mobility-yoga-optional-qv3) (फ्रीड्रिचशैन)
    - **यह क्या है:** एक अनौपचारिक, तनावमुक्त सभी स्तरों के लिए गतिशीलता और योग सत्र जहाँ प्रवाह को धीमी गति से चरण-दर-चरण समझाया जाता है। किसी पूर्व लचीलेपन या अनुभव की आवश्यकता नहीं है।
    - **दिनांक और समय:** मंगलवार, 13 अक्टूबर, 2026, 19:00 – 19:45 CEST (15 मिनट पहले पहुंचें)
    - **स्थान:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([Friedrichshain](wiki:Friedrichshain))
    - **कीमत:** €5 (यदि आप बोल्डरिंग भी करते हैं तो Urban Sports Club / Wellpass के साथ निःशुल्क प्रवेश)
    - **बुकिंग:** [विवरण और बुकिंग लिंक देखें](embed:mobility-yoga-optional-qv3)

    ### 3. [Vinyasa Flow](embed:vinyasa-flow-in-a8l) (वेडिंग / मिट्टे)
    - **यह क्या है:** एक गतिशील लेकिन सौम्य विन्यास सत्र जो शुरुआती लोगों के लिए बदलाव (modifications) प्रदान करता है, जो सांस की जागरूकता, शरीर के संरेखण और तनाव मुक्ति पर केंद्रित है।
    - **दिनांक और समय:** बुधवार, 14 अक्टूबर, 2026, 19:30 – 21:00 CEST
    - **स्थान:** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [Mitte](wiki:Mitte))
    - **कीमत:** आपकी पहली ट्रायल क्लास के लिए €10 (स्टार्टर पैक: €20 में 3 क्लास)
    - **बुकिंग:** [Berlin Yoga Club Meetup के माध्यम से RSVP करें](embed:vinyasa-flow-in-a8l)

    ---

    ### आपकी पहली योग कक्षा के लिए सुझाव
    * **पोशाक:** आरामदायक, स्ट्रेचेबल कपड़े जिनमें आप आसानी से हिल-डुल और झुक सकें। योग आमतौर पर नंगे पैर किया जाता है।
    * **हाइड्रेशन और भोजन:** कक्षा से 1.5-2 घंटे पहले भारी भोजन से बचें।
    * **अपने शरीर की सुनें:** कक्षा से पहले शिक्षक को बताएं कि यह आपकी पहली बार है; वे खुशी-खुशी आपको समायोजन और प्रॉप्स (ब्लॉक, कंबल या स्ट्रैप) दिखाएंगे। यदि आपको पहले से जोड़ों या पीठ की समस्या है, तो गतिशील अनुक्रमों को आज़माने से पहले डॉक्टर या फिजियोथेरेपिस्ट से सलाह लें।

    क्या तुम किसी विशिष्ट पड़ोस (जैसे, नॉयकोलन, प्रेन्ज़लाउर बर्ग, चार्लोटनबर्ग) के करीब सिफारिशें चाहोगे, या [हठ योग](wiki:Hatha_yoga) या [यिन योग](wiki:Yin_yoga) जैसी सौम्य शैली पर ध्यान केंद्रित करना चाहोगे?
