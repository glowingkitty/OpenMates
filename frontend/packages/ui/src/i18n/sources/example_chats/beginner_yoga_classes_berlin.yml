message_1:
  context: "user message 1 in example chat: Beginner Yoga Classes in Berlin. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I’m new to yoga and would like a beginner-friendly class in Berlin next week. Can you find a few classes with times, prices, and booking links?"
  de: "Ich bin neu beim Yoga und hätte gerne einen anfängerfreundlichen Kurs in Berlin nächste Woche. Kannst du ein paar Kurse mit Zeiten, Preisen und Buchungslinks finden?"
  zh: 我是瑜伽初学者，想在下周参加柏林的初学者友好课程。你能帮我找几节课，并提供时间、价格和预订链接吗？
  es: "Soy nuevo en el yoga y me gustaría una clase para principiantes en Berlín la próxima semana. ¿Puedes encontrar algunas clases con horarios, precios y enlaces de reserva?"
  fr: "Je débute en yoga et j'aimerais trouver un cours pour débutants à Berlin la semaine prochaine. Peux-tu me trouver quelques cours avec les horaires, les tarifs et les liens de réservation ?"
  pt: "Sou iniciante no yoga e gostaria de uma aula para principiantes em Berlim na próxima semana. Podes encontrar algumas aulas com horários, preços e links de reserva?"
  ru: "Я новичок в йоге и ищу занятия для начинающих в Берлине на следующей неделе. Можешь найти несколько вариантов с расписанием, ценами и ссылками на бронирование?"
  ja: ヨガ初心者なのですが、来週ベルリンで開催される初心者向けのクラスを探しています。時間、料金、予約リンクを含めていくつか見つけてもらえますか？
  ko: "요가는 처음인데 다음 주에 베를린에서 들을 수 있는 초보자용 클래스를 찾고 있어요. 시간, 가격, 예약 링크가 포함된 클래스 몇 개만 찾아줄 수 있나요?"
  it: "Sono un principiante e vorrei un corso di yoga adatto a chi inizia a Berlino la prossima settimana. Puoi trovarmi alcuni corsi con orari, prezzi e link per la prenotazione?"
  tr: "Yogaya yeni başlıyorum ve önümüzdeki hafta Berlin'de başlangıç seviyesine uygun bir ders arıyorum. Saatleri, fiyatları ve rezervasyon bağlantılarıyla birlikte birkaç ders bulabilir misin?"
  vi: "Tôi mới tập yoga và muốn tìm một lớp học cho người mới bắt đầu tại Berlin vào tuần tới. Bạn có thể tìm giúp tôi một vài lớp học kèm theo thời gian, giá cả và liên kết đặt chỗ không?"
  id: "Saya baru dalam yoga dan ingin mencari kelas yang ramah pemula di Berlin minggu depan. Bisakah kamu mencarikan beberapa kelas beserta waktu, harga, dan tautan pemesanannya?"
  pl: "Dopiero zaczynam przygodę z jogą i szukam zajęć dla początkujących w Berlinie w przyszłym tygodniu. Czy możesz znaleźć kilka opcji wraz z godzinami, cenami i linkami do rezerwacji?"
  nl: "Ik ben nieuw met yoga en wil volgende week graag een beginnersvriendelijke les volgen in Berlijn. Kun je een paar lessen vinden met tijden, prijzen en boekingslinks?"
  ar: أنا مبتدئ في اليوغا وأرغب في حضور حصة مناسبة للمبتدئين في برلين الأسبوع القادم. هل يمكنك العثور على بعض الحصص مع المواعيد والأسعار وروابط الحجز؟
  hi: "मैं योग में नया हूँ और अगले हफ्ते बर्लिन में शुरुआती लोगों के लिए कोई क्लास लेना चाहता हूँ। क्या आप समय, कीमतों और बुकिंग लिंक के साथ कुछ क्लासेज ढूंढ सकते हैं?"
  th: "ฉันเพิ่งเริ่มเล่นโยคะและอยากหาคลาสสำหรับผู้เริ่มต้นในเบอร์ลินสัปดาห์หน้า ช่วยหาคลาสสัก 2-3 คลาสที่มีรายละเอียดเวลา ราคา และลิงก์จองให้หน่อยได้ไหม?"
  cs: "S jógou začínám a příští týden bych v Berlíně chtěl/a zajít na lekci pro začátečníky. Můžeš mi najít pár lekcí s časy, cenami a odkazy na rezervaci?"
  sv: "Jag är nybörjare på yoga och skulle vilja gå på en nybörjarvänlig klass i Berlin nästa vecka. Kan du hitta några klasser med tider, priser och bokningslänkar?"
  he: "אני חדש ביוגה ומחפש שיעור למתחילים בברלין בשבוע הבא. תוכל למצוא כמה שיעורים עם זמנים, מחירים וקישורים להזמנה?"
  verified_by_human: []

