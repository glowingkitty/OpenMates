    ### Consigli per la tua prima lezione di yoga
    * **Abbigliamento:** Vestiti comodi ed elastici che ti permettano di muoverti e piegarti facilmente. Lo yoga si pratica solitamente a piedi nudi.
    * **Idratazione e pasti:** Evita pasti pesanti nelle 1,5–2 ore precedenti la lezione.
    * **Ascolta il tuo corpo:** Avvisa l'insegnante prima della lezione che è la tua prima volta; ti mostrerà volentieri come usare i supporti (blocchi, coperte o cinghie). Se hai problemi preesistenti alle articolazioni o alla schiena, consulta un medico o un fisioterapista prima di provare sequenze dinamiche.

    Vorresti dei consigli più vicini a un quartiere specifico (ad es. Neukölln, Prenzlauer Berg, Charlottenburg) o preferiresti uno stile più dolce come l'[Hatha yoga](wiki:Hatha_yoga) o lo [Yin yoga](wiki:Yin_yoga)?
