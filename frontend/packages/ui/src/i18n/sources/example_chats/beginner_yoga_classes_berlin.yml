    * **Słuchaj swojego ciała:** Poinformuj nauczyciela przed zajęciami, że to Twój pierwszy raz; chętnie pokaże Ci modyfikacje i sposób użycia pomocy (kostek, koców czy pasków). Jeśli masz problemy ze stawami lub plecami, skonsultuj się z lekarzem lub fizjoterapeutą przed przystąpieniem do dynamicznych sekwencji.

    Czy chcesz otrzymać rekomendacje bliżej konkretnej dzielnicy (np. Neukölln, Prenzlauer Berg, Charlottenburg) lub skupione na łagodnym stylu, takim jak [Hatha joga](wiki:Hatha_yoga) lub [Yin joga](wiki:Yin_yoga)?
    ---
    *⚠️ To są wyłącznie informacje edukacyjne, a nie porada medyczna. W sprawach medycznych skonsultuj się z lekarzem.*
