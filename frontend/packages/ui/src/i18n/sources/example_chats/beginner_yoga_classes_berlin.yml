    ### Tips voor je eerste yogales
    * **Kleding:** Comfortabele, rekbare kleding waarin je gemakkelijk kunt bewegen en buigen. Yoga wordt meestal op blote voeten beoefend.
    * **Hydratatie & maaltijden:** Vermijd zware maaltijden binnen 1,5 tot 2 uur voor de les.
    * **Luister naar je lichaam:** Laat de docent voor de les weten dat het je eerste keer is; ze laten je graag aanpassingen en hulpmiddelen zien (blokken, dekens of riemen). Als je bestaande gewrichts- of rugklachten hebt, overleg dan met een arts of fysiotherapeut voordat je dynamische reeksen probeert.

