    ```

    ---

    ### 1. [יוגה לקרקוע](embed:yoga-for-grounding-TB2) (קרויצברג)
    - **מה זה:** שיעור קשוב המאזן בין תנועה מונחית נשימה לבין שהייה בתנוחות כדי לחקור יישור ושקט. תוכנן במיוחד כדי להיות נגיש למתחילים (מתקיים באנגלית).
    - **תאריך ושעה:** יום רביעי, 14 באוקטובר 2026, 18:00 – 19:00 CEST (הגיעו 10 דקות לפני)
    - **מיקום:** Art OM, Wrangelstraße 54, 10997 Berlin ([קרויצברג](wiki:Kreuzberg))
    - **מחיר:** €11.83 – €22.49
    - **הרשמה:** [הזמנת כרטיסים ב-Eventbrite](embed:yoga-for-grounding-TB2)

    ### 2. [יוגה לניידות ובולדרינג אופציונלי](embed:mobility-yoga-optional-qv3) (פרידריכסהיין)
    - **מה זה:** מפגש יוגה וניידות לא רשמי ורגוע לכל הרמות, שבו הרצפים מוסברים צעד אחר צעד בקצב נינוח. אין צורך בגמישות או בניסיון קודם.
    - **תאריך ושעה:** יום שלישי, 13 באוקטובר 2026, 19:00 – 19:45 CEST (הגיעו 15 דקות מוקדם יותר)
    - **מיקום:** Urban Apes Friedrichshain, Friedensstraße 91 B, Berlin ([פרידריכסהיין](wiki:Friedrichshain))
    - **מחיר:** €5 (כניסה חינם עם Urban Sports Club / Wellpass אם אתם גם עושים בולדרינג)
    - **הרשמה:** [צפו בפרטים ובקישור להרשמה](embed:mobility-yoga-optional-qv3)

    ### 3. [ויניאסה פלואו](embed:vinyasa-flow-in-a8l) (וודינג / מיטה)
    - **מה זה:** שיעור ויניאסה דינמי אך עדין המציע התאמות למתחילים, ומתמקד במודעות לנשימה, יישור הגוף ושחרור מתחים.
    - **תאריך ושעה:** יום רביעי, 14 באוקטובר, 2026, 19:30 – 21:00 CEST
    - **מיקום:** YOGA at Lobe Block UG, Böttgerstraße 16, ברלין (Gesundbrunnen / [מיטה](wiki:Mitte))
    - **מחיר:** €10 לשיעור ניסיון ראשון (חבילת התחלה: 3 שיעורים ב-€20)
    - **הרשמה:** [אישור הגעה (RSVP) דרך Berlin Yoga Club Meetup](embed:vinyasa-flow-in-a8l)

    ---

    ### טיפים לשיעור היוגה הראשון שלך
    * **לבוש:** בגדים נוחים ואלסטיים שניתן לזוז ולהתכופף בהם בקלות. יוגה מתרגלים בדרך כלל יחפים.
    * **שתייה וארוחות:** הימנעו מארוחות כבדות בטווח של 1.5–2 שעות לפני השיעור.
    * **הקשיבו לגוף שלכם:** עדכנו את המורה לפני השיעור שזו הפעם הראשונה שלכם; הם ישמחו להראות לכם התאמות ואביזרים (בלוקים, שמיכות או רצועות). אם יש לכם בעיות קודמות במפרקים או בגב, התייעצו עם רופא או פיזיותרפיסט לפני שתנסו רצפים דינמיים.

    האם תרצה/י המלצות הקרובות יותר לשכונה ספציפית (למשל, נויקלן, פרנצלאואר ברג, שרלוטנבורג), או כאלו המתמקדות בסגנון עדין כמו [האטה יוגה](wiki:Hatha_yoga) או [יין יוגה](wiki:Yin_yoga)?
    ---
    *⚠️ מידע זה נועד למטרות חינוכיות בלבד ואינו מהווה ייעוץ רפואי. יש להתייעץ עם רופא לצורך קבלת החלטות רפואיות.*
