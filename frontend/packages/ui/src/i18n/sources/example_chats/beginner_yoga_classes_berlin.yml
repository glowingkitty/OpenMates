    - **价格：** €5（如果同时参加抱石，使用 Urban Sports Club / Wellpass 可免费入场）
    - **预订：** [查看详情及预订链接](embed:mobility-yoga-optional-qv3)

    ### 3. [流瑜伽](embed:vinyasa-flow-in-a8l) (Wedding / Mitte)
    - **课程简介：** 一节充满活力且温和的流瑜伽 (Vinyasa) 课，为初学者提供动作调整建议，专注于呼吸意识、身体对齐和压力释放。
    - **日期与时间：** 2026年10月14日，星期三，19:30 – 21:00 CEST
    - **地点：** YOGA at Lobe Block UG, Böttgerstraße 16, Berlin (Gesundbrunnen / [米特区](wiki:Mitte))
    - **价格：** 首节体验课 €10（入门套餐：3 节课 €20）
    - **预订：** [通过 Berlin Yoga Club Meetup 报名](embed:vinyasa-flow-in-a8l)

    ---

    ### 初次参加瑜伽课的小贴士
    * **着装：** 穿着舒适、有弹性的衣物，方便活动和弯曲。瑜伽通常赤脚练习。
    * **补水与饮食：** 课前 1.5–2 小时内避免饱食。
    * **倾听身体的声音：** 课前告知老师这是你第一次参加；他们会很乐意向你展示如何使用辅助具（瑜伽砖、毯子或拉伸带）并进行调整。如果你有既往的关节或背部问题，在尝试动态序列前请咨询医生或理疗师。

    你是否需要更靠近特定社区（如 Neukölln、Prenzlauer Berg、Charlottenburg）的推荐，或者更倾向于温和的风格，如[哈他瑜伽](wiki:Hatha_yoga)或[阴瑜伽](wiki:Yin_yoga)？
