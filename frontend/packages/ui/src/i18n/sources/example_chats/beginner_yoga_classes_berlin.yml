    ### Tips untuk kelas yoga pertama kamu
    * **Pakaian:** Pakaian yang nyaman dan elastis agar kamu bisa bergerak dan membungkuk dengan mudah. Yoga biasanya dilakukan tanpa alas kaki.
    * **Hidrasi & Makanan:** Hindari makan berat dalam waktu 1,5–2 jam sebelum kelas.
    * **Dengarkan tubuhmu:** Beri tahu pengajar sebelum kelas bahwa ini adalah pertama kalinya kamu; mereka akan dengan senang hati menunjukkan penyesuaian dan alat bantu (balok, selimut, atau tali). Jika kamu memiliki masalah sendi atau punggung sebelumnya, konsultasikan dengan dokter atau terapis fisik sebelum mencoba urutan gerakan yang dinamis.

    Apakah kamu ingin rekomendasi yang lebih dekat dengan lingkungan tertentu (misalnya, Neukölln, Prenzlauer Berg, Charlottenburg), atau fokus pada gaya yang lembut seperti [Hatha yoga](wiki:Hatha_yoga) atau [Yin yoga](wiki:Yin_yoga)?
