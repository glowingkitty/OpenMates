summary:
  context: "Summary of example chat: Calendar week from supplied events"
  en: "Summarize a fictional week of calendar events supplied in the conversation, without connected-account access."
  de: Fasse eine fiktive Woche mit Kalenderereignissen zusammen, die im Chat bereitgestellt wurden, ohne Zugriff auf ein verknüpftes Konto.
  zh: 在不访问关联账户的情况下，总结对话中提供的虚构日历周活动。
  es: Resume una semana ficticia de eventos de calendario proporcionados en la conversación, sin acceder a una cuenta conectada.
  fr: "Résume une semaine fictive d'événements de calendrier fournis dans la conversation, sans accès à un compte connecté."
  pt: Resume uma semana fictícia de eventos de calendário fornecidos na conversa, sem acesso a contas ligadas.
  ru: Краткий обзор вымышленной недели на основе событий, указанных в чате, без доступа к подключенному аккаунту.
  ja: アカウント連携なしで、会話内に入力された架空の1週間のカレンダーイベントを要約します。
  ko: 계정 연결 없이 대화에 제공된 가상의 주간 일정을 요약합니다.
  it: "Riassume una settimana fittizia di eventi di calendario forniti nella conversazione, senza accesso all'account collegato."
  tr: Bağlı hesap erişimi olmadan, konuşmada paylaşılan kurgusal bir haftalık takvim etkinliklerini özetle.
  vi: Tóm tắt một tuần giả định gồm các sự kiện lịch được cung cấp trong cuộc hội thoại, mà không cần quyền truy cập vào tài khoản đã kết nối.
  id: Rangkum minggu fiktif dari acara kalender yang diberikan dalam percakapan, tanpa akses akun terhubung.
  pl: Podsumuj fikcyjny tydzień wydarzeń z kalendarza podanych w rozmowie, bez dostępu do połączonego konta.
  nl: Vat een fictieve week samen op basis van afspraken die in het gesprek zijn opgegeven, zonder toegang tot een gekoppeld account.
  ar: تلخيص أسبوع خيالي من أحداث التقويم المقدمة في المحادثة، دون الوصول إلى الحساب المتصل.
  hi: कनेक्टेड-अकाउंट एक्सेस के बिना, बातचीत में दिए गए काल्पनिक सप्ताह के कैलेंडर इवेंट्स का सारांश दें।
  th: สรุปเหตุการณ์ในปฏิทินรายสัปดาห์สมมติที่ให้ไว้ในการสนทนา โดยไม่ต้องเข้าถึงบัญชีที่เชื่อมต่อไว้
  cs: Shrnutí fiktivního týdne kalendářních událostí zadaných v konverzaci, bez přístupu k propojenému účtu.
  sv: Sammanfatta en fiktiv vecka med kalenderhändelser som tillhandahålls i konversationen, utan åtkomst till anslutna konton.
  he: סיכום שבוע דמיוני של אירועי לוח שנה שסופקו בשיחה, ללא גישה לחשבון מחובר.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Calendar week from supplied events. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "@mate:general_knowledge please summarize my calendar week of October 12–18 (Berlin time) from these events I've copied here: Mon 09:00–09:30 team check-in; Tue 14:00–15:00 dentist; Wed 10:00–11:00 project review and 18:30–19:30 yoga; Fri 16:00–17:00 grocery pickup; Sat 11:00–13:00 community garden shift. Which day has the most commitments, and which days are free?"
  de: "@mate:general_knowledge bitte fasse meine Kalenderwoche vom 12. bis 18. Oktober (Berliner Zeit) anhand dieser hier kopierten Termine zusammen: Mo 09:00–09:30 Team-Check-in; Di 14:00–15:00 Zahnarzt; Mi 10:00–11:00 Projektbesprechung und 18:30–19:30 Yoga; Fr 16:00–17:00 Einkäufe abholen; Sa 11:00–13:00 Schicht im Gemeinschaftsgarten. Welcher Tag hat die meisten Verpflichtungen und welche Tage sind frei?"
  zh: "@mate:general_knowledge 请根据我在这里复制的这些活动，总结一下我 10 月 12 日至 18 日（柏林时间）的日历周：周一 09:00–09:30 团队签到；周二 14:00–15:00 牙医；周三 10:00–11:00 项目回顾和 18:30–19:30 瑜伽；周五 16:00–17:00 杂货取货；周六 11:00–13:00 社区花园轮班。哪一天的安排最满，哪些天是空闲的？"
  es: "@mate:general_knowledge resume mi semana del 12 al 18 de octubre (hora de Berlín) a partir de estos eventos que he copiado aquí: lun. 09:00–09:30 reunión de equipo; mar. 14:00–15:00 dentista; mié. 10:00–11:00 revisión del proyecto y 18:30–19:30 yoga; vie. 16:00–17:00 recogida de la compra; sáb. 11:00–13:00 turno de voluntariado en el huerto comunitario. ¿Qué día tengo más compromisos y qué días están libres?"
  fr: "@mate:general_knowledge résume ma semaine de calendrier du 12 au 18 octobre (heure de Berlin) à partir de ces événements que j'ai copiés ici : Lun 09:00–09:30 point d'équipe ; Mar 14:00–15:00 dentiste ; Mer 10:00–11:00 revue de projet et 18:30–19:30 yoga ; Ven 16:00–17:00 retrait des courses ; Sam 11:00–13:00 créneau au jardin communautaire. Quel jour est le plus chargé et quels jours sont libres ?"
  pt: "@mate:general_knowledge por favor, resume a minha semana de calendário de 12 a 18 de outubro (hora de Berlim) a partir destes eventos que copiei aqui: Seg 09:00–09:30 check-in de equipa; Ter 14:00–15:00 dentista; Qua 10:00–11:00 revisão de projeto e 18:30–19:30 ioga; Sex 16:00–17:00 levantamento de compras; Sáb 11:00–13:00 turno na horta comunitária. Qual é o dia com mais compromissos e quais são os dias livres?"
  ru: "@mate:general_knowledge пожалуйста, составь краткий обзор моей календарной недели с 12 по 18 октября (берлинское время) на основе этих событий: Пн 09:00–09:30 командная встреча; Вт 14:00–15:00 стоматолог; Ср 10:00–11:00 обзор проекта и 18:30–19:30 йога; Пт 16:00–17:00 забрать продукты; Сб 11:00–13:00 смена в общественном саду. В какой день больше всего дел, а какие дни свободны?"
  ja: "@mate:general_knowledge ここにコピーしたイベントをもとに、10月12日〜18日の週（ベルリン時間）の予定を要約してください：月 09:00–09:30 チームチェックイン、火 14:00–15:00 歯医者、水 10:00–11:00 プロジェクトレビューと18:30–19:30 ヨガ、金 16:00–17:00 食料品の受け取り、土 11:00–13:00 コミュニティガーデンの当番。予定が一番多い日はいつですか？また、空いている日はいつですか？"
  ko: "@mate:general_knowledge 여기에 복사한 일정을 바탕으로 10월 12~18일(베를린 시간) 주간 일정을 요약해 줘: 월 09:00–09:30 팀 체크인; 화 14:00–15:00 치과; 수 10:00–11:00 프로젝트 리뷰 및 18:30–19:30 요가; 금 16:00–17:00 식료품 픽업; 토 11:00–13:00 커뮤니티 정원 봉사. 일정이 가장 많은 날은 언제고, 한가한 날은 언제야?"
  it: "@mate:general_knowledge per favore riassumi la mia settimana di calendario dal 12 al 18 ottobre (ora di Berlino) da questi eventi che ho copiato qui: lun 09:00–09:30 check-in del team; mar 14:00–15:00 dentista; mer 10:00–11:00 revisione del progetto e 18:30–19:30 yoga; ven 16:00–17:00 ritiro spesa; sab 11:00–13:00 turno orto comunitario. Quale giorno ha più impegni e quali giorni sono liberi?"
  tr: "@mate:general_knowledge lütfen buraya kopyaladığım şu etkinliklerden 12–18 Ekim (Berlin saati) haftalık takvimimi özetle: Pzt 09:00–09:30 ekip toplantısı; Sal 14:00–15:00 diş hekimi; Çar 10:00–11:00 proje incelemesi ve 18:30–19:30 yoga; Cum 16:00–17:00 market alışverişi; Cmt 11:00–13:00 topluluk bahçesi vardiyası. En çok işin olduğu gün hangisi ve hangi günler boş?"
  vi: "@mate:general_knowledge vui lòng tóm tắt tuần lịch từ ngày 12–18 tháng 10 (giờ Berlin) của tôi từ các sự kiện tôi đã sao chép ở đây: Thứ Hai 09:00–09:30 họp nhóm; Thứ Ba 14:00–15:00 nha sĩ; Thứ Tư 10:00–11:00 đánh giá dự án và 18:30–19:30 yoga; Thứ Sáu 16:00–17:00 lấy đồ tạp hóa; Thứ Bảy 11:00–13:00 ca làm vườn cộng đồng. Ngày nào có nhiều lịch hẹn nhất và những ngày nào rảnh?"
  id: "@mate:general_knowledge tolong rangkum minggu kalender saya dari tanggal 12–18 Oktober (waktu Berlin) dari acara-acara yang saya salin di sini: Sen 09:00–09:30 team check-in; Sel 14:00–15:00 dokter gigi; Rab 10:00–11:00 tinjauan proyek dan 18:30–19:30 yoga; Jum 16:00–17:00 ambil belanjaan; Sab 11:00–13:00 giliran kebun komunitas. Hari mana yang memiliki komitmen paling banyak, dan hari mana yang kosong?"
  pl: "@mate:general_knowledge proszę, podsumuj mój tydzień w kalendarzu od 12 do 18 października (czas berliński) na podstawie tych wydarzeń, które tutaj wkleiłem: pon. 09:00–09:30 spotkanie zespołu; wt. 14:00–15:00 dentysta; śr. 10:00–11:00 przegląd projektu i 18:30–19:30 joga; pt. 16:00–17:00 odbiór zakupów; sob. 11:00–13:00 dyżur w ogrodzie społecznościowym. Który dzień ma najwięcej zobowiązań, a które dni są wolne?"
  nl: "@mate:general_knowledge vat mijn kalenderweek van 12 tot en met 18 oktober (Berlijnse tijd) samen op basis van deze afspraken die ik hier heb gekopieerd: ma. 09:00–09:30 teamoverleg; di. 14:00–15:00 tandarts; wo. 10:00–11:00 projectbespreking en 18:30–19:30 yoga; vr. 16:00–17:00 boodschappen ophalen; za. 11:00–13:00 vrijwilligersdienst in de buurttuin. Op welke dag heb ik de meeste afspraken en welke dagen zijn vrij?"
  ar: "@mate:general_knowledge يرجى تلخيص أسبوع التقويم الخاص بي من 12 إلى 18 أكتوبر (بتوقيت برلين) بناءً على هذه الأحداث التي نسختها هنا: الاثنين 09:00–09:30 اجتماع الفريق؛ الثلاثاء 14:00–15:00 طبيب الأسنان؛ الأربعاء 10:00–11:00 مراجعة المشروع و18:30–19:30 يوغا؛ الجمعة 16:00–17:00 استلام البقالة؛ السبت 11:00–13:00 نوبة عمل في حديقة المجتمع. أي يوم لديه أكبر عدد من الالتزامات، وأي الأيام شاغرة؟"
  hi: "@mate:general_knowledge कृपया मेरे द्वारा यहाँ कॉपी किए गए इन इवेंट्स से 12-18 अक्टूबर (बर्लिन समय) के मेरे कैलेंडर सप्ताह का सारांश दें: सोम 09:00–09:30 टीम चेक-इन; मंगल 14:00–15:00 डेंटिस्ट; बुध 10:00–11:00 प्रोजेक्ट समीक्षा और 18:30–19:30 योग; शुक्र 16:00–17:00 ग्रोसरी पिकअप; शनि 11:00–13:00 कम्युनिटी गार्डन शिफ्ट। किस दिन सबसे अधिक व्यस्तता है, और कौन से दिन खाली हैं?"
  th: "@mate:general_knowledge ช่วยสรุปปฏิทินรายสัปดาห์ของฉันตั้งแต่วันที่ 12–18 ตุลาคม (เวลาเบอร์ลิน) จากเหตุการณ์ที่ฉันคัดลอกมาที่นี่หน่อย: จันทร์ 09:00–09:30 เช็คอินทีม; อังคาร 14:00–15:00 ทันตแพทย์; พุธ 10:00–11:00 ทบทวนโครงการ และ 18:30–19:30 โยคะ; ศุกร์ 16:00–17:00 รับของชำ; เสาร์ 11:00–13:00 เวรจัดสวนชุมชน วันไหนมีภารกิจมากที่สุด และวันไหนว่างบ้าง?"
  cs: "@mate:general_knowledge prosím shrň můj kalendářní týden od 12. do 18. října (berlínského času) z těchto událostí, které jsem sem zkopíroval: Po 09:00–09:30 team check-in; Út 14:00–15:00 zubař; St 10:00–11:00 projektová revize a 18:30–19:30 jóga; Pá 16:00–17:00 vyzvednutí nákupu; So 11:00–13:00 směna v komunitní zahradě. Který den má nejvíce povinností a které dny jsou volné?"
  sv: "@mate:general_knowledge sammanfatta gärna min kalendervecka 12–18 oktober (Berlintid) utifrån dessa händelser som jag har kopierat in här: mån 09:00–09:30 team-avstämning; tis 14:00–15:00 tandläkare; ons 10:00–11:00 projektgenomgång och 18:30–19:30 yoga; fre 16:00–17:00 hämta matvaror; lör 11:00–13:00 pass i gemenskapsträdgården. Vilken dag har flest åtaganden, och vilka dagar är lediga?"
  he: "@mate:general_knowledge אנא סכם את שבוע לוח השנה שלי ב-12–18 באוקטובר (זמן ברלין) מהאירועים האלה שהעתקתי לכאן: ב' 09:00–09:30 צ'ק-אין צוות; ג' 14:00–15:00 רופא שיניים; ד' 10:00–11:00 סקירת פרויקט ו-18:30–19:30 יוגה; ו' 16:00–17:00 איסוף מצרכים; ש' 11:00–13:00 משמרת בגינה קהילתית. באיזה יום יש הכי הרבה התחייבויות, ואילו ימים פנויים?"
  verified_by_human: []

