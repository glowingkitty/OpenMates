summary:
  context: "Summary of example chat: Generate a Confirmation Tick Sound"
  en: "Create a short success-notification sound effect with the Audio Generate app skill."
  de: Erstelle einen kurzen Erfolgs-Benachrichtigungston mit dem Audio Generate App-Skill.
  zh: 使用 Audio Generate 应用技能创建一个短促的成功通知音效。
  es: Crea un efecto de sonido corto para notificaciones de éxito con la función Audio Generate.
  fr: Crée un court effet sonore de notification de succès avec la compétence Audio Generate.
  pt: Cria um pequeno efeito sonoro de notificação de sucesso com a skill da app Audio Generate.
  ru: Создай короткий звуковой эффект уведомления об успехе с помощью навыка Audio Generate.
  ja: Audio Generateアプリのスキルを使用して、短い成功通知の効果音を作成します。
  ko: 오디오 생성 앱 스킬을 사용하여 짧은 성공 알림 효과음을 만듭니다.
  it: "Crea un breve effetto sonoro di notifica di successo con la skill dell'app Audio Generate."
  tr: Audio Generate uygulama yeteneği ile kısa bir başarı bildirimi ses efekti oluştur.
  vi: Tạo hiệu ứng âm thanh thông báo thành công ngắn gọn bằng kỹ năng ứng dụng Audio Generate.
  id: Buat efek suara notifikasi keberhasilan yang singkat dengan skill aplikasi Audio Generate.
  pl: Stwórz krótki efekt dźwiękowy powiadomienia o sukcesie za pomocą umiejętności Audio Generate.
  nl: Maak een kort succesmeldingsgeluid met de Audio Generate app-skill.
  ar: أنشئ تأثيرًا صوتيًا قصيرًا لإشعار النجاح باستخدام مهارة تطبيق إنشاء الصوت.
  hi: Audio Generate ऐप स्किल के साथ एक छोटा सफलता-नोटिफिकेशन साउंड इफेक्ट बनाएं।
  th: สร้างเอฟเฟกต์เสียงแจ้งเตือนความสำเร็จสั้นๆ ด้วยทักษะแอป Audio Generate
  cs: Vytvoř krátký zvukový efekt pro oznámení o úspěchu pomocí dovednosti Audio Generate.
  sv: Skapa en kort ljudeffekt för framgångsavisering med Audio Generate-appen.
  he: יצירת אפקט קולי קצר של התראת הצלחה באמצעות מיומנות האפליקציה Audio Generate.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Generate a Confirmation Tick Sound. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "@skill:audio:generate Create a crisp, friendly confirmation tick sound effect for a completed OpenMates task. Keep it short, clean, and suitable for a success notification."
  de: "@skill:audio:generate Erstelle einen klaren, freundlichen Bestätigungs-Tick-Soundeffekt für eine abgeschlossene OpenMates-Aufgabe. Halte ihn kurz, sauber und passend für eine Erfolgsmeldung."
  zh: "@skill:audio:generate 为已完成的 OpenMates 任务创建一个清脆、友好的确认勾选音效。保持短促、干净，并适用于成功通知。"
  es: "@skill:audio:generate Crea un efecto de sonido de confirmación nítido y agradable para una tarea completada en OpenMates. Que sea corto, limpio y adecuado para una notificación de éxito."
  fr: "@skill:audio:generate Crée un effet sonore de coche de confirmation net et amical pour une tâche OpenMates terminée. Fais en sorte qu'il soit court, propre et adapté à une notification de succès."
  pt: "@skill:audio:generate Cria um efeito sonoro de tique de confirmação nítido e amigável para uma tarefa concluída no OpenMates. Mantém-no curto, limpo e adequado para uma notificação de sucesso."
  ru: "@skill:audio:generate Создай четкий, приятный звук подтверждения для выполненной задачи в OpenMates. Сделай его коротким, чистым и подходящим для уведомления об успехе."
  ja: "@skill:audio:generate OpenMatesのタスク完了用の、歯切れが良く親しみやすい確認チェック音を作成してください。短くクリーンで、成功通知に適したものにしてください。"
  ko: "@skill:audio:generate 완료된 OpenMates 작업을 위한 선명하고 친근한 확인 체크 효과음을 만들어 줘. 짧고 깔끔하며 성공 알림에 적합하게 해 줘."
  it: "@skill:audio:generate Crea un effetto sonoro di conferma (tick) nitido e amichevole per un'attività OpenMates completata. Mantienilo breve, pulito e adatto a una notifica di successo."
  tr: "@skill:audio:generate Tamamlanan bir OpenMates görevi için net, samimi bir onay tıkı ses efekti oluştur. Kısa, temiz ve bir başarı bildirimi için uygun olsun."
  vi: "@skill:audio:generate Tạo một hiệu ứng âm thanh tích xác nhận sắc nét, thân thiện cho một tác vụ OpenMates đã hoàn thành. Hãy giữ cho nó ngắn gọn, sạch sẽ và phù hợp cho một thông báo thành công."
  id: "@skill:audio:generate Buat efek suara centang konfirmasi yang jernih dan ramah untuk tugas OpenMates yang sudah selesai. Buat tetap singkat, bersih, dan cocok untuk notifikasi keberhasilan."
  pl: "@skill:audio:generate Stwórz wyraźny, przyjazny dźwięk potwierdzenia (tyknięcie) dla ukończonego zadania OpenMates. Niech będzie krótki, czysty i odpowiedni dla powiadomienia o sukcesie."
  nl: "@skill:audio:generate Maak een helder, vriendelijk bevestigingsgeluid voor een voltooide OpenMates-taak. Houd het kort, zuiver en geschikt voor een succesmelding."
  ar: "@skill:audio:generate أنشئ تأثيرًا صوتيًا لعلامة تأكيد واضح وودود لمهمة OpenMates مكتملة. اجعله قصيرًا ونقيًا ومناسبًا لإشعار النجاح."
  hi: "@skill:audio:generate पूरे किए गए OpenMates टास्क के लिए एक स्पष्ट, सुखद कन्फर्मेशन टिक साउंड इफेक्ट बनाएं। इसे छोटा, साफ और सफलता के नोटिफिकेशन के लिए उपयुक्त रखें।"
  th: "@skill:audio:generate สร้างเอฟเฟกต์เสียงติ๊กยืนยันที่คมชัดและเป็นมิตรสำหรับงาน OpenMates ที่เสร็จสมบูรณ์ ขอแบบสั้น สะอาด และเหมาะสำหรับการแจ้งเตือนความสำเร็จ"
  cs: "@skill:audio:generate Vytvoř jasný, přátelský zvukový efekt potvrzovacího zaškrtnutí pro dokončený úkol v OpenMates. Udělej ho krátký, čistý a vhodný pro oznámení o úspěchu."
  sv: "@skill:audio:generate Skapa en krispig, vänlig bekräftelse-tick-ljudeffekt för en slutförd OpenMates-uppgift. Håll den kort, ren och lämplig för en framgångsavisering."
  he: "@skill:audio:generate צור אפקט קולי של צליל אישור (tick) חד וידידותי עבור משימת OpenMates שהושלמה. שמור עליו קצר, נקי ומתאים להתראת הצלחה."
  verified_by_human: []

