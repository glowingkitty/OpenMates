  ar: |
    تُعرف الظاهرة التي تصفها باسم تأثير **[الجزيرة الحرارية الحضرية](wiki:Urban_heat_island)** (UHI). في حين أن المدن قد تكون أكثر دفئاً قليلاً خلال النهار، إلا أن الفرق في درجات الحرارة غالباً ما يكون أكثر وضوحاً بعد غروب الشمس - حيث تظل المدن أحياناً أكثر دفئاً من المناطق الريفية المحيطة بها بمقدار يتراوح بين درجتين مئويتين إلى أكثر من 10 درجات مئوية (4 إلى 18 درجة فهرنهايت).

    ---

    ### تشبيه بسيط من الحياة اليومية: مقلاة الحديد الزهر مقابل حوض الحديقة

    تخيل أنك تقف في الخارج في فترة ما بعد الظهر المشمسة ومعك شيئان:
    1. **مقلاة ثقيلة من الحديد الزهر**
    2. **وعاء من تربة الحديقة الرطبة مع العشب**

    خلال فترة ما بعد الظهر الحارة، تضرب الشمس كليهما:
    * تمتص **مقلاة الحديد الزهر** حرارة شديدة، وتصبح ساخنة جداً، وتخزن تلك الطاقة الحرارية داخل جسمها المعدني الكثيف.
    * تمتص **التربة الرطبة والعشب** أيضاً ضوء الشمس، لكن الرطوبة الموجودة في التربة تتبخر والعشب "يعرق" من خلال عملية النتح. تستهلك عملية [النتح التبخيري](wiki:Evapotranspiration) هذه جزءاً كبيراً من طاقة الشمس، مما يحافظ على برودة النبات والتربة بشكل ملحوظ.

    الآن، خذهما إلى الداخل إلى غرفة باردة أو انتظر حتى حلول الليل:
    * يبرد حوض الحديقة على الفور تقريباً لأنه لم يحتفظ بحرارة زائدة ويستمر في فقدان الرطوبة.
    * أما مقلاة الحديد الزهر، فتعمل كـ **بطارية حرارية**. فبعد فترة طويلة من غروب الشمس، تشع ببطء كل تلك الحرارة المحتبسة في الهواء المحيط، مما يحافظ على دفء المكان المباشر لساعات.

    تعمل **المدينة** مثل الملايين من مقالي الحديد الزهر المترابطة؛ بينما تتصرف **المناطق الريفية** مثل حوض الحديقة الرطب.

    ---

    ### العلم وراء بقاء المدن ساخنة في الليل

    يعود التفاوت الليلي إلى عدة عوامل ديناميكية حرارية وفيزيائية رئيسية:

    #### 1. الكتلة الحرارية العالية (الاحتفاظ بالحرارة)
    تُبنى البيئات الحضرية من الأسفلت والخرسانة والطوب والحجر. تتمتع هذه المواد بـ [سعة حرارية حجمية](wiki:Volumetric_heat_capacity) وموصلية حرارية عالية. خلال النهار، تمتص الإشعاع الشمسي بعمق في الهياكل والأرصفة. وفي الليل، عندما يبرد الهواء المحيط، تطلق هذه المواد تلك الحرارة المخزنة مرة أخرى إلى الغلاف الجوي السفلي عبر الإشعاع الحراري طويل الموجة.

    #### 2. فقدان التبريد بالتبخير
    تتغطى المناظر الطبيعية الريفية بالأشجار والمحاصيل والتربة الرطبة. تسحب النباتات الماء من الأرض وتطلق بخار الماء في الهواء من خلال النتح. ولأن تحويل الماء السائل إلى بخار يتطلب كمية كبيرة من الطاقة ([الحرارة الكامنة](wiki:Latent_heat) للتبخر)، فإن هذا يبرد البيئة المحيطة بشكل طبيعي. في المدن، يتم توجيه مياه الأمطار بسرعة إلى مصارف العواصف عبر الأسطح غير المنفذة، مما يترك القليل جداً من الرطوبة المتاحة للتبريد بالتبخير.

    #### 3. هندسة الأودية الحضرية
    في المدن الكثيفة ذات المباني الشاهقة، تشكل الشوارع "أودية حضرية". خلال النهار، تعكس الأسطح المتعددة ضوء الشمس بشكل أعمق في الشارع بدلاً من عكسه مرة أخرى إلى الفضاء. وفي الليل، تحجب المباني السماء جزئياً (مما يقلل مما يسميه علماء الأرصاد الجوية عامل رؤية السماء). وبدلاً من الهروب بحرية إلى الغلاف الجوي العلوي، يتم امتصاص الحرارة المشعة من الشارع أو عكسها مرة أخرى بواسطة جدران المباني المجاورة.

    #### 4. الحرارة بشرية المنشأ (الطاقة الناتجة عن الإنسان)
    تنتج المدن باستمرار حرارتها الخاصة بشكل مستقل عن الشمس. فوحدات تكييف الهواء، ومحركات المركبات، ومراكز البيانات، والمصانع، وإضاءة المباني، كلها تطرد الحرارة المهدرة مباشرة إلى الغلاف الجوي على مستوى الشارع، مما يعزز الدفء الليلي.

    ---

    ### التخفيف من هذا التأثير

    غالباً ما يتبنى المجتمعات والمخططون الحضريون استراتيجيات تواجه هذه الآليات:
    * **الأرصفة والأسطح الباردة:** استخدام طلاءات ذات [ألبيدو](wiki:Albedo) عالٍ (قدرة انعكاس عالية) بحيث تعكس الأسطح ضوء الشمس بدلاً من امتصاصه.
    * **التشجير الحضري والمظلات الشجرية:** زراعة أشجار الشوارع وإنشاء المتنزهات لاستعادة الظل والنتح التبخيري.
    * **الأسطح الخضراء:** تركيب غطاء نباتي على أسطح المنازل لعزل المباني وتبريد المناخ المحلي.

