    ### Giảm thiểu hiệu ứng

    Các cộng đồng và nhà quy hoạch đô thị thường áp dụng các chiến lược để chống lại các cơ chế này:
    * **Vỉa hè & Mái nhà mát:** Sử dụng các lớp phủ có [suất phản chiếu](wiki:Albedo) (albedo) cao để các bề mặt phản xạ ánh sáng mặt trời thay vì hấp thụ nó.
    * **Phủ xanh đô thị & Tán cây:** Trồng cây xanh trên đường phố và tạo ra các công viên để khôi phục bóng mát và quá trình thoát hơi nước.
    * **Mái nhà xanh:** Trồng cây trên mái nhà để cách nhiệt cho các tòa nhà và làm mát vi khí hậu địa phương.

