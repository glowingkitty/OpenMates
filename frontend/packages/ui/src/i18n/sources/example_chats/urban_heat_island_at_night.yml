  hi: |
    तुम जिस घटना का वर्णन कर रहे हो उसे **[शहरी ऊष्मा द्वीप](wiki:Urban_heat_island)** (UHI) प्रभाव के रूप में जाना जाता है। हालांकि दिन के दौरान शहर थोड़े अधिक गर्म हो सकते हैं, लेकिन तापमान का अंतर अक्सर सूर्यास्त के बाद सबसे अधिक स्पष्ट होता है—कभी-कभी शहरों को आसपास के ग्रामीण इलाकों की तुलना में 2°C से 10°C (4°F से 18°F) तक अधिक गर्म रखता है।

    ---

    ### एक सरल रोज़मर्रा का उदाहरण: लोहे की कड़ाही बनाम बगीचे की क्यारी

    कल्पना करो कि तुम धूप वाली दोपहर में दो चीज़ों के साथ बाहर खड़े हो:
    1. एक **भारी लोहे की कड़ाही**
    2. **घास के साथ नम मिट्टी का एक गमला**

    एक गर्म दोपहर के दौरान, सूरज की रोशनी दोनों पर पड़ती है:
    * **लोहे की कड़ाही** तीव्र गर्मी को सोख लेती है, बहुत गर्म हो जाती है, और उस तापीय ऊर्जा को अपने घने धातु के शरीर के अंदर जमा कर लेती है।
    * **नम मिट्टी और घास** भी सूरज की रोशनी को सोखते हैं, लेकिन मिट्टी की नमी वाष्पित हो जाती है और घास वाष्पोत्सर्जन (transpiration) के माध्यम से "पसीना" छोड़ती है। [वाष्पोत्सर्जन](wiki:Evapotranspiration) की वह प्रक्रिया सूरज की ऊर्जा के एक बड़े हिस्से का उपयोग करती है, जिससे पौधे और मिट्टी काफी ठंडे रहते हैं।

    अब, दोनों को ठंडे कमरे के अंदर ले जाओ या रात होने तक प्रतीक्षा करो:
    * बगीचे की क्यारी लगभग तुरंत ठंडी हो जाती है क्योंकि उसने अतिरिक्त गर्मी को रोक कर नहीं रखा था और वह नमी खोना जारी रखती है।
    * हालांकि, लोहे की कड़ाही एक **थर्मल बैटरी** की तरह काम करती है। सूरज ढलने के काफी समय बाद भी, यह उस सारी फंसी हुई गर्मी को धीरे-धीरे आसपास की हवा में छोड़ती है, जिससे आसपास की जगह घंटों तक गर्म रहती है।

    एक **शहर** लाखों आपस में जुड़ी लोहे की कड़ाही की तरह काम करता है; **ग्रामीण इलाका** नम बगीचे की क्यारी की तरह व्यवहार करता है।

    ---

    ### रात में शहरों के गर्म रहने के पीछे का विज्ञान

    रात के समय का यह अंतर कई प्रमुख ऊष्मप्रवैगिकी (thermodynamic) और भौतिक कारकों पर निर्भर करता है:

    #### 1. उच्च तापीय द्रव्यमान (गर्मी प्रतिधारण)
    शहरी वातावरण डामर, कंक्रीट, ईंट और पत्थर से बने होते हैं। इन सामग्रियों में उच्च [आयतनिक ऊष्मा क्षमता](wiki:Volumetric_heat_capacity) और तापीय चालकता होती है। दिन के दौरान, वे सौर विकिरण को संरचनाओं और फुटपाथों की गहराई तक सोख लेते हैं। रात में, जैसे-जैसे आसपास की हवा ठंडी होती है, ये सामग्रियां उस जमा गर्मी को लंबी तरंग वाले तापीय विकिरण के माध्यम से वापस निचले वायुमंडल में छोड़ती हैं।

    #### 2. वाष्पीकरणीय शीतलन की कमी
    ग्रामीण परिदृश्य पेड़ों, फसलों और नम मिट्टी से ढके होते हैं। पौधे जमीन से पानी खींचते हैं और वाष्पोत्सर्जन के माध्यम से हवा में जलवाष्प छोड़ते हैं। चूंकि तरल पानी को वाष्प में बदलने के लिए महत्वपूर्ण मात्रा में ऊर्जा ([वाष्पीकरण की गुप्त ऊष्मा](wiki:Latent_heat)) की आवश्यकता होती है, यह स्वाभाविक रूप से आसपास के वातावरण को ठंडा करता है। शहरों में, बारिश का पानी अभेद्य सतहों के माध्यम से जल्दी से नालों में चला जाता है, जिससे वाष्पीकरणीय शीतलन के लिए बहुत कम नमी बचती है।

    #### 3. शहरी कैन्यन ज्यामिति
    ऊंची इमारतों वाले घने शहरों में, सड़कें "शहरी कैन्यन" बनाती हैं। दिन के दौरान, कई परावर्तक सतहें सूरज की रोशनी को अंतरिक्ष में वापस भेजने के बजाय सड़क की गहराई में उछालती हैं। रात में, इमारतें आंशिक रूप से आकाश को अवरुद्ध कर देती हैं (जिसे मौसम विज्ञानी 'स्काई व्यू फैक्टर' कहते हैं)। ऊपरी वायुमंडल में स्वतंत्र रूप से बाहर निकलने के बजाय, सड़क से निकलने वाली गर्मी बगल की इमारतों की दीवारों द्वारा सोख ली जाती है या वापस परावर्तित हो जाती है।

    #### 4. मानवजनित ऊष्मा (मानव-जनित ऊर्जा)
    शहर सूरज से स्वतंत्र रूप से अपनी गर्मी पैदा करते रहते हैं। एयर कंडीशनिंग यूनिट, वाहनों के इंजन, डेटा सेंटर, कारखाने और इमारतों की लाइटिंग सभी बेकार गर्मी को सीधे सड़क-स्तर के वायुमंडल में छोड़ते हैं, जिससे रात की गर्मी और बढ़ जाती है।

    ---

    ### प्रभाव को कम करना

    समुदाय और शहरी योजनाकार अक्सर ऐसी रणनीतियां अपनाते हैं जो इन तंत्रों का मुकाबला करती हैं:
    * **ठंडे फुटपाथ और छतें:** उच्च-[एल्बेडो](wiki:Albedo) (परावर्तक) कोटिंग्स का उपयोग करना ताकि सतहें सूरज की रोशनी को सोखने के बजाय परावर्तित करें।
    * **शहरी हरियाली और पेड़ों की छतरी:** छाया और वाष्पोत्सर्जन को बहाल करने के लिए सड़कों के किनारे पेड़ लगाना और पार्क बनाना।
    * **ग्रीन रूफ (हरियाली वाली छतें):** इमारतों को इंसुलेट करने और स्थानीय सूक्ष्म जलवायु को ठंडा करने के लिए छतों पर वनस्पति लगाना।

