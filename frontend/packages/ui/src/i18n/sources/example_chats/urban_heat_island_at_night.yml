  pl: |
    Opisywane przez Ciebie zjawisko jest znane jako **[miejska wyspa ciepła](wiki:Urban_heat_island)** (MWC). Choć miasta mogą być nieco cieplejsze w ciągu dnia, różnica temperatur jest często najbardziej wyraźna po zachodzie słońca — czasami sprawiając, że w miastach jest od 2°C do ponad 10°C (4°F do 18°F) cieplej niż na otaczających je terenach wiejskich.

    ---

    ### Prosta analogia z życia codziennego: żeliwna patelnia kontra grządka ogrodowa

    Wyobraź sobie, że stoisz na zewnątrz w słoneczne popołudnie z dwiema rzeczami:
    1. **Ciężką żeliwną patelnią**
    2. **Doniczką z wilgotną ziemią ogrodową i trawą**

    W upalne popołudnie słońce świeci na obie te rzeczy:
    * **Żeliwna patelnia** pochłania intensywne ciepło, staje się parząco gorąca i magazynuje tę energię termiczną wewnątrz swojego gęstego, metalowego korpusu.
    * **Wilgotna gleba i trawa** również pochłaniają światło słoneczne, ale wilgoć w glebie paruje, a trawa „poci się” poprzez transpirację. Ten proces [ewapotranspiracji](wiki:Evapotranspiration) zużywa dużą część energii słonecznej, utrzymując roślinę i glebę w znacznie niższej temperaturze.

    Teraz przenieś obie rzeczy do chłodniejszego pomieszczenia lub poczekaj do zmroku:
    * Grządka ogrodowa ochładza się niemal natychmiast, ponieważ nie zatrzymała nadmiaru ciepła i nadal traci wilgoć.
    * Żeliwna patelnia działa jednak jak **akumulator ciepła**. Długo po zachodzie słońca powoli wypromieniowuje całe to uwięzione ciepło do otaczającego powietrza, utrzymując wysoką temperaturę w najbliższym otoczeniu przez wiele godzin.

    **Miasto** działa jak miliony połączonych ze sobą żeliwnych patelni; **tereny wiejskie** zachowują się jak wilgotna grządka ogrodowa.

    ---

    ### Nauka o tym, dlaczego miasta pozostają gorące w nocy

    Nocna różnica temperatur wynika z kilku kluczowych czynników termodynamicznych i fizycznych:

    #### 1. Wysoka masa termiczna (zatrzymywanie ciepła)
    Środowiska miejskie są zbudowane z asfaltu, betonu, cegły i kamienia. Materiały te mają wysoką [objętościową pojemność cieplną](wiki:Volumetric_heat_capacity) i przewodność cieplną. W ciągu dnia pochłaniają one promieniowanie słoneczne głęboko w struktury i nawierzchnie. W nocy, gdy powietrze otoczenia się ochładza, materiały te oddają zmagazynowane ciepło z powrotem do dolnych warstw atmosfery poprzez długofalowe promieniowanie cieplne.

    #### 2. Utrata chłodzenia przez parowanie
    Krajobrazy wiejskie są pokryte drzewami, uprawami i wilgotną glebą. Rośliny pobierają wodę z ziemi i uwalniają parę wodną do powietrza poprzez transpirację. Ponieważ zamiana wody w stanie ciekłym w parę wymaga znacznej ilości energii ([ciepło utajone](wiki:Latent_heat) parowania), proces ten w naturalny sposób chłodzi otoczenie. W miastach deszcz jest szybko odprowadzany do kanalizacji burzowej przez nieprzepuszczalne powierzchnie, co pozostawia bardzo mało wilgoci dostępnej do chłodzenia ewaporacyjnego.

    #### 3. Geometria miejskich kanionów
    W gęsto zabudowanych miastach z wysokimi budynkami ulice tworzą „miejskie kaniony”. W ciągu dnia liczne powierzchnie odbijające kierują światło słoneczne głębiej w stronę ulicy, zamiast odbijać je z powrotem w przestrzeń kosmiczną. W nocy budynki częściowo przesłaniają niebo (zmniejszając to, co meteorolodzy nazywają współczynnikiem widoczności nieba). Zamiast swobodnie uciekać do górnych warstw atmosfery, ciepło wypromieniowywane z ulicy jest pochłaniane lub odbijane z powrotem przez ściany sąsiednich budynków.

    #### 4. Ciepło antropogeniczne (energia generowana przez człowieka)
    Miasta stale wytwarzają własne ciepło, niezależnie od słońca. Klimatyzatory, silniki pojazdów, centra danych, fabryki i oświetlenie budynków wydzielają ciepło odpadowe bezpośrednio do atmosfery na poziomie ulicy, potęgując nocne ciepło.

    ---

    ### Łagodzenie efektu

    Społeczności i urbaniści często stosują strategie przeciwdziałające tym mechanizmom:
    * **Chłodne nawierzchnie i dachy:** Stosowanie powłok o wysokim [albedo](wiki:Albedo) (odblaskowych), aby powierzchnie odbijały światło słoneczne, zamiast je pochłaniać.
    * **Zieleń miejska i korony drzew:** Sadzenie drzew przy ulicach i tworzenie parków w celu przywrócenia cienia i ewapotranspiracji.
    * **Zielone dachy:** Instalowanie roślinności na dachach w celu izolacji budynków i chłodzenia lokalnego mikroklimatu.

