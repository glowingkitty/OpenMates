    Vill du undersöka hur specifika stadsplaneringsval i ditt närområde påverkar nattkylningen, eller utforska något av ämnena ovan?
  he: |
    התופעה שאתה מתאר ידועה בשם **[אי חום עירוני](wiki:Urban_heat_island)** (UHI). בעוד שערים עשויות להיות חמות מעט יותר במהלך היום, הפרש הטמפרטורות בולט לרוב לאחר השקיעה – לעיתים הערים נשארות חמות בטווח שבין 2°C ליותר מ-10°C (4°F עד 18°F) בהשוואה לאזורים הכפריים שמסביב.

    ---

    ### אנלוגיה פשוטה מחיי היומיום: מחבת ברזל יצוק לעומת ערוגת גינה

    דמיין שאתה עומד בחוץ אחר צהריים שטוף שמש עם שני פריטים:
    1. **מחבת ברזל יצוק כבדה**
    2. **עציץ עם אדמת גינה לחה ודשא**

    במהלך אחר צהריים חם, השמש קופחת על שניהם:
    * **מחבת הברזל היצוק** סופגת חום עז, הופכת לוהטת ואוגרת את האנרגיה התרמית הזו בתוך גוף המתכת הדחוס שלה.
    * **האדמה הלחה והדשא** סופגים גם הם את אור השמש, אך הלחות באדמה מתאדה והדשא "מזיע" בתהליך של דיות. תהליך זה של [איוודוי-דיות](wiki:Evapotranspiration) צורך חלק גדול מאנרגיית השמש, ושומר על הצמח והאדמה קרירים משמעותית.

    כעת, הכנס את שניהם לחדר קריר יותר או המתן לרדת הלילה:
    * ערוגת הגינה מתקררת כמעט מיד מכיוון שהיא לא אגרה חום עודף וממשיכה לאבד לחות.
    * מחבת הברזל היצוק, לעומת זאת, פועלת כ**סוללה תרמית**. זמן רב לאחר שקיעת השמש, היא מקרינה לאט את כל החום הכלוא הזה לאוויר שמסביב, ושומרת על המרחב המיידי חם במשך שעות.

    **עיר** מתנהגת כמו מיליוני מחבתות ברזל יצוק מחוברות; **האזור הכפרי** מתנהג כמו ערוגת הגינה הלחה.

    ---

    ### המדע שמאחורי הסיבה לכך שערים נשארות חמות בלילה

    הפער הלילי נובע מכמה גורמים תרמודינמיים ופיזיקליים מרכזיים:

    #### 1. מסה תרמית גבוהה (אגירת חום)
    סביבות עירוניות בנויות מאספלט, בטון, לבנים ואבן. לחומרים אלו יש [קיבול חום נפחי](wiki:Volumetric_heat_capacity) ומוליכות תרמית גבוהים. במהלך היום, הם סופגים קרינת שמש עמוק לתוך המבנים והמדרכות. בלילה, כשהאוויר מסביב מתקרר, חומרים אלו משחררים את החום האגור בחזרה לאטמוספירה התחתונה באמצעות קרינה תרמית בגלים ארוכים.

    #### 2. אובדן קירור באידוי
    נופים כפריים מכוסים בעצים, גידולים חקלאיים ואדמה לחה. צמחים שואבים מים מהאדמה ומשחררים אדי מים לאוויר בתהליך של דיות. מכיוון שהפיכת מים נוזליים לאדים דורשת כמות משמעותית של אנרגיה ([חום כמוס](wiki:Latent_heat) של אידוי), הדבר מקרר באופן טבעי את הסביבה. בערים, מי הגשמים מופנים במהירות לניקוז דרך משטחים אטומים, מה שמותיר מעט מאוד לחות זמינה לקירור באידוי.

    #### 3. גיאומטריית "קניון עירוני"
    בערים צפופות עם בניינים גבוהים, הרחובות יוצרים "קניונים עירוניים". במהלך היום, משטחים רפלקטיביים מרובים מחזירים את אור השמש עמוק יותר לתוך הרחוב במקום להחזיר אותו לחלל. בלילה, הבניינים חוסמים חלקית את השמיים (מה שמפחית את מה שמטאורולוגים מכנים "גורם מבט לשמיים"). במקום לברוח בחופשיות לאטמוספירה העליונה, חום המוקרן מהרחוב נספג או מוחזר על ידי קירות הבניינים הסמוכים.

    #### 4. חום אנתרופוגני (אנרגיה הנוצרת על ידי בני אדם)
    ערים מייצרות חום משלהן באופן רציף ללא קשר לשמש. יחידות מיזוג אוויר, מנועי כלי רכב, מרכזי נתונים, מפעלים ותאורת מבנים פולטים כולם חום שיורי ישירות לאטמוספירה בגובה הרחוב, מה שמחזק את החום הלילי.

    ---

    ### מיתון התופעה

    קהילות ומתכנני ערים מאמצים לעיתים קרובות אסטרטגיות שנוגדות את המנגנונים הללו:
    * **מדרכות וגגות קרירים:** שימוש בציפויים בעלי [אלבדו](wiki:Albedo) גבוה (מחזירי אור) כך שמשטחים יחזירו את אור השמש במקום לספוג אותו.
    * **ייעור עירוני וחופת עצים:** נטיעת עצי רחוב ויצירת פארקים כדי להחזיר את הצל ואת תהליך האיוודוי-דיות.
    * **גגות ירוקים:** התקנת צמחייה על גגות כדי לבודד בניינים ולקרר את המיקרו-אקלים המקומי.

