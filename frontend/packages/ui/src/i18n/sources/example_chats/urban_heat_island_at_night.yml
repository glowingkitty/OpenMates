    Fenomén, který popisuješ, je známý jako efekt **[městského tepelného ostrova](wiki:Urban_heat_island)** (UHI). Zatímco během dne mohou být města jen o něco teplejší, teplotní rozdíl je často nejvýraznější po západu slunce – města tak někdy zůstávají o 2 °C až více než 10 °C (4 °F až 18 °F) teplejší než okolní venkovská krajina.

    ---

    ### Jednoduchá analogie z každodenního života: Litinová pánev vs. zahradní záhon

    Představ si, že stojíš venku za slunného odpoledne se dvěma věcmi:
    1. **Těžká litinová pánev**
    2. **Květináč s vlhkou zahradní zeminou a trávou**

    Během horkého odpoledne do obou praží slunce:
    * **Litinová pánev** absorbuje intenzivní teplo, rozpálí se a ukládá tuto tepelnou energii ve svém hustém kovovém těle.
    * **Vlhká půda a tráva** také absorbují sluneční světlo, ale vlhkost v půdě se odpařuje a tráva se „potí“ prostřednictvím transpirace. Tento proces [evapotranspirace](wiki:Evapotranspiration) spotřebovává velkou část sluneční energie, čímž udržuje rostlinu i půdu výrazně chladnější.

    Teď obojí přenes do chladnější místnosti nebo počkej do setmění:
    * Zahradní záhon vychladne téměř okamžitě, protože v sobě neudržel přebytečné teplo a nadále ztrácí vlhkost.
    * Litinová pánev se však chová jako **tepelná baterie**. Dlouho poté, co slunce zapadne, pomalu vyzařuje všechno to zachycené teplo do okolního vzduchu a udržuje bezprostřední prostor teplý po celé hodiny.

    **Město** funguje jako miliony propojených litinových pánví; **venkovská krajina** se chová jako vlhký zahradní záhon.

    ---

    ### Věda v pozadí: Proč města zůstávají v noci horká

    Noční rozdíl je způsoben několika klíčovými termodynamickými a fyzikálními faktory:

    #### 1. Vysoká tepelná setrvačnost (akumulace tepla)
    Městské prostředí je postaveno z asfaltu, betonu, cihel a kamene. Tyto materiály mají vysokou [objemovou tepelnou kapacitu](wiki:Volumetric_heat_capacity) a tepelnou vodivost. Během dne nasávají sluneční záření hluboko do konstrukcí a dlažeb. V noci, když se okolní vzduch ochladí, tyto materiály uvolňují uložené teplo zpět do spodních vrstev atmosféry prostřednictvím dlouhovlnného tepelného záření.

    #### 2. Ztráta ochlazování odpařováním
    Venkovská krajina je pokryta stromy, plodinami a vlhkou půdou. Rostliny čerpají vodu ze země a uvolňují vodní páru do vzduchu prostřednictvím transpirace. Protože přeměna kapalné vody na páru vyžaduje značné množství energie ([skupenské teplo](wiki:Latent_heat) výparné), přirozeně to ochlazuje okolní prostředí. Ve městech je dešťová voda rychle odváděna do kanalizace přes nepropustné povrchy, takže pro ochlazování odpařováním zbývá jen velmi málo vlhkosti.

    #### 3. Geometrie městských kaňonů
    V hustě zastavěných městech s vysokými budovami tvoří ulice „městské kaňony“. Během dne četné reflexní povrchy odrážejí sluneční světlo hlouběji do ulice, místo aby ho odrážely zpět do vesmíru. V noci budovy částečně blokují oblohu (snižují to, co meteorologové nazývají „sky view factor“ neboli faktor výhledu na oblohu). Místo aby teplo vyzařované z ulice volně unikalo do horních vrstev atmosféry, je pohlcováno nebo odráženo zpět stěnami sousedních budov.

    #### 4. Antropogenní teplo (energie generovaná lidmi)
    Města neustále produkují vlastní teplo nezávisle na slunci. Klimatizační jednotky, motory vozidel, datová centra, továrny a osvětlení budov – to vše vypouští odpadní teplo přímo do atmosféry na úrovni ulic, což umocňuje noční teplo.

    ---

    ### Zmírňování efektu

    Komunity a urbanisté často přijímají strategie, které těmto mechanismům čelí:
    * **Chladné dlažby a střechy:** Používání nátěrů s vysokým [albedem](wiki:Albedo) (odrazivostí), aby povrchy sluneční světlo odrážely, místo aby ho pohlcovaly.
    * **Městská zeleň a koruny stromů:** Výsadba pouličních stromů a vytváření parků pro obnovu stínu a evapotranspirace.
    * **Zelené střechy:** Instalace vegetace na střechy za účelem izolace budov a ochlazování místního mikroklimatu.

