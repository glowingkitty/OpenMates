  sv: |
    Fenomenet du beskriver kallas för den **[urbana värmeön](wiki:Urban_heat_island)** (UHI-effekten). Även om städer kan vara något varmare under dagen är temperaturskillnaden ofta som störst efter solnedgången – ibland är städer mellan 2 °C och över 10 °C (4 °F till 18 °F) varmare än den omgivande landsbygden.

    ---

    ### En enkel vardagsliknelse: Gjutjärnspannan mot rabatten

    Föreställ dig att du står utomhus en solig eftermiddag med två saker:
    1. En **tung gjutjärnspanna**
    2. En **kruka med fuktig trädgårdsjord och gräs**

    Under en het eftermiddag gassar solen på båda:
    * **Gjutjärnspannan** absorberar intensiv värme, blir brännhet och lagrar den värmeenergin i sin täta metallkropp.
    * Den **fuktiga jorden och gräset** absorberar också solljus, men fukten i jorden avdunstar och gräset "svettas" genom transpiration. Denna process, [evapotranspiration](wiki:Evapotranspiration), förbrukar en stor del av solenergin, vilket håller växten och jorden betydligt svalare.

    Ta nu in båda i ett svalare rum eller vänta tills mörkret faller:
    * Rabatten svalnar nästan omedelbart eftersom den inte höll kvar någon överskottsvärme och fortsätter att avge fukt.
    * Gjutjärnspannan fungerar däremot som ett **värmebatteri**. Långt efter att solen gått ner strålar den långsamt ut all den instängda värmen i den omgivande luften, vilket håller det närmaste utrymmet varmt i timmar.

    En **stad** fungerar som miljontals sammanlänkade gjutjärnspannor; **landsbygden** beter sig som den fuktiga rabatten.

    ---

    ### Vetenskapen bakom varför städer förblir varma på natten

    Skillnaden nattetid beror på flera viktiga termodynamiska och fysiska faktorer:

    #### 1. Hög termisk massa (värmelagring)
    Stadsmiljöer är byggda av asfalt, betong, tegel och sten. Dessa material har en hög [volymetrisk värmekapacitet](wiki:Volumetric_heat_capacity) och termisk ledningsförmåga. Under dagen suger de upp solstrålning djupt in i strukturer och beläggningar. På natten, när den omgivande luften svalnar, släpper dessa material tillbaka den lagrade värmen till den lägre atmosfären via långvågig värmestrålning.

    #### 2. Förlust av evaporativ kylning
    Landsbygden är täckt av träd, grödor och fuktig jord. Växter suger upp vatten från marken och släpper ut vattenånga i luften genom transpiration. Eftersom det krävs en betydande mängd energi för att omvandla flytande vatten till ånga ([latent värme](wiki:Latent_heat)), kyler detta naturligt ner den omgivande miljön. I städer leds regnvatten snabbt bort till dagvattenbrunnar via ogenomsläppliga ytor, vilket lämnar mycket lite fukt kvar för evaporativ kylning.

    #### 3. Stadsgatans geometri (Urban Canyon)
    I täta städer med höga byggnader bildar gatorna "stadskanjoner". Under dagen studsar solljuset mellan flera reflekterande ytor djupare ner mot gatan istället för att reflekteras ut i rymden. På natten blockerar byggnaderna delvis himlen (vilket minskar det meteorologer kallar "sky view factor"). Istället för att fritt försvinna upp i den övre atmosfären, absorberas eller reflekteras värmen som strålar från gatan av de intilliggande byggnadernas väggar.

    #### 4. Antropogen värme (mänskligt genererad energi)
    Städer producerar kontinuerligt sin egen värme oberoende av solen. Luftkonditioneringsaggregat, fordonsmotorer, datacenter, fabriker och byggnadsbelysning stöter alla ut spillvärme direkt i atmosfären på gatunivå, vilket förstärker nattvärmen.

    ---

    ### Att mildra effekten

    Samhällen och stadsplanerare använder ofta strategier som motverkar dessa mekanismer:
    * **Svala beläggningar och tak:** Användning av beläggningar med högt [albedo](wiki:Albedo) (reflektionsförmåga) så att ytor reflekterar solljus istället för att absorbera det.
    * **Grönare städer och trädkronor:** Plantering av gatuträd och skapande av parker för att återställa skugga och evapotranspiration.
    * **Gröna tak:** Installation av vegetation på tak för att isolera byggnader och kyla ner det lokala mikroklimatet.

