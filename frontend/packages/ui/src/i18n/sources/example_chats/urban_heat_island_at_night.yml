  nl: |
    Het fenomeen dat je beschrijft staat bekend als het **[stedelijk hitte-eiland](wiki:Urban_heat_island)**-effect (UHI). Hoewel steden overdag iets warmer kunnen zijn, is het temperatuurverschil na zonsondergang vaak het grootst – soms blijven steden wel 2°C tot meer dan 10°C (4°F tot 18°F) warmer dan het omliggende platteland.

    ---

    ### Een eenvoudige alledaagse vergelijking: de gietijzeren koekenpan versus het tuinbed

    Stel je voor dat je op een zonnige middag buiten staat met twee voorwerpen:
    1. Een **zware gietijzeren koekenpan**
    2. Een **pot met vochtige tuinaarde en gras**

    Op een hete middag schijnt de zon op beide:
    * De **gietijzeren koekenpan** absorbeert intense hitte, wordt gloeiend heet en slaat die thermische energie op in zijn dichte metalen behuizing.
    * De **vochtige aarde en het gras** absorberen ook zonlicht, maar het vocht in de bodem verdampt en het gras "zweet" door transpiratie. Dat proces van [evapotranspiratie](wiki:Evapotranspiration) verbruikt een groot deel van de zonne-energie, waardoor de plant en de bodem aanzienlijk koeler blijven.

    Breng ze nu naar binnen in een koelere kamer of wacht tot de avond valt:
    * Het tuinbed koelt vrijwel onmiddellijk af omdat het geen overtollige hitte vasthield en vocht blijft verliezen.
    * De gietijzeren koekenpan werkt echter als een **thermische batterij**. Lang nadat de zon onder is, straalt hij langzaam al die opgeslagen hitte uit naar de omringende lucht, waardoor de directe omgeving urenlang warm blijft.

    Een **stad** gedraagt zich als miljoenen onderling verbonden gietijzeren koekenpannen; het **platteland** gedraagt zich als het vochtige tuinbed.

    ---

    ### De wetenschap achter waarom steden 's nachts warm blijven

    Het verschil in de nacht komt voort uit verschillende belangrijke thermodynamische en fysieke factoren:

    #### 1. Hoge thermische massa (warmtebehoud)
    Stedelijke omgevingen zijn opgebouwd uit asfalt, beton, baksteen en steen. Deze materialen hebben een hoge [volumetrische warmtecapaciteit](wiki:Volumetric_heat_capacity) en thermische geleidbaarheid. Overdag nemen ze zonnestraling diep op in structuren en wegdekken. 's Nachts, als de omgevingslucht afkoelt, geven deze materialen die opgeslagen hitte weer af aan de lagere atmosfeer via langgolvige thermische straling.

    #### 2. Verlies van verdampingskoeling
    Het platteland is bedekt met bomen, gewassen en vochtige bodem. Planten onttrekken water aan de grond en geven waterdamp af aan de lucht via transpiratie. Omdat het omzetten van vloeibaar water in damp een aanzienlijke hoeveelheid energie vereist (de [latente warmte](wiki:Latent_heat) van verdamping), koelt dit de omgeving op natuurlijke wijze af. In steden wordt regenwater via ondoordringbare oppervlakken snel afgevoerd naar het riool, waardoor er weinig vocht beschikbaar blijft voor verdampingskoeling.

    #### 3. Geometrie van stedelijke canyons
    In dichtbebouwde steden met hoge gebouwen vormen straten "stedelijke canyons". Overdag weerkaatsen meerdere reflecterende oppervlakken het zonlicht dieper de straat in in plaats van het terug de ruimte in te sturen. 's Nachts blokkeren de gebouwen de hemel gedeeltelijk (wat meteorologen de *sky view factor* noemen). In plaats van vrij te ontsnappen naar de hogere atmosfeer, wordt de hitte die door de straat wordt uitgestraald geabsorbeerd of teruggekaatst door de muren van aangrenzende gebouwen.

    #### 4. Antropogene hitte (door mensen gegenereerde energie)
    Steden produceren continu hun eigen hitte, onafhankelijk van de zon. Airconditioners, voertuigmotoren, datacenters, fabrieken en gebouwverlichting stoten allemaal restwarmte rechtstreeks uit in de atmosfeer op straatniveau, wat de nachtelijke warmte versterkt.

    ---

    ### Het effect verzachten

    Gemeenten en stedenbouwkundigen passen vaak strategieën toe om deze mechanismen tegen te gaan:
    * **Koele wegdekken en daken:** Het gebruik van coatings met een hoog [albedo](wiki:Albedo) (reflectievermogen), zodat oppervlakken zonlicht reflecteren in plaats van absorberen.
    * **Stedelijk groen en bladerdak:** Het planten van straatbomen en het aanleggen van parken om schaduw en evapotranspiratie te herstellen.
    * **Groene daken:** Het aanbrengen van vegetatie op daken om gebouwen te isoleren en het lokale microklimaat te koelen.

