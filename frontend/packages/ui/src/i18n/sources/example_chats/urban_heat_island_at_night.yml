    Hiện tượng mà bạn đang mô tả được gọi là hiệu ứng **[đảo nhiệt đô thị](wiki:Urban_heat_island)** (UHI). Mặc dù các thành phố có thể ấm hơn một chút vào ban ngày, nhưng sự chênh lệch nhiệt độ thường rõ rệt nhất sau khi mặt trời lặn—đôi khi khiến các thành phố ấm hơn vùng nông thôn xung quanh từ 2°C đến hơn 10°C (4°F đến 18°F).

    ---

    ### Một ví dụ so sánh đơn giản hàng ngày: Chảo gang so với Luống vườn

    Hãy tưởng tượng bạn đang đứng ngoài trời vào một buổi chiều nắng với hai vật dụng:
    1. Một chiếc **chảo gang nặng**
    2. Một **chậu đất vườn ẩm có cỏ**

    Vào một buổi chiều nóng nực, mặt trời chiếu xuống cả hai:
    * **Chiếc chảo gang** hấp thụ nhiệt lượng mạnh mẽ, trở nên nóng bỏng và lưu trữ năng lượng nhiệt đó bên trong khối kim loại đặc của nó.
    * **Đất ẩm và cỏ** cũng hấp thụ ánh nắng mặt trời, nhưng độ ẩm trong đất bay hơi và cỏ "đổ mồ hôi" thông qua quá trình thoát hơi nước. Quá trình [thoát hơi nước](wiki:Evapotranspiration) đó tiêu thụ một phần lớn năng lượng mặt trời, giúp cây và đất mát hơn đáng kể.

    Bây giờ, hãy mang cả hai vào một căn phòng mát hơn hoặc đợi cho đến khi màn đêm buông xuống:
    * Luống vườn hạ nhiệt gần như ngay lập tức vì nó không giữ lại nhiệt thừa và tiếp tục mất đi độ ẩm.
    * Tuy nhiên, chiếc chảo gang lại hoạt động như một **viên pin nhiệt**. Rất lâu sau khi mặt trời lặn, nó từ từ tỏa toàn bộ lượng nhiệt bị giữ lại đó vào không khí xung quanh, giữ cho không gian ngay sát nó ấm áp trong nhiều giờ.

    Một **thành phố** hoạt động giống như hàng triệu chiếc chảo gang kết nối với nhau; **vùng nông thôn** thì hoạt động giống như luống vườn ẩm ướt.

    ---

    ### Khoa học đằng sau lý do tại sao các thành phố vẫn nóng vào ban đêm

    Sự chênh lệch vào ban đêm bắt nguồn từ một số yếu tố nhiệt động lực học và vật lý then chốt:

    #### 1. Khối lượng nhiệt cao (Khả năng giữ nhiệt)
    Môi trường đô thị được xây dựng từ nhựa đường, bê tông, gạch và đá. Những vật liệu này có [nhiệt dung thể tích](wiki:Volumetric_heat_capacity) và độ dẫn nhiệt cao. Ban ngày, chúng hấp thụ bức xạ mặt trời sâu vào các cấu trúc và vỉa hè. Ban đêm, khi không khí xung quanh nguội đi, các vật liệu này giải phóng lượng nhiệt dự trữ đó trở lại tầng khí quyển thấp thông qua bức xạ nhiệt sóng dài.

    #### 2. Mất đi sự làm mát do bay hơi
    Cảnh quan nông thôn được bao phủ bởi cây cối, hoa màu và đất ẩm. Thực vật hút nước từ lòng đất và giải phóng hơi nước vào không khí thông qua quá trình thoát hơi nước. Vì việc chuyển đổi nước lỏng thành hơi nước đòi hỏi một lượng năng lượng đáng kể ([ẩn nhiệt](wiki:Latent_heat) hóa hơi), điều này làm mát môi trường xung quanh một cách tự nhiên. Ở các thành phố, nước mưa nhanh chóng được dẫn vào cống thoát nước thông qua các bề mặt không thấm nước, để lại rất ít độ ẩm cho quá trình làm mát bằng bay hơi.

    #### 3. Hình học hẻm núi đô thị
    Trong các thành phố đông đúc với những tòa nhà cao tầng, các con phố tạo thành những "hẻm núi đô thị". Ban ngày, nhiều bề mặt phản chiếu làm ánh sáng mặt trời dội sâu hơn xuống đường phố thay vì phản xạ ngược lại không gian. Ban đêm, các tòa nhà che khuất một phần bầu trời (làm giảm cái mà các nhà khí tượng học gọi là hệ số góc nhìn bầu trời). Thay vì thoát ra ngoài khí quyển tầng cao một cách tự do, nhiệt tỏa ra từ đường phố bị các bức tường của các tòa nhà liền kề hấp thụ hoặc phản xạ ngược lại.

    #### 4. Nhiệt nhân tạo (Năng lượng do con người tạo ra)
    Các thành phố liên tục tạo ra nhiệt riêng độc lập với mặt trời. Các thiết bị điều hòa không khí, động cơ xe cộ, trung tâm dữ liệu, nhà máy và hệ thống chiếu sáng tòa nhà đều thải nhiệt thừa trực tiếp vào bầu khí quyển ở tầng mặt đường, làm tăng thêm sự ấm áp vào ban đêm.

