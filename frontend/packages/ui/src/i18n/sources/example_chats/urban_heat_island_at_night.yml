    ปรากฏการณ์ที่คุณกำลังอธิบายอยู่นี้เรียกว่า **[เกาะความร้อนเมือง](wiki:Urban_heat_island)** (urban heat island หรือ UHI) แม้ว่าในตอนกลางวันเมืองอาจจะร้อนกว่าเพียงเล็กน้อย แต่ความแตกต่างของอุณหภูมิมักจะเห็นได้ชัดเจนที่สุดหลังพระอาทิตย์ตกดิน โดยบางครั้งเมืองอาจมีอุณหภูมิสูงกว่าพื้นที่ชนบทโดยรอบตั้งแต่ 2°C ไปจนถึงมากกว่า 10°C (4°F ถึง 18°F)

