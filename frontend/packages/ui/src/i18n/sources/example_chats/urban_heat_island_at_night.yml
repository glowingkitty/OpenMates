  es: |
    El fenómeno que describes se conoce como el efecto de **[isla de calor urbana](wiki:Urban_heat_island)** (ICU). Aunque las ciudades pueden ser ligeramente más cálidas durante el día, la diferencia de temperatura suele ser más pronunciada después de la puesta del sol; a veces, las ciudades se mantienen entre 2 °C y más de 10 °C (4 °F a 18 °F) por encima de las zonas rurales circundantes.

    ---

    ### Una analogía sencilla: La sartén de hierro fundido frente al lecho de jardín

    Imagina que estás fuera en una tarde soleada con dos objetos:
    1. Una **sartén pesada de hierro fundido**
    2. Una **maceta con tierra de jardín húmeda y hierba**

    Durante una tarde calurosa, el sol calienta ambos:
    * La **sartén de hierro fundido** absorbe un calor intenso, se pone ardiendo y almacena esa energía térmica dentro de su denso cuerpo metálico.
    * La **tierra húmeda y la hierba** también absorben la luz solar, pero la humedad de la tierra se evapora y la hierba "suda" a través de la transpiración. Ese proceso de [evapotranspiración](wiki:Evapotranspiration) consume una gran parte de la energía del sol, manteniendo la planta y la tierra significativamente más frescas.

    Ahora, llévalos dentro de una habitación fresca o espera a que anochezca:
    * El lecho de jardín se enfría casi de inmediato porque no retuvo el exceso de calor y sigue perdiendo humedad.
    * La sartén de hierro fundido, sin embargo, actúa como una **batería térmica**. Mucho después de que el sol se pone, irradia lentamente todo ese calor atrapado al aire circundante, manteniendo el espacio inmediato caliente durante horas.

    Una **ciudad** actúa como millones de sartenes de hierro fundido interconectadas; el **campo** se comporta como el lecho de jardín húmedo.

    ---

    ### La ciencia de por qué las ciudades se mantienen calientes por la noche

    La disparidad nocturna se debe a varios factores termodinámicos y físicos clave:

    #### 1. Alta masa térmica (retención de calor)
    Los entornos urbanos están construidos con asfalto, hormigón, ladrillo y piedra. Estos materiales tienen una alta [capacidad calorífica volumétrica](wiki:Volumetric_heat_capacity) y conductividad térmica. Durante el día, absorben la radiación solar profundamente en las estructuras y pavimentos. Por la noche, a medida que el aire ambiente se enfría, estos materiales liberan ese calor almacenado de vuelta a la atmósfera baja a través de radiación térmica de onda larga.

    #### 2. Pérdida de enfriamiento por evaporación
    Los paisajes rurales están cubiertos de árboles, cultivos y suelo húmedo. Las plantas extraen agua del suelo y liberan vapor de agua al aire mediante la transpiración. Dado que convertir agua líquida en vapor requiere una cantidad significativa de energía (el [calor latente](wiki:Latent_heat) de vaporización), esto enfría de forma natural el entorno circundante. En las ciudades, la lluvia se desvía rápidamente hacia los desagües pluviales a través de superficies impermeables, dejando muy poca humedad disponible para el enfriamiento por evaporación.

    #### 3. Geometría de cañones urbanos
    En ciudades densas con edificios altos, las calles forman "cañones urbanos". Durante el día, múltiples superficies reflectantes rebotan la luz solar hacia el fondo de la calle en lugar de reflejarla de vuelta al espacio. Por la noche, los edificios bloquean parcialmente el cielo (reduciendo lo que los meteorólogos llaman el factor de visión del cielo). En lugar de escapar libremente hacia la atmósfera superior, el calor irradiado desde la calle es absorbido o reflejado de nuevo por las paredes de los edificios adyacentes.

    #### 4. Calor antropogénico (energía generada por el ser humano)
    Las ciudades producen continuamente su propio calor independientemente del sol. Las unidades de aire acondicionado, los motores de los vehículos, los centros de datos, las fábricas y la iluminación de los edificios expulsan calor residual directamente a la atmósfera a nivel de calle, reforzando el calor nocturno.

    ---

    ### Mitigación del efecto

    Las comunidades y los planificadores urbanos suelen adoptar estrategias para contrarrestar estos mecanismos:
    * **Pavimentos y techos fríos:** Uso de revestimientos con alto [albedo](wiki:Albedo) (reflectantes) para que las superficies reflejen la luz solar en lugar de absorberla.
    * **Reforestación urbana y copas de árboles:** Plantar árboles en las calles y crear parques para restaurar la sombra y la evapotranspiración.
    * **Techos verdes:** Instalación de vegetación en las azoteas para aislar los edificios y enfriar el microclima local.

