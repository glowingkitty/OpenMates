    Fenomena yang kamu jelaskan dikenal sebagai efek **[pulau panas perkotaan](wiki:Urban_heat_island)** (UHI). Meskipun kota bisa sedikit lebih hangat di siang hari, perbedaan suhunya sering kali paling terasa setelah matahari terbenam—terkadang membuat kota lebih hangat antara 2°C hingga lebih dari 10°C (4°F hingga 18°F) dibandingkan pedesaan di sekitarnya.

