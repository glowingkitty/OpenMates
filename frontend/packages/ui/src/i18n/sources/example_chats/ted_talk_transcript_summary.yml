    La vidéo est la présentation TEDx satirique de Will Stephen, « *How to sound smart in your TEDx Talk* » (voir la conférence).

    Plutôt que de donner une conférence informative, Stephen utilise le méta-humour pour déconstruire les conventions de l'[art oratoire](wiki:Public_speaking) lors des discours d'ouverture. Voici l'argument central résumé en cinq points :

    * **La prestation crée l'illusion de la substance :** Le rythme, les gestes délibérés des mains, le contact visuel dramatique et les accessoires physiques (comme des lunettes sans correction) peuvent convaincre un public qu'un orateur est brillant, même s'il n'a rien de valable à dire.
    * **Le rapport avec le public suit des formules précises :** Les tropes interactifs familiers — comme poser des questions rhétoriques, demander de lever la main et proposer des anecdotes d'autodérision — sont des mises en scène calculées pour fabriquer une chaleur et une crédibilité artificielles.
    * **Les visuels de données confèrent une autorité indue :** Afficher des chiffres aléatoires, de l'arithmétique de base et des graphiques sans contexte exploite les biais visuels, donnant à une présentation l'apparence d'une recherche rigoureuse même lorsque les données sont totalement non pertinentes.
    * **Le public projette du sens sur le non-sens :** En associant une cadence vocale sérieuse et des images d'archives évocatrices à du charabia pur, les orateurs peuvent inciter les auditeurs à chercher inconsciemment — et à imaginer — des liens profonds là où il n'en existe aucun.
    * **Les crescendos émotionnels peuvent être fabriqués :** Augmenter l'intensité vocale, ralentir pour chuchoter et faire des pauses dramatiques imitent le rythme d'une épiphanie, prouvant avec quelle facilité la sensation d'inspiration peut être orchestrée sans aucune réflexion sous-jacente.
