    Это видео — сатирическое выступление Уилла Стивена на TEDx под названием *«How to sound smart in your TEDx Talk»* (смотреть выступление).

    Вместо того чтобы читать информативную лекцию, Стивен использует мета-юмор для деконструкции канонов [публичных выступлений](wiki:Public_speaking). Вот основные тезисы, изложенные в пяти пунктах:

    * **Подача создает иллюзию содержательности:** Темп речи, выверенная жестикуляция, драматичный зрительный контакт и реквизит (например, очки без диоптрий) могут убедить аудиторию в гениальности спикера, даже если ему совершенно нечего сказать.
    * **Установление контакта с залом глубоко шаблонно:** Знакомые интерактивные приемы — риторические вопросы, просьбы поднять руки и самоироничные анекдоты — это просчитанные сценические уловки, призванные создать искусственную атмосферу теплоты и доверия.
    * **Визуализация данных дает незаслуженный авторитет:** Демонстрация случайных чисел, простых арифметических действий и графиков без контекста эксплуатирует когнитивные искажения, придавая презентации вид глубокого исследования, даже если данные не имеют никакого значения.
    * **Аудитория проецирует смысл на бессмыслицу:** Сочетая серьезную интонацию и выразительные стоковые изображения с откровенной чепухой, ораторы заставляют слушателей подсознательно искать — и воображать — глубокие связи там, где их нет.
    * **Эмоциональную кульминацию можно сфабриковать:** Наращивание громкости, переход на шепот и драматические паузы имитируют ритм озарения, доказывая, как легко можно вызвать чувство вдохновения без какой-либо реальной идеи.
