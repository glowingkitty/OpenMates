    यह वीडियो विल स्टीफन की व्यंग्यात्मक TEDx प्रस्तुति है, *"How to sound smart in your TEDx Talk"* (टॉक देखें)।

    एक सूचनात्मक व्याख्यान देने के बजाय, स्टीफन मुख्य भाषण [सार्वजनिक भाषण](wiki:Public_speaking) की परंपराओं को समझने के लिए मेटा-ह्यूमर का उपयोग करते हैं। यहाँ मुख्य तर्क को पाँच बिंदुओं में संक्षेपित किया गया है:

    * **प्रस्तुति सार का भ्रम पैदा करती है:** बोलने की गति, जानबूझकर किए गए हाथों के इशारे, नाटकीय आई-कॉन्टैक्ट और भौतिक प्रॉप्स (जैसे बिना नंबर वाले चश्मे) दर्शकों को यह विश्वास दिला सकते हैं कि वक्ता प्रतिभाशाली है, भले ही उनके पास कहने के लिए कुछ भी सार्थक न हो।
    * **मंच पर तालमेल अत्यधिक औपचारिक होता है:** परिचित संवादात्मक तरीके—जैसे अलंकारिक प्रश्न पूछना, हाथ उठाने के लिए कहना, और आत्म-हीनता वाले किस्से सुनाना—सोची-समझी मंच कला है जिसे कृत्रिम गर्मजोशी और विश्वसनीयता पैदा करने के लिए डिज़ाइन किया गया है।
    * **डेटा विजुअल्स अनर्जित अधिकार प्रदान करते हैं:** यादृच्छिक संख्याएँ, बुनियादी अंकगणित और संदर्भ-रहित चार्ट दिखाना विजुअल पूर्वाग्रह का फायदा उठाता है, जिससे प्रस्तुति पूरी तरह से शोधित लगती है, भले ही डेटा पूरी तरह से अप्रासंगिक हो।
    * **दर्शक बकवास में भी अर्थ ढूँढ लेते हैं:** गंभीर स्वर और विचारोत्तेजक स्टॉक छवियों को शाब्दिक बकवास के साथ जोड़कर, वक्ता श्रोताओं को अवचेतन रूप से उन गहरे संबंधों को खोजने—और कल्पना करने—के लिए प्रेरित कर सकते हैं जो वास्तव में मौजूद नहीं हैं।
    * **भावनात्मक चरम सीमाएँ कृत्रिम रूप से बनाई जा सकती हैं:** आवाज की तीव्रता बढ़ाना, फुसफुसाने के लिए धीमा होना और नाटकीय रूप से रुकना एक आत्मज्ञान की लय की नकल करते हैं, जो यह साबित करता है कि बिना किसी अंतर्दृष्टि के प्रेरणा की भावना को कितनी आसानी से तैयार किया जा सकता है।
  th: |
    ```json
    {"type":"app_skill_use","embed_id":"afd1d285-87e3-4f28-9d29-25bf5b74b0a0","app_id":"videos","skill_id":"get_transcript"}
