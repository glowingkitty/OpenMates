    Mit **Spinat, Karotten, Paprika und Kichererbsen** hast du eine solide Basis für köstliche, ballaststoffreiche vegetarische Mahlzeiten. 

    Hier sind drei verschiedene kulinarische Richtungen, je nachdem, worauf du gerade Lust hast:

    ---

    ### 1. Frisch & knackig: Gehackter Salat nach thailändischer Art
    Wenn du etwas Schnelles, Leichtes und Knackiges möchtest, kombiniere fein gehackte rohe Paprika, Karotten und Spinat mit Kichererbsen in einem würzigen [Erdnuss](wiki:Peanut)-Limetten-Dressing.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Herzhafte Bratlinge: Knusprige Kichererbsen-Gemüse-Puffer
    Wenn du etwas Warmes und Häppchengroßes möchtest (toll in Wraps, Pitabrot oder mit einem Joghurt-Dip), zerdrücke die Kichererbsen und mische fein gewürfelte Karotten, Paprika und zusammengefallenen Spinat unter.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Schnelle Alternative für unter der Woche: Warmes Kichererbsen-Gemüse-Pfannencurry
    Wenn du ein One-Pot-Gericht aus einfachen Vorratszutaten (wie Kokosmilch aus der Dose oder stückigen Tomaten) möchtest:
    1. **Aromen anbraten:** Erhitze Olivenöl in einer Pfanne und dünste gewürfelte Zwiebeln, gehackten Knoblauch und Ingwer an, bis sie duften.
    2. **Das feste Gemüse hinzufügen:** Schneide die Karotten und Paprika in mundgerechte Stücke. Gib sie zusammen mit gemahlenem Kreuzkümmel, [Kurkuma](wiki:Turmeric) und einer Prise Chilipulver oder Currypulver hinzu.
    3. **Köcheln lassen:** Gib die abgespülten Kichererbsen zusammen mit einer Tasse Gemüsebrühe oder Kokosmilch hinzu. Decke die Pfanne ab und lass alles 10–12 Minuten köcheln, bis die Karotten weich sind.
    4. **Spinat unterheben:** Hebe den frischen Spinat ganz am Ende für 1–2 Minuten unter, bis er leuchtend grün und zusammengefallen ist. Mit einem Spritzer Zitronensaft abschmecken.

    ---

