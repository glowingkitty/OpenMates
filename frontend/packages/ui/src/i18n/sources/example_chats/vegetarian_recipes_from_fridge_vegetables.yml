    Với **cải bó xôi, cà rốt, ớt chuông và đậu gà**, bạn đã có một nền tảng vững chắc cho những bữa ăn chay ngon miệng và giàu chất xơ. 

    Dưới đây là ba hướng chế biến khác nhau tùy thuộc vào phong cách món ăn mà bạn đang thèm:

    ---

    ### 1. Tươi mát & Giòn rụm: Salad thái nhỏ kiểu Thái
    Nếu bạn muốn món gì đó nhanh gọn, nhẹ nhàng và giòn, hãy kết hợp ớt chuông, cà rốt và cải bó xôi sống thái nhỏ với đậu gà trong nước sốt chanh [lạc](wiki:Peanut) chua thanh.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Bánh mặn: Chả đậu gà & rau củ giòn
    Nếu bạn thích món gì đó ấm nóng và vừa miệng (tuyệt vời khi cuốn, ăn kèm bánh pita hoặc chấm với sốt sữa chua), hãy nghiền đậu gà rồi trộn với cà rốt, ớt chuông băm nhỏ và cải bó xôi đã làm chín.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Lựa chọn nhanh cho ngày trong tuần: Cà ri đậu gà & rau củ áp chảo ấm nóng
    Nếu bạn muốn một bữa ăn nấu trong một chảo bằng các nguyên liệu cơ bản có sẵn (như nước cốt dừa đóng hộp hoặc cà chua nghiền):
    1. **Xào các loại gia vị:** Đun nóng dầu ô liu trong chảo, sau đó xào hành tây thái hạt lựu, tỏi băm và gừng cho đến khi thơm.
    2. **Thêm các loại rau củ cứng:** Thái cà rốt và ớt chuông thành miếng vừa ăn. Cho chúng vào chảo cùng với bột thì là Ai Cập, [nghệ](wiki:Turmeric) và một chút bột ớt hoặc bột cà ri.
    3. **Ninh nhỏ lửa:** Thêm đậu gà đã rửa sạch cùng với một cốc nước dùng rau củ hoặc nước cốt dừa. Đậy nắp và ninh trong 10–12 phút cho đến khi cà rốt mềm.
    4. **Làm chín cải bó xôi:** Cho cải bó xôi tươi vào cuối cùng, đảo trong 1–2 phút cho đến khi rau có màu xanh tươi và hơi héo. Hoàn tất bằng một chút nước cốt chanh.

