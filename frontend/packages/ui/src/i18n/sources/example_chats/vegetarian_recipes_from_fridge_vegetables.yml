    Con **spinaci, carote, peperoni e ceci**, hai un'ottima base per piatti vegetariani deliziosi e ricchi di fibre. 

    Ecco tre diverse direzioni culinarie a seconda del tipo di piatto che desideri:

    ---

    ### 1. Fresca e croccante: Insalata tritata in stile Thai
    Se vuoi qualcosa di veloce, leggero e croccante, unisci peperoni crudi tritati finemente, carote e spinaci con i ceci in un condimento piccante alle [arachidi](wiki:Peanut) e lime.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Polpette saporite: Frittelle croccanti di ceci e verdure
    Se preferisci qualcosa di caldo e sfizioso (ottimo in wrap, pita o accompagnato da una salsa allo yogurt), schiaccia i ceci e aggiungi carote tritate, peperoni e spinaci saltati.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Alternativa veloce per la cena: Curry di ceci e verdure in padella
    Se vuoi un piatto unico usando ingredienti base della dispensa (come latte di cocco in lattina o pomodori pelati):
    1. **Soffriggi gli odori:** scalda l'olio d'oliva in una padella, poi cuoci cipolla a dadini, aglio tritato e zenzero fino a quando non sprigionano il loro profumo.
    2. **Aggiungi le verdure sode:** taglia le carote e i peperoni a pezzetti. Aggiungili in padella con cumino, [curcuma](wiki:Turmeric) e un pizzico di peperoncino o curry in polvere.
    3. **Cuoci a fuoco lento:** aggiungi i ceci sciacquati insieme a una tazza di brodo vegetale o latte di cocco. Copri e cuoci a fuoco lento per 10-12 minuti finché le carote non saranno tenere.
    4. **Appassisci gli spinaci:** aggiungi gli spinaci freschi proprio alla fine per 1-2 minuti finché non saranno appassiti ma ancora di un verde brillante. Rifinisci con una spruzzata di succo di limone.

