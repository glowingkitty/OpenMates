    Com **espinafres, cenouras, pimentos e grão-de-bico**, tens uma base sólida para refeições vegetarianas deliciosas e ricas em fibra. 

    Aqui estão três direções culinárias distintas, dependendo do estilo de prato que te apetece:

    ---

    ### 1. Fresca e Crocante: Salada Picada ao Estilo Tailandês
    Se queres algo rápido, leve e crocante, combina pimentos crus, cenouras e espinafres finamente picados com grão-de-bico num molho de [amendoim](wiki:Peanut) e lima acidulado.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Bolinhos Salgados: Bolinhos Crocantes de Grão e Vegetais
    Se preferires algo quente e em porções pequenas (ótimo em wraps, pão pita ou acompanhado com um molho de iogurte), esmaga o grão-de-bico e envolve as cenouras picadas, os pimentos e os espinafres salteados.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Alternativa Rápida para os Dias de Semana: Caril de Grão e Vegetais na Frigideira
    Se queres uma refeição de uma só panela usando ingredientes básicos da despensa (como leite de coco em lata ou tomate esmagado):
    1. **Refoga os aromáticos:** Aquece o azeite numa frigideira e depois cozinha a cebola picada, o alho picado e o gengibre até libertarem o aroma.
    2. **Adiciona os vegetais firmes:** Corta as cenouras e os pimentos em pedaços pequenos. Junta-os com cominhos moídos, [curcuma](wiki:Turmeric) e uma pitada de malagueta em pó ou caril em pó.
    3. **Deixa apurar:** Adiciona o grão-de-bico lavado juntamente com uma chávena de caldo de legumes ou leite de coco. Tapa e deixa cozinhar em lume brando por 10–12 minutos até as cenouras estarem tenras.
    4. **Murcha os espinafres:** Envolve os espinafres frescos mesmo no fim durante 1–2 minutos até ficarem com um verde vibrante e murcharem. Finaliza com um pouco de sumo de limão.

