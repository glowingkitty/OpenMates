    Con **espinacas, zanahorias, pimientos y garbanzos**, tienes una base sólida para preparar deliciosas comidas vegetarianas ricas en fibra. 

    Aquí tienes tres direcciones culinarias distintas según el estilo de plato que te apetezca:

    ---

    ### 1. Fresca y crujiente: Ensalada picada al estilo tailandés
    Si quieres algo rápido, ligero y crujiente, combina pimientos crudos, zanahorias y espinacas finamente picados con garbanzos en un aderezo ácido de lima y [cacahuete](wiki:Peanut).

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Tortitas saladas: Buñuelos crujientes de garbanzos y verduras
    Si te apetece algo caliente y de bocado (ideal en wraps, pan de pita o acompañado de una salsa de yogur), machaca los garbanzos e incorpora zanahorias y pimientos picados, y espinacas salteadas.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Alternativa rápida para entre semana: Curry de garbanzos y verduras en sartén
    Si quieres una comida en una sola sartén usando productos básicos de la despensa (como leche de coco en lata o tomate triturado):
    1. **Sofríe los aromáticos:** Calienta aceite de oliva en una sartén y cocina cebolla picada, ajo picado y jengibre hasta que suelten su aroma.
    2. **Añade las verduras firmes:** Corta las zanahorias y los pimientos en trozos de bocado. Échalos a la sartén con comino molido, [cúrcuma](wiki:Turmeric) y una pizca de chile en polvo o curry.
    3. **Cocina a fuego lento:** Añade los garbanzos escurridos junto con una taza de caldo de verduras o leche de coco. Tapa y cocina a fuego lento durante 10-12 minutos hasta que las zanahorias estén tiernas.
    4. **Añade las espinacas:** Incorpora las espinacas frescas justo al final durante 1-2 minutos hasta que estén de un verde intenso y se hayan reducido. Termina con un chorrito de zumo de limón.

    ---

