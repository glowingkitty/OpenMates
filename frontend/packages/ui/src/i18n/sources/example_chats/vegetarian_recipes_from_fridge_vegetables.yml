    مع **السبانخ، والجزر، والفلفل الحلو، والحمص**، لديك أساس متين لوجبات نباتية لذيذة وغنية بالألياف. 

    إليك ثلاثة اتجاهات طهي مختلفة بناءً على نوع الطبق الذي تشتهيه:

    ---

    ### 1. طازجة ومقرمشة: سلطة مقطعة على الطريقة التايلاندية
    إذا كنت تريد شيئاً سريعاً وخفيفاً ومقرمشاً، امزج الفلفل النيئ المقطع ناعماً والجزر والسبانخ مع الحمص في تتبيلة [الفول السوداني](wiki:Peanut) والليمون الحامضة.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. فطائر مالحة: عجة الحمص والخضروات المقرمشة
    إذا كنت تفضل شيئاً دافئاً وبحجم اللقمة (رائع في السندويشات، أو خبز البيتا، أو مع تغميسة الزبادي)، اهرس الحمص وأضف إليه الجزر المفروم والفلفل والسبانخ المذبلة.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. بديل سريع لأيام الأسبوع: كاري الحمص والخضروات الدافئ في المقلاة
    إذا كنت تريد وجبة في مقلاة واحدة باستخدام المكونات الأساسية المتوفرة (مثل حليب جوز الهند المعلب أو الطماطم المهروسة):
    1. **شوّح المنكهات:** سخن زيت الزيتون في مقلاة، ثم اطبخ البصل المقطع والثوم المفروم والزنجبيل حتى تظهر رائحتهم.
    2. **أضف الخضروات الصلبة:** قطع الجزر والفلفل الحلو إلى قطع صغيرة. أضفها مع الكمون المطحون، و[الكركم](wiki:Turmeric)، ورشة من مسحوق الفلفل الحار أو مسحوق الكاري.
    3. **اتركها على نار هادئة:** أضف الحمص المغسول مع كوب من مرق الخضار أو حليب جوز الهند. غطِ المقلاة واتركها على نار هادئة لمدة 10–12 دقيقة حتى ينضج الجزر.
    4. **ذبل السبانخ:** أضف السبانخ الطازجة في النهاية لمدة 1–2 دقيقة حتى تذبل ويصبح لونها أخضر زاهياً. اختم الوجبة بعصرة من عصير الليمون.

