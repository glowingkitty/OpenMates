    Dengan **bayam, wortel, paprika, dan kacang arab**, kamu punya bahan dasar yang mantap untuk hidangan vegetarian yang lezat dan kaya serat. 

    Berikut adalah tiga pilihan masakan berbeda tergantung jenis hidangan yang kamu inginkan:

    ---

    ### 1. Segar & Renyah: Salad Cincang ala Thailand
    Jika kamu ingin sesuatu yang cepat, ringan, dan renyah, campurkan paprika mentah, wortel, dan bayam yang dicincang halus dengan kacang arab dalam saus [kacang](wiki:Peanut) jeruk nipis yang segar.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Bakwan Gurih: Bakwan Kacang Arab & Sayuran yang Renyah
    Jika kamu ingin sesuatu yang hangat dan seukuran gigitan (cocok untuk isian wrap, roti pita, atau disajikan dengan saus yoghurt), hancurkan kacang arab lalu campurkan dengan wortel cincang, paprika, dan bayam yang sudah layu.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Alternatif Cepat untuk Malam Hari: Kari Wajan Kacang Arab & Sayuran yang Hangat
    Jika kamu ingin hidangan satu wajan menggunakan bahan dasar dapur (seperti santan kaleng atau tomat hancur):
    1. **Tumis bumbu aromatik:** Panaskan minyak zaitun di wajan, lalu masak bawang bombay potong dadu, bawang putih cincang, dan jahe hingga harum.
    2. **Masukkan sayuran keras:** Iris wortel dan paprika seukuran satu gigitan. Masukkan bersama jintan bubuk, [kunyit](wiki:Turmeric), dan sedikit bubuk cabai atau bubuk kari.
    3. **Masak perlahan:** Tambahkan kacang arab yang sudah dibilas bersama satu cangkir kaldu sayur atau santan. Tutup dan masak selama 10–12 menit hingga wortel empuk.
    4. **Layukan bayam:** Masukkan bayam segar di bagian akhir selama 1–2 menit hingga berwarna hijau cerah dan layu. Akhiri dengan perasan air lemon.

