    Имея под рукой **шпинат, морковь, болгарский перец и нут**, у тебя есть отличная основа для вкусных вегетарианских блюд, богатых клетчаткой. 

    Вот три разных кулинарных направления в зависимости от того, чего тебе хочется:

    ---

    ### 1. Свежий и хрустящий: рубленый салат в тайском стиле
    Если хочется чего-то быстрого, легкого и хрустящего, смешай мелко нарезанный сырой перец, морковь и шпинат с нутом в пикантной [арахисовой](wiki:Peanut) заправке с лаймом.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Аппетитные котлетки: хрустящие оладьи из нута и овощей
    Если тебе хочется чего-то теплого и порционного (отлично подходит для роллов, питы или с йогуртовым соусом), разомни нут и добавь в него измельченную морковь, перец и припущенный шпинат.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Быстрый вариант на ужин: теплое карри из нута и овощей на сковороде
    Если тебе нужно блюдо в одной сковороде из базовых продуктов (таких как консервированное кокосовое молоко или протертые томаты):
    1. **Обжарь ароматные ингредиенты:** разогрей оливковое масло в сковороде, затем обжарь нарезанный кубиками лук, измельченный чеснок и имбирь до появления аромата.
    2. **Добавь твердые овощи:** нарежь морковь и болгарский перец небольшими кусочками. Добавь их к луку вместе с молотым кумином, [куркумой](wiki:Turmeric) и щепоткой порошка чили или карри.
    3. **Потуши:** добавь промытый нут вместе со стаканом овощного бульона или кокосового молока. Накрой крышкой и туши 10–12 минут, пока морковь не станет мягкой.
    4. **Добавь шпинат:** в самом конце добавь свежий шпинат на 1–2 минуты, пока он не станет мягким и ярко-зеленым. В конце сбрызни лимонным соком.

