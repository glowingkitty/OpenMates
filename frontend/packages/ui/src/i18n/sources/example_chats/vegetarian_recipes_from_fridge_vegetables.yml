    **पालक, गाजर, शिमला मिर्च और छोले** के साथ, आपके पास स्वादिष्ट, फाइबर से भरपूर शाकाहारी भोजन के लिए एक ठोस आधार है।

    आप किस तरह का व्यंजन खाना चाहते हैं, इसके आधार पर यहाँ तीन अलग-अलग पाक दिशाएँ दी गई हैं:

    ---

    ### 1. ताज़ा और कुरकुरा: थाई-स्टाइल चॉप्ड सलाद
    यदि आप कुछ जल्दी बनने वाला, हल्का और कुरकुरा चाहते हैं, तो बारीक कटी हुई कच्ची मिर्च, गाजर और पालक को छोलों के साथ तीखी [मूंगफली](wiki:Peanut) और नींबू की ड्रेसिंग में मिलाएँ।

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. नमकीन पैटीज़: क्रिस्पी छोले और वेजी फ्रिटर्स
    यदि आप कुछ गर्म और छोटे आकार का (रैप्स, पीटा पॉकेट्स में बढ़िया, या दही के डिप के साथ) चाहते हैं, तो छोलों को मैश करें और उसमें बारीक कटी हुई गाजर, मिर्च और हल्का पका हुआ पालक मिलाएँ।

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. झटपट बनने वाला विकल्प: वार्म चिकपी एंड वेजिटेबल स्किलेट करी
    यदि आप बुनियादी पेंट्री स्टेपल (जैसे डिब्बाबंद नारियल का दूध या पिसे हुए टमाटर) का उपयोग करके वन-पैन मील बनाना चाहते हैं:
    1. **सुगंधित चीज़ों को भूनें:** एक कड़ाही में जैतून का तेल गरम करें, फिर कटा हुआ प्याज, बारीक कटा हुआ लहसुन और अदरक खुशबू आने तक पकाएं।
    2. **सख्त सब्जियां डालें:** गाजर और शिमला मिर्च को छोटे टुकड़ों में काट लें। उन्हें पिसा हुआ जीरा, [हल्दी](wiki:Turmeric), और एक चुटकी मिर्च पाउडर या करी पाउडर के साथ डालें।
    3. **धीमी आंच पर पकाएं:** धुले हुए छोले के साथ एक कप सब्जियों का शोरबा या नारियल का दूध डालें। ढककर 10-12 मिनट तक धीमी आंच पर पकाएं जब तक कि गाजर नरम न हो जाए।
    4. **पालक डालें:** अंत में ताज़ा पालक डालें और 1-2 मिनट तक पकाएं जब तक कि वह गहरा हरा और नरम न हो जाए। नींबू के रस के साथ समाप्त करें।

