    有了**菠菜、胡萝卜、甜椒和鹰嘴豆**，你就有了制作美味、富含纤维的素食餐的坚实基础。

    根据你渴望的菜肴风格，这里有三个不同的烹饪方向：

    ---

    ### 1. 清爽脆口：泰式碎沙拉
    如果你想吃点快速、轻盈且爽口的东西，可以将切碎的生甜椒、胡萝卜和菠菜与鹰嘴豆混合，拌入酸甜的[花生](wiki:Peanut)青柠酱汁。

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. 咸香小饼：酥脆鹰嘴豆蔬菜饼
    如果你想吃点温热且小巧的食物（非常适合夹在卷饼、皮塔饼中，或搭配酸奶蘸酱），可以将鹰嘴豆捣碎，拌入胡萝卜碎、甜椒碎和烫熟的菠菜。

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. 快速工作日晚餐：温热鹰嘴豆蔬菜平底锅咖喱
    如果你想用基本的橱柜主食（如罐装椰奶或碎番茄）做一锅出料理：
    1. **炒香佐料：** 在平底锅中加热橄榄油，炒香洋葱丁、蒜末和姜末。
    2. **加入硬质蔬菜：** 将胡萝卜和甜椒切成一口大小。放入锅中，加入孜然粉、[姜黄](wiki:Turmeric)以及一小撮辣椒粉或咖喱粉。
    3. **炖煮：** 加入冲洗干净的鹰嘴豆，以及一杯蔬菜高汤或椰奶。盖上盖子炖煮 10–12 分钟，直到胡萝卜变软。
    4. **烫熟菠菜：** 最后加入新鲜菠菜，翻炒 1–2 分钟，直到菠菜变软且颜色鲜绿。最后挤入一点柠檬汁。

