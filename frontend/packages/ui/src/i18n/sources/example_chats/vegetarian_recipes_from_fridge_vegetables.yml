    **시금치, 당근, 피망, 병아리콩**이 있다면 맛있고 식이섬유가 풍부한 채식 요리를 만들 수 있는 훌륭한 기초가 마련된 셈이에요. 

    원하는 요리 스타일에 따라 시도해 볼 수 있는 세 가지 레시피를 소개할게요:

    ---

    ### 1. 신선하고 아삭한 맛: 태국식 찹 샐러드
    빠르고 가볍고 아삭한 음식을 원한다면, 잘게 썬 생피망, 당근, 시금치를 병아리콩과 섞은 뒤 새콤한 [땅콩](wiki:Peanut) 라임 드레싱을 곁들여 보세요.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. 고소한 패티: 바삭한 병아리콩 채소 프리터
    따뜻하고 한입 크기로 즐기기 좋은 요리(랩, 피타 브레드에 넣거나 요거트 딥과 함께 먹기 좋아요)를 원한다면, 병아리콩을 으깬 뒤 다진 당근, 피망, 살짝 데친 시금치를 넣어 반죽해 보세요.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. 간편한 평일 저녁 메뉴: 따뜻한 병아리콩 채소 스킬렛 커리
    팬 하나로 끝내는 요리를 원한다면(코코넛 밀크 캔이나 으깬 토마토 같은 기본 식재료 활용):
    1. **향신 채소 볶기:** 스킬렛에 올리브유를 두르고 다진 양파, 마늘, 생강을 향이 올라올 때까지 볶으세요.
    2. **단단한 채소 넣기:** 당근과 피망을 한입 크기로 써세요. 큐민 가루, [강황](wiki:Turmeric), 칠리 파우더나 카레 가루 한 꼬집과 함께 넣고 볶으세요.
    3. **졸이기:** 씻어둔 병아리콩과 채소 육수 또는 코코넛 밀크 한 컵을 넣으세요. 뚜껑을 덮고 당근이 부드러워질 때까지 10~12분간 뭉근하게 끓이세요.
    4. **시금치 익히기:** 마지막에 신선한 시금치를 넣고 선명한 초록색이 돌며 숨이 죽을 때까지 1~2분간 더 익히세요. 레몬즙을 살짝 뿌려 마무리하세요.

