    Se **špenátem, mrkví, paprikou a cizrnou** máš skvělý základ pro chutná vegetariánská jídla bohatá na vlákninu. 

    Tady jsou tři různé kulinářské směry podle toho, na jaký styl jídla máš zrovna chuť:

    ---

    ### 1. Svěží a křupavé: Thajský sekaný salát
    Pokud chceš něco rychlého, lehkého a křupavého, smíchej nadrobno nakrájenou syrovou papriku, mrkev a špenát s cizrnou v pikantním [arašídovém](wiki:Peanut) limetkovém dresinku.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Slané placičky: Křupavé cizrnovo-zeleninové placičky
    Pokud chceš něco teplého a akorát do ruky (skvělé do wrapů, pita chleba nebo s jogurtovým dipem), rozmačkej cizrnu a vmíchej do ní nadrobno nakrájenou mrkev, papriku a spařený špenát.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Rychlá alternativa k večeři: Teplé cizrnovo-zeleninové kari z pánve
    Pokud chceš jídlo z jedné pánve ze základních surovin ze spíže (jako je kokosové mléko v plechovce nebo drcená rajčata):
    1. **Orestuj základ:** Na pánvi rozehřej olivový olej a osmahni nadrobno nakrájenou cibuli, česnek a zázvor, dokud se nerozvoní.
    2. **Přidej tvrdší zeleninu:** Nakrájej mrkev a papriku na kousky velikosti sousta. Přidej je k základu spolu s mletým římským kmínem, [kurkumou](wiki:Turmeric) a špetkou chilli nebo kari koření.
    3. **Povař:** Přidej propláchnutou cizrnu spolu s hrnkem zeleninového vývaru nebo kokosového mléka. Přikryj a vař 10–12 minut, dokud mrkev nezměkne.
    4. **Nech zavadnout špenát:** Úplně nakonec vmíchej čerstvý špenát a nechej ho 1–2 minuty zavadnout, dokud nebude mít zářivě zelenou barvu. Dokonči zastříknutím citronovou šťávou.

