    **ほうれん草、人参、パプリカ、ひよこ豆**があれば、食物繊維たっぷりの美味しいベジタリアン料理を作るための素晴らしいベースが揃っています。

    気分に合わせて選べる、3つの異なる料理のアイデアをご紹介します：

    ---

    ### 1. フレッシュ＆シャキシャキ：タイ風チョップドサラダ
    手早く、軽くてシャキシャキしたものが食べたいときは、細かく刻んだ生のパプリカ、人参、ほうれん草をひよこ豆と合わせ、酸味の効いた[ピーナッツ](wiki:Peanut)ライムドレッシングで和えましょう。

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. 香ばしいパテ：ひよこ豆と野菜のカリカリフリッター
    温かくて一口サイズの料理（ラップサンドやピタパン、ヨーグルトディップとの相性も抜群です）がお好みの場合は、ひよこ豆を潰し、みじん切りにした人参、パプリカ、さっと火を通したほうれん草を混ぜて焼き上げます。

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. 平日の時短メニュー：ひよこ豆と野菜の温かいフライパンカレー
    常備菜やストック食材（ココナッツミルク缶やカットトマト缶など）を使ってフライパン一つで作りたい場合：
    1. **香味野菜を炒める：** フライパンにオリーブオイルを熱し、みじん切りにした玉ねぎ、にんにく、生姜を香りが出るまで炒めます。
    2. **硬い野菜を加える：** 人参とパプリカを一口大に切ります。クミンパウダー、[ターメリック](wiki:Turmeric)、チリパウダーまたはカレー粉を少々加え、野菜と一緒に炒め合わせます。
    3. **煮込む：** 水気を切ったひよこ豆と、野菜だしまたはココナッツミルクを1カップ加えます。蓋をして、人参が柔らかくなるまで10〜12分ほど煮込みます。
    4. **ほうれん草を加える：** 最後に生のほうれん草を加え、鮮やかな緑色になり、しんなりするまで1〜2分ほど火を通します。仕上げにレモン汁を絞って完成です。

