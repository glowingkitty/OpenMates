    Met **spinazie, wortels, paprika en kikkererwten** heb je een uitstekende basis voor heerlijke, vezelrijke vegetarische maaltijden. 

    Hier zijn drie verschillende culinaire richtingen, afhankelijk van waar je trek in hebt:

    ---

    ### 1. Fris & Knapperig: Thaise Chopped Salad
    Als je iets snels, lichts en knapperigs wilt, combineer dan fijngehakte rauwe paprika, wortels en spinazie met kikkererwten in een frisse [pindadressing](wiki:Peanut) met limoen.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Hartige Koekjes: Krokante Kikkererwten- & Groentefritters
    Als je zin hebt in iets warms en hapklaars (lekker in wraps, pita's of met een yoghurtdip), prak dan de kikkererwten en meng er fijngehakte wortels, paprika en geslonken spinazie doorheen.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Snel Doordeweeks Alternatief: Warme Kikkererwten- & Groentecurry uit de pan
    Als je een eenpansgerecht wilt maken met basisproducten uit de voorraadkast (zoals kokosmelk uit blik of tomatenblokjes):
    1. **Fruit de smaakmakers:** Verhit olijfolie in een koekenpan en bak gesnipperde ui, fijngehakte knoflook en gember tot het geurt.
    2. **Voeg de stevige groenten toe:** Snijd de wortels en paprika in hapklare stukjes. Voeg ze toe samen met gemalen komijn, [kurkuma](wiki:Turmeric) en een snufje chilipoeder of kerriepoeder.
    3. **Laten sudderen:** Voeg de afgespoelde kikkererwten toe samen met een kopje groentebouillon of kokosmelk. Dek af en laat 10-12 minuten sudderen tot de wortels zacht zijn.
    4. **Laat de spinazie slinken:** Meng de verse spinazie er pas op het laatst doorheen gedurende 1-2 minuten tot deze felgroen en geslonken is. Maak af met een kneepje citroensap.

