    Mając **szpinak, marchewkę, paprykę i ciecierzycę**, masz solidną bazę do przygotowania pysznych, bogatych w błonnik wegetariańskich posiłków. 

    Oto trzy różne kierunki kulinarne, w zależności od tego, na co masz ochotę:

    ---

    ### 1. Świeża i chrupiąca: Sałatka siekana w stylu tajskim
    Jeśli chcesz czegoś szybkiego, lekkiego i chrupiącego, połącz drobno posiekaną surową paprykę, marchewkę i szpinak z ciecierzycą w wyrazistym [orzechowym](wiki:Peanut) sosie z limonką.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Wytrawne placuszki: Chrupiące kotleciki z ciecierzycy i warzyw
    Jeśli masz ochotę na coś ciepłego i w sam raz na jeden kęs (świetne do wrapów, chlebków pita lub z dipem jogurtowym), rozgnieć ciecierzycę i wymieszaj z posiekaną marchewką, papryką i podduszonym szpinakiem.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Szybka alternatywa na kolację: Rozgrzewające curry z ciecierzycą i warzywami z patelni
    Jeśli chcesz dania jednogarnkowego z podstawowych produktów (takich jak mleczko kokosowe w puszce lub krojone pomidory):
    1. **Podsmaż bazę:** Rozgrzej oliwę na patelni, a następnie podsmaż pokrojoną w kostkę cebulę, posiekany czosnek i imbir, aż zaczną pachnieć.
    2. **Dodaj twarde warzywa:** Pokrój marchewkę i paprykę na kawałki wielkości kęsa. Wrzuć je na patelnię wraz z mielonym kminem rzymskim, [kurkumą](wiki:Turmeric) oraz szczyptą chili lub przyprawy curry.
    3. **Duś:** Dodaj opłukaną ciecierzycę wraz ze szklanką bulionu warzywnego lub mleczka kokosowego. Przykryj i duś przez 10–12 minut, aż marchewka zmięknie.
    4. **Dodaj szpinak:** Na samym końcu wrzuć świeży szpinak i gotuj przez 1–2 minuty, aż zwiędnie i nabierze intensywnego koloru. Wykończ danie odrobiną soku z cytryny.

