    Med **spenat, morötter, paprika och kikärtor** har du en bra grund för goda, fiberrika vegetariska måltider. 

    Här är tre olika kulinariska inriktningar beroende på vilken typ av rätt du är sugen på:

    ---

    ### 1. Fräscht & krispigt: Hackad sallad i thailändsk stil
    Om du vill ha något snabbt, lätt och krispigt kan du blanda finhackad rå paprika, morötter och spenat med kikärtor i en syrlig [jordnöts-](wiki:Peanut) och limedressing.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Matiga biffar: Krispiga kikärts- och grönsaksfritters
    Om du vill ha något varmt i lagom stora bitar (perfekt i wraps, pitabröd eller tillsammans med en yoghurtdipp), mosa kikärtorna och vänd ner finhackade morötter, paprika och förvälld spenat.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Snabbt vardagsalternativ: Varm kikärts- och grönsakscurry i panna
    Om du vill ha en allt-i-ett-rätt med basvaror från skafferiet (som kokosmjölk på burk eller krossade tomater):
    1. **Fräs smakgivarna:** Hetta upp olivolja i en panna och stek tärnad lök, finhackad vitlök och ingefära tills det doftar gott.
    2. **Tillsätt de fasta grönsakerna:** Skär morötterna och paprikan i munsbitsstora bitar. Blanda ner dem tillsammans med mald spiskummin, [gurkmeja](wiki:Turmeric) och en nypa chilipulver eller curry.
    3. **Sjud:** Tillsätt dina sköljda kikärtor tillsammans med ett par deciliter grönsaksbuljong eller kokosmjölk. Lägg på ett lock och sjud i 10–12 minuter tills morötterna är mjuka.
    4. **Låt spenaten mjukna:** Rör ner den färska spenaten precis på slutet i 1–2 minuter tills den är klarstark grön och har mjuknat. Avsluta med en skvätt citronsaft.

