    עם **תרד, גזר, פלפלים וחומוס**, יש לך בסיס מצוין לארוחות צמחוניות טעימות ועשירות בסיבים. 

    הנה שלושה כיוונים קולינריים שונים, בהתאם לסגנון המנה שמתחשק לך:

    ---

    ### 1. רענן ופריך: סלט קצוץ בסגנון תאילנדי
    אם מתחשק לך משהו מהיר, קליל ופריך, כדאי לשלב פלפלים חיים קצוצים דק, גזר ותרד עם חומוס ברוטב ליים ו[בוטנים](wiki:Peanut) פיקנטי.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. קציצות מלוחות: לביבות חומוס וירקות פריכות
    אם מתחשק לך משהו חם בגודל ביס (נהדר בטורטייה, בפיתה או לצד מטבל יוגורט), אפשר למעוך את החומוס ולהוסיף גזר קצוץ דק, פלפלים ותרד מאודה.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. חלופה מהירה לאמצע השבוע: תבשיל קארי חומוס וירקות במחבת
    אם מתחשק לך ארוחה במחבת אחת ממרכיבים בסיסיים שיש במזווה (כמו חלב קוקוס בשימורים או עגבניות מרוסקות):
    1. **טיגון הירקות הארומטיים:** מחממים שמן זית במחבת, ומטגנים בצל קצוץ, שום כתוש וג'ינג'ר עד להפצת ריח.
    2. **הוספת הירקות הקשים:** חותכים את הגזר והפלפלים לקוביות בגודל ביס. מוסיפים אותם למחבת יחד עם כמון טחון, [כורכום](wiki:Turmeric) וקורט אבקת צ'ילי או אבקת קארי.
    3. **בישול:** מוסיפים את החומוס השטוף יחד עם כוס ציר ירקות או חלב קוקוס. מכסים ומבשלים על אש קטנה במשך 10–12 דקות עד שהגזר מתרכך.
    4. **הוספת התרד:** מוסיפים את התרד הטרי ממש בסוף למשך 1–2 דקות עד שהוא מצטמצם ומקבל צבע ירוק עז. מסיימים עם סחיטת מיץ לימון.

