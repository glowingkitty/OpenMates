    Avec des **épinards, des carottes, des poivrons et des pois chiches**, tu as une base solide pour de délicieux repas végétariens riches en fibres. 

    Voici trois directions culinaires différentes selon tes envies :

    ---

    ### 1. Frais et croquant : Salade hachée à la thaïlandaise
    Si tu veux quelque chose de rapide, léger et croquant, mélange des poivrons crus finement hachés, des carottes et des épinards avec des pois chiches dans une vinaigrette acidulée à la [cacahuète](wiki:Peanut) et au citron vert.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Galettes savoureuses : Beignets croustillants aux pois chiches et légumes
    Si tu as envie de quelque chose de chaud et de format bouchée (parfait dans des wraps, des pains pita ou avec une sauce au yaourt), écrase les pois chiches et incorpore les carottes et poivrons émincés, ainsi que les épinards tombés à la poêle.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Alternative rapide pour la semaine : Curry de pois chiches et légumes à la poêle
    Si tu veux un plat unique utilisant des produits de base du placard (comme du lait de coco en conserve ou des tomates concassées) :
    1. **Fais revenir les aromates :** fais chauffer de l'huile d'olive dans une poêle, puis fais cuire l'oignon désé, l'ail haché et le gingembre jusqu'à ce qu'ils embaument.
    2. **Ajoute les légumes fermes :** coupe les carottes et les poivrons en morceaux. Ajoute-les avec du cumin moulu, du [curcuma](wiki:Turmeric) et une pincée de piment ou de curry en poudre.
    3. **Laisse mijoter :** ajoute tes pois chiches rincés ainsi qu'une tasse de bouillon de légumes ou de lait de coco. Couvre et laisse mijoter 10 à 12 minutes jusqu'à ce que les carottes soient tendres.
    4. **Fais tomber les épinards :** incorpore les épinards frais tout à la fin pendant 1 à 2 minutes jusqu'à ce qu'ils soient d'un vert éclatant et flétris. Termine par un filet de jus de citron.

    ---

    ```interactive_question
    {
      "type": "choice",
