    **Ispanak, havuç, dolmalık biber ve nohut** ile lezzetli, lif açısından zengin vejetaryen öğünler için sağlam bir temeliniz var.

    Canınızın çektiği yemek tarzına göre üç farklı mutfak yönü aşağıdadır:

    ---

    ### 1. Taze ve Kıtır: Tay Usulü Doğranmış Salata
    Hızlı, hafif ve gevrek bir şeyler istiyorsanız; ince doğranmış çiğ biber, havuç ve ıspanağı nohutla birleştirip üzerine ekşi bir [fıstık](wiki:Peanut) limon sosu ekleyin.

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. Tuzlu Köfteler: Çıtır Nohutlu ve Sebzeli Mücver
    Sıcak ve lokmalık bir şeyler isterseniz (dürümlerde, pita ekmeğinde veya yoğurtlu sosla harikadır), nohutları ezin ve içine ince kıyılmış havuç, biber ve sotelenmiş ıspanağı ekleyin.

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. Hızlı Hafta İçi Alternatifi: Sıcak Nohutlu ve Sebzeli Tavada Köri
    Temel kiler malzemelerini (konserve hindistan cevizi sütü veya ezilmiş domates gibi) kullanarak tek tavada bir yemek istiyorsanız:
    1. **Aromatikleri soteleyin:** Bir tavada zeytinyağını ısıtın, ardından doğranmış soğan, kıyılmış sarımsak ve zencefili kokusu çıkana kadar pişirin.
    2. **Sert sebzeleri ekleyin:** Havuçları ve dolmalık biberleri lokma büyüklüğünde dilimleyin. Bunları kimyon, [zerdeçal](wiki:Turmeric) ve bir tutam pul biber veya köri tozuyla birlikte tavaya atın.
    3. **Kısık ateşte pişirin:** Yıkanmış nohutları bir bardak sebze suyu veya hindistan cevizi sütü ile birlikte ekleyin. Kapağını kapatın ve havuçlar yumuşayana kadar 10-12 dakika kısık ateşte pişirin.
    4. **Ispanakları söndürün:** Taze ıspanakları en sonunda ekleyip canlı yeşil bir renk alıp sönene kadar 1-2 dakika karıştırın. Bir miktar limon suyu sıkarak tamamlayın.

