    ด้วย **ผักโขม, แครอท, พริกหวาน และถั่วลูกไก่** คุณมีวัตถุดิบพื้นฐานชั้นยอดสำหรับเมนูมังสวิรัติที่อร่อยและมีกากใยสูง

    นี่คือ 3 แนวทางอาหารที่แตกต่างกัน ขึ้นอยู่กับว่าคุณอยากทานสไตล์ไหน:

    ---

    ### 1. สดชื่นและกรุบกรอบ: สลัดผักสับสไตล์ไทย
    หากคุณต้องการอะไรที่รวดเร็ว เบา และกรอบ ให้ผสมพริกหวาน แครอท และผักโขมดิบที่สับละเอียด เข้ากับถั่วลูกไก่ในน้ำสลัดมะนาวผสม [ถั่วลิสง](wiki:Peanut) รสเปรี้ยวจี๊ดจ๊าด

    [!](embed:thai-chopped-spinach-Gfw)

    ---

    ### 2. แผ่นผักทอดรสกลมกล่อม: ทอดมันถั่วลูกไก่และผักแบบกรอบ
    หากคุณชอบอะไรที่อุ่นและพอดีคำ (เหมาะสำหรับใส่ในแรป, ขนมปังพิต้า หรือทานคู่กับดิปโยเกิร์ต) ให้บดถั่วลูกไก่แล้วผสมแครอทสับ พริกหวาน และผักโขมลวกสุกลงไป

    [!](embed:chickpea-fritters-with-qY9)

    ---

    ### 3. ทางเลือกด่วนสำหรับมื้อเย็น: แกงถั่วลูกไก่และผักในกระทะแบบอุ่น
    หากคุณต้องการอาหารมื้อเดียวที่ใช้ของพื้นฐานในครัว (เช่น กะทิกระป๋อง หรือมะเขือเทศบด):
    1. **ผัดเครื่องเทศ:** อุ่นน้ำมันมะกอกในกระทะ จากนั้นผัดหอมหัวใหญ่หั่นเต๋า กระเทียมสับ และขิงจนมีกลิ่นหอม
    2. **ใส่ผักเนื้อแข็ง:** หั่นแครอทและพริกหวานเป็นชิ้นพอดีคำ ใส่ลงไปพร้อมกับยี่หร่าป่น [ขมิ้น](wiki:Turmeric) และพริกป่นหรือผงกะหรี่เล็กน้อย
    3. **เคี่ยว:** ใส่ถั่วลูกไก่ที่ล้างแล้วลงไปพร้อมกับน้ำสต๊อกผักหรือกะทิหนึ่งถ้วย ปิดฝาแล้วเคี่ยวประมาณ 10–12 นาทีจนแครอทนิ่ม
    4. **ใส่ผักโขม:** ใส่ผักโขมสดลงไปในตอนท้ายสุด ผัดต่อ 1–2 นาทีจนผักยุบตัวและมีสีเขียวสด ปิดท้ายด้วยการบีบน้ำมะนาว

