  es: Crea una melodía instrumental suave para un video de bienvenida de un huerto comunitario.
  fr: "Crée une mélodie instrumentale douce pour une vidéo d'accueil d'un jardin communautaire."
  pt: Cria uma melodia instrumental suave para um vídeo de boas-vindas de uma horta comunitária.
