summary:
  context: "Summary of example chat: A Melody for a Community Garden Welcome"
  en: "Create a gentle instrumental melody for a community garden welcome video."
  de: Erstelle eine sanfte Instrumentalmelodie für ein Begrüßungsvideo eines Gemeinschaftsgartens.
