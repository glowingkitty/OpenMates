message_1:
  context: "user message 1 in example chat: Find an English-speaking GP in Berlin. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I need an English-speaking GP appointment in Berlin next week. Please compare the earliest options, show their appointment cards, and only state insurance coverage when the booking listing confirms it. If coverage is unclear, say so."
  de: Ich brauche nächste Woche einen Termin bei einem englischsprachigen Hausarzt in Berlin. Bitte vergleiche die frühesten Optionen, zeige deren Terminkarten an und gib den Versicherungsschutz nur an, wenn der Buchungseintrag dies bestätigt. Wenn der Versicherungsschutz unklar ist, sag das bitte.
  zh: 我下周需要在柏林预约一位说英语的全科医生（GP）。请对比最早的可选时段，显示他们的预约卡片，并仅在预约列表中确认保险覆盖范围时才说明。如果覆盖范围不明确，请如实说明。
  es: Necesito una cita con un médico de cabecera que hable inglés en Berlín la próxima semana. Por favor, compara las opciones más próximas, muestra sus tarjetas de cita y solo indica la cobertura del seguro cuando el anuncio de reserva lo confirme. Si la cobertura no está clara, dilo.
  fr: "J'ai besoin d'un rendez-vous avec un généraliste anglophone à Berlin la semaine prochaine. Compare les créneaux les plus proches, affiche leurs fiches de rendez-vous et n'indique la couverture d'assurance que si l'annonce de réservation le confirme. Si la couverture n'est pas claire, précise-le."
  pt: Preciso de uma consulta com um médico de clínica geral que fale inglês em Berlim na próxima semana. Por favor, compara as opções mais próximas, mostra os cartões de consulta e indica a cobertura do seguro apenas quando a listagem de reserva o confirmar. Se a cobertura não for clara, diz.
  ru: Мне нужно записаться к англоговорящему терапевту в Берлине на следующей неделе. Пожалуйста, сравни ближайшие варианты, покажи карточки записи и указывай информацию о страховке только тогда, когда она подтверждена в описании записи. Если информация о страховке неясна, так и напиши.
  ja: 来週、ベルリンで英語対応の一般医（GP）の予約が必要です。最短の候補を比較して予約カードを表示し、保険の適用については予約ページで確認できる場合のみ記載してください。不明な場合はそのように伝えてください。
  ko: 다음 주에 베를린에서 영어가 가능한 일반의(GP) 예약이 필요해. 가장 빠른 옵션들을 비교해서 예약 카드를 보여주고, 예약 목록에서 확인된 경우에만 보험 적용 여부를 알려줘. 적용 여부가 불분명하다면 그렇다고 말해줘.
  it: "Ho bisogno di un appuntamento con un medico di base che parli inglese a Berlino la prossima settimana. Per favore, confronta le prime disponibilità, mostra le loro schede appuntamento e indica la copertura assicurativa solo quando confermata dall'annuncio di prenotazione. Se la copertura non è chiara, dillo."
  tr: "Gelecek hafta Berlin'de İngilizce konuşan bir aile hekimi randevusuna ihtiyacım var. Lütfen en erken seçenekleri karşılaştır, randevu kartlarını göster ve sigorta kapsamını yalnızca rezervasyon listesi onayladığında belirt. Kapsam net değilse bunu belirt."
  vi: Tôi cần hẹn bác sĩ tổng quát nói tiếng Anh tại Berlin vào tuần tới. Hãy so sánh các lựa chọn sớm nhất, hiển thị thẻ thông tin cuộc hẹn và chỉ nêu chi tiết bảo hiểm nếu thông tin đặt chỗ có xác nhận. Nếu không rõ về bảo hiểm, hãy báo lại.
  id: Aku butuh janji temu dokter umum berbahasa Inggris di Berlin minggu depan. Tolong bandingkan opsi tercepat, tunjukkan kartu janji temunya, dan hanya sebutkan cakupan asuransi jika daftar pemesanan mengonfirmasinya. Jika cakupannya tidak jelas, katakan saja.
  pl: Potrzebuję wizyty u anglojęzycznego lekarza ogólnego w Berlinie w przyszłym tygodniu. Porównaj najwcześniejsze opcje, pokaż ich karty wizyt i podawaj informacje o ubezpieczeniu tylko wtedy, gdy są one potwierdzone w ofercie. Jeśli kwestia ubezpieczenia jest niejasna, zaznacz to.
  nl: Ik heb volgende week een afspraak nodig bij een Engelssprekende huisarts in Berlijn. Vergelijk de vroegste opties, toon hun afsprakenkaarten en vermeld de verzekeringsdekking alleen als de boekingsvermelding dit bevestigt. Als de dekking onduidelijk is, geef dit dan aan.
  ar: أحتاج إلى موعد مع طبيب عام يتحدث الإنجليزية في برلين الأسبوع المقبل. يرجى مقارنة أقرب الخيارات المتاحة، وعرض بطاقات المواعيد الخاصة بها، وذكر تغطية التأمين فقط عندما تؤكدها قائمة الحجز. إذا كانت التغطية غير واضحة، يرجى ذكر ذلك.
  hi: मुझे अगले हफ्ते बर्लिन में अंग्रेजी बोलने वाले GP के साथ अपॉइंटमेंट चाहिए। कृपया सबसे जल्दी उपलब्ध विकल्पों की तुलना करें, उनके अपॉइंटमेंट कार्ड दिखाएं, और बीमा कवरेज के बारे में केवल तभी बताएं जब बुकिंग लिस्टिंग इसकी पुष्टि करती हो। यदि कवरेज स्पष्ट नहीं है, तो वैसा ही कहें।
  th: ฉันต้องการนัดหมายแพทย์ทั่วไป (GP) ที่พูดภาษาอังกฤษในเบอร์ลินสัปดาห์หน้า โปรดเปรียบเทียบตัวเลือกที่เร็วที่สุด แสดงบัตรนัดหมาย และระบุความคุ้มครองประกันภัยเฉพาะเมื่อรายการจองยืนยันเท่านั้น หากความคุ้มครองไม่ชัดเจน ให้แจ้งตามนั้น
  cs: Potřebuju příští týden termín u anglicky mluvícího praktického lékaře v Berlíně. Porovnej prosím nejbližší možnosti, ukaž jejich karty termínů a uváděj krytí pojištěním, jen když je to v rezervační nabídce potvrzeno. Pokud je krytí nejasné, napiš to.
  sv: Jag behöver en tid hos en engelsktalande husläkare i Berlin nästa vecka. Jämför de tidigaste alternativen, visa deras bokningskort och ange endast försäkringsskydd när bokningslistan bekräftar det. Om det är oklart vad som täcks, säg det.
  he: אני צריך תור לרופא משפחה דובר אנגלית בברלין בשבוע הבא. אנא השווה בין האפשרויות המוקדמות ביותר, הצג את כרטיסי התור שלהן, וציין את הכיסוי הביטוחי רק כאשר רישום ההזמנה מאשר זאת. אם הכיסוי אינו ברור, ציין זאת.
  verified_by_human: []

