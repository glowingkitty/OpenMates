  vi: "Tôi rất thích Bàn tay trái của bóng tối vì cách xây dựng thế giới và những câu hỏi xã hội trong đó. Tôi nên đọc gì tiếp theo, và tại sao?"
  id: "Saya menyukai The Left Hand of Darkness karena pembangunan dunia dan pertanyaan sosialnya. Apa yang sebaiknya saya baca selanjutnya, dan mengapa?"
  pl: "Spodobała mi się „Lewa ręka ciemności” ze względu na kreację świata i pytania społeczne. Co warto przeczytać w następnej kolejności i dlaczego?"
