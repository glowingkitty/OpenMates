    [צד שמאל של החושך](wiki:The_Left_Hand_of_Darkness) מאת [אורסולה ק' לה גווין](wiki:Ursula_K._Le_Guin) בולט כיוון שבניית העולם שלו אינה רק רקע נופי; היא פועלת כניסוי מחשבתי אנתרופולוגי. לה גווין תיארה כזכור את המדע הבדיוני כמעבדה לשאילת השאלה *"מה אם?"* — בחינה של האופן שבו מערכות יחסים אנושיות, מוסדות ודעות קדומות מעצבים את עצמם מחדש כאשר משתנה יסודי (כמו מין ביולוגי קבוע) מוסר.

    הנה ארבעה ספרים שממשיכים את הסוג הזה של בניית עולם וחקירה חברתית:
    ---

    ### 1. *המנושל* מאת אורסולה ק. לה גווין
    * **שאלת הליבה:** האם חברה יכולה להשיג חופש אמיתי ללא רכוש, ואיך מחויבות הדדית שורדת תהליכי מיסוד?
    * **למה הוא מתאים:** העלילה מתרחשת באותו יקום רחב של [מחזור היינר](wiki:Hainish_Cycle), והרומן מעמיד זה מול זה שני עולמות שכנים: אנארס, ירח צחיח שהוקם על יסודות האנרכו-סינדיקליזם וסולידריות קהילתית, ואוראס, כוכב לכת עשיר במשאבים המפוצל בין קפיטליזם תחרותי לסוציאליזם סמכותני. בעוד ש*צד שמאל של החושך* חקר מגדר ואמון אישי (המושג *שיפגרת'ור*), [המנושל](wiki:The_Dispossessed) בוחן כלכלה, שפה ואחריות קולקטיבית, ושואל איך קהילות יכולות לטפח את הפרט ובו בזמן להישאר מסורות לעזרה הדדית.### 2. *שחר* (טרילוגיית צאצאי לילית / קסנוגנזיס) מאת [אוקטביה א. באטלר](wiki:Octavia_E._Butler)
    * **שאלת הליבה:** מה מגדיר את טבע האדם, ומה קורה כשהישרדות דורשת ויתור על הדחף שלנו להיררכיה ולאוטונומיה ביולוגית?
    * **למה זה מתאים:** בדומה לגת'נים של לה גווין, לחייזרי האואנקאלי (Oankali) יש שלושה מינים (זכר, נקבה ו*אולוי*, שמתווכים ברבייה ובחילוף גנטי). באטלר מאתגרת את הנחות היסוד של הקוראים לגבי הסכמה, מבנים משפחתיים ושיתוף פעולה. הנרטיב שואל האם הפגם הקטלני של האנושות הוא השילוב בין אינטליגנציה גבוהה לדחף מולד להיררכיה – והאם אנחנו יכולים להתפתח מעבר לשליטה.### 3. *יושרה שניונית* מאת [אן לקי](wiki:Ann_Leckie)
    * **שאלת הליבה:** כיצד מוסדות אימפריאליים מעצבים זהות, ואיך נראית תודעה כשהיא מופרדת מהצורה האנושית האינדיבידואלית?
    * **למה זה מתאים:** אימפריית הראדץ' של לקי אינה מחלקת את החברה לפי קווי מגדר; למעשה, בשפה הדומיננטית חסרים סממני מגדר לחלוטין, והיא משתמשת בכינויי גוף בנקבה באופן אוניברסלי. מעבר למקבילה הלשונית לחקירת התפיסה של לה גווין, הסיפור — שמסופר מנקודת מבטה של בינה מלאכותית שהייתה מבוזרת בעבר על פני ספינת מלחמה ואלפי גופות אנושיות "שניוניות" — צולל לנושאים של שותפות לדבר עבירה, חובה ומצפון אינדיבידואלי בתוך אימפריה שואפת התרחבות.### 4. *A Half-Built Garden* מאת [רות'אנה אמריס](wiki:Ruthanna_Emrys)
    * **שאלת הליבה:** כיצד קהילות אנושיות יכולות לארגן ניהול דמוקרטי כדי לשרוד קריסה אקולוגית, ואיך מנהלים משא ומתן עם תרבויות הבנויות על ערכים שונים מיסודם?
    * **למה הוא מתאים:** בכדור הארץ של שנות ה-80 של המאה ה-21, הנשלט על ידי רשתות של אגני ניקוז וקואופרטיבים אקולוגיים שיתופיים, מתרחש מגע ראשון עם מין חוצני המציע גאולה באמצעות הגירה. הספר מתמקד באינטנסיביות בדיפלומטיה, קונצנזוס קהילתי, הורות וקבלת החלטות חברתית, ומציע את אותו קצב אנתרופולוגי מדוד וניואנסים אתיים שנמצאים ביצירותיה של לה גווין.
