  es: "Disfruté de La mano izquierda de la oscuridad por su construcción de mundos y sus preguntas sociales. ¿Qué debería leer a continuación y por qué?"
  fr: "J'ai aimé La Main gauche de la nuit pour sa construction d'univers et ses questionnements sociaux. Que devrais-je lire ensuite, et pourquoi ?"
  pt: "Gostei de A Mão Esquerda da Escuridão pela sua construção de mundo e questões sociais. O que devo ler a seguir e por quê?"
