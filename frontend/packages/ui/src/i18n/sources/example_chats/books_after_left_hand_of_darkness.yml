    [Lewa ręka ciemności](wiki:The_Left_Hand_of_Darkness) [Ursuli K. Le Guin](wiki:Ursula_K._Le_Guin) wyróżnia się tym, że jej worldbuilding nie jest tylko malowniczym tłem; działa on jako antropologiczny eksperyment myślowy. Le Guin w słynny sposób opisała science fiction jako laboratorium do zadawania pytania *„co by było, gdyby?”* — badania tego, jak ludzkie relacje, instytucje i uprzedzenia kształtują się na nowo, gdy usunięta zostanie podstawowa zmienna (taka jak stała płeć biologiczna).

    Oto cztery książki, które kontynuują ten rodzaj worldbuildingu i społecznych dociekań:
    ---

    ### 1. *Wydziedziczeni* – Ursula K. Le Guin
    * **Kluczowe pytanie:** Czy społeczeństwo może osiągnąć prawdziwą wolność bez posiadania i jak wzajemne zobowiązania przetrwają instytucjonalizację?
    * **Dlaczego pasuje:** Osadzona w tym samym luźnym uniwersum [Cyklu Hain](wiki:Hainish_Cycle), powieść ta kontrastuje dwa sąsiadujące światy: Anarres, jałowy księżyc oparty na anarchosyndykalizmie i wspólnotowej solidarności, oraz Urras, bogatą w zasoby planetę podzieloną między konkurencyjny kapitalizm a autorytarny socjalizm. Podczas gdy *Lewa ręka ciemności* zgłębiała kwestie płci i osobistego zaufania (koncepcja *shifgrethor*), [Wydziedziczeni](wiki:The_Dispossessed) biorą pod lupę ekonomię, język i zbiorową odpowiedzialność, pytając, jak społeczności mogą wspierać jednostkę, pozostając wiernymi idei wzajemnej pomocy.### 2. *Świt* (trylogia *Miot Lilith* / *Ksenogeneza*) autorstwa [Octavii E. Butler](wiki:Octavia_E._Butler)
    * **Kluczowe pytanie:** Co definiuje ludzką naturę i co się dzieje, gdy przetrwanie wymaga rezygnacji z naszego dążenia do hierarchii i biologicznej autonomii?
    * **Dlaczego tu pasuje:** Podobnie jak Gethenianie u Le Guin, obcy Oankali posiadają trzy płcie (męską, żeńską i *ooloi*, którzy pośredniczą w rozmnażaniu i wymianie genetycznej). Butler podważa założenia czytelnika dotyczące zgody, struktur rodzinnych i współpracy. Narracja stawia pytanie, czy zabójczą wadą ludzkości jest połączenie wysokiej inteligencji z wrodzonym dążeniem do hierarchii — i czy możemy ewoluować poza dominację.### 3. *Zabójcza sprawiedliwość* autorstwa [Ann Leckie](wiki:Ann_Leckie)
    * **Kluczowe pytanie:** Jak instytucje imperialne kształtują tożsamość i jak wygląda świadomość oddzielona od indywidualnej ludzkiej formy?
    * **Dlaczego tu pasuje:** Imperium Radch stworzone przez Leckie nie dzieli społeczeństwa ze względu na płeć; w rzeczywistości w dominującym języku całkowicie brakuje znaczników rodzaju, a powszechnie używa się zaimków żeńskich. Poza lingwistyczną paralelą do badań Le Guin nad percepcją, historia – opowiedziana z perspektywy sztucznej inteligencji, niegdyś rozproszonej wewnątrz okrętu wojennego i tysięcy ludzkich ciał „pomocniczych” – zgłębia kwestie współudziału, obowiązku i indywidualnego sumienia w ramach ekspansjonistycznego imperium.### 4. *A Half-Built Garden* autorstwa [Ruthanny Emrys](wiki:Ruthanna_Emrys)
    * **Kluczowe pytanie:** Jak społeczności ludzkie mogą zorganizować demokratyczne zarządzanie zasobami, aby przetrwać katastrofę ekologiczną, i jak negocjować z kulturami zbudowanymi na fundamentalnie innych wartościach?
    * **Dlaczego tu pasuje:** Na Ziemi lat 80. XXI wieku, rządzonej przez sieci dorzeczy i komunalne kooperatywy ekologiczne, dochodzi do pierwszego kontaktu z obcym gatunkiem oferującym ratunek poprzez migrację. Książka skupia się intensywnie na dyplomacji, konsensusie społecznym, rodzicielstwie i podejmowaniu decyzji przez społeczność, oferując to samo niespieszne, antropologiczne tempo i etyczne niuanse, które można znaleźć w dziełach Le Guin.
