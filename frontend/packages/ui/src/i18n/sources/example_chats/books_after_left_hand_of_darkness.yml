    [Bàn tay trái của bóng tối](wiki:The_Left_Hand_of_Darkness) của [Ursula K. Le Guin](wiki:Ursula_K._Le_Guin) nổi bật bởi vì việc xây dựng thế giới trong đó không chỉ là phông nền cảnh vật; nó vận hành như một thí nghiệm tư duy nhân học. Le Guin nổi tiếng với việc mô tả khoa học viễn tưởng như một phòng thí nghiệm để đặt câu hỏi *"nếu như?"*—xem xét cách các mối quan hệ, thể chế và định kiến của con người tự định hình lại khi một biến số cơ bản (chẳng hạn như giới tính sinh học cố định) bị loại bỏ.

    Dưới đây là bốn cuốn sách tiếp nối kiểu xây dựng thế giới và tìm tòi xã hội đó:

    ---

    ### 1. *The Dispossessed* của Ursula K. Le Guin
    * **Câu hỏi cốt lõi:** Liệu một xã hội có thể đạt được tự do thực sự mà không cần sở hữu, và làm thế nào nghĩa vụ tương hỗ tồn tại được qua quá trình thể chế hóa?
    * **Tại sao nó phù hợp:** Lấy bối cảnh trong cùng vũ trụ [Chu kỳ Hainish](wiki:Hainish_Cycle) lỏng lẻo, cuốn tiểu thuyết này đối lập hai thế giới láng giềng: Anarres, một mặt trăng khô cằn được thành lập dựa trên chủ nghĩa vô chính phủ nghiệp đoàn và tình đoàn kết cộng đồng, và Urras, một hành tinh giàu tài nguyên bị chia cắt giữa chủ nghĩa tư bản cạnh tranh và chủ nghĩa xã hội độc tài. Trong khi *Bàn tay trái của bóng tối* điều tra về giới tính và sự tin tưởng cá nhân (khái niệm *shifgrethor*), [The Dispossessed](wiki:The_Dispossessed) xem xét kinh tế, ngôn ngữ và trách nhiệm tập thể, đặt câu hỏi làm thế nào các cộng đồng có thể nuôi dưỡng cá nhân trong khi vẫn cống hiến cho sự tương trợ lẫn nhau.

    ### 2. *Dawn* (thuộc bộ ba Lilith's Brood / Xenogenesis) của [Octavia E. Butler](wiki:Octavia_E._Butler)
    * **Câu hỏi cốt lõi:** Điều gì định nghĩa bản chất con người, và điều gì xảy ra khi sự sinh tồn đòi hỏi chúng ta phải từ bỏ khát vọng về thứ bậc và quyền tự chủ sinh học?
    * **Tại sao nó phù hợp:** Giống như người Gethen của Le Guin, loài ngoài hành tinh Oankali sở hữu ba giới tính (nam, nữ và *ooloi*, những người điều phối quá trình sinh sản và trao đổi di truyền). Butler thách thức những giả định của người đọc về sự đồng thuận, cấu trúc gia đình và sự hợp tác. Câu chuyện đặt câu hỏi liệu khiếm khuyết chết người của nhân loại có phải là sự kết hợp giữa trí thông minh cao đi kèm với bản năng hướng tới thứ bậc—và liệu chúng ta có thể tiến hóa vượt ra ngoài sự thống trị hay không.

    ### 3. *Ancillary Justice* của [Ann Leckie](wiki:Ann_Leckie)
    * **Câu hỏi cốt lõi:** Các thể chế đế quốc định hình bản sắc như thế nào, và ý thức trông sẽ ra sao khi tách rời khỏi hình hài con người cá nhân?
    * **Tại sao nó phù hợp:** Đế chế Radch của Leckie không chia cắt xã hội theo dòng giới tính; trên thực tế, ngôn ngữ thống trị hoàn toàn thiếu các dấu hiệu giới tính, sử dụng đại từ giống cái cho tất cả mọi người. Bên cạnh sự tương đồng về ngôn ngữ với việc khám phá nhận thức của Le Guin, câu chuyện—được kể từ góc nhìn của một trí tuệ nhân tạo trước đây được phân bổ trên một chiến hạm và hàng ngàn cơ thể "phụ trợ" (ancillary) của con người—đi sâu vào sự đồng lõa, nghĩa vụ và lương tâm cá nhân trong một đế chế bành trướng.

    ### 4. *A Half-Built Garden* của [Ruthanna Emrys](wiki:Ruthanna_Emrys)
    * **Câu hỏi cốt lõi:** Làm thế nào các cộng đồng nhân loại có thể tổ chức quản lý dân chủ để sống sót qua sự sụp đổ sinh thái, và làm thế nào chúng ta thương lượng với các nền văn hóa được xây dựng trên những giá trị khác biệt căn bản?
    * **Tại sao nó phù hợp:** Trong một Trái đất những năm 2080 được quản trị bởi các mạng lưới lưu vực sông và các hợp tác xã sinh thái cộng đồng, cuộc tiếp xúc đầu tiên xảy ra với một loài ngoài hành tinh đề nghị sự cứu rỗi thông qua việc di cư. Cuốn sách tập trung sâu sắc vào ngoại giao, sự đồng thuận của cộng đồng, quan hệ cha mẹ và việc ra quyết định của xã hội, mang lại nhịp độ nhân học thận trọng và sắc thái đạo đức tương tự như trong các tác phẩm của Le Guin.

