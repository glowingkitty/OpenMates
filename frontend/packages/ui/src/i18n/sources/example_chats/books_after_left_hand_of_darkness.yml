    [Levá ruka tmy](wiki:The_Left_Hand_of_Darkness) od [Ursuly K. Le Guinové](wiki:Ursula_K._Le_Guin) vyniká tím, že její budování světa není jen scénickou kulisou; funguje jako antropologický myšlenkový experiment. Le Guinová slavně popsala science fiction jako laboratoř pro otázku „co kdyby?“ – zkoumající, jak se lidské vztahy, instituce a předsudky přetvářejí, když je odstraněna základní proměnná (například pevně dané biologické pohlaví).

    Zde jsou čtyři knihy, které pokračují v tomto druhu budování světa a sociálního zkoumání:

    ---

    ### 1. *Vyděděnec* od Ursuly K. Le Guinové
    * **Základní otázka:** Může společnost dosáhnout skutečné svobody bez vlastnictví a jak přežije vzájemný závazek tváří v tvář institucionalizaci?
    * **Proč se sem hodí:** Tento román, odehrávající se ve stejném volném vesmíru [Hainského cyklu](wiki:Hainish_Cycle), staví do kontrastu dva sousední světy: Anarres, vyprahlý měsíc založený na anarchosyndikalismu a komunální solidaritě, a Urras, planetu bohatou na zdroje rozdělenou mezi dravý kapitalismus a autoritářský socialismus. Zatímco *Levá ruka tmy* zkoumala gender a osobní důvěru (koncept *šifgrethoru*), [Vyděděnec](wiki:The_Dispossessed) zkoumá ekonomii, jazyk a kolektivní odpovědnost a ptá se, jak mohou komunity rozvíjet jednotlivce a zároveň zůstat oddány vzájemné pomoci.

    ### 2. *Úsvit* (trilogie Xenogenesis / Lilithini potomci) od [Octavie E. Butlerové](wiki:Octavia_E._Butler)
    * **Základní otázka:** Co definuje lidskou povahu a co se stane, když přežití vyžaduje vzdát se naší touhy po hierarchii a biologické autonomii?
    * **Proč se sem hodí:** Stejně jako Getheňané u Le Guinové, i mimozemští Oankaliové mají tři pohlaví (samce, samice a *ooloi*, kteří zprostředkovávají reprodukci a genetickou výměnu). Butlerová zpochybňuje čtenářovy předpoklady o souhlasu, rodinných strukturách a spolupráci. Vyprávění se ptá, zda je smrtící chybou lidstva kombinace vysoké inteligence s vrozeným sklonem k hierarchii – a zda se dokážeme vyvinout nad rámec nadvlády.

    ### 3. *Ancilární spravedlnost* od [Ann Leckieové](wiki:Ann_Leckie)
    * **Základní otázka:** Jak imperiální instituce formují identitu a jak vypadá vědomí, když je odděleno od individuální lidské podoby?
    * **Proč se sem hodí:** Impérium Radch v podání Leckieové nerozděluje společnost podle genderu; dominantní jazyk dokonce postrádá genderové markery a univerzálně používá ženská zájmena. Kromě lingvistické paralely k průzkumu vnímání u Le Guinové se příběh – vyprávěný z pohledu umělé inteligence dříve rozprostřené v bitevní lodi a tisících lidských „ancilárních“ těl – noří do témat spoluviny, povinnosti a individuálního svědomí v rámci expanzivního impéria.

    ### 4. *A Half-Built Garden* od [Ruthanny Emrysové](wiki:Ruthanna_Emrys)
    * **Základní otázka:** Jak mohou lidské komunity organizovat demokratickou správu, aby přežily ekologický kolaps, a jak vyjednávat s kulturami postavenými na zásadně odlišných hodnotách?
    * **Proč se sem hodí:** Na Zemi v 80. letech 21. století, spravované sítěmi povodí a komunálními ekologickými družstvy, dojde k prvnímu kontaktu s mimozemským druhem nabízejícím spásu prostřednictvím migrace. Kniha se intenzivně zaměřuje na diplomacii, komunitní konsenzus, rodičovství a společenské rozhodování, přičemž nabízí stejně rozvážné, antropologické tempo a etické nuance jako díla Le Guinové.

