    [The Left Hand of Darkness](wiki:The_Left_Hand_of_Darkness) karya [Ursula K. Le Guin](wiki:Ursula_K._Le_Guin) menonjol karena pembangunan dunianya bukan sekadar latar belakang pemandangan; ia berfungsi sebagai eksperimen pemikiran antropologis. Le Guin secara terkenal mendeskripsikan fiksi ilmiah sebagai laboratorium untuk bertanya *"bagaimana jika?"*—memeriksa bagaimana hubungan manusia, institusi, dan prasangka membentuk kembali diri mereka ketika sebuah variabel fundamental (seperti jenis kelamin biologis yang tetap) dihilangkan.

    Berikut adalah empat buku yang melanjutkan jenis pembangunan dunia dan penyelidikan sosial tersebut:

    ---

    ### 1. *The Dispossessed* karya Ursula K. Le Guin
    * **Pertanyaan Inti:** Dapatkah sebuah masyarakat mencapai kebebasan sejati tanpa kepemilikan, dan bagaimana kewajiban timbal balik bertahan di tengah pelembagaan?
    * **Mengapa Ini Cocok:** Berlatar di semesta [Hainish Cycle](wiki:Hainish_Cycle) yang sama, novel ini mengontraskan dua dunia yang bertetangga: Anarres, bulan gersang yang didasarkan pada anarko-sindikalisme dan solidaritas komunal, dan Urras, planet kaya sumber daya yang terbagi antara kapitalisme kompetitif dan sosialisme otoriter. Jika *The Left Hand of Darkness* menyelidiki gender dan kepercayaan pribadi (konsep *shifgrethor*), [The Dispossessed](wiki:The_Dispossessed) memeriksa ekonomi, bahasa, dan tanggung jawab kolektif, menanyakan bagaimana komunitas dapat membina individu sambil tetap berbakti pada bantuan timbal balik.

    ### 2. *Dawn* (trilogi Lilith's Brood / Xenogenesis) karya [Octavia E. Butler](wiki:Octavia_E._Butler)
    * **Pertanyaan Inti:** Apa yang mendefinisikan sifat manusia, dan apa yang terjadi ketika kelangsungan hidup menuntut penyerahan dorongan kita akan hierarki dan otonomi biologis?
    * **Mengapa Ini Cocok:** Seperti kaum Gethenian karya Le Guin, alien Oankali memiliki tiga jenis kelamin (laki-laki, perempuan, dan *ooloi*, yang menengahi reproduksi dan pertukaran genetik). Butler menantang asumsi pembaca tentang persetujuan, struktur keluarga, dan kerja sama. Narasinya menanyakan apakah kelemahan mematikan kemanusiaan adalah kombinasi dari kecerdasan tinggi yang dipasangkan dengan dorongan bawaan menuju hierarki—dan apakah kita dapat berevolusi melampaui dominasi.

    ### 3. *Ancillary Justice* karya [Ann Leckie](wiki:Ann_Leckie)
    * **Pertanyaan Inti:** Bagaimana institusi kekaisaran membentuk identitas, dan seperti apa kesadaran ketika dipisahkan dari bentuk manusia individu?
    * **Mengapa Ini Cocok:** Kekaisaran Radch karya Leckie tidak membagi masyarakat berdasarkan garis gender; faktanya, bahasa yang dominan sama sekali tidak memiliki penanda gender, menggunakan kata ganti feminin secara universal. Di luar paralel linguistik dengan eksplorasi persepsi Le Guin, ceritanya—yang diceritakan dari sudut pandang kecerdasan buatan yang sebelumnya tersebar di sebuah kapal perang dan ribuan tubuh "tambahan" (ancillary) manusia—mendalami keterlibatan, tugas, dan hati nurani individu dalam sebuah kekaisaran ekspansionis.

    ### 4. *A Half-Built Garden* karya [Ruthanna Emrys](wiki:Ruthanna_Emrys)
    * **Pertanyaan Inti:** Bagaimana komunitas manusia dapat mengatur penatalayanan demokratis untuk bertahan dari keruntuhan ekologis, dan bagaimana kita bernegosiasi dengan budaya yang dibangun di atas nilai-nilai yang mendasarinya berbeda?
    * **Mengapa Ini Cocok:** Di Bumi tahun 2080-an yang diperintah oleh jaringan daerah aliran sungai dan koperasi ekologi komunal, kontak pertama terjadi dengan spesies alien yang menawarkan keselamatan melalui migrasi. Buku ini berfokus secara intensif pada diplomasi, konsensus komunitas, pengasuhan, dan pengambilan keputusan masyarakat, menawarkan tempo antropologis yang sengaja dan nuansa etis yang sama seperti yang ditemukan dalam karya-karya Le Guin.

