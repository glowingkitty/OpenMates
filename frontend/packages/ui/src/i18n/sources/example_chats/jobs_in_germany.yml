    **Identifierar tyska möjligheter**
    
    Jag fokuserar för närvarande på att ringa in relevanta lediga tjänster i Tyskland. Jag har börjat med att sammanställa en lista över lovande källor: `80,000 Hours`, `Hard Problems`, `Arbeitnow` och `Bundesagentur für Arbeit`. Mitt huvudintresse ligger inom roller för forskning, design och programvaruteknik, och jag kommer att hålla ett noga öga på platsaspekten.
    
    
    **Förfinar sökparametrar**
    
    Jag förfinar nu mitt tillvägagångssätt för att använda verktyget `jobs-search` effektivt. Jag fokuserar på `requests`-arrayen för att göra en serie sökningar och specificera leverantörerna direkt, givet gränsen på 5 förfrågningar. Jag kontrollerar funktionsdefinitionen för att bekräfta hur man anger leverantörer explicit som en lista, och hur man definierar relevanskriterier. Detta kommer att hjälpa till med att skapa en lista med arbetsgivare, plats, källa och ansökningslänk. Mitt mål är att undvika antaganden om distansarbete eller lön där det inte uttryckligen anges.
    
    
