      * **स्थान:** बर्लिन
      * **स्रोत:** Federal Employment Agency
      * **कार्य व्यवस्था और वेतन:** टेक्स्ट में लचीले/मोबाइल विकल्पों का उल्लेख है, लेकिन कोई निश्चित रिमोट स्थिति नहीं बताई गई है; वेतन निर्दिष्ट नहीं है
