    Obecnie koncentruję się na ocenie dwóch obiecujących możliwości. Pierwszą z nich jest „Joint Fellowship Program” w Instytucie Badań nad Pokojem i Polityką Bezpieczeństwa Uniwersytetu w Hamburgu, a drugą stanowisko „Asystenta Studenckiego” w ramach programu Interface Cybersecurity. Starannie rozważam ich zalety odpowiednio w kontekście badań nad pokojem i bezpieczeństwem oraz cyberbezpieczeństwa.
    
    
