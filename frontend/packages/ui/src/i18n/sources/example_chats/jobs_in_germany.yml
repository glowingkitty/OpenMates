    إليك قائمة مختصرة بالوظائف الشاغرة الحالية في ألمانيا في مجالات البحث والتصميم وهندسة البرمجيات من [80,000 Hours](wiki:80,000_Hours)، و**Hard Problems**، و**Arbeitnow**، و**وكالة التوظيف الفيدرالية** (*Bundesagentur für Arbeit*). 
    
    ---
    
    ### التصميم
    
    * **مصمم منتجات أول (Senior Product Designer)**
      * **صاحب العمل:** voize (تطوير ذكاء اصطناعي للتعرف على الكلام لتبسيط التوثيق في التمريض والرعاية السريرية)
      * **الموقع:** برلين، ألمانيا (مُدرجة كقابلة للعمل عن بُعد)
      * **المصدر:** Hard Problems
      * **الراتب:** غير محدد
      * **التقديم:** [تقدم عبر voize](embed:senior-product-designer-Wid)
    
    * **تصميم واجهة وتجربة المستخدم (UI/UX Design) (ذكر/أنثى/متنوع)**
      * **صاحب العمل:** stiftung ear (السجل الوطني لتنسيق التخلص من النفايات الإلكترونية واستعادتها وتتبع الاقتصاد الدائري)
      * **الموقع:** نورنبرغ، بافاريا
      * **المصدر:** وكالة التوظيف الفيدرالية
      * **نظام العمل والراتب:** ذُكرت خيارات عمل مرنة/متنقلة في وصف الإعلان، ولكن لا يوجد تصنيف رسمي للعمل عن بُعد بالكامل؛ الراتب غير محدد
      * **التقديم:** [تقدم عبر وكالة التوظيف الفيدرالية](embed:ui-ux-design-1Bm)
    
    ---
    
    ### البحث
    
    * **برنامج زمالة مشترك (سياسة السلام والأمن)**
      * **صاحب العمل:** [جامعة هامبورغ](wiki:University_of_Hamburg) ومعهد أبحاث السلام وسياسة الأمن (IFSH)
      * **الموقع:** هامبورغ، ألمانيا
      * **المصدر:** 80,000 Hours
      * **نظام العمل والراتب:** غير محدد
      * **التقديم:** [تقدم عبر IFSH / 80,000 Hours](embed:joint-fellowship-program-iLH)
    
    * **باحث مشارك (ذكر/أنثى/متنوع) – تعلم الآلة واتخاذ القرار في ظل عدم اليقين**
      * **صاحب العمل:** [جامعة الرور في بوخوم](wiki:Ruhr_University_Bochum)
      * **الموقع:** بوخوم، شمال الراين-وستفاليا
      * **المصدر:** وكالة التوظيف الفيدرالية
      * **نظام العمل والراتب:** دوام كامل (39.83 ساعة/أسبوع)؛ لم يتم تحديد ترتيبات العمل عن بُعد؛ الأجر وفقاً لسلم الرواتب العام TV-L E13 (المبلغ الدقيق غير منشور في الإعلان)
      * **التقديم:** [تقدم عبر وكالة التوظيف الفيدرالية](embed:research-associate-m-79L)
    
    * **مهندس أبحاث (أنثى/ذكر/متنوع) – إزالة الكربون من الشبكة والتكنولوجيا الأساسية**
      * **صاحب العمل:** [سيمنز للطاقة](wiki:Siemens_Energy)
      * **الموقع:** برلين
      * **المصدر:** وكالة التوظيف الفيدرالية
      * **نظام العمل والراتب:** ذُكرت خيارات مرنة/متنقلة في النص، ولكن لم يتم ذكر حالة عمل عن بُعد ثابتة؛ الراتب غير محدد
      * **التقديم:** [تقدم عبر وكالة التوظيف الفيدرالية](embed:research-engineer-f-7ao)
    
    ---
    
    ### هندسة البرمجيات
    
    * **مهندس خلفية أول (ذكر/أنثى/متنوع) – Java/Kotlin, AWS, Kafka**
      * **صاحب العمل:** idealo internet GmbH
      * **الموقع:** برلين، ألمانيا
      * **المصدر:** Arbeitnow
      * **نظام العمل والراتب:** في الموقع/بيئة مكتبية هجينة؛ الراتب غير محدد
      * **التقديم:** [تقدم عبر Arbeitnow](embed:senior-backend-engineer-q7x)
    
    * **طالب متدرب – هندسة البرمجيات (الرؤية الحاسوبية / الأنظمة المستقلة)**
