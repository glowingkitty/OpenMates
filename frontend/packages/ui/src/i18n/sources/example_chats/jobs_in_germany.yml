    2. **Verhältnis zwischen Design und QA:** *"In der Anzeige wird neben UX/UI-Design auch die Implementierung von Softwaretests erwähnt. Welcher Prozentsatz der Rolle entfällt auf User Research/Prototyping im Vergleich zur technischen Softwarevalidierung und Qualitätssicherung?"*
