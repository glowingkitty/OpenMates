      * **الموقع:** غيلشينغ، بافاريا
      * **المصدر:** Arbeitnow
      * **نظام العمل والراتب:** في الموقع/هجين؛ الراتب غير محدد
      * **التقديم:** [تقدم عبر Arbeitnow](embed:working-student-software-VX8)
