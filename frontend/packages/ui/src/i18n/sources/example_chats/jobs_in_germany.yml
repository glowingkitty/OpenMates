    이제 새로운 공고들을 데이터 세트에 통합하고 있어. 연방 고용청에서 보훔 루르 대학교의 연구원(Research Associate) 직무를 추가하고 원격 근무 및 급여 세부 정보를 기록했어. 또한 유연한 옵션이 포함된 지멘스 에너지의 연구 엔지니어 직무에 대한 정보도 취합했어. 지원 링크에 임베드를 사용하여 링크 형식의 일관성을 보장하고 있어.
    
    
    **새로운 공고 추가**
    
    방금 두 개의 새로운 공고를 추가했어. 위치가 지정되지 않은 시니어 백엔드 엔지니어 직무와 길힝(Gilching)에 위치한 Quantum-Systems GmbH의 워킹 스튜던트 직무야. 위치, 원격 근무 옵션, 급여 정보(가능한 경우), 표준화된 형식의 지원 링크를 포함하여 모든 세부 정보를 정확하게 캡처하는 데 집중하고 있어. 지원 링크에는 `(embed:embed_ref)` 형식을 사용하고 있어.
  it: |
    **Identificazione delle opportunità in Germania**
    
    Al momento mi sto concentrando sull'individuazione di offerte di lavoro pertinenti in Germania. Ho iniziato compilando un elenco di fonti promettenti: `80,000 Hours`, `Hard Problems`, `Arbeitnow` e l'Agenzia federale per l'impiego (`Federal Employment Agency`). Il mio interesse principale riguarda i ruoli di ricerca, design e ingegneria del software, e terrò d'occhio l'aspetto relativo alla posizione geografica.
    
    
    **Perfezionamento dei parametri di ricerca**
    
    Sto affinando il mio approccio per utilizzare lo strumento `jobs-search` in modo efficace. Mi sto concentrando sull'array `requests` per effettuare una serie di query e specificare direttamente i provider, dato il limite di 5 richieste. Sto controllando la definizione della funzione per confermare come fornire esplicitamente i provider come elenco e come definire i criteri di pertinenza. Questo aiuterà a creare una lista ristretta con datore di lavoro, posizione, fonte e link per la candidatura. Il mio obiettivo è evitare supposizioni sul lavoro da remoto o sullo stipendio dove non esplicitamente indicato.
    
    
    **Esame dei risultati dei provider**
    
    Bene, ho dato un'occhiata iniziale ai provider restituiti. Sembra che abbiamo "Hard Problems" e un paio da Arbeitnow; uno è un ruolo senior in ingegneria backend (Java/Kotlin) e l'altro è un ruolo per studenti lavoratori. Sto annotando le prime impressioni e valutando il potenziale impatto di ogni annuncio.
    
    
    **Analisi delle opportunità attuali**
    
    Al momento mi sto concentrando sulla valutazione di due opportunità promettenti. La prima è un "Joint Fellowship Program" presso l'Istituto per la ricerca sulla pace e la politica di sicurezza dell'Università di Amburgo, e la seconda è una posizione di "Assistente studentesco" all'interno dell'Interface Cybersecurity Programme. Sto considerando attentamente i rispettivi meriti nel contesto della ricerca sulla pace e la sicurezza e della cybersicurezza.
    
    
    **Assegnazione delle priorità ai nuovi contatti**
    
    Ho spostato la mia attenzione sulla cura di una lista ristretta equilibrata. Sto dando priorità alle opportunità nel design e nella ricerca, concentrandomi sulla pertinenza e sui post recenti. Attualmente, sto esaminando un ruolo di Senior Product Designer presso voize a Berlino e una posizione di UI/UX Design presso stiftung ear. Per la ricerca, sto esaminando un ruolo presso la Ruhr-Universität Bochum, insieme al Joint Fellowship Program ad Amburgo.
    
    
    **Valutazione di nuove possibilità**
    
    Sto ora soppesando nuovi contatti alla luce dei miei criteri. Ho scoperto opzioni come un ruolo di Research Engineer presso Siemens Energy, Berlino, tramite l'Agenzia federale per l'impiego, che si concentra sulla ricerca fondamentale. Sto anche considerando i ruoli di Senior Backend e Junior C++ Software Developer rispettivamente presso idealo internet GmbH (Berlino, Arbeitnow) e CT Software Engineering (Ingolstadt, Agenzia federale per l'impiego). Questi si adattano ai miei interessi nell'ingegneria del software.
    
    
    **Perfezionamento dei criteri di candidatura**
    
    Sto ora chiarendo come gestire i link per la candidatura. Devo ricordarmi di dare priorità a processi di candidatura chiari, controllando l'uso di `[testo visualizzato](embed:embed_ref)` o link standard. Inoltre, dovrei evitare di presumere il lavoro da remoto o di rivelare lo stipendio a meno che non sia esplicitamente indicato nell'annuncio.
    
    
    **Chiarimento dei protocolli di candidatura**
    
    Mi sto ora concentrando sui formati dei link per la candidatura. Mi sto assicurando l'integrazione diretta dei link o l'uso del formato `(embed:embed_ref)`, garantendo di non fornire entrambi. Sto esaminando attentamente gli URL restituiti dalle app skill per garantirne la conformità. Punto a rispettare la regola di utilizzare un solo stile di link per ogni link di candidatura.
    
    
    **Standardizzazione dei link di candidatura**
    
    Sto ora implementando la strategia per i link di candidatura. Il mio obiettivo è standardizzare il formato per gli annunci di lavoro. Utilizzerò solo il riferimento embed per i link di candidatura. Includerò anche ruolo, datore di lavoro, posizione e fonte per ogni posto vacante e utilizzerò un link incorporato. Mi assicurerò di utilizzare sempre un solo link per ogni posizione.
    
    
    **Compilazione dei dati sulle opportunità**
    
    Sto ora raccogliendo i dettagli per più opportunità. Ho informazioni per un ruolo di Senior Product Designer presso voize, una posizione di UI/UX Design presso stiftung ear e il Joint Fellowship Program presso l'Università di Amburgo. Sto annotando il ruolo, il datore di lavoro, la posizione e la fonte per ciascuno, nonché le specifiche su remoto e stipendio. Mi sto concentrando sulla garanzia di formati di link coerenti utilizzando gli embed per ogni candidatura.
    
    
    **Integrazione di nuovi annunci**
    
    Sto ora integrando nuovi annunci nel set di dati. Ho aggiunto una posizione di ricercatore associato presso la Ruhr-Universität Bochum, reperendola dall'Agenzia federale per l'impiego e annotando i dettagli relativi al lavoro da remoto e allo stipendio. Inoltre, ho raccolto informazioni su un ruolo di Research Engineer presso Siemens Energy, incluse le opzioni flessibili. Sto garantendo la coerenza nei formati dei link, utilizzando gli embed per i link di candidatura.
    
    
    **Aggiunta di nuovi annunci**
    
    Ho appena aggiunto due nuovi annunci: un ruolo di Senior Backend Engineer in una posizione non specificata e una posizione di studente lavoratore presso Quantum-Systems GmbH a Gilching. Mi sto concentrando sull'acquisizione accurata di tutti i dettagli, inclusi posizione, opzioni di lavoro da remoto, informazioni sullo stipendio (ove disponibili) e link di candidatura nel formato standardizzato. Sto utilizzando il formato `(embed:embed_ref)` per il link di candidatura.
  tr: |
    **Almanya'daki Fırsatların Belirlenmesi**
    
    Şu anda Almanya'daki ilgili iş ilanlarını tespit etmeye odaklanmış durumdayım. İşe gelecek vaat eden kaynaklardan oluşan bir liste derleyerek başladım: `80,000 Hours`, `Hard Problems`, `Arbeitnow` ve `Federal İstihdam Kurumu`. Temel ilgi alanım araştırma, tasarım ve yazılım mühendisliği rollerinde yatıyor ve konum unsurunu yakından takip edeceğim.
    
    
    **Arama Parametrelerinin İyileştirilmesi**
    
    Şimdi `jobs-search` aracını etkili bir şekilde kullanmak için yaklaşımımı geliştiriyorum. 5 istek sınırı göz önüne alındığında, bir dizi sorgu yapmak ve sağlayıcıları doğrudan belirtmek için `requests` dizisine odaklanıyorum. Sağlayıcıların bir liste olarak açıkça nasıl sunulacağını ve alaka düzeyi kriterlerinin nasıl tanımlanacağını onaylamak için fonksiyon tanımını kontrol ediyorum. Bu; işveren, konum, kaynak ve başvuru bağlantısını içeren bir kısa liste oluşturmaya yardımcı olacak. Amacım, açıkça belirtilmediği sürece uzaktan çalışma veya maaş hakkında varsayımlarda bulunmaktan kaçınmak.
    
    
    **Sağlayıcı Dönüşlerinin İncelenmesi**
    
    Tamam, geri dönen sağlayıcılara ilk bakışımı attım. Görünüşe göre elimizde "Hard Problems" ve Arbeitnow'dan birkaç ilan var; biri arka uç mühendisliğinde (Java/Kotlin) kıdemli bir rol, diğeri ise çalışan öğrenci rolü. İlk izlenimleri not ediyor ve her bir ilanın potansiyel etkisini değerlendiriyorum.
    
    
    **Mevcut Fırsatların Analiz Edilmesi**
    
    Şu anda gelecek vaat eden iki fırsatı değerlendirmeye odaklanmış durumdayım. Birincisi Hamburg Üniversitesi Barış Araştırmaları ve Güvenlik Politikası Enstitüsü'ndeki "Ortak Burs Programı", ikincisi ise Arayüz Siber Güvenlik Programı bünyesindeki "Öğrenci Asistanı" pozisyonu. Bunların barış ve güvenlik araştırmaları ile siber güvenlik bağlamındaki değerlerini sırasıyla dikkatle değerlendiriyorum.
    
    
    **Yeni Adayların Önceliklendirilmesi**
    
    Dikkatimi dengeli bir kısa liste oluşturmaya kaydırdım. Alaka düzeyine ve son ilanlara odaklanarak tasarım ve araştırma alanındaki fırsatlara öncelik veriyorum. Şu anda Berlin'deki voize'da Kıdemli Ürün Tasarımcısı rolünü ve stiftung ear'daki UI/UX Tasarım pozisyonunu inceliyorum. Araştırma için, Hamburg'daki Ortak Burs Programı'nın yanı sıra Ruhr-Universität Bochum'daki bir rolü gözden geçiriyorum.
    
    
    **Yeni Olasılıkların Değerlendirilmesi**
    
    Şimdi yeni adayları kriterlerim ışığında tartıyorum. Federal İstihdam Kurumu aracılığıyla Berlin'deki Siemens Energy'de temel araştırmaya odaklanan bir Araştırma Mühendisi rolü gibi seçenekler ortaya çıkardım. Ayrıca sırasıyla idealo internet GmbH (Berlin, Arbeitnow) ve CT Software Engineering'deki (Ingolstadt, Federal İstihdam Kurumu) Kıdemli Arka Uç ve Küçük C++ Yazılım Geliştirici rollerini de değerlendiriyorum. Bunlar yazılım mühendisliğine olan ilgime uygun.
    
    
    **Başvuru Kriterlerinin İyileştirilmesi**
    
    Şimdi başvuru bağlantılarının nasıl ele alınacağını netleştiriyorum. `[görünen metin](embed:embed_ref)` veya standart bağlantıların kullanımını kontrol ederek net başvuru süreçlerine öncelik vermeyi unutmamalıyım. Ayrıca, ilanda açıkça belirtilmediği sürece uzaktan çalışma varsayımında bulunmaktan veya maaş bilgisini paylaşmaktan kaçınmalıyım.
    
    
    **Başvuru Protokollerinin Netleştirilmesi**
    
    Şimdi başvuru bağlantısı formatlarına odaklanıyorum. Doğrudan bağlantı entegrasyonunu veya `(embed:embed_ref)` formatının kullanımını sağlamaya odaklanarak her ikisini birden sunmadığımdan emin oluyorum. Uyumluluğu sağlamak için uygulama becerilerinden dönen URL'leri dikkatle gözden geçiriyorum. İş başvurusu bağlantısı başına yalnızca bir bağlantı stili kullanma kuralına uymayı hedefliyorum.
    
    
    **Başvuru Bağlantılarının Standartlaştırılması**
    
    Şimdi başvuru bağlantısı stratejisini uyguluyorum. Amacım iş ilanları için formatı standartlaştırmak. Başvuru bağlantıları için yalnızca gömülü referansı (embed ref) kullanacağım. Ayrıca her boş pozisyon için rol, işveren, konum ve kaynağı dahil edeceğim ve gömülü bir bağlantı kullanacağım. Her boş pozisyon için her zaman tek bir bağlantı kullandığımdan emin olacağım.
    
    
    **Fırsat Verilerinin Derlenmesi**
    
    Şimdi birden fazla fırsat için ayrıntıları topluyorum. voize'daki Kıdemli Ürün Tasarımcısı rolü, stiftung ear'daki UI/UX Tasarım pozisyonu ve Hamburg Üniversitesi'ndeki Ortak Burs Programı için bilgilere sahibim. Her biri için rolü, işvereni, konumu ve kaynağı, ayrıca uzaktan çalışma ve maaş özelliklerini not ediyorum. Her başvuru için gömülü bağlantılar kullanarak tutarlı bağlantı formatları sağlamaya odaklanıyorum.
    
    
    **Yeni İlanların Entegre Edilmesi**
    
    Şimdi yeni ilanları veri setine entegre ediyorum. Ruhr-Universität Bochum'daki bir Araştırma Görevlisi pozisyonunu Federal İstihdam Kurumu'ndan temin ederek ve uzaktan çalışma ile maaş ayrıntılarını not ederek ekledim. Ayrıca, esnek seçenekler de dahil olmak üzere Siemens Energy'deki bir Araştırma Mühendisi rolü hakkında bilgi derledim. Başvuru bağlantıları için gömülü bağlantılar kullanarak bağlantı formatlarında tutarlılık sağlıyorum.
    
    
    **Yeni İlanların Eklenmesi**
    
    Belirtilmemiş bir konumdaki Kıdemli Arka Uç Mühendisi rolü ve Gilching'deki Quantum-Systems GmbH'deki bir Çalışan Öğrenci pozisyonu olmak üzere iki yeni ilan ekledim. Konum, uzaktan çalışma seçenekleri, maaş bilgileri (varsa) ve standart formattaki başvuru bağlantıları dahil olmak üzere tüm ayrıntıları doğru bir şekilde yakalamaya odaklanıyorum. Başvuru bağlantısı için `(embed:embed_ref)` formatını kullanıyorum.
  vi: |
    **Xác định các cơ hội tại Đức**
    
    Tôi hiện đang tập trung vào việc xác định các vị trí tuyển dụng phù hợp tại Đức. Tôi đã bắt đầu bằng cách tổng hợp danh sách các nguồn đầy hứa hẹn: `80,000 Hours`, `Hard Problems`, `Arbeitnow` và `Cơ quan Việc làm Liên bang`. Mối quan tâm chính của tôi nằm ở các vai trò nghiên cứu, thiết kế và kỹ thuật phần mềm, và tôi sẽ theo dõi sát sao khía cạnh địa điểm.
    
    
    **Tinh chỉnh các tham số tìm kiếm**
    
    Bây giờ tôi đang tinh chỉnh cách tiếp cận của mình để sử dụng công cụ `jobs-search` một cách hiệu quả. Tôi đang tập trung vào mảng `requests` để thực hiện một loạt các truy vấn và chỉ định trực tiếp các nhà cung cấp, do giới hạn là 5 yêu cầu. Tôi đang kiểm tra định nghĩa hàm để xác nhận cách cung cấp danh sách nhà cung cấp một cách rõ ràng và cách xác định các tiêu chí liên quan. Điều này sẽ giúp tạo ra một danh sách rút gọn bao gồm nhà tuyển dụng, địa điểm, nguồn và liên kết ứng tuyển. Mục tiêu của tôi là tránh đưa ra các giả định về làm việc từ xa hoặc mức lương nếu không được nêu rõ.
    
    
    **Kiểm tra kết quả từ nhà cung cấp**
    
    Được rồi, tôi đã có cái nhìn đầu tiên về các nhà cung cấp được trả về. Có vẻ như chúng ta có "Hard Problems" và một vài vị trí từ Arbeitnow; một là vai trò kỹ sư backend cấp cao (Java/Kotlin), và vai trò còn lại là sinh viên vừa học vừa làm. Tôi đang ghi lại những ấn tượng ban đầu và đánh giá tác động tiềm năng của từng tin tuyển dụng.
    
    
    **Phân tích các cơ hội hiện tại**
    
    Tôi hiện đang tập trung vào việc đánh giá hai cơ hội đầy hứa hẹn. Đầu tiên là "Chương trình Nghiên cứu sinh chung" tại Viện Nghiên cứu Hòa bình và Chính sách An ninh của Đại học Hamburg, và thứ hai là vị trí "Trợ lý Sinh viên" trong Chương trình An ninh mạng Giao diện. Tôi đang xem xét kỹ lưỡng những giá trị tương ứng của chúng trong bối cảnh nghiên cứu hòa bình và an ninh, cũng như an ninh mạng.
    
    
    **Ưu tiên các đầu mối mới**
    
    Tôi đã chuyển sự chú ý của mình sang việc biên soạn một danh sách rút gọn cân bằng. Tôi đang ưu tiên các cơ hội trong lĩnh vực thiết kế và nghiên cứu, tập trung vào mức độ phù hợp và các bài đăng gần đây. Hiện tại, tôi đang xem xét vai trò Nhà thiết kế Sản phẩm Cấp cao tại voize ở Berlin và vị trí Thiết kế UI/UX tại stiftung ear. Đối với nghiên cứu, tôi đang xem xét một vai trò tại Đại học Ruhr Bochum, cùng với Chương trình Nghiên cứu sinh chung ở Hamburg.
    
    
    **Đánh giá các khả năng mới**
    
    Bây giờ tôi đang cân nhắc các đầu mối mới dựa trên các tiêu chí của mình. Tôi đã phát hiện ra các lựa chọn, như vai trò Kỹ sư Nghiên cứu tại Siemens Energy, Berlin, thông qua Cơ quan Việc làm Liên bang, tập trung vào nghiên cứu cơ bản. Tôi cũng đang xem xét các vai trò Kỹ sư Backend Cấp cao và Nhà phát triển Phần mềm C++ Cấp thấp tại idealo internet GmbH (Berlin, Arbeitnow) và CT Software Engineering (Ingolstadt, Cơ quan Việc làm Liên bang). Những vị trí này phù hợp với sở thích của tôi trong lĩnh vực kỹ thuật phần mềm.
    
    
    **Tinh chỉnh tiêu chí ứng tuyển**
    
    Bây giờ tôi đang làm rõ cách xử lý các liên kết ứng tuyển. Tôi phải nhớ ưu tiên các quy trình ứng tuyển rõ ràng, kiểm tra việc sử dụng `[văn bản hiển thị](embed:embed_ref)` hoặc các liên kết tiêu chuẩn. Hơn nữa, tôi nên tránh giả định về làm việc từ xa hoặc tiết lộ mức lương trừ khi nó được nêu rõ trong tin tuyển dụng.
    
    
    **Làm rõ các giao thức ứng tuyển**
    
    Bây giờ tôi đang tập trung vào các định dạng liên kết ứng tuyển. Tôi đang tập trung vào việc đảm bảo tích hợp liên kết trực tiếp hoặc sử dụng định dạng `(embed:embed_ref)`, đảm bảo tôi không cung cấp cả hai. Tôi đang xem xét kỹ các URL được trả về từ các kỹ năng ứng dụng để đảm bảo tuân thủ. Tôi đặt mục tiêu tuân thủ quy tắc chỉ sử dụng một kiểu liên kết cho mỗi liên kết ứng tuyển công việc.
    
    
    **Tiêu chuẩn hóa các liên kết ứng tuyển**
    
    Bây giờ tôi đang triển khai chiến lược liên kết ứng tuyển. Mục tiêu của tôi là tiêu chuẩn hóa định dạng cho các tin tuyển dụng. Tôi sẽ chỉ sử dụng tham chiếu nhúng cho các liên kết ứng tuyển. Tôi cũng sẽ kết hợp vai trò, nhà tuyển dụng, địa điểm và nguồn cho mỗi vị trí trống và sử dụng một liên kết nhúng. Tôi sẽ đảm bảo luôn sử dụng một liên kết cho mỗi vị trí trống.
    
    
    **Tổng hợp dữ liệu cơ hội**
    
    Bây giờ tôi đang đối chiếu chi tiết cho nhiều cơ hội. Tôi có thông tin cho vai trò Nhà thiết kế Sản phẩm Cấp cao tại voize, vị trí Thiết kế UI/UX tại stiftung ear và Chương trình Nghiên cứu sinh chung tại Đại học Hamburg. Tôi đang ghi lại vai trò, nhà tuyển dụng, địa điểm và nguồn cho mỗi vị trí, cũng như các thông số kỹ thuật về làm việc từ xa và mức lương. Tôi đang tập trung vào việc đảm bảo định dạng liên kết nhất quán bằng cách sử dụng các bản nhúng cho mỗi lần ứng tuyển.
    
    
    **Tích hợp các tin tuyển dụng mới**
    
    Bây giờ tôi đang tích hợp các tin tuyển dụng mới vào bộ dữ liệu. Tôi đã thêm một vị trí Cộng tác viên Nghiên cứu tại Đại học Ruhr Bochum, lấy nguồn từ Cơ quan Việc làm Liên bang và ghi chú các chi tiết về làm việc từ xa và mức lương của vị trí đó. Ngoài ra, tôi đã tổng hợp thông tin về vai trò Kỹ sư Nghiên cứu tại Siemens Energy, bao gồm các tùy chọn linh hoạt. Tôi đang đảm bảo tính nhất quán trong định dạng liên kết, sử dụng các bản nhúng cho các liên kết ứng tuyển.
    
    
    **Thêm các tin tuyển dụng mới**
    
    Tôi vừa thêm hai tin tuyển dụng mới, một vai trò Kỹ sư Backend Cấp cao tại một địa điểm không xác định và một vị trí Sinh viên vừa học vừa làm tại Quantum-Systems GmbH ở Gilching. Tôi đang tập trung vào việc nắm bắt chính xác tất cả các chi tiết, bao gồm địa điểm, các tùy chọn làm việc từ xa, thông tin mức lương (nếu có) và các liên kết ứng tuyển theo định dạng tiêu chuẩn. Tôi đang sử dụng định dạng `(embed:embed_ref)` cho liên kết ứng tuyển.
