    **Analyserar aktuella möjligheter**
    
    Jag fokuserar för närvarande på att utvärdera två lovande möjligheter. Den första är ett "Joint Fellowship Program" vid Hamburgs universitets institut för fredsforskning och säkerhetspolitik, och den andra är en tjänst som "Student Assistant" inom Interface Cybersecurity Programme. Jag överväger noggrant deras respektive meriter i sammanhanget freds- och säkerhetsforskning respektive cybersäkerhet.
    
    
