    **Zoekparameters verfijnen**
    
    Ik verfijn nu mijn aanpak om de `jobs-search` tool effectief te gebruiken. Ik richt me op de `requests` array om een reeks zoekopdrachten uit te voeren en de aanbieders rechtstreeks te specificeren, gezien de limiet van 5 verzoeken. Ik controleer de functiedefinitie om te bevestigen hoe ik aanbieders expliciet als lijst kan opgeven en hoe ik relevantiecriteria definieer. Dit helpt bij het maken van een shortlist met werkgever, locatie, bron en sollicitatielink. Mijn doel is om aannames over werken op afstand of salaris te vermijden wanneer dit niet expliciet wordt vermeld.
    
    
