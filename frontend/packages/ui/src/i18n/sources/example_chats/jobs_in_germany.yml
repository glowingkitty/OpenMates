  ru: |
    **Поиск возможностей в Германии**
    
    Сейчас я сосредоточен на поиске подходящих вакансий в Германии. Я начал с составления списка перспективных источников: `80,000 Hours`, `Hard Problems`, `Arbeitnow` и `Федеральное агентство занятости`. Мой основной интерес лежит в области исследований, дизайна и разработки программного обеспечения, при этом я буду внимательно следить за местоположением.
    
    
    **Уточнение параметров поиска**
    
