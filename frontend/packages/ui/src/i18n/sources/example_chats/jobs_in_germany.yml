summary:
  context: "Summary of example chat: Meaningful Jobs in Germany"
  en: "Search four job platforms for German vacancies, then compare design roles and prepare questions for employers."
  de: Durchsuche vier Jobplattformen nach Stellenangeboten in Deutschland, vergleiche Design-Rollen und bereite Fragen für Arbeitgeber vor.
  zh: 在四个招聘平台搜索德国职位空缺，然后比较设计岗位并为雇主准备面试问题。
  es: Busca vacantes en Alemania en cuatro plataformas de empleo, compara puestos de diseño y prepara preguntas para los empleadores.
  fr: "Recherche des offres d'emploi en Allemagne sur quatre plateformes, puis compare les rôles en design et prépare des questions pour les employeurs."
  pt: Pesquisa vagas na Alemanha em quatro plataformas de emprego, compara funções de design e prepara perguntas para os empregadores.
  ru: Поиск вакансий в Германии на четырех платформах, сравнение ролей в дизайне и подготовка вопросов для работодателей.
  ja: 4つの求人プラットフォームでドイツの求人を検索。デザイン職の比較や雇用主への質問の準備を行います。
  ko: 4개의 채용 플랫폼에서 독일 내 공고를 검색하고, 디자인 직무를 비교한 뒤 고용주에게 할 질문을 준비해.
  it: Cerca offerte di lavoro in Germania su quattro piattaforme, poi confronta i ruoli di design e prepara delle domande per i datori di lavoro.
  tr: "Almanya'daki iş ilanları için dört platformda arama yap, tasarım rollerini karşılaştır ve işverenler için sorular hazırla."
  vi: Tìm kiếm các vị trí tuyển dụng tại Đức trên bốn nền tảng việc làm, sau đó so sánh các vai trò thiết kế và chuẩn bị câu hỏi cho nhà tuyển dụng.
  id: Cari di empat platform lowongan kerja untuk lowongan di Jerman, lalu bandingkan peran desain dan siapkan pertanyaan untuk pemberi kerja.
  pl: Przeszukaj cztery platformy z ofertami pracy w Niemczech, porównaj role projektowe i przygotuj pytania dla pracodawców.
  nl: Doorzoek vier vacatureplatforms voor Duitse vacatures, vergelijk vervolgens design-rollen en bereid vragen voor werkgevers voor.
  ar: ابحث في أربع منصات توظيف عن وظائف شاغرة في ألمانيا، ثم قارن بين أدوار التصميم وجهّز أسئلة لأصحاب العمل.
  hi: जर्मनी में रिक्तियों के लिए चार जॉब प्लेटफॉर्म पर खोजें, फिर डिज़ाइन भूमिकाओं की तुलना करें और नियोक्ताओं के लिए प्रश्न तैयार करें।
  th: ค้นหาตำแหน่งงานว่างในเยอรมนีจากแพลตฟอร์มหางานสี่แห่ง จากนั้นเปรียบเทียบบทบาทด้านการออกแบบและเตรียมคำถามสำหรับนายจ้าง
  cs: Prohledej čtyři pracovní portály s nabídkami v Německu, porovnej pozice v oblasti designu a připrav si otázky pro zaměstnavatele.
  sv: Sök på fyra jobbplattformar efter lediga tjänster i Tyskland, jämför sedan designroller och förbered frågor till arbetsgivare.
  he: חיפוש משרות פנויות בגרמניה בארבע פלטפורמות דרושים, השוואה בין תפקידי עיצוב והכנת שאלות למעסיקים.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Meaningful Jobs in Germany. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I’m looking for meaningful work in Germany, especially in research, design or software engineering. Please find a few current vacancies using 80,000 Hours and Hard Problems as well as Arbeitnow and the Federal Employment Agency. I’m open to anywhere in Germany. Give me a short shortlist with the employer, location, source and application link, and don’t assume remote work or salary when the listing doesn’t say."
  de: Ich suche nach einer sinnstiftenden Arbeit in Deutschland, insbesondere in den Bereichen Forschung, Design oder Software-Engineering. Bitte finde ein paar aktuelle Stellenangebote über 80,000 Hours und Hard Problems sowie Arbeitnow und die Bundesagentur für Arbeit. Ich bin offen für jeden Ort in Deutschland. Erstelle mir eine kurze Liste mit Arbeitgeber, Standort, Quelle und Bewerbungslink. Triff keine Annahmen zu Remote-Arbeit oder Gehalt, wenn dies nicht in der Anzeige steht.
  zh: 我正在德国寻找有意义的工作，特别是研究、设计或软件工程领域。请使用 80,000 Hours、Hard Problems、Arbeitnow 和联邦就业局 (Federal Employment Agency) 查找一些当前的职位空缺。我不限工作地点，德国境内任何地方都可以。请给我一份简短的清单，包含雇主、地点、来源和申请链接。如果招聘信息中没有说明，请不要假设可以远程办公或薪资水平。
  es: Busco un trabajo con propósito en Alemania, especialmente en investigación, diseño o ingeniería de software. Por favor, busca algunas vacantes actuales usando 80,000 Hours y Hard Problems, así como Arbeitnow y la Agencia Federal de Empleo. Estoy abierto a cualquier lugar de Alemania. Dame una lista corta con el empleador, la ubicación, la fuente y el enlace de solicitud, y no asumas trabajo remoto ni salario cuando el anuncio no lo indique.
  fr: "Je cherche un travail porteur de sens en Allemagne, particulièrement dans la recherche, le design ou l'ingénierie logicielle. Trouve-moi quelques offres actuelles en utilisant 80,000 Hours et Hard Problems ainsi qu'Arbeitnow et l'Agence fédérale pour l'emploi. Je suis ouvert à n'importe quelle ville en Allemagne. Donne-moi une courte sélection avec l'employeur, le lieu, la source et le lien de candidature, et ne suppose pas de télétravail ou de salaire si l'annonce ne le précise pas."
  pt: Estou à procura de trabalho com propósito na Alemanha, especialmente em pesquisa, design ou engenharia de software. Por favor, encontra algumas vagas atuais usando o 80,000 Hours e o Hard Problems, bem como o Arbeitnow e a Agência Federal de Emprego. Estou aberto a qualquer lugar na Alemanha. Dá-me uma lista curta com o empregador, localização, fonte e link de candidatura, e não assumas trabalho remoto ou salário quando o anúncio não o referir.
  ru: Я ищу значимую работу в Германии, особенно в сфере исследований, дизайна или разработки ПО. Пожалуйста, найди несколько актуальных вакансий на 80,000 Hours и Hard Problems, а также на Arbeitnow и в Федеральном агентстве по трудоустройству. Я готов к переезду в любую точку Германии. Составь краткий список с указанием работодателя, местоположения, источника и ссылки на вакансию. Не делай предположений об удаленной работе или зарплате, если это не указано в объявлении.
  ja: ドイツで、特に研究、デザイン、またはソフトウェアエンジニアリングの分野でやりがいのある仕事を探しています。80,000 Hours、Hard Problems、Arbeitnow、および連邦雇用庁（Federal Employment Agency）を使って、現在の求人をいくつか見つけてください。ドイツ国内ならどこでも構いません。雇用主、勤務地、情報源、応募リンクをまとめた短いリストを作成してください。募集要項に記載がない場合は、リモートワークや給与について推測しないでください。
  ko: 독일에서 연구, 디자인 또는 소프트웨어 엔지니어링 분야의 의미 있는 일자리를 찾고 있어. 80,000 Hours와 Hard Problems, Arbeitnow, 그리고 연방고용청(Federal Employment Agency)을 통해 현재 채용 중인 공고를 몇 개 찾아줘. 지역은 독일 어디든 상관없어. 고용주, 위치, 출처, 지원 링크가 포함된 짧은 리스트를 보여주고, 공고에 명시되지 않은 경우 원격 근무 여부나 급여를 임의로 가정하지 마.
  it: "Sto cercando un lavoro significativo in Germania, specialmente nell'ambito della ricerca, del design o dell'ingegneria del software. Per favore, trova alcune offerte attuali utilizzando 80,000 Hours e Hard Problems, oltre ad Arbeitnow e all'Agenzia Federale per l'Impiego. Sono aperto a qualsiasi località in Germania. Forniscimi una breve lista con datore di lavoro, località, fonte e link per la candidatura, e non dare per scontato il lavoro da remoto o lo stipendio se l'annuncio non lo specifica."
  tr: "Almanya'da, özellikle araştırma, tasarım veya yazılım mühendisliği alanlarında anlamlı bir iş arıyorum. Lütfen 80,000 Hours, Hard Problems, Arbeitnow ve Federal İstihdam Kurumu'nu kullanarak birkaç güncel ilan bul. Almanya'nın her yerine açığım. İşveren, konum, kaynak ve başvuru bağlantısını içeren kısa bir liste hazırla; ilanda belirtilmediği sürece uzaktan çalışma veya maaş varsayımında bulunma."
  vi: Tôi đang tìm kiếm công việc ý nghĩa tại Đức, đặc biệt là trong lĩnh vực nghiên cứu, thiết kế hoặc kỹ thuật phần mềm. Vui lòng tìm một vài vị trí tuyển dụng hiện tại bằng cách sử dụng 80,000 Hours và Hard Problems cũng như Arbeitnow và Cơ quan Việc làm Liên bang (Federal Employment Agency). Tôi sẵn sàng làm việc ở bất cứ đâu tại Đức. Hãy đưa cho tôi một danh sách rút gọn bao gồm nhà tuyển dụng, địa điểm, nguồn và liên kết ứng tuyển, và đừng giả định về hình thức làm việc từ xa hay mức lương khi tin tuyển dụng không đề cập đến.
  id: Saya sedang mencari pekerjaan yang bermakna di Jerman, terutama di bidang riset, desain, atau rekayasa perangkat lunak. Tolong carikan beberapa lowongan terbaru menggunakan 80,000 Hours dan Hard Problems serta Arbeitnow dan Federal Employment Agency. Saya terbuka untuk lokasi mana pun di Jerman. Berikan daftar pendek berisi pemberi kerja, lokasi, sumber, dan tautan lamaran, serta jangan berasumsi tentang kerja jarak jauh atau gaji jika tidak disebutkan dalam iklan lowongan.
  pl: Szukam pracy z misją w Niemczech, szczególnie w badaniach, projektowaniu lub inżynierii oprogramowania. Znajdź proszę kilka aktualnych ofert pracy, korzystając z 80,000 Hours i Hard Problems, a także Arbeitnow i Federalnej Agencji Pracy. Jestem otwarty na dowolną lokalizację w Niemczech. Przygotuj krótką listę z pracodawcą, lokalizacją, źródłem i linkiem do aplikacji; nie zakładaj pracy zdalnej ani wynagrodzenia, jeśli nie podano ich w ogłoszeniu.
  nl: Ik ben op zoek naar zinvol werk in Duitsland, vooral in onderzoek, design of software engineering. Zoek een paar actuele vacatures via 80,000 Hours en Hard Problems, evenals Arbeitnow en het Bundesagentur für Arbeit. Ik sta open voor elke plek in Duitsland. Geef me een korte shortlist met de werkgever, locatie, bron en sollicitatielink, en ga niet uit van werken op afstand of een salaris als de vacature dit niet vermeldt.
  ar: أبحث عن عمل ذي مغزى في ألمانيا، خاصة في مجالات البحث أو التصميم أو هندسة البرمجيات. يرجى العثور على بعض الوظائف الشاغرة الحالية باستخدام 80,000 Hours وHard Problems بالإضافة إلى Arbeitnow ووكالة التوظيف الفيدرالية. أنا منفتح على أي مكان في ألمانيا. أعطني قائمة مختصرة تتضمن صاحب العمل والموقع والمصدر ورابط التقديم، ولا تفترض وجود عمل عن بعد أو راتب معين إذا لم يذكر الإعلان ذلك.
  hi: मैं जर्मनी में सार्थक काम की तलाश में हूँ, विशेष रूप से रिसर्च, डिज़ाइन या सॉफ्टवेयर इंजीनियरिंग में। कृपया 80,000 Hours और Hard Problems के साथ-साथ Arbeitnow और Federal Employment Agency का उपयोग करके कुछ वर्तमान रिक्तियां खोजें। मैं जर्मनी में कहीं भी काम करने के लिए तैयार हूँ। मुझे नियोक्ता, स्थान, स्रोत और आवेदन लिंक के साथ एक संक्षिप्त शॉर्टलिस्ट दें, और यदि लिस्टिंग में उल्लेख न हो, तो रिमोट वर्क या वेतन के बारे में कोई धारणा न बनाएं।
  th: ฉันกำลังมองหางานที่มีความหมายในเยอรมนี โดยเฉพาะในด้านการวิจัย การออกแบบ หรือวิศวกรรมซอฟต์แวร์ โปรดหาตำแหน่งงานว่างในปัจจุบันสักสองสามตำแหน่งโดยใช้ 80,000 Hours และ Hard Problems รวมถึง Arbeitnow และ Federal Employment Agency ฉันเปิดรับทุกที่ในเยอรมนี ช่วยสรุปรายการสั้นๆ ที่มีชื่อนายจ้าง สถานที่ แหล่งที่มา และลิงก์ใบสมัคร และอย่าคาดเดาเรื่องการทำงานทางไกลหรือเงินเดือนหากในประกาศไม่ได้ระบุไว้
  cs: Hledám smysluplnou práci v Německu, zejména v oblasti výzkumu, designu nebo softwarového inženýrství. Najdi prosím několik aktuálních volných míst pomocí 80,000 Hours a Hard Problems a také Arbeitnow a Federal Employment Agency. Jsem otevřený jakékoli lokalitě v Německu. Dej mi stručný užší výběr se zaměstnavatelem, lokalitou, zdrojem a odkazem na přihlášku a nepředpokládej práci na dálku ani plat, pokud to v inzerátu není uvedeno.
  sv: Jag letar efter meningsfullt arbete i Tyskland, särskilt inom forskning, design eller mjukvaruutveckling. Hitta några aktuella lediga tjänster med hjälp av 80,000 Hours och Hard Problems samt Arbeitnow och den federala arbetsförmedlingen. Jag är öppen för var som helst i Tyskland. Ge mig en kort lista med arbetsgivare, plats, källa och ansökningslänk, och anta inte distansarbete eller lön om det inte står i annonsen.
  he: אני מחפש עבודה בעלת משמעות בגרמניה, במיוחד במחקר, עיצוב או הנדסת תוכנה. אנא מצא כמה משרות פנויות עדכניות באמצעות 80,000 Hours ו-Hard Problems, וגם Arbeitnow וסוכנות התעסוקה הפדרלית. אני פתוח לכל מקום בגרמניה. תן לי רשימה קצרה הכוללת את המעסיק, המיקום, המקור וקישור להגשת מועמדות, ואל תניח שמדובר בעבודה מרחוק או בשכר מסוים אם זה לא מצוין במודעה.
  verified_by_human: []

