    Jag har skiftat min uppmärksamhet till att kurera en balanserad lista. Jag prioriterar möjligheter inom design och forskning, med fokus på relevans och nyligen publicerade annonser. För närvarande granskar jag en roll som Senior Product Designer på voize i Berlin, och en UI/UX Design-tjänst på stiftung ear. För forskning granskar jag en roll vid Ruhr-Universität Bochum, tillsammans med Joint Fellowship Program i Hamburg.
    
    
    **Utvärderar nya möjligheter**
    
    Jag väger nu nya spår mot mina kriterier. Jag har upptäckt alternativ, som en roll som Research Engineer på Siemens Energy i Berlin via Bundesagentur für Arbeit, som fokuserar på grundforskning. Jag överväger också roller som Senior Backend och Junior C++ Software Developer på idealo internet GmbH (Berlin, Arbeitnow) respektive CT Software Engineering (Ingolstadt, Bundesagentur für Arbeit). Dessa passar mina intressen inom programvaruteknik.
    
    
    **Förfinar ansökningskriterier**
    
    Jag klargör nu hur ansökningslänkar ska hanteras. Jag måste komma ihåg att prioritera tydliga ansökningsprocesser och kontrollera användningen av `[visningstext](embed:embed_ref)` eller standardlänkar. Dessutom bör jag undvika att anta distansarbete eller uppge lön om det inte uttryckligen anges i annonsen.
    
    
    **Klargör ansökningsprotokoll**
    
    Jag fokuserar nu på format för ansökningslänkar. Jag ser till att säkerställa direkt länkintegration eller användning av formatet `(embed:embed_ref)`, och ser till att jag inte tillhandahåller båda. Jag granskar noggrant webbadresser som returneras från app-färdigheter för att säkerställa efterlevnad. Mitt mål är att hålla mig till regeln att endast använda en länkstil per ansökningslänk.
    
    
    **Standardiserar ansökningslänkar**
    
    Jag implementerar nu strategin för ansökningslänkar. Mitt mål är att standardisera formatet för jobbannonser. Jag kommer endast att använda embed-referensen för ansökningslänkar. Jag kommer också att inkludera roll, arbetsgivare, plats och källa för varje ledig tjänst, och använda en inbäddad länk. Jag ska se till att alltid använda en länk per ledig tjänst.
    
    
    **Sammanställer data om möjligheter**
    
    Jag sammanställer nu detaljer för flera möjligheter. Jag har information om en roll som Senior Product Designer på voize, en UI/UX Design-tjänst på stiftung ear och Joint Fellowship Program vid Hamburgs universitet. Jag noterar roll, arbetsgivare, plats och källa för var och en, samt specifikationer för distansarbete och lön. Jag fokuserar på att säkerställa konsekventa länkformat genom att använda inbäddningar för varje ansökan.
    
    
    **Integrerar nya annonser**
    
    Jag integrerar nu nya annonser i datasetet. Jag har lagt till en tjänst som Research Associate vid Ruhr-Universität Bochum, hämtad från Bundesagentur für Arbeit, och noterat dess detaljer om distansarbete och lön. Jag har också sammanställt information om en roll som Research Engineer på Siemens Energy, inklusive flexibla alternativ. Jag säkerställer konsekvens i länkformat genom att använda inbäddningar för ansökningslänkar.
    
    
    **Lägger till nya annonser**
    
    Jag har just lagt till två nya annonser, en roll som Senior Backend Engineer på en ospecificerad plats och en tjänst som arbetande student på Quantum-Systems GmbH i Gilching. Jag fokuserar på att korrekt fånga alla detaljer, inklusive plats, alternativ för distansarbete, löneinformation (där tillgänglig) och ansökningslänkar i det standardiserade formatet. Jag använder formatet `(embed:embed_ref)` för ansökningslänken.
  he: |
    **זיהוי הזדמנויות בגרמניה**
    
    אני מתמקד כרגע באיתור משרות רלוונטיות בגרמניה. התחלתי באיסוף רשימה של מקורות מבטיחים: `80,000 Hours`, `Hard Problems`, `Arbeitnow` וסוכנות התעסוקה הפדרלית (`Federal Employment Agency`). תחומי העניין העיקריים שלי הם תפקידי מחקר, עיצוב והנדסת תוכנה, ואני אשים דגש מיוחד על נושא המיקום.
    
    
    **זיקוק פרמטרי החיפוש**
    
    אני משפר כעת את הגישה שלי לשימוש יעיל בכלי ה-`jobs-search`. אני מתמקד במערך ה-`requests` כדי לבצע סדרה של שאילתות ולציין את הספקים ישירות, בהינתן המגבלה של 5 בקשות. אני בודק את הגדרת הפונקציה כדי לאשר כיצד לספק ספקים במפורש כרשימה, וכיצד להגדיר קריטריונים לרלוונטיות. זה יעזור ביצירת רשימה קצרה הכוללת מעסיק, מיקום, מקור וקישור להגשת מועמדות. המטרה שלי היא להימנע מהנחות לגבי עבודה מרחוק או שכר כאשר אלו לא צוינו במפורש.
    
    
    **בחינת תוצאות הספקים**
    
    אוקיי, קיבלתי מבט ראשון על הספקים שחזרו. נראה שיש לנו את "Hard Problems" וכמה מ-arbeitnow; אחד הוא תפקיד בכיר בהנדסת בקאנד (Java/Kotlin), והשני הוא תפקיד לסטודנט (Working Student). אני רושם לעצמי את ההתרשמויות הראשוניות ומעריך את ההשפעה הפוטנציאלית של כל משרה.
    
    
    **ניתוח הזדמנויות נוכחיות**
    
    אני מתמקד כרגע בהערכת שתי הזדמנויות מבטיחות. הראשונה היא "Joint Fellowship Program" במכון לחקר שלום ומדיניות ביטחון של אוניברסיטת המבורג, והשנייה היא משרת "עוזר סטודנט" (Student Assistant) בתוכנית Interface Cybersecurity. אני שוקל בזהירות את היתרונות של כל אחת מהן בהקשר של מחקר שלום וביטחון ואבטחת סייבר, בהתאמה.
    
    
    **תיעדוף לידים חדשים**
    
    העברתי את תשומת הלב שלי לאוצרות של רשימה קצרה ומאוזנת. אני מתעדף הזדמנויות בעיצוב ומחקר, תוך התמקדות ברלוונטיות ובפרסומים אחרונים. כרגע, אני בוחן תפקיד Senior Product Designer ב-voize בברלין, ותפקיד UI/UX Design ב-stiftung ear. עבור מחקר, אני סוקר תפקיד ב-Ruhr-Universität Bochum, לצד תוכנית ה-Joint Fellowship בהמבורג.
    
    
    **הערכת אפשרויות חדשות**
    
    אני שוקל כעת לידים חדשים לאור הקריטריונים שלי. חשפתי אפשרויות כמו תפקיד Research Engineer ב-Siemens Energy, ברלין, דרך סוכנות התעסוקה הפדרלית, המתמקד במחקר בסיסי. אני שוקל גם תפקידי Senior Backend ו-Junior C++ Software Developer ב-idealo internet GmbH (ברלין, Arbeitnow) וב-CT Software Engineering (אינגולשטאדט, סוכנות התעסוקה הפדרלית) בהתאמה. אלו מתאימים לתחומי העניין שלי בהנדסת תוכנה.
    
    
    **זיקוק קריטריונים להגשת מועמדות**
    
    אני מבהיר כעת כיצד לטפל בקישורים להגשת מועמדות. עלי לזכור לתת עדיפות לתהליכי הגשה ברורים, ולבדוק את השימוש ב-`[טקסט לתצוגה](embed:embed_ref)` או בקישורים סטנדרטיים. יתרה מכך, עלי להימנע מהנחת עבודה מרחוק או חשיפת שכר אלא אם כן הדבר צוין במפורש במודעה.
    
    
    **הבהרת פרוטוקולי הגשת מועמדות**
    
    אני מתמקד כעת בפורמטים של קישורים להגשת מועמדות. אני מוודא שילוב קישורים ישיר או שימוש בפורמט `(embed:embed_ref)`, תוך הקפדה שלא לספק את שניהם. אני סוקר בזהירות כתובות URL שחזרו מהמיומנויות (skills) כדי להבטיח תאימות. המטרה שלי היא להיצמד לכלל של שימוש בסגנון קישור אחד בלבד לכל קישור להגשת מועמדות למשרה.
    
    
    **סטנדרטיזציה של קישורים להגשת מועמדות**
    
    אני מיישם כעת את אסטרטגיית הקישורים להגשת מועמדות. המטרה שלי היא להפוך את הפורמט של מודעות הדרושים לסטנדרטי. אשתמש רק ב-embed ref עבור קישורים להגשת מועמדות. אכלול גם תפקיד, מעסיק, מיקום ומקור עבור כל משרה פנויה, ואשתמש בקישור מוטמע (embedded). אקפיד להשתמש תמיד בקישור אחד לכל משרה.
    
    
    **איסוף נתוני הזדמנויות**
    
    אני מרכז כעת פרטים עבור מספר הזדמנויות. יש לי מידע על תפקיד Senior Product Designer ב-voize, תפקיד UI/UX Design ב-stiftung ear ותוכנית ה-Joint Fellowship באוניברסיטת המבורג. אני מציין את התפקיד, המעסיק, המיקום והמקור עבור כל אחד מהם, כמו גם את פרטי העבודה מרחוק והשכר. אני מתמקד בהבטחת פורמטים עקביים של קישורים על ידי שימוש ב-embeds עבור כל הגשת מועמדות.
    
    
    **שילוב מודעות חדשות**
    
    אני משלב כעת מודעות חדשות במערך הנתונים. הוספתי משרת Research Associate ב-Ruhr-Universität Bochum, ממקור סוכנות התעסוקה הפדרלית, וציינתי את פרטי העבודה מרחוק והשכר שלה. כמו כן, אספתי מידע על תפקיד Research Engineer ב-Siemens Energy, כולל אפשרויות גמישות. אני מבטיח עקביות בפורמטים של קישורים, תוך שימוש ב-embeds עבור קישורים להגשת מועמדות.
    
    
    **הוספת מודעות חדשות**
    
    זה עתה הוספתי שתי מודעות חדשות, תפקיד Senior Backend Engineer במיקום לא מצוין ומשרת סטודנט (Working Student) ב-Quantum-Systems GmbH בגילכינג. אני מתמקד בתיעוד מדויק של כל הפרטים, כולל מיקום, אפשרויות עבודה מרחוק, מידע על שכר (במידה וקיים) וקישורים להגשת מועמדות בפורמט הסטנדרטי. אני משתמש בפורמט `(embed:embed_ref)` עבור הקישור להגשת המועמדות.
