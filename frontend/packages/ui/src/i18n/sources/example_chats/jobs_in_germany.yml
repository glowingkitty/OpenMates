    Právě jsem přidal dva nové inzeráty: roli Senior Backend Engineer v nespecifikované lokalitě a pozici Working Student ve společnosti Quantum-Systems GmbH v Gilchingu. Soustředím se na přesné zachycení všech podrobností, včetně lokality, možností práce na dálku, informací o platu (pokud jsou k dispozici) a odkazů na přihlášky ve standardizovaném formátu. Pro odkaz na přihlášku používám formát `(embed:embed_ref)`.
