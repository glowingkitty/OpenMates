  ru: |
    **Анализ содержания вакансий**
    
    Окей, я начал сравнивать описания вакансий. Я сосредоточен на ключевых обязанностях и требуемых навыках для роли Senior Product Designer в Voize и позиции UI/UX Design в Stiftung EAR. Сейчас я готовлю резюме ключевых обязанностей и необходимых навыков для обоих объявлений. Затем я определю, какая дополнительная информация мне может понадобиться.
    
    
    **Анализ описаний вакансий**
    
    Теперь я более детально изучаю специфику каждого объявления. Я сосредоточен на разборе формулировок, используемых в описаниях. Пытаюсь определить, на какие ключевые вопросы нужно ответить, чтобы подготовиться к каждому работодателю. Например, в вакансии voize мне нужно узнать об их продукте — ИИ-помощнике.
    
    
    **Оценка ключевых деталей**
    
    Сейчас я концентрируюсь на вакансии voize и выделяю основные выводы. Это руководящая роль с большой ответственностью, требующая человека, способного вести дискуссии с продакт-менеджерами. Формат работы гибкий: офис в Берлине и возможность удаленной работы. Зарплата не указана, но среди бонусов — достойный отпуск и членство в спортивном клубе. Основной язык — английский, несмотря на то что контекст связан с немецким здравоохранением.
    
    
    **Определение конкретных требований**
    
    Теперь я перехожу к вакансии в Нюрнберге. Я разбил ее на ключевые области: аспект соблюдения законодательства сосредоточен на правилах ElektroG. Работа включает разработку веб-приложений и UX-активности, консультирование заинтересованных сторон. Обязательно свободное владение немецким языком (минимум C1), опыт работы с регуляторным ПО будет плюсом. Позиция постоянная, с широкими возможностями удаленной работы. Оплата зависит от результатов.
    
    
