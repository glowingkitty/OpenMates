    Obecnie skupiam się na wyszukiwaniu odpowiednich ofert pracy w Niemczech. Zacząłem od sporządzenia listy obiecujących źródeł: `80,000 Hours`, `Hard Problems`, `Arbeitnow` oraz `Federalna Agencja Pracy`. Moje główne zainteresowania to role w obszarze badań, projektowania i inżynierii oprogramowania, a szczególną uwagę będę zwracać na lokalizację.
    
    
    **Doprecyzowanie parametrów wyszukiwania**
    
    Dopracowuję teraz swoje podejście, aby skutecznie korzystać z narzędzia `jobs-search`. Skupiam się na tablicy `requests`, aby wykonać serię zapytań i bezpośrednio określić dostawców, biorąc pod uwagę limit 5 żądań. Sprawdzam definicję funkcji, aby potwierdzić, jak jawnie podać dostawców jako listę oraz jak zdefiniować kryteria trafności. Pomoże to w stworzeniu krótkiej listy zawierającej pracodawcę, lokalizację, źródło i link do aplikacji. Moim celem jest unikanie założeń dotyczących pracy zdalnej lub wynagrodzenia, jeśli nie zostały one wyraźnie określone.
    
    
    **Analiza wyników od dostawców**
    
    Dobrze, mam pierwszy wgląd w zwróconych dostawców. Wygląda na to, że mamy „Hard Problems” i kilka ofert z Arbeitnow; jedna to stanowisko Senior Backend Engineer (Java/Kotlin), a druga to rola dla studenta pracującego. Odnotowuję pierwsze wrażenia i oceniam potencjalny wpływ każdego ogłoszenia.
    
    
