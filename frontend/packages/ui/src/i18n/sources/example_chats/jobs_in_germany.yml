    4. **Vergütungs-Benchmark:** *"Da die stiftung ear eine öffentlich-rechtliche Aufgabe wahrnimmt: Orientiert sich die Vergütung an einem bestimmten öffentlichen Tarifvertrag (wie TVöD/TV-L) oder an einer internen Gehaltsstruktur?"*
