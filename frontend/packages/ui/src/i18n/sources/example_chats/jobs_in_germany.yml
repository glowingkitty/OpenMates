    我目前正专注于精准定位德国的相关职位空缺。我首先整理了一份极具潜力的来源名单：`80,000 Hours`、`Hard Problems`、`Arbeitnow` 以及 `联邦就业局 (Federal Employment Agency)`。我的主要兴趣集中在研究、设计和软件工程岗位，并将密切关注工作地点。
    
    
    **优化搜索参数**
    
    我正在优化方法，以便更有效地使用 `jobs-search` 工具。由于限制为 5 个请求，我正专注于 `requests` 数组，以进行一系列查询并直接指定提供商。我正在检查函数定义，以确认如何以列表形式明确提供提供商，以及如何定义相关性标准。这将有助于创建一个包含雇主、地点、来源和申请链接的入围名单。我的目标是在没有明确说明的情况下，避免对远程办公或薪资做出假设。
    
    
    **检查提供商返回结果**
    
    好了，我已经初步查看了返回的提供商结果。目前有来自 “Hard Problems” 的职位，以及几个来自 Arbeitnow 的职位；一个是后端工程（Java/Kotlin）的高级职位，另一个是实习生（Working Student）职位。我正在记录初步印象，并评估每个职位的潜在影响。
    
    
    **分析当前机会**
    
    我目前正专注于评估两个极具潜力的机会。第一个是汉堡大学和平研究与安全政策研究所的“联合奖学金项目 (Joint Fellowship Program)”，第二个是 Interface 网络安全项目中的“学生助理 (Student Assistant)”职位。我正在分别结合和平与安全研究以及网络安全背景，仔细权衡它们各自的优势。
    
    
    **优先处理新线索**
    
    我已将注意力转向策划一份平衡的入围名单。我优先考虑设计和研究领域的机会，重点关注相关性和近期发布的帖子。目前，我正在查看柏林 voize 的高级产品设计师职位，以及 stiftung ear 的 UI/UX 设计职位。研究方面，我正在审查波鸿鲁尔大学的一个职位，以及汉堡的联合奖学金项目。
    
    
    **评估新的可能性**
    
    我正根据我的标准权衡新的线索。我发现了一些选择，例如通过联邦就业局找到的柏林西门子能源公司 (Siemens Energy) 的研究工程师职位，该职位专注于基础研究。我也在考虑 idealo internet GmbH（柏林，Arbeitnow）的高级后端开发职位和 CT Software Engineering（因戈尔施塔特，联邦就业局）的初级 C++ 软件开发职位。这些都符合我对软件工程的兴趣。
    
    
    **完善申请标准**
    
    我正在明确如何处理申请链接。我必须记住优先考虑清晰的申请流程，检查是否使用了 `[显示文本](embed:embed_ref)` 或标准链接。此外，除非招聘信息中明确说明，否则我不应假设可以远程办公或透露薪资。
    
    
    **明确申请协议**
    
    我正专注于申请链接的格式。我的重点是确保直接链接集成或使用 `(embed:embed_ref)` 格式，并确保不同时提供两者。我正在仔细审查从应用技能返回的 URL，以确保合规。我的目标是坚持每个职位申请链接仅使用一种链接样式的规则。
    
    
    **标准化申请链接**
    
    我正在实施申请链接策略。我的目标是标准化职位发布的格式。我将仅使用嵌入引用 (embed ref) 作为申请链接。我还将为每个空缺职位整合职位名称、雇主、地点和来源，并使用嵌入链接。我会确保每个职位始终只使用一个链接。
    
    
    **汇编机会数据**
    
    我正在整理多个机会的详细信息。我已经掌握了 voize 的高级产品设计师职位、stiftung ear 的 UI/UX 设计职位以及汉堡大学联合奖学金项目的信息。我记录了每个职位的名称、雇主、地点和来源，以及远程办公和薪资说明。我正专注于通过为每个申请使用嵌入链接来确保链接格式的一致性。
    
    
    **整合新职位**
    
    我正在将新职位整合到数据集中。我添加了波鸿鲁尔大学的研究助理职位，来源为联邦就业局，并记录了其远程办公和薪资详情。此外，我还汇编了西门子能源公司研究工程师职位的信息，包括灵活的工作选择。我正在确保链接格式的一致性，在申请链接中使用嵌入引用。
    
    
    **添加新职位**
    
    我刚刚添加了两个新职位：一个地点不详的高级后端工程师职位，以及位于吉尔兴 (Gilching) 的 Quantum-Systems GmbH 的实习生职位。我正专注于准确捕捉所有细节，包括地点、远程办公选项、薪资信息（如有）以及标准格式的申请链接。我正在申请链接中使用 `(embed:embed_ref)` 格式。
  es: |
    **Identificación de oportunidades en Alemania**
    
    Actualmente me centro en localizar ofertas de empleo relevantes en Alemania. He empezado recopilando una lista de fuentes prometedoras: `80,000 Hours`, `Hard Problems`, `Arbeitnow` y la `Agencia Federal de Empleo`. Mi interés principal reside en puestos de investigación, diseño e ingeniería de software, y estaré muy atento al aspecto de la ubicación.
    
    
    **Refinamiento de los parámetros de búsqueda**
    
    Ahora estoy perfeccionando mi enfoque para utilizar la herramienta `jobs-search` de forma eficaz. Me centro en el array `requests` para realizar una serie de consultas y especificar los proveedores directamente, dado el límite de 5 solicitudes. Estoy revisando la definición de la función para confirmar cómo proporcionar los proveedores explícitamente como una lista y cómo definir los criterios de relevancia. Esto ayudará a crear una lista de preselección con el empleador, la ubicación, la fuente y el enlace de solicitud. Mi objetivo es evitar suposiciones sobre el trabajo remoto o el salario cuando no se indiquen explícitamente.
    
    
    **Examen de los resultados de los proveedores**
    
    Bien, ya tengo un primer vistazo a los proveedores devueltos. Parece que tenemos "Hard Problems" y un par de Arbeitnow; uno es un puesto sénior en ingeniería de backend (Java/Kotlin) y el otro es un puesto de estudiante en prácticas. Estoy tomando nota de las impresiones iniciales y evaluando el impacto potencial de cada anuncio.
    
    
    **Análisis de las oportunidades actuales**
    
    Actualmente me centro en evaluar dos oportunidades prometedoras. La primera es un "Joint Fellowship Program" en el Instituto de Investigación para la Paz y Política de Seguridad de la Universidad de Hamburgo, y la segunda es un puesto de "Asistente Estudiantil" dentro del Programa de Ciberseguridad de Interface. Estoy considerando cuidadosamente sus respectivos méritos en el contexto de la investigación sobre paz y seguridad y la ciberseguridad, respectivamente.
    
    
    **Priorización de nuevos contactos**
    
    He pasado a elaborar una lista de preselección equilibrada. Estoy priorizando las oportunidades en diseño e investigación, centrándome en la relevancia y en las publicaciones recientes. Actualmente, estoy examinando un puesto de Diseñador de Producto Sénior en voize en Berlín, y un puesto de Diseño UI/UX en stiftung ear. Para investigación, estoy revisando un puesto en la Ruhr-Universität Bochum, junto con el Joint Fellowship Program en Hamburgo.
    
    
    **Evaluación de nuevas posibilidades**
    
    Ahora estoy sopesando nuevos contactos a la luz de mis criterios. He descubierto opciones, como un puesto de Ingeniero de Investigación en Siemens Energy, Berlín, a través de la Agencia Federal de Empleo, que se centra en la investigación fundamental. También estoy considerando puestos de Desarrollador de Backend Sénior y Desarrollador de Software C++ Junior en idealo internet GmbH (Berlín, Arbeitnow) y CT Software Engineering (Ingolstadt, Agencia Federal de Empleo) respectivamente. Estos encajan con mis intereses en ingeniería de software.
    
    
    **Refinamiento de los criterios de solicitud**
    
    Ahora estoy aclarando cómo gestionar los enlaces de solicitud. Debo recordar priorizar los procesos de solicitud claros, comprobando el uso de `[texto a mostrar](embed:embed_ref)` o enlaces estándar. Además, debo evitar asumir el trabajo remoto o revelar el salario a menos que se indique explícitamente en el anuncio.
    
    
    **Aclaración de los protocolos de solicitud**
    
    Ahora me estoy centrando en los formatos de los enlaces de solicitud. Me aseguro de la integración de enlaces directos o del uso del formato `(embed:embed_ref)`, garantizando que no proporciono ambos. Estoy revisando cuidadosamente las URL devueltas por las funciones de la aplicación para asegurar el cumplimiento. Mi objetivo es adherirme a la regla de usar solo un estilo de enlace por cada enlace de solicitud de empleo.
    
    
    **Estandarización de los enlaces de solicitud**
    
    Ahora estoy implementando la estrategia de enlaces de solicitud. Mi objetivo es estandarizar el formato de las ofertas de empleo. Solo utilizaré la referencia incrustada (embed ref) para los enlaces de solicitud. También incorporaré el puesto, el empleador, la ubicación y la fuente para cada vacante, y utilizaré un enlace incrustado. Me aseguraré de usar siempre un enlace por vacante.
    
    
    **Recopilación de datos de oportunidades**
    
    Ahora estoy reuniendo detalles de múltiples oportunidades. Tengo información para un puesto de Diseñador de Producto Sénior en voize, un puesto de Diseño UI/UX en stiftung ear y el Joint Fellowship Program en la Universidad de Hamburgo. Estoy anotando el puesto, el empleador, la ubicación y la fuente de cada uno, así como las especificaciones de trabajo remoto y salario. Me centro en asegurar formatos de enlace coherentes mediante el uso de incrustaciones para cada solicitud.
    
    
    **Integración de nuevos anuncios**
    
    Ahora estoy integrando nuevos anuncios en el conjunto de datos. He añadido un puesto de Investigador Asociado en la Ruhr-Universität Bochum, obteniéndolo de la Agencia Federal de Empleo y anotando sus detalles de trabajo remoto y salario. Además, he recopilado información sobre un puesto de Ingeniero de Investigación en Siemens Energy, incluyendo opciones flexibles. Estoy asegurando la coherencia en los formatos de los enlaces, utilizando incrustaciones para los enlaces de solicitud.
    
    
    **Adición de nuevos anuncios**
    
    Acabo de añadir dos nuevos anuncios: un puesto de Ingeniero de Backend Sénior en una ubicación no especificada y un puesto de Estudiante en Prácticas en Quantum-Systems GmbH en Gilching. Me centro en capturar con precisión todos los detalles, incluyendo la ubicación, las opciones de trabajo remoto, la información salarial (donde esté disponible) y los enlaces de solicitud en el formato estandarizado. Estoy utilizando el formato `(embed:embed_ref)` para el enlace de solicitud.
