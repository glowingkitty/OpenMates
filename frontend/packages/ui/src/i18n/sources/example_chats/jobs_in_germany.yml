    **Mengidentifikasi Peluang di Jerman**
    
    Saat ini saya sedang berfokus untuk menemukan lowongan kerja yang relevan di Jerman. Saya telah memulai dengan menyusun daftar sumber yang menjanjikan: `80,000 Hours`, `Hard Problems`, `Arbeitnow`, dan `Federal Employment Agency`. Minat utama saya terletak pada peran riset, desain, dan rekayasa perangkat lunak, dan saya akan memperhatikan aspek lokasi dengan saksama.
    
    
    **Menyempurnakan Parameter Pencarian**
    
    Saya sekarang menyempurnakan pendekatan saya untuk menggunakan alat `jobs-search` secara efektif. Saya berfokus pada array `requests` untuk membuat serangkaian kueri dan menentukan penyedia secara langsung, mengingat batas 5 permintaan. Saya sedang memeriksa definisi fungsi untuk mengonfirmasi cara memberikan penyedia secara eksplisit sebagai daftar, dan cara menentukan kriteria relevansi. Ini akan membantu dalam membuat daftar pendek berisi pemberi kerja, lokasi, sumber, dan tautan lamaran. Tujuan saya adalah menghindari asumsi tentang kerja jarak jauh atau gaji jika tidak dinyatakan secara eksplisit.
    
    
    **Memeriksa Hasil dari Penyedia**
    
    Oke, saya sudah melihat sekilas penyedia yang dikembalikan. Tampaknya kita memiliki "Hard Problems" dan beberapa dari arbeitnow; satu adalah peran senior di bidang rekayasa backend (Java/Kotlin), dan yang lainnya adalah peran mahasiswa magang (working student). Saya mencatat kesan awal dan menilai potensi dampak dari setiap lowongan.
    
    
    **Menganalisis Peluang Saat Ini**
    
    Saat ini saya berfokus pada mengevaluasi dua peluang yang menjanjikan. Yang pertama adalah "Joint Fellowship Program" di Institute for Peace Research and Security Policy, Universitas Hamburg, dan yang kedua adalah posisi "Student Assistant" dalam Interface Cybersecurity Programme. Saya sedang mempertimbangkan dengan cermat keunggulan masing-masing dalam konteks riset perdamaian dan keamanan, serta keamanan siber.
    
    
    **Memprioritaskan Prospek Baru**
    
    Saya telah mengalihkan perhatian saya untuk menyusun daftar pendek yang seimbang. Saya memprioritaskan peluang di bidang desain dan riset, dengan fokus pada relevansi dan postingan terbaru. Saat ini, saya sedang memeriksa peran Senior Product Designer di voize di Berlin, dan posisi UI/UX Design di stiftung ear. Untuk riset, saya sedang meninjau peran di Ruhr-Universität Bochum, bersama dengan Joint Fellowship Program di Hamburg.
    
    
    **Mengevaluasi Kemungkinan Baru**
    
    Saya sekarang menimbang prospek baru berdasarkan kriteria saya. Saya telah menemukan opsi, seperti peran Research Engineer di Siemens Energy, Berlin, melalui Federal Employment Agency, yang berfokus pada riset fundamental. Saya juga mempertimbangkan peran Senior Backend dan Junior C++ Software Developer masing-masing di idealo internet GmbH (Berlin, Arbeitnow) dan CT Software Engineering (Ingolstadt, Federal Employment Agency). Ini sesuai dengan minat saya dalam rekayasa perangkat lunak.
    
    
    **Menyempurnakan Kriteria Lamaran**
    
    Saya sekarang mengklarifikasi cara menangani tautan lamaran. Saya harus ingat untuk memprioritaskan proses lamaran yang jelas, memeriksa penggunaan `[teks tampilan](embed:embed_ref)` atau tautan standar. Selain itu, saya harus menghindari asumsi kerja jarak jauh atau mengungkapkan gaji kecuali jika dinyatakan secara eksplisit dalam lowongan tersebut.
    
    
    **Mengklarifikasi Protokol Lamaran**
    
    Saya sekarang berfokus pada format tautan lamaran. Saya berfokus untuk memastikan integrasi tautan langsung atau penggunaan format `(embed:embed_ref)`, memastikan saya tidak memberikan keduanya. Saya meninjau URL yang dikembalikan dari keterampilan aplikasi dengan cermat untuk memastikan kepatuhan. Saya bertujuan untuk mematuhi aturan penggunaan hanya satu gaya tautan per tautan lamaran kerja.
    
    
    **Menstandarisasi Tautan Lamaran**
    
    Saya sekarang menerapkan strategi tautan lamaran. Tujuan saya adalah menstandarisasi format untuk postingan pekerjaan. Saya hanya akan menggunakan referensi sematan (embed ref) untuk tautan lamaran. Saya juga akan menyertakan peran, pemberi kerja, lokasi, dan sumber untuk setiap lowongan, serta menggunakan tautan sematan. Saya akan memastikan untuk selalu menggunakan satu tautan per lowongan.
    
    
    **Menyusun Data Peluang**
    
    Saya sekarang mengumpulkan detail untuk beberapa peluang. Saya memiliki informasi untuk peran Senior Product Designer di voize, posisi UI/UX Design di stiftung ear, dan Joint Fellowship Program di Universitas Hamburg. Saya mencatat peran, pemberi kerja, lokasi, dan sumber untuk masing-masing, serta spesifikasi kerja jarak jauh dan gaji. Saya berfokus untuk memastikan format tautan yang konsisten dengan menggunakan sematan untuk setiap lamaran.
    
    
    **Mengintegrasikan Lowongan Baru**
    
    Saya sekarang mengintegrasikan lowongan baru ke dalam kumpulan data. Saya telah menambahkan posisi Research Associate di Ruhr-Universität Bochum, mengambil sumbernya dari Federal Employment Agency dan mencatat detail kerja jarak jauh serta gajinya. Selain itu, saya telah menyusun informasi tentang peran Research Engineer di Siemens Energy, termasuk opsi fleksibel. Saya memastikan konsistensi dalam format tautan, menggunakan sematan untuk tautan lamaran.
    
    
    **Menambahkan Lowongan Baru**
    
    Saya baru saja menambahkan dua lowongan baru, peran Senior Backend Engineer di lokasi yang tidak ditentukan dan posisi Working Student di Quantum-Systems GmbH di Gilching. Saya berfokus untuk menangkap semua detail secara akurat, termasuk lokasi, opsi kerja jarak jauh, informasi gaji (jika tersedia), dan tautan lamaran dalam format standar. Saya menggunakan format `(embed:embed_ref)` untuk tautan lamaran.
