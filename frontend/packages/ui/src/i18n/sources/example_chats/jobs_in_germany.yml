    Here is a direct comparison of what each listing states, followed by targeted questions you can ask each employer before or during the application process.

    ---

    ### Comparison of the Listings

    ```json
    {"type": "sheet", "embed_id": "e20cbb64-b469-4c1f-89fe-c31e45ad5df4"}
    ```

    ---

    ### What to Ask Before Applying

    #### For voize:
    1. **User research access:** *"How often and through what channels do designers conduct fieldwork or testing with frontline nurses and care staff in their daily clinical setting?"*
    2. **Team maturity and scope:** *"How is the product team structured, what is the current ratio of designers to PMs and engineers, and is this role an individual contributor position or expected to establish design systems?"*
    3. **Compensation and remote cadence:** *"What is the targeted compensation band for this seniority level, and are there mandatory on-site team offsites or core hours despite the remote policy?"*

    #### For stiftung ear:
    1. **On-site expectations in Nürnberg:** *"How is mobile working structured in practice—is there a fixed weekly or monthly requirement to be on-site at the Nürnberg office?"*
    2. **Design vs. QA balance:** *"The listing mentions software testing implementation alongside UX/UI design. What percentage of the role is focused on user research/prototyping versus technical software validation and quality assurance?"*
    3. **Design tooling and development handover:** *"What design system and prototyping tools are currently in place, and do you work with an in-house development team or external IT service providers?"*
    4. **Compensation benchmark:** *"Given that stiftung ear operates in a public-interest statutory capacity, does compensation follow a specific public collective scale (like TVöD/TV-L) or an internal grading structure?"*
