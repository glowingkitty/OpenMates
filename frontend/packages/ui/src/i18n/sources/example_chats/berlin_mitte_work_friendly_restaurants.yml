message_1:
  context: "user message 1 in example chat: Berlin Mitte Work-Friendly Restaurants Map. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I'm in Berlin Mitte tonight and need a restaurant where I can work for an hour. Can you find places nearby that actually have air conditioning and free Wi-Fi, and be clear about what is verified versus unknown?"
  de: "Ich bin heute Abend in Berlin Mitte und brauche ein Restaurant, in dem ich eine Stunde lang arbeiten kann. Kannst du Orte in der Nähe finden, die tatsächlich eine Klimaanlage und kostenloses WLAN haben, und dabei deutlich machen, was verifiziert ist und was nicht?"
  zh: 我今晚在柏林米特区，需要找一家可以工作一小时的餐厅。你能帮我找找附近确实有空调和免费 Wi-Fi 的地方吗？请明确说明哪些是已验证的，哪些是未知的。
  es: "Estoy en Berlín Mitte esta noche y necesito un restaurante donde pueda trabajar durante una hora. ¿Puedes encontrar lugares cercanos que realmente tengan aire acondicionado y Wi-Fi gratuito, y dejar claro qué está verificado y qué es desconocido?"
  fr: "Je suis à Berlin Mitte ce soir et j'ai besoin d'un restaurant où je peux travailler pendant une heure. Peux-tu trouver des endroits à proximité qui ont vraiment la climatisation et le Wi-Fi gratuit, en précisant clairement ce qui est vérifié ou inconnu ?"
  pt: "Estou em Berlin Mitte esta noite e preciso de um restaurante onde possa trabalhar durante uma hora. Consegues encontrar locais por perto que tenham mesmo ar condicionado e Wi-Fi gratuito, e ser claro sobre o que está verificado versus o que é desconhecido?"
  ru: "Я сегодня вечером в Берлин-Митте, и мне нужен ресторан, где я смогу поработать часок. Можешь найти места поблизости, где точно есть кондиционер и бесплатный Wi-Fi, и четко указать, что проверено, а что нет?"
  ja: 今夜ベルリンのミッテにいるんだけど、1時間くらい仕事ができるレストランが必要なんだ。近くで冷房と無料Wi-Fiが本当にある場所を探してくれる？あと、どれが確認済みでどれが不明なのかもはっきり教えて。
  ko: "오늘 밤 베를린 미테에 있는데, 한 시간 정도 업무를 볼 수 있는 레스토랑이 필요해요. 근처에 에어컨과 무료 Wi-Fi가 있는 곳을 찾아줄 수 있나요? 그리고 어떤 정보가 확인된 것이고 어떤 것이 불확실한지 명확하게 알려주세요."
  it: "Stasera sono a Berlino Mitte e ho bisogno di un ristorante dove poter lavorare per un'ora. Puoi trovare dei posti nelle vicinanze che abbiano effettivamente l'aria condizionata e il Wi-Fi gratuito, specificando chiaramente cosa è verificato e cosa è sconosciuto?"
  tr: "Bu akşam Berlin Mitte'deyim ve bir saat çalışabileceğim bir restorana ihtiyacım var. Yakınlarda gerçekten kliması ve ücretsiz Wi-Fi'si olan yerler bulabilir misin? Nelerin doğrulandığını, nelerin bilinmediğini açıkça belirtirsen sevinirim."
  vi: "Tối nay mình đang ở Berlin Mitte và cần tìm một nhà hàng để làm việc trong khoảng một tiếng. Bạn có thể tìm các địa điểm gần đây thực sự có máy lạnh và Wi-Fi miễn phí, đồng thời nêu rõ thông tin nào đã được xác minh và thông tin nào chưa rõ không?"
  id: "Aku sedang di Berlin Mitte malam ini dan butuh restoran tempat aku bisa bekerja selama satu jam. Bisa carikan tempat-tempat terdekat yang benar-benar punya AC dan Wi-Fi gratis, serta jelaskan mana yang sudah terverifikasi vs yang belum diketahui?"
  pl: "Jestem dziś wieczorem w Berlin Mitte i potrzebuję restauracji, w której mogę popracować przez godzinę. Czy możesz znaleźć miejsca w pobliżu, które faktycznie mają klimatyzację i darmowe Wi-Fi, oraz wyraźnie zaznaczyć, co jest zweryfikowane, a co nieznane?"
  nl: "Ik ben vanavond in Berlin Mitte en heb een restaurant nodig waar ik een uurtje kan werken. Kun je plekken in de buurt vinden die echt airconditioning en gratis wifi hebben, en duidelijk aangeven wat geverifieerd is en wat onbekend is?"
  ar: "أنا في منطقة \"برلين ميتي\" الليلة وأحتاج إلى مطعم يمكنني العمل فيه لمدة ساعة. هل يمكنك العثور على أماكن قريبة تتوفر فيها بالفعل مكيفات هواء وخدمة واي فاي مجانية، مع توضيح ما هو مؤكد وما هو غير معروف؟"
  hi: "मैं आज रात बर्लिन मिट्टे में हूँ और मुझे एक ऐसे रेस्टोरेंट की ज़रूरत है जहाँ मैं एक घंटे काम कर सकूँ। क्या तुम आस-पास ऐसी जगहें ढूँढ सकते हो जहाँ वास्तव में एयर कंडीशनिंग और मुफ्त वाई-फाई हो, और यह स्पष्ट कर सकते हो कि क्या सत्यापित है और क्या अज्ञात?"
  th: "คืนนี้ฉันอยู่ใน Berlin Mitte และต้องการร้านอาหารที่สามารถนั่งทำงานได้สักชั่วโมง ช่วยหาสถานที่ใกล้ๆ ที่มีเครื่องปรับอากาศและ Wi-Fi ฟรีจริงๆ ให้หน่อยได้ไหม และช่วยระบุให้ชัดเจนด้วยว่าข้อมูลไหนยืนยันแล้วหรือยังไม่ทราบแน่ชัด?"
  cs: "Dnes večer jsem v Berlin Mitte a potřebuju restauraci, kde můžu hodinu pracovat. Můžeš mi najít místa v okolí, která mají klimatizaci a bezplatnou Wi-Fi, a jasně uvést, co je ověřené a co neznámé?"
  sv: "Jag är i Berlin Mitte ikväll och behöver en restaurang där jag kan jobba i en timme. Kan du hitta ställen i närheten som faktiskt har luftkonditionering och gratis Wi-Fi, och vara tydlig med vad som är verifierat respektive okänt?"
  he: "אני בברלין מיטה הערב וצריך מסעדה שבה אוכל לעבוד במשך שעה. תוכל למצוא מקומות בקרבת מקום שיש בהם באמת מיזוג אוויר ו-Wi-Fi חינם, ולציין בבירור מה מאומת ומה לא ידוע?"
  verified_by_human: []

