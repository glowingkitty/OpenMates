summary:
  context: "Summary of example chat: Extract website information as JSON"
  en: "Browse Example Domain and return its complete statement with a source URL as structured JSON."
  de: Example Domain durchsuchen und die vollständige Erklärung mit einer Quell-URL als strukturiertes JSON zurückgeben.
  zh: 浏览 Example Domain 并以结构化 JSON 形式返回其完整声明及来源 URL。
  es: Navega por Example Domain y devuelve su declaración completa con una URL de origen como JSON estructurado.
  fr: Parcourez Example Domain et renvoyez sa déclaration complète avec une URL source sous forme de JSON structuré.
  pt: Navegue pelo Example Domain e retorne sua declaração completa com uma URL de origem como JSON estruturado.
  ru: Просмотрите Example Domain и получите полное описание вместе с исходным URL в виде структурированного JSON.
  ja: Example Domainを閲覧し、その全文をソースURLとともに構造化されたJSONとして返します。
  ko: Example Domain을 탐색하고 소스 URL이 포함된 구조화된 JSON 형식으로 전체 문장을 반환합니다.
  it: Naviga su Example Domain e restituisci la sua dichiarazione completa con un URL di origine come JSON strutturato.
  tr: "Example Domain'e göz atın ve kaynak URL'si ile birlikte tam ifadesini yapılandırılmış JSON olarak döndürün."
  vi: Duyệt Example Domain và trả về nội dung đầy đủ cùng với URL nguồn dưới dạng JSON có cấu trúc.
  id: Jelajahi Example Domain dan kembalikan pernyataan lengkapnya dengan URL sumber sebagai JSON terstruktur.
  pl: Przeglądaj Example Domain i zwróć jej pełne oświadczenie wraz z adresem URL źródła jako ustrukturyzowany JSON.
  nl: Browse naar Example Domain en retourneer de volledige verklaring met een bron-URL als gestructureerde JSON.
  ar: تصفح Example Domain واسترجع بيانه الكامل مع رابط المصدر بتنسيق JSON مهيكل.
  hi: Example Domain ब्राउज़ करें और सोर्स URL के साथ इसका पूरा विवरण स्ट्रक्चर्ड JSON के रूप में लौटाएं।
  th: เรียกดู Example Domain และส่งคืนข้อความฉบับเต็มพร้อม URL แหล่งที่มาในรูปแบบโครงสร้าง JSON
  cs: Procházejte Example Domain a vraťte její úplné prohlášení se zdrojovou URL jako strukturovaný JSON.
  sv: Surfa till Example Domain och returnera dess fullständiga meddelande med en käll-URL som strukturerad JSON.
  he: גלישה ב-Example Domain והחזרת ההצהרה המלאה שלו יחד עם כתובת URL של המקור כ-JSON מובנה.
  verified_by_human: []

message_1:
  context: "user message 1 in example chat: Extract website information as JSON. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "Use the Web app Browse skill to extract the full visible English statement from [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Return JSON with two required fields: purpose, containing the full statement verbatim including its caveats, and source_url, containing the current page URL. This is an extraction task with no additional website interaction requested. Limit the browser session to 40 credits."
  de: "Verwende die Browse-Funktion der Web-App, um die vollständige sichtbare englische Erklärung von [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) zu extrahieren. Gib ein JSON mit zwei erforderlichen Feldern zurück: „purpose“ mit der vollständigen Erklärung im Wortlaut einschließlich aller Vorbehalte und „source_url“ mit der aktuellen Seiten-URL. Dies ist eine Extraktionsaufgabe ohne weitere angeforderte Website-Interaktion. Begrenze die Browser-Sitzung auf 40 Credits."
  zh: "使用 Web 应用的 Browse 技能从 [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) 中提取完整的可见英文声明。返回包含两个必填字段的 JSON：purpose（逐字包含完整声明及其注意事项）和 source_url（包含当前页面 URL）。这是一项提取任务，不需要额外的网站交互。将浏览器会话限制在 40 个额度内。"
  es: "Usa la función Browse de la aplicación Web para extraer la declaración completa visible en inglés de [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Devuelve un JSON con dos campos obligatorios: purpose, que contenga la declaración completa textualmente incluyendo sus advertencias, y source_url, que contenga la URL de la página actual. Esta es una tarea de extracción sin interacción adicional solicitada con el sitio web. Limita la sesión del navegador a 40 créditos."
  fr: "Utilisez la compétence de navigation de l'application Web pour extraire l'intégralité de la déclaration visible en anglais de [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Renvoyez un objet JSON avec deux champs obligatoires : « purpose », contenant la déclaration complète mot pour mot, y compris ses réserves, et « source_url », contenant l'URL de la page actuelle. Il s'agit d'une tâche d'extraction sans interaction supplémentaire demandée avec le site web. Limitez la session du navigateur à 40 crédits."
  pt: "Use a skill Browse do app Web para extrair a declaração completa em inglês visível de [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Retorne um JSON com dois campos obrigatórios: purpose, contendo a declaração completa na íntegra, incluindo suas ressalvas, e source_url, contendo a URL da página atual. Esta é uma tarefa de extração sem solicitação de interação adicional com o site. Limite a sessão do navegador a 40 créditos."
  ru: "Используйте навык Browse веб-приложения, чтобы извлечь полное видимое утверждение на английском языке из [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Верните JSON с двумя обязательными полями: purpose, содержащее полный текст утверждения дословно, включая примечания, и source_url, содержащее URL текущей страницы. Это задача по извлечению данных, дополнительное взаимодействие с сайтом не требуется. Ограничьте сессию браузера 40 кредитами."
  ja: "WebアプリのBrowseスキルを使用して、[!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) から表示されている英文の全文を抽出してください。2つの必須フィールドを持つJSONを返してください：purpose（注意事項を含む全文をそのまま格納）、source_url（現在のページのURLを格納）。これは抽出タスクであり、ウェブサイトとの追加のやり取りは不要です。ブラウザセッションは40クレジットに制限してください。"
  ko: "웹 앱의 탐색(Browse) 기능을 사용하여 [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a)에서 보이는 전체 영어 문장을 추출하세요. 두 개의 필수 필드를 포함한 JSON을 반환해야 합니다. purpose 필드에는 주의 사항을 포함한 전체 문장을 토씨 하나 틀리지 않고 그대로 담고, source_url 필드에는 현재 페이지 URL을 담으세요. 이 작업은 추출 작업이며 추가적인 웹사이트 상호작용은 필요하지 않습니다. 브라우저 세션은 40크레딧으로 제한하세요."
  it: "Usa la funzione Naviga dell'app Web per estrarre l'intera dichiarazione visibile in inglese da [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Restituisci un JSON con due campi obbligatori: purpose, contenente la dichiarazione completa testuale incluse le avvertenze, e source_url, contenente l'URL della pagina corrente. Questa è un'attività di estrazione senza ulteriori interazioni richieste con il sito web. Limita la sessione del browser a 40 crediti."
  tr: "[!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) adresindeki görünür İngilizce ifadenin tamamını çıkarmak için Web uygulaması Göz Atma yeteneğini kullan. İki zorunlu alan içeren bir JSON döndür: uyarıları da dahil olmak üzere ifadenin tamamını kelimesi kelimesine içeren `purpose` ve mevcut sayfa URL'sini içeren `source_url`. Bu bir veri çıkarma görevidir ve ek bir web sitesi etkileşimi istenmemektedir. Tarayıcı oturumunu 40 krediyle sınırla."
  vi: "Sử dụng kỹ năng Duyệt của ứng dụng Web để trích xuất toàn bộ nội dung tiếng Anh hiển thị từ [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Trả về JSON với hai trường bắt buộc: purpose, chứa nguyên văn toàn bộ nội dung bao gồm cả các lưu ý, và source_url, chứa URL của trang hiện tại. Đây là tác vụ trích xuất và không yêu cầu tương tác thêm với trang web. Giới hạn phiên trình duyệt ở mức 40 tín dụng."
  id: "Gunakan skill Browse aplikasi Web untuk mengekstrak pernyataan bahasa Inggris lengkap yang terlihat dari [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Kembalikan JSON dengan dua kolom wajib: purpose, yang berisi pernyataan lengkap kata demi kata termasuk peringatannya, dan source_url, yang berisi URL halaman saat ini. Ini adalah tugas ekstraksi tanpa permintaan interaksi situs web tambahan. Batasi sesi browser hingga 40 kredit."
  pl: "Użyj umiejętności Przeglądania aplikacji Web, aby wyodrębnić pełne widoczne oświadczenie w języku angielskim z [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Zwróć JSON z dwoma wymaganymi polami: purpose, zawierające pełne oświadczenie dosłownie wraz z zastrzeżeniami, oraz source_url, zawierające aktualny adres URL strony. Jest to zadanie wyodrębniania danych bez dodatkowych interakcji ze stroną. Ogranicz sesję przeglądarki do 40 kredytów."
  nl: "Gebruik de Browse-skill van de Web-app om de volledige zichtbare Engelse verklaring te extraheren uit [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Retourneer JSON met twee verplichte velden: purpose, met de volledige verklaring letterlijk inclusief de voorbehouden, en source_url, met de huidige pagina-URL. Dit is een extractietaak waarbij geen aanvullende website-interactie is vereist. Beperk de browsersessie tot 40 credits."
  ar: "استخدم مهارة التصفح (Browse) في تطبيق الويب لاستخراج البيان الإنجليزي الكامل المرئي من [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). أعد النتيجة بتنسيق JSON مع حقلين مطلوبين: purpose، ويحتوي على البيان الكامل حرفيًا بما في ذلك التنبيهات الواردة فيه، و source_url، ويحتوي على رابط الصفحة الحالي. هذه مهمة استخراج ولا يُطلب أي تفاعل إضافي مع الموقع. حدد جلسة المتصفح بـ 40 رصيدًا."
  hi: "[!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) से पूर्ण दृश्यमान अंग्रेजी विवरण निकालने के लिए वेब ऐप ब्राउज़ स्किल का उपयोग करें। दो आवश्यक फ़ील्ड के साथ JSON लौटाएं: purpose, जिसमें इसकी चेतावनियों सहित पूरा विवरण शब्दशः हो, और source_url, जिसमें वर्तमान पेज का URL हो। यह एक निष्कर्षण कार्य है जिसमें किसी अतिरिक्त वेबसाइट इंटरैक्शन का अनुरोध नहीं किया गया है। ब्राउज़र सत्र को 40 क्रेडिट तक सीमित रखें।"
  th: "ใช้ทักษะ Browse ของเว็บแอปเพื่อดึงข้อความภาษาอังกฤษฉบับเต็มที่ปรากฏจาก [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a) ส่งคืน JSON ที่มีฟิลด์ที่จำเป็นสองฟิลด์ ได้แก่ purpose ซึ่งประกอบด้วยข้อความฉบับเต็มตามตัวอักษรรวมถึงข้อควรระวัง และ source_url ซึ่งประกอบด้วย URL ของหน้าปัจจุบัน นี่คืองานดึงข้อมูลโดยไม่มีการร้องขอให้โต้ตอบกับเว็บไซต์เพิ่มเติม จำกัดเซสชันเบราว์เซอร์ไว้ที่ 40 เครดิต"
  cs: "Použijte dovednost Procházení webové aplikace k extrakci úplného viditelného anglického prohlášení z [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Vraťte JSON se dvěma povinnými poli: purpose, obsahující doslovné úplné prohlášení včetně jeho výhrad, a source_url, obsahující URL aktuální stránky. Jedná se o úkol extrakce bez požadavku na další interakci s webem. Omezte relaci prohlížeče na 40 kreditů."
  sv: "Använd webbappens Browse-färdighet för att extrahera hela det synliga engelska meddelandet från [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). Returnera JSON med två obligatoriska fält: purpose, som innehåller hela meddelandet ordagrant inklusive dess förbehåll, och source_url, som innehåller den aktuella sidans webbadress. Detta är en extraheringsuppgift utan krav på ytterligare interaktion med webbplatsen. Begränsa webbläsarsessionen till 40 krediter."
  he: "השתמש במיומנות ה-Browse של אפליקציית ה-Web כדי לחלץ את ההצהרה המלאה באנגלית הגלויה לעין מתוך [!](embed:example-com-4b6009db-731e-4a6b-98a2-08f4-a8c11a). החזר JSON עם שני שדות חובה: purpose, המכיל את ההצהרה המלאה מילה במילה כולל הסייגים שלה, ו-source_url, המכיל את כתובת ה-URL הנוכחית של הדף. זוהי משימת חילוץ ללא בקשה לאינטראקציה נוספת עם האתר. הגבל את סשן הדפדפן ל-40 קרדיטים."
  verified_by_human: []

