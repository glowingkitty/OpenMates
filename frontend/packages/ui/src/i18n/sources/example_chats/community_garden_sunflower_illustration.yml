    ### Consigli rapidi di design per volantini comunitari

    Per rendere il tuo volantino dell'orto invitante e facile da leggere:

    - **Gerarchia visiva e spaziatura:** Lascia respiro all'illustrazione. Posizionarla lungo un margine o un'intestazione lascia spazio libero per consigli di giardinaggio o dettagli dell'evento senza appesantire il layout.
    - **Armonia cromatica:** Riprendi i toni caldi direttamente dall'opera d'arte — come l'oro miele intenso, il verde oliva o la terracotta — per le intestazioni delle sezioni e i bordi.
    - **Integrare la tua arte:** Se i membri della comunità o i giardinieri locali creano schizzi, stampe di foglie o foto delle aiuole reali, integrarli insieme alle illustrazioni digitali aggiunge un tocco accogliente e autentico.

