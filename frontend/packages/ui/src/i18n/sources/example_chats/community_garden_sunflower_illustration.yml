    ### Quick Design Tips for Community Handouts

    To make your garden handout both inviting and easy to read:

    - **Visual Hierarchy & Spacing:** Give the illustration breathing room. Placing it along a margin or header leaves clear space for gardening tips or event details without feeling cluttered.
    - **Color Harmony:** Pull warm tones directly from the artwork—like deep honey gold, olive leaf green, or earthy terracotta—for section headings and borders.
    - **Blending Your Own Art:** If community members or local gardeners create sketches, leaf prints, or photos of your actual garden beds, integrating those alongside digital illustrations creates a wonderful grassroots, welcoming touch.

