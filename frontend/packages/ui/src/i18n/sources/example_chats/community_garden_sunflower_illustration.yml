    ### 커뮤니티 안내문을 위한 간단한 디자인 팁

    정원 안내문을 매력적이고 읽기 쉽게 만드는 방법은 다음과 같아요:

    - **시각적 계층 구조 및 여백:** 일러스트에 충분한 여백을 주세요. 여백이나 헤더 쪽에 배치하면 가드닝 팁이나 행사 세부 정보를 넣을 공간이 확보되어 복잡해 보이지 않습니다.
    - **색상 조화:** 일러스트에서 직접 따뜻한 톤(진한 허니 골드, 올리브 그린, 흙빛 테라코타 등)을 추출하여 섹션 제목과 테두리에 사용해 보세요.
    - **직접 만든 예술 작품 활용:** 커뮤니티 회원이나 지역 정원사가 직접 그린 스케치, 나뭇잎 판화, 실제 정원 사진 등을 디지털 일러스트와 함께 배치하면 친근하고 따뜻한 느낌을 줄 수 있습니다.

