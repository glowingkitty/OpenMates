    Här är den varma botaniska illustrationen av en solros till ditt infoblad för den gemensamma trädgården:

    [!](embed:generated-images-ff26d807eb07)

    ### Design- och arbetsflödesförslag

    - **Kombinera med handritade element:** För gemenskapsmaterial fungerar det utmärkt att blanda digitala eller AI-genererade konstverk med autentiska personliga inslag. Du kan till exempel skriva ut den här illustrationen som bakgrund eller visuellt ankare och sedan låta medlemmarna skissa planteringsdiagram, texta skötselråd för hand eller lägga till pressade torkade blad/frön bredvid.
    - **Layout och hierarki för infobladet:**
      - **Vitt utrymme:** Ha generösa marginaler runt solrosen för att ge infobladet en luftig och välkomnande känsla.
      - **Typografi:** Kombinera en organisk eller humanistisk antikva (som [Garamond](wiki:Garamond) eller [Georgia](wiki:Georgia_(typeface))) för rubriker med en lättläst sans-serif för planteringsinstruktioner, detaljer om jordförberedelse och datum för evenemang.
      - **Färgpalett:** Plocka upp bärnstensfärgade och gyllene toner från kronbladen för accentlinjer eller underrubriker, och djupt skogsgrönt för viktiga höjdpunkter.

