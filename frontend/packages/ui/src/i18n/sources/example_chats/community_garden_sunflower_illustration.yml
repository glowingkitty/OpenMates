    Here is the warm botanical illustration of a sunflower for your community garden handout:

    [!](embed:generated-images-ff26d807eb07)

    ### Design & Workflow Suggestions

    - **Combining with hand-drawn elements:** For community materials, blending digital or AI-generated artwork with authentic personal touches works wonderfully. For example, you can print this illustration as a background or visual anchor, then have community members sketch planting diagrams, hand-letter care tips, or add pressed dried leaves/seeds alongside it.
    - **Handout Layout & Hierarchy:**
      - **White space:** Keep generous margins around the sunflower to give the handout an airy, welcoming feel.
      - **Typography:** Pair an organic or humanistic serif (like [Garamond](wiki:Garamond) or [Georgia](wiki:Georgia_(typeface))) for headings with a legible sans-serif for planting instructions, soil preparation details, and event dates.
      - **Color Palette:** Sample the amber and golden tones from the petals for accent lines or subheadings, and deep forest green for key highlights.

