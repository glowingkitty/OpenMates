      - **Espaço em branco:** Mantém margens generosas à volta do girassol para dar ao folheto uma sensação arejada e acolhedora.
      - **Tipografia:** Combina uma serifada orgânica ou humanista (como [Garamond](wiki:Garamond) ou [Georgia](wiki:Georgia_(typeface))) para os títulos com uma sans-serif legível para as instruções de plantação, detalhes de preparação do solo e datas de eventos.
