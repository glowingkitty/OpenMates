    ### Návrhy designu a pracovního postupu

    - **Kombinování s ručně kreslenými prvky:** U komunitních materiálů skvěle funguje propojení digitálních děl nebo děl vytvořených umělou inteligencí s autentickými osobními prvky. Tuto ilustraci můžeš například vytisknout jako pozadí nebo vizuální kotvu a poté nechat členy komunity dokreslit schémata výsadby, ručně dopsat tipy na péči nebo k ní přidat vylisované sušené listy či semínka.
    - **Rozvržení a hierarchie letáku:**
      - **Bílé místo:** Kolem slunečnice ponech velkorysé okraje, aby leták působil vzdušně a přívětivě.
      - **Typografie:** Zkombinuj organický nebo humanistický serif (např. [Garamond](wiki:Garamond) nebo [Georgia](wiki:Georgia_(typeface))) pro nadpisy s čitelným bezpatkovým písmem pro pokyny k výsadbě, podrobnosti o přípravě půdy a data konání akcí.
      - **Barevná paleta:** Pro akcentní linky nebo podnadpisy vyber jantarové a zlaté tóny z okvětních lístků a pro klíčové zvýraznění použij tmavě lesní zelenou.

