    ### Rychlé tipy pro design komunitních letáků

    Aby byl tvůj zahradní leták lákavý a zároveň čitelný:

    - **Vizuální hierarchie a rozvržení:** Dopřej ilustraci prostor. Umístění k okraji nebo do záhlaví ponechá volné místo pro zahradnické tipy nebo podrobnosti o akci, aniž by leták působil přeplněně.
    - **Barevná harmonie:** Pro nadpisy sekcí a ohraničení použij hřejivé tóny přímo z ilustrace – například sytě medově zlatou, olivově zelenou nebo zemitou terakotu.
    - **Zapojení vlastní tvorby:** Pokud členové komunity nebo místní zahradníci vytvoří skici, otisky listů nebo fotografie vašich skutečných záhonů, jejich začlenění vedle digitálních ilustrací dodá letáku skvělý, autentický a přívětivý nádech.

    ---

    **Další kroky a možnosti:**
    - [Navrhni rozvržení letáku s nadpisy a tipy](/#message=Help%20me%20design%20a%20clean%20layout%20and%20copy%20for%20a%20community%20garden%20handout.)
    - [Navrhni barevnou paletu založenou na slunečnicích](/#message=Suggest%20a%20warm%20color%20palette%20and%20typography%20pairing%20for%20a%20botanical%20garden%20flyer.)
  sv: |
    ```json
    {"type":"app_skill_use","embed_id":"6a3857ca-aa90-486f-b481-4e1df6f95faa","app_id":"images","skill_id":"generate"}
    ```Jag skapar den där botaniska illustrationen av solrosen till ert infoblad för tillsammansodlingen nu; den bearbetas just nu och kommer att dyka upp här i chatten så fort den är klar.

    ### Snabba designtips för lokala infoblad

    För att göra ditt infoblad både inbjudande och lättläst:

    - **Visuell hierarki och luftighet:** Ge illustrationen lite andrum. Genom att placera den längs en marginal eller i sidhuvudet lämnar du plats för odlingstips eller information om evenemang utan att det känns rörigt.
    - **Färgharmoni:** Hämta varma toner direkt från konstverket – som djup honungsgul, olivbladsgrön eller jordig terracotta – till rubriker och ramar.
    - **Blanda in egen konst:** Om medlemmar eller lokala odlare skapar skisser, bladtryck eller foton av era faktiska odlingsbäddar, ger det en härlig och välkomnande gräsrotskänsla att integrera dessa tillsammans med digitala illustrationer.
    ---
    **Nästa steg och alternativ:**
    - [Designa en layout för ett infoblad med rubriker och tips](/#message=Help%20me%20design%20a%20clean%20layout%20and%20copy%20for%20a%20community%20garden%20handout.)
    - [Föreslå en färgpalett baserad på solrosor](/#message=Suggest%20a%20warm%20color%20palette%20and%20typography%20pairing%20for%20a%20botanical%20garden%20flyer.)
  he: |
    ```json
    {"type":"app_skill_use","embed_id":"6a3857ca-aa90-486f-b481-4e1df6f95faa","app_id":"images","skill_id":"generate"}
    ```

    אני יוצר כעת את האיור הבוטני של החמנייה עבור דף המידע של הגינה הקהילתית; הוא נמצא כעת בעיבוד ויופיע כאן בצ'אט ברגע שיהיה מוכן.

    ### טיפים מהירים לעיצוב דפי מידע קהילתיים

    כדי להפוך את דף המידע של הגינה למזמין וקל לקריאה:

    - **היררכיה ויזואלית וריווח:** תנו לאיור מרחב נשימה. מיקומו לאורך השוליים או בכותרת משאיר מקום פנוי לטיפים לגינון או לפרטי אירועים מבלי ליצור תחושת עומס.
    - **הרמוניית צבעים:** השתמשו בגוונים חמים ישירות מתוך היצירה – כמו זהב דבש עמוק, ירוק עלי זית או טרקוטה אדמתית – עבור כותרות של סעיפים ומסגרות.
    - **שילוב אמנות משלכם:** אם חברי הקהילה או גננים מקומיים יוצרים סקיצות, הדפסי עלים או צילומים של ערוגות הגינה שלכם, שילובם לצד איורים דיגיטליים יוצר מגע קהילתי ומזמין להפליא.

    ---

    **צעדים הבאים ואפשרויות:**
