    Here’s a concise summary of the budget in the attached community garden budget PDF.

    ## 1) Largest expenses
    Ranked from highest to lowest:

    1. **Raised-bed lumber and hardware** — **€420**
    2. **Soil and compost** — **€300**
    3. **Shared hand tools** — **€140**
    4. **Watering hoses and connectors** — **€95**
    5. **Seeds and seedlings** — **€85**
    6. **Opening event supplies** — **€75**

    ## 2) Total planned expenses
    Adding the listed expenses:

    - 420 + 300 + 85 + 140 + 95 + 75 = **€1,115**

    ## 3) Total expected funding
    Listed funding sources:

    - **Neighborhood grant** — €800
    - **Volunteer donations** — €200

    Total funding:

    - 800 + 200 = **€1,000**

    ## 4) Funding gap
    - **Total expenses:** €1,115
    - **Total funding:** €1,000
    - **Funding gap:** **€115**

    ## 5) Likely missing costs
    For a real community garden, this draft likely leaves out some common items:

    - **Site preparation** — clearing, leveling, debris removal
    - **Delivery/transport costs** — for lumber, soil, compost
    - **Storage/security** — tool box, shed, locks
    - **Water access fees** — hookup, meter use, usage charges
    - **Protective materials** — gloves, wheelbarrow, tarps
    - **Fencing/signage** — to protect plots and inform neighbors
    - **Ongoing maintenance** — replacement tools, extra soil, pest control
    - **Insurance/permits** — if required by the municipality or landowner
    - **Contingency reserve** — usually useful because small community projects often run over budget

    ## Quick interpretation
    The budget is **close to balanced**, but a **€115 gap** already exists even before likely omitted costs are added. So in practice, the project may need either:
    - a bit more fundraising,
    - some donated materials/tools,
    - or a reduced first-phase scope.

    If you want, I can also turn this into:
    - a **one-paragraph summary for a grant meeting**, or
    - a **clean budget table with percentages by category**.
