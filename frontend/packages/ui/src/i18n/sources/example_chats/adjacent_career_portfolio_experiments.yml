    ### 30-दिन के पोर्टफोलियो प्रयोग (Experiments)

    काम का सबूत (proof of work) बनाने के लिए तुम्हें तुरंत नौकरी बदलने की ज़रूरत नहीं है। तुम इन हल्के-फुल्के प्रयोगों को सीधे अपनी वर्तमान भूमिका में या स्वतंत्र केस स्टडी के रूप में चला सकते हो:

    #### टेक्निकल राइटिंग / कस्टमर एजुकेशन के लिए
    * **"टॉप 5 टिकट्स" रीराइट:** ऐसे 3 से 5 सामान्य सपोर्ट टिकटों की पहचान करो जहाँ यूज़र अक्सर भ्रमित करने वाले UI या अस्पष्ट गाइड के कारण फंस जाते हैं।
    * **डिलीवरेबल:** एक व्यापक, मॉड्यूलर समस्या निवारण गाइड या 'हाउ-टू' आर्टिकल लिखो। इसे स्पष्ट हेडिंग, प्री-रिक्विज़िट्स (ज़रूरी शर्तें), स्टेप-बाय-स्टेप निर्देश और एनोटेटेड स्क्रीनशॉट या डायग्राम के साथ स्ट्रक्चर करो।
    * **पोर्टफोलियो मेट्रिक:** ट्रैक करो कि पब्लिश करने के बाद इस समस्या से जुड़े टिकट कम हुए हैं या नहीं, या रिज़ॉल्यूशन स्पीड पर इंटरनल टीम के फीडबैक को मापो।

    #### सपोर्ट ऑपरेशंस के लिए
    * **मैक्रो और रूटिंग एफिशिएंसी ऑडिट:** अपनी टीम की मौजूदा मैक्रो लाइब्रेरी या टिकट रूटिंग नियमों का विश्लेषण करो।
    * **डिलीवरेबल:** 1 से 2 पेज का प्रोसेस इम्प्रूवमेंट प्रपोज़ल बनाओ जिसमें यह दिखाया गया हो:
      1. पहचाने गए फालतू या पुराने मैक्रोज़।
      2. एक सुव्यवस्थित कैटेगराइज़ेशन स्कीमा या ऑटोमेटेड ट्रिगर सेटअप।
      3. प्रति एजेंट प्रति सप्ताह बचाए गए समय का अनुमान।
    * **पोर्टफोलियो मेट्रिक:** इसे अपने लीड को दिखाओ या यदि तुम्हारे पास एडमिन एक्सेस है तो इसे लागू करो, और पहले और बाद के बेसलाइन को नोट करो।

