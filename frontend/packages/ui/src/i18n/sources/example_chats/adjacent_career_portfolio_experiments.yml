  ko: |
    [고객 지원](wiki:Customer_support) 배경과 도움말 가이드 및 티켓 워크플로에 대한 흥미를 바탕으로 볼 때, 두 가지 자연스러운 인접 직무가 눈에 띕니다.

    1. **테크니컬 라이터 / 고객 교육 전문가**
       *핵심:* [정보 구조](wiki:Information_architecture) 설계, 복잡한 소프트웨어 기능을 명확한 사용자 문서로 변환, 문제 해결 가이드 작성, 셀프 서비스 지식 베이스 유지 관리.
    2. **서포트 오퍼레이션 전문가 (Support Ops)**
       *핵심:* 고객 지원 티켓팅 도구([Zendesk](wiki:Zendesk), Freshdesk, 또는 Jira Service Management 등) 관리, 지원 지표 분석, 티켓 라우팅 최적화, 매크로 감사 및 반복 프로세스 자동화.

    ---

    ### 30일 포트폴리오 실험

    실무 역량을 증명하기 위해 당장 직업을 바꿀 필요는 없습니다. 현재 직무 내에서 이러한 가벼운 실험을 직접 진행하거나 독립적인 케이스 스터디를 만들어 볼 수 있습니다.

    #### 테크니컬 라이팅 / 고객 교육 분야
    * **"가장 많이 접수되는 티켓 5개" 다시 쓰기:** 사용자가 혼란스러운 UI나 모호한 기존 가이드 때문에 반복적으로 어려움을 겪는 일반적인 고객 지원 티켓 3~5개를 식별합니다.
    * **결과물:** 포괄적이고 모듈화된 문제 해결 가이드 또는 방법 안내 문서를 작성합니다. 명확한 제목, 사전 요구 사항, 단계별 지침, 주석이 달린 스크린샷 또는 다이어그램을 포함하여 구성합니다.
    * **포트폴리오 지표:** 가이드 게시 후 해당 이슈로 태그된 티켓이 감소하는지 추적하거나, 해결 속도에 대한 내부 팀의 피드백을 측정합니다.

    #### 서포트 오퍼레이션 분야
    * **매크로 및 라우팅 효율성 감사:** 팀의 기존 매크로 라이브러리 또는 티켓 라우팅 규칙을 분석합니다.
    * **결과물:** 다음 내용을 포함하는 1~2페이지 분량의 프로세스 개선 제안서를 작성합니다.
      1. 식별된 중복되거나 오래된 매크로.
      2. 간소화된 분류 체계 또는 자동 트리거 설정.
      3. 상담사당 주간 절감 예상 시간.
    * **포트폴리오 지표:** 이를 팀장에게 제안하거나 관리자 권한이 있는 경우 직접 구현하고, 전후 기준 수치를 기록합니다.

    ---

    ### 정보 인터뷰를 위한 질문

    링크드인이나 사내에서 실무자에게 연락할 때 다음과 같이 질문해 보세요.

    #### 테크니컬 라이터 대상
    * *"최종 사용자를 위한 글쓰기와 내부 기술 팀 또는 엔지니어를 위한 글쓰기 사이에서 어떻게 균형을 잡나요?"*
    * *"문서가 업데이트되기 전에 제품 기능이 빠르게 변경되는 경우, 협업 사이클은 어떻게 진행되나요?"*
    * *"현재 채용 시장에서 가장 가치 있게 평가받는 저작 도구와 'docs-as-code' 워크플로는 무엇인가요?"*

    #### 서포트 오퍼레이션 전문가 대상
    * *"하루 업무 중 도구 및 연동 설정과 데이터 및 티켓 볼륨 트렌드 분석의 비중은 각각 어느 정도인가요?"*
    * *"지원 워크플로를 확장할 때, 자동화와 관련하여 팀들이 가장 흔히 범하는 실수는 무엇인가요?"*
    * *"직무를 맡는 데 어떤 관리자 자격증(예: Zendesk, Salesforce)이나 기술적 역량이 가장 큰 도움이 되었나요?"*

    ---

    ### 방향 탐색하기 (질문 1/5)

    어떤 경로가 장기적인 목표와 일상적인 선호도에 가장 잘 맞는지 확인하기 위해, 핵심 업무 스타일과 관심사를 살펴보겠습니다.

    ```interactive_question
    {
      "type": "choice",
      "id": "adjacent_role_preference",
      "multiple": false,
      "question": "When you reflect on writing guides versus improving workflows, which type of problem energizes you more?",
      "custom_option_id": "other_focus",
      "custom_placeholder": "Describe what you enjoy most or any specific balance...",
      "options": [
        {
          "id": "content_pedagogy",
          "text": "Crafting clear language, structuring documentation, and teaching users how things work (leaning toward Technical Writing / Education)."
        },
        {
          "id": "systems_tooling",
          "text": "Fixing operational bottlenecks, configuring tools, and streamlining team efficiency (leaning toward Support Operations / RevOps)."
        },
        {
          "id": "hybrid_balance",
          "text": "An even split between both; I want to improve internal systems while also authoring the guides."
        },
        {
          "id": "other_focus",
          "text": "Something else / A different aspect entirely."
        }
      ]
    }
    ```

    **추천:** 집중 업무, 명확한 커뮤니케이션, UX 공감을 선호한다면 테크니컬 라이팅 트랙이 일반적으로 더 많은 자율성을 제공합니다. 도구 관리, 지표, 시스템 로직을 통한 문제 해결을 선호한다면 서포트 오퍼레이션이 운영 리더십 및 제품 운영으로 나아가는 더 빠른 경로를 제공합니다.

