message_1:
  context: "user message 1 in example chat: Test Two Career Paths from Customer Support. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: "I work in software customer support and like writing help guides and improving ticket workflows. What two adjacent roles could I test before applying for a new job? Please suggest small portfolio experiments I could do over the next month and questions to ask people in those roles."
  de: "Ich arbeite im Software-Customer-Support und schreibe gerne Hilfe-Anleitungen und verbessere Ticket-Workflows. Welche zwei angrenzenden Rollen könnte ich testen, bevor ich mich auf einen neuen Job bewerbe? Bitte schlage kleine Portfolio-Experimente vor, die ich im nächsten Monat durchführen kann, sowie Fragen, die ich Personen in diesen Rollen stellen kann."
  zh: 我从事软件客户支持工作，喜欢编写帮助指南和改进工单流程。在申请新工作之前，我可以测试哪两个相邻的角色？请建议我可以在下个月内完成的小型作品集实验，以及可以向担任这些角色的人提出的问题。
  es: "Trabajo en soporte técnico de software y me gusta escribir guías de ayuda y mejorar los flujos de trabajo de los tickets. ¿Qué dos roles adyacentes podría probar antes de solicitar un nuevo empleo? Por favor, sugiere pequeños experimentos para mi portafolio que pueda hacer durante el próximo mes y preguntas para hacerle a personas en esos roles."
  fr: "Je travaille dans le support client logiciel et j'aime rédiger des guides d'aide et améliorer les flux de tickets. Quels sont les deux rôles adjacents que je pourrais tester avant de postuler à un nouvel emploi ? Suggère-moi de petites expériences de portfolio que je pourrais réaliser au cours du mois prochain et des questions à poser aux personnes occupant ces postes."
  pt: "Trabalho com suporte ao cliente de software e gosto de escrever guias de ajuda e melhorar fluxos de trabalho de tickets. Quais são as duas funções adjacentes que eu poderia testar antes de me candidatar a um novo emprego? Por favor, sugira pequenos experimentos de portfólio que eu possa fazer no próximo mês e perguntas para fazer a pessoas nessas funções."
  ru: "Я работаю в службе поддержки ПО, мне нравится писать руководства и оптимизировать процессы обработки тикетов. Какие две смежные роли я мог бы протестировать перед поиском новой работы? Пожалуйста, предложи небольшие эксперименты для портфолио на ближайший месяц и вопросы, которые стоит задать специалистам в этих областях."
  ja: ソフトウェアのカスタマーサポートで働いていて、ヘルプガイドの作成やチケットワークフローの改善が好きです。新しい仕事に応募する前に試してみるべき、隣接する2つの職種は何でしょうか？今後1ヶ月で取り組める小さなポートフォリオ実験と、その職種の人たちに尋ねるべき質問を提案してください。
  ko: "저는 소프트웨어 고객 지원 분야에서 일하고 있으며, 도움말 가이드를 작성하고 티켓 워크플로를 개선하는 일을 좋아합니다. 새로운 직장에 지원하기 전에 테스트해 볼 수 있는 인접한 두 가지 역할은 무엇일까요? 다음 한 달 동안 진행할 수 있는 작은 포트폴리오 실험과 해당 직무의 담당자들에게 물어볼 질문을 추천해 주세요."
  it: "Lavoro nel supporto clienti software e mi piace scrivere guide di aiuto e migliorare i flussi di lavoro dei ticket. Quali sono due ruoli adiacenti che potrei testare prima di candidarmi per un nuovo lavoro? Suggeriscimi dei piccoli esperimenti di portfolio da fare nel prossimo mese e delle domande da porre a chi ricopre quei ruoli."
  tr: "Yazılım müşteri desteğinde çalışıyorum; yardım kılavuzları yazmayı ve destek talebi iş akışlarını iyileştirmeyi seviyorum. Yeni bir işe başvurmadan önce hangi iki komşu rolü test edebilirim? Lütfen önümüzdeki ay boyunca yapabileceğim küçük portfolyo deneyleri ve bu rollerdeki kişilere sorabileceğim sorular öner."
  vi: "Tôi làm việc trong bộ phận hỗ trợ khách hàng phần mềm và thích viết hướng dẫn trợ giúp cũng như cải thiện quy trình xử lý phiếu hỗ trợ. Hai vai trò lân cận nào tôi có thể thử nghiệm trước khi ứng tuyển công việc mới? Vui lòng gợi ý các thử nghiệm hồ sơ năng lực nhỏ mà tôi có thể thực hiện trong tháng tới và các câu hỏi để hỏi những người đang làm ở các vai trò đó."
  id: "Saya bekerja di bagian customer support perangkat lunak dan suka menulis panduan bantuan serta meningkatkan alur kerja tiket. Apa dua peran terdekat yang bisa saya uji sebelum melamar pekerjaan baru? Tolong sarankan eksperimen portofolio kecil yang bisa saya lakukan selama sebulan ke depan dan pertanyaan untuk diajukan kepada orang-orang di peran tersebut."
  pl: "Pracuję w dziale obsługi klienta oprogramowania i lubię pisać poradniki oraz usprawniać procesy obsługi zgłoszeń. Jakie dwie pokrewne role mógłbym przetestować przed aplikowaniem na nową ofertę? Zasugeruj proszę małe eksperymenty do portfolio, które mógłbym przeprowadzić w ciągu najbliższego miesiąca, oraz pytania, które warto zadać osobom na tych stanowiskach."
  nl: "Ik werk in software customer support en schrijf graag handleidingen en verbeter graag ticket-workflows. Welke twee aangrenzende rollen zou ik kunnen testen voordat ik op een nieuwe baan solliciteer? Stel kleine portfolio-experimenten voor die ik de komende maand kan doen en vragen die ik aan mensen in die rollen kan stellen."
  ar: أعمل في مجال دعم عملاء البرمجيات وأحب كتابة أدلة المساعدة وتحسين سير عمل التذاكر. ما هما الدوران الوظيفيان المجاوران اللذان يمكنني اختبارهما قبل التقدم لوظيفة جديدة؟ يرجى اقتراح تجارب بسيطة لبناء ملف أعمال (portfolio) يمكنني القيام بها خلال الشهر القادم، وأسئلة لأطرحها على الأشخاص الذين يشغلون هذه الأدوار.
  hi: "मैं सॉफ्टवेयर कस्टमर सपोर्ट में काम करता हूँ और मुझे हेल्प गाइड लिखना और टिकट वर्कफ़्लो में सुधार करना पसंद है। नई नौकरी के लिए आवेदन करने से पहले मैं किन दो संबंधित भूमिकाओं का परीक्षण कर सकता हूँ? कृपया छोटे पोर्टफोलियो प्रयोगों का सुझाव दें जो मैं अगले एक महीने में कर सकूँ और उन भूमिकाओं में काम करने वाले लोगों से पूछने के लिए सवाल भी बताएं।"
  th: "ฉันทำงานฝ่ายสนับสนุนลูกค้าด้านซอฟต์แวร์ และชอบเขียนคู่มือช่วยเหลือรวมถึงปรับปรุงเวิร์กโฟลว์ของตั๋วงาน มีสายงานใกล้เคียงสองสายงานไหนบ้างที่ฉันสามารถทดลองทำได้ก่อนสมัครงานใหม่? ช่วยแนะนำการทดลองทำพอร์ตโฟลิโอเล็กๆ ที่ฉันสามารถทำได้ในเดือนหน้า และคำถามสำหรับถามผู้ที่ทำงานในสายงานเหล่านั้นให้หน่อย"
  cs: "Pracuji v zákaznické podpoře softwaru a baví mě psát nápovědy a vylepšovat procesy vyřizování ticketů. Jaké dvě příbuzné role můžu otestovat, než se začnu ucházet o novou práci? Navrhni mi prosím malé experimenty pro portfolio, které můžu stihnout během příštího měsíce, a otázky, na které se mám zeptat lidí v těchto rolích."
  sv: "Jag jobbar med kundsupport inom mjukvara och gillar att skriva hjälpguider och förbättra ärendeflöden. Vilka två närliggande roller skulle jag kunna testa innan jag söker ett nytt jobb? Föreslå gärna små portföljexperiment som jag kan göra under den kommande månaden och frågor att ställa till personer i de rollerna."
  he: "אני עובד בתמיכת לקוחות בתוכנה ואוהב לכתוב מדריכי עזרה ולשפר תהליכי עבודה של כרטיסי תמיכה. אילו שני תפקידים סמוכים כדאי לי לבדוק לפני שאגיש מועמדות לעבודה חדשה? אשמח להצעות לניסויי תיק עבודות קטנים שאוכל לבצע במהלך החודש הקרוב, ושאלות שכדאי לשאול אנשים בתפקידים האלה."
  verified_by_human: []

message_2:
  context: "assistant message 2 in example chat: Test Two Career Paths from Customer Support. Keep markdown, JSON code blocks, embed links, source quote links, and placeholders unchanged."
  en: |
    Based on your background in [customer support](wiki:Customer_support) and your enjoyment of help guides and ticket workflows, two natural adjacent roles stand out:

    1. **Technical Writer / Customer Education Specialist**
       *Focus:* Organizing [information architecture](wiki:Information_architecture), translating complex software features into clear user documentation, creating troubleshooting guides, and maintaining self-service knowledge bases.
    2. **Support Operations Specialist (Support Ops)**
       *Focus:* Administering support ticketing tools (such as [Zendesk](wiki:Zendesk), Freshdesk, or Jira Service Management), analyzing support metrics, optimizing ticket routing, auditing macros, and automating repetitive processes.

    ---

    ### 30-Day Portfolio Experiments

    You do not need to switch jobs immediately to build proof of work. You can run these lightweight experiments directly within your current role or as independent case studies:

    #### For Technical Writing / Customer Education
    * **The "Top 5 Tickets" Rewrite:** Identify 3 to 5 common support tickets where users routinely get stuck due to confusing UI or vague existing guides.
    * **The Deliverable:** Write a comprehensive, modular troubleshooting guide or how-to article. Structure it with clear headings, prerequisites, step-by-step instructions, and annotated screenshots or diagrams.
    * **Portfolio Metric:** Track whether tickets tagged with this issue decrease after publishing, or measure internal team feedback on resolution speed.

    #### For Support Operations
    * **Macro & Routing Efficiency Audit:** Analyze your team’s existing macro library or ticket routing rules.
    * **The Deliverable:** Create a 1-to-2 page process improvement proposal showing:
      1. Redundant or outdated macros identified.
      2. A streamlined categorization schema or automated trigger setup.
      3. An estimate of time saved per agent per week.
    * **Portfolio Metric:** Present this to your lead or implement it if you have admin access, noting the before-and-after baseline.

    ---

    ### Questions for Informational Interviews

    When reaching out to practitioners on LinkedIn or internally:

    #### For Technical Writers
    * *"How do you balance writing for end users versus writing for internal technical teams or engineers?"*
    * *"What does your collaboration cycle look like when product features change rapidly before documentation is updated?"*
    * *"Which authoring tools and docs-as-code workflows are most valued in hiring right now?"*

    #### For Support Operations Specialists
    * *"How much of your day is spent configuring tooling and integrations versus analyzing data and ticket volume trends?"*
    * *"When scaling support workflows, what is the most common mistake teams make with automation?"*
    * *"What administrative certifications (e.g., Zendesk, Salesforce) or technical skills made the biggest difference in landing your role?"*

    ---

    ### Exploring Your Direction (Question 1 of 5)

    To help identify which path aligns best with your long-term goals and day-to-day preferences, let's explore your core work style and interests.

    ```interactive_question
    {
      "type": "choice",
      "id": "adjacent_role_preference",
      "multiple": false,
      "question": "When you reflect on writing guides versus improving workflows, which type of problem energizes you more?",
      "custom_option_id": "other_focus",
      "custom_placeholder": "Describe what you enjoy most or any specific balance...",
      "options": [
        {
          "id": "content_pedagogy",
          "text": "Crafting clear language, structuring documentation, and teaching users how things work (leaning toward Technical Writing / Education)."
        },
        {
          "id": "systems_tooling",
          "text": "Fixing operational bottlenecks, configuring tools, and streamlining team efficiency (leaning toward Support Operations / RevOps)."
        },
        {
          "id": "hybrid_balance",
          "text": "An even split between both; I want to improve internal systems while also authoring the guides."
        },
        {
          "id": "other_focus",
          "text": "Something else / A different aspect entirely."
        }
      ]
    }
    ```

    **Recommendation:** If you prefer heads-down focus, communication clarity, and UX empathy, the Technical Writing track generally offers more autonomy. If you prefer problem-solving around tool administration, metrics, and systems logic, Support Operations provides a faster runway into operational leadership and product operations.

    ---

    **Potential next steps:**
    - [Draft an outreach message for informational interviews](/#message=Help%20me%20draft%20a%20concise%20outreach%20message%20to%20send%20to%20a%20Technical%20Writer%20or%20Support%20Ops%20lead%20on%20LinkedIn.)
    - [Outline a support workflow audit template](/#message=Create%20a%20step-by-step%20template%20for%20a%20support%20macro%20and%20workflow%20audit%20experiment.)
    ---
    *⚠️ This is educational information only and not professional psychological advice. For mental health concerns, please consult a qualified therapist or counselor. If you're experiencing a crisis, contact emergency services or a crisis hotline immediately.*
  de: |
    Basierend auf deinem Hintergrund im [Kundensupport](wiki:Customer_support) und deiner Freude an Hilfe-Leitfäden und Ticket-Workflows stechen zwei natürliche angrenzende Rollen hervor:

    1. **Technical Writer / Customer Education Specialist**
       *Fokus:* Organisieren der [Informationsarchitektur](wiki:Information_architecture), Übersetzen komplexer Softwarefunktionen in klare Benutzerdokumentationen, Erstellen von Anleitungen zur Fehlerbehebung und Pflege von Self-Service-Wissensdatenbanken.
    2. **Support Operations Specialist (Support Ops)**
       *Fokus:* Verwalten von Support-Ticketing-Tools (wie [Zendesk](wiki:Zendesk), Freshdesk oder Jira Service Management), Analysieren von Support-Metriken, Optimieren des Ticket-Routings, Auditieren von Makros und Automatisieren repetitiver Prozesse.

    ---

    ### 30-Tage-Portfolio-Experimente

    Du musst nicht sofort den Job wechseln, um einen Arbeitsnachweis (Proof of Work) zu erbringen. Du kannst diese leichtgewichtigen Experimente direkt in deiner aktuellen Rolle oder als unabhängige Fallstudien durchführen:

    #### Für Technical Writing / Customer Education
    * **Der „Top 5 Tickets“-Rewrite:** Identifiziere 3 bis 5 häufige Support-Tickets, bei denen Nutzer aufgrund einer verwirrenden Benutzeroberfläche oder vager Anleitungen regelmäßig nicht weiterkommen.
    * **Das Ergebnis:** Schreibe eine umfassende, modulare Anleitung zur Fehlerbehebung oder einen How-to-Artikel. Strukturiere ihn mit klaren Überschriften, Voraussetzungen, Schritt-für-Schritt-Anleitungen und annotierten Screenshots oder Diagrammen.
    * **Portfolio-Metrik:** Verfolge, ob die mit diesem Problem markierten Tickets nach der Veröffentlichung abnehmen, oder miss das interne Team-Feedback zur Lösungsgeschwindigkeit.

    #### Für Support Operations
    * **Makro- & Routing-Effizienz-Audit:** Analysiere die bestehende Makro-Bibliothek oder die Ticket-Routing-Regeln deines Teams.
    * **Das Ergebnis:** Erstelle einen 1- bis 2-seitigen Vorschlag zur Prozessverbesserung, der Folgendes zeigt:
      1. Identifizierte redundante oder veraltete Makros.
      2. Ein optimiertes Kategorisierungsschema oder ein automatisiertes Trigger-Setup.
      3. Eine Schätzung der Zeitersparnis pro Agent pro Woche.
    * **Portfolio-Metrik:** Präsentiere dies deinem Teamleiter oder setze es um, falls du Admin-Zugriff hast, und halte den Vorher-Nachher-Vergleich fest.

    ---

    ### Fragen für Informationsgespräche

    Wenn du dich an Experten auf LinkedIn oder intern wendest:

    #### Für Technical Writer
    * *„Wie findest du die Balance zwischen dem Schreiben für Endnutzer und dem Schreiben für interne technische Teams oder Ingenieure?“*
    * *„Wie sieht dein Kollaborationszyklus aus, wenn sich Produktfunktionen schnell ändern, bevor die Dokumentation aktualisiert ist?“*
    * *„Welche Authoring-Tools und Docs-as-Code-Workflows werden derzeit bei Einstellungen am meisten geschätzt?“*

    #### Für Support Operations Specialists
    * *„Wie viel Zeit verbringst du am Tag mit der Konfiguration von Tools und Integrationen im Vergleich zur Analyse von Daten und Ticketvolumen-Trends?“*
    * *„Was ist beim Skalieren von Support-Workflows der häufigste Fehler, den Teams bei der Automatisierung machen?“*
    * *„Welche administrativen Zertifizierungen (z. B. Zendesk, Salesforce) oder technischen Fähigkeiten haben den größten Unterschied bei deiner Einstellung gemacht?“*

    ---

    ### Deine Richtung erkunden (Frage 1 von 5)

