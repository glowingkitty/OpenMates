    Vzhledem k tvým zkušenostem v [zákaznické podpoře](wiki:Customer_support) a tomu, že tě baví nápovědy a pracovní postupy s tikety, vynikají dvě přirozeně navazující role:

    1. **Technický redaktor / Specialista na vzdělávání zákazníků**
       *Zaměření:* Organizace [informační architektury](wiki:Information_architecture), překlad složitých funkcí softwaru do srozumitelné uživatelské dokumentace, tvorba návodů na řešení problémů a správa samoobslužných znalostních bází.
    2. **Specialista na operace podpory (Support Ops)**
       *Zaměření:* Správa nástrojů pro tikety podpory (jako [Zendesk](wiki:Zendesk), Freshdesk nebo Jira Service Management), analýza metrik podpory, optimalizace směrování tiketů, audit maker a automatizace opakujících se procesů.

    ---

    ### 30denní experimenty pro portfolio

    Nemusíš hned měnit práci, abys prokázal své dovednosti. Tyto nenáročné experimenty můžeš provádět přímo ve své současné roli nebo jako nezávislé případové studie:

    #### Pro technické psaní / vzdělávání zákazníků
    * **Přepsání „5 nejčastějších tiketů“:** Identifikuj 3 až 5 běžných tiketů podpory, u kterých se uživatelé pravidelně zaseknou kvůli matoucímu uživatelskému rozhraní nebo nejasným stávajícím návodům.
    * **Výstup:** Napiš komplexní, modulární návod na řešení problémů nebo článek typu „jak na to“. Strukturuj ho pomocí jasných nadpisů, prerekvizit, pokynů krok za krokem a anotovaných snímků obrazovky nebo diagramů.
    * **Metrika portfolia:** Sleduj, zda po zveřejnění klesne počet tiketů s tímto označením, nebo změř zpětnou vazbu interního týmu ohledně rychlosti vyřešení.

    #### Pro operace podpory (Support Ops)
    * **Audit efektivity maker a směrování:** Analyzuj stávající knihovnu maker svého týmu nebo pravidla pro směrování tiketů.
    * **Výstup:** Vytvoř 1 až 2stránkový návrh na zlepšení procesu, který bude obsahovat:
      1. Identifikovaná nadbytečná nebo zastaralá makra.
      2. Zjednodušené schéma kategorizace nebo nastavení automatických spouštěčů.
      3. Odhad času ušetřeného na jednoho agenta týdně.
    * **Metrika portfolia:** Předlož to svému vedoucímu nebo to implementuj, pokud máš administrátorský přístup, a zaznamenej stav před a po.

    ---

    ### Otázky pro informační rozhovory

    Při oslovování odborníků na LinkedInu nebo interně:

    #### Pro technické redaktory
    * *„Jak vyvažuješ psaní pro koncové uživatele oproti psaní pro interní technické týmy nebo inženýry?“*
    * *„Jak vypadá tvůj cyklus spolupráce, když se funkce produktu mění rychleji, než stíháš aktualizovat dokumentaci?“*
    * *„Které autorské nástroje a pracovní postupy typu ‚docs-as-code‘ jsou v současnosti při náboru nejvíce ceněny?“*

    #### Pro specialisty na operace podpory
    * *„Kolik času denně trávíš konfigurací nástrojů a integrací oproti analýze dat a trendů v objemu tiketů?“*
    * *„Jaké jsou nejčastější chyby, kterých se týmy dopouštějí při automatizaci a škálování pracovních postupů podpory?“*
    * *„Které administrátorské certifikace (např. Zendesk, Salesforce) nebo technické dovednosti ti nejvíce pomohly k získání tvé pozice?“*

