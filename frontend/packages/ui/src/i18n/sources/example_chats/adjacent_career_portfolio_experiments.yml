    1. **Technical Writer / Customer Education Specialist**
       *Fokus:* Att organisera [informationsarkitektur](wiki:Information_architecture), översätta komplexa mjukvarufunktioner till tydlig användardokumentation, skapa felsökningsguider och underhålla kunskapsdatabaser för självbetjäning.
    2. **Support Operations Specialist (Support Ops)**
       *Fokus:* Att administrera verktyg för ärendehantering (som [Zendesk](wiki:Zendesk), Freshdesk eller Jira Service Management), analysera supportmått, optimera ärenderoutning, granska makron och automatisera repetitiva processer.
    ---
    ### 30-dagars portföljexperiment

    Du behöver inte byta jobb direkt för att bygga upp bevis på vad du kan (proof of work). Du kan köra de här lätta experimenten direkt i din nuvarande roll eller som fristående fallstudier:

    #### För tekniskt skrivande / kundutbildning
    * **Omskrivningen av ”Topp 5-ärendena”:** Identifiera 3 till 5 vanliga supportärenden där användare rutinmässigt kör fast på grund av ett förvirrande gränssnitt eller otydliga guider.
    * **Leveransen:** Skriv en omfattande, modulär felsökningsguide eller instruktionsartikel. Strukturera den med tydliga rubriker, förutsättningar, steg-för-steg-instruktioner och skärmbilder eller diagram med förklaringar.
    * **Portföljmått:** Spåra om ärenden taggade med det här problemet minskar efter publicering, eller mät det interna teamets feedback på hur snabbt ärenden löses.

    #### För Support Operations
    * **Effektivitetsgranskning av makron och dirigering:** Analysera ditt teams befintliga makrobibliotek eller regler för ärendedirigering.
    * **Leveransen:** Skapa ett 1–2 sidor långt förslag på processförbättring som visar:
      1. Överflödiga eller föråldrade makron som identifierats.
      2. Ett strömlinjeformat kategoriseringsschema eller en konfiguration för automatiserade triggers.
      3. En uppskattning av sparad tid per agent per vecka.
    * **Portföljmått:** Presentera detta för din teamledare eller implementera det om du har administratörsbehörighet, och notera utgångsläget före och efter.
    ---
