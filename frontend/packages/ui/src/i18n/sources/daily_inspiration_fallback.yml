  vi: "Bảo vệ các chi tiết cá nhân trước khi thực hiện lệnh gọi mô hình."
  id: "Lindungi detail pribadi sebelum pemanggilan model."
  pl: "Chroń dane osobowe przed wysłaniem zapytania do modelu."
  nl: "Bescherm persoonlijke gegevens vóór modelaanroepen."
  ar: "حماية التفاصيل الشخصية قبل استدعاءات النموذج."
  hi: "मॉडल कॉल से पहले व्यक्तिगत जानकारी सुरक्षित रखें।"
  th: "ปกป้องรายละเอียดส่วนตัวก่อนส่งข้อมูลไปยังโมเดล"
  cs: "Chraň osobní údaje před odesláním modelu."
  sv: "Skydda personuppgifter före modellanrop."
  he: "הגן על פרטים אישיים לפני קריאות למודל."

pii.assistant_response:
  context: "Offline Daily Inspiration pii card assistant_response; preserve factual meaning and product terms."
  en: "Choose personal details for OpenMates to hide before a model call. Review the privacy settings to manage them."
  de: "Wähle persönliche Details aus, die OpenMates vor einem Modellaufruf verbergen soll. Verwalte sie in den Privatsphäre-Einstellungen."
  zh: "在调用模型前，选择要让 OpenMates 隐藏的个人详情。查看隐私设置以进行管理。"
  es: "Elige qué datos personales debe ocultar OpenMates antes de una llamada al modelo. Revisa los ajustes de privacidad para gestionarlos."
  fr: "Choisis les informations personnelles qu'OpenMates doit masquer avant un appel au modèle. Gère-les dans les paramètres de confidentialité."
  pt: "Escolhe detalhes pessoais para o OpenMates ocultar antes de uma chamada ao modelo. Revê as definições de privacidade para os gerires."
  ru: "Выбери личные данные, которые OpenMates будет скрывать перед запросом к модели. Управляй ими в настройках приватности."
  ja: "モデル呼び出しの前に OpenMates が非表示にする個人情報を選択します。プライバシー設定を確認して管理しましょう。"
  ko: "모델 호출 전에 OpenMates가 숨길 개인 정보를 선택하세요. 개인정보 보호 설정에서 이를 관리할 수 있습니다."
  it: "Scegli i dettagli personali che OpenMates deve nascondere prima di una chiamata al modello. Controlla le impostazioni sulla privacy per gestirli."
  tr: "Bir model çağrısından önce OpenMates'in gizlemesini istediğin kişisel detayları seç. Bunları yönetmek için gizlilik ayarlarını gözden geçir."
  vi: "Chọn các chi tiết cá nhân để OpenMates ẩn đi trước khi thực hiện lệnh gọi mô hình. Hãy xem lại cài đặt quyền riêng tư để quản lý chúng."
  id: "Pilih detail pribadi yang ingin disembunyikan OpenMates sebelum pemanggilan model. Tinjau pengaturan privasi untuk mengelolanya."
  pl: "Wybierz dane osobowe, które OpenMates ma ukrywać przed zapytaniem do modelu. Zarządzaj nimi w ustawieniach prywatności."
  nl: "Kies welke persoonlijke gegevens OpenMates moet verbergen vóór een modelaanroep. Bekijk de privacyinstellingen om ze te beheren."
  ar: "اختر التفاصيل الشخصية التي تريد من OpenMates إخفاءها قبل استدعاء النموذج. راجع إعدادات الخصوصية لإدارتها."
  hi: "मॉडल कॉल से पहले OpenMates द्वारा छिपाई जाने वाली व्यक्तिगत जानकारी चुनें। उन्हें प्रबंधित करने के लिए प्राइवेसी सेटिंग्स की समीक्षा करें।"
  th: "เลือกรายละเอียดส่วนตัวเพื่อให้ OpenMates ซ่อนก่อนส่งข้อมูลไปยังโมเดล ตรวจสอบการตั้งค่าความเป็นส่วนตัวเพื่อจัดการข้อมูลเหล่านี้"
  cs: "Vyber si osobní údaje, které má OpenMates před odesláním modelu skrýt. Spravovat je můžeš v nastavení soukromí."
  sv: "Välj personuppgifter som OpenMates ska dölja före ett modellanrop. Gå till integritetsinställningarna för att hantera dem."
  he: "בחר פרטים אישיים ש-OpenMates תסתיר לפני קריאה למודל. בדוק את הגדרות הפרטיות כדי לנהל אותם."

focus.phrase:
  context: "Offline Daily Inspiration focus card phrase; preserve factual meaning and product terms."
  en: "Need a more focused answer? Give your mate a specific job."
  de: "Brauchst du eine gezieltere Antwort? Gib deinem Mate eine spezifische Aufgabe."
  zh: "需要更精准的回答？给你的 Mate 一个具体的任务。"
  es: "¿Necesitas una respuesta más enfocada? Dale a tu mate una tarea específica."
  fr: "Besoin d'une réponse plus ciblée ? Donne une mission précise à ton mate."
  pt: "Precisas de uma resposta mais focada? Dá ao teu mate uma tarefa específica."
  ru: "Нужен более точный ответ? Дай своему помощнику конкретную задачу."
  ja: "より的を絞った回答が必要ですか？メイトに特定の役割を与えてみましょう。"
  ko: "더 집중된 답변이 필요한가요? 메이트에게 구체적인 역할을 부여해 보세요."
  it: "Hai bisogno di una risposta più mirata? Assegna al tuo mate un compito specifico."
  tr: "Daha odaklanmış bir cevaba mı ihtiyacın var? Mate'ine özel bir görev ver."
  vi: "Cần một câu trả lời tập trung hơn? Hãy giao cho người bạn của bạn một nhiệm vụ cụ thể."
  id: "Butuh jawaban yang lebih fokus? Berikan tugas spesifik kepada mate kamu."
  pl: "Potrzebujesz bardziej konkretnej odpowiedzi? Przydziel swojemu asystentowi konkretne zadanie."
  nl: "Heb je een gerichter antwoord nodig? Geef je mate een specifieke taak."
  ar: "هل تحتاج إلى إجابة أكثر تركيزاً؟ امنح رفيقك مهمة محددة."
  hi: "अधिक केंद्रित उत्तर चाहिए? अपने मेट (mate) को एक विशिष्ट काम दें।"
  th: "ต้องการคำตอบที่ตรงประเด็นกว่าเดิมไหม? มอบหมายหน้าที่เฉพาะเจาะจงให้คู่หูของคุณสิ"
  cs: "Potřebuješ cílenější odpověď? Dej svému parťákovi konkrétní úkol."
  sv: "Behöver du ett mer fokuserat svar? Ge din mate en specifik uppgift."
  he: "צריך תשובה ממוקדת יותר? תן ל-mate שלך תפקיד ספציפי."

