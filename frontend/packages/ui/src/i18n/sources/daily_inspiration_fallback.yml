  es: "Crea copias de seguridad de chats, ajustes, recuerdos y más."
  fr: "Sauvegarde tes discussions, paramètres, souvenirs et plus encore."
  pt: "Faz uma cópia de segurança de conversas, definições, memórias e muito mais."
  ru: "Резервное копирование чатов, настроек, воспоминаний и многого другого."
  ja: "チャット、設定、メモリーなどをバックアップ。"
  ko: "채팅, 설정, 기억 등을 백업하세요."
  it: "Esegui il backup di chat, impostazioni, ricordi e altro ancora."
  tr: "Sohbetleri, ayarları, anıları ve daha fazlasını yedekle."
  vi: "Sao lưu các cuộc trò chuyện, cài đặt, ký ức và nhiều nội dung khác."
  id: "Cadangkan chat, pengaturan, memori, dan lainnya."
  pl: "Twórz kopie zapasowe czatów, ustawień, wspomnień i nie tylko."
  nl: "Maak een back-up van chats, instellingen, herinneringen en meer."
  ar: "انسخ المحادثات، والإعدادات، والذكريات، وغيرها احتياطياً."
  hi: "चैट, सेटिंग्स, यादों और बहुत कुछ का बैकअप लें।"
  th: "สำรองข้อมูลแชท การตั้งค่า ความจำ และอื่นๆ"
  cs: "Zálohuj si chaty, nastavení, vzpomínky a další."
  sv: "Säkerhetskopiera chattar, inställningar, minnen med mera."
  he: "גבה צ'אטים, הגדרות, זיכרונות ועוד."

export.assistant_response:
  context: "Offline Daily Inspiration export card assistant_response; preserve factual meaning and product terms."
  en: "Export a copy of your OpenMates data from account settings. Sign in to access your encrypted account data."
  de: "Exportiere eine Kopie deiner OpenMates-Daten in den Kontoeinstellungen. Melde dich an, um auf deine verschlüsselten Kontodaten zuzugreifen."
  zh: "在账户设置中导出你的 OpenMates 数据副本。登录以访问你的加密账户数据。"
  es: "Exporta una copia de tus datos de OpenMates desde los ajustes de la cuenta. Inicia sesión para acceder a tus datos de cuenta cifrados."
  fr: "Exporte une copie de tes données OpenMates depuis les paramètres du compte. Connecte-toi pour accéder à tes données chiffrées."
  pt: "Exporta uma cópia dos teus dados do OpenMates nas definições da conta. Inicia sessão para acederes aos dados encriptados da tua conta."
  ru: "Экспортируй копию данных OpenMates в настройках аккаунта. Войди в систему, чтобы получить доступ к зашифрованным данным."
  ja: "アカウント設定から OpenMates データのコピーをエクスポートできます。サインインして、暗号化されたアカウントデータにアクセスしてください。"
  ko: "계정 설정에서 OpenMates 데이터 사본을 내보낼 수 있습니다. 암호화된 계정 데이터에 액세스하려면 로그인하세요."
  it: "Esporta una copia dei tuoi dati OpenMates dalle impostazioni dell'account. Accedi per consultare i dati crittografati del tuo account."
  tr: "Hesap ayarlarından OpenMates verilerinin bir kopyasını dışa aktar. Şifrelenmiş hesap verilerine erişmek için giriş yap."
  vi: "Xuất một bản sao dữ liệu OpenMates từ phần cài đặt tài khoản. Đăng nhập để truy cập dữ liệu tài khoản đã được mã hóa của bạn."
  id: "Ekspor salinan data OpenMates kamu dari pengaturan akun. Masuk untuk mengakses data akun kamu yang terenkripsi."
  pl: "Wyeksportuj kopię swoich danych z OpenMates w ustawieniach konta. Zaloguj się, aby uzyskać dostęp do zaszyfrowanych danych."
  nl: "Exporteer een kopie van je OpenMates-gegevens via de accountinstellingen. Log in om toegang te krijgen tot je versleutelde accountgegevens."
  ar: "صَدِّر نسخة من بيانات OpenMates الخاصة بك من إعدادات الحساب. سَجِّل الدخول للوصول إلى بيانات حسابك المشفرة."
  hi: "अकाउंट सेटिंग्स से अपने OpenMates डेटा की एक कॉपी एक्सपोर्ट करें। अपने एन्क्रिप्टेड अकाउंट डेटा तक पहुँचने के लिए साइन इन करें।"
  th: "ส่งออกสำเนาข้อมูล OpenMates ของคุณได้จากการตั้งค่าบัญชี ลงชื่อเข้าใช้เพื่อเข้าถึงข้อมูลบัญชีที่เข้ารหัสไว้"
  cs: "Exportuj si kopii svých dat z OpenMates v nastavení účtu. Přihlas se pro přístup ke svým šifrovaným datům."
  sv: "Exportera en kopia av dina OpenMates-data från kontoinställningarna. Logga in för att komma åt dina krypterade kontodata."
  he: "ייצא עותק של נתוני ה-OpenMates שלך מהגדרות החשבון. התחבר כדי לגשת לנתוני החשבון המוצפנים שלך."

pii.phrase:
  context: "Offline Daily Inspiration pii card phrase; preserve factual meaning and product terms."
  en: "Want stronger privacy controls? Add personal details that OpenMates should hide."
  de: "Willst du mehr Kontrolle über deine Privatsphäre? Füge persönliche Details hinzu, die OpenMates verbergen soll."
  zh: "想要更强大的隐私控制？添加 OpenMates 应当隐藏的个人详情。"
  es: "¿Quieres controles de privacidad más sólidos? Añade los datos personales que OpenMates debería ocultar."
  fr: "Tu veux plus de contrôle sur ta vie privée ? Ajoute les informations personnelles qu'OpenMates doit masquer."
  pt: "Queres controlos de privacidade mais fortes? Adiciona detalhes pessoais que o OpenMates deve ocultar."
  ru: "Нужна усиленная приватность? Укажи личные данные, которые OpenMates должен скрывать."
  ja: "より強力なプライバシー管理が必要ですか？OpenMates に非表示にさせたい個人情報を追加しましょう。"
  ko: "더 강력한 개인정보 보호를 원하시나요? OpenMates가 숨겨야 할 개인 정보를 추가하세요."
  it: "Vuoi controlli sulla privacy più rigorosi? Aggiungi i dettagli personali che OpenMates dovrebbe nascondere."
  tr: "Daha güçlü gizlilik kontrolleri mi istiyorsun? OpenMates'in gizlemesi gereken kişisel detayları ekle."
  vi: "Bạn muốn kiểm soát quyền riêng tư chặt chẽ hơn? Hãy thêm các chi tiết cá nhân mà OpenMates nên ẩn đi."
  id: "Ingin kontrol privasi yang lebih kuat? Tambahkan detail pribadi yang harus disembunyikan OpenMates."
  pl: "Chcesz lepszej kontroli prywatności? Dodaj dane osobowe, które OpenMates ma ukrywać."
  nl: "Wil je meer controle over je privacy? Voeg persoonlijke gegevens toe die OpenMates moet verbergen."
  ar: "هل تريد ضوابط خصوصية أقوى؟ أضف التفاصيل الشخصية التي يجب على OpenMates إخفاؤها."
  hi: "बेहतर प्राइवेसी कंट्रोल चाहते हैं? वे व्यक्तिगत विवरण जोड़ें जिन्हें OpenMates को छिपाना चाहिए।"
  th: "ต้องการการควบคุมความเป็นส่วนตัวที่เข้มงวดขึ้นไหม? เพิ่มรายละเอียดส่วนตัวที่ต้องการให้ OpenMates ซ่อนไว้"
  cs: "Chceš silnější kontrolu soukromí? Přidej osobní údaje, které má OpenMates skrýt."
  sv: "Vill du ha starkare integritetskontroller? Lägg till personuppgifter som OpenMates ska dölja."
  he: "רוצה בקרת פרטיות חזקה יותר? הוסף פרטים אישיים ש-OpenMates צריכה להסתיר."

