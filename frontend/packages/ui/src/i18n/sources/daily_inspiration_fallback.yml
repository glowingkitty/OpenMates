  zh: "古希腊的手动宇宙模型。"
  es: "Un antiguo modelo griego del cosmos accionado manualmente."
  fr: "Un modèle manuel du cosmos datant de la Grèce antique."
  pt: "Um antigo modelo grego do cosmos movido à mão."
  ru: "Древнегреческая ручная модель космоса."
  ja: "古代ギリシャの手動式宇宙模型。"
  ko: "고대 그리스의 수동식 우주 모델입니다."
  it: "Un antico modello greco del cosmo azionato a mano."
  tr: "Kozmosun antik Yunan yapımı, elle çalışan bir modeli."
  vi: "Mô hình vũ trụ vận hành bằng tay của người Hy Lạp cổ đại."
  id: "Model kosmos bertenaga tangan dari Yunani kuno."
  pl: "Starożytny grecki, napędzany ręcznie model kosmosu."
