  th: "พาราด็อกซ์ของเฟอร์มี"
  cs: "Fermiho paradox"
  sv: "Fermiparadoxen"
  he: "פרדוקס פרמי"

fermi.description:
  context: "Offline Daily Inspiration fermi card description; preserve factual meaning and product terms."
  en: "The tension between likely extraterrestrial life and no clear evidence."
  de: "Das Spannungsfeld zwischen wahrscheinlichem außerirdischem Leben und fehlenden Beweisen."
  zh: "外星生命存在的可能性与缺乏明确证据之间的矛盾。"
  es: "La tensión entre la probabilidad de vida extraterrestre y la falta de pruebas claras."
  fr: "La tension entre la probabilité d'une vie extraterrestre et l'absence de preuves claires."
  pt: "A tensão entre a provável vida extraterrestre e a ausência de provas claras."
  ru: "Противоречие между высокой вероятностью внеземной жизни и отсутствием доказательств."
  ja: "地外生命体が存在する可能性と、明確な証拠がないことの間の矛盾。"
  ko: "외계 생명체의 존재 가능성과 명확한 증거가 없는 현실 사이의 모순입니다."
  it: "La tensione tra la probabile vita extraterrestre e la mancanza di prove chiare."
  tr: "Muhtemel dış dünya yaşamı ile net bir kanıtın olmaması arasındaki çelişki."
  vi: "Sự mâu thuẫn giữa khả năng tồn tại sự sống ngoài hành tinh và việc thiếu bằng chứng rõ ràng."
  id: "Ketegangan antara kemungkinan adanya kehidupan luar angkasa dan tidak adanya bukti yang jelas."
  pl: "Sprzeczność między wysokim prawdopodobieństwem życia pozaziemskiego a brakiem dowodów."
  nl: "De spanning tussen de waarschijnlijkheid van buitenaards leven en het gebrek aan bewijs."
  ar: "التناقض بين احتمالية وجود حياة خارج الأرض وغياب الأدلة الواضحة."
  hi: "संभावित अलौकिक जीवन और किसी स्पष्ट प्रमाण के न होने के बीच का तनाव।"
  th: "ความขัดแย้งระหว่างความเป็นไปได้ที่จะมีสิ่งมีชีวิตนอกโลกกับการไม่มีหลักฐานที่ชัดเจน"
  cs: "Rozpor mezi pravděpodobností mimozemského života a chybějícími jasnými důkazy."
  sv: "Spänningen mellan sannolikheten för utomjordiskt liv och bristen på tydliga bevis."
  he: "המתח בין הסבירות לקיום חיים מחוץ לכדור הארץ לבין היעדר ראיות ברורות."

fermi.assistant_response:
  context: "Offline Daily Inspiration fermi card assistant_response; preserve factual meaning and product terms."
  en: "The Fermi paradox asks why we have found no convincing evidence of extraterrestrial civilizations. Explore possible answers."
  de: "Das Fermi-Paradoxon fragt, warum wir keine überzeugenden Beweise für außerirdische Zivilisationen gefunden haben. Entdecke mögliche Antworten."
  zh: "费米悖论探讨了为什么我们还没有发现外星文明存在的有力证据。探索可能的答案。"
  es: "La paradoja de Fermi se pregunta por qué no hemos encontrado pruebas convincentes de civilizaciones extraterrestres. Explora posibles respuestas."
  fr: "Le paradoxe de Fermi interroge l'absence de preuves convaincantes de civilisations extraterrestres. Explore les réponses possibles."
  pt: "O paradoxo de Fermi questiona por que não encontramos provas convincentes de civilizações extraterrestres. Explora possíveis respostas."
  ru: "Парадокс Ферми задает вопрос: почему мы не нашли убедительных доказательств существования внеземных цивилизаций? Изучи возможные ответы."
  ja: "フェルミのパラドックスは、なぜ地球外文明の確かな証拠が見つからないのかを問いかけます。考えられる答えを探ってみましょう。"
  ko: "페르미 역설은 왜 우리가 외계 문명의 설득력 있는 증거를 찾지 못했는지 묻습니다. 가능한 답변들을 알아보세요."
  it: "Il paradosso di Fermi si chiede perché non abbiamo trovato prove convincenti di civiltà extraterrestri. Esplora le possibili risposte."
  tr: "Fermi paradoksu, neden dünya dışı medeniyetlere dair ikna edici bir kanıt bulamadığımızı sorgular. Olası cevapları keşfet."
  vi: "Nghịch lý Fermi đặt câu hỏi tại sao chúng ta chưa tìm thấy bằng chứng thuyết phục nào về các nền văn minh ngoài hành tinh. Hãy khám phá các câu trả lời khả thi."
  id: "Paradoks Fermi mempertanyakan mengapa kita belum menemukan bukti meyakinkan tentang peradaban luar angkasa. Jelajahi jawaban yang mungkin."
  pl: "Paradoks Fermiego stawia pytanie, dlaczego nie znaleźliśmy przekonujących dowodów na istnienie pozaziemskich cywilizacji. Poznaj możliwe odpowiedzi."
  nl: "De Fermi-paradox stelt de vraag waarom we geen overtuigend bewijs hebben gevonden van buitenaardse beschavingen. Ontdek mogelijke antwoorden."
  ar: "تتساءل مفارقة فيرمي عن سبب عدم عثورنا على أدلة مقنعة لحضارات خارج كوكب الأرض. استكشف الإجابات المحتملة."
  hi: "फर्मी विरोधाभास पूछता है कि हमें अलौकिक सभ्यताओं का कोई ठोस सबूत क्यों नहीं मिला है। संभावित उत्तरों को जानें।"
  th: "พาราด็อกซ์ของเฟอร์มีตั้งคำถามว่าทำไมเราถึงไม่พบหลักฐานที่น่าเชื่อถือของอารยธรรมนอกโลกเลย มาสำรวจคำตอบที่เป็นไปได้กัน"
  cs: "Fermiho paradox se ptá, proč jsme nenašli žádné přesvědčivé důkazy o mimozemských civilizacích. Prozkoumej možná vysvětlení."
  sv: "Fermiparadoxen frågar varför vi inte har hittat några övertygande bevis på utomjordiska civilisationer. Utforska möjliga svar."
  he: "פרדוקס פרמי שואל מדוע לא מצאנו ראיות משכנעות לציוויליזציות חוץ-ארציות. גלה תשובות אפשריות."

export.phrase:
  context: "Offline Daily Inspiration export card phrase; preserve factual meaning and product terms."
  en: "Keep your own backup. Export your OpenMates data whenever you need it."
  de: "Behalte dein eigenes Backup. Exportiere deine OpenMates-Daten, wann immer du sie brauchst."
  zh: "保留你自己的备份。随时根据需要导出你的 OpenMates 数据。"
  es: "Mantén tu propia copia de seguridad. Exporta tus datos de OpenMates cuando lo necesites."
  fr: "Garde ta propre sauvegarde. Exporte tes données OpenMates quand tu en as besoin."
  pt: "Mantém a tua própria cópia de segurança. Exporta os teus dados do OpenMates sempre que precisares."
  ru: "Сохраняй резервную копию. Экспортируй данные OpenMates в любое время."
  ja: "独自のバックアップを。必要な時にいつでも OpenMates データをエクスポートできます。"
  ko: "나만의 백업을 보관하세요. 필요할 때마다 OpenMates 데이터를 내보낼 수 있습니다."
  it: "Conserva il tuo backup. Esporta i tuoi dati OpenMates ogni volta che ne hai bisogno."
  tr: "Kendi yedeğini tut. OpenMates verilerini dilediğin zaman dışa aktar."
  vi: "Hãy giữ bản sao lưu của riêng bạn. Xuất dữ liệu OpenMates bất cứ khi nào bạn cần."
  id: "Simpan cadanganmu sendiri. Ekspor data OpenMates kamu kapan pun kamu membutuhkannya."
  pl: "Twórz własne kopie zapasowe. Eksportuj swoje dane z OpenMates, kiedy tylko potrzebujesz."
  nl: "Houd je eigen back-up bij. Exporteer je OpenMates-gegevens wanneer je maar wilt."
  ar: "احتفظ بنسختك الاحتياطية الخاصة. صَدِّر بيانات OpenMates الخاصة بك وقتما تشاء."
  hi: "अपना खुद का बैकअप रखें। जब भी ज़रूरत हो, अपना OpenMates डेटा एक्सपोर्ट करें।"
  th: "สำรองข้อมูลไว้ด้วยตัวเอง ส่งออกข้อมูล OpenMates ของคุณได้ทุกเมื่อที่ต้องการ"
  cs: "Měj vlastní zálohu. Exportuj si svá data z OpenMates, kdykoli potřebuješ."
  sv: "Behåll din egen säkerhetskopia. Exportera dina OpenMates-data när du behöver det."
  he: "שמור גיבוי משלך. ייצא את נתוני ה-OpenMates שלך בכל עת שתצטרך."

