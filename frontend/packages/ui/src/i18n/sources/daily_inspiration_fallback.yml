  cs: "Starořecký ručně poháněný model vesmíru."
  sv: "En antik grekisk handdriven modell av kosmos."
  he: "מודל יווני עתיק של הקוסמוס המופעל ידנית."

antikythera.assistant_response:
  context: "Offline Daily Inspiration antikythera card assistant_response; preserve factual meaning and product terms."
  en: "The Antikythera mechanism used bronze gears to model astronomical cycles. Explore how ancient engineers predicted the sky."
  de: "Der Mechanismus von Antikythera nutzte Bronzezahnräder, um astronomische Zyklen nachzubilden. Entdecke, wie antike Ingenieure den Himmel vorhersagten."
  zh: "安提基特拉机械装置利用青铜齿轮来模拟天文周期。探索古代工程师是如何预测星空的。"
  es: "El mecanismo de Anticitera utilizaba engranajes de bronce para modelar ciclos astronómicos. Explora cómo los ingenieros de la antigüedad predecían el cielo."
  fr: "La machine d'Anticythère utilisait des engrenages en bronze pour modéliser les cycles astronomiques. Découvre comment les ingénieurs de l'Antiquité prédisaient le ciel."
  pt: "O mecanismo de Anticítera usava engrenagens de bronze para modelar ciclos astronómicos. Explora como os engenheiros antigos previam o céu."
  ru: "Антикитерский механизм использовал бронзовые шестерни для моделирования астрономических циклов. Узнай, как древние инженеры предсказывали движение небесных тел."
  ja: "アンティキティラ島の機械は、青銅製の歯車を使って天体の周期を再現していました。古代の技術者たちがどのように空を予測していたのか、探ってみましょう。"
  ko: "안티키티라 메커니즘은 청동 기어를 사용하여 천문학적 주기를 모델링했습니다. 고대 엔지니어들이 어떻게 하늘을 예측했는지 알아보세요."
  it: "Il meccanismo di Anticitera usava ingranaggi in bronzo per modellare i cicli astronomici. Scopri come gli antichi ingegneri predicevano il cielo."
  tr: "Antikythera düzeneği, astronomik döngüleri modellemek için bronz dişliler kullanıyordu. Antik mühendislerin gökyüzünü nasıl tahmin ettiğini keşfet."
  vi: "Cơ chế Antikythera sử dụng các bánh răng bằng đồng để mô phỏng các chu kỳ thiên văn. Hãy khám phá cách các kỹ sư cổ đại dự đoán bầu trời."
  id: "Mekanisme Antikythera menggunakan roda gigi perunggu untuk memodelkan siklus astronomi. Jelajahi bagaimana para insinyur kuno memprediksi langit."
  pl: "Mechanizm z Antykithiry wykorzystywał brązowe koła zębate do modelowania cykli astronomicznych. Dowiedz się, jak starożytni inżynierowie przewidywali ruchy nieba."
  nl: "Het mechanisme van Antikythera gebruikte bronzen tandwielen om astronomische cycli na te bootsen. Ontdek hoe ingenieurs uit de oudheid de hemel voorspelden."
  ar: "استخدمت آلية أنتيكيثيرا تروساً برونزية لمحاكاة الدورات الفلكية. استكشف كيف تنبأ المهندسون القدماء بحركة السماء."
  hi: "एंटीकाइथेरा मैकेनिज्म ने खगोलीय चक्रों का मॉडल बनाने के लिए कांस्य गियर का उपयोग किया था। जानें कि प्राचीन इंजीनियरों ने आकाश की भविष्यवाणी कैसे की थी।"
  th: "กลไกแอนติคิเธียราใช้เฟืองทองสัมฤทธิ์เพื่อจำลองวงจรทางดาราศาสตร์ มาสำรวจกันว่าวิศวกรโบราณทำนายท้องฟ้าได้อย่างไร"
  cs: "Mechanismus z Antikythéry využíval bronzová ozubená kola k modelování astronomických cyklů. Prozkoumej, jak starověcí inženýři předpovídali oblohu."
  sv: "Antikytheramekanismen använde kugghjul av brons för att modellera astronomiska cykler. Utforska hur antika ingenjörer förutspådde himlavalvet."
  he: "מנגנון אנטיקיתרה השתמש בגלגלי שיניים מברונזה כדי לדמות מחזורים אסטרונומיים. גלה כיצד מהנדסים עתיקים חזו את השמיים."

bioluminescence.phrase:
  context: "Offline Daily Inspiration bioluminescence card phrase; preserve factual meaning and product terms."
  en: "Some animals make their own light. The chemistry is surprisingly elegant."
  de: "Manche Tiere erzeugen ihr eigenes Licht. Die Chemie dahinter ist überraschend elegant."
  zh: "有些动物会自己发光。其中的化学原理异常精妙。"
  es: "Algunos animales crean su propia luz. La química es sorprendentemente elegante."
  fr: "Certains animaux produisent leur propre lumière. La chimie à l'œuvre est d'une élégance surprenante."
  pt: "Alguns animais produzem a sua própria luz. A química é surpreendentemente elegante."
  ru: "Некоторые животные сами излучают свет. Химия этого процесса удивительно изящна."
  ja: "自ら光を放つ動物たちがいます。その化学反応は驚くほど優雅です。"
  ko: "어떤 동물들은 스스로 빛을 냅니다. 그 화학 작용은 놀라울 정도로 정교합니다."
  it: "Alcuni animali producono la propria luce. La chimica è sorprendentemente elegante."
  tr: "Bazı hayvanlar kendi ışıklarını üretir. Kimyası şaşırtıcı derecede zariftir."
  vi: "Một số loài động vật tự tạo ra ánh sáng. Phản ứng hóa học này thanh tao một cách đáng ngạc nhiên."
  id: "Beberapa hewan menghasilkan cahayanya sendiri. Proses kimianya sangat elegan."
  pl: "Niektóre zwierzęta same wytwarzają światło. Ta chemia jest zaskakująco elegancka."
  nl: "Sommige dieren maken hun eigen licht. De chemie is verrassend elegant."
  ar: "بعض الحيوانات تصنع ضوءها الخاص. كيمياؤها أنيقة بشكل مذهل."
  hi: "कुछ जानवर अपना प्रकाश स्वयं बनाते हैं। इसका रसायन विज्ञान आश्चर्यजनक रूप से शानदार है।"
  th: "สัตว์บางชนิดสร้างแสงสว่างได้เอง กลไกทางเคมีนั้นงดงามอย่างน่าทึ่ง"
  cs: "Někteří živočichové si vytvářejí vlastní světlo. Ta chemie je překvapivě elegantní."
  sv: "Vissa djur skapar sitt eget ljus. Kemins bakom är förvånansvärt elegant."
  he: "יש בעלי חיים שמייצרים אור בעצמם. הכימיה הזו אלגנטית להפליא."

