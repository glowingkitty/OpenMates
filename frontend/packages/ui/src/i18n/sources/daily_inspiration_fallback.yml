antikythera.phrase:
  context: "Offline Daily Inspiration antikythera card phrase; preserve factual meaning and product terms."
  en: "An ancient shipwreck held a machine that predicted the sky."
  de: "Ein antikes Schiffswrack barg eine Maschine, die den Himmel vorhersagte."
  zh: "一艘古代沉船中曾藏有一台可以预测星空的机器。"
  es: "Un antiguo naufragio albergaba una máquina que predecía el cielo."
  fr: "Une épave antique renfermait une machine qui prédisait le ciel."
  pt: "Um antigo naufrágio guardava uma máquina que previa o céu."
  ru: "На древнем затонувшем корабле нашли механизм, предсказывавший движение светил."
  ja: "古代の沈没船には、天体を予測する機械が眠っていた。"
  ko: "고대의 난파선에는 하늘을 예측하는 기계가 실려 있었습니다."
  it: "Un antico relitto custodiva una macchina che prediceva il cielo."
  tr: "Antik bir gemi enkazında gökyüzünü tahmin eden bir makine bulundu."
  vi: "Một xác tàu cổ chứa đựng một cỗ máy dự đoán bầu trời."
  id: "Sebuah bangkai kapal kuno menyimpan mesin yang memprediksi langit."
  pl: "Starożytny wrak skrywał maszynę, która przewidywała ruchy nieba."
  nl: "Een oud scheepswrak bevatte een machine die de hemel voorspelde."
  ar: "احتوى حطام سفينة قديمة على آلة تنبأت بحركة السماء."
  hi: "एक प्राचीन जहाज के मलबे में एक ऐसी मशीन मिली जो आकाश की भविष्यवाणी करती थी।"
  th: "ซากเรือโบราณบรรจุเครื่องจักรที่ใช้ทำนายท้องฟ้า"
  cs: "Starověký vrak lodi ukrýval stroj, který předpovídal oblohu."
  sv: "Ett antikt skeppsvrak dolde en maskin som förutspådde himlavalvet."
  he: "ספינה טרופה עתיקה הכילה מכונה שחזתה את השמיים."

