memories.description:
  context: "Offline Daily Inspiration memories card description; preserve factual meaning and product terms."
  en: "Save useful preferences and context."
  de: "Speichere nützliche Präferenzen und Kontext."
  zh: "保存实用的偏好和背景信息。"
  es: "Guarda preferencias y contexto útiles."
  fr: "Enregistre tes préférences et ton contexte."
  pt: "Guarda preferências e contexto úteis."
  ru: "Сохраняй полезные предпочтения и контекст."
  ja: "便利な設定やコンテキストを保存。"
  ko: "유용한 기본 설정과 맥락을 저장합니다."
  it: "Salva preferenze e contesti utili."
  tr: "Faydalı tercihleri ve bağlamı kaydet."
  vi: "Lưu các tùy chọn và ngữ cảnh hữu ích."
  id: "Simpan preferensi dan konteks yang berguna."
  pl: "Zapisuj przydatne preferencje i kontekst."
  nl: "Sla nuttige voorkeuren en context op."
  ar: "احفظ التفضيلات والسياقات المفيدة."
  hi: "उपयोगी प्राथमिकताओं और संदर्भ को सहेजें।"
  th: "บันทึกการตั้งค่าและบริบทที่เป็นประโยชน์"
  cs: "Ukládej si užitečné předvolby a kontext."
  sv: "Spara användbara preferenser och sammanhang."
  he: "שמור העדפות והקשרים שימושיים."

memories.assistant_response:
  context: "Offline Daily Inspiration memories card assistant_response; preserve factual meaning and product terms."
  en: "Save useful preferences and context as memories, then choose what your mates can use."
  de: "Speichere nützliche Präferenzen und Kontext als Erinnerungen und wähle dann aus, was deine Mates verwenden dürfen."
  zh: "将有用的偏好和背景信息保存为记忆，然后选择你的 Mate 可以使用的内容。"
  es: "Guarda preferencias y contexto útiles como recuerdos, y luego elige qué pueden usar tus mates."
  fr: "Enregistre tes préférences et ton contexte sous forme de souvenirs, puis choisis ce que tes mates peuvent utiliser."
  pt: "Guarda preferências e contexto úteis como memórias e, depois, escolhe o que os teus mates podem usar."
  ru: "Сохраняй полезные предпочтения и контекст в виде воспоминаний, а затем выбирай, что могут использовать твои помощники."
  ja: "便利な設定やコンテキストをメモリーとして保存し、メイトが使用できるものを選択します。"
  ko: "유용한 기본 설정과 맥락을 기억으로 저장한 다음, 메이트가 사용할 항목을 선택하세요."
  it: "Salva preferenze e contesti utili come ricordi, poi scegli cosa possono usare i tuoi mate."
  tr: "Faydalı tercihleri ve bağlamı anı olarak kaydet, ardından mate'lerinin neleri kullanabileceğini seç."
  vi: "Lưu các tùy chọn và ngữ cảnh hữu ích dưới dạng ký ức, sau đó chọn những gì các người bạn của bạn có thể sử dụng."
  id: "Simpan preferensi dan konteks yang berguna sebagai memori, lalu pilih apa yang bisa digunakan oleh mate kamu."
  pl: "Zapisuj przydatne preferencje i kontekst jako wspomnienia, a potem wybieraj, z czego mogą korzystać Twoi asystenci."
  nl: "Sla nuttige voorkeuren en context op als herinneringen en kies vervolgens wat je mates kunnen gebruiken."
  ar: "احفظ التفضيلات والسياقات المفيدة كذكريات، ثم اختر ما يمكن لرفاقك استخدامه."
  hi: "उपयोगी प्राथमिकताओं और संदर्भों को यादों (memories) के रूप में सहेजें, फिर चुनें कि आपके मेट्स किसका उपयोग कर सकते हैं।"
  th: "บันทึกการตั้งค่าและบริบทที่เป็นประโยชน์ไว้ในความจำ แล้วเลือกสิ่งที่คู่หูของคุณสามารถนำไปใช้ได้"
  cs: "Ukládej si užitečné předvolby a kontext jako vzpomínky a pak si vyber, co mohou tvoji parťáci používat."
  sv: "Spara användbara preferenser och sammanhang som minnen, och välj sedan vad dina mates får använda."
  he: "שמור העדפות והקשרים שימושיים כזיכרונות, ואז בחר במה ה-mates שלך יכולים להשתמש."

events.phrase:
  context: "Offline guest Daily Inspiration Events search card phrase; preserve factual meaning and product terms."
  en: "Looking for something to do? Explore events near you."
  de: "Suchst du etwas zu unternehmen? Entdecke Veranstaltungen in deiner Nähe."
  zh: "想找点事做？探索你附近的活动。"
  es: "¿Buscas algo que hacer? Explora eventos cerca de ti."
  fr: "Tu cherches une activité ? Découvre les événements près de chez toi."
  pt: "Procuras algo para fazer? Descobre eventos perto de ti."
  ru: "Ищешь, чем заняться? Узнай о мероприятиях поблизости."
  ja: "何か楽しめることを探していますか？近くのイベントを見つけましょう。"
  ko: "할 일을 찾고 있나요? 가까운 이벤트를 살펴보세요."
  it: "Cerchi qualcosa da fare? Scopri gli eventi vicino a te."
  tr: "Yapacak bir şey mi arıyorsun? Yakınındaki etkinlikleri keşfet."
  vi: "Bạn đang tìm việc gì đó để làm? Khám phá các sự kiện gần bạn."
  id: "Mencari kegiatan? Jelajahi acara di dekatmu."
  pl: "Szukasz czegoś do zrobienia? Odkryj wydarzenia w pobliżu."
  nl: "Zoek je iets om te doen? Ontdek evenementen bij jou in de buurt."
  ar: "هل تبحث عن شيء تفعله؟ استكشف الفعاليات القريبة منك."
  hi: "कुछ करने के लिए ढूँढ रहे हैं? अपने आस-पास के कार्यक्रम देखें।"
  th: "กำลังมองหาอะไรทำอยู่ไหม? สำรวจกิจกรรมใกล้คุณ"
  cs: "Hledáš, co podniknout? Objev akce ve svém okolí."
  sv: "Letar du efter något att göra? Upptäck evenemang nära dig."
  he: "מחפשים מה לעשות? גלו אירועים בקרבתכם."

