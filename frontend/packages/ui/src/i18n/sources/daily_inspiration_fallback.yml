bioluminescence.description:
  context: "Offline Daily Inspiration bioluminescence card description; preserve factual meaning and product terms."
  en: "Living organisms producing light through chemistry."
  de: "Lebende Organismen, die durch Chemie Licht erzeugen."
  zh: "生物体通过化学反应产生光。"
  es: "Organismos vivos que producen luz a través de la química."
  fr: "Des organismes vivants produisant de la lumière par réaction chimique."
  pt: "Organismos vivos que produzem luz através da química."
  ru: "Живые организмы, производящие свет с помощью химических реакций."
  ja: "化学反応によって光を生成する生物。"
  ko: "화학 작용을 통해 빛을 내는 생물입니다."
  it: "Organismi viventi che producono luce attraverso la chimica."
  tr: "Kimyasal yollarla ışık üreten canlı organizmalar."
  vi: "Các sinh vật sống tạo ra ánh sáng thông qua các phản ứng hóa học."
  id: "Organisme hidup yang menghasilkan cahaya melalui proses kimia."
  pl: "Żywe organizmy wytwarzające światło dzięki procesom chemicznym."
  nl: "Levende organismen die licht produceren via chemie."
  ar: "كائنات حية تنتج الضوء من خلال تفاعلات كيميائية."
  hi: "रसायन विज्ञान के माध्यम से प्रकाश उत्पन्न करने वाले जीवित जीव।"
  th: "สิ่งมีชีวิตที่ผลิตแสงผ่านกระบวนการทางเคมี"
  cs: "Živé organismy produkující světlo pomocí chemie."
  sv: "Levande organismer som producerar ljus genom kemi."
  he: "אורגניזמים חיים המפיקים אור באמצעות תהליכים כימיים."

bioluminescence.assistant_response:
  context: "Offline Daily Inspiration bioluminescence card assistant_response; preserve factual meaning and product terms."
  en: "Organisms glow for hunting, camouflage, communication, and defense. Explore how chemistry becomes light."
  de: "Organismen leuchten für die Jagd, Tarnung, Kommunikation und Verteidigung. Entdecke, wie Chemie zu Licht wird."
  zh: "生物发光是为了捕食、伪装、交流和防御。探索化学反应是如何转化为光芒的。"
  es: "Los organismos brillan para cazar, camuflarse, comunicarse y defenderse. Explora cómo la química se convierte en luz."
  fr: "Les organismes brillent pour chasser, se camoufler, communiquer et se défendre. Découvre comment la chimie se transforme en lumière."
  pt: "Os organismos brilham para caçar, para camuflagem, comunicação e defesa. Explora como a química se torna luz."
  ru: "Организмы светятся для охоты, маскировки, общения и защиты. Узнай, как химия превращается в свет."
  ja: "生物は狩り、擬態、コミュニケーション、防御のために光ります。化学がどのように光へと変わるのか、探ってみましょう。"
  ko: "생물은 사냥, 위장, 의사소통, 방어를 위해 빛을 냅니다. 화학 작용이 어떻게 빛으로 변하는지 알아보세요."
  it: "Gli organismi brillano per cacciare, mimetizzarsi, comunicare e difendersi. Scopri come la chimica diventa luce."
  tr: "Organizmalar avlanma, kamuflaj, iletişim ve savunma için parlar. Kimyanın nasıl ışığa dönüştüğünü keşfet."
  vi: "Các sinh vật phát sáng để săn mồi, ngụy trang, giao tiếp và tự vệ. Hãy khám phá cách hóa học biến thành ánh sáng."
  id: "Organisme bercahaya untuk berburu, kamuflase, komunikasi, dan pertahanan. Jelajahi bagaimana kimia menjadi cahaya."
  pl: "Organizmy świecą, by polować, kamuflować się, komunikować i bronić. Dowiedz się, jak chemia zamienia się w światło."
  nl: "Organismen geven licht voor de jacht, camouflage, communicatie en verdediging. Ontdek hoe chemie licht wordt."
  ar: "تتوهج الكائنات الحية للصيد، والتمويه، والتواصل، والدفاع. استكشف كيف تتحول الكيمياء إلى ضوء."
  hi: "जीव शिकार, छलावरण, संचार और रक्षा के लिए चमकते हैं। जानें कि रसायन विज्ञान प्रकाश में कैसे बदल जाता है।"
  th: "สิ่งมีชีวิตเรืองแสงเพื่อการล่า การพรางตัว การสื่อสาร และการป้องกันตัว มาสำรวจกันว่าเคมีกลายเป็นแสงได้อย่างไร"
  cs: "Organismy svítí kvůli lovu, maskování, komunikaci a obraně. Prozkoumej, jak se chemie mění ve světlo."
  sv: "Organismer lyser för jakt, kamouflage, kommunikation och försvar. Utforska hur kemi blir till ljus."
  he: "אורגניזמים זוהרים לצורכי ציד, הסוואה, תקשורת והגנה. גלה כיצד כימיה הופכת לאור."

fermi.phrase:
  context: "Offline Daily Inspiration fermi card phrase; preserve factual meaning and product terms."
  en: "If the universe is so large, why does it seem so quiet?"
  de: "Wenn das Universum so groß ist, warum scheint es dann so still zu sein?"
  zh: "如果宇宙如此广阔，为什么它看起来如此寂静？"
  es: "Si el universo es tan grande, ¿por qué parece estar tan callado?"
  fr: "Si l'univers est si vaste, pourquoi semble-t-il si silencieux ?"
  pt: "Se o universo é tão grande, por que parece tão silencioso?"
  ru: "Если Вселенная так велика, почему в ней так тихо?"
  ja: "宇宙がこれほど広いのに、なぜこれほど静かなのでしょうか？"
  ko: "우주가 이렇게 넓은데, 왜 이토록 조용한 걸까요?"
  it: "Se l'universo è così vasto, perché sembra così silenzioso?"
  tr: "Evren bu kadar büyükse neden bu kadar sessiz görünüyor?"
  vi: "Nếu vũ trụ rộng lớn đến vậy, tại sao nó lại có vẻ tĩnh lặng như thế?"
  id: "Jika alam semesta begitu luas, mengapa ia tampak begitu sunyi?"
  pl: "Skoro wszechświat jest tak wielki, dlaczego wydaje się tak cichy?"
  nl: "Als het universum zo groot is, waarom lijkt het dan zo stil?"
  ar: "إذا كان الكون شاسعاً جداً، فلماذا يبدو هادئاً إلى هذا الحد؟"
  hi: "अगर ब्रह्मांड इतना बड़ा है, तो यह इतना शांत क्यों लगता है?"
  th: "หากจักรวาลกว้างใหญ่ขนาดนี้ ทำไมมันถึงดูเงียบเหงาจัง?"
  cs: "Pokud je vesmír tak rozlehlý, proč se zdá být tak tichý?"
  sv: "Om universum är så stort, varför verkar det då så tyst?"
  he: "אם היקום כל כך גדול, למה הוא נראה כל כך שקט?"

