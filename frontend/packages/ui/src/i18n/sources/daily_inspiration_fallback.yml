tensegrity.description:
  context: "Static Daily Inspiration tensegrity description; public-safe fallback copy."
  en: "Structures stabilized by a balance of tension and compression."
  de: "Strukturen, die durch das Gleichgewicht von Zug und Druck stabil bleiben."
  zh: "通过拉力与压力的平衡保持稳定的结构。"
  es: "Estructuras estabilizadas por el equilibrio entre tensión y compresión."
  fr: "Des structures stabilisées par l’équilibre entre tension et compression."
  pt: "Estruturas estabilizadas pelo equilíbrio entre tensão e compressão."
  ru: "Конструкции, устойчивые благодаря равновесию растяжения и сжатия."
  ja: "張力と圧縮力の釣り合いで安定する構造。"
  ko: "인장력과 압축력의 균형으로 안정되는 구조입니다."
  it: "Strutture stabilizzate dall’equilibrio tra tensione e compressione."
  tr: "Çekme ve basınç kuvvetlerinin dengesiyle sabit kalan yapılar."
  vi: "Các kết cấu ổn định nhờ cân bằng lực kéo và lực nén."
  id: "Struktur yang stabil berkat keseimbangan tegangan dan kompresi."
  pl: "Konstrukcje stabilizowane równowagą naprężeń rozciągających i ściskających."
  nl: "Constructies die stabiel blijven door een evenwicht van trek en druk."
  ar: "هياكل تستقر بتوازن قوى الشد والضغط."
  hi: "खींचने और दबाने वाले बलों के संतुलन से स्थिर रहने वाली संरचनाएँ।"
  th: "โครงสร้างที่มั่นคงด้วยสมดุลของแรงดึงและแรงอัด"
  cs: "Konstrukce stabilizované rovnováhou tahu a tlaku."
  sv: "Konstruktioner som stabiliseras av balansen mellan drag och tryck."
  he: "מבנים המתייצבים באמצעות איזון בין מתיחה ללחיצה."
  verified_by_human: []

tensegrity.phrase:
  context: "Static Daily Inspiration tensegrity phrase; public-safe fallback copy."
  en: "Some structures seem to float because tension does the hidden work."
  de: "Manche Bauwerke scheinen zu schweben. Zugkräfte leisten die verborgene Arbeit."
  zh: "有些结构看似悬浮，是拉力在暗中发挥作用。"
  es: "Algunas estructuras parecen flotar gracias al trabajo oculto de la tensión."
  fr: "Certaines structures semblent flotter grâce au rôle discret de la tension."
  pt: "Algumas estruturas parecem flutuar porque a tensão faz o trabalho invisível."
  ru: "Некоторые конструкции словно парят благодаря незаметной работе сил натяжения."
  ja: "浮いて見える構造の裏では張力が働いています。"
  ko: "일부 구조물이 떠 있는 듯 보이는 비결은 보이지 않는 인장력입니다."
  it: "Alcune strutture sembrano fluttuare grazie al lavoro nascosto della tensione."
  tr: "Bazı yapılar, gerilimin görünmeyen işi sayesinde havada asılı gibi görünür."
  vi: "Một số kết cấu trông như lơ lửng nhờ lực kéo âm thầm làm việc."
  id: "Beberapa struktur tampak melayang karena tarikan bekerja secara tersembunyi."
  pl: "Niektóre konstrukcje zdają się unosić dzięki niewidocznemu działaniu sił naciągu."
  nl: "Sommige constructies lijken te zweven doordat trekkrachten onzichtbaar hun werk doen."
  ar: "تبدو بعض الهياكل معلّقة لأن قوى الشد تعمل في الخفاء."
  hi: "कुछ संरचनाएँ तैरती हुई लगती हैं क्योंकि खिंचाव अदृश्य काम करता है।"
  th: "บางโครงสร้างดูเหมือนลอยได้เพราะแรงดึงทำงานอยู่เบื้องหลัง"
  cs: "Některé konstrukce jako by se vznášely díky skryté práci tahových sil."
  sv: "Vissa konstruktioner tycks sväva tack vare dragkrafternas dolda arbete."
  he: "מבנים מסוימים נראים מרחפים בזכות פעולת המתיחה הנסתרת."
  verified_by_human: []

