events.assistant_response:
  context: "Offline guest Daily Inspiration Events search card assistant_response; preserve factual meaning and product terms."
  en: "Use Events search to find local classes and meetups. Choose a place and topic to see what is happening nearby."
  de: "Nutze die Events-Suche, um Kurse und Treffen in deiner Nähe zu finden. Wähle einen Ort und ein Thema, um passende Veranstaltungen zu entdecken."
  zh: "使用活动搜索查找附近的课程和聚会。选择地点和主题，看看周边有哪些活动。"
  es: "Usa la búsqueda de Eventos para encontrar clases y encuentros locales. Elige un lugar y un tema para ver qué sucede cerca."
  fr: "Utilise la recherche d'événements pour trouver des cours et des rencontres près de chez toi. Choisis un lieu et un sujet pour voir ce qui se passe à proximité."
  pt: "Usa a pesquisa de Eventos para encontrar aulas e encontros locais. Escolhe um lugar e um tema para ver o que acontece por perto."
  ru: "Используй поиск событий, чтобы найти занятия и встречи поблизости. Выбери место и тему, чтобы узнать, что происходит рядом."
  ja: "イベント検索で近くの講座や交流会を探せます。場所とテーマを選んで、周辺の催しを見てみましょう。"
  ko: "이벤트 검색으로 가까운 수업과 모임을 찾아보세요. 장소와 주제를 선택해 주변에서 열리는 행사를 확인하세요."
  it: "Usa la ricerca Eventi per trovare corsi e incontri locali. Scegli un luogo e un argomento per vedere cosa succede nelle vicinanze."
  tr: "Yakınındaki dersleri ve buluşmaları bulmak için Etkinlik aramasını kullan. Çevrende neler olduğunu görmek için bir yer ve konu seç."
  vi: "Dùng tìm kiếm Sự kiện để tìm lớp học và buổi gặp gỡ gần bạn. Chọn địa điểm và chủ đề để xem những gì đang diễn ra xung quanh."
  id: "Gunakan pencarian Acara untuk menemukan kelas dan pertemuan setempat. Pilih lokasi dan topik untuk melihat kegiatan di sekitarmu."
  pl: "Użyj wyszukiwarki wydarzeń, aby znaleźć lokalne zajęcia i spotkania. Wybierz miejsce i temat, by zobaczyć, co dzieje się w pobliżu."
  nl: "Gebruik de zoekfunctie voor evenementen om lessen en bijeenkomsten in de buurt te vinden. Kies een plaats en onderwerp om te zien wat er te doen is."
  ar: "استخدم البحث عن الفعاليات للعثور على دروس ولقاءات محلية. اختر مكاناً وموضوعاً لترى ما يحدث بالقرب منك."
  hi: "आस-पास की कक्षाएँ और मिलन समारोह खोजने के लिए इवेंट खोज का उपयोग करें। नज़दीकी गतिविधियाँ देखने के लिए स्थान और विषय चुनें।"
  th: "ใช้การค้นหากิจกรรมเพื่อหาคลาสและการพบปะในพื้นที่ เลือกสถานที่และหัวข้อเพื่อดูว่ามีอะไรเกิดขึ้นใกล้คุณ"
  cs: "Použij vyhledávání akcí a najdi kurzy a setkání ve svém okolí. Vyber místo a téma a zjisti, co se děje poblíž."
  sv: "Använd evenemangssökning för att hitta kurser och träffar nära dig. Välj plats och ämne för att se vad som händer i närheten."
  he: "השתמשו בחיפוש אירועים כדי למצוא שיעורים ומפגשים מקומיים. בחרו מקום ונושא כדי לראות מה קורה בקרבתכם."
