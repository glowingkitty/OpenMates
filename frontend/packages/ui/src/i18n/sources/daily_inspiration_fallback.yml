focus.description:
  context: "Offline Daily Inspiration focus card description; preserve factual meaning and product terms."
  en: "Guide a chat toward a specific goal."
  de: "Lenke einen Chat auf ein bestimmtes Ziel."
  zh: "引导对话达成特定目标。"
  es: "Guía un chat hacia un objetivo específico."
  fr: "Oriente une discussion vers un objectif précis."
  pt: "Guia uma conversa em direção a um objetivo específico."
  ru: "Направляй чат к конкретной цели."
  ja: "チャットを特定の目標へと導きます。"
  ko: "채팅이 특정 목표를 향하도록 안내합니다."
  it: "Guida una chat verso un obiettivo specifico."
  tr: "Bir sohbeti belirli bir hedefe yönlendir."
  vi: "Hướng dẫn cuộc trò chuyện đi tới một mục tiêu cụ thể."
  id: "Arahkan chat menuju tujuan tertentu."
  pl: "Skieruj czat na konkretny cel."
  nl: "Stuur een chat in de richting van een specifiek doel."
  ar: "توجيه المحادثة نحو هدف محدد."
  hi: "चैट को किसी विशिष्ट लक्ष्य की ओर निर्देशित करें।"
  th: "นำทางแชทไปสู่เป้าหมายที่เฉพาะเจาะจง"
  cs: "Nasměruj chat ke konkrétnímu cíli."
  sv: "Styr en chatt mot ett specifikt mål."
  he: "כוון את הצ'אט לעבר יעד ספציפי."

focus.assistant_response:
  context: "Offline Daily Inspiration focus card assistant_response; preserve factual meaning and product terms."
  en: "Use a focus mode to guide a chat toward a specific goal. Explore available modes in Apps."
  de: "Nutze einen Fokus-Modus, um einen Chat auf ein bestimmtes Ziel zu lenken. Entdecke verfügbare Modi in den Apps."
  zh: "使用专注模式引导对话达成特定目标。在“应用”中探索可用模式。"
  es: "Usa un modo de enfoque para guiar un chat hacia un objetivo específico. Explora los modos disponibles en Apps."
  fr: "Utilise un mode focus pour orienter une discussion vers un objectif précis. Explore les modes disponibles dans les Apps."
  pt: "Usa um modo de foco para guiar uma conversa em direção a um objetivo específico. Explora os modos disponíveis em Aplicações."
  ru: "Используй режим фокуса, чтобы направить чат к конкретной цели. Ознакомься с доступными режимами в разделе «Приложения»."
  ja: "フォーカスモードを使用して、チャットを特定の目標へと導きます。「アプリ」で利用可能なモードを確認してみましょう。"
  ko: "집중 모드를 사용하여 채팅이 특정 목표를 향하도록 유도하세요. 앱에서 사용 가능한 모드를 확인해 보세요."
  it: "Usa una modalità focus per guidare una chat verso un obiettivo specifico. Esplora le modalità disponibili in App."
  tr: "Bir sohbeti belirli bir hedefe yönlendirmek için bir odak modu kullan. Uygulamalar'daki mevcut modları keşfet."
  vi: "Sử dụng chế độ tập trung để hướng dẫn cuộc trò chuyện đi tới một mục tiêu cụ thể. Khám phá các chế độ hiện có trong phần Ứng dụng."
  id: "Gunakan mode fokus untuk mengarahkan chat ke tujuan tertentu. Jelajahi mode yang tersedia di Aplikasi."
  pl: "Użyj trybu skupienia, aby skierować czat na konkretny cel. Sprawdź dostępne tryby w sekcji Aplikacje."
  nl: "Gebruik een focusmodus om een chat naar een specifiek doel te leiden. Ontdek de beschikbare modi in Apps."
  ar: "استخدم وضع التركيز لتوجيه المحادثة نحو هدف محدد. استكشف الأوضاع المتاحة في التطبيقات."
  hi: "चैट को किसी विशिष्ट लक्ष्य की ओर ले जाने के लिए फोकस मोड का उपयोग करें। ऐप्स में उपलब्ध मोड देखें।"
  th: "ใช้โหมดโฟกัสเพื่อนำทางแชทไปสู่เป้าหมายที่เฉพาะเจาะจง สำรวจโหมดต่างๆ ที่มีได้ในแอป"
  cs: "Použij režim zaměření a nasměruj chat ke konkrétnímu cíli. Dostupné režimy najdeš v Aplikacích."
  sv: "Använd ett fokusläge för att styra en chatt mot ett specifikt mål. Utforska tillgängliga lägen i Appar."
  he: "השתמש במצב מיקוד כדי לכוון את הצ'אט לעבר יעד ספציפי. גלה את המצבים הזמינים ב'אפליקציות'."

memories.phrase:
  context: "Offline Daily Inspiration memories card phrase; preserve factual meaning and product terms."
  en: "Repeating yourself gets old. Save context your mates should remember."
  de: "Sich ständig zu wiederholen, nervt. Speichere Kontext, den sich deine Mates merken sollen."
  zh: "重复同样的话很乏味。保存你希望 Mate 记住的背景信息。"
  es: "Repetirse cansa. Guarda el contexto que tus mates deberían recordar."
  fr: "Se répéter devient lassant. Enregistre le contexte dont tes mates doivent se souvenir."
  pt: "Repetires-te torna-se cansativo. Guarda o contexto de que os teus mates se devem lembrar."
  ru: "Надоело повторяться? Сохраняй контекст, который должны помнить твои помощники."
  ja: "同じ説明を繰り返す必要はありません。メイトに覚えておいてほしいコンテキストを保存しましょう。"
  ko: "같은 말을 반복하는 건 지루한 일이죠. 메이트가 기억해야 할 맥락을 저장하세요."
  it: "Ripetersi stanca. Salva il contesto che i tuoi mate dovrebbero ricordare."
  tr: "Kendini tekrarlamak sıkar. Mate'lerinin hatırlaması gereken bağlamları kaydet."
  vi: "Việc phải lặp lại chính mình thật nhàm chán. Hãy lưu lại ngữ cảnh mà các người bạn của bạn nên ghi nhớ."
  id: "Mengulang hal yang sama itu membosankan. Simpan konteks yang harus diingat oleh mate kamu."
  pl: "Powtarzanie się bywa męczące. Zapisuj kontekst, który Twoi asystenci powinni zapamiętać."
  nl: "Jezelf herhalen wordt vermoeiend. Sla context op die je mates moeten onthouden."
  ar: "تكرار الكلام أمر ممل. احفظ السياق الذي يجب على رفاقك تذكره."
  hi: "एक ही बात बार-बार दोहराना उबाऊ हो जाता है। वह संदर्भ सहेजें जो आपके मेट्स को याद रखना चाहिए।"
  th: "การพูดซ้ำๆ มันน่าเบื่อ บันทึกบริบทที่ต้องการให้คู่หูของคุณจดจำไว้สิ"
  cs: "Neustálé opakování unavuje. Ulož si kontext, který si mají tvoji parťáci pamatovat."
  sv: "Det blir tjatigt att upprepa sig. Spara sammanhang som dina mates bör komma ihåg."
  he: "לחזור על עצמך זה מעייף. שמור הקשר שה-mates שלך צריכים לזכור."

