model_selector.loading_wait:
  context: Error shown when sending is blocked briefly while the selected model is still loading
  en: Model selection is still loading. Send again in a moment.
  de: Die Modellauswahl wird noch geladen. Sende die Nachricht gleich erneut.
  zh: 模型选择仍在加载。请稍后重新发送。
  es: La selección de modelo aún se está cargando. Envía de nuevo en un momento.
  fr: Le modèle est encore en cours de chargement. Renvoyez dans un instant.
  pt: A seleção de modelo ainda está carregando. Envie novamente em instantes.
  ru: Выбор модели ещё загружается. Отправьте сообщение снова через мгновение.
  ja: モデル選択を読み込み中です。少し待ってからもう一度送信してください。
  ko: 모델 선택을 아직 불러오는 중입니다. 잠시 후 다시 보내세요.
  it: La selezione del modello è ancora in caricamento. Invia di nuovo tra poco.
  tr: Model seçimi hâlâ yükleniyor. Birazdan yeniden gönderin.
  vi: Lựa chọn mô hình vẫn đang tải. Hãy gửi lại sau giây lát.
  id: Pilihan model masih dimuat. Kirim lagi sebentar lagi.
  pl: Wybór modelu nadal się wczytuje. Wyślij ponownie za chwilę.
  nl: De modelselectie wordt nog geladen. Verstuur over een moment opnieuw.
  ar: لا يزال اختيار النموذج قيد التحميل. أرسل مرة أخرى بعد لحظات.
  hi: मॉडल चयन अभी लोड हो रहा है। कुछ देर में फिर भेजें।
  th: กำลังโหลดการเลือกโมเดล โปรดส่งอีกครั้งในอีกสักครู่
  cs: Výběr modelu se stále načítá. Za chvíli zprávu odešlete znovu.
  sv: Modellvalet läses fortfarande in. Skicka igen om en stund.
  he: בחירת המודל עדיין נטענת. יש לשלוח שוב בעוד רגע.
