model_selector.unavailable_reset:
  context: Error shown when a chat's saved exact AI model is unavailable and the composer resets to Auto
  en: The selected model is unavailable. This chat now uses Auto.
  de: Das ausgewählte Modell ist nicht verfügbar. Dieser Chat verwendet jetzt Auto.
  zh: 所选模型不可用。此聊天现在使用自动模式。
  es: El modelo seleccionado no está disponible. Este chat ahora usa Automático.
  fr: Le modèle sélectionné est indisponible. Cette discussion utilise maintenant Auto.
  pt: O modelo selecionado não está disponível. Este chat agora usa Automático.
  ru: Выбранная модель недоступна. Теперь в этом чате используется Авто.
  ja: 選択したモデルは利用できません。このチャットでは自動が使用されます。
  ko: 선택한 모델을 사용할 수 없습니다. 이제 이 채팅은 자동을 사용합니다.
  it: Il modello selezionato non è disponibile. Questa chat ora usa Auto.
  tr: Seçilen model kullanılamıyor. Bu sohbet artık Otomatik kullanıyor.
  vi: Mô hình đã chọn không khả dụng. Cuộc trò chuyện này hiện dùng Tự động.
  id: Model yang dipilih tidak tersedia. Chat ini sekarang menggunakan Otomatis.
  pl: Wybrany model jest niedostępny. Ten czat używa teraz trybu Auto.
  nl: Het geselecteerde model is niet beschikbaar. Deze chat gebruikt nu Automatisch.
  ar: النموذج المحدد غير متاح. تستخدم هذه المحادثة الآن الوضع التلقائي.
  hi: चुना गया मॉडल उपलब्ध नहीं है। यह चैट अब ऑटो का उपयोग करती है।
  th: โมเดลที่เลือกไม่พร้อมใช้งาน แชทนี้ใช้โหมดอัตโนมัติแล้ว
  cs: Vybraný model není k dispozici. Tento chat nyní používá automatický režim.
  sv: Den valda modellen är inte tillgänglig. Chatten använder nu Auto.
  he: המודל שנבחר אינו זמין. הצ'אט משתמש כעת במצב אוטומטי.
  verified_by_human: []
model_selector.load_failed:
  context: Error shown when a chat's saved model setting cannot be loaded and Auto is used instead
  en: Could not load this chat's model setting. Auto is being used.
  de: Die Modelleinstellung dieses Chats konnte nicht geladen werden. Auto wird verwendet.
  zh: 无法加载此聊天的模型设置。现已使用自动模式。
  es: No se pudo cargar la configuración de modelo de este chat. Se usará Automático.
  fr: Impossible de charger le modèle de cette discussion. Le mode Auto est utilisé.
  pt: Não foi possível carregar a configuração de modelo deste chat. O modo Automático será usado.
  ru: Не удалось загрузить настройку модели этого чата. Используется режим Авто.
  ja: このチャットのモデル設定を読み込めませんでした。自動を使用します。
  ko: 이 채팅의 모델 설정을 불러오지 못했습니다. 자동을 사용합니다.
  it: Impossibile caricare l'impostazione del modello di questa chat. Verrà usato Auto.
  tr: Bu sohbetin model ayarı yüklenemedi. Otomatik kullanılacak.
  vi: Không thể tải cài đặt mô hình của cuộc trò chuyện này. Chế độ Tự động sẽ được dùng.
  id: Pengaturan model chat ini tidak dapat dimuat. Mode Otomatis akan digunakan.
  pl: Nie udało się wczytać ustawienia modelu tego czatu. Używany jest tryb Auto.
  nl: De modelinstelling van deze chat kon niet worden geladen. Automatisch wordt gebruikt.
  ar: تعذر تحميل إعداد النموذج لهذه المحادثة. سيتم استخدام الوضع التلقائي.
  hi: इस चैट की मॉडल सेटिंग लोड नहीं हो सकी। ऑटो का उपयोग किया जा रहा है।
  th: โหลดการตั้งค่าโมเดลของแชทนี้ไม่ได้ ระบบจะใช้โหมดอัตโนมัติ
  cs: Nastavení modelu tohoto chatu se nepodařilo načíst. Použije se automatický režim.
  sv: Det gick inte att läsa in chattens modellinställning. Auto används.
  he: לא ניתן לטעון את הגדרת המודל של הצ'אט. נעשה שימוש במצב אוטומטי.
