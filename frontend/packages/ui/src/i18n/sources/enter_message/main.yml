file_import_failed:
  context: "Warning shown when an uploaded Word/Excel file could not be read"
  en: "{filename} couldn't be read, so it was not attached. The file may be empty, damaged or password-protected."
  de: "{filename} konnte nicht gelesen werden und wurde nicht angehängt. Die Datei ist möglicherweise leer, beschädigt oder passwortgeschützt."
  zh: "无法读取 {filename}，因此未添加附件。文件可能为空、已损坏或受密码保护。"
  es: "No se pudo leer {filename}, por lo que no se adjuntó. El archivo puede estar vacío, dañado o protegido con contraseña."
  fr: "{filename} n'a pas pu être lu et n'a donc pas été joint. Le fichier est peut-être vide, endommagé ou protégé par un mot de passe."
  pt: "Não foi possível ler {filename}, por isso ele não foi anexado. O arquivo pode estar vazio, danificado ou protegido por senha."
  ru: "Не удалось прочитать {filename}, поэтому файл не прикреплён. Возможно, он пуст, повреждён или защищён паролем."
  ja: "{filename} を読み取れなかったため、添付されませんでした。ファイルが空、破損、またはパスワードで保護されている可能性があります。"
  ko: "{filename}을(를) 읽을 수 없어 첨부되지 않았습니다. 파일이 비어 있거나 손상되었거나 암호로 보호되어 있을 수 있습니다."
  it: "Impossibile leggere {filename}, quindi non è stato allegato. Il file potrebbe essere vuoto, danneggiato o protetto da password."
  tr: "{filename} okunamadı, bu yüzden eklenmedi. Dosya boş, hasarlı veya parola korumalı olabilir."
  vi: "Không thể đọc {filename} nên tệp chưa được đính kèm. Tệp có thể trống, bị hỏng hoặc được bảo vệ bằng mật khẩu."
  id: "{filename} tidak dapat dibaca sehingga tidak dilampirkan. File mungkin kosong, rusak, atau dilindungi kata sandi."
  pl: "Nie udało się odczytać pliku {filename}, więc nie został dołączony. Plik może być pusty, uszkodzony lub chroniony hasłem."
  nl: "{filename} kon niet worden gelezen en is daarom niet toegevoegd. Het bestand is mogelijk leeg, beschadigd of met een wachtwoord beveiligd."
  ar: "تعذّرت قراءة {filename} لذا لم يتم إرفاقه. قد يكون الملف فارغًا أو تالفًا أو محميًا بكلمة مرور."
  hi: "{filename} को पढ़ा नहीं जा सका, इसलिए उसे संलग्न नहीं किया गया। फ़ाइल खाली, क्षतिग्रस्त या पासवर्ड से सुरक्षित हो सकती है।"
  th: "ไม่สามารถอ่าน {filename} จึงไม่ได้แนบไฟล์ ไฟล์อาจว่างเปล่า เสียหาย หรือมีการป้องกันด้วยรหัสผ่าน"
  cs: "Soubor {filename} se nepodařilo přečíst, a proto nebyl připojen. Soubor může být prázdný, poškozený nebo chráněný heslem."
  sv: "{filename} kunde inte läsas och bifogades därför inte. Filen kan vara tom, skadad eller lösenordsskyddad."
  he: "לא ניתן היה לקרוא את {filename}, ולכן הוא לא צורף. ייתכן שהקובץ ריק, פגום או מוגן בסיסמה."
