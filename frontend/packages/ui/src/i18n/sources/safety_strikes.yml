suspended_until:
  context: "Shown at strike 2 and at login while the account is suspended for 7 days ({date} is the day the account is active again)"
  en: "This is strike 2 of 3. Your account is suspended until {date} and active again after that. A third strike suspends it until an admin has reviewed it."
  de: "Das ist Verstoß 2 von 3. Dein Konto ist bis {date} gesperrt und danach wieder aktiv. Ein dritter Verstoß sperrt es, bis ein Admin es geprüft hat."
  zh: "这是第 2 次违规（共 3 次）。你的账户已被暂停至 {date}，之后将恢复正常。第三次违规会使账户被暂停，直到管理员审核完毕。"
  es: "Esta es la infracción 2 de 3. Tu cuenta está suspendida hasta el {date} y volverá a estar activa después. Una tercera infracción la suspende hasta que un administrador la haya revisado."
  fr: "Ceci est l'infraction 2 sur 3. Ton compte est suspendu jusqu'au {date} et sera de nouveau actif ensuite. Une troisième infraction le suspend jusqu'à ce qu'un administrateur l'ait examiné."
  pt: "Esta é a infração 2 de 3. A sua conta está suspensa até {date} e volta a estar ativa depois disso. Uma terceira infração suspende-a até que um administrador a tenha analisado."
  ru: "Это нарушение 2 из 3. Твой аккаунт заблокирован до {date}, после этого он снова станет активным. Третье нарушение заблокирует его до проверки администратором."
  ja: "これは3回中2回目の違反です。アカウントは {date} まで停止され、その後は再び利用できます。3回目の違反があると、管理者が確認するまでアカウントは停止されます。"
  ko: "3회 중 2번째 위반입니다. 계정이 {date}까지 정지되며 그 이후 다시 활성화됩니다. 세 번째 위반 시 관리자가 검토할 때까지 계정이 정지됩니다."
  it: "Questa è la violazione 2 di 3. Il tuo account è sospeso fino al {date} e tornerà attivo dopo quella data. Una terza violazione lo sospende finché un amministratore non lo avrà esaminato."
  tr: "Bu, 3 ihlalden 2.'sidir. Hesabın {date} tarihine kadar askıya alındı ve sonrasında yeniden etkin olacak. Üçüncü bir ihlal, hesabı bir yönetici inceleyene kadar askıya alır."
  vi: "Đây là vi phạm thứ 2 trên 3. Tài khoản của bạn bị tạm ngưng đến {date} và sẽ hoạt động lại sau đó. Vi phạm thứ ba sẽ tạm ngưng tài khoản cho đến khi quản trị viên xem xét."
  id: "Ini pelanggaran ke-2 dari 3. Akunmu ditangguhkan hingga {date} dan akan aktif kembali setelahnya. Pelanggaran ketiga akan menangguhkannya hingga admin meninjaunya."
  pl: "To naruszenie 2 z 3. Twoje konto jest zawieszone do {date}, a potem znów będzie aktywne. Trzecie naruszenie zawiesi je do czasu sprawdzenia przez administratora."
  nl: "Dit is overtreding 2 van 3. Je account is geschorst tot {date} en daarna weer actief. Een derde overtreding schorst het totdat een beheerder het heeft beoordeeld."
  ar: "هذه المخالفة 2 من 3. تم تعليق حسابك حتى {date} وسيعود نشطًا بعد ذلك. المخالفة الثالثة تعلّقه حتى يراجعه أحد المسؤولين."
  hi: "यह 3 में से दूसरा उल्लंघन है। आपका खाता {date} तक निलंबित है और उसके बाद फिर से सक्रिय हो जाएगा। तीसरा उल्लंघन इसे तब तक निलंबित रखेगा जब तक कोई एडमिन इसकी समीक्षा न कर ले।"
  th: "นี่คือการละเมิดครั้งที่ 2 จาก 3 ครั้ง บัญชีของคุณถูกระงับจนถึง {date} และจะกลับมาใช้งานได้หลังจากนั้น การละเมิดครั้งที่สามจะระงับบัญชีจนกว่าผู้ดูแลระบบจะตรวจสอบ"
  cs: "Toto je porušení 2 ze 3. Tvůj účet je pozastaven do {date} a poté bude znovu aktivní. Třetí porušení ho pozastaví, dokud ho nezkontroluje administrátor."
  sv: "Det här är överträdelse 2 av 3. Ditt konto är avstängt till {date} och aktivt igen efter det. En tredje överträdelse stänger av det tills en administratör har granskat det."
  he: "זו הפרה 2 מתוך 3. החשבון שלך מושעה עד {date} ויחזור להיות פעיל לאחר מכן. הפרה שלישית תשעה אותו עד שמנהל יבדוק אותו."
  verified_by_human: []

suspended_pending_review:
  context: "Shown at strike 3 and at login while the account waits for an admin review; the user can appeal"
  en: "This is strike 3 of 3. Your account is suspended until an admin has reviewed it. You can appeal this decision."
  de: "Das ist Verstoß 3 von 3. Dein Konto ist gesperrt, bis ein Admin es geprüft hat. Du kannst gegen diese Entscheidung Einspruch einlegen."
  zh: "这是第 3 次违规（共 3 次）。你的账户已被暂停，直到管理员审核完毕。你可以对此决定提出申诉。"
  es: "Esta es la infracción 3 de 3. Tu cuenta está suspendida hasta que un administrador la haya revisado. Puedes apelar esta decisión."
  fr: "Ceci est l'infraction 3 sur 3. Ton compte est suspendu jusqu'à ce qu'un administrateur l'ait examiné. Tu peux faire appel de cette décision."
  pt: "Esta é a infração 3 de 3. A sua conta está suspensa até que um administrador a tenha analisado. Pode recorrer desta decisão."
  ru: "Это нарушение 3 из 3. Твой аккаунт заблокирован до проверки администратором. Ты можешь обжаловать это решение."
  ja: "これは3回中3回目の違反です。管理者が確認するまでアカウントは停止されます。この判断に異議を申し立てることができます。"
  ko: "3회 중 3번째 위반입니다. 관리자가 검토할 때까지 계정이 정지됩니다. 이 결정에 이의를 제기할 수 있습니다."
  it: "Questa è la violazione 3 di 3. Il tuo account è sospeso finché un amministratore non lo avrà esaminato. Puoi fare ricorso contro questa decisione."
  tr: "Bu, 3 ihlalden 3.'südür. Hesabın bir yönetici inceleyene kadar askıya alındı. Bu karara itiraz edebilirsin."
  vi: "Đây là vi phạm thứ 3 trên 3. Tài khoản của bạn bị tạm ngưng cho đến khi quản trị viên xem xét. Bạn có thể khiếu nại quyết định này."
  id: "Ini pelanggaran ke-3 dari 3. Akunmu ditangguhkan hingga admin meninjaunya. Kamu dapat mengajukan banding atas keputusan ini."
  pl: "To naruszenie 3 z 3. Twoje konto jest zawieszone do czasu sprawdzenia przez administratora. Możesz odwołać się od tej decyzji."
  nl: "Dit is overtreding 3 van 3. Je account is geschorst totdat een beheerder het heeft beoordeeld. Je kunt tegen dit besluit in beroep gaan."
  ar: "هذه المخالفة 3 من 3. تم تعليق حسابك حتى يراجعه أحد المسؤولين. يمكنك الطعن في هذا القرار."
  hi: "यह 3 में से तीसरा उल्लंघन है। आपका खाता तब तक निलंबित है जब तक कोई एडमिन इसकी समीक्षा न कर ले। आप इस निर्णय के खिलाफ अपील कर सकते हैं।"
  th: "นี่คือการละเมิดครั้งที่ 3 จาก 3 ครั้ง บัญชีของคุณถูกระงับจนกว่าผู้ดูแลระบบจะตรวจสอบ คุณสามารถอุทธรณ์คำตัดสินนี้ได้"
  cs: "Toto je porušení 3 ze 3. Tvůj účet je pozastaven, dokud ho nezkontroluje administrátor. Proti tomuto rozhodnutí se můžeš odvolat."
  sv: "Det här är överträdelse 3 av 3. Ditt konto är avstängt tills en administratör har granskat det. Du kan överklaga beslutet."
  he: "זו הפרה 3 מתוך 3. החשבון שלך מושעה עד שמנהל יבדוק אותו. אפשר לערער על ההחלטה הזו."
  verified_by_human: []

unavailable:
  context: "Shown when the safety check itself failed; the request is refused without any strike"
  en: "The safety check is temporarily unavailable, so this request could not be processed. Please try again in a moment."
  de: "Die Sicherheitsprüfung ist vorübergehend nicht verfügbar, deshalb konnte die Anfrage nicht verarbeitet werden. Bitte versuche es gleich noch einmal."
  zh: "安全检查暂时不可用，因此无法处理此请求。请稍后再试。"
  es: "La comprobación de seguridad no está disponible temporalmente, así que no se pudo procesar la solicitud. Inténtalo de nuevo en un momento."
  fr: "La vérification de sécurité est temporairement indisponible, la demande n'a donc pas pu être traitée. Réessaie dans un instant."
  pt: "A verificação de segurança está temporariamente indisponível, por isso o pedido não pôde ser processado. Tenta novamente daqui a pouco."
  ru: "Проверка безопасности временно недоступна, поэтому запрос не удалось обработать. Попробуй ещё раз чуть позже."
  ja: "安全チェックが一時的に利用できないため、このリクエストを処理できませんでした。しばらくしてからもう一度お試しください。"
  ko: "안전 검사를 일시적으로 사용할 수 없어 이 요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요."
  it: "Il controllo di sicurezza è temporaneamente non disponibile, quindi la richiesta non ha potuto essere elaborata. Riprova tra un momento."
  tr: "Güvenlik kontrolü geçici olarak kullanılamıyor, bu yüzden istek işlenemedi. Lütfen birazdan tekrar deneyin."
  vi: "Kiểm tra an toàn tạm thời không khả dụng nên yêu cầu này chưa thể được xử lý. Vui lòng thử lại sau một lát."
  id: "Pemeriksaan keamanan sedang tidak tersedia sementara, sehingga permintaan ini tidak dapat diproses. Silakan coba lagi sebentar lagi."
  pl: "Kontrola bezpieczeństwa jest chwilowo niedostępna, więc nie udało się przetworzyć tej prośby. Spróbuj ponownie za chwilę."
  nl: "De veiligheidscontrole is tijdelijk niet beschikbaar, dus het verzoek kon niet worden verwerkt. Probeer het zo meteen opnieuw."
  ar: "فحص الأمان غير متاح مؤقتًا، لذا تعذرت معالجة هذا الطلب. حاول مرة أخرى بعد قليل."
  hi: "सुरक्षा जाँच अस्थायी रूप से उपलब्ध नहीं है, इसलिए यह अनुरोध प्रोसेस नहीं हो सका। कृपया थोड़ी देर बाद फिर कोशिश करें।"
  th: "การตรวจสอบความปลอดภัยไม่พร้อมใช้งานชั่วคราว จึงประมวลผลคำขอนี้ไม่ได้ โปรดลองใหม่อีกครั้งในอีกสักครู่"
  cs: "Bezpečnostní kontrola je dočasně nedostupná, proto nešlo požadavek zpracovat. Zkus to prosím za chvíli znovu."
  sv: "Säkerhetskontrollen är tillfälligt otillgänglig, så begäran kunde inte behandlas. Försök igen om en stund."
  he: "בדיקת הבטיחות אינה זמינה זמנית, ולכן לא ניתן היה לעבד את הבקשה. נסה שוב בעוד רגע."
  verified_by_human: []
