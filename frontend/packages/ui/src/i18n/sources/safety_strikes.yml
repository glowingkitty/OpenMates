# frontend/packages/ui/src/i18n/sources/safety_strikes.yml
# Safety strike wording: warning on strike 1 and 2 and the notice when the third strike deletes the account.
# Filled in by backend/shared/python_utils/image_safety/strike_policy.py ({what}, {reason}, {strike}, {max}).

warning:
  context: "Template for strike 1 and 2: what was rejected, why, the strike number and the consequence ({what}, {reason}, {strike}, {max})"
  en: "{what} was rejected. {reason} This is strike {strike} of {max}. A third strike deletes your account."
  de: "{what} wurde abgelehnt. {reason} Das ist Verstoß {strike} von {max}. Beim dritten Verstoß wird dein Konto gelöscht."
  zh: "{what}被拒绝。{reason}这是第 {strike} 次警告（共 {max} 次）。第三次警告将删除你的账户。"
  es: "{what} fue rechazada. {reason} Esta es la falta {strike} de {max}. A la tercera falta se elimina tu cuenta."
  fr: "{what} a été refusée. {reason} C'est l'avertissement {strike} sur {max}. Au troisième, ton compte est supprimé."
  pt: "{what} foi recusada. {reason} Esta é a infração {strike} de {max}. Na terceira infração, a tua conta é eliminada."
  ru: "{what}: отклонено. {reason} Это нарушение {strike} из {max}. После третьего нарушения аккаунт будет удалён."
  ja: "{what}は拒否されました。{reason}これは {max} 回中 {strike} 回目の警告です。3 回目でアカウントが削除されます。"
  ko: "{what}이(가) 거부되었습니다. {reason} 이것은 {max}회 중 {strike}번째 경고입니다. 세 번째 경고 시 계정이 삭제됩니다."
  it: "{what} è stata rifiutata. {reason} Questa è la violazione {strike} di {max}. Alla terza violazione il tuo account viene eliminato."
  tr: "{what} reddedildi. {reason} Bu, {max} ihlalin {strike}. ihlali. Üçüncü ihlalde hesabınız silinir."
  vi: "{what} đã bị từ chối. {reason} Đây là lần vi phạm thứ {strike} trên {max}. Vi phạm lần thứ ba sẽ xóa tài khoản của bạn."
  id: "{what} ditolak. {reason} Ini pelanggaran ke-{strike} dari {max}. Pelanggaran ketiga akan menghapus akun Anda."
  pl: "{what} została odrzucona. {reason} To naruszenie {strike} z {max}. Trzecie naruszenie usuwa Twoje konto."
  nl: "{what} is geweigerd. {reason} Dit is waarschuwing {strike} van {max}. Bij de derde waarschuwing wordt je account verwijderd."
  ar: "تم رفض {what}. {reason} هذه المخالفة {strike} من {max}. المخالفة الثالثة تؤدي إلى حذف حسابك."
  hi: "{what} अस्वीकार कर दिया गया। {reason} यह {max} में से {strike} चेतावनी है। तीसरी चेतावनी पर आपका खाता हटा दिया जाएगा।"
  th: "{what} ถูกปฏิเสธ {reason} นี่คือการละเมิดครั้งที่ {strike} จาก {max} การละเมิดครั้งที่สามจะลบบัญชีของคุณ"
  cs: "{what} bylo zamítnuto. {reason} Toto je porušení {strike} z {max}. Při třetím porušení bude tvůj účet smazán."
  sv: "{what} avvisades. {reason} Det här är överträdelse {strike} av {max}. Vid den tredje överträdelsen raderas ditt konto."
  he: "{what} נדחתה. {reason} זו עבירה {strike} מתוך {max}. בעבירה השלישית החשבון שלך יימחק."
  verified_by_human: []

