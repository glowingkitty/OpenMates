# Filled in by backend/shared/python_utils/image_safety/strike_policy.py ({what}, {reason}, {strike}, {max}).

warning:
  context: "Template for strike 1: what was rejected, why and the strike number ({what}, {reason}, {strike}, {max})"
  en: "{what} was rejected. {reason} This is strike {strike} of {max}."
  de: "{what} wurde abgelehnt. {reason} Das ist Verstoß {strike} von {max}."
  zh: "{what}被拒绝。{reason}这是第 {strike} 次警告（共 {max} 次）。"
  es: "{what} fue rechazada. {reason} Esta es la falta {strike} de {max}."
  fr: "{what} a été refusée. {reason} C'est l'avertissement {strike} sur {max}."
  pt: "{what} foi recusada. {reason} Esta é a infração {strike} de {max}."
  ru: "{what}: отклонено. {reason} Это нарушение {strike} из {max}."
  ja: "{what}は拒否されました。{reason}これは {max} 回中 {strike} 回目の警告です。"
  ko: "{what}이(가) 거부되었습니다. {reason} 이것은 {max}회 중 {strike}번째 경고입니다."
  it: "{what} è stata rifiutata. {reason} Questa è la violazione {strike} di {max}."
  tr: "{what} reddedildi. {reason} Bu, {max} ihlalin {strike}."
  vi: "{what} đã bị từ chối. {reason} Đây là lần vi phạm thứ {strike} trên {max}."
  id: "{what} ditolak. {reason} Ini pelanggaran ke-{strike} dari {max}."
  pl: "{what} została odrzucona. {reason} To naruszenie {strike} z {max}."
  nl: "{what} is geweigerd. {reason} Dit is waarschuwing {strike} van {max}."
  ar: "تم رفض {what}. {reason} هذه المخالفة {strike} من {max}."
  hi: "{what} अस्वीकार कर दिया गया। {reason} यह {max} में से {strike} चेतावनी है।"
  th: "{what} ถูกปฏิเสธ {reason} นี่คือการละเมิดครั้งที่ {strike} จาก {max}"
  cs: "{what} bylo zamítnuto. {reason} Toto je porušení {strike} z {max}."
  sv: "{what} avvisades. {reason} Det här är överträdelse {strike} av {max}."
  he: "{what} נדחתה. {reason} זו עבירה {strike} מתוך {max}."
  verified_by_human: []

