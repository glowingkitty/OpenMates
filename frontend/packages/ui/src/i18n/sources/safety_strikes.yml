deleted:
  context: "Shown when the third strike deleted the account; eligible purchases are refunded"
  en: "Your account was deleted after a third content-rule violation. Eligible purchases are refunded automatically."
  de: "Dein Konto wurde nach dem dritten Verstoß gegen die Inhaltsregeln gelöscht. Berechtigte Käufe werden automatisch erstattet."
  zh: "你的账户因第三次违反内容规则而被删除。符合条件的购买将自动退款。"
  es: "Tu cuenta se eliminó tras la tercera infracción de las reglas de contenido. Las compras elegibles se reembolsan automáticamente."
  fr: "Ton compte a été supprimé après la troisième violation des règles de contenu. Les achats éligibles sont remboursés automatiquement."
  pt: "A tua conta foi eliminada após a terceira violação das regras de conteúdo. As compras elegíveis são reembolsadas automaticamente."
  ru: "Твой аккаунт удалён после третьего нарушения правил о контенте. Подходящие покупки возвращаются автоматически."
  ja: "コンテンツルールの 3 回目の違反によりアカウントが削除されました。対象の購入は自動的に返金されます。"
  ko: "콘텐츠 규칙을 세 번째로 위반하여 계정이 삭제되었습니다. 해당되는 구매는 자동으로 환불됩니다."
  it: "Il tuo account è stato eliminato dopo la terza violazione delle regole sui contenuti. Gli acquisti idonei vengono rimborsati automaticamente."
  tr: "Hesabınız, içerik kurallarının üçüncü ihlali nedeniyle silindi. Uygun satın alımlar otomatik olarak iade edilir."
  vi: "Tài khoản của bạn đã bị xóa sau lần vi phạm quy tắc nội dung thứ ba. Các giao dịch mua đủ điều kiện sẽ được hoàn tiền tự động."
  id: "Akun Anda dihapus setelah pelanggaran aturan konten yang ketiga. Pembelian yang memenuhi syarat dikembalikan otomatis."
  pl: "Twoje konto zostało usunięte po trzecim naruszeniu zasad dotyczących treści. Kwalifikujące się zakupy są zwracane automatycznie."
  nl: "Je account is verwijderd na de derde overtreding van de inhoudsregels. In aanmerking komende aankopen worden automatisch terugbetaald."
  ar: "تم حذف حسابك بعد المخالفة الثالثة لقواعد المحتوى. تُسترد المشتريات المؤهلة تلقائيًا."
  hi: "तीसरी बार सामग्री नियम तोड़ने पर आपका खाता हटा दिया गया। पात्र खरीदारियों का पैसा अपने-आप वापस किया जाता है।"
  th: "บัญชีของคุณถูกลบหลังจากละเมิดกฎเนื้อหาครั้งที่สาม การซื้อที่เข้าเงื่อนไขจะได้รับเงินคืนโดยอัตโนมัติ"
  cs: "Tvůj účet byl smazán po třetím porušení pravidel pro obsah. Způsobilé nákupy se vracejí automaticky."
  sv: "Ditt konto raderades efter den tredje överträdelsen av innehållsreglerna. Berättigade köp återbetalas automatiskt."
  he: "החשבון שלך נמחק לאחר העבירה השלישית על כללי התוכן. רכישות זכאיות מוחזרות אוטומטית."
  verified_by_human: []

unavailable:
  context: "Shown when the safety check itself failed; the request is refused without any strike"
  en: "The safety check is temporarily unavailable, so this request could not be processed. Please try again in a moment."
  de: "Die Sicherheitsprüfung ist vorübergehend nicht verfügbar, deshalb konnte die Anfrage nicht verarbeitet werden. Bitte versuche es gleich noch einmal."
  zh: "安全检查暂时不可用，因此无法处理此请求。请稍后再试。"
  es: "La comprobación de seguridad no está disponible temporalmente, así que no se pudo procesar la solicitud. Inténtalo de nuevo en un momento."
  fr: "La vérification de sécurité est temporairement indisponible, la demande n'a donc pas pu être traitée. Réessaie dans un instant."
  pt: "A verificação de segurança está temporariamente indisponível, por isso o pedido não pôde ser processado. Tenta novamente daqui a pouco."
  ru: "Проверка безопасности временно недоступна, поэтому запрос не удалось обработать. Попробуй ещё раз чуть позже."
  ja: "安全チェックが一時的に利用できないため、このリクエストを処理できませんでした。しばらくしてからもう一度お試しください。"
  ko: "안전 검사를 일시적으로 사용할 수 없어 이 요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요."
  it: "Il controllo di sicurezza è temporaneamente non disponibile, quindi la richiesta non ha potuto essere elaborata. Riprova tra un momento."
  tr: "Güvenlik kontrolü geçici olarak kullanılamıyor, bu yüzden istek işlenemedi. Lütfen birazdan tekrar deneyin."
  vi: "Kiểm tra an toàn tạm thời không khả dụng nên yêu cầu này chưa thể được xử lý. Vui lòng thử lại sau một lát."
  id: "Pemeriksaan keamanan sedang tidak tersedia sementara, sehingga permintaan ini tidak dapat diproses. Silakan coba lagi sebentar lagi."
  pl: "Kontrola bezpieczeństwa jest chwilowo niedostępna, więc nie udało się przetworzyć tej prośby. Spróbuj ponownie za chwilę."
  nl: "De veiligheidscontrole is tijdelijk niet beschikbaar, dus het verzoek kon niet worden verwerkt. Probeer het zo meteen opnieuw."
  ar: "فحص الأمان غير متاح مؤقتًا، لذا تعذرت معالجة هذا الطلب. حاول مرة أخرى بعد قليل."
  hi: "सुरक्षा जाँच अस्थायी रूप से उपलब्ध नहीं है, इसलिए यह अनुरोध प्रोसेस नहीं हो सका। कृपया थोड़ी देर बाद फिर कोशिश करें।"
  th: "การตรวจสอบความปลอดภัยไม่พร้อมใช้งานชั่วคราว จึงประมวลผลคำขอนี้ไม่ได้ โปรดลองใหม่อีกครั้งในอีกสักครู่"
  cs: "Bezpečnostní kontrola je dočasně nedostupná, proto nešlo požadavek zpracovat. Zkus to prosím za chvíli znovu."
  sv: "Säkerhetskontrollen är tillfälligt otillgänglig, så begäran kunde inte behandlas. Försök igen om en stund."
  he: "בדיקת הבטיחות אינה זמינה זמנית, ולכן לא ניתן היה לעבד את הבקשה. נסה שוב בעוד רגע."
  verified_by_human: []
