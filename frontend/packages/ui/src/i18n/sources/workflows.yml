version_history.restore_explanation:
  context: Confirmation explanation that a Workflow restore adds a new immutable version
  en: This creates a new current version. The selected and existing versions remain unchanged.
  de: Dies erstellt eine neue aktuelle Version. Die ausgewählte und die bestehenden Versionen bleiben unverändert.
  zh: 这将创建一个新的当前版本。所选版本和现有版本将保持不变。
  es: Esto crea una nueva versión actual. La versión seleccionada y las existentes no cambiarán.
  fr: Cela crée une nouvelle version actuelle. Les versions sélectionnées et existantes restent inchangées.
  pt: Isto cria uma nova versão atual. As versões selecionada e existente permanecem inalteradas.
  ru: Будет создана новая текущая версия. Выбранная и существующие версии останутся без изменений.
  ja: これにより、新しい現在のバージョンが作成されます。選択されたバージョンおよび既存のバージョンは変更されません。
  ko: 이렇게 하면 새 현재 버전이 생성됩니다. 선택한 버전과 기존 버전은 변경되지 않은 상태로 유지됩니다.
  it: Verrà creata una nuova versione corrente. La versione selezionata e quelle esistenti rimarranno invariate.
  tr: Bu işlem yeni bir güncel sürüm oluşturur. Seçilen ve mevcut sürümler değişmeden kalır.
  vi: Thao tác này sẽ tạo một phiên bản hiện tại mới. Các phiên bản đã chọn và hiện có sẽ không thay đổi.
  id: Ini akan membuat versi saat ini yang baru. Versi yang dipilih dan versi yang sudah ada tetap tidak berubah.
  pl: To spowoduje utworzenie nowej aktualnej wersji. Wybrana i istniejące wersje pozostaną bez zmian.
  nl: Hiermee wordt een nieuwe huidige versie gemaakt. De geselecteerde en bestaande versies blijven ongewijzigd.
  ar: سيؤدي هذا إلى إنشاء إصدار حالي جديد. ستبقى الإصدارات المحددة والحالية دون تغيير.
  hi: यह एक नया वर्तमान वर्शन बनाता है। चुने गए और मौजूदा वर्शन अपरिवर्तित रहते हैं।
  th: การดำเนินการนี้จะสร้างเวอร์ชันปัจจุบันใหม่ โดยเวอร์ชันที่เลือกและเวอร์ชันที่มีอยู่จะไม่มีการเปลี่ยนแปลง
  cs: Tímto se vytvoří nová aktuální verze. Vybraná i stávající verze zůstanou nezměněny.
  sv: Detta skapar en ny aktuell version. Den valda och befintliga versioner förblir oförändrade.
  he: פעולה זו יוצרת גרסה נוכחית חדשה. הגרסה שנבחרה והגרסאות הקיימות יישארו ללא שינוי.
  verified_by_human: []

