sent:
  context: "Confirmation after sending an appeal; the decision comes within 7 days"
  en: "Your appeal was sent. You will get a decision within 7 days."
  de: "Dein Einspruch wurde gesendet. Du erhältst innerhalb von 7 Tagen eine Entscheidung."
  zh: "你的申诉已发送。我们将在 7 天内给出决定。"
