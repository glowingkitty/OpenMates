admin_delete_confirm:
  context: "Confirmation before an admin deletes a suspended account"
  en: "Delete this account? Standard deletion with full refund, deletion email and compliance record."
  de: "Dieses Konto löschen? Reguläre Löschung mit voller Erstattung, Lösch-E-Mail und Compliance-Eintrag."
  zh: "删除此账户?标准删除流程,全额退款,发送删除邮件并留存合规记录。"
  es: "¿Eliminar esta cuenta? Eliminación estándar con reembolso completo, correo de eliminación y registro de cumplimiento."
  fr: "Supprimer ce compte ? Suppression standard avec remboursement intégral, e-mail de suppression et enregistrement de conformité."
  pt: "Eliminar esta conta? Eliminação padrão com reembolso total, e-mail de eliminação e registo de conformidade."
  ru: "Удалить этот аккаунт? Стандартное удаление с полным возвратом средств, письмом об удалении и записью для соответствия требованиям."
  ja: "このアカウントを削除しますか?通常の削除手続きで、全額返金、削除メール、コンプライアンス記録が行われます。"
  ko: "이 계정을 삭제할까요? 전액 환불, 삭제 이메일, 규정 준수 기록이 포함된 표준 삭제입니다."
  it: "Eliminare questo account? Eliminazione standard con rimborso completo, e-mail di eliminazione e registro di conformità."
  tr: "Bu hesap silinsin mi? Tam iade, silme e-postası ve uyumluluk kaydı ile standart silme."
  vi: "Xóa tài khoản này? Xóa theo quy trình chuẩn, hoàn tiền đầy đủ, gửi email xóa và lưu hồ sơ tuân thủ."
  id: "Hapus akun ini? Penghapusan standar dengan pengembalian dana penuh, email penghapusan, dan catatan kepatuhan."
  pl: "Usunąć to konto? Standardowe usunięcie z pełnym zwrotem, e-mailem o usunięciu i zapisem zgodności."
  nl: "Dit account verwijderen? Standaard verwijdering met volledige terugbetaling, verwijderingsmail en nalevingsregistratie."
  ar: "هل تريد حذف هذا الحساب؟ حذف قياسي مع استرداد كامل ورسالة حذف وسجل امتثال."
  hi: "क्या यह खाता हटाना है? पूर्ण रिफंड, हटाने के ईमेल और अनुपालन रिकॉर्ड के साथ मानक हटाना।"
  th: "ลบบัญชีนี้หรือไม่ เป็นการลบตามมาตรฐาน พร้อมคืนเงินเต็มจำนวน อีเมลแจ้งการลบ และบันทึกการปฏิบัติตามข้อกำหนด"
  cs: "Smazat tento účet? Standardní smazání s plným vrácením peněz, e-mailem o smazání a záznamem o shodě."
  sv: "Ta bort det här kontot? Standardborttagning med full återbetalning, borttagningsmejl och efterlevnadspost."
  he: "למחוק את החשבון? מחיקה רגילה עם החזר מלא, מייל מחיקה ותיעוד לצורכי ציות."
  verified_by_human: []

