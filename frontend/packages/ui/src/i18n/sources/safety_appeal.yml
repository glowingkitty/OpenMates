  tr: "İtirazın gönderildi. 7 gün içinde bir karar alacaksın."
  vi: "Khiếu nại của bạn đã được gửi. Bạn sẽ nhận được quyết định trong vòng 7 ngày."
  id: "Bandingmu sudah dikirim. Kamu akan mendapat keputusan dalam 7 hari."
  pl: "Twoje odwołanie zostało wysłane. Decyzję otrzymasz w ciągu 7 dni."
  nl: "Je bezwaar is verzonden. Je krijgt binnen 7 dagen een beslissing."
