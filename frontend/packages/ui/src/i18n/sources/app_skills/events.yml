search.pricing_note:
  context: "Pricing note on the Events search skill settings page: typical cost per search (web search request plus Mercury 3 tokens), official schedule searches cost 1 credit, failed or empty searches are free"
  en: "A typical event search costs about 15–25 credits: 10 credits for the web search plus the tokens Mercury 3 uses to read up to five public pages. A search answered only by an official conference schedule costs 1 credit. Searches that fail or find nothing are free."
  de: "Eine typische Event-Suche kostet etwa 15–25 Credits: 10 Credits für die Websuche plus die Tokens, die Mercury 3 zum Lesen von bis zu fünf öffentlichen Seiten braucht. Eine Suche, die nur ein offizieller Konferenzplan beantwortet, kostet 1 Credit. Suchen, die fehlschlagen oder nichts finden, sind kostenlos."
  zh: "一次典型的活动搜索约需 15–25 积分:网页搜索 10 积分,加上 Mercury 3 阅读最多五个公开网页所用的 token。仅由官方会议日程回答的搜索需 1 积分。失败或没有结果的搜索免费。"
  es: "Una búsqueda de eventos típica cuesta unos 15–25 créditos: 10 créditos por la búsqueda web más los tokens que Mercury 3 usa para leer hasta cinco páginas públicas. Una búsqueda respondida solo por un programa oficial de conferencia cuesta 1 crédito. Las búsquedas que fallan o no encuentran nada son gratuitas."
  fr: "Une recherche d'événements typique coûte environ 15–25 crédits : 10 crédits pour la recherche web plus les tokens que Mercury 3 utilise pour lire jusqu'à cinq pages publiques. Une recherche à laquelle seul un programme officiel de conférence répond coûte 1 crédit. Les recherches qui échouent ou ne trouvent rien sont gratuites."
  pt: "Uma pesquisa de eventos típica custa cerca de 15–25 créditos: 10 créditos pela pesquisa na web mais os tokens que o Mercury 3 usa para ler até cinco páginas públicas. Uma pesquisa respondida apenas por uma programação oficial de conferência custa 1 crédito. Pesquisas que falham ou não encontram nada são gratuitas."
  ru: "Типичный поиск событий стоит около 15–25 кредитов: 10 кредитов за веб-поиск плюс токены, которые Mercury 3 тратит на чтение до пяти общедоступных страниц. Поиск, на который ответило только официальное расписание конференции, стоит 1 кредит. Неудачные поиски и поиски без результатов бесплатны."
  ja: "一般的なイベント検索は約 15〜25 クレジットです:Web 検索に 10 クレジット、さらに Mercury 3 が最大 5 つの公開ページを読むのに使うトークン分。公式のカンファレンス日程だけで回答できる検索は 1 クレジットです。失敗した検索や結果のない検索は無料です。"
  ko: "일반적인 이벤트 검색은 약 15–25 크레딧입니다: 웹 검색 10 크레딧과 Mercury 3가 공개 페이지를 최대 5개 읽는 데 쓰는 토큰. 공식 컨퍼런스 일정만으로 답한 검색은 1 크레딧입니다. 실패했거나 결과가 없는 검색은 무료입니다."
  it: "Una ricerca di eventi tipica costa circa 15–25 crediti: 10 crediti per la ricerca web più i token che Mercury 3 usa per leggere fino a cinque pagine pubbliche. Una ricerca a cui risponde solo un programma ufficiale di conferenza costa 1 credito. Le ricerche che non riescono o non trovano nulla sono gratuite."
  tr: "Tipik bir etkinlik araması yaklaşık 15–25 kredi tutar: web araması için 10 kredi artı Mercury 3'ün en fazla beş herkese açık sayfayı okumak için kullandığı tokenler. Yalnızca resmi bir konferans programının yanıtladığı arama 1 kredi tutar. Başarısız olan veya hiçbir şey bulamayan aramalar ücretsizdir."
  vi: "Một lần tìm sự kiện thông thường tốn khoảng 15–25 credit: 10 credit cho tìm kiếm web cộng với token mà Mercury 3 dùng để đọc tối đa năm trang công khai. Lần tìm chỉ được trả lời bằng lịch hội nghị chính thức tốn 1 credit. Lần tìm thất bại hoặc không có kết quả thì miễn phí."
  id: "Pencarian acara biasa memakan sekitar 15–25 kredit: 10 kredit untuk pencarian web ditambah token yang dipakai Mercury 3 untuk membaca hingga lima halaman publik. Pencarian yang hanya dijawab oleh jadwal konferensi resmi memakan 1 kredit. Pencarian yang gagal atau tidak menemukan apa pun gratis."
  pl: "Typowe wyszukiwanie wydarzeń kosztuje około 15–25 kredytów: 10 kredytów za wyszukiwanie w sieci plus tokeny, których Mercury 3 używa do przeczytania maksymalnie pięciu publicznych stron. Wyszukiwanie, na które odpowiada tylko oficjalny harmonogram konferencji, kosztuje 1 kredyt. Wyszukiwania nieudane lub bez wyników są bezpłatne."
  nl: "Een gewone zoekopdracht naar evenementen kost ongeveer 15–25 credits: 10 credits voor de webzoekopdracht plus de tokens die Mercury 3 gebruikt om maximaal vijf openbare pagina's te lezen. Een zoekopdracht die alleen een officieel conferentieprogramma beantwoordt, kost 1 credit. Zoekopdrachten die mislukken of niets vinden, zijn gratis."
  ar: "تكلّف عملية البحث المعتادة عن الفعاليات نحو 15–25 رصيدًا: 10 أرصدة للبحث على الويب بالإضافة إلى الرموز التي يستخدمها Mercury 3 لقراءة ما يصل إلى خمس صفحات عامة. البحث الذي يجيب عنه جدول مؤتمر رسمي فقط يكلّف رصيدًا واحدًا. عمليات البحث التي تفشل أو لا تجد شيئًا مجانية."
  hi: "एक सामान्य इवेंट खोज में लगभग 15–25 क्रेडिट लगते हैं: वेब खोज के 10 क्रेडिट और वे टोकन जिनसे Mercury 3 अधिकतम पाँच सार्वजनिक पेज पढ़ता है। जिस खोज का जवाब केवल किसी आधिकारिक कॉन्फ़्रेंस शेड्यूल से मिलता है, उसमें 1 क्रेडिट लगता है। विफल या बिना परिणाम वाली खोजें मुफ़्त हैं।"
  th: "การค้นหากิจกรรมทั่วไปใช้ประมาณ 15–25 เครดิต: 10 เครดิตสำหรับการค้นหาเว็บ บวกกับโทเค็นที่ Mercury 3 ใช้อ่านหน้าสาธารณะได้สูงสุดห้าหน้า การค้นหาที่ตอบได้ด้วยตารางงานประชุมอย่างเป็นทางการเท่านั้นใช้ 1 เครดิต การค้นหาที่ล้มเหลวหรือไม่พบผลลัพธ์ไม่มีค่าใช้จ่าย"
  cs: "Běžné hledání akcí stojí asi 15–25 kreditů: 10 kreditů za vyhledávání na webu plus tokeny, které Mercury 3 použije ke čtení až pěti veřejných stránek. Hledání, na které odpoví jen oficiální program konference, stojí 1 kredit. Hledání, která selžou nebo nic nenajdou, jsou zdarma."
  sv: "En vanlig evenemangssökning kostar omkring 15–25 krediter: 10 krediter för webbsökningen plus de tokens som Mercury 3 använder för att läsa upp till fem offentliga sidor. En sökning som bara besvaras av ett officiellt konferensschema kostar 1 kredit. Sökningar som misslyckas eller inte hittar något är gratis."
  he: "חיפוש אירועים רגיל עולה כ־15–25 קרדיטים: 10 קרדיטים על החיפוש באינטרנט ועוד הטוקנים ש־Mercury 3 משתמש בהם כדי לקרוא עד חמישה דפים ציבוריים. חיפוש שרק לוח זמנים רשמי של כנס עונה עליו עולה קרדיט אחד. חיפושים שנכשלים או לא מוצאים דבר הם בחינם."
  verified_by_human: []
