company_ownership.description:
  context: Company ownership lookup in official registers
  en: "Look up who owns or runs a company, or which companies a person holds, in the official registers of Germany, the UK and France."
  de: "Nachschlagen, wem ein Unternehmen gehört oder wer es leitet, oder welche Unternehmen eine Person hält – in den amtlichen Registern von Deutschland, Großbritannien und Frankreich."
  zh: "在德国、英国和法国的官方登记册中查询公司的所有者和管理人员，或某人持有哪些公司。"
  es: "Consulta quién es propietario o administra una empresa, o qué empresas posee una persona, en los registros oficiales de Alemania, Reino Unido y Francia."
  fr: "Consultez qui détient ou dirige une entreprise, ou quelles entreprises une personne détient, dans les registres officiels de l'Allemagne, du Royaume-Uni et de la France."
  pt: "Consulte quem é dono ou dirige uma empresa, ou que empresas uma pessoa detém, nos registos oficiais da Alemanha, do Reino Unido e de França."
  ru: "Узнайте, кому принадлежит или кто управляет компанией и какими компаниями владеет человек, по официальным реестрам Германии, Великобритании и Франции."
  ja: "ドイツ、英国、フランスの公的登記簿で、企業の所有者や役員、個人が保有する企業を調べます。"
  ko: "독일, 영국, 프랑스의 공식 등기부에서 회사의 소유자와 임원, 개인이 보유한 회사를 조회합니다."
  it: "Scopri chi possiede o dirige un'azienda, o quali aziende detiene una persona, nei registri ufficiali di Germania, Regno Unito e Francia."
  tr: "Almanya, Birleşik Krallık ve Fransa'nın resmi sicillerinde bir şirketin sahiplerini ve yöneticilerini ya da bir kişinin hangi şirketlere sahip olduğunu sorgulayın."
  vi: "Tra cứu ai sở hữu hoặc điều hành một công ty, hoặc một người nắm giữ những công ty nào, trong sổ đăng ký chính thức của Đức, Anh và Pháp."
  id: "Cari tahu siapa pemilik atau pengurus sebuah perusahaan, atau perusahaan mana yang dimiliki seseorang, di register resmi Jerman, Inggris, dan Prancis."
  pl: "Sprawdź, kto jest właścicielem lub zarządza spółką albo jakie spółki posiada dana osoba, w oficjalnych rejestrach Niemiec, Wielkiej Brytanii i Francji."
  nl: "Zoek op wie een bedrijf bezit of leidt, of welke bedrijven een persoon bezit, in de officiële registers van Duitsland, het Verenigd Koninkrijk en Frankrijk."
  ar: "اعرف من يملك شركة أو يديرها، أو ما الشركات التي يملكها شخص ما، في السجلات الرسمية لألمانيا والمملكة المتحدة وفرنسا."
  hi: "जर्मनी, ब्रिटेन और फ़्रांस के आधिकारिक रजिस्टरों में देखें कि किसी कंपनी का मालिक या संचालक कौन है, या किसी व्यक्ति के पास कौन-सी कंपनियाँ हैं।"
  th: "ค้นหาว่าใครเป็นเจ้าของหรือบริหารบริษัท หรือบุคคลหนึ่งถือหุ้นบริษัทใดบ้าง จากทะเบียนทางการของเยอรมนี สหราชอาณาจักร และฝรั่งเศส"
  cs: "Zjistěte, komu společnost patří nebo kdo ji řídí, či které společnosti osoba vlastní, v oficiálních rejstřících Německa, Spojeného království a Francie."
  sv: "Slå upp vem som äger eller leder ett företag, eller vilka företag en person äger, i de officiella registren i Tyskland, Storbritannien och Frankrike."
  he: "בדקו מי הבעלים או המנהלים של חברה, או אילו חברות מחזיק אדם, במרשמים הרשמיים של גרמניה, בריטניה וצרפת."
  verified_by_human: []
