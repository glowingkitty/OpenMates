search_investors.description:
  context: Investor search by topic and region
  en: "Find business angels, angel networks and early-stage investors by topic and region."
  de: "Business Angels, Angel-Netzwerke und Frühphaseninvestoren nach Thema und Region finden."
  zh: "按主题和地区查找天使投资人、天使网络和早期投资机构。"
  es: "Encuentra business angels, redes de ángeles e inversores en fase inicial por tema y región."
  fr: "Trouvez des business angels, réseaux d'anges et investisseurs early-stage par thème et région."
  pt: "Encontre business angels, redes de anjos e investidores em fase inicial por tema e região."
  ru: "Поиск бизнес-ангелов, ангельских сетей и инвесторов ранних стадий по теме и региону."
  ja: "テーマと地域でビジネスエンジェル、エンジェルネットワーク、アーリーステージ投資家を探します。"
  ko: "주제와 지역별로 비즈니스 엔젤, 엔젤 네트워크, 초기 단계 투자자를 찾아보세요."
  it: "Trova business angel, reti di angel e investitori early-stage per tema e regione."
  tr: "Konu ve bölgeye göre melek yatırımcıları, melek ağlarını ve erken aşama yatırımcıları bulun."
  vi: "Tìm nhà đầu tư thiên thần, mạng lưới thiên thần và nhà đầu tư giai đoạn đầu theo chủ đề và khu vực."
  id: "Temukan angel investor, jaringan angel, dan investor tahap awal berdasarkan topik dan wilayah."
  pl: "Znajdź business angels, sieci aniołów i inwestorów wczesnej fazy według tematu i regionu."
  nl: "Vind business angels, angelnetwerken en investeerders in de beginfase op thema en regio."
  ar: "ابحث عن المستثمرين الملائكة وشبكاتهم ومستثمري المراحل المبكرة حسب الموضوع والمنطقة."
  hi: "विषय और क्षेत्र के अनुसार बिज़नेस एंजेल, एंजेल नेटवर्क और शुरुआती चरण के निवेशक खोजें।"
  th: "ค้นหาเอนเจิลอินเวสเตอร์ เครือข่ายเอนเจิล และนักลงทุนระยะเริ่มต้นตามหัวข้อและภูมิภาค"
  cs: "Najděte byznys anděly, andělské sítě a investory raných fází podle tématu a regionu."
  sv: "Hitta business angels, ängelnätverk och investerare i tidig fas efter ämne och region."
  he: "מצאו אנג'לים עסקיים, רשתות אנג'לים ומשקיעים בשלב מוקדם לפי נושא ואזור."
  verified_by_human: []
