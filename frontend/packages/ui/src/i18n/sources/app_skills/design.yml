author.description:
  context: Description for the editable Design authoring skill
  en: Create an editable flyer, post, or mockup.
  de: Erstelle einen bearbeitbaren Flyer, Beitrag oder Entwurf.
  zh: 创建可编辑的传单、帖子或原型。
  es: Crea un folleto, una publicación o una maqueta editable.
  fr: Créez un flyer, une publication ou une maquette modifiable.
  pt: Crie um panfleto, uma publicação ou um protótipo editável.
  ru: Создайте редактируемую листовку, публикацию или макет.
  ja: 編集できるチラシ、投稿、モックアップを作成します。
  ko: 편집할 수 있는 전단, 게시물 또는 시안을 만듭니다.
  it: Crea un volantino, un post o un mockup modificabile.
  tr: Düzenlenebilir bir broşür, gönderi veya taslak oluşturun.
  vi: Tạo tờ rơi, bài đăng hoặc bản mẫu có thể chỉnh sửa.
  id: Buat selebaran, kiriman, atau maket yang dapat diedit.
  pl: Utwórz edytowalną ulotkę, post lub makietę.
  nl: Maak een bewerkbare flyer, post of mock-up.
  ar: أنشئ منشورًا أو ملصقًا أو نموذجًا قابلًا للتعديل.
  hi: संपादन योग्य फ़्लायर, पोस्ट या मॉकअप बनाएँ।
  th: สร้างใบปลิว โพสต์ หรือแบบจำลองที่แก้ไขได้
  cs: Vytvořte upravitelný leták, příspěvek nebo maketu.
  sv: Skapa ett redigerbart flygblad, inlägg eller utkast.
  he: יצירת עלון, פוסט או מוקאפ שניתנים לעריכה.
  verified_by_human: []
