skills.create.description:
  context: Description for creating projects
  en: Ask a connected client to create an encrypted project.
  de: Einen verbundenen Client bitten, ein verschlüsseltes Projekt zu erstellen.
  zh: 请求已连接的客户端创建加密项目。
  es: Pide a un cliente conectado que cree un proyecto cifrado.
  fr: Demandez à un client connecté de créer un projet chiffré.
  pt: Peça a um cliente conectado para criar um projeto criptografado.
  ru: Попросите подключенный клиент создать зашифрованный проект.
  ja: 接続済みクライアントに暗号化されたプロジェクトの作成を依頼します。
  ko: 연결된 클라이언트에 암호화된 프로젝트 생성을 요청합니다.
  it: Chiedi a un client connesso di creare un progetto crittografato.
  tr: Bağlı bir istemciden şifrelenmiş bir proje oluşturmasını isteyin.
  vi: Yêu cầu ứng dụng khách đã kết nối tạo dự án được mã hóa.
  id: Minta klien terhubung membuat proyek terenkripsi.
  pl: Poproś połączonego klienta o utworzenie zaszyfrowanego projektu.
  nl: Vraag een verbonden client om een versleuteld project te maken.
  ar: اطلب من عميل متصل إنشاء مشروع مشفر.
  hi: जुड़े हुए क्लाइंट से एन्क्रिप्टेड प्रोजेक्ट बनाने को कहें।
  th: ขอให้ไคลเอนต์ที่เชื่อมต่อสร้างโปรเจกต์ที่เข้ารหัส
  cs: Požádejte připojeného klienta o vytvoření šifrovaného projektu.
  sv: Be en ansluten klient skapa ett krypterat projekt.
  he: בקשה מלקוח מחובר ליצור פרויקט מוצפן.
  verified_by_human: []
