skills.search.description:
  context: Description for searching projects
  en: Find encrypted projects through a capable connected client.
  de: Verschlüsselte Projekte über einen geeigneten verbundenen Client finden.
  zh: 通过具备能力的已连接客户端查找加密项目。
  es: Encuentra proyectos cifrados mediante un cliente conectado compatible.
  fr: Trouvez des projets chiffrés via un client connecté compatible.
  pt: Encontre projetos criptografados por meio de um cliente conectado compatível.
  ru: Находите зашифрованные проекты через подходящий подключенный клиент.
  ja: 対応する接続済みクライアントを通じて暗号化されたプロジェクトを見つけます。
  ko: 지원되는 연결 클라이언트를 통해 암호화된 프로젝트를 찾습니다.
  it: Trova progetti crittografati tramite un client connesso compatibile.
  tr: Uygun bağlı bir istemciyle şifrelenmiş projeleri bulun.
  vi: Tìm dự án được mã hóa thông qua ứng dụng khách đã kết nối phù hợp.
  id: Temukan proyek terenkripsi melalui klien terhubung yang mampu.
  pl: Znajdź zaszyfrowane projekty przez zgodnego połączonego klienta.
  nl: Vind versleutelde projecten via een geschikte verbonden client.
  ar: ابحث عن المشاريع المشفرة عبر عميل متصل قادر.
  hi: सक्षम जुड़े हुए क्लाइंट के ज़रिये एन्क्रिप्टेड प्रोजेक्ट खोजें।
  th: ค้นหาโปรเจกต์ที่เข้ารหัสผ่านไคลเอนต์ที่เชื่อมต่อและรองรับ
  cs: Najděte šifrované projekty přes schopného připojeného klienta.
  sv: Hitta krypterade projekt via en kapabel ansluten klient.
  he: מציאת פרויקטים מוצפנים דרך לקוח מחובר מתאים.
  verified_by_human: []
