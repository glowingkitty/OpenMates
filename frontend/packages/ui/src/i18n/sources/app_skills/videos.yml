create.description:
  context: Description for Remotion video creation skill
  en: Create deterministic videos with editable Remotion code.
  de: Erstelle deterministische Videos mit bearbeitbarem Remotion-Code.
  zh: 使用可编辑的 Remotion 代码创建确定性视频。
  es: Crea videos deterministas con código Remotion editable.
  fr: Créez des vidéos déterministes avec du code Remotion modifiable.
  pt: Crie vídeos determinísticos com código Remotion editável.
  ru: Создавайте детерминированные видео с редактируемым кодом Remotion.
  ja: 編集可能な Remotion コードで決定論的な動画を作成します。
  ko: 편집 가능한 Remotion 코드로 결정적 비디오를 만듭니다.
  it: Crea video deterministici con codice Remotion modificabile.
  tr: Düzenlenebilir Remotion koduyla deterministik videolar oluşturun.
  vi: Tạo video xác định bằng mã Remotion có thể chỉnh sửa.
  id: Buat video deterministik dengan kode Remotion yang dapat diedit.
  pl: Twórz deterministyczne wideo z edytowalnym kodem Remotion.
  nl: Maak deterministische video's met bewerkbare Remotion-code.
  ar: أنشئ مقاطع فيديو حتمية باستخدام كود Remotion قابل للتحرير.
  hi: संपादन योग्य Remotion कोड से निर्धारक वीडियो बनाएं।
  th: สร้างวิดีโอแบบกำหนดผลได้ด้วยโค้ด Remotion ที่แก้ไขได้
  cs: Vytvářejte deterministická videa s upravitelným kódem Remotion.
  sv: Skapa deterministiska videor med redigerbar Remotion-kod.
  he: יצירת סרטונים דטרמיניסטיים עם קוד Remotion שניתן לעריכה.
