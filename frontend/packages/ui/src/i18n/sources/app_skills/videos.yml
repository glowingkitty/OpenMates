generate.pricing_note:
  context: "Pricing note on the Videos generate skill settings page (per-resolution clip prices, composed video pricing, how changes are charged, no charge without a delivered video)"
  en: "Generated clips: 34.5 (360p), 105 (720p), 156 (1080p) or 313.5 (4K) credits per second. Composed videos: the tokens the writing model uses plus 5 credits per started minute of rendering. Changes are charged only for what they add. You are not charged when no video is delivered."
  de: "Generierte Clips: 34,5 (360p), 105 (720p), 156 (1080p) oder 313,5 (4K) Credits pro Sekunde. Komponierte Videos: die Tokens des schreibenden Modells plus 5 Credits pro angefangener Render-Minute. Änderungen werden nur für das berechnet, was sie hinzufügen. Wird kein Video geliefert, fallen keine Kosten an."
  zh: "生成的片段:每秒 34.5(360p)、105(720p)、156(1080p)或 313.5(4K)积分。合成视频:编写模型使用的 token,加上每开始一分钟渲染 5 积分。修改只按新增的部分计费。如果没有交付视频,则不收费。"
  es: "Clips generados: 34,5 (360p), 105 (720p), 156 (1080p) o 313,5 (4K) créditos por segundo. Vídeos compuestos: los tokens que usa el modelo de redacción más 5 créditos por minuto de renderizado iniciado. Los cambios solo se cobran por lo que añaden. No se cobra si no se entrega ningún vídeo."
  fr: "Clips générés : 34,5 (360p), 105 (720p), 156 (1080p) ou 313,5 (4K) crédits par seconde. Vidéos composées : les tokens du modèle rédacteur plus 5 crédits par minute de rendu commencée. Les modifications ne sont facturées que pour ce qu'elles ajoutent. Aucun frais si aucune vidéo n'est livrée."
  pt: "Clipes gerados: 34,5 (360p), 105 (720p), 156 (1080p) ou 313,5 (4K) créditos por segundo. Vídeos compostos: os tokens do modelo de escrita mais 5 créditos por minuto de renderização iniciado. As alterações são cobradas apenas pelo que acrescentam. Nada é cobrado quando nenhum vídeo é entregue."
  ru: "Сгенерированные клипы: 34,5 (360p), 105 (720p), 156 (1080p) или 313,5 (4K) кредита в секунду. Составные видео: токены модели-автора плюс 5 кредитов за каждую начатую минуту рендеринга. Изменения оплачиваются только за то, что они добавляют. Если видео не доставлено, плата не взимается."
  ja: "生成クリップ:1秒あたり 34.5(360p)、105(720p)、156(1080p)、313.5(4K)クレジット。構成動画:執筆モデルが使うトークンに加え、レンダリング開始した1分ごとに5クレジット。変更は追加分のみ課金されます。動画が届かなかった場合は課金されません。"
  ko: "생성된 클립: 초당 34.5(360p), 105(720p), 156(1080p) 또는 313.5(4K) 크레딧. 구성형 영상: 작성 모델이 사용한 토큰에 더해 렌더링 시작한 1분마다 5크레딧. 변경은 추가된 부분에 대해서만 청구됩니다. 영상이 전달되지 않으면 청구되지 않습니다."
  it: "Clip generate: 34,5 (360p), 105 (720p), 156 (1080p) o 313,5 (4K) crediti al secondo. Video composti: i token usati dal modello di scrittura più 5 crediti per ogni minuto di rendering iniziato. Le modifiche vengono addebitate solo per ciò che aggiungono. Nessun addebito se non viene consegnato alcun video."
  tr: "Üretilen klipler: saniye başına 34,5 (360p), 105 (720p), 156 (1080p) veya 313,5 (4K) kredi. Oluşturulan videolar: yazan modelin kullandığı token'lar artı başlanan her render dakikası için 5 kredi. Değişiklikler yalnızca ekledikleri kadar ücretlendirilir. Video teslim edilmezse ücret alınmaz."
  vi: "Clip được tạo: 34,5 (360p), 105 (720p), 156 (1080p) hoặc 313,5 (4K) credit mỗi giây. Video dựng bằng mã: token mà mô hình viết sử dụng cộng 5 credit cho mỗi phút kết xuất đã bắt đầu. Thay đổi chỉ bị tính phí cho phần được thêm. Không bị tính phí nếu không có video nào được giao."
  id: "Klip yang dihasilkan: 34,5 (360p), 105 (720p), 156 (1080p) atau 313,5 (4K) kredit per detik. Video komposisi: token yang dipakai model penulis ditambah 5 kredit per menit rendering yang dimulai. Perubahan hanya dikenai biaya untuk yang ditambahkannya. Tidak ada biaya jika tidak ada video yang dikirim."
  pl: "Generowane klipy: 34,5 (360p), 105 (720p), 156 (1080p) lub 313,5 (4K) kredytu za sekundę. Wideo komponowane: tokeny modelu piszącego plus 5 kredytów za każdą rozpoczętą minutę renderowania. Zmiany są rozliczane tylko za to, co dodają. Nie pobieramy opłaty, jeśli nie dostarczono wideo."
  nl: "Gegenereerde clips: 34,5 (360p), 105 (720p), 156 (1080p) of 313,5 (4K) credits per seconde. Samengestelde video's: de tokens van het schrijvende model plus 5 credits per begonnen minuut renderen. Wijzigingen worden alleen berekend voor wat ze toevoegen. Er worden geen kosten berekend als er geen video wordt geleverd."
  ar: "المقاطع المولّدة: 34.5 (360p) أو 105 (720p) أو 156 (1080p) أو 313.5 (4K) رصيد في الثانية. الفيديوهات المركّبة: رموز النموذج الكاتب مضافًا إليها 5 رصيد عن كل دقيقة عرض بدأت. تُحتسب التعديلات فقط على ما تضيفه. لا يتم خصم أي رصيد إذا لم يتم تسليم فيديو."
  hi: "जनरेट किए गए क्लिप: प्रति सेकंड 34.5 (360p), 105 (720p), 156 (1080p) या 313.5 (4K) क्रेडिट। कंपोज़ किए गए वीडियो: लिखने वाले मॉडल के टोकन और रेंडरिंग के हर शुरू हुए मिनट के 5 क्रेडिट। बदलावों पर केवल उतना ही शुल्क लगता है जितना वे जोड़ते हैं। वीडियो न मिलने पर कोई शुल्क नहीं लगता।"
  th: "คลิปที่สร้าง: 34.5 (360p), 105 (720p), 156 (1080p) หรือ 313.5 (4K) เครดิตต่อวินาที วิดีโอที่ประกอบขึ้น: โทเคนที่โมเดลผู้เขียนใช้ บวก 5 เครดิตต่อทุกนาทีของการเรนเดอร์ที่เริ่มต้น การแก้ไขคิดค่าบริการเฉพาะส่วนที่เพิ่มเข้ามา หากไม่มีการส่งมอบวิดีโอ จะไม่มีการเรียกเก็บเงิน"
  cs: "Generované klipy: 34,5 (360p), 105 (720p), 156 (1080p) nebo 313,5 (4K) kreditu za sekundu. Složená videa: tokeny, které použije píšící model, plus 5 kreditů za každou započatou minutu renderování. Změny se účtují jen za to, co přidávají. Pokud není doručeno žádné video, nic se neúčtuje."
  sv: "Genererade klipp: 34,5 (360p), 105 (720p), 156 (1080p) eller 313,5 (4K) krediter per sekund. Komponerade videor: de tokens som skrivmodellen använder plus 5 krediter per påbörjad renderingsminut. Ändringar debiteras bara för det de lägger till. Ingen debitering sker om ingen video levereras."
  he: "קליפים שנוצרו: 34.5 (360p), 105 (720p), 156 (1080p) או 313.5 (4K) קרדיטים לשנייה. סרטונים מורכבים: הטוקנים שמודל הכתיבה משתמש בהם ועוד 5 קרדיטים לכל דקת רינדור שהתחילה. שינויים מחויבים רק על מה שהם מוסיפים. אין חיוב כאשר לא נמסר סרטון."
  verified_by_human: [en, de]
