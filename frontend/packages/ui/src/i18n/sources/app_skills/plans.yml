skills.search.description:
  context: Description for searching plans
  en: Find encrypted plans through a capable connected client.
  de: Verschlüsselte Pläne über einen geeigneten verbundenen Client finden.
  zh: 通过具备能力的已连接客户端查找加密计划。
  es: Encuentra planes cifrados mediante un cliente conectado compatible.
  fr: Trouvez des plans chiffrés via un client connecté compatible.
  pt: Encontre planos criptografados por meio de um cliente conectado compatível.
  ru: Находите зашифрованные планы через подходящий подключенный клиент.
  ja: 対応する接続済みクライアントを通じて暗号化されたプランを見つけます。
  ko: 지원되는 연결 클라이언트를 통해 암호화된 계획을 찾습니다.
  it: Trova piani crittografati tramite un client connesso compatibile.
  tr: Uygun bağlı bir istemciyle şifrelenmiş planları bulun.
  vi: Tìm kế hoạch được mã hóa thông qua ứng dụng khách đã kết nối phù hợp.
  id: Temukan rencana terenkripsi melalui klien terhubung yang mampu.
  pl: Znajdź zaszyfrowane plany przez zgodnego połączonego klienta.
  nl: Vind versleutelde plannen via een geschikte verbonden client.
  ar: ابحث عن الخطط المشفرة عبر عميل متصل قادر.
  hi: सक्षम जुड़े हुए क्लाइंट के ज़रिये एन्क्रिप्टेड योजनाएँ खोजें।
  th: ค้นหาแผนที่เข้ารหัสผ่านไคลเอนต์ที่เชื่อมต่อและรองรับ
  cs: Najděte šifrované plány přes schopného připojeného klienta.
  sv: Hitta krypterade planer via en kapabel ansluten klient.
  he: מציאת תוכניות מוצפנות דרך לקוח מחובר מתאים.
  verified_by_human: []
