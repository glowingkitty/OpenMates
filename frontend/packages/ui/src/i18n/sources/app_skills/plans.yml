skills.create.description:
  context: Description for creating plans
  en: Ask a connected client to create an encrypted plan.
  de: Einen verbundenen Client bitten, einen verschlüsselten Plan zu erstellen.
  zh: 请求已连接的客户端创建加密计划。
  es: Pide a un cliente conectado que cree un plan cifrado.
  fr: Demandez à un client connecté de créer un plan chiffré.
  pt: Peça a um cliente conectado para criar um plano criptografado.
  ru: Попросите подключенный клиент создать зашифрованный план.
  ja: 接続済みクライアントに暗号化されたプランの作成を依頼します。
  ko: 연결된 클라이언트에 암호화된 계획 생성을 요청합니다.
  it: Chiedi a un client connesso di creare un piano crittografato.
  tr: Bağlı bir istemciden şifrelenmiş bir plan oluşturmasını isteyin.
  vi: Yêu cầu ứng dụng khách đã kết nối tạo kế hoạch được mã hóa.
  id: Minta klien terhubung membuat rencana terenkripsi.
  pl: Poproś połączonego klienta o utworzenie zaszyfrowanego planu.
  nl: Vraag een verbonden client om een versleuteld plan te maken.
  ar: اطلب من عميل متصل إنشاء خطة مشفرة.
  hi: जुड़े हुए क्लाइंट से एन्क्रिप्टेड योजना बनाने को कहें।
  th: ขอให้ไคลเอนต์ที่เชื่อมต่อสร้างแผนที่เข้ารหัส
  cs: Požádejte připojeného klienta o vytvoření šifrovaného plánu.
  sv: Be en ansluten klient skapa en krypterad plan.
  he: בקשה מלקוח מחובר ליצור תוכנית מוצפנת.
  verified_by_human: []
