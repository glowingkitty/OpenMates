ask.how_to_use.3:
  context: Example instruction for AI ask skill - writing help
  en: "Help me **write** a professional email to my boss about a raise"
  de: Hilf mir, eine professionelle E-Mail an meinen Chef wegen einer Gehaltserhöhung zu schreiben
  zh: 帮我写一封向老板要求加薪的专业邮件
  es: Ayúdame a escribir un email profesional a mi jefe sobre un aumento
  fr: Aide-moi à rédiger un email professionnel à mon patron pour une augmentation
  pt: Me ajude a escrever um email profissional para meu chefe sobre um aumento
  ru: Помоги мне написать профессиональное письмо начальнику о повышении зарплаты
  ja: 上司に昇給について専門的なメールを書くのを手伝って
  ko: 상사에게 급여 인상에 대한 전문적인 이메일을 쓰는 걸 도와주세요
  it: Aiutami a scrivere un'email professionale al mio capo per un aumento
  tr: Patronuma zam hakkında profesyonel bir e-posta yazmama yardım et
  vi: Giúp tôi viết email chuyên nghiệp cho sếp về việc tăng lương
  id: Bantu saya menulis email profesional kepada bos tentang kenaikan gaji
  pl: Pomóż mi napisać profesjonalny email do szefa o podwyżkę
  nl: Help me een professionele e-mail te schrijven aan mijn baas over een loonsverhoging
  ar: ساعدني في كتابة بريد إلكتروني احترافي لمديري حول زيادة الراتب
  hi: मेरे बॉस को वेतन वृद्धि के बारे में एक पेशेवर ईमेल लिखने में मदद करें
  th: ช่วยเขียนอีเมลอย่างมืออาชีพถึงหัวหน้าเรื่องการขอขึ้นเงินเดือน
  cs: Pomoz mi napsat profesionální email šéfovi o zvýšení platu
  sv: Hjälp mig skriva ett professionellt mejl till min chef om löneförhöjning
  he: "עזור לי **לכתוב** אימייל מקצועי למנהל שלי בנושא העלאה בשכר"
  verified_by_human: [en, de]

