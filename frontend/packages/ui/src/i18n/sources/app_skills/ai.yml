ask.description:
  context: Description for AI ask skill
  en: Ask using text, images, and other media.
  de: Frage mit Text, Bildern und anderen Medien.
  zh: 使用文本、图像和其他媒体提问。
  es: Pregunta con texto, imágenes y otros medios.
  fr: Demandez avec texte, images et autres médias.
  pt: Pergunte com texto, imagens e outros meios.
  ru: Спросите с текстом, изображениями и медиа.
  ja: テキスト、画像、その他のメディアで質問。
  ko: 텍스트, 이미지, 미디어로 질문하세요.
  it: Chiedi con testo, immagini e altri media.
  tr: Metin, resim ve diğer medya ile sorun.
  vi: Hỏi bằng văn bản, hình ảnh và phương tiện khác.
  id: Tanya dengan teks, gambar, dan media lainnya.
  pl: Pytaj tekstem, obrazami i innymi mediami.
  nl: Vraag met tekst, afbeeldingen en andere media.
  ar: اسأل بالنص والصور والوسائط الأخرى.
  hi: टेक्स्ट, छवियों और अन्य मीडिया से पूछें।
  th: ถามด้วยข้อความ รูปภาพ และสื่ออื่นๆ
  cs: Ptejte se textem, obrázky a dalšími médii.
  sv: Fråga med text, bilder och annat media.
  he: שאל באמצעות טקסט, תמונות ומדיה נוספת.
  verified_by_human: [en, de]

ask.how_to_use.1:
  context: Example instruction for AI ask skill - general knowledge question
  en: What are the **pros and cons** of remote work?
  de: Was sind die Vor- und Nachteile von Remote-Arbeit?
  zh: 远程工作的优缺点是什么？
  es: ¿Cuáles son los pros y contras del trabajo remoto?
  fr: Quels sont les avantages et inconvénients du télétravail ?
  pt: Quais são os prós e contras do trabalho remoto?
  ru: Каковы плюсы и минусы удалённой работы?
  ja: リモートワークのメリットとデメリットは？
  ko: 재택근무의 장단점은 무엇인가요?
  it: Quali sono i pro e i contro del lavoro da remoto?
  tr: Uzaktan çalışmanın artıları ve eksileri nelerdir?
  vi: Ưu và nhược điểm của làm việc từ xa là gì?
  id: Apa kelebihan dan kekurangan kerja jarak jauh?
  pl: Jakie są zalety i wady pracy zdalnej?
  nl: Wat zijn de voor- en nadelen van thuiswerken?
  ar: ما هي إيجابيات وسلبيات العمل عن بُعد؟
  hi: रिमोट वर्क के फायदे और नुकसान क्या हैं?
  th: ข้อดีและข้อเสียของการทำงานทางไกลคืออะไร?
  cs: Jaké jsou výhody a nevýhody práce na dálku?
  sv: Vilka är fördelarna och nackdelarna med distansarbete?
  he: "מהם ה**יתרונות והחסרונות** של עבודה מרחוק?"
  verified_by_human: [en, de]

ask.how_to_use.2:
  context: Example instruction for AI ask skill - explain a concept
  en: "**Explain** quantum computing in simple terms"
  de: Erkläre Quantencomputing in einfachen Worten
  zh: 用简单的语言解释量子计算
  es: Explica la computación cuántica en términos simples
  fr: Explique l'informatique quantique en termes simples
  pt: Explique a computação quântica em termos simples
  ru: Объясни квантовые вычисления простыми словами
  ja: 量子コンピューティングを簡単に説明して
  ko: 양자 컴퓨팅을 쉽게 설명해 주세요
  it: Spiega il calcolo quantistico in parole semplici
  tr: Kuantum bilişimi basit terimlerle açıkla
  vi: Giải thích máy tính lượng tử bằng từ ngữ đơn giản
  id: Jelaskan komputasi kuantum dengan istilah sederhana
  pl: Wyjaśnij obliczenia kwantowe prostymi słowami
  nl: Leg kwantumcomputing uit in eenvoudige termen
  ar: اشرح الحوسبة الكمومية بعبارات بسيطة
  hi: क्वांटम कंप्यूटिंग को सरल शब्दों में समझाइए
  th: อธิบายการประมวลผลควอนตัมด้วยคำง่ายๆ
  cs: Vysvětli kvantové počítání jednoduchými slovy
  sv: Förklara kvantdatorer med enkla ord
  he: "**הסבר** מחשוב קוונטי במונחים פשוטים"
