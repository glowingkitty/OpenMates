decide.how_to_use.1:
  context: "Example instruction for AI decide skill: game retreat decision"
  en: "Should my game character retreat or keep fighting with low health?"
  de: "Soll mein Spielcharakter mit wenig Lebenspunkten fliehen oder weiterkämpfen?"
  zh: "我的游戏角色生命值很低，该撤退还是继续战斗？"
  es: "¿Mi personaje debería retirarse o seguir luchando con poca salud?"
  fr: "Mon personnage devrait-il battre en retraite ou continuer à combattre avec peu de points de vie ?"
  pt: "Meu personagem deve recuar ou continuar lutando com pouca vida?"
  ru: "Моему игровому персонажу с малым запасом здоровья отступить или продолжить бой?"
  ja: "体力が少ないゲームキャラクターは撤退すべき？それとも戦い続けるべき？"
  ko: "체력이 낮은 게임 캐릭터가 후퇴해야 할까요, 계속 싸워야 할까요?"
  it: "Il mio personaggio con poca salute dovrebbe ritirarsi o continuare a combattere?"
  tr: "Canı az olan oyun karakterim geri mi çekilmeli, savaşmaya devam mı etmeli?"
  vi: "Nhân vật trong trò chơi của tôi còn ít máu, nên rút lui hay tiếp tục chiến đấu?"
  id: "Karakter game saya tinggal sedikit nyawanya, sebaiknya mundur atau terus bertarung?"
  pl: "Czy moja postać w grze z małą liczbą punktów zdrowia powinna się wycofać czy walczyć dalej?"
  nl: "Moet mijn spelpersonage met weinig levenspunten zich terugtrekken of doorvechten?"
  ar: "هل ينبغي لشخصيتي في اللعبة الانسحاب أم مواصلة القتال مع انخفاض نقاط الصحة؟"
  hi: "मेरे गेम के किरदार का स्वास्थ्य कम है। उसे पीछे हटना चाहिए या लड़ते रहना चाहिए?"
  th: "ตัวละครในเกมของฉันมีพลังชีวิตเหลือน้อย ควรถอยหรือสู้ต่อ?"
  cs: "Má moje herní postava s malým počtem životů ustoupit, nebo bojovat dál?"
  sv: "Ska min spelkaraktär med lite hälsa dra sig tillbaka eller fortsätta slåss?"
  he: "האם הדמות שלי במשחק צריכה לסגת או להמשיך להילחם כשנותרו לה מעט נקודות חיים?"
  verified_by_human: []

decide.how_to_use.2:
  context: "Example instruction for AI decide skill: choose a support category"
  en: "Choose a support category for this request: billing, technical, or account."
  de: "Wähle für diese Anfrage eine Support-Kategorie: Abrechnung, Technik oder Konto."
  zh: "为这个请求选择一个客服类别：账单、技术或账户。"
  es: "Elige una categoría de soporte para esta solicitud: facturación, técnica o cuenta."
  fr: "Choisissez une catégorie d’assistance pour cette demande : facturation, technique ou compte."
  pt: "Escolha uma categoria de suporte para esta solicitação: cobrança, técnica ou conta."
  ru: "Выберите категорию поддержки для этого запроса: оплата, техническая проблема или аккаунт."
  ja: "この問い合わせのサポートカテゴリを、請求・技術・アカウントから選んでください。"
  ko: "이 요청에 맞는 지원 카테고리를 결제, 기술, 계정 중에서 선택하세요."
  it: "Scegli una categoria di assistenza per questa richiesta: fatturazione, tecnica o account."
  tr: "Bu talep için bir destek kategorisi seçin: faturalandırma, teknik veya hesap."
  vi: "Chọn danh mục hỗ trợ cho yêu cầu này: thanh toán, kỹ thuật hoặc tài khoản."
  id: "Pilih kategori dukungan untuk permintaan ini: penagihan, teknis, atau akun."
  pl: "Wybierz kategorię pomocy dla tego zgłoszenia: rozliczenia, techniczna lub konto."
  nl: "Kies een ondersteuningscategorie voor dit verzoek: facturering, technisch of account."
  ar: "اختر فئة دعم لهذا الطلب: الفوترة أو الدعم الفني أو الحساب."
  hi: "इस अनुरोध के लिए सहायता श्रेणी चुनें: बिलिंग, तकनीकी या खाता।"
  th: "เลือกหมวดหมู่การสนับสนุนสำหรับคำขอนี้: การเรียกเก็บเงิน เทคนิค หรือบัญชี"
  cs: "Vyberte kategorii podpory pro tento požadavek: fakturace, technická podpora nebo účet."
  sv: "Välj en supportkategori för den här förfrågan: fakturering, teknik eller konto."
  he: "בחר קטגוריית תמיכה לפנייה הזו: חיוב, טכנית או חשבון."
  verified_by_human: []
