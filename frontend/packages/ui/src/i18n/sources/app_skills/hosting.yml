  th: "ตรวจสอบความพร้อมใช้งานของโดเมนและราคาจดทะเบียนกับต่ออายุโดยประมาณ"
  cs: "Ověřte dostupnost domén a orientační ceny registrace a prodloužení."
  sv: "Kontrollera domäntillgänglighet och ungefärliga priser för registrering och förnyelse."
