run.declined_notice:
  context: "Notice shown when a run or preview the user started is not started because E2B upload is not allowed"
  en: "Running code in the E2B cloud sandbox is not allowed for your account, so nothing was started. You can change this in Settings > Privacy, or run it on your own machine with the remote access command."
  de: "Code im E2B-Cloud-Sandbox auszuführen ist für dein Konto nicht erlaubt, deshalb wurde nichts gestartet. Du kannst das unter Einstellungen > Datenschutz ändern oder es mit dem Remote-Access-Befehl auf deinem eigenen Rechner ausführen."
  zh: "你的账户未允许在 E2B 云沙盒中运行代码，因此没有启动任何内容。你可以在“设置 > 隐私”中更改，或使用远程访问命令在自己的电脑上运行。"
  es: "Ejecutar código en el sandbox en la nube de E2B no está permitido para tu cuenta, así que no se inició nada. Puedes cambiarlo en Ajustes > Privacidad o ejecutarlo en tu propio equipo con el comando de acceso remoto."
  fr: "L'exécution de code dans le sandbox cloud E2B n'est pas autorisée pour ton compte, donc rien n'a été lancé. Tu peux le modifier dans Paramètres > Confidentialité ou l'exécuter sur ta propre machine avec la commande d'accès à distance."
  pt: "Executar código na sandbox na nuvem da E2B não está permitido para a tua conta, por isso nada foi iniciado. Podes alterar isto em Definições > Privacidade ou executá-lo na tua própria máquina com o comando de acesso remoto."
  ru: "Запуск кода в облачной песочнице E2B не разрешён для твоего аккаунта, поэтому ничего не запущено. Ты можешь изменить это в Настройки > Конфиденциальность или запустить код на своём компьютере командой удалённого доступа."
  ja: "アカウントでは E2B クラウドサンドボックスでのコード実行が許可されていないため、何も開始されませんでした。設定 > プライバシーで変更するか、リモートアクセスコマンドで自分のマシン上で実行できます。"
  ko: "계정에서 E2B 클라우드 샌드박스에서의 코드 실행이 허용되어 있지 않아 아무것도 시작되지 않았습니다. 설정 > 개인정보에서 변경하거나 원격 액세스 명령으로 내 컴퓨터에서 실행할 수 있습니다."
  it: "L'esecuzione di codice nella sandbox cloud di E2B non è consentita per il tuo account, quindi non è stato avviato nulla. Puoi cambiarlo in Impostazioni > Privacy oppure eseguirlo sul tuo computer con il comando di accesso remoto."
  tr: "Hesabın için E2B bulut sandbox'ında kod çalıştırmaya izin verilmiyor, bu yüzden hiçbir şey başlatılmadı. Bunu Ayarlar > Gizlilik bölümünden değiştirebilir veya uzaktan erişim komutuyla kendi makinende çalıştırabilirsin."
  vi: "Tài khoản của bạn không cho phép chạy mã trong sandbox đám mây E2B nên chưa có gì được khởi chạy. Bạn có thể thay đổi trong Cài đặt > Quyền riêng tư, hoặc chạy trên máy của bạn bằng lệnh truy cập từ xa."
  id: "Menjalankan kode di sandbox cloud E2B tidak diizinkan untuk akunmu, jadi tidak ada yang dimulai. Kamu bisa mengubahnya di Pengaturan > Privasi, atau menjalankannya di mesinmu sendiri dengan perintah akses jarak jauh."
  pl: "Uruchamianie kodu w chmurowej piaskownicy E2B nie jest dozwolone dla twojego konta, więc nic nie zostało uruchomione. Możesz to zmienić w Ustawienia > Prywatność albo uruchomić kod na własnym komputerze poleceniem zdalnego dostępu."
  nl: "Code uitvoeren in de E2B-cloudsandbox is niet toegestaan voor je account, dus er is niets gestart. Je kunt dit wijzigen in Instellingen > Privacy, of het op je eigen machine uitvoeren met de opdracht voor toegang op afstand."
  ar: "تشغيل التعليمات البرمجية في بيئة E2B السحابية غير مسموح به لحسابك، لذلك لم يبدأ شيء. يمكنك تغيير ذلك من الإعدادات > الخصوصية، أو تشغيله على جهازك الخاص بأمر الوصول عن بُعد."
  hi: "आपके खाते के लिए E2B क्लाउड सैंडबॉक्स में कोड चलाने की अनुमति नहीं है, इसलिए कुछ शुरू नहीं किया गया। आप इसे सेटिंग > गोपनीयता में बदल सकते हैं, या रिमोट एक्सेस कमांड से अपनी मशीन पर चला सकते हैं।"
  th: "บัญชีของคุณไม่ได้อนุญาตให้เรียกใช้โค้ดใน E2B cloud sandbox จึงไม่มีการเริ่มทำงานใดๆ คุณเปลี่ยนได้ที่การตั้งค่า > ความเป็นส่วนตัว หรือเรียกใช้บนเครื่องของคุณเองด้วยคำสั่งรีโมตแอ็กเซส"
  cs: "Spouštění kódu v cloudovém sandboxu E2B není pro tvůj účet povoleno, takže se nic nespustilo. Můžeš to změnit v Nastavení > Soukromí, nebo kód spustit na vlastním počítači příkazem vzdáleného přístupu."
  sv: "Att köra kod i molnsandlådan E2B är inte tillåtet för ditt konto, så ingenting startades. Du kan ändra det under Inställningar > Integritet, eller köra det på din egen maskin med kommandot för fjärråtkomst."
  he: "הרצת קוד בארגז החול בענן של E2B אינה מותרת בחשבון שלך, ולכן שום דבר לא הופעל. אפשר לשנות זאת בהגדרות > פרטיות, או להריץ על המחשב שלך עם פקודת הגישה מרחוק."
  verified_by_human: []

