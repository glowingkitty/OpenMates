request.body:
  context: "In-chat consent request before code or files are sent to the E2B cloud sandbox"
  en: "To run this, your code and files are sent to E2B, a cloud sandbox provider, and run there."
  de: "Um das auszuführen, werden dein Code und deine Dateien an E2B gesendet, einen Cloud-Sandbox-Anbieter, und dort ausgeführt."
  zh: "要运行此内容，你的代码和文件会被发送到云沙盒提供商 E2B，并在那里运行。"
  es: "Para ejecutar esto, tu código y tus archivos se envían a E2B, un proveedor de sandbox en la nube, y se ejecutan allí."
  fr: "Pour exécuter ceci, ton code et tes fichiers sont envoyés à E2B, un fournisseur de sandbox cloud, et y sont exécutés."
  pt: "Para executar isto, o teu código e os teus ficheiros são enviados para a E2B, um fornecedor de sandbox na nuvem, e executados lá."
  ru: "Чтобы запустить это, твой код и файлы отправляются в E2B, облачный сервис-песочницу, и выполняются там."
  ja: "これを実行するには、コードとファイルがクラウドサンドボックスのプロバイダーである E2B に送信され、そこで実行されます。"
  ko: "이를 실행하려면 코드와 파일이 클라우드 샌드박스 제공업체인 E2B로 전송되어 그곳에서 실행됩니다."
  it: "Per eseguirlo, il tuo codice e i tuoi file vengono inviati a E2B, un fornitore di sandbox cloud, ed eseguiti lì."
  tr: "Bunu çalıştırmak için kodun ve dosyaların bir bulut sandbox sağlayıcısı olan E2B'ye gönderilir ve orada çalıştırılır."
  vi: "Để chạy nội dung này, mã và tệp của bạn sẽ được gửi đến E2B, một nhà cung cấp sandbox đám mây, và chạy ở đó."
  id: "Untuk menjalankan ini, kode dan file kamu dikirim ke E2B, penyedia sandbox cloud, dan dijalankan di sana."
  pl: "Aby to uruchomić, twój kod i pliki są wysyłane do E2B, dostawcy piaskownicy w chmurze, i tam uruchamiane."
  nl: "Om dit uit te voeren, worden je code en bestanden naar E2B gestuurd, een aanbieder van cloudsandboxen, en daar uitgevoerd."
  ar: "لتشغيل هذا، تُرسل التعليمات البرمجية والملفات الخاصة بك إلى E2B، وهو مزوّد بيئات اختبار سحابية، ويتم تشغيلها هناك."
  hi: "इसे चलाने के लिए आपका कोड और फ़ाइलें E2B को भेजी जाती हैं, जो एक क्लाउड सैंडबॉक्स प्रदाता है, और वहीं चलाई जाती हैं।"
  th: "ในการเรียกใช้สิ่งนี้ โค้ดและไฟล์ของคุณจะถูกส่งไปยัง E2B ซึ่งเป็นผู้ให้บริการแซนด์บ็อกซ์บนคลาวด์ และเรียกใช้ที่นั่น"
  cs: "Aby se to spustilo, tvůj kód a soubory se odešlou do E2B, poskytovatele cloudového sandboxu, a spustí se tam."
  sv: "För att köra detta skickas din kod och dina filer till E2B, en leverantör av molnsandlådor, och körs där."
  he: "כדי להריץ את זה, הקוד והקבצים שלך נשלחים ל-E2B, ספק ארגזי חול בענן, ומורצים שם."
  verified_by_human: []

