settings.description:
  context: "Privacy settings explanation under the E2B cloud sandbox toggle"
  en: "When allowed, the code and files you run are sent to E2B, a cloud sandbox provider. When not allowed, nothing is sent."
  de: "Wenn erlaubt, werden der Code und die Dateien, die du ausführst, an E2B gesendet, einen Cloud-Sandbox-Anbieter. Wenn nicht erlaubt, wird nichts gesendet."
  zh: "允许时，你运行的代码和文件会发送到云沙盒提供商 E2B。不允许时，不会发送任何内容。"
  es: "Si lo permites, el código y los archivos que ejecutes se envían a E2B, un proveedor de sandbox en la nube. Si no lo permites, no se envía nada."
  fr: "Si tu l'autorises, le code et les fichiers que tu exécutes sont envoyés à E2B, un fournisseur de sandbox cloud. Sinon, rien n'est envoyé."
  pt: "Se permitires, o código e os ficheiros que executas são enviados para a E2B, um fornecedor de sandbox na nuvem. Se não permitires, nada é enviado."
  ru: "Если разрешено, код и файлы, которые ты запускаешь, отправляются в E2B, облачный сервис-песочницу. Если не разрешено, ничего не отправляется."
  ja: "許可すると、実行するコードとファイルがクラウドサンドボックスのプロバイダーである E2B に送信されます。許可しない場合は何も送信されません。"
  ko: "허용하면 실행하는 코드와 파일이 클라우드 샌드박스 제공업체인 E2B로 전송됩니다. 허용하지 않으면 아무것도 전송되지 않습니다."
  it: "Se consentito, il codice e i file che esegui vengono inviati a E2B, un fornitore di sandbox cloud. Se non consentito, non viene inviato nulla."
  tr: "İzin verildiğinde, çalıştırdığın kod ve dosyalar bir bulut sandbox sağlayıcısı olan E2B'ye gönderilir. İzin verilmediğinde hiçbir şey gönderilmez."
  vi: "Khi được cho phép, mã và tệp bạn chạy sẽ được gửi đến E2B, một nhà cung cấp sandbox đám mây. Khi không được phép, sẽ không có gì được gửi."
  id: "Jika diizinkan, kode dan file yang kamu jalankan dikirim ke E2B, penyedia sandbox cloud. Jika tidak diizinkan, tidak ada yang dikirim."
  pl: "Gdy jest dozwolone, kod i pliki, które uruchamiasz, są wysyłane do E2B, dostawcy piaskownicy w chmurze. Gdy nie jest dozwolone, nic nie jest wysyłane."
  nl: "Als dit is toegestaan, worden de code en bestanden die je uitvoert naar E2B gestuurd, een aanbieder van cloudsandboxen. Als het niet is toegestaan, wordt er niets verstuurd."
  ar: "عند السماح، تُرسل التعليمات البرمجية والملفات التي تشغّلها إلى E2B، وهو مزوّد بيئات اختبار سحابية. عند عدم السماح، لا يُرسل أي شيء."
  hi: "अनुमति देने पर, आप जो कोड और फ़ाइलें चलाते हैं वे क्लाउड सैंडबॉक्स प्रदाता E2B को भेजी जाती हैं। अनुमति न देने पर कुछ भी नहीं भेजा जाता।"
  th: "เมื่ออนุญาต โค้ดและไฟล์ที่คุณเรียกใช้จะถูกส่งไปยัง E2B ผู้ให้บริการแซนด์บ็อกซ์บนคลาวด์ เมื่อไม่อนุญาต จะไม่มีการส่งอะไรเลย"
  cs: "Když je to povoleno, kód a soubory, které spouštíš, se odesílají do E2B, poskytovatele cloudového sandboxu. Když to povoleno není, nic se neodesílá."
  sv: "När det är tillåtet skickas koden och filerna du kör till E2B, en leverantör av molnsandlådor. När det inte är tillåtet skickas ingenting."
  he: "כשזה מותר, הקוד והקבצים שאתה מריץ נשלחים ל-E2B, ספק ארגזי חול בענן. כשזה לא מותר, שום דבר לא נשלח."
  verified_by_human: []

