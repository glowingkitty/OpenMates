  pl: Dane osobowe są zastępowane, zanim zobaczy je AI.
  nl: Persoonlijke gegevens worden vervangen voordat de AI ze ziet.
  ar: تُستبدل التفاصيل الشخصية قبل أن يراها الذكاء الاصطناعي.
