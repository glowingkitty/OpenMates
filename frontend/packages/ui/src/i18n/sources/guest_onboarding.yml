landing_actionable_event_detail:
  context: Event description in the Actionable landing slide event demo
  en: Short talks and demos about open-source AI tools, with time to meet people afterwards.
  de: Kurze Talks und Demos zu Open-Source-KI-Tools, danach Zeit zum Kennenlernen.
  zh: 关于开源 AI 工具的短讲和演示，之后还有时间认识新朋友。
  es: Charlas breves y demostraciones sobre herramientas de IA de código abierto, con tiempo para conocer gente después.
  fr: Courts exposés et démos autour d'outils d'IA open source, puis du temps pour faire connaissance.
  pt: Palestras curtas e demonstrações sobre ferramentas de IA de código aberto, com tempo para conhecer pessoas depois.
  ru: Короткие доклады и демонстрации инструментов ИИ с открытым исходным кодом, а потом время для знакомств.
  ja: オープンソースAIツールについての短いトークとデモ。終了後には交流の時間もあります。
  ko: 오픈소스 AI 도구에 대한 짧은 발표와 시연, 그리고 이후 사람들과 만날 시간이 있어요.
  it: Brevi talk e demo sugli strumenti di IA open source, con tempo per conoscere altre persone dopo.
  tr: Açık kaynaklı yapay zekâ araçları üzerine kısa konuşmalar ve demolar; sonrasında insanlarla tanışma zamanı.
  vi: Các bài nói ngắn và demo về công cụ AI mã nguồn mở, sau đó có thời gian gặp gỡ mọi người.
  id: Presentasi singkat dan demo tentang alat AI sumber terbuka, lalu ada waktu untuk bertemu orang-orang.
  pl: Krótkie prelekcje i pokazy narzędzi AI o otwartym kodzie, a potem czas na poznanie innych uczestników.
  nl: Korte talks en demo's over open-source AI-tools, met daarna tijd om mensen te ontmoeten.
  ar: عروض تقديمية قصيرة وعروض توضيحية عن أدوات الذكاء الاصطناعي مفتوحة المصدر، مع وقت للتعرف على الآخرين بعد ذلك.
  hi: ओपन-सोर्स AI टूल्स पर छोटी बातचीतें और डेमो, और उसके बाद लोगों से मिलने का समय।
  th: การบรรยายสั้น ๆ และการสาธิตเครื่องมือ AI โอเพนซอร์ส พร้อมเวลาพบปะผู้คนหลังจบงาน
  cs: Krátké přednášky a ukázky open-source AI nástrojů a potom čas na seznámení s dalšími lidmi.
  sv: Korta föredrag och demos om AI-verktyg med öppen källkod, med tid att träffa folk efteråt.
  he: הרצאות קצרות והדגמות על כלי בינה מלאכותית בקוד פתוח, ואחר כך זמן להכיר אנשים.
