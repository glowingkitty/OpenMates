landing_privacy_saved_data:
  context: Client-side encryption explanation in the privacy landing header story (never claim end-to-end encryption)
  en: Your chats are encrypted on your device before they are stored.
  de: Deine Chats werden auf deinem Gerät verschlüsselt, bevor sie gespeichert werden.
  zh: 你的聊天在存储之前，会先在你的设备上加密。
  es: Tus chats se cifran en tu dispositivo antes de guardarse.
  fr: Tes chats sont chiffrés sur ton appareil avant d'être enregistrés.
  pt: Seus chats são criptografados no seu dispositivo antes de serem armazenados.
  ru: Твои чаты шифруются на твоём устройстве до того, как будут сохранены.
  ja: チャットは、保存される前にお使いのデバイス上で暗号化されます。
  ko: 채팅은 저장되기 전에 내 기기에서 암호화돼요.
  it: Le tue chat vengono cifrate sul tuo dispositivo prima di essere salvate.
  tr: Sohbetlerin saklanmadan önce cihazında şifrelenir.
  vi: Cuộc trò chuyện của bạn được mã hóa trên thiết bị của bạn trước khi được lưu trữ.
  id: Obrolanmu dienkripsi di perangkatmu sebelum disimpan.
  pl: Twoje czaty są szyfrowane na twoim urządzeniu, zanim zostaną zapisane.
  nl: Je chats worden op je apparaat versleuteld voordat ze worden opgeslagen.
  ar: تُشفَّر محادثاتك على جهازك قبل تخزينها.
  hi: तुम्हारी चैट सेव होने से पहले तुम्हारे डिवाइस पर एन्क्रिप्ट हो जाती हैं।
  th: แชทของคุณจะถูกเข้ารหัสบนอุปกรณ์ของคุณก่อนที่จะถูกจัดเก็บ
  cs: Tvoje chaty se šifrují na tvém zařízení, než se uloží.
  sv: Dina chattar krypteras på din enhet innan de lagras.
  he: השיחות שלך מוצפנות במכשיר שלך לפני שהן נשמרות.
