  zh: 个人信息在 AI 看到之前就会被替换。
  es: Tus datos personales se sustituyen antes de que la IA los vea.
  fr: Les informations personnelles sont remplacées avant que l'IA ne les voie.
  pt: Os dados pessoais são substituídos antes que a IA os veja.
  ru: Личные данные заменяются до того, как их увидит ИИ.
  ja: 個人情報は、AIが目にする前に置き換えられます。
  ko: 개인 정보는 AI가 보기 전에 다른 값으로 대체돼요.
  it: I dati personali vengono sostituiti prima che l'IA li veda.
  tr: Kişisel bilgiler, yapay zekâ görmeden önce değiştirilir.
  vi: Thông tin cá nhân được thay thế trước khi AI nhìn thấy.
