landing_actionable_event_detail:
  context: Fullscreen detail description for the lightweight Actionable landing slide event demo
  en: A Berlin Luma event about decentralized compute and DePIN research, found from a real event search.
  de: Ein Berliner Luma-Event ueber dezentrales Computing und DePIN-Forschung, gefunden aus einer echten Eventsuche.
  zh: 在柏林举办的 Luma 活动，探讨去中心化计算和 DePIN 研究。
  es: Un evento de Luma en Berlín sobre computación descentralizada e investigación DePIN.
  fr: Un événement Luma à Berlin sur le calcul décentralisé et la recherche DePIN.
  pt: Um evento da Luma em Berlim sobre computação descentralizada e pesquisa DePIN.
  ru: Мероприятие Luma в Берлине о децентрализованных вычислениях и исследованиях DePIN.
  ja: 分散型コンピューティングと DePIN 研究を扱うベルリンの Luma イベントです。
  ko: 탈중앙화 컴퓨팅과 DePIN 연구를 다루는 베를린 Luma 이벤트입니다.
  it: Un evento Luma a Berlino su calcolo decentralizzato e ricerca DePIN.
  tr: Merkeziyetsiz bilişim ve DePIN araştırmaları üzerine Berlin'de bir Luma etkinliği.
  vi: Một sự kiện Luma tại Berlin về điện toán phi tập trung và nghiên cứu DePIN.
  id: Acara Luma di Berlin tentang komputasi terdesentralisasi dan riset DePIN.
  pl: Wydarzenie Luma w Berlinie o zdecentralizowanych obliczeniach i badaniach DePIN.
  nl: Een Luma-evenement in Berlijn over gedecentraliseerde rekenkracht en DePIN-onderzoek.
  ar: فعالية على Luma في برلين حول الحوسبة اللامركزية وأبحاث DePIN.
  hi: विकेंद्रीकृत कंप्यूटिंग और DePIN शोध पर बर्लिन में एक Luma कार्यक्रम।
  th: งาน Luma ในเบอร์ลินเกี่ยวกับการประมวลผลแบบกระจายศูนย์และงานวิจัย DePIN
  cs: Akce Luma v Berlíně o decentralizovaných výpočtech a výzkumu DePIN.
  sv: Ett Luma-evenemang i Berlin om decentraliserad databehandling och DePIN-forskning.
  he: אירוע Luma בברלין על מחשוב מבוזר ומחקר DePIN.
  verified_by_human: []
