design_template.description:
  context: Focus mode description
  en: Design a reusable slide template step by step - three designs to choose from, refined with you,
    then saved to your library.
  de: "Gestalte Schritt für Schritt eine wiederverwendbare Folienvorlage - drei Designs zur Auswahl, gemeinsam verfeinert, dann in deiner Bibliothek gespeichert."
  zh: "一步步设计可重复使用的幻灯片模板 - 三种设计可选，与你一起完善，然后保存到你的资料库。"
  es: "Diseña paso a paso una plantilla de diapositivas reutilizable: tres diseños para elegir, refinados contigo y guardados en tu biblioteca."
  fr: "Concevez pas à pas un modèle de diapositives réutilisable : trois designs au choix, affinés avec vous, puis enregistrés dans votre bibliothèque."
  pt: "Crie passo a passo um modelo de slides reutilizável - três designs para escolher, refinados com você e salvos na sua biblioteca."
  ru: "Шаг за шагом создайте многоразовый шаблон слайдов - три дизайна на выбор, доработка вместе с вами, затем сохранение в вашу библиотеку."
  ja: "再利用できるスライドテンプレートを段階的にデザイン - 3つのデザインから選び、一緒に仕上げて、ライブラリに保存します。"
  ko: "재사용 가능한 슬라이드 템플릿을 단계별로 디자인하세요 - 세 가지 디자인 중 선택하고 함께 다듬은 뒤 라이브러리에 저장합니다."
  it: "Progetta passo dopo passo un modello di slide riutilizzabile: tre design tra cui scegliere, rifiniti con te e salvati nella tua libreria."
  tr: "Yeniden kullanılabilir bir slayt şablonunu adım adım tasarlayın - seçebileceğiniz üç tasarım, sizinle birlikte iyileştirilir ve kitaplığınıza kaydedilir."
  vi: "Thiết kế từng bước một mẫu trang chiếu có thể dùng lại - ba thiết kế để chọn, cùng bạn tinh chỉnh, rồi lưu vào thư viện của bạn."
  id: "Desain templat slide yang dapat dipakai ulang langkah demi langkah - tiga desain untuk dipilih, disempurnakan bersama Anda, lalu disimpan ke pustaka Anda."
  pl: "Zaprojektuj krok po kroku szablon slajdów wielokrotnego użytku - trzy projekty do wyboru, dopracowane razem z Tobą i zapisane w Twojej bibliotece."
  nl: "Ontwerp stap voor stap een herbruikbaar diasjabloon - drie ontwerpen om uit te kiezen, samen verfijnd en daarna opgeslagen in je bibliotheek."
  ar: "صمّم خطوة بخطوة قالب شرائح قابلاً لإعادة الاستخدام - ثلاثة تصاميم للاختيار، يُحسَّن معك، ثم يُحفظ في مكتبتك."
  hi: "चरण-दर-चरण एक दोबारा उपयोग होने वाला स्लाइड टेम्पलेट डिज़ाइन करें - चुनने के लिए तीन डिज़ाइन, आपके साथ निखारे गए, फिर आपकी लाइब्रेरी में सहेजे गए।"
  th: "ออกแบบเทมเพลตสไลด์ที่ใช้ซ้ำได้ทีละขั้นตอน - มีสามดีไซน์ให้เลือก ปรับแต่งร่วมกับคุณ แล้วบันทึกลงคลังของคุณ"
  cs: "Navrhněte krok za krokem opakovaně použitelnou šablonu snímků - tři návrhy na výběr, doladěné s vámi a uložené do vaší knihovny."
  sv: "Designa steg för steg en återanvändbar bildmall - tre designer att välja mellan, finslipade tillsammans med dig och sedan sparade i ditt bibliotek."
  he: "עצבו צעד אחר צעד תבנית שקופיות לשימוש חוזר - שלושה עיצובים לבחירה, משופרים יחד איתכם ונשמרים בספרייה שלכם."
  verified_by_human: []
