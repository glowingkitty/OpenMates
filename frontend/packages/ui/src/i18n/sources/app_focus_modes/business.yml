find_brand_name.description:
  context: Brand naming focus description
  en: "Shortlist memorable names, then check finalist domains and trademark conflicts."
  de: "Einprägsame Namen auswählen, dann Domains und Markenkonflikte der Favoriten prüfen."
  zh: "筛选易记的名称，再检查候选域名和商标冲突。"
  es: "Preselecciona nombres memorables y comprueba dominios y conflictos de marca de los finalistas."
  fr: "Présélectionnez des noms mémorables, puis vérifiez les domaines et conflits de marques des finalistes."
  pt: "Selecione nomes memoráveis e verifique domínios e conflitos de marcas dos finalistas."
  ru: "Составьте список запоминающихся названий и проверьте домены и товарные знаки финалистов."
  ja: "覚えやすい名前を絞り込み、最終候補のドメインと商標の競合を確認します。"
  ko: "기억하기 쉬운 이름을 추린 뒤 최종 후보의 도메인과 상표 충돌을 확인하세요."
  it: "Seleziona nomi memorabili, poi verifica domini e conflitti di marchio dei finalisti."
  tr: "Akılda kalıcı adları seçin, ardından finalistlerin alan adlarını ve marka çakışmalarını kontrol edin."
  vi: "Chọn tên dễ nhớ rồi kiểm tra tên miền và xung đột nhãn hiệu của các ứng viên cuối."
  id: "Pilih nama yang mudah diingat, lalu periksa domain dan konflik merek kandidat akhir."
  pl: "Wybierz zapadające w pamięć nazwy, a następnie sprawdź domeny i konflikty znaków finalistów."
  nl: "Maak een selectie van herkenbare namen en controleer domeinen en merkconflicten van de finalisten."
  ar: "اختر أسماء يسهل تذكرها ثم تحقق من نطاقات المرشحين النهائيين وتعارضات العلامات التجارية."
  hi: "याद रहने वाले नाम चुनें, फिर अंतिम विकल्पों के डोमेन और ट्रेडमार्क टकराव जाँचें।"
  th: "คัดเลือกชื่อที่จำง่าย แล้วตรวจสอบโดเมนและความขัดแย้งของเครื่องหมายการค้าของชื่อสุดท้าย"
  cs: "Vyberte zapamatovatelné názvy a poté prověřte domény a kolize ochranných známek finalistů."
  sv: "Välj minnesvärda namn och kontrollera sedan finalisternas domäner och varumärkeskonflikter."
  he: "בחרו שמות זכירים ואז בדקו דומיינים והתנגשויות בסימני מסחר של המועמדים הסופיים."
  verified_by_human: []
