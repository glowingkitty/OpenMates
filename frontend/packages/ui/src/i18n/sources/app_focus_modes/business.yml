price_products.description:
  context: "Focus mode description"
  en: "Work out what to charge for handmade or small-batch products, with a live sheet you can edit."
  de: "Ermittle, was du für handgemachte oder Kleinserien-Produkte verlangen solltest – mit einer live bearbeitbaren Tabelle."
  zh: "借助可编辑的实时表格，算出手工或小批量产品该定什么价。"
  es: "Calcula cuánto cobrar por productos artesanales o de pequeña tirada, con una hoja en vivo que puedes editar."
  fr: "Déterminez le prix de vos produits faits main ou en petites séries, avec un tableau en direct modifiable."
  pt: "Descubra quanto cobrar por produtos artesanais ou de pequena produção, com uma planilha ao vivo que você pode editar."
  ru: "Рассчитайте цену на изделия ручной работы или малые партии с помощью живой редактируемой таблицы."
  ja: "編集できるライブシートで、手作りや少量生産の商品の価格を割り出します。"
  ko: "편집 가능한 실시간 시트로 수제품이나 소량 생산 제품의 가격을 정하세요."
  it: "Calcola quanto far pagare prodotti artigianali o in piccole serie, con un foglio live modificabile."
  tr: "El yapımı veya küçük seri ürünler için ne kadar isteyeceğini düzenlenebilir canlı bir tabloyla hesapla."
  vi: "Tính giá bán cho sản phẩm thủ công hoặc sản xuất số lượng nhỏ với bảng tính trực tiếp có thể chỉnh sửa."
  id: "Hitung harga jual produk buatan tangan atau produksi kecil dengan lembar langsung yang bisa kamu edit."
  pl: "Ustal, ile brać za produkty rękodzielnicze lub z małych serii, korzystając z edytowalnego arkusza na żywo."
  nl: "Bereken wat je vraagt voor handgemaakte producten of kleine series, met een live sheet die je kunt bewerken."
  ar: "احسب السعر المناسب لمنتجاتك اليدوية أو ذات الإنتاج المحدود باستخدام جدول مباشر قابل للتعديل."
  hi: "संपादन योग्य लाइव शीट के साथ हस्तनिर्मित या छोटे बैच के उत्पादों की सही कीमत तय करें।"
  th: "คำนวณราคาสินค้าทำมือหรือผลิตจำนวนน้อย ด้วยชีตสดที่คุณแก้ไขได้"
  cs: "Spočítejte, kolik si účtovat za ruční nebo malosériové výrobky, s živou tabulkou, kterou můžete upravovat."
  sv: "Räkna ut vad du ska ta betalt för handgjorda produkter eller småserier, med ett live-ark du kan redigera."
  he: "חשבו כמה לגבות על מוצרים בעבודת יד או בייצור קטן, עם גיליון חי שאפשר לערוך."
  verified_by_human: []
