prepare_investor_pitch.description:
  context: Focus mode description
  en: Build your deck storyline, find the weak spots, then rehearse hard investor questions one at a time.
  de: Baue die Story deines Decks, finde die Schwachstellen und übe dann harte Investorenfragen, eine
    nach der anderen.
  zh: 搭建路演文稿故事线，找出薄弱环节，再逐个演练投资人的难题。
  es: Construye el guion de tu deck, detecta los puntos débiles y ensaya preguntas difíciles de inversores,
    una a una.
  fr: Construisez le fil de votre deck, repérez les points faibles, puis répétez les questions difficiles
    des investisseurs, une par une.
  pt: Monte a narrativa do seu deck, encontre os pontos fracos e ensaie perguntas difíceis de investidores,
    uma por vez.
  ru: Постройте сюжет презентации, найдите слабые места и отрепетируйте трудные вопросы инвесторов по
    одному.
  ja: デックのストーリーを組み立て、弱点を見つけ、投資家の厳しい質問を1つずつ練習します。
  ko: 덱의 스토리라인을 만들고 약점을 찾은 뒤 투자자의 까다로운 질문을 하나씩 연습하세요.
  it: Costruisci la storia del tuo deck, individua i punti deboli e prova le domande difficili degli investitori,
    una alla volta.
  tr: Sunumunuzun hikâyesini kurun, zayıf noktaları bulun, sonra yatırımcıların zor sorularını tek tek
    prova edin.
  vi: Xây dựng mạch kể cho bộ slide, tìm điểm yếu rồi tập trả lời từng câu hỏi khó của nhà đầu tư.
  id: Susun alur cerita deck kamu, temukan titik lemah, lalu latih pertanyaan sulit investor satu per
    satu.
  pl: Zbuduj opowieść swojego decku, znajdź słabe punkty, a potem przećwicz trudne pytania inwestorów,
    jedno po drugim.
  nl: Bouw het verhaal van je deck, vind de zwakke plekken en oefen lastige investeerdersvragen, één voor
    één.
  ar: ابنِ قصة عرضك، واكتشف نقاط الضعف، ثم تدرّب على أسئلة المستثمرين الصعبة واحداً تلو الآخر.
  hi: अपने डेक की कहानी बनाएँ, कमज़ोर बिंदु खोजें, फिर निवेशकों के कठिन सवालों का एक-एक करके अभ्यास करें।
  th: สร้างเรื่องราวของเด็ค หาจุดอ่อน แล้วซ้อมตอบคำถามยากของนักลงทุนทีละข้อ
  cs: Vytvořte příběh svého decku, najděte slabá místa a pak si nacvičte těžké otázky investorů, jednu
    po druhé.
  sv: Bygg storyn i din deck, hitta svagheterna och öva sedan svåra investerarfrågor, en i taget.
  he: בנו את סיפור המצגת, מצאו נקודות חולשה ואז תרגלו שאלות קשות של משקיעים, אחת בכל פעם.
