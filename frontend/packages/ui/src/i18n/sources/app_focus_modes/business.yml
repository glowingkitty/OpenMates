research_investor.description:
  context: Focus mode description
  en: Check one investor or firm before you approach them, with verified facts, red flags and ways to
    get introduced.
  de: 'Prüfe einen Investor oder eine Firma vor der Ansprache: mit verifizierten Fakten, Warnzeichen und
    Wegen zur Vorstellung.'
  zh: 接触前先调研某位投资人或机构，含已核实事实、风险信号和引荐途径。
  es: Investiga a un inversor o firma antes de contactarlo, con hechos verificados, señales de alerta
    y vías de presentación.
  fr: 'Renseignez-vous sur un investisseur ou un fonds avant de le contacter : faits vérifiés, signaux
    d''alerte et pistes d''introduction.'
  pt: Pesquise um investidor ou firma antes de abordá-lo, com fatos verificados, alertas e caminhos para
    apresentação.
  ru: 'Изучите инвестора или фонд перед обращением: проверенные факты, тревожные признаки и пути знакомства.'
  ja: 連絡する前に投資家やファームを調べ、検証済みの事実、懸念点、紹介ルートを確認します。
  ko: 접근하기 전에 투자자나 투자사를 조사하세요. 검증된 사실, 위험 신호, 소개 경로를 제공합니다.
  it: 'Informati su un investitore o una società prima di contattarli: fatti verificati, segnali d''allarme
    e vie di presentazione.'
  tr: 'Yaklaşmadan önce bir yatırımcıyı veya firmayı inceleyin: doğrulanmış bilgiler, uyarı işaretleri
    ve tanışma yolları.'
  vi: Tìm hiểu một nhà đầu tư hoặc quỹ trước khi tiếp cận, với thông tin đã xác minh, dấu hiệu cảnh báo
    và cách được giới thiệu.
  id: Periksa satu investor atau firma sebelum mendekati mereka, dengan fakta terverifikasi, tanda bahaya,
    dan jalur perkenalan.
  pl: 'Sprawdź inwestora lub fundusz przed kontaktem: zweryfikowane fakty, sygnały ostrzegawcze i drogi
    do poleconego kontaktu.'
  nl: Onderzoek een investeerder of firma voordat je contact zoekt, met geverifieerde feiten, waarschuwingssignalen
    en manieren om geïntroduceerd te worden.
  ar: 'ابحث عن مستثمر أو شركة قبل التواصل معهم: حقائق موثقة وإشارات تحذير وطرق للتعارف.'
  hi: 'संपर्क करने से पहले किसी निवेशक या फर्म की जाँच करें: सत्यापित तथ्य, चेतावनी संकेत और परिचय के
    रास्ते।'
  th: ตรวจสอบนักลงทุนหรือบริษัทก่อนติดต่อ พร้อมข้อเท็จจริงที่ยืนยันแล้ว สัญญาณเตือน และช่องทางให้คนแนะนำ
  cs: 'Prověřte investora nebo firmu před oslovením: ověřená fakta, varovné signály a cesty k seznámení.'
  sv: Undersök en investerare eller firma innan du kontaktar dem, med verifierade fakta, varningssignaler
    och vägar till introduktion.
  he: בדקו משקיע או קרן לפני הפנייה, עם עובדות מאומתות, דגלים אדומים ודרכי היכרות.
