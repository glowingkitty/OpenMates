plan_funding_round.description:
  context: Focus mode description
  en: Work out how much to raise, which instrument fits, the dilution and a timeline, with a cap-table
    sheet you can edit.
  de: Ermittle, wie viel du aufnimmst, welches Instrument passt, die Verwässerung und einen Zeitplan,
    mit editierbarer Cap-Table.
  zh: 算出该融多少、选哪种工具、股权稀释和时间表，并附可编辑的股权结构表。
  es: Calcula cuánto captar, qué instrumento encaja, la dilución y un calendario, con una hoja de cap
    table editable.
  fr: Déterminez le montant à lever, l'instrument adapté, la dilution et un calendrier, avec un tableau
    de capitalisation modifiable.
  pt: Calcule quanto captar, qual instrumento se encaixa, a diluição e um cronograma, com uma planilha
    de cap table editável.
  ru: Рассчитайте, сколько привлечь, какой инструмент подходит, размывание доли и сроки, с редактируемой
    таблицей капитализации.
  ja: 調達額、適した手段、希薄化、スケジュールを整理し、編集できるキャップテーブルも作ります。
  ko: 얼마를 조달할지, 어떤 수단이 맞는지, 지분 희석과 일정을 정리하고 수정 가능한 지분표를 만듭니다.
  it: Calcola quanto raccogliere, quale strumento è adatto, la diluizione e le tempistiche, con una cap
    table modificabile.
  tr: Ne kadar fon toplanacağını, hangi aracın uygun olduğunu, hisse seyrelmesini ve zaman çizelgesini
    düzenlenebilir bir hisse tablosuyla hesaplayın.
  vi: Tính cần huy động bao nhiêu, công cụ nào phù hợp, mức pha loãng và lộ trình, kèm bảng cổ phần có
    thể chỉnh sửa.
  id: Hitung berapa dana yang dihimpun, instrumen yang cocok, dilusi, dan jadwal, lengkap dengan lembar
    cap table yang bisa diedit.
  pl: Ustal, ile pozyskać, jaki instrument pasuje, jakie będzie rozwodnienie i harmonogram, z edytowalnym
    arkuszem cap table.
  nl: Bepaal hoeveel je ophaalt, welk instrument past, de verwatering en een tijdlijn, met een bewerkbare
    cap-tablesheet.
  ar: احسب المبلغ المطلوب والأداة المناسبة والتخفيف وجدولاً زمنياً مع جدول ملكية قابل للتعديل.
  hi: तय करें कितना जुटाना है, कौन-सा साधन उपयुक्त है, डाइल्यूशन और समयरेखा, संपादन योग्य कैप-टेबल शीट
    के साथ।
  th: คำนวณว่าควรระดมทุนเท่าไร เครื่องมือแบบไหนเหมาะ การเจือจางหุ้น และไทม์ไลน์ พร้อมชีต cap table ที่แก้ไขได้
  cs: Spočítejte, kolik získat, jaký nástroj se hodí, ředění podílu a časový plán, s upravitelnou tabulkou
    kapitalizace.
  sv: Räkna ut hur mycket du ska ta in, vilket instrument som passar, utspädningen och en tidsplan, med
    ett redigerbart cap table-ark.
  he: חשבו כמה לגייס, איזה מכשיר מתאים, את ההדילול ולוח זמנים, עם גיליון קאפ טייבל שאפשר לערוך.
