daily_meeting_and_orchestration.description:
  context: "Focus mode description"
  en: "Choose today's priorities and coordinate project tasks and chats through completion."
  de: "Lege die heutigen Prioritäten fest und koordiniere Projektaufgaben und Chats bis zum Abschluss."
  zh: "选定今天的优先事项，并协调项目任务和聊天直到完成。"
  es: "Elige las prioridades de hoy y coordina las tareas y chats del proyecto hasta completarlos."
  fr: "Choisissez les priorités du jour et coordonnez les tâches et discussions du projet jusqu'à leur achèvement."
  pt: "Escolha as prioridades de hoje e coordene as tarefas e conversas do projeto até a conclusão."
  ru: "Определите приоритеты на сегодня и доведите задачи и чаты проекта до завершения."
  ja: "今日の優先事項を決め、プロジェクトのタスクとチャットを完了まで調整します。"
  ko: "오늘의 우선순위를 정하고 프로젝트 작업과 채팅을 완료까지 조율하세요."
  it: "Scegli le priorità di oggi e coordina attività e chat del progetto fino al completamento."
  tr: "Bugünün önceliklerini seç ve proje görevlerini ve sohbetlerini tamamlanana kadar koordine et."
  vi: "Chọn ưu tiên hôm nay và điều phối các tác vụ, cuộc trò chuyện của dự án đến khi hoàn tất."
  id: "Pilih prioritas hari ini dan koordinasikan tugas serta obrolan proyek hingga selesai."
  pl: "Wybierz dzisiejsze priorytety i koordynuj zadania oraz czaty projektu aż do ukończenia."
  nl: "Kies de prioriteiten van vandaag en coördineer projecttaken en chats tot ze klaar zijn."
  ar: "اختر أولويات اليوم ونسّق مهام المشروع ومحادثاته حتى الإنجاز."
  hi: "आज की प्राथमिकताएं चुनें और प्रोजेक्ट के कार्यों व चैट को पूरा होने तक समन्वित करें।"
  th: "เลือกลำดับความสำคัญของวันนี้ และประสานงานงานกับแชตของโปรเจกต์จนเสร็จสิ้น"
  cs: "Zvolte dnešní priority a koordinujte úkoly a chaty projektu až do dokončení."
  sv: "Välj dagens prioriteringar och samordna projektets uppgifter och chattar tills de är klara."
  he: "בחרו את סדרי העדיפויות של היום ותאמו את משימות הפרויקט והצ'אטים עד להשלמה."
  verified_by_human: []
