plan_conference_talk.description:
  context: "Focus mode description"
  en: "Decide which talk to submit to a conference and shape it into a strong proposal."
  de: "Entscheide, welchen Vortrag du bei einer Konferenz einreichst, und mach daraus einen starken Vorschlag."
  zh: "决定向会议提交哪个演讲，并把它打磨成有力的提案。"
  es: "Decide qué charla presentar a una conferencia y conviértela en una propuesta sólida."
  fr: "Choisissez quelle intervention soumettre à une conférence et transformez-la en proposition solide."
  pt: "Decida qual palestra submeter a uma conferência e transforme-a em uma proposta forte."
  ru: "Выберите, какой доклад подать на конференцию, и превратите его в сильную заявку."
  ja: "カンファレンスに応募する講演を決め、説得力のある提案に仕上げます。"
  ko: "콘퍼런스에 제출할 발표를 정하고 탄탄한 제안서로 다듬으세요."
  it: "Decidi quale talk proporre a una conferenza e trasformalo in una proposta convincente."
  tr: "Bir konferansa hangi konuşmayı göndereceğine karar ver ve onu güçlü bir teklife dönüştür."
  vi: "Chọn bài nói để gửi tới hội nghị và biến nó thành một đề xuất thuyết phục."
  id: "Tentukan presentasi yang akan diajukan ke konferensi dan jadikan proposal yang kuat."
  pl: "Zdecyduj, które wystąpienie zgłosić na konferencję, i przekształć je w mocną propozycję."
  nl: "Bepaal welke talk je indient bij een conferentie en maak er een sterk voorstel van."
  ar: "اختر المحاضرة التي ستقدمها إلى مؤتمر وحوّلها إلى مقترح قوي."
  hi: "तय करें कि सम्मेलन में कौन-सी वार्ता भेजनी है और उसे एक मजबूत प्रस्ताव में ढालें।"
  th: "เลือกหัวข้อบรรยายที่จะส่งเข้างานประชุม แล้วเรียบเรียงเป็นข้อเสนอที่แข็งแรง"
  cs: "Rozhodněte, jakou přednášku přihlásit na konferenci, a připravte z ní silný návrh."
  sv: "Bestäm vilket föredrag du ska skicka in till en konferens och forma det till ett starkt förslag."
  he: "החליטו איזו הרצאה להגיש לכנס ועצבו אותה להצעה חזקה."
  verified_by_human: []
