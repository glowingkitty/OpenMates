test_knowledge.description:
  context: Description for test knowledge focus mode
  en: Check your understanding, find gaps, and practise with fresh questions.
  de: Prüfe dein Verständnis, finde Lücken und übe mit neuen Fragen.
  zh: 检验理解、发现知识盲点，并通过新问题练习。
  es: Comprueba tu comprensión, detecta lagunas y practica con nuevas preguntas.
  fr: Vérifiez votre compréhension, repérez les lacunes et pratiquez avec de nouvelles questions.
  pt: Verifique sua compreensão, encontre lacunas e pratique com novas perguntas.
  ru: Проверьте понимание, найдите пробелы и потренируйтесь на новых вопросах.
  ja: 理解を確認し、苦手な点を見つけ、新しい問題で練習しましょう。
  ko: 이해도를 확인하고 부족한 부분을 찾아 새로운 질문으로 연습하세요.
  it: Verifica la comprensione, trova le lacune ed esercitati con nuove domande.
  tr: Anladıklarını kontrol et, eksikleri bul ve yeni sorularla pratik yap.
  vi: Kiểm tra mức độ hiểu, tìm lỗ hổng và luyện tập với câu hỏi mới.
  id: Periksa pemahaman, temukan kekurangan, dan berlatih dengan pertanyaan baru.
  pl: Sprawdź zrozumienie, znajdź braki i ćwicz z nowymi pytaniami.
  nl: Controleer je begrip, vind hiaten en oefen met nieuwe vragen.
  ar: تحقق من فهمك وحدد الفجوات وتدرّب بأسئلة جديدة.
  hi: अपनी समझ जाँचें, कमियाँ पहचानें और नए प्रश्नों से अभ्यास करें।
  th: ตรวจสอบความเข้าใจ ค้นหาจุดที่ยังไม่เข้าใจ และฝึกด้วยคำถามใหม่
  cs: Ověřte porozumění, najděte mezery a procvičujte s novými otázkami.
  sv: Kontrollera förståelsen, hitta luckor och öva med nya frågor.
  he: בדקו את ההבנה, מצאו פערים ותרגלו עם שאלות חדשות.
  verified_by_human: []
