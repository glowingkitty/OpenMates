learn_topic.description:
  context: Description for learn topic focus mode
  en: Build understanding, practise, and check what you can explain yourself.
  de: Verstehen, üben und prüfen, was du selbst erklären kannst.
  zh: 建立理解、进行练习，并检验你能否独立解释。
  es: Comprende, practica y comprueba lo que puedes explicar por ti mismo.
  fr: Comprenez, pratiquez et vérifiez ce que vous pouvez expliquer vous-même.
  pt: Compreenda, pratique e verifique o que consegue explicar por conta própria.
  ru: Разберитесь в теме, потренируйтесь и проверьте, что можете объяснить сами.
  ja: 理解を深め、練習し、自分で説明できることを確かめましょう。
  ko: 이해를 쌓고 연습하며 스스로 설명할 수 있는지 확인하세요.
  it: Comprendi, esercitati e verifica cosa sai spiegare da solo.
  tr: Konuyu anla, pratik yap ve kendi başına neleri açıklayabildiğini kontrol et.
  vi: Hiểu rõ, luyện tập và kiểm tra những gì bạn có thể tự giải thích.
  id: Bangun pemahaman, berlatih, dan periksa apa yang bisa kamu jelaskan sendiri.
  pl: Zrozum temat, ćwicz i sprawdź, co potrafisz wyjaśnić samodzielnie.
  nl: Bouw begrip op, oefen en controleer wat je zelf kunt uitleggen.
  ar: ابنِ فهمك وتدرّب وتحقق مما تستطيع شرحه بنفسك.
  hi: समझ विकसित करें, अभ्यास करें और जाँचें कि आप स्वयं क्या समझा सकते हैं।
  th: สร้างความเข้าใจ ฝึกฝน และตรวจสอบสิ่งที่คุณอธิบายได้ด้วยตนเอง
  cs: Porozumějte tématu, procvičujte a ověřte si, co umíte sami vysvětlit.
  sv: Bygg förståelse, öva och kontrollera vad du kan förklara själv.
  he: בנו הבנה, תרגלו ובדקו מה אתם יכולים להסביר בעצמכם.
  verified_by_human: []
