clarify_workflows.description:
  context: "Focus mode description"
  en: "Resolve missing details for one or more workflows before creating or changing them."
  de: "Kläre fehlende Details für einen oder mehrere Workflows, bevor du sie erstellst oder änderst."
  zh: "在创建或修改一个或多个工作流之前，补齐缺失的细节。"
  es: "Resuelve los detalles que faltan de uno o varios flujos de trabajo antes de crearlos o cambiarlos."
  fr: "Complétez les détails manquants d'un ou plusieurs workflows avant de les créer ou de les modifier."
  pt: "Resolva os detalhes que faltam em um ou mais fluxos de trabalho antes de criá-los ou alterá-los."
  ru: "Уточните недостающие детали одного или нескольких рабочих процессов перед их созданием или изменением."
  ja: "1つ以上のワークフローを作成・変更する前に、不足している詳細を解消します。"
  ko: "하나 이상의 워크플로를 만들거나 변경하기 전에 빠진 세부 사항을 해결하세요."
  it: "Risolvi i dettagli mancanti di uno o più workflow prima di crearli o modificarli."
  tr: "Bir veya daha fazla iş akışını oluşturmadan ya da değiştirmeden önce eksik ayrıntıları netleştir."
  vi: "Bổ sung các chi tiết còn thiếu cho một hoặc nhiều quy trình trước khi tạo hoặc thay đổi chúng."
  id: "Lengkapi detail yang kurang untuk satu atau beberapa alur kerja sebelum membuat atau mengubahnya."
  pl: "Uzupełnij brakujące szczegóły jednego lub kilku przepływów pracy przed ich utworzeniem lub zmianą."
  nl: "Los ontbrekende details van een of meer workflows op voordat je ze maakt of wijzigt."
  ar: "استكمل التفاصيل الناقصة لسير عمل واحد أو أكثر قبل إنشائه أو تغييره."
  hi: "एक या अधिक वर्कफ़्लो बनाने या बदलने से पहले उनकी छूटी हुई जानकारी पूरी करें।"
  th: "เติมรายละเอียดที่ขาดหายของเวิร์กโฟลว์หนึ่งรายการหรือมากกว่า ก่อนสร้างหรือเปลี่ยนแปลง"
  cs: "Doplňte chybějící podrobnosti jednoho či více pracovních postupů před jejich vytvořením nebo změnou."
  sv: "Reda ut saknade detaljer för ett eller flera arbetsflöden innan du skapar eller ändrar dem."
  he: "השלימו פרטים חסרים בתהליך עבודה אחד או יותר לפני יצירתם או שינוים."
  verified_by_human: []
