write_application.description:
  context: Focus mode description
  en: Write an application for one specific job, in your own voice and built on your real experience.
  de: Schreibe eine Bewerbung für eine konkrete Stelle, in deinem eigenen Stil und auf Basis deiner echten Erfahrung.
  zh: 针对某个具体职位撰写申请，用你自己的语气，基于你的真实经历。
  es: Escribe una candidatura para un puesto concreto, con tu propia voz y basada en tu experiencia real.
  fr: Rédigez une candidature pour un poste précis, avec votre propre voix et fondée sur votre expérience réelle.
  pt: Escreva uma candidatura para uma vaga específica, com a sua própria voz e baseada na sua experiência real.
  ru: Напишите отклик на конкретную вакансию своим голосом и на основе реального опыта.
  ja: 特定の求人に向けて、あなた自身の言葉で、実際の経験に基づいた応募書類を書きます。
  ko: 특정 채용 공고에 맞춰, 나만의 문체로 실제 경험을 바탕으로 지원서를 작성하세요.
  it: Scrivi una candidatura per un lavoro specifico, con la tua voce e basata sulla tua esperienza reale.
  tr: Belirli bir iş için, kendi üslubunla ve gerçek deneyimine dayanan bir başvuru yaz.
  vi: Viết đơn ứng tuyển cho một công việc cụ thể, bằng giọng văn của bạn và dựa trên kinh nghiệm thật.
  id: Tulis lamaran untuk satu pekerjaan tertentu, dengan gaya bahasamu sendiri dan berdasarkan pengalaman nyata.
  pl: Napisz aplikację na konkretne stanowisko, własnym stylem i w oparciu o swoje prawdziwe doświadczenie.
  nl: Schrijf een sollicitatie voor één specifieke vacature, in je eigen stijl en gebaseerd op je echte ervaring.
  ar: اكتب طلبًا لوظيفة محددة بأسلوبك الخاص واستنادًا إلى خبرتك الحقيقية.
  hi: किसी एक खास नौकरी के लिए अपनी शैली में और अपने वास्तविक अनुभव के आधार पर आवेदन लिखें।
  th: เขียนใบสมัครสำหรับงานที่เจาะจง ด้วยน้ำเสียงของคุณเองและจากประสบการณ์จริง
  cs: Napište žádost o konkrétní pracovní místo vlastním stylem a na základě svých skutečných zkušeností.
  sv: Skriv en ansökan för ett specifikt jobb, med din egen röst och utifrån din verkliga erfarenhet.
  he: כתבו מועמדות למשרה מסוימת, בקול שלכם ועל בסיס הניסיון האמיתי שלכם.
  verified_by_human: []
