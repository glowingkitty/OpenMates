create_cv.description:
  context: Focus mode description
  en: Build a clear, machine-readable CV as an editable Word document, or improve the one you have.
  de: Erstelle einen klaren, maschinenlesbaren Lebenslauf als bearbeitbares Word-Dokument oder verbessere deinen bestehenden.
  zh: 创建一份清晰、机器可读的简历，生成可编辑的 Word 文档，或改进你现有的简历。
  es: Crea un CV claro y legible por máquinas como documento de Word editable, o mejora el que ya tienes.
  fr: Créez un CV clair et lisible par les machines sous forme de document Word modifiable, ou améliorez celui que vous avez.
  pt: Crie um currículo claro e legível por máquinas como documento Word editável ou melhore o que você já tem.
  ru: Создайте понятное, машиночитаемое резюме в виде редактируемого документа Word или улучшите уже имеющееся.
  ja: 明確で機械が読み取りやすい履歴書を編集可能なWord文書として作成、または既存のものを改善します。
  ko: 명확하고 기계가 읽기 쉬운 이력서를 편집 가능한 Word 문서로 만들거나 기존 이력서를 개선하세요.
  it: Crea un CV chiaro e leggibile dai software come documento Word modificabile, oppure migliora quello che hai.
  tr: Düzenlenebilir bir Word belgesi olarak açık ve makine tarafından okunabilir bir CV oluştur veya mevcut CV'ni iyileştir.
  vi: Tạo một CV rõ ràng, máy đọc được dưới dạng tài liệu Word có thể chỉnh sửa, hoặc cải thiện CV bạn đang có.
  id: Buat CV yang jelas dan mudah dibaca mesin sebagai dokumen Word yang dapat diedit, atau perbaiki CV yang sudah ada.
  pl: Utwórz przejrzyste, czytelne maszynowo CV jako edytowalny dokument Word albo ulepsz to, które już masz.
  nl: Maak een helder, machineleesbaar cv als bewerkbaar Word-document, of verbeter het cv dat je al hebt.
  ar: أنشئ سيرة ذاتية واضحة وقابلة للقراءة آليًا كمستند Word قابل للتعديل، أو حسّن سيرتك الحالية.
  hi: संपादन योग्य Word दस्तावेज़ के रूप में एक स्पष्ट, मशीन-पठनीय सीवी बनाएं या अपने मौजूदा सीवी को बेहतर करें।
  th: สร้างเรซูเม่ที่ชัดเจนและระบบอ่านได้เป็นเอกสาร Word ที่แก้ไขได้ หรือปรับปรุงฉบับที่คุณมีอยู่
  cs: Vytvořte přehledný, strojově čitelný životopis jako upravitelný dokument Word, nebo vylepšete ten stávající.
  sv: Skapa ett tydligt, maskinläsbart cv som ett redigerbart Word-dokument, eller förbättra det du redan har.
  he: צרו קורות חיים ברורים וקריאים למכונה כמסמך Word שניתן לעריכה, או שפרו את הקיימים.
  verified_by_human: []
