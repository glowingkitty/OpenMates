prepare_interview.description:
  context: Focus mode description
  en: Get ready for a job interview with likely questions, your own stories and a practice run with feedback.
  de: Bereite dich mit wahrscheinlichen Fragen, deinen eigenen Beispielen und einem Probegespräch mit Feedback auf ein Vorstellungsgespräch vor.
  zh: 通过可能被问到的问题、你自己的经历故事和带反馈的模拟练习，为求职面试做好准备。
  es: Prepárate para una entrevista de trabajo con preguntas probables, tus propias historias y una práctica con comentarios.
  fr: Préparez-vous à un entretien d'embauche avec les questions probables, vos propres exemples et un entraînement avec retours.
  pt: Prepare-se para uma entrevista de emprego com perguntas prováveis, suas próprias histórias e um treino com feedback.
  ru: 'Подготовьтесь к собеседованию: вероятные вопросы, ваши собственные примеры и тренировка с обратной связью.'
  ja: 想定される質問、あなた自身のエピソード、フィードバック付きの練習で面接に備えます。
  ko: 예상 질문, 나만의 경험 사례, 피드백이 있는 모의 면접으로 면접을 준비하세요.
  it: Preparati a un colloquio di lavoro con le domande probabili, le tue storie e una simulazione con feedback.
  tr: Olası sorular, kendi hikâyelerin ve geri bildirimli bir prova ile iş görüşmesine hazırlan.
  vi: Sẵn sàng cho buổi phỏng vấn với các câu hỏi dễ gặp, câu chuyện của chính bạn và một buổi luyện tập có nhận xét.
  id: Bersiap untuk wawancara kerja dengan pertanyaan yang mungkin muncul, cerita pengalamanmu, dan latihan dengan umpan balik.
  pl: 'Przygotuj się do rozmowy kwalifikacyjnej: prawdopodobne pytania, własne przykłady i próbna rozmowa z informacją zwrotną.'
  nl: Bereid je voor op een sollicitatiegesprek met waarschijnlijke vragen, je eigen verhalen en een oefenronde met feedback.
  ar: استعد لمقابلة العمل بالأسئلة المتوقعة وقصصك الخاصة وجولة تدريبية مع ملاحظات.
  hi: संभावित सवालों, अपने अनुभवों की कहानियों और फ़ीडबैक के साथ अभ्यास से इंटरव्यू के लिए तैयार हों।
  th: เตรียมพร้อมสำหรับการสัมภาษณ์งานด้วยคำถามที่น่าจะถูกถาม เรื่องราวของคุณเอง และการซ้อมพร้อมคำแนะนำ
  cs: Připravte se na pracovní pohovor s pravděpodobnými otázkami, vlastními příběhy a zkouškou se zpětnou vazbou.
  sv: Förbered dig inför en anställningsintervju med troliga frågor, dina egna exempel och en övning med återkoppling.
  he: התכוננו לראיון עבודה עם שאלות צפויות, הסיפורים שלכם ותרגול עם משוב.
  verified_by_human: []
