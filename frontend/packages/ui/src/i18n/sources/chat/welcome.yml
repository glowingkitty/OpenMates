all_examples_subtitle:
  context: Subtitle for the logged-out all examples replacement view
  en: Pick one to see how the workspace feels in practice.
  de: Wähle einen aus, um das Workspace-Gefühl praktisch zu sehen.
  zh: 选择一个，体验工作区的实际操作感。
  es: Elige uno para ver cómo funciona el espacio de trabajo en la práctica.
  fr: "Choisis-en une pour voir comment l'espace de travail fonctionne en pratique."
  pt: Escolhe uma para veres como o espaço de trabalho funciona na prática.
  ru: Выбери один, чтобы увидеть, как рабочее пространство выглядит на практике.
