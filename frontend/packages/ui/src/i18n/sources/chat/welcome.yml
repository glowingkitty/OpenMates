  ko: 하나를 선택하여 워크스페이스가 실제로 어떻게 작동하는지 확인해 보세요.
  it: "Scegline una per vedere come funziona l'area di lavoro in pratica."
  tr: Çalışma alanının pratikte nasıl hissettirdiğini görmek için birini seç.
  vi: Chọn một ví dụ để xem không gian làm việc hoạt động như thế nào trong thực tế.
