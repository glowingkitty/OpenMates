started:
  context: Chat history system event when this chat started another chat; {title} is the new chat's title
  en: 'Started chat "{title}"'
  de: 'Chat "{title}" gestartet'
  verified_by_human: []
report:
  context: System event when a spawned chat reported back; {title} is the spawned chat's title
  en: 'Report from "{title}"'
  de: 'Bericht aus "{title}"'
  verified_by_human: []
finished:
  context: System event when a spawned chat finished its work; {title} is the spawned chat's title
  en: '"{title}" finished'
  de: '"{title}" ist fertig'
  verified_by_human: []
waiting_for_user:
  context: System event when a spawned chat waits for the user's answer; {title} is the spawned chat's title
  en: '"{title}" is waiting for you'
  de: '"{title}" wartet auf dich'
  verified_by_human: []
user_wrote:
  context: System event when the user wrote in a spawned chat themselves; {title} is the spawned chat's title
  en: 'You wrote in "{title}"'
  de: 'Du hast in "{title}" geschrieben'
  verified_by_human: []
sent:
  context: System event in the creator chat when it wrote a message into a spawned chat; {title} is the spawned chat's title
  en: 'Sent to "{title}"'
  de: 'An "{title}" gesendet'
  verified_by_human: []
reported:
  context: System event in a spawned chat when it reported to its creator chat; {title} is the creator chat's title
  en: 'Reported to "{title}"'
  de: 'An "{title}" berichtet'
  verified_by_human: []
creator_link:
  context: Link at the top of a chat that another chat started; {title} is the starting chat's title
  en: 'Started from {title}'
  de: 'Gestartet aus {title}'
  verified_by_human: []
creator_sent_label:
  context: Small label on a message that another chat sent into this chat; {title} is the sending chat's title
  en: 'From {title}'
  de: 'Von {title}'
  verified_by_human: []
