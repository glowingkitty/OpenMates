sounds.notice_message:
  context: Body of the one-time notice explaining what event sounds are for
  en: A short sound tells you when a message is sent safely, a notification arrives or something fails.
  de: Ein kurzer Ton zeigt dir, wenn eine Nachricht sicher gesendet wurde, eine Benachrichtigung eintrifft oder etwas fehlschlägt.
  zh: 消息安全发送、收到通知或出现错误时，会播放简短提示音。
  fr: Un son bref vous indique qu'un message est bien envoyé, qu'une notification arrive ou qu'une erreur se produit.
  es: Un sonido breve te avisa cuando un mensaje se envía correctamente, llega una notificación o algo falla.
  pt: Um som curto avisa quando uma mensagem é enviada com segurança, chega uma notificação ou algo falha.
  ru: Короткий звук сообщает, что сообщение надёжно отправлено, пришло уведомление или произошла ошибка.
  ja: メッセージが確実に送信されたとき、通知が届いたとき、エラーが起きたときに短い音でお知らせします。
  ko: 메시지가 안전하게 전송되거나 알림이 도착하거나 오류가 발생하면 짧은 소리로 알려 드립니다.
  it: Un breve suono ti avvisa quando un messaggio è inviato correttamente, arriva una notifica o qualcosa non riesce.
  tr: Kısa bir ses, mesaj güvenle gönderildiğinde, bildirim geldiğinde veya bir şey başarısız olduğunda sizi uyarır.
  vi: Một âm thanh ngắn báo cho bạn khi tin nhắn đã gửi an toàn, có thông báo mới hoặc có lỗi xảy ra.
  id: Suara singkat memberi tahu saat pesan terkirim dengan aman, notifikasi tiba, atau terjadi kegagalan.
  pl: Krótki dźwięk informuje, gdy wiadomość została bezpiecznie wysłana, przyszło powiadomienie lub coś się nie powiodło.
  nl: Een kort geluid laat je weten wanneer een bericht veilig is verzonden, een melding binnenkomt of iets mislukt.
  ar: صوت قصير يخبرك عند إرسال الرسالة بأمان أو وصول إشعار أو حدوث خطأ.
  hi: संदेश सुरक्षित रूप से भेजे जाने, सूचना आने या कुछ विफल होने पर एक छोटी ध्वनि बजती है।
  th: เสียงสั้น ๆ จะบอกคุณเมื่อส่งข้อความสำเร็จ มีการแจ้งเตือนเข้ามา หรือเกิดข้อผิดพลาด
  cs: Krátký zvuk vám oznámí, že zpráva byla bezpečně odeslána, přišlo oznámení nebo se něco nepovedlo.
  sv: Ett kort ljud talar om när ett meddelande har skickats säkert, en avisering kommer eller något misslyckas.
  he: צליל קצר מודיע כשהודעה נשלחה בבטחה, כשמגיעה התראה או כשמשהו נכשל.
  verified_by_human: []

