  en: Automatic (browser language)
  de: Automatisch (Browsersprache)
  zh: 自动（浏览器语言）
  es: Automático (idioma del navegador)
  fr: Automatique (langue du navigateur)
  pt: Automático (idioma do navegador)
  ru: Автоматически (язык браузера)
  ja: 自動（ブラウザーの言語）
  ko: 자동 (브라우저 언어)
  it: Automatico (lingua del browser)
  tr: Otomatik (tarayıcı dili)
  vi: Tự động (ngôn ngữ trình duyệt)
  id: Otomatis (bahasa browser)
  pl: Automatycznie (język przeglądarki)
  nl: Automatisch (browsertaal)
  ar: تلقائي (لغة المتصفح)
  hi: स्वचालित (ब्राउज़र की भाषा)
