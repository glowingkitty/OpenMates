kokoro_input_limits:
  context: Experimental English speech frontend limitation; not the full upstream normalization pipeline
  en: Use short, simple English text. Spell out decimals, currency amounts and times in words. Unsupported formats and foreign characters are rejected. This lab does not include the full upstream text normalization pipeline.
  de: Kurzen, einfachen englischen Text verwenden. Dezimalzahlen, Geldbeträge und Uhrzeiten in Worten ausschreiben. Nicht unterstützte Formate und fremdsprachige Zeichen werden abgelehnt. Dieses Labor enthält nicht die vollständige Textnormalisierung des Ursprungsprojekts.
  verified_by_human: []

