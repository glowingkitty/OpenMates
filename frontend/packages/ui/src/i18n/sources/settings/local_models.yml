  context: Kokoro upstream native runtime crashes on iOS and macOS 27, so the test is blocked
  en: Kokoro is currently unavailable on iOS and macOS 27 or later because its upstream runtime can crash. Try another model or an earlier supported OS.
  de: Kokoro ist unter iOS und macOS 27 oder neuer derzeit nicht verfügbar, da die zugrunde liegende Laufzeit abstürzen kann. Ein anderes Modell oder eine frühere unterstützte Betriebssystemversion verwenden.
  verified_by_human: []
