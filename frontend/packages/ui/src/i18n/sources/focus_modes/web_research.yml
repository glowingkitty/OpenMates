    - 初期の子チャットの結果で重要な欠落が判明した場合は、推測するのではなく、その欠落を埋めるための小さな追加のターゲットを絞ったサブチャットを生成してください。単純な事実確認や、既存の証拠が十分な場合には、余分なサブチャットを生成しないでください。
    - ルートとなる深い調査チャットが最終レポートを作成する前に、初期の調査用子チャットが完了した後、別のソース検証用の子チャットのために再び start_sub_chats を使用しなければなりません。その子チャットには、重要な暫定的な主張とそのソースURLを伝えてください。web-search と web-read を使用して基礎となる一次資料を確認し、各主張の証拠状況と正確な裏付けソースを返し、矛盾や裏付けの欠如を指摘するよう指示してください。これは独立した検証段階であり、別の調査の視点ではありません。委任された子チャットは、追加のサブチャットを開始することなく、割り当てられた調査または検証を完了しなければなりません。
