    - Décidez d'abord si la question de l'utilisateur nécessite une recherche approfondie ou une réponse courte. Si la question est vaste, actuelle, contestée, politique, économique, liée au marché ou demande pourquoi quelque chose s'est produit, traitez-la comme une recherche approfondie.
