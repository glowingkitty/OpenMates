description:
  context: Focus mode description
  en: Turn an idea into an approved Specification step by step - scope, requirements, design and acceptance
    Checks - then start a Plan with Tasks.
  de: Mach aus einer Idee Schritt für Schritt eine freigegebene Spezifikation - Umfang, Anforderungen,
    Design und Abnahmeprüfungen - und starte dann einen Plan mit Aufgaben.
  zh: 一步步把想法变成获批的规格说明——范围、需求、设计和验收检查——然后启动带任务的计划。
  es: Convierte una idea en una especificación aprobada paso a paso (alcance, requisitos, diseño y comprobaciones
    de aceptación) y empieza después un plan con tareas.
  fr: Transformez une idée en spécification approuvée, étape par étape (périmètre, exigences, conception
    et vérifications d'acceptation), puis lancez un plan avec des tâches.
  pt: Transforme uma ideia numa especificação aprovada, passo a passo (âmbito, requisitos, design e verificações
    de aceitação), e depois inicie um plano com tarefas.
  ru: Превратите идею в утверждённую спецификацию шаг за шагом - границы, требования, дизайн и приёмочные
    проверки - и затем запустите план с задачами.
  ja: アイデアを、範囲・要件・設計・受け入れチェックまで一歩ずつ進めて承認済みの仕様書にし、その後タスク付きのプランを始めます。
  ko: 아이디어를 범위, 요구 사항, 디자인, 인수 검사까지 단계별로 승인된 명세서로 만들고, 이어서 작업이 포함된 계획을 시작하세요.
  it: Trasforma un'idea in una specifica approvata passo dopo passo (ambito, requisiti, design e verifiche
    di accettazione), poi avvia un piano con attività.
  tr: Bir fikri adım adım onaylı bir spesifikasyona dönüştür - kapsam, gereksinimler, tasarım ve kabul
    kontrolleri - ardından görevleri olan bir plan başlat.
  vi: Biến một ý tưởng thành đặc tả đã được duyệt từng bước - phạm vi, yêu cầu, thiết kế và các kiểm tra
    nghiệm thu - rồi bắt đầu một kế hoạch với các tác vụ.
  id: Ubah ide menjadi spesifikasi yang disetujui langkah demi langkah - lingkup, persyaratan, desain,
    dan pemeriksaan penerimaan - lalu mulai rencana dengan tugas.
  pl: Zamień pomysł w zatwierdzoną specyfikację krok po kroku - zakres, wymagania, projekt i testy akceptacyjne
    - a potem rozpocznij plan z zadaniami.
  nl: Maak van een idee stap voor stap een goedgekeurde specificatie - reikwijdte, vereisten, ontwerp
    en acceptatiecontroles - en start daarna een plan met taken.
  ar: حوّل فكرة إلى مواصفة معتمدة خطوة بخطوة - النطاق والمتطلبات والتصميم وفحوصات القبول - ثم ابدأ خطة
    بمهام.
  hi: किसी विचार को चरण दर चरण स्वीकृत विनिर्देश में बदलें - दायरा, आवश्यकताएँ, डिज़ाइन और स्वीकृति जाँचें
    - फिर कार्यों के साथ एक योजना शुरू करें।
  th: เปลี่ยนไอเดียให้เป็นข้อกำหนดที่ได้รับอนุมัติทีละขั้น - ขอบเขต ข้อกำหนดความต้องการ การออกแบบ และการตรวจสอบเพื่อยอมรับ
    - แล้วเริ่มแผนพร้อมงาน
  cs: Proměňte nápad krok za krokem ve schválenou specifikaci - rozsah, požadavky, návrh a akceptační
    kontroly - a poté zahajte plán s úkoly.
  sv: Gör en idé till en godkänd specifikation steg för steg - omfattning, krav, design och acceptanskontroller
    - och starta sedan en plan med uppgifter.
  he: הפכו רעיון למפרט מאושר צעד אחר צעד - היקף, דרישות, עיצוב ובדיקות קבלה - ואז התחילו תוכנית עם משימות.
  verified_by_human: []
process:
  context: Focus mode steps
  en: '- Starts with your idea: who it is for, what success looks like, and what is in and out of scope


    - Asks one to three short questions at a time, each with a recommendation, and skips what you already
    said


    - Summarizes every step and waits for your confirmation before moving on


    - Keeps a visible list of open assumptions, so nothing is silently decided for you


    - Writes one Specification by default, and proposes linked product, design and technical Specifications
    only for complex projects, if you agree


    - Adds acceptance Checks that prove each requirement, with tests, AI questions or your own confirmation


    - Starts a Plan with Tasks only after you approved the Specification'
  de: '- Beginnt mit deiner Idee: für wen sie ist, woran sich Erfolg misst und was dazugehört und was
    nicht


    - Stellt jeweils ein bis drei kurze Fragen, jede mit einer Empfehlung, und überspringt, was du schon
    gesagt hast


    - Fasst jeden Schritt zusammen und wartet auf deine Bestätigung, bevor es weitergeht


    - Führt eine sichtbare Liste offener Annahmen, damit nichts stillschweigend für dich entschieden wird


    - Schreibt standardmäßig eine Spezifikation und schlägt verknüpfte Produkt-, Design- und Technik-Spezifikationen
    nur bei komplexen Projekten vor, wenn du zustimmst


    - Ergänzt Abnahmeprüfungen, die jede Anforderung belegen, mit Tests, KI-Fragen oder deiner eigenen
    Bestätigung


    - Startet einen Plan mit Aufgaben erst, nachdem du die Spezifikation freigegeben hast'
  zh: '- 从你的想法开始：面向谁、成功是什么样子、哪些在范围内、哪些不在


    - 每次提出一到三个简短问题，每个都附带建议，并跳过你已经说过的内容


    - 每一步都会做总结，并在继续之前等待你的确认


    - 维护一份可见的待确认假设清单，不会悄悄替你做决定


    - 默认撰写一份规格说明，只有在项目复杂且你同意时，才会建议拆分为相互关联的产品、设计和技术规格说明


    - 添加能证明每条需求的验收检查，方式包括测试、AI 提问或你自己的确认


    - 只有在你批准规格说明之后，才会启动带任务的计划'
  es: '- Parte de tu idea: para quién es, qué aspecto tiene el éxito y qué entra y qué no entra en el
    alcance


    - Hace de una a tres preguntas breves cada vez, cada una con una recomendación, y se salta lo que
    ya dijiste


    - Resume cada paso y espera tu confirmación antes de continuar


    - Mantiene una lista visible de supuestos abiertos, para que nada se decida en silencio por ti


    - Redacta una especificación por defecto y propone especificaciones vinculadas de producto, diseño
    y técnica solo en proyectos complejos, si estás de acuerdo


    - Añade comprobaciones de aceptación que demuestran cada requisito, con pruebas, preguntas a la IA
    o tu propia confirmación


    - Inicia un plan con tareas solo después de que hayas aprobado la especificación'
  fr: '- Part de votre idée : pour qui elle est, à quoi ressemble le succès, ce qui est dans le périmètre
    et ce qui n''y est pas


    - Pose une à trois questions courtes à la fois, chacune avec une recommandation, et saute ce que vous
    avez déjà dit


    - Résume chaque étape et attend votre confirmation avant de continuer


    - Tient une liste visible d''hypothèses ouvertes, pour que rien ne soit décidé à votre place en silence


    - Rédige une seule spécification par défaut, et ne propose des spécifications liées produit, conception
    et technique que pour les projets complexes, si vous êtes d''accord


    - Ajoute des vérifications d''acceptation qui prouvent chaque exigence, avec des tests, des questions
    à l''IA ou votre propre confirmation


    - Ne lance un plan avec des tâches qu''après votre approbation de la spécification'
  pt: '- Começa pela sua ideia: para quem é, como é o sucesso e o que está dentro e fora do âmbito


    - Faz de uma a três perguntas curtas de cada vez, cada uma com uma recomendação, e salta o que já
    disse


    - Resume cada passo e espera pela sua confirmação antes de avançar


    - Mantém uma lista visível de pressupostos em aberto, para que nada seja decidido em silêncio por
    si


    - Redige uma especificação por predefinição e só propõe especificações ligadas de produto, design
    e técnica em projetos complexos, se concordar


    - Acrescenta verificações de aceitação que comprovam cada requisito, com testes, perguntas à IA ou
    a sua própria confirmação


    - Só inicia um plano com tarefas depois de aprovar a especificação'
  ru: '- Начинает с вашей идеи: для кого она, как выглядит успех, что входит в объём, а что нет


    - Задаёт от одного до трёх коротких вопросов за раз, каждый с рекомендацией, и пропускает то, что
    вы уже сказали


    - Подводит итог каждого шага и ждёт вашего подтверждения, прежде чем идти дальше


    - Ведёт видимый список открытых допущений, чтобы ничего не решалось за вас молча


    - По умолчанию пишет одну спецификацию и предлагает связанные продуктовую, дизайнерскую и техническую
    спецификации только для сложных проектов, если вы согласны


    - Добавляет приёмочные проверки, доказывающие каждое требование: тесты, вопросы к ИИ или ваше собственное
    подтверждение


    - Запускает план с задачами только после того, как вы утвердили спецификацию'
  ja: '- あなたのアイデアから始めます：誰のためか、成功とは何か、範囲に含めるものと含めないもの


    - 一度に1〜3個の短い質問を、それぞれ推奨付きで尋ね、すでに話した内容は飛ばします


    - 各ステップを要約し、先へ進む前にあなたの確認を待ちます


    - 未確認の前提を見える形で一覧にし、あなたに代わって黙って決めることがないようにします


    - 既定では仕様書を1つ作成し、複雑なプロジェクトの場合に限り、同意があれば、プロダクト・デザイン・技術の関連仕様書を提案します


    - 各要件を裏付ける受け入れチェックを、テスト、AIへの質問、またはあなた自身の確認で追加します


    - 仕様書を承認してもらってから、タスク付きのプランを開始します'
  ko: '- 당신의 아이디어에서 시작합니다: 누구를 위한 것인지, 성공이 어떤 모습인지, 무엇이 범위 안이고 밖인지


    - 한 번에 한 개에서 세 개의 짧은 질문을 각각 추천과 함께 하며, 이미 말한 내용은 건너뜁니다


    - 각 단계를 요약하고 다음으로 넘어가기 전에 당신의 확인을 기다립니다


    - 열린 가정을 눈에 보이는 목록으로 관리해, 아무것도 몰래 대신 결정되지 않게 합니다


    - 기본적으로 명세서 하나를 작성하며, 복잡한 프로젝트에서만 동의하시면 제품·디자인·기술 연결 명세서를 제안합니다


    - 각 요구 사항을 입증하는 인수 검사를 테스트, AI 질문 또는 직접 확인으로 추가합니다


    - 명세서를 승인한 뒤에야 작업이 포함된 계획을 시작합니다'
  it: '- Parte dalla tua idea: per chi è, come appare il successo e cosa rientra e cosa no nell''ambito


    - Fa da una a tre domande brevi alla volta, ognuna con un consiglio, e salta ciò che hai già detto


    - Riassume ogni passo e aspetta la tua conferma prima di proseguire


    - Tiene un elenco visibile di ipotesi aperte, così nulla viene deciso in silenzio al posto tuo


    - Scrive una sola specifica per impostazione predefinita e propone specifiche collegate di prodotto,
    design e tecniche solo per progetti complessi, se sei d''accordo


    - Aggiunge verifiche di accettazione che dimostrano ogni requisito, con test, domande all''IA o la
    tua conferma


    - Avvia un piano con attività solo dopo che hai approvato la specifica'
  tr: '- Fikrinle başlar: kimin için olduğu, başarının nasıl göründüğü ve neyin kapsam içinde, neyin dışında
    olduğu


    - Her seferinde bir ila üç kısa soru sorar, her biri bir öneriyle gelir ve zaten söylediklerini atlar


    - Her adımı özetler ve devam etmeden önce onayını bekler


    - Açık varsayımların görünür bir listesini tutar, böylece hiçbir şey senin yerine sessizce kararlaştırılmaz


    - Varsayılan olarak tek bir spesifikasyon yazar; bağlantılı ürün, tasarım ve teknik spesifikasyonları
    yalnızca karmaşık projelerde, sen kabul edersen önerir


    - Her gereksinimi kanıtlayan kabul kontrolleri ekler: testler, yapay zekâ soruları veya kendi onayın


    - Spesifikasyonu onayladıktan sonra görevleri olan bir plan başlatır'
  vi: '- Bắt đầu từ ý tưởng của bạn: dành cho ai, thành công trông như thế nào, điều gì nằm trong và ngoài
    phạm vi


    - Mỗi lần hỏi một đến ba câu ngắn, kèm đề xuất cho từng câu, và bỏ qua những gì bạn đã nói


    - Tóm tắt từng bước và chờ bạn xác nhận trước khi đi tiếp


    - Giữ một danh sách giả định còn mở luôn hiển thị, để không có gì bị quyết định thay bạn một cách
    âm thầm


    - Mặc định viết một đặc tả, và chỉ đề xuất các đặc tả liên kết về sản phẩm, thiết kế và kỹ thuật cho
    dự án phức tạp, nếu bạn đồng ý


    - Thêm các kiểm tra nghiệm thu chứng minh từng yêu cầu, bằng kiểm thử, câu hỏi cho AI hoặc xác nhận
    của chính bạn


    - Chỉ bắt đầu kế hoạch với các tác vụ sau khi bạn đã duyệt đặc tả'
  id: '- Dimulai dari ide Anda: untuk siapa, seperti apa keberhasilan itu, dan apa yang termasuk serta
    tidak termasuk dalam lingkup


    - Mengajukan satu sampai tiga pertanyaan singkat sekaligus, masing-masing dengan rekomendasi, dan
    melewati hal yang sudah Anda sampaikan


    - Merangkum setiap langkah dan menunggu konfirmasi Anda sebelum lanjut


    - Menjaga daftar asumsi terbuka yang terlihat, sehingga tidak ada yang diputuskan diam-diam untuk
    Anda


    - Secara default menulis satu spesifikasi, dan hanya mengusulkan spesifikasi terkait untuk produk,
    desain, dan teknis pada proyek yang kompleks, jika Anda setuju


    - Menambahkan pemeriksaan penerimaan yang membuktikan setiap persyaratan, dengan tes, pertanyaan AI,
    atau konfirmasi Anda sendiri


    - Memulai rencana dengan tugas hanya setelah Anda menyetujui spesifikasi'
  pl: '- Zaczyna od Twojego pomysłu: dla kogo jest, jak wygląda sukces oraz co wchodzi w zakres, a co
    nie


    - Zadaje od jednego do trzech krótkich pytań naraz, każde z rekomendacją, i pomija to, co już powiedziałeś


    - Podsumowuje każdy krok i czeka na Twoje potwierdzenie, zanim ruszy dalej


    - Prowadzi widoczną listę otwartych założeń, żeby nic nie było rozstrzygane za Ciebie po cichu


    - Domyślnie pisze jedną specyfikację, a powiązane specyfikacje produktową, projektową i techniczną
    proponuje tylko przy złożonych projektach, jeśli się zgodzisz


    - Dodaje sprawdzenia akceptacyjne, które dowodzą każdego wymagania, za pomocą testów, pytań do AI
    lub Twojego własnego potwierdzenia


    - Rozpoczyna plan z zadaniami dopiero po tym, jak zatwierdzisz specyfikację'
  nl: '- Begint bij jouw idee: voor wie het is, hoe succes eruitziet en wat wel en niet binnen de reikwijdte
    valt


    - Stelt telkens een tot drie korte vragen, elk met een aanbeveling, en slaat over wat je al hebt gezegd


    - Vat elke stap samen en wacht op jouw bevestiging voordat het verdergaat


    - Houdt een zichtbare lijst met open aannames bij, zodat er niets stilzwijgend voor jou wordt beslist


    - Schrijft standaard één specificatie en stelt alleen bij complexe projecten gekoppelde product-,
    ontwerp- en technische specificaties voor, als jij het eens bent


    - Voegt acceptatiecontroles toe die elke vereiste bewijzen, met tests, AI-vragen of je eigen bevestiging


    - Start pas een plan met taken nadat je de specificatie hebt goedgekeurd'
  ar: '- يبدأ من فكرتك: لمن هي، وكيف يبدو النجاح، وما الذي يدخل في النطاق وما الذي يخرج عنه


    - يطرح من سؤال إلى ثلاثة أسئلة قصيرة في كل مرة، ولكل سؤال توصية، ويتخطى ما قلته بالفعل


    - يلخّص كل خطوة وينتظر تأكيدك قبل المتابعة


    - يحتفظ بقائمة مرئية بالافتراضات المفتوحة، فلا يُقرَّر شيء بصمت نيابةً عنك


    - يكتب مواصفة واحدة افتراضيًا، ولا يقترح مواصفات مرتبطة للمنتج والتصميم والجانب التقني إلا للمشاريع
    المعقدة، إذا وافقت


    - يضيف فحوصات قبول تثبت كل متطلب، باختبارات أو أسئلة للذكاء الاصطناعي أو بتأكيدك أنت


    - يبدأ خطة بمهام فقط بعد أن تعتمد المواصفة'
  hi: '- आपके विचार से शुरू करता है: यह किसके लिए है, सफलता कैसी दिखती है, और क्या दायरे में है और क्या
    बाहर


    - एक बार में एक से तीन छोटे प्रश्न पूछता है, हर एक सुझाव के साथ, और जो आप पहले बता चुके हैं उसे छोड़
    देता है


    - हर चरण का सार देता है और आगे बढ़ने से पहले आपकी पुष्टि की प्रतीक्षा करता है


    - खुली धारणाओं की एक दिखने वाली सूची रखता है, ताकि आपके लिए कुछ भी चुपचाप तय न हो


    - डिफ़ॉल्ट रूप से एक विनिर्देश लिखता है, और जुड़े हुए उत्पाद, डिज़ाइन और तकनीकी विनिर्देश केवल जटिल
    परियोजनाओं के लिए सुझाता है, यदि आप सहमत हों


    - हर आवश्यकता को सिद्ध करने वाली स्वीकृति जाँचें जोड़ता है, परीक्षणों, AI प्रश्नों या आपकी अपनी पुष्टि
    के साथ


    - कार्यों के साथ योजना तभी शुरू करता है जब आप विनिर्देश स्वीकृत कर दें'
  th: '- เริ่มจากไอเดียของคุณ: ทำเพื่อใคร ความสำเร็จหน้าตาเป็นอย่างไร และอะไรอยู่ในขอบเขตหรือนอกขอบเขต


    - ถามคำถามสั้น ๆ หนึ่งถึงสามข้อต่อครั้ง พร้อมคำแนะนำในแต่ละข้อ และข้ามสิ่งที่คุณบอกไปแล้ว


    - สรุปทุกขั้นและรอการยืนยันจากคุณก่อนไปต่อ


    - เก็บรายการสมมติฐานที่ยังเปิดอยู่ให้มองเห็นได้ เพื่อไม่ให้มีอะไรถูกตัดสินใจแทนคุณอย่างเงียบ ๆ


    - โดยค่าเริ่มต้นจะเขียนข้อกำหนดหนึ่งฉบับ และเสนอข้อกำหนดที่เชื่อมโยงกันด้านผลิตภัณฑ์ การออกแบบ และเทคนิคเฉพาะโปรเจกต์ที่ซับซ้อน
    หากคุณเห็นด้วย


    - เพิ่มการตรวจสอบเพื่อยอมรับที่พิสูจน์ทุกข้อกำหนดความต้องการ ด้วยการทดสอบ คำถามให้ AI หรือการยืนยันของคุณเอง


    - เริ่มแผนพร้อมงานก็ต่อเมื่อคุณอนุมัติข้อกำหนดแล้วเท่านั้น'
  cs: '- Začíná vaším nápadem: pro koho je, jak vypadá úspěch a co spadá do rozsahu a co ne


    - Klade jednu až tři krátké otázky najednou, každou s doporučením, a přeskakuje, co jste už řekli


    - Shrne každý krok a před pokračováním čeká na vaše potvrzení


    - Vede viditelný seznam otevřených předpokladů, aby se nic nerozhodovalo potichu za vás


    - Ve výchozím stavu píše jednu specifikaci a propojené produktové, designové a technické specifikace
    navrhuje jen u složitých projektů, pokud s tím souhlasíte


    - Přidává akceptační kontroly, které dokazují každý požadavek, pomocí testů, dotazů na AI nebo vašeho
    vlastního potvrzení


    - Plán s úkoly zahájí až poté, co specifikaci schválíte'
  sv: '- Börjar med din idé: vem den är till för, hur framgång ser ut och vad som ingår och inte ingår


    - Ställer en till tre korta frågor åt gången, var och en med en rekommendation, och hoppar över det
    du redan sagt


    - Sammanfattar varje steg och väntar på din bekräftelse innan det går vidare


    - För en synlig lista över öppna antaganden, så att inget avgörs tyst åt dig


    - Skriver en specifikation som standard och föreslår länkade produkt-, design- och tekniska specifikationer
    bara för komplexa projekt, om du håller med


    - Lägger till acceptanskontroller som bevisar varje krav, med tester, AI-frågor eller din egen bekräftelse


    - Startar en plan med uppgifter först när du har godkänt specifikationen'
  he: '- מתחיל מהרעיון שלך: למי הוא מיועד, איך נראית הצלחה, ומה בתוך ההיקף ומה מחוצה לו


    - שואל שאלה אחת עד שלוש קצרות בכל פעם, כל אחת עם המלצה, ומדלג על מה שכבר אמרת


    - מסכם כל שלב וממתין לאישור שלך לפני שממשיכים


    - מנהל רשימה גלויה של הנחות פתוחות, כך שדבר לא מוכרע בשקט במקומך


    - כותב כברירת מחדל מפרט אחד, ומציע מפרטי מוצר, עיצוב וטכנולוגיה מקושרים רק לפרויקטים מורכבים, אם תסכים


    - מוסיף בדיקות קבלה שמוכיחות כל דרישה, באמצעות בדיקות, שאלות ל-AI או האישור שלך


    - מתחיל תוכנית עם משימות רק אחרי שאישרת את המפרט'
  verified_by_human: []
