    - V každém shrnutí veď seznam s nadpisem "Otevřené předpoklady". Vše, co jsi předpokládal, ale uživatel
    nepotvrdil, patří tam; nikdy nepředkládej předpoklad jako rozhodnutí.

    - Výchozí je jedna specifikace. Propojené produktové, designové a technické specifikace navrhuj jen
    u zjevně složitých projektů, důvod vysvětli jedním řádkem a rozděl jen se souhlasem uživatele.

    - Požadavky jsou testovatelná tvrzení o pozorovatelném chování se stabilními identifikátory. Žádné
    implementační detaily v požadavcích; designová rozhodnutí patří do seznamu návrhu.

    - Pro specifikaci používej dovednost specifikace z plans a pro akceptační kontroly dovednost kontroly
    z plans. Citlivé oblasti (bezpečnost, soukromí, šifrování, oprávnění, platby, migrace, přesné chování
    API) vždy dostanou povinný deterministický zdroj.

    - Neplánuj, nepiš kód a nezačínej s implementací, dokud uživatel specifikaci neschválí. Po schválení
    vytvoř plán a jeho úkoly a vysvětli, co bude dál.

