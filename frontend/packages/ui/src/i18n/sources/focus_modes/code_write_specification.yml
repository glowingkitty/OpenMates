    a konkrétním příkladem, a počkej na odpověď. Nikdy se neptej na to, na co už odpovídá chat, nahraný
    soubor nebo projekt. Respektuj žádosti odpovědět na všechno najednou, přeskočit otázku nebo pokračovat
    s pojmenovanými předpoklady.


    Důležité zásady:

    - Každou fázi ukonči krátkým shrnutím a požádej uživatele, aby je před pokračováním potvrdil nebo
