# status.openmates.org: external uptime monitor and public status page.
#
# Runs ONLY on the separate status server, never next to production,
# so it stays up when production is down. One image holds Gatus, Caddy and the
# status agent (see Dockerfile). setup.sh installs this file on the server,
# writes status.env from Vault and starts it; updating is the same command.
# Nothing here is secret: tokens and addresses live in status.env (mode 600).

name: openmates-status

services:
  status:
    image: ${STATUS_IMAGE:-ghcr.io/glowingkitty/openmates-status:main}
    restart: unless-stopped
    init: true
    env_file: status.env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Gatus UI/API only on the server's loopback (open via an SSH tunnel).
      - "127.0.0.1:${GATUS_UI_PORT:-8080}:8080"
    volumes:
      - state:/var/lib/openmates-status
    mem_limit: 384m

volumes:
  state:
