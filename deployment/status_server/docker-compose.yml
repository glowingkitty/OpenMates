# status.openmates.org: external uptime monitor and public status page.
#
# Runs on one small VPS outside our own infrastructure (see README.md).
# - gatus: plain HTTP checks + result storage (internal only, never published)
# - agent: real chat/skill probes, escalating alerts, public status data
# - caddy: TLS and the static public page plus /data/status.json
# Secrets come from .env, written by `scripts/status_server.py deploy` from Vault.

name: openmates-status

services:
  gatus:
    image: twinproduction/gatus:v5.38.0
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      GATUS_EXTERNAL_TOKEN: ${GATUS_EXTERNAL_TOKEN:?set by scripts/status_server.py}
      AI_WORKER_CHECK_ENABLED: ${AI_WORKER_CHECK_ENABLED:-false}
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    # Gatus UI/API only on the server's loopback (open via an SSH tunnel).
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 128m

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on: [gatus]
    env_file: .env
    environment:
      GATUS_URL: http://gatus:8080
      STATE_DIR: /var/lib/status-agent
      PUBLIC_DATA_DIR: /srv/data
    volumes:
      - agent-state:/var/lib/status-agent
      - public-data:/srv/data
    mem_limit: 160m

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      STATUS_DOMAIN: ${STATUS_DOMAIN:-status.openmates.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - public-data:/srv/data:ro
      - caddy-data:/data
    mem_limit: 96m

volumes:
  gatus-data:
  agent-state:
  public-data:
  caddy-data:
